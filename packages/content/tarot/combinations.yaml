    body: 你可以让难过有表达也有支持。宝剑三（以穿心之剑呈现受伤感受的牌）与圣杯三（以举杯聚会呈现支持的牌）同现，适合区分个人失落与可以获得的陪伴，不能据此推断他人的行为。组合（两张特定牌同时出现的主题提示）不替代它们各自的牌位与正逆位读法。例如，不舒服的交流之后，向可信任的朋友说明需要倾听还是安静陪伴。建议把自己的期待、可用资源和仍不清楚的地方分别写下；如果其中一项暂时无法核实，就保留这份不确定，先做另一个能够得到回应的小步骤。
