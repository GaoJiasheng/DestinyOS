    body: 你可以让协作反馈进入持续练习。星币三（以共同施工象征分工的牌）与星币八（以加工星币象征练习的牌）同现，适合让具体反馈帮助改进技术，不把忙碌数量当成学习效果。组合（两张特定牌同时出现的主题提示）不替代它们各自的牌位与正逆位读法。例如，完成一份小作品后，请伙伴指出一个细节，下一次只针对它练习。你可以与最相关的另一张牌比较，但不必让所有细节都讲成同一个故事；先辨认相同之处与差异，再挑出最值得在现实中问清楚的一件事。
    advice:
      - 围绕“让协作反馈进入持续练习”，选一件具体事项记录前后变化。
    do:
      - 记录事实
    dont:
      - 仓促定论
  en:
    title: 'Two themes: three pentacles eight pentacles'
    summary: You can let collaboration improve practice.
    body:
      You can let collaboration improve practice. The Three of Pentacles coordinates skills and the
      Eight of Pentacles focuses on repeated craft. After making a small piece, ask a collaborator
      to identify one detail worth refining. The next exercise can address that point specifically,
      so practice develops through feedback rather than through counting how many hours you remained
      busy. A craftsperson works inside an arch while two figures consult a plan. A seated
      craftsperson shapes a pentacle beside a vertical row of finished pieces. Try asking for
      feedback on the detail you intend to practise, so the response is usable in the next attempt.
      Compare versions afterwards. A collaborator's observation can give repetition direction
      without making approval the only measure of learning.
    advice:
      - Use the theme to ask one specific question, then note what the response changes.
