      - 仓促定论
  en:
    title: 'Two themes: three swords three cups'
    summary: You can make room for hurt and for support without confusing them.
    body:
      You can make room for hurt and for support without confusing them. The Three of Swords gives a
      picture of emotional pain, and the Three of Cups presents shared encouragement. Their
      appearance does not establish anyone's behaviour. After a difficult exchange, you might tell a
      trusted friend whether you want listening, quiet company or help arranging a next
      conversation. Three swords cross a red heart against clouds and rain. Three figures raise cups
      together amid fruit and flowers. Consider asking a friend for the particular kind of company
      you want. Listening, practical help and distraction are different offers. Naming the need
      makes support easier to accept without requiring you to explain every detail immediately. You
      can keep a brief note to compare with what happens after the conversation or trial.
