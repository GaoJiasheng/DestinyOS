  zh:
    title: 让价值选择落在相互回应上
    summary: 你可以让价值选择落在相互回应上。
    body: 你可以让价值选择落在相互回应上。恋人牌关注选择与价值，圣杯二（以互相举杯象征交流的牌）补充互惠；两张同现，适合比较说出的重视与相处中的回应，而不是直接推断关系形式。组合（两张特定牌同时出现的主题提示）不替代它们各自的牌位与正逆位读法。例如，讨论合作时，分别说出各自愿意投入的条件。不妨选取画面中一个最接近当前经验的细节，用它提出温和的问题；接着观察一次实际回应，把新的消息记下来，再判断是否需要改变原来的理解。
    advice:
      - 围绕“让价值选择落在相互回应上”，选一件具体事项记录前后变化。
    do:
      - 记录事实
    dont:
      - 仓促定论
  en:
    title: 'Two themes: lovers two cups'
    summary: You can connect a values based choice with mutual response.
    body:
      You can connect a values based choice with mutual response. The Lovers asks what matters in a
      decision, while the Two of Cups pictures an exchange. Together they invite a comparison
      between stated priorities and actual interaction. Before agreeing to collaborate, name what
      each person can willingly offer, without assigning the connection a predetermined form. Two
      figures stand beneath an angel with a mountain and two contrasting trees behind them. Two
      figures exchange cups beneath a winged lion head and entwined staff. Try asking which value
      has already appeared in an ordinary exchange. A clear example of listening or support makes
      the discussion more grounded than a general statement about compatibility. Let each person
      supply their own account. You can keep a brief note to compare with what happens after the
      conversation or trial.
    advice:
      - Use the theme to ask one specific question, then note what the response changes.
    do:
      - Record observations
    dont:
      - Rush conclusions
