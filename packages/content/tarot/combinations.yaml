      - 仓促定论
  en:
    title: 'Two themes: tower transition'
    summary: You can distinguish immediate disruption from the closure of a longer phase.
    body: 'You can distinguish immediate disruption from the closure of a longer phase. The Tower
      challenges a familiar structure and the transformation card concerns letting a finished
      pattern end. Together they support two different tasks: stabilising essentials and deciding
      what no longer needs to continue. A cancelled project may need handover first, followed by
      reflection on useful learning. Lightning strikes a tall tower as its crown falls and figures
      move away from it. An armoured skeletal rider carries a black flag with a white flower toward
