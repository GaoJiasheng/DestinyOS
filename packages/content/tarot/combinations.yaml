  en:
    title: 'Two themes: five cups six cups'
    summary: You can acknowledge disappointment while keeping what was useful in an earlier experience.
    body:
      You can acknowledge disappointment while keeping what was useful in an earlier experience. The
      Five of Cups notices loss and the Six of Cups recalls familiar generosity. When an old
      activity ends, one comforting habit may still fit your present needs. Keeping it is different
      from demanding that the whole experience return in exactly the same form. A cloaked figure
      faces three spilled cups while two remain upright near a bridge. One figure offers a flower
      filled cup to another in a sheltered courtyard. Consider naming which part of the old activity
      felt supportive. Perhaps a short conversation or a familiar preparation ritual can fit
      elsewhere. Keep the useful part at an appropriate scale while allowing the ended arrangement
      to remain ended.
