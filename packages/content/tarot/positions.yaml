    summary: You can identify the need both options are meant to address.
    body: You can identify the need both options are meant to address. The situation position in a
      decision spread establishes a common frame so that comparison uses the same standard. Two
      appealing courses may serve different purposes; deciding whether you need foundations or
      practice comes before ranking them. Try completing the sentence “I want this option to help me
      with…” before evaluating either route. Then name a sign that the need is being met. A
      foundation course and a practice group may both be good, yet address different gaps. Keeping
      your original purpose visible makes that difference easier to assess. The central image can
      prompt a question about purpose without deciding which available course actually supplies what
