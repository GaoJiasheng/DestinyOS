  zh:
    title: 行动：选择自己能承担的一步
    summary: 你可以选择自己能承担的一步。
    body: 你可以选择自己能承担的一步。牌位（这张牌承担的观察角度）让同一个画面在不同位置回答不同问题。行动位讨论你可以调整的做法；它不替别人作决定，也不要求为了配合牌义而增加过多任务。例如，如果讨论常被打断，你可以先发一份简短议程，而不是要求所有人立刻改变。建议先写出一个已经知道的事实和一个仍待确认的条件，再读这张牌的正逆位与类别内容；如果图像暂时没有共鸣，可以保留问题而不强行套用。留意后续事实比寻找单一对应更有帮助，也可以把未确认的信息留给下一次实际交流。
    advice:
      - 围绕“行动：选择自己能承担的一步”，选一件具体事项记录前后变化。
    do:
      - 记录事实
    dont:
      - 仓促定论
  en:
    title: 'Action: read the role first'
    summary: You can choose a response within your own responsibility.
    body:
      You can choose a response within your own responsibility. The action position concerns what
      you could change, rather than decisions assigned to someone else. If a discussion keeps losing
      focus, a short agenda is a practical experiment. You need not demand that everyone adopt a new
      personality. Try making the agenda brief enough that people can respond to it. One question, a
      proposed order and a finishing time may be sufficient. Notice whether the discussion changes
      after that adjustment; if it does not, ask what else participants need. The card can suggest
      an approach, but a useful action has limits. Choose a change you can carry out and evaluate
      without making other people's behaviour your responsibility. You can review the note after an
      ordinary experience gives you more information.
    advice:
      - Use the theme to ask one specific question, then note what the response changes.
    do:
      - Record observations
    dont:
      - Rush conclusions
  meta:
    author: t23-tarot-editorial-v1
    reviewed_by: null
    version: 1
    status: published
