      - 记录事实
    dont:
      - 仓促定论
  en:
    title: 'Connection: read the role first'
    summary: You can examine a rhythm created between people.
    body:
      You can examine a rhythm created between people. The connection position looks at exchanges
      and shared arrangements, distinct from either person’s individual role. When both want to meet
      but plans rarely settle, the process between an invitation and a confirmation may be the
      useful place to look. Try following one recent invitation from its beginning to its last
      message. Where did a response become ambiguous? Perhaps each person thought the other would
      confirm. A simple check about that moment may make the next plan easier. Keep the focus on an
      exchange you both participated in, rather than building a story about one person's character.
      Shared rhythms can often be understood through small agreements that neither participant had
      previously stated. You can review the note after an ordinary experience gives you more
      information.
