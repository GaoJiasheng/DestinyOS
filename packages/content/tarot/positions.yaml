    summary: 你可以重新检查合作中的分工。
    body: 你可以用第八个月的记录，重新看清共同事务里没有明说的职责。年度月份位（把主题分段观察的位置）提供复盘机会，不说明这个月会出现某类人物或特定变化。合作中有些任务由习惯承担，因此画面提示可以帮助你询问实际分工，却不能替任何人宣布动机。例如，一件物品从使用到归位经过几个人，最后的整理可能始终落在一个人身上。不妨沿着一次真实流程写出每次交接，再询问参与者是否愿意调整。把缺少的说明补成简短约定，下一次使用后再看有没有改善，让年度学习来自共同回应而不只是原先的想象。
    advice:
