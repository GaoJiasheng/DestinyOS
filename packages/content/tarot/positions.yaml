    body: 你可以用阶段记录调整节奏。牌位（这张牌承担的观察角度）让同一个画面在不同位置回答不同问题。这个月的牌位把年度主题放进第6段观察窗口；它不绑定具体事件或节气，重点在你怎样安排当期的注意力。例如，比较此前几周的投入与体验，给后续安排留出弹性。建议把自己的期待、可用资源和仍不清楚的地方分别写下；如果其中一项暂时无法核实，就保留这份不确定，先做另一个能够得到回应的小步骤。留意后续事实比寻找单一对应更有帮助，也可以把未确认的信息留给下一次实际交流。
    advice:
      - 围绕“06月：用阶段记录调整节奏”，选一件具体事项记录前后变化。
