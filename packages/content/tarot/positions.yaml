    summary: 你可以给学习方向一次具体复盘。
    body: 你可以在第九段年度观察中，挑一项已有经验继续练习。月度牌位（年度主题的复盘窗口）不是考试排名，也不把学习成果限定在某个日期；你仍可以依据精力与反馈决定练习方向。这里的重点是分辨哪些经验适合当前需要，哪些只是当时条件下的方法。比如回看几次制作笔记，发现说明经常不够清楚，就可以安排一份只练习表达的小作品。建议先说明自己希望改善的具体细节，再向能看懂任务的人取得一条反馈；几次尝试后比较记录，而不靠换一个远大目标证明进步。持续学习也可以保持小范围，让注意力落在能够观察的变化上。
    advice:
      - 围绕“09月：给学习方向一次具体复盘”，选一件具体事项记录前后变化。
    do:
      - 记录事实
    dont:
      - 仓促定论
  en:
    title: 'Month 9: read the role first'
    summary: You can review the direction of your learning.
    body:
      You can review the direction of your learning. Notes from earlier practice may point to one
      detail worth developing, without requiring an entirely new goal. Month 9 is a review window
      within the spread, not a date assigned to an event. Compare it with the central theme while
      keeping room for what actually happens. Try choosing the detail because it helps your current
      aim, rather than because it seems impressive. Look for a practice task that isolates it and
      feedback you can obtain without much extra preparation. A small improvement recorded over
      several attempts may tell you more than a complete change of course. The month provides an
      occasion to review learning, while your notes supply the evidence for where to focus next.
    advice:
      - Use the theme to ask one specific question, then note what the response changes.
    do:
