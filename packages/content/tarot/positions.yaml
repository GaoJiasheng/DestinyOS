    all:
      - path: spread
        eq: three_ppf
      - path: cards[position=future].position
        eq: future
  weight: 60
  polarity: neutral
  tags:
    - plain
    - tarot.reflection
    - tarot.action
    - tarot.choice
  exclusive_with: []
  zh:
    title: 未来：把趋势当成可以调整的方向
    summary: 你可以把趋势当成可以调整的方向。
    body: 你可以把趋势当成可以调整的方向。牌位（这张牌承担的观察角度）让同一个画面在不同位置回答不同问题。未来位描绘当前条件延续时值得留意的走向；它不设定事件日期，也保留行动和外界变化带来的差异。例如，你准备继续一种学习方法时，可以安排两周后的复盘，而不是预先认定效果。建议把自己的期待、可用资源和仍不清楚的地方分别写下；如果其中一项暂时无法核实，就保留这份不确定，先做另一个能够得到回应的小步骤。留意后续事实比寻找单一对应更有帮助，也可以把未确认的信息留给下一次实际交流。
    advice:
      - 围绕“未来：把趋势当成可以调整的方向”，选一件具体事项记录前后变化。
    do:
      - 记录事实
    dont:
      - 仓促定论
  en:
    title: 'Future: read the role first'
    summary: You can treat the future position as a direction to review, not an appointment with an event.
    body:
      'You can treat the future position as a direction to review, not an appointment with an event.
      It explores what may deserve attention if present conditions continue. A study method, for
      example, can be tested over two weeks with a planned review rather than accepted as an
      inevitable result. Consider deciding what you will record during the trial: perhaps whether
      the routine fits your available time and helps you remain interested. At the review point,
      look at those notes before choosing whether to continue. The image may help you imagine a
      direction, but your observations show what that direction asks in practice. You can shorten,
      expand or stop the experiment as your needs and the conditions around you change. You can
      review the note after an ordinary experience gives you more information.'
    advice:
      - Use the theme to ask one specific question, then note what the response changes.
    do:
      - Record observations
    dont:
      - Rush conclusions
  meta:
    author: t23-tarot-editorial-v1
    reviewed_by: null
    version: 1
    status: published
