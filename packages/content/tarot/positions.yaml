  zh:
    title: 现在：把十字中心读成当前焦点
    summary: 你可以把十字中心读成当前焦点。
    body: 你可以把十字中心读成当前焦点。牌位（这张牌承担的观察角度）让同一个画面在不同位置回答不同问题。现状位是这次凯尔特十字的中心问题；其他牌位为它补充背景、阻力与回应，不应让旁支遮住最初提问。例如，你面对任务延期时，可以先写清目前卡住的环节，再继续读周围牌位。建议先写出一个已经知道的事实和一个仍待确认的条件，再读这张牌的正逆位与类别内容；如果图像暂时没有共鸣，可以保留问题而不强行套用。留意后续事实比寻找单一对应更有帮助，也可以把未确认的信息留给下一次实际交流。
    advice:
      - 围绕“现在：把十字中心读成当前焦点”，选一件具体事项记录前后变化。
    do:
      - 记录事实
    dont:
      - 仓促定论
  en:
    title: 'Present: read the role first'
    summary: You can keep the central question visible.
    body:
      You can keep the central question visible. The present position anchors the Celtic Cross while
      surrounding positions add context, tension and possible responses. For a delayed task,
      identify the current bottleneck first. Otherwise a vivid surrounding image may distract you
      from the practical issue that began the reading. Try writing the bottleneck in a few words and
      keeping that note beside the spread. When another position raises a useful theme, ask how it
      relates to this point. A role concerned with care might suggest a different conversation; a
      role concerned with structure might suggest clearer responsibilities. Either remains a prompt.
      The centre helps you judge relevance, so the later story stays attached to the question you
      actually need to address.
    advice:
      - Use the theme to ask one specific question, then note what the response changes.
