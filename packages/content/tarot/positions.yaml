  zh:
    title: 过去：识别正在离开中心的旧影响
    summary: 你可以识别正在离开中心的旧影响。
    body: 你可以回顾前一阶段的做法，但不必把熟悉的流程都带进新的安排。凯尔特十字中的过去位（正在离开中心的旧影响）提供背景，不会重建未记录的历史，也不自动说明旧办法失去价值。其他位置补充当下条件，因此要区分记忆中的便利与今天仍可取得的支持。例如，团队成员改变之后，一张旧检查表可能依然有用，而过去口头传递的消息需要改成清楚说明。建议选一项流程，问它原本解决什么问题，再向现在的参与者核实这个需要是否仍在；保留有效部分，把不再适合的部分交给协商，不用一次否定整个旧阶段。
    advice:
      - 围绕“过去：识别正在离开中心的旧影响”，选一件具体事项记录前后变化。
    do:
      - 记录事实
    dont:
      - 仓促定论
  en:
    title: 'Past: read the role first'
    summary: You can distinguish an earlier influence from a current requirement.
    body: You can distinguish an earlier influence from a current requirement. The past position
      concerns the preceding phase, including practices worth retaining and others that may have
      become unsuitable. After a team changes, reviewing old procedures is more useful than assuming
      every familiar method still belongs in the new setting. Try selecting one old procedure and
      asking which need it served. If that need remains, the procedure may still help; if the
      setting has changed, another version may be easier. Invite current participants to explain
      their experience before deciding. This lets you respect earlier learning without treating
      familiarity as evidence of suitability. Read the past image as a way to identify an influence,
      then check how that influence operates in today's arrangement.
    advice:
      - Use the theme to ask one specific question, then note what the response changes.
    do:
      - Record observations
    dont:
      - Rush conclusions
  meta:
