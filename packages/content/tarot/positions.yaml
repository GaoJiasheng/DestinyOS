    summary: 你可以观察双方已经形成的互动。
    body: 你可以观察双方已经形成的互动。牌位（这张牌承担的观察角度）让同一个画面在不同位置回答不同问题。连接位关注你们共同参与的沟通与安排；它与各自牌位不同，强调彼此回应如何形成相处节奏。例如，你们都愿意见面却总难约定时间时，可以看看邀请与确认之间的流程。建议把自己的期待、可用资源和仍不清楚的地方分别写下；如果其中一项暂时无法核实，就保留这份不确定，先做另一个能够得到回应的小步骤。留意后续事实比寻找单一对应更有帮助，也可以把未确认的信息留给下一次实际交流。
    advice:
      - 围绕“联系：观察双方已经形成的互动”，选一件具体事项记录前后变化。
