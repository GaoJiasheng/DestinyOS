  en:
    title: 'Challenge: read the role first'
    summary: You can turn a difficulty into a subject for discussion.
    body: You can turn a difficulty into a subject for discussion. The challenge position highlights
      something requiring attention without deciding the value of a connection. Different reactions
      to changed plans, for example, may call for an agreement about notice. That is more workable
      than labelling either person difficult. You can describe the effect of a changed plan without
      treating flexibility as a moral test. Explain how much notice helps you prepare, then ask what
      is realistic for the other person. If the needs differ, consider a smaller arrangement with
      fewer dependencies. The picture gives a difficulty a place in the spread; it does not demand
