  en:
    title: 'Month 11: read the role first'
    summary: You can gather the commitments still open.
    body:
      You can gather the commitments still open. Checking which remain useful makes it possible to
      renegotiate scope rather than carrying every old promise unchanged. Month 11 is a review
      window within the spread, not a date assigned to an event. Compare it with the central theme
      while keeping room for what actually happens. Consider sending a brief update about an open
      promise rather than waiting until everything is complete. State what remains possible and ask
      whether the original scope still matters. Some commitments may need finishing, while others
      can become smaller by agreement. The month's role supports a review of what is still active.
      Let the people involved contribute current information, so the arrangement reflects today's
      needs instead of an old expectation.
    advice:
