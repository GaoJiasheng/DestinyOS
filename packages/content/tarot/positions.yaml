  en:
    title: 'Month 1: read the role first'
    summary: You can begin the year by taking stock of commitments already in place.
    body:
      You can begin the year by taking stock of commitments already in place. Reviewing unfinished
      tasks gives a new plan an honest starting point. Month 1 is a review window within the spread,
      not a date assigned to an event. Compare it with the central theme while keeping room for what
      actually happens. Try distinguishing what still needs completion from what can simply be
      archived. One unfinished item may require a message; another may no longer serve a purpose.
      Making that distinction gives the year's opening some room without requiring an entirely clean
      slate. Read the month's card beside those arrangements and choose one modest piece of tidying.
      Later notes can show whether the space you hoped to create was actually available.
