  tags:
    - plain
    - tarot.reflection
    - tarot.action
    - tarot.choice
  exclusive_with: []
  zh:
    title: 情境：先描述情境再决定怎么行动
    summary: 你可以先描述情境再决定怎么行动。
    body: 你可以先描述情境再决定怎么行动。牌位（这张牌承担的观察角度）让同一个画面在不同位置回答不同问题。情境位把问题放在资源、沟通与限制的背景中；它帮助你区分当前条件和希望出现的结果。例如，你准备组织一次聚会时，可以先确认参与者的空闲时间与可用空间。你可以与最相关的另一张牌比较，但不必让所有细节都讲成同一个故事；先辨认相同之处与差异，再挑出最值得在现实中问清楚的一件事。留意后续事实比寻找单一对应更有帮助，也可以把未确认的信息留给下一次实际交流。
    advice:
      - 围绕“情境：先描述情境再决定怎么行动”，选一件具体事项记录前后变化。
    do:
      - 记录事实
    dont:
      - 仓促定论
  en:
    title: 'Situation: read the role first'
    summary: You can describe the setting before choosing a response.
    body: You can describe the setting before choosing a response. The situation position frames
      resources, communication and limits without confusing them with the outcome you want. For a
      gathering, available space and people’s actual free time belong here, before the enthusiasm of
      planning takes over. You can list what is fixed, what is negotiable and what has not yet been
      confirmed. For the gathering, that might mean a known room, flexible timing and an unanswered
      invitation. Read the card beside those three groups. It may highlight a point needing
      attention, but it does not move an unknown fact into the known column. Begin the action only
      when the necessary arrangement is clear enough for a comfortable attempt. You can review the
      note after an ordinary experience gives you more information.
    advice:
      - Use the theme to ask one specific question, then note what the response changes.
    do:
      - Record observations
    dont:
      - Rush conclusions
  meta:
    author: t23-tarot-editorial-v1
    reviewed_by: null
    version: 1
    status: published
