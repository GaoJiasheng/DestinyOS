    body: 你可以先说清自己在关系中的需要。牌位（这张牌承担的观察角度）让同一个画面在不同位置回答不同问题。你的牌位关注你能表达的感受、期待与界限；它描述本次问题里的角色，不把你固定成某种性格。例如，你想增加联系时，可以说出舒服的频率，也承认自己需要独处的时段。可以先给这项观察划定范围，只讨论你手上这一件事；把需要别人补充的信息留给直接交流，并在几天后回看自己的记录，不急着扩大为长期判断。留意后续事实比寻找单一对应更有帮助，也可以把未确认的信息留给下一次实际交流。
