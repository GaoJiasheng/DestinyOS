    summary: 你可以收拢还没有完成的承诺。
    body: 你可以在第十一个观察窗口里，收拢仍在等待回应的约定。月份牌位（年度计划中的回看位置）不要求某月所有事项都完成，也不把旧承诺当作永远不能改变的责任。图像适合帮助你问哪些安排仍有意义，具体范围则需要与相关人沟通。比如很早答应的一次分享，可能因为对方需求改变，只需要提供一份短资料。不妨先发一个清楚的进度说明，讲明目前能做什么，再询问原来的目标是否还需要保留。协商后记下新的范围和日期，把需要完成的部分与可以调整的部分分开；这样你照顾的是当下真实需要，而不是独自维持过去的想象。
    advice:
      - 围绕“11月：收拢还没有完成的承诺”，选一件具体事项记录前后变化。
    do:
