    summary: 你可以给年度安排选择一个可回看的主题。
    body: 你可以给年度安排选择一个可回看的主题。牌位（这张牌承担的观察角度）让同一个画面在不同位置回答不同问题。年度主题位是十二个月读法的参照，不把全年固定成一种状态；每个月仍可以根据现实消息调整。例如，你希望一年更有余裕，可以把减少无效安排作为每次复盘的共同问题。建议把自己的期待、可用资源和仍不清楚的地方分别写下；如果其中一项暂时无法核实，就保留这份不确定，先做另一个能够得到回应的小步骤。留意后续事实比寻找单一对应更有帮助，也可以把未确认的信息留给下一次实际交流。
    advice:
      - 围绕“年度主题：给年度安排选择一个可回看的主题”，选一件具体事项记录前后变化。
    do:
      - 记录事实
    dont:
      - 仓促定论
  en:
    title: 'Theme: read the role first'
    summary: You can choose a theme to revisit across the year.
    body: You can choose a theme to revisit across the year. The central position gives the monthly
      cards a common point of reference without making every month identical. Wanting more breathing
      room, for example, can become a recurring question about unnecessary commitments rather than a
      prediction of twelve matching experiences. Try giving the theme one recurring question you can
      ask at each review. For breathing room, it might be whether a commitment still serves a need
      you value. Keep one brief note per month rather than expecting a uniform mood across the year.
      The centre can help you see connections between different experiences while allowing
      individual months to contain changes, exceptions and information no earlier card could
      establish. You can review the note after an ordinary experience gives you more information.
    advice:
      - Use the theme to ask one specific question, then note what the response changes.
