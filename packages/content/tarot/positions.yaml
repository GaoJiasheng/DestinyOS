    summary: 你可以给对方保留直接表达的空间。
    body: 你可以给对方保留直接表达的空间。牌位（这张牌承担的观察角度）让同一个画面在不同位置回答不同问题。对方位提供观察相处方式的角度；你并不知道对方全部经历，牌面也不能读出未说出口的思想。例如，对方回复较慢时，可以询问方便交流的时间，而不把沉默当成一种动机的证据。试试将牌面主题改写成一个可以执行的小动作，注明开始与结束的时间；完成后比较自己的感受与事情的实际变化，让反馈决定下一步是否值得继续。留意后续事实比寻找单一对应更有帮助，也可以把未确认的信息留给下一次实际交流。
