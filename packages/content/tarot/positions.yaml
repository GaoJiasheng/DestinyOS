    title: 'Month 12: read the role first'
    summary: You can turn a year end review into portable learning.
    body:
      You can turn a year end review into portable learning. One observed change and one habit worth
      keeping offer a grounded way to begin the next cycle. Month 12 is a review window within the
      spread, not a date assigned to an event. Compare it with the central theme while keeping room
      for what actually happens. You can select an example from your own notes rather than ranking
      the year as a whole. What changed in a way you could observe, and which modest habit helped?
      Bring those details into the next plan without expecting the following year to repeat this
      one. A closing review can acknowledge unfinished matters as well as completed ones. Consider
      naming one question you want to keep open alongside the lesson you are ready to carry forward.
