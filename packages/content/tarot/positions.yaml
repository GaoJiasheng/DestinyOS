    summary: You can examine what taking option A would ask of you.
    body:
      You can examine what taking option A would ask of you. Its position describes an approach and
      its conditions, without receiving preference merely because it comes first. A plan involving
      regular attendance needs a realistic check of travel and available time before you compare its
      appeal with the alternative. You can ask for the timetable and attendance requirements rather
      than estimating them from an appealing description. Compare those details with the
      responsibilities already in your week. If the plan fits only with a large change, note that
