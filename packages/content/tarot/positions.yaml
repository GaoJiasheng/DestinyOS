    summary: 你可以把想达到的状态说清楚。
    body: 你可以先把希望达到的状态描述得具体一些。冠顶位（这次阅读中意识到的目标）讨论你重视的方向，不能把想象中的结果直接等同于当前事实。它位于十字上方，与下方基础和中心现状形成对照：你想去哪里，也需要看看自己从哪里出发。比如你希望学习更轻松，可以说明是减少来回切换、得到更清楚的说明，还是安排更多练习，而不只要求一种模糊的好感觉。不妨写出一项能够观察的变化，用它设计下一次小调整；之后再比较体验，目标也可以随新的认识变得更合适，不需要为了符合画面而维持原先的期待。
    advice:
      - 围绕“目标：把想达到的状态说清楚”，选一件具体事项记录前后变化。
    do:
      - 记录事实
    dont:
      - 仓促定论
  en:
    title: 'Crown: read the role first'
    summary: You can give an aspiration a clear description.
    body: You can give an aspiration a clear description. The crown position concerns the goal or
      understanding currently in view, distinct from what is already happening. Wanting an easier
      learning routine becomes more useful when you name the particular burden you hope to reduce
      and compare that aim with your starting conditions. You can describe what “easier” would look
      like in an ordinary week. Would fewer transitions help, or would clearer instructions matter
      more? Compare that aim with the foundation card's question about support and the present
      card's question about the current issue. A useful aspiration is specific enough to inform one
      adjustment. Keep room for a later change in the goal if your experience reveals that another
      need deserves attention first.
    advice:
      - Use the theme to ask one specific question, then note what the response changes.
