    dont:
      - 仓促定论
  en:
    title: 'Them: read the role first'
    summary: You can make space for the other person to speak directly.
    body:
      'You can make space for the other person to speak directly. Their position offers a lens on
      interaction, without revealing private thoughts or a complete personal history. A slow reply,
      for example, is a reason to ask about a convenient time for contact rather than to assign a
      motive. You can ask a question that allows several answers: perhaps messages during work are
      inconvenient, or another format feels easier. Wait for the reply before drawing a wider
      conclusion. If contact remains unclear, decide what boundary helps you rather than trying to
      recover private information from a picture. Reading this role carefully means recognising how
      much you still do not know and allowing that person to supply their own account. You can
      review the note after an ordinary experience gives you more information.'
