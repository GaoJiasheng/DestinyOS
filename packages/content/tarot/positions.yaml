      - 仓促定论
  en:
    title: 'You: read the role first'
    summary: You can begin by naming your own needs within the connection.
    body:
      You can begin by naming your own needs within the connection. This position concerns feelings,
      expectations and boundaries you can express, rather than a permanent identity. Wanting more
      contact might coexist with needing quiet time. Both deserve words before you try to interpret
      another person’s response. Consider stating those needs together rather than presenting one as
      a concession. You might enjoy regular contact while also wanting an evening without messages.
      Naming both allows the other person to understand what you are offering. Listen to their
      preferences in return and look for an arrangement that leaves each person room. A card about
      your role can support self expression without making your needs the only conditions of the
      relationship. You can review the note after an ordinary experience gives you more information.
