  zh:
    title: 基础：查看支撑问题的基础安排
    summary: 你可以查看支撑问题的基础安排。
    body: 你可以查看支撑问题的基础安排。牌位（这张牌承担的观察角度）让同一个画面在不同位置回答不同问题。基础位关注较深的习惯、资源或长期条件；它并不提供心理诊断，也不把一切归于无法改变的原因。例如，你常在截止前赶工时，可以看看最初怎样估算任务规模与准备时间。可以先给这项观察划定范围，只讨论你手上这一件事；把需要别人补充的信息留给直接交流，并在几天后回看自己的记录，不急着扩大为长期判断。留意后续事实比寻找单一对应更有帮助，也可以把未确认的信息留给下一次实际交流。
    advice:
      - 围绕“基础：查看支撑问题的基础安排”，选一件具体事项记录前后变化。
    do:
      - 记录事实
    dont:
      - 仓促定论
  en:
    title: 'Foundation: read the role first'
    summary: You can review the ordinary conditions beneath the visible issue.
    body: You can review the ordinary conditions beneath the visible issue. The foundation position
      concerns habits, resources and longer standing arrangements without diagnosing an unseen
      cause. A recurring rush before deadlines may connect with how task size was estimated at the
      start. That is a condition you can investigate and revise. You can review the first estimate
      rather than only the final rush. What information was available then, and what arrived later?
      One adjustment might be a preparation interval or a question asked earlier. Test that change
      on a small assignment before explaining every deadline through the same cause. A foundation
      image is a prompt to investigate a supporting condition, including a condition that can be
      ordinary, visible and open to revision.
    advice:
      - Use the theme to ask one specific question, then note what the response changes.
    do:
      - Record observations
    dont:
      - Rush conclusions
