      - 仓促定论
  en:
    title: 'Month 8: read the role first'
    summary: You can revisit responsibilities in a shared activity.
    body:
      You can revisit responsibilities in a shared activity. Checking who does what may reveal an
      unstated handover before it becomes an everyday frustration. Month 8 is a review window within
      the spread, not a date assigned to an event. Compare it with the central theme while keeping
      room for what actually happens. You can trace one task through the people involved and ask
      where responsibility changes hands. Make the instruction for that moment explicit. If someone
      is carrying an unstated extra part, discuss whether the division can change. This month's
      review can turn a broad complaint about teamwork into a small agreement. Check the next
      handover afterwards instead of assuming that writing the agreement has already resolved the
      difficulty. You can review the note after an ordinary experience gives you more information.
    advice:
