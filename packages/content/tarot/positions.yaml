  system: tarot
  section: cards
  topic: positions.three_ppf.present
  when:
    all:
      - path: spread
        eq: three_ppf
      - path: cards[position=present].position
        eq: present
  weight: 60
  polarity: neutral
  tags:
    - plain
    - tarot.reflection
    - tarot.action
    - tarot.choice
  exclusive_with: []
  zh:
    title: 现在：先说明你现在看得见的情况
    summary: 你可以先说明你现在看得见的情况。
    body: 你可以先说明你现在看得见的情况。牌位（这张牌承担的观察角度）让同一个画面在不同位置回答不同问题。现在位关注当下能够观察的状态；它与过去位区分，使你不必把旧印象直接当成今天的事实。例如，同一合作再次开始时，可以重新确认职责，而不是沿用上次的分工假设。试试将牌面主题改写成一个可以执行的小动作，注明开始与结束的时间；完成后比较自己的感受与事情的实际变化，让反馈决定下一步是否值得继续。留意后续事实比寻找单一对应更有帮助，也可以把未确认的信息留给下一次实际交流。
    advice:
      - 围绕“现在：先说明你现在看得见的情况”，选一件具体事项记录前后变化。
    do:
      - 记录事实
    dont:
      - 仓促定论
  en:
    title: 'Present: read the role first'
    summary: You can start with what is observable now.
    body: You can start with what is observable now. The present position separates current
      circumstances from the background described elsewhere. When a collaboration resumes, this
      means asking about today’s responsibilities rather than assuming the old arrangement still
      applies. Name the fact that has changed before interpreting the image. You can ask each
      participant what has changed since the previous task. Compare the answers with your own
      expectations and note any missing agreement. An updated division of work might be enough; a
      larger redesign may not be necessary. Use the card's theme to organise that check, then rely
      on the responses you obtain. A present position should leave you with a clearer picture of
      current conditions, including the parts still uncertain. You can review the note after an
      ordinary experience gives you more information.
    advice:
      - Use the theme to ask one specific question, then note what the response changes.
    do:
      - Record observations
    dont:
      - Rush conclusions
  meta:
    author: t23-tarot-editorial-v1
    reviewed_by: null
    version: 1
    status: published
- id: tarot.positions.three_ppf.future
