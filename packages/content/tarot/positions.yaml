# // DESIGN-GAP: Cover all 41 positions of the eight schema-defined spreads; variants use supported .a/.b IDs.
- id: tarot.positions.single.focus.a
  system: tarot
  section: cards
  topic: positions.single.focus
  when: &a1
    all:
      - path: spread
        eq: single
      - path: cards[position=focus].position
        eq: focus
  weight: 60
  polarity: neutral
  tags:
    - plain
    - tarot.reflection
    - tarot.action
    - tarot.choice
  exclusive_with:
    - tarot.positions.single.focus.b
  zh:
    title: 核心指引：只观察一个最相关的主题
    summary: 你可以只观察一个最相关的主题。
    body: 你可以只观察一个最相关的主题。牌位（这张牌承担的观察角度）让同一个画面在不同位置回答不同问题。单张指引只给当前问题一个观察角度；它无法展开其他人的立场或一整段时间线。例如，你想恢复学习节奏，可以从今日一项练习入手，而不把一个画面扩大成一年的评价。建议先写出一个已经知道的事实和一个仍待确认的条件，再读这张牌的正逆位与类别内容；如果图像暂时没有共鸣，可以保留问题而不强行套用。留意后续事实比寻找单一对应更有帮助，也可以把未确认的信息留给下一次实际交流。
    advice:
      - 围绕“核心指引：只观察一个最相关的主题”，选一件具体事项记录前后变化。
    do:
      - 记录事实
    dont:
      - 仓促定论
  en:
    title: 'Focus: read the role first'
    summary: You can concentrate on the one theme most relevant today.
    body:
      You can concentrate on the one theme most relevant today. A single focus position supplies one
      lens, without separate places for other people’s perspectives or a timeline. For a return to
      study, the useful comparison is with today’s practice, not a verdict on the whole year. The
      small scale is useful because you can see what actually happens. Try noting your expectation
      before the session and one surprising detail afterwards. If interest grows, decide what amount
      of time you want to offer next; if it fades, that observation still helps. Leave other
      questions outside this exercise so the focus card gives you a clear point of attention rather
      than a reason to judge everything at once. You can review the note after an ordinary
      experience gives you more information.
    advice:
      - Use the theme to ask one specific question, then note what the response changes.
    do:
      - Record observations
    dont:
      - Rush conclusions
  meta:
    author: t23-tarot-editorial-v1
    reviewed_by: null
    version: 1
    status: published
- id: tarot.positions.single.focus.b
  system: tarot
  section: cards
  topic: positions.single.focus
  when: *a1
  weight: 60
  polarity: neutral
  tags:
    - plain
    - tarot.reflection
    - tarot.action
    - tarot.choice
  exclusive_with:
    - tarot.positions.single.focus.a
  zh:
    title: 用一天的记录读这一张牌
    summary: 你可以用一件小事观察牌面主题如何贴近日常。
    body: 你可以从今天最在意的一件小事理解单张指引。核心指引位（只为当前问题提供一个焦点）不展开完整时间线，所以更适合缩小提问。正逆位（牌面朝向）让你分别关注品质如何外用或内收，牌库的类别段落再把它放回你的生活。例如，你拿不准是否开始新爱好，可以先问自己愿不愿意安排一次体验，而不是评判整段未来。建议在纸上划出“目前已知”和“还想了解”两栏，只给后者安排一个温和的尝试；结束后写下一项新的观察。这样一张牌提供的是提问工具，你仍能依据体验选择继续、修改或停下。
    advice:
      - 围绕“用一天的记录读这一张牌”，选一件具体事项记录前后变化。
    do:
      - 记录事实
    dont:
      - 仓促定论
  en:
    title: Follow one detail through your day
    summary: You can follow one image through a small, ordinary experience.
    body: You can approach a single card by following one detail through an ordinary day. The focus
      position narrows your attention; it has no separate places for a complete history or another
      person's perspective. Read its orientation and the selected category, then choose a situation
      small enough to recognise clearly. If you are considering a new hobby, the useful test might
      be whether you enjoy one introductory session. It need not settle a long term plan. Try
      dividing a page into what you know now and what you would like to learn. Give the second
      column one gentle experiment, and return to it afterwards with a new observation. A useful
      image can help you ask a better question while leaving you free to continue, revise or put the
      idea aside.
    advice:
      - Use the theme to ask one specific question, then note what the response changes.
    do:
      - Record observations
    dont:
      - Rush conclusions
  meta:
    author: t23-tarot-editorial-v1
    reviewed_by: null
    version: 1
    status: published
- id: tarot.positions.yes_no.answer.a
  system: tarot
  section: cards
  topic: positions.yes_no.answer
  when: &a2
    all:
      - path: spread
        eq: yes_no
      - path: cards[position=answer].position
        eq: answer
  weight: 60
  polarity: neutral
  tags:
    - plain
    - tarot.reflection
    - tarot.action
    - tarot.choice
  exclusive_with:
    - tarot.positions.yes_no.answer.b
  zh:
    title: 回应：把是非倾向与核实条件一起看
    summary: 你可以把是非倾向与核实条件一起看。
    body: 你可以把是非倾向与核实条件一起看。牌位（这张牌承担的观察角度）让同一个画面在不同位置回答不同问题。是非位提供的是可复现的象征倾向；模糊回应提示条件仍需澄清，置信数值也不是现实成功率。例如，你问是否参加活动时，仍要确认时间、地点与自己愿意承担的安排。不妨选取画面中一个最接近当前经验的细节，用它提出温和的问题；接着观察一次实际回应，把新的消息记下来，再判断是否需要改变原来的理解。留意后续事实比寻找单一对应更有帮助，也可以把未确认的信息留给下一次实际交流。
    advice:
      - 围绕“回应：把是非倾向与核实条件一起看”，选一件具体事项记录前后变化。
    do:
      - 记录事实
    dont:
      - 仓促定论
  en:
    title: 'Answer: read the role first'
    summary: You can read an answer as a symbolic leaning alongside the conditions still to check.
    body:
      'You can read an answer as a symbolic leaning alongside the conditions still to check. This
      position offers no measured probability of real success. A tentative result may simply invite
      a clearer question. When considering an event, your schedule and willingness matter more than
      the label alone. Try checking the invitation itself before deciding how to respond. Would
      attending require a change you are comfortable making? Is there a smaller form of
      participation? These questions let you use the leaning without handing your choice to it. A
      definite label may feel reassuring, but an arrangement you understand gives you something more
      practical: a decision you can explain and revisit when the circumstances change. You can
      review the note after an ordinary experience gives you more information.'
    advice:
      - Use the theme to ask one specific question, then note what the response changes.
    do:
      - Record observations
    dont:
      - Rush conclusions
  meta:
    author: t23-tarot-editorial-v1
    reviewed_by: null
    version: 1
    status: published
- id: tarot.positions.yes_no.answer.b
  system: tarot
  section: cards
  topic: positions.yes_no.answer
  when: *a2
  weight: 60
  polarity: neutral
  tags:
    - plain
    - tarot.reflection
    - tarot.action
    - tarot.choice
  exclusive_with:
    - tarot.positions.yes_no.answer.a
  zh:
    title: 把一句回答拆成两个现实问题
    summary: 你可以同时问清想尝试什么，以及还有什么条件要确认。
    body: 你可以把是非牌位的提示拆成愿望和条件两部分。回答位（用一张牌提供象征性倾向）帮助你看见自己想要的方向，却不能替你核实外部安排。正逆位（牌面朝向）也会改变这个提示；若出现模糊倾向，可以把它理解为还需补充信息。例如，你想参加一个共同活动，可以分别确认自己是否愿意投入，以及参与者是否能协商出时间。建议先写下两项必须核实的条件，通过日常交流各检查一次；若条件仍不清楚，给自己一个再决定的日期。置信数值只是牌阵规则的提示强度，不是现实事件的成功概率，你可以随新信息调整选择。
    advice:
      - 围绕“把一句回答拆成两个现实问题”，选一件具体事项记录前后变化。
    do:
      - 记录事实
    dont:
      - 仓促定论
  en:
    title: Separate willingness from conditions
    summary: You can distinguish what you want from what remains to be checked.
    body: 'You can separate an answer position into willingness and conditions. Its label provides a
      symbolic leaning from one card, rather than checking the arrangements outside the reading.
      Orientation may soften that leaning, and an uncertain response can invite more information.
      Think of joining a shared activity: wanting to take part and finding a suitable time are two
      different questions. Consider writing down two conditions you would need to confirm, then
      asking about each through an ordinary conversation. If an answer remains unavailable, give
      yourself a later date for deciding instead of drawing repeatedly. The confidence value
      describes the strength assigned by the card rule; it is not a measured chance of success. Your
      eventual choice can respond to new information and to the practical limits you recognise.'
    advice:
      - Use the theme to ask one specific question, then note what the response changes.
    do:
      - Record observations
    dont:
      - Rush conclusions
  meta:
    author: t23-tarot-editorial-v1
    reviewed_by: null
    version: 1
    status: published
- id: tarot.positions.three_ppf.past
