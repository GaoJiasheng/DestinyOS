  section: cards
  topic: positions.three_ppf.past
  when:
    all:
      - path: spread
        eq: three_ppf
      - path: cards[position=past].position
        eq: past
  weight: 60
  polarity: neutral
  tags:
    - plain
    - tarot.reflection
    - tarot.action
    - tarot.choice
  exclusive_with: []
  zh:
    title: 过去：从旧经验中识别当前背景
    summary: 你可以从旧经验中识别当前背景。
    body: 你可以从旧经验中识别当前背景。牌位（这张牌承担的观察角度）让同一个画面在不同位置回答不同问题。过去位讨论已经形成的习惯、记忆或背景；牌面不会补出未知的历史，也不需要你寻找某个对应事件。例如，你反复迟到时，可以回看此前如何估算出门时间，而不急着评价自己。可以先给这项观察划定范围，只讨论你手上这一件事；把需要别人补充的信息留给直接交流，并在几天后回看自己的记录，不急着扩大为长期判断。留意后续事实比寻找单一对应更有帮助，也可以把未确认的信息留给下一次实际交流。
    advice:
      - 围绕“过去：从旧经验中识别当前背景”，选一件具体事项记录前后变化。
    do:
      - 记录事实
    dont:
      - 仓促定论
  en:
    title: 'Past: read the role first'
    summary: You can look for an earlier habit that still shapes the present.
    body:
      You can look for an earlier habit that still shapes the present. The past position concerns
      background and remembered experience; it cannot recover unknown history. Repeated lateness,
      for instance, may become easier to understand when you review how you previously estimated
      preparation and travel time. Try recalling one occasion with enough detail to describe the
      sequence. Was preparation shorter than you expected, or did the task change? You need not
      reconstruct an entire personal story to learn from that example. Select one estimate to revise
      the next time the situation arises. A past position becomes useful when it helps you bring an
      earlier lesson into the present without treating the lesson as an unchangeable rule. You can
      review the note after an ordinary experience gives you more information.
    advice:
      - Use the theme to ask one specific question, then note what the response changes.
    do:
      - Record observations
    dont:
      - Rush conclusions
  meta:
    author: t23-tarot-editorial-v1
    reviewed_by: null
    version: 1
    status: published
