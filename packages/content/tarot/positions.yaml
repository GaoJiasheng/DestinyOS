  en:
    title: 'Hopes Fears: read the role first'
    summary: You can allow a wish and a worry to coexist.
    body:
      You can allow a wish and a worry to coexist. This position considers two reactions to the same
      possibility without establishing that the feared event will occur. Publicly sharing work might
      feel exciting and exposing. Name what you hope to gain, then separate that from the
      preparation that would make a small trial comfortable. Try preparing a small audience and a
      clear request for feedback rather than a test of your confidence. Ask whether the work
      communicates its main point. This gives the wish for sharing something useful a practical form
      while acknowledging that being seen can feel uncomfortable. The image can hold both reactions
      without requiring one to defeat the other. Afterwards, compare what you feared with what
      people actually said or did.
