  zh:
    title: 自我：把自己的回应方式与情境分开
    summary: 你可以把自己的回应方式与情境分开。
    body: 你可以把自己的回应方式与情境分开。牌位（这张牌承担的观察角度）让同一个画面在不同位置回答不同问题。自我位关注你处理当前问题的态度；它与中心的现状不同，帮助你区分外部发生的事情和自己可以调整的回应。例如，消息突然增多时，你可以观察是否立刻全接下来，还是先确认轻重缓急。建议先写出一个已经知道的事实和一个仍待确认的条件，再读这张牌的正逆位与类别内容；如果图像暂时没有共鸣，可以保留问题而不强行套用。留意后续事实比寻找单一对应更有帮助，也可以把未确认的信息留给下一次实际交流。
    advice:
      - 围绕“自我：把自己的回应方式与情境分开”，选一件具体事项记录前后变化。
    do:
      - 记录事实
    dont:
      - 仓促定论
  en:
    title: 'Self: read the role first'
    summary: You can separate your response from the setting around you.
    body:
      You can separate your response from the setting around you. The self position concerns how you
      approach the present issue, rather than what the entire situation consists of. When messages
      multiply, noticing whether you immediately accept every request reveals a response you might
      adjust without denying the workload itself. Consider what happens between receiving a message
      and saying yes. You could check the deadline, ask about its size or wait until you have
      reviewed existing tasks. One such pause may give you a more considered response. It will not
      remove every outside demand, and it need not. This position helps you locate the choice within
      your response, allowing you to change a habit without taking responsibility for the entire
      environment.
    advice:
      - Use the theme to ask one specific question, then note what the response changes.
    do:
