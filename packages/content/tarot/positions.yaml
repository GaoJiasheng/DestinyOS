  zh:
    title: 挑战：把横压牌读成需要调节的力量
    summary: 你可以把横压牌读成需要调节的力量。
    body: 你可以把横压牌读成需要调节的力量。牌位（这张牌承担的观察角度）让同一个画面在不同位置回答不同问题。挑战牌横置，采用正位牌义并强调阻碍或张力；引擎已按这一惯例给出正位读法，不需要再把横置当成逆位。例如，一项本来有帮助的规则若拖慢流程，可以讨论它在这里为何成为负担。不妨选取画面中一个最接近当前经验的细节，用它提出温和的问题；接着观察一次实际回应，把新的消息记下来，再判断是否需要改变原来的理解。留意后续事实比寻找单一对应更有帮助，也可以把未确认的信息留给下一次实际交流。
    advice:
      - 围绕“挑战：把横压牌读成需要调节的力量”，选一件具体事项记录前后变化。
    do:
      - 记录事实
    dont:
      - 仓促定论
  en:
    title: 'Challenge: read the role first'
    summary: You can read the crossing card as a quality creating tension.
    body: 'You can read the crossing card as a quality creating tension. In this spread it uses the
      upright meaning even when displayed horizontally. A normally useful quality may still obstruct
      the present task. A helpful rule that slows a particular process is one example: ask why its
      effect differs here. Consider where the rule helps and where it becomes disproportionate.
      Perhaps a careful review belongs on a final draft but interrupts every early sketch. Naming
      that difference lets you discuss a change without treating the rule itself as wrong. Compare
      the crossing quality with the central task and ask for a workable boundary. You can preserve
      its useful purpose while testing a lighter application in the part of the process under
      discussion.'
    advice:
      - Use the theme to ask one specific question, then note what the response changes.
    do:
      - Record observations
    dont:
      - Rush conclusions
