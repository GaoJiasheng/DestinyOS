    summary: 你可以为下一阶段准备一个复盘点。
    body: 你可以为下一阶段准备一个复盘点。牌位（这张牌承担的观察角度）让同一个画面在不同位置回答不同问题。近期位描述接下来值得注意的走向；它不包含明确日期，发展也会随你的行动与其他条件调整。例如，一个流程正在试行时，你可以约定下一次交流，看看原先困难有没有变化。你可以与最相关的另一张牌比较，但不必让所有细节都讲成同一个故事；先辨认相同之处与差异，再挑出最值得在现实中问清楚的一件事。留意后续事实比寻找单一对应更有帮助，也可以把未确认的信息留给下一次实际交流。
    advice:
      - 围绕“近期发展：为下一阶段准备一个复盘点”，选一件具体事项记录前后变化。
    do:
      - 记录事实
    dont:
      - 仓促定论
  en:
    title: 'Near Future: read the role first'
    summary: You can prepare a review point for the next phase.
    body:
      You can prepare a review point for the next phase. Near future describes a possible direction
      of attention, without providing a date or removing the effects of later choices. During a
      trial workflow, scheduling another conversation lets you check whether the difficulty has
      changed instead of waiting for a prediction to unfold. Try setting a review time based on the
      actual trial rather than on a date imagined from the card. Ask participants to bring one
      observation about what changed. Their examples can show whether the plan needs continuation, a
      narrower scope or a different approach. A nearby direction in the spread can make you
      attentive to a possibility, while the timing and evidence of the review remain matters you
      arrange in ordinary life.
    advice:
