    body: 你可以给方案乙同等清楚的审视。牌位（这张牌承担的观察角度）让同一个画面在不同位置回答不同问题。方案乙位讨论另一条路径的资源、节奏与限制；它需要用和甲相同的尺度，避免只放大一边的优点。例如，乙方案较灵活时，可以核对是否需要更多自主安排，而不只看表面便利。建议把自己的期待、可用资源和仍不清楚的地方分别写下；如果其中一项暂时无法核实，就保留这份不确定，先做另一个能够得到回应的小步骤。留意后续事实比寻找单一对应更有帮助，也可以把未确认的信息留给下一次实际交流。
    advice:
      - 围绕“选择 B：给方案乙同等清楚的审视”，选一件具体事项记录前后变化。
    do:
      - 记录事实
    dont:
      - 仓促定论
  en:
    title: 'Option B: read the role first'
    summary: You can give option B the same careful hearing.
    body: You can give option B the same careful hearing. This position concerns another route’s
      resources, rhythm and limits, using the criteria already applied to A. A flexible course may
      still require more self organisation. Look at that demand as well as its convenience before
      deciding how it fits. Try finding out how reminders, questions and feedback are handled in the
      flexible plan. Independence may suit you well when support is clear, or become frustrating
      when each uncertainty needs extra searching. Compare that condition with A's requirements
      using the same purpose. You do not need to favour flexibility or structure in general. The
      useful question is which arrangement addresses your current need at a scale you are
      comfortable trying. You can review the note after an ordinary experience gives you more
      information.
