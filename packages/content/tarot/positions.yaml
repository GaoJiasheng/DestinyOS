    summary: 你可以把回顾转成可带走的经验。
    body: 你可以在年度最后一个观察窗口里，把回顾写成自己能带走的经验。十二月位置（年度记录的收尾角度）不会替全年打分，也不能证明所有未完成事项应该如何处理。主题牌提出的问题可以陪你比较不同月份，但例外、新消息与改过的计划也应留在记录里。例如，一项很小的准备习惯让几次活动更顺利，就值得写下它怎样发挥作用，不需要因为结果不够醒目而忽略。建议选一个有事实支持的变化和一个仍想了解的问题，分别带进下一轮安排；肯定已完成的部分，也给尚未清楚的地方留空间，让总结保持具体而温和。
    advice:
      - 围绕“12月：把回顾转成可带走的经验”，选一件具体事项记录前后变化。
    do:
      - 记录事实
    dont:
      - 仓促定论
