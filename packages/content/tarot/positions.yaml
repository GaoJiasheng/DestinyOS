    dont:
      - 仓促定论
  en:
    title: 'Month 10: read the role first'
    summary: You can give a complicated task a clearer sequence.
    body:
      You can give a complicated task a clearer sequence. Preparing the part on which others depend
      may be more useful than doing the most visible part first. Month 10 is a review window within
      the spread, not a date assigned to an event. Compare it with the central theme while keeping
      room for what actually happens. You can ask what another person needs before they can begin
      their part. That answer may reveal an overlooked preparation step. Complete or clarify that
      piece before filling the whole diary with parallel tasks. The picture can highlight sequence
      without announcing a particular interruption. Record whether the new order made the work
      easier, and keep an alternative available if the actual dependencies differ from your first
      understanding.
    advice:
      - Use the theme to ask one specific question, then note what the response changes.
    do:
