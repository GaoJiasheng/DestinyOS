    summary: 你可以把相处难点改写为可沟通的事。
    body: 你可以把相处难点改写为可沟通的事。牌位（这张牌承担的观察角度）让同一个画面在不同位置回答不同问题。挑战位指出需要额外注意的互动环节；不舒服的牌面也可以成为讨论入口，而不是对关系价值的否定。例如，你们对临时改约的接受程度不同，可以谈谈需要提前多久通知。你可以与最相关的另一张牌比较，但不必让所有细节都讲成同一个故事；先辨认相同之处与差异，再挑出最值得在现实中问清楚的一件事。留意后续事实比寻找单一对应更有帮助，也可以把未确认的信息留给下一次实际交流。
