      Fears](/en/learn/tarot/{{cards[position=hopes_fears].cardKey}});
      [Outcome](/en/learn/tarot/{{cards[position=outcome].cardKey}})'
  zh:
    title: 凯尔特十字：从本次牌面学习
    summary: 你可以用真实记录与牌库条目一起学习这次读法。
    body: |-
      你可以先理解每个位置的任务，再学习凯尔特十字之间的联系。现状位（当前焦点）居中，横置挑战牌采用正位主题，强调此处的阻力；基础、过去、目标与环境等位置补充条件，结果位不能盖过它们。下方百科链接对应这次实际出现的每张牌，方便你重看画面，而不是只凭牌名记忆结论。例如，你可以比较自己的回应方式与环境限制，看看哪一个日常安排需要问清。建议每次只选一条与最初问题有关的联系，在现实中核实后再记下变化；十张牌不需要讲成没有缝隙的故事，有些位置暂时没有共鸣也可以保留。

      {{zh_entries}}
    advice:
      - 复盘后写下一项新的认识。
    do:
      - 回看记录
    dont:
      - 生搬牌义
  en:
    title: 'Celtic Cross: learn from this draw'
    summary: You can connect the encyclopedia entries with an observation of your own.
    body: >-
      You can study the Celtic Cross by giving each position a clear role before connecting the
      whole arrangement. Keep the present issue at the centre and read the crossing challenge
      through the upright theme, as this spread’s convention requires. Foundation and past add
      context; crown describes an aim; the remaining positions explore development, response,
      surroundings and mixed expectations. Use the encyclopedia links to inspect the pictures
      without letting the outcome erase those conditions. Try selecting one connection relevant to
      the original issue, such as how your response meets an environmental limit. Ask an ordinary
      question about that connection outside the reading. A complete spread can support learning
      through one careful comparison rather than through a dramatic story that accounts for every
      visual detail.


      You can add one brief note from your next review.

      {{en_entries}}
    advice:
      - Review one observation alongside the card description.
    do:
      - Review a note
    dont:
      - Force a match
  meta:
    author: t23-tarot-editorial-v1
    reviewed_by: null
    version: 1
    status: published
