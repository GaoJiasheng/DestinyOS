  zh:
    title: 年度牌阵：从本次牌面学习
    summary: 你可以用真实记录与牌库条目一起学习这次读法。
    body: |-
      你可以把年度牌阵学成一份持续更新的记录。主题位（全年反复回看的问题）与十二个月牌位（分段观察窗口）提供组织方式，不把任何图像绑定成某月一定发生的事件。下方链接对应实际抽到的所有牌，可以在每次复盘时重看正逆位与类别主题。例如，你希望安排更有余裕，有的月份适合检查维护事务，有的月份适合讨论承诺范围，具体仍要看真实情况。建议每个月留一条简短观察，允许例外和新消息出现；年底先比较记录，再整理一个可带走的经验。学习的价值在于更清楚地提问与调整，不需要用每张牌预先替整年写好结局。

      {{zh_entries}}
    advice:
      - 复盘后写下一项新的认识。
    do:
      - 回看记录
    dont:
      - 生搬牌义
  en:
    title: 'Year Ahead: learn from this draw'
    summary: You can connect the encyclopedia entries with an observation of your own.
    body: >-
      You can learn an annual spread through repeated review rather than through a calendar of
      predicted events. The theme card supplies a common question, and the twelve monthly roles
      provide different occasions to return to it. The encyclopedia links let you inspect every
      drawn image, while your own notes show what the year actually contains. For a wish to make
      more room in your routine, one month may prompt a maintenance check and another a conversation
      about commitments. Consider writing a brief observation at each review and allowing exceptions
      to remain visible. At the end, compare the notes before drawing a larger conclusion. This
      approach lets the arrangement become a learning record without requiring each month to produce
      a particular event.


      You can add one brief note from your next review.

      {{en_entries}}
    advice:
      - Review one observation alongside the card description.
    do:
      - Review a note
    dont:
      - Force a match
