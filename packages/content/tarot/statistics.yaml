    body: 本次牌阵提示你：让行动热情配合可持续的速度。火元素（便于讨论行动与热情的象征）被统计为本次主导元素；它侧重启动和推进，不证明你平时总是外向或急切。例如，想同时开始多个新活动时，先挑一个可以完成的体验。建议把自己的期待、可用资源和仍不清楚的地方分别写下；如果其中一项暂时无法核实，就保留这份不确定，先做另一个能够得到回应的小步骤。留意统计只描述本次抽牌，不需要把它扩大成固定身份；同一问题在新的现实条件下，也可能适合另一种观察重点。
    advice:
      - 围绕“让行动热情配合可持续的速度”，选一件具体事项记录前后变化。
    do:
      - 记录事实
    dont:
      - 仓促定论
  en:
    title: A prompt for dominant fire
    summary: You can give enthusiasm a pace you can sustain.
    body:
      You can give enthusiasm a pace you can sustain. Fire is the dominant element recorded for this
      draw, offering a shorthand for initiative and movement. It describes an emphasis here rather
      than a lasting personality. If several new activities appeal at once, one finishable trial may
      express the energy more clearly than accepting everything before you know the demands. Try
      deciding when the trial will finish before you begin it. That boundary lets you enjoy momentum
      without taking on every attractive opportunity. Afterwards, ask whether the activity itself
      remained interesting and whether its demands fitted your day. The count directs attention
      toward initiative; your experience tells you what form of initiative is workable. You can keep
      enthusiasm while changing the size of the commitment.
    advice:
      - Use the theme to ask one specific question, then note what the response changes.
