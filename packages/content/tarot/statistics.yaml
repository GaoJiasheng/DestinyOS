  zh:
    title: 区分角色方式而不是给人物贴标签
    summary: 本次阅读可以关注：区分角色方式而不是给人物贴标签。
    body: 本次牌阵提示你：区分角色方式而不是给人物贴标签。宫廷牌（以侍从、骑士、王后、国王呈现行事方式的牌）至少出现两张，适合比较学习、推进、照料与组织等角色；角色不绑定性别或年龄。例如，同一个人在项目里可以既负责协调，也需要向别人学习。建议先写出一个已经知道的事实和一个仍待确认的条件，再读这张牌的正逆位与类别内容；如果图像暂时没有共鸣，可以保留问题而不强行套用。留意统计只描述本次抽牌，不需要把它扩大成固定身份；同一问题在新的现实条件下，也可能适合另一种观察重点。
    advice:
      - 围绕“区分角色方式而不是给人物贴标签”，选一件具体事项记录前后变化。
    do:
      - 记录事实
    dont:
      - 仓促定论
  en:
    title: A prompt for court roles
    summary: You can compare ways of taking part rather than label particular people.
    body:
      You can compare ways of taking part rather than label particular people. At least two court
      cards appear, inviting attention to roles such as learning, advancing, caring and organising.
      These roles are not assigned by gender or age. The same colleague may coordinate one task and
      need guidance on another, so ask which behaviour helps the present situation. You can ask
      which role is needed at the difficult moment. Perhaps someone must gather questions before
      anyone pushes a decision forward. A person who usually organises could take that listening
      role, while another handles the schedule. Try one such adjustment without assigning permanent
      labels. The cards can help you compare behaviours, and the team's response can show whether a
      particular distribution of responsibilities is useful.
    advice:
      - Use the theme to ask one specific question, then note what the response changes.
    do:
      - Record observations
    dont:
      - Rush conclusions
