    summary: 本次阅读可以关注：允许过程中的用力方式改变。
    body: 本次牌阵提示你：允许过程中的用力方式改变。三张牌阵首尾正逆位不同，提示同一过程可能有外用与内收的不同关注；朝向变化不是由差变好或由好变差的自动判断。例如，一个学习计划可以先对外交流，之后留时间整理笔记，也可以反过来。你可以与最相关的另一张牌比较，但不必让所有细节都讲成同一个故事；先辨认相同之处与差异，再挑出最值得在现实中问清楚的一件事。留意统计只描述本次抽牌，不需要把它扩大成固定身份；同一问题在新的现实条件下，也可能适合另一种观察重点。
