    title: 直接观察过程而不勉强对应人物
    summary: 本次阅读可以关注：直接观察过程而不勉强对应人物。
    body: 本次牌阵提示你：直接观察过程而不勉强对应人物。宫廷牌（强调角色方式的牌）在这次牌阵里不超过一张，读法可以更多关注场景与过程；这不代表问题只有你一个人参与。例如，准备一个共同作品时，可以先看流程是否清楚，再讨论谁来执行。不妨选取画面中一个最接近当前经验的细节，用它提出温和的问题；接着观察一次实际回应，把新的消息记下来，再判断是否需要改变原来的理解。留意统计只描述本次抽牌，不需要把它扩大成固定身份；同一问题在新的现实条件下，也可能适合另一种观察重点。
    advice:
      - 围绕“直接观察过程而不勉强对应人物”，选一件具体事项记录前后变化。
    do:
      - 记录事实
    dont:
      - 仓促定论
  en:
    title: A prompt for court few
    summary: You can focus on the process without assigning each picture to a person.
    body:
      'You can focus on the process without assigning each picture to a person. With no more than
      one court card in this draw, scenes and themes provide much of the material. That does not
      mean you are the only participant. For a shared piece of work, understanding the sequence may
      be more helpful than deciding which card represents each contributor. Try describing the task
      without names first: a request arrives, information is checked and a result is handed over.
      Where does that sequence become unclear? Once the point is visible, ask who can clarify it.
      You can still discuss participants when it helps, but the spread need not supply a portrait of
      each one. Attention to the process may reveal a small agreement everyone can understand.'
    advice:
      - Use the theme to ask one specific question, then note what the response changes.
    do:
      - Record observations
    dont:
      - Rush conclusions
