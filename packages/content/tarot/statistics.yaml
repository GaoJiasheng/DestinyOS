    summary: 本次阅读可以关注：把三张牌中的侧重变化读成过程。
    body: 本次牌阵提示你：把三张牌中的侧重变化读成过程。三张牌阵的首尾元素不同，表示观察角度从一种主题转向另一种；元素（行动、感受、思考与实际安排的分类）变化并不预测具体事件。例如，讨论起初只关心想法，后来发现还需要安排材料时，可以补上实际步骤。建议把自己的期待、可用资源和仍不清楚的地方分别写下；如果其中一项暂时无法核实，就保留这份不确定，先做另一个能够得到回应的小步骤。留意统计只描述本次抽牌，不需要把它扩大成固定身份；同一问题在新的现实条件下，也可能适合另一种观察重点。
    advice:
      - 围绕“把三张牌中的侧重变化读成过程”，选一件具体事项记录前后变化。
    do:
      - 记录事实
    dont:
      - 仓促定论
  en:
    title: A prompt for trend element shift
    summary: You can read a shift in emphasis across the three card sequence.
    body: You can read a shift in emphasis across the three card sequence. The first and last cards
      belong to different elemental groups, so the questions raised at the beginning and end may
      differ. This does not identify an event that must occur. A discussion that begins with ideas
      and later needs materials may simply require a practical step to connect the two. Consider
      identifying the bridge between the two concerns. If ideas need materials, one person could
      check what is available while another clarifies the purpose. A small handover connects the
      stages. You can review whether that connection helps before describing the whole process as a
      transformation. The elemental contrast is useful when it reveals an additional kind of
      attention, not when it becomes a timetable for what will happen.
    advice:
