    title: 外在行动与内部调整可以并行
    summary: 本次阅读可以关注：外在行动与内部调整可以并行。
    body: 本次牌阵提示你：外在行动与内部调整可以并行。逆位（牌面倒转）比例不到六成，读法不必以阻滞为主要主题；正位较多也不意味无需准备，单张牌仍需按位置阅读。例如，推进一次讨论时，可以表达明确提议，同时承认仍有细节要确认。试试将牌面主题改写成一个可以执行的小动作，注明开始与结束的时间；完成后比较自己的感受与事情的实际变化，让反馈决定下一步是否值得继续。留意统计只描述本次抽牌，不需要把它扩大成固定身份；同一问题在新的现实条件下，也可能适合另一种观察重点。
    advice:
      - 围绕“外在行动与内部调整可以并行”，选一件具体事项记录前后变化。
    do:
      - 记录事实
    dont:
      - 仓促定论
  en:
    title: A prompt for reversed low
    summary: You can combine outward movement with room for internal adjustment.
    body: You can combine outward movement with room for internal adjustment. Reversed cards make up
      less than sixty percent here, so delay need not dominate the story. More upright cards do not
      eliminate preparation. In a discussion, offering a clear proposal while naming the detail
      still needing confirmation can be more useful than assuming a smooth path on the basis of
      orientation alone. Try stating both the proposal and the point still open. This gives others
      something specific to respond to without hiding uncertainty behind an optimistic tone. If
      their feedback changes the plan, use it. Outward use and private adjustment can coexist in the
      same process. The count helps set the reading's emphasis, while individual cards and positions
      remain a reason to examine details rather than assume uniform ease.
    advice:
      - Use the theme to ask one specific question, then note what the response changes.
    do:
