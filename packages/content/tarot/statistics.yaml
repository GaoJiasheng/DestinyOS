      - 记录事实
    dont:
      - 仓促定论
  en:
    title: A prompt for missing earth
    summary: You can check the practical support behind a good idea.
    body: You can check the practical support behind a good idea. Earth is absent from this draw's
      elemental count, without providing a financial conclusion. Time, space and materials are
      ordinary conditions you can examine. When a group likes an activity, asking who will arrange
      the venue and preparation may help enthusiasm become an event people can comfortably attend.
      Try making a short preparation list and giving each item an owner. Confirm what is already
      available before adding new purchases or tasks. If the list exceeds the group's capacity,
      reduce the activity instead of expecting enthusiasm to supply the materials. An absent group
      in the draw can prompt this practical check while leaving the actual resources to be
      established through people, places and ordinary arrangements.
    advice:
