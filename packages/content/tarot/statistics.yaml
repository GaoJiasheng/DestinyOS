  zh:
    title: 用朝向对比检视回应方式
    summary: 本次阅读可以关注：用朝向对比检视回应方式。
    body: 本次牌阵提示你：用朝向对比检视回应方式。凯尔特十字的现状与结果牌正逆位不同，读法可对比表达与调整的变化；朝向不能替所有牌位宣布结局，也不表示个人价值起伏。例如，一个最初想尽快推进的问题，可能需要先留出讨论与重新准备的时间。不妨选取画面中一个最接近当前经验的细节，用它提出温和的问题；接着观察一次实际回应，把新的消息记下来，再判断是否需要改变原来的理解。留意统计只描述本次抽牌，不需要把它扩大成固定身份；同一问题在新的现实条件下，也可能适合另一种观察重点。
    advice:
      - 围绕“用朝向对比检视回应方式”，选一件具体事项记录前后变化。
    do:
