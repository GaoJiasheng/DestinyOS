    dont:
      - 仓促定论
  en:
    title: A prompt for present outcome orientation shift
    summary: You can use the contrast in orientation to review a response.
    body:
      You can use the contrast in orientation to review a response. Present and outcome differ here,
      inviting comparison between expression and adjustment rather than a final announcement about
      the situation. Other positions still matter. An issue that initially calls for rapid movement
      may become more workable after a discussion and a fresh preparation interval, without making
      either approach inherently superior. Consider the scale of the response before choosing its
      pace. A short clarification may be enough, while a more involved change could need
      preparation. Compare that need with the action and environmental positions. You can then
      arrange a review point rather than waiting for the final picture to occur. The orientation
      difference supports comparison; it does not evaluate your worth or announce that one approach
      has defeated another.
    advice:
      - Use the theme to ask one specific question, then note what the response changes.
    do:
      - Record observations
    dont:
