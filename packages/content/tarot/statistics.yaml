  en:
    title: A prompt for present outcome element shift
    summary: You can compare the conditions emphasised by present and outcome.
    body: You can compare the conditions emphasised by present and outcome. Their elements differ in
      this Celtic Cross, inviting a question about what kind of attention the process may need to
      add. Keep the foundation, response and environment in view as well. A discussion centred on
      feeling may also need an ordinary practical arrangement before a next step becomes workable.
      You can write the present concern and the possible added condition on separate lines. Then
      look for a position that suggests how to connect them. Perhaps an environmental detail needs
      clarification before an action is realistic. Ask about that detail outside the reading. The
      contrast makes a question visible, while the rest of the spread and the information you obtain
      help determine whether that question is relevant.
