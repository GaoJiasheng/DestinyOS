  zh:
    title: 把阻力拆成可以调整的条件
    summary: 本次阅读可以关注：把阻力拆成可以调整的条件。
    body: 本次牌阵提示你：把阻力拆成可以调整的条件。逆位（牌面倒转）比例至少六成，可以提示内省、延迟或主题使用过度；它不是坏事的数量统计，也不说明所有行动都该停止。例如，一个计划反复推迟时，区分准备不足、消息未到与精力有限三种情况。可以先给这项观察划定范围，只讨论你手上这一件事；把需要别人补充的信息留给直接交流，并在几天后回看自己的记录，不急着扩大为长期判断。留意统计只描述本次抽牌，不需要把它扩大成固定身份；同一问题在新的现实条件下，也可能适合另一种观察重点。
    advice:
      - 围绕“把阻力拆成可以调整的条件”，选一件具体事项记录前后变化。
    do:
      - 记录事实
    dont:
      - 仓促定论
  en:
    title: A prompt for reversed high
    summary: You can separate a difficulty into conditions you can review.
    body:
      You can separate a difficulty into conditions you can review. At least sixty percent of this
      draw is reversed, inviting attention to inward focus, delay or excessive use of a quality.
      This is not a count of bad events. If a plan keeps slipping, distinguish missing preparation
      from unavailable information and limited energy before deciding what kind of adjustment would
      help. Consider giving each obstacle its own response. Preparation may need a checklist,
      missing information a question, and limited energy a smaller commitment. Addressing one at a
      time makes the situation less overwhelming. You can postpone an extra task while continuing a
      necessary one. The orientation count encourages a review of how qualities are operating; it
      does not require you to interpret every inconvenience as a sign of trouble.
    advice:
      - Use the theme to ask one specific question, then note what the response changes.
    do:
      - Record observations
    dont:
      - Rush conclusions
