    - tarot.communication
  exclusive_with: []
  zh:
    title: 大牌较多时先看结构性主题
    summary: 本次阅读可以关注：大牌较多时先看结构性主题。
    body: 本次牌阵提示你：大牌较多时先看结构性主题。大牌（以重要转折与价值问题为主题的牌）占比至少一半，说明本次阅读较集中于方向与整体条件；这不表示你失去选择，也不能据此推断外部事件。例如，换一种协作方式时，先澄清共同目标，再处理日程细节。可以先给这项观察划定范围，只讨论你手上这一件事；把需要别人补充的信息留给直接交流，并在几天后回看自己的记录，不急着扩大为长期判断。留意统计只描述本次抽牌，不需要把它扩大成固定身份；同一问题在新的现实条件下，也可能适合另一种观察重点。
    advice:
      - 围绕“大牌较多时先看结构性主题”，选一件具体事项记录前后变化。
    do:
      - 记录事实
    dont:
      - 仓促定论
  en:
    title: A prompt for major high
    summary: You can begin with the larger framework.
    body:
      You can begin with the larger framework. Major cards focus on broad themes, and at least half
      of this draw belongs to that group. The emphasis may make a question about direction more
      useful than one about isolated details. It does not remove your choices or establish an
      external event. When changing a collaboration, clarifying the shared goal could come before
      adjusting the diary. Try naming the larger condition before choosing a task. What purpose
      brings the participants together, and what would need agreement? Once that is clear, select
      one practical detail you can address. A broad theme becomes useful when it helps you frame an
      ordinary decision. It need not become a claim that forces outside your control are deciding
      everything or that a small action cannot matter.
    advice:
      - Use the theme to ask one specific question, then note what the response changes.
    do:
      - Record observations
    dont:
      - Rush conclusions
  meta:
    author: t23-tarot-editorial-v1
    reviewed_by: null
    version: 1
    status: published
