    dont:
      - 仓促定论
  en:
    title: A prompt for trend orientation shift
    summary: You can allow a process to need different kinds of attention.
    body:
      You can allow a process to need different kinds of attention. The first and last cards in this
      sequence have different orientations, suggesting a contrast between outward use and inward
      adjustment. It is not an automatic movement from good to bad or the reverse. A learning plan
      may need a conversation first and quiet notes later, or the opposite order. Try asking which
      stage benefits from speaking and which benefits from a pause. Arrange those intervals
      deliberately, then notice whether the sequence feels workable. Another person may need a
      different rhythm, so discuss it rather than treating the contrast as a universal rule. You can
      use the orientation change to compare methods while leaving the value of each method dependent
      on the task and the response it receives.
