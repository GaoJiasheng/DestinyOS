    summary: 你可以先为宽泛问题选一个焦点。
    body: 你可以先为宽泛问题选一个焦点。一般类别适用于尚未明确领域的问题；你可以从最关心的事情开始，再把牌面提示改写成可观察的条件，不必让解读同时回应所有生活层面。这次牌阵的各个位置提供不同侧面，需要与问题的实际背景一起看。例如，你觉得近期很忙时，可以先选一项重复安排，看看哪里能够简化。你可以与最相关的另一张牌比较，但不必让所有细节都讲成同一个故事；先辨认相同之处与差异，再挑出最值得在现实中问清楚的一件事。尚未得到回应的部分可以先保留。
    advice:
      - 围绕“先为宽泛问题选一个焦点”，选一件具体事项记录前后变化。
    do:
      - 记录事实
    dont:
      - 仓促定论
  en:
    title: A practical response for general
    summary: You can give a broad question one focus.
    body:
      You can give a broad question one focus. The general category leaves room for an issue whose
      area is not yet clear, without requiring the spread to explain every part of your life. A busy
      week may be easier to examine through one recurring arrangement. Choose that example, then see
      whether the card's theme helps you ask a more concrete question about it. Try turning the
      image into one manageable action with a beginning and an end. Keep the selected category in
      view so the suggestion addresses the right area of your life. After trying it, compare how it
      felt with what actually changed. You may keep part of the idea and discard another part. This
      position offers an organised perspective, while the scale and timing of any response remain
      choices you can make. Keep the original question beside any information you obtain later.
    advice:
      - Use the theme to ask one specific question, then note what the response changes.
    do:
