  exclusive_with: []
  zh:
    title: 把关系问题放回相互表达
    summary: 你可以把关系问题放回相互表达。
    body: 你可以把关系问题放回相互表达。爱情类别关注连接、边界与回应；无论你目前是否有伴侣，都可以从自己愿意表达的需要开始，而不把牌面当成另一人思想的证据。这次牌阵的各个位置提供不同侧面，需要与问题的实际背景一起看。例如，你想增加联系时，可以询问彼此舒服的频率，也给拒绝或调整留空间。建议先写出一个已经知道的事实和一个仍待确认的条件，再读这张牌的正逆位与类别内容；如果图像暂时没有共鸣，可以保留问题而不强行套用。尚未得到回应的部分可以先保留。
    advice:
      - 围绕“把关系问题放回相互表达”，选一件具体事项记录前后变化。
    do:
      - 记录事实
    dont:
      - 仓促定论
  en:
    title: A practical response for love
    summary: You can bring a relationship question back to mutual expression.
    body:
      You can bring a relationship question back to mutual expression. Whether you have a partner or
      are considering a connection, your needs and the other person's choices remain distinct. A
      card cannot establish a private thought. Asking what rhythm of contact feels comfortable may
      give both people more room than interpreting silence as a complete answer. Consider making
      separate notes for your expectation, the resources available and the detail you still cannot
      confirm. Read the image beside those notes rather than as a substitute for them. If one
      condition is outside your control, choose a smaller observation you can make without pressure.
      Return to the question when something changes. That approach makes uncertainty workable and
      keeps your attention on the part of the situation you can understand. Keep the original
      question beside any information you obtain later.
    advice:
      - Use the theme to ask one specific question, then note what the response changes.
    do:
      - Record observations
    dont:
      - Rush conclusions
  meta:
    author: t23-tarot-editorial-v1
    reviewed_by: null
    version: 1
    status: published
