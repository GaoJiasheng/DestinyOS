  en:
    title: A practical response for career
    summary: You can respond to a work question through responsibilities and feedback.
    body: You can respond to a work question through responsibilities and feedback. The category
      concerns tasks, collaboration and learning conditions, while an organisation's decisions
      remain outside the reading. A role is not a complete description of your abilities. Before
      joining a new project, asking about the expected deliverable and available guidance can make a
      first contribution easier to plan. You can compare this card with another relevant position
      while allowing a difference to remain. Note what the two pictures share and where they ask
      different questions. The category you chose helps keep that comparison grounded in everyday
      circumstances. Choose one detail to ask about outside the reading, then review the answer with
      your notes. You need not make every image support one conclusion to learn something useful
      from the arrangement. Keep the original question beside any information you obtain later.
