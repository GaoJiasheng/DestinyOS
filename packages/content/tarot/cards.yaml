      - misallocated resources
  meaningUpright:
    zh: 你可以把新机会落实到可用资源。正位（牌面正常朝向）强调这张牌较容易运用的一面；云中手托着星币，花园小路穿过拱门，远方有山，把主题呈现在可观察的动作中。手中星币与花园入口强调机会需要真实资源才能落地，不承诺财富增长。它与星币十的长期积累不同，仍是一个开端。若逆位安排尚未落实，可以核对材料、时间与责任人，先完成一项实际准备。
    en: You can give a practical opportunity a stable starting place. Upright describes the card's
      ordinary orientation and highlights a quality you may be able to use more openly. A hand
      presents a pentacle above a garden path leading through an arch. The scene offers a concrete
      way to think about the theme, rather than a timetable for an event. The coin and garden
