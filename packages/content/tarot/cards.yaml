  meaningUpright:
    zh: 你可以让希望落在温和的持续行动上。正位（牌面正常朝向）强调这张牌较容易运用的一面；人物在水边倾倒两个水壶，上方有大小星辰，远处有鸟与树，把主题呈现在可观察的动作中。星光与水流强调经历消耗之后重新获得滋养，希望需要温和而持续的动作。星星不同于太阳的清楚显现，这里允许恢复尚未完成。若逆位信心不足，可以记录一个已经发生的小改善，并寻找稳定支持，不强迫自己立刻振作。
    en: You can rebuild confidence through small acts of care. Upright describes the card's ordinary
      orientation and highlights a quality you may be able to use more openly. A figure pours water
      onto land and into a pool beneath a field of stars. The scene offers a concrete way to think
      about the theme, rather than a timetable for an event. The stars and replenishing water
      suggest renewal after depletion. Hope can begin before everything is resolved. Unlike the
      Sun’s open visibility, this scene allows a quieter rebuilding of trust. When confidence is
      low, record a small improvement that has actually occurred and identify a source of steady
      support, rather than demanding immediate enthusiasm from yourself. Consider how hope,
      optimism, openness, certainty, faith show up in this particular situation before deciding
      which next step fits the image.
