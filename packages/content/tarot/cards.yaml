- key: pentacles_05
  number: 5
  arcana: minor
  suit: pentacles
  element: earth
  astrology: mercury_in_taurus
  numerology: 5
  yesNo: maybe
  name:
    zh: 星币五
    en: Five of Pentacles
  keywordsUpright:
    en:
      - poverty
      - destitution
      - need
      - crisis
    zh:
      - 匮乏
      - 困顿
      - 需要
      - 危机
  keywordsReversed:
    zh:
      - 改善
      - 寻求帮助
      - 走出匮乏
    en:
      - improvement
      - seeking help
      - leaving scarcity
  meaningUpright:
    zh: 你可以看见匮乏感之外的求助入口。正位（牌面正常朝向）强调这张牌较容易运用的一面；两个人物走过雪地，旁边亮着嵌有五星币的彩窗，把主题呈现在可观察的动作中。窗内的光与窗外同行者强调困难中仍有求助入口，不据此预报贫困或身体问题。若逆位支持逐渐可用，可以直接问清如何获得协助；也把眼前有限的时间与物品列出，避免匮乏感盖过所有选择。
    en: You can look for accessible support when resources feel scarce. Upright describes the card's
      ordinary orientation and highlights a quality you may be able to use more openly. Two figures
      move through snow beside a lit window containing five pentacles. The scene offers a concrete
      way to think about the theme, rather than a timetable for an event. The lit window and figures
      outside make need and access to support visible together. This is not a prediction of poverty
      or a physical condition. Ask which resource is lacking and whether an available service or
      trusted person can help. If assistance is becoming accessible, clarify how to request it;
      feeling excluded does not establish that every door is closed. Consider how poverty,
      destitution, need, crisis show up in this particular situation before deciding which next step
      fits the image.
  meaningReversed:
    zh: 你可以让逐步改善有可见的支持。逆位（牌面倒转）常提示主题内收、过度或尚未展开；两个人物走过雪地，旁边亮着嵌有五星币的彩窗，原有象征仍在，但需要换一个角度理解。窗内的光与窗外同行者强调困难中仍有求助入口，不据此预报贫困或身体问题。若逆位支持逐渐可用，可以直接问清如何获得协助；也把眼前有限的时间与物品列出，避免匮乏感盖过所有选择。
    en: You may need to acknowledge a small improvement without dismissing remaining needs. Reversed
      means the card is turned upside down; here it invites you to consider a quality that is
      delayed, inward, or being used beyond a helpful limit. Two figures move through snow beside a
      lit window containing five pentacles. Turning the image does not remove its subject, so the
      question is how that subject is operating in your circumstances. The lit window and figures
      outside make need and access to support visible together. This is not a prediction of poverty
      or a physical condition. Ask which resource is lacking and whether an available service or
      trusted person can help. If assistance is becoming accessible, clarify how to request it;
      feeling excluded does not establish that every door is closed.
  imagery:
    zh: 两个人物走过雪地，旁边亮着嵌有五星币的彩窗。窗内的光与窗外同行者强调困难中仍有求助入口，不据此预报贫困或身体问题。若逆位支持逐渐可用，可以直接问清如何获得协助；也把眼前有限的时间与物品列出，避免匮乏感盖过所有选择。
    en:
