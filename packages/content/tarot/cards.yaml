  meaningUpright:
    zh: 你可以看见匮乏感之外的求助入口。正位（牌面正常朝向）强调这张牌较容易运用的一面；两个人物走过雪地，旁边亮着嵌有五星币的彩窗，把主题呈现在可观察的动作中。例如，你可以遇到资源不足时先问可用的公共帮助，从一次具体经历看清自己的需要。建议先确定能承担的范围，再根据反馈调整步调，把牌面提示放回现实条件里。
    en: You can look for accessible support when resources feel scarce. Upright describes the card's
      ordinary orientation and highlights a quality you may be able to use more openly. Two figures
      move through snow beside a lit window containing five pentacles. The scene offers a concrete
      way to think about the theme, rather than a timetable for an event. For example, you might ask
      about shared facilities when a task exceeds the resources you currently have. Notice what that
      experience tells you about your priorities and the resources already within reach. A useful
      reading connects the picture to a situation you recognise; it does not ask you to fit every
      detail into your life. Try choosing a modest action that expresses this quality, and decide
      what feedback would help you review it. You can change the plan as circumstances develop,
      without treating a different outcome as a personal failure.
  meaningReversed:
