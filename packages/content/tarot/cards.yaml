  historySymbolism:
    zh: 这张牌的图像按本项目采用的 Rider–Waite–Smith
      传统阅读。塔罗既有游戏牌传统，也发展出图像解读的方法；这里讨论的是这一图像体系，不将它概括为所有牌组的唯一读法。崖边的小行囊强调轻装开始，也提醒你准备尚不齐全。愚人的开放不同于战车的目标控制：先体验，再决定投入。若逆位对应冒进，补查一个实际条件；若对应迟疑，允许自己先试一次，不必要求起步就成熟。
      学习时可以先描述人物、物件与构图，再把象征联想和现实信息分开；同一画面也可有不同的文化理解。
    en:
      This page reads the image within the Rider–Waite–Smith tradition used by this project. Tarot has
      a playing-card tradition as well as later image-reading practices; this particular visual
      vocabulary does not stand for every deck. A traveller approaches a cliff with a small bag, a
      white rose and an alert dog. The small bag suggests travelling light, while the cliff makes
      incomplete preparation visible. This beginning differs from the Chariot’s organized pursuit of
      a destination. Your first experience can teach you what to bring next. If hesitation is the
      issue, allow one trial; if haste is the issue, check the ground before taking that step.
      Compare this feature with the question you brought to the reading before choosing which part
      of the scene to emphasize. For study, describe the figures, objects, and composition before
      adding an association. Keep symbolic associations separate from facts about your situation,
      and allow room for different cultural readings of the same picture.
- key: major_01_magician
  number: 1
  arcana: major
  suit: null
  element: air
  astrology: mercury
  numerology: 1
  yesNo: yes
  name:
    zh: 魔术师
    en: The Magician
  keywordsUpright:
    en:
      - capability
      - empowerment
      - activity
    zh:
      - 能力
      - 赋能
      - 行动
  keywordsReversed:
    zh:
      - 操控
      - 分心
      - 潜能
    en:
