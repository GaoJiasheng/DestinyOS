    zh: 你可以避免让防御变成尖锐评价。逆位（牌面倒转）常提示主题内收、过度或尚未展开；人物坐在蝶纹宝座上持剑，另一手向前伸出，远处有云，原有象征仍在，但需要换一个角度理解。直立的剑与伸出的手同时呈现边界和接纳，强调清楚表达而仍愿意听见别人。王后不限定性别，也不等于冷酷。若逆位防御变尖锐，可以把事实、感受与要求分开，让直接沟通不必靠贬低对方维持。
    en:
      You may need to separate a useful distinction from a cutting judgement. Reversed means the card
      is turned upside down; here it invites you to consider a quality that is delayed, inward, or
      being used beyond a helpful limit. A seated figure holds a sword upright and extends one hand
      from a decorated throne. Turning the image does not remove its subject, so the question is how
      that subject is operating in your circumstances. The upright sword and extended hand combine a
      boundary with an invitation to speak. Clear discernment need not mean emotional coldness, and
      the role is not assigned by gender. If defensiveness has sharpened the exchange, separate the
      observed fact, your response to it and the request you want to make. Directness can remain
      fair without becoming a verdict about the person.
  imagery:
    zh: 直立的剑与伸出的手同时呈现边界和接纳，强调清楚表达而仍愿意听见别人。王后不限定性别，也不等于冷酷。若逆位防御变尖锐，可以把事实、感受与要求分开，让直接沟通不必靠贬低对方维持。
    en:
      A seated figure holds a sword upright and extends one hand from a decorated throne. The upright
      sword and extended hand combine a boundary with an invitation to speak. Clear discernment need
      not mean emotional coldness, and the role is not assigned by gender. If defensiveness has
      sharpened the exchange, separate the observed fact, your response to it and the request you
      want to make. Directness can remain fair without becoming a verdict about the person.
  advice:
    zh: 试试拒绝请求时说明可提供的范围。完成后记录一个新的发现，用现实反馈决定是否继续，而不是急着给自己贴标签。
    en:
      Try to decline a request by stating the smaller amount of help you can offer. Afterwards, write
      down one observation you did not have before. Use that feedback to decide whether to continue,
      adjust the scale, or ask someone for a clearer understanding.
  byCategory:
    love:
      upright:
        zh: 相处时，你可以把清楚表达与公平倾听并用。王后不限定性别，也不等于冷酷。先问清彼此愿意怎样回应。
        en:
          For your connections, you can state a boundary clearly while listening fairly. The upright sword
          and extended hand combine a boundary with an invitation to speak. Ask which part describes
          your own response, and check the other person’s wishes through a direct conversation.
      reversed:
        zh: 相处时，你可以避免让防御变成尖锐评价。王后不限定性别，也不等于冷酷。先问清彼此愿意怎样回应。
        en:
          For your connections, you can separate a useful distinction from a cutting judgement. The
          upright sword and extended hand combine a boundary with an invitation to speak. Ask which
          part describes your own response, and check the other person’s wishes through a direct
          conversation.
