    zh: 你可以承认旧安排已不再满足需要。正位（牌面正常朝向）强调这张牌较容易运用的一面；人物拄杖离开八个杯子，向山路前行，上方有月亮，把主题呈现在可观察的动作中。背向杯子走向山路，强调原有安排已经不能回应需要，离开不等于否定过去。它与死神的阶段更替不同，重在主动寻找意义。若逆位来回犹豫，可以说清未被满足的一项需要，再比较调整与退出的实际条件。
    en:
      You can move away from a pattern that no longer meets your needs. Upright describes the card's
      ordinary orientation and highlights a quality you may be able to use more openly. A figure
      with a staff walks toward hills beyond eight cups under the moon. The scene offers a concrete
      way to think about the theme, rather than a timetable for an event. The departing figure
      leaves an arrangement that once held value. Moving on does not require declaring the whole
      past worthless. Unlike a broader transition, this card emphasizes a deliberate search for
      something the current situation no longer supplies. If leaving and returning keep alternating,
      name the unmet need and compare what would change through adjustment or through departure.
  meaningReversed:
