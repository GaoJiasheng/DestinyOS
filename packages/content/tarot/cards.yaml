  meaningUpright:
    zh: 你可以使用一致标准整理复杂问题。正位（牌面正常朝向）强调这张牌较容易运用的一面；人物正坐在蝶纹石座上持剑，身后有树与开阔天空，把主题呈现在可观察的动作中。端坐与正持的剑强调使用一致标准处理复杂问题，权威需要接受事实检验。它与宝剑一提出新切口不同，已经进入判断。若逆位标准只约束别人，可以检查是否同样适用于自己，邀请别人指出遗漏的资料。
    en:
      You can use consistent standards to organise a difficult question. Upright describes the card's
      ordinary orientation and highlights a quality you may be able to use more openly. A forward
      facing figure holds a sword on a stone throne with trees behind. The scene offers a concrete
      way to think about the theme, rather than a timetable for an event. The seated posture and
      controlled sword suggest judgment applied through a stable standard. Authority becomes useful
      when its reasoning can be examined. Unlike the Ace of Swords’ new distinction, this role
      concerns an established decision process. If the standard constrains others while exempting
      you, test it on a comparable case and invite someone to identify the information you have
      overlooked.
