    en:
      You may need to bring an avoided detail back into a candid discussion. Reversed means the card
      is turned upside down; here it invites you to consider a quality that is delayed, inward, or
      being used beyond a helpful limit. A figure carries five swords away from tents while two
      remain behind. Turning the image does not remove its subject, so the question is how that
      subject is operating in your circumstances. Imagine trying to ask what you may share before
      using information from another person's notes, then noticing that the process feels less
      straightforward than expected. What specific obstacle, expectation or missing conversation
      makes it difficult? Consider reducing the scale of the next step and checking one assumption
      before you continue. Give yourself room to learn from the response. You do not need to force a
      positive mood or abandon the whole undertaking simply because an adjustment is needed.
