- key: major_10_wheel_of_fortune
  number: 10
  arcana: major
  suit: null
  element: fire
  astrology: jupiter
  numerology: 10
  yesNo: maybe
  name:
    zh: 命运之轮
    en: Wheel of Fortune
  keywordsUpright:
    en:
      - luck
      - randomness
      - cycles
      - karma
      - fate
    zh:
      - 运气
      - 随机
      - 周期
      - 因果
      - 命运
  keywordsReversed:
    zh:
      - 阻力
      - 反复
      - 失序
    en:
      - resistance
      - repetition
      - disorder
  meaningUpright:
    zh: 你可以适应周期而保留调整空间。正位（牌面正常朝向）强调这张牌较容易运用的一面；轮盘周围有上升与下降的人物，四角有持书的翼形生物，把主题呈现在可观察的动作中。轮的转动提醒你区分周期变化与个人可控的动作，不说明好运会自动到来。与世界的完成不同，命运之轮关注环境正在改变。若逆位让你觉得总在追赶，可以重新安排缓冲和备选路径，不把一次节奏失配理解为个人失败。
    en:
      You can work with changing circumstances rather than one fixed schedule. Upright describes the
      card's ordinary orientation and highlights a quality you may be able to use more openly. A
      large wheel is surrounded by ascending and descending figures and four winged readers. The
      scene offers a concrete way to think about the theme, rather than a timetable for an event.
      The wheel directs attention to changing circumstances and recurring phases. It does not
      establish that a favourable turn is about to arrive. Unlike the World’s integration of a
      completed stage, this card concerns adaptation while conditions move. Separate what you can
      schedule from what you must respond to, and keep an alternative when timing depends on other
      people. Consider how luck, randomness, cycles, karma, fate show up in this particular
      situation before deciding which next step fits the image.
  meaningReversed:
