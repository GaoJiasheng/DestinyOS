    en: You can offer warmth with a clear and considerate invitation. Upright describes the card's
      ordinary orientation and highlights a quality you may be able to use more openly. A rider
      holds a cup on a pale horse near a river and hills. The scene offers a concrete way to think
      about the theme, rather than a timetable for an event. For example, you might offer two
      possible meeting times when making a thoughtful invitation. Notice what that experience tells
      you about your priorities and the resources already within reach. A useful reading connects
      the picture to a situation you recognise; it does not ask you to fit every detail into your
