      figures consult a plan. The craftsperson and discussion around the structure connect skill
      with a shared standard. Being busy is different from coordinating expertise. Ask who supplies
      the design, who carries out the work and who checks the result. If collaboration is
      misaligned, review one sample together. A clear division of roles can respect different
      contributions without ranking the people making them. Compare this feature with the question
      you brought to the reading before choosing which part of the scene to emphasize. For study,
      describe the figures, objects, and composition before adding an association. Keep symbolic
      associations separate from facts about your situation, and allow room for different cultural
      readings of the same picture.
