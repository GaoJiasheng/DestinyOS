- key: pentacles_01
  number: 1
  arcana: minor
  suit: pentacles
  element: earth
  astrology: element_earth
  numerology: 1
  yesNo: yes
  name:
    zh: 星币一
    en: Ace of Pentacles
  keywordsUpright:
    en:
      - health
      - wealth
      - practicality
      - receiving
    zh:
      - 健康
      - 丰足
      - 务实
      - 接纳
  keywordsReversed:
    zh:
      - 机会延迟
      - 规划不足
      - 资源错配
