      - 未竟
      - 延迟
      - 停滞
    en:
      - incompletion
      - delay
      - stagnation
  meaningUpright:
    zh: 你可以确认阶段完成并整合所学。正位（牌面正常朝向）强调这张牌较容易运用的一面；人物在椭圆花环内持着双杖，四角有四种生物，把主题呈现在可观察的动作中。例如，你可以交付前整理说明与交接材料，从一次具体经历看清自己的需要。建议先确定能承担的范围，再根据反馈调整步调，把牌面提示放回现实条件里。
    en:
      You can acknowledge completion and carry learning forward. Upright describes the card's ordinary
      orientation and highlights a quality you may be able to use more openly. A figure holding two
      wands stands inside an oval wreath with four creatures at the corners. The scene offers a
      concrete way to think about the theme, rather than a timetable for an event. For example, you
      might prepare handover notes before celebrating a finished assignment. Notice what that
      experience tells you about your priorities and the resources already within reach. A useful
      reading connects the picture to a situation you recognise; it does not ask you to fit every
      detail into your life. Try choosing a modest action that expresses this quality, and decide
      what feedback would help you review it. You can change the plan as circumstances develop,
      without treating a different outcome as a personal failure.
  meaningReversed:
    zh: 你可以检查收尾中尚未落实的细节。逆位（牌面倒转）常提示主题内收、过度或尚未展开；人物在椭圆花环内持着双杖，四角有四种生物，原有象征仍在，但需要换一个角度理解。例如，交付前整理说明与交接材料这件事若让你为难，可以先检查卡在哪里。建议减少一次额外要求，给调整留出时间，再以实际回应判断下一步。
    en:
      You may need to finish loose ends before calling a phase complete. Reversed means the card is
      turned upside down; here it invites you to consider a quality that is delayed, inward, or
      being used beyond a helpful limit. A figure holding two wands stands inside an oval wreath
      with four creatures at the corners. Turning the image does not remove its subject, so the
      question is how that subject is operating in your circumstances. Imagine trying to prepare
      handover notes before celebrating a finished assignment, then noticing that the process feels
      less straightforward than expected. What specific obstacle, expectation or missing
      conversation makes it difficult? Consider reducing the scale of the next step and checking one
      assumption before you continue. Give yourself room to learn from the response. You do not need
      to force a positive mood or abandon the whole undertaking simply because an adjustment is
      needed.
  imagery:
    zh: 人物在椭圆花环内持着双杖，四角有四种生物。你可以先看主体与周围环境的距离，再注意物件和动作之间的联系。画面把抽象主题变成一个可以停下来观察的场景；挑一个最吸引你的细节，联系当前问题即可。
    en:
      A figure holding two wands stands inside an oval wreath with four creatures at the corners. You
      can begin with the central action, then compare it with the surrounding setting. Notice what
      is held, offered, protected or left at a distance. These details give you different entrances
      into the card's theme without requiring a hidden message in every object. Choose one feature
      that catches your attention and ask how it resembles a situation you recognise. Treat that
      resemblance as a starting point for reflection, then check it against your actual experience.
  advice:
    zh: 试试交付前整理说明与交接材料。完成后记录一个新的发现，用现实反馈决定是否继续，而不是急着给自己贴标签。
    en:
      Try to prepare handover notes before celebrating a finished assignment. Afterwards, write down
      one observation you did not have before. Use that feedback to decide whether to continue,
      adjust the scale, or ask someone for a clearer understanding.
  byCategory:
    love:
      upright:
        zh: 相处时，你可以确认阶段完成并整合所学。表达一项真实需要，听完对方的回应再调整步调。用实际反馈调整安排，不急着定论。
        en:
          For your connections, you can acknowledge completion and carry learning forward. Apply this to a
          conversation about contact, boundaries or mutual effort. Ask what each person needs and
          leave time for an answer. Use the response to adjust your next step; keep room for a
          different outcome.
      reversed:
        zh: 相处时，你可以检查收尾中尚未落实的细节。表达一项真实需要，听完对方的回应再调整步调。用实际反馈调整安排，不急着定论。
        en:
          For your connections, you can finish loose ends before calling a phase complete. Apply this to a
          conversation about contact, boundaries or mutual effort. Ask what each person needs and
          leave time for an answer. Use the response to adjust your next step; keep room for a
          different outcome.
    career:
      upright:
        zh: 协作时，你可以确认阶段完成并整合所学。选一个可交付的小任务，先对齐要求再安排进度。用实际反馈调整安排，不急着定论。
        en:
          For your work, you can acknowledge completion and carry learning forward. Apply this to a task
          involving responsibilities, feedback or practical coordination. Agree on one deliverable
          and review it with the people involved. Use the response to adjust your next step; keep
          room for a different outcome.
      reversed:
        zh: 协作时，你可以检查收尾中尚未落实的细节。选一个可交付的小任务，先对齐要求再安排进度。用实际反馈调整安排，不急着定论。
        en:
          For your work, you can finish loose ends before calling a phase complete. Apply this to a task
          involving responsibilities, feedback or practical coordination. Agree on one deliverable
          and review it with the people involved. Use the response to adjust your next step; keep
          room for a different outcome.
    wealth:
      upright:
        zh: 整理资源时，你可以确认阶段完成并整合所学。核对日常收支与可用物品，先照顾近期实际需要。用实际反馈调整安排，不急着定论。
        en:
          For your everyday resources, you can acknowledge completion and carry learning forward. Apply
          this to the time, materials and ordinary expenses available to you. Check what is already
          available before adding another commitment. Use the response to adjust your next step;
          keep room for a different outcome.
      reversed:
        zh: 整理资源时，你可以检查收尾中尚未落实的细节。核对日常收支与可用物品，先照顾近期实际需要。用实际反馈调整安排，不急着定论。
        en:
          For your everyday resources, you can finish loose ends before calling a phase complete. Apply
          this to the time, materials and ordinary expenses available to you. Check what is already
          available before adding another commitment. Use the response to adjust your next step;
          keep room for a different outcome.
    decision:
      upright:
        zh: 比较选择时，你可以确认阶段完成并整合所学。写下两种方案的条件，选一个可撤回的尝试。用实际反馈调整安排，不急着定论。
        en:
          For a choice, you can acknowledge completion and carry learning forward. Apply this to the
          different needs and conditions behind your available options. Compare one shared criterion
          and choose a step you can revise. Use the response to adjust your next step; keep room for
          a different outcome.
      reversed:
        zh: 比较选择时，你可以检查收尾中尚未落实的细节。写下两种方案的条件，选一个可撤回的尝试。用实际反馈调整安排，不急着定论。
        en:
          For a choice, you can finish loose ends before calling a phase complete. Apply this to the
          different needs and conditions behind your available options. Compare one shared criterion
          and choose a step you can revise. Use the response to adjust your next step; keep room for
          a different outcome.
    self:
      upright:
        zh: 独处时，你可以确认阶段完成并整合所学。记录今天的感受与精力，给自己留一段安静时间。用实际反馈调整安排，不急着定论。
        en:
          For your inner life, you can acknowledge completion and carry learning forward. Apply this to
          the space you give your own feelings, learning and attention. Name one need and support it
          with a manageable daily action. Use the response to adjust your next step; keep room for a
          different outcome.
      reversed:
        zh: 独处时，你可以检查收尾中尚未落实的细节。记录今天的感受与精力，给自己留一段安静时间。用实际反馈调整安排，不急着定论。
        en:
          For your inner life, you can finish loose ends before calling a phase complete. Apply this to
          the space you give your own feelings, learning and attention. Name one need and support it
          with a manageable daily action. Use the response to adjust your next step; keep room for a
          different outcome.
    general:
      upright:
        zh: 日常安排中，你可以确认阶段完成并整合所学。把眼前事项拆小，先做能得到具体反馈的一步。用实际反馈调整安排，不急着定论。
        en:
          For your current situation, you can acknowledge completion and carry learning forward. Apply
          this to the ordinary arrangements that shape the question you are asking. Pick one
          observable step and revisit it after receiving feedback. Use the response to adjust your
          next step; keep room for a different outcome.
      reversed:
        zh: 日常安排中，你可以检查收尾中尚未落实的细节。把眼前事项拆小，先做能得到具体反馈的一步。用实际反馈调整安排，不急着定论。
