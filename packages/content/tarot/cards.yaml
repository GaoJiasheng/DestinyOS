    en:
      You may need to allow repair to begin with a manageable conversation. Reversed means the card is
      turned upside down; here it invites you to consider a quality that is delayed, inward, or
      being used beyond a helpful limit. Three swords cross a red heart against clouds and rain.
      Turning the image does not remove its subject, so the question is how that subject is
      operating in your circumstances. Imagine trying to describe what happened before explaining
      how a difficult exchange affected you, then noticing that the process feels less
      straightforward than expected. What specific obstacle, expectation or missing conversation
