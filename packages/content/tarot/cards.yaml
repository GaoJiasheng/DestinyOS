      clear maintenance notes for a project others will need to use later. Notice what that
      experience tells you about your priorities and the resources already within reach. A useful
      reading connects the picture to a situation you recognise; it does not ask you to fit every
      detail into your life. Try choosing a modest action that expresses this quality, and decide
      what feedback would help you review it. You can change the plan as circumstances develop,
      without treating a different outcome as a personal failure.
  meaningReversed:
    zh: 你可以检查舒适惯例与控制欲。逆位（牌面倒转）常提示主题内收、过度或尚未展开；人物坐在葡萄藤与牛纹宝座上，持星币与权杖，城堡在后，原有象征仍在，但需要换一个角度理解。例如，给长期项目保留明确的维护记录这件事若让你为难，可以先检查卡在哪里。建议减少一次额外要求，给调整留出时间，再以实际回应判断下一步。
    en: You may need to question a comfortable routine that leaves too little flexibility. Reversed
      means the card is turned upside down; here it invites you to consider a quality that is
      delayed, inward, or being used beyond a helpful limit. A seated figure holds a pentacle and
      sceptre on a vine covered throne near a castle. Turning the image does not remove its subject,
      so the question is how that subject is operating in your circumstances. Imagine trying to keep
      clear maintenance notes for a project others will need to use later, then noticing that the
      process feels less straightforward than expected. What specific obstacle, expectation or
      missing conversation makes it difficult? Consider reducing the scale of the next step and
      checking one assumption before you continue. Give yourself room to learn from the response.
      You do not need to force a positive mood or abandon the whole undertaking simply because an
      adjustment is needed.
  imagery:
    zh: 人物坐在葡萄藤与牛纹宝座上，持星币与权杖，城堡在后。你可以先看主体与周围环境的距离，再注意物件和动作之间的联系。画面把抽象主题变成一个可以停下来观察的场景；挑一个最吸引你的细节，联系当前问题即可。
    en: A seated figure holds a pentacle and sceptre on a vine covered throne near a castle. You can
      begin with the central action, then compare it with the surrounding setting. Notice what is
      held, offered, protected or left at a distance. These details give you different entrances
      into the card's theme without requiring a hidden message in every object. Choose one feature
      that catches your attention and ask how it resembles a situation you recognise. Treat that
      resemblance as a starting point for reflection, then check it against your actual experience.
  advice:
    zh: 试试给长期项目保留明确的维护记录。完成后记录一个新的发现，用现实反馈决定是否继续，而不是急着给自己贴标签。
    en: Try to keep clear maintenance notes for a project others will need to use later. Afterwards,
      write down one observation you did not have before. Use that feedback to decide whether to
      continue, adjust the scale, or ask someone for a clearer understanding.
