- key: major_14_temperance
  number: 14
  arcana: major
  suit: null
  element: fire
  astrology: sagittarius
  numerology: 14
  yesNo: yes
  name:
    zh: 节制
    en: Temperance
  keywordsUpright:
    en:
      - blending
      - synthesis
      - mediation
      - combination
      - harmony
    zh:
      - 调和
      - 综合
      - 调解
      - 融合
      - 和谐
  keywordsReversed:
    zh:
      - 过度
      - 失衡
      - 急躁
    en:
      - excess
      - imbalance
      - impatience
  meaningUpright:
    zh: 你可以用适量调整找到可持续节奏。正位（牌面正常朝向）强调这张牌较容易运用的一面；有翼人物在两个杯子间倒水，一脚在水中一脚在岸上，远方有小路，把主题呈现在可观察的动作中。两只杯之间的水流强调调配与整合，一脚在水一脚在地让感受与实际条件相接。节制不是无限忍让。若逆位出现两端摆动，可以只调整一个比例或日程间隔，观察是否更可持续，而非一次彻底改动生活。
    en: You can combine different needs through patient adjustment. Upright describes the card's
      ordinary orientation and highlights a quality you may be able to use more openly. A winged
      figure pours water between cups with one foot on land and one in water. The scene offers a
      concrete way to think about the theme, rather than a timetable for an event. The water moving
      between cups makes adjustment and integration visible. One foot in water and one on land
      connects experience with practical footing. Moderation is not the same as accepting unlimited
      demands. If you keep alternating between extremes, change one proportion or interval and
      observe the effect before reorganizing the whole routine around a new ideal. Consider how
      blending, synthesis, mediation, combination, harmony show up in this particular situation
      before deciding which next step fits the image.
  meaningReversed:
    zh: 你可以检查两端摆动造成的失衡。逆位（牌面倒转）常提示主题内收、过度或尚未展开；有翼人物在两个杯子间倒水，一脚在水中一脚在岸上，远方有小路，原有象征仍在，但需要换一个角度理解。两只杯之间的水流强调调配与整合，一脚在水一脚在地让感受与实际条件相接。节制不是无限忍让。若逆位出现两端摆动，可以只调整一个比例或日程间隔，观察是否更可持续，而非一次彻底改动生活。
    en:
      You may need to reduce swings between extremes that drain attention. Reversed means the card is
      turned upside down; here it invites you to consider a quality that is delayed, inward, or
      being used beyond a helpful limit. A winged figure pours water between cups with one foot on
      land and one in water. Turning the image does not remove its subject, so the question is how
      that subject is operating in your circumstances. The water moving between cups makes
      adjustment and integration visible. One foot in water and one on land connects experience with
      practical footing. Moderation is not the same as accepting unlimited demands. If you keep
      alternating between extremes, change one proportion or interval and observe the effect before
      reorganizing the whole routine around a new ideal.
  imagery:
    zh: 两只杯之间的水流强调调配与整合，一脚在水一脚在地让感受与实际条件相接。节制不是无限忍让。若逆位出现两端摆动，可以只调整一个比例或日程间隔，观察是否更可持续，而非一次彻底改动生活。
    en: A winged figure pours water between cups with one foot on land and one in water. The water
      moving between cups makes adjustment and integration visible. One foot in water and one on
      land connects experience with practical footing. Moderation is not the same as accepting
      unlimited demands. If you keep alternating between extremes, change one proportion or interval
      and observe the effect before reorganizing the whole routine around a new ideal. Compare this
      feature with the question you brought to the reading before choosing which part of the scene
      to emphasize.
  advice:
    zh: 试试把密集学习改成每天一小段。完成后记录一个新的发现，用现实反馈决定是否继续，而不是急着给自己贴标签。
    en:
      Try to replace an occasional marathon with a short practice session each day. Afterwards, write
      down one observation you did not have before. Use that feedback to decide whether to continue,
      adjust the scale, or ask someone for a clearer understanding.
  byCategory:
    love:
      upright:
        zh: 相处时，你可以用适量调整找到可持续节奏。节制不是无限忍让。先问清彼此愿意怎样回应。
        en:
          For your connections, you can combine different needs through patient adjustment. The water
          moving between cups makes adjustment and integration visible. Ask which part describes
          your own response, and check the other person’s wishes through a direct conversation. One
