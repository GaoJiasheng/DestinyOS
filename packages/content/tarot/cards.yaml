    zh: 你可以承认受伤的感受并说清需要。正位（牌面正常朝向）强调这张牌较容易运用的一面；三把剑穿过红心，背景有云层与雨线，把主题呈现在可观察的动作中。例如，你可以失望时先说事实再说自己的感受，从一次具体经历看清自己的需要。建议先确定能承担的范围，再根据反馈调整步调，把牌面提示放回现实条件里。
    en: You can acknowledge hurt and make your needs understandable. Upright describes the card's
      ordinary orientation and highlights a quality you may be able to use more openly. Three swords
      cross a red heart against clouds and rain. The scene offers a concrete way to think about the
      theme, rather than a timetable for an event. For example, you might describe what happened
      before explaining how a difficult exchange affected you. Notice what that experience tells you
      about your priorities and the resources already within reach. A useful reading connects the
      picture to a situation you recognise; it does not ask you to fit every detail into your life.
      Try choosing a modest action that expresses this quality, and decide what feedback would help
      you review it. You can change the plan as circumstances develop, without treating a different
      outcome as a personal failure.
  meaningReversed:
