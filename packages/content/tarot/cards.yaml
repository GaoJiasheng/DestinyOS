- key: major_12_hanged_man
  number: 12
  arcana: major
  suit: null
  element: water
  astrology: neptune
  numerology: 12
  yesNo: maybe
  name:
    zh: 倒吊人
    en: The Hanged Man
  keywordsUpright:
    en:
      - enlightenment
      - sacrifice
      - perspective
      - suspension
      - reversals
    zh:
      - 觉悟
      - 付出
      - 视角
      - 暂停
      - 逆转
