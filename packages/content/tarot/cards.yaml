        zh: 日常安排中，你可以让实际照料兼顾自己与环境。王后照看星币，周围的植物把照料连接到真实环境与资源。联系当前一件具体事情。
        en:
          For your current situation, you can offer practical care that includes your own needs. The
          Queen’s attention to the pentacle and living surroundings connects care with practical
          conditions. Choose one present situation where this distinction matters, and check what a
          useful next response would require.
      reversed:
        zh: 日常安排中，你可以减少照顾事务对个人空间的挤压。这个角色不限定性别，也不要求无限付出。联系当前一件具体事情。
        en:
          For your current situation, you can rebalance care when the everyday workload falls on one
          person. The Queen’s attention to the pentacle and living surroundings connects care with
          practical conditions. Choose one present situation where this distinction matters, and
          check what a useful next response would require.
  historySymbolism:
    zh: 这张牌的图像按本项目采用的 Rider–Waite–Smith
      传统阅读。塔罗既有游戏牌传统，也发展出图像解读的方法；这里讨论的是这一图像体系，不将它概括为所有牌组的唯一读法。人物坐在花木间低头看星币，脚边有兔，座椅饰有果实。王后照看星币，周围的植物把照料连接到真实环境与资源。这个角色不限定性别，也不要求无限付出。若逆位事务挤占个人空间，可以把必要照料与额外要求分开，邀请参与者共同维护日常。
      学习时可以先描述人物、物件与构图，再把象征联想和现实信息分开；同一画面也可有不同的文化理解。
    en:
      This page reads the image within the Rider–Waite–Smith tradition used by this project. Tarot has
      a playing-card tradition as well as later image-reading practices; this particular visual
      vocabulary does not stand for every deck. A seated figure studies a pentacle among plants with
      a rabbit near the feet. The Queen’s attention to the pentacle and living surroundings connects
      care with practical conditions. Anyone can occupy this role; it does not require unlimited
      availability. Unlike purely emotional support, the focus is on making daily life workable. If
      maintenance has consumed your own space, distinguish essential care from additional demands
      and invite the people benefiting from the arrangement to share its upkeep. For study, describe
      the figures, objects, and composition before adding an association. Keep symbolic associations
      separate from facts about your situation, and allow room for different cultural readings of
      the same picture.
- key: pentacles_king
  number: 14
  arcana: minor
  suit: pentacles
  element: earth
  astrology: virgo
  numerology: 14
  yesNo: yes
  name:
    zh: 星币国王
    en: King of Pentacles
  keywordsUpright:
    en:
      - stability
      - dependability
      - confidence
      - intervention
    zh:
      - 稳定
      - 可靠
      - 信心
      - 干预
  keywordsReversed:
    zh:
      - 贪念
      - 僵化
      - 控制欲
    en:
      - greed
      - rigidity
      - need for control
  meaningUpright:
    zh: 你可以以稳健管理支持可靠的成果。正位（牌面正常朝向）强调这张牌较容易运用的一面；人物坐在葡萄藤与牛纹宝座上，持星币与权杖，城堡在后，把主题呈现在可观察的动作中。稳定座位与繁茂环境强调成熟的资源管理，可靠来自维护而非占有。它与皇帝建立边界不同，更关注制度运行后的质量。若逆位习惯或控制压过用途，可以检查资源是否真正被需要的人使用，说明共享和交接的条件。
    en:
      You can manage practical resources in a dependable way. Upright describes the card's ordinary
      orientation and highlights a quality you may be able to use more openly. A seated figure holds
      a pentacle and sceptre on a vine covered throne near a castle. The scene offers a concrete way
      to think about the theme, rather than a timetable for an event. The stable seat and abundant
      setting emphasize resources managed over time. Reliability comes through maintenance rather
      than possession alone. Compared with the Emperor’s establishment of a framework, this role
      asks how well that framework now serves people. If comfortable routines or control have
      displaced usefulness, check who can actually access the resources and make the conditions of
      sharing and handover clear.
  meaningReversed:
    zh: 你可以检查舒适惯例与控制欲。逆位（牌面倒转）常提示主题内收、过度或尚未展开；人物坐在葡萄藤与牛纹宝座上，持星币与权杖，城堡在后，原有象征仍在，但需要换一个角度理解。稳定座位与繁茂环境强调成熟的资源管理，可靠来自维护而非占有。它与皇帝建立边界不同，更关注制度运行后的质量。若逆位习惯或控制压过用途，可以检查资源是否真正被需要的人使用，说明共享和交接的条件。
    en: You may need to question a comfortable routine that leaves too little flexibility. Reversed
      means the card is turned upside down; here it invites you to consider a quality that is
      delayed, inward, or being used beyond a helpful limit. A seated figure holds a pentacle and
      sceptre on a vine covered throne near a castle. Turning the image does not remove its subject,
      so the question is how that subject is operating in your circumstances. The stable seat and
      abundant setting emphasize resources managed over time. Reliability comes through maintenance
      rather than possession alone. Compared with the Emperor’s establishment of a framework, this
      role asks how well that framework now serves people. If comfortable routines or control have
      displaced usefulness, check who can actually access the resources and make the conditions of
      sharing and handover clear.
  imagery:
    zh: 人物坐在葡萄藤与牛纹宝座上，持星币与权杖，城堡在后。稳定座位与繁茂环境强调成熟的资源管理，可靠来自维护而非占有。它与皇帝建立边界不同，更关注制度运行后的质量。
    en:
      A seated figure holds a pentacle and sceptre on a vine covered throne near a castle. The stable
      seat and abundant setting emphasize resources managed over time. Reliability comes through
      maintenance rather than possession alone. Compared with the Emperor’s establishment of a
      framework, this role asks how well that framework now serves people. If comfortable routines
      or control have displaced usefulness, check who can actually access the resources and make the
      conditions of sharing and handover clear.
  advice:
    zh: 试试给长期项目保留明确的维护记录。完成后记录一个新的发现，用现实反馈决定是否继续，而不是急着给自己贴标签。
    en: Try to keep clear maintenance notes for a project others will need to use later. Afterwards,
      write down one observation you did not have before. Use that feedback to decide whether to
      continue, adjust the scale, or ask someone for a clearer understanding.
  byCategory:
    love:
      upright:
        zh: 相处时，你可以以稳健管理支持可靠的成果。它与皇帝建立边界不同，更关注制度运行后的质量。先问清彼此愿意怎样回应。
        en:
          For your connections, you can manage practical resources in a dependable way. The stable seat
          and abundant setting emphasize resources managed over time. Ask which part describes your
          own response, and check the other person’s wishes through a direct conversation.
      reversed:
        zh: 相处时，你可以检查舒适惯例与控制欲。稳定座位与繁茂环境强调成熟的资源管理，可靠来自维护而非占有。先问清彼此愿意怎样回应。
        en:
