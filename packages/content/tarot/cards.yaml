    zh: 你可以承认疲惫同时保护已有成果。正位（牌面正常朝向）强调这张牌较容易运用的一面；头缠绷带的人物扶着木杖，后方八根木杖排成屏障，把主题呈现在可观察的动作中。受伤但仍守在杖前的人，强调经过消耗后的警觉与坚持，不要求持续硬撑。它与权杖七即时防守不同，带着已有经验。若逆位过度戒备，可以区分真正需要检查的条件与旧经历留下的预期，并安排明确的休息。
    en: You can protect what you have built while recognising fatigue. Upright describes the card's
      ordinary orientation and highlights a quality you may be able to use more openly. A bandaged
      figure holds a wand before a row of eight standing wands. The scene offers a concrete way to
      think about the theme, rather than a timetable for an event. The guarded figure brings
      experience and fatigue to the boundary. Persistence has a history here, unlike the Seven of
      Wands’ more immediate defence. Past difficulty can inform preparation without making every new
      request a threat. Identify the condition that actually needs checking. If vigilance has become
      constant, schedule a handover or rest interval rather than asking yourself to remain alert
      indefinitely.
