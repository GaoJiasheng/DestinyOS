    zh: 你可以把事实与责任放在同一张表上。正位（牌面正常朝向）强调这张牌较容易运用的一面；人物坐在双柱之间，一手持剑一手持天平，后方有帷幕，把主题呈现在可观察的动作中。秤与直立的剑把衡量和判断放在一起，强调信息、标准与责任的一致。正义不是法律结论。若逆位显示只听到一方说法，可以补齐遗漏的事实，并区分行为与对人的评价，再提出可以执行的修正。
