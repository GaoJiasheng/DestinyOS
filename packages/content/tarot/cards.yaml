- key: major_06_lovers
  number: 6
  arcana: major
  suit: null
  element: air
  astrology: gemini
  numerology: 6
  yesNo: yes
  name:
    zh: 恋人
    en: The Lovers
  keywordsUpright:
    en:
      - love
      - passion
      - unity
      - choice
    zh:
      - 爱
      - 热情
      - 统一
      - 选择
  keywordsReversed:
    zh:
      - 分歧
      - 犹豫
      - 失衡
    en:
      - discord
      - hesitation
      - imbalance
  meaningUpright:
    zh: 你可以让选择与重视的价值一致。正位（牌面正常朝向）强调这张牌较容易运用的一面；两个人物站在山前，天使在上方，身后分别有果树与火焰树，把主题呈现在可观察的动作中。两个人与上方的天使把吸引连接到价值选择；关系需要彼此自愿回应。恋人不同于圣杯二只强调互动，也涉及选择后愿意承担什么。若逆位出现偏好与承诺不一致，先说清自己的选择依据，不替对方决定感受或进度。
    en: You can choose in line with values you can name. Upright describes the card's ordinary
      orientation and highlights a quality you may be able to use more openly. Two figures stand
      beneath an angel with a mountain and two contrasting trees behind them. The scene offers a
      concrete way to think about the theme, rather than a timetable for an event. The two figures
      make attraction visible, while the wider scene raises a question about values and commitment.
      Unlike the Two of Cups’ immediate exchange, the Lovers asks what a meaningful choice requires
      you to stand behind. Clarify your own priorities and ask about the other person’s. Neither
      orientation determines someone else’s feelings or willingness to commit. Consider how love,
      passion, unity, choice show up in this particular situation before deciding which next step
      fits the image.
