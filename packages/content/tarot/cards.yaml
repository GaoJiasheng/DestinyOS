  yesNo: maybe
  name:
    zh: 圣杯四
    en: Four of Cups
  keywordsUpright:
    en:
      - boredom
      - listlessness
      - lethargy
      - stability
      - ingratitude
    zh:
      - 无聊
      - 倦怠
      - 疲乏
      - 稳定
      - 不知感恩
  keywordsReversed:
    zh:
      - 重新投入
      - 觉察
      - 摆脱倦怠
    en:
      - renewed engagement
      - awareness
      - leaving apathy
  meaningUpright:
    zh: 你可以区分需要休息与错过机会。正位（牌面正常朝向）强调这张牌较容易运用的一面；人物坐在树下望着三个杯子，云中手递来第四杯，把主题呈现在可观察的动作中。坐着的人看向地面，未接到旁边递来的杯，强调休整、厌倦与未被注意的选项。它不证明你不知感恩。若逆位开始重新接触外界，可以只回应一个合适邀请，也先确认自己需要的是新刺激还是安静。
    en: You can pause long enough to understand your lack of interest. Upright describes the card's
      ordinary orientation and highlights a quality you may be able to use more openly. A seated
      figure faces three cups while a hand offers another from a cloud. The scene offers a concrete
      way to think about the theme, rather than a timetable for an event. The seated figure has not
      taken the offered cup. The scene leaves room for rest, disinterest and an opportunity that has
      not been noticed; it does not establish ingratitude. Unlike the Five of Cups, the emphasis is
      not a named loss. If you are ready to re-engage, respond to one suitable invitation and check
      whether you want novelty or recovery.
