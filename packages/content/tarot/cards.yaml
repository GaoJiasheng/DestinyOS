    zh: 你可以暂停熟悉做法以看见新角度。正位（牌面正常朝向）强调这张牌较容易运用的一面；人物单脚倒挂在木架上，另一条腿弯曲，头部周围有光环，把主题呈现在可观察的动作中。悬挂姿势与平静表情强调主动换角度，而非所有等待都值得。倒吊人与宝剑四的休整不同：它邀请你检查原来的理解方式。若逆位只是耗着不动，可以说清暂停要弄懂什么、何时回看，让让步有目的和边界。
