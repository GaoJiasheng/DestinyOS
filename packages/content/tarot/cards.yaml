      - distraction
      - potential
  meaningUpright:
    zh: 你可以把已有工具组合起来。正位（牌面正常朝向）强调这张牌较容易运用的一面；桌上摆放四种花色的器物，一手指天一手指地，头顶有无限符号，把主题呈现在可观察的动作中。桌上的四种工具表示已有资源需要被实际调用，举手与指地把构想接到操作。魔术师侧重“做出来”，不同于权杖一只有萌芽。若逆位出现说得多做得少，先展示一个可核对的小成果，再讨论更大的承诺。
    en:
      You can use skills you already have together. Upright describes the card's ordinary orientation
      and highlights a quality you may be able to use more openly. Four suit objects lie on a table
      beneath a figure pointing upward and downward. The scene offers a concrete way to think about
      the theme, rather than a timetable for an event. The tools on the table matter because they
      can be used, rather than merely displayed. The raised and lowered hands connect intention with
      execution. Unlike the first spark of the Ace of Wands, this card asks how available skills
      work together. Check a claim of ability through one completed demonstration before relying on
      a larger promise. Consider how capability, empowerment, activity show up in this particular
      situation before deciding which next step fits the image.
  meaningReversed:
    zh: 你可以核对说法与实际能力。逆位（牌面倒转）常提示主题内收、过度或尚未展开；桌上摆放四种花色的器物，一手指天一手指地，头顶有无限符号，原有象征仍在，但需要换一个角度理解。桌上的四种工具表示已有资源需要被实际调用，举手与指地把构想接到操作。魔术师侧重“做出来”，不同于权杖一只有萌芽。若逆位出现说得多做得少，先展示一个可核对的小成果，再讨论更大的承诺。
    en:
      You may need to check the distance between presentation and delivery. Reversed means the card is
      turned upside down; here it invites you to consider a quality that is delayed, inward, or
      being used beyond a helpful limit. Four suit objects lie on a table beneath a figure pointing
      upward and downward. Turning the image does not remove its subject, so the question is how
      that subject is operating in your circumstances. The tools on the table matter because they
      can be used, rather than merely displayed. The raised and lowered hands connect intention with
      execution. Unlike the first spark of the Ace of Wands, this card asks how available skills
      work together. Check a claim of ability through one completed demonstration before relying on
      a larger promise.
  imagery:
    zh: 桌上摆放四种花色的器物，一手指天一手指地，头顶有无限符号。桌上的四种工具表示已有资源需要被实际调用，举手与指地把构想接到操作。魔术师侧重“做出来”，不同于权杖一只有萌芽。
