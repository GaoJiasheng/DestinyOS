      传统阅读。塔罗既有游戏牌传统，也发展出图像解读的方法；这里讨论的是这一图像体系，不将它概括为所有牌组的唯一读法。人物站在高处持杖，下方六根木杖向上伸来。高处的人面对下方的杖，强调保卫已有立场，需要选择值得回应的挑战。它不同于权杖五的多人试探。若逆位防守疲惫，可以减少必须争辩的事项，保留一条重要边界，并说明自己愿意协商的范围。
      学习时可以先描述人物、物件与构图，再把象征联想和现实信息分开；同一画面也可有不同的文化理解。
    en:
      This page reads the image within the Rider–Waite–Smith tradition used by this project. Tarot has
      a playing-card tradition as well as later image-reading practices; this particular visual
      vocabulary does not stand for every deck. A figure holds one wand from higher ground against
      six approaching wands. The figure holds higher ground while meeting pressure from below. The
      theme is defending a position already taken, rather than joining every contest. Unlike the
      Five of Wands, not every disagreement here deserves equal attention. Choose the boundary that
      matters most. If constant defence is exhausting, reduce the number of arguments you enter and
      state what remains open to negotiation. Compare this feature with the question you brought to
      the reading before choosing which part of the scene to emphasize. For study, describe the
      figures, objects, and composition before adding an association. Keep symbolic associations
      separate from facts about your situation, and allow room for different cultural readings of
      the same picture.
- key: wands_08
  number: 8
  arcana: minor
  suit: wands
  element: fire
  astrology: mercury_in_sagittarius
  numerology: 8
  yesNo: yes
  name:
    zh: 权杖八
    en: Eight of Wands
  keywordsUpright:
    en:
      - speed
      - swiftness
      - responsiveness
      - change
    zh:
      - 速度
      - 迅速
      - 回应
      - 变化
  keywordsReversed:
    zh:
      - 延迟
      - 阻力
      - 混乱
    en:
      - delay
      - resistance
      - confusion
  meaningUpright:
    zh: 你可以为迅速到来的消息安排顺序。正位（牌面正常朝向）强调这张牌较容易运用的一面；八根木杖掠过天空，下面是河流与远方的屋舍，把主题呈现在可观察的动作中。飞行中的八根杖强调进度、消息与衔接速度，没有人物不等于不用协调。与战车的掌舵不同，这里更像已经发出的行动集中到达。若逆位有延迟，可以核对接收、排序与确认，避免再用更多消息增加混乱。
    en: You can organise a burst of movement or information. Upright describes the card's ordinary
      orientation and highlights a quality you may be able to use more openly. Eight wands cross
      open sky above a river and distant buildings. The scene offers a concrete way to think about
      the theme, rather than a timetable for an event. The moving wands emphasize pace, messages and
      transitions already underway. The absence of a visible person does not remove the need for
      coordination. Unlike the Chariot’s steering, this card asks how you handle several
      developments arriving close together. Confirm what has been received and what needs a reply.
      If movement stalls, inspect the sequence before adding another urgent message. Consider how
      speed, swiftness, responsiveness, change show up in this particular situation before deciding
      which next step fits the image.
  meaningReversed:
    zh: 你可以核对延迟与误会的具体环节。逆位（牌面倒转）常提示主题内收、过度或尚未展开；八根木杖掠过天空，下面是河流与远方的屋舍，原有象征仍在，但需要换一个角度理解。飞行中的八根杖强调进度、消息与衔接速度，没有人物不等于不用协调。与战车的掌舵不同，这里更像已经发出的行动集中到达。若逆位有延迟，可以核对接收、排序与确认，避免再用更多消息增加混乱。
    en: You may need to check the source of delays before pushing harder. Reversed means the card is
      turned upside down; here it invites you to consider a quality that is delayed, inward, or
      being used beyond a helpful limit. Eight wands cross open sky above a river and distant
      buildings. Turning the image does not remove its subject, so the question is how that subject
      is operating in your circumstances. The moving wands emphasize pace, messages and transitions
      already underway. The absence of a visible person does not remove the need for coordination.
      Unlike the Chariot’s steering, this card asks how you handle several developments arriving
      close together. Confirm what has been received and what needs a reply. If movement stalls,
      inspect the sequence before adding another urgent message.
  imagery:
    zh: 八根木杖掠过天空，下面是河流与远方的屋舍。飞行中的八根杖强调进度、消息与衔接速度，没有人物不等于不用协调。与战车的掌舵不同，这里更像已经发出的行动集中到达。
    en:
      Eight wands cross open sky above a river and distant buildings. The moving wands emphasize pace,
      messages and transitions already underway. The absence of a visible person does not remove the
      need for coordination. Unlike the Chariot’s steering, this card asks how you handle several
      developments arriving close together. Confirm what has been received and what needs a reply.
      If movement stalls, inspect the sequence before adding another urgent message. Compare this
      feature with the question you brought to the reading before choosing which part of the scene
