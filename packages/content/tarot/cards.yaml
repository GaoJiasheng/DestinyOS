  meaningUpright:
    zh: 你可以培育可分享的情感安全感。正位（牌面正常朝向）强调这张牌较容易运用的一面；两个人物仰望杯子构成的彩虹，孩子在旁活动，远方有家园，把主题呈现在可观察的动作中。例如，你可以和重要的人约定一次没有打扰的相处，从一次具体经历看清自己的需要。建议先确定能承担的范围，再根据反馈调整步调，把牌面提示放回现实条件里。
    en: You can nurture a sense of belonging people can share. Upright describes the card's ordinary
      orientation and highlights a quality you may be able to use more openly. Figures look toward a
      rainbow of ten cups while children move nearby. The scene offers a concrete way to think about
      the theme, rather than a timetable for an event. For example, you might plan an undistracted
      hour with people whose company helps you feel at home. Notice what that experience tells you
      about your priorities and the resources already within reach. A useful reading connects the
      picture to a situation you recognise; it does not ask you to fit every detail into your life.
      Try choosing a modest action that expresses this quality, and decide what feedback would help
      you review it. You can change the plan as circumstances develop, without treating a different
      outcome as a personal failure.
  meaningReversed:
    zh: 你可以允许理想图景与现实有差距。逆位（牌面倒转）常提示主题内收、过度或尚未展开；两个人物仰望杯子构成的彩虹，孩子在旁活动，远方有家园，原有象征仍在，但需要换一个角度理解。例如，和重要的人约定一次没有打扰的相处这件事若让你为难，可以先检查卡在哪里。建议减少一次额外要求，给调整留出时间，再以实际回应判断下一步。
    en: You may need to talk about the difference between an ideal and everyday experience. Reversed
      means the card is turned upside down; here it invites you to consider a quality that is
      delayed, inward, or being used beyond a helpful limit. Figures look toward a rainbow of ten
      cups while children move nearby. Turning the image does not remove its subject, so the
      question is how that subject is operating in your circumstances. Imagine trying to plan an
      undistracted hour with people whose company helps you feel at home, then noticing that the
