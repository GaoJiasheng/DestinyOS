      resource is lacking and whether an available service or trusted person can help. If assistance
      is becoming accessible, clarify how to request it; feeling excluded does not establish that
      every door is closed. Compare this feature with the question you brought to the reading before
      choosing which part of the scene to emphasize. For study, describe the figures, objects, and
      composition before adding an association. Keep symbolic associations separate from facts about
      your situation, and allow room for different cultural readings of the same picture.
