  meaningUpright:
    zh: 你可以为阶段结束腾出新的空间。正位（牌面正常朝向）强调这张牌较容易运用的一面；骑白马的骨架人物举着白花黑旗，远处双塔间有初升的太阳，把主题呈现在可观察的动作中。画面中的不同人物面对同一转变，强调阶段结束带来的重新安排，不预测身体事件。与塔的突然破裂相比，这张牌关注告别和更替。若逆位对应拖延，可以先完成一项具体收尾，保留珍惜的经验，同时停止已经无用的投入。
    en: You can close an exhausted chapter so another can take shape. Upright describes the card's
      ordinary orientation and highlights a quality you may be able to use more openly. An armoured
      skeletal rider carries a black flag with a white flower toward a distant sunrise. The scene
      offers a concrete way to think about the theme, rather than a timetable for an event. The
      figures encounter the same transition from different positions. The theme is an ending that
      changes an arrangement, rather than a prediction about physical events. Compared with the
      Tower’s sudden disruption, this card emphasizes relinquishing a stage that has run its course.
      Complete one unfinished handover and decide what experience you want to carry forward into the
      next arrangement.
