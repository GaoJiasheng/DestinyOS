    en: You can maintain progress through reliable and measured effort. Upright describes the card's
      ordinary orientation and highlights a quality you may be able to use more openly. A rider on a
      still dark horse holds a pentacle beside a worked field. The scene offers a concrete way to
      think about the theme, rather than a timetable for an event. The stationary horse and held
      pentacle emphasize preparation and dependable execution. A measured pace is different from
      doing nothing. Compared with the Knight of Wands’ energetic pursuit, this role concerns
      showing up repeatedly with what the task needs. If the routine has become mechanical, remove
      an obsolete check or update a step while preserving the reliability that makes the work
      usable.
  meaningReversed:
    zh: 你可以给机械重复补上调整空间。逆位（牌面倒转）常提示主题内收、过度或尚未展开；骑士骑着静立的黑马托着星币，后方是耕过的田地，原有象征仍在，但需要换一个角度理解。静止而准备充分的坐骑强调可靠执行，慢不等于停滞。它与权杖骑士的冲劲不同，更重在重复兑现。若逆位习惯变机械，可以删去一个无用检查或更新步骤，保留稳定节奏，也让方法适应实际需要。
    en:
      You may need to adjust a routine that is becoming rigid or stalled. Reversed means the card is
