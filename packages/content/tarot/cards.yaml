  advice:
    zh: 试试集中回复消息时先标出紧急事项。完成后记录一个新的发现，用现实反馈决定是否继续，而不是急着给自己贴标签。
    en:
      Try to sort a full inbox by the action each message actually requires. Afterwards, write down
