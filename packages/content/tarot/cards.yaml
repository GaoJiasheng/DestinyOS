      - insecurity
  meaningUpright:
    zh: 你可以维护资源同时留出适当流动。正位（牌面正常朝向）强调这张牌较容易运用的一面；人物脚踏两币怀抱一币，另一币立在头上，城镇在后，把主题呈现在可观察的动作中。星币贴近身体、脚下与头顶，强调安全感通过保留资源获得，也可能限制流动。若逆位想放松控制，可以先释放一项可承担的资源；若突然过度放手，则核对基本需要，保留照顾自己的边界。
    en:
      You can protect resources without closing every opening. Upright describes the card's ordinary
      orientation and highlights a quality you may be able to use more openly. A seated figure holds
      a pentacle with others beneath the feet and above the head. The scene offers a concrete way to
      think about the theme, rather than a timetable for an event. The coins are held close across
      the figure’s body. Retention can protect stability while also reducing room for exchange.
      Unlike the Two of Pentacles’ flexible rotation, this scene asks what is being secured. If you
      want to loosen control, release a manageable amount first. If resources are being relinquished
      too quickly, check basic needs before calling every act of holding on a problem.
  meaningReversed:
