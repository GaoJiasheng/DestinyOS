      - reassessment
  meaningUpright:
    zh: 你可以用阶段观察评估长期投入。正位（牌面正常朝向）强调这张牌较容易运用的一面；人物倚着工具望向结有星币的植物，脚边还有一币，把主题呈现在可观察的动作中。人物停下来查看生长的星币，强调投入之后的评估，等待本身不说明回报。它与星币八仍在练习不同，这里需要决定如何继续。若逆位感到停滞，可以设置一个复盘点，用实际进展比较继续、调整与停止。
    en:
      You can review gradual progress before adding more effort. Upright describes the card's ordinary
      orientation and highlights a quality you may be able to use more openly. A figure leans on a
      tool beside a plant bearing pentacles. The scene offers a concrete way to think about the
      theme, rather than a timetable for an event. The pause beside growing pentacles suggests
      evaluation after sustained effort. Waiting alone does not establish a return. Unlike the Eight
      of Pentacles’ active practice, this card asks whether the current approach still merits your
      time. Set a review point and compare observable progress with the resources being used.
      Continuing, adjusting and stopping can each be reasonable responses to what you find. Consider
      how assessment, evaluation, re-evaluation, reflection show up in this particular situation
      before deciding which next step fits the image.
  meaningReversed:
