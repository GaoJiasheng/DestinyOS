  meaningUpright:
    zh: 你可以从可靠的学习框架入手。正位（牌面正常朝向）强调这张牌较容易运用的一面；两名学习者面对仪式人物，脚边放着交叉钥匙，背后有双柱，把主题呈现在可观察的动作中。例如，你可以向有经验的人请教方法与适用范围，从一次具体经历看清自己的需要。建议先确定能承担的范围，再根据反馈调整步调，把牌面提示放回现实条件里。
    en: You can learn from a shared framework without surrendering judgement. Upright describes the
      card's ordinary orientation and highlights a quality you may be able to use more openly. Two
      learners face a seated teacher with crossed keys placed below the throne. The scene offers a
      concrete way to think about the theme, rather than a timetable for an event. For example, you
      might ask an experienced colleague both how a method works and when it fails. Notice what that
      experience tells you about your priorities and the resources already within reach. A useful
      reading connects the picture to a situation you recognise; it does not ask you to fit every
      detail into your life. Try choosing a modest action that expresses this quality, and decide
      what feedback would help you review it. You can change the plan as circumstances develop,
      without treating a different outcome as a personal failure.
  meaningReversed:
    zh: 你可以辨别惯例与自身价值的差距。逆位（牌面倒转）常提示主题内收、过度或尚未展开；两名学习者面对仪式人物，脚边放着交叉钥匙，背后有双柱，原有象征仍在，但需要换一个角度理解。例如，向有经验的人请教方法与适用范围这件事若让你为难，可以先检查卡在哪里。建议减少一次额外要求，给调整留出时间，再以实际回应判断下一步。
    en: You may need to question a convention that no longer fits. Reversed means the card is turned
      upside down; here it invites you to consider a quality that is delayed, inward, or being used
      beyond a helpful limit. Two learners face a seated teacher with crossed keys placed below the
      throne. Turning the image does not remove its subject, so the question is how that subject is
      operating in your circumstances. Imagine trying to ask an experienced colleague both how a
      method works and when it fails, then noticing that the process feels less straightforward than
      expected. What specific obstacle, expectation or missing conversation makes it difficult?
      Consider reducing the scale of the next step and checking one assumption before you continue.
      Give yourself room to learn from the response. You do not need to force a positive mood or
      abandon the whole undertaking simply because an adjustment is needed.
  imagery:
    zh: 两名学习者面对仪式人物，脚边放着交叉钥匙，背后有双柱。你可以先看主体与周围环境的距离，再注意物件和动作之间的联系。画面把抽象主题变成一个可以停下来观察的场景；挑一个最吸引你的细节，联系当前问题即可。
    en:
      Two learners face a seated teacher with crossed keys placed below the throne. You can begin with
      the central action, then compare it with the surrounding setting. Notice what is held,
      offered, protected or left at a distance. These details give you different entrances into the
      card's theme without requiring a hidden message in every object. Choose one feature that
      catches your attention and ask how it resembles a situation you recognise. Treat that
      resemblance as a starting point for reflection, then check it against your actual experience.
