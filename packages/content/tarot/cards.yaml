- key: cups_08
  number: 8
  arcana: minor
  suit: cups
  element: water
  astrology: saturn_in_pisces
  numerology: 8
  yesNo: yes
  name:
    zh: 圣杯八
    en: Eight of Cups
  keywordsUpright:
    en:
      - longing
      - dissatisfaction
      - quest
      - departure
      - withdrawal
    zh:
      - 向往
      - 不满
      - 探寻
      - 离去
      - 退隐
  keywordsReversed:
    zh:
      - 害怕离开
      - 徘徊
      - 回归
    en:
      - fear of leaving
      - indecision
      - return
