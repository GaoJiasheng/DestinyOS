      beneath an infinity sign. Turning the image does not remove its subject, so the question is
      how that subject is operating in your circumstances. The gentle contact with the lion suggests
      engaging a strong impulse without escalating the struggle. This is different from the
      Emperor’s external framework: the emphasis is on patient regulation within an encounter. If
      confidence has become strained, reduce the demand placed on one performance. A manageable
      practice can restore trust more effectively than insisting on total control.'
