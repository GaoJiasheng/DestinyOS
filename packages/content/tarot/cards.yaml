          time and resources: check what is available and what commitment you can actually carry.'
      reversed:
        zh: 整理资源时，你可以检查舒适惯例与控制欲。它与皇帝建立边界不同，更关注制度运行后的质量。先核对可用时间与资源。
        en:
          'For your everyday resources, you can question a comfortable routine that leaves too little
