      uncoordinated effort visible. Disagreement may concern practice or methods rather than
      hostility. Unlike the Five of Swords’ cost of winning, the useful question is how a contest
      becomes constructive. Agree on what is being tested. If opinions have been suppressed, invite
      one specific requirement from each participant before deciding. Compare this feature with the
      question you brought to the reading before choosing which part of the scene to emphasize. For
      study, describe the figures, objects, and composition before adding an association. Keep
      symbolic associations separate from facts about your situation, and allow room for different
      cultural readings of the same picture.
