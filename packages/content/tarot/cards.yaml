      adjustment is needed.
  imagery:
    zh: 两个人物仰望杯子构成的彩虹，孩子在旁活动，远方有家园。你可以先看主体与周围环境的距离，再注意物件和动作之间的联系。画面把抽象主题变成一个可以停下来观察的场景；挑一个最吸引你的细节，联系当前问题即可。
