      expression suggest a deliberate change of perspective. Waiting is useful when it changes what
      you can understand, rather than simply postponing a choice. Unlike the Four of Swords’
      restorative pause, this card asks which assumption is being reconsidered. Name the purpose of
      the pause and the information that would let you end it.
  meaningReversed:
