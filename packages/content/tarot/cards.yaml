      You may need to prepare alternatives when a familiar rhythm breaks. Reversed means the card is
      turned upside down; here it invites you to consider a quality that is delayed, inward, or
      being used beyond a helpful limit. A large wheel is surrounded by ascending and descending
      figures and four winged readers. Turning the image does not remove its subject, so the
      question is how that subject is operating in your circumstances. The wheel directs attention
      to changing circumstances and recurring phases. It does not establish that a favourable turn
      is about to arrive. Unlike the World’s integration of a completed stage, this card concerns
      adaptation while conditions move. Separate what you can schedule from what you must respond
      to, and keep an alternative when timing depends on other people.
