  name:
    zh: 圣杯二
    en: Two of Cups
  keywordsUpright:
    en:
      - union
      - attraction
      - combination
      - affection
    zh:
      - 结合
      - 吸引
      - 融合
      - 关爱
  keywordsReversed:
    zh:
      - 关系失衡
      - 分离
      - 失和
    en:
      - relationship imbalance
      - separation
      - disharmony
  meaningUpright:
    zh: 你可以通过相互回应建立连接。正位（牌面正常朝向）强调这张牌较容易运用的一面；两个人物相对举杯，上方有翼狮头与双蛇杖，把主题呈现在可观察的动作中。两人相向举杯，强调相互认可与平等交换，不等于对方已经承诺。与恋人的价值选择不同，这里先看互动能否双向。若逆位步调不一，可以直接询问联络、付出与界限，不靠猜测对方的态度补齐空白。
    en: You can build connection through mutual attention. Upright describes the card's ordinary
      orientation and highlights a quality you may be able to use more openly. Two figures exchange
      cups beneath a winged lion head and entwined staff. The scene offers a concrete way to think
      about the theme, rather than a timetable for an event. The facing figures make reciprocity
      central. Each person brings a cup; connection depends on both responses rather than one
      person’s intention. Unlike the Lovers’ wider question of values and choice, this scene focuses
      on an exchange. If pace or effort differs, ask about contact and boundaries directly. The card
      cannot establish another person’s commitment without their actual participation. Consider how
      union, attraction, combination, affection show up in this particular situation before deciding
