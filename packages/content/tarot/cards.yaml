          through maintenance rather than possession alone.
      reversed:
        zh: 比较选择时，你可以检查舒适惯例与控制欲。它与皇帝建立边界不同，更关注制度运行后的质量。先核对影响选择的事实。
        en:
          For a choice, you can question a comfortable routine that leaves too little flexibility. The
