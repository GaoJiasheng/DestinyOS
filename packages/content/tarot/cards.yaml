          deliverable and review it with the people involved. Use the response to adjust your next
          step; keep room for a different outcome.
      reversed:
        zh: 协作时，你可以把正在清楚的偏好落到步骤。选一个可交付的小任务，先对齐要求再安排进度。用实际反馈调整安排，不急着定论。
