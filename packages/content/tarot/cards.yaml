      You may need to compare an appealing promise with the actions that follow. Reversed means the
      card is turned upside down; here it invites you to consider a quality that is delayed, inward,
      or being used beyond a helpful limit. A rider holds a cup on a pale horse near a river and
      hills. Turning the image does not remove its subject, so the question is how that subject is
      operating in your circumstances. Imagine trying to offer two possible meeting times when
      making a thoughtful invitation, then noticing that the process feels less straightforward than
