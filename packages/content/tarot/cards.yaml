    en: You may need to put a pause between an impulse and a commitment. Reversed means the card is
      turned upside down; here it invites you to consider a quality that is delayed, inward, or
      being used beyond a helpful limit. A rider on an animated horse holds a wand while wearing
      patterned clothing. Turning the image does not remove its subject, so the question is how that
      subject is operating in your circumstances. Imagine trying to set a finishing time before
      enthusiastically joining another demanding activity, then noticing that the process feels less
      straightforward than expected. What specific obstacle, expectation or missing conversation
      makes it difficult? Consider reducing the scale of the next step and checking one assumption
      before you continue. Give yourself room to learn from the response. You do not need to force a
      positive mood or abandon the whole undertaking simply because an adjustment is needed.
  imagery:
    zh: 骑士在跃动的马上举着木杖，衣服有火蜥蜴图案。你可以先看主体与周围环境的距离，再注意物件和动作之间的联系。画面把抽象主题变成一个可以停下来观察的场景；挑一个最吸引你的细节，联系当前问题即可。
    en:
      A rider on an animated horse holds a wand while wearing patterned clothing. You can begin with
