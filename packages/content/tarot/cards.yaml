          conversation about contact, boundaries or mutual effort. Ask what each person needs and
          leave time for an answer. Use the response to adjust your next step; keep room for a
          different outcome.
      reversed:
        zh: 相处时，你可以区分独处与回避支持。表达一项真实需要，听完对方的回应再调整步调。用实际反馈调整安排，不急着定论。
        en:
          For your connections, you can check whether solitude has become avoidance. Apply this to a
          conversation about contact, boundaries or mutual effort. Ask what each person needs and
          leave time for an answer. Use the response to adjust your next step; keep room for a
          different outcome.
