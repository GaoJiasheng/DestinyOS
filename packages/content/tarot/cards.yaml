      that can be handled and checked. This is a practice role, not a prediction about
      qualifications. Unlike the Knight’s continuing routine, the Page is establishing foundations.
      If attention is scattered, choose one basic operation, prepare its materials and define what
      completion looks like before adding another learning plan. Compare this feature with the
      question you brought to the reading before choosing which part of the scene to emphasize. For
      study, describe the figures, objects, and composition before adding an association. Keep
      symbolic associations separate from facts about your situation, and allow room for different
      cultural readings of the same picture.
