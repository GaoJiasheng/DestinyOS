      body. Retention can protect stability while also reducing room for exchange. Unlike the Two of
      Pentacles’ flexible rotation, this scene asks what is being secured. If you want to loosen
      control, release a manageable amount first. If resources are being relinquished too quickly,
      check basic needs before calling every act of holding on a problem.
