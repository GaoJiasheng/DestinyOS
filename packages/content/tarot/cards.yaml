- key: cups_05
  number: 5
  arcana: minor
  suit: cups
  element: water
  astrology: mars_in_scorpio
  numerology: 5
  yesNo: maybe
  name:
    zh: 圣杯五
    en: Five of Cups
  keywordsUpright:
    en:
      - loss
      - despair
      - re-evaluation
      - regret
      - uncertainty
    zh:
      - 失落
      - 绝望
      - 重估
      - 遗憾
      - 未知
  keywordsReversed:
    zh:
      - 接纳
      - 原谅
      - 走出失落
    en:
      - acceptance
      - forgiveness
      - recovery from loss
  meaningUpright:
    zh: 你可以承认遗憾并看见仍在的支持。正位（牌面正常朝向）强调这张牌较容易运用的一面；黑披风人物面对倒下的三个杯，身后有两个立杯，远方有桥，把主题呈现在可观察的动作中。例如，你可以取消计划后联系仍可一起活动的朋友，从一次具体经历看清自己的需要。建议先确定能承担的范围，再根据反馈调整步调，把牌面提示放回现实条件里。
    en:
      You can acknowledge disappointment without losing sight of remaining support. Upright describes
      the card's ordinary orientation and highlights a quality you may be able to use more openly. A
      cloaked figure faces three spilled cups while two remain upright near a bridge. The scene
      offers a concrete way to think about the theme, rather than a timetable for an event. For
      example, you might contact one available friend after a hoped for gathering falls through.
      Notice what that experience tells you about your priorities and the resources already within
      reach. A useful reading connects the picture to a situation you recognise; it does not ask you
      to fit every detail into your life. Try choosing a modest action that expresses this quality,
      and decide what feedback would help you review it. You can change the plan as circumstances
      develop, without treating a different outcome as a personal failure.
  meaningReversed:
    zh: 你可以让恢复注意力从小事开始。逆位（牌面倒转）常提示主题内收、过度或尚未展开；黑披风人物面对倒下的三个杯，身后有两个立杯，远方有桥，原有象征仍在，但需要换一个角度理解。例如，取消计划后联系仍可一起活动的朋友这件事若让你为难，可以先检查卡在哪里。建议减少一次额外要求，给调整留出时间，再以实际回应判断下一步。
    en: You may need to take a small step toward what is still available. Reversed means the card is
      turned upside down; here it invites you to consider a quality that is delayed, inward, or
      being used beyond a helpful limit. A cloaked figure faces three spilled cups while two remain
      upright near a bridge. Turning the image does not remove its subject, so the question is how
      that subject is operating in your circumstances. Imagine trying to contact one available
      friend after a hoped for gathering falls through, then noticing that the process feels less
      straightforward than expected. What specific obstacle, expectation or missing conversation
      makes it difficult? Consider reducing the scale of the next step and checking one assumption
      before you continue. Give yourself room to learn from the response. You do not need to force a
      positive mood or abandon the whole undertaking simply because an adjustment is needed.
  imagery:
    zh: 黑披风人物面对倒下的三个杯，身后有两个立杯，远方有桥。你可以先看主体与周围环境的距离，再注意物件和动作之间的联系。画面把抽象主题变成一个可以停下来观察的场景；挑一个最吸引你的细节，联系当前问题即可。
    en:
      A cloaked figure faces three spilled cups while two remain upright near a bridge. You can begin
      with the central action, then compare it with the surrounding setting. Notice what is held,
      offered, protected or left at a distance. These details give you different entrances into the
      card's theme without requiring a hidden message in every object. Choose one feature that
      catches your attention and ask how it resembles a situation you recognise. Treat that
      resemblance as a starting point for reflection, then check it against your actual experience.
  advice:
    zh: 试试取消计划后联系仍可一起活动的朋友。完成后记录一个新的发现，用现实反馈决定是否继续，而不是急着给自己贴标签。
    en:
      Try to contact one available friend after a hoped for gathering falls through. Afterwards, write
      down one observation you did not have before. Use that feedback to decide whether to continue,
      adjust the scale, or ask someone for a clearer understanding.
  byCategory:
    love:
      upright:
        zh: 相处时，你可以承认遗憾并看见仍在的支持。表达一项真实需要，听完对方的回应再调整步调。用实际反馈调整安排，不急着定论。
        en:
