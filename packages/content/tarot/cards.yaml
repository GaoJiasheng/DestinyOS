    zh: 你可以把分歧转成可讨论的规则。正位（牌面正常朝向）强调这张牌较容易运用的一面；五个人各持木杖交错举起，站位与动作并不一致，把主题呈现在可观察的动作中。多人举杖而未协调方向，强调意见竞争、练习与摩擦，不能直接认定敌意。与宝剑五的争赢代价不同，这里可以把冲突转成共同规则。若逆位回避分歧，可以先邀请每个人说一个具体要求。
