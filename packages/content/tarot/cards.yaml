# Original bilingual editorial prose; card metadata and CC0 keyword attribution retained.
# // DESIGN-GAP: English prose lengths use words; Chinese uses non-whitespace characters, following 05 §2.
# // DESIGN-GAP: Reversals explore blocked, inward or excessive qualities; they do not simply invert an upright verdict.
- key: major_00_fool
  number: 0
  arcana: major
  suit: null
  element: air
  astrology: uranus
  numerology: 0
  yesNo: maybe
  name:
    zh: 愚人
    en: The Fool
  keywordsUpright:
    en:
      - freedom
      - faith
      - inexperience
      - innocence
    zh:
      - 自由
      - 信念
      - 初涉
      - 纯真
  keywordsReversed:
    zh:
      - 鲁莽
      - 迟疑
      - 冒险
    en:
      - recklessness
      - hesitation
      - risk
  meaningUpright:
    zh: 你可以从小范围试探开始。正位（牌面正常朝向）强调这张牌较容易运用的一面；年轻旅人站在崖边，白狗跃起，白玫瑰与小行囊相伴，把主题呈现在可观察的动作中。崖边的小行囊强调轻装开始，也提醒你准备尚不齐全。愚人的开放不同于战车的目标控制：先体验，再决定投入。若逆位对应冒进，补查一个实际条件；若对应迟疑，允许自己先试一次，不必要求起步就成熟。
    en:
      You can make room for a modest experiment. Upright describes the card's ordinary orientation and
      highlights a quality you may be able to use more openly. A traveller approaches a cliff with a
      small bag, a white rose and an alert dog. The scene offers a concrete way to think about the
      theme, rather than a timetable for an event. The small bag suggests travelling light, while
      the cliff makes incomplete preparation visible. This beginning differs from the Chariot’s
      organized pursuit of a destination. Your first experience can teach you what to bring next. If
      hesitation is the issue, allow one trial; if haste is the issue, check the ground before
      taking that step. Consider how freedom, faith, inexperience, innocence show up in this
      particular situation before deciding which next step fits the image.
  meaningReversed:
    zh: 你可以检查冒进或迟迟不动。逆位（牌面倒转）常提示主题内收、过度或尚未展开；年轻旅人站在崖边，白狗跃起，白玫瑰与小行囊相伴，原有象征仍在，但需要换一个角度理解。崖边的小行囊强调轻装开始，也提醒你准备尚不齐全。愚人的开放不同于战车的目标控制：先体验，再决定投入。若逆位对应冒进，补查一个实际条件；若对应迟疑，允许自己先试一次，不必要求起步就成熟。
    en:
      You may need to notice whether excitement is outrunning preparation. Reversed means the card is
      turned upside down; here it invites you to consider a quality that is delayed, inward, or
      being used beyond a helpful limit. A traveller approaches a cliff with a small bag, a white
      rose and an alert dog. Turning the image does not remove its subject, so the question is how
      that subject is operating in your circumstances. The small bag suggests travelling light,
      while the cliff makes incomplete preparation visible. This beginning differs from the
      Chariot’s organized pursuit of a destination. Your first experience can teach you what to
      bring next. If hesitation is the issue, allow one trial; if haste is the issue, check the
      ground before taking that step.
  imagery:
    zh: 崖边的小行囊强调轻装开始，也提醒你准备尚不齐全。愚人的开放不同于战车的目标控制：先体验，再决定投入。若逆位对应冒进，补查一个实际条件；若对应迟疑，允许自己先试一次，不必要求起步就成熟。
    en:
      A traveller approaches a cliff with a small bag, a white rose and an alert dog. The small bag
      suggests travelling light, while the cliff makes incomplete preparation visible. This
      beginning differs from the Chariot’s organized pursuit of a destination. Your first experience
      can teach you what to bring next. If hesitation is the issue, allow one trial; if haste is the
      issue, check the ground before taking that step. Compare this feature with the question you
      brought to the reading before choosing which part of the scene to emphasize.
  advice:
    zh: 试试先参加一次体验课再决定长期投入。完成后记录一个新的发现，用现实反馈决定是否继续，而不是急着给自己贴标签。
    en: Try to visit a class once before committing to a whole course. Afterwards, write down one
      observation you did not have before. Use that feedback to decide whether to continue, adjust
      the scale, or ask someone for a clearer understanding.
  byCategory:
    love:
      upright:
        zh: 相处时，你可以从小范围试探开始。崖边的小行囊强调轻装开始，也提醒你准备尚不齐全。先问清彼此愿意怎样回应。
        en: For your connections, you can make room for a modest experiment. The small bag suggests
          travelling light, while the cliff makes incomplete preparation visible. Ask which part
          describes your own response, and check the other person’s wishes through a direct
          conversation.
      reversed:
        zh: 相处时，你可以检查冒进或迟迟不动。崖边的小行囊强调轻装开始，也提醒你准备尚不齐全。先问清彼此愿意怎样回应。
        en:
          For your connections, you can notice whether excitement is outrunning preparation. The small bag
          suggests travelling light, while the cliff makes incomplete preparation visible. Ask which
          part describes your own response, and check the other person’s wishes through a direct
          conversation.
    career:
      upright:
        zh: 协作时，你可以从小范围试探开始。崖边的小行囊强调轻装开始，也提醒你准备尚不齐全。先核对职责与交付条件。
        en:
          For your work, you can make room for a modest experiment. The small bag suggests travelling
          light, while the cliff makes incomplete preparation visible. Use this distinction to
          review one deliverable, its responsibilities, and the feedback available from the people
          involved.
      reversed:
        zh: 协作时，你可以检查冒进或迟迟不动。崖边的小行囊强调轻装开始，也提醒你准备尚不齐全。先核对职责与交付条件。
        en:
          For your work, you can notice whether excitement is outrunning preparation. The small bag
          suggests travelling light, while the cliff makes incomplete preparation visible. Use this
          distinction to review one deliverable, its responsibilities, and the feedback available
          from the people involved.
    wealth:
      upright:
        zh: 整理资源时，你可以从小范围试探开始。崖边的小行囊强调轻装开始，也提醒你准备尚不齐全。先核对可用时间与资源。
        en:
          'For your everyday resources, you can make room for a modest experiment. The small bag suggests
          travelling light, while the cliff makes incomplete preparation visible. Apply this to
          ordinary time and resources: check what is available and what commitment you can actually
          carry.'
      reversed:
        zh: 整理资源时，你可以检查冒进或迟迟不动。崖边的小行囊强调轻装开始，也提醒你准备尚不齐全。先核对可用时间与资源。
        en:
          'For your everyday resources, you can notice whether excitement is outrunning preparation. The
          small bag suggests travelling light, while the cliff makes incomplete preparation visible.
          Apply this to ordinary time and resources: check what is available and what commitment you
          can actually carry.'
    decision:
      upright:
        zh: 比较选择时，你可以从小范围试探开始。崖边的小行囊强调轻装开始，也提醒你准备尚不齐全。先核对影响选择的事实。
        en:
          For a choice, you can make room for a modest experiment. The small bag suggests travelling
          light, while the cliff makes incomplete preparation visible. Compare the options using
          this distinction, and name the missing fact that would change your choice.
      reversed:
        zh: 比较选择时，你可以检查冒进或迟迟不动。崖边的小行囊强调轻装开始，也提醒你准备尚不齐全。先核对影响选择的事实。
        en: For a choice, you can notice whether excitement is outrunning preparation. The small bag
          suggests travelling light, while the cliff makes incomplete preparation visible. Compare
          the options using this distinction, and name the missing fact that would change your
          choice.
    self:
      upright:
        zh: 独处时，你可以从小范围试探开始。崖边的小行囊强调轻装开始，也提醒你准备尚不齐全。留意自己需要怎样调整。
        en: For your inner life, you can make room for a modest experiment. The small bag suggests
          travelling light, while the cliff makes incomplete preparation visible. Use this image to
          describe one recent response, then name a need or boundary you want to express.
      reversed:
        zh: 独处时，你可以检查冒进或迟迟不动。崖边的小行囊强调轻装开始，也提醒你准备尚不齐全。留意自己需要怎样调整。
        en:
          For your inner life, you can notice whether excitement is outrunning preparation. The small bag
