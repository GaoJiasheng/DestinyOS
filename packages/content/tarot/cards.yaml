      传统阅读。塔罗既有游戏牌传统，也发展出图像解读的方法；这里讨论的是这一图像体系，不将它概括为所有牌组的唯一读法。卧姿与静止的剑强调暂停回应、整理经历和恢复注意力，不作身体诊断。它与倒吊人换视角不同，更重在休整。若逆位无法停下或停太久，可以设定休息的起止与回到事项的条件，让暂停成为可持续安排。
      学习时可以先描述人物、物件与构图，再把象征联想和现实信息分开；同一画面也可有不同的文化理解。
    en:
      This page reads the image within the Rider–Waite–Smith tradition used by this project. Tarot has
      a playing-card tradition as well as later image-reading practices; this particular visual
      vocabulary does not stand for every deck. A resting figure lies on a stone surface beneath
      three swords with another below. The resting posture and still swords emphasize a pause in
      active response. This is a reflection on recovery and attention, not a diagnosis. Unlike the
      Hanged Man’s deliberate change of perspective, the Four of Swords asks what rest makes
      possible. If stopping feels difficult or the pause has lost its boundary, agree when you will
      review the task again. Compare this feature with the question you brought to the reading
      before choosing which part of the scene to emphasize. For study, describe the figures,
      objects, and composition before adding an association. Keep symbolic associations separate
      from facts about your situation, and allow room for different cultural readings of the same
      picture.
- key: swords_05
  number: 5
  arcana: minor
  suit: swords
  element: air
  astrology: venus_in_aquarius
  numerology: 5
  yesNo: no
  name:
    zh: 宝剑五
    en: Five of Swords
  keywordsUpright:
    en:
      - selfishness
      - hostility
      - irrationality
      - self-preservation
    zh:
      - 自私
      - 敌意
      - 失去理性
      - 自保
  keywordsReversed:
    zh:
      - 和解
      - 余怨
      - 停止争斗
    en:
      - reconciliation
      - lingering resentment
      - ending conflict
  meaningUpright:
    zh: 你可以评估争赢之后的关系成本。正位（牌面正常朝向）强调这张牌较容易运用的一面；一个人物持剑回望，两人走向水边，天空有斜云，把主题呈现在可观察的动作中。持剑者与远去的人让“赢了什么、失去了什么”同时可见，不能据此判定谁自私。与权杖五的竞争练习不同，这里关注争执代价。若逆位准备停止对抗，可以说明一个不再重复的行为，并安排如何恢复沟通。
    en: You can consider the cost of winning an unhelpful argument. Upright describes the card's
      ordinary orientation and highlights a quality you may be able to use more openly. A figure
      gathers swords while two others move toward the water beneath slanting clouds. The scene
      offers a concrete way to think about the theme, rather than a timetable for an event. The held
      swords and departing figures place winning beside the cost of an encounter. The picture does
      not establish anyone’s character. Unlike the Five of Wands’ contest over methods, this card
      asks whether continuing the argument serves the relationship or task. If you want to end the
      confrontation, name one behaviour you will stop and one condition for reopening discussion.
  meaningReversed:
    zh: 你可以为停止对抗提出具体方式。逆位（牌面倒转）常提示主题内收、过度或尚未展开；一个人物持剑回望，两人走向水边，天空有斜云，原有象征仍在，但需要换一个角度理解。持剑者与远去的人让“赢了什么、失去了什么”同时可见，不能据此判定谁自私。与权杖五的竞争练习不同，这里关注争执代价。若逆位准备停止对抗，可以说明一个不再重复的行为，并安排如何恢复沟通。
    en:
      You may need to make a practical offer to end a repeating contest. Reversed means the card is
      turned upside down; here it invites you to consider a quality that is delayed, inward, or
      being used beyond a helpful limit. A figure gathers swords while two others move toward the
      water beneath slanting clouds. Turning the image does not remove its subject, so the question
      is how that subject is operating in your circumstances. The held swords and departing figures
      place winning beside the cost of an encounter. The picture does not establish anyone’s
      character. Unlike the Five of Wands’ contest over methods, this card asks whether continuing
      the argument serves the relationship or task. If you want to end the confrontation, name one
      behaviour you will stop and one condition for reopening discussion.
  imagery:
    zh: 一个人物持剑回望，两人走向水边，天空有斜云。持剑者与远去的人让“赢了什么、失去了什么”同时可见，不能据此判定谁自私。与权杖五的竞争练习不同，这里关注争执代价。
    en:
      A figure gathers swords while two others move toward the water beneath slanting clouds. The held
      swords and departing figures place winning beside the cost of an encounter. The picture does
      not establish anyone’s character. Unlike the Five of Wands’ contest over methods, this card
      asks whether continuing the argument serves the relationship or task. If you want to end the
      confrontation, name one behaviour you will stop and one condition for reopening discussion.
      Compare this feature with the question you brought to the reading before choosing which part
      of the scene to emphasize.
  advice:
    zh: 试试争执后确认还需要共同完成什么。完成后记录一个新的发现，用现实反馈决定是否继续，而不是急着给自己贴标签。
    en: Try to ask what still needs cooperation after a discussion becomes adversarial. Afterwards,
      write down one observation you did not have before. Use that feedback to decide whether to
      continue, adjust the scale, or ask someone for a clearer understanding.
