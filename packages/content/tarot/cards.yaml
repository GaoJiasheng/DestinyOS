  advice:
    zh: 试试暂缓回复一天并重读对方的需求。完成后记录一个新的发现，用现实反馈决定是否继续，而不是急着给自己贴标签。
    en: Try to wait until tomorrow and reread what the other person actually requested. Afterwards,
      write down one observation you did not have before. Use that feedback to decide whether to
      continue, adjust the scale, or ask someone for a clearer understanding.
  byCategory:
    love:
      upright:
        zh: 相处时，你可以暂停熟悉做法以看见新角度。悬挂姿势与平静表情强调主动换角度，而非所有等待都值得。先问清彼此愿意怎样回应。
        en:
          For your connections, you can use a deliberate pause to see a different angle. The suspended
          posture and calm expression suggest a deliberate change of perspective. Ask which part
          describes your own response, and check the other person’s wishes through a direct
          conversation.
      reversed:
        zh: 相处时，你可以辨认停顿是否失去目的。悬挂姿势与平静表情强调主动换角度，而非所有等待都值得。先问清彼此愿意怎样回应。
        en:
          For your connections, you can give an open ended delay a purpose and limit. The suspended
          posture and calm expression suggest a deliberate change of perspective. Ask which part
          describes your own response, and check the other person’s wishes through a direct
          conversation.
    career:
      upright:
        zh: 协作时，你可以暂停熟悉做法以看见新角度。悬挂姿势与平静表情强调主动换角度，而非所有等待都值得。先核对职责与交付条件。
        en:
          For your work, you can use a deliberate pause to see a different angle. The suspended posture
          and calm expression suggest a deliberate change of perspective. Use this distinction to
          review one deliverable, its responsibilities, and the feedback available from the people
          involved.
      reversed:
        zh: 协作时，你可以辨认停顿是否失去目的。悬挂姿势与平静表情强调主动换角度，而非所有等待都值得。先核对职责与交付条件。
        en:
          For your work, you can give an open ended delay a purpose and limit. The suspended posture and
          calm expression suggest a deliberate change of perspective. Use this distinction to review
          one deliverable, its responsibilities, and the feedback available from the people
          involved.
    wealth:
      upright:
        zh: 整理资源时，你可以暂停熟悉做法以看见新角度。悬挂姿势与平静表情强调主动换角度，而非所有等待都值得。先核对可用时间与资源。
        en:
          'For your everyday resources, you can use a deliberate pause to see a different angle. The
          suspended posture and calm expression suggest a deliberate change of perspective. Apply
          this to ordinary time and resources: check what is available and what commitment you can
          actually carry.'
      reversed:
        zh: 整理资源时，你可以辨认停顿是否失去目的。悬挂姿势与平静表情强调主动换角度，而非所有等待都值得。先核对可用时间与资源。
        en: 'For your everyday resources, you can give an open ended delay a purpose and limit. The
          suspended posture and calm expression suggest a deliberate change of perspective. Apply
          this to ordinary time and resources: check what is available and what commitment you can
          actually carry.'
    decision:
      upright:
        zh: 比较选择时，你可以暂停熟悉做法以看见新角度。悬挂姿势与平静表情强调主动换角度，而非所有等待都值得。先核对影响选择的事实。
        en:
          For a choice, you can use a deliberate pause to see a different angle. The suspended posture and
          calm expression suggest a deliberate change of perspective. Compare the options using this
          distinction, and name the missing fact that would change your choice.
      reversed:
        zh: 比较选择时，你可以辨认停顿是否失去目的。悬挂姿势与平静表情强调主动换角度，而非所有等待都值得。先核对影响选择的事实。
        en:
          For a choice, you can give an open ended delay a purpose and limit. The suspended posture and
          calm expression suggest a deliberate change of perspective. Compare the options using this
          distinction, and name the missing fact that would change your choice.
    self:
      upright:
        zh: 独处时，你可以暂停熟悉做法以看见新角度。悬挂姿势与平静表情强调主动换角度，而非所有等待都值得。留意自己需要怎样调整。
        en:
          For your inner life, you can use a deliberate pause to see a different angle. The suspended
          posture and calm expression suggest a deliberate change of perspective. Use this image to
          describe one recent response, then name a need or boundary you want to express.
      reversed:
        zh: 独处时，你可以辨认停顿是否失去目的。悬挂姿势与平静表情强调主动换角度，而非所有等待都值得。留意自己需要怎样调整。
        en:
          For your inner life, you can give an open ended delay a purpose and limit. The suspended posture
          and calm expression suggest a deliberate change of perspective. Use this image to describe
          one recent response, then name a need or boundary you want to express.
    general:
      upright:
        zh: 日常安排中，你可以暂停熟悉做法以看见新角度。悬挂姿势与平静表情强调主动换角度，而非所有等待都值得。联系当前一件具体事情。
        en: For your current situation, you can use a deliberate pause to see a different angle. The
          suspended posture and calm expression suggest a deliberate change of perspective. Choose
          one present situation where this distinction matters, and check what a useful next
          response would require.
      reversed:
        zh: 日常安排中，你可以辨认停顿是否失去目的。悬挂姿势与平静表情强调主动换角度，而非所有等待都值得。联系当前一件具体事情。
        en:
          For your current situation, you can give an open ended delay a purpose and limit. The suspended
          posture and calm expression suggest a deliberate change of perspective. Choose one present
          situation where this distinction matters, and check what a useful next response would
          require.
  historySymbolism:
    zh: 这张牌的图像按本项目采用的 Rider–Waite–Smith
      传统阅读。塔罗既有游戏牌传统，也发展出图像解读的方法；这里讨论的是这一图像体系，不将它概括为所有牌组的唯一读法。人物单脚倒挂在木架上，另一条腿弯曲，头部周围有光环。悬挂姿势与平静表情强调主动换角度，而非所有等待都值得。倒吊人与宝剑四的休整不同：它邀请你检查原来的理解方式。
      学习时可以先描述人物、物件与构图，再把象征联想和现实信息分开；同一画面也可有不同的文化理解。
    en:
      This page reads the image within the Rider–Waite–Smith tradition used by this project. Tarot has
      a playing-card tradition as well as later image-reading practices; this particular visual
      vocabulary does not stand for every deck. A figure hangs by one foot from a wooden frame with
      a halo around the head. The suspended posture and calm expression suggest a deliberate change
      of perspective. Waiting is useful when it changes what you can understand, rather than simply
      postponing a choice. Unlike the Four of Swords’ restorative pause, this card asks which
      assumption is being reconsidered. Name the purpose of the pause and the information that would
      let you end it. Compare this feature with the question you brought to the reading before
      choosing which part of the scene to emphasize. For study, describe the figures, objects, and
      composition before adding an association. Keep symbolic associations separate from facts about
      your situation, and allow room for different cultural readings of the same picture.
