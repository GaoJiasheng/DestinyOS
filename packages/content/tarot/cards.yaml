    general:
      upright:
        zh: 日常安排中，你可以从小范围试探开始。崖边的小行囊强调轻装开始，也提醒你准备尚不齐全。联系当前一件具体事情。
        en:
          For your current situation, you can make room for a modest experiment. The small bag suggests
          travelling light, while the cliff makes incomplete preparation visible. Choose one present
          situation where this distinction matters, and check what a useful next response would
          require.
      reversed:
        zh: 日常安排中，你可以检查冒进或迟迟不动。崖边的小行囊强调轻装开始，也提醒你准备尚不齐全。联系当前一件具体事情。
        en:
          For your current situation, you can notice whether excitement is outrunning preparation. The
          small bag suggests travelling light, while the cliff makes incomplete preparation visible.
