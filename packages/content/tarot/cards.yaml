  meaningUpright:
    zh: 你可以让给予与接受保持清楚边界。正位（牌面正常朝向）强调这张牌较容易运用的一面；人物一手持天平一手分给硬币，两个人物在旁，六币悬于上方，把主题呈现在可观察的动作中。秤与分送星币强调给予、接受和分配权之间的关系，不是只要慷慨就好。若逆位帮助带着隐性条件，可以问清是否需要回报、谁能决定范围，让接受帮助不必付出未曾同意的代价。
    en:
      You can make giving and receiving clear and proportionate. Upright describes the card's ordinary
      orientation and highlights a quality you may be able to use more openly. A figure holds scales
      while distributing coins to two others beneath six pentacles. The scene offers a concrete way
      to think about the theme, rather than a timetable for an event. The scales beside the
      distributed coins connect generosity with the power to set terms. Giving is useful when the
      arrangement is clear to both sides. Ask what is offered, what is expected in return and who
      may change the terms. If support has become conditional in an uncomfortable way, clarify that
      condition before accepting rather than assuming gratitude requires agreement to everything.
  meaningReversed:
    zh: 你可以检查帮助中隐藏的条件。逆位（牌面倒转）常提示主题内收、过度或尚未展开；人物一手持天平一手分给硬币，两个人物在旁，六币悬于上方，原有象征仍在，但需要换一个角度理解。秤与分送星币强调给予、接受和分配权之间的关系，不是只要慷慨就好。若逆位帮助带着隐性条件，可以问清是否需要回报、谁能决定范围，让接受帮助不必付出未曾同意的代价。
    en:
      You may need to check the expectations attached to an offer of help. Reversed means the card is
      turned upside down; here it invites you to consider a quality that is delayed, inward, or
