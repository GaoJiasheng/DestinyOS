          upright sword and extended hand combine a boundary with an invitation to speak. Choose one
          present situation where this distinction matters, and check what a useful next response
          would require.
  historySymbolism:
    zh: 这张牌的图像按本项目采用的 Rider–Waite–Smith
      传统阅读。塔罗既有游戏牌传统，也发展出图像解读的方法；这里讨论的是这一图像体系，不将它概括为所有牌组的唯一读法。直立的剑与伸出的手同时呈现边界和接纳，强调清楚表达而仍愿意听见别人。王后不限定性别，也不等于冷酷。若逆位防御变尖锐，可以把事实、感受与要求分开，让直接沟通不必靠贬低对方维持。
