  meaningUpright:
    zh: 你可以让迅速思考配合清楚方向。正位（牌面正常朝向）强调这张牌较容易运用的一面；骑士举剑驱马疾行，树木与云层倾斜在风中，把主题呈现在可观察的动作中。例如，你可以发送强烈意见前重读讨论目标，从一次具体经历看清自己的需要。建议先确定能承担的范围，再根据反馈调整步调，把牌面提示放回现实条件里。
    en: You can act on a clear idea without losing the wider picture. Upright describes the card's
      ordinary orientation and highlights a quality you may be able to use more openly. A rider
      raises a sword on a running horse beneath angled clouds and trees. The scene offers a concrete
      way to think about the theme, rather than a timetable for an event. For example, you might
      reread the purpose of a discussion before sending a forceful reply. Notice what that
      experience tells you about your priorities and the resources already within reach. A useful
      reading connects the picture to a situation you recognise; it does not ask you to fit every
      detail into your life. Try choosing a modest action that expresses this quality, and decide
      what feedback would help you review it. You can change the plan as circumstances develop,
      without treating a different outcome as a personal failure.
  meaningReversed:
