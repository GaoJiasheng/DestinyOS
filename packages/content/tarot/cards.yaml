  meaningUpright:
    zh: 你可以重新分配已经过重的负担。正位（牌面正常朝向）强调这张牌较容易运用的一面；人物抱着十根木杖走向远处城镇，视线受到遮挡，把主题呈现在可观察的动作中。例如，你可以把重复事务交给清楚的流程，从一次具体经历看清自己的需要。建议先确定能承担的范围，再根据反馈调整步调，把牌面提示放回现实条件里。
    en: You can redistribute a load that has become difficult to carry. Upright describes the card's
      ordinary orientation and highlights a quality you may be able to use more openly. A figure
      carries ten bundled wands toward a town with a partly obscured view. The scene offers a
      concrete way to think about the theme, rather than a timetable for an event. For example, you
      might create a checklist so recurring tasks do not depend entirely on your memory. Notice what
      that experience tells you about your priorities and the resources already within reach. A
      useful reading connects the picture to a situation you recognise; it does not ask you to fit
      every detail into your life. Try choosing a modest action that expresses this quality, and
      decide what feedback would help you review it. You can change the plan as circumstances
      develop, without treating a different outcome as a personal failure.
  meaningReversed:
    zh: 你可以把放下任务落实到交接。逆位（牌面倒转）常提示主题内收、过度或尚未展开；人物抱着十根木杖走向远处城镇，视线受到遮挡，原有象征仍在，但需要换一个角度理解。例如，把重复事务交给清楚的流程这件事若让你为难，可以先检查卡在哪里。建议减少一次额外要求，给调整留出时间，再以实际回应判断下一步。
    en:
      You may need to turn a wish for relief into a clear handover. Reversed means the card is turned
      upside down; here it invites you to consider a quality that is delayed, inward, or being used
      beyond a helpful limit. A figure carries ten bundled wands toward a town with a partly
      obscured view. Turning the image does not remove its subject, so the question is how that
      subject is operating in your circumstances. Imagine trying to create a checklist so recurring
      tasks do not depend entirely on your memory, then noticing that the process feels less
      straightforward than expected. What specific obstacle, expectation or missing conversation
      makes it difficult? Consider reducing the scale of the next step and checking one assumption
      before you continue. Give yourself room to learn from the response. You do not need to force a
      positive mood or abandon the whole undertaking simply because an adjustment is needed.
  imagery:
    zh: 人物抱着十根木杖走向远处城镇，视线受到遮挡。你可以先看主体与周围环境的距离，再注意物件和动作之间的联系。画面把抽象主题变成一个可以停下来观察的场景；挑一个最吸引你的细节，联系当前问题即可。
    en:
