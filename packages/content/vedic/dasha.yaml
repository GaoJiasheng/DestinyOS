  en:
    title: Shukra main period, Surya subperiod
    summary: You can consider visible ownership within a longer theme of reciprocity and enjoyment.
    body: You can place a short-term question about visible ownership within a longer review of
      reciprocity and enjoyment. Antardasha — a subdivision of the main symbolic period — is
      currently ruled by Surya inside the Shukra Mahadasha. Its boundaries are {{antar_from}} and
      {{antar_to}}. Surya — the Sun, a symbol of personal direction — concerns how you take
      ownership of a choice. Its position offers a question about visibility and responsibility
