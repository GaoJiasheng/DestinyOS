      responsibility yourself can make a process fragile. You can separate essential work from
      optional demands and agree on a handover before capacity runs low. Reliability includes limits
      and the ability to request support. Here a short rehearsal provides useful feedback. Explain a
      familiar procedure to someone in a minute, then ask which step remained unclear. You can
      practise the troublesome part separately instead of repeating the whole speech. Keep a
      manageable rhythm, and check what the listener needs even when you know each other well. The
      two roles offer a comparison of emphasis and pace rather than a prediction of an event. You
      can review an actual experiment before the segment ends and carry what helped into later
      plans.
    advice:
