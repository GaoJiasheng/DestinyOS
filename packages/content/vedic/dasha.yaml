    body:
      你可以在把责任拆成步骤的长期主题中，加入把力量放进行动的短期观察。次运（大运内部较短的象征分段）当前由火星主导，处于土星大运内。起止范围为 {{antar_from}} 至
      {{antar_to}}。火星（以行动和应对摩擦为象征的行星）描述你怎样启动任务、表达不同意见。它的位置提示精力可能投向哪里，不表示你需要与谁竞争。你可以把不满改写成具体的改进请求，区分眼前要完成的事和一时想赢的争论。这里关注带着具体问题拓展眼界。例如参加一门课程前，先写下希望回答的一个问题，再比较课程内容是否适合当前基础。建议保持对不同经验的好奇，把学到的东西放回现实检验；尊重其他人的文化与选择，也允许自己的观点随着新证据调整。两种主题可以用来比较轻重与节奏，不是现实力量相互替代，也不预设某件事何时出现。你可以在分段结束前回看一项实际行动，把有用经验留给后续安排。
    advice:
