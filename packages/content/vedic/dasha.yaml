      learning with perspective. Antardasha — a subdivision of the main symbolic period — is
      currently ruled by Shani inside the Guru Mahadasha. Its boundaries are {{antar_from}} and
      {{antar_to}}. Shani — Saturn, a symbol of time and boundaries — asks which commitments you can
