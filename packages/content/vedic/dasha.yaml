      - 说清一次决定的理由，再邀请具体反馈。
    do:
      - 明确责任
    dont:
      - 压过他人
  en:
    title: 'Surya Mahadasha: a review theme'
    summary: You can review visible ownership during the recorded current period.
    body: You can use this period to review visible ownership. Mahadasha — a longer symbolic cycle
      calculated from the Moon’s birth sector — is currently ruled by Surya, with recorded
      boundaries from {{dasha.sequence[current=true].from}} to {{dasha.sequence[current=true].to}}.
      Surya — the Sun, a symbol of personal direction — concerns how you take ownership of a choice.
