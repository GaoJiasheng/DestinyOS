    body:
      你可以在把责任拆成步骤的长期主题中，加入让信息便于使用的短期观察。次运（大运内部较短的象征分段）当前由水星主导，处于土星大运内。起止范围为 {{antar_from}} 至
      {{antar_to}}。水星（以学习和信息交流为象征的行星）描述你如何整理问题、交换想法。它的位置强调信息怎样进入实际生活，不替你判断哪种观点正确。你可以先问对方需要什么程度的解释，再用例子核对彼此是否理解同一件事。这里关注实际环境的舒适度。例如共享居所时，先协商安静时间和公共空间使用，再讨论各自喜欢的布置。建议选择一个低成本的细节试着调整，过几天核对体验；归属感需要真实回应，不能由命盘替其他人说明他们的感受。两种主题可以用来比较轻重与节奏，不是现实力量相互替代，也不预设某件事何时出现。你可以在分段结束前回看一项实际行动，把有用经验留给后续安排。
