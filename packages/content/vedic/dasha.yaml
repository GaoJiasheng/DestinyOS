    title: 土星大运 · 太阳次运
    summary: 你可以让表达立场与把责任拆成步骤的阶段重点相接。
    body:
      你可以在把责任拆成步骤的长期主题中，加入表达立场的短期观察。次运（大运内部较短的象征分段）当前由太阳主导，处于土星大运内。起止范围为 {{antar_from}} 至
      {{antar_to}}。太阳（在吠陀框架中观察身份与意志的象征）描述你怎样承担自己的选择。它所在的位置把注意力引向表达立场、接受反馈和确认责任，而不是给权力或社会地位打分。你可以在需要拍板时先说清判断依据，让参与者知道哪些意见还能补充。这里关注双方都能参与的协商。例如两人对周末安排有不同想法，先说各自最重视的部分，再讨论是否愿意调整。建议用明确请求替代期待对方猜到，允许对方回答不同意见；无论单身、正在认识别人或已有伴侣，尊重与真实沟通都适用。两种主题可以用来比较轻重与节奏，不是现实力量相互替代，也不预设某件事何时出现。你可以在分段结束前回看一项实际行动，把有用经验留给后续安排。
    advice:
      - 说清一个需要，也让对方自由回应。
    do:
      - 明确责任
    dont:
      - 压过他人
  en:
    title: Shani main period, Surya subperiod
    summary: You can consider visible ownership within a longer theme of responsibility in practice.
    body: You can place a short-term question about visible ownership within a longer review of
      responsibility in practice. Antardasha — a subdivision of the main symbolic period — is
      currently ruled by Surya inside the Shani Mahadasha. Its boundaries are {{antar_from}} and
      {{antar_to}}. Surya — the Sun, a symbol of personal direction — concerns how you take
      ownership of a choice. Its position offers a question about visibility and responsibility
      rather than a ranking of your status. A helpful contribution makes both your reasoning and its
      limits understandable to the people affected. You can practise explaining why a choice matters
      without asking everyone to share your enthusiasm. Here the useful scene is a shared plan with
      different preferences. Before arranging a day together, asking what each person most wants can
      reveal room for agreement. Consider making a clear request and accepting an answer that
      differs from yours. The same respect matters in friendships, dating, established partnerships,
      and collaboration; no relationship status is treated as more complete than another. The two
      roles offer a comparison of emphasis and pace rather than a prediction of an event. You can
      review an actual experiment before the segment ends and carry what helped into later plans.
    advice:
      - Make a clear request and leave room for an honest response.
    do:
      - Own decisions
    dont:
      - Dominate discussions
