    title: 未来三个次运：先核对时间表
    summary: 你可以按接下来的三个次运边界，安排轻量复盘。
    body: 你可以把未来三个次运当作分段回顾的参照，而不是待发生事件的名单。次运（大运内按九曜比例划分的阶段）需要从当前条目的结束边界向后阅读；越过大运边界后，接着读取下一段大运的次运。时间表中的起止日期来自真实计算，本条不把未标为当前的全部条目都当成未来。比如你准备三次回顾，就分别记下三行的起止时间与主星，再围绕学习、沟通或休息各选一项小实践。建议临近每个阶段时先核对实际安排，以体验决定是否继续；日期之外的工作期限、参与者意愿和可用资源仍然优先，不预设边界会带来突变。
    advice:
      - 从当前结束点向后核对三行次运，分别写下一个回顾重点。
    do:
      - 核对边界
    dont:
      - 预设事件
  en:
    title: 'The next three subperiods: read the timetable first'
    summary: You can use the next three subperiod intervals for modest review points.
    body: You can use the next three subperiods as review intervals rather than a list of expected
      events. Antardasha — a proportional subdivision of a main planetary period — is read forward
      from the end of the current row. If the three entries cross a main-period boundary, continue
      into the following main period’s subdivisions. The recorded dates come from the calculation; a
      row that is not marked current may be in the past and should not automatically be called
      upcoming. For each of the next three rows, note the actual boundaries and ruler, then choose a
      small review question about learning, communication, or rest. Consider checking your real
      commitments as each interval approaches. Practical deadlines and the willingness of other
      people still guide action, and no abrupt change is required by a symbolic boundary.
    advice:
      - Read three rows forward from the current end and give each a review question.
    do:
      - Check boundaries
    dont:
      - Expect events
