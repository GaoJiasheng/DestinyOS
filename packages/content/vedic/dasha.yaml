    body:
      你可以在表达立场的长期主题中，加入安顿感受的短期观察。次运（大运内部较短的象征分段）当前由月亮主导，处于太阳大运内。起止范围为 {{antar_from}} 至
      {{antar_to}}。月亮（在这一体系中作为心绪与日常反应的观察点）描述你怎样恢复熟悉的节奏。它的位置为情绪需要提供比喻，不能用来评估心理状况。你可以从一天里最容易放松的时刻入手，比较陪伴、独处与环境变化对实际感受的影响。这里关注责任改变时的说明。例如共同使用的设备需要维修，你们先核对原先的约定，再讨论谁联系处理、怎样记录费用。建议让涉及共同部分的信息可以回看，尊重彼此保留隐私的边界；不清楚的专业问题另行求证，不凭想象安排下一步。两种主题可以用来比较轻重与节奏，不是现实力量相互替代，也不预设某件事何时出现。你可以在分段结束前回看一项实际行动，把有用经验留给后续安排。
    advice:
