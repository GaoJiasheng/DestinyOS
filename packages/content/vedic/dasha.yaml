    title: 金星大运 · 计都次运
    summary: 你可以让给减法留出依据与认真看待互惠的阶段重点相接。
    body:
      你可以在认真看待互惠的长期主题中，加入给减法留出依据的短期观察。次运（大运内部较短的象征分段）当前由计都主导，处于金星大运内。起止范围为 {{antar_from}} 至
      {{antar_to}}。计都（与罗睺相对的月球轨道交点，作为简化和回顾的象征）描述你如何重新评估熟悉的投入。它不是一颗实体行星，也不要求你放弃关系或现实责任。你可以观察哪些重复动作仍有作用，哪些只是习惯，先做可撤回的减法再决定是否保留。这里关注成果怎样帮助接手的人。例如完成一项研究后，你先概括能回答的问题，再说明还没有核对的范围，方便团队使用。建议以真实反馈评估工作方法，并为新任务确认资源和交付标准；职业选择要结合现实条件，不把宫位描述当作能力测试。两种主题可以用来比较轻重与节奏，不是现实力量相互替代，也不预设某件事何时出现。你可以在分段结束前回看一项实际行动，把有用经验留给后续安排。
