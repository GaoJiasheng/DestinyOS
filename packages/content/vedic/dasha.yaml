      request support. Here a small creative draft is a useful starting point. If you want to learn
      drawing, finishing a simple sketch can reveal which movement you would like to practise next.
      Try using feedback about one detail rather than comparing the whole result with experienced
      work. A modest session keeps the activity approachable and leaves room to enjoy making
      something. The two roles offer a comparison of emphasis and pace rather than a prediction of
      an event. You can review an actual experiment before the segment ends and carry what helped
      into later plans.
