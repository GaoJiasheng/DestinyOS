      {{antar_to}}。太阳（在吠陀框架中观察身份与意志的象征）描述你怎样承担自己的选择。它所在的位置把注意力引向表达立场、接受反馈和确认责任，而不是给权力或社会地位打分。你可以在需要拍板时先说清判断依据，让参与者知道哪些意见还能补充。这里关注资源是否安排得清楚。例如决定参加收费课程前，把学费、通勤和练习时间列在一起，再确认它是否符合当前重点。建议在交流中明确自己的投入范围，也给临时变化留一点余地；以真实记录核对习惯，不把象征描述当作财务判断。两种主题可以用来比较轻重与节奏，不是现实力量相互替代，也不预设某件事何时出现。你可以在分段结束前回看一项实际行动，把有用经验留给后续安排。
