  zh:
    title: 太阳大运 · 太阳次运
    summary: 你可以让表达立场与表达立场的阶段重点相接。
    body:
      你可以在表达立场的长期主题中，加入表达立场的短期观察。次运（大运内部较短的象征分段）当前由太阳主导，处于太阳大运内。起止范围为 {{antar_from}} 至
      {{antar_to}}。太阳（在吠陀框架中观察身份与意志的象征）描述你怎样承担自己的选择。它所在的位置把注意力引向表达立场、接受反馈和确认责任，而不是给权力或社会地位打分。你可以在需要拍板时先说清判断依据，让参与者知道哪些意见还能补充。这里关注你的具体回应。例如在第一次参与小组活动时，先说你愿意承担什么，再询问其他人的分工，通常比急着证明自己更容易接上合作。建议以一个可观察的动作开始，不把整个人格都压在初次表现上；你可以随着真实反馈调整自己的表达。两种主题可以用来比较轻重与节奏，不是现实力量相互替代，也不预设某件事何时出现。你可以在分段结束前回看一项实际行动，把有用经验留给后续安排。
    advice:
      - 参加新活动时，说清一项愿意承担的小任务。
    do:
      - 明确责任
    dont:
      - 压过他人
  en:
    title: Surya main period, Surya subperiod
    summary: You can consider visible ownership within a longer theme of visible ownership.
    body:
      You can place a short-term question about visible ownership within a longer review of visible
      ownership. Antardasha — a subdivision of the main symbolic period — is currently ruled by
      Surya inside the Surya Mahadasha. Its boundaries are {{antar_from}} and {{antar_to}}. Surya —
      the Sun, a symbol of personal direction — concerns how you take ownership of a choice. Its
      position offers a question about visibility and responsibility rather than a ranking of your
      status. A helpful contribution makes both your reasoning and its limits understandable to the
      people affected. You can practise explaining why a choice matters without asking everyone to
      share your enthusiasm. Here the practical context is an ordinary introduction. When joining a
      local activity, stating which small task you can help with may be more useful than presenting
      a complete account of yourself. Consider noticing how the group responds, then adjusting the
      amount you take on. A first interaction is one piece of experience, not a final assessment of
      your personality. The two roles offer a comparison of emphasis and pace rather than a
      prediction of an event. You can review an actual experiment before the segment ends and carry
      what helped into later plans.
    advice:
      - Offer one specific contribution when entering a new group.
    do:
      - Own decisions
    dont:
      - Dominate discussions
