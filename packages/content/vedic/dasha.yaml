    body:
      你可以在表达立场的长期主题中，加入让信息便于使用的短期观察。次运（大运内部较短的象征分段）当前由水星主导，处于太阳大运内。起止范围为 {{antar_from}} 至
      {{antar_to}}。水星（以学习和信息交流为象征的行星）描述你如何整理问题、交换想法。它的位置强调信息怎样进入实际生活，不替你判断哪种观点正确。你可以先问对方需要什么程度的解释，再用例子核对彼此是否理解同一件事。这里关注成果怎样帮助接手的人。例如完成一项研究后，你先概括能回答的问题，再说明还没有核对的范围，方便团队使用。建议以真实反馈评估工作方法，并为新任务确认资源和交付标准；职业选择要结合现实条件，不把宫位描述当作能力测试。两种主题可以用来比较轻重与节奏，不是现实力量相互替代，也不预设某件事何时出现。你可以在分段结束前回看一项实际行动，把有用经验留给后续安排。
