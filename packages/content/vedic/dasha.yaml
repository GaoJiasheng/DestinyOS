    dont:
      - 急于对抗
  en:
    title: Shani main period, Mangala subperiod
    summary: You can consider directed effort within a longer theme of responsibility in practice.
    body: You can place a short-term question about directed effort within a longer review of
      responsibility in practice. Antardasha — a subdivision of the main symbolic period — is
      currently ruled by Mangala inside the Shani Mahadasha. Its boundaries are {{antar_from}} and
      {{antar_to}}. Mangala — Mars, a symbol of effort and assertion — asks where you put energy
      when something needs doing. This position can also prompt you to notice what happens when a
      disagreement becomes a contest. You can name the task you want completed and make a specific
      request rather than pursue the last word. Sustainable effort includes a pause before
      escalating a conflict. Here a deliberate learning question gives a wider search direction.
      Before enrolling in a class, write down what you want to understand and check whether the
      material fits your current knowledge. You can bring one observation back into an ordinary
      decision to see what it adds. Respect different experiences and remain willing to revise a
      view when new information makes that useful. The two roles offer a comparison of emphasis and
      pace rather than a prediction of an event. You can review an actual experiment before the
      segment ends and carry what helped into later plans.
    advice:
      - Begin a longer course of study with a question you can revisit.
    do:
