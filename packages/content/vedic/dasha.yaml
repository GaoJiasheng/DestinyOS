      {{dasha.sequence[current=true].to}}。计都（与罗睺相对的月球轨道交点，作为简化和回顾的象征）描述你如何重新评估熟悉的投入。它不是一颗实体行星，也不要求你放弃关系或现实责任。你可以观察哪些重复动作仍有作用，哪些只是习惯，先做可撤回的减法再决定是否保留。周期只提供复盘的主题，不预告同类事件。例如你在季度结束时回看学习、合作和可用时间，选一项与主题有关但符合现实需要的调整。建议先明确目前最值得照顾的一件事，再用经验检验做法；时间边界也不要求生活在当天突然改变。
    advice:
      - 暂停一项非必要安排，再回看实际影响。
    do:
      - 简化安排
    dont:
      - 突然抽离
  en:
    title: 'Ketu Mahadasha: a review theme'
    summary: You can review choose what to release during the recorded current period.
    body:
      You can use this period to review choose what to release. Mahadasha — a longer symbolic cycle
      calculated from the Moon’s birth sector — is currently ruled by Ketu, with recorded boundaries
      from {{dasha.sequence[current=true].from}} to {{dasha.sequence[current=true].to}}. Ketu — the
      south lunar node, opposite Rahu — serves as a symbol of simplification and reconsideration. It
      does not ask you to withdraw from people or abandon practical responsibilities. You can
      examine a familiar activity and ask what purpose it still serves. Pausing one optional
      commitment for a short interval gives you evidence about its value while leaving space to
      restore it. A period provides a review theme, not a schedule of events. At a quarterly
      check-in, compare your learning, collaborations, and available time before choosing one
      adjustment that fits your circumstances. You can use the recorded interval as a reference
      while setting practical milestones from real responsibilities. Consider reviewing the method
      after a modest trial; a boundary in the calculation does not require your daily life to change
      abruptly.
    advice:
      - Pause one optional activity and review what the pause changes.
    do:
      - Simplify gently
    dont:
      - Withdraw abruptly
