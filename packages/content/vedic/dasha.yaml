    body:
      你可以在表达立场的长期主题中，加入把力量放进行动的短期观察。次运（大运内部较短的象征分段）当前由火星主导，处于太阳大运内。起止范围为 {{antar_from}} 至
      {{antar_to}}。火星（以行动和应对摩擦为象征的行星）描述你怎样启动任务、表达不同意见。它的位置提示精力可能投向哪里，不表示你需要与谁竞争。你可以把不满改写成具体的改进请求，区分眼前要完成的事和一时想赢的争论。这里关注可重复的小动作。例如练习一段口头说明时，先用一分钟说清目的，请朋友复述理解，再根据遗漏修改。建议固定一个轻量练习时段，记录实际进展；与熟人沟通也要确认彼此想要的信息，不以熟悉程度代替清楚表达。两种主题可以用来比较轻重与节奏，不是现实力量相互替代，也不预设某件事何时出现。你可以在分段结束前回看一项实际行动，把有用经验留给后续安排。
    advice:
      - 用一分钟练习说清一个过程，并核对理解。
    do:
      - 分步行动
    dont:
      - 急于对抗
  en:
    title: Surya main period, Mangala subperiod
    summary: You can consider directed effort within a longer theme of visible ownership.
    body:
      You can place a short-term question about directed effort within a longer review of visible
      ownership. Antardasha — a subdivision of the main symbolic period — is currently ruled by
      Mangala inside the Surya Mahadasha. Its boundaries are {{antar_from}} and {{antar_to}}.
      Mangala — Mars, a symbol of effort and assertion — asks where you put energy when something
      needs doing. This position can also prompt you to notice what happens when a disagreement
      becomes a contest. You can name the task you want completed and make a specific request rather
      than pursue the last word. Sustainable effort includes a pause before escalating a conflict.
      Here a short rehearsal provides useful feedback. Explain a familiar procedure to someone in a
      minute, then ask which step remained unclear. You can practise the troublesome part separately
      instead of repeating the whole speech. Keep a manageable rhythm, and check what the listener
      needs even when you know each other well. The two roles offer a comparison of emphasis and
      pace rather than a prediction of an event. You can review an actual experiment before the
      segment ends and carry what helped into later plans.
    advice:
      - Rehearse a short explanation and check what the listener understood.
    do:
