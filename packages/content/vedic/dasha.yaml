    summary: 你可以让把见识转为学习与把责任拆成步骤的阶段重点相接。
    body:
      你可以在把责任拆成步骤的长期主题中，加入把见识转为学习的短期观察。次运（大运内部较短的象征分段）当前由木星主导，处于土星大运内。起止范围为 {{antar_from}} 至
      {{antar_to}}。木星（以学习、引导和拓展为象征的行星）描述你怎样寻找更大的理解框架。它的位置提醒你比较经验和观点，不等于拥有某种权威。你可以把一个宽泛道理改写成具体问题，邀请有相关经历的人提供不同看法。这里关注有明确用途的群体交流。例如加入一个学习群后，你先分享能帮助大家的小资料，再看提问和回应是否尊重彼此时间。建议选择少量值得持续参与的联系，给交流设一个舒适频率；以实际互惠决定投入，不把人数或热闹程度当作关系质量。两种主题可以用来比较轻重与节奏，不是现实力量相互替代，也不预设某件事何时出现。你可以在分段结束前回看一项实际行动，把有用经验留给后续安排。
    advice:
      - 选择一个有双向回应的群体，限定参与频率。
    do:
      - 持续学习
    dont:
      - 自居权威
  en:
    title: Shani main period, Guru subperiod
    summary: You can consider learning with perspective within a longer theme of responsibility in practice.
    body:
      You can place a short-term question about learning with perspective within a longer review of
      responsibility in practice. Antardasha — a subdivision of the main symbolic period — is
      currently ruled by Guru inside the Shani Mahadasha. Its boundaries are {{antar_from}} and
      {{antar_to}}. Guru — Jupiter, a symbol of perspective and learning — asks how a larger idea
      changes an ordinary decision. The position invites reflection on guidance, without
      establishing that your advice is appropriate for everyone. You can test a broad principle
      against a real example and ask an experienced person where it stops being useful. Curiosity
      leaves more room for growth than needing to sound certain. Here joining a study group gives a
      practical scene. Sharing one useful reference and noticing how questions receive replies can
