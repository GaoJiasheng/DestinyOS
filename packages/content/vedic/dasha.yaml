      你可以在把责任拆成步骤的长期主题中，加入安顿感受的短期观察。次运（大运内部较短的象征分段）当前由月亮主导，处于土星大运内。起止范围为 {{antar_from}} 至
      {{antar_to}}。月亮（在这一体系中作为心绪与日常反应的观察点）描述你怎样恢复熟悉的节奏。它的位置为情绪需要提供比喻，不能用来评估心理状况。你可以从一天里最容易放松的时刻入手，比较陪伴、独处与环境变化对实际感受的影响。这里关注资源是否安排得清楚。例如决定参加收费课程前，把学费、通勤和练习时间列在一起，再确认它是否符合当前重点。建议在交流中明确自己的投入范围，也给临时变化留一点余地；以真实记录核对习惯，不把象征描述当作财务判断。两种主题可以用来比较轻重与节奏，不是现实力量相互替代，也不预设某件事何时出现。你可以在分段结束前回看一项实际行动，把有用经验留给后续安排。
    advice:
      - 把一项日常投入的时间与费用列清楚。
    do:
      - 留出休息
    dont:
      - 压抑感受
  en:
    title: Shani main period, Chandra subperiod
    summary: You can consider emotional continuity within a longer theme of responsibility in practice.
    body: You can place a short-term question about emotional continuity within a longer review of
      responsibility in practice. Antardasha — a subdivision of the main symbolic period — is
      currently ruled by Chandra inside the Shani Mahadasha. Its boundaries are {{antar_from}} and
      {{antar_to}}. Chandra — the Moon, used here as a reference for everyday responses — highlights
      what helps you feel settled. The position is a symbolic prompt about experience rather than an
      assessment of mental health. Notice how you move between company, solitude, and changing
      surroundings. You can describe what feels supportive without expecting another person to
      manage every shift in your mood. Here the useful scene is a small spending commitment. Before
      joining a paid workshop, look at the fee, travel time, and opportunity to practise together.
      Try stating what fits your current routine and leave space for changes in availability. Actual
      records can clarify a habit; symbolic language cannot assess the financial suitability of an
      opportunity. The two roles offer a comparison of emphasis and pace rather than a prediction of
      an event. You can review an actual experiment before the segment ends and carry what helped
      into later plans.
    advice:
      - List the time and ordinary costs attached to one commitment.
    do:
      - Make room
    dont:
      - Dismiss feelings
