      {{antar_to}}。土星（以时间、边界和持续投入为象征的行星）描述你怎样面对需要耐心的过程。它的位置适合讨论可承担的责任，不表示你应当独自忍受压力。你可以先区分必须完成、能够委托和可以暂停的部分，为长期任务留下交接与休息空间。这里关注成果怎样帮助接手的人。例如完成一项研究后，你先概括能回答的问题，再说明还没有核对的范围，方便团队使用。建议以真实反馈评估工作方法，并为新任务确认资源和交付标准；职业选择要结合现实条件，不把宫位描述当作能力测试。两种主题可以用来比较轻重与节奏，不是现实力量相互替代，也不预设某件事何时出现。你可以在分段结束前回看一项实际行动，把有用经验留给后续安排。
