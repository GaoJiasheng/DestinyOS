    dont:
      - 突然抽离
  en:
    title: Shukra main period, Ketu subperiod
    summary: You can consider choose what to release within a longer theme of reciprocity and enjoyment.
    body: You can place a short-term question about choose what to release within a longer review of
      reciprocity and enjoyment. Antardasha — a subdivision of the main symbolic period — is
      currently ruled by Ketu inside the Shukra Mahadasha. Its boundaries are {{antar_from}} and
      {{antar_to}}. Ketu — the south lunar node, opposite Rahu — serves as a symbol of
      simplification and reconsideration. It does not ask you to withdraw from people or abandon
      practical responsibilities. You can examine a familiar activity and ask what purpose it still
      serves. Pausing one optional commitment for a short interval gives you evidence about its
      value while leaving space to restore it. Here a completed piece of work provides the example.
      Summarizing what a study answers and what remains unchecked can help a colleague use it
      responsibly. Consider asking which part made their next task easier, then use that response to
      refine your method. Training, access, and workplace conditions remain relevant; a house
      description cannot evaluate your professional competence. The two roles offer a comparison of
      emphasis and pace rather than a prediction of an event. You can review an actual experiment
      before the segment ends and carry what helped into later plans.
    advice:
