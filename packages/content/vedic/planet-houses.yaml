    summary: 你可以在自我与日常姿态中观察把见识转为学习的习惯。
    body: 你可以把把见识转为学习放在自我与日常姿态的情境里观察。木星（以学习、引导和拓展为象征的行星）描述你怎样寻找更大的理解框架。它的位置提醒你比较经验和观点，不等于拥有某种权威。你可以把一个宽泛道理改写成具体问题，邀请有相关经历的人提供不同看法。你的木星位于第1宫；这里关注你的具体回应。例如在第一次参与小组活动时，先说你愿意承担什么，再询问其他人的分工，通常比急着证明自己更容易接上合作。建议以一个可观察的动作开始，不把整个人格都压在初次表现上；你可以随着真实反馈调整自己的表达。
    advice:
      - 参加新活动时，说清一项愿意承担的小任务。
    do:
      - 持续学习
    dont:
      - 自居权威
  en:
    title: 'Guru in house 1: your everyday stance'
    summary: You can explore learning with perspective in your everyday stance.
    body:
      You can explore learning with perspective through your everyday stance. Guru — Jupiter, a symbol of perspective
      and learning — asks how a larger idea changes an ordinary decision. The position invites reflection on guidance,
      without establishing that your advice is appropriate for everyone. You can test a broad principle against
      a real example and ask an experienced person where it stops being useful. Curiosity leaves more room for growth
      than needing to sound certain. Your Guru is recorded in house 1. Here the practical context is an ordinary
      introduction. When joining a local activity, stating which small task you can help with may be more useful
      than presenting a complete account of yourself. Consider noticing how the group responds, then adjusting the
      amount you take on. A first interaction is one piece of experience, not a final assessment of your personality.
    advice:
      - Offer one specific contribution when entering a new group.
    do:
      - Stay curious
    dont:
      - Claim authority
