  zh:
    title: 太阳在第1宫：自我与日常姿态
    summary: 你可以在自我与日常姿态中观察表达立场的习惯。
    body: 你可以把表达立场放在自我与日常姿态的情境里观察。太阳（在吠陀框架中观察身份与意志的象征）描述你怎样承担自己的选择。它所在的位置把注意力引向表达立场、接受反馈和确认责任，而不是给权力或社会地位打分。你可以在需要拍板时先说清判断依据，让参与者知道哪些意见还能补充。你的太阳位于第1宫；这里关注你的具体回应。例如在第一次参与小组活动时，先说你愿意承担什么，再询问其他人的分工，通常比急着证明自己更容易接上合作。建议以一个可观察的动作开始，不把整个人格都压在初次表现上；你可以随着真实反馈调整自己的表达。
    advice:
      - 参加新活动时，说清一项愿意承担的小任务。
    do:
      - 明确责任
    dont:
      - 压过他人
  en:
    title: 'Surya in house 1: your everyday stance'
    summary: You can explore visible ownership in your everyday stance.
    body:
      You can explore visible ownership through your everyday stance. Surya — the Sun, a symbol of personal
      direction — concerns how you take ownership of a choice. Its position offers a question about visibility and
      responsibility rather than a ranking of your status. A helpful contribution makes both your reasoning and
      its limits understandable to the people affected. You can practise explaining why a choice matters without
      asking everyone to share your enthusiasm. Your Surya is recorded in house 1. Here the practical context is
      an ordinary introduction. When joining a local activity, stating which small task you can help with may be
      more useful than presenting a complete account of yourself. Consider noticing how the group responds, then
      adjusting the amount you take on. A first interaction is one piece of experience, not a final assessment of
      your personality.
    advice:
      - Offer one specific contribution when entering a new group.
    do:
      - Own decisions
    dont:
      - Dominate discussions
  meta:
    author: t23-vedic-editorial-v1
    reviewed_by: null
    version: 1
    status: published
