    title: 金星在第1宫：自我与日常姿态
    summary: 你可以在自我与日常姿态中观察认真看待互惠的习惯。
    body: 你可以把认真看待互惠放在自我与日常姿态的情境里观察。金星（以愉悦、关系和协调为象征的行星）描述你怎样发现值得珍惜的体验。它的位置可以讨论审美和互惠，不替你安排伴侣身份或关系进度。你可以把喜欢的方式说清楚，再询问参与者是否也觉得舒服，让共同体验有真实的回应。你的金星位于第1宫；这里关注你的具体回应。例如在第一次参与小组活动时，先说你愿意承担什么，再询问其他人的分工，通常比急着证明自己更容易接上合作。建议以一个可观察的动作开始，不把整个人格都压在初次表现上；你可以随着真实反馈调整自己的表达。
