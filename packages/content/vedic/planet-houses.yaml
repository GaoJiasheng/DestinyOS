      - 参加新活动时，说清一项愿意承担的小任务。
    do:
      - 尊重意愿
    dont:
      - 单向迎合
  en:
    title: 'Shukra in house 1: your everyday stance'
    summary: You can explore reciprocity and enjoyment in your everyday stance.
    body:
      You can explore reciprocity and enjoyment through your everyday stance. Shukra — Venus, a symbol of enjoyment
      and reciprocity — highlights how you recognize a satisfying exchange. The reading can prompt a conversation
      about preferences without assigning a partner or a timetable for commitment. You can describe what you enjoy
      and ask whether someone else wants to share it. Mutual interest matters more than a scene that merely looks
      harmonious from outside. Your Shukra is recorded in house 1. Here the practical context is an ordinary introduction.
      When joining a local activity, stating which small task you can help with may be more useful than presenting
      a complete account of yourself. Consider noticing how the group responds, then adjusting the amount you take
      on. A first interaction is one piece of experience, not a final assessment of your personality.
    advice:
      - Offer one specific contribution when entering a new group.
    do:
      - Respect consent
    dont:
      - Perform harmony
