  zh:
    title: 白羊月亮：先试一步
    summary: 你可以用先试一步理解日常节奏。
    body: 你可以从先试一步观察自己的日常反应。月亮星座（本命恒星盘，月亮所处的恒星黄道星座）在你的盘里是白羊，这里把它作为心绪节奏的线索。星宿（沿黄道划分的月亮区域）与分段还会补充细节；有时辰时再结合上升，无时辰就保留不确定性。例如回看最近一次计划变动，比较什么安排让你更容易适应。建议把报告当作观察提示，选择一个小行动，再以真实体验决定是否保留。
    advice:
      - 先约定试做范围，再决定是否扩大投入。
    do:
      - 小步启动
    dont:
      - 催促他人
  en:
    title: 'Aries Moon: an everyday reference'
    summary: You can observe how you start with a small experiment in daily life.
    body:
      You can begin by noticing how you start with a small experiment in everyday life. Your Moon Rashi — the
      sidereal zodiac sign occupied by the Moon — is Aries. This is a reference for reflection on your responses,
      not a complete description of who you are. The lunar sector and its quarter add another perspective in the
      next chapter. A known birth time also allows a rising-sign reading; an unknown time leaves that part open.
      For example, review a recent change to your weekly routine and note what helped you adapt. You can compare
      that observation with the period themes later in the report. Consider choosing one modest action that suits
      your present circumstances, then checking the result against experience rather than trying to make every description
      fit.
    advice:
      - Set a clear stopping point for an initial trial.
    do:
      - Start small
    dont:
      - Rush others
  meta:
    author: t23-vedic-editorial-v1
    reviewed_by: null
    version: 2
    status: published
