- id: vedic.fallback.overview
  system: vedic
  section: overview
  topic: fallback
  when:
    path: noonChart
    exists: true
  weight: 1
  polarity: neutral
  tags:
    - plain
  exclusive_with: []
  zh:
    title: 先从日常体验读懂命盘
    summary: 你可以先从日常体验读懂命盘，选择适合实际生活的小行动。
    body: 你可以把命盘当作整理日常体验的一组提问。恒星黄道（以相对恒星的位置作为参照的黄道划分）与月亮信息是这份报告的基础，上升和宫位则需要出生时间支持。这里把计算依据与生活观察联系起来，不用单一符号定义你。例如回看最近一次安排变化，记录什么让你更容易适应。建议先读懂月亮、周期和已有信息的范围，再挑一个轻量行动；对不符合经验的描述保留疑问，以真实需要决定哪些部分值得尝试。
    advice:
      - 从最近一项生活变化中，记录一个有用的经验。
    do:
      - 记录体验
    dont:
      - 急于定论
  en:
    title: Begin with everyday experience
    summary: Begin with everyday experience.
    body:
      You can treat this chart as a set of questions about ordinary experience. A sidereal zodiac — a division
      referenced to the fixed-star background — provides the positional framework, while the Moon supplies a starting
      point for this reading. A rising sign and houses also need a known birth time. These different references
      help organize reflection without offering a complete description of you. For example, think about a recent
      change to a familiar routine and note what actually helped you adapt. Compare that observation with the lunar
      and period chapters rather than trying to accept every phrase at once. You can keep a question open when a
      description does not fit. Consider choosing one modest action from the report and checking whether it serves
      a real need in your present life.
    advice:
      - Record one useful observation from a recent change in routine.
    do:
      - Observe experience
    dont:
      - Force conclusions
  meta:
    author: t23-vedic-editorial-v1
    reviewed_by: null
    version: 1
    status: published
- id: vedic.fallback.moon_nakshatra
  system: vedic
  section: moon_nakshatra
  topic: fallback
  when:
    path: noonChart
    exists: true
  weight: 1
  polarity: neutral
  tags:
    - plain
  exclusive_with: []
  zh:
    title: 先理解月亮线索的范围
    summary: 你可以先理解月亮线索的范围，选择适合实际生活的小行动。
    body: 你可以先留意自己怎样回应变化，再阅读星宿的描述。月亮星宿（Nakshatra，月亮所处的二十七段恒星黄道区域之一）在传统框架中用于讨论心绪与熟悉感，分段（Pada，每段星宿的四等分之一）提供更细的修饰。这些位置不是心理测量，也不要求你表现出某种固定性格。例如一周里出现几次安排变化，你记录当时最需要的信息、陪伴或安静时间。建议比较具体情境，留意哪些安排真正有帮助；若出生时间未知，月亮可能跨过星宿边界，更适合把描述看成待核对的方向。
    advice:
      - 记录一次变化中的真实需要，不急着贴性格标签。
    do:
      - 记录体验
    dont:
      - 急于定论
  en:
    title: Understand the lunar reference first
    summary: Understand the lunar reference first.
    body:
      You can begin with how you respond when an ordinary arrangement changes. A Nakshatra — one of the twenty-seven
      sidereal sectors occupied by the Moon — supplies a cultural reference for this reflection. A Pada is one quarter
      of that sector and adds detail to the symbolic account. Neither position is a psychological measurement or
      a fixed personality requirement. Think of several changes during a week and note whether you needed clearer
      information, company, or quiet time in each case. You can compare those observations without expecting one
      response to explain every situation. Consider keeping the arrangement that helped in practice. An unknown
      birth time may leave more than one lunar sector possible, so that reading remains a direction to check rather
      than a precise conclusion.
    advice:
      - Record what you needed in a real change before applying a label.
    do:
      - Observe experience
    dont:
      - Force conclusions
  meta:
    author: t23-vedic-editorial-v1
    reviewed_by: null
    version: 1
    status: published
- id: vedic.fallback.lagna_planets
  system: vedic
  section: lagna_planets
  topic: fallback
  when:
    path: noonChart
    exists: true
  weight: 1
  polarity: neutral
  tags:
    - plain
  exclusive_with: []
  zh:
    title: 把行星主题放回具体情境
    summary: 你可以把行星主题放回具体情境，选择适合实际生活的小行动。
    body: 你可以从实际任务比较自己的表达、学习和行动方式。九曜（Graha，七颗传统行星与两个计算得到的月球交点）在这份命盘中提供不同观察角度，状态标记只是符号之间的关系。上升（Lagna，出生时东方地平线所在星座）还需要时间明确；没有它时仍可读行星星座，但不补出宫位。比如准备一项分享，你比较自己怎样整理信息、如何开始，以及什么时候需要反馈。建议一次只选一个主题实践，用实际效果调整方法；相关位置不能评估能力等级，也不能替你安排职业或关系角色。
    advice:
      - 在一个真实任务中，只比较一种做事方式。
    do:
      - 记录体验
    dont:
      - 急于定论
  en:
    title: Put planetary themes in context
    summary: Put planetary themes in context.
    body:
      'You can compare expression, learning, and action through a task you actually face. Graha — the seven
      traditional planets together with two calculated lunar nodes — provide different symbolic perspectives in
      this chart. Condition labels describe relationships within the model rather than levels of ability. Lagna,
      the sign on the eastern horizon at birth, also needs a known clock; planetary signs can still be discussed
      when that reference is missing. Preparing a short talk offers a useful scene: notice how you organize material,
      begin the task, and use feedback. You can choose one aspect to practise rather than redesign your whole approach.
      Consider checking the result in use, with actual training and circumstances supplying the information a positional
      chart cannot establish. Keep your present responsibilities in view.'
    advice:
      - Compare one working habit within an actual task.
    do:
      - Observe experience
    dont:
      - Force conclusions
  meta:
    author: t23-vedic-editorial-v1
    reviewed_by: null
    version: 1
    status: published
- id: vedic.fallback.houses
  system: vedic
  section: houses
  topic: fallback
  when:
    path: noonChart
    exists: true
  weight: 1
  polarity: neutral
  tags:
    - plain
  exclusive_with: []
  zh:
    title: 用生活领域整理实际安排
    summary: 你可以用生活领域整理实际安排，选择适合实际生活的小行动。
    body: 你可以把不同生活领域当作复盘清单，而不预设会发生什么。宫位（Bhava，按上升星座排列的十二类生活观察领域）需要出生时间和地点支持；没有这些条件时，不应推断行星落宫。宫主星（守护该宫星座的传统行星）则把两个领域联系起来，仍须与现实安排共同理解。比如本周工作、居处和共同活动争用时间，你先列清责任和可用精力，再选择最需要协商的一项。建议用清楚的约定减少重复猜测，保留自己的判断；宫位不替别人说明意愿，也不指定健康、财务或职业结果。
    advice:
      - 列出本周的责任与可用时间，选择一项重新协商。
    do:
      - 记录体验
    dont:
      - 急于定论
  en:
    title: Use life areas to organize arrangements
    summary: Use life areas to organize arrangements.
    body:
      'You can use life areas as a review checklist without expecting a sequence of events. Bhava — the twelve
      house domains arranged from the rising sign — need a usable birth time and place. Planetary house placements
      should remain open when those references are unavailable. A house lord, the traditional ruler of its zodiac
      sign, offers a symbolic link between two domains rather than a practical instruction. Suppose work, home,
      and a shared activity compete for attention this week: listing commitments and available time can reveal which
      arrangement needs discussion. Consider making one agreement explicit instead of relying on assumptions. The
      chart cannot speak for another person’s wishes or determine health, financial, or professional outcomes; actual
      information keeps these questions grounded. Let each person clarify their own priorities.'
    advice:
      - List this week’s commitments and choose one arrangement to clarify.
    do:
      - Observe experience
    dont:
      - Force conclusions
  meta:
    author: t23-vedic-editorial-v1
    reviewed_by: null
    version: 1
    status: published
- id: vedic.fallback.yogas
  system: vedic
  section: yogas
  topic: fallback
  when:
