    exists: true
  weight: 1
  polarity: neutral
  tags:
    - plain
  exclusive_with: []
  zh:
    title: 把格局当作补充观察
    summary: 你可以把格局当作补充观察，选择适合实际生活的小行动。
    body: 你可以先理解整体安排，再看有没有格局带来补充问题。瑜伽格局（Yoga，传统把某些行星或宫主关系归纳的名称）在这里按一期十二种简化规则识别；未命中不代表缺少某种能力，命中也不表示生活会按名称发展。不同位置与状态仍要一起理解，不宜把一个格局从语境中单独拿出来。例如回看一项合作，你先检查实际分工、技能和资源，再考虑某个主题是否帮助提问。建议核对专业视图中的触发依据，保留能支持现实行动的部分；没有特定格局时，也可以通过明确责任、邀请反馈和规律复盘改善体验。
    advice:
      - 先核对实际条件，再把一个格局改写成观察问题。
    do:
      - 记录体验
    dont:
      - 急于定论
  en:
    title: Treat patterns as additional perspectives
    summary: Treat patterns as additional perspectives.
    body:
      You can read the overall arrangement before asking whether a named pattern adds a useful question. Yoga
      — a traditional name for a relationship among planets or functional rulers — is detected here through twelve
      simplified rules. An absent pattern does not establish a missing ability, and a recorded one does not make
      its name a prediction. Positions and condition labels still provide context for each other. When reviewing
      a collaboration, begin with actual skills, responsibilities, and resources, then ask whether a symbolic theme
      makes your enquiry clearer. You can check the triggering evidence in the detailed view. Consider keeping only
      the perspective that supports a practical next step. Clear agreements, feedback, and an ordinary review remain
      available even when no specific pattern is recorded.
    advice:
      - Start with actual conditions and turn a pattern into a useful question.
    do:
      - Observe experience
    dont:
      - Force conclusions
  meta:
    author: t23-vedic-editorial-v1
    reviewed_by: null
    version: 1
    status: published
- id: vedic.fallback.dasha
  system: vedic
  section: dasha
  topic: fallback
  when:
    path: noonChart
    exists: true
  weight: 1
  polarity: neutral
  tags:
    - plain
  exclusive_with: []
  zh:
    title: 按时间表复盘，不预设事件
    summary: 你可以按时间表复盘，不预设事件，选择适合实际生活的小行动。
    body: 你可以用周期安排回顾，而不把日期当作事件预告。大运（Mahadasha，按月亮位置起算的长周期）和次运（Antardasha，长周期内部的较短分段）提供象征性的主题与起止边界。无时辰时次运列表留空；日期在当前计算范围之外时，也不补造当前周期。比如为接下来三次阶段回顾预留时间，你先核对时间表中的实际边界，再记下学习、沟通和休息各一项重点。建议每次只调整一个符合现实需要的安排，把体验记录下来；周期前后可以比较主题，但变化不要求在边界当天发生，也不替代真实计划的期限。
    advice:
      - 核对真实时间边界，每次复盘只调整一项安排。
    do:
      - 记录体验
    dont:
      - 急于定论
  en:
    title: Review intervals without expecting events
    summary: Review intervals without expecting events.
    body:
      You can use period intervals to organize reviews without expecting events on their boundaries. Mahadasha
      — a longer cycle calculated from the Moon’s position — and Antardasha, its shorter subdivision, supply symbolic
      themes and dates. With an unknown birth time, the subperiod list remains empty. A birth or reference date
      outside the displayed range also should not acquire an invented current period. If you plan three upcoming
      review points, first check the actual rows of the timetable, then choose a modest focus such as learning,
      communication, or rest. You can keep notes about what you tried and what happened. Consider changing one practical
      arrangement at a time; the calculation does not require a sudden shift on a boundary date or replace the deadlines
      in your real plans.
    advice:
      - Check the recorded boundaries and revise one practical arrangement per review.
    do:
      - Observe experience
    dont:
      - Force conclusions
  meta:
    author: t23-vedic-editorial-v1
    reviewed_by: null
    version: 1
    status: published
- id: vedic.fallback.navamsa
  system: vedic
  section: navamsa
  topic: fallback
  when:
    path: noonChart
    exists: true
  weight: 1
  polarity: neutral
  tags:
    - plain
  exclusive_with: []
  zh:
    title: 从真实互动理解承诺
    summary: 你可以从真实互动理解承诺，选择适合实际生活的小行动。
    body: 你可以从日常互动回看哪些安排适合长期维护。九分盘（Navamsa/D9，把每个星座细分为九段所得的补充命盘）在传统中常被用于讨论关系与内在力量，这里只保留互惠、沟通和持续投入的观察角度。它要与本命盘一起看，不能决定伴侣身份，也不规定关系进度；没有可靠出生时间时，不对精细落座作结论。比如讨论共同活动，你先说明偏好和可用时间，再询问对方是否愿意参与。建议以持续的尊重与真实回应判断相处体验，无论单身还是处在某种关系里，都可以选择适合自己的节奏。
    advice:
      - 讨论共同安排时，核对偏好、时间与双方意愿。
    do:
      - 记录体验
    dont:
      - 急于定论
  en:
    title: Understand commitment through actual interaction
    summary: Understand commitment through actual interaction.
    body:
      You can examine which arrangements you would want to maintain through actual interaction. Navamsa, or
      D9 — a supplementary chart formed from nine divisions of each zodiac sign — is traditionally discussed alongside
      relationships and inner steadiness. Here the practical focus is reciprocity, communication, and sustained
      involvement. It belongs beside the main chart and cannot identify a partner or prescribe a timetable for commitment.
      Detailed placements also remain open without a reliable birth time. Before a shared activity, describing preferences
      and available time gives both people room to choose. You can judge the experience through ongoing respect
      and real responses. Consider retaining a rhythm that suits you, whether you are single, getting to know someone,
      or maintaining an established partnership. Your preferences can remain open to revision.
    advice:
      - Check preferences, availability, and mutual willingness for a shared plan.
    do:
      - Observe experience
    dont:
      - Force conclusions
  meta:
    author: t23-vedic-editorial-v1
    reviewed_by: null
    version: 1
    status: published
- id: vedic.fallback.summary_actions
  system: vedic
  section: summary_actions
  topic: fallback
  when:
    path: noonChart
    exists: true
  weight: 1
  polarity: neutral
  tags:
    - plain
  exclusive_with: []
  zh:
    title: 选一项适合自己的实践
    summary: 你可以选一项适合自己的实践，选择适合实际生活的小行动。
    body: 你可以把报告收束为一项轻量、可回看的实践。各章的行星、星宿与周期只是文化观察框架，不能替代实际信息，也不需要你接受每一段描述。这里把建议放回你的时间、精力和真实目标，行动是否有用要看体验。比如本周分别留意一个工作交接、一项普通开支、一次清楚沟通、一段休息和一次复盘，再挑最容易的一项开始。建议记录做法与结果，保留合适部分，调整不适合的部分。传统颂念或安静回顾可以作为可选的文化体验，喜欢时再尝试，不要求信仰、不承诺效果；本报告仅供娱乐与自我反思。
    advice:
      - 本周试一项轻量行动，周末回看是否有帮助。
    do:
      - 记录体验
    dont:
      - 急于定论
  en:
    title: Choose one practice that fits
    summary: Choose one practice that fits.
    body:
      You can turn the reading into one manageable practice that you can revisit. The planetary, lunar, and
      period chapters offer cultural prompts; they do not replace actual information or require agreement with every
      description. A useful action should fit your time, capacity, and present aims. This week you might notice
      a work handover, an ordinary spending commitment, a clear conversation, a rest interval, and a brief review,
      then choose the easiest one to try. You can record what changed without using the result as proof of the chart.
      Consider keeping the part that served you and revising the rest. Chanting or quiet reflection may be explored
      as optional cultural practices if you enjoy them, without a required belief or promised effect. This report
      is for entertainment and self-reflection.
    advice:
      - Try one manageable action and review whether it served you.
    do:
      - Observe experience
    dont:
      - Force conclusions
  meta:
    author: t23-vedic-editorial-v1
    reviewed_by: null
    version: 1
    status: published
- id: vedic.unknown_time.lagna_planets
  system: vedic
  section: lagna_planets
  topic: unknown_time
  when:
    path: noonChart
    eq: true
  weight: 95
  polarity: neutral
  tags:
    - plain
  exclusive_with: []
  zh:
    title: 无时辰：上升与宫位保留待核对
    summary: 你可以先读已有信息，保留上升与宫位的不确定性。
    body: 你现在可以先读已有信息，暂时保留上升与宫位的不确定性。出生时间未知时，正午盘（以当地中午计算行星位置的参考盘）不能提供可靠的上升与宫位，月亮和九分盘细分位置也可能随时刻改变。这是输入信息的限制，不是你缺少某种生活领域；本章不补造精确位置。比如整理旧出生记录时，你可以核对有没有较可靠的时间来源，但不必为完成报告猜一个时刻。建议先从行星星座和实际日常体验入手，比较哪些描述有帮助；后来得到明确时间再重新排盘，仍以真实需要决定如何使用结果。
    advice:
      - 没有可靠来源时不猜出生时间，先使用已知信息。
    do:
      - 保留疑问
    dont:
      - 猜测时刻
  en:
    title: 'Unknown birth time: keep precise placements open'
    summary: You can use the available information without inventing precise placements.
    body:
      You can read the available information while leaving this chapter’s precise placements open. A noon chart
      — a reference calculated for local midday when the clock is unknown — cannot provide a reliable rising sign
      or houses. Lunar and fine Navamsa divisions may also change across the day. This is a limit of the input,
      not a missing life area, and a precise placement should not be invented. If an old record offers a possible
      time, checking its reliability is more useful than selecting an hour just to complete the report. You can
      begin with planetary signs and compare them with ordinary experience. Consider recomputing only when clearer
      information becomes available, while keeping your actual needs as the reason for using any interpretation.
    advice:
      - Use reliable records if available; leave the clock open when it is unknown.
    do:
      - Keep uncertainty
    dont:
      - Invent a time
  meta:
    author: t23-vedic-editorial-v1
    reviewed_by: null
    version: 1
    status: published
