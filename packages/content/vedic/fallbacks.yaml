    title: 月亮可能跨星宿：比较描述的范围
    summary: 你可以比较可能的月亮区域，不把正午位置当作精确结论。
    body: 你可以把月亮描述看成两个或更多方向的比较。可能星宿（在出生地当天实际经过的月亮区域）列表显示至少两个区域，说明缺少时辰时不能只认正午盘的一个位置。分段也会变化，不能从列表挑一个最像自己的名称来补回出生时间。比如某段描述让你想到熟悉的反应，你记录对应情境，再与另一段的观察角度比较。建议把这些体验当作自我了解的材料，保留计算限制；若日后找到可靠时间来源，可以重新核对。你不需要为了阅读这份报告强行确定一个星宿，也不必以符合某一描述来证明自己。
    advice:
      - 记录不同描述对应的情境，保留时刻不确定性。
    do:
      - 比较情境
    dont:
      - 反推时刻
  en:
    title: The Moon may cross a sector boundary
    summary: You can compare possible lunar sectors without treating the noon position as exact.
    body:
      You can compare more than one lunar reference while keeping the birth clock open. The possible Nakshatras
      — sectors traversed by the Moon during the local civil day — include at least two entries here. That means
      a single midday position cannot settle the birth sector, and quarter divisions can change as well. If one
      portrait feels familiar, note a real situation that brought it to mind rather than choosing it as evidence
      for a missing time. You can compare that experience with the other possible descriptions and leave the calculation
      uncertain. Consider checking a reliable record if one later becomes available. There is no need to select
      a sector just to finish the reading, and resemblance to a paragraph is not a method of recovering a birth
      clock.
    advice:
      - Compare descriptions with real situations while leaving the clock uncertain.
    do:
      - Compare situations
    dont:
      - Infer time
