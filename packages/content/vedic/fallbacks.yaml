    title: 无时辰：九分盘细分位置保留待核对
    summary: 你可以先读已有信息，保留九分盘细分位置的不确定性。
    body: 你现在可以先读已有信息，暂时保留九分盘细分位置的不确定性。出生时间未知时，正午盘（以当地中午计算行星位置的参考盘）不能提供可靠的上升与宫位，月亮和九分盘细分位置也可能随时刻改变。这是输入信息的限制，不是你缺少某种生活领域；本章不补造精确位置。比如整理旧出生记录时，你可以核对有没有较可靠的时间来源，但不必为完成报告猜一个时刻。建议先从行星星座和实际日常体验入手，比较哪些描述有帮助；后来得到明确时间再重新排盘，仍以真实需要决定如何使用结果。
    advice:
      - 没有可靠来源时不猜出生时间，先使用已知信息。
    do:
      - 保留疑问
    dont:
      - 猜测时刻
  en:
    title: 'Unknown birth time: keep precise placements open'
    summary: You can use the available information without inventing precise placements.
    body:
      You can read the available information while leaving this chapter’s precise placements open. A noon chart
      — a reference calculated for local midday when the clock is unknown — cannot provide a reliable rising sign
      or houses. Lunar and fine Navamsa divisions may also change across the day. This is a limit of the input,
      not a missing life area, and a precise placement should not be invented. If an old record offers a possible
      time, checking its reliability is more useful than selecting an hour just to complete the report. You can
      begin with planetary signs and compare them with ordinary experience. Consider recomputing only when clearer
      information becomes available, while keeping your actual needs as the reason for using any interpretation.
    advice:
      - Use reliable records if available; leave the clock open when it is unknown.
    do:
      - Keep uncertainty
    dont:
      - Invent a time
