    eq: cancer
  weight: 85
  polarity: neutral
  tags:
    - plain
  exclusive_with: []
  zh:
    title: 巨蟹上升：照顾需要也照顾边界
    summary: 你可能用照顾需要也照顾边界的方式进入新情境。
    body: 你进入新情境时，可能倾向于照顾需要也照顾边界。上升（上升，出生时东方地平线所在星座）在你的盘里落在巨蟹。巨蟹（以归属和照料为意象的星座）让你较容易注意场合中的安全感。你可能先观察彼此是否安心，再决定说多少、做多少；这种敏感适合用于改善相处条件。照顾别人也需要看自己的精力是否够用。例如朋友临时想找人倾诉，你愿意陪伴，但会先说明今天能聊多久。建议用具体安排表达关心，让对方知道可以期待什么，也让你有机会休息和恢复自己的节奏。这一星座由月亮守护；守护星（用于把上升主题连接到具体生活领域的行星）的落宫和状态还要另行结合，不能单凭上升判断整体表现。
    advice:
      - 表达关心时，也说明你能投入的时间。
    do:
      - 明确边界
    dont:
      - 过度承担
  en:
    title: 'Cancer Lagna: finding your footing'
    summary: You may approach a new setting by choosing to make care sustainable.
    body:
      'You may find your footing by choosing to make care sustainable. Lagna — the sidereal sign rising on the
      eastern horizon at birth — is recorded in Cancer. Cancer — a sign associated with shelter and belonging —
      brings attention to the conditions that make participation comfortable. You might notice whether people can
      ask for help without feeling exposed. Think of joining a new shared workspace: knowing where to leave your
      things and whom to ask a simple question may matter more than an impressive welcome speech. Consider naming
      the practical conditions that help you settle, then ask which ones others need. Care works best when it includes
      your capacity as well as someone else’s wishes. Its traditional ruler is Chandra. The ruler connects this
      starting approach with another part of the chart; its actual house and condition deserve a separate reading
      before you form a broader impression.'
    advice:
      - Name one practical condition that helps you feel settled.
    do:
      - Name boundaries
    dont:
      - Overextend yourself
  meta:
    author: t23-vedic-editorial-v1
    reviewed_by: null
    version: 2
    status: published
- id: vedic.lagna.leo
  system: vedic
  section: lagna_planets
  topic: lagna
  when:
    path: lagna.sign
    eq: leo
  weight: 85
  polarity: neutral
  tags:
    - plain
  exclusive_with: []
  zh:
    title: 狮子上升：让表达有清楚的方向
    summary: 你可能用让表达有清楚的方向的方式进入新情境。
    body: 你进入新情境时，可能倾向于让表达有清楚的方向。上升（上升，出生时东方地平线所在星座）在你的盘里落在狮子。狮子（以表达和被看见为意象的星座）让你倾向于通过明确贡献建立存在感。你可能希望别人看见投入的心意，也愿意让成果带有自己的风格。热情要与听取反馈配合，才便于持续合作。例如准备活动开场时，你提出鲜明的主题，同时邀请同伴补充他们最关心的信息。建议把希望得到认可的部分说具体，并把展示机会分给参与者，让个人表达成为团队交流的入口。这一星座由太阳守护；守护星（用于把上升主题连接到具体生活领域的行星）的落宫和状态还要另行结合，不能单凭上升判断整体表现。
    advice:
      - 展示成果后，请别人反馈一个具体细节。
    do:
      - 分享舞台
    dont:
      - 争抢认可
  en:
    title: 'Leo Lagna: finding your footing'
    summary: You may approach a new setting by choosing to give expression a useful purpose.
    body:
      'You may find your footing by choosing to give expression a useful purpose. Lagna — the sidereal sign
      rising on the eastern horizon at birth — is recorded in Leo. Leo — a sign concerned with visible expression
      — asks how you can make a contribution recognizable. Enjoying an audience can support creativity when there
      is also room for an honest response. Suppose you arrange a small exhibition of your photographs: choosing
      a clear sequence helps visitors understand what you noticed, while asking for their impressions reveals what
      reached them. You can distinguish appreciation of your effort from agreement with every choice. Share the
      space with other contributors, and use specific feedback to shape the next presentation. Its traditional ruler
      is Surya. The ruler connects this starting approach with another part of the chart; its actual house and condition
      deserve a separate reading before you form a broader impression.'
    advice:
      - Ask what your presentation helped someone notice.
    do:
      - Share attention
    dont:
      - Demand praise
  meta:
    author: t23-vedic-editorial-v1
    reviewed_by: null
    version: 2
    status: published
- id: vedic.lagna.virgo
  system: vedic
  section: lagna_planets
  topic: lagna
  when:
    path: lagna.sign
    eq: virgo
  weight: 85
  polarity: neutral
  tags:
    - plain
  exclusive_with: []
  zh:
    title: 处女上升：用细节改善流程
    summary: 你可能用用细节改善流程的方式进入新情境。
    body: 你进入新情境时，可能倾向于用细节改善流程。上升（上升，出生时东方地平线所在星座）在你的盘里落在处女。处女（以辨别和整理为意象的星座）让你倾向于从细节发现改善空间。你可能先问哪里不够清楚、怎样更容易重复完成，再把复杂事情拆成步骤。认真需要与完成标准配合，否则修改会挤掉休息。例如交接一份表格时，你统一标题、注明填写范围，让接手者不用猜测。建议先找最影响使用的一个问题，确认修好后的效果，再决定其余细节是否值得继续投入。这一星座由水星守护；守护星（用于把上升主题连接到具体生活领域的行星）的落宫和状态还要另行结合，不能单凭上升判断整体表现。
    advice:
      - 只优先修正最影响使用的一个问题。
    do:
      - 明确标准
    dont:
      - 反复苛求
  en:
    title: 'Virgo Lagna: finding your footing'
    summary: You may approach a new setting by choosing to make details serve the task.
    body:
      'You may find your footing by choosing to make details serve the task. Lagna — the sidereal sign rising
      on the eastern horizon at birth — is recorded in Virgo. Virgo — a sign associated with sorting and refinement
      — highlights the value of a detail that reduces confusion. You may feel more comfortable when a task has a
      usable method rather than a vague ideal. Imagine checking instructions for assembling a shelf: a clear diagram
      of one difficult joint can matter more than polishing the entire booklet. Consider asking which adjustment
      changes the user’s experience, then define a reasonable finish line. Precision is useful when it supports
      completion, and your time deserves the same attention as the work. Its traditional ruler is Budha. The ruler
      connects this starting approach with another part of the chart; its actual house and condition deserve a separate
      reading before you form a broader impression.'
    advice:
      - Fix the detail that removes the largest practical obstacle.
    do:
      - Define completion
    dont:
      - Overpolish details
  meta:
    author: t23-vedic-editorial-v1
    reviewed_by: null
    version: 2
    status: published
- id: vedic.lagna.libra
  system: vedic
  section: lagna_planets
  topic: lagna
  when:
    path: lagna.sign
    eq: libra
  weight: 85
  polarity: neutral
  tags:
    - plain
  exclusive_with: []
  zh:
    title: 天秤上升：通过协商找平衡
    summary: 你可能用通过协商找平衡的方式进入新情境。
    body: 你进入新情境时，可能倾向于通过协商找平衡。上升（上升，出生时东方地平线所在星座）在你的盘里落在天秤。天秤（以比较和协商为意象的星座）让你倾向于把彼此的立场放在一起考虑。你可能善于看见方案的差异，希望决定兼顾参与者的需要。公平也包括及时表达自己的意见，不必把沉默当作体贴。例如一起安排出行时，你先列出大家的时间限制，再提出可讨论的路线。建议确认哪些条件不能调整、哪些愿意交换，给讨论一个结束点，让协商真正帮助事情向前。这一星座由金星守护；守护星（用于把上升主题连接到具体生活领域的行星）的落宫和状态还要另行结合，不能单凭上升判断整体表现。
    advice:
      - 协商前分别写下底线与可调整部分。
    do:
      - 说清立场
    dont:
      - 拖延决定
  en:
    title: 'Libra Lagna: finding your footing'
    summary: You may approach a new setting by choosing to build workable agreements.
    body:
      'You may find your footing by choosing to build workable agreements. Lagna — the sidereal sign rising
      on the eastern horizon at birth — is recorded in Libra. Libra — a sign linked with comparison and agreement
      — encourages you to examine how choices affect everyone involved. Your own preference belongs in that comparison
      rather than outside it. Picture selecting a shared meal with friends: asking about budgets, tastes, and available
      time can make the decision easier, provided someone eventually names a workable option. Try stating what you
      prefer and what you can adjust as two separate points. A clear decision time lets consideration become an
      arrangement people can actually use, instead of another round of polite hesitation. Its traditional ruler
      is Shukra. The ruler connects this starting approach with another part of the chart; its actual house and
      condition deserve a separate reading before you form a broader impression.'
    advice:
      - State your preference alongside what you can adjust.
    do:
      - State preferences
    dont:
      - Delay decisions
  meta:
    author: t23-vedic-editorial-v1
    reviewed_by: null
    version: 2
    status: published
- id: vedic.lagna.scorpio
  system: vedic
  section: lagna_planets
  topic: lagna
  when:
    path: lagna.sign
    eq: scorpio
  weight: 85
  polarity: neutral
  tags:
    - plain
  exclusive_with: []
  zh:
    title: 天蝎上升：深入了解但保留空间
    summary: 你可能用深入了解但保留空间的方式进入新情境。
    body: 你进入新情境时，可能倾向于深入了解但保留空间。上升（上升，出生时东方地平线所在星座）在你的盘里落在天蝎。天蝎（以深入和信任为意象的星座）让你倾向于追问事情背后的动力。你可能不满足于表面回答，希望弄清承诺是否可靠、信息为何缺失。认真了解也要尊重对方愿意分享的范围。例如合作任务反复延期，你先询问阻碍和需要的支持，而不是猜测对方的动机。建议用可以核对的问题替代试探，说明自己的担心与边界；对暂时无法确认的部分，保留观察，不急着下结论。这一星座由火星守护；守护星（用于把上升主题连接到具体生活领域的行星）的落宫和状态还要另行结合，不能单凭上升判断整体表现。
    advice:
      - 把担心改写成可核对的问题，并尊重回应范围。
    do:
      - 核对事实
    dont:
      - 过度试探
  en:
    title: 'Scorpio Lagna: finding your footing'
    summary: You may approach a new setting by choosing to explore depth with consent.
    body:
      You may find your footing by choosing to explore depth with consent. Lagna — the sidereal sign rising
      on the eastern horizon at birth — is recorded in Scorpio. Scorpio — a sign associated with depth and trust
      — brings attention to what an agreement leaves unspoken. You may want to understand the reason behind a change
      rather than accept a smooth explanation. During a shared project, a missed handover could prompt a useful
      conversation about workload and expectations. Consider asking about observable obstacles before deciding what
      another person intended. Respecting a refusal to disclose private details also belongs to trust. Depth can
      strengthen a relationship when curiosity is explicit and the other person remains free to set limits. Its
      traditional ruler is Mangala. The ruler connects this starting approach with another part of the chart; its
      actual house and condition deserve a separate reading before you form a broader impression.
    advice:
      - Ask about an observable obstacle before inferring motives.
    do:
      - Check facts
    dont:
      - Test people
  meta:
    author: t23-vedic-editorial-v1
    reviewed_by: null
    version: 2
    status: published
- id: vedic.lagna.sagittarius
  system: vedic
  section: lagna_planets
  topic: lagna
  when:
    path: lagna.sign
    eq: sagittarius
  weight: 85
  polarity: neutral
  tags:
    - plain
  exclusive_with: []
  zh:
    title: 射手上升：让探索连接实际经验
    summary: 你可能用让探索连接实际经验的方式进入新情境。
    body: 你进入新情境时，可能倾向于让探索连接实际经验。上升（上升，出生时东方地平线所在星座）在你的盘里落在射手。射手（以拓展和意义为意象的星座）让你倾向于从更大的图景理解选择。你可能喜欢新观点、新环境，以及能说明为什么值得投入的目标。方向感仍需要具体过程支撑，不能只靠热情。例如你想学习一种新语言，先选择能在日常使用的场景，再安排短时练习。建议把远期愿望拆成可以回顾的阶段，允许经验修正原来的设想，保持好奇也照顾眼前的责任。这一星座由木星守护；守护星（用于把上升主题连接到具体生活领域的行星）的落宫和状态还要另行结合，不能单凭上升判断整体表现。
    advice:
      - 把远期愿望拆成一项本周可体验的行动。
    do:
      - 开放探索
    dont:
      - 夸大承诺
  en:
    title: 'Sagittarius Lagna: finding your footing'
    summary: You may approach a new setting by choosing to connect exploration with experience.
    body:
      'You may find your footing by choosing to connect exploration with experience. Lagna — the sidereal sign
      rising on the eastern horizon at birth — is recorded in Sagittarius. Sagittarius — a sign associated with
      exploration and meaning — asks what a wider perspective adds to your next choice. You may enjoy ideas that
      connect an ordinary task with a larger purpose. Imagine visiting an unfamiliar neighbourhood: talking with
      residents can challenge the story you brought with you and make the excursion more informative. You can keep
      an open question rather than arrive seeking confirmation. Bring one useful observation back into your routine,
      and review whether your longer plan still fits the people, responsibilities, and resources around you. Its
      traditional ruler is Guru. The ruler connects this starting approach with another part of the chart; its actual
      house and condition deserve a separate reading before you form a broader impression.'
    advice:
      - Bring one observation from an unfamiliar setting into daily practice.
    do:
      - Explore openly
    dont:
      - Overpromise results
