- id: vedic.lagna.aries
  system: vedic
  section: lagna_planets
  topic: lagna
  when:
    path: lagna.sign
    eq: aries
  weight: 85
  polarity: neutral
  tags:
    - plain
  exclusive_with: []
  zh:
    title: 白羊上升：先试一步
    summary: 你可能用先试一步的方式进入新情境。
    body: 你进入新情境时，可能倾向于先试一步。上升（上升，出生时东方地平线所在星座）在你的盘里落在白羊。白羊（以启动和直接行动为意象的星座）让你较容易从尝试中理解问题。这里强调先动手再修正的节奏，并不衡量你比别人更有勇气。面对陌生任务，你可能希望尽快看到一个可操作的入口。例如小组刚接到新项目时，你先画出流程草图，让同伴对着具体方案补充遗漏。建议预先约定试做的范围与停止点，给不同速度的人留出表达时间。这一星座由火星守护；守护星（用于把上升主题连接到具体生活领域的行星）的落宫和状态还要另行结合，不能单凭上升判断整体表现。
    advice:
      - 先约定试做范围，再决定是否扩大投入。
    do:
      - 小步启动
    dont:
      - 催促他人
  en:
    title: 'Aries Lagna: finding your footing'
    summary: You may approach a new setting by choosing to start with a small experiment.
    body:
      'You may find your footing by choosing to start with a small experiment. Lagna — the sidereal sign rising
      on the eastern horizon at birth — is recorded in Aries. Aries — a sign associated with initiating movement
      — invites you to learn through a manageable first attempt. A direct approach can make uncertainty feel less
      abstract, although speed and readiness are separate questions. Picture trying a new hobby: handling the basic
      tools for twenty minutes may teach you more than collecting another set of instructions. Consider choosing
      a limited trial that you can undo, and tell anyone involved what remains provisional. Initiative becomes easier
      to share when other people have time to contribute before the plan gathers momentum. Its traditional ruler
      is Mangala. The ruler connects this starting approach with another part of the chart; its actual house and
      condition deserve a separate reading before you form a broader impression.'
    advice:
      - Set a clear stopping point for an initial trial.
    do:
      - Start small
    dont:
      - Rush others
  meta:
    author: t23-vedic-editorial-v1
    reviewed_by: null
    version: 2
    status: published
- id: vedic.lagna.taurus
  system: vedic
  section: lagna_planets
  topic: lagna
  when:
    path: lagna.sign
    eq: taurus
  weight: 85
  polarity: neutral
  tags:
    - plain
  exclusive_with: []
  zh:
    title: 金牛上升：建立稳定的手感
    summary: 你可能用建立稳定的手感的方式进入新情境。
    body: 你进入新情境时，可能倾向于建立稳定的手感。上升（上升，出生时东方地平线所在星座）在你的盘里落在金牛。金牛（以稳定和感官体验为意象的星座）让你倾向于通过重复建立信任。你可能更重视事情是否舒服、耐用、可以持续，而不是一次表现有多热闹。熟悉的节奏能减少临时切换的负担，但也需要给新方法留位置。例如整理厨房时，你先把常用工具放到容易拿到的地方，试用几天再调整。建议保留一项有效习惯，同时为一个小变化设观察期，以实际体验决定取舍。这一星座由金星守护；守护星（用于把上升主题连接到具体生活领域的行星）的落宫和状态还要另行结合，不能单凭上升判断整体表现。
    advice:
      - 保留稳定习惯，每次只调整一个细节。
    do:
      - 稳步练习
    dont:
      - 拒绝变化
  en:
    title: 'Taurus Lagna: finding your footing'
    summary: You may approach a new setting by choosing to find a repeatable pace.
    body:
      'You may find your footing by choosing to find a repeatable pace. Lagna — the sidereal sign rising on
      the eastern horizon at birth — is recorded in Taurus. Taurus — the sign of sustained attention to tangible
      experience — points toward a pace you can maintain. You may prefer to understand what an arrangement feels
      like after repeated use rather than through a persuasive introduction. Imagine rehearsing a short piece of
      music until its rhythm becomes comfortable: consistency offers useful feedback, but familiarity alone does
      not establish quality. You can compare the familiar version with one modest alternative before settling. Keep
      what supports your routine, and allow enough flexibility for circumstances that have actually changed. Its
      traditional ruler is Shukra. The ruler connects this starting approach with another part of the chart; its
      actual house and condition deserve a separate reading before you form a broader impression.'
    advice:
      - Compare one familiar routine with a modest alternative.
    do:
      - Practise steadily
    dont:
      - Reject changes
  meta:
    author: t23-vedic-editorial-v1
    reviewed_by: null
    version: 2
    status: published
- id: vedic.lagna.gemini
  system: vedic
  section: lagna_planets
  topic: lagna
  when:
    path: lagna.sign
    eq: gemini
  weight: 85
  polarity: neutral
  tags:
    - plain
  exclusive_with: []
  zh:
    title: 双子上升：把好奇变成问题
    summary: 你可能用把好奇变成问题的方式进入新情境。
    body: 你进入新情境时，可能倾向于把好奇变成问题。上升（上升，出生时东方地平线所在星座）在你的盘里落在双子。双子（以交流和比较为意象的星座）让你倾向于从不同说法中寻找线索。你的注意力可能随着新信息移动，适合把疑问说出来，再比较各自的依据。灵活不等于每个选项都要同时进行。例如同事提出两个执行方案，你先分别询问成本、交接方式和最容易卡住的环节，再形成简短记录。建议在探索之后安排收束时间，把最值得核对的一点交给具体行动，而不是不断增加选项。这一星座由水星守护；守护星（用于把上升主题连接到具体生活领域的行星）的落宫和状态还要另行结合，不能单凭上升判断整体表现。
    advice:
      - 探索结束后写下一个决定和待核对的问题。
    do:
      - 整理问题
    dont:
      - 分散注意
  en:
    title: 'Gemini Lagna: finding your footing'
    summary: You may approach a new setting by choosing to turn curiosity into clear questions.
    body:
      You may find your footing by choosing to turn curiosity into clear questions. Lagna — the sidereal sign
      rising on the eastern horizon at birth — is recorded in Gemini. Gemini — a sign connected with exchange and
      comparison — encourages learning through questions. You may notice how a subject changes when another person
      describes it, making conversation a useful research tool. At a community workshop, for instance, asking two
      participants how they learned a technique can reveal differences that the instructions overlook. Try recording
      the question each answer resolves before opening another line of enquiry. A deadline for choosing the next
      step keeps curiosity useful without requiring you to follow every interesting possibility at once. Its traditional
      ruler is Budha. The ruler connects this starting approach with another part of the chart; its actual house
      and condition deserve a separate reading before you form a broader impression.
    advice:
      - Give an open enquiry a time to narrow into action.
    do:
      - Organize questions
    dont:
      - Scatter attention
  meta:
    author: t23-vedic-editorial-v1
    reviewed_by: null
    version: 2
    status: published
- id: vedic.lagna.cancer
  system: vedic
  section: lagna_planets
