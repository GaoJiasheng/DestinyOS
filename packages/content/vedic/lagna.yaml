    title: 水瓶上升：把想法放进共同讨论
    summary: 你可能用把想法放进共同讨论的方式进入新情境。
    body: 你进入新情境时，可能倾向于把想法放进共同讨论。上升（上升，出生时东方地平线所在星座）在你的盘里落在水瓶。水瓶（以群体和改进规则为意象的星座）让你倾向于从系统角度思考问题。你可能会注意某个安排对不同人是否方便，也愿意试用新的合作方式。新颖需要与使用者的体验相接，不能只看构想是否漂亮。例如团队消息太多，你提议统一更新格式，再邀请同伴试用并指出困难。建议在改变规则前解释目标，保留反馈渠道，让不同习惯的人参与调整，逐步验证想法能否减少负担。这一星座由土星守护；守护星（用于把上升主题连接到具体生活领域的行星）的落宫和状态还要另行结合，不能单凭上升判断整体表现。
    advice:
      - 改规则前先询问使用者最需要解决的问题。
    do:
      - 邀请反馈
    dont:
      - 强推改动
  en:
    title: 'Aquarius Lagna: finding your footing'
    summary: You may approach a new setting by choosing to test ideas with a group.
    body:
      'You may find your footing by choosing to test ideas with a group. Lagna — the sidereal sign rising on
      the eastern horizon at birth — is recorded in Aquarius. Aquarius — a sign associated with groups and alternative
      arrangements — draws attention to the rules surrounding a problem. You may wonder whether the usual process
      could make participation easier for more people. Think of a club whose meetings exclude members on late shifts:
      offering a short written recap is a practical experiment, while assuming everyone wants a new platform may
      add work. Consider asking affected people before changing the format. A useful innovation has an observable
      purpose and room for revision, so keep feedback attached to the idea from the beginning. Its traditional ruler
      is Shani. The ruler connects this starting approach with another part of the chart; its actual house and condition
      deserve a separate reading before you form a broader impression.'
    advice:
      - Ask the people affected which part of a process blocks participation.
    do:
      - Invite feedback
    dont:
      - Impose changes
