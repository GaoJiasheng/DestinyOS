  zh:
    title: 双鱼上升：给感受一个表达容器
    summary: 你可能用给感受一个表达容器的方式进入新情境。
    body: 你进入新情境时，可能倾向于给感受一个表达容器。上升（上升，出生时东方地平线所在星座）在你的盘里落在双鱼。双鱼（以想象和共感为意象的星座）让你倾向于先感受氛围，再寻找表达方式。你可能善于看见尚未说清的情绪，让不同经验通过故事或画面相接。理解别人也需要核对，感受不能代替对方的实际回应。例如朋友语气变得安静，你先询问是否想休息，而不是直接安排帮助。建议用记录、创作或短暂独处整理自己的感受，再清楚说出能够提供什么，保留温柔也保留边界。这一星座由木星守护；守护星（用于把上升主题连接到具体生活领域的行星）的落宫和状态还要另行结合，不能单凭上升判断整体表现。
    advice:
      - 先整理自己的感受，再向对方核对理解。
    do:
      - 清楚表达
    dont:
      - 代人决定
  en:
    title: 'Pisces Lagna: finding your footing'
    summary: You may approach a new setting by choosing to give impressions a clear form.
    body:
      You may find your footing by choosing to give impressions a clear form. Lagna — the sidereal sign rising
      on the eastern horizon at birth — is recorded in Pisces. Pisces — a sign linked with imagination and receptivity
      — invites you to give a vague impression a form that others can understand. You might notice the mood of a
      conversation before knowing what it means. Sketching, writing a few lines, or choosing music can help you
      describe your own experience without deciding how someone else feels. You can then ask whether your impression
      matches theirs. Leave room for an answer you did not expect, and state what support you have the capacity
      to offer. Empathy becomes more practical when it includes clarification and boundaries. Its traditional ruler
      is Guru. The ruler connects this starting approach with another part of the chart; its actual house and condition
      deserve a separate reading before you form a broader impression.
    advice:
      - Describe an impression and invite the other person to clarify it.
    do:
      - Clarify impressions
    dont:
      - Assume needs
  meta:
    author: t23-vedic-editorial-v1
