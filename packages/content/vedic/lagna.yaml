    title: 摩羯上升：让责任有可持续的节奏
    summary: 你可能用让责任有可持续的节奏的方式进入新情境。
    body: 你进入新情境时，可能倾向于让责任有可持续的节奏。上升（上升，出生时东方地平线所在星座）在你的盘里落在摩羯。摩羯（以责任和累积为意象的星座）让你倾向于通过可靠的过程建立成果。你可能重视约定、进度和长期投入，希望努力留下能继续使用的东西。承担责任也需要区分自己的部分与共同的部分。例如组织一项长期活动，你先写明各人的职责和交接时间，再按阶段检查进展。建议为计划加入休息和调整空间，把反馈当作维护过程的工具，别只在任务完成后才允许自己放松。这一星座由土星守护；守护星（用于把上升主题连接到具体生活领域的行星）的落宫和状态还要另行结合，不能单凭上升判断整体表现。
    advice:
      - 为长期任务写明交接人和休息安排。
    do:
      - 安排节奏
    dont:
      - 独自硬撑
  en:
    title: 'Capricorn Lagna: finding your footing'
    summary: You may approach a new setting by choosing to pace responsibility over time.
    body:
      'You may find your footing by choosing to pace responsibility over time. Lagna — the sidereal sign rising
      on the eastern horizon at birth — is recorded in Capricorn. Capricorn — a sign connected with sustained responsibility
      — invites you to notice how an effort holds up over time. You may value arrangements that survive a busy week
      rather than depend on exceptional enthusiasm. Suppose you maintain a community noticeboard: a simple schedule
      and a named substitute can keep it useful when you are unavailable. Try separating what you personally own
      from what requires a shared agreement. Periodic maintenance and time away are parts of continuity, and feedback
      can reveal when a reliable routine has become unnecessarily burdensome. Its traditional ruler is Shani. The
      ruler connects this starting approach with another part of the chart; its actual house and condition deserve
      a separate reading before you form a broader impression.'
    advice:
      - Build a substitute and a review date into a recurring task.
    do:
      - Pace commitments
    dont:
      - Carry everything
