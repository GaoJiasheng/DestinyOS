    body: 你可以把工作贡献与公开责任与自我与日常姿态放在一起回看。宫主星（守护该宫星座、把两个生活领域联系起来的行星）从第10宫落到第1宫；这只是观察联系，不表示某件事会在另一领域发生。第十宫（Bhava，观察公开工作与责任的领域）适合讨论怎样让成果被理解。这里不指定职业、职位或成就等级。你可以比较实际技能、可用机会和团队需要，留意自己在什么任务中贡献清楚，以及哪些责任需要更明确的授权和支持。这里关注你的具体回应。例如在第一次参与小组活动时，先说你愿意承担什么，再询问其他人的分工，通常比急着证明自己更容易接上合作。建议以一个可观察的动作开始，不把整个人格都压在初次表现上；你可以随着真实反馈调整自己的表达。
    advice:
      - 参加新活动时，说清一项愿意承担的小任务。
    do:
      - 回看联系
    dont:
      - 孤立判断
