  en:
    title: Lord of house 1 in house 1
    summary: You can connect questions about your everyday stance with your everyday stance.
    body:
      You can examine a connection between your everyday stance and your everyday stance. A house lord — the
      traditional ruler of the sign on a house — links the starting area with the house where that ruler is placed.
      The ruler of house 1 is recorded in house 1, supplying a reflective connection rather than an event prediction.
      The first Bhava — a house used to consider your everyday stance — focuses on how you enter a situation. It
      offers questions about participation rather than a description of appearance or physical condition. You can
      notice how you introduce a request, what you reveal about your priorities, and when you prefer to take the
      first step. Here the practical context is an ordinary introduction. When joining a local activity, stating
      which small task you can help with may be more useful than presenting a complete account of yourself. Consider
      noticing how the group responds, then adjusting the amount you take on. A first interaction is one piece of
      experience, not a final assessment of your personality.
    advice:
      - Offer one specific contribution when entering a new group.
    do:
      - Compare contexts
    dont:
      - Force connections
