  zh:
    title: 前阿沙荼 · 第1分段：表达信念并保持开放
    summary: 你倾向于表达信念并保持开放，也可以用让表达有清楚的方向调节节奏。
    body: 你倾向于表达信念并保持开放。你的月亮位于前阿沙荼星宿（恒星黄道二十七段区域之一）的第1分段，周期主星是金星；主星在这里是排列大运的参照，不另加性格定论。帕达（星宿四等分之一）对应九分盘（星座九等分的补充盘）的狮子，为心绪主题加入让表达有清楚的方向的修饰。把这个星宿想成扬起的帆，提醒你方向还要随着实际风向调整。你可能希望别人看见投入的心意，也愿意让成果带有自己的风格。比如你提出一个改进计划，先说明希望解决的问题，再请别人指出遗漏。建议让信念支持行动，同时保留一个能被反馈修改的地方。建议展示成果后，请别人反馈一个具体细节。
    advice:
      - 展示成果后，请别人反馈一个具体细节。
    do:
      - 分享舞台
    dont:
      - 争抢认可
  en:
    title: 'Purva Ashadha, quarter 1: express conviction and stay open'
    summary: You may express conviction and stay open, with room to give expression a useful purpose.
    body: You may express conviction and stay open. Your Moon occupies quarter 1 of Purva Ashadha, a
      Nakshatra — one of twenty-seven sidereal lunar sectors — whose period ruler is Shukra — Venus;
      this ruler supplies a calculation reference, not an extra personality label. The Pada — one
      quarter of a sector — maps to Leo in Navamsa, the chart formed from nine divisions of each
      zodiac sign. A raised sail offers an image for conviction that still responds to conditions.
      Enjoying an audience can support creativity when there is also room for an honest response.
      When proposing an improvement, explain the problem you hope to solve and ask where your plan
      may miss something. Try keeping one assumption open to revision, so enthusiasm helps the idea
      move rather than requiring everyone to defend it unchanged. Ask what your presentation helped
      someone notice.
    advice:
      - Ask what your presentation helped someone notice.
    do:
      - Share attention
    dont:
      - Demand praise
