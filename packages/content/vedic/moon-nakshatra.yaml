  zh:
    title: 斯瓦提 · 第1分段：在弹性中保持方向
    summary: 你倾向于在弹性中保持方向，也可以用让探索连接实际经验调节节奏。
    body: 你倾向于在弹性中保持方向。你的月亮位于斯瓦提星宿（恒星黄道二十七段区域之一）的第1分段，周期主星是罗睺（北月球交点的传统名称）；主星在这里是排列大运的参照，不另加性格定论。帕达（星宿四等分之一）对应九分盘（星座九等分的补充盘）的射手，为心绪主题加入让探索连接实际经验的修饰。把这个星宿想成风中的枝条，提醒你调整不等于没有立场。你可能喜欢新观点、新环境，以及能说明为什么值得投入的目标。比如临时改变工作地点，你先确认必须完成的部分，再决定用什么节奏处理。建议说清自己的可用时间和交付范围，让自由与合作能够同时存在。建议把远期愿望拆成一项本周可体验的行动。
    advice:
      - 把远期愿望拆成一项本周可体验的行动。
    do:
      - 开放探索
    dont:
      - 夸大承诺
  en:
    title: 'Swati, quarter 1: keep direction while adapting'
    summary: You may keep direction while adapting, with room to connect exploration with experience.
    body:
      You may keep direction while adapting. Your Moon occupies quarter 1 of Swati, a Nakshatra —
      one of twenty-seven sidereal lunar sectors — whose period ruler is Rahu — the north lunar
      node; this ruler supplies a calculation reference, not an extra personality label. The Pada —
      one quarter of a sector — maps to Sagittarius in Navamsa, the chart formed from nine divisions
      of each zodiac sign. A branch moving with the wind offers an image for flexibility that still
      has an anchor. You may enjoy ideas that connect an ordinary task with a larger purpose. When
      your usual workspace is unavailable, naming the essential outcome can help you choose another
      route. Consider telling collaborators your available time and expected handover, so an
      independent approach remains easy for others to coordinate with. Bring one observation from an
      unfamiliar setting into daily practice.
    advice:
      - Bring one observation from an unfamiliar setting into daily practice.
    do:
      - Explore openly
    dont:
      - Overpromise results
