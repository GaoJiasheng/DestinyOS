  en:
    title: 'Shatabhisha, quarter 4: make solitude deliberate and connected'
    summary: You may make solitude deliberate and connected, with room to give impressions a clear form.
    body:
      You may make solitude deliberate and connected. Your Moon occupies quarter 4 of Shatabhisha, a
      Nakshatra — one of twenty-seven sidereal lunar sectors — whose period ruler is Rahu — the
      north lunar node; this ruler supplies a calculation reference, not an extra personality label.
      The Pada — one quarter of a sector — maps to Pisces in Navamsa, the chart formed from nine
