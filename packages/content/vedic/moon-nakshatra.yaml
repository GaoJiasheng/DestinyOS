  zh:
    title: 阿湿毗尼 · 第1分段：让热情走完过程
    summary: 你倾向于让热情走完过程，也可以用先试一步调节节奏。
    body: 你倾向于让热情走完过程。你的月亮位于阿湿毗尼星宿（恒星黄道二十七段区域之一）的第1分段，周期主星是计都（南月球交点的传统名称）；主星在这里是排列大运的参照，不另加性格定论。帕达（星宿四等分之一）对应九分盘（星座九等分的补充盘）的白羊，为心绪主题加入先试一步的修饰。这里用开门的动作作为比喻，提醒你把初步回应接到持续陪伴上。这里强调先动手再修正的节奏，并不衡量你比别人更有勇气。比如新同事不熟悉流程，你带着走一遍之后，约好隔天再核对还有哪里不清楚。建议把后续联系写进最初的安排。建议先约定试做范围，再决定是否扩大投入。
    advice:
      - 先约定试做范围，再决定是否扩大投入。
    do:
      - 小步启动
    dont:
      - 催促他人
  en:
    title: 'Ashwini, quarter 1: carry enthusiasm beyond the opening'
    summary: You may carry enthusiasm beyond the opening, with room to start with a small experiment.
    body: 'You may carry enthusiasm beyond the opening. Your Moon occupies quarter 1 of Ashwini, a
      Nakshatra — one of twenty-seven sidereal lunar sectors — whose period ruler is Ketu — the
      south lunar node; this ruler supplies a calculation reference, not an extra personality label.
      The Pada — one quarter of a sector — maps to Aries in Navamsa, the chart formed from nine
      divisions of each zodiac sign. A doorway offers a useful image: opening it matters, but so
      does making the passage usable. A direct approach can make uncertainty feel less abstract,
      although speed and readiness are separate questions. If you introduce someone to a community
      class, a later check about how they settled can carry the welcome further. Consider keeping a
      modest follow-up alongside your initial burst of interest. Set a clear stopping point for an
      initial trial.'
    advice:
      - Set a clear stopping point for an initial trial.
    do:
      - Start small
    dont:
      - Rush others
