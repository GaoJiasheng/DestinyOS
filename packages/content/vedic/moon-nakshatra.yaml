    title: 雷瓦蒂 · 第1分段：照顾过渡中的细节
    summary: 你倾向于照顾过渡中的细节，也可以用让探索连接实际经验调节节奏。
    body: 你倾向于照顾过渡中的细节。你的月亮位于雷瓦蒂星宿（恒星黄道二十七段区域之一）的第1分段，周期主星是水星；主星在这里是排列大运的参照，不另加性格定论。帕达（星宿四等分之一）对应九分盘（星座九等分的补充盘）的射手，为心绪主题加入让探索连接实际经验的修饰。把这个星宿想成旅程最后的路标，提醒你温柔也需要清楚的交接。你可能喜欢新观点、新环境，以及能说明为什么值得投入的目标。比如活动结束后，你核对资料是否发出、遗留问题由谁回应，再安排休息。建议把收束做得明确，让别人知道下一步在哪里，也让自己能够安心停下。建议把远期愿望拆成一项本周可体验的行动。
    advice:
      - 把远期愿望拆成一项本周可体验的行动。
    do:
      - 开放探索
    dont:
      - 夸大承诺
  en:
    title: 'Revati, quarter 1: care for details during a transition'
    summary: You may care for details during a transition, with room to connect exploration with experience.
    body: You may care for details during a transition. Your Moon occupies quarter 1 of Revati, a
      Nakshatra — one of twenty-seven sidereal lunar sectors — whose period ruler is Budha —
      Mercury; this ruler supplies a calculation reference, not an extra personality label. The Pada
      — one quarter of a sector — maps to Sagittarius in Navamsa, the chart formed from nine
      divisions of each zodiac sign. A final waymarker offers an image for a transition supported by
      clear information. You may enjoy ideas that connect an ordinary task with a larger purpose.
      After a workshop, a short note about materials and unanswered questions can help participants
      continue on their own. Try making the handover explicit and then allowing yourself to stop,
      rather than extending support without a clear end. Bring one observation from an unfamiliar
      setting into daily practice.
    advice:
      - Bring one observation from an unfamiliar setting into daily practice.
    do:
      - Explore openly
    dont:
      - Overpromise results
