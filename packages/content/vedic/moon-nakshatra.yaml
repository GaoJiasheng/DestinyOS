  zh:
    title: 阿湿毗尼 · 第2分段：迅速回应
    summary: 你倾向于迅速回应，也可以用建立稳定的手感调节节奏。
    body: 你倾向于迅速回应。你的月亮位于阿湿毗尼星宿（恒星黄道二十七段区域之一）的第2分段，周期主星是计都（南月球交点的传统名称）；主星在这里是排列大运的参照，不另加性格定论。帕达（星宿四等分之一）对应九分盘（星座九等分的补充盘）的金牛，为心绪主题加入建立稳定的手感的修饰。可以把这个星宿想成起跑线：重点是启动之后怎样照顾节奏，而不是每次都跑在最前面。你可能更重视事情是否舒服、耐用、可以持续，而不是一次表现有多热闹。比如朋友准备搬家，你先帮忙列出第一箱该收什么，再询问接下来需要谁协助。建议保留稳定习惯，每次只调整一个细节。
    advice:
      - 保留稳定习惯，每次只调整一个细节。
    do:
      - 稳步练习
    dont:
      - 拒绝变化
  en:
    title: 'Ashwini, quarter 2: respond to an opening'
    summary: You may respond to an opening, with room to find a repeatable pace.
    body:
      'You may respond to an opening. Your Moon occupies quarter 2 of Ashwini, a Nakshatra — one of
      twenty-seven sidereal lunar sectors — whose period ruler is Ketu — the south lunar node; this
      ruler supplies a calculation reference, not an extra personality label. The Pada — one quarter
      of a sector — maps to Taurus in Navamsa, the chart formed from nine divisions of each zodiac
      sign. Think of a starting line: the useful question concerns the first stretch rather than who
      finishes ahead. You may prefer to understand what an arrangement feels like after repeated use
      rather than through a persuasive introduction. When a neighbour needs a hand carrying
      supplies, checking the route and taking one load can make help tangible. Try leaving room to
      learn what the next stage requires. Compare one familiar routine with a modest alternative.'
    advice:
      - Compare one familiar routine with a modest alternative.
    do:
      - Practise steadily
    dont:
      - Reject changes
  meta:
    author: t23-vedic-editorial-v1
    reviewed_by: null
    version: 3
    status: published
