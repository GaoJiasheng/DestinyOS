  en:
    title: 'Pushya, quarter 1: offer support you can sustain'
    summary: You may offer support you can sustain, with room to give expression a useful purpose.
    body:
      'You may offer support you can sustain. Your Moon occupies quarter 1 of Pushya, a Nakshatra —
      one of twenty-seven sidereal lunar sectors — whose period ruler is Shani — Saturn; this ruler
      supplies a calculation reference, not an extra personality label. The Pada — one quarter of a
      sector — maps to Leo in Navamsa, the chart formed from nine divisions of each zodiac sign. A
      supply point offers a practical image: it needs replenishment as well as generosity. Enjoying
      an audience can support creativity when there is also room for an honest response. If a
      classmate struggles with an assignment, sharing a useful reference and an agreed discussion
      time may help more than taking over. Consider offering support that also leaves the other
      person an opportunity to practise independently. Ask what your presentation helped someone
      notice.'
    advice:
      - Ask what your presentation helped someone notice.
    do:
      - Share attention
    dont:
