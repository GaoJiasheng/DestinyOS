    body: 你倾向于迅速回应。你的月亮位于阿湿毗尼星宿（恒星黄道二十七段区域之一）的第4分段，周期主星是计都（南月球交点的传统名称）；主星在这里是排列大运的参照，不另加性格定论。帕达（星宿四等分之一）对应九分盘（星座九等分的补充盘）的巨蟹，为心绪主题加入照顾需要也照顾边界的修饰。可以把这个星宿想成起跑线：重点是启动之后怎样照顾节奏，而不是每次都跑在最前面。你可能先观察彼此是否安心，再决定说多少、做多少；这种敏感适合用于改善相处条件。比如朋友准备搬家，你先帮忙列出第一箱该收什么，再询问接下来需要谁协助。建议表达关心时，也说明你能投入的时间。
