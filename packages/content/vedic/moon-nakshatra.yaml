# // DESIGN-GAP: 星宿意象采用现代生活比喻，不编造经典引文；Pada 按引擎恒星黄经对应的 D9 星座修饰；每组 a/b 双向互斥。
- id: vedic.moon.ashwini.pada_1.a
  system: vedic
  section: moon_nakshatra
  topic: moon_nakshatra
  when:
    all:
      - path: moon.nakshatra
        eq: ashwini
      - path: moon.pada
        eq: 1
  weight: 88
  polarity: neutral
  tags:
    - plain
  exclusive_with:
    - vedic.moon.ashwini.pada_1.b
  zh:
    title: 阿湿毗尼 · 第1分段：迅速回应
    summary: 你倾向于迅速回应，也可以用先试一步调节节奏。
    body: 你倾向于迅速回应。你的月亮位于阿湿毗尼星宿（恒星黄道二十七段区域之一）的第1分段，周期主星是计都（南月球交点的传统名称）；主星在这里是排列大运的参照，不另加性格定论。帕达（星宿四等分之一）对应九分盘（星座九等分的补充盘）的白羊，为心绪主题加入先试一步的修饰。可以把这个星宿想成起跑线：重点是启动之后怎样照顾节奏，而不是每次都跑在最前面。这里强调先动手再修正的节奏，并不衡量你比别人更有勇气。比如朋友准备搬家，你先帮忙列出第一箱该收什么，再询问接下来需要谁协助。建议先约定试做范围，再决定是否扩大投入。
    advice:
      - 先约定试做范围，再决定是否扩大投入。
    do:
      - 小步启动
    dont:
      - 催促他人
  en:
    title: 'Ashwini, quarter 1: respond to an opening'
    summary: You may respond to an opening, with room to start with a small experiment.
    body:
      'You may respond to an opening. Your Moon occupies quarter 1 of Ashwini, a Nakshatra — one of
      twenty-seven sidereal lunar sectors — whose period ruler is Ketu — the south lunar node; this
      ruler supplies a calculation reference, not an extra personality label. The Pada — one quarter
      of a sector — maps to Aries in Navamsa, the chart formed from nine divisions of each zodiac
      sign. Think of a starting line: the useful question concerns the first stretch rather than who
      finishes ahead. A direct approach can make uncertainty feel less abstract, although speed and
      readiness are separate questions. When a neighbour needs a hand carrying supplies, checking
      the route and taking one load can make help tangible. Try leaving room to learn what the next
      stage requires. Set a clear stopping point for an initial trial.'
    advice:
      - Set a clear stopping point for an initial trial.
    do:
      - Start small
    dont:
      - Rush others
  meta:
    author: t23-vedic-editorial-v1
    reviewed_by: null
    version: 3
    status: published
