  en:
    title: 'Swati, quarter 2: keep direction while adapting'
    summary: You may keep direction while adapting, with room to pace responsibility over time.
    body:
      You may keep direction while adapting. Your Moon occupies quarter 2 of Swati, a Nakshatra —
      one of twenty-seven sidereal lunar sectors — whose period ruler is Rahu — the north lunar
      node; this ruler supplies a calculation reference, not an extra personality label. The Pada —
      one quarter of a sector — maps to Capricorn in Navamsa, the chart formed from nine divisions
      of each zodiac sign. A branch moving with the wind offers an image for flexibility that still
      has an anchor. You may value arrangements that survive a busy week rather than depend on
      exceptional enthusiasm. When your usual workspace is unavailable, naming the essential outcome
      can help you choose another route. Consider telling collaborators your available time and
      expected handover, so an independent approach remains easy for others to coordinate with.
      Build a substitute and a review date into a recurring task.
    advice:
      - Build a substitute and a review date into a recurring task.
    do:
      - Pace commitments
    dont:
      - Carry everything
