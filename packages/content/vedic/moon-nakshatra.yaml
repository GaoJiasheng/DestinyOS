    summary: 你倾向于理解来处再选择责任，也可以用建立稳定的手感调节节奏。
    body: 你倾向于理解来处再选择责任。你的月亮位于摩伽星宿（恒星黄道二十七段区域之一）的第2分段，周期主星是计都（南月球交点的传统名称）；主星在这里是排列大运的参照，不另加性格定论。帕达（星宿四等分之一）对应九分盘（星座九等分的补充盘）的金牛，为心绪主题加入建立稳定的手感的修饰。把这个星宿想成前人留下的座位，提醒你继承的是可以检验的做法，而不是必须维持的身份。你可能更重视事情是否舒服、耐用、可以持续，而不是一次表现有多热闹。比如接手一项长期活动，你先了解原有安排为何形成，再决定哪些继续使用。建议尊重历史，也把自己的判断依据说明白。建议保留稳定习惯，每次只调整一个细节。
    advice:
      - 保留稳定习惯，每次只调整一个细节。
    do:
      - 稳步练习
    dont:
      - 拒绝变化
  en:
    title: 'Magha, quarter 2: understand what you inherit'
    summary: You may understand what you inherit, with room to find a repeatable pace.
    body:
      You may understand what you inherit. Your Moon occupies quarter 2 of Magha, a Nakshatra — one
      of twenty-seven sidereal lunar sectors — whose period ruler is Ketu — the south lunar node;
      this ruler supplies a calculation reference, not an extra personality label. The Pada — one
      quarter of a sector — maps to Taurus in Navamsa, the chart formed from nine divisions of each
      zodiac sign. An inherited seat offers an image for responsibility without requiring you to
      reproduce the person who held it before. You may prefer to understand what an arrangement
      feels like after repeated use rather than through a persuasive introduction. When taking over
      a regular community activity, asking why a procedure exists can reveal what still serves
      participants. Consider preserving a useful practice while explaining the reasons for any
      change you make. Compare one familiar routine with a modest alternative.
    advice:
      - Compare one familiar routine with a modest alternative.
    do:
      - Practise steadily
    dont:
      - Reject changes
