  zh:
    title: 檀尼湿吒 · 第1分段：让个人节奏与合作接上
    summary: 你倾向于让个人节奏与合作接上，也可以用让表达有清楚的方向调节节奏。
    body: 你倾向于让个人节奏与合作接上。你的月亮位于檀尼湿吒星宿（恒星黄道二十七段区域之一）的第1分段，周期主星是火星；主星在这里是排列大运的参照，不另加性格定论。帕达（星宿四等分之一）对应九分盘（星座九等分的补充盘）的狮子，为心绪主题加入让表达有清楚的方向的修饰。把这个星宿想成合奏里的节拍，提醒你贡献不必处处突出，但要知道何时进入。你可能希望别人看见投入的心意，也愿意让成果带有自己的风格。比如小组共同准备演示，你约定交接次序，先练容易断开的地方。建议让资源和信息按需要流动，比较合作是否更顺畅，而不是谁做得最多。建议展示成果后，请别人反馈一个具体细节。
    advice:
      - 展示成果后，请别人反馈一个具体细节。
    do:
      - 分享舞台
    dont:
      - 争抢认可
  en:
    title: 'Dhanishta, quarter 1: connect your rhythm with cooperation'
    summary: You may connect your rhythm with cooperation, with room to give expression a useful purpose.
    body: You may connect your rhythm with cooperation. Your Moon occupies quarter 1 of Dhanishta, a
      Nakshatra — one of twenty-seven sidereal lunar sectors — whose period ruler is Mangala — Mars;
      this ruler supplies a calculation reference, not an extra personality label. The Pada — one
      quarter of a sector — maps to Leo in Navamsa, the chart formed from nine divisions of each
      zodiac sign. A beat in an ensemble offers an image for participation that does not require
      every player to be prominent. Enjoying an audience can support creativity when there is also
      room for an honest response. In a group demonstration, rehearsing the handover can matter more
      than improving each part in isolation. Consider checking where information or materials arrive
      too late, and adjust the shared rhythm rather than competing over effort. Ask what your
      presentation helped someone notice.
    advice:
      - Ask what your presentation helped someone notice.
    do:
      - Share attention
    dont:
      - Demand praise
