      - 把担心改写成可核对的问题，并尊重回应范围。
    do:
      - 核对事实
    dont:
      - 过度试探
  en:
    title: 'Dhanishta, quarter 4: arrange resources for shared use'
    summary: You may arrange resources for shared use, with room to explore depth with consent.
    body: You may arrange resources for shared use. Your Moon occupies quarter 4 of Dhanishta, a
      Nakshatra — one of twenty-seven sidereal lunar sectors — whose period ruler is Mangala — Mars;
      this ruler supplies a calculation reference, not an extra personality label. The Pada — one
      quarter of a sector — maps to Scorpio in Navamsa, the chart formed from nine divisions of each
      zodiac sign. A rehearsal room with shared equipment offers an image for resources supported by
      clear access. You may want to understand the reason behind a change rather than accept a
      smooth explanation. Agreeing on use and return times can help several people practise without
      friction. You can organize efficiently and still ask whether quieter members have the
      opportunity to participate, rather than assuming the current arrangement suits everyone. Ask
      about an observable obstacle before inferring motives.
    advice:
      - Ask about an observable obstacle before inferring motives.
    do:
