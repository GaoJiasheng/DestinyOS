    body: 你倾向于照顾过渡中的细节。你的月亮位于雷瓦蒂星宿（恒星黄道二十七段区域之一）的第4分段，周期主星是水星；主星在这里是排列大运的参照，不另加性格定论。帕达（星宿四等分之一）对应九分盘（星座九等分的补充盘）的双鱼，为心绪主题加入给感受一个表达容器的修饰。把这个星宿想成旅程最后的路标，提醒你温柔也需要清楚的交接。你可能善于看见尚未说清的情绪，让不同经验通过故事或画面相接。比如活动结束后，你核对资料是否发出、遗留问题由谁回应，再安排休息。建议把收束做得明确，让别人知道下一步在哪里，也让自己能够安心停下。建议先整理自己的感受，再向对方核对理解。
    advice:
      - 先整理自己的感受，再向对方核对理解。
    do:
      - 清楚表达
    dont:
      - 代人决定
