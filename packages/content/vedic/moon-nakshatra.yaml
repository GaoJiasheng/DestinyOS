    summary: 你倾向于用温和持续的方式回应，也可以用深入了解但保留空间调节节奏。
    body: 你倾向于用温和持续的方式回应。你的月亮位于后跋陀罗星宿（恒星黄道二十七段区域之一）的第4分段，周期主星是土星；主星在这里是排列大运的参照，不另加性格定论。帕达（星宿四等分之一）对应九分盘（星座九等分的补充盘）的天蝎，为心绪主题加入深入了解但保留空间的修饰。这里用固定亮着的小灯作比喻，提醒你关心可以轻量，也要让对方知道你能提供什么。你可能不满足于表面回答，希望弄清承诺是否可靠、信息为何缺失。比如陪伴朋友做一个长期计划，你们约定简短回顾，而不是随时待命。你可以以稳定回应表达心意，并保留自己的生活节奏。建议把担心改写成可核对的问题，并尊重回应范围。
    advice:
      - 把担心改写成可核对的问题，并尊重回应范围。
    do:
      - 核对事实
    dont:
      - 过度试探
  en:
    title: 'Uttara Bhadrapada, quarter 4: respond with quiet continuity'
    summary: You may respond with quiet continuity, with room to explore depth with consent.
    body:
      You may respond with quiet continuity. Your Moon occupies quarter 4 of Uttara Bhadrapada, a
      Nakshatra — one of twenty-seven sidereal lunar sectors — whose period ruler is Shani — Saturn;
      this ruler supplies a calculation reference, not an extra personality label. The Pada — one
      quarter of a sector — maps to Scorpio in Navamsa, the chart formed from nine divisions of each
      zodiac sign. A small light kept in a familiar place offers an image for quiet continuity. You
      may want to understand the reason behind a change rather than accept a smooth explanation. A
      brief, agreed review can help someone maintain a long project without requiring either of you
      to be constantly on call. You can be present in a specific way and retain a routine that
      supports your own capacity. Ask about an observable obstacle before inferring motives.
    advice:
      - Ask about an observable obstacle before inferring motives.
    do:
      - Check facts
    dont:
      - Test people
