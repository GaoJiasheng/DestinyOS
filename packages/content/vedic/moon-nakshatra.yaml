  en:
    title: 'Ashwini, quarter 4: respond to an opening'
    summary: You may respond to an opening, with room to make care sustainable.
    body:
      'You may respond to an opening. Your Moon occupies quarter 4 of Ashwini, a Nakshatra — one of
      twenty-seven sidereal lunar sectors — whose period ruler is Ketu — the south lunar node; this
      ruler supplies a calculation reference, not an extra personality label. The Pada — one quarter
      of a sector — maps to Cancer in Navamsa, the chart formed from nine divisions of each zodiac
