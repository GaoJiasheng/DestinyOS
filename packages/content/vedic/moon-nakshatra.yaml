      boundary. You might notice the mood of a conversation before knowing what it means. Before a
      focused session, telling collaborators when you will respond can protect attention without
      making the arrangement mysterious. You can work independently and keep a visible route back to
      discussion, especially when another person holds information your analysis needs. Describe an
      impression and invite the other person to clarify it.
