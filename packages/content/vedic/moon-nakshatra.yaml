    summary: 你倾向于建立可持续的支持，也可以用让表达有清楚的方向调节节奏。
    body: 你倾向于建立可持续的支持。你的月亮位于普沙星宿（恒星黄道二十七段区域之一）的第1分段，周期主星是土星；主星在这里是排列大运的参照，不另加性格定论。帕达（星宿四等分之一）对应九分盘（星座九等分的补充盘）的狮子，为心绪主题加入让表达有清楚的方向的修饰。把这个星宿想成补给站，提醒你支持要有明确范围，照料者也需要补充精力。你可能希望别人看见投入的心意，也愿意让成果带有自己的风格。比如小组成员遇到困难，你提供一份可使用的资料，并说明什么时候能够讨论。建议把帮助做得具体，让对方逐步自己接手。建议展示成果后，请别人反馈一个具体细节。
    advice:
      - 展示成果后，请别人反馈一个具体细节。
    do:
      - 分享舞台
    dont:
