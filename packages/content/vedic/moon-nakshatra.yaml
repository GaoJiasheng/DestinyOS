    summary: 你倾向于用清楚边界支持独处，也可以用给感受一个表达容器调节节奏。
    body: 你倾向于用清楚边界支持独处。你的月亮位于沙多毗沙星宿（恒星黄道二十七段区域之一）的第4分段，周期主星是罗睺（北月球交点的传统名称）；主星在这里是排列大运的参照，不另加性格定论。帕达（星宿四等分之一）对应九分盘（星座九等分的补充盘）的双鱼，为心绪主题加入给感受一个表达容器的修饰。这里用划出一块工作区域作比喻，提醒你独处是安排，不必变成对外界关闭。你可能善于看见尚未说清的情绪，让不同经验通过故事或画面相接。比如准备研究材料，你先说明什么时候暂不回应，并约好结束后的讨论。你可以保护专注，也让合作对象知道如何联系到你。建议先整理自己的感受，再向对方核对理解。
