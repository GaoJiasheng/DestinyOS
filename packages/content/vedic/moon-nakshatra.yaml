    summary: 你倾向于为复杂问题保留观察空间，也可以用让探索连接实际经验调节节奏。
    body: 你倾向于为复杂问题保留观察空间。你的月亮位于沙多毗沙星宿（恒星黄道二十七段区域之一）的第1分段，周期主星是罗睺（北月球交点的传统名称）；主星在这里是排列大运的参照，不另加性格定论。帕达（星宿四等分之一）对应九分盘（星座九等分的补充盘）的射手，为心绪主题加入让探索连接实际经验的修饰。把这个星宿想成安静的观察室，提醒你距离有助于整理，但也需要回到真实交流。你可能喜欢新观点、新环境，以及能说明为什么值得投入的目标。比如一个工具频繁出错，你先记录发生条件，再请使用者说明具体体验。建议把独立研究与他人的反馈放在一起，不让单一模型代替现实。建议把远期愿望拆成一项本周可体验的行动。
    advice:
      - 把远期愿望拆成一项本周可体验的行动。
    do:
      - 开放探索
    dont:
      - 夸大承诺
  en:
    title: 'Shatabhisha, quarter 1: leave space to examine complexity'
    summary: You may leave space to examine complexity, with room to connect exploration with experience.
    body: You may leave space to examine complexity. Your Moon occupies quarter 1 of Shatabhisha, a
      Nakshatra — one of twenty-seven sidereal lunar sectors — whose period ruler is Rahu — the
      north lunar node; this ruler supplies a calculation reference, not an extra personality label.
      The Pada — one quarter of a sector — maps to Sagittarius in Navamsa, the chart formed from
      nine divisions of each zodiac sign. A quiet observation room offers an image for careful
      enquiry that eventually reconnects with experience. You may enjoy ideas that connect an
      ordinary task with a larger purpose. If a tool behaves inconsistently, recording the
      conditions can help, while asking users what they encountered adds missing context. Consider
      putting those accounts beside your own analysis rather than allowing one tidy model to explain
      everything. Bring one observation from an unfamiliar setting into daily practice.
