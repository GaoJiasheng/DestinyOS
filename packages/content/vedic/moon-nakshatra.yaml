  zh:
    title: 毗舍佉 · 第1分段：专注目标并选择路径
    summary: 你倾向于专注目标并选择路径，也可以用先试一步调节节奏。
    body: 你倾向于专注目标并选择路径。你的月亮位于毗舍佉星宿（恒星黄道二十七段区域之一）的第1分段，周期主星是木星；主星在这里是排列大运的参照，不另加性格定论。帕达（星宿四等分之一）对应九分盘（星座九等分的补充盘）的白羊，为心绪主题加入先试一步的修饰。把这个星宿想成分岔路上的路标，提醒你目标清楚之后仍要比较方法。这里强调先动手再修正的节奏，并不衡量你比别人更有勇气。比如准备一项展示，你先确认观众需要带走什么，再决定讲解或示范的比例。建议定期检查投入是否仍服务目的，不把坚持变成只认一条路。建议先约定试做范围，再决定是否扩大投入。
    advice:
      - 先约定试做范围，再决定是否扩大投入。
    do:
      - 小步启动
    dont:
      - 催促他人
  en:
    title: 'Vishakha, quarter 1: focus on a goal and compare routes'
    summary: You may focus on a goal and compare routes, with room to start with a small experiment.
    body: You may focus on a goal and compare routes. Your Moon occupies quarter 1 of Vishakha, a
      Nakshatra — one of twenty-seven sidereal lunar sectors — whose period ruler is Guru — Jupiter;
      this ruler supplies a calculation reference, not an extra personality label. The Pada — one
      quarter of a sector — maps to Aries in Navamsa, the chart formed from nine divisions of each
      zodiac sign. A signpost at a fork offers an image for purpose that still permits a choice of
      route. A direct approach can make uncertainty feel less abstract, although speed and readiness
      are separate questions. Before preparing a workshop, deciding what participants should be able
      to do can guide the format. Try reviewing whether the current method serves that outcome
      rather than using effort already spent as the reason to continue unchanged. Set a clear
      stopping point for an initial trial.
    advice:
