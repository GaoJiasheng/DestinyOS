    summary: 你倾向于在弹性中保持方向，也可以用让责任有可持续的节奏调节节奏。
    body: 你倾向于在弹性中保持方向。你的月亮位于斯瓦提星宿（恒星黄道二十七段区域之一）的第2分段，周期主星是罗睺（北月球交点的传统名称）；主星在这里是排列大运的参照，不另加性格定论。帕达（星宿四等分之一）对应九分盘（星座九等分的补充盘）的摩羯，为心绪主题加入让责任有可持续的节奏的修饰。把这个星宿想成风中的枝条，提醒你调整不等于没有立场。你可能重视约定、进度和长期投入，希望努力留下能继续使用的东西。比如临时改变工作地点，你先确认必须完成的部分，再决定用什么节奏处理。建议说清自己的可用时间和交付范围，让自由与合作能够同时存在。建议为长期任务写明交接人和休息安排。
