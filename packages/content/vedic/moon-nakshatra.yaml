    summary: 你倾向于理解来处再选择责任，也可以用先试一步调节节奏。
    body: 你倾向于理解来处再选择责任。你的月亮位于摩伽星宿（恒星黄道二十七段区域之一）的第1分段，周期主星是计都（南月球交点的传统名称）；主星在这里是排列大运的参照，不另加性格定论。帕达（星宿四等分之一）对应九分盘（星座九等分的补充盘）的白羊，为心绪主题加入先试一步的修饰。把这个星宿想成前人留下的座位，提醒你继承的是可以检验的做法，而不是必须维持的身份。这里强调先动手再修正的节奏，并不衡量你比别人更有勇气。比如接手一项长期活动，你先了解原有安排为何形成，再决定哪些继续使用。建议尊重历史，也把自己的判断依据说明白。建议先约定试做范围，再决定是否扩大投入。
    advice:
      - 先约定试做范围，再决定是否扩大投入。
    do:
      - 小步启动
    dont:
      - 催促他人
  en:
    title: 'Magha, quarter 1: understand what you inherit'
    summary: You may understand what you inherit, with room to start with a small experiment.
    body:
      You may understand what you inherit. Your Moon occupies quarter 1 of Magha, a Nakshatra — one
      of twenty-seven sidereal lunar sectors — whose period ruler is Ketu — the south lunar node;
      this ruler supplies a calculation reference, not an extra personality label. The Pada — one
      quarter of a sector — maps to Aries in Navamsa, the chart formed from nine divisions of each
      zodiac sign. An inherited seat offers an image for responsibility without requiring you to
      reproduce the person who held it before. A direct approach can make uncertainty feel less
      abstract, although speed and readiness are separate questions. When taking over a regular
      community activity, asking why a procedure exists can reveal what still serves participants.
      Consider preserving a useful practice while explaining the reasons for any change you make.
      Set a clear stopping point for an initial trial.
    advice:
      - Set a clear stopping point for an initial trial.
    do:
      - Start small
    dont:
      - Rush others
