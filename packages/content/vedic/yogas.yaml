  zh:
    title: Neecha Bhanga：把不顺手的部分放回整体看
    summary: 你可以把不顺手的部分放回整体看，把格局当作观察联系的提示。
    body: 你可以把不顺手的部分放回整体看。Neecha Bhanga（传统把落的状态放回其他支持条件下理解的格局）在你的盘里采用简化规则：至少一颗标为落（较不顺手的位置）的行星，其所在星座的守护星处于第一、四、七或十宫。这里不覆盖所有解除条件，也不把原有位置变成自动有利。你可以观察一项困难是否能通过改变环境或获得协助缓和。比如初学一项技能，换一个清楚的示范再练习。建议比较实际效果，保留有效支持；整体关系提供语境，不替你评价结果或预测转折。改善条件之后仍要观察实际过程，不把新的支持当成已经确定的结果。
    advice:
      - 给一项困难换一种示范方式，再比较体验。
    do:
      - 小步验证
    dont:
      - 追逐标签
  en:
    title: 'Neecha Bhanga: put an awkward condition back in context'
    summary: You can put an awkward condition back in context through an ordinary, reviewable action.
    body:
      You can put an awkward condition back in context. Neecha Bhanga — a pattern that places a debilitated
      dignity label in a wider context — uses a simplified rule here. At least one planet marked debilitated has
      its sign ruler in house one, four, seven, or ten. The check does not include every traditional cancellation
      condition or turn the original state into automatic success. You can ask whether an awkward task becomes more
      manageable with a different setting or better support. For a new skill, another demonstration may reveal a
      step you had missed. Consider comparing the actual results of the adjustment. Context broadens the symbolic
      reading, while experience determines whether a method helps you proceed. After changing a condition, continue
      to observe the process rather than treating a new source of support as an established outcome.
    advice:
      - Test a different example for a difficult step and compare the result.
    do:
      - Test a step
    dont:
      - Chase labels
