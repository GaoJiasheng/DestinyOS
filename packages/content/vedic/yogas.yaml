  exclusive_with: []
  zh:
    title: Dhana Yoga：把资源投入与学习目标对齐
    summary: 你可以把资源投入与学习目标对齐，把格局当作观察联系的提示。
    body: 你可以把资源投入与学习目标对齐。Dhana Yoga（把资源领域与学习创作领域主星联系起来的格局）在你的盘里用简化规则触发：第二或十一宫主星与第五或九宫的另一颗主星处于同一星座。这里不包含所有传统财富条件，也不推测收入与收益。你可以观察日常投入是否符合自己的学习和共同目标。比如参加一项活动，先比较时间、费用和实际用途，再决定是否合适。建议记录普通开支与使用体验，不依据格局选择投资标的；有关具体财务事项，应另行核对可靠信息。把预算与活动体验分别记录，能帮助你看清实际投入是否合适。
    advice:
      - 记录一项活动的时间、费用和实际用途。
    do:
      - 小步验证
    dont:
      - 追逐标签
  en:
    title: 'Dhana Yoga: align ordinary resources with a learning aim'
    summary: You can align ordinary resources with a learning aim through an ordinary, reviewable action.
    body:
      You can align ordinary resources with a learning aim. Dhana Yoga — a pattern connecting rulers associated
      with resources and learning — uses a simplified same-sign rule in this implementation. A ruler of house two
      or eleven must share a sign with a different ruler of house five or nine. It does not estimate earnings or
      include every traditional wealth condition. You can compare ordinary commitments with an actual learning or
      shared aim. Before joining an activity, listing its time, fee, and intended use can make the choice clearer.
      Try reviewing whether you used what you paid for. Financial suitability needs reliable information about your
      circumstances; this symbolic link cannot choose an investment or forecast a return. Recording the cost of
      an activity separately from your experience of it can make the actual commitment easier to review.
    advice:
      - Compare a routine commitment with its actual use afterward.
