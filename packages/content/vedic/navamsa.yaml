  en:
    title: Chandra in Gemini Navamsa
    summary:
      You can consider the ways you settle inwardly through a habit of choosing to turn curiosity into clear
      questions.
    body:
      You can reflect on the ways you settle inwardly by choosing to turn curiosity into clear questions. Navamsa,
      or D9 — a supplementary chart built from nine divisions of each zodiac sign — places Chandra — the Moon, a
      reference for inward responses — in Gemini. It is read beside the main chart rather than used to determine
      a relationship outcome. Gemini — a sign connected with exchange and comparison — encourages learning through
