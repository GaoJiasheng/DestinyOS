    body: 你可以用给感受一个表达容器的方式回看持续承诺的姿态。九分盘（九分盘/九分盘，把每个星座再分成九段所得的补充视角）中的上升位于双鱼；它与本命盘一起看，不单独安排关系结果。双鱼（以想象和共感为意象的星座）让你倾向于先感受氛围，再寻找表达方式。你可能善于看见尚未说清的情绪，让不同经验通过故事或画面相接。理解别人也需要核对，感受不能代替对方的实际回应。例如朋友语气变得安静，你先询问是否想休息，而不是直接安排帮助。建议用记录、创作或短暂独处整理自己的感受，再清楚说出能够提供什么，保留温柔也保留边界。这一章只在出生时间明确时使用细分位置。例如你与亲近的人讨论共同安排，先说清各自的需要，再观察哪些方法能够持续。建议以真实互动检验描述，允许单身或不同关系状态都保有自己的节奏；传统关系意象不指定伴侣身份，也不催促任何人生选择。
    advice:
      - 先整理自己的感受，再向对方核对理解。
    do:
      - 清楚表达
    dont:
      - 代人决定
  en:
    title: Lagna in Pisces Navamsa
    summary:
      You can consider your approach to sustained commitment through a habit of choosing to give impressions
      a clear form.
    body:
      You can reflect on your approach to sustained commitment by choosing to give impressions a clear form.
      Navamsa, or D9 — a supplementary chart built from nine divisions of each zodiac sign — places Lagna — the
      rising sign, a reference for entering a situation — in Pisces. It is read beside the main chart rather than
      used to determine a relationship outcome. Pisces — a sign linked with imagination and receptivity — invites
      you to give a vague impression a form that others can understand. You might notice the mood of a conversation
      before knowing what it means. Sketching, writing a few lines, or choosing music can help you describe your
      own experience without deciding how someone else feels. You can then ask whether your impression matches theirs.
      Leave room for an answer you did not expect, and state what support you have the capacity to offer. Empathy
      becomes more practical when it includes clarification and boundaries. This detailed placement is used only
      with a known birth time. You can compare the prompt with real discussions about shared needs and the arrangements
      people actually want. Consider retaining the approach that helps communication, regardless of whether you
      are single or partnered; no identity or schedule for commitment follows from this supplementary chart.
    advice:
      - Describe an impression and invite the other person to clarify it.
    do:
      - Clarify impressions
    dont:
      - Assume needs
