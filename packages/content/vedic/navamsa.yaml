    dont:
      - 独自硬撑
  en:
    title: Shukra in Capricorn Navamsa
    summary:
      You can consider reciprocity and preferences through a habit of choosing to pace responsibility over
      time.
    body:
      'You can reflect on reciprocity and preferences by choosing to pace responsibility over time. Navamsa,
      or D9 — a supplementary chart built from nine divisions of each zodiac sign — places Shukra — Venus, a reference
      for enjoyment and reciprocity — in Capricorn. It is read beside the main chart rather than used to determine
      a relationship outcome. Capricorn — a sign connected with sustained responsibility — invites you to notice
      how an effort holds up over time. You may value arrangements that survive a busy week rather than depend on
      exceptional enthusiasm. Suppose you maintain a community noticeboard: a simple schedule and a named substitute
      can keep it useful when you are unavailable. Try separating what you personally own from what requires a shared
      agreement. Periodic maintenance and time away are parts of continuity, and feedback can reveal when a reliable
