    body: 你可以用建立稳定的手感的方式回看内在安顿。九分盘（九分盘/九分盘，把每个星座再分成九段所得的补充视角）中的月亮位于金牛；它与本命盘一起看，不单独安排关系结果。金牛（以稳定和感官体验为意象的星座）让你倾向于通过重复建立信任。你可能更重视事情是否舒服、耐用、可以持续，而不是一次表现有多热闹。熟悉的节奏能减少临时切换的负担，但也需要给新方法留位置。例如整理厨房时，你先把常用工具放到容易拿到的地方，试用几天再调整。建议保留一项有效习惯，同时为一个小变化设观察期，以实际体验决定取舍。这一章只在出生时间明确时使用细分位置。例如你与亲近的人讨论共同安排，先说清各自的需要，再观察哪些方法能够持续。建议以真实互动检验描述，允许单身或不同关系状态都保有自己的节奏；传统关系意象不指定伴侣身份，也不催促任何人生选择。
    advice:
      - 保留稳定习惯，每次只调整一个细节。
    do:
      - 稳步练习
    dont:
      - 拒绝变化
  en:
    title: Chandra in Taurus Navamsa
    summary: You can consider the ways you settle inwardly through a habit of choosing to find a repeatable pace.
    body:
      'You can reflect on the ways you settle inwardly by choosing to find a repeatable pace. Navamsa, or D9
      — a supplementary chart built from nine divisions of each zodiac sign — places Chandra — the Moon, a reference
      for inward responses — in Taurus. It is read beside the main chart rather than used to determine a relationship
      outcome. Taurus — the sign of sustained attention to tangible experience — points toward a pace you can maintain.
      You may prefer to understand what an arrangement feels like after repeated use rather than through a persuasive
      introduction. Imagine rehearsing a short piece of music until its rhythm becomes comfortable: consistency
      offers useful feedback, but familiarity alone does not establish quality. You can compare the familiar version
      with one modest alternative before settling. Keep what supports your routine, and allow enough flexibility
      for circumstances that have actually changed. This detailed placement is used only with a known birth time.
      You can compare the prompt with real discussions about shared needs and the arrangements people actually want.
      Consider retaining the approach that helps communication, regardless of whether you are single or partnered;
      no identity or schedule for commitment follows from this supplementary chart.'
    advice:
      - Compare one familiar routine with a modest alternative.
    do:
      - Practise steadily
    dont:
      - Reject changes
