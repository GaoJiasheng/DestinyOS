    body: 你可以用先试一步的方式处理把责任拆成步骤。土星（以时间、边界和持续投入为象征的行星）描述你怎样面对需要耐心的过程。它的位置适合讨论可承担的责任，不表示你应当独自忍受压力。你可以先区分必须完成、能够委托和可以暂停的部分，为长期任务留下交接与休息空间。你的土星落在白羊。白羊（以启动和直接行动为意象的星座）让你较容易从尝试中理解问题。这里强调先动手再修正的节奏，并不衡量你比别人更有勇气。面对陌生任务，你可能希望尽快看到一个可操作的入口。例如小组刚接到新项目时，你先画出流程草图，让同伴对着具体方案补充遗漏。建议预先约定试做的范围与停止点，给不同速度的人留出表达时间。
    advice:
      - 把长期责任分成自己的部分与可协作部分。
    do:
      - 安排交接
    dont:
      - 独自承担
  en:
    title: 'Shani in Aries: responsibility in practice'
    summary: You can explore responsibility in practice through a habit of choosing to start with a small experiment.
    body:
      'You can approach responsibility in practice by choosing to start with a small experiment. Shani — Saturn,
      a symbol of time and boundaries — asks which commitments you can maintain under ordinary conditions. A patient
      method may be useful, while carrying every responsibility yourself can make a process fragile. You can separate
      essential work from optional demands and agree on a handover before capacity runs low. Reliability includes
      limits and the ability to request support. Your Shani occupies Aries. Aries — a sign associated with initiating
      movement — invites you to learn through a manageable first attempt. A direct approach can make uncertainty
      feel less abstract, although speed and readiness are separate questions. Picture trying a new hobby: handling
      the basic tools for twenty minutes may teach you more than collecting another set of instructions. Consider
      choosing a limited trial that you can undo, and tell anyone involved what remains provisional. Initiative
      becomes easier to share when other people have time to contribute before the plan gathers momentum.'
    advice:
      - Set a clear stopping point for an initial trial.
    do:
      - Start small
    dont:
      - Rush others
