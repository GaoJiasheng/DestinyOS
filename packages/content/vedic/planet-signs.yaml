    body: 你可以用让责任有可持续的节奏的方式处理给减法留出依据。计都（Ketu，与罗睺相对的月球轨道交点，作为简化和回顾的象征）描述你如何重新评估熟悉的投入。它不是一颗实体行星，也不要求你放弃关系或现实责任。你可以观察哪些重复动作仍有作用，哪些只是习惯，先做可撤回的减法再决定是否保留。你的计都落在摩羯。摩羯（以责任和累积为意象的星座）让你倾向于通过可靠的过程建立成果。你可能重视约定、进度和长期投入，希望努力留下能继续使用的东西。承担责任也需要区分自己的部分与共同的部分。例如组织一项长期活动，你先写明各人的职责和交接时间，再按阶段检查进展。建议为计划加入休息和调整空间，把反馈当作维护过程的工具，别只在任务完成后才允许自己放松。
    advice:
      - 暂停一项非必要安排，再回看实际影响。
    do:
      - 简化安排
    dont:
      - 突然抽离
  en:
    title: 'Ketu in Capricorn: choose what to release'
    summary: You can explore choose what to release through a habit of choosing to pace responsibility over time.
    body:
      'You can approach choose what to release by choosing to pace responsibility over time. Ketu — the south
      lunar node, opposite Rahu — serves as a symbol of simplification and reconsideration. It does not ask you
      to withdraw from people or abandon practical responsibilities. You can examine a familiar activity and ask
      what purpose it still serves. Pausing one optional commitment for a short interval gives you evidence about
      its value while leaving space to restore it. Your Ketu occupies Capricorn. Capricorn — a sign connected with
      sustained responsibility — invites you to notice how an effort holds up over time. You may value arrangements
      that survive a busy week rather than depend on exceptional enthusiasm. Suppose you maintain a community noticeboard:
      a simple schedule and a named substitute can keep it useful when you are unavailable. Try separating what
      you personally own from what requires a shared agreement. Periodic maintenance and time away are parts of
      continuity, and feedback can reveal when a reliable routine has become unnecessarily burdensome.'
    advice:
      - Build a substitute and a review date into a recurring task.
