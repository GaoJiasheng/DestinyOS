    do:
      - 明确责任
    dont:
      - 压过他人
  en:
    title: 'Surya in Gemini: visible ownership'
    summary: You can explore visible ownership through a habit of choosing to turn curiosity into clear questions.
    body:
      You can approach visible ownership by choosing to turn curiosity into clear questions. Surya — the Sun,
      a symbol of personal direction — concerns how you take ownership of a choice. Its position offers a question
      about visibility and responsibility rather than a ranking of your status. A helpful contribution makes both
      your reasoning and its limits understandable to the people affected. You can practise explaining why a choice
      matters without asking everyone to share your enthusiasm. Your Surya occupies Gemini. Gemini — a sign connected
      with exchange and comparison — encourages learning through questions. You may notice how a subject changes
      when another person describes it, making conversation a useful research tool. At a community workshop, for
      instance, asking two participants how they learned a technique can reveal differences that the instructions
      overlook. Try recording the question each answer resolves before opening another line of enquiry. A deadline
      for choosing the next step keeps curiosity useful without requiring you to follow every interesting possibility
      at once.
    advice:
      - Give an open enquiry a time to narrow into action.
