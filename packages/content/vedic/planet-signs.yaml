      - 尊重意愿
    dont:
      - 单向迎合
  en:
    title: 'Shukra in Aries: reciprocity and enjoyment'
    summary: You can explore reciprocity and enjoyment through a habit of choosing to start with a small experiment.
    body:
      'You can approach reciprocity and enjoyment by choosing to start with a small experiment. Shukra — Venus,
      a symbol of enjoyment and reciprocity — highlights how you recognize a satisfying exchange. The reading can
      prompt a conversation about preferences without assigning a partner or a timetable for commitment. You can
      describe what you enjoy and ask whether someone else wants to share it. Mutual interest matters more than
      a scene that merely looks harmonious from outside. Your Shukra occupies Aries. Aries — a sign associated with
      initiating movement — invites you to learn through a manageable first attempt. A direct approach can make
      uncertainty feel less abstract, although speed and readiness are separate questions. Picture trying a new
      hobby: handling the basic tools for twenty minutes may teach you more than collecting another set of instructions.
      Consider choosing a limited trial that you can undo, and tell anyone involved what remains provisional. Initiative
      becomes easier to share when other people have time to contribute before the plan gathers momentum.'
    advice:
