  zh:
    title: 水星在白羊：让信息便于使用
    summary: 你倾向于用先试一步的方式让信息便于使用。
    body: 你可以用先试一步的方式处理让信息便于使用。水星（以学习和信息交流为象征的行星）描述你如何整理问题、交换想法。它的位置强调信息怎样进入实际生活，不替你判断哪种观点正确。你可以先问对方需要什么程度的解释，再用例子核对彼此是否理解同一件事。你的水星落在白羊。白羊（以启动和直接行动为意象的星座）让你较容易从尝试中理解问题。这里强调先动手再修正的节奏，并不衡量你比别人更有勇气。面对陌生任务，你可能希望尽快看到一个可操作的入口。例如小组刚接到新项目时，你先画出流程草图，让同伴对着具体方案补充遗漏。建议预先约定试做的范围与停止点，给不同速度的人留出表达时间。
    advice:
      - 先问用途，再给出对应的信息。
    do:
      - 核对理解
    dont:
      - 堆积信息
  en:
    title: 'Budha in Aries: usable communication'
    summary: You can explore usable communication through a habit of choosing to start with a small experiment.
    body:
      'You can approach usable communication by choosing to start with a small experiment. Budha — Mercury,
      a symbol of learning and exchange — focuses on the route between an idea and its practical use. Good communication
      depends on the listener’s context as well as the speaker’s fluency. You can ask what someone needs to do with
      the information before adding detail. An example or a short check of understanding often reveals more than
      another round of explanation. Your Budha occupies Aries. Aries — a sign associated with initiating movement
      — invites you to learn through a manageable first attempt. A direct approach can make uncertainty feel less
      abstract, although speed and readiness are separate questions. Picture trying a new hobby: handling the basic
      tools for twenty minutes may teach you more than collecting another set of instructions. Consider choosing
      a limited trial that you can undo, and tell anyone involved what remains provisional. Initiative becomes easier
      to share when other people have time to contribute before the plan gathers momentum.'
    advice:
      - Set a clear stopping point for an initial trial.
    do:
      - Start small
    dont:
      - Rush others
  meta:
    author: t23-vedic-editorial-v1
    reviewed_by: null
    version: 1
    status: published
