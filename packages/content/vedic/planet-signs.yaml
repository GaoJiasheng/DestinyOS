    dont:
      - 压过他人
  en:
    title: 'Surya in Taurus: visible ownership'
    summary: You can explore visible ownership through a habit of choosing to find a repeatable pace.
    body:
      'You can approach visible ownership by choosing to find a repeatable pace. Surya — the Sun, a symbol of
      personal direction — concerns how you take ownership of a choice. Its position offers a question about visibility
      and responsibility rather than a ranking of your status. A helpful contribution makes both your reasoning
      and its limits understandable to the people affected. You can practise explaining why a choice matters without
      asking everyone to share your enthusiasm. Your Surya occupies Taurus. Taurus — the sign of sustained attention
      to tangible experience — points toward a pace you can maintain. You may prefer to understand what an arrangement
      feels like after repeated use rather than through a persuasive introduction. Imagine rehearsing a short piece
      of music until its rhythm becomes comfortable: consistency offers useful feedback, but familiarity alone does
      not establish quality. You can compare the familiar version with one modest alternative before settling. Keep
      what supports your routine, and allow enough flexibility for circumstances that have actually changed.'
    advice:
      - Compare one familiar routine with a modest alternative.
    do:
      - Practise steadily
    dont:
