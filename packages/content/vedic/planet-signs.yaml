- id: vedic.planet_sign.surya.aries
  system: vedic
  section: lagna_planets
  topic: planet_sign
  when:
    path: bodies[key=surya].sign
    eq: aries
  weight: 65
  polarity: neutral
  tags:
    - plain
  exclusive_with: []
  zh:
    title: 太阳在白羊：表达立场
    summary: 你倾向于用先试一步的方式表达立场。
    body: 你可以用先试一步的方式处理表达立场。太阳（在吠陀框架中观察身份与意志的象征）描述你怎样承担自己的选择。它所在的位置把注意力引向表达立场、接受反馈和确认责任，而不是给权力或社会地位打分。你可以在需要拍板时先说清判断依据，让参与者知道哪些意见还能补充。你的太阳落在白羊。白羊（以启动和直接行动为意象的星座）让你较容易从尝试中理解问题。这里强调先动手再修正的节奏，并不衡量你比别人更有勇气。面对陌生任务，你可能希望尽快看到一个可操作的入口。例如小组刚接到新项目时，你先画出流程草图，让同伴对着具体方案补充遗漏。建议预先约定试做的范围与停止点，给不同速度的人留出表达时间。
    advice:
      - 说清一次决定的理由，再邀请具体反馈。
    do:
      - 明确责任
    dont:
      - 压过他人
  en:
    title: 'Surya in Aries: visible ownership'
    summary: You can explore visible ownership through a habit of choosing to start with a small experiment.
    body:
      'You can approach visible ownership by choosing to start with a small experiment. Surya — the Sun, a symbol
      of personal direction — concerns how you take ownership of a choice. Its position offers a question about
      visibility and responsibility rather than a ranking of your status. A helpful contribution makes both your
      reasoning and its limits understandable to the people affected. You can practise explaining why a choice matters
      without asking everyone to share your enthusiasm. Your Surya occupies Aries. Aries — a sign associated with
      initiating movement — invites you to learn through a manageable first attempt. A direct approach can make
      uncertainty feel less abstract, although speed and readiness are separate questions. Picture trying a new
      hobby: handling the basic tools for twenty minutes may teach you more than collecting another set of instructions.
      Consider choosing a limited trial that you can undo, and tell anyone involved what remains provisional. Initiative
      becomes easier to share when other people have time to contribute before the plan gathers momentum.'
    advice:
      - Set a clear stopping point for an initial trial.
    do:
      - Start small
    dont:
      - Rush others
  meta:
    author: t23-vedic-editorial-v1
    reviewed_by: null
    version: 1
    status: published
