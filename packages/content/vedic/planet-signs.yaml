    body: 你可以用把好奇变成问题的方式处理表达立场。太阳（在吠陀框架中观察身份与意志的象征）描述你怎样承担自己的选择。它所在的位置把注意力引向表达立场、接受反馈和确认责任，而不是给权力或社会地位打分。你可以在需要拍板时先说清判断依据，让参与者知道哪些意见还能补充。你的太阳落在双子。双子（以交流和比较为意象的星座）让你倾向于从不同说法中寻找线索。你的注意力可能随着新信息移动，适合把疑问说出来，再比较各自的依据。灵活不等于每个选项都要同时进行。例如同事提出两个执行方案，你先分别询问成本、交接方式和最容易卡住的环节，再形成简短记录。建议在探索之后安排收束时间，把最值得核对的一点交给具体行动，而不是不断增加选项。
