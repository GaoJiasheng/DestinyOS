  en:
    title: 'Surya in Scorpio: visible ownership'
    summary: You can explore visible ownership through a habit of choosing to explore depth with consent.
    body:
      You can approach visible ownership by choosing to explore depth with consent. Surya — the Sun, a symbol
      of personal direction — concerns how you take ownership of a choice. Its position offers a question about
      visibility and responsibility rather than a ranking of your status. A helpful contribution makes both your
      reasoning and its limits understandable to the people affected. You can practise explaining why a choice matters
      without asking everyone to share your enthusiasm. Your Surya occupies Scorpio. Scorpio — a sign associated
      with depth and trust — brings attention to what an agreement leaves unspoken. You may want to understand the
      reason behind a change rather than accept a smooth explanation. During a shared project, a missed handover
      could prompt a useful conversation about workload and expectations. Consider asking about observable obstacles
      before deciding what another person intended. Respecting a refusal to disclose private details also belongs
      to trust. Depth can strengthen a relationship when curiosity is explicit and the other person remains free
      to set limits.
    advice:
      - Ask about an observable obstacle before inferring motives.
    do:
      - Check facts
    dont:
      - Test people
