  en:
    title: 'Surya in Libra: visible ownership'
    summary: You can explore visible ownership through a habit of choosing to build workable agreements.
    body:
      'You can approach visible ownership by choosing to build workable agreements. Surya — the Sun, a symbol
      of personal direction — concerns how you take ownership of a choice. Its position offers a question about
      visibility and responsibility rather than a ranking of your status. A helpful contribution makes both your
      reasoning and its limits understandable to the people affected. You can practise explaining why a choice matters
      without asking everyone to share your enthusiasm. Your Surya occupies Libra. Libra — a sign linked with comparison
