    body: 你可以用给感受一个表达容器的方式处理给减法留出依据。计都（Ketu，与罗睺相对的月球轨道交点，作为简化和回顾的象征）描述你如何重新评估熟悉的投入。它不是一颗实体行星，也不要求你放弃关系或现实责任。你可以观察哪些重复动作仍有作用，哪些只是习惯，先做可撤回的减法再决定是否保留。你的计都落在双鱼。双鱼（以想象和共感为意象的星座）让你倾向于先感受氛围，再寻找表达方式。你可能善于看见尚未说清的情绪，让不同经验通过故事或画面相接。理解别人也需要核对，感受不能代替对方的实际回应。例如朋友语气变得安静，你先询问是否想休息，而不是直接安排帮助。建议用记录、创作或短暂独处整理自己的感受，再清楚说出能够提供什么，保留温柔也保留边界。
