      a symbol of enjoyment and reciprocity — highlights how you recognize a satisfying exchange. The reading can
      prompt a conversation about preferences without assigning a partner or a timetable for commitment. You can
      describe what you enjoy and ask whether someone else wants to share it. Mutual interest matters more than
      a scene that merely looks harmonious from outside. This planet is marked exalted. Exalted — a dignity label
      for a traditionally supportive zodiac placement — describes a setting within the model. Your recorded planet
      carries this label, inviting a question about where its symbolic function feels easier to use. It does not
      measure ability or finish a task for you. Imagine a responsibility that suits a method you know well: a short
      demonstration may help, but a colleague still needs room to ask about unfamiliar steps. Consider using comfort
      as a starting point for sharing and testing, and let preparation and actual feedback determine how well the
      approach works.'
    advice:
      - Share a preference and check whether the interest is mutual.
    do:
      - Respect consent
