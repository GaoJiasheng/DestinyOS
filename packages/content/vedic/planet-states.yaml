    summary: 你可以在顺手的条件下使用能力，结合月亮的主题回看经验。
    body: 你可以在安顿感受时在顺手的条件下使用能力。月亮（在这一体系中作为心绪与日常反应的观察点）描述你怎样恢复熟悉的节奏。它的位置为情绪需要提供比喻，不能用来评估心理状况。你可以从一天里最容易放松的时刻入手，比较陪伴、独处与环境变化对实际感受的影响。这颗行星的状态标为旺；旺（旺，行星落在传统认为较便于发挥的星座）只是模型内的一种位置标记。你盘中的这颗行星获得了这个状态，适合观察相关习惯在什么条件下更顺手。它不衡量现实能力，也不说明事情会自动完成。比如一项任务恰好符合你熟悉的方法，你可以利用经验先做示范，同时问同伴哪里仍然难懂。建议把顺手当作分享和试验的入口，别让一个有利标签代替准备与反馈。
