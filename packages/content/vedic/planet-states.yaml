    body: 你可以在把见识转为学习时先看情境再评价表现。木星（以学习、引导和拓展为象征的行星）描述你怎样寻找更大的理解框架。它的位置提醒你比较经验和观点，不等于拥有某种权威。你可以把一个宽泛道理改写成具体问题，邀请有相关经历的人提供不同看法。这颗行星的状态标为中性；中性（中性，传统状态表中没有特别强调友好或阻力的位置）给你留下比较实际情境的空间。你盘中的行星带有这一标记，不等于相关主题缺少力量或意义。比如参加一个新任务，你先核对目标、工具和同伴的期待，再观察自己哪种方法更顺手。建议用具体体验填充观察，既不把普通表现看低，也不因为缺少突出标签就忽略已有经验；整体命盘和现实条件都需要一起考虑。
    advice:
      - 用真实例子检验一个宽泛观点。
    do:
      - 持续学习
    dont:
      - 自居权威
  en:
    title: 'Guru: neutral sign'
    summary: You can let context guide the evaluation in questions of learning with perspective.
    body:
      You can let context guide the evaluation when exploring learning with perspective. Guru — Jupiter, a symbol
      of perspective and learning — asks how a larger idea changes an ordinary decision. The position invites reflection
      on guidance, without establishing that your advice is appropriate for everyone. You can test a broad principle
      against a real example and ask an experienced person where it stops being useful. Curiosity leaves more room
      for growth than needing to sound certain. This planet is marked neutral sign. Neutral sign — a dignity category
      without a special friendship or friction label in this implementation — leaves the symbolic setting open to
      context. It does not mean the planet’s theme lacks relevance. When beginning an unfamiliar assignment, checking
      the purpose, tools, and expectations can tell you more than the absence of a striking label. You can compare
      two practical approaches and note which one makes the work clearer. Ordinary experience deserves attention
      even when a classification seems unremarkable. Consider evaluating the method through use, with the rest of
      the chart and your real circumstances providing additional perspective.
    advice:
      - Test a broad principle against a specific example.
    do:
      - Stay curious
    dont:
      - Claim authority
