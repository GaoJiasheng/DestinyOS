      ability or finish a task for you. Imagine a responsibility that suits a method you know well: a short demonstration
      may help, but a colleague still needs room to ask about unfamiliar steps. Consider using comfort as a starting
      point for sharing and testing, and let preparation and actual feedback determine how well the approach works.'
