      not physical burning or a health assessment. Chandra — the Moon, used here as a reference for everyday responses
      — highlights what helps you feel settled. The position is a symbolic prompt about experience rather than an
      assessment of mental health. Notice how you move between company, solitude, and changing surroundings. You
      can describe what feels supportive without expecting another person to manage every shift in your mood. Imagine
