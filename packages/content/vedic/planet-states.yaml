      - 记录一项让你恢复节奏的日常安排。
    do:
      - 留出休息
    dont:
      - 压抑感受
  en:
    title: 'Chandra: exalted'
    summary: You can use a comfortable symbolic setting in questions of emotional continuity.
    body:
      'You can use a comfortable symbolic setting when exploring emotional continuity. Chandra — the Moon, used
      here as a reference for everyday responses — highlights what helps you feel settled. The position is a symbolic
      prompt about experience rather than an assessment of mental health. Notice how you move between company, solitude,
      and changing surroundings. You can describe what feels supportive without expecting another person to manage
      every shift in your mood. This planet is marked exalted. Exalted — a dignity label for a traditionally supportive
      zodiac placement — describes a setting within the model. Your recorded planet carries this label, inviting
      a question about where its symbolic function feels easier to use. It does not measure ability or finish a
      task for you. Imagine a responsibility that suits a method you know well: a short demonstration may help,
      but a colleague still needs room to ask about unfamiliar steps. Consider using comfort as a starting point
      for sharing and testing, and let preparation and actual feedback determine how well the approach works.'
    advice:
      - Notice one ordinary arrangement that helps you settle.
    do:
      - Make room
    dont:
      - Dismiss feelings
