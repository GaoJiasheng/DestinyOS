    title: 火星 · 旺：观察实际条件
    summary: 你可以在顺手的条件下使用能力，结合火星的主题回看经验。
    body: 你可以在把力量放进行动时在顺手的条件下使用能力。火星（以行动和应对摩擦为象征的行星）描述你怎样启动任务、表达不同意见。它的位置提示精力可能投向哪里，不表示你需要与谁竞争。你可以把不满改写成具体的改进请求，区分眼前要完成的事和一时想赢的争论。这颗行星的状态标为旺；旺（旺，行星落在传统认为较便于发挥的星座）只是模型内的一种位置标记。你盘中的这颗行星获得了这个状态，适合观察相关习惯在什么条件下更顺手。它不衡量现实能力，也不说明事情会自动完成。比如一项任务恰好符合你熟悉的方法，你可以利用经验先做示范，同时问同伴哪里仍然难懂。建议把顺手当作分享和试验的入口，别让一个有利标签代替准备与反馈。
    advice:
      - 把争执改写成一个可完成的请求。
    do:
      - 分步行动
    dont:
      - 急于对抗
  en:
    title: 'Mangala: exalted'
    summary: You can use a comfortable symbolic setting in questions of directed effort.
    body:
      'You can use a comfortable symbolic setting when exploring directed effort. Mangala — Mars, a symbol of
      effort and assertion — asks where you put energy when something needs doing. This position can also prompt
      you to notice what happens when a disagreement becomes a contest. You can name the task you want completed
      and make a specific request rather than pursue the last word. Sustainable effort includes a pause before escalating
      a conflict. This planet is marked exalted. Exalted — a dignity label for a traditionally supportive zodiac
      placement — describes a setting within the model. Your recorded planet carries this label, inviting a question
      about where its symbolic function feels easier to use. It does not measure ability or finish a task for you.
      Imagine a responsibility that suits a method you know well: a short demonstration may help, but a colleague
      still needs room to ask about unfamiliar steps. Consider using comfort as a starting point for sharing and
      testing, and let preparation and actual feedback determine how well the approach works.'
    advice:
      - Turn a disagreement into a concrete request for action.
    do:
      - Direct effort
    dont:
      - Escalate friction
