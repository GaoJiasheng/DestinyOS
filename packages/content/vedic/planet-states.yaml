- id: vedic.state.surya.exalted
  system: vedic
  section: lagna_planets
  topic: planet_state
  when:
    path: bodies[key=surya].dignity
    eq: exalted
  weight: 61
  polarity: mixed
  tags:
    - plain
  exclusive_with: []
  zh:
    title: 太阳 · 旺：观察实际条件
    summary: 你可以在顺手的条件下使用能力，结合太阳的主题回看经验。
    body: 你可以在表达立场时在顺手的条件下使用能力。太阳（在吠陀框架中观察身份与意志的象征）描述你怎样承担自己的选择。它所在的位置把注意力引向表达立场、接受反馈和确认责任，而不是给权力或社会地位打分。你可以在需要拍板时先说清判断依据，让参与者知道哪些意见还能补充。这颗行星的状态标为旺；旺（旺，行星落在传统认为较便于发挥的星座）只是模型内的一种位置标记。你盘中的这颗行星获得了这个状态，适合观察相关习惯在什么条件下更顺手。它不衡量现实能力，也不说明事情会自动完成。比如一项任务恰好符合你熟悉的方法，你可以利用经验先做示范，同时问同伴哪里仍然难懂。建议把顺手当作分享和试验的入口，别让一个有利标签代替准备与反馈。
    advice:
      - 说清一次决定的理由，再邀请具体反馈。
    do:
      - 明确责任
    dont:
      - 压过他人
  en:
    title: 'Surya: exalted'
    summary: You can use a comfortable symbolic setting in questions of visible ownership.
    body:
      'You can use a comfortable symbolic setting when exploring visible ownership. Surya — the Sun, a symbol
      of personal direction — concerns how you take ownership of a choice. Its position offers a question about
      visibility and responsibility rather than a ranking of your status. A helpful contribution makes both your
      reasoning and its limits understandable to the people affected. You can practise explaining why a choice matters
      without asking everyone to share your enthusiasm. This planet is marked exalted. Exalted — a dignity label
      for a traditionally supportive zodiac placement — describes a setting within the model. Your recorded planet
      carries this label, inviting a question about where its symbolic function feels easier to use. It does not
      measure ability or finish a task for you. Imagine a responsibility that suits a method you know well: a short
      demonstration may help, but a colleague still needs room to ask about unfamiliar steps. Consider using comfort
      as a starting point for sharing and testing, and let preparation and actual feedback determine how well the
      approach works.'
    advice:
      - Explain the reason for a decision before asking for feedback.
    do:
      - Own decisions
    dont:
      - Dominate discussions
  meta:
    author: t23-vedic-editorial-v1
    reviewed_by: null
    version: 2
    status: published
