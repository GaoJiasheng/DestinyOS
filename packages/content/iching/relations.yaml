    - iching.pacing
  exclusive_with:
    - iching.relation.use_generates_body.career.b
  zh:
    title: 事业：外部支持有助于你开展手头的事
    summary: 外部支持有助于你开展手头的事
    body: 在这个问题上，外部支持有助于你开展手头的事。用生体（外部因素对你所处位置形成支持）提示可借力的条件。体是象征你自身处境的部分，用是象征当前事件的部分，这种关系重在辨认帮助如何到位，不等于每项期待都会自动落实。例如，项目刚开始时，你可以列出交付内容、负责的人和缺少的材料，把依赖说清楚，避免把整个团队的进展都压在自己身上。在现有支持上先完成一件小事，确认配合能够持续之后再扩大范围，也把对方的时间与边界纳入安排。
    advice:
      - 把目标写成可核对的交付物
      - 在现有支持上先完成一件小事，确认配合能够持续之后再扩大范围，也把对方的时间与边界纳入安排。
    do:
      - 核对事实
    dont:
      - 仓促承诺
  en:
    title: 'Work: You can make practical use of support that fits your present capacity'
    summary: You can make practical use of support that fits your present capacity
    body: You can make practical use of support that fits your present capacity. Use generates body
      (yòng shēng tǐ — the event side supports the side representing your position) points toward
      useful assistance. Body and use are roles in this symbolic arrangement, not measurements of a
      person. Notice what help is actually available and how it reaches the task. For example, a new
      project may need a named owner, a clear handover, and one missing document. Write these
      dependencies down before accepting responsibility for the whole schedule. This makes a request
      for help easier for a colleague to answer. Start with a task that the available help can
      genuinely carry. Let the result show how coordination works before expanding the request, and
      recognize the other person’s time as part of the resource.
    advice:
      - Define one reviewable deliverable
      - Start with a task that the available help can genuinely carry. Let the result show how
        coordination works before expanding the request, and recognize the other person’s time as
        part of the resource.
    do:
      - Check facts
    dont:
      - Rush commitments
  meta:
    author: t23-original-v1
    reviewed_by: null
    version: 1
    status: published
