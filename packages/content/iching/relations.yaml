    summary: 配合感觉相近时，也可以主动核对不同需要
    body: 在这个问题上，配合感觉相近时，也可以主动核对不同需要。卦中比和（自身与事情一侧同属一种五行（木火土金水的关系分类））提示可能存在较好配合的基础。体与用分别象征你的位置与当前事件，共同属性只是一个观察角度，不说明你和任何人都应有相同想法或步调。例如，某件小事反复让你烦心时，可以记录它通常发生的场景与自己的回应，找出其中能调整的一点，邀请可信的人提供另一个观察角度。建议在一处具体安排上交换期待，例如时间与投入范围；若发现不同，也可以温和调整，避免为了保持和气把实际需要藏起来。
