  zh:
    title: 事业：得到支持也可以保留自己的节奏
    summary: 得到支持也可以保留自己的节奏
    body: 在这个问题上，得到支持也可以保留自己的节奏。卦中的用生体（事情一侧滋养自身处境一侧）描述的是支持方向，值得检查哪些材料、伙伴或时间安排正在帮助你。帮助只有进入实际使用才有价值；你仍需确定职责，不把有人愿意帮忙理解成已经具备全部条件。例如，在会议里讨论任务分配时，你可以先说明现有负荷与最需要配合的一项工作，再听取同事的安排，给协商保留具体入口。先把帮助转成一项明确约定，约好何时查看实际进度；若支持暂时不到位，可以缩小任务而非责怪自己。
    advice:
      - 约定一次职责与进度核对
      - 先把帮助转成一项明确约定，约好何时查看实际进度；若支持暂时不到位，可以缩小任务而非责怪自己。
    do:
      - 核对事实
    dont:
      - 仓促承诺
  en:
    title: 'Work: You can receive assistance and still choose your own pace'
    summary: You can receive assistance and still choose your own pace
    body:
      You can receive assistance and still choose your own pace. This reading shows use generates
      body (yòng shēng tǐ — circumstances feeding the position that represents you). The useful
      question is how an offer becomes access, coordination, or usable time. Receiving help does not
      remove your part in the arrangement or establish that every needed condition is ready. Imagine
      a planning meeting in which several people assume you will fill every gap. State your current
      workload and ask who can take one specific part. The conversation can then concern an actual
      arrangement instead of your willingness to work harder. Turn the offer into one clear
      agreement and a check on progress. If the assistance is not yet ready, make the task smaller
      instead of reading the delay as something wrong with you.
    advice:
      - Agree on a role and progress check
      - Turn the offer into one clear agreement and a check on progress. If the assistance is not
        yet ready, make the task smaller instead of reading the delay as something wrong with you.
    do:
      - Check facts
    dont:
      - Rush commitments
  meta:
    author: t23-original-v1
    reviewed_by: null
    version: 1
    status: published
