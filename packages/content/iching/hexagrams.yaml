  judgment: 亨，无咎，利贞，利有攸往。
  tuan: 恒，久也。刚上而柔下，雷风相与，巽而动，刚柔皆应，恒。恒亨无咎，利贞；久于其道也，天地之道，恒久而不已也。利有攸往，终则有始也。日月得天，而能久照，四时变化，而能久成，圣人久于其道，而天下化成；观其所恒，而天地万物之情可见矣！
  image: 雷风，恒；君子以立不易方。
  yao:
    - position: 1
      original: 初六：浚恒，贞凶，无攸利。
      image: 浚恒之凶，始求深也。
      meaning:
        zh: 刚开始便要求过深的稳定，容易用力过度。雷在风上，恒强调方向持续而做法可调整，不是每天完全相同。先确定值得维持的承诺，再为变化的日程安排交接和复盘，让长久依靠兑现而非硬撑。
        en:
          Let consistency develop before demanding an intense and permanent commitment. Thunder above wind
          presents continuity through changing movements. Keeping a direction does not require
          repeating the same method regardless of conditions. Identify the commitment worth
          maintaining and prepare handover or review when schedules change. Duration becomes
          practical through renewed follow-through, rather than through insisting that a difficult
          arrangement must remain untouched to prove loyalty.
    - position: 2
      original: 九二：悔亡。
      image: 九二悔亡，能久中也。
      meaning:
        zh: 处在可调整的位置，可以回到适当尺度。雷在风上，恒强调方向持续而做法可调整，不是每天完全相同。先确定值得维持的承诺，再为变化的日程安排交接和复盘，让长久依靠兑现而非硬撑。
        en:
          Bring effort back into proportion and let an unnecessary worry ease. Thunder above wind presents
          continuity through changing movements. Keeping a direction does not require repeating the
          same method regardless of conditions. Identify the commitment worth maintaining and
          prepare handover or review when schedules change. Duration becomes practical through
          renewed follow-through, rather than through insisting that a difficult arrangement must
          remain untouched to prove loyalty.
    - position: 3
      original: 九三：不恒其德，或承之羞，贞吝。
      image: 不恒其德，无所容也。
      meaning:
        zh: 做法频繁变动会削弱别人对你的信任。雷在风上，恒强调方向持续而做法可调整，不是每天完全相同。先确定值得维持的承诺，再为变化的日程安排交接和复盘，让长久依靠兑现而非硬撑。
        en:
          Notice how repeated changes of direction are affecting reliability. Thunder above wind presents
          continuity through changing movements. Keeping a direction does not require repeating the
          same method regardless of conditions. Identify the commitment worth maintaining and
          prepare handover or review when schedules change. Duration becomes practical through
          renewed follow-through, rather than through insisting that a difficult arrangement must
          remain untouched to prove loyalty.
    - position: 4
      original: 九四：田无禽。
      image: 久非其位，安得禽也。
      meaning:
        zh: 目标与场合不匹配时，重复努力也难奏效。雷在风上，恒强调方向持续而做法可调整，不是每天完全相同。先确定值得维持的承诺，再为变化的日程安排交接和复盘，让长久依靠兑现而非硬撑。
