    zh: 暂时不能大步推进时，积累小而可靠的成果。小畜以风在天上推动云气讲有限的约束与储备。力量还不足以带来全面变化时，细节上的整理仍有价值；把期待放在可见的小成果上，能减少空等与焦躁。风在天上，小畜用较柔和的力量约束较强的推进，积累尚未到大举行动的程度。先改进小处与沟通，不因为已有一点进展就忽略承载条件。
    en: 'You can use a limited opening to refine the habits that support later progress. A light
      influence can shape conditions without settling everything at once. Wind above heaven points
      toward preparation, repeated adjustments, and reserves that have not yet become a larger
      release. For example, improve a few recurring friction points before a broad launch. Wind
      above heaven suggests a limited influence shaping a stronger impulse. Small adjustments can
      collect useful capacity before a larger undertaking is ready. This differs from the Great
      Taming’s more substantial reserve. Improve a detail or a conversation, and check the
      supporting arrangement before treating modest progress as permission to expand. Two positions
      illustrate the distinction. At the second line: Accept a companion’s help in returning to a
      workable practice. At the fifth line: Make your available support useful to nearby
      collaborators. The final line adds another limit to consider: Allow a period of settling after
      preparation has produced a result.'
