  judgment: 艮其背，不获其身，行其庭，不见其人，无咎。
  tuan: 艮，止也。时止则止，时行则行，动静不失其时，其道光明。艮其止，止其所也。上下敌应，不相与也。是以不获其身，行其庭不见其人，无咎也。
  image: 兼山，艮；君子以思不出其位。
  yao:
    - position: 1
      original: 初六：艮其趾，无咎，利永贞。
      image: 艮其趾，未失正也。
      meaning:
        zh: 动作刚起时停住，有助于形成稳定边界。两重山，艮强调在合适的界限停住，止的是越界动作而非所有感受。可以暂停一轮无效回应，确认自己的责任范围，再决定何时恢复沟通与行动。
        en:
          Set a sound limit while the impulse is still small. Repeated mountain emphasizes stopping at an
          appropriate boundary. Stillness concerns an action and its limit, rather than suppressing
          every feeling or withdrawing from life. Pause a round of unproductive response and
          identify what belongs within your responsibility. Then decide what condition would make
          renewed engagement useful, so that a stop remains purposeful instead of becoming an
          indefinite barrier.
    - position: 2
      original: 六二：艮其腓，不拯其随，其心不快。
      image: 不拯其随，未退听也。
