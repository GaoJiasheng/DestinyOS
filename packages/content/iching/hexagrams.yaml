  judgment: 亨，小利有攸往。
  tuan: 贲，亨；柔来而文刚，故亨。分刚上而文柔，故小利有攸往。天文也；文明以止，人文也。观乎天文，以察时变；观乎人文，以化成天下。
  image: 山下有火，贲；君子以明庶政，无敢折狱。
  yao:
    - position: 1
      original: 初九：贲其趾，舍车而徒。
      image: 舍车而徒，义弗乘也。
      meaning:
        zh: 朴素地起步，可以不依赖外在排场。山下有火，贲强调表达与形式能够照亮内容，但修饰不能代替实质。先确认信息是否正确、物件是否好用，再改善呈现，朴素也可以合乎场合。
        en: Begin with a simple action instead of waiting for impressive equipment. Fire beneath the
          mountain illuminates a form without replacing its substance. Presentation can help people
          recognize what is being offered, but ornament cannot make an unusable arrangement sound.
          Check accuracy or function before refining appearance. A simple presentation may fit the
          occasion better than adding detail that obscures the central purpose.
    - position: 2
      original: 六二：贲其须。
      image: 贲其须，与上兴也。
      meaning:
        zh: 局部修饰宜配合主体内容。山下有火，贲强调表达与形式能够照亮内容，但修饰不能代替实质。先确认信息是否正确、物件是否好用，再改善呈现，朴素也可以合乎场合。
        en: Let a small embellishment follow the substance it belongs to. Fire beneath the mountain
          illuminates a form without replacing its substance. Presentation can help people recognize
          what is being offered, but ornament cannot make an unusable arrangement sound. Check
          accuracy or function before refining appearance. A simple presentation may fit the
          occasion better than adding detail that obscures the central purpose.
    - position: 3
      original: 九三：贲如濡如，永贞，吉。
      image: 永贞之吉，终莫之陵也。
      meaning:
        zh: 光泽容易吸引注意，仍需持续守住实质。山下有火，贲强调表达与形式能够照亮内容，但修饰不能代替实质。先确认信息是否正确、物件是否好用，再改善呈现，朴素也可以合乎场合。
        en: Keep polished presentation tied to reliable conduct over time. Fire beneath the mountain
          illuminates a form without replacing its substance. Presentation can help people recognize
          what is being offered, but ornament cannot make an unusable arrangement sound. Check
          accuracy or function before refining appearance. A simple presentation may fit the
          occasion better than adding detail that obscures the central purpose.
    - position: 4
      original: 六四：贲如皤如，白马翰如，匪寇婚媾。
      image: 六四，当位疑也。匪寇婚媾，终无尤也。
      meaning:
        zh: 朴素的来意可能被误认，宜先了解。山下有火，贲强调表达与形式能够照亮内容，但修饰不能代替实质。先确认信息是否正确、物件是否好用，再改善呈现，朴素也可以合乎场合。
        en:
          Give an understated approach a fair hearing before treating it as a threat. Fire beneath the
          mountain illuminates a form without replacing its substance. Presentation can help people
          recognize what is being offered, but ornament cannot make an unusable arrangement sound.
          Check accuracy or function before refining appearance. A simple presentation may fit the
          occasion better than adding detail that obscures the central purpose.
    - position: 5
      original: 六五：贲于丘园，束帛戋戋，吝，终吉。
      image: 六五之吉，有喜也。
      meaning:
        zh: 礼物不在昂贵，真诚与场合更关键。山下有火，贲强调表达与形式能够照亮内容，但修饰不能代替实质。先确认信息是否正确、物件是否好用，再改善呈现，朴素也可以合乎场合。
        en:
          Choose an appropriate modest gesture rather than a costly display. Fire beneath the mountain
          illuminates a form without replacing its substance. Presentation can help people recognize
          what is being offered, but ornament cannot make an unusable arrangement sound. Check
          accuracy or function before refining appearance. A simple presentation may fit the
          occasion better than adding detail that obscures the central purpose.
    - position: 6
      original: 上九：白贲，无咎。
      image: 白贲无咎，上得志也。
      meaning:
        zh: 回到简洁，减少无用装饰。山下有火，贲强调表达与形式能够照亮内容，但修饰不能代替实质。先确认信息是否正确、物件是否好用，再改善呈现，朴素也可以合乎场合。
        en: Let an unadorned presentation reveal what is already sound. Fire beneath the mountain
          illuminates a form without replacing its substance. Presentation can help people recognize
          what is being offered, but ornament cannot make an unusable arrangement sound. Check
          accuracy or function before refining appearance. A simple presentation may fit the
          occasion better than adding detail that obscures the central purpose.
