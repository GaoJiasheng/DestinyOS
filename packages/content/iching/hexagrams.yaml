        en:
          Use extra care at the foundation of an unusual undertaking. The lake above wood accompanies an
          image of a beam carrying unusual weight. The issue is load and support before any claim
          about breakthrough. Reduce nonessential aims and distribute the central responsibility
          among people able to carry it. Continuing to demonstrate endurance can leave the structure
          weaker, while a well-supported exception may make a necessary passage workable.
    - position: 2
      original: 九二：枯阳生稊，老夫得其女妻，无不利。
      image: 老夫女妻，过以相与也。
