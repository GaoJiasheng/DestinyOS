    zh:
      离属于《周易》六十四卦的文本与图像传统，本页沿用文王卦序，卦辞、象辞与各爻解释分层保留。上卦为离（火），下卦为离（火）；这组上下图像构成观察情境的入口，并非现实事件的照片。清楚看见需要依靠什么，才能让热情持续。离以重叠的火讲明亮与依附，火需要合适的燃料，理解也需要可靠材料。你可以发挥表达与观察能力，同时照顾支持自己的条件，避免只靠一时兴奋维持全部进展。两重火，离强调明亮需要有所依附，热情也需要可持续的基础。先找出支持行动的资料、工具或人，不把自己独立发光理解为不需要任何承接。
