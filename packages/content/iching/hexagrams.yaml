      coordination. The aim is to let newly available room become useful, without assuming that
      relief means every practical issue has already resolved itself. Two positions illustrate the
      distinction. At the second line: Resolve several small hidden obstructions before moving on.
      At the fifth line: Let a clear release of pressure show through fair and consistent conduct.
