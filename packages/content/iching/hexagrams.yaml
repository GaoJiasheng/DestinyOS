      谦属于《周易》六十四卦的文本与图像传统，本页沿用文王卦序，卦辞、象辞与各爻解释分层保留。上卦为坤（地），下卦为艮（山）；这组上下图像构成观察情境的入口，并非现实事件的照片。低调表达实力，让贡献被看见而不过度占位。谦以山藏于地的意象讲有高度却不张扬，重点是实力与位置相称。谦和不是否认努力，也不是接受不合理要求，而是让事实说话，给他人的贡献留空间。山藏于地中，谦以有实力而不高举自己的意象强调分寸。谦和不是缩小贡献，可以用事实说明完成了什么，同时把协作者的作用留在叙述中。
      阅读时先看六爻由下向上的结构，再比较整体与具体爻位。古文保留在折叠区，你可以结合白话查读，不必用一个古典词汇概括自己的经历。
    en:
      'Modesty belongs to the textual and image tradition of the sixty-four I Ching figures. This page
      follows King Wen ordering and keeps the judgment, image, and individual line explanations
      distinct. The upper trigram is Kun (坤, kūn — Earth), and the lower is Gen (艮, gèn — Mountain).
      Their pairing offers a symbolic entry into a situation, not a picture of an established event.
      You can make a strong contribution without making every exchange a contest for attention. A
      mountain within earth suggests strength carried without display. Modesty can mean accurate
      self-assessment and fair credit, while still naming the effort and boundaries that make your
      contribution sustainable. For example, explain both your work and the help that supported it.
      The mountain within earth suggests real substance expressed without occupying the highest
      visible place. Modesty does not require denying a contribution. Describe what you completed
      plainly while acknowledging what others supplied. This keeps the scale of the account close to
      the work and allows competence to remain visible without turning it into a contest for
      attention. Two positions illustrate the distinction. At the second line: Let a reputation for
      modesty be supported by ordinary conduct. At the fifth line: Set a needed boundary without
      using it to display dominance. Start with the bottom-to-top line structure, then compare the
      whole figure with an individual position. The classical text remains expandable for study
      alongside the plain-language explanation.'
