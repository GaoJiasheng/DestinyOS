          Seek a fair process led by someone able to assess both sides. Heaven and water move in different
          ways, providing an image of diverging aims. The practical concern is how a disagreement
          escalates and where it can be stopped. Return to an agreement the participants can fulfil,
          and seek fair mediation where useful, rather than making victory the only acceptable
          ending.
    - position: 6
      original: 上九：或锡之鞶带，终朝三褫之。
      image: 以讼受服，亦不足敬也。
      meaning:
        zh: 靠争夺换来的位置未必稳固。天与水的走势不同，讼强调争执中看清代价与停下的时机。中途回到可履行的约定比追求争赢更稳，必要时找公允的第三方协助沟通。
