  historySymbolism:
    zh:
      需属于《周易》六十四卦的文本与图像传统，本页沿用文王卦序，卦辞、象辞与各爻解释分层保留。上卦为坎（水），下卦为乾（天）；这组上下图像构成观察情境的入口，并非现实事件的照片。等待条件成熟时，仍可照顾手头的准备。需讲有能力但前路尚有阻隔，天空下方的水并未提供直接通道。等待不是把事情搁置，而是保留余地、补齐信息，避免越急越靠近难以退出的位置。水在天上，需是危险尚在前方时的有准备等待，不是拖延所有事。照顾食宿与已有资源，等候真正缺少的条件，不把着急当成已经可以跨越的依据。
