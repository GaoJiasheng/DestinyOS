# Original bilingual plain-language commentary; classical source fields retained.
# DESIGN-GAP: English length uses words (140–180 for meanings, 55–90 for lines); zh uses characters.
# DESIGN-GAP: The existing keywords schema is three strings; each string carries a zh/en label.
- number: 1
  key: hexagram_01
  name: 乾
  pinyin: qian
  englishName: The Creative
  upper: qian
  lower: qian
  lines:
    - 1
    - 1
    - 1
    - 1
    - 1
    - 1
  judgment: 元、亨、利、贞。
  tuan: 大哉乾元，万物资始，乃统天。云行雨施，品物流形。大明始终，六位时成，时乘六龙以御天。乾道变化，各正性命，保合大和，乃利贞。首出庶物，万国咸宁。
  image: 天行健，君子以自强不息。
  yao:
    - position: 1
      original: 初九：潜龙勿用。
      image: 潜龙勿用，阳在下也。
      meaning:
        zh: 力量尚在积累，暂不急于露面，你可以先核对条件。这里着眼于刚起步的安排，先看脚下是否有可靠支点。建议按实际反馈决定下一步。
        en:
          Keep developing a skill privately before asking it to carry public responsibility. At the first
          stage, preparation matters more than a visible result. Look for a reliable foothold before
          adding scope. You can apply this to one current task, then notice whether the response
          creates a more workable arrangement. Let practical feedback guide your next choice rather
          than treating the image as an instruction to follow without question.
    - position: 2
      original: 九二：见龙在田，利见大人。
      image: 见龙在田，德施普也。
      meaning:
        zh: 开始被看见，可以向有经验的人请教，你可以先核对条件。这一位置重视能够相互回应的支持，留意谁愿意配合。建议按实际反馈决定下一步。
        en:
          Make your emerging ability accessible and seek a capable guide. This stage asks how support
          works in practice. Notice which connections offer a usable response and which remain only
          a hope. You can apply this to one current task, then notice whether the response creates a
          more workable arrangement. Let practical feedback guide your next choice rather than
          treating the image as an instruction to follow without question.
    - position: 3
      original: 九三：君子终日乾乾，夕惕若厉，无咎。
      image: 终日乾乾，反复道也。
      meaning:
        zh: 持续努力也需要警觉与休息，你可以先核对条件。你正接近阶段转换，宜核对行动与实际条件是否相称。建议按实际反馈决定下一步。
        en:
          Balance diligent practice with an evening check on your limits. At a transition, momentum can
          outrun the arrangement supporting it. Review what has changed before repeating an earlier
          approach. You can apply this to one current task, then notice whether the response creates
          a more workable arrangement. Let practical feedback guide your next choice rather than
          treating the image as an instruction to follow without question.
    - position: 4
      original: 九四：或跃在渊，无咎。
      image: 或跃在渊，进无咎也。
      meaning:
        zh: 进退之间先试探合适的位置，你可以先核对条件。来到新的接洽位置，沟通方式与承接能力都值得检查。建议按实际反馈决定下一步。
        en:
          Test the opening without pretending that the transition is already settled. A new point of
          contact makes coordination important. Check both how a request is received and who can
          carry the next step. You can apply this to one current task, then notice whether the
          response creates a more workable arrangement. Let practical feedback guide your next
          choice rather than treating the image as an instruction to follow without question.
    - position: 5
      original: 九五：飞龙在天，利见大人。
      image: 飞龙在天，大人造也。
      meaning:
        zh: 处在能发挥作用的位置，宜联结可靠伙伴，你可以先核对条件。这里关注能影响整体的责任，考虑做法对他人的作用。建议按实际反馈决定下一步。
        en:
          Use a visible role to connect capable people around a shared purpose. A position with wider
          influence asks you to consider other people. Responsibility includes how your choices
          shape their room to act. You can apply this to one current task, then notice whether the
          response creates a more workable arrangement. Let practical feedback guide your next
          choice rather than treating the image as an instruction to follow without question.
    - position: 6
      original: 上九：亢龙有悔。
      image: 亢龙有悔，盈不可久也。
      meaning:
        zh: 力量用过了头，宜收住扩张，你可以先核对条件。这一阶段接近收尾或极限，适合回看尺度并准备调整。建议按实际反馈决定下一步。
        en:
          Notice when ambition has outgrown the situation and step back from excess. Near the end of a
          phase, useful action often changes. Review the scale of your involvement and what needs to
          be handed onward. You can apply this to one current task, then notice whether the response
          creates a more workable arrangement. Let practical feedback guide your next choice rather
          than treating the image as an instruction to follow without question.
  useNineSix:
    original: 用九：见群龙无首，吉。
    image: 用九，天德不可为首也。
  meaning:
    zh: 主动创造，持续练习，把力量用在可承担的目标上；你可以对照现实来看。能力正在形成时先做准备，得到支持后再扩大影响，走到高处也要留意反馈。乾的六个位置呈现力量从潜藏到显露的过程，重点是行动与时机相配。例如，新项目先做样稿，再邀请同事评审，更容易把想法放进实际生活。建议给每一步设定检查点，并根据反馈调整节奏。
    en:
      'You have room to initiate, but leadership asks for practice as well as confidence. A capable
      person can still move too early. The six dragon images trace how initiative develops, becomes
      visible, and eventually needs restraint. For example, test an idea privately before asking a
      team to follow it. The point is to notice how your current arrangement supports this kind of
      response, not to predict an event from the image. Consider a small action with an observable
      result: make room for honest feedback. Give yourself a practical review point, such as the
      next conversation or completed task, so that new information can change your approach. You can
      retain the part that fits your circumstances and set aside what does not. Your own experience
      and the choices available to you remain central to applying this reading. A useful question is
      which current constraint you can actually influence, and what would show that your next step
      has helped.'
  keywords:
    - 主动 / initiative
    - 韧性 / resilience
    - 节制 / restraint
  guidance:
    career:
      zh: 在工作协作上，你可以给每一步设定检查点，并先确认职责与交接。
      en: 'For a work task, consider this emphasis: make room for honest feedback, and confirm
        responsibilities and the handover.'
    wealth:
      zh: 在日常预算上，你可以给每一步设定检查点，并先记录收支与可调整开销。
      en: 'For a household budget, consider this emphasis: make room for honest feedback, and check
        spending records and adjustable costs.'
    love:
      zh: 在关系沟通上，你可以给每一步设定检查点，并尊重双方自愿回应与边界。
      en: 'For a voluntary relationship conversation, consider this emphasis: make room for honest
        feedback, and respect voluntary responses and mutual boundaries.'
    health:
      zh: 在作息安排上，你可以给每一步设定检查点，并观察日常休息与情绪节奏。
      en:
        'For a daily rest routine, consider this emphasis: make room for honest feedback, and observe
        rest and daily emotional rhythm.'
    study:
      zh: 在学习练习上，你可以给每一步设定检查点，并用一次实际练习取得反馈。
      en: 'For a learning exercise, consider this emphasis: make room for honest feedback, and seek
        feedback from a completed exercise.'
    travel:
      zh: 在行程准备上，你可以给每一步设定检查点，并核对路线、联络与备用安排。
      en:
        'For a journey plan, consider this emphasis: make room for honest feedback, and verify routes,
        contacts, and an alternative.'
    decision:
      zh: 在选择比较上，你可以给每一步设定检查点，并比较限制并保留可撤回的小步骤。
      en:
        'For a choice between practical options, consider this emphasis: make room for honest feedback,
        and compare constraints and keep the first step reversible.'
    other:
      zh: 在眼前的小事上，你可以给每一步设定检查点，并先明确一个可描述的情境。
      en:
        'For a current everyday concern, consider this emphasis: make room for honest feedback, and name
        one situation you can actually describe.'
- number: 2
  key: hexagram_02
  name: 坤
  pinyin: kun
  englishName: The Receptive
  upper: kun
  lower: kun
  lines:
