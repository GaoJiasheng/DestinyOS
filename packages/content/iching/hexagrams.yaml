  historySymbolism:
    zh:
      屯属于《周易》六十四卦的文本与图像传统，本页沿用文王卦序，卦辞、象辞与各爻解释分层保留。上卦为坎（水），下卦为震（雷）；这组上下图像构成观察情境的入口，并非现实事件的照片。起步不顺时，先把资源和伙伴组织起来。屯讲新生事物尚未成形，雷的推动遇到水的阻碍，容易出现热情先于条件的情况。反复并不说明方向无价值，往往提示规则、资源与协作还需要搭建。水在雷上，行动已经发动而前方仍有险，屯重在初创时组织条件。困难不要求孤军推进，可以先找能共担任务的人，再逐项建立秩序。
