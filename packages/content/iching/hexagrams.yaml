- number: 11
  key: hexagram_11
  name: 泰
  pinyin: tai
  englishName: Peace
  upper: kun
  lower: qian
  lines:
    - 1
    - 1
    - 1
    - 0
    - 0
    - 0
  judgment: 泰，小往大来，吉亨。
  tuan: 泰，小往大来，吉亨。则是天地交，而万物通也；上下交，而其志同也。内阳而外阴，内健而外顺，内君子而外小人，君子道长，小人道消也。
  image: 天地交泰，后以财成天地之道，辅相天地之宜，以左右民。
  yao:
    - position: 1
      original: 初九：拔茅茹，以其汇，征吉。
      image: 拔茅征吉，志在外也。
      meaning:
        zh: 同行者相互牵引，可以一起打开局面。地在上、天在下，泰强调上下之气能够相交的通畅。顺畅不是永久状态，宜在能沟通时建立明确分工与维护方式，把合作落成可重复的日常。
        en:
          Bring trusted collaborators into an opening rather than advancing entirely alone. Earth above
          heaven represents an exchange between complementary movements. The point is circulation
          and access, rather than an everlasting favourable condition. Use a period of communication
          to establish clear responsibilities and ways to maintain contact. A workable routine helps
          the relationship remain usable when the initial ease is no longer new.
    - position: 2
      original: 九二：包荒，用冯河，不遐遗，朋亡，得尚于中行。
      image: 包荒，得尚于中行，以光大也。
      meaning:
        zh: 接纳不同条件，按共同目标协调。地在上、天在下，泰强调上下之气能够相交的通畅。顺畅不是永久状态，宜在能沟通时建立明确分工与维护方式，把合作落成可重复的日常。
        en:
          Include people with differing strengths and hold a balanced common direction. Earth above heaven
          represents an exchange between complementary movements. The point is circulation and
          access, rather than an everlasting favourable condition. Use a period of communication to
          establish clear responsibilities and ways to maintain contact. A workable routine helps
          the relationship remain usable when the initial ease is no longer new.
    - position: 3
      original: 九三：无平不陂，无往不复，艰贞无咎，勿恤其孚，于食有福。
      image: 无往不复，天地际也。
      meaning:
        zh: 顺畅也有起伏，守住可靠的日常做法。地在上、天在下，泰强调上下之气能够相交的通畅。顺畅不是永久状态，宜在能沟通时建立明确分工与维护方式，把合作落成可重复的日常。
        en:
          Prepare for changes within an easy interval without losing your ordinary steadiness. Earth above
          heaven represents an exchange between complementary movements. The point is circulation
          and access, rather than an everlasting favourable condition. Use a period of communication
          to establish clear responsibilities and ways to maintain contact. A workable routine helps
          the relationship remain usable when the initial ease is no longer new.
    - position: 4
      original: 六四：翩翩不富，以其邻，不戒以孚。
      image: 翩翩不富，皆失实也。不戒以孚，中心愿也。
      meaning:
        zh: 平等回应邻近伙伴，不只凭资源多少联结。地在上、天在下，泰强调上下之气能够相交的通畅。顺畅不是永久状态，宜在能沟通时建立明确分工与维护方式，把合作落成可重复的日常。
        en:
          Offer trust to peers without making wealth or status the entry requirement. Earth above heaven
          represents an exchange between complementary movements. The point is circulation and
          access, rather than an everlasting favourable condition. Use a period of communication to
          establish clear responsibilities and ways to maintain contact. A workable routine helps
          the relationship remain usable when the initial ease is no longer new.
    - position: 5
      original: 六五：帝乙归妹，以祉元吉。
      image: 以祉元吉，中以行愿也。
      meaning:
        zh: 以谦和联结促成合作，不借位置压人。地在上、天在下，泰强调上下之气能够相交的通畅。顺畅不是永久状态，宜在能沟通时建立明确分工与维护方式，把合作落成可重复的日常。
        en:
          Use a privileged position to create a respectful alliance. Earth above heaven represents an
          exchange between complementary movements. The point is circulation and access, rather than
          an everlasting favourable condition. Use a period of communication to establish clear
          responsibilities and ways to maintain contact. A workable routine helps the relationship
          remain usable when the initial ease is no longer new.
    - position: 6
      original: 上六：城复于隍，勿用师，自邑告命，贞吝。
      image: 城复于隍，其命乱也。
      meaning:
        zh: 原有支撑开始回落，适合收缩并重新安排。地在上、天在下，泰强调上下之气能够相交的通畅。顺畅不是永久状态，宜在能沟通时建立明确分工与维护方式，把合作落成可重复的日常。
        en:
          Scale back when the structure that supported progress begins to loosen. Earth above heaven
          represents an exchange between complementary movements. The point is circulation and
          access, rather than an everlasting favourable condition. Use a period of communication to
          establish clear responsibilities and ways to maintain contact. A workable routine helps
          the relationship remain usable when the initial ease is no longer new.
