          accompanies a decisive disclosure or separation. Clarity should not become a reason to
          escalate force. State the facts and the behaviour that needs changing, then define the
          boundary you will maintain. A firm decision can remain proportionate and understandable
          without requiring the other person to be defeated or humiliated.
