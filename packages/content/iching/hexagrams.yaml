  meaning:
    zh: 等待条件成熟时，仍可照顾手头的准备。需讲有能力但前路尚有阻隔，天空下方的水并未提供直接通道。等待不是把事情搁置，而是保留余地、补齐信息，避免越急越靠近难以退出的位置。水在天上，需是危险尚在前方时的有准备等待，不是拖延所有事。照顾食宿与已有资源，等候真正缺少的条件，不把着急当成已经可以跨越的依据。
    en: 'You can wait productively by protecting your capacity and watching for a practical opening.
      Strength does not remove every delay. Water above heaven places a capable impulse beneath an
      uncertain crossing, making preparation and distance from trouble useful forms of action. For
      example, use a delayed reply to prepare the next useful document. Water above heaven places
      difficulty ahead of an active force. Waiting here has a purpose: preserve usable resources
      while the missing condition develops. It differs from postponing everything indefinitely.
      Identify what you are actually waiting for and continue the preparation that does not require
      crossing the present obstacle. Two positions illustrate the distinction. At the second line:
      Handle minor criticism without letting it draw you into a premature crossing. At the fifth
      line: Use the interval to restore capacity and attend to ordinary needs. The final line adds
      another limit to consider: Receive unexpected assistance respectfully and learn what the
      visitors can offer.'
