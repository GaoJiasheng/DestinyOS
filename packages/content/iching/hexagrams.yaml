      艮属于《周易》六十四卦的文本与图像传统，本页沿用文王卦序，卦辞、象辞与各爻解释分层保留。上卦为艮（山），下卦为艮（山）；这组上下图像构成观察情境的入口，并非现实事件的照片。在合适的位置停一停，能够重新看清方向。艮以重叠的山讲停止与界限，停下并不是要求压住所有感受。你可以辨认什么已超出当天的承受范围，在行动与休息之间建立清楚边界，给判断留下安静的空间。两重山，艮强调在合适的界限停住，止的是越界动作而非所有感受。可以暂停一轮无效回应，确认自己的责任范围，再决定何时恢复沟通与行动。
      阅读时先看六爻由下向上的结构，再比较整体与具体爻位。古文保留在折叠区，你可以结合白话查读，不必用一个古典词汇概括自己的经历。
    en: 'Keeping Still belongs to the textual and image tradition of the sixty-four I Ching figures.
      This page follows King Wen ordering and keeps the judgment, image, and individual line
      explanations distinct. The upper trigram is Gen (艮, gèn — Mountain), and the lower is Gen (艮,
      gèn — Mountain). Their pairing offers a symbolic entry into a situation, not a picture of an
      established event. You can pause deliberately and let a boundary protect your attention.
      Mountains repeated offer an image of stillness and limits. A good pause is neither endless
      avoidance nor forced rigidity; it gives attention a place to settle and helps you recognize
      where your responsibility ends. For example, pause a tense discussion and agree when to
      return. Repeated mountain emphasizes stopping at an appropriate boundary. Stillness concerns
      an action and its limit, rather than suppressing every feeling or withdrawing from life. Pause
      a round of unproductive response and identify what belongs within your responsibility. Then
      decide what condition would make renewed engagement useful, so that a stop remains purposeful
      instead of becoming an indefinite barrier. Two positions illustrate the distinction. At the
      second line: Recognize where your influence ends instead of forcing someone else’s pace. At
      the fifth line: Slow your speech enough to make the sequence clear. Start with the
      bottom-to-top line structure, then compare the whole figure with an individual position. The
      classical text remains expandable for study alongside the plain-language explanation.'
