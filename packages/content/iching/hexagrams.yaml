  judgment: 小亨、旅贞吉。
  tuan: 旅，小亨，柔得中乎外，而顺乎刚，止而丽乎明，是以小亨，旅贞吉也。旅之时义大矣哉！
  image: 山上有火，旅；君子以明慎用刑，而不留狱。
  yao:
    - position: 1
      original: 初六：旅琐琐，斯其所取灾。
      image: 旅琐琐，志穷灾也。
      meaning:
        zh: 为琐碎利益纠缠，可能让处境更难。火在山上，旅强调暂居环境中先照顾落脚与分寸，不把自己当成拥有全部权限的人。核对归属、规则与支持渠道，再决定可承担的参与范围。
        en:
          Leave a petty contest that is making an unfamiliar setting harder to navigate. Fire above the
          mountain presents a temporary position in an unfamiliar setting. Secure a place to work or
          rest and understand the local terms before assuming broad authority. Clarify ownership,
          rules and sources of support. A traveller’s useful contribution can be limited and
          respectful, allowing participation without pretending that every part of the environment
          is already familiar.
