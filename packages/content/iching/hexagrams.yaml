- number: 5
  key: hexagram_05
  name: 需
  pinyin: xu
  englishName: Waiting
  upper: kan
  lower: qian
  lines:
    - 1
    - 1
    - 1
    - 0
    - 1
    - 0
  judgment: 有孚，光亨贞吉，利涉大川。
  tuan: 需，须也；险在前也。刚健而不陷，其义不困穷矣。需有孚，光亨，贞吉。位乎天位，以正中也。利涉大川，往有功也。
  image: 云上于天，需；君子以饮食宴乐。
  yao:
    - position: 1
      original: 初九：需于郊，利用恒，无咎。
      image: 需于郊，不犯难行也。利用恒，无咎；未失常也。
      meaning:
        zh: 远离险处等待，维持日常准备。水在天上，需是危险尚在前方时的有准备等待，不是拖延所有事。照顾食宿与已有资源，等候真正缺少的条件，不把着急当成已经可以跨越的依据。
        en:
          'Wait at a useful distance while keeping a regular preparation routine. Water above heaven
          places difficulty ahead of an active force. Waiting here has a purpose: preserve usable
          resources while the missing condition develops. It differs from postponing everything
          indefinitely. Identify what you are actually waiting for and continue the preparation that
          does not require crossing the present obstacle.'
    - position: 2
      original: 九二：需于沙，小有言，终吉。
      image: 需于沙，衍在中也。虽小有言，以终吉也。
      meaning:
        zh: 靠近阻碍容易受到议论，稳住做法。水在天上，需是危险尚在前方时的有准备等待，不是拖延所有事。照顾食宿与已有资源，等候真正缺少的条件，不把着急当成已经可以跨越的依据。
        en:
          'Handle minor criticism without letting it draw you into a premature crossing. Water above
          heaven places difficulty ahead of an active force. Waiting here has a purpose: preserve
          usable resources while the missing condition develops. It differs from postponing
          everything indefinitely. Identify what you are actually waiting for and continue the
          preparation that does not require crossing the present obstacle.'
    - position: 3
      original: 九三：需于泥，致寇至。
      image: 需于泥，灾在外也。自我致寇，敬慎不败也。
      meaning:
        zh: 陷在不稳的位置会增加麻烦，宜退出。水在天上，需是危险尚在前方时的有准备等待，不是拖延所有事。照顾食宿与已有资源，等候真正缺少的条件，不把着急当成已经可以跨越的依据。
        en:
          'Recognize when impatience has put you on unreliable ground and retreat. Water above heaven
          places difficulty ahead of an active force. Waiting here has a purpose: preserve usable
          resources while the missing condition develops. It differs from postponing everything
          indefinitely. Identify what you are actually waiting for and continue the preparation that
          does not require crossing the present obstacle.'
