        zh: 帮助别人前先量力，适度让出资源。山在泽上，损强调有选择地减少，帮助别人也要量力。减掉的是不再需要的负荷，不是自己的基本支持；先说明能让出多少、保留什么，再观察减少是否改善了整体。
        en:
          Offer timely help at a size that does not undermine your own essentials. The mountain above the
          lake directs attention to a reduction that changes the balance of an arrangement. Giving
          something up is useful when the purpose and limit are clear. Identify what can be reduced
          without removing essential support. Then check whether the decrease helps the whole task,
          rather than treating self-denial as valuable regardless of its effect.
