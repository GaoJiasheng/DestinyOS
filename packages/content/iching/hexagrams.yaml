        zh: 资源已失去可用性，先做清理维护。水在木上，井强调稳定来源需要取用工具与维护，资源存在不等于人能用到。先检查入口、传递与责任，修好一个漏损或交接环节，让共同支持真正可达。
        en:
          Restore a neglected source before asking others to rely on it. Water above wood gives the image
          of a well whose usefulness depends on access and maintenance. A resource can exist without
          reaching the person who needs it. Inspect the tool, the entry point and the responsibility
          for upkeep. Repair a leak or handover problem so that a stable source becomes usable
          rather than merely recognized as present.
