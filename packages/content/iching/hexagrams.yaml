  historySymbolism:
    zh:
      小畜属于《周易》六十四卦的文本与图像传统，本页沿用文王卦序，卦辞、象辞与各爻解释分层保留。上卦为巽（风），下卦为乾（天）；这组上下图像构成观察情境的入口，并非现实事件的照片。暂时不能大步推进时，积累小而可靠的成果。小畜以风在天上推动云气讲有限的约束与储备。力量还不足以带来全面变化时，细节上的整理仍有价值；把期待放在可见的小成果上，能减少空等与焦躁。风在天上，小畜用较柔和的力量约束较强的推进，积累尚未到大举行动的程度。先改进小处与沟通，不因为已有一点进展就忽略承载条件。
