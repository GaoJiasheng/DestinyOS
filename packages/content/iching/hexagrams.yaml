  judgment: 亨，出入无疾，朋来无咎。
  tuan: 复亨；刚反，动而以顺行，是以出入无疾，朋来无咎。反复其道，七日来复，天行也。利有攸往，刚长也。复其见天地之心乎？
  image: 雷在地中，复；先王以至日闭关，商旅不行，后不省方。
  yao:
    - position: 1
      original: 初九：不远复，无祇悔，元吉。
