      meaning:
        zh: 与同伴守住原则，不随环境盲动。天在上、地在下，否强调联系难以相通，宜保护原则与可用资源。与泰相反，眼下不宜把未获回应的事情当成已落实；先找一个能够重新接洽的入口。
        en:
          Keep company with people who can maintain standards in a blocked setting. Heaven above earth
          presents movements that do not readily meet. Unlike Peace, the emphasis is on blocked
          exchange and preserving what remains workable. Do not count an unanswered request as an
          agreement. Protect essential resources and look for a limited point of contact through
          which communication can begin again.
