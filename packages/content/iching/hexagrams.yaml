        en:
          Recognize where your influence ends instead of forcing someone else’s pace. Repeated mountain
          emphasizes stopping at an appropriate boundary. Stillness concerns an action and its
          limit, rather than suppressing every feeling or withdrawing from life. Pause a round of
          unproductive response and identify what belongs within your responsibility. Then decide
          what condition would make renewed engagement useful, so that a stop remains purposeful
          instead of becoming an indefinite barrier.
