    en:
      'Pushing Upward belongs to the textual and image tradition of the sixty-four I Ching figures.
      This page follows King Wen ordering and keeps the judgment, image, and individual line
      explanations distinct. The upper trigram is Kun (坤, kūn — Earth), and the lower is Xun (巽, xùn
      — Wind). Their pairing offers a symbolic entry into a situation, not a picture of an
      established event. You can grow through repeatable steps and support that recognizes the work.
      Wood growing through earth suggests development supported from below. Progress is easier to
      sustain when it has manageable stages, honest feedback, and opportunities to use what you have
      already learned. For example, build a small portfolio through successive practice tasks. Wood
      growing within earth presents gradual advancement through suitable conditions. This differs
      from forcing a single leap. Identify the practice and support needed for the next stage, then
      extend the scope after that stage becomes usable. Repeated preparation gives progress a
      footing and helps you distinguish a sustainable step from movement driven mainly by
      impatience. Two positions illustrate the distinction. At the second line: Offer a modest
      contribution that accurately reflects your intention. At the fifth line: Advance through
      recognizable stages with a dependable method. The final line adds another limit to consider:
      Keep perseverance connected to a visible purpose instead of climbing blindly. Start with the
      bottom-to-top line structure, then compare the whole figure with an individual position. The
      classical text remains expandable for study alongside the plain-language explanation.'
