      meaning:
        zh: 清出旧积存，让器物重新可用。火在木上，鼎强调把材料转成可供使用的成果，器具和承载同样关键。先修工具、分工与交接，再讨论扩大产出，让已有内容真正到达需要的人。
        en:
          Remove accumulated residue before expecting a process to produce a useful result. Fire above
          wood presents the transformation of ingredients through a vessel. Good material still
          needs a sound means of preparation and delivery. Check the tool, the division of work and
          the handover before increasing output. The reading asks how capacity becomes nourishment
          or a usable result, rather than treating possession of ingredients as equivalent to a
          completed contribution.
