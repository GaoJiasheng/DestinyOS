  judgment: 利有攸往，利涉大川。
  tuan: 益，损上益下，民说无疆，自上下下，其道大光。利有攸往，中正有庆。利涉大川，木道乃行。益动而巽，日进无疆。天施地生，其益无方。凡益之道，与时偕行。
  image: 风雷，益；君子以见善则迁，有过则改。
  yao:
    - position: 1
      original: 初九：利用为大作，元吉，无咎。
      image: 元吉无咎，下不厚事也。
      meaning:
        zh: 增加资源时适合承担有准备的重要任务。风在雷上，益强调增加的支持应转成实际改善，而不只停在数量。接受协助后完成一项原先缺少条件的任务，也及时说明帮助怎样被使用，让增益能持续。
        en: Use added capacity for a substantial task you have prepared to carry. Wind above thunder
          presents an increase that can assist movement. Added support matters through the
          improvement it enables, not only through the amount received. Use an offer to complete a
          task previously missing a condition, and explain how the assistance was used. This makes
          an increase accountable and helps others decide whether the support can continue.
    - position: 2
      original: 六二：或益之，十朋之龟，弗克违，永贞吉，王用享于帝，吉。
      image: 或益之，自外来也。
      meaning:
        zh: 得到支持后继续稳定兑现责任。风在雷上，益强调增加的支持应转成实际改善，而不只停在数量。接受协助后完成一项原先缺少条件的任务，也及时说明帮助怎样被使用，让增益能持续。
        en:
          Let unexpected assistance deepen a reliable long-term practice. Wind above thunder presents an
          increase that can assist movement. Added support matters through the improvement it
          enables, not only through the amount received. Use an offer to complete a task previously
          missing a condition, and explain how the assistance was used. This makes an increase
          accountable and helps others decide whether the support can continue.
    - position: 3
      original: 六三：益之用凶事，无咎。有孚中行，告公用圭。
      image: 益用凶事，固有之也。
      meaning:
