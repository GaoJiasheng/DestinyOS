    en:
      'You can enjoy momentum while checking whether the groundwork supports it. Thunder rising from
      earth evokes energy that a group can feel. Enthusiasm is useful when a plan gives it
      direction, but celebrating too early can make practical obstacles harder to acknowledge. For
      example, translate excitement about an event into named tasks. Thunder emerging above earth
