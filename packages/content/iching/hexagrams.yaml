          Offer useful care without turning every gesture into a request for praise. Wind above thunder
          presents an increase that can assist movement. Added support matters through the
          improvement it enables, not only through the amount received. Use an offer to complete a
          task previously missing a condition, and explain how the assistance was used. This makes
          an increase accountable and helps others decide whether the support can continue.
    - position: 6
