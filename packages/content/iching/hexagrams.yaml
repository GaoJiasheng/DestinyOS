      image: 夬履贞厉，位正当也。
      meaning:
        zh: 有权决定也需要保留审慎。天在泽上，履以踏在敏感边界的意象提醒你注意分寸。谨慎不是退缩，可以确认程序、权限与对方需要，再以朴素清楚的方式前进。
