  judgment: 有孚，窒惕，中吉，终凶。
  tuan: 讼，上刚下险，险而健讼。讼有孚窒，惕中吉，刚来而得中也。终凶；讼不可成也。利见大人；尚中正也。不利涉大川；入于渊也。
  image: 天与水违行，讼；君子以作事谋始。
  yao:
    - position: 1
      original: 初六：不永所事，小有言，终吉。
      image: 不永所事，讼不可长也。虽有小言，其辩明也。
      meaning:
        zh: 分歧刚起时不宜拖成长久争执。天与水的走势不同，讼强调争执中看清代价与停下的时机。中途回到可履行的约定比追求争赢更稳，必要时找公允的第三方协助沟通。
        en:
          Resolve a small complaint without making it the center of an extended contest. Heaven and water
          move in different ways, providing an image of diverging aims. The practical concern is how
          a disagreement escalates and where it can be stopped. Return to an agreement the
          participants can fulfil, and seek fair mediation where useful, rather than making victory
          the only acceptable ending.
    - position: 2
      original: 九二：不克讼，归而逋，其邑人三百户，无眚。
      image: 不克讼，归而逋也。自下讼上，患至掇也。
      meaning:
        zh: 胜算不足时退出，减少连带影响。天与水的走势不同，讼强调争执中看清代价与停下的时机。中途回到可履行的约定比追求争赢更稳，必要时找公允的第三方协助沟通。
        en:
          Withdraw from an unproductive dispute and protect those drawn into it. Heaven and water move in
          different ways, providing an image of diverging aims. The practical concern is how a
          disagreement escalates and where it can be stopped. Return to an agreement the
          participants can fulfil, and seek fair mediation where useful, rather than making victory
          the only acceptable ending.
    - position: 3
      original: 六三：食旧德，贞厉终吉。或从王事，无成。
      image: 食旧德，从上吉也。
      meaning:
        zh: 依靠已有信誉，不强求额外功劳。天与水的走势不同，讼强调争执中看清代价与停下的时机。中途回到可履行的约定比追求争赢更稳，必要时找公允的第三方协助沟通。
        en:
          Keep to established responsibilities rather than using a dispute to claim distinction. Heaven
          and water move in different ways, providing an image of diverging aims. The practical
          concern is how a disagreement escalates and where it can be stopped. Return to an
          agreement the participants can fulfil, and seek fair mediation where useful, rather than
          making victory the only acceptable ending.
    - position: 4
      original: 九四：不克讼，复即命，渝安贞，吉。
      image: 复即命，渝安贞；不失也。
      meaning:
        zh: 改变争执的方向，回到能安稳履行的约定。天与水的走势不同，讼强调争执中看清代价与停下的时机。中途回到可履行的约定比追求争赢更稳，必要时找公允的第三方协助沟通。
        en:
          Return to an arrangement you can honor instead of pressing an argument. Heaven and water move in
          different ways, providing an image of diverging aims. The practical concern is how a
          disagreement escalates and where it can be stopped. Return to an agreement the
          participants can fulfil, and seek fair mediation where useful, rather than making victory
          the only acceptable ending.
    - position: 5
      original: 九五：讼，元吉。
      image: 讼元吉，以中正也。
      meaning:
        zh: 由公允的人处理分歧，更容易恢复秩序。天与水的走势不同，讼强调争执中看清代价与停下的时机。中途回到可履行的约定比追求争赢更稳，必要时找公允的第三方协助沟通。
