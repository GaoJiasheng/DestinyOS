      image: 否终则倾，何可长也。
      meaning:
        zh: 封闭的局面松动后，可以逐步恢复交流。天在上、地在下，否强调联系难以相通，宜保护原则与可用资源。与泰相反，眼下不宜把未获回应的事情当成已落实；先找一个能够重新接洽的入口。
