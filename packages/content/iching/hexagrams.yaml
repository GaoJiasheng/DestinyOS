      归妹属于《周易》六十四卦的文本与图像传统，本页沿用文王卦序，卦辞、象辞与各爻解释分层保留。上卦为震（雷），下卦为兑（泽）；这组上下图像构成观察情境的入口，并非现实事件的照片。位置或承诺不对等时，先讨论彼此能选择什么。归妹用古代关系安排的意象讲进入一个已有结构时的位置问题。现代阅读不把任何性别安排为附属角色，也不催促成家；你可以核对承诺、权限与自愿程度，寻找更公平的参与方式。雷在泽上，归妹强调位置与承诺可能不对等，不按古代身份安排现代人的角色。先讨论谁能决定什么、参与是否自愿，避免只靠仪式或热情掩盖实际条件。
      阅读时先看六爻由下向上的结构，再比较整体与具体爻位。古文保留在折叠区，你可以结合白话查读，不必用一个古典词汇概括自己的经历。
    en: 'The Marrying Maiden belongs to the textual and image tradition of the sixty-four I Ching
      figures. This page follows King Wen ordering and keeps the judgment, image, and individual
      line explanations distinct. The upper trigram is Zhen (震, zhèn — Thunder), and the lower is
      Dui (兑, duì — Lake). Their pairing offers a symbolic entry into a situation, not a picture of
      an established event. You can examine an unequal arrangement without accepting that its terms
      are fixed. This historical relationship image concerns entering an arrangement whose roles are
      already defined. A modern reading focuses on consent, unequal access, and negotiable terms,
      rather than prescribing anyone’s relationship status or gender role. For example, clarify your
      say in decisions before joining an established group. Thunder above the lake raises a question
      about unequal position or incomplete terms of participation. Historical relationship roles
      need not be imposed on a modern person. Ask who may decide what and whether each participant
      has freely agreed. A ceremony or an enthusiastic exchange cannot replace clear conditions
      about the responsibilities and choices people actually have. Two positions illustrate the
      distinction. At the second line: Keep a reliable standard when access to the whole situation
      is limited. At the fifth line: Value respectful contact above the appearance of a prestigious
      arrangement. Start with the bottom-to-top line structure, then compare the whole figure with
      an individual position. The classical text remains expandable for study alongside the
      plain-language explanation.'
