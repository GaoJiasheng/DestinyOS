    - 0
  judgment: 元，亨，利，贞。
  tuan: 临，刚浸而长。说而顺，刚中而应，大亨以正，天之道也。至于八月有凶，消不久也。
  image: 泽上有地，临；君子以教思无穷，容保民无疆。
  yao:
    - position: 1
      original: 初九：咸临，贞吉。
      image: 咸临贞吉，志行正也。
      meaning:
        zh: 以共同感受为入口，靠近时保持诚恳。地在泽上，临强调靠近与照顾，也提醒你顺利阶段有边界。主动到场了解比远处指挥更有帮助；先听参与者的需要，再约定后续如何保持回应。
        en:
          Begin guidance through a concern both people can genuinely recognize. Earth above the lake
          suggests approaching and attending to a situation. Closeness becomes useful through
          understanding, not merely supervision. A favourable opening also has limits and needs
          maintenance. Visit the actual task, listen to the people carrying it and agree how you
          will remain available after the first approach.
    - position: 2
