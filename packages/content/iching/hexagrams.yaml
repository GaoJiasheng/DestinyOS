    en: 'Increase belongs to the textual and image tradition of the sixty-four I Ching figures. This
      page follows King Wen ordering and keeps the judgment, image, and individual line explanations
      distinct. The upper trigram is Xun (巽, xùn — Wind), and the lower is Zhen (震, zhèn — Thunder).
      Their pairing offers a symbolic entry into a situation, not a picture of an established event.
      You can turn added support into progress that also benefits the people around you. Wind and
      thunder reinforce movement in this picture. An increase becomes meaningful through useful
      action and fair circulation, especially when extra support removes a constraint that
      previously stopped progress. For example, use additional help to clear a persistent
      bottleneck. Wind above thunder presents an increase that can assist movement. Added support
      matters through the improvement it enables, not only through the amount received. Use an offer
      to complete a task previously missing a condition, and explain how the assistance was used.
      This makes an increase accountable and helps others decide whether the support can continue.
      Two positions illustrate the distinction. At the second line: Let unexpected assistance deepen
      a reliable long-term practice. At the fifth line: Offer useful care without turning every
      gesture into a request for praise. Start with the bottom-to-top line structure, then compare
      the whole figure with an individual position. The classical text remains expandable for study
      alongside the plain-language explanation.'
