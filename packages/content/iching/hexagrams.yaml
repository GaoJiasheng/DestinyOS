- number: 13
  key: hexagram_13
  name: 同人
  pinyin: tong ren
  englishName: Fellowship with Men
  upper: qian
  lower: li
  lines:
    - 1
    - 0
    - 1
    - 1
    - 1
    - 1
  judgment: 于野，亨。利涉大川，利君子贞。
  tuan: 同人，柔得位得中，而应乎乾，曰同人。同人曰，同人于野，亨。利涉大川，乾行也。文明以健，中正而应，君子正也。唯君子为能通天下之志。
  image: 天与火，同人；君子以类族辨物。
  yao:
    - position: 1
      original: 初九：同人于门，无咎。
      image: 出门同人，又谁咎也。
      meaning:
        zh: 从开放的入口开始联结。火在天下，同人强调公共目标与开放联结，不只是在熟人之间互相认同。把目的讲清楚，也让不同背景的人知道如何参与，可以减少小圈子的排他与猜疑。
        en:
          Make a shared purpose visible at a place others can enter. Fire beneath heaven emphasizes a
          purpose that can be recognized across personal circles. Shared understanding is different
          from loyalty only to familiar people. State the task in terms newcomers can use, and make
          participation accessible. This helps a group build common ground without requiring
          everyone to share the same background or preferences.
    - position: 2
      original: 六二：同人于宗，吝！
      image: 同人于宗，吝道也。
      meaning:
        zh: 只在小圈子内结盟，容易限制合作。火在天下，同人强调公共目标与开放联结，不只是在熟人之间互相认同。把目的讲清楚，也让不同背景的人知道如何参与，可以减少小圈子的排他与猜疑。
        en:
          Notice how loyalty to an inner circle is narrowing a wider opportunity. Fire beneath heaven
          emphasizes a purpose that can be recognized across personal circles. Shared understanding
          is different from loyalty only to familiar people. State the task in terms newcomers can
          use, and make participation accessible. This helps a group build common ground without
          requiring everyone to share the same background or preferences.
    - position: 3
      original: 九三：伏戎于莽，升其高陵，三岁不兴。
      image: 伏戎于莽，敌刚也。三岁不兴，安行也。
      meaning:
        zh: 猜疑让行动停住，宜放下暗中对抗。火在天下，同人强调公共目标与开放联结，不只是在熟人之间互相认同。把目的讲清楚，也让不同背景的人知道如何参与，可以减少小圈子的排他与猜疑。
        en:
          Replace defensive watching with a direct attempt to establish what is shared. Fire beneath
          heaven emphasizes a purpose that can be recognized across personal circles. Shared
          understanding is different from loyalty only to familiar people. State the task in terms
          newcomers can use, and make participation accessible. This helps a group build common
          ground without requiring everyone to share the same background or preferences.
    - position: 4
      original: 九四：乘其墉，弗克攻，吉。
      image: '乘其墉，义弗克也，其吉，则困而反则也。  '
      meaning:
        zh: 到达对抗边缘时，可以选择不继续升级。火在天下，同人强调公共目标与开放联结，不只是在熟人之间互相认同。把目的讲清楚，也让不同背景的人知道如何参与，可以减少小圈子的排他与猜疑。
        en:
          Choose restraint at the point where a disagreement could become confrontation. Fire beneath
          heaven emphasizes a purpose that can be recognized across personal circles. Shared
          understanding is different from loyalty only to familiar people. State the task in terms
          newcomers can use, and make participation accessible. This helps a group build common
          ground without requiring everyone to share the same background or preferences.
    - position: 5
      original: 九五：同人，先号咷而后笑，大师克相遇。
      image: 同人之先，以中直也。大师相遇，言相克也。
      meaning:
        zh: 经历隔阂后重新相遇，需要真实沟通。火在天下，同人强调公共目标与开放联结，不只是在熟人之间互相认同。把目的讲清楚，也让不同背景的人知道如何参与，可以减少小圈子的排他与猜疑。
        en:
          Let a difficult reunion create space for an honest conversation. Fire beneath heaven emphasizes
          a purpose that can be recognized across personal circles. Shared understanding is
          different from loyalty only to familiar people. State the task in terms newcomers can use,
          and make participation accessible. This helps a group build common ground without
          requiring everyone to share the same background or preferences.
    - position: 6
      original: 上九：同人于郊，无悔。
      image: 同人于郊，志未得也。
      meaning:
        zh: 保持较宽的距离，也能维持善意联系。火在天下，同人强调公共目标与开放联结，不只是在熟人之间互相认同。把目的讲清楚，也让不同背景的人知道如何参与，可以减少小圈子的排他与猜疑。
        en:
          Accept a looser connection when close cooperation is not yet possible. Fire beneath heaven
          emphasizes a purpose that can be recognized across personal circles. Shared understanding
          is different from loyalty only to familiar people. State the task in terms newcomers can
          use, and make participation accessible. This helps a group build common ground without
          requiring everyone to share the same background or preferences.
