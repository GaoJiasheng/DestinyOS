  meaning:
    zh: 小小的回转值得珍惜，不必立刻恢复全部速度。复以地中有雷讲生机重新出现，但初起的力量仍然细小。你可以回到曾经有效的基本习惯，给调整留出缓冲，而不是把一次好转理解成已经准备好承担所有任务。雷在地中，复以微小阳气回转的意象强调重新开始需要养护。回到合适做法后不必立即补回所有进度，可以守住一个稳定动作，让改变有持续的条件。
    en:
      'You can treat a return of energy as a beginning that needs room to grow. Thunder within earth
      suggests movement returning before it is obvious outside. A renewed possibility benefits from
      protection and repetition, especially when you are rebuilding a routine after interruption.
      For example, resume a paused practice at a size you can repeat. Thunder within earth suggests
      a movement returning before it is fully visible. A small correction deserves protection rather
      than an immediate demand for full speed. Resume one practice that can be sustained and notice
      what helps it continue. This differs from a dramatic restart: the value lies in maintaining
      the first useful turn back toward a workable path. Two positions illustrate the distinction.
      At the second line: Make room for a calm return supported by a dependable companion. At the
      fifth line: Commit plainly to renewal without making a show of it.'
