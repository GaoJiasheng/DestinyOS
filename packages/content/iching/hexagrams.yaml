        zh: ''
        en: ''
    - position: 2
      original: 九二：包蒙吉，纳妇吉，子克家。
      image: 子克家，刚柔接也。
      meaning:
        zh: ''
        en: ''
    - position: 3
      original: 六三：勿用，取女见金夫，不有躬，无攸利。
      image: 勿用娶女，行不顺也。
      meaning:
        zh: ''
        en: ''
    - position: 4
      original: 六四：困蒙，吝。
      image: 困蒙之吝，独远实也。
      meaning:
        zh: ''
        en: ''
    - position: 5
      original: 六五：童蒙，吉。
      image: 童蒙之吉，顺以巽也。
      meaning:
        zh: ''
        en: ''
    - position: 6
      original: 上九：击蒙，不利为寇，利御寇。
      image: 利用御寇，上下顺也。
