      whole project to move at once. Two positions illustrate the distinction. At the second line:
      Do not treat a hesitant approach as hostility; allow trust to develop. At the fifth line: Use
      limited resources for a modest task before promising broad support. The final line adds
      another limit to consider: Acknowledge the strain of repeated stalled attempts and find
      practical help. Start with the bottom-to-top line structure, then compare the whole figure
      with an individual position. The classical text remains expandable for study alongside the
      plain-language explanation.'
