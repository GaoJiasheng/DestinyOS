  historySymbolism:
    zh:
      益属于《周易》六十四卦的文本与图像传统，本页沿用文王卦序，卦辞、象辞与各爻解释分层保留。上卦为巽（风），下卦为震（雷）；这组上下图像构成观察情境的入口，并非现实事件的照片。得到支持时，把增加的空间用在实际改进上。益以风雷相助讲力量相互推动，支持的价值在于让实际困难更容易解决。你可以把新增资源用于试验与改进，也要让帮助形成回馈，避免只扩大期待而没有相应行动。风在雷上，益强调增加的支持应转成实际改善，而不只停在数量。接受协助后完成一项原先缺少条件的任务，也及时说明帮助怎样被使用，让增益能持续。
