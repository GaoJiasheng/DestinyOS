      the mountain illuminates a form without replacing its substance. Presentation can help people
      recognize what is being offered, but ornament cannot make an unusable arrangement sound. Check
      accuracy or function before refining appearance. A simple presentation may fit the occasion
      better than adding detail that obscures the central purpose. Two positions illustrate the
      distinction. At the second line: Let a small embellishment follow the substance it belongs to.
      At the fifth line: Choose an appropriate modest gesture rather than a costly display. The
      final line adds another limit to consider: Let an unadorned presentation reveal what is
      already sound. Start with the bottom-to-top line structure, then compare the whole figure with
      an individual position. The classical text remains expandable for study alongside the
      plain-language explanation.'
- number: 23
