        zh: 谦和地准备，仍可以承担重要跨越。山藏于地中，谦以有实力而不高举自己的意象强调分寸。谦和不是缩小贡献，可以用事实说明完成了什么，同时把协作者的作用留在叙述中。
        en:
          Carry a demanding task with modest preparation rather than loud confidence. The mountain within
          earth suggests real substance expressed without occupying the highest visible place.
