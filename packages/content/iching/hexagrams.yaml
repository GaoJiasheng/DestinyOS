        'For a current everyday concern, consider this emphasis: maintain the means of access, and name
        one situation you can actually describe.'
  historySymbolism:
    zh:
      井属于《周易》六十四卦的文本与图像传统，本页沿用文王卦序，卦辞、象辞与各爻解释分层保留。上卦为坎（水），下卦为巽（风）；这组上下图像构成观察情境的入口，并非现实事件的照片。稳定的资源也需要维护与方便使用的入口。井以木上汲水讲长期供给，井不因人来人往而失去作用，但工具与维护会影响能否取到水。你可以照顾基础设施、共享知识与使用方式，让已有资源真正服务于需要它的人。水在木上，井强调稳定来源需要取用工具与维护，资源存在不等于人能用到。先检查入口、传递与责任，修好一个漏损或交接环节，让共同支持真正可达。
      阅读时先看六爻由下向上的结构，再比较整体与具体爻位。古文保留在折叠区，你可以结合白话查读，不必用一个古典词汇概括自己的经历。
    en: 'The Well belongs to the textual and image tradition of the sixty-four I Ching figures. This
      page follows King Wen ordering and keeps the judgment, image, and individual line explanations
      distinct. The upper trigram is Kan (坎, kǎn — Water), and the lower is Xun (巽, xùn — Wind).
      Their pairing offers a symbolic entry into a situation, not a picture of an established event.
      You can improve a shared resource by caring for access as well as quality. Wood drawing water
      offers a picture of a durable source. A resource can exist and still be unusable, making
      upkeep, tools, and fair access as important as the quality of what is available. For example,
      make a shared guide easier to find and keep current. Water above wood gives the image of a
      well whose usefulness depends on access and maintenance. A resource can exist without reaching
      the person who needs it. Inspect the tool, the entry point and the responsibility for upkeep.
      Repair a leak or handover problem so that a stable source becomes usable rather than merely
      recognized as present. Two positions illustrate the distinction. At the second line: Repair
      the means of access when the source is being wasted. At the fifth line: Keep a good source
      dependable through routine care. Start with the bottom-to-top line structure, then compare the
      whole figure with an individual position. The classical text remains expandable for study
      alongside the plain-language explanation.'
