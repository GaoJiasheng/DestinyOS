      image: 大人之吉，位正当也。
      meaning:
        zh: 阻隔正在缓解，仍要把基础系稳。天在上、地在下，否强调联系难以相通，宜保护原则与可用资源。与泰相反，眼下不宜把未获回应的事情当成已落实；先找一个能够重新接洽的入口。
