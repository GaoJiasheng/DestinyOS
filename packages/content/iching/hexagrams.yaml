    en:
      'You may need a workable foundation before an ambitious beginning can take shape. A beginning
      can contain real energy and real confusion at once. Thunder beneath water suggests that motion
      exists, while the route and support around it are still unsettled. For example, give a new
      group one manageable assignment before expanding. Thunder beneath water places an impulse to
      begin under difficult conditions. The issue is organizing an early undertaking, rather than
      proving courage through solitary effort. Find people who can share the preparation and
      establish the working arrangement before asking the whole project to move at once. Two
      positions illustrate the distinction. At the second line: Do not treat a hesitant approach as
      hostility; allow trust to develop. At the fifth line: Use limited resources for a modest task
      before promising broad support. The final line adds another limit to consider: Acknowledge the
      strain of repeated stalled attempts and find practical help.'
