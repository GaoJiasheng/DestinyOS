      阅读时先看六爻由下向上的结构，再比较整体与具体爻位。古文保留在折叠区，你可以结合白话查读，不必用一个古典词汇概括自己的经历。
    en:
      'Following belongs to the textual and image tradition of the sixty-four I Ching figures. This
      page follows King Wen ordering and keeps the judgment, image, and individual line explanations
      distinct. The upper trigram is Dui (兑, duì — Lake), and the lower is Zhen (震, zhèn — Thunder).
      Their pairing offers a symbolic entry into a situation, not a picture of an established event.
      You can adapt to others without handing over responsibility for your choices. Movement under
      an inviting lake suggests a responsive relationship. Following can be intelligent when you
      understand the direction, but comfort alone is a weak reason to abandon standards you
      previously chose. For example, try a proposed routine before making it your default. Thunder
      within the lake suggests movement responding to a wider situation. Following differs from
      accepting every influence unexamined. Identify the purpose you recognize before deciding how
      to adapt. A change of direction may alter a previous association, so explain the choice and
      the limits of your participation rather than relying on silent compliance. Two positions
      illustrate the distinction. At the second line: Notice what a convenient attachment is costing
      your larger purpose. At the fifth line: Direct your loyalty toward a purpose you can respect.
      The final line adds another limit to consider: Review the meaning of a binding commitment
      before accepting it. Start with the bottom-to-top line structure, then compare the whole
      figure with an individual position. The classical text remains expandable for study alongside
      the plain-language explanation.'
- number: 18
