      阅读时先看六爻由下向上的结构，再比较整体与具体爻位。古文保留在折叠区，你可以结合白话查读，不必用一个古典词汇概括自己的经历。
    en:
      'The Joyous belongs to the textual and image tradition of the sixty-four I Ching figures. This
      page follows King Wen ordering and keeps the judgment, image, and individual line explanations
      distinct. The upper trigram is Dui (兑, duì — Lake), and the lower is Dui (兑, duì — Lake).
      Their pairing offers a symbolic entry into a situation, not a picture of an established event.
      You can enjoy a conversation while noticing whether it rests on honest exchange. Lakes joined
      suggest mutual refreshment through exchange. Enjoyment supports contact, but conversation
      remains sound when people can disagree, decline, and speak accurately without losing respect.
      For example, decline a request warmly when you cannot reasonably take it on. Repeated lake
      emphasizes pleasure in exchange that rests on sincerity. Maintaining a pleasant atmosphere is
      different from satisfying every request. Listen to the need being expressed and clarify what
      you are willing to offer. An honest boundary can preserve the quality of a conversation better
      than agreement given only to avoid a moment of disappointment. Two positions illustrate the
      distinction. At the second line: Ground an enjoyable connection in something you can honestly
      stand behind. At the fifth line: Review a trusted influence whose behavior is wearing away
      your support. Start with the bottom-to-top line structure, then compare the whole figure with
      an individual position. The classical text remains expandable for study alongside the
      plain-language explanation.'
