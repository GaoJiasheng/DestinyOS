        people, and name one situation you can actually describe.'
  historySymbolism:
    zh:
      泰属于《周易》六十四卦的文本与图像传统，本页沿用文王卦序，卦辞、象辞与各爻解释分层保留。上卦为坤（地），下卦为乾（天）；这组上下图像构成观察情境的入口，并非现实事件的照片。沟通顺畅时，适合建立能长久维持的合作。泰讲天地之气相交，象征上下之间有机会交换需要与资源。顺畅的阶段也会变化，因此越容易推进，越值得把经验变成规则，不把眼前配合当成永远不用维护的默契。地在上、天在下，泰强调上下之气能够相交的通畅。顺畅不是永久状态，宜在能沟通时建立明确分工与维护方式，把合作落成可重复的日常。
      阅读时先看六爻由下向上的结构，再比较整体与具体爻位。古文保留在折叠区，你可以结合白话查读，不必用一个古典词汇概括自己的经历。
    en:
      'Peace belongs to the textual and image tradition of the sixty-four I Ching figures. This page
      follows King Wen ordering and keeps the judgment, image, and individual line explanations
      distinct. The upper trigram is Kun (坤, kūn — Earth), and the lower is Qian (乾, qián — Heaven).
      Their pairing offers a symbolic entry into a situation, not a picture of an established event.
      You can use a period of openness to put dependable arrangements in place. Earth above heaven
      depicts movement toward one another rather than separation. A cooperative interval is a chance
      to connect roles and resources, while remembering that easy access still needs regular
      maintenance. For example, document a handover that currently works well. Earth above heaven
      represents an exchange between complementary movements. The point is circulation and access,
      rather than an everlasting favourable condition. Use a period of communication to establish
      clear responsibilities and ways to maintain contact. A workable routine helps the relationship
      remain usable when the initial ease is no longer new. Two positions illustrate the
      distinction. At the second line: Include people with differing strengths and hold a balanced
      common direction. At the fifth line: Use a privileged position to create a respectful
      alliance. The final line adds another limit to consider: Scale back when the structure that
      supported progress begins to loosen. Start with the bottom-to-top line structure, then compare
      the whole figure with an individual position. The classical text remains expandable for study
      alongside the plain-language explanation.'
