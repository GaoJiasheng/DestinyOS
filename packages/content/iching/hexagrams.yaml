      阅读时先看六爻由下向上的结构，再比较整体与具体爻位。古文保留在折叠区，你可以结合白话查读，不必用一个古典词汇概括自己的经历。
    en:
      'Limitation belongs to the textual and image tradition of the sixty-four I Ching figures. This
      page follows King Wen ordering and keeps the judgment, image, and individual line explanations
      distinct. The upper trigram is Kan (坎, kǎn — Water), and the lower is Dui (兑, duì — Lake).
      Their pairing offers a symbolic entry into a situation, not a picture of an established event.
      You can set a workable limit that protects capacity without turning daily life rigid. Water
      above a lake highlights capacity and containment. Limits help when they are understandable and
      adjustable; excessive restriction can make the arrangement as difficult to maintain as no
      boundary at all. For example, set a meeting limit and a way to handle unfinished issues. Water
      above the lake gives an image of capacity with a boundary. A limit should protect use without
      making participation needlessly harsh. Distinguish basic needs from commitments that can be
      adjusted, and explain why the rule exists. If the restriction consumes more effort than it
      saves, revise it rather than treating endurance of discomfort as proof that the rule is sound.
      Two positions illustrate the distinction. At the second line: Recognize when an old
      restriction is now preventing a useful step. At the fifth line: Make a limit fair and
      comprehensible to the people living with it. Start with the bottom-to-top line structure, then
      compare the whole figure with an individual position. The classical text remains expandable
      for study alongside the plain-language explanation.'
