          frames a change in an arrangement whose parts no longer fit. Trust develops through a
          clear reason and actions people can assess. Check the timing, the participants and the
          means of carrying the change forward. Announcing a transformation is different from
          establishing its replacement, so prepare the handover as carefully as the proposal.
