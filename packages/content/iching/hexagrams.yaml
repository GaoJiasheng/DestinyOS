- number: 7
  key: hexagram_07
  name: 师
  pinyin: shi
  englishName: The Army
  upper: kun
  lower: kan
  lines:
    - 0
    - 1
    - 0
    - 0
    - 0
    - 0
  judgment: 贞，丈人吉，无咎。
  tuan: 师，众也，贞正也，能以众正，可以王矣。刚中而应，行险而顺，以此毒天下，而民从之，吉又何咎矣。
  image: 地中有水，师；君子以容民畜众。
  yao:
    - position: 1
      original: 初六：师出以律，否臧凶。
      image: 师出以律，失律凶也。
      meaning:
        zh: 集体行动先确认共同规则。水藏于地中，师强调集体力量需要纪律与有经验的统筹。人数多不等于已经协调好，先确认共同规则、职责与交接，让行动不因多人争令而失去方向。
        en:
          Begin a coordinated effort with an understood method and accountable conduct. Water held within
          earth presents collective capacity that needs organization. Having many participants does
          not establish a coordinated effort. The reading asks about a capable organizer, shared
          rules and clear instructions. Agree on responsibilities and handover so that competing
          directions do not consume the group’s available energy.
    - position: 2
      original: 九二：在师中吉，无咎，王三锡命。
      image: 在师中吉，承天宠也。王三锡命，怀万邦也。
      meaning:
        zh: 负责人身在现场，更容易得到信任。水藏于地中，师强调集体力量需要纪律与有经验的统筹。人数多不等于已经协调好，先确认共同规则、职责与交接，让行动不因多人争令而失去方向。
        en:
          Lead from within the work and stay answerable to the people involved. Water held within earth
          presents collective capacity that needs organization. Having many participants does not
          establish a coordinated effort. The reading asks about a capable organizer, shared rules
          and clear instructions. Agree on responsibilities and handover so that competing
          directions do not consume the group’s available energy.
    - position: 3
      original: 六三：师或舆尸，凶。
      image: 师或舆尸，大无功也。
      meaning:
        zh: 指挥失当会让共同任务付出沉重代价。水藏于地中，师强调集体力量需要纪律与有经验的统筹。人数多不等于已经协调好，先确认共同规则、职责与交接，让行动不因多人争令而失去方向。
        en:
          Stop and reassess when poor coordination is putting the group under strain. Water held within
          earth presents collective capacity that needs organization. Having many participants does
          not establish a coordinated effort. The reading asks about a capable organizer, shared
          rules and clear instructions. Agree on responsibilities and handover so that competing
          directions do not consume the group’s available energy.
    - position: 4
      original: 六四：师左次，无咎。
      image: 左次无咎，未失常也。
      meaning:
        zh: 调整位置与暂时后撤可以保留力量。水藏于地中，师强调集体力量需要纪律与有经验的统筹。人数多不等于已经协调好，先确认共同规则、职责与交接，让行动不因多人争令而失去方向。
        en:
          Use a planned retreat to conserve capacity and reorganize the effort. Water held within earth
          presents collective capacity that needs organization. Having many participants does not
          establish a coordinated effort. The reading asks about a capable organizer, shared rules
          and clear instructions. Agree on responsibilities and handover so that competing
          directions do not consume the group’s available energy.
    - position: 5
      original: 六五：田有禽，利执言，无咎。长子帅师，弟子舆尸，贞凶。
