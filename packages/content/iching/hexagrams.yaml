  historySymbolism:
    zh:
      贲属于《周易》六十四卦的文本与图像传统，本页沿用文王卦序，卦辞、象辞与各爻解释分层保留。上卦为艮（山），下卦为离（火）；这组上下图像构成观察情境的入口，并非现实事件的照片。表达可以更美，但内容仍需经得起使用。贲以山下有火讲光照在外形上，让事物更容易被理解。修饰能够帮助沟通，却不能替代实际内容；你可以让形式配合用途，而不是为了好看增加不必要的复杂度。山下有火，贲强调表达与形式能够照亮内容，但修饰不能代替实质。先确认信息是否正确、物件是否好用，再改善呈现，朴素也可以合乎场合。
