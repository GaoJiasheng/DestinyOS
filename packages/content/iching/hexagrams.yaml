      'You can cooperate across differences by making the shared purpose larger than personal loyalty.
      Light beneath an open sky suggests a purpose others can see. Fellowship grows when access is
      fair and goals are explicit, rather than when people must belong to the same background or
      agree about everything. For example, invite another group to help define one shared outcome.
