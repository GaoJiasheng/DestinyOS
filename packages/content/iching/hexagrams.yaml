      original: 初九：素履往，无咎。
      image: 素履之往，独行愿也。
      meaning:
        zh: 以朴素的方式前进，不急着包装自己。天在泽上，履以踏在敏感边界的意象提醒你注意分寸。谨慎不是退缩，可以确认程序、权限与对方需要，再以朴素清楚的方式前进。
        en:
          Take an uncomplicated step that does not pretend to more than you know. Heaven above the lake
          presents a crossing of sensitive boundaries. Careful conduct concerns the way you proceed,
          not a requirement to retreat from every encounter. Check the procedure, your authority to
          act and the other person’s needs. A plain, well-prepared approach can preserve dignity
          without relying on display or force.
