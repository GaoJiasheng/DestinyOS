    en:
      'Preponderance of the Small belongs to the textual and image tradition of the sixty-four I Ching
      figures. This page follows King Wen ordering and keeps the judgment, image, and individual
      line explanations distinct. The upper trigram is Zhen (震, zhèn — Thunder), and the lower is
      Gen (艮, gèn — Mountain). Their pairing offers a symbolic entry into a situation, not a picture
      of an established event. You can use extra care on a small task while keeping larger moves
      within your capacity. Thunder over mountain calls attention to movements near a boundary. A
      little extra care can be useful, while a much larger leap may outrun the available support;
      scale is central to the reading. For example, double-check a small but important handover
      detail. Thunder above the mountain frames a limited excess in small matters while larger
      movement remains constrained. The bird image directs attention toward a reachable position
      rather than a high leap. Check a detail that affects the present task and complete what is
      accessible. Care should remain proportionate, so that extra attention does not turn into an
      endless series of checks. Two positions illustrate the distinction. At the second line: Work
      with an accessible counterpart rather than forcing the most elevated contact. At the fifth
      line: Use a limited available opening while broader conditions remain unready. Start with the
      bottom-to-top line structure, then compare the whole figure with an individual position. The
      classical text remains expandable for study alongside the plain-language explanation.'
