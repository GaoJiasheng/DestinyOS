  judgment: 利贞，不家食，吉，利涉大川。
  tuan: 大畜，刚健笃实辉光，日新其德，刚上而尚贤。能止健，大正也。不家食吉，养贤也。利涉大川，应乎天也。
  image: 天在山中，大畜；君子以多识前言往行，以畜其德。
  yao:
    - position: 1
      original: 初九：有厉，利己。
      image: 有厉利已，不犯灾也。
      meaning:
        zh: 看见限制时先停止加速。山在天上，大畜以强健之力得到约束的意象强调储备、学习与适时发挥。积累不是永远不用，先核对能力与承载条件，合适时把训练转成一次实际交付。
        en:
          Respect a clear limit before a developing situation takes more strain. The mountain above heaven
          places a strong impulse within a containing structure. The emphasis is on developing
          capacity and learning when to use it. Restraint is different from keeping a skill unused
          indefinitely. Check readiness and the means of support, then turn the reserve into a
          delivery that tests what the preparation has made possible.
    - position: 2
      original: 九二：舆说輹。
      image: 舆说輹，中无尤也。
      meaning:
        zh: 承载暂时受限，可以暂停整修。山在天上，大畜以强健之力得到约束的意象强调储备、学习与适时发挥。积累不是永远不用，先核对能力与承载条件，合适时把训练转成一次实际交付。
        en:
          Pause the vehicle and attend to what allows movement. The mountain above heaven places a strong
          impulse within a containing structure. The emphasis is on developing capacity and learning
          when to use it. Restraint is different from keeping a skill unused indefinitely. Check
          readiness and the means of support, then turn the reserve into a delivery that tests what
