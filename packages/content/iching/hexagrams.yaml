  judgment: 元、亨、利牝马之贞。
  tuan: 至哉坤元，万物资生，乃顺承天。坤厚载物，德合无疆。含弘光大，品物咸亨。牝马地类，行地无疆，柔顺利贞。君子攸行，先迷失道，后顺得常。西南得朋，乃与类行；东北丧朋，乃终有庆。安贞之吉，应地无疆。
  image: 地势坤，君子以厚德载物。
  yao:
    - position: 1
      original: 初六：履霜，坚冰至。
      image: 履霜坚冰，阴始凝也。驯致其道，至坚冰也。
      meaning:
        zh: 细小迹象提示条件正在改变，你可以先核对条件。这里着眼于刚起步的安排，先看脚下是否有可靠支点。建议按实际反馈决定下一步。
        en:
          Pay attention to an early sign before it grows into a larger difficulty. At the first stage,
          preparation matters more than a visible result. Look for a reliable foothold before adding
          scope. You can apply this to one current task, then notice whether the response creates a
          more workable arrangement. Let practical feedback guide your next choice rather than
          treating the image as an instruction to follow without question.
    - position: 2
      original: 六二：直方大，不习，无不利。
      image: 六二之动，直以方也。不习无不利，地道光也。
      meaning:
        zh: 坦直而稳妥的做法可以自然发挥，你可以先核对条件。这一位置重视能够相互回应的支持，留意谁愿意配合。建议按实际反馈决定下一步。
        en:
          Let clear conduct and dependable boundaries do the work without elaborate performance. This
          stage asks how support works in practice. Notice which connections offer a usable response
          and which remain only a hope. You can apply this to one current task, then notice whether
          the response creates a more workable arrangement. Let practical feedback guide your next
          choice rather than treating the image as an instruction to follow without question.
    - position: 3
      original: 六三：含章可贞，或从王事，无成有终。
      image: 含章可贞；以时发也。或从王事，知光大也
      meaning:
        zh: 贡献可以含蓄表达，不必争先署名，你可以先核对条件。你正接近阶段转换，宜核对行动与实际条件是否相称。建议按实际反馈决定下一步。
        en: Support a shared effort while letting the result matter more than personal display. At a
          transition, momentum can outrun the arrangement supporting it. Review what has changed
          before repeating an earlier approach. You can apply this to one current task, then notice
          whether the response creates a more workable arrangement. Let practical feedback guide
          your next choice rather than treating the image as an instruction to follow without
          question.
    - position: 4
      original: 六四：括囊，无咎，无誉。
      image: 括囊无咎，慎不害也。
      meaning:
        zh: 信息不足时先谨慎收口，你可以先核对条件。来到新的接洽位置，沟通方式与承接能力都值得检查。建议按实际反馈决定下一步。
        en:
          Keep a sensitive matter contained until you understand what disclosure would change. A new point
          of contact makes coordination important. Check both how a request is received and who can
          carry the next step. You can apply this to one current task, then notice whether the
          response creates a more workable arrangement. Let practical feedback guide your next
          choice rather than treating the image as an instruction to follow without question.
    - position: 5
      original: 六五：黄裳，元吉。
      image: 黄裳元吉，文在中也。
      meaning:
        zh: 在合适的位置以温和方式承担责任，你可以先核对条件。这里关注能影响整体的责任，考虑做法对他人的作用。建议按实际反馈决定下一步。
        en: Exercise responsibility without needing the most conspicuous place in the arrangement. A
          position with wider influence asks you to consider other people. Responsibility includes
          how your choices shape their room to act. You can apply this to one current task, then
          notice whether the response creates a more workable arrangement. Let practical feedback
          guide your next choice rather than treating the image as an instruction to follow without
          question.
    - position: 6
      original: 上六：龙战于野，其血玄黄。
      image: 战龙于野，其道穷也。
      meaning:
        zh: 各方争相扩张时，先停止互相消耗，你可以先核对条件。这一阶段接近收尾或极限，适合回看尺度并准备调整。建议按实际反馈决定下一步。
        en:
          Interrupt a contest for dominance before it drains the capacity people share. Near the end of a
          phase, useful action often changes. Review the scale of your involvement and what needs to
          be handed onward. You can apply this to one current task, then notice whether the response
          creates a more workable arrangement. Let practical feedback guide your next choice rather
          than treating the image as an instruction to follow without question.
  useNineSix:
    original: 用六：利永贞。
    image: 用六永贞，以大终也。
  meaning:
    zh: 承接现实需要，用可靠的配合建立自己的位置；你可以对照现实来看。坤以大地的承载讲接纳与落实，柔和并不等于没有立场。你可以把别人的构想变成日常可执行的安排，也要看清自己能提供什么，避免把所有责任都揽到身上。例如，共同任务先分工，再约定求助方式，更容易把想法放进实际生活。建议支持别人也保留休息，并根据反馈调整节奏。
    en:
      'You can contribute through steadiness without surrendering your own judgment. Receptivity works
      best when it is active and discerning. Here the earth image points to making plans usable,
      supporting shared work, and knowing what you can reasonably carry. For example, agree on roles
      before volunteering for additional work. The point is to notice how your current arrangement
      supports this kind of response, not to predict an event from the image. Consider a small
      action with an observable result: leave some capacity uncommitted. Give yourself a practical
      review point, such as the next conversation or completed task, so that new information can
      change your approach. You can retain the part that fits your circumstances and set aside what
      does not. Your own experience and the choices available to you remain central to applying this
      reading. A useful question is which current constraint you can actually influence, and what
      would show that your next step has helped.'
  keywords:
    - 承载 / support
    - 配合 / receptivity
    - 边界 / boundaries
  guidance:
    career:
      zh: 在工作协作上，你可以支持别人也保留休息，并先确认职责与交接。
      en: 'For a work task, consider this emphasis: leave some capacity uncommitted, and confirm
        responsibilities and the handover.'
    wealth:
      zh: 在日常预算上，你可以支持别人也保留休息，并先记录收支与可调整开销。
      en:
        'For a household budget, consider this emphasis: leave some capacity uncommitted, and check
        spending records and adjustable costs.'
    love:
      zh: 在关系沟通上，你可以支持别人也保留休息，并尊重双方自愿回应与边界。
      en: 'For a voluntary relationship conversation, consider this emphasis: leave some capacity
        uncommitted, and respect voluntary responses and mutual boundaries.'
    health:
      zh: 在作息安排上，你可以支持别人也保留休息，并观察日常休息与情绪节奏。
      en:
        'For a daily rest routine, consider this emphasis: leave some capacity uncommitted, and observe
        rest and daily emotional rhythm.'
    study:
      zh: 在学习练习上，你可以支持别人也保留休息，并用一次实际练习取得反馈。
      en:
        'For a learning exercise, consider this emphasis: leave some capacity uncommitted, and seek
        feedback from a completed exercise.'
    travel:
      zh: 在行程准备上，你可以支持别人也保留休息，并核对路线、联络与备用安排。
      en:
        'For a journey plan, consider this emphasis: leave some capacity uncommitted, and verify routes,
        contacts, and an alternative.'
    decision:
      zh: 在选择比较上，你可以支持别人也保留休息，并比较限制并保留可撤回的小步骤。
      en: 'For a choice between practical options, consider this emphasis: leave some capacity
        uncommitted, and compare constraints and keep the first step reversible.'
    other:
      zh: 在眼前的小事上，你可以支持别人也保留休息，并先明确一个可描述的情境。
      en:
        'For a current everyday concern, consider this emphasis: leave some capacity uncommitted, and
        name one situation you can actually describe.'
- number: 3
  key: hexagram_03
  name: 屯
  pinyin: zhun
  englishName: Difficulty at the Beginning
  upper: kan
  lower: zhen
  lines:
    - 1
    - 0
    - 0
    - 0
    - 1
    - 0
  judgment: 元、亨、利、贞，勿用有攸往，利建侯。
  tuan: 屯，刚柔始交而难生，动乎险中，大亨贞。雷雨之动满盈，天造草昧，宜建侯而不宁。
  image: 云，雷，屯；君子以经纶。
  yao:
    - position: 1
      original: 初九：盘桓，利居贞，利建侯。
      image: 虽磐桓，志行正也。以贵下贱，大得民也。
      meaning:
        zh: 起步犹豫时，先建立稳定支点，你可以先核对条件。这里着眼于刚起步的安排，先看脚下是否有可靠支点。建议按实际反馈决定下一步。
        en:
          Settle the first foundation and gather support before choosing a wider direction. At the first
          stage, preparation matters more than a visible result. Look for a reliable foothold before
          adding scope. You can apply this to one current task, then notice whether the response
          creates a more workable arrangement. Let practical feedback guide your next choice rather
          than treating the image as an instruction to follow without question.
    - position: 2
      original: 六二：屯如邅如，乘马班如，匪寇，婚媾，女子贞不字，十年乃字。
      image: 六二之难，乘刚也。十年乃字，反常也。
      meaning:
        zh: 曲折的接近未必带着敌意，给回应一些时间，你可以先核对条件。这一位置重视能够相互回应的支持，留意谁愿意配合。建议按实际反馈决定下一步。
        en:
          Do not treat a hesitant approach as hostility; allow trust to develop. This stage asks how
          support works in practice. Notice which connections offer a usable response and which
          remain only a hope. You can apply this to one current task, then notice whether the
          response creates a more workable arrangement. Let practical feedback guide your next
          choice rather than treating the image as an instruction to follow without question.
    - position: 3
      original: 六三：即鹿无虞，惟入于林中，君子几，不如舍，往吝。
      image: 即鹿无虞，以纵禽也。君子舍之，往吝穷也。
      meaning:
        zh: 没有引路与信息时，不宜贸然深入，你可以先核对条件。你正接近阶段转换，宜核对行动与实际条件是否相称。建议按实际反馈决定下一步。
        en:
          Leave an unfamiliar pursuit when guidance and a workable route are missing. At a transition,
          momentum can outrun the arrangement supporting it. Review what has changed before
          repeating an earlier approach. You can apply this to one current task, then notice whether
          the response creates a more workable arrangement. Let practical feedback guide your next
          choice rather than treating the image as an instruction to follow without question.
    - position: 4
      original: 六四：乘马班如，求婚媾，往吉，无不利。
      image: 求而往，明也。
      meaning:
        zh: 迟疑可以通过主动寻求合作来松动，你可以先核对条件。来到新的接洽位置，沟通方式与承接能力都值得检查。建议按实际反馈决定下一步。
        en:
          Make a clear invitation instead of waiting for uncertainty to resolve itself. A new point of
          contact makes coordination important. Check both how a request is received and who can
          carry the next step. You can apply this to one current task, then notice whether the
          response creates a more workable arrangement. Let practical feedback guide your next
          choice rather than treating the image as an instruction to follow without question.
    - position: 5
      original: 九五：屯其膏，小贞吉，大贞凶。
      image: 屯其膏，施未光也。
      meaning:
        zh: 资源难以普遍到位，先照顾小范围需要，你可以先核对条件。这里关注能影响整体的责任，考虑做法对他人的作用。建议按实际反馈决定下一步。
        en:
          Use limited resources for a modest task before promising broad support. A position with wider
          influence asks you to consider other people. Responsibility includes how your choices
          shape their room to act. You can apply this to one current task, then notice whether the
          response creates a more workable arrangement. Let practical feedback guide your next
          choice rather than treating the image as an instruction to follow without question.
    - position: 6
      original: 上六：乘马班如，泣血涟如。
      image: 泣血涟如，何可长也。
      meaning:
        zh: 反复停滞已让人疲惫，宜停下寻求支援，你可以先核对条件。这一阶段接近收尾或极限，适合回看尺度并准备调整。建议按实际反馈决定下一步。
        en:
          Acknowledge the strain of repeated stalled attempts and find practical help. Near the end of a
          phase, useful action often changes. Review the scale of your involvement and what needs to
          be handed onward. You can apply this to one current task, then notice whether the response
          creates a more workable arrangement. Let practical feedback guide your next choice rather
          than treating the image as an instruction to follow without question.
  useNineSix: null
  meaning:
    zh: 起步不顺时，先把资源和伙伴组织起来；你可以对照现实来看。屯讲新生事物尚未成形，雷的推动遇到水的阻碍，容易出现热情先于条件的情况。反复并不说明方向无价值，往往提示规则、资源与协作还需要搭建。例如，新团队先确认职责，不急着同时开多个任务，更容易把想法放进实际生活。建议把难题拆成先后步骤，并根据反馈调整节奏。
    en:
      'You may need a workable foundation before an ambitious beginning can take shape. A beginning
      can contain real energy and real confusion at once. Thunder beneath water suggests that motion
      exists, while the route and support around it are still unsettled. For example, give a new
      group one manageable assignment before expanding. The point is to notice how your current
