      旅属于《周易》六十四卦的文本与图像传统，本页沿用文王卦序，卦辞、象辞与各爻解释分层保留。上卦为离（火），下卦为艮（山）；这组上下图像构成观察情境的入口，并非现实事件的照片。身处陌生环境，先照顾落脚点与交往分寸。旅以山上有火讲短暂停留，火移动而山保持不动，提醒你看清自己在环境中的位置。你可以了解规则、保管必要物品并建立可信联系，不必急着在陌生地方承担超出权限的事情。火在山上，旅强调暂居环境中先照顾落脚与分寸，不把自己当成拥有全部权限的人。核对归属、规则与支持渠道，再决定可承担的参与范围。
      阅读时先看六爻由下向上的结构，再比较整体与具体爻位。古文保留在折叠区，你可以结合白话查读，不必用一个古典词汇概括自己的经历。
    en:
      'The Wanderer belongs to the textual and image tradition of the sixty-four I Ching figures. This
      page follows King Wen ordering and keeps the judgment, image, and individual line explanations
      distinct. The upper trigram is Li (离, lí — Fire), and the lower is Gen (艮, gèn — Mountain).
      Their pairing offers a symbolic entry into a situation, not a picture of an established event.
      You can navigate an unfamiliar setting through practical preparation and respectful limits.
      Fire above mountain suggests a presence that does not settle permanently. In an unfamiliar
      setting, useful independence includes reliable shelter, needed resources, and respect for
      local expectations. For example, check your contact person and return arrangements on arrival.
      Fire above the mountain presents a temporary position in an unfamiliar setting. Secure a place
      to work or rest and understand the local terms before assuming broad authority. Clarify
      ownership, rules and sources of support. A traveller’s useful contribution can be limited and
      respectful, allowing participation without pretending that every part of the environment is
      already familiar. Two positions illustrate the distinction. At the second line: Care for a
      secure base and a dependable local connection. At the fifth line: Make a measured contribution
      that shows competence in an unfamiliar place. Start with the bottom-to-top line structure,
      then compare the whole figure with an individual position. The classical text remains
      expandable for study alongside the plain-language explanation.'
