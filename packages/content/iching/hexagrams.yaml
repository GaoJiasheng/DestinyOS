  historySymbolism:
    zh:
      未济属于《周易》六十四卦的文本与图像传统，本页沿用文王卦序，卦辞、象辞与各爻解释分层保留。上卦为离（火），下卦为坎（水）；这组上下图像构成观察情境的入口，并非现实事件的照片。尚未完成时，重新确认次序与跨越条件。未济以火水未交讲条件尚未形成稳定配合，离终点近也不宜忽略最后的准备。你可以承认仍待完成的部分，调整次序与工具，让每一步都能接上下一步，而不是只靠接近成功的感觉推进。火在水上，未济强调各部分尚未就位，跨越前需要重排次序。小狐将渡未渡的意象提醒你检查最后一步的承载，先把收尾条件落实，再庆祝进展。
      阅读时先看六爻由下向上的结构，再比较整体与具体爻位。古文保留在折叠区，你可以结合白话查读，不必用一个古典词汇概括自己的经历。
    en:
      'Before Completion belongs to the textual and image tradition of the sixty-four I Ching figures.
      This page follows King Wen ordering and keeps the judgment, image, and individual line
      explanations distinct. The upper trigram is Li (离, lí — Fire), and the lower is Kan (坎, kǎn —
      Water). Their pairing offers a symbolic entry into a situation, not a picture of an
      established event. You can continue an unfinished transition by coordinating the next step
      carefully. Fire above water presents elements that have not yet settled into a useful
      exchange. Being near the end of a passage does not remove its demands, so coordination and a
      realistic next step remain valuable. For example, verify the final dependency before calling a
      transition complete. Fire above water presents parts not yet brought into a settled
      relationship. The crossing needs preparation through its final step, rather than confidence
      based only on how far you have come. Check the remaining sequence and the means of support at
      the endpoint. Celebrate progress while recognizing which condition still has to be fulfilled
      for the passage to become complete. Two positions illustrate the distinction. At the second
      line: Control momentum so the next movement follows an actual plan. At the fifth line: Let
      reliable understanding guide the coordination of the unfinished task. Start with the
      bottom-to-top line structure, then compare the whole figure with an individual position. The
      classical text remains expandable for study alongside the plain-language explanation.'
