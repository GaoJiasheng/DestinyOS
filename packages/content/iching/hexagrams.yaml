      meaning:
        zh: 修复继承的问题，先承认责任与难处。山下有风，蛊强调积累的失修需要追溯原因并整治。修补不是责怪前人，可以分清旧习惯、现有影响与需要更新的流程，改一处后再检查是否持续有效。
        en:
          Begin an inherited repair by accepting responsibility and studying its cause. Wind beneath the
          mountain frames a problem accumulated through neglect or an arrangement left unexamined.
          Repair requires attention to causes as well as appearances. Separate an inherited habit
          from its present effects and from the process that now needs updating. Correct one source
          of deterioration, then check whether the repair remains effective in ordinary use.
