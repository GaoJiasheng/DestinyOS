  historySymbolism:
    zh:
      复属于《周易》六十四卦的文本与图像传统，本页沿用文王卦序，卦辞、象辞与各爻解释分层保留。上卦为坤（地），下卦为震（雷）；这组上下图像构成观察情境的入口，并非现实事件的照片。小小的回转值得珍惜，不必立刻恢复全部速度。复以地中有雷讲生机重新出现，但初起的力量仍然细小。你可以回到曾经有效的基本习惯，给调整留出缓冲，而不是把一次好转理解成已经准备好承担所有任务。雷在地中，复以微小阳气回转的意象强调重新开始需要养护。回到合适做法后不必立即补回所有进度，可以守住一个稳定动作，让改变有持续的条件。
