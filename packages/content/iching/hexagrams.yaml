    en:
      'Return belongs to the textual and image tradition of the sixty-four I Ching figures. This page
      follows King Wen ordering and keeps the judgment, image, and individual line explanations
      distinct. The upper trigram is Kun (坤, kūn — Earth), and the lower is Zhen (震, zhèn —
      Thunder). Their pairing offers a symbolic entry into a situation, not a picture of an
      established event. You can treat a return of energy as a beginning that needs room to grow.
      Thunder within earth suggests movement returning before it is obvious outside. A renewed
      possibility benefits from protection and repetition, especially when you are rebuilding a
      routine after interruption. For example, resume a paused practice at a size you can repeat.
      Thunder within earth suggests a movement returning before it is fully visible. A small
      correction deserves protection rather than an immediate demand for full speed. Resume one
      practice that can be sustained and notice what helps it continue. This differs from a dramatic
      restart: the value lies in maintaining the first useful turn back toward a workable path. Two
      positions illustrate the distinction. At the second line: Make room for a calm return
      supported by a dependable companion. At the fifth line: Commit plainly to renewal without
      making a show of it. Start with the bottom-to-top line structure, then compare the whole
      figure with an individual position. The classical text remains expandable for study alongside
      the plain-language explanation.'
