      zh: 在眼前的小事上，你可以给不同意见留出位置，并先明确一个可描述的情境。
      en:
        'For a current everyday concern, consider this emphasis: use a purpose others can recognize, and
        name one situation you can actually describe.'
  historySymbolism:
    zh:
      同人属于《周易》六十四卦的文本与图像传统，本页沿用文王卦序，卦辞、象辞与各爻解释分层保留。上卦为乾（天），下卦为离（火）；这组上下图像构成观察情境的入口，并非现实事件的照片。共同目标越清楚，越容易跨过圈子差异。同人把火的明亮与天的开阔放在一起，谈公开可理解的共同目标。它鼓励你把合作对象从熟悉的小圈子向外扩展，但也要澄清分歧，避免把一致理解成所有人都说同一句话。火在天下，同人强调公共目标与开放联结，不只是在熟人之间互相认同。把目的讲清楚，也让不同背景的人知道如何参与，可以减少小圈子的排他与猜疑。
      阅读时先看六爻由下向上的结构，再比较整体与具体爻位。古文保留在折叠区，你可以结合白话查读，不必用一个古典词汇概括自己的经历。
    en: 'Fellowship with Men belongs to the textual and image tradition of the sixty-four I Ching
      figures. This page follows King Wen ordering and keeps the judgment, image, and individual
      line explanations distinct. The upper trigram is Qian (乾, qián — Heaven), and the lower is Li
      (离, lí — Fire). Their pairing offers a symbolic entry into a situation, not a picture of an
      established event. You can cooperate across differences by making the shared purpose larger
      than personal loyalty. Light beneath an open sky suggests a purpose others can see. Fellowship
      grows when access is fair and goals are explicit, rather than when people must belong to the
      same background or agree about everything. For example, invite another group to help define
      one shared outcome. Fire beneath heaven emphasizes a purpose that can be recognized across
      personal circles. Shared understanding is different from loyalty only to familiar people.
      State the task in terms newcomers can use, and make participation accessible. This helps a
      group build common ground without requiring everyone to share the same background or
      preferences. Two positions illustrate the distinction. At the second line: Notice how loyalty
      to an inner circle is narrowing a wider opportunity. At the fifth line: Let a difficult
      reunion create space for an honest conversation. Start with the bottom-to-top line structure,
      then compare the whole figure with an individual position. The classical text remains
      expandable for study alongside the plain-language explanation.'
