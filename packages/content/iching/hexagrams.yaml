  judgment: 小畜，亨。密云不雨，自我西郊。
  tuan: 小畜；柔得位，而上下应之，曰小畜。健而巽，刚中而志行，乃亨。密云不雨，尚往也。自我西郊，施未行也。
  image: 风行天上，小畜；君子以懿文德。
  yao:
    - position: 1
      original: 初九：复自道，何其咎，吉。
      image: 复自道，其义吉也。
      meaning:
        zh: 偏离之后可以回到原来的清楚路径。风在天上，小畜用较柔和的力量约束较强的推进，积累尚未到大举行动的程度。先改进小处与沟通，不因为已有一点进展就忽略承载条件。
        en:
          Return to the straightforward route instead of adding new complications. Wind above heaven
          suggests a limited influence shaping a stronger impulse. Small adjustments can collect
          useful capacity before a larger undertaking is ready. This differs from the Great Taming’s
          more substantial reserve. Improve a detail or a conversation, and check the supporting
          arrangement before treating modest progress as permission to expand.
    - position: 2
