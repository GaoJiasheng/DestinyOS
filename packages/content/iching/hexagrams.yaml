        en:
          Use a disruption to make a needed change and explain the circumstances honestly. Wind above
          thunder presents an increase that can assist movement. Added support matters through the
          improvement it enables, not only through the amount received. Use an offer to complete a
          task previously missing a condition, and explain how the assistance was used. This makes
          an increase accountable and helps others decide whether the support can continue.
    - position: 4
      original: 六四：中行，告公从，利用为依迁国。
      image: 告公从，以益志也。
      meaning:
        zh: 在共同目标上得到认可，可以协调转移。风在雷上，益强调增加的支持应转成实际改善，而不只停在数量。接受协助后完成一项原先缺少条件的任务，也及时说明帮助怎样被使用，让增益能持续。
