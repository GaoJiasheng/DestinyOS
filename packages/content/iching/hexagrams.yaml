      distinct. The upper trigram is Kun (坤, kūn — Earth), and the lower is Dui (兑, duì — Lake).
      Their pairing offers a symbolic entry into a situation, not a picture of an established event.
      You can guide a situation more effectively by staying close enough to learn from it.
      Approaching creates access, and access brings responsibility. Earth over lake suggests
      attentive oversight that learns from the people doing the work, instead of assuming that
      distance makes judgment clearer. For example, observe a real attempt before offering
      instructions. Earth above the lake suggests approaching and attending to a situation.
      Closeness becomes useful through understanding, not merely supervision. A favourable opening
      also has limits and needs maintenance. Visit the actual task, listen to the people carrying it
      and agree how you will remain available after the first approach. Two positions illustrate the
      distinction. At the second line: Turn mutual interest into a practical form of help. At the
      fifth line: Guide through informed trust rather than constant intervention. The final line
      adds another limit to consider: Maintain patient care after the first enthusiasm for helping
      has passed. Start with the bottom-to-top line structure, then compare the whole figure with an
      individual position. The classical text remains expandable for study alongside the
      plain-language explanation.'
