# Original bilingual plain-language commentary; classical source fields retained.
# DESIGN-GAP: English length uses words (140–180 for meanings, 55–90 for lines); zh uses characters.
# DESIGN-GAP: The existing keywords schema is three strings; each string carries a zh/en label.
- number: 1
  key: hexagram_01
  name: 乾
  pinyin: qian
  englishName: The Creative
  upper: qian
  lower: qian
  lines:
    - 1
    - 1
    - 1
    - 1
    - 1
    - 1
  judgment: 元、亨、利、贞。
  tuan: 大哉乾元，万物资始，乃统天。云行雨施，品物流形。大明始终，六位时成，时乘六龙以御天。乾道变化，各正性命，保合大和，乃利贞。首出庶物，万国咸宁。
  image: 天行健，君子以自强不息。
  yao:
    - position: 1
      original: 初九：潜龙勿用。
      image: 潜龙勿用，阳在下也。
      meaning:
        zh: 力量尚在积累，暂不急于露面。乾为重天，强调主动的力量应与所处阶段相配，刚起步时潜藏准备，成熟时承担责任，用力过度时退一步。它不是无限加码的许可。
        en:
          Keep developing a skill privately before asking it to carry public responsibility. The doubled
          heaven image emphasizes initiative that changes with its stage of development.
          Preparation, visible responsibility and restraint are different uses of strength. Read the
          dragon sequence as a question about readiness, rather than permission to keep expanding
          every undertaking. At the first stage, preparation matters more than a visible result.
    - position: 2
      original: 九二：见龙在田，利见大人。
      image: 见龙在田，德施普也。
      meaning:
        zh: 开始被看见，可以向有经验的人请教。乾为重天，强调主动的力量应与所处阶段相配，刚起步时潜藏准备，成熟时承担责任，用力过度时退一步。它不是无限加码的许可。
        en: Make your emerging ability accessible and seek a capable guide. The doubled heaven image
          emphasizes initiative that changes with its stage of development. Preparation, visible
          responsibility and restraint are different uses of strength. Read the dragon sequence as a
          question about readiness, rather than permission to keep expanding every undertaking. This
          stage asks how support works in practice.
    - position: 3
      original: 九三：君子终日乾乾，夕惕若厉，无咎。
      image: 终日乾乾，反复道也。
      meaning:
        zh: 持续努力也需要警觉与休息。乾为重天，强调主动的力量应与所处阶段相配，刚起步时潜藏准备，成熟时承担责任，用力过度时退一步。它不是无限加码的许可。
        en: Balance diligent practice with an evening check on your limits. The doubled heaven image
          emphasizes initiative that changes with its stage of development. Preparation, visible
          responsibility and restraint are different uses of strength. Read the dragon sequence as a
          question about readiness, rather than permission to keep expanding every undertaking. At a
          transition, momentum can outrun the arrangement supporting it.
    - position: 4
      original: 九四：或跃在渊，无咎。
      image: 或跃在渊，进无咎也。
      meaning:
        zh: 进退之间先试探合适的位置。乾为重天，强调主动的力量应与所处阶段相配，刚起步时潜藏准备，成熟时承担责任，用力过度时退一步。它不是无限加码的许可。
        en:
          Test the opening without pretending that the transition is already settled. The doubled heaven
          image emphasizes initiative that changes with its stage of development. Preparation,
          visible responsibility and restraint are different uses of strength. Read the dragon
          sequence as a question about readiness, rather than permission to keep expanding every
          undertaking. A new point of contact makes coordination important.
    - position: 5
      original: 九五：飞龙在天，利见大人。
      image: 飞龙在天，大人造也。
      meaning:
        zh: 处在能发挥作用的位置，宜联结可靠伙伴。乾为重天，强调主动的力量应与所处阶段相配，刚起步时潜藏准备，成熟时承担责任，用力过度时退一步。它不是无限加码的许可。
        en:
          Use a visible role to connect capable people around a shared purpose. The doubled heaven image
          emphasizes initiative that changes with its stage of development. Preparation, visible
          responsibility and restraint are different uses of strength. Read the dragon sequence as a
          question about readiness, rather than permission to keep expanding every undertaking. A
          position with wider influence asks you to consider other people.
    - position: 6
      original: 上九：亢龙有悔。
      image: 亢龙有悔，盈不可久也。
      meaning:
        zh: 力量用过了头，宜收住扩张。乾为重天，强调主动的力量应与所处阶段相配，刚起步时潜藏准备，成熟时承担责任，用力过度时退一步。它不是无限加码的许可。
        en:
          Notice when ambition has outgrown the situation and step back from excess. The doubled heaven
          image emphasizes initiative that changes with its stage of development. Preparation,
          visible responsibility and restraint are different uses of strength. Read the dragon
          sequence as a question about readiness, rather than permission to keep expanding every
          undertaking. Near the end of a phase, useful action often changes.
  useNineSix:
    original: 用九：见群龙无首，吉。
    image: 用九，天德不可为首也。
  meaning:
    zh: 主动创造，持续练习，把力量用在可承担的目标上。能力正在形成时先做准备，得到支持后再扩大影响，走到高处也要留意反馈。乾的六个位置呈现力量从潜藏到显露的过程，重点是行动与时机相配。乾为重天，强调主动的力量应与所处阶段相配，刚起步时潜藏准备，成熟时承担责任，用力过度时退一步。它不是无限加码的许可。
    en:
      'You have room to initiate, but leadership asks for practice as well as confidence. A capable
      person can still move too early. The six dragon images trace how initiative develops, becomes
      visible, and eventually needs restraint. For example, test an idea privately before asking a
      team to follow it. The doubled heaven image emphasizes initiative that changes with its stage
      of development. Preparation, visible responsibility and restraint are different uses of
      strength. Read the dragon sequence as a question about readiness, rather than permission to
      keep expanding every undertaking. Two positions illustrate the distinction. At the second
      line: Make your emerging ability accessible and seek a capable guide. At the fifth line: Use a
      visible role to connect capable people around a shared purpose. The final line adds another
      limit to consider: Notice when ambition has outgrown the situation and step back from excess.'
  keywords:
    - 主动 / initiative
    - 韧性 / resilience
    - 节制 / restraint
  guidance:
    career:
      zh: 在工作协作上，你可以给每一步设定检查点，并先确认职责与交接。
      en: 'For a work task, consider this emphasis: make room for honest feedback, and confirm
        responsibilities and the handover.'
    wealth:
      zh: 在日常预算上，你可以给每一步设定检查点，并先记录收支与可调整开销。
      en: 'For a household budget, consider this emphasis: make room for honest feedback, and check
        spending records and adjustable costs.'
    love:
      zh: 在关系沟通上，你可以给每一步设定检查点，并尊重双方自愿回应与边界。
      en: 'For a voluntary relationship conversation, consider this emphasis: make room for honest
        feedback, and respect voluntary responses and mutual boundaries.'
    health:
      zh: 在作息安排上，你可以给每一步设定检查点，并观察日常休息与情绪节奏。
      en:
        'For a daily rest routine, consider this emphasis: make room for honest feedback, and observe
        rest and daily emotional rhythm.'
    study:
      zh: 在学习练习上，你可以给每一步设定检查点，并用一次实际练习取得反馈。
      en: 'For a learning exercise, consider this emphasis: make room for honest feedback, and seek
        feedback from a completed exercise.'
    travel:
      zh: 在行程准备上，你可以给每一步设定检查点，并核对路线、联络与备用安排。
      en:
        'For a journey plan, consider this emphasis: make room for honest feedback, and verify routes,
        contacts, and an alternative.'
    decision:
      zh: 在选择比较上，你可以给每一步设定检查点，并比较限制并保留可撤回的小步骤。
      en:
        'For a choice between practical options, consider this emphasis: make room for honest feedback,
        and compare constraints and keep the first step reversible.'
    other:
      zh: 在眼前的小事上，你可以给每一步设定检查点，并先明确一个可描述的情境。
      en:
        'For a current everyday concern, consider this emphasis: make room for honest feedback, and name
        one situation you can actually describe.'
  historySymbolism:
    zh:
      乾属于《周易》六十四卦的文本与图像传统，本页沿用文王卦序，卦辞、象辞与各爻解释分层保留。上卦为乾（天），下卦为乾（天）；这组上下图像构成观察情境的入口，并非现实事件的照片。主动创造，持续练习，把力量用在可承担的目标上。能力正在形成时先做准备，得到支持后再扩大影响，走到高处也要留意反馈。乾的六个位置呈现力量从潜藏到显露的过程，重点是行动与时机相配。乾为重天，强调主动的力量应与所处阶段相配，刚起步时潜藏准备，成熟时承担责任，用力过度时退一步。它不是无限加码的许可。
      阅读时先看六爻由下向上的结构，再比较整体与具体爻位。古文保留在折叠区，你可以结合白话查读，不必用一个古典词汇概括自己的经历。
    en:
      'The Creative belongs to the textual and image tradition of the sixty-four I Ching figures. This
      page follows King Wen ordering and keeps the judgment, image, and individual line explanations
      distinct. The upper trigram is Qian (乾, qián — Heaven), and the lower is Qian (乾, qián —
      Heaven). Their pairing offers a symbolic entry into a situation, not a picture of an
      established event. You have room to initiate, but leadership asks for practice as well as
      confidence. A capable person can still move too early. The six dragon images trace how
      initiative develops, becomes visible, and eventually needs restraint. For example, test an
      idea privately before asking a team to follow it. The doubled heaven image emphasizes
      initiative that changes with its stage of development. Preparation, visible responsibility and
      restraint are different uses of strength. Read the dragon sequence as a question about
      readiness, rather than permission to keep expanding every undertaking. Two positions
      illustrate the distinction. At the second line: Make your emerging ability accessible and seek
      a capable guide. At the fifth line: Use a visible role to connect capable people around a
      shared purpose. The final line adds another limit to consider: Notice when ambition has
      outgrown the situation and step back from excess. Start with the bottom-to-top line structure,
      then compare the whole figure with an individual position. The classical text remains
      expandable for study alongside the plain-language explanation.'
- number: 2
  key: hexagram_02
  name: 坤
  pinyin: kun
  englishName: The Receptive
  upper: kun
  lower: kun
  lines:
    - 0
    - 0
    - 0
    - 0
    - 0
    - 0
  judgment: 元、亨、利牝马之贞。
  tuan: 至哉坤元，万物资生，乃顺承天。坤厚载物，德合无疆。含弘光大，品物咸亨。牝马地类，行地无疆，柔顺利贞。君子攸行，先迷失道，后顺得常。西南得朋，乃与类行；东北丧朋，乃终有庆。安贞之吉，应地无疆。
  image: 地势坤，君子以厚德载物。
  yao:
    - position: 1
      original: 初六：履霜，坚冰至。
      image: 履霜坚冰，阴始凝也。驯致其道，至坚冰也。
      meaning:
        zh: 细小迹象提示条件正在改变。坤为重地，强调厚实承接与配合，顺应不是没有判断。先弄清共同方向，再用持续兑现建立信任，不必争抢发号施令的位置。
        en:
          Pay attention to an early sign before it grows into a larger difficulty. The doubled earth image
          emphasizes carrying and sustaining an arrangement. Receptivity differs from surrendering
          judgment. Establish the direction you are agreeing to support, then make that support
          dependable through repeated actions rather than competing to set every part of the agenda.
          At the first stage, preparation matters more than a visible result.
    - position: 2
      original: 六二：直方大，不习，无不利。
      image: 六二之动，直以方也。不习无不利，地道光也。
      meaning:
        zh: 坦直而稳妥的做法可以自然发挥。坤为重地，强调厚实承接与配合，顺应不是没有判断。先弄清共同方向，再用持续兑现建立信任，不必争抢发号施令的位置。
        en:
          Let clear conduct and dependable boundaries do the work without elaborate performance. The
          doubled earth image emphasizes carrying and sustaining an arrangement. Receptivity differs
          from surrendering judgment. Establish the direction you are agreeing to support, then make
          that support dependable through repeated actions rather than competing to set every part
          of the agenda. This stage asks how support works in practice.
    - position: 3
      original: 六三：含章可贞，或从王事，无成有终。
      image: 含章可贞；以时发也。或从王事，知光大也
      meaning:
        zh: 贡献可以含蓄表达，不必争先署名。坤为重地，强调厚实承接与配合，顺应不是没有判断。先弄清共同方向，再用持续兑现建立信任，不必争抢发号施令的位置。
        en:
          Support a shared effort while letting the result matter more than personal display. The doubled
          earth image emphasizes carrying and sustaining an arrangement. Receptivity differs from
          surrendering judgment. Establish the direction you are agreeing to support, then make that
          support dependable through repeated actions rather than competing to set every part of the
          agenda. At a transition, momentum can outrun the arrangement supporting it.
    - position: 4
      original: 六四：括囊，无咎，无誉。
      image: 括囊无咎，慎不害也。
      meaning:
        zh: 信息不足时先谨慎收口。坤为重地，强调厚实承接与配合，顺应不是没有判断。先弄清共同方向，再用持续兑现建立信任，不必争抢发号施令的位置。
        en:
          Keep a sensitive matter contained until you understand what disclosure would change. The doubled
          earth image emphasizes carrying and sustaining an arrangement. Receptivity differs from
          surrendering judgment. Establish the direction you are agreeing to support, then make that
          support dependable through repeated actions rather than competing to set every part of the
          agenda. A new point of contact makes coordination important.
    - position: 5
      original: 六五：黄裳，元吉。
      image: 黄裳元吉，文在中也。
      meaning:
        zh: 在合适的位置以温和方式承担责任。坤为重地，强调厚实承接与配合，顺应不是没有判断。先弄清共同方向，再用持续兑现建立信任，不必争抢发号施令的位置。
        en:
          Exercise responsibility without needing the most conspicuous place in the arrangement. The
          doubled earth image emphasizes carrying and sustaining an arrangement. Receptivity differs
          from surrendering judgment. Establish the direction you are agreeing to support, then make
          that support dependable through repeated actions rather than competing to set every part
          of the agenda. A position with wider influence asks you to consider other people.
    - position: 6
      original: 上六：龙战于野，其血玄黄。
      image: 战龙于野，其道穷也。
      meaning:
        zh: 各方争相扩张时，先停止互相消耗。坤为重地，强调厚实承接与配合，顺应不是没有判断。先弄清共同方向，再用持续兑现建立信任，不必争抢发号施令的位置。
        en:
          Interrupt a contest for dominance before it drains the capacity people share. The doubled earth
          image emphasizes carrying and sustaining an arrangement. Receptivity differs from
          surrendering judgment. Establish the direction you are agreeing to support, then make that
          support dependable through repeated actions rather than competing to set every part of the
          agenda. Near the end of a phase, useful action often changes.
  useNineSix:
    original: 用六：利永贞。
    image: 用六永贞，以大终也。
  meaning:
    zh: 承接现实需要，用可靠的配合建立自己的位置。坤以大地的承载讲接纳与落实，柔和并不等于没有立场。你可以把别人的构想变成日常可执行的安排，也要看清自己能提供什么，避免把所有责任都揽到身上。坤为重地，强调厚实承接与配合，顺应不是没有判断。先弄清共同方向，再用持续兑现建立信任，不必争抢发号施令的位置。
    en:
      'You can contribute through steadiness without surrendering your own judgment. Receptivity works
      best when it is active and discerning. Here the earth image points to making plans usable,
      supporting shared work, and knowing what you can reasonably carry. For example, agree on roles
      before volunteering for additional work. The doubled earth image emphasizes carrying and
      sustaining an arrangement. Receptivity differs from surrendering judgment. Establish the
      direction you are agreeing to support, then make that support dependable through repeated
      actions rather than competing to set every part of the agenda. Two positions illustrate the
      distinction. At the second line: Let clear conduct and dependable boundaries do the work
      without elaborate performance. At the fifth line: Exercise responsibility without needing the
      most conspicuous place in the arrangement. The final line adds another limit to consider:
      Interrupt a contest for dominance before it drains the capacity people share.'
  keywords:
    - 承载 / support
    - 配合 / receptivity
    - 边界 / boundaries
