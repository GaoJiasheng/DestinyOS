- number: 2
  key: hexagram_02
  name: 坤
  pinyin: kun
  englishName: The Receptive
  upper: kun
  lower: kun
  lines:
    - 0
    - 0
    - 0
    - 0
    - 0
    - 0
  judgment: 元、亨、利牝马之贞。
  tuan: 至哉坤元，万物资生，乃顺承天。坤厚载物，德合无疆。含弘光大，品物咸亨。牝马地类，行地无疆，柔顺利贞。君子攸行，先迷失道，后顺得常。西南得朋，乃与类行；东北丧朋，乃终有庆。安贞之吉，应地无疆。
  image: 地势坤，君子以厚德载物。
  yao:
    - position: 1
      original: 初六：履霜，坚冰至。
      image: 履霜坚冰，阴始凝也。驯致其道，至坚冰也。
      meaning:
        zh: ''
        en: ''
    - position: 2
      original: 六二：直方大，不习，无不利。
      image: 六二之动，直以方也。不习无不利，地道光也。
      meaning:
        zh: ''
        en: ''
    - position: 3
      original: 六三：含章可贞，或从王事，无成有终。
      image: 含章可贞；以时发也。或从王事，知光大也
      meaning:
        zh: ''
        en: ''
    - position: 4
      original: 六四：括囊，无咎，无誉。
      image: 括囊无咎，慎不害也。
      meaning:
        zh: ''
        en: ''
    - position: 5
      original: 六五：黄裳，元吉。
      image: 黄裳元吉，文在中也。
      meaning:
        zh: ''
        en: ''
    - position: 6
      original: 上六：龙战于野，其血玄黄。
      image: 战龙于野，其道穷也。
      meaning:
        zh: ''
        en: ''
  useNineSix:
    original: 用六：利永贞。
    image: 用六永贞，以大终也。
