  judgment: 有孚，光亨贞吉，利涉大川。
  tuan: 需，须也；险在前也。刚健而不陷，其义不困穷矣。需有孚，光亨，贞吉。位乎天位，以正中也。利涉大川，往有功也。
  image: 云上于天，需；君子以饮食宴乐。
  yao:
    - position: 1
      original: 初九：需于郊，利用恒，无咎。
      image: 需于郊，不犯难行也。利用恒，无咎；未失常也。
      meaning:
        zh: ''
        en: ''
    - position: 2
      original: 九二：需于沙，小有言，终吉。
      image: 需于沙，衍在中也。虽小有言，以终吉也。
      meaning:
        zh: ''
        en: ''
    - position: 3
      original: 九三：需于泥，致寇至。
      image: 需于泥，灾在外也。自我致寇，敬慎不败也。
      meaning:
        zh: ''
        en: ''
    - position: 4
      original: 六四：需于血，出自穴。
      image: 需于血，顺以听也。
      meaning:
        zh: ''
        en: ''
    - position: 5
      original: 九五：需于酒食，贞吉。
      image: 酒食贞吉，以中正也。
      meaning:
        zh: ''
        en: ''
    - position: 6
      original: 上六：入于穴，有不速之客三人来，敬之终吉。
      image: 不速之客来，敬之终吉。虽不当位，未大失也。
      meaning:
        zh: ''
        en: ''
