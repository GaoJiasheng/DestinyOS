        en:
          Stay within a sensible boundary while readiness is incomplete. Water above the lake gives an
          image of capacity with a boundary. A limit should protect use without making participation
          needlessly harsh. Distinguish basic needs from commitments that can be adjusted, and
          explain why the rule exists. If the restriction consumes more effort than it saves, revise
          it rather than treating endurance of discomfort as proof that the rule is sound.
