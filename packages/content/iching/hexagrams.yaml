      'You can keep your inner clarity while choosing carefully what to reveal and when. Light within
      earth is still light, even when its expression is constrained. This image favors discretion,
      practical support, and preserving clear judgment during a setting that does not welcome
      openness. For example, discuss a concern privately with someone trustworthy. Fire within earth
      suggests clarity that cannot be expressed openly in the present setting. Protecting judgment
      differs from accepting an unlimited burden. Reduce unproductive public argument, preserve a
      reliable account and seek a suitable channel for support. The emphasis is on keeping what you
      know usable while conditions constrain its expression, rather than making concealment a
      permanent rule. Two positions illustrate the distinction. At the second line: Use strong
      practical assistance when one part of your capacity is constrained. At the fifth line:
      Maintain a clear standard privately when open expression is restricted.'
