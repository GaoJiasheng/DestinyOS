- number: 3
  key: hexagram_03
  name: 屯
  pinyin: zhun
  englishName: Difficulty at the Beginning
  upper: kan
  lower: zhen
  lines:
    - 1
    - 0
    - 0
    - 0
    - 1
    - 0
  judgment: 元、亨、利、贞，勿用有攸往，利建侯。
  tuan: 屯，刚柔始交而难生，动乎险中，大亨贞。雷雨之动满盈，天造草昧，宜建侯而不宁。
  image: 云，雷，屯；君子以经纶。
  yao:
    - position: 1
      original: 初九：盘桓，利居贞，利建侯。
      image: 虽磐桓，志行正也。以贵下贱，大得民也。
      meaning:
        zh: 起步犹豫时，先建立稳定支点。水在雷上，行动已经发动而前方仍有险，屯重在初创时组织条件。困难不要求孤军推进，可以先找能共担任务的人，再逐项建立秩序。
        en:
          Settle the first foundation and gather support before choosing a wider direction. Thunder
          beneath water places an impulse to begin under difficult conditions. The issue is
          organizing an early undertaking, rather than proving courage through solitary effort. Find
          people who can share the preparation and establish the working arrangement before asking
          the whole project to move at once.
    - position: 2
      original: 六二：屯如邅如，乘马班如，匪寇，婚媾，女子贞不字，十年乃字。
