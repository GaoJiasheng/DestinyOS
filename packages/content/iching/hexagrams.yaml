  judgment: 不利有攸往。
  tuan: 剥，剥也，柔变刚也。不利有攸往，小人长也。顺而止之，观象也。君子尚消息盈虚，天行也。
  image: 山附地上，剥；上以厚下，安宅。
  yao:
    - position: 1
      original: 初六：剥床以足，蔑贞，凶。
      image: 剥床以足，以灭下也。
      meaning:
        zh: 底部支撑松动时，先修基本条件。山在地上，剥强调基础正在逐层削弱，继续扩张容易增加负担。先保护必要支撑与剩余资源，找出现在哪一层失去承载，不必一次恢复全部规模。
        en:
          Repair the lowest support before treating the whole structure as stable. The mountain resting
          above earth directs attention to the support beneath a visible structure. When that
          support is being stripped away, expansion may add load where capacity is already
          weakening. Identify the layer that needs protection and preserve essential resources. A
          smaller workable arrangement can be a more useful response than trying to restore the
          whole structure immediately.
    - position: 2
      original: 六二：剥床以辨，蔑贞凶。
      image: 剥床以辨，未有与也。
      meaning:
        zh: 损耗继续向内，不能只修表面。山在地上，剥强调基础正在逐层削弱，继续扩张容易增加负担。先保护必要支撑与剩余资源，找出现在哪一层失去承载，不必一次恢复全部规模。
        en:
          Address erosion that has moved beyond the outermost part. The mountain resting above earth
          directs attention to the support beneath a visible structure. When that support is being
          stripped away, expansion may add load where capacity is already weakening. Identify the
          layer that needs protection and preserve essential resources. A smaller workable
          arrangement can be a more useful response than trying to restore the whole structure
          immediately.
    - position: 3
      original: 六三：剥之，无咎。
      image: 剥之无咎，失上下也。
      meaning:
        zh: 可以脱离消耗性的联结，保留判断。山在地上，剥强调基础正在逐层削弱，继续扩张容易增加负担。先保护必要支撑与剩余资源，找出现在哪一层失去承载，不必一次恢复全部规模。
        en:
          Step away from a weakening alliance without adopting its behavior. The mountain resting above
          earth directs attention to the support beneath a visible structure. When that support is
          being stripped away, expansion may add load where capacity is already weakening. Identify
          the layer that needs protection and preserve essential resources. A smaller workable
          arrangement can be a more useful response than trying to restore the whole structure
          immediately.
    - position: 4
      original: 六四：剥床以肤，凶。
      image: 剥床以肤，切近灾也。
      meaning:
        zh: 问题已接近自身需要，宜保护可用空间。山在地上，剥强调基础正在逐层削弱，继续扩张容易增加负担。先保护必要支撑与剩余资源，找出现在哪一层失去承载，不必一次恢复全部规模。
        en:
          Protect immediate capacity when the loss of support reaches your daily life. The mountain
          resting above earth directs attention to the support beneath a visible structure. When
          that support is being stripped away, expansion may add load where capacity is already
          weakening. Identify the layer that needs protection and preserve essential resources. A
          smaller workable arrangement can be a more useful response than trying to restore the
          whole structure immediately.
    - position: 5
      original: 六五：贯鱼，以宫人宠，无不利。
      image: 以宫人宠，终无尤也。
      meaning:
        zh: 有序组织剩余资源，可以降低散乱。山在地上，剥强调基础正在逐层削弱，继续扩张容易增加负担。先保护必要支撑与剩余资源，找出现在哪一层失去承载，不必一次恢复全部规模。
        en:
          Coordinate what remains instead of competing for a shrinking share. The mountain resting above
          earth directs attention to the support beneath a visible structure. When that support is
          being stripped away, expansion may add load where capacity is already weakening. Identify
          the layer that needs protection and preserve essential resources. A smaller workable
          arrangement can be a more useful response than trying to restore the whole structure
          immediately.
    - position: 6
      original: 上九：硕果不食，君子得舆，小人剥庐。
      image: 君子得舆，民所载也。小人剥庐，终不可用也。
      meaning:
        zh: 保留能重新生长的种子，不把资源耗尽。山在地上，剥强调基础正在逐层削弱，继续扩张容易增加负担。先保护必要支撑与剩余资源，找出现在哪一层失去承载，不必一次恢复全部规模。
        en:
          Preserve a viable beginning for renewal rather than using the last reserve. The mountain resting
          above earth directs attention to the support beneath a visible structure. When that
          support is being stripped away, expansion may add load where capacity is already
          weakening. Identify the layer that needs protection and preserve essential resources. A
          smaller workable arrangement can be a more useful response than trying to restore the
