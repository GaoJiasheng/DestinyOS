      meaning:
        zh: 条件有限时，仍可在自愿范围内参与。雷在泽上，归妹强调位置与承诺可能不对等，不按古代身份安排现代人的角色。先讨论谁能决定什么、参与是否自愿，避免只靠仪式或热情掩盖实际条件。
        en:
          Contribute within a limited role while retaining choice over your involvement. Thunder above the
          lake raises a question about unequal position or incomplete terms of participation.
          Historical relationship roles need not be imposed on a modern person. Ask who may decide
          what and whether each participant has freely agreed. A ceremony or an enthusiastic
          exchange cannot replace clear conditions about the responsibilities and choices people
          actually have.
