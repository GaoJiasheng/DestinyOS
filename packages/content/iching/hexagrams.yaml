      鼎属于《周易》六十四卦的文本与图像传统，本页沿用文王卦序，卦辞、象辞与各爻解释分层保留。上卦为离（火），下卦为巽（风）；这组上下图像构成观察情境的入口，并非现实事件的照片。把原料转成成果，需要可靠的结构与协作。鼎以木生火、器物烹调的意象讲转化与承载，成果依赖材料、工具与人的配合。你可以整理工作结构、提高交接质量，使经验成为可分享的成果；器具不稳时先修承载，不急着加料。火在木上，鼎强调把材料转成可供使用的成果，器具和承载同样关键。先修工具、分工与交接，再讨论扩大产出，让已有内容真正到达需要的人。
      阅读时先看六爻由下向上的结构，再比较整体与具体爻位。古文保留在折叠区，你可以结合白话查读，不必用一个古典词汇概括自己的经历。
    en:
      'The Cauldron belongs to the textual and image tradition of the sixty-four I Ching figures. This
      page follows King Wen ordering and keeps the judgment, image, and individual line explanations
      distinct. The upper trigram is Li (离, lí — Fire), and the lower is Xun (巽, xùn — Wind). Their
      pairing offers a symbolic entry into a situation, not a picture of an established event. You
      can improve an outcome by caring for the vessel that makes useful transformation possible.
      Wood feeding fire and the cooking vessel evoke purposeful transformation. Good ingredients
      need a sound container and skilled coordination, making systems and shared responsibility part
      of the quality of the result. For example, turn expertise into a sequence another person can
      use. Fire above wood presents the transformation of ingredients through a vessel. Good
      material still needs a sound means of preparation and delivery. Check the tool, the division
      of work and the handover before increasing output. The reading asks how capacity becomes
      nourishment or a usable result, rather than treating possession of ingredients as equivalent
      to a completed contribution. Two positions illustrate the distinction. At the second line:
      Care for sound material without letting outside friction dictate the work. At the fifth line:
      Use dependable connections to carry the work with measured confidence. Start with the
      bottom-to-top line structure, then compare the whole figure with an individual position. The
      classical text remains expandable for study alongside the plain-language explanation.'
