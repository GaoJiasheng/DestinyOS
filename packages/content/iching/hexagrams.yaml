  judgment: 元，亨，利，贞，无咎。
  tuan: 随，刚来而下柔，动而说，随。大亨贞，无咎，而天下随时，随之时义大矣哉！
  image: 泽中有雷，随；君子以向晦入宴息。
  yao:
    - position: 1
      original: 初九：官有渝，贞吉，出门交有功。
      image: 官有渝，从正吉也。出门交有功，不失也。
      meaning:
        zh: 环境规则改变时，可以向外学习。泽中有雷，随强调因时调整与选择可信方向，不是盲目追随。先确认你认同什么，再决定怎样配合；有些取舍会改变原来的联结，需要说清理由与边界。
        en: Meet a changing role through wider contact and a clear standard. Thunder within the lake
          suggests movement responding to a wider situation. Following differs from accepting every
          influence unexamined. Identify the purpose you recognize before deciding how to adapt. A
          change of direction may alter a previous association, so explain the choice and the limits
          of your participation rather than relying on silent compliance.
    - position: 2
      original: 六二：系小子，失丈夫。
      image: 系小子，弗兼与也。
      meaning:
        zh: 追随眼前便利，可能失去更重要的联结。泽中有雷，随强调因时调整与选择可信方向，不是盲目追随。先确认你认同什么，再决定怎样配合；有些取舍会改变原来的联结，需要说清理由与边界。
        en:
          Notice what a convenient attachment is costing your larger purpose. Thunder within the lake
          suggests movement responding to a wider situation. Following differs from accepting every
          influence unexamined. Identify the purpose you recognize before deciding how to adapt. A
          change of direction may alter a previous association, so explain the choice and the limits
          of your participation rather than relying on silent compliance.
