  meaning:
    zh: 共同目标越清楚，越容易跨过圈子差异。同人把火的明亮与天的开阔放在一起，谈公开可理解的共同目标。它鼓励你把合作对象从熟悉的小圈子向外扩展，但也要澄清分歧，避免把一致理解成所有人都说同一句话。火在天下，同人强调公共目标与开放联结，不只是在熟人之间互相认同。把目的讲清楚，也让不同背景的人知道如何参与，可以减少小圈子的排他与猜疑。
