        en:
          Check the route before turning fresh energy into a forceful advance. Thunder above heaven
          emphasizes increased force that still needs appropriate limits. Strength can become an
          obstacle if it pushes beyond the available route. Check authority, access and support
          before applying more effort. If movement becomes blocked, change the method rather than
          treating resistance as a demand to prove that the same force can be made even stronger.
