        zh: 启蒙需要规则，但纠正不宜变成反复压制。山下有水，蒙强调面对未知时建立学习关系。求教需要问题明确、愿意实践，带教也应有边界；反复追问而不尝试，难以得到新的理解。
        en:
          Give a learner structure without turning every mistake into punishment. Water beneath the
          mountain frames uncertainty as a learning situation. A useful teaching relationship needs
          an answerable question and willingness to practise. Repeating the request without using
          the instruction may add little. Clarify what you are trying to learn and which exercise
          would show whether the explanation helped.
    - position: 2
