        you know, and name one situation you can actually describe.'
  historySymbolism:
    zh:
      姤属于《周易》六十四卦的文本与图像传统，本页沿用文王卦序，卦辞、象辞与各爻解释分层保留。上卦为乾（天），下卦为巽（风）；这组上下图像构成观察情境的入口，并非现实事件的照片。突然的相遇可以观察，不必立即给予全部信任。姤以风行天下讲影响从细小处进入，新的接触可能很快改变节奏。你可以欢迎信息与机会，同时核对条件与动机；接近不意味着立刻承诺，也不需要按性别给任何人贴标签。风在天下，姤强调意外相遇的影响可能迅速进入，先辨别再接纳。兴趣不等于可信度，给新联结设一个有限范围，用真实互动决定是否增加投入。
      阅读时先看六爻由下向上的结构，再比较整体与具体爻位。古文保留在折叠区，你可以结合白话查读，不必用一个古典词汇概括自己的经历。
    en:
      'Coming to Meet belongs to the textual and image tradition of the sixty-four I Ching figures.
      This page follows King Wen ordering and keeps the judgment, image, and individual line
      explanations distinct. The upper trigram is Qian (乾, qián — Heaven), and the lower is Xun (巽,
      xùn — Wind). Their pairing offers a symbolic entry into a situation, not a picture of an
      established event. You can stay curious about an unexpected opening while setting limits
      early. Wind beneath heaven travels widely from a small beginning. An encounter may be
      compelling, yet practical boundaries and time to observe make curiosity more useful than an
      immediate commitment. For example, try a bounded collaboration before granting broad access.
      Wind beneath heaven suggests an influence encountered unexpectedly. An interesting arrival is
      not yet a reliable connection. Establish a limited scope for the first exchange and notice how
      the other participant responds to a clear boundary. This lets an encounter provide information
      without giving it control over the wider arrangement before its effect is understood. Two
      positions illustrate the distinction. At the second line: Care for a limited resource before
      exposing it to a wider audience. At the fifth line: Keep something valuable protected until an
      appropriate opening appears. Start with the bottom-to-top line structure, then compare the
      whole figure with an individual position. The classical text remains expandable for study
      alongside the plain-language explanation.'
