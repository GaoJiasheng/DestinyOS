  judgment: 元、亨、利、贞。
  tuan: 大哉乾元，万物资始，乃统天。云行雨施，品物流形。大明始终，六位时成，时乘六龙以御天。乾道变化，各正性命，保合大和，乃利贞。首出庶物，万国咸宁。
  image: 天行健，君子以自强不息。
  yao:
    - position: 1
      original: 初九：潜龙勿用。
      image: 潜龙勿用，阳在下也。
      meaning:
        zh: ''
        en: ''
    - position: 2
      original: 九二：见龙在田，利见大人。
      image: 见龙在田，德施普也。
      meaning:
        zh: ''
        en: ''
    - position: 3
      original: 九三：君子终日乾乾，夕惕若厉，无咎。
      image: 终日乾乾，反复道也。
      meaning:
        zh: ''
        en: ''
    - position: 4
      original: 九四：或跃在渊，无咎。
      image: 或跃在渊，进无咎也。
      meaning:
        zh: ''
        en: ''
    - position: 5
      original: 九五：飞龙在天，利见大人。
      image: 飞龙在天，大人造也。
      meaning:
        zh: ''
        en: ''
    - position: 6
      original: 上九：亢龙有悔。
      image: 亢龙有悔，盈不可久也。
      meaning:
        zh: ''
        en: ''
