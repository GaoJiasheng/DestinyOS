    en:
      'You can continue an unfinished transition by coordinating the next step carefully. Fire above
      water presents elements that have not yet settled into a useful exchange. Being near the end
      of a passage does not remove its demands, so coordination and a realistic next step remain
      valuable. For example, verify the final dependency before calling a transition complete. The
