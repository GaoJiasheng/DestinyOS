  judgment: 女壮，勿用取女。
  tuan: 姤，遇也，柔遇刚也。勿用取女，不可与长也。天地相遇，品物咸章也。刚遇中正，天下大行也。姤之时义大矣哉！
  image: 天下有风，姤；后以施命诰四方。
  yao:
    - position: 1
      original: 初六：系于金柅，贞吉，有攸往，见凶，羸豕孚蹢躅。
      image: 系于金柅，柔道牵也。
      meaning:
        zh: 小影响刚进入时，可以先设边界。风在天下，姤强调意外相遇的影响可能迅速进入，先辨别再接纳。兴趣不等于可信度，给新联结设一个有限范围，用真实互动决定是否增加投入。
        en:
          Set a modest boundary before a new influence becomes difficult to contain. Wind beneath heaven
          suggests an influence encountered unexpectedly. An interesting arrival is not yet a
          reliable connection. Establish a limited scope for the first exchange and notice how the
          other participant responds to a clear boundary. This lets an encounter provide information
          without giving it control over the wider arrangement before its effect is understood.
    - position: 2
