    summary: 焦点正在变化时，适合观察前后条件怎样衔接
    body: 在这次事业问题上，焦点正在变化时，适合观察前后条件怎样衔接。动（用神（按问题类别选择的观察焦点）所在爻发生阴阳变化）提示观察焦点有动态，用神是本次问题的相关角色，动爻（被标记为翻转阴阳的线）是本卦（起卦得到的主要六条线）中被标记为变化的位置。当前状态把动态突出显示，不能只因有变化就判定好坏，还需结合变化后的条件与实际安排。例如，项目刚开始时，你可以列出交付内容、负责的人和缺少的材料，把依赖说清楚，避免把整个团队的进展都压在自己身上。你可以把变化前后分别写成一份小清单，确认哪些职责、材料或期待已不同；先约定接合与复查方式，再决定是否继续，不让速度代替对新条件的理解。
    advice:
      - 把目标写成可核对的交付物
      - 你可以把变化前后分别写成一份小清单，确认哪些职责、材料或期待已不同；先约定接合与复查方式，再决定是否继续，不让速度代替对新条件的理解。
