    body: 在这次事业问题上，焦点暂时没有直接对应，可以先重新说清问题。缺（用神（按问题类别选择的观察焦点）在明爻与伏神中均无对应的状态）表示本次结构没有直接显示所选焦点，用神是按类别选择的观察角色。它不说明现实里缺少对象或资源，也不能据此断定事情无从推进；问题范围与所需条件可能还不够清楚。例如，项目刚开始时，你可以列出交付内容、负责的人和缺少的材料，把依赖说清楚，避免把整个团队的进展都压在自己身上。建议把希望了解的事情缩成一个具体场景，列出需要什么信息与谁可以提供；先做现实核对，不把没有对应爻（象征相对接洽的位置）理解成对未来的拒绝或对自身的评价。
    advice:
      - 把目标写成可核对的交付物
      - 建议把希望了解的事情缩成一个具体场景，列出需要什么信息与谁可以提供；先做现实核对，不把没有对应爻理解成对未来的拒绝或对自身的评价。
