      and one missing document. Write these dependencies down before accepting responsibility for
      the whole schedule. This makes a request for help easier for a colleague to answer. However,
      you can revise the sequence, reduce scope, or request help with a specific new demand. Set a
      review point based on the updated arrangement. A changed condition calls for a changed
      response rather than an effort to prove that the earlier plan must still work.
