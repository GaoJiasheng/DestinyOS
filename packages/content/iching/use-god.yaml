      means the use god (yòng shén — the selected focus) is found through a hidden line rather than
      the visible primary arrangement. This additional role is called fú shén — a concealed
      relative. It is not evidence of secrecy or someone’s undisclosed motives. For example, a new
      project may need a named owner, a clear handover, and one missing document. Write these
      dependencies down before accepting responsibility for the whole schedule. This makes a request
      for help easier for a colleague to answer. Consider organizing the clues already present and
      asking an appropriate person for a usable source. State the purpose and scope of the request.
