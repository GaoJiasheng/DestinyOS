    body: 在这次事业问题上，变化后增加约束时，适合修订原有的推进方式。回头克（变爻（变化后的对应线）五行（木火土金水的关系分类）反过来约束原来用神（按问题类别选择的观察焦点）的五行）提示变化可能带来新限制，用神是所选观察焦点，变爻是对应位置改变后的状态。这里不把限制解释为某人的敌意，也不将它当成个人能力结论，重点是检查前后条件是否仍能衔接。例如，项目刚开始时，你可以列出交付内容、负责的人和缺少的材料，把依赖说清楚，避免把整个团队的进展都压在自己身上。不过，你可以通过降低范围、修订顺序或明确求助来调整；把最不合适的一项新要求说清楚，约好复查时点，让行动建立在更新后的现实条件上。
