      - text: 雷在天上，大壮；君子以非礼勿履。
        from: 《周易》象传·大壮
  en:
    title: The Power of the Great
    summary: You can use growing confidence well by checking what the situation actually permits
    body: 'You can use growing confidence well by checking what the situation actually permits. The
      Power of the Great is your primary hexagram (běn guà — the main figure cast for this
      question); thunder above heaven makes strong movement conspicuous. Confidence can help you
      act, yet the quality of restraint determines whether force serves a useful purpose or creates
      avoidable resistance. Available force can tempt you to use it where a clearer request would
      suffice; learn whether the barrier is a rule, a resource gap, or another person’s limit.
      Strength serves the task better when it remains proportionate to the obstruction. In everyday
      terms, explain the purpose before pressing harder for resources. Try this emphasis: use
      strength in proportion to the task.'
    advice:
      - Use strength in proportion to the task
    do:
      - Check facts
    dont:
      - Rush commitments
    sources:
      - text: 利，贞。
        from: Zhouyi, hexagram 34 (Chinese source text)
