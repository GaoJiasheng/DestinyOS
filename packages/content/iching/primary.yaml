        from: 《周易》·剥
      - text: 山附地上，剥；上以厚下，安宅。
        from: 《周易》象传·剥
  en:
    title: Splitting Apart
    summary: You can respond to erosion by reducing exposure and caring for the remaining support
    body: 'You can respond to erosion by reducing exposure and caring for the remaining support.
      Splitting Apart is your primary hexagram (běn guà — the main figure cast for this question); a
      mountain depends on the ground beneath it. When support is wearing away, maintaining the
      appearance of normality can consume what remains; this reading favors realistic limits and
      attention to foundations. A weakening foundation deserves attention before the visible
      structure is expanded; reduce optional load and protect what remains dependable. Saving a
      viable core is sometimes more constructive than insisting that every part continue looking
      unchanged. In everyday terms, reduce optional work when the team’s support has thinned. Try
      this emphasis: protect the support that still holds. Give this step a review point tied to the
      task itself, so you can notice what helped and what still needs another approach.'
    advice:
      - Protect the support that still holds
    do:
      - Check facts
    dont:
      - Rush commitments
    sources:
      - text: 不利有攸往。
        from: Zhouyi, hexagram 23 (Chinese source text)
      - text: 山附地上，剥；上以厚下，安宅。
