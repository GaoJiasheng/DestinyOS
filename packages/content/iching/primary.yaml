  zh:
    title: 解：紧张开始松动时
    summary: 紧张开始松动时，及时处理剩下的结节
    body: 紧张开始松动时，及时处理剩下的结节；你可以据此检查手头安排。本卦（这次起卦得到的主要情境图）为解卦；解以雷雨舒展讲紧张得到松解，条件改善后应抓住能恢复的部分。若问题已经处理，不必为了证明努力继续加码；若还有结节，就尽早沟通并完成收尾。卦象上方是雷，下方是水，分别提示启动与回应与不确定中的通路；这是观察情境的比喻，不是事件预告。例如，误会澄清后确认下一次怎样沟通，就能把这个角度用在可观察的安排上。建议把松动的机会用于收尾；若现实信息不同，及时修正理解，不把象征当成行动命令。
    advice:
      - 把松动的机会用于收尾
    do:
      - 核对事实
    dont:
      - 仓促承诺
    sources:
      - text: 利西南，无所往，其来复吉，有攸往，夙吉。
        from: 《周易》·解
      - text: 雷雨作，解；君子以赦过宥罪。
        from: 《周易》象传·解
  en:
    title: Deliverance
    summary: You can use a release of pressure to finish repairs and restore ordinary routines
    body: 'You can use a release of pressure to finish repairs and restore ordinary routines.
      Deliverance is your primary hexagram (běn guà — the main figure cast for this question);
      thunder and rain offer an image of release after strain. Relief creates room for repair, but
      usefulness depends on distinguishing unfinished issues from matters that no longer need
      further intervention. Once pressure loosens, notice what ordinary activity can resume; repair
      a remaining misunderstanding, then resist the urge to keep intervening merely because the
      difficult period demanded constant attention. Completion can mean allowing the arrangement to
      become simple again. In everyday terms, agree on a practical change after resolving a
      misunderstanding. Try this emphasis: restore a routine that pressure interrupted. Give this
      step a review point tied to the task itself, so you can notice what helped and what still
      needs another approach.'
    advice:
      - Restore a routine that pressure interrupted
    do:
      - Check facts
    dont:
      - Rush commitments
    sources:
      - text: 利西南，无所往，其来复吉，有攸往，夙吉。
        from: Zhouyi, hexagram 40 (Chinese source text)
      - text: 雷雨作，解；君子以赦过宥罪。
        from: Zhouyi, Image commentary 40 (Chinese source text)
