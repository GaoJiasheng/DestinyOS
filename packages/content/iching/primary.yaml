  zh:
    title: 未济：尚未完成时
    summary: 尚未完成时，重新确认次序与跨越条件
    body: 尚未完成时，重新确认次序与跨越条件；你可以据此检查手头安排。本卦（这次起卦得到的主要情境图）为未济卦；未济以火水未交讲条件尚未形成稳定配合，离终点近也不宜忽略最后的准备。你可以承认仍待完成的部分，调整次序与工具，让每一步都能接上下一步，而不是只靠接近成功的感觉推进。卦象上方是火，下方是水，分别提示明晰与依托与不确定中的通路；这是观察情境的比喻，不是事件预告。例如，上线前确认最后一个依赖确实已就绪，就能把这个角度用在可观察的安排上。建议把剩余工作排成清楚顺序；若现实信息不同，及时修正理解，不把象征当成行动命令。
    advice:
      - 把剩余工作排成清楚顺序
