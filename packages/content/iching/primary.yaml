  zh:
    title: 巽：温和而连续的影响
    summary: 温和而连续的影响，比反复改口更有力量
    body: 温和而连续的影响，比反复改口更有力量；你可以据此检查手头安排。本卦（这次起卦得到的主要情境图）为巽卦；巽以重叠的风讲细小但不断的进入，意见要清楚，方法可以柔和。你可以反复核对对方是否理解，逐步修正做法；若把顺应变成没有立场，反而容易让人摸不清方向。上下卦都是风，强调沟通与渐入的连续作用；这是观察情境的比喻，不是事件预告。例如，推动新习惯时每次只增加一项清楚要求，就能把这个角度用在可观察的安排上。建议保持方向清楚并听取反馈；若现实信息不同，及时修正理解，不把象征当成行动命令。
    advice:
      - 保持方向清楚并听取反馈
    do:
      - 核对事实
    dont:
      - 仓促承诺
    sources:
      - text: 小亨。利有攸往，利见大人。
        from: 《周易》·巽
      - text: 随风，巽；君子以申命行事。
        from: 《周易》象传·巽
  en:
    title: The Gentle
    summary: You can make your purpose understood through steady communication and small adjustments
    body:
      'You can make your purpose understood through steady communication and small adjustments. The
      Gentle is your primary hexagram (běn guà — the main figure cast for this question); wind
      repeated works through persistence rather than a single push. A gentle approach needs a clear
      purpose and consistent signals, otherwise accommodation can leave everyone unsure about what
      is actually being proposed. Gentle influence works when its message remains legible; repeat a
      clear purpose, invite feedback, and change one detail at a time. If accommodation has erased
      your position, recover a simple boundary before adding another explanation of what you hoped
      people would infer. In everyday terms, introduce one understandable change at a time. Try this
      emphasis: repeat the purpose without pressing for instant agreement.'
    advice:
      - Repeat the purpose without pressing for instant agreement
    do:
      - Check facts
    dont:
      - Rush commitments
    sources:
      - text: 小亨。利有攸往，利见大人。
        from: Zhouyi, hexagram 57 (Chinese source text)
