  zh:
    title: 咸：回应触动时
    summary: 回应触动时，给双方留出自然靠近的空间
    body: 回应触动时，给双方留出自然靠近的空间；你可以据此检查手头安排。本卦（这次起卦得到的主要情境图）为咸卦；咸以泽在山上讲彼此感受到影响，接近需要双方都有余地。好感与共鸣可以被认真看待，但不宜据此替别人决定；听见回应、确认舒适程度，比催促关系定型更合适。卦象上方是泽，下方是山，分别提示交流与悦纳与边界与止步；这是观察情境的比喻，不是事件预告。例如，聊天愉快后询问对方愿不愿意继续交流，就能把这个角度用在可观察的安排上。建议尊重回应的速度与边界；若现实信息不同，及时修正理解，不把象征当成行动命令。
    advice:
      - 尊重回应的速度与边界
    do:
      - 核对事实
    dont:
      - 仓促承诺
    sources:
      - text: 亨，利，贞，取女吉。
        from: 《周易》·咸
      - text: 山上有泽，咸，君子以虚受人。
        from: 《周易》象传·咸
  en:
    title: Influence
    summary: You can notice an emerging connection without deciding its meaning too quickly
    body:
      'You can notice an emerging connection without deciding its meaning too quickly. Influence is
      your primary hexagram (běn guà — the main figure cast for this question); lake above mountain
      suggests an influence felt across stillness and openness. Connection develops through
      reciprocal response, so your own excitement is one part of the picture rather than evidence of
      another person’s intentions. Your own response gives you information about yourself, not
      permission to decide for another person; A respectful invitation allows a connection to
      develop voluntarily. Look for mutual comfort and follow-through without demanding that early
      interest take a fixed form. In everyday terms, invite another conversation and allow an
      unpressured reply. Try this emphasis: let interest be mutual and voluntary. Give this step a
      review point tied to the task itself, so you can notice what helped and what still needs
      another approach.'
    advice:
      - Let interest be mutual and voluntary
    do:
      - Check facts
    dont:
      - Rush commitments
    sources:
