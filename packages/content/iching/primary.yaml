  zh:
    title: 否：联系受阻时
    summary: 联系受阻时，先守住原则与可用的资源
    body: 联系受阻时，先守住原则与可用的资源；你可以据此检查手头安排。本卦（这次起卦得到的主要情境图）为否卦；否呈现天地各离，强调交流不畅而不是个人价值下降。你可以识别哪些渠道暂时无效，减少无谓消耗，同时保留可信的伙伴与基本工作，让重新连接时有可承接的基础。卦象上方是天，下方是地，分别提示开阔与主动与承载与落实；这是观察情境的比喻，不是事件预告。例如，回复始终不到时先推进自己能完成的部分，就能把这个角度用在可观察的安排上。建议留好记录再寻找新通道；若现实信息不同，及时修正理解，不把象征当成行动命令。
    advice:
      - 留好记录再寻找新通道
    do:
      - 核对事实
    dont:
      - 仓促承诺
    sources:
