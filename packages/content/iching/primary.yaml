  zh:
    title: 渐：按阶段推进
    summary: 按阶段推进，让关系与成果有时间扎根
    body: 按阶段推进，让关系与成果有时间扎根；你可以据此检查手头安排。本卦（这次起卦得到的主要情境图）为渐卦；渐以山上有木讲逐步成长，六爻借鸟逐站停留呈现不同阶段。稳定的发展需要合适落点与关系支持，不宜为了赶快显得成熟而跳过准备；节奏可以协商而非由外界统一规定。卦象上方是风，下方是山，分别提示沟通与渐入与边界与止步；这是观察情境的比喻，不是事件预告。例如，长期合作先从一次小任务建立经验，就能把这个角度用在可观察的安排上。建议按实际基础安排下一阶段；若现实信息不同，及时修正理解，不把象征当成行动命令。
    advice:
      - 按实际基础安排下一阶段
    do:
      - 核对事实
    dont:
      - 仓促承诺
    sources:
      - text: 女归吉，利贞。
        from: 《周易》·渐
      - text: 山上有木，渐；君子以居贤德，善俗。
        from: 《周易》象传·渐
  en:
    title: Development
    summary: You can develop something durable by respecting the sequence of its growth
    body:
      'You can develop something durable by respecting the sequence of its growth. Development is
      your primary hexagram (běn guà — the main figure cast for this question); wood on a mountain
      grows through a setting that offers limits and footholds. The migrating bird images suggest
      successive stages, each requiring a place to settle before the next movement becomes sensible.
      A stage is ready when it can support the next one, not merely when a calendar says it should
      end; discuss the practical foothold, the pace, and the help available. A slower sequence can
      let a relationship or project become more dependable. In everyday terms, begin a continuing
      partnership with one bounded project. Try this emphasis: let each stage support the one after
      it.'
    advice:
      - Let each stage support the one after it
    do:
      - Check facts
    dont:
      - Rush commitments
    sources:
      - text: 女归吉，利贞。
        from: Zhouyi, hexagram 53 (Chinese source text)
      - text: 山上有木，渐；君子以居贤德，善俗。
        from: Zhouyi, Image commentary 53 (Chinese source text)
