  zh:
    title: 大过：负担超过常态时
    summary: 负担超过常态时，先加支撑再谈突破
    body: 负担超过常态时，先加支撑再谈突破；你可以据此检查手头安排。本卦（这次起卦得到的主要情境图）为大过卦；大过以屋梁承重的意象讲结构承受了过大的压力，泽在木上也呈现不寻常的配置。此时只靠更加努力可能增加消耗，重新分担、改变方案或缩小目标更值得考虑。卦象上方是泽，下方是风，分别提示交流与悦纳与沟通与渐入；这是观察情境的比喻，不是事件预告。例如，连续接到任务时与团队重新划分范围，就能把这个角度用在可观察的安排上。建议先核对承受能力再承诺；若现实信息不同，及时修正理解，不把象征当成行动命令。
    advice:
      - 先核对承受能力再承诺
    do:
      - 核对事实
    dont:
      - 仓促承诺
    sources:
      - text: 栋桡，利有攸往，亨。
        from: 《周易》·大过
      - text: 泽灭木，大过；君子以独立不惧，遯世无闷。
        from: 《周易》象传·大过
  en:
    title: Preponderance of the Great
    summary: You may need an unusual arrangement, but it should make the load more manageable
    body: 'You may need an unusual arrangement, but it should make the load more manageable.
      Preponderance of the Great is your primary hexagram (běn guà — the main figure cast for this
      question); a ridge beam under excessive load calls attention to structure. Lake above wood
      describes an exceptional situation, where useful courage includes finding support rather than
      simply pushing harder. An exceptional load may require exceptional coordination rather than
      exceptional endurance; identify which support is bending and whether the scope can change.
      Asking for a different arrangement can be the responsible way to protect the purpose of the
      work. In everyday terms, renegotiate scope when several responsibilities arrive together. Try
      this emphasis: change the arrangement around the load. Give this step a review point tied to
      the task itself, so you can notice what helped and what still needs another approach.'
    advice:
      - Change the arrangement around the load
    do:
      - Check facts
    dont:
      - Rush commitments
    sources:
      - text: 栋桡，利有攸往，亨。
        from: Zhouyi, hexagram 28 (Chinese source text)
      - text: 泽灭木，大过；君子以独立不惧，遯世无闷。
