    body: 身处陌生环境，先照顾落脚点与交往分寸；你可以据此检查手头安排。本卦（这次起卦得到的主要情境图）为旅卦；旅以山上有火讲短暂停留，火移动而山保持不动，提醒你看清自己在环境中的位置。你可以了解规则、保管必要物品并建立可信联系，不必急着在陌生地方承担超出权限的事情。卦象上方是火，下方是山，分别提示明晰与依托与边界与止步；这是观察情境的比喻，不是事件预告。例如，到新地方先确认联络人和返程安排，就能把这个角度用在可观察的安排上。建议保留必要资源与机动空间；若现实信息不同，及时修正理解，不把象征当成行动命令。
    advice:
      - 保留必要资源与机动空间
    do:
