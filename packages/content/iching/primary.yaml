  zh:
    title: 同人：共同目标越清楚
    summary: 共同目标越清楚，越容易跨过圈子差异
    body: 共同目标越清楚，越容易跨过圈子差异；你可以据此检查手头安排。本卦（这次起卦得到的主要情境图）为同人卦；同人把火的明亮与天的开阔放在一起，谈公开可理解的共同目标。它鼓励你把合作对象从熟悉的小圈子向外扩展，但也要澄清分歧，避免把一致理解成所有人都说同一句话。卦象上方是天，下方是火，分别提示开阔与主动与明晰与依托；这是观察情境的比喻，不是事件预告。例如，跨部门讨论先确认共同交付物，就能把这个角度用在可观察的安排上。建议给不同意见留出位置；若现实信息不同，及时修正理解，不把象征当成行动命令。
    advice:
      - 给不同意见留出位置
    do:
      - 核对事实
    dont:
      - 仓促承诺
    sources:
      - text: 于野，亨。利涉大川，利君子贞。
        from: 《周易》·同人
      - text: 天与火，同人；君子以类族辨物。
        from: 《周易》象传·同人
  en:
    title: Fellowship with Men
    summary: You can cooperate across differences by making the shared purpose larger than personal loyalty
    body: 'You can cooperate across differences by making the shared purpose larger than personal
      loyalty. Fellowship with Men is your primary hexagram (běn guà — the main figure cast for this
      question); light beneath an open sky suggests a purpose others can see. Fellowship grows when
      access is fair and goals are explicit, rather than when people must belong to the same
      background or agree about everything. People can share a task without sharing every identity
      or belief; make the entrance understandable and avoid using familiarity as the test of who
      belongs. A disagreement about methods may become useful once the shared outcome has been
      named. In everyday terms, invite another group to help define one shared outcome. Try this
      emphasis: use a purpose others can recognize.'
    advice:
      - Use a purpose others can recognize
    do:
      - Check facts
    dont:
      - Rush commitments
    sources:
      - text: 于野，亨。利涉大川，利君子贞。
        from: Zhouyi, hexagram 13 (Chinese source text)
      - text: 天与火，同人；君子以类族辨物。
