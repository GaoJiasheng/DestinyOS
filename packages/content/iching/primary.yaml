  zh:
    title: 噬嗑：障碍需要被具体处理
    summary: 障碍需要被具体处理，不能只靠含糊的和气
    body: 障碍需要被具体处理，不能只靠含糊的和气；你可以据此检查手头安排。本卦（这次起卦得到的主要情境图）为噬嗑卦；噬嗑借咬合时有阻物的意象讲规则与处理能力，雷火相接使问题更容易暴露。把障碍说清楚有助于恢复协作，但也要核对证据与分寸，避免情绪代替判断。卦象上方是火，下方是雷，分别提示明晰与依托与启动与回应；这是观察情境的比喻，不是事件预告。例如，反复返工时先找出验收标准的分歧，就能把这个角度用在可观察的安排上。建议对具体问题约定处理方式；若现实信息不同，及时修正理解，不把象征当成行动命令。
    advice:
      - 对具体问题约定处理方式
    do:
