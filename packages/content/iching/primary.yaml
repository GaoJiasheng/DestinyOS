    body: 处理积累的问题，需要修复原因而非只遮住表面；你可以据此检查手头安排。本卦（这次起卦得到的主要情境图）为蛊卦；蛊以山下有风的意象讲长期失修的结构，问题可能来自旧习惯与责任模糊。修复不是归咎某个人，而是追溯原因、安排清理，并给新做法足够的维护时间。卦象上方是山，下方是风，分别提示边界与止步与沟通与渐入；这是观察情境的比喻，不是事件预告。例如，旧项目先梳理无人负责的环节，就能把这个角度用在可观察的安排上。建议修复之后安排复查；若现实信息不同，及时修正理解，不把象征当成行动命令。
    advice:
