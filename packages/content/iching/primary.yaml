        from: 《周易》·否
      - text: 天地不交，否；君子以俭德辟难，不可荣以禄。
        from: 《周易》象传·否
  en:
    title: Standstill
    summary: You may need to protect useful work while communication channels are closed
    body:
      'You may need to protect useful work while communication channels are closed. Standstill is
      your primary hexagram (běn guà — the main figure cast for this question); heaven above earth
      moves away from contact in this image. A blocked exchange can limit progress without
      describing your worth, so preserving dependable routines matters more than forcing every
      conversation open. Repeatedly knocking on a closed channel can make a blocked period feel
      larger than it is; separate unavailable cooperation from work still within reach. Preserve
      records and respectful contacts so a future opening has something dependable to reconnect. In
      everyday terms, continue a bounded task while waiting for access to another team. Try this
      emphasis: protect the work that remains possible. Give this step a review point tied to the
      task itself, so you can notice what helped and what still needs another approach.'
    advice:
      - Protect the work that remains possible
    do:
      - Check facts
    dont:
      - Rush commitments
    sources:
      - text: 否之匪人。不利君子贞，大往小来。
        from: Zhouyi, hexagram 12 (Chinese source text)
      - text: 天地不交，否；君子以俭德辟难，不可荣以禄。
