  zh:
    title: 小过：细处多做一点
    summary: 细处多做一点，大事暂时不要越过条件
    body: 细处多做一点，大事暂时不要越过条件；你可以据此检查手头安排。本卦（这次起卦得到的主要情境图）为小过卦；小过以山上有雷讲行动略超平常，适合在细节上谨慎用心。它不鼓励扩大冒险，而提醒你保持较低姿态、照顾小处，确认当前条件是否足以承载更大的承诺。卦象上方是雷，下方是山，分别提示启动与回应与边界与止步；这是观察情境的比喻，不是事件预告。例如，交付前多检查一次关键细节，就能把这个角度用在可观察的安排上。建议把改进控制在能承担的范围；若现实信息不同，及时修正理解，不把象征当成行动命令。
    advice:
      - 把改进控制在能承担的范围
    do:
      - 核对事实
    dont:
      - 仓促承诺
    sources:
      - text: 亨，利，贞。
        from: 《周易》·小过
      - text: 山上有雷，小过；君子以行过乎恭，丧过乎哀，用过乎俭。
        from: 《周易》象传·小过
  en:
    title: Preponderance of the Small
    summary: You can use extra care on a small task while keeping larger moves within your capacity
    body: 'You can use extra care on a small task while keeping larger moves within your capacity.
      Preponderance of the Small is your primary hexagram (běn guà — the main figure cast for this
      question); thunder over mountain calls attention to movements near a boundary. A little extra
      care can be useful, while a much larger leap may outrun the available support; scale is
      central to the reading. A precise small adjustment can help more than a dramatic leap; look
      for the detail that deserves extra care, while leaving the larger undertaking within the
      available support. A lower profile can be an active choice about proportion rather than
      timidity. In everyday terms, double-check a small but important handover detail. Try this
      emphasis: prefer precision to a dramatic gesture.'
    advice:
      - Prefer precision to a dramatic gesture
    do:
      - Check facts
    dont:
      - Rush commitments
    sources:
