        from: 《周易》·贲
      - text: 山下有火，贲；君子以明庶政，无敢折狱。
        from: 《周易》象传·贲
  en:
    title: Grace
    summary: You can improve presentation while making sure it serves something substantial
    body:
      'You can improve presentation while making sure it serves something substantial. Grace is your
      primary hexagram (běn guà — the main figure cast for this question); light at the foot of a
      mountain highlights form without changing the mountain itself. Presentation helps when it
      directs attention to sound content; excess decoration can hide what someone needs to
      understand. Polish should make the useful thing easier to recognize; A simple document with a
      clear argument may communicate more than an elaborate one that asks the viewer to admire it.
      Let the intended use determine how much decoration belongs. In everyday terms, remove a visual
      flourish that distracts from the point. Try this emphasis: let design reveal the substance.
      Give this step a review point tied to the task itself, so you can notice what helped and what
      still needs another approach.'
    advice:
      - Let design reveal the substance
    do:
      - Check facts
    dont:
      - Rush commitments
    sources:
