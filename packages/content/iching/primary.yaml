        from: 《周易》·泰
      - text: 天地交泰，后以财成天地之道，辅相天地之宜，以左右民。
        from: 《周易》象传·泰
  en:
    title: Peace
    summary: You can use a period of openness to put dependable arrangements in place
    body: 'You can use a period of openness to put dependable arrangements in place. Peace is your
      primary hexagram (běn guà — the main figure cast for this question); earth above heaven
      depicts movement toward one another rather than separation. A cooperative interval is a chance
      to connect roles and resources, while remembering that easy access still needs regular
      maintenance. An open interval allows information to travel between positions that usually feel
      far apart; use that access to build a routine, not only to secure a single favor. The
      strongest channel is one people know how to repair when coordination becomes difficult again.
      In everyday terms, document a handover that currently works well. Try this emphasis: care for
      the channels that connect people.'
    advice:
      - Care for the channels that connect people
    do:
      - Check facts
    dont:
      - Rush commitments
    sources:
      - text: 泰，小往大来，吉亨。
        from: Zhouyi, hexagram 11 (Chinese source text)
      - text: 天地交泰，后以财成天地之道，辅相天地之宜，以左右民。
