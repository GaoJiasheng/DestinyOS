  zh:
    title: 临：主动靠近问题时
    summary: 主动靠近问题时，用理解替代单向指挥
    body: 主动靠近问题时，用理解替代单向指挥；你可以据此检查手头安排。本卦（这次起卦得到的主要情境图）为临卦；临以大地临近泽水讲接近与照看，有机会的人更需要了解现场。帮助不是包办，指导也不是单向命令；你可以多听实际困难，让对方保留尝试与反馈的空间。卦象上方是地，下方是泽，分别提示承载与落实与交流与悦纳；这是观察情境的比喻，不是事件预告。例如，带新人时先看一次真实操作再给建议，就能把这个角度用在可观察的安排上。建议约定双方都能参与的复盘；若现实信息不同，及时修正理解，不把象征当成行动命令。
    advice:
      - 约定双方都能参与的复盘
    do:
      - 核对事实
    dont:
      - 仓促承诺
    sources:
