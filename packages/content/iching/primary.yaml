  zh:
    title: 困：空间受限时
    summary: 空间受限时，保留可信的做法与必要的求助
    body: 空间受限时，保留可信的做法与必要的求助；你可以据此检查手头安排。本卦（这次起卦得到的主要情境图）为困卦；困以泽中水少讲资源与表达受限，越着急越容易感到没有出口。你可以承认眼前的限制，缩小不必要的消耗，用具体请求联系支持，避免把暂时困难变成对自我价值的判断。卦象上方是泽，下方是水，分别提示交流与悦纳与不确定中的通路；这是观察情境的比喻，不是事件预告。例如，忙到无余力时请求别人接手一个明确任务，就能把这个角度用在可观察的安排上。建议把有限精力留给核心需要；若现实信息不同，及时修正理解，不把象征当成行动命令。
    advice:
      - 把有限精力留给核心需要
    do:
      - 核对事实
    dont:
      - 仓促承诺
    sources:
      - text: 亨，贞，大人士口，无咎，有言口不信。
        from: 《周易》·困
      - text: 泽无水，困；君子以致命遂志。
        from: 《周易》象传·困
  en:
    title: Oppression
    summary: You can respond to a constrained period by conserving effort and making needs concrete
    body: 'You can respond to a constrained period by conserving effort and making needs concrete.
      Oppression is your primary hexagram (běn guà — the main figure cast for this question); water
      beneath a lake evokes reserves that are hard to access. Constraint can make persuasion
      ineffective, so a useful response protects essentials and asks for specific assistance rather
      than trying to prove everything at once. Restriction can make an appeal feel unheard even when
      help exists; narrow the request to a task someone can realistically take on and protect the
      essentials you still control. A difficult interval does not need to become a general verdict
      about your worth. In everyday terms, ask for help with one named responsibility. Try this
      emphasis: conserve capacity and make support actionable.'
    advice:
      - Conserve capacity and make support actionable
    do:
      - Check facts
    dont:
      - Rush commitments
    sources:
      - text: 亨，贞，大人士口，无咎，有言口不信。
        from: Zhouyi, hexagram 47 (Chinese source text)
      - text: 泽无水，困；君子以致命遂志。
