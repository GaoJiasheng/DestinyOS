  exclusive_with: []
  zh:
    title: 损：减少一部分
    summary: 减少一部分，可以让更重要的事情得到照顾
    body: 减少一部分，可以让更重要的事情得到照顾；你可以据此检查手头安排。本卦（这次起卦得到的主要情境图）为损卦；损以山下有泽讲资源有所减少，关键在于减什么、为谁而减、是否适量。真诚的小付出比超出承受能力的展示更可持续，也要留意付出是否得到尊重与合理分担。卦象上方是山，下方是泽，分别提示边界与止步与交流与悦纳；这是观察情境的比喻，不是事件预告。例如，时间紧张时减少可选会议，保留关键交流，就能把这个角度用在可观察的安排上。建议先确认底线再做让渡；若现实信息不同，及时修正理解，不把象征当成行动命令。
    advice:
      - 先确认底线再做让渡
    do:
      - 核对事实
    dont:
      - 仓促承诺
    sources:
      - text: 有孚，元吉，无咎，可贞，利有攸往。曷之？二簋可用享。
        from: 《周易》·损
      - text: 山下有泽，损；君子以惩忿窒欲。
        from: 《周易》象传·损
  en:
    title: Decrease
    summary: You can make a deliberate reduction that protects what matters most
    body:
      'You can make a deliberate reduction that protects what matters most. Decrease is your primary
      hexagram (běn guà — the main figure cast for this question); reduction is useful when its
      purpose and scale are clear. Mountain above lake suggests an exchange of capacity, inviting
      you to distinguish a thoughtful contribution from depletion that no one has discussed. A
      reduction needs a clear limit and purpose; ask what the contribution protects and whether the
      cost is shared fairly. A modest sincere offer can be easier to receive and maintain than a
      dramatic sacrifice that neither person can discuss comfortably. In everyday terms, cut an
      optional commitment to protect essential attention. Try this emphasis: reduce with a reason
      and a limit. Give this step a review point tied to the task itself, so you can notice what
      helped and what still needs another approach.'
    advice:
      - Reduce with a reason and a limit
    do:
      - Check facts
    dont:
      - Rush commitments
    sources:
      - text: 有孚，元吉，无咎，可贞，利有攸往。曷之？二簋可用享。
        from: Zhouyi, hexagram 41 (Chinese source text)
      - text: 山下有泽，损；君子以惩忿窒欲。
        from: Zhouyi, Image commentary 41 (Chinese source text)
