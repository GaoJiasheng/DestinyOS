  zh:
    title: 丰：事情集中显现时
    summary: 事情集中显现时，用清楚信息管理繁忙
    body: 事情集中显现时，用清楚信息管理繁忙；你可以据此检查手头安排。本卦（这次起卦得到的主要情境图）为丰卦；丰以雷与火讲行动与光亮一起达到高处，忙碌时信息也可能被遮挡。你可以利用可见的资源与伙伴，同时审视盲区，不把热闹当成每个环节都已准备充分。卦象上方是雷，下方是火，分别提示启动与回应与明晰与依托；这是观察情境的比喻，不是事件预告。例如，事项扎堆时建立一张真实进度表，就能把这个角度用在可观察的安排上。建议越繁忙越核查关键材料；若现实信息不同，及时修正理解，不把象征当成行动命令。
    advice:
      - 越繁忙越核查关键材料
    do:
      - 核对事实
    dont:
      - 仓促承诺
    sources:
      - text: 亨，王假之，勿忧，宣日中。
        from: 《周易》·丰
      - text: 雷电皆至，丰；君子以折狱致刑。
        from: 《周易》象传·丰
  en:
    title: Abundance
    summary: You can handle a period of intensity by checking what the bright surface conceals
    body:
      'You can handle a period of intensity by checking what the bright surface conceals. Abundance
      is your primary hexagram (běn guà — the main figure cast for this question); thunder over fire
      depicts a vivid, demanding interval. Intensity can produce opportunity and confusion together,
      making visibility, reliable collaborators, and a check for hidden gaps more useful than simply
      doing more. A busy bright scene can hide dependencies as easily as it reveals achievement;
      name what is ready, what is blocked, and who knows the missing information. Good coordination
      gives intensity a structure without assuming that a lively surface means every part is sound.
      In everyday terms, create a status board that reveals unresolved dependencies. Try this
      emphasis: make the busy picture legible.'
    advice:
      - Make the busy picture legible
    do:
      - Check facts
    dont:
      - Rush commitments
    sources:
      - text: 亨，王假之，勿忧，宣日中。
        from: Zhouyi, hexagram 55 (Chinese source text)
      - text: 雷电皆至，丰；君子以折狱致刑。
        from: Zhouyi, Image commentary 55 (Chinese source text)
