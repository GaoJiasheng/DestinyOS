  zh:
    title: 谦：低调表达实力
    summary: 低调表达实力，让贡献被看见而不过度占位
    body: 低调表达实力，让贡献被看见而不过度占位；你可以据此检查手头安排。本卦（这次起卦得到的主要情境图）为谦卦；谦以山藏于地的意象讲有高度却不张扬，重点是实力与位置相称。谦和不是否认努力，也不是接受不合理要求，而是让事实说话，给他人的贡献留空间。卦象上方是地，下方是山，分别提示承载与落实与边界与止步；这是观察情境的比喻，不是事件预告。例如，汇报成果时同时说清团队贡献与自己负责的部分，就能把这个角度用在可观察的安排上。建议用具体成果替代自夸；若现实信息不同，及时修正理解，不把象征当成行动命令。
    advice:
      - 用具体成果替代自夸
    do:
      - 核对事实
    dont:
      - 仓促承诺
    sources:
      - text: 亨，君子有终。
        from: 《周易》·谦
      - text: 地中有山，谦；君子以裒多益寡，称物平施。
        from: 《周易》象传·谦
  en:
    title: Modesty
    summary: You can make a strong contribution without making every exchange a contest for attention
    body: 'You can make a strong contribution without making every exchange a contest for attention.
      Modesty is your primary hexagram (běn guà — the main figure cast for this question); a
      mountain within earth suggests strength carried without display. Modesty can mean accurate
      self-assessment and fair credit, while still naming the effort and boundaries that make your
      contribution sustainable. You do not need to erase your achievements in order to be modest;
      describe them accurately, share credit precisely, and leave room for another person to
      contribute. A realistic account of strength is often calmer and more useful than either
      self-promotion or self-dismissal. In everyday terms, explain both your work and the help that
      supported it. Try this emphasis: give credit with precision.'
    advice:
      - Give credit with precision
    do:
      - Check facts
    dont:
      - Rush commitments
    sources:
      - text: 亨，君子有终。
        from: Zhouyi, hexagram 15 (Chinese source text)
      - text: 地中有山，谦；君子以裒多益寡，称物平施。
