  zh:
    title: 泰：沟通顺畅时
    summary: 沟通顺畅时，适合建立能长久维持的合作
    body: 沟通顺畅时，适合建立能长久维持的合作；你可以据此检查手头安排。本卦（这次起卦得到的主要情境图）为泰卦；泰讲天地之气相交，象征上下之间有机会交换需要与资源。顺畅的阶段也会变化，因此越容易推进，越值得把经验变成规则，不把眼前配合当成永远不用维护的默契。卦象上方是地，下方是天，分别提示承载与落实与开阔与主动；这是观察情境的比喻，不是事件预告。例如，项目顺利时记录成功的交接方法，就能把这个角度用在可观察的安排上。建议把顺畅经验变成日常习惯；若现实信息不同，及时修正理解，不把象征当成行动命令。
    advice:
      - 把顺畅经验变成日常习惯
    do:
      - 核对事实
    dont:
      - 仓促承诺
    sources:
