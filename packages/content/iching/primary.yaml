  en:
    title: The Wanderer
    summary: You can navigate an unfamiliar setting through practical preparation and respectful limits
    body:
      'You can navigate an unfamiliar setting through practical preparation and respectful limits.
      The Wanderer is your primary hexagram (běn guà — the main figure cast for this question); fire
      above mountain suggests a presence that does not settle permanently. In an unfamiliar setting,
      useful independence includes reliable shelter, needed resources, and respect for local
      expectations. A temporary base still deserves care; learn the setting’s expectations, secure
      what you need, and identify a person you can contact. Practical preparation leaves more space
      for exploration than trying to establish authority before you understand where you are. In
      everyday terms, check your contact person and return arrangements on arrival. Try this
      emphasis: establish a workable base before exploring. Give this step a review point tied to
      the task itself, so you can notice what helped and what still needs another approach.'
    advice:
      - Establish a workable base before exploring
    do:
      - Check facts
    dont:
