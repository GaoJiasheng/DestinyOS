    summary: 看法不同仍可在小事上找到合作入口
    body: 看法不同仍可在小事上找到合作入口；你可以据此检查手头安排。本卦（这次起卦得到的主要情境图）为睽卦；睽以火向上、泽向下讲方向不同，差异需要被识别而非急着消除。你可以找一个双方都认可的小目标，先建立局部合作，再决定更大的分歧是否适合继续讨论。卦象上方是火，下方是泽，分别提示明晰与依托与交流与悦纳；这是观察情境的比喻，不是事件预告。例如，意见分歧时先约定一个共同验收标准，就能把这个角度用在可观察的安排上。建议让合作范围与共识相称；若现实信息不同，及时修正理解，不把象征当成行动命令。
    advice:
      - 让合作范围与共识相称
    do:
      - 核对事实
    dont:
      - 仓促承诺
    sources:
      - text: 小事吉。
        from: 《周易》·睽
      - text: 上火下泽，睽；君子以同而异。
        from: 《周易》象传·睽
  en:
    title: Opposition
    summary: You can preserve useful contact without requiring complete agreement
    body: 'You can preserve useful contact without requiring complete agreement. Opposition is your
      primary hexagram (běn guà — the main figure cast for this question); fire and lake move in
      different directions in this image. Divergence does not eliminate every possible connection; a
      limited common task can work even when a broader agreement remains out of reach. A limited
      agreement can be useful without resolving every difference; define what the cooperation
      covers, where it ends, and how each person will recognize completion. This keeps the small
      shared task from silently turning into a contest about the whole relationship. In everyday
      terms, choose a small outcome both sides can recognize. Try this emphasis: start where your
      purposes still overlap. Give this step a review point tied to the task itself, so you can
      notice what helped and what still needs another approach.'
    advice:
      - Start where your purposes still overlap
    do:
      - Check facts
    dont:
      - Rush commitments
    sources:
      - text: 小事吉。
        from: Zhouyi, hexagram 38 (Chinese source text)
      - text: 上火下泽，睽；君子以同而异。
