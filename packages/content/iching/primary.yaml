  zh:
    title: 坎：面对反复的困难
    summary: 面对反复的困难，用稳定方法找到可走的一小段
    body: 面对反复的困难，用稳定方法找到可走的一小段；你可以据此检查手头安排。本卦（这次起卦得到的主要情境图）为坎卦；坎以重叠的水讲重复遇到阻碍，强调守住可信的做法而不是恐惧想象。水寻找能流动的地方，你也可以先辨認局部可行的路径，不急着一次解决所有未知。上下卦都是水，强调不确定中的通路的连续作用；这是观察情境的比喻，不是事件预告。例如，复杂任务先验证一个环节，再安排下一环，就能把这个角度用在可观察的安排上。建议为行动留下退出与求助方式；若现实信息不同，及时修正理解，不把象征当成行动命令。
    advice:
      - 为行动留下退出与求助方式
    do:
      - 核对事实
    dont:
      - 仓促承诺
    sources:
      - text: 有孚，维心亨，行有尚。
        from: 《周易》·坎
      - text: 水洊至，习坎；君子以常德行，习教事。
        from: 《周易》象传·坎
  en:
    title: The Abysmal
    summary: You can navigate uncertainty through careful routines and limited, observable steps
    body: 'You can navigate uncertainty through careful routines and limited, observable steps. The
      Abysmal is your primary hexagram (běn guà — the main figure cast for this question); water
      repeated suggests a passage with more than one difficult stretch. Consistency, honest
      communication, and small gains can give you a workable route without pretending that every
      obstacle has vanished. A reliable method matters most when the route contains repeated
      uncertainty; work with one section you can verify, keep communication honest, and record the
      point at which you will seek assistance. Small gains can prevent an unfamiliar passage from
      becoming entirely opaque. In everyday terms, test one uncertain dependency before committing
      the whole schedule. Try this emphasis: keep a practical route and a fallback.'
    advice:
      - Keep a practical route and a fallback
    do:
      - Check facts
    dont:
      - Rush commitments
    sources:
      - text: 有孚，维心亨，行有尚。
        from: Zhouyi, hexagram 29 (Chinese source text)
      - text: 水洊至，习坎；君子以常德行，习教事。
