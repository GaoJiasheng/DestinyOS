  zh:
    title: 节：适量的限制
    summary: 适量的限制，能让资源与关系更可持续
    body: 适量的限制，能让资源与关系更可持续；你可以据此检查手头安排。本卦（这次起卦得到的主要情境图）为节卦；节以泽上有水讲容量与尺度，规则帮助有限资源被合理使用。限制过严会失去弹性，完全没有边界又容易消耗；你可以与相关的人协商标准，让节制服务于实际生活。卦象上方是水，下方是泽，分别提示不确定中的通路与交流与悦纳；这是观察情境的比喻，不是事件预告。例如，给会议设定结束时间，也保留必要讨论入口，就能把这个角度用在可观察的安排上。建议定期检视规则是否仍合适；若现实信息不同，及时修正理解，不把象征当成行动命令。
    advice:
      - 定期检视规则是否仍合适
    do:
      - 核对事实
    dont:
      - 仓促承诺
    sources:
      - text: 亨，苦节，不可贞。
        from: 《周易》·节
      - text: 泽上有水，节；君子以制数度，议德行。
        from: 《周易》象传·节
  en:
    title: Limitation
    summary: You can set a workable limit that protects capacity without turning daily life rigid
    body: 'You can set a workable limit that protects capacity without turning daily life rigid.
      Limitation is your primary hexagram (běn guà — the main figure cast for this question); water
      above a lake highlights capacity and containment. Limits help when they are understandable and
      adjustable; excessive restriction can make the arrangement as difficult to maintain as no
      boundary at all. A usable boundary is neither endlessly negotiable nor needlessly harsh; give
      it a reason that people can understand and a review point that allows circumstances to change.
      Capacity is protected more effectively when the arrangement fits ordinary life. In everyday
      terms, set a meeting limit and a way to handle unfinished issues. Try this emphasis: make the
      boundary firm enough and humane enough.'
    advice:
      - Make the boundary firm enough and humane enough
    do:
      - Check facts
    dont:
      - Rush commitments
    sources:
      - text: 亨，苦节，不可贞。
        from: Zhouyi, hexagram 60 (Chinese source text)
      - text: 泽上有水，节；君子以制数度，议德行。
