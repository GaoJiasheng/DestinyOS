  en:
    title: Following
    summary: You can adapt to others without handing over responsibility for your choices
    body:
      'You can adapt to others without handing over responsibility for your choices. Following is
      your primary hexagram (běn guà — the main figure cast for this question); movement under an
      inviting lake suggests a responsive relationship. Following can be intelligent when you
      understand the direction, but comfort alone is a weak reason to abandon standards you
      previously chose. An attractive direction deserves examination as well as response; ask which
      principle makes it worth following and what would cause you to reconsider. Adapting
      intelligently means taking responsibility for the route, even when another person first
      proposed it. In everyday terms, try a proposed routine before making it your default. Try this
      emphasis: choose what deserves your attention. Give this step a review point tied to the task
      itself, so you can notice what helped and what still needs another approach.'
    advice:
      - Choose what deserves your attention
    do:
      - Check facts
    dont:
