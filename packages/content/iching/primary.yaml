  zh:
    title: 家人：日常关系靠清楚分工与反复兑现来维持
    summary: 日常关系靠清楚分工与反复兑现来维持
    body: 日常关系靠清楚分工与反复兑现来维持；你可以据此检查手头安排。本卦（这次起卦得到的主要情境图）为家人卦；家人以风从火出讲内在秩序向外形成影响，强调关系中的职责与言行一致。这里的角色可以协商，不按性别安排；把日常需求说清楚，往往比只靠感情猜测更有效。卦象上方是风，下方是火，分别提示沟通与渐入与明晰与依托；这是观察情境的比喻，不是事件预告。例如，共同生活先商量家务与安静时间，就能把这个角度用在可观察的安排上。建议把照顾落实到可见安排；若现实信息不同，及时修正理解，不把象征当成行动命令。
    advice:
      - 把照顾落实到可见安排
    do:
