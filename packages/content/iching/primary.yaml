  zh:
    title: 兑：交流带来轻松时
    summary: 交流带来轻松时，也要守住真诚与边界
    body: 交流带来轻松时，也要守住真诚与边界；你可以据此检查手头安排。本卦（这次起卦得到的主要情境图）为兑卦；兑以重叠的泽讲彼此分享与悦纳，好的气氛可以帮助信息流动。为了取悦而答应太多，可能让轻松变成负担；你可以把友善与清楚立场放在一起，让对话保持可信。上下卦都是泽，强调交流与悦纳的连续作用；这是观察情境的比喻，不是事件预告。例如，聚会中不方便答应的事可以温和说明，就能把这个角度用在可观察的安排上。建议让愉快建立在真实回应上；若现实信息不同，及时修正理解，不把象征当成行动命令。
    advice:
      - 让愉快建立在真实回应上
    do:
      - 核对事实
    dont:
      - 仓促承诺
    sources:
      - text: 亨，利、贞。
        from: 《周易》·兑
      - text: 丽泽，兑；君子以朋友讲习。
        from: 《周易》象传·兑
  en:
    title: The Joyous
    summary: You can enjoy a conversation while noticing whether it rests on honest exchange
    body:
      'You can enjoy a conversation while noticing whether it rests on honest exchange. The Joyous
      is your primary hexagram (běn guà — the main figure cast for this question); lakes joined
      suggest mutual refreshment through exchange. Enjoyment supports contact, but conversation
      remains sound when people can disagree, decline, and speak accurately without losing respect.
      A pleasant exchange can hold disagreement without collapsing; speak accurately, decline kindly
      when needed, and notice whether agreement is being purchased through overcommitment. Enjoyment
      is more dependable when people can keep their own judgment inside the conversation. In
      everyday terms, decline a request warmly when you cannot reasonably take it on. Try this
      emphasis: keep friendliness compatible with honest limits. Give this step a review point tied
      to the task itself, so you can notice what helped and what still needs another approach.'
    advice:
      - Keep friendliness compatible with honest limits
    do:
      - Check facts
    dont:
      - Rush commitments
    sources:
      - text: 亨，利、贞。
        from: Zhouyi, hexagram 58 (Chinese source text)
      - text: 丽泽，兑；君子以朋友讲习。
        from: Zhouyi, Image commentary 58 (Chinese source text)
