  zh:
    title: 晋：进展逐渐被看见时
    summary: 进展逐渐被看见时，继续保持清楚而可靠的做法
    body: 进展逐渐被看见时，继续保持清楚而可靠的做法；你可以据此检查手头安排。本卦（这次起卦得到的主要情境图）为晋卦；晋以日光出于地上讲显露与上升，机会可能来自成果被更多人看见。你可以主动展示进度，也要保持事实与承诺一致，避免为了维持亮眼形象而忽略尚待改进的部分。卦象上方是火，下方是地，分别提示明晰与依托与承载与落实；这是观察情境的比喻，不是事件预告。例如，阶段汇报同时展示成果和下一步困难，就能把这个角度用在可观察的安排上。建议用事实建立持续信任；若现实信息不同，及时修正理解，不把象征当成行动命令。
    advice:
      - 用事实建立持续信任
    do:
      - 核对事实
    dont:
      - 仓促承诺
    sources:
      - text: 康侯用锡马蕃庶，昼日三接。
        from: 《周易》·晋
      - text: 明出地上，晋；君子以自昭明德。
        from: 《周易》象传·晋
  en:
    title: Progress
    summary: You can welcome recognition while keeping attention on the work that earned it
    body:
      'You can welcome recognition while keeping attention on the work that earned it. Progress is
      your primary hexagram (běn guà — the main figure cast for this question); light rising over
      earth evokes work becoming visible. Recognition can widen access, but a sound next step rests
      on transparent progress and steady conduct rather than on protecting an impressive appearance.
      Making progress visible does not require hiding unfinished work; A transparent account lets
      someone offer relevant assistance and sets realistic expectations for the next stage. Treat
      recognition as an opening for useful contact rather than a demand to look successful
      continuously. In everyday terms, share a useful result together with the remaining work. Try
      this emphasis: let visibility follow the actual progress.'
    advice:
      - Let visibility follow the actual progress
    do:
      - Check facts
    dont:
      - Rush commitments
    sources:
      - text: 康侯用锡马蕃庶，昼日三接。
        from: Zhouyi, hexagram 35 (Chinese source text)
      - text: 明出地上，晋；君子以自昭明德。
