  zh:
    title: 蹇：道路受阻时
    summary: 道路受阻时，绕行与求助也是推进
    body: 道路受阻时，绕行与求助也是推进；你可以据此检查手头安排。本卦（这次起卦得到的主要情境图）为蹇卦；蹇以山前有水讲前进受到阻挡，辨认困难比重复撞向它更有帮助。暂停、回看、联系有经验的人，能够把困境变成可处理的问题；你不必把独自承受当作能力的证明。卦象上方是水，下方是山，分别提示不确定中的通路与边界与止步；这是观察情境的比喻，不是事件预告。例如，依赖迟迟不到时请熟悉流程的人一起找替代路径，就能把这个角度用在可观察的安排上。建议先识别障碍再安排下一步；若现实信息不同，及时修正理解，不把象征当成行动命令。
    advice:
      - 先识别障碍再安排下一步
    do:
      - 核对事实
    dont:
      - 仓促承诺
    sources:
      - text: 利西南，不利东北，利见大人，贞吉。
        from: 《周易》·蹇
      - text: 山上有水，蹇；君子以反身修德。
        from: 《周易》象传·蹇
  en:
    title: Obstruction
    summary: You can make progress by changing the route rather than insisting on a direct crossing
    body: 'You can make progress by changing the route rather than insisting on a direct crossing.
      Obstruction is your primary hexagram (běn guà — the main figure cast for this question); water
      before a mountain makes a direct route difficult. The useful question is where support and an
      alternative path exist, rather than how much effort you can spend on the same obstruction. A
      route change can begin by returning to a place where support exists; describe the obstacle
      clearly enough that someone experienced can help map alternatives. Seeking company is a
      practical response to terrain, not an admission that your effort lacks value. In everyday
      terms, ask someone experienced to help map another route. Try this emphasis: use support
      instead of isolation.'
    advice:
      - Use support instead of isolation
    do:
      - Check facts
    dont:
      - Rush commitments
    sources:
      - text: 利西南，不利东北，利见大人，贞吉。
        from: Zhouyi, hexagram 39 (Chinese source text)
      - text: 山上有水，蹇；君子以反身修德。
