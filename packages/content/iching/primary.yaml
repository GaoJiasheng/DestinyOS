    title: 离：清楚看见需要依靠什么
    summary: 清楚看见需要依靠什么，才能让热情持续
    body: 清楚看见需要依靠什么，才能让热情持续；你可以据此检查手头安排。本卦（这次起卦得到的主要情境图）为离卦；离以重叠的火讲明亮与依附，火需要合适的燃料，理解也需要可靠材料。你可以发挥表达与观察能力，同时照顾支持自己的条件，避免只靠一时兴奋维持全部进展。上下卦都是火，强调明晰与依托的连续作用；这是观察情境的比喻，不是事件预告。例如，准备展示时先核查材料与来源，就能把这个角度用在可观察的安排上。建议让表达建立在可靠信息上；若现实信息不同，及时修正理解，不把象征当成行动命令。
    advice:
      - 让表达建立在可靠信息上
    do:
      - 核对事实
    dont:
      - 仓促承诺
    sources:
      - text: 利贞，亨，畜牝牛，吉。
        from: 《周易》·离
      - text: 明两作离，大人以继明照于四方。
        from: 《周易》象传·离
  en:
    title: The Clinging
    summary: You can keep your attention useful by choosing sound supports for it
    body:
      'You can keep your attention useful by choosing sound supports for it. The Clinging is your
      primary hexagram (běn guà — the main figure cast for this question); fire illuminates but also
      depends on what sustains it. Repeated brightness points to attention, understanding, and
      relationships of support, making the quality of your inputs part of the reading. Attention is
      not sustained by intensity alone; choose reliable material and a pace at which you can inspect
      it. Good expression depends on what supports the insight, so checking a source can be as
      valuable as improving the way you present it. In everyday terms, check the source of a claim
      before presenting it confidently. Try this emphasis: choose what deserves sustained attention.
      Give this step a review point tied to the task itself, so you can notice what helped and what
      still needs another approach.'
    advice:
      - Choose what deserves sustained attention
    do:
      - Check facts
    dont:
      - Rush commitments
    sources:
