  zh:
    title: 归妹：位置或承诺不对等时
    summary: 位置或承诺不对等时，先讨论彼此能选择什么
    body: 位置或承诺不对等时，先讨论彼此能选择什么；你可以据此检查手头安排。本卦（这次起卦得到的主要情境图）为归妹卦；归妹用古代关系安排的意象讲进入一个已有结构时的位置问题。现代阅读不把任何性别安排为附属角色，也不催促成家；你可以核对承诺、权限与自愿程度，寻找更公平的参与方式。卦象上方是雷，下方是泽，分别提示启动与回应与交流与悦纳；这是观察情境的比喻，不是事件预告。例如，加入现有团队前先确认参与权与责任，就能把这个角度用在可观察的安排上。建议把不对等条件放到台面讨论；若现实信息不同，及时修正理解，不把象征当成行动命令。
    advice:
      - 把不对等条件放到台面讨论
    do:
      - 核对事实
    dont:
      - 仓促承诺
    sources:
      - text: 归妹，征凶，无攸利。
        from: 《周易》·归妹
      - text: 泽上有雷，归妹；君子以永终知敝。
        from: 《周易》象传·归妹
  en:
    title: The Marrying Maiden
    summary: You can examine an unequal arrangement without accepting that its terms are fixed
    body: 'You can examine an unequal arrangement without accepting that its terms are fixed. The
      Marrying Maiden is your primary hexagram (běn guà — the main figure cast for this question);
      this historical relationship image concerns entering an arrangement whose roles are already
      defined. A modern reading focuses on consent, unequal access, and negotiable terms, rather
      than prescribing anyone’s relationship status or gender role. A prearranged role may limit
      voice or access; examine whether the terms are voluntary, what can be negotiated, and which
      commitment is actually being requested. The historical image is a prompt to inspect fairness,
      not a rule about who should occupy a subordinate place. In everyday terms, clarify your say in
      decisions before joining an established group. Try this emphasis: ask whether participation is
      freely chosen.'
    advice:
      - Ask whether participation is freely chosen
    do:
      - Check facts
    dont:
      - Rush commitments
    sources:
      - text: 归妹，征凶，无攸利。
        from: Zhouyi, hexagram 54 (Chinese source text)
      - text: 泽上有雷，归妹；君子以永终知敝。
        from: Zhouyi, Image commentary 54 (Chinese source text)
