  exclusive_with: []
  zh:
    title: 艮：在合适的位置停一停
    summary: 在合适的位置停一停，能够重新看清方向
    body: 在合适的位置停一停，能够重新看清方向；你可以据此检查手头安排。本卦（这次起卦得到的主要情境图）为艮卦；艮以重叠的山讲停止与界限，停下并不是要求压住所有感受。你可以辨认什么已超出当天的承受范围，在行动与休息之间建立清楚边界，给判断留下安静的空间。上下卦都是山，强调边界与止步的连续作用；这是观察情境的比喻，不是事件预告。例如，讨论僵住时先约定暂停与重新开始的时间，就能把这个角度用在可观察的安排上。建议为休息设定可执行的边界；若现实信息不同，及时修正理解，不把象征当成行动命令。
    advice:
      - 为休息设定可执行的边界
    do:
      - 核对事实
    dont:
      - 仓促承诺
    sources:
      - text: 艮其背，不获其身，行其庭，不见其人，无咎。
        from: 《周易》·艮
      - text: 兼山，艮；君子以思不出其位。
        from: 《周易》象传·艮
  en:
    title: Keeping Still
    summary: You can pause deliberately and let a boundary protect your attention
    body:
      'You can pause deliberately and let a boundary protect your attention. Keeping Still is your
      primary hexagram (běn guà — the main figure cast for this question); mountains repeated offer
      an image of stillness and limits. A good pause is neither endless avoidance nor forced
      rigidity; it gives attention a place to settle and helps you recognize where your
      responsibility ends. A pause needs an understandable boundary and a way back to ordinary
      activity; choose what stops, why it stops, and when you will reconsider. Stillness is useful
      when it restores perspective rather than turning every feeling into something you must
      suppress. In everyday terms, pause a tense discussion and agree when to return. Try this
      emphasis: use a pause to recover perspective.'
    advice:
      - Use a pause to recover perspective
    do:
      - Check facts
    dont:
      - Rush commitments
    sources:
      - text: 艮其背，不获其身，行其庭，不见其人，无咎。
        from: Zhouyi, hexagram 52 (Chinese source text)
      - text: 兼山，艮；君子以思不出其位。
        from: Zhouyi, Image commentary 52 (Chinese source text)
