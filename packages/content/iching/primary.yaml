    body: 顺势调整时，仍需知道自己遵循的原则；你可以据此检查手头安排。本卦（这次起卦得到的主要情境图）为随卦；随讲雷动而泽悦，行动与回应之间需要互相协调。跟随可以是学习与合作，也可能变成对眼前便利的依赖；重点在于辨别你跟随什么，以及那是否仍服务于自己的目标。卦象上方是泽，下方是雷，分别提示交流与悦纳与启动与回应；这是观察情境的比喻，不是事件预告。例如，采用同事的新流程前先试做一轮，就能把这个角度用在可观察的安排上。建议定期核对方向是否合适；若现实信息不同，及时修正理解，不把象征当成行动命令。
