    eq: 7
  weight: 78
  polarity: neutral
  tags:
    - plain
    - hexagram.7
    - iching.clarity
  exclusive_with: []
  zh:
    title: 师：集体行动需要秩序
    summary: 集体行动需要秩序，也需要可信的负责人
    body: 集体行动需要秩序，也需要可信的负责人；你可以据此检查手头安排。本卦（这次起卦得到的主要情境图）为师卦；师借地中藏水的意象谈众人的力量，力量要靠清楚安排才能发挥。这里的纪律是共同理解做法与责任，并非要求无条件服从；选对负责人比单纯增加人数更关键。卦象上方是地，下方是水，分别提示承载与落实与不确定中的通路；这是观察情境的比喻，不是事件预告。例如，赶进度时列出负责人和交接顺序，就能把这个角度用在可观察的安排上。建议行动前核对目标与权限；若现实信息不同，及时修正理解，不把象征当成行动命令。
    advice:
      - 行动前核对目标与权限
    do:
      - 核对事实
    dont:
      - 仓促承诺
    sources:
      - text: 贞，丈人吉，无咎。
        from: 《周易》·师
      - text: 地中有水，师；君子以容民畜众。
        from: 《周易》象传·师
  en:
    title: The Army
    summary: You can coordinate demanding work by making responsibilities and limits visible
    body:
      'You can coordinate demanding work by making responsibilities and limits visible. The Army is
      your primary hexagram (běn guà — the main figure cast for this question); a group has reserves
      that an individual does not, but coordination is a separate skill. Water held within earth
      evokes resources gathered under a structure that must remain understandable and accountable.
      Organization should make responsibility easier to trace, not harder to question; A person
      leading a collective effort needs enough knowledge to coordinate and enough openness to hear a
      warning. Numbers alone cannot compensate for a confused chain of instructions. In everyday
      terms, name a coordinator and define each handover. Try this emphasis: keep the chain of
      responsibility clear. Give this step a review point tied to the task itself, so you can notice
      what helped and what still needs another approach.'
    advice:
      - Keep the chain of responsibility clear
    do:
      - Check facts
    dont:
      - Rush commitments
    sources:
      - text: 贞，丈人吉，无咎。
        from: Zhouyi, hexagram 7 (Chinese source text)
      - text: 地中有水，师；君子以容民畜众。
        from: Zhouyi, Image commentary 7 (Chinese source text)
  meta:
    author: t23-original-v1
    reviewed_by: null
    version: 1
    status: published
- id: iching.primary.hexagram_08
  system: iching
  section: hexagram
  topic: primary
  when:
    path: primary.number
