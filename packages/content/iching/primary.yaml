  zh:
    title: 观：先看清整体
    summary: 先看清整体，再决定该前进还是调整
    body: 先看清整体，再决定该前进还是调整；你可以据此检查手头安排。本卦（这次起卦得到的主要情境图）为观卦；观以风行地上讲从不同位置看见同一件事。观察既包括环境，也包括你自己的做法；材料不足时容易把局部当全貌，留出比较与反思的时间更有帮助。卦象上方是风，下方是地，分别提示沟通与渐入与承载与落实；这是观察情境的比喻，不是事件预告。例如，评价一项服务前分别听取使用者与执行者反馈，就能把这个角度用在可观察的安排上。建议把判断与观察记录分开；若现实信息不同，及时修正理解，不把象征当成行动命令。
    advice:
      - 把判断与观察记录分开
    do:
      - 核对事实
    dont:
      - 仓促承诺
    sources:
      - text: 盥而不荐，有孚颙若。
        from: 《周易》·观
      - text: 风行地上，观；先王以省方，观民设教。
        from: 《周易》象传·观
  en:
    title: Contemplation
    summary: You can improve a decision by observing patterns beyond the first impression
    body:
      'You can improve a decision by observing patterns beyond the first impression. Contemplation
      is your primary hexagram (běn guà — the main figure cast for this question); wind across earth
      provides an image of perspective spreading outward. Observation includes how you influence the
      scene, so a useful review compares viewpoints rather than merely watching other people. A view
      from one doorway can feel complete because its limits are invisible; compare what you saw with
      another person’s account and inspect your own contribution to the pattern. Observation works
      best when it changes the quality of the question you ask. In everyday terms, compare user
      experience with the team’s account of delivery. Try this emphasis: distinguish evidence from
      your interpretation. Give this step a review point tied to the task itself, so you can notice
      what helped and what still needs another approach.'
    advice:
      - Distinguish evidence from your interpretation
    do:
      - Check facts
    dont:
      - Rush commitments
    sources:
