        from: 《周易》·中孚
      - text: 泽上有风，中孚；君子以议狱缓死。
        from: 《周易》象传·中孚
  en:
    title: Inner Truth
    summary: You can make trust visible through reliable behavior and attentive listening
    body:
      'You can make trust visible through reliable behavior and attentive listening. Inner Truth is
      your primary hexagram (běn guà — the main figure cast for this question); wind over lake
      suggests an influence that is felt because something within is consistent. Trust develops
      through follow-through and responsive attention, rather than through repeated claims of
      sincerity. A promise becomes credible through its scale and the way it is kept; listen to
      doubts without requiring instant reassurance, and name delays before someone has to guess.
      Trust can coexist with reasonable checking; it need not depend on unquestioning acceptance. In
      everyday terms, keep a modest promise and acknowledge any delay. Try this emphasis: give trust
      observable grounds. Give this step a review point tied to the task itself, so you can notice
      what helped and what still needs another approach.'
    advice:
      - Give trust observable grounds
    do:
      - Check facts
    dont:
      - Rush commitments
    sources:
      - text: 豚鱼吉，利涉大川，利贞。
        from: Zhouyi, hexagram 61 (Chinese source text)
      - text: 泽上有风，中孚；君子以议狱缓死。
