    path: primary.number
    eq: 1
  weight: 78
  polarity: neutral
  tags:
    - plain
    - hexagram.1
    - iching.clarity
  exclusive_with: []
  zh:
    title: 乾：主动创造
    summary: 主动创造，持续练习，把力量用在可承担的目标上
    body: 主动创造，持续练习，把力量用在可承担的目标上；你可以据此检查手头安排。本卦（这次起卦得到的主要情境图）为乾卦；能力正在形成时先做准备，得到支持后再扩大影响，走到高处也要留意反馈。乾的六个位置呈现力量从潜藏到显露的过程，重点是行动与时机相配。上下卦都是天，强调开阔与主动的连续作用；这是观察情境的比喻，不是事件预告。例如，新项目先做样稿，再邀请同事评审，就能把这个角度用在可观察的安排上。建议给每一步设定检查点；若现实信息不同，及时修正理解，不把象征当成行动命令。
    advice:
      - 给每一步设定检查点
    do:
      - 核对事实
    dont:
      - 仓促承诺
    sources:
      - text: 元、亨、利、贞。
        from: 《周易》·乾
      - text: 天行健，君子以自强不息。
        from: 《周易》象传·乾
  en:
    title: The Creative
    summary: You have room to initiate, but leadership asks for practice as well as confidence
    body: 'You have room to initiate, but leadership asks for practice as well as confidence. The
      Creative is your primary hexagram (běn guà — the main figure cast for this question); a
      capable person can still move too early. The six dragon images trace how initiative develops,
      becomes visible, and eventually needs restraint. Initiative is not a demand to lead every
      room; some abilities need quiet development; others benefit from a guide who can see what you
      miss. When influence grows, invite criticism before your plans become difficult to interrupt.
      In everyday terms, test an idea privately before asking a team to follow it. Try this
      emphasis: make room for honest feedback. Give this step a review point tied to the task
      itself, so you can notice what helped and what still needs another approach.'
    advice:
      - Make room for honest feedback
    do:
      - Check facts
    dont:
      - Rush commitments
    sources:
      - text: 元、亨、利、贞。
        from: Zhouyi, hexagram 1 (Chinese source text)
      - text: 天行健，君子以自强不息。
        from: Zhouyi, Image commentary 1 (Chinese source text)
  meta:
    author: t23-original-v1
    reviewed_by: null
    version: 1
    status: published
- id: iching.primary.hexagram_02
  system: iching
  section: hexagram
  topic: primary
  when:
    path: primary.number
    eq: 2
  weight: 78
  polarity: neutral
  tags:
    - plain
    - hexagram.2
    - iching.clarity
  exclusive_with: []
  zh:
    title: 坤：承接现实需要
    summary: 承接现实需要，用可靠的配合建立自己的位置
    body: 承接现实需要，用可靠的配合建立自己的位置；你可以据此检查手头安排。本卦（这次起卦得到的主要情境图）为坤卦；坤以大地的承载讲接纳与落实，柔和并不等于没有立场。你可以把别人的构想变成日常可执行的安排，也要看清自己能提供什么，避免把所有责任都揽到身上。上下卦都是地，强调承载与落实的连续作用；这是观察情境的比喻，不是事件预告。例如，共同任务先分工，再约定求助方式，就能把这个角度用在可观察的安排上。建议支持别人也保留休息；若现实信息不同，及时修正理解，不把象征当成行动命令。
    advice:
      - 支持别人也保留休息
    do:
      - 核对事实
    dont:
      - 仓促承诺
    sources:
      - text: 元、亨、利牝马之贞。
        from: 《周易》·坤
      - text: 地势坤，君子以厚德载物。
        from: 《周易》象传·坤
  en:
    title: The Receptive
    summary: You can contribute through steadiness without surrendering your own judgment
    body:
      'You can contribute through steadiness without surrendering your own judgment. The Receptive
      is your primary hexagram (běn guà — the main figure cast for this question); receptivity works
      best when it is active and discerning. Here the earth image points to making plans usable,
      supporting shared work, and knowing what you can reasonably carry. A supporting role can hold
      considerable influence because it determines whether an idea reaches ordinary life; be clear
      about what you agree to carry. Dependable assistance includes the ability to decline demands
      that exceed the resources available. In everyday terms, agree on roles before volunteering for
      additional work. Try this emphasis: leave some capacity uncommitted. Give this step a review
      point tied to the task itself, so you can notice what helped and what still needs another
      approach.'
    advice:
      - Leave some capacity uncommitted
    do:
      - Check facts
    dont:
      - Rush commitments
    sources:
      - text: 元、亨、利牝马之贞。
        from: Zhouyi, hexagram 2 (Chinese source text)
      - text: 地势坤，君子以厚德载物。
        from: Zhouyi, Image commentary 2 (Chinese source text)
  meta:
    author: t23-original-v1
    reviewed_by: null
    version: 1
    status: published
- id: iching.primary.hexagram_03
  system: iching
  section: hexagram
  topic: primary
  when:
    path: primary.number
    eq: 3
  weight: 78
  polarity: neutral
  tags:
    - plain
    - hexagram.3
    - iching.clarity
  exclusive_with: []
  zh:
    title: 屯：起步不顺时
    summary: 起步不顺时，先把资源和伙伴组织起来
    body: 起步不顺时，先把资源和伙伴组织起来；你可以据此检查手头安排。本卦（这次起卦得到的主要情境图）为屯卦；屯讲新生事物尚未成形，雷的推动遇到水的阻碍，容易出现热情先于条件的情况。反复并不说明方向无价值，往往提示规则、资源与协作还需要搭建。卦象上方是水，下方是雷，分别提示不确定中的通路与启动与回应；这是观察情境的比喻，不是事件预告。例如，新团队先确认职责，不急着同时开多个任务，就能把这个角度用在可观察的安排上。建议把难题拆成先后步骤；若现实信息不同，及时修正理解，不把象征当成行动命令。
    advice:
      - 把难题拆成先后步骤
    do:
      - 核对事实
    dont:
      - 仓促承诺
    sources:
      - text: 元、亨、利、贞，勿用有攸往，利建侯。
        from: 《周易》·屯
      - text: 云，雷，屯；君子以经纶。
        from: 《周易》象传·屯
  en:
    title: Difficulty at the Beginning
    summary: You may need a workable foundation before an ambitious beginning can take shape
    body:
      'You may need a workable foundation before an ambitious beginning can take shape. Difficulty
      at the Beginning is your primary hexagram (běn guà — the main figure cast for this question);
      a beginning can contain real energy and real confusion at once. Thunder beneath water suggests
      that motion exists, while the route and support around it are still unsettled. Early confusion
      often concerns coordination more than motivation; A partner, a sequence of tasks, and an
      agreed place to begin can matter more than another ambitious proposal. Establishing these
      basics helps you distinguish a difficult beginning from a direction that needs changing. In
      everyday terms, give a new group one manageable assignment before expanding. Try this
      emphasis: build the first reliable foothold.'
    advice:
      - Build the first reliable foothold
    do:
      - Check facts
    dont:
      - Rush commitments
    sources:
      - text: 元、亨、利、贞，勿用有攸往，利建侯。
        from: Zhouyi, hexagram 3 (Chinese source text)
      - text: 云，雷，屯；君子以经纶。
        from: Zhouyi, Image commentary 3 (Chinese source text)
  meta:
    author: t23-original-v1
    reviewed_by: null
    version: 1
    status: published
- id: iching.primary.hexagram_04
  system: iching
  section: hexagram
  topic: primary
  when:
    path: primary.number
    eq: 4
  weight: 78
  polarity: neutral
  tags:
    - plain
    - hexagram.4
    - iching.clarity
  exclusive_with: []
  zh:
    title: 蒙：愿意承认未知
    summary: 愿意承认未知，学习才有明确入口
    body: 愿意承认未知，学习才有明确入口；你可以据此检查手头安排。本卦（这次起卦得到的主要情境图）为蒙卦；蒙把山下的水看作初学者尚未找到通路的状态。重要的是诚恳提问与持续练习，而不是反复索取让自己安心的结论；教与学都需要清楚的边界。卦象上方是山，下方是水，分别提示边界与止步与不确定中的通路；这是观察情境的比喻，不是事件预告。例如，学新技能时带着一次失败记录去请教，就能把这个角度用在可观察的安排上。建议先实践再复盘问题；若现实信息不同，及时修正理解，不把象征当成行动命令。
    advice:
      - 先实践再复盘问题
    do:
      - 核对事实
    dont:
      - 仓促承诺
    sources:
      - text: 亨，匪我求童蒙，童蒙求我。初筮告，再三渎，渎则不告，利贞。
        from: 《周易》·蒙
      - text: 山下出泉，蒙；君子以果行育德。
        from: 《周易》象传·蒙
  en:
    title: Youthful Folly
    summary: You can make progress by turning uncertainty into a question someone can actually answer
    body: 'You can make progress by turning uncertainty into a question someone can actually answer.
      Youthful Folly is your primary hexagram (běn guà — the main figure cast for this question);
      learning needs curiosity and a usable method. The mountain above water evokes a route that is
      not yet visible, so asking a focused question matters more than collecting reassuring
      opinions. A teacher cannot do the learner’s practice, and a learner should not have to guess
      what is being taught; bring an attempt rather than an unlimited request for certainty. A
      respectful learning relationship makes mistakes visible and gives them a next use. In everyday
      terms, bring a specific failed attempt to a mentor. Try this emphasis: ask for a method you
      can test.'
    advice:
      - Ask for a method you can test
    do:
      - Check facts
    dont:
      - Rush commitments
    sources:
      - text: 亨，匪我求童蒙，童蒙求我。初筮告，再三渎，渎则不告，利贞。
        from: Zhouyi, hexagram 4 (Chinese source text)
      - text: 山下出泉，蒙；君子以果行育德。
        from: Zhouyi, Image commentary 4 (Chinese source text)
  meta:
    author: t23-original-v1
    reviewed_by: null
    version: 1
    status: published
- id: iching.primary.hexagram_05
  system: iching
  section: hexagram
  topic: primary
  when:
    path: primary.number
    eq: 5
  weight: 78
  polarity: neutral
  tags:
    - plain
    - hexagram.5
    - iching.clarity
  exclusive_with: []
  zh:
    title: 需：等待条件成熟时
    summary: 等待条件成熟时，仍可照顾手头的准备
    body: 等待条件成熟时，仍可照顾手头的准备；你可以据此检查手头安排。本卦（这次起卦得到的主要情境图）为需卦；需讲有能力但前路尚有阻隔，天空下方的水并未提供直接通道。等待不是把事情搁置，而是保留余地、补齐信息，避免越急越靠近难以退出的位置。卦象上方是水，下方是天，分别提示不确定中的通路与开阔与主动；这是观察情境的比喻，不是事件预告。例如，等回复期间整理材料，而不是连续催问，就能把这个角度用在可观察的安排上。建议约定一次合适的跟进；若现实信息不同，及时修正理解，不把象征当成行动命令。
    advice:
      - 约定一次合适的跟进
    do:
      - 核对事实
    dont:
      - 仓促承诺
    sources:
      - text: 有孚，光亨贞吉，利涉大川。
        from: 《周易》·需
      - text: 云上于天，需；君子以饮食宴乐。
        from: 《周易》象传·需
  en:
    title: Waiting
    summary: You can wait productively by protecting your capacity and watching for a practical opening
    body:
      'You can wait productively by protecting your capacity and watching for a practical opening.
      Waiting is your primary hexagram (běn guà — the main figure cast for this question); strength
      does not remove every delay. Water above heaven places a capable impulse beneath an uncertain
      crossing, making preparation and distance from trouble useful forms of action. A delay becomes
      harder to bear when you repeatedly move closer to the obstruction just to feel active; set a
      follow-up interval and keep ordinary life supplied. Waiting with a plan preserves options that
      impatient pressure might close. In everyday terms, use a delayed reply to prepare the next
      useful document. Try this emphasis: set a sensible follow-up point. Give this step a review
      point tied to the task itself, so you can notice what helped and what still needs another
      approach.'
    advice:
      - Set a sensible follow-up point
    do:
      - Check facts
    dont:
      - Rush commitments
    sources:
      - text: 有孚，光亨贞吉，利涉大川。
        from: Zhouyi, hexagram 5 (Chinese source text)
      - text: 云上于天，需；君子以饮食宴乐。
        from: Zhouyi, Image commentary 5 (Chinese source text)
  meta:
    author: t23-original-v1
    reviewed_by: null
