      - text: 明入地中，明夷；君子以莅众，用晦而明。
        from: 《周易》象传·明夷
  en:
    title: Darkening of the Light
    summary: You can keep your inner clarity while choosing carefully what to reveal and when
    body:
      'You can keep your inner clarity while choosing carefully what to reveal and when. Darkening
      of the Light is your primary hexagram (běn guà — the main figure cast for this question);
      light within earth is still light, even when its expression is constrained. This image favors
      discretion, practical support, and preserving clear judgment during a setting that does not
      welcome openness. Discretion can be a deliberate practice rather than resignation; keep a
      clear private account, choose someone trustworthy to consult, and consider which setting would
      receive the concern constructively. Protecting attention and support can leave you better able
      to act later. In everyday terms, discuss a concern privately with someone trustworthy. Try
      this emphasis: keep clarity and seek a workable setting.'
    advice:
      - Keep clarity and seek a workable setting
    do:
      - Check facts
    dont:
      - Rush commitments
    sources:
      - text: 利艰贞。
        from: Zhouyi, hexagram 36 (Chinese source text)
      - text: 明入地中，明夷；君子以莅众，用晦而明。
