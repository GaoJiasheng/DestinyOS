        from: 《周易》·家人
      - text: 风自火出，家人；君子以言有物，而行有恒。
        from: 《周易》象传·家人
  en:
    title: The Family
    summary: You can improve a shared space by making care and responsibility discussable
    body:
      'You can improve a shared space by making care and responsibility discussable. The Family is
      your primary hexagram (běn guà — the main figure cast for this question); wind emerging from
      fire suggests the influence of repeated behavior in a shared space. Roles become useful when
      people can discuss them, revise them, and apply standards to themselves as well as to others.
      Daily agreements can become invisible until they stop working; make care, chores, and quiet
      time discussable, and avoid assuming that identity determines who should provide them. A
      shared space improves when expectations are mutual and people can ask for a revision. In
      everyday terms, agree on chores and quiet time in a shared home. Try this emphasis: make
      expectations mutual and revisable.'
    advice:
      - Make expectations mutual and revisable
    do:
      - Check facts
    dont:
      - Rush commitments
    sources:
      - text: 利女贞。
        from: Zhouyi, hexagram 37 (Chinese source text)
      - text: 风自火出，家人；君子以言有物，而行有恒。
