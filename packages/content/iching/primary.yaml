  zh:
    title: 无妄：诚实回应现实
    summary: 诚实回应现实，减少为求结果而多做的动作
    body: 诚实回应现实，减少为求结果而多做的动作；你可以据此检查手头安排。本卦（这次起卦得到的主要情境图）为无妄卦；无妄以天下雷动讲按真实条件行事，不把偶然都解释成个人意志的结果。用心做该做的事，同时接受有些变化并非你能控制，能帮助你减少猜测与多余干预。卦象上方是天，下方是雷，分别提示开阔与主动与启动与回应；这是观察情境的比喻，不是事件预告。例如，反馈迟到时先查流程，而不猜测别人动机，就能把这个角度用在可观察的安排上。建议把事实写清再采取行动；若现实信息不同，及时修正理解，不把象征当成行动命令。
    advice:
      - 把事实写清再采取行动
    do:
      - 核对事实
    dont:
      - 仓促承诺
    sources:
      - text: 元，亨，利，贞，其匪正有眚，不利有攸往。
        from: 《周易》·无妄
      - text: 天下雷行，物与无妄；先王以茂对时，育万物。
        from: 《周易》象传·无妄
  en:
    title: Innocence
    summary: You can act more clearly when you stop forcing events to match a preferred story
    body:
      'You can act more clearly when you stop forcing events to match a preferred story. Innocence
      is your primary hexagram (běn guà — the main figure cast for this question); thunder under
      heaven evokes activity that is not arranged for anyone’s convenience. A straightforward
      response attends to actual duties and evidence while allowing unexpected events to remain
      unexpected. A coincidence does not establish anyone’s intentions; distinguish a fact from the
      explanation you are tempted to attach to it, then choose the action appropriate to the fact.
      Straightforward conduct reduces the effort spent managing imagined causes. In everyday terms,
      check the process before inventing a reason for a delay. Try this emphasis: respond to what
      you can establish. Give this step a review point tied to the task itself, so you can notice
      what helped and what still needs another approach.'
    advice:
      - Respond to what you can establish
    do:
      - Check facts
    dont:
      - Rush commitments
    sources:
      - text: 元，亨，利，贞，其匪正有眚，不利有攸往。
        from: Zhouyi, hexagram 25 (Chinese source text)
      - text: 天下雷行，物与无妄；先王以茂对时，育万物。
        from: Zhouyi, Image commentary 25 (Chinese source text)
