        from: 《周易》象传·小畜
  en:
    title: The Taming Power of the Small
    summary: You can use a limited opening to refine the habits that support later progress
    body:
      'You can use a limited opening to refine the habits that support later progress. The Taming
      Power of the Small is your primary hexagram (běn guà — the main figure cast for this
      question); a light influence can shape conditions without settling everything at once. Wind
      above heaven points toward preparation, repeated adjustments, and reserves that have not yet
      become a larger release. A small reserve may consist of a checklist, a useful contact, or a
      repeated habit rather than a large store of resources; give these details a purpose.
      Preparation loses value if you keep collecting it without recognizing when a limited action
      has become possible. In everyday terms, improve a few recurring friction points before a broad
      launch. Try this emphasis: keep a record of incremental gains.'
    advice:
      - Keep a record of incremental gains
    do:
      - Check facts
    dont:
      - Rush commitments
