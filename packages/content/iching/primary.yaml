    summary: 基础松动时，优先保护仍然可靠的部分
    body: 基础松动时，优先保护仍然可靠的部分；你可以据此检查手头安排。本卦（这次起卦得到的主要情境图）为剥卦；剥以山依附于地讲支撑逐层减弱，适合辨认哪些部分已难以承重。收缩可以是一种负责的选择，先处理基础问题，比继续维持表面的完整更能保留以后调整的空间。卦象上方是山，下方是地，分别提示边界与止步与承载与落实；这是观察情境的比喻，不是事件预告。例如，人手减少时先保住核心服务，就能把这个角度用在可观察的安排上。建议及时修补最薄弱的环节；若现实信息不同，及时修正理解，不把象征当成行动命令。
    advice:
      - 及时修补最薄弱的环节
    do:
      - 核对事实
    dont:
      - 仓促承诺
    sources:
