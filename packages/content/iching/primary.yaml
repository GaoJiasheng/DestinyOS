  zh:
    title: 履：面对敏感场合
    summary: 面对敏感场合，真诚与分寸可以一起保留
    body: 面对敏感场合，真诚与分寸可以一起保留；你可以据此检查手头安排。本卦（这次起卦得到的主要情境图）为履卦；履用接近强大力量的意象谈行事方式，重点是知道环境规则与自己的能力。谨慎不是一味讨好，而是看清边界、讲清事实，避免把试探变成不必要的冒险。卦象上方是天，下方是泽，分别提示开阔与主动与交流与悦纳；这是观察情境的比喻，不是事件预告。例如，向资深同事提不同意见时准备证据和替代方案，就能把这个角度用在可观察的安排上。建议先观察再选择表达方式；若现实信息不同，及时修正理解，不把象征当成行动命令。
    advice:
      - 先观察再选择表达方式
    do:
      - 核对事实
    dont:
      - 仓促承诺
    sources:
      - text: 履虎尾，不咥人，亨。
        from: 《周易》·履
      - text: 上天下泽，履；君子以辨上下，安民志。
        from: 《周易》象传·履
  en:
    title: Treading
    summary: You can enter a demanding situation with care while staying clear about your purpose
    body: 'You can enter a demanding situation with care while staying clear about your purpose.
      Treading is your primary hexagram (běn guà — the main figure cast for this question); the
      image of careful steps near a tiger concerns proportion and awareness. A delicate encounter
      can go better when you understand expectations, notice your limits, and avoid confusing
      boldness with readiness. Careful conduct begins with an accurate account of your abilities;
      learn what the setting expects, then state your concern without disguising uncertainty as
      bravado. Respect can make room for a firm request, particularly when your proposed alternative
      is usable. In everyday terms, bring evidence and an alternative when challenging an
      established practice. Try this emphasis: match your approach to the setting.'
    advice:
      - Match your approach to the setting
    do:
      - Check facts
    dont:
      - Rush commitments
    sources:
      - text: 履虎尾，不咥人，亨。
        from: Zhouyi, hexagram 10 (Chinese source text)
      - text: 上天下泽，履；君子以辨上下，安民志。
