  zh:
    title: 明夷：表达受限时
    summary: 表达受限时，先保护判断与可持续的行动
    body: 表达受限时，先保护判断与可持续的行动；你可以据此检查手头安排。本卦（这次起卦得到的主要情境图）为明夷卦；明夷以光进入地中讲明亮暂时被遮住，不等于看见的东西失去意义。你可以减少不必要的暴露，保留记录与可信联系，寻找合适场合表达，而不是把所有压力都独自承受。卦象上方是地，下方是火，分别提示承载与落实与明晰与依托；这是观察情境的比喻，不是事件预告。例如，不适合公开讨论时先向可信的人整理事实，就能把这个角度用在可观察的安排上。建议选择能保护自己的表达场合；若现实信息不同，及时修正理解，不把象征当成行动命令。
    advice:
