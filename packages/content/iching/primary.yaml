      - text: 天下有山，遯；君子以远小人，不恶而严。
        from: 《周易》象传·遯
  en:
    title: Retreat
    summary: You can step back deliberately when continued engagement is narrowing your options
    body:
      'You can step back deliberately when continued engagement is narrowing your options. Retreat
      is your primary hexagram (běn guà — the main figure cast for this question); heaven moving
      away from mountain offers a picture of separation with purpose. Withdrawal can preserve
      integrity and capacity when a situation is no longer responsive to constructive effort.
      Departure becomes clearer when it includes practical terms; say what you can finish, what
      needs a handover, and how contact will work afterward. A chosen distance can protect attention
      while avoiding the extra struggle of making someone agree with your decision. In everyday
      terms, plan an orderly handover when a collaboration no longer fits. Try this emphasis: choose
      distance before resentment grows. Give this step a review point tied to the task itself, so
      you can notice what helped and what still needs another approach.'
    advice:
      - Choose distance before resentment grows
    do:
      - Check facts
    dont:
      - Rush commitments
