  en:
    title: Before Completion
    summary: You can continue an unfinished transition by coordinating the next step carefully
    body: 'You can continue an unfinished transition by coordinating the next step carefully. Before
      Completion is your primary hexagram (běn guà — the main figure cast for this question); fire
      above water presents elements that have not yet settled into a useful exchange. Being near the
      end of a passage does not remove its demands, so coordination and a realistic next step remain
      valuable. Near-completion can create a misleading sense that the remaining steps no longer
      need coordination; inspect the final dependency and agree on the order of the handover. An
      unfinished passage can be approached patiently without turning the delay into a story of
      personal inadequacy. In everyday terms, verify the final dependency before calling a
      transition complete. Try this emphasis: finish through coordination rather than anticipation.'
    advice:
      - Finish through coordination rather than anticipation
    do:
      - Check facts
    dont:
      - Rush commitments
