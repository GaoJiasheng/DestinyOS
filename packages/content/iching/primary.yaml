  exclusive_with: []
  zh:
    title: 震：突然变化带来紧张时
    summary: 突然变化带来紧张时，先恢复基本秩序
    body: 突然变化带来紧张时，先恢复基本秩序；你可以据此检查手头安排。本卦（这次起卦得到的主要情境图）为震卦；震以重复的雷讲突然被唤起，最初的紧张可以转成清醒的回应。你不必立刻作出所有决定，先核对事实、维持基本安排，再区分需要马上处理的事与可以稍后评估的事。上下卦都是雷，强调启动与回应的连续作用；这是观察情境的比喻，不是事件预告。例如，计划突变后先列出当天最必要的两件事，就能把这个角度用在可观察的安排上。建议先稳住节奏再判断影响；若现实信息不同，及时修正理解，不把象征当成行动命令。
    advice:
      - 先稳住节奏再判断影响
    do:
      - 核对事实
    dont:
      - 仓促承诺
    sources:
      - text: 亨。震来虩虩，笑言哑哑。震惊百里，不丧匕鬯。
        from: 《周易》·震
      - text: 虩雷，震；君子以恐惧修身。
        from: 《周易》象传·震
  en:
    title: The Arousing
    summary: You can steady yourself after a surprise by returning to the next clear action
    body:
      'You can steady yourself after a surprise by returning to the next clear action. The Arousing
      is your primary hexagram (běn guà — the main figure cast for this question); repeated thunder
      represents an interruption that catches attention. A startled response can become useful
      awareness when you regain orientation, check what actually changed, and keep essential duties
      within reach. A surprise can widen attention or scatter it; check the facts, restore the
      essential sequence, and delay decisions that do not need an immediate answer. You can learn
      from the interruption while refusing to let its first emotional intensity set the whole
      agenda. In everyday terms, after a disruption, identify the next essential action. Try this
      emphasis: regain orientation before adding commitments.'
    advice:
      - Regain orientation before adding commitments
    do:
      - Check facts
    dont:
      - Rush commitments
    sources:
      - text: 亨。震来虩虩，笑言哑哑。震惊百里，不丧匕鬯。
        from: Zhouyi, hexagram 51 (Chinese source text)
      - text: 虩雷，震；君子以恐惧修身。
        from: Zhouyi, Image commentary 51 (Chinese source text)
