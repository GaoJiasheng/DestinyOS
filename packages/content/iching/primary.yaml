  weight: 78
  polarity: neutral
  tags:
    - plain
    - hexagram.8
    - iching.clarity
  exclusive_with: []
  zh:
    title: 比：寻找同行者时
    summary: 寻找同行者时，看长期可信度而非一时热闹
    body: 寻找同行者时，看长期可信度而非一时热闹；你可以据此检查手头安排。本卦（这次起卦得到的主要情境图）为比卦；比以水与地相亲的意象谈连接，合作的价值来自彼此愿意回应。亲近不必取消筛选，也不必为了融入而违背自己的原则；稳定的小圈子往往比表面的广泛关系更有用。卦象上方是水，下方是地，分别提示不确定中的通路与承载与落实；这是观察情境的比喻，不是事件预告。例如，邀请两位可靠伙伴定期交流进展，就能把这个角度用在可观察的安排上。建议先说明你能给出的支持；若现实信息不同，及时修正理解，不把象征当成行动命令。
    advice:
      - 先说明你能给出的支持
    do:
      - 核对事实
    dont:
      - 仓促承诺
    sources:
      - text: 吉，原筮，元永贞，无咎。不宁方来，后夫凶。
        from: 《周易》·比
      - text: 地上有水，比；先王以建万国，亲诸侯。
        from: 《周易》象传·比
  en:
    title: Holding Together
    summary: You can build belonging around reciprocal care and a purpose people understand
    body: 'You can build belonging around reciprocal care and a purpose people understand. Holding
      Together is your primary hexagram (běn guà — the main figure cast for this question);
      connection becomes useful when people know why they are together. Water over earth suggests
      closeness and shared access, but a sound alliance still needs consent, reliability, and room
      to choose. Belonging can be renewed through ordinary reciprocal acts; notice who listens, who
      follows through, and who makes participation voluntary. A bond does not improve merely by
      becoming tighter; it improves when people have a sound reason to remain connected. In everyday
      terms, start a small check-in with people who keep commitments. Try this emphasis: build trust
      through modest promises. Give this step a review point tied to the task itself, so you can
      notice what helped and what still needs another approach.'
    advice:
      - Build trust through modest promises
    do:
      - Check facts
    dont:
      - Rush commitments
    sources:
      - text: 吉，原筮，元永贞，无咎。不宁方来，后夫凶。
        from: Zhouyi, hexagram 8 (Chinese source text)
      - text: 地上有水，比；先王以建万国，亲诸侯。
        from: Zhouyi, Image commentary 8 (Chinese source text)
  meta:
    author: t23-original-v1
