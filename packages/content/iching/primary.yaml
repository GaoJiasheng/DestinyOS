  zh:
    title: 贲：表达可以更美
    summary: 表达可以更美，但内容仍需经得起使用
    body: 表达可以更美，但内容仍需经得起使用；你可以据此检查手头安排。本卦（这次起卦得到的主要情境图）为贲卦；贲以山下有火讲光照在外形上，让事物更容易被理解。修饰能够帮助沟通，却不能替代实际内容；你可以让形式配合用途，而不是为了好看增加不必要的复杂度。卦象上方是山，下方是火，分别提示边界与止步与明晰与依托；这是观察情境的比喻，不是事件预告。例如，做简报时删去不帮助理解的装饰，就能把这个角度用在可观察的安排上。建议先整理内容再调整外观；若现实信息不同，及时修正理解，不把象征当成行动命令。
    advice:
