  zh:
    title: 恒：长期坚持需要稳定方向
    summary: 长期坚持需要稳定方向，也需要及时调节做法
    body: 长期坚持需要稳定方向，也需要及时调节做法；你可以据此检查手头安排。本卦（这次起卦得到的主要情境图）为恒卦；恒以雷风相与讲连续的运动，持久并不是永远用同一种办法。你可以保留核心目标，根据环境调整频率与分工，让坚持成为能被生活承接的习惯，而不是对自己不断加码。卦象上方是雷，下方是风，分别提示启动与回应与沟通与渐入；这是观察情境的比喻，不是事件预告。例如，每周固定复盘，但按实际精力调整任务量，就能把这个角度用在可观察的安排上。建议给长期计划安排修订机会；若现实信息不同，及时修正理解，不把象征当成行动命令。
    advice:
      - 给长期计划安排修订机会
    do:
      - 核对事实
    dont:
      - 仓促承诺
    sources:
      - text: 亨，无咎，利贞，利有攸往。
        from: 《周易》·恒
      - text: 雷风，恒；君子以立不易方。
        from: 《周易》象传·恒
  en:
    title: Duration
    summary: You can maintain commitment without freezing every method in place
    body:
      'You can maintain commitment without freezing every method in place. Duration is your primary
      hexagram (běn guà — the main figure cast for this question); thunder and wind sustain movement
      through interaction. Duration comes from a recognizable direction and repeatable arrangements,
      while a rigid technique may become unsuitable as circumstances change. A lasting purpose can
      survive a revised schedule; discuss which parts of the arrangement need to remain recognizable
      and which can change as capacity shifts. Persistence is most useful when people can repeat it
      without treating every adjustment as a failure of commitment. In everyday terms, keep a weekly
      review while varying the workload. Try this emphasis: maintain the purpose and revisit the
      method. Give this step a review point tied to the task itself, so you can notice what helped
      and what still needs another approach.'
    advice:
      - Maintain the purpose and revisit the method
    do:
      - Check facts
    dont:
      - Rush commitments
    sources:
      - text: 亨，无咎，利贞，利有攸往。
        from: Zhouyi, hexagram 32 (Chinese source text)
      - text: 雷风，恒；君子以立不易方。
