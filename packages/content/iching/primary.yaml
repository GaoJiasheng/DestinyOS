  zh:
    title: 复：小小的回转值得珍惜
    summary: 小小的回转值得珍惜，不必立刻恢复全部速度
    body: 小小的回转值得珍惜，不必立刻恢复全部速度；你可以据此检查手头安排。本卦（这次起卦得到的主要情境图）为复卦；复以地中有雷讲生机重新出现，但初起的力量仍然细小。你可以回到曾经有效的基本习惯，给调整留出缓冲，而不是把一次好转理解成已经准备好承担所有任务。卦象上方是地，下方是雷，分别提示承载与落实与启动与回应；这是观察情境的比喻，不是事件预告。例如，停了一阵的学习先恢复每天十分钟，就能把这个角度用在可观察的安排上。建议为重新开始保留余地；若现实信息不同，及时修正理解，不把象征当成行动命令。
    advice:
      - 为重新开始保留余地
    do:
      - 核对事实
    dont:
      - 仓促承诺
    sources:
      - text: 亨，出入无疾，朋来无咎。
        from: 《周易》·复
      - text: 雷在地中，复；先王以至日闭关，商旅不行，后不省方。
        from: 《周易》象传·复
  en:
    title: Return
    summary: You can treat a return of energy as a beginning that needs room to grow
    body: 'You can treat a return of energy as a beginning that needs room to grow. Return is your
      primary hexagram (běn guà — the main figure cast for this question); thunder within earth
      suggests movement returning before it is obvious outside. A renewed possibility benefits from
      protection and repetition, especially when you are rebuilding a routine after interruption. A
      return often begins below the level other people can see; give a restored habit a small
      repeatable shape and avoid using one good day as proof that full capacity is back. Renewal has
      a better foothold when it is allowed ordinary time. In everyday terms, resume a paused
      practice at a size you can repeat. Try this emphasis: notice and support a modest return.'
    advice:
      - Notice and support a modest return
    do:
      - Check facts
    dont:
      - Rush commitments
