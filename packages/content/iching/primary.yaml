  zh:
    title: 大畜：储备能力
    summary: 储备能力，也练习何时使用能力
    body: 储备能力，也练习何时使用能力；你可以据此检查手头安排。本卦（这次起卦得到的主要情境图）为大畜卦；大畜以山中藏天的意象讲较大的积累与约束，力量越足越需要用途与规则。学习、练习和经验整理能够成为储备，但不要把准备变成永不行动的理由。卦象上方是山，下方是天，分别提示边界与止步与开阔与主动；这是观察情境的比喻，不是事件预告。例如，承担新职责前做一次完整演练，就能把这个角度用在可观察的安排上。建议为准备设定实际出口；若现实信息不同，及时修正理解，不把象征当成行动命令。
    advice:
      - 为准备设定实际出口
    do:
      - 核对事实
    dont:
      - 仓促承诺
    sources:
      - text: 利贞，不家食，吉，利涉大川。
        from: 《周易》·大畜
      - text: 天在山中，大畜；君子以多识前言往行，以畜其德。
        from: 《周易》象传·大畜
  en:
    title: The Taming Power of the Great
    summary: You can prepare for a larger responsibility by developing judgment alongside skill
    body: 'You can prepare for a larger responsibility by developing judgment alongside skill. The
      Taming Power of the Great is your primary hexagram (běn guà — the main figure cast for this
      question); heaven within a mountain suggests considerable energy held and trained. Preparation
      becomes valuable when it includes limits, judgment, and a future use rather than simply
      collecting more credentials. Skill becomes more useful when it includes the judgment to pause;
      A complete rehearsal reveals dependencies that isolated practice misses. Prepare for the
      larger role by learning both how to move and what needs to hold before movement begins. In
      everyday terms, rehearse the whole task before accepting a larger role. Try this emphasis:
      turn accumulated skill into a usable plan.'
    advice:
      - Turn accumulated skill into a usable plan
    do:
      - Check facts
    dont:
      - Rush commitments
    sources:
      - text: 利贞，不家食，吉，利涉大川。
        from: Zhouyi, hexagram 26 (Chinese source text)
      - text: 天在山中，大畜；君子以多识前言往行，以畜其德。
        from: Zhouyi, Image commentary 26 (Chinese source text)
