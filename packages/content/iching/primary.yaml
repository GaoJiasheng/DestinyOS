  zh:
    title: 鼎：把原料转成成果
    summary: 把原料转成成果，需要可靠的结构与协作
    body: 把原料转成成果，需要可靠的结构与协作；你可以据此检查手头安排。本卦（这次起卦得到的主要情境图）为鼎卦；鼎以木生火、器物烹调的意象讲转化与承载，成果依赖材料、工具与人的配合。你可以整理工作结构、提高交接质量，使经验成为可分享的成果；器具不稳时先修承载，不急着加料。卦象上方是火，下方是风，分别提示明晰与依托与沟通与渐入；这是观察情境的比喻，不是事件预告。例如，培训内容先整理成可用步骤再交给新人，就能把这个角度用在可观察的安排上。建议先稳住结构再扩大产出；若现实信息不同，及时修正理解，不把象征当成行动命令。
    advice:
      - 先稳住结构再扩大产出
    do:
      - 核对事实
    dont:
      - 仓促承诺
    sources:
      - text: 元吉、亨。
        from: 《周易》·鼎
      - text: 木上有火，鼎；君子以正位凝命。
        from: 《周易》象传·鼎
  en:
    title: The Cauldron
    summary: You can improve an outcome by caring for the vessel that makes useful transformation possible
    body: 'You can improve an outcome by caring for the vessel that makes useful transformation
      possible. The Cauldron is your primary hexagram (běn guà — the main figure cast for this
      question); wood feeding fire and the cooking vessel evoke purposeful transformation. Good
      ingredients need a sound container and skilled coordination, making systems and shared
      responsibility part of the quality of the result. Transformation requires a container: roles,
      tools, and handovers that hold the work together; inspect the points where good material is
      lost or becomes unusable. Improving that structure can make shared expertise more valuable
      without demanding more input from everyone. In everyday terms, turn expertise into a sequence
      another person can use. Try this emphasis: care for the process that carries the result.'
    advice:
      - Care for the process that carries the result
    do:
      - Check facts
    dont:
      - Rush commitments
    sources:
      - text: 元吉、亨。
        from: Zhouyi, hexagram 50 (Chinese source text)
      - text: 木上有火，鼎；君子以正位凝命。
        from: Zhouyi, Image commentary 50 (Chinese source text)
