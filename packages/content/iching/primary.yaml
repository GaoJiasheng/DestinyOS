        from: 《周易》·噬嗑
      - text: 雷电噬嗑；先王以明罚敕法。
        from: 《周易》象传·噬嗑
  en:
    title: Biting Through
    summary: You can remove friction by identifying the exact issue and agreeing on a proportionate response
    body: 'You can remove friction by identifying the exact issue and agreeing on a proportionate
      response. Biting Through is your primary hexagram (běn guà — the main figure cast for this
      question); a blockage between the teeth makes normal movement difficult. Thunder and fire
      frame a need for clarity and a measured response, so the practical task is to identify what
      prevents cooperation. A named obstruction can be addressed, while a vague atmosphere of blame
      tends to spread; identify the requirement that is not being met and a measured way to correct
      it. Keep the response tied to evidence instead of escalating its severity to express
      frustration. In everyday terms, locate the requirement behind repeated revisions. Try this
      emphasis: respond to the obstruction you can verify.'
    advice:
      - Respond to the obstruction you can verify
    do:
      - Check facts
    dont:
      - Rush commitments
    sources:
      - text: 亨，利用狱。
        from: Zhouyi, hexagram 21 (Chinese source text)
      - text: 雷电噬嗑；先王以明罚敕法。
