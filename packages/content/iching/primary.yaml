  exclusive_with: []
  zh:
    title: 革：改变旧安排时
    summary: 改变旧安排时，让理由与准备先于声势
    body: 改变旧安排时，让理由与准备先于声势；你可以据此检查手头安排。本卦（这次起卦得到的主要情境图）为革卦；革以泽中有火讲旧结构与新力量之间的张力，变化需要条件与认可。你可以说明为什么改、怎样改、改后如何检查，让参与者逐步理解；追求变化本身容易忽略使用者的承受范围。卦象上方是泽，下方是火，分别提示交流与悦纳与明晰与依托；这是观察情境的比喻，不是事件预告。例如，调整流程前展示旧问题与小规模试验结果，就能把这个角度用在可观察的安排上。建议为变化安排沟通和复查；若现实信息不同，及时修正理解，不把象征当成行动命令。
    advice:
      - 为变化安排沟通和复查
    do:
      - 核对事实
    dont:
      - 仓促承诺
    sources:
      - text: 巳日乃孚，元亨利贞，悔亡。
        from: 《周易》·革
      - text: 泽中有火，革；君子以治历明时。
        from: 《周易》象传·革
  en:
    title: Revolution
    summary: You can make a necessary change credible through evidence, preparation, and participation
    body:
      'You can make a necessary change credible through evidence, preparation, and participation.
      Revolution is your primary hexagram (běn guà — the main figure cast for this question); fire
      within a lake depicts forces that cannot remain unchanged indefinitely. Reform gains
      credibility when people can see the reason, preparation, and follow-through, rather than being
      asked to trust excitement alone. People need time to see what a change solves; show the
      repeated problem, test an alternative, and explain how the result will be checked. Credibility
      grows when the new practice makes ordinary work easier instead of simply announcing a break
      with the past. In everyday terms, show the problem and a pilot result before replacing a
      routine. Try this emphasis: make the change understandable before expanding it.'
    advice:
      - Make the change understandable before expanding it
    do:
      - Check facts
    dont:
      - Rush commitments
    sources:
      - text: 巳日乃孚，元亨利贞，悔亡。
        from: Zhouyi, hexagram 49 (Chinese source text)
      - text: 泽中有火，革；君子以治历明时。
        from: Zhouyi, Image commentary 49 (Chinese source text)
