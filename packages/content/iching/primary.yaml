  exclusive_with: []
  zh:
    title: 夬：该说清的事可以坚定表达
    summary: 该说清的事可以坚定表达，也要避免情绪升级
    body: 该说清的事可以坚定表达，也要避免情绪升级；你可以据此检查手头安排。本卦（这次起卦得到的主要情境图）为夬卦；夬以泽上于天讲积累的压力需要出口，适合公开说明待处理的问题。坚定不是逼迫对方立刻接受，而是拿出事实、提出边界与可执行方案，防止一时激烈变成新的阻碍。卦象上方是泽，下方是天，分别提示交流与悦纳与开阔与主动；这是观察情境的比喻，不是事件预告。例如，反复变更范围时发起一次明确的范围讨论，就能把这个角度用在可观察的安排上。建议把要求说清并留出回应；若现实信息不同，及时修正理解，不把象征当成行动命令。
    advice:
      - 把要求说清并留出回应
    do:
      - 核对事实
    dont:
      - 仓促承诺
    sources:
      - text: 扬于王庭，孚号，有厉。
        from: 《周易》·夬
      - text: 泽上于天，夬；君子以施禄及下，居德则忌。
        from: 《周易》象传·夬
  en:
    title: Break-through
    summary: You can be decisive about a problem while keeping the response open and proportionate
    body: 'You can be decisive about a problem while keeping the response open and proportionate.
      Break-through is your primary hexagram (běn guà — the main figure cast for this question);
      lake above heaven suggests pressure reaching a point that needs expression. Resolution
      benefits from a clear statement and accountable process, while impulsive confrontation can
      obscure the issue you intended to address. A clear public statement should help others
      understand the concern rather than corner them into an instant reply; name the boundary, the
      evidence, and the review process. Decisiveness can remain calm when a workable response has
      somewhere to go. In everyday terms, state the scope problem and propose a review. Try this
      emphasis: pair firmness with a usable process. Give this step a review point tied to the task
      itself, so you can notice what helped and what still needs another approach.'
    advice:
      - Pair firmness with a usable process
    do:
      - Check facts
    dont:
      - Rush commitments
    sources:
      - text: 扬于王庭，孚号，有厉。
        from: Zhouyi, hexagram 43 (Chinese source text)
      - text: 泽上于天，夬；君子以施禄及下，居德则忌。
        from: Zhouyi, Image commentary 43 (Chinese source text)
