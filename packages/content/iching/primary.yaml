  zh:
    title: 萃：把人聚在一起
    summary: 把人聚在一起，也要让目标与秩序聚在一起
    body: 把人聚在一起，也要让目标与秩序聚在一起；你可以据此检查手头安排。本卦（这次起卦得到的主要情境图）为萃卦；萃以泽水聚于地上讲众人的集中，人数多并不自动带来合力。你可以明确共同目标、参与方式与主持责任，让聚集形成交流；对暂时不被理解的人，也留出说话的位置。卦象上方是泽，下方是地，分别提示交流与悦纳与承载与落实；这是观察情境的比喻，不是事件预告。例如，组织讨论时先发出议题和预期产出，就能把这个角度用在可观察的安排上。建议为参与者安排清楚入口；若现实信息不同，及时修正理解，不把象征当成行动命令。
    advice:
      - 为参与者安排清楚入口
    do:
      - 核对事实
    dont:
      - 仓促承诺
    sources:
      - text: 亨，王假有庙。利见大人，亨，利贞。用大牲吉，利有攸往。
        from: 《周易》·萃
      - text: 泽上于地，萃；君子以除戎器，戒不虞。
        from: 《周易》象传·萃
  en:
    title: Gathering Together
    summary: You can make a gathering useful by giving people a clear reason and a way to contribute
    body: 'You can make a gathering useful by giving people a clear reason and a way to contribute.
      Gathering Together is your primary hexagram (běn guà — the main figure cast for this
      question); a lake over earth evokes resources and people gathering. A worthwhile group needs a
      recognizable purpose, accessible participation, and coordination that makes it easier to
      contribute rather than merely attend. People arrive with different levels of confidence and
      access; give them a recognizable purpose and several reasonable ways to contribute. A
      gathering becomes coordinated when its structure helps quieter participants as well as those
      already comfortable taking the floor. In everyday terms, give a meeting a question and a
      tangible outcome. Try this emphasis: help people know how to take part.'
    advice:
      - Help people know how to take part
    do:
      - Check facts
    dont:
      - Rush commitments
    sources:
      - text: 亨，王假有庙。利见大人，亨，利贞。用大牲吉，利有攸往。
        from: Zhouyi, hexagram 45 (Chinese source text)
      - text: 泽上于地，萃；君子以除戎器，戒不虞。
