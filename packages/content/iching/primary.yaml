  zh:
    title: 涣：联系松散时
    summary: 联系松散时，先找到能重新连接的共同目标
    body: 联系松散时，先找到能重新连接的共同目标；你可以据此检查手头安排。本卦（这次起卦得到的主要情境图）为涣卦；涣以风行水上讲原先凝结的东西被疏散，可以是隔阂松动，也可以是注意力分散。你可以减少小圈子的壁垒，让大家回到具体目标，同时照顾仍需稳定承接的安排。卦象上方是风，下方是水，分别提示沟通与渐入与不确定中的通路；这是观察情境的比喻，不是事件预告。例如，沟通断开时重新说明大家共同要解决的问题，就能把这个角度用在可观察的安排上。建议减少隔阂并明确承接方式；若现实信息不同，及时修正理解，不把象征当成行动命令。
    advice:
      - 减少隔阂并明确承接方式
    do:
      - 核对事实
    dont:
      - 仓促承诺
    sources:
      - text: 亨。王假有庙，利涉大川，利贞。
        from: 《周易》·涣
      - text: 风行水上，涣；先王以享于帝立庙。
        from: 《周易》象传·涣
  en:
    title: Dispersion
    summary: You can loosen an unhelpful division and rebuild contact around a shared need
    body:
      'You can loosen an unhelpful division and rebuild contact around a shared need. Dispersion is
      your primary hexagram (běn guà — the main figure cast for this question); wind over water
      disperses what has collected. Release can dissolve barriers or scatter attention, so the
      useful task is to bring people toward a shared purpose while giving change a dependable point
      of support. A common need can loosen the loyalty of a closed circle; invite people toward that
      need and provide a stable place for renewed contact. Releasing barriers is useful when someone
      can still see how the next task will be carried and supported. In everyday terms, reconnect a
      divided group through one practical shared concern. Try this emphasis: give renewed contact
      something concrete to serve.'
    advice:
      - Give renewed contact something concrete to serve
    do:
      - Check facts
    dont:
      - Rush commitments
    sources:
      - text: 亨。王假有庙，利涉大川，利贞。
        from: Zhouyi, hexagram 59 (Chinese source text)
      - text: 风行水上，涣；先王以享于帝立庙。
