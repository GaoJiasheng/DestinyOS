    path: primary.number
    eq: 6
  weight: 78
  polarity: neutral
  tags:
    - plain
    - hexagram.6
    - iching.clarity
  exclusive_with: []
  zh:
    title: 讼：分歧出现时
    summary: 分歧出现时，先降低争执的成本
    body: 分歧出现时，先降低争执的成本；你可以据此检查手头安排。本卦（这次起卦得到的主要情境图）为讼卦；讼呈现天与水各行其路，双方的期待可能越走越远。它提醒你看见争论背后的需求与信息差，及时求助于公允的沟通过程，不把每次不同意见都推到输赢上。卦象上方是天，下方是水，分别提示开阔与主动与不确定中的通路；这是观察情境的比喻，不是事件预告。例如，会议里先写出双方共同认可的事实，就能把这个角度用在可观察的安排上。建议把立场转换成具体请求；若现实信息不同，及时修正理解，不把象征当成行动命令。
    advice:
      - 把立场转换成具体请求
    do:
      - 核对事实
    dont:
      - 仓促承诺
    sources:
      - text: 有孚，窒惕，中吉，终凶。
        from: 《周易》·讼
      - text: 天与水违行，讼；君子以作事谋始。
        from: 《周易》象传·讼
  en:
    title: Conflict
    summary: You may gain more from clarifying a disagreement than from proving you can outlast it
    body: 'You may gain more from clarifying a disagreement than from proving you can outlast it.
      Conflict is your primary hexagram (běn guà — the main figure cast for this question); opposing
      directions can turn a small misunderstanding into a costly contest. This image asks you to
      separate what happened from what each person assumes, and to leave room for an impartial
      conversation. Different interpretations of an agreement can persist even when both people are
      sincere; clarifying the request may reveal an easier resolution than defending a whole
      position. A neutral facilitator can help establish the facts without becoming someone who
      chooses your life for you. In everyday terms, list agreed facts before discussing disputed
      interpretations. Try this emphasis: seek clarity before escalation.'
    advice:
      - Seek clarity before escalation
    do:
      - Check facts
    dont:
      - Rush commitments
    sources:
      - text: 有孚，窒惕，中吉，终凶。
        from: Zhouyi, hexagram 6 (Chinese source text)
      - text: 天与水违行，讼；君子以作事谋始。
        from: Zhouyi, Image commentary 6 (Chinese source text)
  meta:
    author: t23-original-v1
    reviewed_by: null
    version: 1
    status: published
- id: iching.primary.hexagram_07
  system: iching
  section: hexagram
  topic: primary
