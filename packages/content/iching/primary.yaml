  zh:
    title: 井：稳定的资源也需要维护与方便使用的入口
    summary: 稳定的资源也需要维护与方便使用的入口
    body: 稳定的资源也需要维护与方便使用的入口；你可以据此检查手头安排。本卦（这次起卦得到的主要情境图）为井卦；井以木上汲水讲长期供给，井不因人来人往而失去作用，但工具与维护会影响能否取到水。你可以照顾基础设施、共享知识与使用方式，让已有资源真正服务于需要它的人。卦象上方是水，下方是风，分别提示不确定中的通路与沟通与渐入；这是观察情境的比喻，不是事件预告。例如，知识库先修好检索与过期条目，就能把这个角度用在可观察的安排上。建议定期检查资源的实际可用性；若现实信息不同，及时修正理解，不把象征当成行动命令。
    advice:
      - 定期检查资源的实际可用性
    do:
      - 核对事实
    dont:
      - 仓促承诺
    sources:
      - text: 改邑不改井，无丧无得，往来井井。
        from: 《周易》·井
      - text: 木上有水，井；君子以劳民劝相。
        from: 《周易》象传·井
  en:
    title: The Well
    summary: You can improve a shared resource by caring for access as well as quality
    body:
      'You can improve a shared resource by caring for access as well as quality. The Well is your
      primary hexagram (běn guà — the main figure cast for this question); wood drawing water offers
      a picture of a durable source. A resource can exist and still be unusable, making upkeep,
      tools, and fair access as important as the quality of what is available. A guide, tool, or
      shared service becomes dependable through use and upkeep; ask where people are failing to
      reach it and who handles the ordinary repairs. Improving access can create more value than
      adding material to a source that remains difficult to use. In everyday terms, make a shared
      guide easier to find and keep current. Try this emphasis: maintain the means of access.'
    advice:
      - Maintain the means of access
    do:
      - Check facts
    dont:
      - Rush commitments
    sources:
      - text: 改邑不改井，无丧无得，往来井井。
        from: Zhouyi, hexagram 48 (Chinese source text)
      - text: 木上有水，井；君子以劳民劝相。
        from: Zhouyi, Image commentary 48 (Chinese source text)
