  zh:
    title: 豫：有热情时
    summary: 有热情时，把期待转成有准备的集体行动
    body: 有热情时，把期待转成有准备的集体行动；你可以据此检查手头安排。本卦（这次起卦得到的主要情境图）为豫卦；豫以雷出地面讲情绪被唤起与众人受到鼓舞，愉快的期待能够形成行动力。若只追求气氛而忽略条件，容易拖延或高估进展；把热情落在清楚的安排上更合适。卦象上方是雷，下方是地，分别提示启动与回应与承载与落实；这是观察情境的比喻，不是事件预告。例如，活动开始前让每位参与者知道下一步，就能把这个角度用在可观察的安排上。建议留出检查准备的时间；若现实信息不同，及时修正理解，不把象征当成行动命令。
    advice:
      - 留出检查准备的时间
    do:
      - 核对事实
    dont:
      - 仓促承诺
    sources:
      - text: 利建侯，行师。
        from: 《周易》·豫
      - text: 雷出地奋，豫。先王以作乐崇德，殷荐之上帝，以配祖考。
        from: 《周易》象传·豫
  en:
    title: Enthusiasm
    summary: You can enjoy momentum while checking whether the groundwork supports it
    body:
      'You can enjoy momentum while checking whether the groundwork supports it. Enthusiasm is your
      primary hexagram (běn guà — the main figure cast for this question); thunder rising from earth
      evokes energy that a group can feel. Enthusiasm is useful when a plan gives it direction, but
      celebrating too early can make practical obstacles harder to acknowledge. Enjoyment can
      support coordinated action when each participant knows what comes next; it can also hide
      unfinished preparation. Let a pleasant atmosphere encourage people to contribute without
      making it difficult for someone to name a practical concern. In everyday terms, translate
      excitement about an event into named tasks. Try this emphasis: check readiness before
      celebrating. Give this step a review point tied to the task itself, so you can notice what
      helped and what still needs another approach.'
    advice:
      - Check readiness before celebrating
    do:
      - Check facts
    dont:
      - Rush commitments
    sources:
