    summary: 适当后退，可以保护原则与下一步的选择
    body: 适当后退，可以保护原则与下一步的选择；你可以据此检查手头安排。本卦（这次起卦得到的主要情境图）为遯卦；遯以天远离山的意象讲有意识的退避，后退不等于否定自己。识别不适合继续投入的局面，安排交接与距离，能够保留精力，并减少在纠缠中失去判断的可能。卦象上方是天，下方是山，分别提示开阔与主动与边界与止步；这是观察情境的比喻，不是事件预告。例如，合作方向不合时清楚说明退出与交接安排，就能把这个角度用在可观察的安排上。建议退一步也把边界说清楚；若现实信息不同，及时修正理解，不把象征当成行动命令。
