  zh:
    title: 颐：留意每天吸收什么
    summary: 留意每天吸收什么，也留意你怎样支持别人
    body: 留意每天吸收什么，也留意你怎样支持别人；你可以据此检查手头安排。本卦（这次起卦得到的主要情境图）为颐卦；颐借口与进食的意象讲滋养，既包括生活所需，也包括信息与言语。你可以观察哪些习惯让日常更有余力，哪些只是短暂满足；支持他人时也需要照顾自己的资源。卦象上方是山，下方是雷，分别提示边界与止步与启动与回应；这是观察情境的比喻，不是事件预告。例如，忙碌时先安排规律的用餐与信息休息，就能把这个角度用在可观察的安排上。建议给照顾自己的习惯留位置；若现实信息不同，及时修正理解，不把象征当成行动命令。
    advice:
      - 给照顾自己的习惯留位置
    do:
      - 核对事实
    dont:
      - 仓促承诺
    sources:
      - text: 贞吉，观颐，自求口实。
        from: 《周易》·颐
      - text: 山下有雷，颐；君子以慎言语，节饮食。
        from: 《周易》象传·颐
  en:
    title: The Corners of the Mouth
    summary: You can review the inputs that sustain your day and the care you pass onward
    body:
      'You can review the inputs that sustain your day and the care you pass onward. The Corners of
      the Mouth is your primary hexagram (běn guà — the main figure cast for this question); a mouth
      receives and gives: nourishment includes attention, information, and speech as well as
      ordinary meals. This image invites a review of daily inputs and the demands placed on your
      capacity. The things you consume also include news, conversation, and demands on attention;
      notice whether your routine leaves enough space to think and care. Giving support works better
      when it does not quietly remove the conditions that sustain your own day. In everyday terms,
      keep a regular meal break and reduce distracting inputs. Try this emphasis: choose inputs that
      support a workable day.'
    advice:
      - Choose inputs that support a workable day
    do:
      - Check facts
    dont:
      - Rush commitments
    sources:
      - text: 贞吉，观颐，自求口实。
        from: Zhouyi, hexagram 27 (Chinese source text)
      - text: 山下有雷，颐；君子以慎言语，节饮食。
