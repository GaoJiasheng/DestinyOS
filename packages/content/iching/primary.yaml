        from: 《周易》·临
      - text: 泽上有地，临；君子以教思无穷，容保民无疆。
        from: 《周易》象传·临
  en:
    title: Approach
    summary: You can guide a situation more effectively by staying close enough to learn from it
    body:
      'You can guide a situation more effectively by staying close enough to learn from it. Approach
      is your primary hexagram (běn guà — the main figure cast for this question); approaching
      creates access, and access brings responsibility. Earth over lake suggests attentive oversight
      that learns from the people doing the work, instead of assuming that distance makes judgment
      clearer. Guidance can become intrusive when the person providing it stops listening; stay near
      enough to learn how the task is experienced, then offer help that leaves the other person able
      to act. An approaching role calls for attention rather than constant control. In everyday
      terms, observe a real attempt before offering instructions. Try this emphasis: make guidance
      responsive to experience. Give this step a review point tied to the task itself, so you can
      notice what helped and what still needs another approach.'
    advice:
      - Make guidance responsive to experience
    do:
      - Check facts
    dont:
      - Rush commitments
    sources:
      - text: 元，亨，利，贞。
        from: Zhouyi, hexagram 19 (Chinese source text)
      - text: 泽上有地，临；君子以教思无穷，容保民无疆。
