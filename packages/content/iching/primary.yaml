        from: 《周易》·蛊
      - text: 山下有风，蛊；君子以振民育德。
        from: 《周易》象传·蛊
  en:
    title: Work on What Has Been Spoiled
    summary: You can improve an inherited situation by naming what has been neglected
    body:
      'You can improve an inherited situation by naming what has been neglected. Work on What Has
      Been Spoiled is your primary hexagram (běn guà — the main figure cast for this question);
      stagnation often develops through repeated omissions rather than one dramatic mistake. This
      image invites you to examine inherited routines and repair the conditions that keep an old
      difficulty returning. An inherited difficulty may survive because nobody owns its upkeep;
      trace the repeated omission rather than looking only for a person to blame. Repair includes
      explaining the new arrangement and scheduling the small acts that keep it from decaying again.
      In everyday terms, find a recurring problem that lacks a named owner. Try this emphasis: treat
      maintenance as part of the change.'
    advice:
      - Treat maintenance as part of the change
    do:
      - Check facts
    dont:
      - Rush commitments
