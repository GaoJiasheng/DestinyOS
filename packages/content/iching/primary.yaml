  zh:
    title: 大壮：力量增加时
    summary: 力量增加时，更要校准边界与使用方式
    body: 力量增加时，更要校准边界与使用方式；你可以据此检查手头安排。本卦（这次起卦得到的主要情境图）为大壮卦；大壮以天上有雷讲动力强盛，能行动并不代表每条道路都合适。越有把握，越要核对规则、影响与承受范围，把力量用于清楚目标，而不是把推进本身当成价值。卦象上方是雷，下方是天，分别提示启动与回应与开阔与主动；这是观察情境的比喻，不是事件预告。例如，争取资源时先说明用途而非提高声量，就能把这个角度用在可观察的安排上。建议给强势行动设定边界；若现实信息不同，及时修正理解，不把象征当成行动命令。
    advice:
      - 给强势行动设定边界
    do:
      - 核对事实
    dont:
      - 仓促承诺
    sources:
