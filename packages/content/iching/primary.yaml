  zh:
    title: 大有：拥有较多资源时
    summary: 拥有较多资源时，分配与使用比展示更关键
    body: 拥有较多资源时，分配与使用比展示更关键；你可以据此检查手头安排。本卦（这次起卦得到的主要情境图）为大有卦；大有以天上有火的明亮意象讲资源被看见与被使用。拥有条件只是起点，如何配置、让谁参与、为哪些目标服务才决定实际体验；宽裕时也要保持节制与可追踪的责任。卦象上方是火，下方是天，分别提示明晰与依托与开阔与主动；这是观察情境的比喻，不是事件预告。例如，团队工具充足时先为新人安排学习入口，就能把这个角度用在可观察的安排上。建议定期检视资源是否用到要处；若现实信息不同，及时修正理解，不把象征当成行动命令。
    advice:
      - 定期检视资源是否用到要处
    do:
      - 核对事实
    dont:
      - 仓促承诺
    sources:
      - text: 元亨。
        from: 《周易》·大有
      - text: 火在天上，大有；君子以遏恶扬善，顺天休命。
        from: 《周易》象传·大有
  en:
    title: Possession in Great Measure
    summary: You can turn abundance into useful work by sharing access and keeping priorities clear
    body: 'You can turn abundance into useful work by sharing access and keeping priorities clear.
      Possession in Great Measure is your primary hexagram (běn guà — the main figure cast for this
      question); fire above heaven makes capacity visible. Having substantial resources calls for
      stewardship: people need to know what is available, how it is allocated, and which
      responsibilities come with using it. Resources become harder to manage when possession
      replaces purpose; decide what is needed, how access works, and who will notice waste or
      neglect. Stewardship allows capacity to circulate while keeping the person responsible for it
      visible. In everyday terms, help a newcomer use a resource that already exists. Try this
      emphasis: share access without losing oversight. Give this step a review point tied to the
      task itself, so you can notice what helped and what still needs another approach.'
    advice:
      - Share access without losing oversight
    do:
      - Check facts
    dont:
      - Rush commitments
    sources:
      - text: 元亨。
        from: Zhouyi, hexagram 14 (Chinese source text)
      - text: 火在天上，大有；君子以遏恶扬善，顺天休命。
