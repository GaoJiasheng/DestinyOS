    summary: 暂时不能大步推进时，积累小而可靠的成果
    body: 暂时不能大步推进时，积累小而可靠的成果；你可以据此检查手头安排。本卦（这次起卦得到的主要情境图）为小畜卦；小畜以风在天上推动云气讲有限的约束与储备。力量还不足以带来全面变化时，细节上的整理仍有价值；把期待放在可见的小成果上，能减少空等与焦躁。卦象上方是风，下方是天，分别提示沟通与渐入与开阔与主动；这是观察情境的比喻，不是事件预告。例如，上线前先修好最常见的三处体验问题，就能把这个角度用在可观察的安排上。建议积累可核验的小进展；若现实信息不同，及时修正理解，不把象征当成行动命令。
    advice:
      - 积累可核验的小进展
    do:
