  exclusive_with: []
  zh:
    title: 益：得到支持时
    summary: 得到支持时，把增加的空间用在实际改进上
    body: 得到支持时，把增加的空间用在实际改进上；你可以据此检查手头安排。本卦（这次起卦得到的主要情境图）为益卦；益以风雷相助讲力量相互推动，支持的价值在于让实际困难更容易解决。你可以把新增资源用于试验与改进，也要让帮助形成回馈，避免只扩大期待而没有相应行动。卦象上方是风，下方是雷，分别提示沟通与渐入与启动与回应；这是观察情境的比喻，不是事件预告。例如，多出人手后优先解决持续积压的问题，就能把这个角度用在可观察的安排上。建议把获得的支持转为可见改善；若现实信息不同，及时修正理解，不把象征当成行动命令。
    advice:
      - 把获得的支持转为可见改善
    do:
      - 核对事实
    dont:
      - 仓促承诺
    sources:
      - text: 利有攸往，利涉大川。
        from: 《周易》·益
      - text: 风雷，益；君子以见善则迁，有过则改。
        from: 《周易》象传·益
  en:
    title: Increase
    summary: You can turn added support into progress that also benefits the people around you
    body:
      'You can turn added support into progress that also benefits the people around you. Increase
      is your primary hexagram (běn guà — the main figure cast for this question); wind and thunder
      reinforce movement in this picture. An increase becomes meaningful through useful action and
      fair circulation, especially when extra support removes a constraint that previously stopped
      progress. Added capacity is a chance to remove a specific constraint; choose a practical
      improvement, tell people how the support will be used, and recognize the contributions behind
      it. Growth feels more workable when its benefit can be seen in the task itself. In everyday
      terms, use additional help to clear a persistent bottleneck. Try this emphasis: let added
      capacity serve a shared need.'
    advice:
      - Let added capacity serve a shared need
    do:
      - Check facts
    dont:
      - Rush commitments
    sources:
      - text: 利有攸往，利涉大川。
        from: Zhouyi, hexagram 42 (Chinese source text)
      - text: 风雷，益；君子以见善则迁，有过则改。
        from: Zhouyi, Image commentary 42 (Chinese source text)
