  zh:
    title: 姤：突然的相遇可以观察
    summary: 突然的相遇可以观察，不必立即给予全部信任
    body: 突然的相遇可以观察，不必立即给予全部信任；你可以据此检查手头安排。本卦（这次起卦得到的主要情境图）为姤卦；姤以风行天下讲影响从细小处进入，新的接触可能很快改变节奏。你可以欢迎信息与机会，同时核对条件与动机；接近不意味着立刻承诺，也不需要按性别给任何人贴标签。卦象上方是天，下方是风，分别提示开阔与主动与沟通与渐入；这是观察情境的比喻，不是事件预告。例如，新合作邀约先安排一次有限的试做，就能把这个角度用在可观察的安排上。建议先确认边界再扩大接触；若现实信息不同，及时修正理解，不把象征当成行动命令。
    advice:
      - 先确认边界再扩大接触
    do:
      - 核对事实
    dont:
      - 仓促承诺
    sources:
      - text: 女壮，勿用取女。
        from: 《周易》·姤
      - text: 天下有风，姤；后以施命诰四方。
        from: 《周易》象传·姤
  en:
    title: Coming to Meet
    summary: You can stay curious about an unexpected opening while setting limits early
    body:
      'You can stay curious about an unexpected opening while setting limits early. Coming to Meet
      is your primary hexagram (běn guà — the main figure cast for this question); wind beneath
      heaven travels widely from a small beginning. An encounter may be compelling, yet practical
      boundaries and time to observe make curiosity more useful than an immediate commitment. An
      unexpected contact may have a useful contribution and still need a limited trial; clarify
      access, responsibilities, and the point at which you will review the arrangement. Curiosity
      works better with a boundary than with either immediate trust or reflexive suspicion. In
      everyday terms, try a bounded collaboration before granting broad access. Try this emphasis:
      keep an opening proportionate to what you know.'
    advice:
      - Keep an opening proportionate to what you know
    do:
      - Check facts
    dont:
      - Rush commitments
    sources:
      - text: 女壮，勿用取女。
        from: Zhouyi, hexagram 44 (Chinese source text)
      - text: 天下有风，姤；后以施命诰四方。
        from: Zhouyi, Image commentary 44 (Chinese source text)
