  zh:
    title: 升：积累的小进展
    summary: 积累的小进展，可以形成可信的上升路径
    body: 积累的小进展，可以形成可信的上升路径；你可以据此检查手头安排。本卦（这次起卦得到的主要情境图）为升卦；升以地中生木讲向上发展，成长依赖扎实的根与连续的小步。你可以寻找合适的支持与反馈，不急于跳过基础；真正可持续的提升，往往能说明每一步学到了什么。卦象上方是地，下方是风，分别提示承载与落实与沟通与渐入；这是观察情境的比喻，不是事件预告。例如，每次练习完成一个可展示的小作品，就能把这个角度用在可观察的安排上。建议让提升建立在可重复的步骤上；若现实信息不同，及时修正理解，不把象征当成行动命令。
    advice:
      - 让提升建立在可重复的步骤上
    do:
      - 核对事实
    dont:
      - 仓促承诺
    sources:
      - text: 元亨，用见大人，勿恤，南征吉。
        from: 《周易》·升
      - text: 地中生木，升；君子以顺德，积小以高大。
        from: 《周易》象传·升
  en:
    title: Pushing Upward
    summary: You can grow through repeatable steps and support that recognizes the work
    body:
      'You can grow through repeatable steps and support that recognizes the work. Pushing Upward is
      your primary hexagram (běn guà — the main figure cast for this question); wood growing through
      earth suggests development supported from below. Progress is easier to sustain when it has
      manageable stages, honest feedback, and opportunities to use what you have already learned. A
      small finished piece makes learning available for review; build a sequence in which each
      result provides a skill or contact for the next stage. Useful growth is easier to trace when
      it is tied to what you can do rather than how high a role appears. In everyday terms, build a
      small portfolio through successive practice tasks. Try this emphasis: measure growth by usable
      learning.'
    advice:
      - Measure growth by usable learning
    do:
      - Check facts
    dont:
      - Rush commitments
    sources:
      - text: 元亨，用见大人，勿恤，南征吉。
        from: Zhouyi, hexagram 46 (Chinese source text)
      - text: 地中生木，升；君子以顺德，积小以高大。
