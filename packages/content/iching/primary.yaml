  zh:
    title: 既济：阶段完成后
    summary: 阶段完成后，继续维护使成果成立的条件
    body: 阶段完成后，继续维护使成果成立的条件；你可以据此检查手头安排。本卦（这次起卦得到的主要情境图）为既济卦；既济以水火各在合适位置讲阶段性的协调，完成并不取消后续变化。你可以欣赏成果，也要检查交接、备用方案与持续维护，避免把起初的稳定当成以后无需照顾的状态。卦象上方是水，下方是火，分别提示不确定中的通路与明晰与依托；这是观察情境的比喻，不是事件预告。例如，任务完成后安排一次使用反馈与交接检查，就能把这个角度用在可观察的安排上。建议把维护写进完成标准；若现实信息不同，及时修正理解，不把象征当成行动命令。
    advice:
      - 把维护写进完成标准
    do:
      - 核对事实
    dont:
      - 仓促承诺
    sources:
      - text: 亨小，利贞，初吉，终乱。
        from: 《周易》·既济
      - text: 水在火上，既济；君子以思患而预防之。
        from: 《周易》象传·既济
  en:
    title: After Completion
    summary: You can protect a completed step by treating maintenance as part of success
    body:
      'You can protect a completed step by treating maintenance as part of success. After Completion
      is your primary hexagram (běn guà — the main figure cast for this question); water above fire
      depicts an arrangement that is functioning for the moment. Completion changes the task from
      creating a result to maintaining it, because a working balance can still be disturbed. A
      finished result changes the nature of attention; check the handover, the repair route, and the
      person who owns routine upkeep. You can appreciate what has been completed while acknowledging
      that its continuing usefulness rests on an arrangement people still maintain. In everyday
      terms, schedule a handover review after a successful delivery. Try this emphasis: care for
      what makes the result hold.'
    advice:
      - Care for what makes the result hold
    do:
      - Check facts
    dont:
