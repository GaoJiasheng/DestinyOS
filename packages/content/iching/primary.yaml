  zh:
    title: 中孚：信任靠内外一致
    summary: 信任靠内外一致，不靠反复强调自己的诚意
    body: 信任靠内外一致，不靠反复强调自己的诚意；你可以据此检查手头安排。本卦（这次起卦得到的主要情境图）为中孚卦；中孚以风泽相感讲内在诚意与外在回应相通，真正的信任需要能被看见的行为。你可以兑现小承诺、允许对方表达疑虑，不用过多语言催促认可，也不把信任当作取消核查的理由。卦象上方是风，下方是泽，分别提示沟通与渐入与交流与悦纳；这是观察情境的比喻，不是事件预告。例如，答应回复的事按约定时间说明进展，就能把这个角度用在可观察的安排上。建议让行为与说法相互印证；若现实信息不同，及时修正理解，不把象征当成行动命令。
    advice:
      - 让行为与说法相互印证
    do:
      - 核对事实
    dont:
      - 仓促承诺
    sources:
