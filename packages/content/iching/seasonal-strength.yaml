        eq: meihua
      - path: meihua.seasonalStrength
        eq: trapped
  weight: 72
  polarity: neutral
  tags:
    - plain
    - body
  exclusive_with: []
  zh:
    title: 受到条件牵制时，先寻找能松动的一小处
    summary: 受到条件牵制时，先寻找能松动的一小处
    body: 你可以先缩小安排，找一个不依赖全部条件的小入口。囚（体卦（象征自身处境的三条线）五行（木火土金水的关系分类）被季节五行约束的分类）是象征层面的受限，不是说你被困住或缺少价值；体卦指代表自身处境的一侧。当前标记提示条件可能不相配，值得把时间、协作与材料分开核对，找出实际是哪一项不足，而不笼统责怪自己。例如，计划需要多人同时配合却迟迟无法约齐时，可以先做各自能够独立完成的部分，留下清楚记录再安排接合。建议说明最需要调整的范围并寻求具体支持，保留一个复查点；如果现实条件已经改变，就按新的信息更新做法，不让传统分类限制你能采取的行动。
    advice:
      - 找出一项能调整的依赖
    do:
      - 核对事实
    dont:
      - 仓促承诺
  en:
    title: You can inspect the constraint and reduce a demand that currently has little support
    summary: You can inspect the constraint and reduce a demand that currently has little support
    body: You can reduce a demand and find one step that does not require every condition to align.
      Trapped corresponds to qiú (囚 — the seasonal element constrains the body element), a symbolic
      category rather than a statement that you are helpless. Body is the figure representing your
      position. Inspect timing, cooperation, and materials separately so a vague sense of
      restriction becomes a concrete issue. For example, if a task depends on everyone meeting
      together, prepare the parts that can be completed independently and record how they will
      connect. Consider asking for one specific adjustment and setting a review point. If actual
      conditions improve, use the new information instead of remaining attached to the label. The
      practical purpose is to widen workable choices, not to make the restriction part of your
      identity.
    advice:
      - Identify one adjustable dependency
    do:
      - Check facts
    dont:
      - Rush commitments
  meta:
    author: t23-original-v1
    reviewed_by: null
    version: 1
    status: published
- id: iching.seasonal_strength.dead
  system: iching
  section: pro_view
  topic: seasonal_strength
  when:
    all:
      - path: method
        eq: meihua
      - path: meihua.seasonalStrength
        eq: dead
  weight: 72
  polarity: neutral
  tags:
    - plain
    - body
  exclusive_with: []
  zh:
    title: 资源暂时不贴合时，可以把计划改得更轻
    summary: 资源暂时不贴合时，可以把计划改得更轻
    body: 你可以先保留必要安排，把新增任务放到更可承接的范围。死（传统旺衰（与季节及支持条件比较的分类）中体卦（象征自身处境的三条线）五行（木火土金水的关系分类）缺乏季节支持的最低一档）只是五行关系的术语，不用于描述生命状态，也不能据此判断健康；体卦是代表自身处境的一侧。这里强调象征上支持偏少，适合检视计划是否需要过多条件，而不是理解成没有未来选择。例如，一项长期安排若暂时缺少时间与协作者，可以缩成材料整理或一次讨论，先保存有效部分，等资源清楚后再评估。建议把是否继续的条件写出来，并联系可信的人帮忙核对；现实中的可行路径始终优先，不需要用勉强坚持证明自己，也不用因为这个名称而害怕。
    advice:
      - 写清恢复计划所需的条件
    do:
      - 核对事实
    dont:
      - 仓促承诺
  en:
    title: You can conserve effort when the seasonal image points to a poor fit in resources
    summary: You can conserve effort when the seasonal image points to a poor fit in resources
    body:
      'You can conserve effort and keep the useful part of a plan when support is poorly matched.
      The chart key dead corresponds to sǐ (死 — the lowest seasonal support category for the body
      element). This is historical elemental terminology, not a description of life, health, or a
      person’s future. Body represents your position in the question. The practical emphasis is on a
      plan that may ask for more conditions than currently exist. Suppose a continuing project lacks
      time and collaborators: reduce it to organizing material or holding one purposeful discussion,
      then reassess when resources are clearer. Consider writing down what would make a larger
      commitment workable and asking someone trustworthy to review it. Real options remain more
      important than the label, and you do not need to prove determination by sustaining an
      unsuitable load.'
    advice:
      - Name conditions for resuming
    do:
      - Check facts
    dont:
      - Rush commitments
  meta:
    author: t23-original-v1
    reviewed_by: null
    version: 1
    status: published
