  exclusive_with: []
  zh:
    title: 变化后的条件需要重新核对：外部支持有助于你开展手头的事
    summary: 变化后的条件需要重新核对
    body: 你可以把变化后的结构单独放进观察。变卦（动爻（被标记为翻转阴阳的线）翻转后形成的新结构图）提供后续安排的角度，不判定现实未来；本次将其中与原用位同侧的三爻卦（三条阴阳线组成的图）同原体卦（象征自身处境的三条线）比较，体卦是象征自身处境的一侧。用生体（外部因素对你所处位置形成支持）提示可借力的条件。体是象征你自身处境的部分，用是象征当前事件的部分，这种关系重在辨认帮助如何到位，不等于每项期待都会自动落实。例如，任务重新分配之后，可以核对新的职责是否已有资源承接，再看这一条件如何改变原安排。在现有支持上先完成一件小事，确认配合能够持续之后再扩大范围，也把对方的时间与边界纳入安排。现实反馈仍需另查，不把这个阶段图当成已落实的结果。
    advice:
      - 在现有支持上先完成一件小事，确认配合能够持续之后再扩大范围，也把对方的时间与边界纳入安排。
    do:
      - 核对事实
    dont:
      - 仓促承诺
  en:
    title:
      'Check the conditions of the changed arrangement: You can make practical use of support that
      fits your present capacity'
    summary: Check the conditions of the changed arrangement
    body: You can inspect the changed arrangement separately from the original situation. Changing
      hexagram, or biàn guà — the figure formed after the moving line flips, offers a viewpoint
      rather than a forecast. The trigram on the original use side is compared with the original
      body, the side representing your position. Use generates body (yòng shēng tǐ — the event side
      supports the side representing your position) points toward useful assistance. Body and use
      are roles in this symbolic arrangement, not measurements of a person. Notice what help is
      actually available and how it reaches the task. For example, a reassigned responsibility may
      need a different resource before it can be carried. Start with a task that the available help
      can genuinely carry. Let the result show how coordination works before expanding the request,
      and recognize the other person’s time as part of the resource. Keep observed facts separate
      from the symbolic comparison when reviewing what the stage actually requires.
    advice:
      - Start with a task that the available help can genuinely carry. Let the result show how
        coordination works before expanding the request, and recognize the other person’s time as
        part of the resource.
    do:
      - Check facts
    dont:
      - Rush commitments
