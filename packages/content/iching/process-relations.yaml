  zh:
    title: 变化后的条件需要重新核对：双方节奏较容易衔接，仍需把默契说清楚
    summary: 变化后的条件需要重新核对
    body: 你可以把变化后的结构单独放进观察。变卦（动爻（被标记为翻转阴阳的线）翻转后形成的新结构图）提供后续安排的角度，不判定现实未来；本次将其中与原用位同侧的三爻卦（三条阴阳线组成的图）同原体卦（象征自身处境的三条线）比较，体卦是象征自身处境的一侧。比和（体与用的五行（木火土金水的关系分类）属性相同）象征自身处境与当前事情较容易同向。体代表你的一侧，用代表事件一侧，相同不是完全没有差异；顺畅的感觉可以作为交流入口，但承诺与边界仍值得核实。例如，任务重新分配之后，可以核对新的职责是否已有资源承接，再看这一条件如何改变原安排。可以借着较顺的交流确认一项共同安排，把谁做什么与何时回应说清楚；保留反馈机会，让默契有现实行为可以承接。现实反馈仍需另查，不把这个阶段图当成已落实的结果。
