    body: 你可以把变化后的结构单独放进观察。变卦（动爻（被标记为翻转阴阳的线）翻转后形成的新结构图）提供后续安排的角度，不判定现实未来；本次将其中与原用位同侧的三爻卦（三条阴阳线组成的图）同原体卦（象征自身处境的三条线）比较，体卦是象征自身处境的一侧。用克体（事件一侧限制你所处的一侧）提示压力或条件不合，并不是对个人能力的否定。体象征自身处境，用象征当前事情，受制的关系适合先辨认边界、缺口与可用支援，而非把每个阻碍都归到自己身上。例如，任务重新分配之后，可以核对新的职责是否已有资源承接，再看这一条件如何改变原安排。不过，你可以通过缩小范围与明确求助减轻消耗；先守住必要安排，等实际条件变化后再评估是否适合继续推进。现实反馈仍需另查，不把这个阶段图当成已落实的结果。
    advice:
      - 不过，你可以通过缩小范围与明确求助减轻消耗；先守住必要安排，等实际条件变化后再评估是否适合继续推进。
    do:
      - 核对事实
    dont:
      - 仓促承诺
  en:
    title: 'Check the conditions of the changed arrangement: You may need to respond to a constraint
      before expecting normal progress'
    summary: Check the conditions of the changed arrangement
    body: You can inspect the changed arrangement separately from the original situation. Changing
      hexagram, or biàn guà — the figure formed after the moving line flips, offers a viewpoint
      rather than a forecast. The trigram on the original use side is compared with the original
      body, the side representing your position. Use controls body (yòng kè tǐ — the event side
      constrains your position) describes a limit, not a verdict about your ability. Identify
      whether the constraint concerns time, access, or a demand you cannot currently meet. This
      makes an appropriate response easier to choose. For example, a reassigned responsibility may
      need a different resource before it can be carried. That said, you can reduce scope and
      request specific help. Keep essential arrangements intact, then review the situation when real
      conditions change rather than treating pressure as a reason to abandon your judgment. Keep
      observed facts separate from the symbolic comparison when reviewing what the stage actually
      requires.
