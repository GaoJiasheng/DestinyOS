  en:
    title: 'Choices: Start with observable conditions'
    summary: You can frame one concrete concern and compare the image with ordinary evidence.
    body:
      'You can approach this reading as a practical choices question. Your primary hexagram (běn guà
      — the main figure) is number {{primary.number}}, with an internal comparison score of
      {{score}} rather than an event probability. For a choice, compare the purpose, constraints,
