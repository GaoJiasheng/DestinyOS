- id: iching.overview.career
  system: iching
  section: overview
  topic: overview_category
  when:
    path: category
    eq: career
  weight: 75
  polarity: neutral
  tags:
    - plain
  exclusive_with: []
  zh:
    title: 事业：先看眼前能核对的条件
    summary: 你可以从一个具体情境开始，把象征提醒与现实信息放在一起。
    body: 你可以先用事业的角度整理当前问题。本卦（本次起卦的主要情境图）编号为{{primary.number}}，规则分数为{{score}}，只是象征比较，不代表事件概率。例如，项目刚开始时，你可以列出交付内容、负责的人和缺少的材料，把依赖说清楚，避免把整个团队的进展都压在自己身上。建议把目标写成可核对的交付物，给自己的判断保留调整空间。
    advice:
      - 把目标写成可核对的交付物
    do:
      - 核对事实
    dont:
      - 仓促承诺
  en:
    title: 'Work: Start with observable conditions'
    summary: You can frame one concrete concern and compare the image with ordinary evidence.
    body:
      'You can approach this reading as a practical work question. Your primary hexagram (běn guà —
      the main figure) is number {{primary.number}}, with an internal comparison score of {{score}}
      rather than an event probability. For work, focus on responsibilities, cooperation, and a
      deliverable someone can review. A reading cannot establish which role suits you or what an
      employer will decide. Imagine a planning meeting in which several people assume you will fill
      every gap. State your current workload and ask who can take one specific part. The
      conversation can then concern an actual arrangement instead of your willingness to work
      harder. Consider this next step: define one reviewable deliverable. Let what you observe
      decide whether the approach deserves continuing. Keep your own preferences and limits visible
      instead of asking the image to choose them for you.'
    advice:
      - Define one reviewable deliverable
    do:
      - Check facts
    dont:
      - Rush commitments
  meta:
    author: t23-original-v1
    reviewed_by: null
    version: 1
    status: published
