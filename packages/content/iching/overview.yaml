    summary: 你可以从一个具体情境开始，把象征提醒与现实信息放在一起。
    body: 你可以先用决策的角度整理当前问题。本卦（本次起卦的主要情境图）编号为{{primary.number}}，规则分数为{{score}}，只是象征比较，不代表事件概率。例如，两个方案都很吸引你时，可以分别写出需要投入的时间、依赖与最难接受的条件，先试一个成本较小的步骤，再带着新信息比较。建议比较两案的现实限制，给自己的判断保留调整空间。
    advice:
      - 比较两案的现实限制
    do:
      - 核对事实
    dont:
