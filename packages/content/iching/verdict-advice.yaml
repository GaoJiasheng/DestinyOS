    body: 对这个问题，支持与限制并存时，先把选择变成一次可观察的尝试。平（支持与约束没有明显偏向的评价）提醒你多看实际条件，吉凶标签并不是各类结果的概率，分数也不能代替信息。与其反复询问同一问题，不如确定目前最缺哪一项事实，再选择能补足它的小步骤。例如，项目刚开始时，你可以列出交付内容、负责的人和缺少的材料，把依赖说清楚，避免把整个团队的进展都压在自己身上。可以把尝试控制在容易撤回的范围，事先约定如何看反馈与何时停止；也听取可信伙伴的观察，让下一次判断根据新材料，而不是把当前的模糊一直重复下去。
