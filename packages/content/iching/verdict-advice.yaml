    body: 对这个问题，支持与限制并存时，先把选择变成一次可观察的尝试。平（支持与约束没有明显偏向的评价）提醒你多看实际条件，吉凶标签并不是各类结果的概率，分数也不能代替信息。与其反复询问同一问题，不如确定目前最缺哪一项事实，再选择能补足它的小步骤。例如，两个方案都很吸引你时，可以分别写出需要投入的时间、依赖与最难接受的条件，先试一个成本较小的步骤，再带着新信息比较。可以把尝试控制在容易撤回的范围，事先约定如何看反馈与何时停止；也听取可信伙伴的观察，让下一次判断根据新材料，而不是把当前的模糊一直重复下去。
