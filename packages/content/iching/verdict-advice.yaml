  zh:
    title: 事业：象征评价偏积极，仍适合从可核对的小步开始
    summary: 象征评价偏积极，仍适合从可核对的小步开始
    body: 对这个问题，象征评价偏积极，仍适合从可核对的小步开始。吉（综合关系较有支持的评价）说明这次象征比较中可用条件偏多，吉凶不是事件预测，分数也不是发生概率。你可以把它当成检查已有准备的提醒，留意材料、协作与时间是否真正配合；总体顺眼不取消局部的限制。例如，项目刚开始时，你可以列出交付内容、负责的人和缺少的材料，把依赖说清楚，避免把整个团队的进展都压在自己身上。建议把较好的配合用来完成一轮实际行动，并安排一次反馈；保留应对缺口的替代方式，不只凭整体评价扩大所有目标，让选择始终能够回到可观察的事实。
    advice:
      - 把目标写成可核对的交付物
      - 约定一次职责与进度核对
      - 建议把较好的配合用来完成一轮实际行动，并安排一次反馈；保留应对缺口的替代方式，不只凭整体评价扩大所有目标，让选择始终能够回到可观察的事实。
    do:
      - 核对事实
    dont:
      - 仓促承诺
  en:
    title: 'Work: Use an encouraging assessment to plan a step you can verify'
    summary: Use an encouraging assessment to plan a step you can verify
    body: Use an encouraging assessment to plan a step you can verify. Auspicious, or jí (a
      supportive overall symbolic assessment), summarizes the comparison rather than forecasting an
      event. The score is not a probability. Inspect preparation, resources, and coordination so an
      encouraging label remains tied to conditions you can actually verify. For example, a new
      project may need a named owner, a clear handover, and one missing document. Write these
      dependencies down before accepting responsibility for the whole schedule. This makes a request
      for help easier for a colleague to answer. Try completing one bounded round of action and
      arranging feedback. Keep an alternative for a missing condition instead of expanding every
      goal on the strength of the overall label. A useful result should be something you can observe
      and review.
    advice:
      - Define one reviewable deliverable
      - Agree on a role and progress check
      - Try completing one bounded round of action and arranging feedback. Keep an alternative for a
        missing condition instead of expanding every goal on the strength of the overall label. A
        useful result should be something you can observe and review.
    do:
      - Check facts
    dont:
      - Rush commitments
  meta:
    author: t23-original-v1
    reviewed_by: null
    version: 2
    status: published
