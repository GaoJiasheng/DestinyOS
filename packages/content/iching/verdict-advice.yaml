    summary: 阻力较集中时，先保留必要资源与判断空间
    body: 对这个问题，阻力较集中时，先保留必要资源与判断空间。凶（综合比较里约束较多的传统评价）只是象征分类，不用于预告现实事件或评价一个人的价值。吉凶关系与分数都不等于概率，限制较集中时适合检查任务是否超出已有资源，把必要安排与可选投入分开。例如，项目刚开始时，你可以列出交付内容、负责的人和缺少的材料，把依赖说清楚，避免把整个团队的进展都压在自己身上。建议先收小计划并联络可信的支持，把恢复推进所需的条件写清楚；新的信息与实际改善始终优先，也可以选择暂停或替代路线，让资源留给你能合理承担的事情。
    advice:
      - 把目标写成可核对的交付物
      - 约定一次职责与进度核对
      - 建议先收小计划并联络可信的支持，把恢复推进所需的条件写清楚；新的信息与实际改善始终优先，也可以选择暂停或替代路线，让资源留给你能合理承担的事情。
