- id: iching.moving_lines.count_0
  system: iching
  section: moving_lines
  topic: moving_count
  when:
    path: movingLines.length
    eq: 0
  weight: 76
  polarity: neutral
  tags:
    - plain
    - iching.pacing
  exclusive_with: []
  zh:
    title: 没有动爻时，先看本卦的整体提醒
    summary: 没有动爻时，先看本卦的整体提醒
    body: 你可以把注意力先放在本卦（起卦得到的主要六条线）整体，不必为了寻找转折补出没有的动爻（被标记为翻转阴阳的线）。静卦（六条线都没有翻转的结构）在当前起卦里没有动态标记，本卦是主要情境图；传统阅读以卦辞（整体卦象的象征文字）为入口，卦辞是整体意象的简要文字，原文只放在折叠引用中。没有变化不等于现实停止，也不说明你不能采取行动，重点是检视正在维持的基础与习惯。例如，一项安排长期照常运行，可以先检查谁在维护它、哪些部分已经顺手、哪里缺少一次沟通。建议选一个符合实际的小改进，观察原有结构能否更容易使用；如果新信息出现，也可以更新判断，不需等待象征给出变化才允许自己回应现实。
    advice:
      - 检查一个长期维持的安排
    do:
      - 核对事实
    dont:
      - 仓促承诺
  en:
    title: Read the whole primary image when no lines are moving
    summary: Read the whole primary image when no lines are moving
    body:
      You can start with the whole primary image instead of supplying a turning point that is not
      marked. A static hexagram, or jìng guà — a figure with no flipped lines, has no moving
      positions in this cast. The traditional entry is the judgment, a short account of the overall
      image available as a folded source. Stillness does not establish that ordinary life has
      stopped or that you cannot act. If a routine has continued unchanged, inspect who maintains
      it, what works smoothly, and where contact is missing. Consider one grounded improvement and
      observe whether the existing arrangement becomes easier to use. New information can still
      alter your judgment. You do not need a symbolic movement before allowing yourself to respond
      to an actual change in circumstances.
    advice:
      - Review one continuing arrangement
    do:
      - Check facts
    dont:
      - Rush commitments
  meta:
    author: t23-original-v1
    reviewed_by: null
    version: 1
    status: published
- id: iching.moving_lines.count_1
  system: iching
  section: moving_lines
  topic: moving_count
  when:
    path: movingLines.length
    eq: 1
  weight: 76
  polarity: neutral
  tags:
    - plain
    - iching.pacing
  exclusive_with: []
  zh:
    title: 一爻变化时，重点查看这一位置怎样接上整体
    summary: 一爻变化时，重点查看这一位置怎样接上整体
    body: 你可以先阅读唯一变化的位置，再把它放回整体情境。动爻（本卦（起卦得到的主要六条线）中翻转阴阳的线）只有一条时，传统规则以该爻的文字为主要入口；爻辞（一条线对应的象征文字）是描述该位置的象征文字，原文与白话分开展示，不需要把古代角色直接指定为现实中的人。一个位置提供焦点，并不说明其他条件都不重要，也不预测变化会何时完成。例如，共同任务只调整了材料交接方式，可以重点核对这一环节怎样影响前后步骤，同时保留对整体资源的检查。建议先确认图上标记的实际位置，再读对应白话，写下一个需要核实的问题；让焦点帮助安排观察，不用一次局部改变替全部过程作判断。
    advice:
      - 核对唯一动爻的前后衔接
    do:
      - 核对事实
    dont:
      - 仓促承诺
  en:
    title: Focus on the single changed position and its connections
    summary: Focus on the single changed position and its connections
    body:
      You can inspect the one marked position and then return it to the whole arrangement. A single
      moving line, or dòng yáo — a line selected to flip, is the main entry under the traditional
      rule. Its line statement describes a symbolic position; the source and plain commentary are
      separate, and historical roles need not be assigned to people in your life. One focus does not
      make all other conditions irrelevant or specify when a transition will finish. If a shared
      task changes only its material handover, check how that link connects to the stages before and
      after it. Consider verifying the actual position and writing down one question from its
      commentary. Let the focus organize attention without making a local change stand in for the
      entire process.
    advice:
      - Check the single changed link
    do:
      - Check facts
    dont:
      - Rush commitments
  meta:
    author: t23-original-v1
    reviewed_by: null
    version: 1
    status: published
- id: iching.moving_lines.count_2
  system: iching
  section: moving_lines
  topic: moving_count
  when:
