# All 19 finding keys currently emitted by installLiuyao; no invented features.
- id: iching.finding.month_supports
  system: iching
  section: process_outcome
  topic: finding_month_supports
  when:
    all:
      - path: method
        eq: liuyao
      - path: liuyao.findings
        contains: month_supports
  weight: 66
  polarity: neutral
  tags:
    - plain
    - iching.clarity
  exclusive_with: []
  zh:
    title: 较长周期的支持，可以先看怎样落实
    summary: 较长周期的支持，可以先看怎样落实
    body: 你可以先核对较稳定的背景条件怎样帮助当前任务。月建（起卦月的地支）生扶（起卦月的地支五行（木火土金水的关系分类）支持相关爻）是六爻里观察较长背景的规则，相关爻由问题类别选定；这里命中的是月的支持，不代表所有条件都已经齐备，也不直接给出持续天数。它适合提醒你检查资源是否有连续供应，以及你能否实际使用。例如，团队长期保留学习时段，但你仍需约定谁能指导、材料在哪里，才能把制度变成练习。建议把支持写成可核对的安排，先使用一轮再看缺口；如果日常仍有新的限制，也一并记录，不因为背景较有利就忽略短期负荷。
    advice:
      - 确认一项持续支持的使用方式
    do:
      - 核对事实
    dont:
      - 仓促承诺
  en:
    title: Look for the practical form of longer-running support
    summary: Look for the practical form of longer-running support
    body:
      'You can inspect the practical shape of support that is meant to continue. Month support comes
      from yuè jiàn (月建 — the casting month’s branch) sharing or feeding the element of a selected
      line. It is a longer-background comparison within Liuyao, not a promise about a number of days
      or the readiness of every resource. Suppose a team regularly reserves time for learning: a
      mentor, accessible material, and an agreed task are still needed before the allowance becomes
      useful practice. Consider writing down how the support can be used and testing it once. Record
      a short-term constraint as well if one appears. A supportive background is easier to apply
      when you distinguish its steady provision from the specific arrangements needed today.'
    advice:
      - Confirm access to continuing support
    do:
      - Check facts
    dont:
      - Rush commitments
  meta:
    author: t23-original-v1
    reviewed_by: null
    version: 1
    status: published
- id: iching.finding.month_controls
  system: iching
  section: process_outcome
  topic: finding_month_controls
  when:
    all:
      - path: method
        eq: liuyao
      - path: liuyao.findings
        contains: month_controls
  weight: 66
  polarity: neutral
  tags:
    - plain
    - iching.clarity
  exclusive_with: []
  zh:
    title: 背景限制值得单独识别，不必归为自己的不足
    summary: 背景限制值得单独识别，不必归为自己的不足
    body: 你可以先找出持续限制来自哪里，再决定要调整什么。月建（起卦月的地支）克制（起卦月地支的五行（木火土金水的关系分类）约束相关爻）是较长背景的象征比较，相关爻是问题选出的观察位置；它不是判断个人能力或他人意图的方法，也不能据此推定现实中的障碍会持续多久。限制可能对应资源、规则或配合方式，实际原因要另行核查。例如，一项任务总在同样的审批环节等待，可以整理所需材料与固定时间，而不是每次只增加催促。建议先问清一处最关键的要求，选择缩小范围、补足依赖或调整顺序；给方案留复查点，让真实变化能够改变你的行动。
    advice:
      - 核对一处持续受限的要求
    do:
      - 核对事实
    dont:
      - 仓促承诺
  en:
    title: Identify a background constraint before adding more effort
    summary: Identify a background constraint before adding more effort
    body:
      You can identify a repeating constraint before deciding how much more effort to invest. Month
      control comes from yuè jiàn (月建 — the casting month’s branch) constraining the element of a
      selected line. It is a background comparison, not a measure of competence or a revelation of
      someone’s motives. The label does not establish how long an actual obstruction will last. For
      instance, a task may repeatedly wait at the same review point; collecting the requirements and
      normal schedule can help more than sending another impatient request. Consider clarifying the
      most important condition, then adjusting scope, sequence, or preparation. Set a review so new
      facts can alter the arrangement. A recurring limit becomes easier to address when it has a
      concrete location rather than being attributed to your whole ability.
    advice:
      - Clarify a recurring constraint
    do:
      - Check facts
    dont:
      - Rush commitments
  meta:
    author: t23-original-v1
    reviewed_by: null
    version: 1
    status: published
- id: iching.finding.day_supports
