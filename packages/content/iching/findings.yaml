  zh:
    title: 所需线索不在明面时，先寻找合适入口
    summary: 所需线索不在明面时，先寻找合适入口
    body: 你可以先整理已有线索，再寻找能把所需条件接出来的人或材料。伏神（本卦（起卦得到的主要六条线）没有某类角色时从本宫卦补出的对应线）是六爻里的补充观察位置，这里与问题焦点有关；隐藏并不表示他人有秘密，也不是鼓励你猜测。它适合提醒你了解资源为何还不容易使用。例如，一份资料存在于另一团队的整理目录中，知道它存在仍不足以完成任务，还需要联系人、合适权限与用途说明。建议用清楚的问题请求访问或反馈，先取得一项能核对的材料；如果入口仍模糊，就暂缓扩大承诺，保留现有记录，让信息逐步成为现实可用的条件。
    advice:
      - 寻找一个可核对的资料入口
    do:
      - 核对事实
    dont:
      - 仓促承诺
  en:
    title: Find a usable route to a less visible resource
    summary: Find a usable route to a less visible resource
    body: You can organize existing clues before asking how to reach a less visible resource. Hidden
      refers to fú shén (伏神 — a relative supplied from the pure palace figure when it is missing
      from the primary one), here relevant to the question’s focus. It is an additional symbolic
      position, not an allegation that someone has a secret. A useful guide may exist in another
      group’s archive while the contact, permission, and purpose needed to use it remain unclear.
      Consider making a precise request and obtaining one checkable item before expanding your
      commitment. Keep the record if access is still uncertain. The practical value is to turn a
      clue into an available condition rather than multiplying guesses about what is concealed
      behind the visible arrangement.
    advice:
      - Find a checkable source
    do:
      - Check facts
    dont:
      - Rush commitments
  meta:
    author: t23-original-v1
    reviewed_by: null
    version: 1
    status: published
