  tags:
    - plain
    - iching.clarity
  exclusive_with: []
  zh:
    title: 变化出现回补时，可以检查帮助怎样进入任务
    summary: 变化出现回补时，可以检查帮助怎样进入任务
    body: 你可以先确认变化后的支持怎样回到原来的任务。回头生（变爻（变化后的对应线）五行（木火土金水的关系分类）反过来支持原爻五行）描述六爻里一种回补关系，变爻是变化后的对应位置；它并不表示资源已收到，也不代表整个过程都已完成。帮助的方向可以成为检查入口，但仍要看材料、权限与时间如何配合。例如，试用新流程后同事提出可用的改进，你可以把建议落实到一个真实环节，再观察是否减轻了原先的负担。建议先约定回补支持的使用方式，记录一轮实际反馈；已有限制也继续关注，让新增的帮助服务于原任务，而不是马上增加更多期待或把帮助者的责任无限扩大。
    advice:
      - 检验一项回补是否实际可用
    do:
      - 核对事实
    dont:
      - 仓促承诺
  en:
    title: Trace helpful feedback through an actual arrangement
    summary: Trace helpful feedback through an actual arrangement
    body:
      'You can trace whether a new condition provides usable support to the original task. Return
      generated is huí tóu shēng — the changed line’s element feeds the original line’s element. The
      changed line is the corresponding position after transition, and the comparison does not mean
      assistance has arrived or the process is complete. Suppose a trial workflow produces a useful
      suggestion from a colleague: apply it to one actual step and inspect whether the old burden
      becomes lighter. Try agreeing on how the feedback will be used and recording one round of
      results. Keep other limitations visible as well. An added source of help works best when it
      serves the existing task instead of immediately becoming a reason for new expectations or
      unlimited demands on the person helping.'
    advice:
      - Test useful feedback in practice
    do:
      - Check facts
    dont:
      - Rush commitments
  meta:
    author: t23-original-v1
    reviewed_by: null
    version: 1
    status: published
- id: iching.finding.return_controlled
  system: iching
