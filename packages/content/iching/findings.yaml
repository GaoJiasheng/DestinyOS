  weight: 66
  polarity: neutral
  tags:
    - plain
    - iching.clarity
  exclusive_with: []
  zh:
    title: 变化增加新要求时，可以修订原计划
    summary: 变化增加新要求时，可以修订原计划
    body: 你可以先承认变化后的条件不同，再修订原有做法。回头克（变爻（变化后的对应线）五行（木火土金水的关系分类）反过来约束原爻五行）是反馈带来限制的象征比较，变爻指变化后的对应位置；它不说明有人故意阻挠，也不能据此评价你的能力。原先能用的安排可能需要更新，而不宜只靠更多努力维持旧计划。例如，流程改动后新增一项材料要求，你可以问清用途与格式，调整顺序或商量范围，不把返工简单理解成别人不认可自己。建议把最难承接的新要求写清，选择能降低负荷的替代方式，并约定复查；现实中的调整有用时，就按新信息行动，给自己的判断保留转向空间。
    advice:
      - 修订一项最不合适的新要求
    do:
      - 核对事实
    dont:
      - 仓促承诺
  en:
    title: Revise the original plan when feedback adds a constraint
    summary: Revise the original plan when feedback adds a constraint
    body: You can acknowledge a changed condition before revising the earlier approach. Return
      controlled is huí tóu kè — the changed line’s element constrains the original line’s element.
      It is an image of limiting feedback, not evidence of deliberate obstruction or a measure of
      your competence. A new material requirement after a workflow revision may need a format check
      and a different sequence, rather than simply more effort under the old plan. Consider naming
      the least workable demand, asking what purpose it serves, and proposing a manageable
      alternative. Agree on a review so updated facts can guide the next response. When a revision
      proves useful in ordinary practice, let that evidence matter more than either the earlier
      expectation or an alarming interpretation of the label.
    advice:
      - Revise a new constraint
    do:
      - Check facts
    dont:
      - Rush commitments
  meta:
    author: t23-original-v1
    reviewed_by: null
    version: 1
    status: published
