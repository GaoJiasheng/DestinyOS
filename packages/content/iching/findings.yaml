  exclusive_with: []
  zh:
    title: 临时限制出现时，先重排行动次序
    summary: 临时限制出现时，先重排行动次序
    body: 你可以把眼前的阻碍单独处理，不必因此否定整个方向。日辰（起卦日的地支）克制（起卦日地支的五行（木火土金水的关系分类）约束相关爻）是较近条件的象征比较，相关爻是问题选出的观察位置；这种关系不揭示个人动机，也不预测今天会发生什么。它适合提醒你先核对现场条件，看是否需要等候、换顺序或请求配合。例如，一次交流临时取消时，可以先完成自己能整理的资料，约定新的联系入口，而不据此猜测对方已经拒绝全部合作。建议把需要确认的一项事实问清楚，同时保留小的备用安排；待信息更新后再评估，避免用一时受阻来扩大情绪或增加无谓投入。
    advice:
      - 确认眼前限制的实际范围
    do:
      - 核对事实
    dont:
      - 仓促承诺
  en:
    title: Adjust the sequence around an immediate constraint
    summary: Adjust the sequence around an immediate constraint
    body: 'You can isolate an immediate obstacle without rejecting the entire direction. Day control
      comes from rì chén (日辰 — the casting day’s branch) constraining the element of a selected
      line. This is a nearer-condition comparison, not a prediction of today’s events or an account
      of someone’s intentions. Suppose a conversation is postponed: organize the part you can
      complete independently and agree on another point of contact, rather than inferring that the
      whole collaboration has been declined. Consider asking for the one fact you need and keeping a
      modest alternative available. Review the plan after the information changes. A temporary
      interruption becomes more manageable when its practical extent is named instead of being
      allowed to define the whole situation. Keep the request tied to a condition you can check.'
    advice:
      - Check the immediate limit
    do:
      - Check facts
    dont:
      - Rush commitments
  meta:
    author: t23-original-v1
    reviewed_by: null
    version: 1
    status: published
- id: iching.finding.void
  system: iching
  section: process_outcome
  topic: finding_void
  when:
    all:
      - path: method
        eq: liuyao
      - path: liuyao.findings
        contains: void
  weight: 66
  polarity: neutral
  tags:
    - plain
    - iching.clarity
  exclusive_with: []
  zh:
    title: 意向与落实之间，可以多做一次确认
    summary: 意向与落实之间，可以多做一次确认
    body: 你可以先把说过的安排与已经可用的条件分开。旬空（当前日柱所属周期中暂未配到的两个地支）是六爻的时间标记，这里有相关爻落入其内；它不是现实中缺少某个人或事情不会发生的证据。空的提醒在于核对承接是否到位，不必转成猜疑。例如，大家都愿意参与一项活动，但场地与时间尚未确认，你可以先记录意向，再请相关的人回复实际能够配合的范围。建议把待确认的条件列成短清单，在准备充分前不额外扩张承诺；若资料和回应已实落，就按事实推进，不必为了符合象征标记而继续等待，也不把空看成对自身价值的否定。
    advice:
      - 列出尚未确认的条件
    do:
      - 核对事实
    dont:
      - 仓促承诺
  en:
    title: Check readiness behind an apparent commitment
    summary: Check readiness behind an apparent commitment
    body: You can distinguish a stated intention from a condition ready for use. Void comes from xún
      kōng (旬空 — two unpaired branches in the casting day’s cycle), with a relevant line falling
      within that pair. It does not establish the absence of a real person or the impossibility of
      an event. For example, people may be interested in a shared activity while the place and time
      remain unconfirmed. Record the interest, then ask for the actual availability needed to
      organize it. Consider keeping a short list of pending conditions and avoiding additional
      promises until those items are settled. If the resources and responses are already usable,
      proceed according to facts. The time marker should encourage a practical check, not continuing
      suspicion or a negative judgment about your worth.
    advice:
      - List pending confirmations
    do:
      - Check facts
    dont:
      - Rush commitments
  meta:
    author: t23-original-v1
    reviewed_by: null
    version: 1
    status: published
