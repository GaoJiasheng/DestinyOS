      - path: liuyao.findings
        contains: moving
  weight: 66
  polarity: neutral
  tags:
    - plain
    - iching.clarity
  exclusive_with: []
  zh:
    title: 关键环节在变化，适合核对前后安排
    summary: 关键环节在变化，适合核对前后安排
    body: 你可以先看清哪些条件正在变化，再决定怎样接续。发动（相关爻被标记为阴阳转换）说明问题的观察位置具有动态，动爻（被标记为翻转阴阳的线）是本卦（起卦得到的主要六条线）里变化的线；动态本身不表示支持或阻碍，也不决定转变快慢。这里宜关注前后的职责、材料与参与方式是否能接上。例如，团队调整分工后，同一项任务可能改由不同的人提供材料，你可以明确交接的入口与未完成部分，避免沿用旧约定继续等待。建议先做一份简短的前后清单，把最容易遗漏的一项变化单独确认；对尚未准备好的环节保留缓冲，等实际配合清楚后再扩大安排，让变化有可以承接的结构。
    advice:
      - 核对一项变化后的交接
    do:
      - 核对事实
    dont:
      - 仓促承诺
  en:
    title: Inspect the transition around the selected focus
    summary: Inspect the transition around the selected focus
    body:
      You can inspect what is changing before deciding how to connect the next step. Moving refers
      to dòng yáo (动爻 — a marked line whose value flips), here involving a selected focus of the
      question. Motion does not itself mean help, obstruction, or a particular speed of transition.
      A team changing roles may move a material handover to another person while the task retains
      its familiar name. Consider making a short before-and-after list of responsibilities and
      unfinished items, then confirming the change most likely to be missed. Leave a buffer for a
      part that is not yet ready. A transition becomes easier to navigate when the new arrangement
      has a clear point of access instead of relying on expectations carried over from the old one.
    advice:
      - Check a changed handover
    do:
      - Check facts
    dont:
      - Rush commitments
  meta:
    author: t23-original-v1
    reviewed_by: null
    version: 1
    status: published
