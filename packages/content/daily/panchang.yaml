  zh:
    title: 你可以先了解月日的时间口径。
    summary: 你可以先了解月日的时间口径。
    body: 你可以先了解月日的时间口径。Tithi（Panchang 五要素日历中的月日标记）描述当天一种历法关系。日月黄经差每十二度分为一段，描述月亮相对太阳的进度。这些名称帮助你认识传统计算方式，不替你判断重要安排的价值。地点与时区会影响日出或交接时刻，同一天也可能跨过多个区段。比如你想安排阅读，可以先确认现实里安静且有空的时间，再把历法信息作为文化背景。建议只观察一个交接前后的日常片段，记录真实感受，不急着把不同体验归因于符号。若出生地被用作当前位置近似，时刻也应保留相应余地。你可以逐项学习，遇到陌生名称先查看术语卡，不必机械等待某个区段才开始普通任务。
    advice:
      - 先看定义，再看当地时间。
    do:
      - 了解日历
    dont:
      - 机械等待
  en:
    title: Learn the Tithi calendar measure.
    summary: Learn the Tithi calendar measure.
    body:
      You can begin by learning what Tithi measures and which time boundary it uses. It is one part of
      Panchang, a five-part Vedic calendar, rather than a personal outcome rating. It divides the Sun–Moon
      longitude difference into twelve-degree sectors, describing lunar progress relative to the Sun. Location
      and time zone matter for sunrise and transitions, and more than one sector may occur during a civil day.
      For example, choose a quiet reading period from your actual schedule before treating the calendar as
      optional cultural context. Consider observing one ordinary activity around a listed transition, recording
      the experience without assuming the symbol caused it. If a birthplace is being used as an approximation
      of your current location, leave room around the timing as well. You can learn the labels gradually and
      check a definition whenever a name is unfamiliar. Ordinary tasks do not need to wait for a particular
      calendar sector.
    advice:
      - Read the definition before applying the time.
    do:
      - Learn a label
    dont:
      - Wait mechanically
  meta:
    author: t23-daily-editorial-v1
    reviewed_by: null
    version: 1
    status: published
