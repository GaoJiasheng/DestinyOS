- id: daily.career.ten_god.bi_jian.strong
  system: daily
  section: career
  topic: daily.career.direction
  when:
    path: findings
    contains: bazi.tenGod.bi_jian.strong
  weight: 78
  polarity: neutral
  tags:
    - plain
    - career
  exclusive_with: []
  zh:
    title: 你可以用自主协作的方式处理工作与学习。
    summary: 你可以用自主协作的方式处理工作与学习。
    body: 你可以用自主协作的方式处理工作与学习。比肩（与日主同类同阴阳的流日天干）把自主与同伴关系带到眼前。你容易关注自己能做什么，也会在同伴的反馈中校准方向。相近的立场不代表需求相同，合作仍需要各自留出表达空间。身强（模型中日主支持较多）表示承接任务的象征较突出，不等于你现实中总有足够精力。比如提交草稿前，你可以先请接收者确认重点，再决定哪些细节值得补齐。换到一个小场景，你也可以与同事分工时，先认领一块能独立完成的任务。建议设一个短检查点，遇到新要求时重新估计范围，不用把速度当成能力证明。行动之后留意实际反馈，再决定哪些做法值得保留，让当天的象征服务于你自己的选择。
    advice:
      - 设定一个能检查的交付点。
    do:
      - 确认重点
    dont:
      - 盲目赶工
  en:
    title: Name your role in work and study.
    summary: Name your role in work and study.
    body:
      Name your role in work and study. Friend (bǐ jiān — a daily stem sharing your natal stem’s element
      and polarity) invites you to examine independence alongside belonging. A familiar viewpoint can make
      collaboration comfortable, yet agreement does not remove the need to name separate responsibilities.
      You can keep ownership of your work while welcoming someone else’s method. Strong (shēn qiáng — greater
      natal-stem support in the model) emphasizes capacity to engage, without measuring the energy you actually
      have. For example, send an outline before developing a longer presentation and ask which question the
      reader needs it to answer. In another small situation, in a study group, volunteer to explain one topic
      instead of competing to answer every question. Consider a review point where you can adjust the scope,
      rather than treating speed as a measure of ability. Review the actual response before extending the plan,
      and keep only the part that helps you navigate your own circumstances.
    advice:
      - Define one reviewable deliverable.
    do:
      - Clarify priorities
    dont:
      - Rush every task
  meta:
    author: t23-daily-editorial-v1
    reviewed_by: null
    version: 1
    status: published
