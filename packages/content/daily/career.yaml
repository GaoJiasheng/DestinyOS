  zh:
    title: 你可以先给工作中的推动力安排一个清楚目标。
    summary: 你可以先给工作中的推动力安排一个清楚目标。
    body: 你可以先给工作中的推动力安排一个清楚目标。行运（当天星位与本命位置的角度比较）中，土星（象征责任边界）与本命月亮（象征熟悉感与情绪）形成对分相（传统相位的一种角距）。你可能更在意要求和限制，可以先分清必须承担与能够协商的部分。约一百八十度的角距象征两种需要的拉扯，建议把双方要求分别列清再找折中。比如对一个任务感到急迫时，你可以先问接收者哪部分最重要，再把交付拆成今天能完成的一小段。建议把这个提示用在一个可调整的小动作上，再观察实际结果。涉及重要选择时仍要看可靠资料与实际条件，不把当天象征当作结果预告。
    advice:
      - 把冲突的两项需要分别写下来。
    do:
      - 核对需要
    dont:
      - 急下结论
  en:
    title: You can give work effort a clear and limited aim.
    summary: You can give work effort a clear and limited aim.
    body:
      'You can give work effort a clear and limited aim. A transit compares a current sky position with
      a natal position; this one links Saturn with natal Moon through a opposition. Transiting Saturn highlights
      responsibility and limits. You can identify the part that belongs to you and negotiate the part that
      needs another person’s contribution. An opposition describes an angle of about 180 degrees and a tension
      between perspectives. You can name both needs before seeking a workable adjustment. The natal point adds
      a question about your own habits: Notice your mood before adding another conversation to your day. For
      example, ask which part of a delivery the recipient needs first. A usable first portion may help more
      than pushing every optional detail through at once. Consider one modest adjustment, then review what
      actually changed. Practical information remains the basis for important choices; a symbolic angle does
      not establish the outcome.'
    advice:
      - List two competing needs before choosing a compromise.
    do:
      - Check the need
    dont:
      - Rush a judgment
