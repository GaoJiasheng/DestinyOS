- id: daily.career.retrograde.mercury
  system: daily
  section: career
  topic: daily.career.direction
  when:
    path: astro.retrogrades
    contains: mercury
  weight: 46
  polarity: negative
  tags:
    - plain
    - career
  exclusive_with: []
  zh:
    title: 你可以在工作交接前复核关键信息。
    summary: 你可以在工作交接前复核关键信息。
    body: 你可以在工作交接前复核关键信息。水星逆行（从地球观察时黄经速度为负的表观运动）是集体星象，不说明每个人会遇到同样的事。这里把它作为回看信息传递的提醒，真实原因仍需要从环境、安排和交流中了解。比如交接一份任务清单，你可以确认版本、负责人和截止时间，先让对方知道哪些问题仍待回答。建议只修改一个已经确认的细节，再检查实际反馈。资料不足时保留余地，不需要为了符号改变所有日程。复核的目的是减少信息差，而不是为尚未发生的事情做预设。
    advice:
      - 核对一个实际细节，再决定是否调整。
    do:
      - 复核细节
    dont:
      - 提前担忧
  en:
    title: You can review a handover before sending it.
    summary: You can review a handover before sending it.
    body:
      You can review a handover before sending it. Retrograde motion means a negative apparent longitude
      speed from Earth; it is a collective sky condition rather than an account of what each person will experience.
      Use the symbol to open a review, while looking to real arrangements and communication for the cause of
      a problem. For example, identify the current version, owner, and deadline in a handover, and mark any
      question that remains open. Consider changing one confirmed detail and reviewing the actual response.
      You can keep a workable schedule while leaving time to check what remains uncertain. The symbolic label
      is a reflection prompt, while practical information remains the basis for a decision. The purpose of
      the review is to clarify information rather than anticipate an event.
    advice:
      - Check one practical detail before changing more.
    do:
      - Review a detail
    dont:
      - Worry in advance
  meta:
    author: t23-daily-editorial-v1
    reviewed_by: null
    version: 1
    status: published
