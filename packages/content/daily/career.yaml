  zh:
    title: 你可以先检查工作与学习里的共同安排。
    summary: 你可以先检查工作与学习里的共同安排。
    body: 你可以先检查工作与学习里的共同安排。日支六合（流日地支与原局日支的配对关系）把协调与共同安排放到眼前。你可以借此检查彼此是否真的同意，温和的气氛也需要明确细节。你可以把今天的工作与学习拆成看得见的交付。先明确任务的用途，再决定做法，能避免在不重要的细节上消耗太多时间。进度受实际资源和协作安排影响，不只取决于当天的象征。比如提交草稿前，先让接收者确认方向，再补齐格式。建议设一个短检查点，遇到新要求时重新估计范围。
