- id: daily.career.transit.mars_opposition_sun
  system: daily
  section: career
  topic: daily.career.direction
  when:
    path: findings
    contains: astro.transit.mars_opposition_sun
  weight: 48
  polarity: negative
  tags:
    - plain
    - career
  exclusive_with: []
  zh:
    title: 你可以先给工作中的推动力安排一个清楚目标。
    summary: 你可以先给工作中的推动力安排一个清楚目标。
    body: 你可以先给工作中的推动力安排一个清楚目标。行运（当天星位与本命位置的角度比较）中，火星（象征行动节奏）与本命太阳（象征目标与表达）形成对分相（传统相位的一种角距）。你可能更急于推动事情，先确认目的和可用精力，避免把速度当成效果。约一百八十度的角距象征两种需要的拉扯，建议把双方要求分别列清再找折中。比如对一个任务感到急迫时，你可以先问接收者哪部分最重要，再把交付拆成今天能完成的一小段。建议把这个提示用在一个可调整的小动作上，再观察实际结果。涉及重要选择时仍要看可靠资料与实际条件，不把当天象征当作结果预告。
    advice:
      - 把冲突的两项需要分别写下来。
    do:
      - 核对需要
    dont:
      - 急下结论
  en:
    title: You can give work effort a clear and limited aim.
    summary: You can give work effort a clear and limited aim.
    body:
      'You can give work effort a clear and limited aim. A transit compares a current sky position with
      a natal position; this one links Mars with natal Sun through a opposition. Transiting Mars invites a
      check of initiative and pace. Energy can help a task begin, while a clear purpose keeps haste from becoming
      unnecessary friction. An opposition describes an angle of about 180 degrees and a tension between perspectives.
      You can name both needs before seeking a workable adjustment. The natal point adds a question about your
      own habits: Check whether a request fits the aim you actually want to pursue. For example, ask which
      part of a delivery the recipient needs first. A usable first portion may help more than pushing every
      optional detail through at once. Consider one modest adjustment, then review what actually changed. Practical
      information remains the basis for important choices; a symbolic angle does not establish the outcome.'
    advice:
      - List two competing needs before choosing a compromise.
    do:
      - Check the need
    dont:
      - Rush a judgment
  meta:
    author: t23-daily-editorial-v1
    reviewed_by: null
    version: 1
    status: published
