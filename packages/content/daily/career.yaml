- id: daily.career.ten_god.shi_shen.strong
  system: daily
  section: career
  topic: daily.career.direction
  when:
    path: findings
    contains: bazi.tenGod.shi_shen.strong
  weight: 78
  polarity: neutral
  tags:
    - plain
    - career
  exclusive_with: []
  zh:
    title: 你可以用温和创造的方式处理工作与学习。
    summary: 你可以用温和创造的方式处理工作与学习。
    body: 你可以用温和创造的方式处理工作与学习。食神（由日主生出且阴阳相同的流日天干）象征把经验化为可享受的成果。你容易从熟悉的技能中找到表达入口，温和说明往往比急着说服更顺手。舒适的节奏也需要收尾，否则点子会停在想象里。身强（模型中日主支持较多）表示承接任务的象征较突出，不等于你现实中总有足够精力。比如提交草稿前，你可以先请接收者确认重点，再决定哪些细节值得补齐。换到一个小场景，你也可以把旧笔记整理成一页清晰的学习卡片。建议设一个短检查点，遇到新要求时重新估计范围，不用把速度当成能力证明。行动之后留意实际反馈，再决定哪些做法值得保留，让当天的象征服务于你自己的选择。
    advice:
      - 设定一个能检查的交付点。
    do:
      - 确认重点
    dont:
      - 盲目赶工
  en:
    title: Finish a small draft in work and study.
    summary: Finish a small draft in work and study.
    body:
      Finish a small draft in work and study. Eating God (shí shén — an output stem with matching polarity)
      turns attention toward useful expression and everyday enjoyment. You may find a familiar craft easier
      to share than an ambitious performance. The symbol favors noticing what you can make tangible, with a
      modest finish line that keeps pleasure connected to practice. Strong (shēn qiáng — greater natal-stem
      support in the model) emphasizes capacity to engage, without measuring the energy you actually have.
      For example, send an outline before developing a longer presentation and ask which question the reader
      needs it to answer. In another small situation, show a teammate a rough sketch so the idea can become
      a conversation rather than a private plan. Consider a review point where you can adjust the scope, rather
      than treating speed as a measure of ability. Review the actual response before extending the plan, and
      keep only the part that helps you navigate your own circumstances.
    advice:
      - Define one reviewable deliverable.
    do:
      - Clarify priorities
    dont:
      - Rush every task
  meta:
    author: t23-daily-editorial-v1
    reviewed_by: null
    version: 1
    status: published
