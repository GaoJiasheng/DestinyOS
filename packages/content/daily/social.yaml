  zh:
    title: 你可以用压力排序的方式处理协作与边界。
    summary: 你可以用压力排序的方式处理协作与边界。
    body: 你可以用压力排序的方式处理协作与边界。七杀（克制日主且阴阳相同的流日天干）用来观察压力、行动和边界。你可能更敏锐地感到期限或竞争，容易把所有请求都当成急事。它不说明危险将发生；把压力拆成具体要求，才有机会选择合理的回应。身强（模型中日主支持较多）表示承接任务的象征较突出，不等于你现实中总有足够精力。比如群聊里有多个建议时，你可以先总结共同点，再问谁愿意负责下一步。换到一个小场景，你也可以面对临时加急任务，先问清最晚需要哪一部分。建议让邀请容易拒绝，也让承诺有明确范围，不必把持续在线当作维持关系的要求。行动之后留意实际反馈，再决定哪些做法值得保留，让当天的象征服务于你自己的选择。
    advice:
      - 确认一项彼此接受的协作范围。
    do:
      - 清楚邀约
    dont:
      - 勉强答应
  en:
    title: Rank the demands in cooperation and boundaries.
    summary: Rank the demands in cooperation and boundaries.
    body:
      Rank the demands in cooperation and boundaries. Seven Killings (qī shā — a demanding stem of matching
      polarity) is a historical term for pressure and decisive action. Treat it as a question about priorities,
      not an alarm. A deadline may feel louder than usual, making every incoming request seem urgent. Strong
      (shēn qiáng — greater natal-stem support in the model) emphasizes capacity to engage, without measuring
      the energy you actually have. For example, summarize a shared decision in a group chat and invite someone
      to take the next step only if it fits their schedule. In another small situation, when messages arrive
      at once, identify which person needs an answer today and which can wait. Consider a request that is easy
      to decline and a commitment with a clear handover point. Review the actual response before extending
      the plan, and keep only the part that helps you navigate your own circumstances.
    advice:
      - Agree on a comfortable scope together.
    do:
      - Invite clearly
    dont:
      - Agree under pressure
