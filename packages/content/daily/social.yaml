  zh:
    title: 你可以用共享边界的方式处理协作与边界。
    summary: 你可以用共享边界的方式处理协作与边界。
    body: 你可以用共享边界的方式处理协作与边界。劫财（同类但阴阳不同的流日天干）提示共享、竞争与资源边界。你可能想跟上同伴的节奏，也可能为了气氛爽快答应额外开销。它不是损失预告，重点是分清参与意愿和实际承受范围。身强（模型中日主支持较多）表示承接任务的象征较突出，不等于你现实中总有足够精力。比如群聊里有多个建议时，你可以先总结共同点，再问谁愿意负责下一步。换到一个小场景，你也可以聚餐前确认预算，不因别人的选择临时加码。建议让邀请容易拒绝，也让承诺有明确范围，不必把持续在线当作维持关系的要求。行动之后留意实际反馈，再决定哪些做法值得保留，让当天的象征服务于你自己的选择。
    advice:
      - 确认一项彼此接受的协作范围。
    do:
      - 清楚邀约
    dont:
      - 勉强答应
  en:
    title: Set a limit in cooperation and boundaries.
    summary: Set a limit in cooperation and boundaries.
    body:
      Set a limit in cooperation and boundaries. Rob Wealth (jié cái — a peer stem of opposite polarity)
      is a traditional label for sharing and rivalry. Here it asks how you join others without losing track
      of your own limits. A lively group can encourage generosity, but enthusiasm is different from available
      time or a comfortable budget. Strong (shēn qiáng — greater natal-stem support in the model) emphasizes
      capacity to engage, without measuring the energy you actually have. For example, summarize a shared decision
      in a group chat and invite someone to take the next step only if it fits their schedule. In another small
      situation, if several colleagues buy supplies together, agree on contributions before placing the order.
      Consider a request that is easy to decline and a commitment with a clear handover point. Review the actual
      response before extending the plan, and keep only the part that helps you navigate your own circumstances.
    advice:
      - Agree on a comfortable scope together.
    do:
      - Invite clearly
    dont:
      - Agree under pressure
