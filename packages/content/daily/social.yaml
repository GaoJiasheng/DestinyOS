    body: 你可以先让协作中的信息容易被理解。行运（当天星位与本命位置的角度比较）中，水星（象征信息整理）与本命太阳（象征目标与表达）形成合相（传统相位的一种角距）。你可能更关注沟通的细节，先核对意思和接收方式，让信息容易被理解。相近角度把两个象征放到一起，提示你关注这两种需要如何同时出现。比如群聊需要确认安排，你可以先总结已经同意的部分，再问一个具体问题，不要求所有人立刻回复。建议把这个提示用在一个可调整的小动作上，再观察实际结果。涉及重要选择时仍要看可靠资料与实际条件，不把当天象征当作结果预告。
    advice:
      - 先说清此刻最需要的一件事。
    do:
      - 核对需要
    dont:
      - 急下结论
  en:
    title: You can make a cooperative message easier to use.
    summary: You can make a cooperative message easier to use.
    body:
      'You can make a cooperative message easier to use. A transit compares a current sky position with
      a natal position; this one links Mercury with natal Sun through a conjunction. Transiting Mercury draws
      attention to information and exchange. Make an explanation easy to use, then check how it was received
      instead of assuming the message was clear. Conjunction combines two symbolic functions at a close angle.
      It invites a check of how they operate together rather than assigning one universal outcome. The natal
      point adds a question about your own habits: Check whether a request fits the aim you actually want to
      pursue. For example, summarize the part of a group plan that has already been agreed. Ask one remaining
      question instead of sending several overlapping instructions. Consider one modest adjustment, then review
      what actually changed. Practical information remains the basis for important choices; a symbolic angle
      does not establish the outcome.'
    advice:
      - Name your immediate need before adding another request.
    do:
      - Check the need
    dont:
      - Rush a judgment
