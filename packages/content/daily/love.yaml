  zh:
    title: 你可以用机会筛选的方式处理关系中的沟通。
    summary: 你可以用机会筛选的方式处理关系中的沟通。
    body: 你可以用机会筛选的方式处理关系中的沟通。偏财（由日主所克且阴阳相同的流日天干）象征流动资源和临时机会。你可能留意到新的合作入口，或想同时尝试几个方向。这个标记不预测收益；机会是否合适，要看成本、资料和你能投入的精力。身强（模型中日主支持较多）表示承接任务的象征较突出，不等于你现实中总有足够精力。比如你想见面而朋友需要休息，可以提供两个轻松选项，让对方自由选择。换到一个小场景，你也可以收到合作邀请后，先确认范围和退出方式。建议用具体请求代替猜测，回复慢时给彼此保留空间，亲近与边界可以一起被照顾。行动之后留意实际反馈，再决定哪些做法值得保留，让当天的象征服务于你自己的选择。
    advice:
      - 用一个具体请求开启交流。
    do:
      - 倾听回应
    dont:
      - 猜测心意
  en:
    title: Compare the options in communication in relationships.
    summary: Compare the options in communication in relationships.
    body:
      'Compare the options in communication in relationships. Indirect Wealth (piān cái — a resource-managing
      stem of matching polarity) points to flexible opportunities rather than expected returns. You might notice
      a new connection or an unused tool that could help a project. Possibility deserves a practical filter:
      available information, the cost of trying, and the effort you can realistically sustain. Strong (shēn
      qiáng — greater natal-stem support in the model) emphasizes capacity to engage, without measuring the
      energy you actually have. For example, offer a short call or a later meeting when you want company, and
      leave room for the other person to choose. In another small situation, a community project may need your
      skill for a limited trial; ask what delivery would look like before agreeing. Consider one open question
      and allow an honest response, including a request for more time. Review the actual response before extending
      the plan, and keep only the part that helps you navigate your own circumstances.'
    advice:
      - Open with one specific request.
    do:
      - Listen openly
    dont:
      - Read minds
  meta:
    author: t23-daily-editorial-v1
    reviewed_by: null
    version: 1
    status: published
