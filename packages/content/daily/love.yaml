    advice:
      - 先说清此刻最需要的一件事。
    do:
      - 核对需要
    dont:
      - 急下结论
  en:
    title: You can make room for a response in a close exchange.
    summary: You can make room for a response in a close exchange.
    body:
      'You can make room for a response in a close exchange. A transit compares a current sky position
      with a natal position; this one links Moon with natal Venus through a conjunction. The transiting Moon
      highlights immediate emotional responses. Notice an atmosphere while checking the facts before you interpret
      it. Conjunction combines two symbolic functions at a close angle. It invites a check of how they operate
      together rather than assigning one universal outcome. The natal point adds a question about your own
      habits: State a preference while leaving room for another person’s different taste. For example, offer
      a specific plan to a friend and ask what would fit their calendar. Keep the invitation easy to decline,
      so the reply can be honest. Consider one modest adjustment, then review what actually changed. Practical
      information remains the basis for important choices; a symbolic angle does not establish the outcome.'
    advice:
      - Name your immediate need before adding another request.
    do:
      - Check the need
    dont:
      - Rush a judgment
