  zh:
    title: 你可以用稳定资源的方式处理关系中的沟通。
    summary: 你可以用稳定资源的方式处理关系中的沟通。
    body: 你可以用稳定资源的方式处理关系中的沟通。正财（由日主所克但阴阳不同的流日天干）关注稳定资源与持续投入。你容易把注意力放在账目、兑现和可重复的步骤上。它不是收入预测，真正有用的部分是让资源去向更清楚，并把承诺控制在现实范围内。身强（模型中日主支持较多）表示承接任务的象征较突出，不等于你现实中总有足够精力。比如你想见面而朋友需要休息，可以提供两个轻松选项，让对方自由选择。换到一个小场景，你也可以核对订阅清单，标出近期没有使用的项目。建议用具体请求代替猜测，回复慢时给彼此保留空间，亲近与边界可以一起被照顾。行动之后留意实际反馈，再决定哪些做法值得保留，让当天的象征服务于你自己的选择。
    advice:
      - 用一个具体请求开启交流。
    do:
      - 倾听回应
    dont:
      - 猜测心意
  en:
    title: Review your resources in communication in relationships.
    summary: Review your resources in communication in relationships.
    body:
      Review your resources in communication in relationships. Direct Wealth (zhèng cái — a resource-managing
      stem of opposite polarity) emphasizes stewardship and consistency. It is a prompt to inspect the small
      systems that support daily life, rather than a forecast about earnings. Clear records and realistic commitments
      make it easier to see what is already working and what needs attention. Strong (shēn qiáng — greater
      natal-stem support in the model) emphasizes capacity to engage, without measuring the energy you actually
      have. For example, offer a short call or a later meeting when you want company, and leave room for the
      other person to choose. In another small situation, before replacing equipment, check whether a repair
      or shared tool would meet the actual need. Consider one open question and allow an honest response, including
      a request for more time. Review the actual response before extending the plan, and keep only the part
      that helps you navigate your own circumstances.
    advice:
      - Open with one specific request.
    do:
      - Listen openly
    dont:
      - Read minds
  meta:
    author: t23-daily-editorial-v1
    reviewed_by: null
    version: 1
    status: published
