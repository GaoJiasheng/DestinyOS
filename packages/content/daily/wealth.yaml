  zh:
    title: 你可以在日常开销里核对一个细节。
    summary: 你可以在日常开销里核对一个细节。
    body: 你可以在日常开销里核对一个细节。水星逆行（从地球观察时黄经速度为负的表观运动）是集体星象，不说明每个人会遇到同样的事。这里把它作为回看信息传递的提醒，真实原因仍需要从环境、安排和交流中了解。比如收到一项续费提醒，你可以核对服务内容和已同意的费用，不按集体星象决定重要财务选择。建议只修改一个已经确认的细节，再检查实际反馈。资料不足时保留余地，不需要为了符号改变所有日程。复核的目的是减少信息差，而不是为尚未发生的事情做预设。
    advice:
      - 核对一个实际细节，再决定是否调整。
    do:
      - 复核细节
    dont:
      - 提前担忧
  en:
    title: You can check one detail in an everyday expense.
    summary: You can check one detail in an everyday expense.
    body:
      You can check one detail in an everyday expense. Retrograde motion means a negative apparent longitude
      speed from Earth; it is a collective sky condition rather than an account of what each person will experience.
      Use the symbol to open a review, while looking to real arrangements and communication for the cause of
      a problem. For example, compare a renewal notice with the service and fee you previously accepted, using
      the actual details rather than a sky label. Consider changing one confirmed detail and reviewing the
      actual response. You can keep a workable schedule while leaving time to check what remains uncertain.
      The symbolic label is a reflection prompt, while practical information remains the basis for a decision.
      The purpose of the review is to clarify information rather than anticipate an event.
    advice:
      - Check one practical detail before changing more.
    do:
      - Review a detail
    dont:
      - Worry in advance
