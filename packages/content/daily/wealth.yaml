      - 核对一项开销的实际用途。
    do:
      - 理清开销
    dont:
      - 冲动购买
  en:
    title: Review your resources in everyday resources.
    summary: Review your resources in everyday resources.
    body:
      Review your resources in everyday resources. Direct Wealth (zhèng cái — a resource-managing stem
      of opposite polarity) emphasizes stewardship and consistency. It is a prompt to inspect the small systems
      that support daily life, rather than a forecast about earnings. Clear records and realistic commitments
      make it easier to see what is already working and what needs attention. Weak (shēn ruò — lower natal-stem
      support in the model) invites a search for assistance, rather than a judgment about your ability. For
      example, check whether a borrowed tool could meet a one-off need before buying something that requires
      storage and maintenance. In another small situation, when planning a group activity, write down the costs
      that everyone has already accepted. Consider leaving a spending question open until you have practical
      information; the symbol does not estimate earnings or returns. Review the actual response before extending
      the plan, and keep only the part that helps you navigate your own circumstances.
    advice:
      - Check what one expense actually serves.
    do:
      - Review spending
    dont:
      - Buy impulsively
