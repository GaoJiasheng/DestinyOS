    title: 你可以用稳步学习的方式处理作息与情绪。
    summary: 你可以用稳步学习的方式处理作息与情绪。
    body: 你可以用稳步学习的方式处理作息与情绪。正印（生扶日主但阴阳不同的流日天干）象征学习、支持和已有经验。你容易从可靠资料或熟悉的人那里找到支点。得到支持并不等于要把决定交给别人；把建议整理成自己的操作步骤，才能知道它是否适合眼前的情况。身强（模型中日主支持较多）表示承接任务的象征较突出，不等于你现实中总有足够精力。比如连续盯屏幕后，你可以起身换个视角，再给晚间留出一段没有额外要求的安静时间。换到一个小场景，你也可以请教问题后，用自己的话复述一遍操作方法。建议选择一个轻松、可持续的休息动作；这里仅谈作息与情绪，具体不适交给合适的专业支持。行动之后留意实际反馈，再决定哪些做法值得保留，让当天的象征服务于你自己的选择。
    advice:
      - 为今天安排一段安静休息。
    do:
      - 留出休息
    dont:
      - 忽略疲惫
  en:
    title: Put support to use in rest and emotions.
    summary: Put support to use in rest and emotions.
    body:
      Put support to use in rest and emotions. Direct Resource (zhèng yìn — a supporting stem of opposite
      polarity) draws attention to learning and dependable support. A reference, mentor, or familiar routine
      can make a task feel more manageable. Receiving help still leaves the decision with you. Strong (shēn
      qiáng — greater natal-stem support in the model) emphasizes capacity to engage, without measuring the
      energy you actually have. For example, step away after a long screen session and choose a quieter transition
      before your evening activity. In another small situation, ask an experienced teammate to demonstrate
      one step, then attempt it yourself while the explanation is fresh. Consider a comfortable pause you can
      repeat; this section concerns rest and emotions without assessing a physical condition. Review the actual
      response before extending the plan, and keep only the part that helps you navigate your own circumstances.
    advice:
      - Schedule one quiet pause today.
    do:
      - Make a pause
    dont:
      - Ignore tiredness
