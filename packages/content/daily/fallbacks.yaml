  zh:
    title: 你可以从一件可控的小事开始今天。
    summary: 你可以从一件可控的小事开始今天。
    body: 你可以从一件可控的小事开始今天。每日解读（把当天象征与本命信息放在一起观察）提供不同领域的提示，并不能给整天定性。资料有限或没有特别信号时，保留一般观察比补出具体预言更合适。比如你可以先核对今天的安排，选出一件最需要完成的事。建议把其他提醒当作可选角度，实际情况变化时随时调整，给自己留出休息和判断的空间。
    advice:
      - 选一件可以完成的小事。
    do:
      - 明确重点
    dont:
      - 急于定性
  en:
    title: Start with one manageable choice.
    summary: Start with one manageable choice.
    body:
      You can begin today by choosing one action you can actually influence. A daily reading brings current
      symbolic signals together with natal information; it does not establish a verdict about the day. When
      a specific signal is absent, a general observation is a more useful starting point than an invented prediction.
      For example, look at your calendar and choose the task whose completion would make the afternoon easier.
      Consider leaving the other prompts optional, so you can respond to changing circumstances. Your real
      energy, available information, and existing responsibilities deserve attention before a symbolic label.
      You can revisit this reading later and keep only the part that helped you act with greater clarity. There
      is room for an ordinary, flexible day.
    advice:
      - Choose one action you can complete.
    do:
      - Choose a focus
    dont:
      - Label the day
  meta:
    author: t23-daily-editorial-v1
    reviewed_by: null
    version: 1
    status: published
- id: daily.fallback.career
  system: daily
  section: career
  topic: daily.fallback.career
  when:
    path: date.local
