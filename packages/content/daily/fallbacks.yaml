  exclusive_with: []
  zh:
    title: 你可以让合作范围更清楚。
    summary: 你可以让合作范围更清楚。
    body: 你可以让一次合作的范围更清楚。每日人际提示关注邀约、分工和边界，不依据生肖或命盘判定别人的性格，也不要求你随时参加社交。没有特别命中时，先确认对方需要什么、自己能够提供什么，就是一个实用起点。共同目标越具体，越容易发现哪些部分可以合作、哪些部分需要不同安排。比如群聊里讨论活动，你可以先总结时间和地点，问谁愿意认领一项小任务，而不是默认所有人都有空。建议把承诺写成可执行的动作，并说明完成或交接的时间。若暂时无法参加，简短表达也足够，不必为了维持气氛追加负担。之后检查实际结果，看看分工是否公平、沟通是否轻松。不同人的精力和节奏可能不同，给拒绝和调整留出位置，往往有助于维持更舒服的联系。
    advice:
      - 确认一个职责及其交接时间。
    do:
      - 确认分工
    dont:
      - 无限承诺
  en:
    title: Keep cooperation easy to navigate.
    summary: Keep cooperation easy to navigate.
    body:
      You can make cooperation easier by keeping its scope visible. The daily social section offers prompts
      about invitations, roles, and boundaries. It does not classify someone’s character by zodiac animal or
      chart symbol, and it does not require constant sociability. Without a detailed signal, begin by asking
      what the other person needs and what you can realistically offer. A concrete shared aim can show where
      collaboration is useful and where separate arrangements would fit better. For example, in a group planning
      a community event, summarize the date and location before asking volunteers to take a specific task.
      Avoid assuming that enthusiasm means everyone has the same available time. Consider describing a commitment
      as an action with a completion or handover point. If you cannot participate, a clear brief response is
      enough; you need not add a burden merely to maintain the atmosphere. Afterward, check whether the division
      of effort felt fair and whether the communication was easy to follow. People can have different rhythms
      and still cooperate respectfully. Leaving room to decline or revise a request can support a connection
      more effectively than an open-ended promise. Let actual exchanges guide what you offer next.
    advice:
      - Confirm one role and its handover point.
    do:
      - Confirm a role
    dont:
      - Promise without limits
  meta:
    author: t23-daily-editorial-v1
    reviewed_by: null
    version: 1
    status: published
- id: daily.fallback.astro
  system: daily
  section: astro
  topic: daily.fallback.astro
  when:
    path: date.local
    exists: true
  weight: 1
  polarity: neutral
  tags:
    - plain
    - astro
  exclusive_with: []
  zh:
    title: 你可以把今日星象当作观察角度。
    summary: 你可以把今日星象当作观察角度。
    body: 你可以把今日星象当作观察角度，再用实际经历检验。月亮星座（当天月亮所在的黄道区段）、月相（日月角距的分段）和行运（当天星位与本命位置的比较）关注的是不同层面的象征。当天没有主要行运相位，并不表示这一天缺少意义；资料不足时，也不应该补出具体事件。你可以从心情、交流或计划的变化里挑一个可观察的问题。比如安排变更时，先看看真正变化的是时间、资源还是你的期待，再决定如何回应。建议只选一条低成本提示实践，晚些时候回顾实际反馈。出生时间未知时，涉及角度和精确本命月亮的解释需要留有余地。集体现象也不能说明每个人会有同样经历。让星象成为整理问题的语言，同时保留事实、环境和自主选择的位置，不需要为了配合符号改变已经合理的日程。
    advice:
      - 选择一个实际问题来检验提示。
    do:
      - 观察反馈
    dont:
      - 照符号行动
  en:
    title: Use the sky as a reflection prompt.
    summary: Use the sky as a reflection prompt.
    body:
      You can use today’s sky as a way to frame a question, then test that question against experience.
      The Moon sign identifies a zodiac sector, the lunar phase groups the Sun–Moon angle, and a transit compares
      a current sky position with a natal one. These are different symbolic viewpoints rather than a single
      forecast. A day without a major personal transit can still contain meaningful choices. Limited birth
      information also calls for room around precise interpretations, especially those involving angles or
      the natal Moon. For example, if an appointment changes, identify whether the real issue is timing, available
      help, or an expectation you had not stated. Consider trying one low-cost adjustment and reviewing its
      effect later. A collective sky phenomenon does not establish that everyone will have the same experience.
      Keep the prompt close to an observable situation, and set it aside if it offers no useful question. Your
      practical circumstances and decisions remain central. The sky can provide a language for reflection while
      ordinary evidence tells you what changed, what another person said, and which options are actually available.
      There is no need to rearrange a workable schedule just to match a symbol.
    advice:
      - Test a prompt against one actual situation.
    do:
      - Observe feedback
    dont:
      - Follow symbols blindly
  meta:
    author: t23-daily-editorial-v1
    reviewed_by: null
    version: 1
    status: published
- id: daily.fallback.tarot
  system: daily
  section: tarot
  topic: daily.fallback.tarot
  when:
    path: date.local
