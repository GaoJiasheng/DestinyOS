  zh:
    title: 你可以让合作范围更清楚。
    summary: 你可以让合作范围更清楚。
    body: 人际方面今天比较平淡，正好可以维护一下老关系。回复那条搁了几天的消息，或者给一个好久没联系的人发句问候。想约人的话，直接给出一个具体的时间和地点，比说有空聚聚更容易成行。在群里讨论事情时，先把前因后果说一句，能省下不少来回确认的功夫。有人帮过你，今天说声谢谢，说清楚帮到了你什么。不想参加的聚会，可以提前礼貌地回绝，把时间留给更想见的人。结束一天前，想想这周最想见到谁，顺手发个邀请。如果有需要道歉或解释的事，今天先开口说一句。
    advice:
      - 确认一个职责及其交接时间。
    do:
      - 确认分工
    dont:
      - 无限承诺
  en:
    title: Keep cooperation easy to navigate.
    summary: Keep cooperation easy to navigate.
    body: Social life is quiet today, which makes it a good moment to look after existing ties. Answer the message that has been waiting for a few days, or send a hello to someone you have lost touch with. If you want to meet someone, try proposing a specific time and place, which is far more likely to happen than “let’s catch up sometime.” When discussing something in a group chat, you can open with one line of context and save a lot of back and forth. If someone helped you recently, thank them today and say exactly what difference it made. You can also decline an event you do not want to attend ahead of time, leaving room for people you actually want to see. Before the day ends, think about who you would most like to see this week and send the invitation.
    advice:
      - Confirm one role and its handover point.
    do:
      - Confirm a role
    dont:
      - Promise without limits
  meta:
    author: t23-daily-editorial-v1
    reviewed_by: null
    version: 1
    status: published
- id: daily.fallback.astro
  system: daily
  section: astro
  topic: daily.fallback.astro
  when:
    path: date.local
    exists: true
  weight: 1
  polarity: neutral
  tags:
    - plain
    - astro
  exclusive_with: []
  zh:
    title: 你可以把今日星象当作观察角度。
    summary: 你可以把今日星象当作观察角度。
    body: 你可以把今日星象当作观察角度，再用实际经历检验。月亮星座（当天月亮所在的黄道区段）、月相（日月角距的分段）和行运（当天星位与本命位置的比较）关注的是不同层面的象征。当天没有主要行运相位，并不表示这一天缺少意义；资料不足时，也不应该补出具体事件。你可以从心情、交流或计划的变化里挑一个可观察的问题。比如安排变更时，先看看真正变化的是时间、资源还是你的期待，再决定如何回应。建议只选一条低成本提示实践，晚些时候回顾实际反馈。出生时间未知时，涉及角度和精确本命月亮的解释需要留有余地。集体现象也不能说明每个人会有同样经历。让星象成为整理问题的语言，同时保留事实、环境和自主选择的位置，不需要为了配合符号改变已经合理的日程。
    advice:
      - 选择一个实际问题来检验提示。
    do:
      - 观察反馈
    dont:
      - 照符号行动
  en:
    title: Use the sky as a reflection prompt.
    summary: Use the sky as a reflection prompt.
    body:
      You can use today’s sky as a way to frame a question, then test that question against experience.
      The Moon sign identifies a zodiac sector, the lunar phase groups the Sun–Moon angle, and a transit compares
      a current sky position with a natal one. These are different symbolic viewpoints rather than a single
      forecast. A day without a major personal transit can still contain meaningful choices. Limited birth
      information also calls for room around precise interpretations, especially those involving angles or
      the natal Moon. For example, if an appointment changes, identify whether the real issue is timing, available
      help, or an expectation you had not stated. Consider trying one low-cost adjustment and reviewing its
      effect later. A collective sky phenomenon does not establish that everyone will have the same experience.
      Keep the prompt close to an observable situation, and set it aside if it offers no useful question. Your
      practical circumstances and decisions remain central. The sky can provide a language for reflection while
      ordinary evidence tells you what changed, what another person said, and which options are actually available.
      There is no need to rearrange a workable schedule just to match a symbol.
    advice:
      - Test a prompt against one actual situation.
    do:
      - Observe feedback
    dont:
      - Follow symbols blindly
  meta:
    author: t23-daily-editorial-v1
    reviewed_by: null
    version: 1
    status: published
- id: daily.fallback.tarot
  system: daily
  section: tarot
  topic: daily.fallback.tarot
  when:
    path: date.local
    exists: true
  weight: 1
  polarity: neutral
  tags:
    - plain
    - tarot
  exclusive_with: []
  zh:
    title: 你可以用今日一牌提出一个小问题。
    summary: 你可以用今日一牌提出一个小问题。
    body: 你可以用今日一牌提出一个适合当天的小问题。塔罗（用牌面象征进行文化探索与反思的方式）在这里提供观察入口，不预测具体事件，也不替你选择重要决定。正位（常规方向）和逆位（倒置方向）是同一张牌的不同阅读角度，逆位不等于坏事。每日抽牌采用稳定种子，同一份数据下结果一致，因此重复查看不需要寻找另一种答案。比如你可以看看牌面让自己想到工作、关系还是休息，再问今天哪一步最容易调整。建议先记录一个真实处境和一个可撤回动作，行动后再回看感受。完整牌义可以提供更多文化背景，短评只保留当天可用的提示。不必为了符合牌面强行解释别人的行为，也不用把不适合自己的说法留下。让卡片帮助你说清问题，把答案留给现实信息与自己的选择。
    advice:
      - 从牌面联想中选一个可观察的问题。
    do:
      - 记录问题
    dont:
      - 反复求答案
  en:
    title: Let the daily card open a question.
    summary: Let the daily card open a question.
    body:
      You can let the daily card open one question that fits the day. Tarot uses card imagery for cultural
      exploration and reflection here; it does not establish an event or make an important decision for you.
      Upright and reversed orientations offer different reading angles on the same card, with reversal carrying
      no automatic negative meaning. The daily draw uses a stable seed, so repeated views of the same data
      do not need to produce another answer. For example, notice whether an image brings work, a connection,
      or rest to mind, then ask which small part of that situation you could adjust. Consider recording one
      real circumstance and one action that remains easy to undo. Review how it felt after trying it. The fuller
      card meaning can provide additional cultural context, while the daily excerpt keeps the reflection manageable.
      You do not have to explain another person’s behavior through the card, and you can leave aside an interpretation
      that does not fit. A useful question can make your options clearer without deciding among them. Keep
      practical information and your own choices at the center of what happens next, allowing the image to
      remain a prompt rather than a requirement. You can leave any association aside if it does not help you
      understand the situation.
    advice:
      - Choose one observable question from the image.
    do:
      - Note a question
    dont:
      - Seek repeated answers
  meta:
    author: t23-daily-editorial-v1
    reviewed_by: null
    version: 1
    status: published
- id: daily.fallback.panchang
  system: daily
  section: panchang
  topic: daily.fallback.panchang
  when:
    path: date.local
    exists: true
  weight: 1
  polarity: neutral
  tags:
    - plain
    - panchang
  exclusive_with: []
  zh:
    title: 你可以先了解历法，再安排日常。
    summary: 你可以先了解历法，再安排日常。
    body: 你可以先把今日五要素当作历法知识来了解。Panchang（吠陀传统的五要素日历）包含月日、星宿、瑜伽、半日和星期，分别描述日月角度、月亮区段或以日出为界的时间信息。它们是文化与计算框架，不替你衡量一天的价值。地点和时区会影响日出与要素交接，缺少数据时先保留一般说明，不补出具体时刻。比如你准备在安静时段阅读，可以先看自己的日程和环境，再把传统日历作为可选背景。建议理解名称和时间口径之后，只选择一个低成本的观察动作。瑜伽在这里指日月位置的组合标记，与身体练习不是同一概念，也不是医疗说明。任何重要安排仍应依据实际需求与可靠资料。若你对这个体系陌生，可以逐项查看释义，不必一次记住所有术语，让文化探索保持轻松。
    advice:
      - 先了解一个历法术语及其时间口径。
    do:
      - 查看释义
    dont:
      - 机械择时
  en:
    title: Explore the calendar before applying it.
    summary: Explore the calendar before applying it.
    body:
      You can explore the daily calendar as cultural information before trying to apply it. Panchang is
      a five-part Vedic calendar describing Tithi, Nakshatra, Yoga, Karana, and Vara. The labels concern angular
      relationships, lunar sectors, and a sunrise-based day boundary; they do not measure the value of your
      day. Location and time zone affect sunrise and the transitions between calendar elements. When those
      details are unavailable, a general explanation is preferable to an invented time. For example, if you
      want a quiet reading period, check your actual schedule and surroundings first, then keep the traditional
      calendar as optional context. Consider learning one label and the time boundary it uses before making
      a small observation. Yoga here is a calculated Sun–Moon calendar marker, distinct from physical exercise
      and from medical guidance. Important arrangements still call for relevant practical information and your
      own priorities. You can inspect the terms one at a time instead of memorizing every name. A relaxed cultural
      exploration allows questions and uncertainty, while leaving ordinary responsibilities intact. If a calendar
      suggestion has no useful connection to your circumstances, setting it aside is a reasonable choice, and
      the next day offers another chance to learn.
    advice:
      - Learn one calendar label and its time boundary.
    do:
      - Read a definition
    dont:
      - Follow timing rigidly
  meta:
    author: t23-daily-editorial-v1
    reviewed_by: null
    version: 1
    status: published
- id: daily.fallback.summary_actions
  system: daily
  section: summary_actions
  topic: daily.fallback.summary_actions
  when:
    path: date.local
    exists: true
  weight: 1
  polarity: neutral
  tags:
    - plain
    - summary_actions
  exclusive_with: []
  zh:
    title: 你可以挑一条建议做小实验。
    summary: 你可以挑一条建议做小实验。
    body: 你可以从今天的提示里挑一条做小实验。总结与行动清单把不同领域的观察放在一起，目的是帮助你选择一个清楚的下一步，不要求把所有建议都完成。各体系使用不同的象征框架，出现侧重点差异时，先回到真实处境和眼前的资源。比如工作段落提醒推进，情绪段落提醒休息，你可以先交付一份简短草稿，再留一段安静时间，而不必在两种说法中选出唯一正确者。建议把行动写成何时、做什么、做到哪里结束，并留出回顾结果的机会。宜忌短词只作提醒，不替代事实、边界和专业判断。你可以保留适合自己的内容，也可以舍去没有帮助的部分。一天结束时，用实际体验评价这个小动作，不把评分高低当作个人表现的衡量。让报告服务于更清晰、可调整的日常选择，明天仍可以采用不同做法。
    advice:
      - 写下一个动作和复盘时间。
    do:
      - 小步实践
    dont:
      - 全盘照搬
  en:
    title: Choose one suggestion to test.
    summary: Choose one suggestion to test.
    body:
      You can choose one suggestion from today’s reading and make it a small experiment. The action summary
      gathers several viewpoints so you can identify a clear next step; it is not a checklist you have to complete.
      Different symbolic systems can emphasize different needs, making your real circumstances and available
      resources the most useful reference. For example, a work prompt may favor progress while a wellbeing
      prompt favors a pause. You could send a brief usable draft and then leave a quiet gap, without needing
      to decide that one prompt cancels the other. Consider writing the action as a time, a task, and a stopping
      point. Leave an opportunity to review the result rather than evaluating yourself through the daily score.
      Short Do and Don’t labels are reminders, not substitutes for facts, personal boundaries, or appropriate
      professional judgment. Keep the part that fits and set aside what does not help. At the end of the day,
      ask whether the experiment made a situation easier to navigate and what you would change next time. The
      aim is a more understandable and adjustable daily choice, with room for a different approach tomorrow.
      Your experience remains the practical test of the suggestion.
    advice:
      - Write one action and a review time.
    do:
      - Test one action
    dont:
      - Apply everything
