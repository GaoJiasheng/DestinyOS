  zh:
    title: 你可以先约定什么算完成。
    summary: 你可以先约定什么算完成。
    body: 工作与学习线上今天没有特别的推力，适合把手头的事做扎实。先写下今天必须交付的一件事，以及谁在等这个结果、什么时候要。把任务拆成一个上午能做完的小块，完成一块就打个勾，比一直开着十个窗口更踏实。比如你准备一份说明，可以先列出三个问题，问清楚接收者哪些必须回答，再决定要不要加额外资料。下班前花五分钟排好明天的前三件事，让明早一坐下就有起点。遇到临时插进来的需求，先问一句截止时间，再决定放在什么位置。午休前看一眼进度，及时调整下午的安排。
    advice:
      - 写下交付标准和检查时间。
    do:
      - 确认交付
    dont:
      - 无止境改稿
  en:
    title: Agree on what completion means.
    summary: Agree on what completion means.
    body: No particular signal is pushing your work or study today, which makes it a good day to simply do solid work. Write down the one thing you must deliver, who is waiting for it, and when they need it. Break it into pieces you can finish in a morning and tick them off as you go; that is steadier than keeping ten windows open. For example, if you are preparing a briefing, list the three questions your reader must have answered before adding anything extra. Before you finish, take five minutes to line up tomorrow’s top three tasks so the morning starts with a clear first step. If something urgent lands on your desk, try asking for its deadline before deciding where it goes.
    advice:
      - Write a completion standard and review time.
    do:
      - Define completion
    dont:
      - Edit without limits
  meta:
    author: t23-daily-editorial-v1
    reviewed_by: null
    version: 1
    status: published
- id: daily.fallback.wealth
  system: daily
  section: wealth
  topic: daily.fallback.wealth
  when:
    path: date.local
