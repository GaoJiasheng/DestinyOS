  exclusive_with: []
  zh:
    title: 你可以给一天留一段缓冲。
    summary: 你可以给一天留一段缓冲。
    body: 你可以给今天留一段没有额外要求的缓冲。每日健康提示只关注作息、情绪、季节和日常保养，不根据命盘推断身体状况。当天没有特别信号时，先看实际睡眠、屏幕时间和安排密度，比给感受套一个解释更有帮助。你可能在连续处理事务后才注意到疲惫，也可能需要安静一会儿才能知道自己真正想做什么。比如两场线上讨论之间，留几分钟起身、喝水或看看窗外，不急着把空隙填成新的任务。建议选择一个轻松可持续的休息动作，并观察之后是否更舒服。休息方式要适合自己的环境，不需要跟随幸运方位或时段。若具体不适或情绪困扰需要帮助，寻求合适的专业支持。晚间回顾时，把实际体验写下来，允许第二天采用不同节奏，不用因为报告没有特殊提示就忽略自己的需要。
    advice:
      - 在两个安排之间留几分钟休息。
    do:
      - 留白休息
    dont:
      - 填满空隙
  en:
    title: Leave a quiet gap in the day.
    summary: Leave a quiet gap in the day.
    body:
      You can leave a quiet gap in the day before every spare minute becomes another obligation. This section
      offers reflection on rest, emotions, seasons, and ordinary self-care. It does not assess a physical condition
      from a chart. When no detailed daily signal applies, look at practical factors such as your sleep, screen
      time, and the density of your schedule. You may notice tiredness only after several tasks, or need a
      little silence before you can identify what you want next. For example, between two online discussions,
      stand up, drink some water, or look away from the screen for a short while. Consider choosing one comfortable
      pause you can repeat without adding a demanding routine. Observe how you feel afterward and adjust its
      timing to your actual environment. A symbolic favorable hour or direction need not determine when you
      rest. Seek suitable professional support for concerns that require it, including persistent distress
      or specific discomfort. At the end of the day, note what helped and let tomorrow have a different pace
      if necessary. Your own experience deserves attention even when the reading has no special signal to discuss.
    advice:
      - Leave a short pause between activities.
    do:
      - Leave a gap
    dont:
      - Fill every gap
  meta:
    author: t23-daily-editorial-v1
    reviewed_by: null
    version: 1
    status: published
- id: daily.fallback.social
  system: daily
  section: social
  topic: daily.fallback.social
