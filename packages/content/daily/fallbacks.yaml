  weight: 1
  polarity: neutral
  tags:
    - plain
    - wealth
  exclusive_with: []
  zh:
    title: 你可以先看清资源去向。
    summary: 你可以先看清资源去向。
    body: 钱的方面今天没有明显起伏，是整理账目的好时机。花五分钟把今天的支出记下来，看看钱都去了哪里。把这个月的固定支出列成一张清单，标出可以停掉的那一项，比如用不上的订阅或重复的会员。准备一笔小额的预留金，放在单独的账户里，给下个月的意外开销留点余地。有想买的大件，可以先放进购物车，过一周再看是否还想要。想了解自己的消费习惯，不妨按吃、住、行、娱乐分四栏，今晚就把最近七天的账对上。记账时顺手标出一笔花得值的钱，看看它为什么值得。
    advice:
      - 检查一项固定开销是否仍有用途。
    do:
      - 清点资源
    dont:
      - 按符号消费
  en:
    title: Make your resources visible.
    summary: Make your resources visible.
    body: Money is uneventful today, which makes it a good day to tidy your accounts. Take five minutes to log what you spent and see where it went. List this month’s fixed costs and mark one you could cancel, such as a subscription you no longer use or a duplicate membership. Consider setting aside a small buffer in a separate account for next month’s surprises. If you have a large purchase in mind, try leaving it in the cart for a week and see whether you still want it. To understand your spending habits, you can sort the last seven days into four columns, food, home, transport, and fun, and reconcile them tonight while the details are still fresh. A small routine like this makes next month’s choices easier.
    advice:
      - Review whether one regular expense still serves you.
    do:
      - Review resources
    dont:
      - Shop by symbols
  meta:
    author: t23-daily-editorial-v1
    reviewed_by: null
    version: 1
    status: published
- id: daily.fallback.love
  system: daily
  section: love
  topic: daily.fallback.love
  when:
    path: date.local
    exists: true
  weight: 1
  polarity: neutral
  tags:
    - plain
    - love
  exclusive_with: []
  zh:
    title: 你可以把需要说得更具体。
    summary: 你可以把需要说得更具体。
    body: 感情和亲近关系今天没有特别的信号，平常的陪伴就很好。吃饭时问一句对方今天过得怎样，放下手机听完。给在乎的人发一条具体的消息，说说最近想起对方的一件小事，比一句想你更容易被记住。单身的话，可以约朋友一起吃顿饭，或者把那个搁置的见面定个时间。家里有需要一起商量的事，挑一个双方都不赶时间的时段，先说说各自的想法，再决定怎么做。想表达感谢的时候，不妨直接说出对方做的那件事，让这句谢谢落到实处。见面的时候把手机放远一点，认真听对方说完。
    advice:
      - 提出一个对方能自由选择的请求。
    do:
      - 清楚表达
    dont:
      - 催促回应
  en:
    title: Make a request easy to understand.
    summary: Make a request easy to understand.
    body: There is no particular signal in love or close relationships today, and ordinary company is enough. Over a meal, ask how the other person’s day went and put the phone down while they answer. Send someone you care about one specific message about something that reminded you of them, which tends to stay with people longer than a general hello. If you are single, you can invite a friend to dinner or finally pick a date for that plan you keep postponing. If something at home needs discussing, try choosing a time when neither of you is rushing and let each person speak before deciding anything. When you want to say thank you, name the exact thing they did so it lands.
    advice:
      - Offer one request with room for choice.
    do:
      - Ask clearly
    dont:
      - Demand a reply
  meta:
    author: t23-daily-editorial-v1
    reviewed_by: null
    version: 1
    status: published
