  weight: 1
  polarity: neutral
  tags:
    - plain
    - tarot
  exclusive_with: []
  zh:
    title: 你可以用今日一牌提出一个小问题。
    summary: 你可以用今日一牌提出一个小问题。
    body: 你可以用今日一牌提出一个适合当天的小问题。塔罗（用牌面象征进行文化探索与反思的方式）在这里提供观察入口，不预测具体事件，也不替你选择重要决定。正位（常规方向）和逆位（倒置方向）是同一张牌的不同阅读角度，逆位不等于坏事。每日抽牌采用稳定种子，同一份数据下结果一致，因此重复查看不需要寻找另一种答案。比如你可以看看牌面让自己想到工作、关系还是休息，再问今天哪一步最容易调整。建议先记录一个真实处境和一个可撤回动作，行动后再回看感受。完整牌义可以提供更多文化背景，短评只保留当天可用的提示。不必为了符合牌面强行解释别人的行为，也不用把不适合自己的说法留下。让卡片帮助你说清问题，把答案留给现实信息与自己的选择。
    advice:
      - 从牌面联想中选一个可观察的问题。
    do:
      - 记录问题
    dont:
      - 反复求答案
  en:
    title: Let the daily card open a question.
    summary: Let the daily card open a question.
    body:
      You can let the daily card open one question that fits the day. Tarot uses card imagery for cultural
      exploration and reflection here; it does not establish an event or make an important decision for you.
      Upright and reversed orientations offer different reading angles on the same card, with reversal carrying
      no automatic negative meaning. The daily draw uses a stable seed, so repeated views of the same data
      do not need to produce another answer. For example, notice whether an image brings work, a connection,
      or rest to mind, then ask which small part of that situation you could adjust. Consider recording one
      real circumstance and one action that remains easy to undo. Review how it felt after trying it. The fuller
      card meaning can provide additional cultural context, while the daily excerpt keeps the reflection manageable.
      You do not have to explain another person’s behavior through the card, and you can leave aside an interpretation
      that does not fit. A useful question can make your options clearer without deciding among them. Keep
      practical information and your own choices at the center of what happens next, allowing the image to
      remain a prompt rather than a requirement. You can leave any association aside if it does not help you
      understand the situation.
    advice:
      - Choose one observable question from the image.
    do:
      - Note a question
    dont:
      - Seek repeated answers
  meta:
    author: t23-daily-editorial-v1
    reviewed_by: null
    version: 1
    status: published
- id: daily.fallback.panchang
  system: daily
  section: panchang
