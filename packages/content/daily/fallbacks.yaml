  exclusive_with: []
  zh:
    title: 你可以给一天留一段缓冲。
    summary: 你可以给一天留一段缓冲。
    body: 身体和情绪今天比较平稳，适合照顾基本功。喝够水，午饭后起身走十分钟，把坐久的肩背活动开。晚上比平时早半小时放下手机，给入睡留出一点空档。如果最近总觉得累，可以先记三天的睡眠和饮食，看看疲惫和哪件事有关。想做点运动的话，选最容易开始的一项，快走或拉伸二十分钟都可以。情绪上有什么说不清的，不妨写下来，写满半页就好，不必整理成结论。需要看医生或做检查的事，今天把预约定下来，让它从待办里落到日历上。饭后别马上坐回椅子，站一会儿再开始工作。
    advice:
      - 在两个安排之间留几分钟休息。
    do:
      - 留白休息
    dont:
      - 填满空隙
  en:
    title: Leave a quiet gap in the day.
    summary: Leave a quiet gap in the day.
    body: Your body and mood are steady today, so it is a good day for the basics. Drink enough water and take a ten-minute walk after lunch to loosen up your shoulders and back. Tonight, put your phone down half an hour earlier than usual to leave some room before sleep. If you have been feeling tired lately, try noting your sleep and meals for three days and see what the fatigue tracks with. If you want some exercise, choose whatever is easiest to start, a brisk walk or twenty minutes of stretching is plenty. If something feels hard to name, you can write it down, half a page is enough, with no need to reach a conclusion. If you need a doctor or a check-up, book it today so it moves from your to-do list onto the calendar.
    advice:
      - Leave a short pause between activities.
    do:
      - Leave a gap
    dont:
      - Fill every gap
  meta:
    author: t23-daily-editorial-v1
    reviewed_by: null
    version: 1
    status: published
