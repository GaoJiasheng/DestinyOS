  zh:
    title: 你可以从一件可控的小事开始今天。
    summary: 你可以从一件可控的小事开始今天。
    body: 今天没有特别强的推力或阻力，是把事情一件件做好的一天。先挑一件可以完成的小事，比如核对今天的安排、回一封拖了几天的邮件，做完就放下。留一段不排任务的时间，让上午和下午之间有个喘息。晚上花几分钟想想今天最顺手的一件事，把它记下来，明天接着用。
    advice:
      - 选一件可以完成的小事。
    do:
      - 明确重点
    dont:
      - 急于定性
  en:
    title: Start with one manageable choice.
    summary: Start with one manageable choice.
    body: Nothing is pushing especially hard or pulling you back today, so it is a day for doing things one at a time. Start with one small task you can actually finish, such as checking your schedule or answering an email you have been postponing, then let it go. Leave a stretch of time with nothing planned so the morning and afternoon have room to breathe. In the evening, take a few minutes to note the one thing that went most smoothly and try repeating it tomorrow. A simple rhythm like this makes it easier to notice what really needs your attention, and it leaves energy for whatever comes up later. You can also tell someone nearby what you are aiming for, so the plan stays out in the open.
    advice:
      - Choose one action you can complete.
    do:
      - Choose a focus
    dont:
      - Label the day
  meta:
    author: t23-daily-editorial-v1
    reviewed_by: null
    version: 1
    status: published
- id: daily.fallback.career
  system: daily
  section: career
  topic: daily.fallback.career
  when:
    path: date.local
