  weight: 1
  polarity: neutral
  tags:
    - plain
    - love
  exclusive_with: []
  zh:
    title: 你可以把需要说得更具体。
    summary: 你可以把需要说得更具体。
    body: 你可以把关系中的需要说得具体一点。这里的感情提示适用于伴侣、朋友、家人或其他亲近的人，也适用于你独处时理解自己的期待。每日象征不能读取他人的心意，更不能决定一段关系的价值。没有特别命中时，先观察交流是否清楚、彼此是否有选择空间，就是一个温和起点。比如你希望得到陪伴，可以提出今晚短聊十分钟，或周末一起散步，让对方选择适合的方式。若对方暂时没有精力，给自己安排另一种支持也很合理。建议把事实、感受和请求分开表达，避免用一次回复速度推断整个关系。对方愿意分享多少，由对方决定；你也可以诚实说明自己的边界。晚些时候回看实际交流，留意什么表达让彼此更容易理解，而不是把短评当作必须应验的结论。
    advice:
      - 提出一个对方能自由选择的请求。
    do:
      - 清楚表达
    dont:
      - 催促回应
  en:
    title: Make a request easy to understand.
    summary: Make a request easy to understand.
    body:
      You can make a close exchange easier by offering a request another person can understand. This section
      applies to a partner, a friend, chosen family, or your own reflection during time alone. A daily symbol
      cannot tell you what someone else feels, and it cannot decide the value of a connection. Without a specific
      signal, clarity and freedom of choice remain useful starting points. For example, if you want company
      after a busy day, ask whether a friend would prefer a short call now or a walk later in the week. Either
      option leaves room for an honest answer. Consider separating what happened, how you felt, and what you
      would like next. A delayed reply may have several ordinary explanations, so give yourself time before
      interpreting it. You can also choose another source of support when someone is unavailable. Respect how
      much they want to share and state your own limits with the same care. Later, review the actual exchange
      and notice which wording helped you understand each other. Let that experience inform the next conversation.
      The reading offers a prompt for respectful communication, while the people involved retain their own
      perspectives, needs, and choices.
    advice:
      - Offer one request with room for choice.
    do:
      - Ask clearly
    dont:
      - Demand a reply
  meta:
    author: t23-daily-editorial-v1
    reviewed_by: null
    version: 1
    status: published
- id: daily.fallback.health
  system: daily
