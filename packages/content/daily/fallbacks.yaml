  weight: 1
  polarity: neutral
  tags:
    - plain
    - career
  exclusive_with: []
  zh:
    title: 你可以先约定什么算完成。
    summary: 你可以先约定什么算完成。
    body: 你可以先把工作与学习的完成标准说清楚。每日事业提示围绕计划、协作和练习提供观察，不衡量你的能力，也不预测评价结果。没有特别命中时，最可靠的起点仍是任务本身：谁需要成果、什么时候需要、哪部分最重要。一个明确的小交付能让你看见进度，也减少反复猜测带来的消耗。比如你准备写一份说明，可以先列出三个问题，问接收者哪些必须回答，再决定是否加入额外资料。这样既留下沟通机会，也避免把精力全部用在格式上。建议在开始前设置一次检查点，做到那里就核对方向。遇到新需求时重新估计范围，必要时提出分阶段完成，让今天的投入有现实的依据。收工后用实际反馈复盘，而不是只看报告里的评分。
    advice:
      - 写下交付标准和检查时间。
    do:
      - 确认交付
    dont:
      - 无止境改稿
  en:
    title: Agree on what completion means.
    summary: Agree on what completion means.
    body:
      You can make work or study easier to navigate by agreeing on what completion means. The daily career
      section offers prompts about planning, cooperation, and practice; it does not measure your ability or
      anticipate another person’s evaluation. When no detailed signal applies, begin with the task itself.
      Identify who will use the result, when it is needed, and which question matters most. A small delivery
      can reveal progress more clearly than a long period of invisible preparation. For example, before compiling
      a set of training notes, ask a colleague which step newcomers find confusing. Build a short explanation
      around that step and let someone try it. Consider placing a review point before you expand the document.
      If another request appears, discuss the new scope instead of quietly adding it to an already full day.
      You can separate a first usable version from optional improvements, making the effort easier to estimate.
      Leave time to note what the actual reader found helpful and what they still needed. That feedback can
      guide your next practice session. A daily symbol may accompany the reflection, while the work, its purpose,
      and the people involved remain the practical reference.
    advice:
      - Write a completion standard and review time.
    do:
      - Define completion
    dont:
      - Edit without limits
  meta:
    author: t23-daily-editorial-v1
    reviewed_by: null
    version: 1
    status: published
- id: daily.fallback.wealth
  system: daily
  section: wealth
  topic: daily.fallback.wealth
  when:
    path: date.local
