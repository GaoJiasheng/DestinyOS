  exclusive_with: []
  zh:
    title: 你可以先启动一个小步骤。
    summary: 你可以先启动一个小步骤。
    body: 你可以先启动一个小步骤。月亮星座（当天月亮所在的黄道区段）在这里作为短期情绪风格的隐喻，并不替代你的本命盘或实际感受。白羊（黄道十二星座之一）的月亮意象强调直接回应和开始行动。你可能更想快速试出答案，等待时容易失去耐心。比如你可以把想做的事拆成十分钟能开始的部分。这类提示适合当天的小调整，不用扩展成对性格的判断。建议先观察自己此刻真正需要什么，选择一件负担小的事，晚些时候再检查是否舒服。日常反馈比符号更能帮助你决定下一步。
    advice:
      - 把想做的事拆成十分钟能开始的部分。
    do:
      - 观察情绪
    dont:
      - 急贴标签
  en:
    title: Notice a Aries Moon theme.
    summary: Notice a Aries Moon theme.
    body:
      You can use today’s Moon in Aries as a prompt to notice your current response. The Moon sign describes
      a zodiac sector in the sky; it is a symbolic daily cue, rather than a replacement for your natal chart
      or lived experience. Aries highlights immediate responses and a willingness to begin. You may want an
      answer through action rather than a long discussion. For example, try a first attempt at a skill before
      buying equipment for an entire course. Consider checking what you need in this particular moment before
      choosing a small adjustment. Keep it easy to revise if your mood or plans change. A symbol does not describe
      your whole personality, and you can set aside any part that does not fit. Review the actual experience
      later, allowing your observations to guide the next choice.
    advice:
      - Try a first attempt at a skill before buying equipment for an entire course.
    do:
      - Notice your mood
    dont:
      - Label yourself
