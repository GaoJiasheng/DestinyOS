  zh:
    title: 顺势推进时，给自主协作留一点空间。
    summary: 顺势推进时，给自主协作留一点空间。
    body: 你可以把自己的位置站稳，也给同伴留出位置。比肩（传统上用来观察同伴与自主的主题）关注自主和同行，合作的入口可以是一项彼此都理解的分工。支持项相对集中时，你可以安排一次小推进，不把轻松的开头扩展成整天的承诺。比如和朋友安排周末时，把各自的偏好写成两个选项。建议先明确分工，观察这一步带来的实际反馈，再决定是否增加安排。
    advice:
      - 明确分工，再复盘反馈。
    do:
      - 清楚分工
    dont:
      - 争抢主导
  en:
    title: Name your role, with space to review.
    summary: Name your role, with space to review.
    body:
      You can hold your own place while giving a peer room to contribute. Friend (bǐ jiān — a traditional
      theme of peers and autonomy) raises a question about ownership. Shared interests can start a conversation,
      but they need not produce identical plans. Notice which responsibility you want to keep and which part
      you could comfortably share. This higher overall band reflects several supportive contributions in the
      model. Let it invite a modest advance rather than a full calendar. You can prepare one clear stopping
      point and check the result there. Later circumstances may still call for a different pace, even when
      the first attempt feels comfortable. When a housemate suggests a different routine, ask what problem
      the change would solve. Consider reviewing the actual experience before adding another commitment. This
      theme offers a question to explore within your real circumstances today.
    advice:
      - Name your role and review the result.
    do:
      - Define roles
    dont:
      - Compete for control
