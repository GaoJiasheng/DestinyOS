    body: 你可以参加热闹，也可以提前说明自己的限度。劫财（传统上用来观察共享与资源边界的主题）关注共享和竞争，分清愿意参与与能够投入，交流会更轻松。支持项相对集中时，你可以安排一次小推进，不把轻松的开头扩展成整天的承诺。比如朋友邀你参加新活动时，先核对已有安排再回复。建议先先定边界，观察这一步带来的实际反馈，再决定是否增加安排。
