      theme of sharing and resource boundaries) asks about the boundary between generosity and competition.
      Agreeing on what you can contribute may make participation easier. Your place in a group need not depend
      on keeping up with everyone else. This higher overall band reflects several supportive contributions
      in the model. Let it invite a modest advance rather than a full calendar. You can prepare one clear stopping
      point and check the result there. Later circumstances may still call for a different pace, even when
