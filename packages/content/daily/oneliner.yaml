  zh:
    title: 你可以明确分工，顺势推进。
    summary: 你可以明确分工，顺势推进。
    body: 你可以明确分工，顺势推进。今日主题关注同伴与自主（把当天主要线索整理成一个观察方向），你可以用它检查自己的安排。综合评分落在较高区间，说明模型中支持项相对集中。你可以推进一件已经准备好的事，同时给反馈留出位置。好节奏也不需要把全天塞满，完成后停下来检查结果。比如与同事分工时，先认领一块能独立完成的任务。建议先完成这一小步，再看实际感受。
    advice:
      - 明确分工，再复盘反馈。
    do:
      - 清楚分工
    dont:
      - 争抢主导
  en:
    title: 'Make room for progress: name your role.'
    summary: 'Make room for progress: name your role.'
    body:
      'Make room for progress: name your role. Your overall band contains several supportive signals in
      this model. Use that as a cue to move a prepared idea forward, with a clear place to stop and review.
      A productive morning does not require filling every remaining hour. Consider saving some capacity for
      an unexpected request or a change in the information available. Friend (bǐ jiān — a traditional theme
      of peers and autonomy) invites you to examine independence alongside belonging. A familiar viewpoint
      can make collaboration comfortable, yet agreement does not remove the need to name separate responsibilities.
      You can keep ownership of your work while welcoming someone else’s method. In a study group, volunteer
      to explain one topic instead of competing to answer every question. You can keep the next action limited
      to what fits your actual circumstances. This theme offers a question to explore within your real circumstances
      today.'
    advice:
      - Name your role and review the result.
    do:
      - Define roles
    dont:
      - Compete for control
