# T-23: glossary follows appendix keys; pinyin describes the Chinese display term.
- key: star.zuo_fu
  system: ziwei
  zh:
    term: 左辅
    pinyin: zuǒ fǔ
    short: 紫微辅助星曜：协作支持
    long: 左辅是紫微盘中的辅助星曜，传统解读关注协作支持。它修饰所在宫位的主题，要结合主星、亮度与四化关系，不把单星当作对个人或关系的定论。
  en:
    term: Left Assistant
    pinyin: zuǒ fǔ
    short: A Zi Wei auxiliary theme of cooperative support
    long:
      Left Assistant is an auxiliary star symbol in a Zi Wei chart, emphasizing cooperative support. It
      modifies a palace theme and is read with major stars, brightness, and transformations. One symbol does
      not define a person or connection.
  aliases: []
