# T-23: glossary follows appendix keys; pinyin describes the Chinese display term.
- key: na_yin.hai_zhong_jin
  system: bazi
  zh:
    term: 海中金
    pinyin: hǎi zhōng jīn
    short: 六十甲子配对形成的纳音意象
    long: 海中金是三十种纳音之一，每种对应相邻两个六十甲子位置。纳音提供五行文化意象，与日主五行及原局比例不是同一字段，不能单独用来判断喜忌或现实处境。
  en:
    term: Metal in the Sea
    pinyin: hǎi zhōng jīn
    short: A Na Yin image assigned to a paired cycle position
    long:
      Metal in the Sea is one of thirty Na Yin images, each assigned to two neighboring positions in the
      sixty-pair cycle. This cultural elemental image is distinct from the Day Master element and natal elemental
      distribution; it does not by itself establish favorable elements or circumstances.
  aliases: []
