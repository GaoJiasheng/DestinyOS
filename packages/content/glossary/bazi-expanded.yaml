    pinyin: jiàn lù gé
    short: 以月令十神命名的配置主题：自主与稳定投入
    long: 建禄格是一期按月令本气与透干归类的格局名称，文化主题为自主与稳定投入。它概括模型的侧重点，要与日主支持、其他十神和现实经历一起观察，不规定职业或人生结果。
  en:
    term: Established Prosperity Structure
    pinyin: jiàn lù gé
    short: A seasonal structure emphasizing autonomy and steady effort
    long:
      Established Prosperity Structure names a structure classified from the month branch’s main hidden
      stem and its appearance in visible stems. Its cultural theme concerns autonomy and steady effort. It
      summarizes a model emphasis rather than prescribing a career or outcome; read it with natal support,
      other functions, and experience.
  aliases: []
