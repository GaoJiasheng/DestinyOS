    long: 寻找同行者时，看长期可信度而非一时热闹；你可以对照现实来看。比以水与地相亲的意象谈连接，合作的价值来自彼此愿意回应。亲近不必取消筛选，也不必为了融入而违背自己的原则；稳定的小圈子往往比表面的广泛关系更有用。例如，邀请两位可靠伙伴定期交流进展，更容易把想法放进实际生活。建议先说明你能给出的支持，并根据反馈调整节奏。
