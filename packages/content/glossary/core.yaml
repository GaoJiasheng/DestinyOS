  en:
    term: Retreat
    short: Retreat, a category in the traditional symbolic framework
    long:
      'You can step back deliberately when continued engagement is narrowing your options. Heaven moving
      away from mountain offers a picture of separation with purpose. Withdrawal can preserve integrity and
      capacity when a situation is no longer responsive to constructive effort. For example, plan an orderly
      handover when a collaboration no longer fits. The point is to notice how your current arrangement supports
      this kind of response, not to predict an event from the image. Consider a small action with an observable
      result: choose distance before resentment grows. Give yourself a practical review point, such as the
      next conversation or completed task, so that new information can change your approach. You can retain
      the part that fits your circumstances and set aside what does not. Your own experience and the choices
      available to you remain central to applying this reading. A useful question is which current constraint
      you can actually influence, and what would show that your next step has helped.'
