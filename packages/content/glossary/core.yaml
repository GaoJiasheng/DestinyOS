    long: 道路受阻时，绕行与求助也是推进；你可以对照现实来看。蹇以山前有水讲前进受到阻挡，辨认困难比重复撞向它更有帮助。暂停、回看、联系有经验的人，能够把困境变成可处理的问题；你不必把独自承受当作能力的证明。例如，依赖迟迟不到时请熟悉流程的人一起找替代路径，更容易把想法放进实际生活。建议先识别障碍再安排下一步，并根据反馈调整节奏。
