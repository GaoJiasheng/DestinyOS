    short: 遁，传统象征中的一种分类
    long: 适当后退，可以保护原则与下一步的选择；你可以对照现实来看。遯以天远离山的意象讲有意识的退避，后退不等于否定自己。识别不适合继续投入的局面，安排交接与距离，能够保留精力，并减少在纠缠中失去判断的可能。例如，合作方向不合时清楚说明退出与交接安排，更容易把想法放进实际生活。建议退一步也把边界说清楚，并根据反馈调整节奏。
