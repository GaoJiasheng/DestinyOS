- key: nakshatra.ashwini
  system: vedic
  zh:
    term: 阿湿毗尼
    short: 二十七星宿中的第1段
    long: 阿湿毗尼是恒星黄道二十七等分中的第1段，每段十三度二十分，再分成四个帕达。守护星为Ketu，用于月亮位置分类及 Vimshottari 起运，不代表一颗实际恒星或事件预报。
    pinyin: ā shī pí ní
  en:
    term: Ashwini
    short: Sidereal lunar sector 1 of 27
    long:
      Ashwini is sector 1 of the twenty-seven-part sidereal zodiac, spanning 13°20′ and divided into four
      Padas. Its period lord is Ketu; this classification locates the Moon and starts the Vimshottari sequence.
      It is a sector rather than one physical star or an event forecast.
    pinyin: ā shī pí ní
  aliases: []
