    long: 改变旧安排时，让理由与准备先于声势；你可以对照现实来看。革以泽中有火讲旧结构与新力量之间的张力，变化需要条件与认可。你可以说明为什么改、怎样改、改后如何检查，让参与者逐步理解；追求变化本身容易忽略使用者的承受范围。例如，调整流程前展示旧问题与小规模试验结果，更容易把想法放进实际生活。建议为变化安排沟通和复查，并根据反馈调整节奏。
