- key: hexagram.1
  system: iching
  zh:
    term: 乾
    short: 乾，传统象征中的一种分类
    long: 主动创造，持续练习，把力量用在可承担的目标上；你可以对照现实来看。能力正在形成时先做准备，得到支持后再扩大影响，走到高处也要留意反馈。乾的六个位置呈现力量从潜藏到显露的过程，重点是行动与时机相配。例如，新项目先做样稿，再邀请同事评审，更容易把想法放进实际生活。建议给每一步设定检查点，并根据反馈调整节奏。
    pinyin: qián
  en:
    term: The Creative
    short: The Creative, a category in the traditional symbolic framework
    long:
      'You have room to initiate, but leadership asks for practice as well as confidence. A capable person
      can still move too early. The six dragon images trace how initiative develops, becomes visible, and eventually
      needs restraint. For example, test an idea privately before asking a team to follow it. The point is
      to notice how your current arrangement supports this kind of response, not to predict an event from the
      image. Consider a small action with an observable result: make room for honest feedback. Give yourself
      a practical review point, such as the next conversation or completed task, so that new information can
      change your approach. You can retain the part that fits your circumstances and set aside what does not.
      Your own experience and the choices available to you remain central to applying this reading. A useful
      question is which current constraint you can actually influence, and what would show that your next step
      has helped.'
    pinyin: qián
  aliases: []
- key: hexagram.2
  system: iching
  zh:
    term: 坤
    short: 坤，传统象征中的一种分类
