    long: 突然变化带来紧张时，先恢复基本秩序；你可以对照现实来看。震以重复的雷讲突然被唤起，最初的紧张可以转成清醒的回应。你不必立刻作出所有决定，先核对事实、维持基本安排，再区分需要马上处理的事与可以稍后评估的事。例如，计划突变后先列出当天最必要的两件事，更容易把想法放进实际生活。建议先稳住节奏再判断影响，并根据反馈调整节奏。
