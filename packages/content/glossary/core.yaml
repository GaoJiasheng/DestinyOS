      kind of response, not to predict an event from the image. Consider a small action with an observable
      result: care for what makes the result hold. Give yourself a practical review point, such as the next
      conversation or completed task, so that new information can change your approach. You can retain the
      part that fits your circumstances and set aside what does not. Your own experience and the choices available
      to you remain central to applying this reading.'
    pinyin: jì jì
  aliases: []
- key: hexagram.64
  system: iching
  zh:
    term: 未济
    short: 未济，传统象征中的一种分类
    long: 尚未完成时，重新确认次序与跨越条件；你可以对照现实来看。未济以火水未交讲条件尚未形成稳定配合，离终点近也不宜忽略最后的准备。你可以承认仍待完成的部分，调整次序与工具，让每一步都能接上下一步，而不是只靠接近成功的感觉推进。例如，上线前确认最后一个依赖确实已就绪，更容易把想法放进实际生活。建议把剩余工作排成清楚顺序，并根据反馈调整节奏。
    pinyin: wèi jì
  en:
    term: Before Completion
    short: Before Completion, a category in the traditional symbolic framework
    long:
      'You can continue an unfinished transition by coordinating the next step carefully. Fire above water
      presents elements that have not yet settled into a useful exchange. Being near the end of a passage does
      not remove its demands, so coordination and a realistic next step remain valuable. For example, verify
      the final dependency before calling a transition complete. The point is to notice how your current arrangement
      supports this kind of response, not to predict an event from the image. Consider a small action with
      an observable result: finish through coordination rather than anticipation. Give yourself a practical
      review point, such as the next conversation or completed task, so that new information can change your
      approach. You can retain the part that fits your circumstances and set aside what does not. Your own
      experience and the choices available to you remain central to applying this reading.'
    pinyin: wèi jì
  aliases: []
