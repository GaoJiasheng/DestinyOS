  system: vedic
  zh:
    term: 雷瓦蒂
    short: 二十七星宿中的第27段
    long: 雷瓦蒂是恒星黄道二十七等分中的第27段，每段十三度二十分，再分成四个帕达。守护星为水星，用于月亮位置分类及百二十年大运起运，不代表一颗实际恒星或事件预报。
    pinyin: léi wǎ dì
  en:
    term: Revati
    short: Sidereal lunar sector 27 of 27
    long:
      Revati is sector 27 of the twenty-seven-part sidereal zodiac, spanning 13°20′ and divided into
      four Padas. Its period lord is Mercury; this classification locates the Moon and starts the
      Vimshottari sequence. It is a sector rather than one physical star or an event forecast.
    pinyin: léi wǎ dì
