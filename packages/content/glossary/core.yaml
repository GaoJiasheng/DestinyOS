  zh:
    term: 乾
    short: 主动创造，持续练习，把力量用在可承担的目标上
    long: 乾为重天，强调主动的力量应与所处阶段相配，刚起步时潜藏准备，成熟时承担责任，用力过度时退一步。它不是无限加码的许可。
    pinyin: qián
  en:
    term: The Creative
    short: The doubled heaven image emphasizes initiative that changes with its stage of development.
    long:
      'The doubled heaven image emphasizes initiative that changes with its stage of development.
      Preparation, visible responsibility and restraint are different uses of strength. Read the
      dragon sequence as a question about readiness, rather than permission to keep expanding every
      undertaking.'
    pinyin: qián
  aliases: []
- key: hexagram.2
  system: iching
  zh:
    term: 坤
    short: 承接现实需要，用可靠的配合建立自己的位置
    long: 坤为重地，强调厚实承接与配合，顺应不是没有判断。先弄清共同方向，再用持续兑现建立信任，不必争抢发号施令的位置。
    pinyin: kūn
  en:
    term: The Receptive
    short: The doubled earth image emphasizes carrying and sustaining an arrangement.
    long: 'The doubled earth image emphasizes carrying and sustaining an arrangement. Receptivity
      differs from surrendering judgment. Establish the direction you are agreeing to support, then
      make that support dependable through repeated actions rather than competing to set every part
      of the agenda.'
    pinyin: kūn
  aliases: []
- key: hexagram.3
  system: iching
  zh:
    term: 屯
    short: 起步不顺时，先把资源和伙伴组织起来
    long: 水在雷上，行动已经发动而前方仍有险，屯重在初创时组织条件。困难不要求孤军推进，可以先找能共担任务的人，再逐项建立秩序。
    pinyin: tún
  en:
    term: Difficulty at the Beginning
    short: Thunder beneath water places an impulse to begin under difficult conditions.
    long: 'Thunder beneath water places an impulse to begin under difficult conditions. The issue is
      organizing an early undertaking, rather than proving courage through solitary effort. Find
      people who can share the preparation and establish the working arrangement before asking the
      whole project to move at once.'
    pinyin: tún
  aliases: []
- key: hexagram.4
  system: iching
  zh:
    term: 蒙
    short: 愿意承认未知，学习才有明确入口
    long: 山下有水，蒙强调面对未知时建立学习关系。求教需要问题明确、愿意实践，带教也应有边界；反复追问而不尝试，难以得到新的理解。
    pinyin: méng
  en:
    term: Youthful Folly
    short: Water beneath the mountain frames uncertainty as a learning situation.
    long: 'Water beneath the mountain frames uncertainty as a learning situation. A useful teaching
      relationship needs an answerable question and willingness to practise. Repeating the request
      without using the instruction may add little. Clarify what you are trying to learn and which
      exercise would show whether the explanation helped.'
    pinyin: méng
  aliases: []
- key: hexagram.5
  system: iching
  zh:
    term: 需
    short: 等待条件成熟时，仍可照顾手头的准备
    long: 水在天上，需是危险尚在前方时的有准备等待，不是拖延所有事。照顾食宿与已有资源，等候真正缺少的条件，不把着急当成已经可以跨越的依据。
    pinyin: xū
  en:
    term: Waiting
    short: Water above heaven places difficulty ahead of an active force.
    long:
      'Water above heaven places difficulty ahead of an active force. Waiting here has a purpose:
      preserve usable resources while the missing condition develops. It differs from postponing
      everything indefinitely. Identify what you are actually waiting for and continue the
      preparation that does not require crossing the present obstacle.'
    pinyin: xū
  aliases: []
- key: hexagram.6
  system: iching
  zh:
    term: 讼
    short: 分歧出现时，先降低争执的成本
    long: 天与水的走势不同，讼强调争执中看清代价与停下的时机。中途回到可履行的约定比追求争赢更稳，必要时找公允的第三方协助沟通。
    pinyin: sòng
  en:
    term: Conflict
    short: Heaven and water move in different ways, providing an image of diverging aims.
    long:
      'Heaven and water move in different ways, providing an image of diverging aims. The practical
      concern is how a disagreement escalates and where it can be stopped. Return to an agreement
      the participants can fulfil, and seek fair mediation where useful, rather than making victory
      the only acceptable ending.'
    pinyin: sòng
  aliases: []
- key: hexagram.7
  system: iching
  zh:
    term: 师
    short: 集体行动需要秩序，也需要可信的负责人
    long: 水藏于地中，师强调集体力量需要纪律与有经验的统筹。人数多不等于已经协调好，先确认共同规则、职责与交接，让行动不因多人争令而失去方向。
    pinyin: shī
  en:
    term: The Army
    short: Water held within earth presents collective capacity that needs organization.
    long: 'Water held within earth presents collective capacity that needs organization. Having many
      participants does not establish a coordinated effort. The reading asks about a capable
      organizer, shared rules and clear instructions. Agree on responsibilities and handover so that
      competing directions do not consume the group’s available energy.'
    pinyin: shī
  aliases: []
- key: hexagram.8
  system: iching
  zh:
    term: 比
    short: 寻找同行者时，看长期可信度而非一时热闹
    long: 水与地相亲，比强调择伴与联结，关键是参与意愿和长期可信度。并非聚在一起就适合合作，可以先确认共同方向，再允许各人自主决定投入多少。
    pinyin: bǐ
  en:
    term: Holding Together
    short: Water resting on earth gives an image of connection.
    long:
      'Water resting on earth gives an image of connection. The issue is choosing a group or partner
      through willingness and reliability, rather than proximity alone. Establish the shared purpose
      and ask how each person wants to participate. A sound association leaves room for a voluntary
      response instead of demanding immediate allegiance.'
    pinyin: bǐ
  aliases: []
- key: hexagram.9
  system: iching
  zh:
    term: 小畜
    short: 暂时不能大步推进时，积累小而可靠的成果
    long: 风在天上，小畜用较柔和的力量约束较强的推进，积累尚未到大举行动的程度。先改进小处与沟通，不因为已有一点进展就忽略承载条件。
    pinyin: xiǎo chù
  en:
    term: The Taming Power of the Small
    short: Wind above heaven suggests a limited influence shaping a stronger impulse.
    long:
      'Wind above heaven suggests a limited influence shaping a stronger impulse. Small adjustments
      can collect useful capacity before a larger undertaking is ready. This differs from the Great
      Taming’s more substantial reserve. Improve a detail or a conversation, and check the
      supporting arrangement before treating modest progress as permission to expand.'
    pinyin: xiǎo chù
  aliases: []
- key: hexagram.10
  system: iching
  zh:
    term: 履
    short: 面对敏感场合，真诚与分寸可以一起保留
    long: 天在泽上，履以踏在敏感边界的意象提醒你注意分寸。谨慎不是退缩，可以确认程序、权限与对方需要，再以朴素清楚的方式前进。
    pinyin: lǚ
  en:
    term: Treading
    short: Heaven above the lake presents a crossing of sensitive boundaries.
    long:
      'Heaven above the lake presents a crossing of sensitive boundaries. Careful conduct concerns
      the way you proceed, not a requirement to retreat from every encounter. Check the procedure,
      your authority to act and the other person’s needs. A plain, well-prepared approach can
      preserve dignity without relying on display or force.'
    pinyin: lǚ
  aliases: []
- key: hexagram.11
  system: iching
  zh:
    term: 泰
    short: 沟通顺畅时，适合建立能长久维持的合作
    long: 地在上、天在下，泰强调上下之气能够相交的通畅。顺畅不是永久状态，宜在能沟通时建立明确分工与维护方式，把合作落成可重复的日常。
    pinyin: tài
  en:
    term: Peace
    short: Earth above heaven represents an exchange between complementary movements.
    long: 'Earth above heaven represents an exchange between complementary movements. The point is
      circulation and access, rather than an everlasting favourable condition. Use a period of
      communication to establish clear responsibilities and ways to maintain contact. A workable
      routine helps the relationship remain usable when the initial ease is no longer new.'
    pinyin: tài
  aliases: []
- key: hexagram.12
  system: iching
  zh:
    term: 否
    short: 联系受阻时，先守住原则与可用的资源
    long: 天在上、地在下，否强调联系难以相通，宜保护原则与可用资源。与泰相反，眼下不宜把未获回应的事情当成已落实；先找一个能够重新接洽的入口。
    pinyin: fǒu
  en:
    term: Standstill
    short: Heaven above earth presents movements that do not readily meet.
    long:
      'Heaven above earth presents movements that do not readily meet. Unlike Peace, the emphasis is
      on blocked exchange and preserving what remains workable. Do not count an unanswered request
      as an agreement. Protect essential resources and look for a limited point of contact through
      which communication can begin again.'
    pinyin: fǒu
  aliases: []
- key: hexagram.13
  system: iching
  zh:
    term: 同人
    short: 共同目标越清楚，越容易跨过圈子差异
    long: 火在天下，同人强调公共目标与开放联结，不只是在熟人之间互相认同。把目的讲清楚，也让不同背景的人知道如何参与，可以减少小圈子的排他与猜疑。
    pinyin: tóng rén
  en:
    term: Fellowship with Men
    short: Fire beneath heaven emphasizes a purpose that can be recognized across personal circles.
    long: 'Fire beneath heaven emphasizes a purpose that can be recognized across personal circles.
      Shared understanding is different from loyalty only to familiar people. State the task in
      terms newcomers can use, and make participation accessible. This helps a group build common
      ground without requiring everyone to share the same background or preferences.'
    pinyin: tóng rén
  aliases: []
- key: hexagram.14
  system: iching
  zh:
    term: 大有
    short: 拥有较多资源时，分配与使用比展示更关键
    long: 火在天上，大有强调资源可见而需要合宜使用。与大畜的储备不同，重点是如何分配已经拥有的条件；明确贡献与责任，避免展示优势压过实际用途。
    pinyin: dà yǒu
  en:
    term: Possession in Great Measure
    short: Fire above heaven brings resources into visibility.
    long:
      'Fire above heaven brings resources into visibility. Unlike the Great Taming’s preparation of
      reserves, this reading asks how an existing capacity is used and shared. Make contribution and
      responsibility clear. The usefulness of a resource depends on access and stewardship, rather
      than on displaying how much one person possesses.'
    pinyin: dà yǒu
  aliases: []
- key: hexagram.15
  system: iching
  zh:
    term: 谦
    short: 低调表达实力，让贡献被看见而不过度占位
    long: 山藏于地中，谦以有实力而不高举自己的意象强调分寸。谦和不是缩小贡献，可以用事实说明完成了什么，同时把协作者的作用留在叙述中。
    pinyin: qiān
  en:
    term: Modesty
    short: The mountain within earth suggests real substance expressed without occupying the highest
      visible place.
    long: 'The mountain within earth suggests real substance expressed without occupying the highest
      visible place. Modesty does not require denying a contribution. Describe what you completed
      plainly while acknowledging what others supplied. This keeps the scale of the account close to
      the work and allows competence to remain visible without turning it into a contest for
      attention.'
    pinyin: qiān
  aliases: []
- key: hexagram.16
  system: iching
  zh:
    term: 豫
    short: 有热情时，把期待转成有准备的集体行动
    long: 雷出地上，豫强调热情能组织起共同动作，也警惕只沉浸在气氛中。先把期待接到人员与准备上，再安排推进的时程，让兴奋有实际承接。
    pinyin: yù
  en:
    term: Enthusiasm
    short: Thunder emerging above earth suggests energy that can mobilize a group.
    long:
      'Thunder emerging above earth suggests energy that can mobilize a group. Enthusiasm becomes
      useful when preparation lets others join the movement. Check the people, materials and
      sequence needed before relying on the atmosphere itself. If excitement has displaced attention
      to a constraint, return to that condition without dismissing the value of shared motivation.'
    pinyin: yù
  aliases: []
- key: hexagram.17
  system: iching
  zh:
    term: 随
    short: 顺势调整时，仍需知道自己遵循的原则
    long: 泽中有雷，随强调因时调整与选择可信方向，不是盲目追随。先确认你认同什么，再决定怎样配合；有些取舍会改变原来的联结，需要说清理由与边界。
    pinyin: suí
  en:
    term: Following
    short: Thunder within the lake suggests movement responding to a wider situation.
    long:
      'Thunder within the lake suggests movement responding to a wider situation. Following differs
      from accepting every influence unexamined. Identify the purpose you recognize before deciding
      how to adapt. A change of direction may alter a previous association, so explain the choice
      and the limits of your participation rather than relying on silent compliance.'
    pinyin: suí
  aliases: []
- key: hexagram.18
  system: iching
  zh:
    term: 蛊
    short: 处理积累的问题，需要修复原因而非只遮住表面
    long: 山下有风，蛊强调积累的失修需要追溯原因并整治。修补不是责怪前人，可以分清旧习惯、现有影响与需要更新的流程，改一处后再检查是否持续有效。
    pinyin: gǔ
  en:
    term: Work on What Has Been Spoiled
    short:
      Wind beneath the mountain frames a problem accumulated through neglect or an arrangement left
      unexamined.
    long:
      'Wind beneath the mountain frames a problem accumulated through neglect or an arrangement left
      unexamined. Repair requires attention to causes as well as appearances. Separate an inherited
      habit from its present effects and from the process that now needs updating. Correct one
      source of deterioration, then check whether the repair remains effective in ordinary use.'
    pinyin: gǔ
  aliases: []
- key: hexagram.19
  system: iching
  zh:
    term: 临
    short: 主动靠近问题时，用理解替代单向指挥
    long: 地在泽上，临强调靠近与照顾，也提醒你顺利阶段有边界。主动到场了解比远处指挥更有帮助；先听参与者的需要，再约定后续如何保持回应。
    pinyin: lín
  en:
    term: Approach
    short: Earth above the lake suggests approaching and attending to a situation.
    long: 'Earth above the lake suggests approaching and attending to a situation. Closeness becomes
      useful through understanding, not merely supervision. A favourable opening also has limits and
      needs maintenance. Visit the actual task, listen to the people carrying it and agree how you
      will remain available after the first approach.'
    pinyin: lín
  aliases: []
- key: hexagram.20
  system: iching
  zh:
    term: 观
    short: 先看清整体，再决定该前进还是调整
    long: 风行地上，观强调从具体行为了解整体，观察也包含检视自己给出的示范。不要把有限视角当全貌，可以先比较不同参与者的记录，再决定是否改变安排。
    pinyin: guān
  en:
    term: Contemplation
    short: Wind moving above earth gives a broad view that still needs evidence from practice.
    long: 'Wind moving above earth gives a broad view that still needs evidence from practice.
      Observation includes the example you set, as well as what you notice in others. A limited
      viewpoint cannot establish the whole arrangement. Compare accounts from different participants
      and examine your own contribution before deciding what the larger pattern requires.'
    pinyin: guān
  aliases: []
- key: hexagram.21
  system: iching
  zh:
    term: 噬嗑
    short: 障碍需要被具体处理，不能只靠含糊的和气
    long: 雷电相合，噬嗑强调有障碍夹在其中时需明辨并处理，不是鼓励严惩。先把问题说到具体步骤，采用与影响相称的纠正，保留事实核查与沟通的空间。
    pinyin: shì kē
  en:
    term: Biting Through
    short: Thunder and lightning bring action together with clear discrimination.
    long: 'Thunder and lightning bring action together with clear discrimination. The image of an
      obstruction calls for identifying what prevents connection, not for escalating punishment.
      Specify the blocked step and choose a correction proportionate to its effect. A clear boundary
      works better when the relevant facts can be checked and the people affected can understand the
      response.'
    pinyin: shì kē
  aliases: []
- key: hexagram.22
  system: iching
  zh:
    term: 贲
    short: 表达可以更美，但内容仍需经得起使用
    long: 山下有火，贲强调表达与形式能够照亮内容，但修饰不能代替实质。先确认信息是否正确、物件是否好用，再改善呈现，朴素也可以合乎场合。
    pinyin: bēn
  en:
    term: Grace
    short: Fire beneath the mountain illuminates a form without replacing its substance.
    long:
      'Fire beneath the mountain illuminates a form without replacing its substance. Presentation
      can help people recognize what is being offered, but ornament cannot make an unusable
      arrangement sound. Check accuracy or function before refining appearance. A simple
      presentation may fit the occasion better than adding detail that obscures the central
      purpose.'
    pinyin: bēn
  aliases: []
- key: hexagram.23
  system: iching
  zh:
    term: 剥
    short: 基础松动时，优先保护仍然可靠的部分
    long: 山在地上，剥强调基础正在逐层削弱，继续扩张容易增加负担。先保护必要支撑与剩余资源，找出现在哪一层失去承载，不必一次恢复全部规模。
    pinyin: bō
  en:
    term: Splitting Apart
    short: The mountain resting above earth directs attention to the support beneath a visible structure.
    long: 'The mountain resting above earth directs attention to the support beneath a visible
      structure. When that support is being stripped away, expansion may add load where capacity is
      already weakening. Identify the layer that needs protection and preserve essential resources.
      A smaller workable arrangement can be a more useful response than trying to restore the whole
      structure immediately.'
    pinyin: bō
  aliases: []
- key: hexagram.24
  system: iching
  zh:
    term: 复
    short: 小小的回转值得珍惜，不必立刻恢复全部速度
    long: 雷在地中，复以微小阳气回转的意象强调重新开始需要养护。回到合适做法后不必立即补回所有进度，可以守住一个稳定动作，让改变有持续的条件。
    pinyin: fù
  en:
    term: Return
    short: Thunder within earth suggests a movement returning before it is fully visible.
    long: 'Thunder within earth suggests a movement returning before it is fully visible. A small
      correction deserves protection rather than an immediate demand for full speed. Resume one
      practice that can be sustained and notice what helps it continue. This differs from a dramatic
      restart: the value lies in maintaining the first useful turn back toward a workable path.'
    pinyin: fù
  aliases: []
- key: hexagram.25
  system: iching
  zh:
    term: 无妄
    short: 诚实回应现实，减少为求结果而多做的动作
    long: 雷行天下，无妄强调不妄作、按真实条件行动，也承认偶然波及并非个人有错。减少为求结果而增加的多余动作，先完成职责内能够核对的部分。
    pinyin: wú wàng
  en:
    term: Innocence
    short: Thunder beneath heaven emphasizes action without contrived motives or unnecessary additions.
    long:
      'Thunder beneath heaven emphasizes action without contrived motives or unnecessary additions.
      An unexpected difficulty does not by itself establish personal fault. Separate what belongs to
      your responsibility from what arose through circumstances, then respond to the effect you can
      actually address. Honest effort does not require inventing another intervention every time an
      outcome remains uncertain.'
    pinyin: wú wàng
  aliases: []
- key: hexagram.26
  system: iching
  zh:
    term: 大畜
    short: 储备能力，也练习何时使用能力
    long: 山在天上，大畜以强健之力得到约束的意象强调储备、学习与适时发挥。积累不是永远不用，先核对能力与承载条件，合适时把训练转成一次实际交付。
    pinyin: dà chù
  en:
    term: The Taming Power of the Great
    short: The mountain above heaven places a strong impulse within a containing structure.
    long:
      'The mountain above heaven places a strong impulse within a containing structure. The emphasis
      is on developing capacity and learning when to use it. Restraint is different from keeping a
      skill unused indefinitely. Check readiness and the means of support, then turn the reserve
      into a delivery that tests what the preparation has made possible.'
    pinyin: dà chù
  aliases: []
- key: hexagram.27
  system: iching
  zh:
    term: 颐
    short: 留意每天吸收什么，也留意你怎样支持别人
    long: 山下有雷，颐以口与养护的意象强调你吸收什么、提供什么。重点不止饮食，也包括信息与日常支持；检查一项反复消耗注意力的输入，换成更能回应实际需要的内容。
    pinyin: yí
  en:
    term: The Corners of the Mouth
    short: Thunder beneath the mountain gives an image associated with nourishment and the mouth.
    long:
      'Thunder beneath the mountain gives an image associated with nourishment and the mouth. The
      question extends beyond food to information, speech and the support you provide. Examine a
      recurring input that consumes attention without helping the present task. Choose something
      that meets an actual need, and consider whether what you offer others is equally usable.'
    pinyin: yí
  aliases: []
- key: hexagram.28
  system: iching
  zh:
    term: 大过
    short: 负担超过常态时，先加支撑再谈突破
    long: 泽在木上，大过以承重主梁弯曲的意象强调负荷已超常。突破需要先增支撑，不是继续证明能扛；减少非必要目标，并把关键责任交给能够共同承接的人。
    pinyin: dà guò
  en:
    term: Preponderance of the Great
    short: The lake above wood accompanies an image of a beam carrying unusual weight.
    long:
      'The lake above wood accompanies an image of a beam carrying unusual weight. The issue is load
      and support before any claim about breakthrough. Reduce nonessential aims and distribute the
      central responsibility among people able to carry it. Continuing to demonstrate endurance can
      leave the structure weaker, while a well-supported exception may make a necessary passage
      workable.'
    pinyin: dà guò
  aliases: []
- key: hexagram.29
  system: iching
  zh:
    term: 坎
    short: 面对反复的困难，用稳定方法找到可走的一小段
    long: 两重水险，坎强调困难重复出现时保持可信的做法，从可走的一小段推进。不要靠一次猛冲摆脱全部阻碍，可以核对每一步的支点，遇到同样卡点时及时求助。
    pinyin: kǎn
  en:
    term: The Abysmal
    short: Repeated water emphasizes difficulty encountered more than once.
    long:
      'Repeated water emphasizes difficulty encountered more than once. A reliable method can make
      one short passage usable without promising that every obstacle disappears. Check the foothold
      for each step and ask for assistance when the same blockage returns. Consistency here concerns
      staying truthful and attentive within a hard situation, rather than repeating a failed
      approach simply because it is familiar.'
    pinyin: kǎn
  aliases: []
- key: hexagram.30
  system: iching
  zh:
    term: 离
    short: 清楚看见需要依靠什么，才能让热情持续
    long: 两重火，离强调明亮需要有所依附，热情也需要可持续的基础。先找出支持行动的资料、工具或人，不把自己独立发光理解为不需要任何承接。
    pinyin: lí
  en:
    term: The Clinging
    short: Repeated fire suggests clarity that depends on something it can attach to and sustain.
    long: 'Repeated fire suggests clarity that depends on something it can attach to and sustain.
      Enthusiasm needs a usable base. Identify the information, tools or people that support the
      action you want to take. The question is not whether you can shine independently of everything
      else, but whether your chosen connection can keep the effort clear and manageable.'
    pinyin: lí
  aliases: []
- key: hexagram.31
  system: iching
  zh:
    term: 咸
    short: 回应触动时，给双方留出自然靠近的空间
    long: 泽在山上，咸强调彼此受到触动与自愿回应，不用来猜定对方心意。与恒的长期维持不同，这里先观察互动是否自然；表达一次邀请，再给对方真实选择的空间。
    pinyin: xián
  en:
    term: Influence
    short: The lake above the mountain frames influence through mutual responsiveness.
    long:
      'The lake above the mountain frames influence through mutual responsiveness. A feeling in one
      person does not establish the other person’s intention. Unlike Duration’s continuing practice,
      this reading begins with noticing an exchange. Offer a clear invitation and leave room for a
      voluntary answer, rather than trying to secure closeness through repeated interpretation of
      small signs.'
    pinyin: xián
  aliases: []
- key: hexagram.32
  system: iching
  zh:
    term: 恒
    short: 长期坚持需要稳定方向，也需要及时调节做法
    long: 雷在风上，恒强调方向持续而做法可调整，不是每天完全相同。先确定值得维持的承诺，再为变化的日程安排交接和复盘，让长久依靠兑现而非硬撑。
    pinyin: héng
  en:
    term: Duration
    short: Thunder above wind presents continuity through changing movements.
    long:
      'Thunder above wind presents continuity through changing movements. Keeping a direction does
      not require repeating the same method regardless of conditions. Identify the commitment worth
      maintaining and prepare handover or review when schedules change. Duration becomes practical
      through renewed follow-through, rather than through insisting that a difficult arrangement
      must remain untouched to prove loyalty.'
    pinyin: héng
  aliases: []
- key: hexagram.33
  system: iching
  zh:
    term: 遁
    short: 适当后退，可以保护原则与下一步的选择
    long: 天在山上，遯强调力量不相称时有分寸地退避，后退不等于认输。说明不再参与的范围、完成必要交接，让保留原则与减少纠缠能够同时做到。
    pinyin: dùn
  en:
    term: Retreat
    short: Heaven above the mountain frames a measured withdrawal when engagement no longer fits the
      conditions.
    long: 'Heaven above the mountain frames a measured withdrawal when engagement no longer fits the
      conditions. Stepping back is different from surrendering every principle. Explain the scope
      you are leaving, complete the needed handover and preserve distance from an unproductive
      exchange. This gives a future choice room without requiring you to win the final
      conversation.'
    pinyin: dùn
  aliases: []
- key: hexagram.34
  system: iching
  zh:
    term: 大壮
    short: 力量增加时，更要校准边界与使用方式
    long: 雷在天上，大壮强调力量增长后仍须守分寸，强行推进可能把自己卡住。先确认权限、道路与承载，再使用已有能力，遇到阻力时也允许改法。
    pinyin: dà zhuàng
  en:
    term: The Power of the Great
    short: Thunder above heaven emphasizes increased force that still needs appropriate limits.
    long:
      'Thunder above heaven emphasizes increased force that still needs appropriate limits. Strength
      can become an obstacle if it pushes beyond the available route. Check authority, access and
      support before applying more effort. If movement becomes blocked, change the method rather
      than treating resistance as a demand to prove that the same force can be made even stronger.'
    pinyin: dà zhuàng
  aliases: []
- key: hexagram.35
  system: iching
  zh:
    term: 晋
    short: 进展逐渐被看见时，继续保持清楚而可靠的做法
    long: 火在地上，晋强调进展逐渐进入可见范围，认可仍需由具体行为承接。把已经完成的部分说清楚，继续维护可靠方法，不必用展示替代下一步工作。
    pinyin: jìn
  en:
    term: Progress
    short: Fire rising above earth brings progress into visibility.
    long:
      'Fire rising above earth brings progress into visibility. Recognition becomes useful when it
      is tied to a contribution people can identify. Explain the part already completed and continue
      the practices that made it reliable. The reading does not ask you to substitute a display of
      momentum for the next piece of work still requiring attention.'
    pinyin: jìn
  aliases: []
- key: hexagram.36
  system: iching
  zh:
    term: 明夷
    short: 表达受限时，先保护判断与可持续的行动
    long: 火在地中，明夷强调清晰判断受到环境限制时保护内在原则，不是要求无限忍受。可以减少公开争辩，保留可靠记录，并寻找能安全沟通与获得支持的渠道。
    pinyin: míng yí
  en:
    term: Darkening of the Light
    short: Fire within earth suggests clarity that cannot be expressed openly in the present setting.
    long:
      'Fire within earth suggests clarity that cannot be expressed openly in the present setting.
      Protecting judgment differs from accepting an unlimited burden. Reduce unproductive public
      argument, preserve a reliable account and seek a suitable channel for support. The emphasis is
      on keeping what you know usable while conditions constrain its expression, rather than making
      concealment a permanent rule.'
    pinyin: míng yí
  aliases: []
- key: hexagram.37
  system: iching
  zh:
    term: 家人
    short: 日常关系靠清楚分工与反复兑现来维持
    long: 风从火出，家人强调共同生活中的分工、表达与反复兑现，职责不按性别固定。把日常责任讲清楚，定期询问是否需要重新分配，让秩序也容纳参与者的变化。
    pinyin: jiā rén
  en:
    term: The Family
    short: Wind arising from fire places influence within a shared daily arrangement.
    long:
      'Wind arising from fire places influence within a shared daily arrangement. Roles need clear
      expression and repeated follow-through, without being assigned by gender. State who maintains
      each ordinary task and ask when the distribution needs changing. A dependable household or
      group can preserve coordination while allowing the people in it to develop different needs
      over time.'
    pinyin: jiā rén
  aliases: []
- key: hexagram.38
  system: iching
  zh:
    term: 睽
    short: 看法不同仍可在小事上找到合作入口
    long: 火向上、泽向下，睽强调方向不同仍可在小事上合作，不要求把差异全部消除。先选一个双方都认可的具体事项，避免用一次分歧给整段关系定性。
    pinyin: kuí
  en:
    term: Opposition
    short: Fire and lake suggest different directions of movement.
    long: 'Fire and lake suggest different directions of movement. Opposition need not prevent
      cooperation on a limited task. Choose a small matter both participants recognize, rather than
      requiring complete agreement first. A difference of outlook is one part of the relationship;
      testing a modest shared action can provide information that an argument about the whole
      relationship cannot.'
    pinyin: kuí
  aliases: []
- key: hexagram.39
  system: iching
  zh:
    term: 蹇
    short: 道路受阻时，绕行与求助也是推进
    long: 水在山上，蹇强调前路有险时换路、回看与求助。不是所有阻碍都该正面突破，可以先联系能提供信息的人，再比较绕行所需的条件与成本。
    pinyin: jiǎn
  en:
    term: Obstruction
    short: Water above the mountain presents difficulty ahead of an already constrained route.
    long:
      'Water above the mountain presents difficulty ahead of an already constrained route. A useful
      response may be returning to support, asking for guidance or choosing another path. Identify
      who can supply the missing information and compare the requirements of a detour. Pressing
      directly against the same obstruction is only one possible action, not a measure of
      commitment.'
    pinyin: jiǎn
  aliases: []
- key: hexagram.40
  system: iching
  zh:
    term: 解
    short: 紧张开始松动时，及时处理剩下的结节
    long: 雷在水上，解强调紧张开始松动后及时解除剩余牵绊。恢复空间不需要再制造新冲突，可以取消失效要求、完成沟通，让已经可用的条件重新流动。
    pinyin: jiě
  en:
    term: Deliverance
    short: Thunder above water suggests release as an active movement out of difficulty.
    long:
      'Thunder above water suggests release as an active movement out of difficulty. Once pressure
      eases, attend to the remaining knot rather than starting another contest. Remove an obsolete
      requirement or finish the conversation that still restricts coordination. The aim is to let
      newly available room become useful, without assuming that relief means every practical issue
      has already resolved itself.'
    pinyin: jiě
  aliases: []
- key: hexagram.41
  system: iching
  zh:
    term: 损
    short: 减少一部分，可以让更重要的事情得到照顾
    long: 山在泽上，损强调有选择地减少，帮助别人也要量力。减掉的是不再需要的负荷，不是自己的基本支持；先说明能让出多少、保留什么，再观察减少是否改善了整体。
    pinyin: sǔn
  en:
    term: Decrease
    short:
      The mountain above the lake directs attention to a reduction that changes the balance of an
      arrangement.
    long:
      'The mountain above the lake directs attention to a reduction that changes the balance of an
      arrangement. Giving something up is useful when the purpose and limit are clear. Identify what
      can be reduced without removing essential support. Then check whether the decrease helps the
      whole task, rather than treating self-denial as valuable regardless of its effect.'
    pinyin: sǔn
  aliases: []
- key: hexagram.42
  system: iching
  zh:
    term: 益
    short: 得到支持时，把增加的空间用在实际改进上
    long: 风在雷上，益强调增加的支持应转成实际改善，而不只停在数量。接受协助后完成一项原先缺少条件的任务，也及时说明帮助怎样被使用，让增益能持续。
    pinyin: yì
  en:
    term: Increase
    short: Wind above thunder presents an increase that can assist movement.
    long: 'Wind above thunder presents an increase that can assist movement. Added support matters
      through the improvement it enables, not only through the amount received. Use an offer to
      complete a task previously missing a condition, and explain how the assistance was used. This
      makes an increase accountable and helps others decide whether the support can continue.'
    pinyin: yì
  aliases: []
- key: hexagram.43
  system: iching
  zh:
    term: 夬
    short: 该说清的事可以坚定表达，也要避免情绪升级
    long: 泽在天上，夬强调把问题公开说清并作决定，同时避免以强硬制造升级。先陈述事实与需要改变的行为，再给出明确边界；果断可以有分寸，不必追求压倒对方。
    pinyin: guài
  en:
    term: Breakthrough
    short: The lake above heaven accompanies a decisive disclosure or separation.
    long: 'The lake above heaven accompanies a decisive disclosure or separation. Clarity should not
      become a reason to escalate force. State the facts and the behaviour that needs changing, then
      define the boundary you will maintain. A firm decision can remain proportionate and
      understandable without requiring the other person to be defeated or humiliated.'
    pinyin: guài
  aliases: []
- key: hexagram.44
  system: iching
  zh:
    term: 姤
    short: 突然的相遇可以观察，不必立即给予全部信任
    long: 风在天下，姤强调意外相遇的影响可能迅速进入，先辨别再接纳。兴趣不等于可信度，给新联结设一个有限范围，用真实互动决定是否增加投入。
    pinyin: gòu
  en:
    term: Coming to Meet
    short: Wind beneath heaven suggests an influence encountered unexpectedly.
    long:
      'Wind beneath heaven suggests an influence encountered unexpectedly. An interesting arrival is
      not yet a reliable connection. Establish a limited scope for the first exchange and notice how
      the other participant responds to a clear boundary. This lets an encounter provide information
      without giving it control over the wider arrangement before its effect is understood.'
    pinyin: gòu
  aliases: []
- key: hexagram.45
  system: iching
  zh:
    term: 萃
    short: 把人聚在一起，也要让目标与秩序聚在一起
    long: 泽在地上，萃强调聚集需要共同目标与秩序，人数不等于合作质量。说明为何相聚、如何参与与谁负责协调，也照顾尚未找到入口的人，让资源和回应一起汇合。
    pinyin: cuì
  en:
    term: Gathering Together
    short: The lake above earth gathers capacity into one place.
    long:
      'The lake above earth gathers capacity into one place. Bringing people together still requires
      a reason to meet and a usable way to participate. Explain the common task, the coordination
      role and the point of entry for newcomers. The value of a gathering lies in connecting
      available resources and responses, rather than in counting attendance alone.'
    pinyin: cuì
  aliases: []
- key: hexagram.46
  system: iching
  zh:
    term: 升
    short: 积累的小进展，可以形成可信的上升路径
    long: 木在地中，升强调逐步生长与借助适宜条件，不靠一次跳跃。把下一阶所需的练习和支持说清楚，完成后再增加范围，让进展有能够重复的基础。
    pinyin: shēng
  en:
    term: Pushing Upward
    short: Wood growing within earth presents gradual advancement through suitable conditions.
    long: 'Wood growing within earth presents gradual advancement through suitable conditions. This
      differs from forcing a single leap. Identify the practice and support needed for the next
      stage, then extend the scope after that stage becomes usable. Repeated preparation gives
      progress a footing and helps you distinguish a sustainable step from movement driven mainly by
      impatience.'
    pinyin: shēng
  aliases: []
- key: hexagram.47
  system: iching
  zh:
    term: 困
    short: 空间受限时，保留可信的做法与必要的求助
    long: 泽中无水，困强调可用空间受限而仍需保持可信做法。反复辩解未必能改善条件，可以先说清一项实际需要，寻找支援，并减少暂时无用的投入。
    pinyin: kùn
  en:
    term: Oppression
    short: The lake without accessible water presents capacity that is difficult to use.
    long:
      'The lake without accessible water presents capacity that is difficult to use. Constraint need
      not erase a reliable way of acting. Repeated explanation may have less value than naming one
      practical need and finding help with it. Reduce an effort that currently supplies no useful
      response, while preserving the resource or connection that can support a smaller next step.'
    pinyin: kùn
  aliases: []
- key: hexagram.48
  system: iching
  zh:
    term: 井
    short: 稳定的资源也需要维护与方便使用的入口
    long: 水在木上，井强调稳定来源需要取用工具与维护，资源存在不等于人能用到。先检查入口、传递与责任，修好一个漏损或交接环节，让共同支持真正可达。
    pinyin: jǐng
  en:
    term: The Well
    short: Water above wood gives the image of a well whose usefulness depends on access and maintenance.
    long: 'Water above wood gives the image of a well whose usefulness depends on access and
      maintenance. A resource can exist without reaching the person who needs it. Inspect the tool,
      the entry point and the responsibility for upkeep. Repair a leak or handover problem so that a
      stable source becomes usable rather than merely recognized as present.'
    pinyin: jǐng
  aliases: []
- key: hexagram.49
  system: iching
  zh:
    term: 革
    short: 改变旧安排时，让理由与准备先于声势
    long: 泽中有火，革强调旧安排与新需要不相容时准备变更，信任要由理由和行动建立。先核对改变的时机、参与者和后续承接，不把声势当成已经完成改革。
    pinyin: gé
  en:
    term: Revolution
    short: Fire within the lake frames a change in an arrangement whose parts no longer fit.
    long: 'Fire within the lake frames a change in an arrangement whose parts no longer fit. Trust
      develops through a clear reason and actions people can assess. Check the timing, the
      participants and the means of carrying the change forward. Announcing a transformation is
      different from establishing its replacement, so prepare the handover as carefully as the
      proposal.'
    pinyin: gé
  aliases: []
- key: hexagram.50
  system: iching
  zh:
    term: 鼎
    short: 把原料转成成果，需要可靠的结构与协作
    long: 火在木上，鼎强调把材料转成可供使用的成果，器具和承载同样关键。先修工具、分工与交接，再讨论扩大产出，让已有内容真正到达需要的人。
    pinyin: dǐng
  en:
    term: The Cauldron
    short: Fire above wood presents the transformation of ingredients through a vessel.
    long:
      'Fire above wood presents the transformation of ingredients through a vessel. Good material
      still needs a sound means of preparation and delivery. Check the tool, the division of work
      and the handover before increasing output. The reading asks how capacity becomes nourishment
      or a usable result, rather than treating possession of ingredients as equivalent to a
      completed contribution.'
    pinyin: dǐng
  aliases: []
- key: hexagram.51
  system: iching
  zh:
    term: 震
    short: 突然变化带来紧张时，先恢复基本秩序
    long: 两重雷，震强调突然惊动之后恢复秩序，不预报事故。先确认眼前事实与主要职责，再逐项应对；不必因紧张把所有安排同时推翻。
    pinyin: zhèn
  en:
    term: The Arousing
    short: Repeated thunder emphasizes the response to a sudden disturbance.
    long: 'Repeated thunder emphasizes the response to a sudden disturbance. It does not forecast an
      accident. Confirm what has actually changed and which responsibility remains central before
      reorganizing everything. A startled response can settle into clear action when you attend to
      the immediate situation, rather than allowing the possibility of further disturbance to
      determine every choice.'
    pinyin: zhèn
  aliases: []
- key: hexagram.52
  system: iching
  zh:
    term: 艮
    short: 在合适的位置停一停，能够重新看清方向
    long: 两重山，艮强调在合适的界限停住，止的是越界动作而非所有感受。可以暂停一轮无效回应，确认自己的责任范围，再决定何时恢复沟通与行动。
    pinyin: gěn
  en:
    term: Keeping Still
    short: Repeated mountain emphasizes stopping at an appropriate boundary.
    long: 'Repeated mountain emphasizes stopping at an appropriate boundary. Stillness concerns an
      action and its limit, rather than suppressing every feeling or withdrawing from life. Pause a
      round of unproductive response and identify what belongs within your responsibility. Then
      decide what condition would make renewed engagement useful, so that a stop remains purposeful
      instead of becoming an indefinite barrier.'
    pinyin: gěn
  aliases: []
- key: hexagram.53
  system: iching
  zh:
    term: 渐
    short: 按阶段推进，让关系与成果有时间扎根
    long: 木在山上，渐以逐步找到落点的意象强调发展需要阶段和扎根。不要跳过必要接洽，可以完成一个稳定环节，再让关系或任务自然进入下一步。
    pinyin: jiàn
  en:
    term: Development
    short: Wood above the mountain suggests development through progressively secure footing.
    long:
      'Wood above the mountain suggests development through progressively secure footing. Each stage
      needs a place to settle before the next can be sustained. Complete a necessary contact or
      agreement instead of skipping it to display progress. This gives a relationship or task time
      to become dependable without treating a slower pace as evidence that development has ceased.'
    pinyin: jiàn
  aliases: []
- key: hexagram.54
  system: iching
  zh:
    term: 归妹
    short: 位置或承诺不对等时，先讨论彼此能选择什么
    long: 雷在泽上，归妹强调位置与承诺可能不对等，不按古代身份安排现代人的角色。先讨论谁能决定什么、参与是否自愿，避免只靠仪式或热情掩盖实际条件。
    pinyin: guī mèi
  en:
    term: The Marrying Maiden
    short: Thunder above the lake raises a question about unequal position or incomplete terms of
      participation.
    long: 'Thunder above the lake raises a question about unequal position or incomplete terms of
      participation. Historical relationship roles need not be imposed on a modern person. Ask who
      may decide what and whether each participant has freely agreed. A ceremony or an enthusiastic
      exchange cannot replace clear conditions about the responsibilities and choices people
      actually have.'
    pinyin: guī mèi
  aliases: []
- key: hexagram.55
  system: iching
  zh:
    term: 丰
    short: 事情集中显现时，用清楚信息管理繁忙
    long: 雷电皆至，丰强调事情集中显现时保持明察，盛大也有阶段边界。把信息、分工与反馈渠道整理清楚，繁忙时也检查哪些遮挡妨碍了判断。
    pinyin: fēng
  en:
    term: Abundance
    short: Thunder and lightning together suggest an abundance of activity and visibility.
    long:
      'Thunder and lightning together suggest an abundance of activity and visibility. A full moment
      still has limits and can contain obscured information. Organize responsibilities and channels
      for feedback while the situation is busy. Check what the intensity of events has made harder
      to see, rather than assuming that greater activity automatically brings greater
      understanding.'
    pinyin: fēng
  aliases: []
- key: hexagram.56
  system: iching
  zh:
    term: 旅
    short: 身处陌生环境，先照顾落脚点与交往分寸
    long: 火在山上，旅强调暂居环境中先照顾落脚与分寸，不把自己当成拥有全部权限的人。核对归属、规则与支持渠道，再决定可承担的参与范围。
    pinyin: lǚ
  en:
    term: The Wanderer
    short: Fire above the mountain presents a temporary position in an unfamiliar setting.
    long: 'Fire above the mountain presents a temporary position in an unfamiliar setting. Secure a
      place to work or rest and understand the local terms before assuming broad authority. Clarify
      ownership, rules and sources of support. A traveller’s useful contribution can be limited and
      respectful, allowing participation without pretending that every part of the environment is
      already familiar.'
    pinyin: lǚ
  aliases: []
- key: hexagram.57
  system: iching
  zh:
    term: 巽
    short: 温和而连续的影响，比反复改口更有力量
    long: 两重风，巽强调温和持续地进入与影响，也警惕反复顺从而失去方向。先说明一个稳定意图，再以连续小动作推进，需要退让时保留关键边界。
    pinyin: xùn
  en:
    term: The Gentle
    short: Repeated wind suggests influence through gradual, continuing entry.
    long:
      'Repeated wind suggests influence through gradual, continuing entry. A gentle approach still
      needs a direction; repeated compliance without one can make the response difficult to
      understand. State a stable intention and express it through small actions over time. Where
      accommodation is needed, preserve the central boundary so that flexibility does not remove
      your practical means of participating.'
    pinyin: xùn
  aliases: []
- key: hexagram.58
  system: iching
  zh:
    term: 兑
    short: 交流带来轻松时，也要守住真诚与边界
    long: 两重泽，兑强调交流与愉悦建立在真诚回应上，不是让所有人满意。先听清彼此需要，再确认自己愿意提供什么，让轻松的气氛与真实边界相容。
    pinyin: duì
  en:
    term: The Joyous
    short: Repeated lake emphasizes pleasure in exchange that rests on sincerity.
    long:
      'Repeated lake emphasizes pleasure in exchange that rests on sincerity. Maintaining a pleasant
      atmosphere is different from satisfying every request. Listen to the need being expressed and
      clarify what you are willing to offer. An honest boundary can preserve the quality of a
      conversation better than agreement given only to avoid a moment of disappointment.'
    pinyin: duì
  aliases: []
- key: hexagram.59
  system: iching
  zh:
    term: 涣
    short: 联系松散时，先找到能重新连接的共同目标
    long: 风行水上，涣强调松散或隔阂需要重新联结共同目标，不是所有拆散都有益。先找可靠支点，打开一条回应渠道，再让资源围绕具体需要流动。
    pinyin: huàn
  en:
    term: Dispersion
    short: Wind over water suggests dispersion that calls for a point of reconnection.
    long: 'Wind over water suggests dispersion that calls for a point of reconnection. Breaking an
      arrangement apart is useful only when the purpose is clear. Find a reliable foothold and
      reopen one channel of response, then gather resources around a specific shared need. This
      helps release an unproductive division without creating another form of scattered effort.'
    pinyin: huàn
  aliases: []
- key: hexagram.60
  system: iching
  zh:
    term: 节
    short: 适量的限制，能让资源与关系更可持续
    long: 水在泽上，节强调容量有限时设立可接受的规则，过苦的限制难以长久。先分清基本需要与可调整投入，规则既要保护资源，也要让人能够持续参与。
    pinyin: jié
  en:
    term: Limitation
    short: Water above the lake gives an image of capacity with a boundary.
    long:
      'Water above the lake gives an image of capacity with a boundary. A limit should protect use
      without making participation needlessly harsh. Distinguish basic needs from commitments that
      can be adjusted, and explain why the rule exists. If the restriction consumes more effort than
      it saves, revise it rather than treating endurance of discomfort as proof that the rule is
      sound.'
    pinyin: jié
  aliases: []
- key: hexagram.61
  system: iching
  zh:
    term: 中孚
    short: 信任靠内外一致，不靠反复强调自己的诚意
    long: 风在泽上，中孚强调内外一致与可信回应，不靠反复声称诚意。让承诺对应一次具体兑现，也观察对方是否愿意回应；信任不要求忽略现实证据。
    pinyin: zhōng fú
  en:
    term: Inner Truth
    short: Wind above the lake emphasizes an influence grounded in inner consistency.
    long:
      'Wind above the lake emphasizes an influence grounded in inner consistency. Trust grows when a
      stated intention is matched by action. Connect a promise with one concrete delivery and notice
      whether the other participant responds willingly. Sincerity does not require setting aside
      evidence; a reliable exchange can remain open to information that changes the original
      expectation.'
    pinyin: zhōng fú
  aliases: []
- key: hexagram.62
  system: iching
  zh:
    term: 小过
    short: 细处多做一点，大事暂时不要越过条件
    long: 雷在山上，小过强调小处适度多做，大事不越过条件，像飞鸟宜下不宜上。核对细节与边界，完成一项低处可达的事情，不把谨慎变成无限检查。
    pinyin: xiǎo guò
  en:
    term: Preponderance of the Small
    short: Thunder above the mountain frames a limited excess in small matters while larger movement
      remains constrained.
    long: 'Thunder above the mountain frames a limited excess in small matters while larger movement
      remains constrained. The bird image directs attention toward a reachable position rather than
      a high leap. Check a detail that affects the present task and complete what is accessible.
      Care should remain proportionate, so that extra attention does not turn into an endless series
      of checks.'
    pinyin: xiǎo guò
  aliases: []
- key: hexagram.63
  system: iching
  zh:
    term: 既济
    short: 阶段完成后，继续维护使成果成立的条件
    long: 水在火上，既济强调阶段已经相接而秩序仍需维护，完成不等于可以放任。留出修补材料、明确交接与后续检查，避免惯性继续加码破坏已有平衡。
    pinyin: jì jì
  en:
    term: After Completion
    short: Water above fire presents parts brought into a workable relationship.
    long: 'Water above fire presents parts brought into a workable relationship. Completion still
      requires maintenance, because a settled arrangement can become less usable through neglect or
      continued pushing. Prepare the repair materials and a clear handover. Check what should now be
      kept steady instead of assuming that more movement is always an improvement on what has
      already been accomplished.'
    pinyin: jì jì
  aliases: []
- key: hexagram.64
  system: iching
  zh:
    term: 未济
    short: 尚未完成时，重新确认次序与跨越条件
    long: 火在水上，未济强调各部分尚未就位，跨越前需要重排次序。小狐将渡未渡的意象提醒你检查最后一步的承载，先把收尾条件落实，再庆祝进展。
    pinyin: wèi jì
  en:
    term: Before Completion
    short: Fire above water presents parts not yet brought into a settled relationship.
    long: 'Fire above water presents parts not yet brought into a settled relationship. The crossing
      needs preparation through its final step, rather than confidence based only on how far you
      have come. Check the remaining sequence and the means of support at the endpoint. Celebrate
      progress while recognizing which condition still has to be fulfilled for the passage to become
      complete.'
    pinyin: wèi jì
  aliases: []
