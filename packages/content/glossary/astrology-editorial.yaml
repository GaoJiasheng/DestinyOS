- key: astrology.keyword.self_awareness
  system: astrology
  zh:
    term: 自我觉察
    short: 观察选择与感受，再用实际经验修正理解
    long: 自我觉察指观察自己的选择、感受与习惯，再用实际经验修正理解。本命盘可以提供反思问题，但具体行为仍需结合生活情境，不把星盘主题当成固定身份。
    pinyin: zì wǒ jué chá
  en:
    term: Self-awareness
    short: Observe choices and feelings, then revise through experience.
    long: Self-awareness means observing choices, feelings, and habits, then
      revising an interpretation through experience. A natal chart can suggest
      reflective questions, while actual behavior remains grounded in life
      circumstances rather than a fixed chart identity.
    pinyin: zì wǒ jué chá
  aliases: []
- key: astrology.keyword.curiosity
  system: astrology
  zh:
    term: 好奇探索
    short: 通过问题与练习了解不同视角
    long: 好奇探索指通过提问、比较与练习了解不同视角。可以把星盘主题转成一个可观察的问题，用具体经历检验理解，并允许新信息改变原先的看法。
    pinyin: hào qí tàn suǒ
  en:
    term: Curiosity
    short: Explore another perspective through questions and practice.
    long: Curiosity means exploring different perspectives through questions,
      comparison, and practice. Turn a chart theme into an observable question,
      examine it through concrete experience, and allow new information to
      change an earlier view.
    pinyin: hào qí tàn suǒ
  aliases: []
- key: astrology.keyword.cooperation
  system: astrology
  zh:
    term: 共同协商
    short: 说清彼此需要，寻找可调整的安排
    long: 共同协商指表达彼此的需要，并寻找双方可以调整的安排。星盘主题可帮助提出问题，但实际分工、沟通与承诺需要由参与者共同确认。
    pinyin: gòng tóng xié shāng
  en:
    term: Cooperation
    short: Clarify needs and find an arrangement both people can revise.
    long: Cooperation means clarifying each person’s needs and finding an
      arrangement both can revise. Chart themes may help frame questions, while
      roles, communication, and commitments are agreed by the people involved.
    pinyin: gòng tóng xié shāng
  aliases: []
