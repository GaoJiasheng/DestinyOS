# T-23: glossary follows appendix keys; pinyin describes the Chinese display term.
- key: qimen.flag.kong_wang
  system: qimen
  zh:
    term: 空亡
    pinyin: kōng wáng
    short: 该旬未配入的地支所对应宫位
    long: 空亡指该旬未配入的地支所对应宫位，是九宫盘中的条件标记。它修饰相关用神的文化解读，需要同时看门、星、宫位关系和实际问题，不表示某个具体事件会发生。
  en:
    term: Void
    pinyin: kōng wáng
    short: A palace associated with branches absent from the current ten-pair group
    long:
      Void identifies a palace associated with branches absent from the current ten-pair group. It modifies
      an indicator in the nine-palace model and is read with gates, stars, palace relationships, and the actual
      question. It does not establish a particular event.
  aliases: []
