# T-23: glossary follows appendix keys; pinyin describes the Chinese display term.
- key: wands_01
  system: tarot
  zh:
    term: 权杖一
    pinyin: quán zhàng yī
    short: 把热情转成第一步尝试
    long: 新芽的权杖强调灵感刚出现，还需要实践来检验。它不同于魔术师已经能调动工具。若逆位动力弱，可以缩小尝试；若计划太多，可以只保留一个点子，确认下一步需要的材料与时间。
  en:
    term: Ace of Wands
    pinyin: quán zhàng yī
    short: give a fresh impulse a practical first step
    long:
      The sprouting wand suggests a new impulse before there is a finished plan. It differs from the
      Magician’s coordination of skills already available. Inspiration becomes usable through a
      first attempt. If energy is low, reduce the scale; if ideas are competing, choose one and
      identify the materials and time needed to see how it behaves in practice.
  aliases: []
- key: wands_02
  system: tarot
  zh:
    term: 权杖二
    pinyin: quán zhàng èr
    short: 在行动前比较视野与资源
    long: 手中的地球与远眺姿态强调比较方向，冲突不是这张牌的唯一重点。权杖二尚在规划，权杖三则已经开始等待外部反馈。若逆位犹豫，可以比较两个方案的准备条件，选一项可逆的小尝试。
  en:
    term: Two of Wands
    pinyin: quán zhàng èr
    short: look beyond your current routine and compare possibilities
    long:
      The globe and distant view make planning and possible directions central. Conflict is not the
      card’s only or defining subject. Unlike the Three of Wands, this scene precedes a wider
      commitment. Compare two options using their preparation requirements and available reach. If
      the comparison keeps expanding, choose a reversible experiment that provides information the
      planning stage cannot supply.
  aliases: []
- key: wands_03
  system: tarot
  zh:
    term: 权杖三
    pinyin: quán zhàng sān
    short: 准备接住已启动行动的反馈
    long: 望向船只的身影表示行动已经送出，重点在外部联系和后续承接。与权杖二的方案比较不同，这里需要追踪反馈。若逆位回应迟缓，可以核对交接与期待的时程，不把等待直接理解为失败。
  en:
    term: Three of Wands
    pinyin: quán zhàng sān
    short: prepare for responses to work already set in motion
    long:
      The figure looking toward the ships suggests that an initiative has already moved beyond the
      planning stage. Attention turns to outside responses and what can be received next. Unlike the
      Two of Wands’ comparison of possibilities, this card asks how you follow through. If replies
      are slow, check the handover and expected timetable before deciding the effort has failed.
  aliases: []
- key: wands_04
  system: tarot
  zh:
    term: 权杖四
    pinyin: quán zhàng sì
    short: 认可共同完成的小里程碑
    long: 花环与共同庆祝强调阶段落点和可共享的支持，不是关系身份的预告。权杖四与世界的完整收尾不同，它允许在途中认可成果。若逆位气氛与真实需要不合，可以问谁尚未被照顾，调整共同活动的安排。
  en:
    term: Four of Wands
    pinyin: quán zhàng sì
    short: make space for a shared milestone
    long:
      The garland and celebration emphasize a shared milestone and a place to gather. This is not a
      prediction about relationship status. Unlike the World’s completed cycle, a milestone can be
      acknowledged while further work remains. Ask what made the occasion possible and who needs
      inclusion. If the celebration feels strained, adjust the arrangement instead of requiring
      everyone to display the same mood.
  aliases: []
- key: wands_05
  system: tarot
  zh:
    term: 权杖五
    pinyin: quán zhàng wǔ
    short: 把分歧转成可讨论的规则
    long: 多人举杖而未协调方向，强调意见竞争、练习与摩擦，不能直接认定敌意。与宝剑五的争赢代价不同，这里可以把冲突转成共同规则。若逆位回避分歧，可以先邀请每个人说一个具体要求。
  en:
    term: Five of Wands
    pinyin: quán zhàng wǔ
    short: use disagreement to discover what needs coordination
    long: The raised wands point in competing directions, making friction and uncoordinated effort
      visible. Disagreement may concern practice or methods rather than hostility. Unlike the Five
      of Swords’ cost of winning, the useful question is how a contest becomes constructive. Agree
      on what is being tested. If opinions have been suppressed, invite one specific requirement
      from each participant before deciding.
  aliases: []
- key: wands_06
  system: tarot
  zh:
    term: 权杖六
    pinyin: quán zhàng liù
    short: 承认努力并分享认可
    long: 骑者的花环与周围人群强调公开认可，以及成果与参与者的联系。它不是永远获胜的许诺。若逆位很在意评价，可以用实际完成的内容检验反馈，也把协作者的贡献说出来，不让认可变成孤立的表现压力。
  en:
    term: Six of Wands
    pinyin: quán zhàng liù
    short: receive recognition and acknowledge the effort behind it
    long: The rider’s wreath and surrounding people connect achievement with public acknowledgment.
      Recognition is a response to visible work, not a promise of continued success. Identify what
      was actually completed and who contributed to it. If approval has become the only measure that
      matters, compare the feedback with the result and decide which standard you want to carry into
      the next task.
  aliases: []
- key: wands_07
  system: tarot
  zh:
    term: 权杖七
    pinyin: quán zhàng qī
    short: 为重要立场设定清晰边界
    long: 高处的人面对下方的杖，强调保卫已有立场，需要选择值得回应的挑战。它不同于权杖五的多人试探。若逆位防守疲惫，可以减少必须争辩的事项，保留一条重要边界，并说明自己愿意协商的范围。
  en:
    term: Seven of Wands
    pinyin: quán zhàng qī
    short: stand behind a priority you have chosen
    long: The figure holds higher ground while meeting pressure from below. The theme is defending a
      position already taken, rather than joining every contest. Unlike the Five of Wands, not every
      disagreement here deserves equal attention. Choose the boundary that matters most. If constant
      defence is exhausting, reduce the number of arguments you enter and state what remains open to
      negotiation.
  aliases: []
- key: wands_08
  system: tarot
  zh:
    term: 权杖八
    pinyin: quán zhàng bā
    short: 为迅速到来的消息安排顺序
    long: 飞行中的八根杖强调进度、消息与衔接速度，没有人物不等于不用协调。与战车的掌舵不同，这里更像已经发出的行动集中到达。若逆位有延迟，可以核对接收、排序与确认，避免再用更多消息增加混乱。
  en:
    term: Eight of Wands
    pinyin: quán zhàng bā
    short: organise a burst of movement or information
    long:
      The moving wands emphasize pace, messages and transitions already underway. The absence of a
      visible person does not remove the need for coordination. Unlike the Chariot’s steering, this
      card asks how you handle several developments arriving close together. Confirm what has been
      received and what needs a reply. If movement stalls, inspect the sequence before adding
      another urgent message.
  aliases: []
- key: wands_09
  system: tarot
  zh:
    term: 权杖九
    pinyin: quán zhàng jiǔ
    short: 承认疲惫同时保护已有成果
    long: 受伤但仍守在杖前的人，强调经过消耗后的警觉与坚持，不要求持续硬撑。它与权杖七即时防守不同，带着已有经验。若逆位过度戒备，可以区分真正需要检查的条件与旧经历留下的预期，并安排明确的休息。
  en:
    term: Nine of Wands
    pinyin: quán zhàng jiǔ
    short: protect what you have built while recognising fatigue
    long:
      The guarded figure brings experience and fatigue to the boundary. Persistence has a history
      here, unlike the Seven of Wands’ more immediate defence. Past difficulty can inform
      preparation without making every new request a threat. Identify the condition that actually
      needs checking. If vigilance has become constant, schedule a handover or rest interval rather
      than asking yourself to remain alert indefinitely.
  aliases: []
- key: wands_10
  system: tarot
  zh:
    term: 权杖十
    pinyin: quán zhàng shí
    short: 重新分配已经过重的负担
    long: 一人抱着十根杖遮住视线，强调累积责任已经影响行动。它不是忙碌就更有价值的证明。若逆位想卸下负担，可以说清交接给谁、何时完成；若仍习惯独揽，先删掉一项非必要要求。
  en:
    term: Ten of Wands
    pinyin: quán zhàng shí
    short: redistribute a load that has become difficult to carry
    long: The bundle obstructs the carrier’s view, showing how accumulated responsibility can impair
      movement. The issue is load, not a test of personal worth. Compared with the Nine of Wands’
      guarded persistence, this card calls for redistribution. Identify a task that can be delegated
      or ended. Releasing it requires a named handover, rather than silently dropping work someone
      else depends on.
  aliases: []
- key: wands_page
  system: tarot
  zh:
    term: 权杖侍从
    pinyin: quán zhàng shì cóng
    short: 让好奇心获得学习的入口
    long: 侍从端详权杖，强调好奇与初学者的尝试，不限定年龄或性别。它与骑士立即推进不同，仍有学习空间。若逆位点子分散，可以挑一个问题动手试验，完成后记录什么让你还想继续。
  en:
    term: Page of Wands
    pinyin: quán zhàng shì cóng
    short: approach a new interest with a learner's curiosity
    long:
      The Page studies the wand as an object of curiosity. This is a role of exploration, not an age
      or gender assignment. Unlike the Knight’s active pursuit, the Page can remain open while
      learning what an idea requires. If enthusiasm spreads across too many beginnings, choose one
      question to test and record what makes you want to return to it.
  aliases: []
- key: wands_knight
  system: tarot
  zh:
    term: 权杖骑士
    pinyin: quán zhàng qí shì
    short: 用活力推进可控制的尝试
    long: 跃动的坐骑强调热情已经进入行动，也需要照顾持续性。骑士不是某位特定人物的预测。若逆位出现急起急停，可以把出发、推进与交接分成三步，确认自己愿意完成哪一段，而非只承诺最兴奋的开头。
  en:
    term: Knight of Wands
    pinyin: quán zhàng qí shì
    short: bring energy to a bounded experiment
    long:
      The moving horse puts enthusiasm into motion. This can describe a style of action rather than
      a particular person arriving in your life. Compared with the Page’s exploration, the Knight
      has begun the pursuit. Check what sustains effort after the exciting start. If pace keeps
      swinging, separate departure, progress and handover, and commit only to the stage you can
      carry.
  aliases: []
- key: wands_queen
  system: tarot
  zh:
    term: 权杖王后
    pinyin: quán zhàng wáng hòu
    short: 以温暖自信鼓励表达
    long: 向日葵与黑猫让明朗表达和自主空间并存，强调温暖的吸引力。王后不是女性专属角色。若逆位总要维持热闹，可以说明自己也需要安静；鼓励别人参与时，让他们按自己的方式回应，不必复制你的热情。
  en:
    term: Queen of Wands
    pinyin: quán zhàng wáng hòu
    short: encourage expression through warmth and confidence
    long:
      The sunflower and black cat bring visible warmth together with independence. This role is not
      reserved for a particular gender. The Queen encourages participation through confidence rather
      than directing every response. If you feel obliged to maintain the group’s energy, make room
      for your own quieter needs. Inviting someone to contribute works best when they can bring a
      different style.
  aliases: []
- key: wands_king
  system: tarot
  zh:
    term: 权杖国王
    pinyin: quán zhàng guó wáng
    short: 把远见落实为可共享的方向
    long: 国王握杖而看向远方，强调远见如何变成可共享的方向。与骑士的个人冲劲相比，这里需要协调他人的行动。若逆位强烈意愿压过反馈，可以先说清目标，再问执行者需要哪些条件，让带头包含听取异议。
  en:
    term: King of Wands
    pinyin: quán zhàng guó wáng
    short: give a shared project a clear direction
    long:
      The King’s held wand and outward attention connect vision with the ability to guide sustained
      effort. Unlike the Knight’s personal momentum, this role involves other people’s
      participation. State the destination and ask what resources the work needs. If conviction has
      begun to overpower feedback, invite a specific objection before settling the method;
      leadership includes listening to the people carrying it out.
  aliases: []
- key: cups_01
  system: tarot
  zh:
    term: 圣杯一
    pinyin: shèng bēi yī
    short: 给新的感受一个温和入口
    long: 溢出的杯与流动的水强调感受或连接开始有了出口，不预告新关系。它与圣杯二已经出现互相回应不同。若逆位想收回情绪，可以尊重当前边界，先用一句话表达真实需要，不要求自己立刻分享全部感受。
  en:
    term: Ace of Cups
    pinyin: shèng bēi yī
    short: welcome a fresh feeling without demanding an immediate label
    long:
      The overflowing cup suggests an opening for feeling, care or creativity. It does not establish
      that a new relationship will begin. Unlike the Two of Cups, a reciprocal exchange has not yet
      been shown. Give an emerging feeling room without demanding a response from someone else. If
      expression feels difficult, share one manageable need rather than the entire emotional story.
  aliases: []
- key: cups_02
  system: tarot
  zh:
    term: 圣杯二
    pinyin: shèng bēi èr
    short: 通过相互回应建立连接
    long: 两人相向举杯，强调相互认可与平等交换，不等于对方已经承诺。与恋人的价值选择不同，这里先看互动能否双向。若逆位步调不一，可以直接询问联络、付出与界限，不靠猜测对方的态度补齐空白。
  en:
    term: Two of Cups
    pinyin: shèng bēi èr
    short: build connection through mutual attention
    long:
      The facing figures make reciprocity central. Each person brings a cup; connection depends on
      both responses rather than one person’s intention. Unlike the Lovers’ wider question of values
      and choice, this scene focuses on an exchange. If pace or effort differs, ask about contact
      and boundaries directly. The card cannot establish another person’s commitment without their
      actual participation.
  aliases: []
- key: cups_03
  system: tarot
  zh:
    term: 圣杯三
    pinyin: shèng bēi sān
    short: 在支持网络中分享喜悦
    long: 三人举杯强调友谊、共同庆祝和支持网络，不应被直接读成第三者。它与圣杯十较长期的共同归属不同，重点是当下相聚。若逆位社交过载，可以少参加一场活动，或把不舒服的圈内互动说清楚。
  en:
    term: Three of Cups
    pinyin: shèng bēi sān
    short: enjoy encouragement within a supportive group
    long:
      The three raised cups emphasize friendship, celebration and a network of support. The number
      of figures is not evidence of an affair or hidden rival. Unlike the Ten of Cups’ sustained
      sense of belonging, this scene centres on gathering. If social involvement has become
      draining, choose a smaller meeting or name the interaction that needs a clearer boundary.
  aliases: []
- key: cups_04
  system: tarot
  zh:
    term: 圣杯四
    pinyin: shèng bēi sì
    short: 区分需要休息与错过机会
    long: 坐着的人看向地面，未接到旁边递来的杯，强调休整、厌倦与未被注意的选项。它不证明你不知感恩。若逆位开始重新接触外界，可以只回应一个合适邀请，也先确认自己需要的是新刺激还是安静。
  en:
    term: Four of Cups
    pinyin: shèng bēi sì
    short: pause long enough to understand your lack of interest
    long:
      The seated figure has not taken the offered cup. The scene leaves room for rest, disinterest
      and an opportunity that has not been noticed; it does not establish ingratitude. Unlike the
      Five of Cups, the emphasis is not a named loss. If you are ready to re-engage, respond to one
      suitable invitation and check whether you want novelty or recovery.
  aliases: []
- key: cups_05
  system: tarot
  zh:
    term: 圣杯五
    pinyin: shèng bēi wǔ
    short: 承认遗憾并看见仍在的支持
    long: 三杯倾倒而两杯仍立，强调遗憾真实存在，同时还有可用支持。它与宝剑三较直接的刺痛不同，更关注注意力停在哪里。若逆位逐渐转身，可以先接纳一项现有帮助，不要求自己因为还有支持就立即不难过。
  en:
    term: Five of Cups
    pinyin: shèng bēi wǔ
    short: acknowledge disappointment without losing sight of remaining support
    long:
      The fallen cups make disappointment visible, while the standing pair remains available behind
      the figure. Existing support does not cancel a real loss. Compared with the Three of Swords’
      sharper hurt, this card asks where attention rests afterwards. If you are beginning to turn
      toward what remains, accept one offer of help without requiring yourself to stop feeling sad
      first.
  aliases: []
- key: cups_06
  system: tarot
  zh:
    term: 圣杯六
    pinyin: shèng bēi liù
    short: 从熟悉经验中取回温暖
    long: 孩子递出盛花的杯，强调熟悉感、记忆和简单善意，不预告旧人回归。它与圣杯三的社群不同，带着过去经验。若逆位旧印象盖过现在，可以比较当下实际行为，再决定保留哪些温暖、更新哪些期待。
  en:
    term: Six of Cups
    pinyin: shèng bēi liù
    short: draw comfort from a familiar and generous memory
    long: The flower-filled cups connect kindness with familiarity and memory. They do not forecast
      someone from the past returning. Unlike the Three of Cups’ current gathering, this card asks
      how earlier experiences shape an exchange. Keep what is comforting, while comparing remembered
      impressions with present behaviour. A meaningful memory can inform your response without
      deciding what another person is like now.
  aliases: []
- key: cups_07
  system: tarot
  zh:
    term: 圣杯七
    pinyin: shèng bēi qī
    short: 把想象中的选项逐一核实
    long: 云中的多只杯装着不同诱人形象，强调想象很丰富而信息未落实。它不同于权杖二较具体的方向比较。若逆位偏好开始清楚，可以筛去一个缺少条件的选项，把最想尝试的方案接到实际步骤。
  en:
    term: Seven of Cups
    pinyin: shèng bēi qī
    short: sort attractive possibilities by what can actually be tried
    long: The varied images in the cups make possibility and projection visible at the same time. An
      appealing picture is not yet a workable option. Unlike the Two of Wands’ more grounded
      planning, this scene asks which imagined choice has supporting information. Compare one
      attractive possibility with its actual requirements, and remove an option that depends
      entirely on assumptions you cannot check.
  aliases: []
- key: cups_08
  system: tarot
  zh:
    term: 圣杯八
    pinyin: shèng bēi bā
    short: 承认旧安排已不再满足需要
    long: 背向杯子走向山路，强调原有安排已经不能回应需要，离开不等于否定过去。它与死神的阶段更替不同，重在主动寻找意义。若逆位来回犹豫，可以说清未被满足的一项需要，再比较调整与退出的实际条件。
  en:
    term: Eight of Cups
    pinyin: shèng bēi bā
    short: move away from a pattern that no longer meets your needs
    long:
      The departing figure leaves an arrangement that once held value. Moving on does not require
      declaring the whole past worthless. Unlike a broader transition, this card emphasizes a
      deliberate search for something the current situation no longer supplies. If leaving and
      returning keep alternating, name the unmet need and compare what would change through
      adjustment or through departure.
  aliases: []
- key: cups_09
  system: tarot
  zh:
    term: 圣杯九
    pinyin: shèng bēi jiǔ
    short: 感受满足并承认自己的努力
    long: 人物坐在整齐的杯前，强调个人满足和愿望得到回应，但不许诺所求都会实现。它与圣杯十的共享归属不同。若逆位外在成果不能让你舒服，可以区分真正喜欢的体验与为了显得成功而保留的东西。
  en:
    term: Nine of Cups
    pinyin: shèng bēi jiǔ
    short: enjoy a satisfaction you have helped create
    long:
      The arranged cups frame satisfaction as a personal experience. An encouraging image does not
      establish that every wish will be fulfilled. Unlike the Ten of Cups’ shared belonging, this
      scene asks what feels sufficient to you. If visible accomplishments still leave an unmet need,
      distinguish enjoyment you actually experience from possessions or appearances maintained
      mainly for other people’s approval.
  aliases: []
- key: cups_10
  system: tarot
  zh:
    term: 圣杯十
    pinyin: shèng bēi shí
    short: 培育可分享的情感安全感
    long: 彩虹下的人群强调可以分享的归属与情感支持，并不规定家庭结构。它与圣杯九的个人满足不同，需要参与者共同维护。若逆位理想画面与日常不合，可以询问每个人实际需要的陪伴与空间，允许快乐有不同形式。
  en:
    term: Ten of Cups
    pinyin: shèng bēi shí
    short: nurture a sense of belonging people can share
    long: The figures beneath the rainbow emphasize belonging that can be shared. The image does not
      prescribe a family structure or a relationship status. Unlike the Nine of Cups’ personal
      satisfaction, this scene depends on mutual participation. If the ideal picture does not match
      daily life, ask how each person experiences support and space instead of requiring one
      appearance of happiness.
  aliases: []
- key: cups_page
  system: tarot
  zh:
    term: 圣杯侍从
    pinyin: shèng bēi shì cóng
    short: 用轻柔方式表达新感受
    long: 杯中出现的鱼带来意外灵感，强调感受刚进入表达，尚不成熟也可以被认真听见。侍从不限定年龄。若逆位想象扩大，可以先把观察与希望分别写下，用一次温和询问检查，而不是把敏感当作证据。
  en:
    term: Page of Cups
    pinyin: shèng bēi shì cóng
    short: express a new feeling in a gentle and exploratory way
    long:
      The unexpected fish makes a new emotional or creative response visible. A first expression can
      be sincere without being fully formed. The Page describes a learning role rather than
      someone’s age. If imagination begins supplying more than the facts support, write down the
      observation separately from the hope it prompted, then use a gentle question to clarify the
      difference.
  aliases: []
- key: cups_knight
  system: tarot
  zh:
    term: 圣杯骑士
    pinyin: shèng bēi qí shì
    short: 让善意邀请带着具体安排
    long: 骑者举杯前行，强调把感受带成邀请，需要具体安排承接。与权杖骑士的行动热情不同，重点是表达的心意。若逆位话语动人却迟迟无后续，可以问清时间、可用精力与愿意承担的部分。
  en:
    term: Knight of Cups
    pinyin: shèng bēi qí shì
    short: offer warmth with a clear and considerate invitation
    long:
      The offered cup turns feeling into an invitation. Compared with the Knight of Wands’ pursuit
      of action, this role asks how an emotional intention reaches another person. A warm message
      needs room for a voluntary response and a practical arrangement. If appealing words are not
      followed through, clarify the date, available effort and scope before relying on the
      invitation.
  aliases: []
- key: cups_queen
  system: tarot
  zh:
    term: 圣杯王后
    pinyin: shèng bēi wáng hòu
    short: 听见情绪同时保留个人边界
    long: 王后专注看杯，强调细致容纳情绪，也需要区分自己的感受与他人的感受。这个角色不限定性别。若逆位共情变成全部承担，可以先问对方想要倾听还是协助，说明自己能够提供的范围。
  en:
    term: Queen of Cups
    pinyin: shèng bēi wáng hòu
    short: listen with care while keeping room for your own feelings
    long:
      The Queen’s attention to the cup suggests careful listening to emotional experience. This role
      can be practised by anyone. Understanding another person’s feeling does not make you
      responsible for managing all of it. If care has become absorbing, ask whether they want
      listening or practical assistance, and state the amount of support you are actually able to
      offer.
  aliases: []
- key: cups_king
  system: tarot
  zh:
    term: 圣杯国王
    pinyin: shèng bēi guó wáng
    short: 让稳定回应容纳复杂情绪
    long: 国王稳坐在起伏水面，强调能容纳复杂情绪而仍清楚回应，不等于必须隐藏感受。与圣杯王后的倾听不同，这里还包含协调。若逆位压抑或情绪左右表达，可以先给感受命名，再安排一次合适的讨论。
  en:
    term: King of Cups
    pinyin: shèng bēi guó wáng
    short: respond steadily without dismissing complicated feelings
    long: The King remains seated while the water moves around him. Emotional steadiness means
      responding with awareness, not concealing every feeling. Compared with the Queen’s receptive
      attention, this role also involves coordinating an exchange. If suppressed emotion or a
      changing mood is shaping the discussion, name the feeling and choose a time when you can
      address the actual issue clearly.
  aliases: []
- key: swords_01
  system: tarot
  zh:
    term: 宝剑一
    pinyin: bǎo jiàn yī
    short: 用清楚的问题打开思路
    long: 直立的剑穿过冠环，强调思路获得切口，也要注意清晰与尖锐的区别。它与宝剑国王成熟的判断不同，仍是一个起点。若逆位信息含糊，可以先把问题改写成一句可回答的话，再补齐判断所需的事实。
  en:
    term: Ace of Swords
    pinyin: bǎo jiàn yī
    short: cut through confusion with a precise question
    long: The upright sword gives an idea a clear edge. Clarity can open a problem, but a sharp
      statement is not automatically a sound conclusion. Unlike the King of Swords’ established
      judgment, this is a starting point. If the idea remains confused, formulate one answerable
      question and identify the information that would let you decide whether the distinction is
      useful.
  aliases: []
- key: swords_02
  system: tarot
  zh:
    term: 宝剑二
    pinyin: bǎo jiàn èr
    short: 给犹豫中的两端同等注意
    long: 蒙眼与交叉的剑强调暂时维持平衡，同时有信息尚未进入判断。它不同于圣杯七被选项吸引。若逆位僵局松动或信息过多，可以分别列出两种选择需要承担的代价，允许自己在补齐关键事实后决定。
  en:
    term: Two of Swords
    pinyin: bǎo jiàn èr
    short: give two competing needs an honest hearing
    long: The blindfold and crossed swords show a balance maintained while some information stays
      outside the decision. This differs from the Seven of Cups’ attraction to many imagined
      options. Ask which fact you have avoided or cannot yet obtain. If the stalemate is loosening,
      compare the consequences of the two choices rather than waiting for an option with no cost at
      all.
  aliases: []
- key: swords_03
  system: tarot
  zh:
    term: 宝剑三
    pinyin: bǎo jiàn sān
    short: 承认受伤的感受并说清需要
    long: 剑穿过心形与雨云直接表达受伤、分离感或难听的消息，不证明背叛。它与圣杯五回看遗憾不同，重点是承认刺痛。若逆位开始缓和，可以只说一件最需要被理解的事，并选择能接住这种表达的人。
  en:
    term: Three of Swords
    pinyin: bǎo jiàn sān
    short: acknowledge hurt and make your needs understandable
    long:
      The pierced heart and rain make hurt explicit. The image can reflect a painful conversation or
      separation without establishing betrayal. Unlike the Five of Cups’ attention to what remains
      after disappointment, this scene asks you to acknowledge the wound itself. If expression is
      becoming possible, share one need with someone able to listen, without forcing a complete
      explanation at once.
  aliases: []
- key: swords_04
  system: tarot
  zh:
    term: 宝剑四
    pinyin: bǎo jiàn sì
    short: 用有边界的停顿恢复注意力
    long: 卧姿与静止的剑强调暂停回应、整理经历和恢复注意力，不作身体诊断。它与倒吊人换视角不同，更重在休整。若逆位无法停下或停太久，可以设定休息的起止与回到事项的条件，让暂停成为可持续安排。
  en:
    term: Four of Swords
    pinyin: bǎo jiàn sì
    short: take a defined interval away from demands
    long: The resting posture and still swords emphasize a pause in active response. This is a
      reflection on recovery and attention, not a diagnosis. Unlike the Hanged Man’s deliberate
      change of perspective, the Four of Swords asks what rest makes possible. If stopping feels
      difficult or the pause has lost its boundary, agree when you will review the task again.
  aliases: []
- key: swords_05
  system: tarot
  zh:
    term: 宝剑五
    pinyin: bǎo jiàn wǔ
    short: 评估争赢之后的关系成本
    long: 持剑者与远去的人让“赢了什么、失去了什么”同时可见，不能据此判定谁自私。与权杖五的竞争练习不同，这里关注争执代价。若逆位准备停止对抗，可以说明一个不再重复的行为，并安排如何恢复沟通。
  en:
    term: Five of Swords
    pinyin: bǎo jiàn wǔ
    short: consider the cost of winning an unhelpful argument
    long: The held swords and departing figures place winning beside the cost of an encounter. The
      picture does not establish anyone’s character. Unlike the Five of Wands’ contest over methods,
      this card asks whether continuing the argument serves the relationship or task. If you want to
      end the confrontation, name one behaviour you will stop and one condition for reopening
      discussion.
  aliases: []
- key: swords_06
  system: tarot
  zh:
    term: 宝剑六
    pinyin: bǎo jiàn liù
    short: 通过过渡安排走向较平稳的状态
    long: 渡船载着人与剑，强调过渡能减轻扰动，但旧问题仍可能同行。它不预告旅行。与圣杯八主动寻找意义不同，这里更重在获得较平稳的安排。若逆位迁移难推进，可以确认支援与交接，而非只换环境。
  en:
    term: Six of Swords
    pinyin: bǎo jiàn liù
    short: use a transition to create a more workable setting
    long: The boat carries both people and swords into a quieter setting. A transition may reduce
      disturbance while some unresolved concerns travel with it. This does not predict a journey.
      Unlike the Eight of Cups’ search for meaning, the emphasis is on a workable passage. If change
      stalls, clarify the support and handover needed rather than assuming a new setting will solve
      everything.
  aliases: []
- key: swords_07
  system: tarot
  zh:
    term: 宝剑七
    pinyin: bǎo jiàn qī
    short: 检查策略中的信息与边界
    long: 人物带走五剑而留下两剑，强调策略、未公开的信息与未完成的部分，不可直接认定偷窃。若逆位准备说清隐瞒，可以区分需要保护的个人边界与影响他人决定的事实，让策略不以误导为代价。
  en:
    term: Seven of Swords
    pinyin: bǎo jiàn qī
    short: choose a strategy with clear information boundaries
    long:
      The figure carries some swords while others remain behind. Strategy, incomplete disclosure and
      an unfinished task are all possible questions; the image is not evidence of theft. Distinguish
      information you may reasonably keep private from facts another person needs for a shared
      decision. If clarification is overdue, disclose the relevant detail without abandoning every
      personal boundary in the process.
  aliases: []
- key: swords_08
  system: tarot
  zh:
    term: 宝剑八
    pinyin: bǎo jiàn bā
    short: 把受限感拆成具体可改的条件
    long: 蒙眼、束缚与周围的剑表达受限感，同时画面留下可移动的空间。它不说明所有限制都只是想象。若逆位选择开始恢复，可以逐项区分外部约束、缺少信息与自己尚未尝试的动作，先处理一项可改变的条件。
  en:
    term: Eight of Swords
    pinyin: bǎo jiàn bā
    short: separate a feeling of restriction into changeable conditions
    long: The blindfold and bindings make restriction visible, while the surrounding space invites
      closer inspection. Some limits may be external and real; the card does not declare them
      imaginary. If room to choose is returning, distinguish a fixed constraint from missing
      information and from an action you have not tried. Change one accessible condition before
      expecting the entire situation to open.
  aliases: []
- key: swords_09
  system: tarot
  zh:
    term: 宝剑九
    pinyin: bǎo jiàn jiǔ
    short: 把反复担忧带回眼前可处理的事
    long: 夜里坐起的人表达反复担忧，不是灾难预报或心理诊断。它与宝剑八强调外部限制不同，更重在想法持续盘旋。若逆位开始求助，可以把最常出现的一个担忧写成具体问题，找可靠的人讨论眼前能处理的部分。
  en:
    term: Nine of Swords
    pinyin: bǎo jiàn jiǔ
    short: bring repetitive worry back to what you can handle now
    long: The waking figure makes repetitive worry visible rather than forecasting a disaster or
      diagnosing a condition. Unlike the Eight of Swords’ restriction, this card asks how a concern
      keeps returning in thought. Write down the question that appears most often and identify what
      can be checked now. If support is needed, bring that specific concern to someone you trust.
  aliases: []
- key: swords_10
  system: tarot
  zh:
    term: 宝剑十
    pinyin: bǎo jiàn shí
    short: 承认一种做法已经走到尽头
    long: 十剑与远处的晨光强调一种做法已经耗尽，同时保留结束之后的空间，不预测身体事件。它与塔突然暴露结构问题不同，重在终止额外消耗。若逆位渐有恢复，可以先停止一项失效要求，再安排最基本的支持。
  en:
    term: Ten of Swords
    pinyin: bǎo jiàn shí
    short: recognise when a method has reached its limit
    long:
      The many swords depict an approach pushed beyond usefulness, while the distant light leaves
      space after its ending. This is not a prediction about physical events. Unlike the Tower’s
      abrupt exposure of a weak structure, the emphasis is on stopping further depletion. If
      recovery has begun, remove one ineffective demand and arrange the basic support needed before
      taking on a replacement.
  aliases: []
- key: swords_page
  system: tarot
  zh:
    term: 宝剑侍从
    pinyin: bǎo jiàn shì cóng
    short: 用好奇而审慎的问题搜集信息
    long: 侍从持剑并留意风向，强调搜集信息与练习表达，还未形成成熟结论。它与骑士快速回应不同。若逆位判断太急，可以核对消息来源、日期与语境，先问清一个细节，不把敏锐等同于已经知道全貌。
  en:
    term: Page of Swords
    pinyin: bǎo jiàn shì cóng
    short: gather information through alert and respectful questions
    long: The Page holds the sword while attending to a changing setting. Curiosity and alertness
      precede a settled judgment. Unlike the Knight’s rapid response, this role can remain in the
      information-gathering stage. If a conclusion has come too quickly, check the source, date and
      context of the message. A perceptive question is more useful than claiming the whole picture
      is already clear.
  aliases: []
- key: swords_knight
  system: tarot
  zh:
    term: 宝剑骑士
    pinyin: bǎo jiàn qí shì
    short: 让迅速思考配合清楚方向
    long: 疾驰的马与前倾的骑者强调思考和表达迅速进入行动，也可能漏掉背景。若逆位急于纠正别人，可以先复述对方实际主张，再指出一项可核对的分歧，给信息更新留出时间，避免速度变成压迫。
  en:
    term: Knight of Swords
    pinyin: bǎo jiàn qí shì
    short: act on a clear idea without losing the wider picture
    long:
      The moving horse and forward posture show thought turning quickly into action. Speed can help
      address a clear problem while also leaving background unheard. If urgency has overtaken
      understanding, restate the other person’s actual claim before challenging it. Choose one
      checkable disagreement and allow time for new information, rather than making a forceful
      delivery the measure of a sound argument.
  aliases: []
- key: swords_queen
  system: tarot
  zh:
    term: 宝剑王后
    pinyin: bǎo jiàn wáng hòu
    short: 把清楚表达与公平倾听并用
    long: 直立的剑与伸出的手同时呈现边界和接纳，强调清楚表达而仍愿意听见别人。王后不限定性别，也不等于冷酷。若逆位防御变尖锐，可以把事实、感受与要求分开，让直接沟通不必靠贬低对方维持。
  en:
    term: Queen of Swords
    pinyin: bǎo jiàn wáng hòu
    short: state a boundary clearly while listening fairly
    long: The upright sword and extended hand combine a boundary with an invitation to speak. Clear
      discernment need not mean emotional coldness, and the role is not assigned by gender. If
      defensiveness has sharpened the exchange, separate the observed fact, your response to it and
      the request you want to make. Directness can remain fair without becoming a verdict about the
      person.
  aliases: []
- key: swords_king
  system: tarot
  zh:
    term: 宝剑国王
    pinyin: bǎo jiàn guó wáng
    short: 使用一致标准整理复杂问题
    long: 端坐与正持的剑强调使用一致标准处理复杂问题，权威需要接受事实检验。它与宝剑一提出新切口不同，已经进入判断。若逆位标准只约束别人，可以检查是否同样适用于自己，邀请别人指出遗漏的资料。
  en:
    term: King of Swords
    pinyin: bǎo jiàn guó wáng
    short: use consistent standards to organise a difficult question
    long:
      The seated posture and controlled sword suggest judgment applied through a stable standard.
      Authority becomes useful when its reasoning can be examined. Unlike the Ace of Swords’ new
      distinction, this role concerns an established decision process. If the standard constrains
      others while exempting you, test it on a comparable case and invite someone to identify the
      information you have overlooked.
  aliases: []
- key: pentacles_01
  system: tarot
  zh:
    term: 星币一
    pinyin: xīng bì yī
    short: 把新机会落实到可用资源
    long: 手中星币与花园入口强调机会需要真实资源才能落地，不承诺财富增长。它与星币十的长期积累不同，仍是一个开端。若逆位安排尚未落实，可以核对材料、时间与责任人，先完成一项实际准备。
  en:
    term: Ace of Pentacles
    pinyin: xīng bì yī
    short: give a practical opportunity a stable starting place
    long:
      The coin and garden entrance suggest an opportunity with practical requirements. This does not
      promise an increase in wealth. Unlike the Ten of Pentacles’ established continuity, the Ace
      concerns a beginning that needs material support. If an offer remains vague, check the time,
      tools and responsible person before treating it as available, then complete one piece of
      preparation you can control.
  aliases: []
- key: pentacles_02
  system: tarot
  zh:
    term: 星币二
    pinyin: xīng bì èr
    short: 让多项事务有弹性地轮转
    long: 两枚星币在环中轮转，背后的船随浪起伏，强调资源与时间需要动态调节。它不是所有事都能兼顾的许诺。若逆位失衡，可以暂停一项较低优先级的任务，把固定责任和可调整事项分开。
  en:
    term: Two of Pentacles
    pinyin: xīng bì èr
    short: adjust a workable rhythm among competing tasks
    long:
      The linked coins move while the ships meet changing waves. Balance is an ongoing adjustment of
      time and resources, not proof that every commitment can be maintained. Unlike the Four of
      Pentacles’ holding pattern, this card asks how priorities rotate. If coordination is slipping,
      pause one lower-priority task and distinguish a fixed responsibility from an arrangement that
      can be renegotiated.
  aliases: []
- key: pentacles_03
  system: tarot
  zh:
    term: 星币三
    pinyin: xīng bì sān
    short: 通过分工与反馈提升完成度
    long: 工匠与讨论者围绕建筑图样，强调专长、共同标准与反馈，不只是在忙着工作。若逆位合作不一致，可以先确认验收样稿与各自职责，让意见落实到作品；不同分工不代表贡献有高低。
  en:
    term: Three of Pentacles
    pinyin: xīng bì sān
    short: combine different skills around an agreed standard
    long: The craftsperson and discussion around the structure connect skill with a shared standard.
      Being busy is different from coordinating expertise. Ask who supplies the design, who carries
      out the work and who checks the result. If collaboration is misaligned, review one sample
      together. A clear division of roles can respect different contributions without ranking the
      people making them.
  aliases: []
- key: pentacles_04
  system: tarot
  zh:
    term: 星币四
    pinyin: xīng bì sì
    short: 维护资源同时留出适当流动
    long: 星币贴近身体、脚下与头顶，强调安全感通过保留资源获得，也可能限制流动。若逆位想放松控制，可以先释放一项可承担的资源；若突然过度放手，则核对基本需要，保留照顾自己的边界。
  en:
    term: Four of Pentacles
    pinyin: xīng bì sì
    short: protect resources without closing every opening
    long:
      The coins are held close across the figure’s body. Retention can protect stability while also
      reducing room for exchange. Unlike the Two of Pentacles’ flexible rotation, this scene asks
      what is being secured. If you want to loosen control, release a manageable amount first. If
      resources are being relinquished too quickly, check basic needs before calling every act of
      holding on a problem.
  aliases: []
- key: pentacles_05
  system: tarot
  zh:
    term: 星币五
    pinyin: xīng bì wǔ
    short: 看见匮乏感之外的求助入口
    long: 窗内的光与窗外同行者强调困难中仍有求助入口，不据此预报贫困或身体问题。若逆位支持逐渐可用，可以直接问清如何获得协助；也把眼前有限的时间与物品列出，避免匮乏感盖过所有选择。
  en:
    term: Five of Pentacles
    pinyin: xīng bì wǔ
    short: look for accessible support when resources feel scarce
    long:
      The lit window and figures outside make need and access to support visible together. This is
      not a prediction of poverty or a physical condition. Ask which resource is lacking and whether
      an available service or trusted person can help. If assistance is becoming accessible, clarify
      how to request it; feeling excluded does not establish that every door is closed.
  aliases: []
- key: pentacles_06
  system: tarot
  zh:
    term: 星币六
    pinyin: xīng bì liù
    short: 让给予与接受保持清楚边界
    long: 秤与分送星币强调给予、接受和分配权之间的关系，不是只要慷慨就好。若逆位帮助带着隐性条件，可以问清是否需要回报、谁能决定范围，让接受帮助不必付出未曾同意的代价。
  en:
    term: Six of Pentacles
    pinyin: xīng bì liù
    short: make giving and receiving clear and proportionate
    long:
      The scales beside the distributed coins connect generosity with the power to set terms. Giving
      is useful when the arrangement is clear to both sides. Ask what is offered, what is expected
      in return and who may change the terms. If support has become conditional in an uncomfortable
      way, clarify that condition before accepting rather than assuming gratitude requires agreement
      to everything.
  aliases: []
- key: pentacles_07
  system: tarot
  zh:
    term: 星币七
    pinyin: xīng bì qī
    short: 用阶段观察评估长期投入
    long: 人物停下来查看生长的星币，强调投入之后的评估，等待本身不说明回报。它与星币八仍在练习不同，这里需要决定如何继续。若逆位感到停滞，可以设置一个复盘点，用实际进展比较继续、调整与停止。
  en:
    term: Seven of Pentacles
    pinyin: xīng bì qī
    short: review gradual progress before adding more effort
    long:
      The pause beside growing pentacles suggests evaluation after sustained effort. Waiting alone
      does not establish a return. Unlike the Eight of Pentacles’ active practice, this card asks
      whether the current approach still merits your time. Set a review point and compare observable
      progress with the resources being used. Continuing, adjusting and stopping can each be
      reasonable responses to what you find.
  aliases: []
- key: pentacles_08
  system: tarot
  zh:
    term: 星币八
    pinyin: xīng bì bā
    short: 靠专注练习改进具体技能
    long: 反复雕刻星币强调专注练习与逐次改进，不是重复越多越好。若逆位过程机械，可以只选一处技术细节进行比较，寻求具体反馈；把完成数量与实际学习分开，让练习有可以看见的进步。
  en:
    term: Eight of Pentacles
    pinyin: xīng bì bā
    short: improve a skill through attentive repetition
    long:
      The repeated carving emphasizes learning through attentive work. Repetition is useful when it
      changes the quality of what you can do, rather than only increasing the count. Compared with
      the Seven of Pentacles’ assessment of a longer investment, this card focuses on the next
      practice cycle. Choose one detail to improve and ask for feedback precise enough to guide
      another attempt.
  aliases: []
- key: pentacles_09
  system: tarot
  zh:
    term: 星币九
    pinyin: xīng bì jiǔ
    short: 珍惜独立经营出的日常品质
    long: 花园、成熟的星币与受训的鸟强调长期经营后的自主与日常品质，不等于财富身份。它与星币十的共同延续不同。若逆位维持形象让你疲惫，可以保留真正喜欢的舒适，减少一项只为展示而承担的投入。
  en:
    term: Nine of Pentacles
    pinyin: xīng bì jiǔ
    short: enjoy the quality of life your steady work supports
    long:
      The garden, mature pentacles and trained bird connect independence with cultivated conditions.
      This is not a label for wealth or social status. Unlike the Ten of Pentacles’ shared
      continuity, the emphasis is on the quality of life you have shaped. If maintaining appearances
      has become costly in time or effort, retain the comfort you value and reduce what serves only
      display.
  aliases: []
- key: pentacles_10
  system: tarot
  zh:
    term: 星币十
    pinyin: xīng bì shí
    short: 维护可延续的共同资源
    long: 多代人物、动物与建筑把资源放在延续的关系中，强调共同维护和传承，不规定家庭模式。若逆位旧安排不合适，可以讨论使用、责任与交接规则，保留有用经验，也让参与者有重新协商的空间。
  en:
    term: Ten of Pentacles
    pinyin: xīng bì shí
    short: care for shared resources that extend beyond one task
    long:
      The people, animals and established setting connect resources with continuity across a group.
      The image does not prescribe a family model. Unlike the Nine of Pentacles’ personal autonomy,
      this card asks how an arrangement survives beyond one person’s effort. If inherited
      expectations no longer fit, discuss use, maintenance and handover so that useful experience
      can remain while participation is renegotiated.
  aliases: []
- key: pentacles_page
  system: tarot
  zh:
    term: 星币侍从
    pinyin: xīng bì shì cóng
    short: 把学习热情落在基础练习上
    long: 侍从仔细看星币，强调学习需要触手可及的对象与基本练习，不预告某种学历。若逆位分心，可以只挑一项能完成的操作，记下所需材料与检查标准，先得到实际手感，再增加计划范围。
  en:
    term: Page of Pentacles
    pinyin: xīng bì shì cóng
    short: approach a practical skill with careful curiosity
    long: The Page studies a tangible object, placing learning in contact with something that can be
      handled and checked. This is a practice role, not a prediction about qualifications. Unlike
      the Knight’s continuing routine, the Page is establishing foundations. If attention is
      scattered, choose one basic operation, prepare its materials and define what completion looks
      like before adding another learning plan.
  aliases: []
- key: pentacles_knight
  system: tarot
  zh:
    term: 星币骑士
    pinyin: xīng bì qí shì
    short: 以稳定执行守住可持续进度
    long: 静止而准备充分的坐骑强调可靠执行，慢不等于停滞。它与权杖骑士的冲劲不同，更重在重复兑现。若逆位习惯变机械，可以删去一个无用检查或更新步骤，保留稳定节奏，也让方法适应实际需要。
  en:
    term: Knight of Pentacles
    pinyin: xīng bì qí shì
    short: maintain progress through reliable and measured effort
    long: The stationary horse and held pentacle emphasize preparation and dependable execution. A
      measured pace is different from doing nothing. Compared with the Knight of Wands’ energetic
      pursuit, this role concerns showing up repeatedly with what the task needs. If the routine has
      become mechanical, remove an obsolete check or update a step while preserving the reliability
      that makes the work usable.
  aliases: []
- key: pentacles_queen
  system: tarot
  zh:
    term: 星币王后
    pinyin: xīng bì wáng hòu
    short: 让实际照料兼顾自己与环境
    long: 王后照看星币，周围的植物把照料连接到真实环境与资源。这个角色不限定性别，也不要求无限付出。若逆位事务挤占个人空间，可以把必要照料与额外要求分开，邀请参与者共同维护日常。
  en:
    term: Queen of Pentacles
    pinyin: xīng bì wáng hòu
    short: offer practical care that includes your own needs
    long: The Queen’s attention to the pentacle and living surroundings connects care with practical
      conditions. Anyone can occupy this role; it does not require unlimited availability. Unlike
      purely emotional support, the focus is on making daily life workable. If maintenance has
      consumed your own space, distinguish essential care from additional demands and invite the
      people benefiting from the arrangement to share its upkeep.
  aliases: []
- key: pentacles_king
  system: tarot
  zh:
    term: 星币国王
    pinyin: xīng bì guó wáng
    short: 以稳健管理支持可靠的成果
    long: 稳定座位与繁茂环境强调成熟的资源管理，可靠来自维护而非占有。它与皇帝建立边界不同，更关注制度运行后的质量。若逆位习惯或控制压过用途，可以检查资源是否真正被需要的人使用，说明共享和交接的条件。
  en:
    term: King of Pentacles
    pinyin: xīng bì guó wáng
    short: manage practical resources in a dependable way
    long:
      The stable seat and abundant setting emphasize resources managed over time. Reliability comes
      through maintenance rather than possession alone. Compared with the Emperor’s establishment of
      a framework, this role asks how well that framework now serves people. If comfortable routines
      or control have displaced usefulness, check who can actually access the resources and make the
      conditions of sharing and handover clear.
  aliases: []
