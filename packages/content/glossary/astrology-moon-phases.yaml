# T-23: glossary follows appendix keys; pinyin describes the Chinese display term.
- key: moon_phase.new_moon
  system: astrology
  zh:
    term: 新月
    pinyin: xīn yuè
    short: 八段月相之一
    long: 新月是日月角距以0度附近为中心的月相区段，每段宽四十五度。区段标签与精确新月或满月发生在某民用日不是同一个判断，可作为短期观察意象，不是日程指令。
  en:
    term: New Moon
    pinyin: xīn yuè
    short: One of eight lunar phase sectors
    long:
      New Moon is a forty-five-degree Sun–Moon angle sector centered around 0°. A broad phase sector is
      distinct from an exact lunation occurring during a civil day. Its daily image can prompt reflection without
      prescribing a schedule.
  aliases: []
