- key: iching.clarity
  system: iching
  zh:
    term: 清楚观察
    short: 把已知事实与推测分开看
    long: 先记录能核对的事实，再把象征提示作为问题来检视；信息不足时保留开放判断。
  en:
    term: Clear Observation
    short: Separate evidence from an interpretation
    long: Notice what you can establish directly, then use the image to ask a better question rather than filling an information gap with certainty.
  aliases: []
- key: iching.coordination
  system: iching
  zh:
    term: 协作衔接
    short: 让职责、材料与回应接得起来
    long: 说明谁能提供什么、何时可用，以及怎样查看实际配合，让合作建立在双方理解的安排上。
  en:
    term: Practical Coordination
    short: Make a shared arrangement usable
    long: Agree on contributions, access and a review point so that goodwill becomes a task people can actually carry together.
  aliases: []
- key: iching.pacing
  system: iching
  zh:
    term: 留有节奏
    short: 按可承受的范围推进并复查
    long: 根据实际余力选择下一步，保留休息、求助与调整机会，不用速度代替准备。
  en:
    term: Sustainable Pace
    short: Choose a step your capacity can support
    long: Keep room to rest, seek help and change the plan as you learn, instead of making momentum the measure of progress.
  aliases: []
