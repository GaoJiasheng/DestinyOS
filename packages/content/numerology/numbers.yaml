  zh:
    title: 归一过程如何核对
    summary: 整体相加与分段归一是不同规则，本项目采用整体相加。
    body: 生命灵数的计算先把公历生日年月日展开成数字，再把所有数字相加。若总和是十一、二十二或三十三，就停在这个数；否则继续把总和的各位数字相加，直到得到一位数或大师数。生日数则只从月份里的出生日开始，两个结果回答不同的问题。这里不先分别归一年、月、日，因为提前归一可能改变大师数结果。专业视图里的总和与步骤帮助你区分输入错误和流派差异，例如看到二十九继续相加为十一，就能理解为什么它没有再变成二。农历档案会先转为公历，出生时辰、性别与真太阳时不参与这项相加。建议核对公历日期和停止条件，再与采用相同规则的计算结果比较。若另一工具使用分段归一，两边不同不一定是算术错误。保留计算说明比只看最终数字更有助于文化学习。
    advice:
      - 选择一个实际情境，记录观察与反馈。
    do:
      - 记录观察
    dont:
      - 贴标签
  en:
    title: Checking the reduction
    summary: This implementation sums all birthday digits before reducing.
    body:
      The life path calculation first expands the Gregorian year, month, and day into decimal digits
      and adds every digit. If the total is eleven, twenty-two, or thirty-three, reduction stops
      there. Otherwise, the digits of the total are added again until a single digit or retained
      master number is reached. The birthday number begins only with the day of the month, so the
      two results offer different lenses. This implementation does not separately reduce the year,
      month, and day before combining them, because that can change which master numbers appear. The
      sum and steps in the technical view help distinguish an input mistake from a difference in
      convention. For example, twenty-nine reduces to eleven and stops rather than continuing to
      two. Lunar profile dates are converted to Gregorian dates first. Birth time, gender, and
      apparent solar time do not enter this addition. You can check the Gregorian date and stopping
      rule before comparing results with another calculator. A tool that uses component reduction
      can give a different result without an arithmetic error. Keeping the method visible supports
      careful cultural learning.
    advice:
      - Choose a real situation and record observations and feedback.
    do:
      - Notice patterns
    dont:
      - Label people
