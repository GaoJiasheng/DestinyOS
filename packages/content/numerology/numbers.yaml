  zh:
    title: 认识符号与方法
    summary: 数字象征与算术规则可以分别学习。
    body: 生命灵数属于西方数字象征传统，现代毕达哥拉斯姓名表使用英文字母循环赋值。学习时可以把算术规则与文化解释分开：前者能通过相同输入重算，后者是帮助反思的象征角度，不是科学测量。生命灵数使用完整生日，生日数使用月内日期，姓名的三组数使用不同字母集合，个人周期使用目标公历日期。大师数保留与年度边界是常见分歧，阅读其他资料时先检查这些设置，避免把不同规则下的结果直接比较。比如，整体相加得到十一和分段归一得到二，可能只是方法不同。建议从百科页了解这套体系，再尝试手算一个非私人的例子，用总和与步骤检验自己的理解。分享时讲清楚方法与娱乐性质，不把数字标签强加给别人。理解规则后，你可以更自由地选择哪些主题适合用于日常观察。
    advice:
      - 选择一个实际情境，记录观察与反馈。
    do:
      - 记录观察
    dont:
      - 贴标签
  en:
    title: Learn the symbols and methods
    summary: You can study the arithmetic separately from the symbolism.
    body:
      Numerology belongs to a Western tradition of number symbolism, and the modern Pythagorean name
      table assigns repeating values to English letters. You can study the arithmetic separately
      from the cultural interpretation. The arithmetic can be repeated with the same input, while
      the interpretation supplies reflection themes rather than scientific measurements. A life path
      uses the complete birthday, a birthday number uses the day of the month, name numbers use
      different letter groups, and personal cycles use a target Gregorian date. Master-number
      retention and the annual boundary are common points where methods differ. Check those settings
      before comparing results from different sources. For example, a total of eleven and a
      component-reduced result of two can reflect different conventions. Consider starting with the
      encyclopedia page, then calculating a fictional example by hand and checking its sum and
      reduction steps. When sharing, explain the method and its entertainment purpose instead of
      assigning a number label to someone else. Understanding the rules gives you more freedom to
      decide which themes are useful in everyday reflection.
    advice:
      - Choose a real situation and record observations and feedback.
    do:
      - Notice patterns
    dont:
      - Label people
  meta:
    author: numerology-editorial-v1
    reviewed_by: null
