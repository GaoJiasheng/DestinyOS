    body:
      A name number of 6 can describe action, inner preferences, or first impressions; the evidence
      identifies the triggering field. You may care about supporting people around you and making
      shared spaces comfortable. Care works best when it responds to what someone actually wants.
      Good intentions need consent and limits, so responsibility does not turn into deciding
      everything for another person. When caring for someone close to you, ask specifically how they
      would like to be supported rather than treating your preference as their need. If they do not
      use your suggestion, allow room for their own attempt. You can discuss support and
      expectations separately instead of quietly giving and later feeling resentful. Clear limits
      can make room for lighter conversations alongside serious responsibilities. Think of a
      cooperation that went smoothly and ask when you expressed a need directly and when you waited
      for someone to notice. Write down what felt easy and what still made you hesitate. Consider
      practising a direct request in a low-pressure setting, such as saying when a reply would help.
      Sensitive observation can become more useful when clear words give the other person a way to
      respond.
    advice:
      - Ask what support is wanted and agree on what you can offer
