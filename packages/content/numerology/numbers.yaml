  zh:
    title: 6：照顾与责任
    summary: 生命灵数 6，可以从照顾与责任的角度观察自己。
    body: 生命灵数 6
      提供一个观察长期行动习惯的角度。你可能愿意让身边的人得到支持，也在意共同生活的舒适与秩序。照顾需要双方同意，善意不应变成替别人做所有决定。接到别人求助时，可以先问需要的是倾听、一起分析，还是一项具体协助。确认自己的时间后，再约定能做和暂时做不到的部分。建议完成协助后把决定权交还对方，不必追踪每一个后续步骤；支持可以很认真，同时也允许双方拥有自己的节奏。回顾自己的责任清单时，可以标出明确答应过的部分，以及只是习惯性接下的部分。看看哪些任务需要协商，而不是继续默默承担。建议选一个适合讨论的事项，说出你目前能做的范围，也询问其他人的条件；合理分工能让关心持续，不必靠不断超出自己的限度维持。
    advice:
      - 先问对方希望得到什么帮助，再约定可承担的范围
    do:
      - 记录观察
    dont:
      - 贴标签
  en:
    title: '6: care and responsibility'
    summary: Life path 6 invites reflection on care and responsibility.
    body: Life path 6 offers a lens for observing recurring ways of acting. You may care about
      supporting people around you and making shared spaces comfortable. Care works best when it
      responds to what someone actually wants. Good intentions need consent and limits, so
      responsibility does not turn into deciding everything for another person. When someone asks
      for help, check whether they want listening, joint thinking, or a specific action. Review your
      available time before agreeing on what you can offer and what is outside your capacity. You
      can return the decision to the other person after providing support. There is no need to track
      every next step; thoughtful help can still respect each person’s own pace. Review your
      responsibilities and mark which ones you explicitly accepted and which you took on through
      habit. Notice what needs a conversation rather than more silent effort. You can choose one
      suitable task, describe your current capacity, and ask about the other person’s conditions. A
      workable division of responsibilities can sustain care without relying on repeatedly
      stretching beyond your own limits to keep everything going.
    advice:
      - Ask what support is wanted and agree on what you can offer
    do:
      - Notice patterns
    dont:
      - Label people
  meta:
    author: numerology-editorial-v1
    reviewed_by: null
    version: 1
    status: published
