  zh:
    title: 3：表达与创意
    summary: 生命灵数 3，可以从表达与创意的角度观察自己。
    body: 生命灵数 3
      提供一个观察长期行动习惯的角度。你可能乐于用故事、图像或幽默让抽象想法变得可亲。表达能打开交流的门，真正落地仍需要编辑、练习和耐心。解释一个复杂想法时，可以准备两个版本：一句话说明用途，一张草图说明步骤。先让不熟悉背景的人试着复述，再决定哪些细节需要补充。建议给初稿一个明确的完成时间，避免一直打磨开头；清楚可用的作品，往往比还没有交付的完美设想更能带来反馈。你可以选择一个常说但不够具体的想法，为它找一个生活例子。把例子讲给朋友听以后，问问哪里清楚、哪里像在绕圈。建议先完成一个足够简单的表达版本，再逐步丰富；真正的创作过程也包括删掉没有帮助的部分，而不只是不断增加新点子。
    advice:
      - 用一段短文或草图说明想法，再邀请具体反馈
    do:
      - 记录观察
    dont:
      - 贴标签
  en:
    title: '3: expression and creativity'
    summary: Life path 3 invites reflection on expression and creativity.
    body:
      'Life path 3 offers a lens for observing recurring ways of acting. You may enjoy turning an
      abstract idea into a story, an image, or a playful explanation. Expression can open a
      conversation, while editing and practice help that conversation reach a useful conclusion. A
      lively start benefits from a clear finish. For a complicated idea, prepare two versions: one
      sentence explaining its purpose and a sketch showing the steps. Ask someone unfamiliar with
      the background to describe what they understood before adding more detail. Try giving the
      first draft a definite finish time. A clear, usable piece of work can generate feedback that
      an unfinished ideal version cannot yet offer. Choose an idea you often mention but find hard
      to make concrete and give it an everyday example. Tell the example to a friend and ask which
      part was clear and which felt circular. You can finish a simple version before adding detail.
      Creative work also includes removing something that does not help; it need not consist only of
      collecting new ideas or making the presentation more elaborate.'
    advice:
      - Explain an idea in a short draft or sketch and ask for specific feedback
    do:
      - Notice patterns
    dont:
      - Label people
  meta:
    author: numerology-editorial-v1
    reviewed_by: null
    version: 1
    status: published
