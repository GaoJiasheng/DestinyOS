  zh:
    title: 字母表与空集合
    summary: A–I 对应 1–9，J–R 与 S–Z 循环；Y 按辅音处理。
    body:
      毕达哥拉斯姓名数字把英文字母按字母序循环对应一到九：A、J、S 都是一，B、K、T 都是二，后续依此类推。表达数合计所有字母，灵魂数合计
      A、E、I、O、U，人格数合计剩下的辅音。三项总和分别归一，保留十一、二十二与三十三。输入只接受英文字母及常见姓名分隔符，大小写不影响数值，姓名原文不会写进明文命盘。若拼写没有元音或没有辅音，对应数字为空，而不是零号人格。字母
      Y
      在某些流派中按发音处理，但本项目固定按辅音处理，便于离线核验。例如，可先对照字母表检查每组总和，再看表达、需要与印象三个观察视角是否互相补充。建议使用你自行选择的常用拼写，不把计算当作改名建议。姓名主题不能反推一个人的真实身份或替代彼此了解。
    advice:
      - 选择一个实际情境，记录观察与反馈。
    do:
      - 记录观察
    dont:
      - 贴标签
  en:
    title: The alphabet and empty groups
    summary: Letter values repeat from one through nine; Y is a consonant here.
    body:
      Pythagorean name numbers cycle through values one to nine in alphabetical order. A, J, and S
      have value one; B, K, and T have value two; the pattern continues through Z. Expression adds
      all letters. Soul adds A, E, I, O, and U. Personality adds the remaining consonants. Each
      group is reduced separately, retaining eleven, twenty-two, and thirty-three. The input accepts
      English letters and common name separators, and letter case does not affect the values. The
      raw name is not retained in the plaintext chart. When a spelling has no vowels or no
      consonants, that group has an empty result rather than a zero personality type. Some
      conventions classify Y by pronunciation; this implementation always treats it as a consonant
      so the calculation is reproducible offline. You can first check each group total against the
      letter table, then compare the three lenses of action, preferences, and first impressions.
      Choose a familiar spelling yourself, and do not treat the calculation as advice to change your
      name. These themes cannot establish an identity or replace getting to know someone.
    advice:
      - Choose a real situation and record observations and feedback.
    do:
      - Notice patterns
    dont:
      - Label people
