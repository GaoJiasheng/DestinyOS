  zh:
    title: 4：结构与踏实
    summary: 生命灵数 4，可以从结构与踏实的角度观察自己。
    body: 生命灵数 4
      提供一个观察长期行动习惯的角度。你可能喜欢把任务拆成明确步骤，让进度可见、承诺可查。稳定来自持续投入，但计划也需要为变化保留空隙。处理重复事务时，你可以检查最常出错的一步，做一份短清单而不是添加许多规则。连续使用几次以后，看看清单是否减少了遗漏，又是否造成新的麻烦。建议保留修改入口，让执行者提出更简单的办法；流程的作用是支持工作，而不是证明谁更认真。观察一周的日常节奏时，可以找出让你省力的固定安排，也标记需要过多维护的习惯。有些稳定来自熟悉，有些只是没有试过别的方法。建议保留最有用的一项流程，暂时简化另一项，比较实际效果；这样既不需要全部重来，也能给变化留下入口。
    advice:
      - 设一个可重复的流程，并留出调整时间
    do:
      - 记录观察
    dont:
      - 贴标签
  en:
    title: '4: structure and steady effort'
    summary: Life path 4 invites reflection on structure and steady effort.
    body:
      Life path 4 offers a lens for observing recurring ways of acting. You may prefer clear steps,
      visible progress, and commitments that can be checked. Consistent effort can make a difficult
      task manageable. A useful structure also has space for unexpected information, so reliability
      does not become a reason to resist every change. For recurring tasks, inspect the step that
      most often goes wrong and create a short checklist rather than many new rules. After several
      uses, check whether it reduces omissions and whether it creates another difficulty. You can
      leave a clear route for changes so the people using the process can suggest a simpler version.
      A routine should support the work rather than prove who cares more. Observe a week of routines
      and identify the arrangements that save effort as well as those that require too much upkeep.
      Some stability comes from a helpful habit; some comes from never having tried another
      approach. Consider keeping your most useful process while simplifying one other routine.
      Comparing the result creates a route for change without requiring you to rebuild every part of
      your day at once.
    advice:
      - Create a repeatable routine and leave time for adjustments
    do:
      - Notice patterns
    dont:
      - Label people
  meta:
    author: numerology-editorial-v1
    reviewed_by: null
    version: 1
    status: published
