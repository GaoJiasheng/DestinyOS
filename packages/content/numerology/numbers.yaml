      identifies the triggering field. You may enjoy turning an abstract idea into a story, an
      image, or a playful explanation. Expression can open a conversation, while editing and
      practice help that conversation reach a useful conclusion. A lively start benefits from a
      clear finish. After sharing a story or an idea, ask which part the listener remembers most.
      The point you intended and the point they heard can differ, giving you a chance to reorganise
      your language. Consider adding less explanation and leaving more space for a response. A
      conversation does not need to include every detail; it needs opportunities to check
      understanding and ask the next useful question. When evaluating a goal, review what was
      achieved, which resources were used, and what the process cost. Information beyond the outcome
      can help you decide whether the method is worth repeating. You can write evaluation criteria
      in advance and allow the people doing the work to suggest revisions. That makes room to
      discuss effort and results instead of letting one final figure decide the whole story.
