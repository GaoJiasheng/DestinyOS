      可以从行动、内在需要或外在印象的角度阅读；依据标明由哪一项触发。你可能愿意先理解原因，再决定是否投入。独处与深入学习能帮你整理思路，但想得很透仍需要现实反馈。需要独处时，可以告诉对方你是在整理思路，以及什么时候愿意继续交流。这样既保护安静时间，也减少突然消失造成的不确定。建议把思考后的结论简短说出来，哪怕只是一个暂时的看法；让别人知道过程，有助于把深思变成可参与的讨论。你可以选择一个常说但不够具体的想法，为它找一个生活例子。把例子讲给朋友听以后，问问哪里清楚、哪里像在绕圈。建议先完成一个足够简单的表达版本，再逐步丰富；真正的创作过程也包括删掉没有帮助的部分，而不只是不断增加新点子。
