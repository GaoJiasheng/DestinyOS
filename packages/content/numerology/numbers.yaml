  zh:
    title: 让观察回到现实
    summary: 选一个小实验，事实与感受分开记录。
    body: 使用这份报告时，可以先选一个最贴近近期生活的主题，把它改写成一个可以观察的问题。与其问数字是否说中了你，不如问哪种行为更有助于表达需要、完成任务或照顾休息。计算结果只提供象征语言，具体作用要由现实经历检验。例如，在下一次合作前清楚说明分工，然后记录沟通是否更顺畅；一周后再比较，而不是凭一次巧合下结论。九宫格里重复数字多不表示更优秀，空格也不表示你欠缺什么，不需要额外付费补数字。建议将观察分成事实、自己的解释和可调整的行动三部分，也听听他人对同一情境的理解。对于重要的工作、关系或生活决定，优先了解实际限制和需要。若某段描述让你感到被限制，可以暂时放下，让文化探索保持轻松与自主。
    advice:
      - 选择一个实际情境，记录观察与反馈。
    do:
      - 记录观察
    dont:
      - 贴标签
  en:
    title: Bring reflection back to experience
    summary: Choose a small experiment and record facts separately from feelings.
    body: You can begin with a theme that connects with something happening in your life and turn it
      into an observable question. Instead of asking whether a number describes you perfectly, ask
      which action helps you communicate a need, finish a task, or make room for rest. The
      calculation supplies a symbolic language; experience determines whether a suggestion is
      useful. For example, agree on responsibilities before your next shared task and note whether
      the conversation becomes easier. Review the result after a week rather than drawing a broad
      conclusion from one coincidence. Repeated digits in the grid do not indicate greater ability,
      and empty cells do not indicate a deficiency. There is no need to pay for a way to add missing
      numbers. Try separating facts, your interpretation, and a possible adjustment in your notes.
      Listen to another person’s view of the same situation. For important choices, practical
      limitations and people’s needs should guide you. If a description feels restrictive, set it
      aside and keep cultural exploration voluntary and light.
    advice:
      - Choose a real situation and record observations and feedback.
    do:
      - Notice patterns
    dont:
