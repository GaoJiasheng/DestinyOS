    title: '1 and 1: cooperation prompts'
    summary: Explore how initiative and independence and initiative and independence can work together.
    body: This prompt explores how the themes of 1 and 1 can cooperate in practice. You may be
      comfortable making the first move and finding a direction without an established answer. While
      other people are comparing options, you might already be outlining the next step. Independence
      works best when it leaves room for useful support. When the same theme appears in two
      positions, another perspective may be useful; repetition does not double its strength. When
      starting a project, write down who will use it, the smallest useful result, and whose
      participation you need. Keep the experiment within a week. At the end, ask a user what felt
      clear and what felt difficult. Try sorting feedback into immediate corrections and questions
      for later. A comment about the work does not need to become a judgment about your abilities.
