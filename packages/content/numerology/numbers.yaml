- id: numerology.life_path.1
  system: numerology
  section: life_path
  topic: life_path
  when:
    path: lifePath.number
    eq: 1
  weight: 70
  polarity: neutral
  tags:
    - plain
    - numerology.life_path
    - numerology.personal_year
    - numerology.birthday
  exclusive_with: []
  zh:
    title: 1：主动与独立
    summary: 生命灵数 1，可以从主动与独立的角度观察自己。
    body: 生命灵数 1
      提供一个观察长期行动习惯的角度。你可能已列出下一步，但独立并不意味着独自承担一切。当你想发起一个项目，可以先写出谁会使用它、最小成果是什么，以及需要谁参与。把试验范围控制在一周内，结束时请一位使用者讲讲哪里清楚、哪里费力。建议把意见分为需要马上修正和可以以后讨论两类，不用把每条反馈都当成对个人能力的评价。你可以回顾最近一次主动决定，写下当时掌握了哪些信息、忽略了哪些反馈，以及现在会保留什么做法。复盘不是为了证明当初选对了，而是增加下一次选择的空间。建议只调整一个环节，比如提前向同伴解释理由，连续观察几次再判断有没有帮助。
    advice:
      - 发起一个小项目，把决定权与责任写清楚
    do:
      - 记录观察
    dont:
      - 贴标签
  en:
    title: '1: initiative and independence'
    summary: Life path 1 invites reflection on initiative and independence.
    body: Life path 1 offers a lens for observing recurring ways of acting. You may be comfortable
      making the first move and finding a direction without an established answer. While other
      people are comparing options, you might already be outlining the next step. Independence works
      best when it leaves room for useful support. When starting a project, write down who will use
      it, the smallest useful result, and whose participation you need. Keep the experiment within a
      week. At the end, ask a user what felt clear and what felt difficult. Try sorting feedback
      into immediate corrections and questions for later. A comment about the work does not need to
      become a judgment about your abilities. Review a recent decision you initiated. Note what
      information you had, what feedback you missed, and which part of your approach you would keep
      now. Reflection does not need to prove that the original choice was right; it can expand the
      options available next time. Try changing only one step, such as explaining your reasons
      earlier, and observe several situations before deciding whether it helps.
    advice:
      - Start a small project and clarify who decides what
    do:
      - Notice patterns
    dont:
      - Label people
  meta:
    author: numerology-editorial-v1
    reviewed_by: null
    version: 1
    status: published
