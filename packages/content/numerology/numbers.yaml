  zh:
    title: 从年到月到日
    summary: 年度从一月一日切换，月日按目标日期计算。
    body: 个人年把出生月与出生日的数字总和加上目标公历年的数字总和，最后归一到一至九。个人月再把个人年数与目标月份相加归一，个人日把个人月数与目标日期相加归一。周期里不保留大师数，年度边界固定为一月一日，避免同一份报告混用不同停止条件。年周期环从当前目标年开始展示九年，下一年按一到九的循环推进；个人日使用页面所选日期，不受服务器所在地的日历影响。例如，跨时区的同一时刻可能已经是不同日期，今日页面会按用户当前时区计算。建议把年度主题作为复盘背景，月份作为短计划范围，日数作为一个轻量行动提示。若本月需要稳定执行而今日主题偏探索，可以只安排一件很小的尝试，不必推翻现有安排。周期反映日期参数与象征解释，不意味着每天都需要做不同的人。
    advice:
      - 选择一个实际情境，记录观察与反馈。
    do:
      - 记录观察
    dont:
      - 贴标签
  en:
    title: From year to month to day
    summary: Years change on January first; months and days follow the target date.
    body:
      A personal year adds the digits of your birth month and birth day to the digits of the target
      Gregorian year, then reduces the total to one through nine. A personal month adds the calendar
      month to that year number. A personal day adds the day of the month to the month number.
      Cycles do not retain master numbers, and the annual boundary is January first, keeping the
      stopping rules consistent within one reading. The ring displays nine years beginning with the
      target year and moves through the repeating one-to-nine sequence. The daily page uses its
      selected local date rather than the server’s calendar. For example, one instant can fall on
      different dates in different time zones. You can use the year as a review background, the
      month as a planning window, and the day as a lightweight action prompt. If your monthly plan
      needs steady execution while the daily theme suggests exploration, try one small experiment
      without discarding the existing plan. A changing cycle reflects date parameters and symbolic
      interpretation; it does not require you to become a different person each day.
    advice:
      - Choose a real situation and record observations and feedback.
    do:
      - Notice patterns
    dont:
      - Label people
