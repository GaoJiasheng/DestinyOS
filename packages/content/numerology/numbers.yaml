  zh:
    title: 7：观察与深思
    summary: 生命灵数 7，可以从观察与深思的角度观察自己。
    body: 生命灵数 7
      提供一个观察长期行动习惯的角度。你可能愿意先理解原因，再决定是否投入。独处与深入学习能帮你整理思路，但想得很透仍需要现实反馈。准备深入研究时，可以先写一个能够回答的问题，列出已有证据与暂时的猜想。读完一份资料后，用自己的话总结，再与另一个来源比较。建议在学习之后安排一次实际应用，哪怕只是给同伴解释五分钟，看看理解中的空白在哪里，避免只积累材料却迟迟没有反馈。思考一个迟迟没有决定的问题时，可以列出还缺的事实与已经足够清楚的部分。分清需要继续研究还是需要一次小尝试，避免把不确定当成永久停止的理由。建议安排一个低成本的验证步骤，完成后重新评估，把分析和现实反馈连起来，而不是要求自己先理解所有可能性。
    advice:
      - 写下一个可验证的问题，用事实补充直觉
    do:
      - 记录观察
    dont:
      - 贴标签
  en:
    title: '7: observation and reflection'
    summary: Life path 7 invites reflection on observation and reflection.
    body:
      Life path 7 offers a lens for observing recurring ways of acting. You may want to understand
      the reasons behind something before deciding how much to invest in it. Quiet time and focused
      study can help you organise your thinking. Reflection gains value when you eventually test an
      idea against real experience and other people’s perspectives. Before focused study, write a
      question that can be answered and separate existing evidence from tentative guesses. Summarise
      a source in your own words and compare it with another account. Try arranging a practical use
      afterward, even a five-minute explanation to a colleague. That small application can reveal
      gaps in understanding and prevent a growing collection of material from taking the place of
      feedback. For a question you have not resolved, list the facts still missing and the parts
      that are already clear enough. Distinguish a need for more study from a need for a small trial
      rather than letting uncertainty become a permanent stop. Consider one low-cost verification
      step and reassess after completing it. Connecting analysis with feedback can help without
      requiring you to understand every possible outcome first.
    advice:
      - Write one testable question and use observations to supplement intuition
    do:
      - Notice patterns
    dont:
      - Label people
  meta:
    author: numerology-editorial-v1
    reviewed_by: null
    version: 1
    status: published
