      be willing to understand different viewpoints. Perspective can help you finish a chapter or
      let something go. Being inclusive does not require carrying every responsibility or giving up
      your own needs. When several new directions appeal to you, give each a small test with a time
      limit and a stopping condition. Keep some of your usual routines available instead of
