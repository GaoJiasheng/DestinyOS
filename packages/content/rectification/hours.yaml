# DESIGN-GAP: Symbolic observation prompts are not evidence of a birth time.
zi:
  zh: 可观察自己是否习惯安静思考，并在新环境中寻找灵活的空间。
  en: Notice whether quiet reflection and room to adapt feel comfortable in a new
    setting.
chou:
  zh: 可观察自己是否偏好耐心积累，用稳定的节奏完成长期任务。
  en: Notice whether patient accumulation and a steady pace suit your longer
    projects.
yin:
  zh: 可观察自己是否愿意主动开局，在变化中尝试新的方向。
  en: Notice whether taking the initiative and trying a fresh direction during
    change appeal to you.
mao:
  zh: 可观察自己是否重视交流与协调，在关系中寻找合适的分寸。
  en: Notice whether communication, cooperation, and thoughtful boundaries matter
    in your relationships.
chen:
  zh: 可观察自己是否善于整合资源，在复杂任务中建立次序。
  en: Notice whether bringing resources together and organizing complex tasks feel
    natural.
si:
  zh: 可观察自己是否喜欢深入分析，把观察转化为清晰的表达。
  en: Notice whether careful analysis helps you turn observations into clear
    explanations.
wu:
  zh: 可观察自己是否乐于表达与行动，在协作中带动气氛。
  en: Notice whether expressing ideas and taking action help you energize a shared
    task.
wei:
  zh: 可观察自己是否重视照顾与落实，让日常安排更舒适可靠。
  en: Notice whether practical care helps you make everyday arrangements
    comfortable and dependable.
shen:
  zh: 可观察自己是否善于应变与探索，在尝试中改进方法。
  en: Notice whether adapting and experimenting help you improve your methods.
you:
  zh: 可观察自己是否重视细节与品质，愿意反复打磨成果。
  en: Notice whether detail and quality motivate you to refine your work over
    several attempts.
xu:
  zh: 可观察自己是否重视原则与责任，在团队中守住承诺。
  en: Notice whether principles and responsibility help you keep commitments
    within a group.
hai:
  zh: 可观察自己是否喜欢想象与倾听，用宽广的视角理解经历。
  en: Notice whether imagination and listening help you understand experiences
    from a broader perspective.
