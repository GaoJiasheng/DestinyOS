    body: 你在自我表达上，可以留意保留与资源积累怎样改变参与方式。禄存（这里象征保留与资源积累的辅助星）位于命宫（观察你怎样认识自己和回应日常处境的领域），你倾向看重可持续使用的资源，而不是一次把所有余力用完。这类辅助信号用来补充主要倾向，不宜单独给你或相关的人贴标签。例如，安排学习或活动时，留下一点机动时间应对临时改动；再看这一步在当前关系或任务里是否方便落实。储备应服务生活，不必为了保留而拒绝合理需要。不过，别用一个盘中标签覆盖自己在不同场合的变化。建议盘点一项已有资源，给它设定清楚用途，先观察一次实际结果，再商量是否沿用这项安排。
