    body: 你在工作组织上，可以留意投入落差与取舍怎样改变参与方式。地劫（这里象征投入落差与取舍的辅助星）位于官禄宫（观察任务承担、职业学习与工作方法的领域），你可能更需要留意投入和实际回报之间的差距。这类辅助信号用来补充主要倾向，不宜单独给你或相关的人贴标签。例如，准备替别人多承担一项工作时，先估计会挤占哪件已经答应的事；再看这一步在当前关系或任务里是否方便落实。这里的耗损是资源反思，不能据此推断具体损失。不过，这份解读讨论工作风格，不替你指定职业；现实能力、兴趣和岗位条件需要一起考虑。建议设一个投入上限，到达后先复盘再继续，先观察一次实际结果，再商量是否沿用这项安排。
