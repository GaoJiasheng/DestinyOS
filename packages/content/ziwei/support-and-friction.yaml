  zh:
    title: 文昌在官禄宫：条理表达
    summary: 你在工作组织上，可以留意条理表达的作用。
    body: 你在工作组织上，可以留意条理表达怎样改变参与方式。文昌（这里象征条理表达的辅助星）位于官禄宫（观察任务承担、职业学习与工作方法的领域），整理清单与说明，能让合作更容易跟上你的思路。这类辅助信号用来补充主要倾向，不宜单独给你或相关的人贴标签。例如，写活动说明时先列顺序，再补别人可能追问的背景；再看这一步在当前关系或任务里是否方便落实。别把形式完整当作沟通完成。不过，这份解读讨论工作风格，不替你指定职业；现实能力、兴趣和岗位条件需要一起考虑。建议先请一位读者复述重点，再改一处不清楚的地方，先观察一次实际结果，再商量是否沿用这项安排。
    advice:
      - 先请一位读者复述重点，再改一处不清楚的地方
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Wén Chāng in Career Palace: clear written structure'
    summary: You can notice how clear written structure affects organizing work.
    body:
      You can examine clear written structure as a modifier of organizing work. Wén Chāng (文昌) — an
      auxiliary symbol for this kind of influence — appears in the 官禄宫 (guān lù gōng), which
      concerns how you take responsibility, learn professionally and arrange a task. In this
      setting, an outline or explanation can make your reasoning easier for others to follow. As an
      example, drafting a short guide for an activity, begin with the sequence and include the
      context a newcomer would ask for. Notice whether the action fits the people involved as well
      as the practical task. A caution is that a polished format still needs a reader who can use
      it. However, the reading explores a working style without assigning you a profession; skills,
      interests and the conditions of a role matter together. Try to ask a reader to restate the
      main point and revise the passage they found confusing. Review the result after one real
      attempt before making the practice routine. An auxiliary placement adds a perspective to the
      broader reading; it cannot establish someone’s character from a single symbol.
    advice:
      - ask a reader to restate the main point and revise the passage they found confusing
    do:
      - Note observations
    dont:
      - Rush conclusions
