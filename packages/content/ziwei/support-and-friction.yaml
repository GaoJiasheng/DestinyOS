      - 每次换环境前，写下这一趟要完成什么
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Tiān Mǎ in Life Palace: movement and changing settings'
    summary: You can notice how movement and changing settings affects your everyday identity.
    body:
      You can examine movement and changing settings as a modifier of your everyday identity. Tiān
      Mǎ (天马) — an auxiliary symbol for this kind of influence — appears in the 命宫 (mìng gōng),
      which concerns how you describe yourself and respond to ordinary situations. In this setting,
      a change of setting can offer new information while creating practical transition costs. As an
      example, working across locations, confirm travel arrangements and which materials can move
      with you. Notice whether the action fits the people involved as well as the practical task. A
      caution is that being in motion does not necessarily mean the underlying task is advancing.
      However, your response at home may differ from your response at work; leave room for that
      difference. Try to name what a change of setting is intended to accomplish before you make it.
      Review the result after one real attempt before making the practice routine. An auxiliary
      placement adds a perspective to the broader reading; it cannot establish someone’s character
      from a single symbol.
    advice:
      - name what a change of setting is intended to accomplish before you make it
