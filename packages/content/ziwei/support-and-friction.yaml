- id: ziwei.aux.life.wen_chang
  system: ziwei
  section: life_palace
  topic: aux_life_wen_chang
  when:
    path: palaces[key=life].minorStars[*].key
    eq: wen_chang
  weight: 50
  polarity: neutral
  tags:
    - plain
  exclusive_with: []
  zh:
    title: 文昌在命宫：条理表达
    summary: 你在自我表达上，可以留意条理表达的作用。
    body: 你在自我表达上，可以留意条理表达怎样改变参与方式。文昌（这里象征条理表达的辅助星）位于命宫（观察你怎样认识自己和回应日常处境的领域），整理清单与说明，能让合作更容易跟上你的思路。这类辅助信号用来补充主要倾向，不宜单独给你或相关的人贴标签。例如，写活动说明时先列顺序，再补别人可能追问的背景；再看这一步在当前关系或任务里是否方便落实。别把形式完整当作沟通完成。不过，别用一个盘中标签覆盖自己在不同场合的变化。建议先请一位读者复述重点，再改一处不清楚的地方，先观察一次实际结果，再商量是否沿用这项安排。
    advice:
      - 先请一位读者复述重点，再改一处不清楚的地方
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Wén Chāng in Life Palace: clear written structure'
    summary: You can notice how clear written structure affects your everyday identity.
    body: You can examine clear written structure as a modifier of your everyday identity. Wén Chāng
      (文昌) — an auxiliary symbol for this kind of influence — appears in the 命宫 (mìng gōng), which
      concerns how you describe yourself and respond to ordinary situations. In this setting, an
      outline or explanation can make your reasoning easier for others to follow. As an example,
      drafting a short guide for an activity, begin with the sequence and include the context a
      newcomer would ask for. Notice whether the action fits the people involved as well as the
      practical task. A caution is that a polished format still needs a reader who can use it.
      However, your response at home may differ from your response at work; leave room for that
      difference. Try to ask a reader to restate the main point and revise the passage they found
      confusing. Review the result after one real attempt before making the practice routine. An
      auxiliary placement adds a perspective to the broader reading; it cannot establish someone’s
      character from a single symbol.
    advice:
      - ask a reader to restate the main point and revise the passage they found confusing
    do:
      - Note observations
    dont:
      - Rush conclusions
  meta:
    author: t23-ziwei-editorial-v1
    reviewed_by: null
    version: 1
    status: published
