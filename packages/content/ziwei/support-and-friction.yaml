  zh:
    title: 天马在命宫：移动与切换
    summary: 你在自我表达上，可以留意移动与切换的作用。
    body: 你在自我表达上，可以留意移动与切换怎样改变参与方式。天马（这里象征移动与切换的辅助星）位于命宫（观察你怎样认识自己和回应日常处境的领域），转换环境可能给你新的信息，也需要认真安排切换成本。这类辅助信号用来补充主要倾向，不宜单独给你或相关的人贴标签。例如，去不同地点参与工作时，提前确认交通和能带走的资料；再看这一步在当前关系或任务里是否方便落实。忙于移动不等于目标有进展。不过，别用一个盘中标签覆盖自己在不同场合的变化。建议每次换环境前，写下这一趟要完成什么，先观察一次实际结果，再商量是否沿用这项安排。
