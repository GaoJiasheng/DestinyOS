  zh:
    title: 紫微在父母宫：代际沟通
    summary: 你倾向以统筹方向与承担责任的方式处理代际沟通。
    body: 你在代际沟通上，倾向先从统筹方向与承担责任入手。紫微（象征统筹方向与承担责任的主星）落在父母宫（观察你与长辈、师长及权威角色交换经验的方式的领域），把这种习惯带到这个具体场景。你倾向先建立整体框架，再把事情交给合适的人推进。例如，收到长辈或导师关于下一步的意见时，先问清对方担心什么，再说明你已有的信息和选择理由。如果总把最后决定留给自己，别人可能没有充分表达的空间。尊重经验和保留自主可以并行，这里不评价家庭成员的品格，也不把分歧解释为关系好坏。可以先公开判断标准，再邀请别人指出一个遗漏；同时，约定一次有时间边界的交流，围绕一个实际问题讨论，用现实反馈判断这个角度是否贴合你。
    advice:
      - 约定一次有时间边界的交流，围绕一个实际问题讨论
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Zǐ Wēi in the Parents Palace: communication across experience levels'
    summary: You may approach communication across experience levels through setting direction and
      holding responsibility.
    body:
      You may bring setting direction and holding responsibility to communication across experience
      levels. Zǐ Wēi  is a major star associated with this style of attention. Here it occupies
      the Parents Palace (fù mǔ gōng) — a chart area describing how you exchange experience with elders,
      mentors and people in positions of authority. You often look for a coherent direction before
      deciding who should carry each part of a task. When an elder or mentor recommends a next step,
      ask what concern lies behind the advice before explaining the information guiding your choice.
      Keeping every final decision for yourself can make capable people feel unheard. Respect for
      experience can coexist with autonomy; disagreement alone does not measure a family member’s
      character or the quality of a bond. Try explaining your decision criteria before asking
