    title: 天机在兄弟宫：同辈互助
    summary: 你倾向以观察变化与设计方法的方式处理同辈互助。
    body: 你在同辈互助上，倾向先从观察变化与设计方法入手。天机（象征观察变化与设计方法的主星）落在兄弟宫（观察同辈、手足与熟悉伙伴之间的支持方式的领域），把这种习惯带到这个具体场景。你容易看见流程里的细小差异，并想出几种替代办法。例如，几位熟悉的人商量共同出行时，留意谁负责搜集信息、谁安排时间，以及你想参与哪一部分。频繁修改路线容易消耗执行时间，思考也需要一个停点。亲近程度和资源共享不是同一回事，彼此的时间也可能很不一样。不妨给每次比较设定期限，只验证一个最关键的假设；同时，先问对方是否方便，再约定具体的互助范围，用现实反馈判断这个角度是否贴合你。
    advice:
      - 先问对方是否方便，再约定具体的互助范围
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Tiān Jī in the Siblings Palace: support among peers'
    summary: You may approach support among peers through adaptive planning and practical ingenuity.
    body: 'You may bring adaptive planning and practical ingenuity to support among peers. Tiān Jī
      is a major star associated with this style of attention. Here it occupies the Siblings Palace (xiōng dì
      gōng) — a chart area describing how siblings, contemporaries and familiar peers share support.
      You may notice small inefficiencies and quickly imagine several workable alternatives. Imagine
      familiar peers arranging a shared outing: one gathers information, another coordinates dates,
      and you decide which part you actually want to handle. Repeatedly redesigning a workable plan
      can consume the time needed to test it. Closeness does not imply equal availability, similar
      income or an obligation to share every resource. Consider setting a decision deadline and
      testing the most important unknown first. A useful next step is to ask about availability
      before agreeing on a specific and manageable exchange of help. Let the response you receive
      guide a small adjustment; the placement offers a question to explore in your own
      circumstances.'
    advice:
      - Ask about availability before agreeing on a specific and manageable exchange of help
    do:
      - Note observations
    dont:
      - Rush conclusions
