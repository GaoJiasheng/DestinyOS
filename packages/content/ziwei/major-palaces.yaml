    summary: 你倾向以统筹方向与承担责任的方式处理资源安排。
    body: 你在资源安排上，倾向先从统筹方向与承担责任入手。紫微（象征统筹方向与承担责任的主星）落在财帛宫（观察日常收支、时间成本与资源分配的习惯的领域），把这种习惯带到这个具体场景。你倾向先建立整体框架，再把事情交给合适的人推进。例如，准备参加一门课程时，把费用、通勤和练习时间放在同一张清单上，再看这份投入是否适合现在的生活。如果总把最后决定留给自己，别人可能没有充分表达的空间。象征上的资源倾向不代表收入水平，预算仍要依据实际收支和已有承诺。可以先公开判断标准，再邀请别人指出一个遗漏；同时，选一项可调整的日常开支，记录用途与满意度，用现实反馈判断这个角度是否贴合你。
    advice:
      - 选一项可调整的日常开支，记录用途与满意度
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Zǐ Wēi in the Wealth Palace: managing everyday resources'
    summary: You may approach managing everyday resources through setting direction and holding
      responsibility.
    body:
      You may bring setting direction and holding responsibility to managing everyday resources. Zǐ
      Wēi  is a major star associated with this style of attention. Here it occupies the Wealth Palace
      (cái bó gōng) — a chart area describing habits around ordinary spending, time costs and
      resource allocation. You often look for a coherent direction before deciding who should carry
      each part of a task. Before joining a course, list its fee, travel demands and practice hours
      together rather than judging the cost from the price alone. Keeping every final decision for
      yourself can make capable people feel unheard. A resource symbol does not measure your income;
      practical plans depend on actual costs, available funds and existing commitments. Try
      explaining your decision criteria before asking someone to challenge one assumption. A useful
      next step is to review one flexible expense and note what it delivered compared with what you
      expected. Let the response you receive guide a small adjustment; the placement offers a
      question to explore in your own circumstances.
    advice:
      - Review one flexible expense and note what it delivered compared with what you expected
    do:
      - Note observations
