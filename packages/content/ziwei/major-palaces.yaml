- id: ziwei.major.siblings.zi_wei
  system: ziwei
  section: love_family
  topic: major_siblings_zi_wei
  when:
    path: palaces[key=siblings].majorStars[key=zi_wei].key
    eq: zi_wei
  weight: 65
  polarity: neutral
  tags:
    - plain
  exclusive_with: []
  zh:
    title: 紫微在兄弟宫：同辈互助
    summary: 你倾向以统筹方向与承担责任的方式处理同辈互助。
    body: 你在同辈互助上，倾向先从统筹方向与承担责任入手。紫微（象征统筹方向与承担责任的主星）落在兄弟宫（观察同辈、手足与熟悉伙伴之间的支持方式的领域），把这种习惯带到这个具体场景。你倾向先建立整体框架，再把事情交给合适的人推进。例如，几位熟悉的人商量共同出行时，留意谁负责搜集信息、谁安排时间，以及你想参与哪一部分。如果总把最后决定留给自己，别人可能没有充分表达的空间。亲近程度和资源共享不是同一回事，彼此的时间也可能很不一样。可以先公开判断标准，再邀请别人指出一个遗漏；同时，先问对方是否方便，再约定具体的互助范围，用现实反馈判断这个角度是否贴合你。
    advice:
      - 先问对方是否方便，再约定具体的互助范围
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Zǐ Wēi in the Siblings Palace: support among peers'
    summary: You may approach support among peers through setting direction and holding responsibility.
    body: 'You may bring setting direction and holding responsibility to support among peers. Zǐ Wēi
      is a major star associated with this style of attention. Here it occupies the Siblings Palace (xiōng
      dì gōng) — a chart area describing how siblings, contemporaries and familiar peers share
      support. You often look for a coherent direction before deciding who should carry each part of
      a task. Imagine familiar peers arranging a shared outing: one gathers information, another
      coordinates dates, and you decide which part you actually want to handle. Keeping every final
      decision for yourself can make capable people feel unheard. Closeness does not imply equal
      availability, similar income or an obligation to share every resource. Try explaining your
      decision criteria before asking someone to challenge one assumption. A useful next step is to
      ask about availability before agreeing on a specific and manageable exchange of help. Let the
      response you receive guide a small adjustment; the placement offers a question to explore in
      your own circumstances.'
    advice:
      - Ask about availability before agreeing on a specific and manageable exchange of help
    do:
      - Note observations
    dont:
      - Rush conclusions
  meta:
    author: t23-ziwei-editorial-v1
    reviewed_by: null
    version: 2
    status: published
