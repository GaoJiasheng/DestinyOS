# // DESIGN-GAP: Twenty-four structurally possible major-star pairs receive life-palace units; six additional career applications bring the topic to the estimated thirty entries.
- id: ziwei.pair.life.zi_wei_tian_fu
  system: ziwei
  section: life_palace
  topic: pair_life_zi_wei_tian_fu
  when:
    all:
      - path: palaces[key=life].majorStars[key=zi_wei].key
        eq: zi_wei
      - path: palaces[key=life].majorStars[key=tian_fu].key
        eq: tian_fu
  weight: 90
  polarity: neutral
  tags:
    - plain
  exclusive_with: []
  zh:
    title: 紫微与天府同宫：两种偏好的配合
    summary: 你在自我表达上，倾向同时运用统筹方向与承担责任和储备意识与稳定管理。
    body: 你在自我表达上，可能需要让两种不同的偏好彼此配合。紫微（象征统筹方向与承担责任的主星）与天府（象征储备意识与稳定管理的主星）同在命宫（观察你怎样认识自己和回应日常处境的领域），说明这些线索出现在同一生活场景。你倾向先建立整体框架，再把事情交给合适的人推进；你往往先确认手里的资源，再考虑怎样让日常运转更稳。比如，一项共同任务既要有人确定下一步，也要有人照顾参与者的理解程度，你可以观察自己先调动哪一种做法。两颗星并不需要时时表现得一样强。建议把推进和核对安排成两个步骤：先用你较顺手的方式起步，再让另一种偏好补充遗漏，结束后问问实际效果。
    advice:
      - 把两种偏好分别用于推进和核对，观察配合效果。
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Zǐ Wēi and Tiān Fǔ: coordinating two preferences'
    summary:
      You may combine setting direction and holding responsibility with stewardship, reserves and
      dependable administration in your everyday identity.
    body: 'You may find two approaches competing for attention in your everyday identity. Zǐ Wēi —
      a symbol of setting direction and holding responsibility — shares the Life Palace (mìng gōng, the area
      for how you describe yourself and respond to ordinary situations) with Tiān Fǔ  — a symbol
      of stewardship, reserves and dependable administration. You often look for a coherent
      direction before deciding who should carry each part of a task. You may prefer understanding
      existing resources before making a change that others will rely on. Picture a shared task that
      needs both a next step and an explanation people can follow. Notice which approach you use to
      get started and which one helps when progress stalls. A pair describes interacting preferences
      rather than twice as much of one quality. Try assigning the two approaches different moments:
      use one to begin, then use the other to review what was missed. Ask a collaborator which part
      helped, and adjust the sequence instead of forcing both habits into every decision.'
    advice:
      - Give each preference a different role in starting and reviewing a task.
    do:
      - Note observations
    dont:
      - Rush conclusions
  meta:
    author: t23-ziwei-editorial-v1
    reviewed_by: null
    version: 2
    status: published
