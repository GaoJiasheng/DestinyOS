    title: 'Tiān Jī and Tài Yīn: coordinating two preferences'
    summary: You may combine adaptive planning and practical ingenuity with careful observation and
      quiet preparation in organizing work.
    body: 'You may find two approaches competing for attention in organizing work. Tiān Jī — a
      symbol of adaptive planning and practical ingenuity — shares the Career Palace (guān lù gōng, the area
      for how you take responsibility, learn professionally and arrange a task) with Tài Yīn —
      a symbol of careful observation and quiet preparation. You may notice small inefficiencies and
      quickly imagine several workable alternatives. You may notice needs people have not voiced and
      contribute through thoughtful preparation behind the scenes. Picture a shared task that needs
      both a next step and an explanation people can follow. Notice which approach you use to get
      started and which one helps when progress stalls. A pair describes interacting preferences
      rather than twice as much of one quality. Try assigning the two approaches different moments:
      use one to begin, then use the other to review what was missed. Ask a collaborator which part
      helped, and adjust the sequence instead of forcing both habits into every decision.'
    advice:
      - Give each preference a different role in starting and reviewing a task.
    do:
      - Note observations
    dont:
      - Rush conclusions
