    summary: 你在自我表达上，倾向同时运用边界意识与价值选择和独立决断与应对挑战。
    body: 你在自我表达上，可能需要让两种不同的偏好彼此配合。廉贞（象征边界意识与价值选择的主星）与七杀（象征独立决断与应对挑战的主星）同在命宫（观察你怎样认识自己和回应日常处境的领域），说明这些线索出现在同一生活场景。你倾向认真分辨什么值得投入，也在意做法是否符合自己的原则；你容易在复杂局面里抓住优先事项，愿意承担有边界的困难任务。比如，一项共同任务既要有人确定下一步，也要有人照顾参与者的理解程度，你可以观察自己先调动哪一种做法。两颗星并不需要时时表现得一样强。建议把推进和核对安排成两个步骤：先用你较顺手的方式起步，再让另一种偏好补充遗漏，结束后问问实际效果。
    advice:
      - 把两种偏好分别用于推进和核对，观察配合效果。
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Lián Zhēn and Qī Shā: coordinating two preferences'
    summary:
      You may combine personal boundaries and value based choices with independent decisions and
      focused responses to a challenge in your everyday identity.
    body: 'You may find two approaches competing for attention in your everyday identity. Lián Zhēn
      — a symbol of personal boundaries and value based choices — shares the Life Palace (mìng gōng, the area
      for how you describe yourself and respond to ordinary situations) with Qī Shā — a symbol
      of independent decisions and focused responses to a challenge. You may invest strongly in
      choices that express your values and notice when a boundary feels blurred. You may cut through
      competing demands, identify a priority and take ownership of a difficult task. Picture a
      shared task that needs both a next step and an explanation people can follow. Notice which
      approach you use to get started and which one helps when progress stalls. A pair describes
      interacting preferences rather than twice as much of one quality. Try assigning the two
      approaches different moments: use one to begin, then use the other to review what was missed.
      Ask a collaborator which part helped, and adjust the sequence instead of forcing both habits
      into every decision.'
    advice:
      - Give each preference a different role in starting and reviewing a task.
    do:
      - Note observations
    dont:
      - Rush conclusions
