    dont:
      - 仓促定论
  en:
    title: 'Ke Transformation in Children Palace: the decadal layer'
    summary:
      You can examine explanation, learning and constructive feedback in mentoring and nurturing
      through the decadal layer.
    body:
      'You can reflect on explanation, learning and constructive feedback in mentoring and nurturing
      through this decadal layer. Fame transformation (huà kē) — a transformation symbol for that emphasis — is
      linked to a star in the Children Palace (zǐ nǚ gōng), the area concerned with your approach to younger
      people, learners and projects that need patient development. The decadal layer uses the
      current phase parameters and offers a longer period for reviewing commitments. In practical
      terms, explaining a process so someone can understand the method may support cooperation more
      than showing an outcome alone. Think of helping a new colleague with a first piece of work:
      ask whether they want a demonstration or room to attempt it themselves. However, this theme
      also applies to teaching and creative work; it does not prescribe parenthood or replace a
      learner’s own pace. Try to prepare a small example someone can restate and invite feedback on
      what remains unclear. Check the step against existing commitments and what you observe
      afterward. A timing layer changes the scope of reflection without identifying a particular
      event or deciding its outcome.'
    advice:
      - prepare a small example someone can restate and invite feedback on what remains unclear
    do:
      - Note observations
    dont:
      - Rush conclusions
