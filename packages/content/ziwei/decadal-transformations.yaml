    summary: 你可以在陪伴与培育中留意接收支持与参与机会的课题。
    body: 你可以在陪伴与培育中留意接收支持与参与机会，在当前较长阶段里观察它是否反复出现。化禄（四化中象征接收支持与参与机会的标记）由当前大限参数确定，并关联到本盘这处星曜，落在子女宫（观察你对晚辈、学习者以及需要持续培育的事情的投入的领域）。一份邀请、共享材料或愿意帮忙的人，可能让你更容易加入一项安排。例如，指导新同事完成第一份作品时，不妨询问对方想先独立尝试，还是希望你示范一个步骤。不过，这里也适用于教学与创作，不推断生育安排；被帮助的人仍有自己的节奏。建议先问清支持能用在哪里，选择一项适合余力的参与，再核对这一步是否符合已经答应的事项；时间层次改变观察范围，不替你预告某种具体结果。
    advice:
      - 先问清支持能用在哪里，选择一项适合余力的参与
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Lu Transformation in Children Palace: the decadal layer'
    summary:
      You can examine access, support and opportunities to participate in mentoring and nurturing
      through the decadal layer.
    body: 'You can reflect on access, support and opportunities to participate in mentoring and
      nurturing through this decadal layer. Prosperity transformation (huà lù) — a transformation symbol for that emphasis
      — is linked to a star in the Children Palace (zǐ nǚ gōng), the area concerned with your approach to
      younger people, learners and projects that need patient development. The decadal layer uses
      the current phase parameters and offers a longer period for reviewing commitments. In
      practical terms, an invitation, shared material or someone willing to help may make
      participation more accessible. Think of helping a new colleague with a first piece of work:
      ask whether they want a demonstration or room to attempt it themselves. However, this theme
      also applies to teaching and creative work; it does not prescribe parenthood or replace a
      learner’s own pace. Try to identify what the support is for and choose a form of participation
      that fits your capacity. Check the step against existing commitments and what you observe
      afterward. A timing layer changes the scope of reflection without identifying a particular
      event or deciding its outcome.'
    advice:
      - identify what the support is for and choose a form of participation that fits your capacity
    do:
      - Note observations
    dont:
      - Rush conclusions
