  en:
    title: 'Lu Transformation in Property Palace: the decadal layer'
    summary:
      You can examine access, support and opportunities to participate in home and shared space
      through the decadal layer.
    body:
      You can reflect on access, support and opportunities to participate in home and shared space
      through this decadal layer. Prosperity transformation (huà lù) — a transformation symbol for that emphasis — is
      linked to a star in the Property Palace (tián zhái gōng), the area concerned with how living arrangements,
      shared surroundings and a sense of settlement are maintained. The decadal layer uses the
      current phase parameters and offers a longer period for reviewing commitments. In practical
      terms, an invitation, shared material or someone willing to help may make participation more
      accessible. When rearranging a desk area or shared room, ask whether others most need quiet,
      storage or an easier route through the space. However, the quality of home life depends on
      boundaries and habits as well as objects; this symbol does not indicate ownership outcomes.
      Try to identify what the support is for and choose a form of participation that fits your
      capacity. Check the step against existing commitments and what you observe afterward. A timing
      layer changes the scope of reflection without identifying a particular event or deciding its
      outcome.
