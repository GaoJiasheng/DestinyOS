    body: 你可以在自我表达中留意说明方法与获得反馈，在当前较长阶段里观察它是否反复出现。化科（四化中象征说明方法与获得反馈的标记）由当前大限参数确定，并关联到本盘这处星曜，落在命宫（观察你怎样认识自己和回应日常处境的领域）。把过程说明白、让别人理解你的方法，可能比只展示结果更能改善配合。例如，接到陌生任务时，先观察自己是急于定方向，还是先询问细节。不过，别用一个盘中标签覆盖自己在不同场合的变化。建议准备一个可复述的小例子，邀请别人指出不清楚的地方，再核对这一步是否符合已经答应的事项；时间层次改变观察范围，不替你预告某种具体结果。
