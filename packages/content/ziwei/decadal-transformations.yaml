      experience levels through this decadal layer. Fame transformation (huà kē) — a transformation symbol for that
      emphasis — is linked to a star in the Parents Palace (fù mǔ gōng), the area concerned with how you
      exchange experience with elders, mentors and people in positions of authority. The decadal
      layer uses the current phase parameters and offers a longer period for reviewing commitments.
      In practical terms, explaining a process so someone can understand the method may support
      cooperation more than showing an outcome alone. When an elder or mentor recommends a next
      step, ask what concern lies behind the advice before explaining the information guiding your
