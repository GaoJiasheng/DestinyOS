    summary: 你可以在陪伴与培育中留意主导责任与决策分工的课题。
    body: 你可以在陪伴与培育中留意主导责任与决策分工，在当前较长阶段里观察它是否反复出现。化权（四化中象征主导责任与决策分工的标记）由当前大限参数确定，并关联到本盘这处星曜，落在子女宫（观察你对晚辈、学习者以及需要持续培育的事情的投入的领域）。你可能更关注谁来决定下一步，以及负责的人是否有足够信息与时间。例如，指导新同事完成第一份作品时，不妨询问对方想先独立尝试，还是希望你示范一个步骤。不过，这里也适用于教学与创作，不推断生育安排；被帮助的人仍有自己的节奏。建议把可以决定、需要协商和暂缓的事项分开说明，再核对这一步是否符合已经答应的事项；时间层次改变观察范围，不替你预告某种具体结果。
