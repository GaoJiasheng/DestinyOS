    body: 你可以在代际沟通中留意接收支持与参与机会，在当前较长阶段里观察它是否反复出现。化禄（四化中象征接收支持与参与机会的标记）由当前大限参数确定，并关联到本盘这处星曜，落在父母宫（观察你与长辈、师长及权威角色交换经验的方式的领域）。一份邀请、共享材料或愿意帮忙的人，可能让你更容易加入一项安排。例如，收到长辈或导师关于下一步的意见时，先问清对方担心什么，再说明你已有的信息和选择理由。不过，尊重经验和保留自主可以并行，这里不评价家庭成员的品格，也不把分歧解释为关系好坏。建议先问清支持能用在哪里，选择一项适合余力的参与，再核对这一步是否符合已经答应的事项；时间层次改变观察范围，不替你预告某种具体结果。
    advice:
      - 先问清支持能用在哪里，选择一项适合余力的参与
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Lu Transformation in Parents Palace: the decadal layer'
    summary:
      You can examine access, support and opportunities to participate in communication across
      experience levels through the decadal layer.
    body:
      You can reflect on access, support and opportunities to participate in communication across
      experience levels through this decadal layer. Prosperity transformation (huà lù) — a transformation symbol for that
      emphasis — is linked to a star in the Parents Palace (fù mǔ gōng), the area concerned with how you
      exchange experience with elders, mentors and people in positions of authority. The decadal
      layer uses the current phase parameters and offers a longer period for reviewing commitments.
      In practical terms, an invitation, shared material or someone willing to help may make
      participation more accessible. When an elder or mentor recommends a next step, ask what
      concern lies behind the advice before explaining the information guiding your choice. However,
      respect for experience can coexist with autonomy; disagreement alone does not measure a family
      member’s character or the quality of a bond. Try to identify what the support is for and
      choose a form of participation that fits your capacity. Check the step against existing
      commitments and what you observe afterward. A timing layer changes the scope of reflection
      without identifying a particular event or deciding its outcome.
    advice:
      - identify what the support is for and choose a form of participation that fits your capacity
    do:
      - Note observations
    dont:
      - Rush conclusions
