    body: 你可以在陪伴与培育中留意说明方法与获得反馈，在当前较长阶段里观察它是否反复出现。化科（四化中象征说明方法与获得反馈的标记）由当前大限参数确定，并关联到本盘这处星曜，落在子女宫（观察你对晚辈、学习者以及需要持续培育的事情的投入的领域）。把过程说明白、让别人理解你的方法，可能比只展示结果更能改善配合。例如，指导新同事完成第一份作品时，不妨询问对方想先独立尝试，还是希望你示范一个步骤。不过，这里也适用于教学与创作，不推断生育安排；被帮助的人仍有自己的节奏。建议准备一个可复述的小例子，邀请别人指出不清楚的地方，再核对这一步是否符合已经答应的事项；时间层次改变观察范围，不替你预告某种具体结果。
