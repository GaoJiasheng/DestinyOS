    body: 你可以在居住与归属中留意接收支持与参与机会，在当前较长阶段里观察它是否反复出现。化禄（四化中象征接收支持与参与机会的标记）由当前大限参数确定，并关联到本盘这处星曜，落在田宅宫（观察居住环境、共同空间与安定感的经营的领域）。一份邀请、共享材料或愿意帮忙的人，可能让你更容易加入一项安排。例如，调整工作角或公共区域时，先听听同住者需要安静、收纳还是方便走动，再决定布置方式。不过，居住品质也来自边界和使用习惯，不以房产数量衡量，也不从命盘推断产权结果。建议先问清支持能用在哪里，选择一项适合余力的参与，再核对这一步是否符合已经答应的事项；时间层次改变观察范围，不替你预告某种具体结果。
