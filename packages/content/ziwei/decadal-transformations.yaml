    body: 你可以在内在满足中留意接收支持与参与机会，在当前较长阶段里观察它是否反复出现。化禄（四化中象征接收支持与参与机会的标记）由当前大限参数确定，并关联到本盘这处星曜，落在福德宫（观察休闲偏好、精神空间与获得满足的方式的领域）。一份邀请、共享材料或愿意帮忙的人，可能让你更容易加入一项安排。例如，周末没有待办催促时，留意你自然选择阅读、独处、见朋友还是做一个有手感的小作品。不过，休息不需要变成绩效项目，喜欢的事也可以没有产出，不必用别人的标准来评价。建议先问清支持能用在哪里，选择一项适合余力的参与，再核对这一步是否符合已经答应的事项；时间层次改变观察范围，不替你预告某种具体结果。
