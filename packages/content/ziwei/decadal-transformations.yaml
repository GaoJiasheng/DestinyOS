      invitation, shared material or someone willing to help may make participation more accessible.
      Before joining a course, list its fee, travel demands and practice hours together rather than
      judging the cost from the price alone. However, a resource symbol does not measure your
      income; practical plans depend on actual costs, available funds and existing commitments. Try
