      - 先问清支持能用在哪里，选择一项适合余力的参与
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Lu Transformation in Wellbeing Palace: the decadal layer'
    summary:
      You can examine access, support and opportunities to participate in your inner sources of
      satisfaction through the decadal layer.
    body:
      You can reflect on access, support and opportunities to participate in your inner sources of
      satisfaction through this decadal layer. Prosperity transformation (huà lù) — a transformation symbol for that
      emphasis — is linked to a star in the Wellbeing Palace (fú dé gōng), the area concerned with the interests,
      mental space and leisure practices that feel restorative. The decadal layer uses the current
      phase parameters and offers a longer period for reviewing commitments. In practical terms, an
      invitation, shared material or someone willing to help may make participation more accessible.
      During a weekend without urgent tasks, notice whether you gravitate toward reading, quiet
      time, company or making something tangible. However, leisure does not need to become another
      performance task; an activity may be valuable without producing a visible result. Try to
      identify what the support is for and choose a form of participation that fits your capacity.
      Check the step against existing commitments and what you observe afterward. A timing layer
      changes the scope of reflection without identifying a particular event or deciding its
      outcome.
    advice:
      - identify what the support is for and choose a form of participation that fits your capacity
    do:
      - Note observations
    dont:
