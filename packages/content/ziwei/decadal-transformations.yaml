    title: 'Ke Transformation in Life Palace: the decadal layer'
    summary:
      You can examine explanation, learning and constructive feedback in your everyday identity
      through the decadal layer.
    body:
      You can reflect on explanation, learning and constructive feedback in your everyday identity
      through this decadal layer. Fame transformation (huà kē) — a transformation symbol for that emphasis — is
      linked to a star in the Life Palace (mìng gōng), the area concerned with how you describe yourself and
      respond to ordinary situations. The decadal layer uses the current phase parameters and offers
      a longer period for reviewing commitments. In practical terms, explaining a process so someone
      can understand the method may support cooperation more than showing an outcome alone. When a
      new task arrives, notice whether you first seek a direction, gather details or ask what others
      need. However, your response at home may differ from your response at work; leave room for
      that difference. Try to prepare a small example someone can restate and invite feedback on
      what remains unclear. Check the step against existing commitments and what you observe
      afterward. A timing layer changes the scope of reflection without identifying a particular
      event or deciding its outcome.
    advice:
      - prepare a small example someone can restate and invite feedback on what remains unclear
    do:
      - Note observations
    dont:
      - Rush conclusions
