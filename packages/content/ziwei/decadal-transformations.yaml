      - 把可以决定、需要协商和暂缓的事项分开说明
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Quan Transformation in Children Palace: the decadal layer'
    summary: You can examine ownership, responsibility and decision roles in mentoring and nurturing
      through the decadal layer.
    body:
      'You can reflect on ownership, responsibility and decision roles in mentoring and nurturing
      through this decadal layer. Power transformation (huà quán) — a transformation symbol for that emphasis — is
      linked to a star in the Children Palace (zǐ nǚ gōng), the area concerned with your approach to younger
      people, learners and projects that need patient development. The decadal layer uses the
      current phase parameters and offers a longer period for reviewing commitments. In practical
      terms, you may pay closer attention to who decides the next step and whether the responsible
      person has enough information and time. Think of helping a new colleague with a first piece of
      work: ask whether they want a demonstration or room to attempt it themselves. However, this
      theme also applies to teaching and creative work; it does not prescribe parenthood or replace
      a learner’s own pace. Try to distinguish what can be decided, what needs consultation and what
      should wait. Check the step against existing commitments and what you observe afterward. A
      timing layer changes the scope of reflection without identifying a particular event or
      deciding its outcome.'
    advice:
      - distinguish what can be decided, what needs consultation and what should wait
