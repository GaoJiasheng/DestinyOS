  zh:
    title: 交友宫的表达条件：给磨合留空间
    summary: 你在合作网络上，可以先改善表达与参与的条件。
    body: 你在合作网络上，可以先改善表达与参与的条件。交友宫（观察朋友、团队伙伴和协作关系中的来往方式的领域）中至少一颗主星显示不或陷（传统亮度中较需要情境支持的状态），因此不能把同宫的所有线索都当作轻松发挥。它提示你观察阻力出现在哪里，不是对相关人的能力下评价。例如，几个伙伴准备一起办活动时，你可以先区分谁提供点子、谁负责执行、谁只愿意偶尔帮忙。当沟通渠道、准备时间或参与范围不合适时，即使原来的方法有长处，也可能需要调整。友谊和工作约定可以同时存在，但不宜用熟悉感代替清晰的交接与权限。建议把一项共同任务的负责人与截止点写清楚，先选一个能改善的条件，再看一次实际互动是否更顺畅；其他主星的亮度要逐颗核对，不从这一条推断整个宫位都处于相同状态。
    advice:
      - 把一项共同任务的负责人与截止点写清楚
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Expression conditions in Friends Palace: allow adjustment'
    summary: You can improve the conditions for participation in working with your network before
      judging the result.
    body: You can examine the conditions around working with your network before evaluating your own
      response. At least one major star in the 交友宫 (jiāo yǒu gōng) — the area for exchanges among
      friends, team members and people you collaborate with — carries bu or xian brightness. These
      traditional labels describe a more context dependent expression, so the ordinary star reading
      benefits from a closer look at available support. If a group plans an event, distinguish those
      offering ideas, those owning tasks and those available only for occasional support. If
      communication, preparation time or the scope of participation does not fit the task, a useful
      preference may be harder to express. Friendship can coexist with a work agreement, but
      familiarity should not substitute for a clear handover or scope of authority. Try to write
      down the owner and completion point for one shared task. Adjust one practical condition and
      compare the next interaction with the previous one. Other stars in the same area may have
      different brightness, and this modifier should not be generalized to every symbol or every
      person involved.
    advice:
      - Write down the owner and completion point for one shared task
    do:
      - Note observations
    dont:
      - Rush conclusions
  meta:
    author: t23-ziwei-editorial-v1
    reviewed_by: null
    version: 1
    status: published
