# Original bilingual editorial content for T-23; sources are not quotations.
# // DESIGN-GAP: Non-life restrained brightness is supplied as a reusable palace modifier. It refers to at least one matched star and never applies its state to all stars in that palace.
- id: ziwei.brightness.siblings.restrained
  system: ziwei
  section: love_family
  topic: brightness_siblings
  when:
    path: palaces[key=siblings].majorStars[*].brightness
    in:
      - bu
      - xian
  weight: 40
  polarity: mixed
  tags:
    - plain
  exclusive_with: []
  zh:
    title: 兄弟宫的表达条件：给磨合留空间
    summary: 你在同辈互助上，可以先改善表达与参与的条件。
    body: 你在同辈互助上，可以先改善表达与参与的条件。兄弟宫（观察同辈、手足与熟悉伙伴之间的支持方式的领域）中至少一颗主星显示不或陷（传统亮度中较需要情境支持的状态），因此不能把同宫的所有线索都当作轻松发挥。它提示你观察阻力出现在哪里，不是对相关人的能力下评价。例如，几位熟悉的人商量共同出行时，留意谁负责搜集信息、谁安排时间，以及你想参与哪一部分。当沟通渠道、准备时间或参与范围不合适时，即使原来的方法有长处，也可能需要调整。亲近程度和资源共享不是同一回事，彼此的时间也可能很不一样。建议先问对方是否方便，再约定具体的互助范围，先选一个能改善的条件，再看一次实际互动是否更顺畅；其他主星的亮度要逐颗核对，不从这一条推断整个宫位都处于相同状态。
    advice:
      - 先问对方是否方便，再约定具体的互助范围
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Expression conditions in Siblings Palace: allow adjustment'
    summary:
      You can improve the conditions for participation in support among peers before judging the
      result.
    body: 'You can examine the conditions around support among peers before evaluating your own
      response. At least one major star in the 兄弟宫 (xiōng dì gōng) — the area for how siblings,
      contemporaries and familiar peers share support — carries bu or xian brightness. These
      traditional labels describe a more context dependent expression, so the ordinary star reading
      benefits from a closer look at available support. Imagine familiar peers arranging a shared
      outing: one gathers information, another coordinates dates, and you decide which part you
      actually want to handle. If communication, preparation time or the scope of participation does
      not fit the task, a useful preference may be harder to express. Closeness does not imply equal
      availability, similar income or an obligation to share every resource. Try to ask about
      availability before agreeing on a specific and manageable exchange of help. Adjust one
      practical condition and compare the next interaction with the previous one. Other stars in the
      same area may have different brightness, and this modifier should not be generalized to every
      symbol or every person involved.'
    advice:
      - Ask about availability before agreeing on a specific and manageable exchange of help
    do:
      - Note observations
    dont:
      - Rush conclusions
  meta:
    author: t23-ziwei-editorial-v1
    reviewed_by: null
    version: 1
    status: published
- id: ziwei.brightness.spouse.restrained
  system: ziwei
  section: love_family
  topic: brightness_spouse
  when:
    path: palaces[key=spouse].majorStars[*].brightness
    in:
      - bu
      - xian
  weight: 40
  polarity: mixed
  tags:
    - plain
  exclusive_with: []
  zh:
    title: 夫妻宫的表达条件：给磨合留空间
    summary: 你在亲密沟通上，可以先改善表达与参与的条件。
    body: 你在亲密沟通上，可以先改善表达与参与的条件。夫妻宫（观察亲密关系中的协商方式与期待的领域）中至少一颗主星显示不或陷（传统亮度中较需要情境支持的状态），因此不能把同宫的所有线索都当作轻松发挥。它提示你观察阻力出现在哪里，不是对相关人的能力下评价。例如，你与伴侣或正在了解的人安排周末时，可以先分别说出需要安静、交流还是一起做事。当沟通渠道、准备时间或参与范围不合适时，即使原来的方法有长处，也可能需要调整。关系中的星象描述互动课题，不替你判断某个人是否合适，也不要求你进入某种关系。建议把一个期待改写成对方能回应的具体请求，先选一个能改善的条件，再看一次实际互动是否更顺畅；其他主星的亮度要逐颗核对，不从这一条推断整个宫位都处于相同状态。
    advice:
      - 把一个期待改写成对方能回应的具体请求
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Expression conditions in Spouse Palace: allow adjustment'
    summary: You can improve the conditions for participation in negotiation in close relationships
      before judging the result.
    body: You can examine the conditions around negotiation in close relationships before evaluating
      your own response. At least one major star in the 夫妻宫 (fū qī gōng) — the area for the
      expectations and conversations that shape an intimate partnership — carries bu or xian
      brightness. These traditional labels describe a more context dependent expression, so the
      ordinary star reading benefits from a closer look at available support. While arranging a
      weekend with a partner or someone you are getting to know, compare what each person needs from
      the time together. If communication, preparation time or the scope of participation does not
      fit the task, a useful preference may be harder to express. A symbolic relationship theme
      cannot decide compatibility or tell you what kind of relationship to pursue. Try to turn one
      expectation into a request the other person can clearly respond to. Adjust one practical
      condition and compare the next interaction with the previous one. Other stars in the same area
      may have different brightness, and this modifier should not be generalized to every symbol or
      every person involved.
    advice:
      - Turn one expectation into a request the other person can clearly respond to
    do:
      - Note observations
    dont:
      - Rush conclusions
  meta:
    author: t23-ziwei-editorial-v1
    reviewed_by: null
    version: 1
    status: published
- id: ziwei.brightness.children.restrained
  system: ziwei
  section: love_family
  topic: brightness_children
  when:
    path: palaces[key=children].majorStars[*].brightness
    in:
      - bu
      - xian
  weight: 40
  polarity: mixed
  tags:
