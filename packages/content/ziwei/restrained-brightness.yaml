    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Expression conditions in Wellbeing Palace: allow adjustment'
    summary: You can improve the conditions for participation in your inner sources of satisfaction
      before judging the result.
    body: You can examine the conditions around your inner sources of satisfaction before evaluating
      your own response. At least one major star in the 福德宫 (fú dé gōng) — the area for the
      interests, mental space and leisure practices that feel restorative — carries bu or xian
      brightness. These traditional labels describe a more context dependent expression, so the
      ordinary star reading benefits from a closer look at available support. During a weekend
      without urgent tasks, notice whether you gravitate toward reading, quiet time, company or
      making something tangible. If communication, preparation time or the scope of participation
      does not fit the task, a useful preference may be harder to express. Leisure does not need to
      become another performance task; an activity may be valuable without producing a visible
      result. Try to protect a little time for an interest without a deliverable and note how you
      feel afterward. Adjust one practical condition and compare the next interaction with the
      previous one. Other stars in the same area may have different brightness, and this modifier
      should not be generalized to every symbol or every person involved.
