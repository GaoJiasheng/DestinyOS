  zh:
    title: 父母宫的表达条件：给磨合留空间
    summary: 你在代际沟通上，可以先改善表达与参与的条件。
    body: 你在代际沟通上，可以先改善表达与参与的条件。父母宫（观察你与长辈、师长及权威角色交换经验的方式的领域）中至少一颗主星显示不或陷（传统亮度中较需要情境支持的状态），因此不能把同宫的所有线索都当作轻松发挥。它提示你观察阻力出现在哪里，不是对相关人的能力下评价。例如，收到长辈或导师关于下一步的意见时，先问清对方担心什么，再说明你已有的信息和选择理由。当沟通渠道、准备时间或参与范围不合适时，即使原来的方法有长处，也可能需要调整。尊重经验和保留自主可以并行，这里不评价家庭成员的品格，也不把分歧解释为关系好坏。建议约定一次有时间边界的交流，围绕一个实际问题讨论，先选一个能改善的条件，再看一次实际互动是否更顺畅；其他主星的亮度要逐颗核对，不从这一条推断整个宫位都处于相同状态。
    advice:
      - 约定一次有时间边界的交流，围绕一个实际问题讨论
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Expression conditions in Parents Palace: allow adjustment'
    summary:
      You can improve the conditions for participation in communication across experience levels
      before judging the result.
    body:
      You can examine the conditions around communication across experience levels before evaluating
      your own response. At least one major star in the 父母宫 (fù mǔ gōng) — the area for how you
      exchange experience with elders, mentors and people in positions of authority — carries bu or
      xian brightness. These traditional labels describe a more context dependent expression, so the
      ordinary star reading benefits from a closer look at available support. When an elder or
      mentor recommends a next step, ask what concern lies behind the advice before explaining the
      information guiding your choice. If communication, preparation time or the scope of
      participation does not fit the task, a useful preference may be harder to express. Respect for
      experience can coexist with autonomy; disagreement alone does not measure a family member’s
      character or the quality of a bond. Try to arrange a bounded conversation focused on one
      practical question. Adjust one practical condition and compare the next interaction with the
      previous one. Other stars in the same area may have different brightness, and this modifier
      should not be generalized to every symbol or every person involved.
    advice:
      - Arrange a bounded conversation focused on one practical question
    do:
      - Note observations
    dont:
      - Rush conclusions
