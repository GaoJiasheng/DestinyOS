  zh:
    title: 福德宫的表达条件：给磨合留空间
    summary: 你在内在满足上，可以先改善表达与参与的条件。
    body: 你在内在满足上，可以先改善表达与参与的条件。福德宫（观察休闲偏好、精神空间与获得满足的方式的领域）中至少一颗主星显示不或陷（传统亮度中较需要情境支持的状态），因此不能把同宫的所有线索都当作轻松发挥。它提示你观察阻力出现在哪里，不是对相关人的能力下评价。例如，周末没有待办催促时，留意你自然选择阅读、独处、见朋友还是做一个有手感的小作品。当沟通渠道、准备时间或参与范围不合适时，即使原来的方法有长处，也可能需要调整。休息不需要变成绩效项目，喜欢的事也可以没有产出，不必用别人的标准来评价。建议保留一段不交作业的兴趣时间，结束后记录感受，先选一个能改善的条件，再看一次实际互动是否更顺畅；其他主星的亮度要逐颗核对，不从这一条推断整个宫位都处于相同状态。
