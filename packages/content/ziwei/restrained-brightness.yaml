  exclusive_with: []
  zh:
    title: 子女宫的表达条件：给磨合留空间
    summary: 你在陪伴与培育上，可以先改善表达与参与的条件。
    body: 你在陪伴与培育上，可以先改善表达与参与的条件。子女宫（观察你对晚辈、学习者以及需要持续培育的事情的投入的领域）中至少一颗主星显示不或陷（传统亮度中较需要情境支持的状态），因此不能把同宫的所有线索都当作轻松发挥。它提示你观察阻力出现在哪里，不是对相关人的能力下评价。例如，指导新同事完成第一份作品时，不妨询问对方想先独立尝试，还是希望你示范一个步骤。当沟通渠道、准备时间或参与范围不合适时，即使原来的方法有长处，也可能需要调整。这里也适用于教学与创作，不推断生育安排；被帮助的人仍有自己的节奏。建议设定一个能观察进步的小目标，留出尝试空间，先选一个能改善的条件，再看一次实际互动是否更顺畅；其他主星的亮度要逐颗核对，不从这一条推断整个宫位都处于相同状态。
    advice:
      - 设定一个能观察进步的小目标，留出尝试空间
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Expression conditions in Children Palace: allow adjustment'
    summary:
      You can improve the conditions for participation in mentoring and nurturing before judging
      the result.
    body: 'You can examine the conditions around mentoring and nurturing before evaluating your own
      response. At least one major star in the 子女宫 (zǐ nǚ gōng) — the area for your approach to
      younger people, learners and projects that need patient development — carries bu or xian
      brightness. These traditional labels describe a more context dependent expression, so the
      ordinary star reading benefits from a closer look at available support. Think of helping a new
      colleague with a first piece of work: ask whether they want a demonstration or room to attempt
      it themselves. If communication, preparation time or the scope of participation does not fit
      the task, a useful preference may be harder to express. This theme also applies to teaching
      and creative work; it does not prescribe parenthood or replace a learner’s own pace. Try to
      agree on a small sign of progress while leaving room for a learner’s own attempt. Adjust one
      practical condition and compare the next interaction with the previous one. Other stars in the
      same area may have different brightness, and this modifier should not be generalized to every
      symbol or every person involved.'
    advice:
      - Agree on a small sign of progress while leaving room for a learner’s own attempt
    do:
      - Note observations
    dont:
      - Rush conclusions
  meta:
    author: t23-ziwei-editorial-v1
    reviewed_by: null
    version: 1
    status: published
- id: ziwei.brightness.wealth.restrained
  system: ziwei
  section: career_wealth
  topic: brightness_wealth
  when:
    path: palaces[key=wealth].majorStars[*].brightness
    in:
      - bu
      - xian
  weight: 40
  polarity: mixed
  tags:
    - plain
  exclusive_with: []
  zh:
    title: 财帛宫的表达条件：给磨合留空间
    summary: 你在资源安排上，可以先改善表达与参与的条件。
    body: 你在资源安排上，可以先改善表达与参与的条件。财帛宫（观察日常收支、时间成本与资源分配的习惯的领域）中至少一颗主星显示不或陷（传统亮度中较需要情境支持的状态），因此不能把同宫的所有线索都当作轻松发挥。它提示你观察阻力出现在哪里，不是对相关人的能力下评价。例如，准备参加一门课程时，把费用、通勤和练习时间放在同一张清单上，再看这份投入是否适合现在的生活。当沟通渠道、准备时间或参与范围不合适时，即使原来的方法有长处，也可能需要调整。象征上的资源倾向不代表收入水平，预算仍要依据实际收支和已有承诺。建议选一项可调整的日常开支，记录用途与满意度，先选一个能改善的条件，再看一次实际互动是否更顺畅；其他主星的亮度要逐颗核对，不从这一条推断整个宫位都处于相同状态。
    advice:
      - 选一项可调整的日常开支，记录用途与满意度
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Expression conditions in Wealth Palace: allow adjustment'
    summary: You can improve the conditions for participation in managing everyday resources before
      judging the result.
    body:
      You can examine the conditions around managing everyday resources before evaluating your own
      response. At least one major star in the 财帛宫 (cái bó gōng) — the area for habits around
      ordinary spending, time costs and resource allocation — carries bu or xian brightness. These
      traditional labels describe a more context dependent expression, so the ordinary star reading
      benefits from a closer look at available support. Before joining a course, list its fee,
      travel demands and practice hours together rather than judging the cost from the price alone.
      If communication, preparation time or the scope of participation does not fit the task, a
      useful preference may be harder to express. A resource symbol does not measure your income;
      practical plans depend on actual costs, available funds and existing commitments. Try to
      review one flexible expense and note what it delivered compared with what you expected. Adjust
      one practical condition and compare the next interaction with the previous one. Other stars in
      the same area may have different brightness, and this modifier should not be generalized to
      every symbol or every person involved.
    advice:
      - Review one flexible expense and note what it delivered compared with what you expected
    do:
      - Note observations
    dont:
      - Rush conclusions
  meta:
    author: t23-ziwei-editorial-v1
    reviewed_by: null
    version: 1
    status: published
- id: ziwei.brightness.health.restrained
  system: ziwei
  section: health_travel
  topic: brightness_health
  when:
    path: palaces[key=health].majorStars[*].brightness
    in:
      - bu
      - xian
  weight: 40
  polarity: mixed
  tags:
    - plain
  exclusive_with: []
  zh:
    title: 疾厄宫的表达条件：给磨合留空间
    summary: 你在日常恢复上，可以先改善表达与参与的条件。
    body: 你在日常恢复上，可以先改善表达与参与的条件。疾厄宫（观察作息、压力感受与生活节奏的观察角度的领域）中至少一颗主星显示不或陷（传统亮度中较需要情境支持的状态），因此不能把同宫的所有线索都当作轻松发挥。它提示你观察阻力出现在哪里，不是对相关人的能力下评价。例如，连续几天忙碌后，观察屏幕使用、晚间工作和休息时间怎样互相挤占，不急着给疲惫贴标签。当沟通渠道、准备时间或参与范围不合适时，即使原来的方法有长处，也可能需要调整。这里只讨论生活习惯，星曜不能用于判断疾病；持续不适应交给合适的专业人士评估。建议给晚间安排留一个固定的收尾时段，观察是否更易放松，先选一个能改善的条件，再看一次实际互动是否更顺畅；其他主星的亮度要逐颗核对，不从这一条推断整个宫位都处于相同状态。
    advice:
      - 给晚间安排留一个固定的收尾时段，观察是否更易放松
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Expression conditions in Health Palace: allow adjustment'
    summary:
      You can improve the conditions for participation in rest and daily recovery before judging
      the result.
    body: 'You can examine the conditions around rest and daily recovery before evaluating your own
      response. At least one major star in the 疾厄宫 (jí è gōng) — the area for a symbolic perspective
      on routines, perceived stress and the rhythm of your day — carries bu or xian brightness.
      These traditional labels describe a more context dependent expression, so the ordinary star
      reading benefits from a closer look at available support. After several busy days, look at how
      screen time, evening work and breaks compete for space before assigning a label to tiredness.
      If communication, preparation time or the scope of participation does not fit the task, a
      useful preference may be harder to express. Keep this reading about habits: stars cannot
      identify an illness, and persistent discomfort deserves appropriate professional assessment.
      Try to set aside a consistent wind down period and observe whether it makes the evening easier
      to settle into. Adjust one practical condition and compare the next interaction with the
      previous one. Other stars in the same area may have different brightness, and this modifier
      should not be generalized to every symbol or every person involved.'
    advice:
      - Set aside a consistent wind down period and observe whether it makes the evening easier to
        settle into
    do:
      - Note observations
    dont:
      - Rush conclusions
  meta:
    author: t23-ziwei-editorial-v1
    reviewed_by: null
    version: 1
    status: published
- id: ziwei.brightness.travel.restrained
  system: ziwei
  section: health_travel
  topic: brightness_travel
  when:
    path: palaces[key=travel].majorStars[*].brightness
    in:
      - bu
      - xian
  weight: 40
  polarity: mixed
  tags:
    - plain
  exclusive_with: []
  zh:
    title: 迁移宫的表达条件：给磨合留空间
    summary: 你在外部环境适应上，可以先改善表达与参与的条件。
    body: 你在外部环境适应上，可以先改善表达与参与的条件。迁移宫（观察离开熟悉环境后的互动与适应方式的领域）中至少一颗主星显示不或陷（传统亮度中较需要情境支持的状态），因此不能把同宫的所有线索都当作轻松发挥。它提示你观察阻力出现在哪里，不是对相关人的能力下评价。例如，到陌生城市参加活动时，先确认交通、日程和联络方式，再留意新环境里哪些习惯仍然有效。当沟通渠道、准备时间或参与范围不合适时，即使原来的方法有长处，也可能需要调整。外出不自动意味着更好的发展，距离、照应与现实成本都需要纳入安排。建议尝试一次规模有限的外部活动，回来后复盘适应点，先选一个能改善的条件，再看一次实际互动是否更顺畅；其他主星的亮度要逐颗核对，不从这一条推断整个宫位都处于相同状态。
    advice:
      - 尝试一次规模有限的外部活动，回来后复盘适应点
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Expression conditions in Travel Palace: allow adjustment'
    summary:
      You can improve the conditions for participation in adapting beyond familiar surroundings
      before judging the result.
    body:
      You can examine the conditions around adapting beyond familiar surroundings before evaluating
      your own response. At least one major star in the 迁移宫 (qiān yí gōng) — the area for how you
      engage with people and arrangements outside your usual environment — carries bu or xian
      brightness. These traditional labels describe a more context dependent expression, so the
      ordinary star reading benefits from a closer look at available support. On a visit to an
      unfamiliar city, establish the route, schedule and contact details, then observe which
      familiar habits still work there. If communication, preparation time or the scope of
      participation does not fit the task, a useful preference may be harder to express. A different
      location does not automatically improve your prospects; distance, support and practical costs
      remain part of the decision. Try to try a limited activity outside your usual setting and
      review what helped you adjust afterward. Adjust one practical condition and compare the next
      interaction with the previous one. Other stars in the same area may have different brightness,
      and this modifier should not be generalized to every symbol or every person involved.
    advice:
      - Try a limited activity outside your usual setting and review what helped you adjust afterward
    do:
      - Note observations
    dont:
      - Rush conclusions
  meta:
    author: t23-ziwei-editorial-v1
    reviewed_by: null
    version: 1
    status: published
