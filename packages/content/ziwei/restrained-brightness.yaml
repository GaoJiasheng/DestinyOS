    body: 你在工作组织上，可以先改善表达与参与的条件。官禄宫（观察任务承担、职业学习与工作方法的领域）中至少一颗主星显示不或陷（传统亮度中较需要情境支持的状态），因此不能把同宫的所有线索都当作轻松发挥。它提示你观察阻力出现在哪里，不是对相关人的能力下评价。例如，团队开始一个新项目时，你可以观察自己喜欢确定目标、研究方法、核对细节还是协调交接。当沟通渠道、准备时间或参与范围不合适时，即使原来的方法有长处，也可能需要调整。这份解读讨论工作风格，不替你指定职业；现实能力、兴趣和岗位条件需要一起考虑。建议从现有任务里挑一处流程，和同事约定可检查的改进，先选一个能改善的条件，再看一次实际互动是否更顺畅；其他主星的亮度要逐颗核对，不从这一条推断整个宫位都处于相同状态。
    advice:
      - 从现有任务里挑一处流程，和同事约定可检查的改进
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Expression conditions in Career Palace: allow adjustment'
    summary: You can improve the conditions for participation in organizing work before judging the result.
    body:
      You can examine the conditions around organizing work before evaluating your own response. At
      least one major star in the 官禄宫 (guān lù gōng) — the area for how you take responsibility,
      learn professionally and arrange a task — carries bu or xian brightness. These traditional
      labels describe a more context dependent expression, so the ordinary star reading benefits
      from a closer look at available support. At the beginning of a project, notice whether you
      naturally clarify the aim, research a method, check details or coordinate handovers. If
      communication, preparation time or the scope of participation does not fit the task, a useful
      preference may be harder to express. The reading explores a working style without assigning
      you a profession; skills, interests and the conditions of a role matter together. Try to
      choose one part of an existing workflow and agree with a colleague on an observable
      improvement. Adjust one practical condition and compare the next interaction with the previous
      one. Other stars in the same area may have different brightness, and this modifier should not
      be generalized to every symbol or every person involved.
    advice:
      - Choose one part of an existing workflow and agree with a colleague on an observable
        improvement
    do:
      - Note observations
    dont:
      - Rush conclusions
