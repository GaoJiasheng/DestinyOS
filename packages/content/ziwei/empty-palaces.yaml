    summary: 你可以从对宫与实际互动，补充日常恢复的观察。
    body: 你在日常恢复上，可以多保留一个比较视角。疾厄宫（观察作息、压力感受与生活节奏的观察角度的领域）在本盘无主星（这个位置没有十四主星中的任何一颗），传统上参考对宫（十二宫环上相隔六格的位置）的主星来辅助理解。借星是观察结构之间的联系，不是把另一处的特征直接复制过来，也不表示缺少能力。比如，连续几天忙碌后，观察屏幕使用、晚间工作和休息时间怎样互相挤占，不急着给疲惫贴标签。这里只讨论生活习惯，星曜不能用于判断疾病；持续不适应交给合适的专业人士评估。建议给晚间安排留一个固定的收尾时段，观察是否更易放松，并记录外部安排改变时自己的回应是否也有变化。以实际反馈修正比较，比急着用一个标签概括自己更有空间。
