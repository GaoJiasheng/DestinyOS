  zh:
    title: 兄弟宫无主星：从互动寻找参照
    summary: 你可以从对宫与实际互动，补充同辈互助的观察。
    body: 你在同辈互助上，可以多保留一个比较视角。兄弟宫（观察同辈、手足与熟悉伙伴之间的支持方式的领域）在本盘无主星（这个位置没有十四主星中的任何一颗），传统上参考对宫（十二宫环上相隔六格的位置）的主星来辅助理解。借星是观察结构之间的联系，不是把另一处的特征直接复制过来，也不表示缺少能力。比如，几位熟悉的人商量共同出行时，留意谁负责搜集信息、谁安排时间，以及你想参与哪一部分。亲近程度和资源共享不是同一回事，彼此的时间也可能很不一样。建议先问对方是否方便，再约定具体的互助范围，并记录外部安排改变时自己的回应是否也有变化。以实际反馈修正比较，比急着用一个标签概括自己更有空间。
    advice:
      - 先问对方是否方便，再约定具体的互助范围
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'No major star in Siblings Palace: compare the surrounding context'
    summary: You can compare support among peers with the opposite area and with your actual interactions.
    body:
      'You can leave room for a broader comparison when considering support among peers. The 兄弟宫
      (xiōng dì gōng) — the chart area for how siblings, contemporaries and familiar peers share
      support — contains none of the fourteen major stars. In the traditional method, the opposite
      palace, six positions away on the twelve area ring, provides an additional perspective.
      Borrowing a star is a way to compare relationships within the chart, not a direct transfer of
      every attribute or an indication of missing ability. Imagine familiar peers arranging a shared
      outing: one gathers information, another coordinates dates, and you decide which part you
      actually want to handle. Closeness does not imply equal availability, similar income or an
      obligation to share every resource. Try to ask about availability before agreeing on a
      specific and manageable exchange of help. Notice whether your response changes when the
      surrounding arrangement changes. A record of those differences can help you assess an
      interpretation more carefully than choosing a fixed label from the empty position alone.'
    advice:
      - Ask about availability before agreeing on a specific and manageable exchange of help
    do:
      - Note observations
    dont:
      - Rush conclusions
  meta:
    author: t23-ziwei-editorial-v1
    reviewed_by: null
    version: 1
    status: published
