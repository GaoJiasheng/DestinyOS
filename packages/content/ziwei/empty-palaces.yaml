- id: ziwei.empty.life
  system: ziwei
  section: life_palace
  topic: empty_life
  when:
    path: emptyPalaces
    contains: life
  weight: 70
  polarity: neutral
  tags:
    - plain
  exclusive_with: []
  zh:
    title: 命宫无主星：从互动寻找参照
    summary: 你可以从对宫与实际互动，补充自我表达的观察。
    body: 你在自我表达上，可以多保留一个比较视角。命宫（观察你怎样认识自己和回应日常处境的领域）在本盘无主星（这个位置没有十四主星中的任何一颗），传统上参考对宫（十二宫环上相隔六格的位置）的主星来辅助理解。借星是观察结构之间的联系，不是把另一处的特征直接复制过来，也不表示缺少能力。比如，接到陌生任务时，先观察自己是急于定方向，还是先询问细节。别用一个盘中标签覆盖自己在不同场合的变化。建议记录一次选择的理由，过几天看看是否仍认可，并记录外部安排改变时自己的回应是否也有变化。以实际反馈修正比较，比急着用一个标签概括自己更有空间。
    advice:
      - 记录一次选择的理由，过几天看看是否仍认可
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'No major star in Life Palace: compare the surrounding context'
    summary: You can compare your everyday identity with the opposite area and with your actual
      interactions.
    body:
      You can leave room for a broader comparison when considering your everyday identity. The 命宫
      (mìng gōng) — the chart area for how you describe yourself and respond to ordinary situations
      — contains none of the fourteen major stars. In the traditional method, the opposite palace,
      six positions away on the twelve area ring, provides an additional perspective. Borrowing a
      star is a way to compare relationships within the chart, not a direct transfer of every
      attribute or an indication of missing ability. When a new task arrives, notice whether you
      first seek a direction, gather details or ask what others need. Your response at home may
      differ from your response at work; leave room for that difference. Try to keep a short note on
      why you chose an approach and revisit it a few days later. Notice whether your response
      changes when the surrounding arrangement changes. A record of those differences can help you
      assess an interpretation more carefully than choosing a fixed label from the empty position
      alone.
    advice:
      - Keep a short note on why you chose an approach and revisit it a few days later
    do:
      - Note observations
    dont:
      - Rush conclusions
  meta:
    author: t23-ziwei-editorial-v1
    reviewed_by: null
    version: 1
    status: published
- id: ziwei.empty.siblings
  system: ziwei
