    body: 你在亲密沟通上，可以多保留一个比较视角。夫妻宫（观察亲密关系中的协商方式与期待的领域）在本盘无主星（这个位置没有十四主星中的任何一颗），传统上参考对宫（十二宫环上相隔六格的位置）的主星来辅助理解。借星是观察结构之间的联系，不是把另一处的特征直接复制过来，也不表示缺少能力。比如，你与伴侣或正在了解的人安排周末时，可以先分别说出需要安静、交流还是一起做事。关系中的星象描述互动课题，不替你判断某个人是否合适，也不要求你进入某种关系。建议把一个期待改写成对方能回应的具体请求，并记录外部安排改变时自己的回应是否也有变化。以实际反馈修正比较，比急着用一个标签概括自己更有空间。
