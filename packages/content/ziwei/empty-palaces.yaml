    summary: 你可以从对宫与实际互动，补充资源安排的观察。
    body: 你在资源安排上，可以多保留一个比较视角。财帛宫（观察日常收支、时间成本与资源分配的习惯的领域）在本盘无主星（这个位置没有十四主星中的任何一颗），传统上参考对宫（十二宫环上相隔六格的位置）的主星来辅助理解。借星是观察结构之间的联系，不是把另一处的特征直接复制过来，也不表示缺少能力。比如，准备参加一门课程时，把费用、通勤和练习时间放在同一张清单上，再看这份投入是否适合现在的生活。象征上的资源倾向不代表收入水平，预算仍要依据实际收支和已有承诺。建议选一项可调整的日常开支，记录用途与满意度，并记录外部安排改变时自己的回应是否也有变化。以实际反馈修正比较，比急着用一个标签概括自己更有空间。
