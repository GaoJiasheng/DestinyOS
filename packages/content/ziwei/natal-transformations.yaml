      - path: palaces[key=life].minorStars[*].mutagen
        eq: quan
  weight: 55
  polarity: neutral
  tags:
    - plain
  exclusive_with: []
  zh:
    title: 生年化权关联命宫：主导责任与决策分工
    summary: 你可以在自我表达中留意主导责任与决策分工的课题。
    body: 你可以在自我表达中留意主导责任与决策分工，把它作为长期观察的一条线索。化权（四化中象征主导责任与决策分工的标记）出现在本盘这处星曜上，落在命宫（观察你怎样认识自己和回应日常处境的领域）。你可能更关注谁来决定下一步，以及负责的人是否有足够信息与时间。例如，接到陌生任务时，先观察自己是急于定方向，还是先询问细节。不过，别用一个盘中标签覆盖自己在不同场合的变化。建议把可以决定、需要协商和暂缓的事项分开说明，再核对这一步是否符合已经答应的事项；时间层次改变观察范围，不替你预告某种具体结果。
    advice:
      - 把可以决定、需要协商和暂缓的事项分开说明
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Quan Transformation in Life Palace: the natal layer'
    summary: You can examine ownership, responsibility and decision roles in your everyday identity
      through the natal layer.
    body: You can reflect on ownership, responsibility and decision roles in your everyday identity
      through this natal layer. 化权 (huà quán) — a transformation symbol for that emphasis — is
      linked to a star in the 命宫 (mìng gōng), the area concerned with how you describe yourself and
      respond to ordinary situations. The natal layer belongs to the original chart and offers an
      ongoing comparison point. In practical terms, you may pay closer attention to who decides the
      next step and whether the responsible person has enough information and time. When a new task
      arrives, notice whether you first seek a direction, gather details or ask what others need.
      However, your response at home may differ from your response at work; leave room for that
      difference. Try to distinguish what can be decided, what needs consultation and what should
      wait. Check the step against existing commitments and what you observe afterward. A timing
      layer changes the scope of reflection without identifying a particular event or deciding its
      outcome.
    advice:
      - distinguish what can be decided, what needs consultation and what should wait
    do:
      - Note observations
    dont:
      - Rush conclusions
  meta:
    author: t23-ziwei-editorial-v1
    reviewed_by: null
    version: 1
    status: published
