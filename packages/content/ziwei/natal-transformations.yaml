# Original bilingual editorial content for T-23; sources are not quotations.
# // DESIGN-GAP: All four transformations cover all twelve natal palaces. Timing layers compare each real horoscope transformation star with literal major/minor star keys in that palace; a timing palace index alone is not a transformation destination.
- id: ziwei.natal.mutagen.life.lu
  system: ziwei
  section: life_palace
  topic: natal_mutagen_life_lu
  when:
    any:
      - path: palaces[key=life].majorStars[*].mutagen
        eq: lu
      - path: palaces[key=life].minorStars[*].mutagen
        eq: lu
  weight: 55
  polarity: neutral
  tags:
    - plain
  exclusive_with: []
  zh:
    title: 生年化禄关联命宫：接收支持与参与机会
    summary: 你可以在自我表达中留意接收支持与参与机会的课题。
    body: 你可以在自我表达中留意接收支持与参与机会，把它作为长期观察的一条线索。化禄（四化中象征接收支持与参与机会的标记）出现在本盘这处星曜上，落在命宫（观察你怎样认识自己和回应日常处境的领域）。一份邀请、共享材料或愿意帮忙的人，可能让你更容易加入一项安排。例如，接到陌生任务时，先观察自己是急于定方向，还是先询问细节。不过，别用一个盘中标签覆盖自己在不同场合的变化。建议先问清支持能用在哪里，选择一项适合余力的参与，再核对这一步是否符合已经答应的事项；时间层次改变观察范围，不替你预告某种具体结果。
    advice:
      - 先问清支持能用在哪里，选择一项适合余力的参与
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Lu Transformation in Life Palace: the natal layer'
    summary:
      You can examine access, support and opportunities to participate in your everyday identity
      through the natal layer.
    body:
      You can reflect on access, support and opportunities to participate in your everyday identity
      through this natal layer. 化禄 (huà lù) — a transformation symbol for that emphasis — is linked
      to a star in the 命宫 (mìng gōng), the area concerned with how you describe yourself and respond
      to ordinary situations. The natal layer belongs to the original chart and offers an ongoing
      comparison point. In practical terms, an invitation, shared material or someone willing to
      help may make participation more accessible. When a new task arrives, notice whether you first
      seek a direction, gather details or ask what others need. However, your response at home may
      differ from your response at work; leave room for that difference. Try to identify what the
      support is for and choose a form of participation that fits your capacity. Check the step
      against existing commitments and what you observe afterward. A timing layer changes the scope
      of reflection without identifying a particular event or deciding its outcome.
    advice:
      - identify what the support is for and choose a form of participation that fits your capacity
    do:
      - Note observations
    dont:
      - Rush conclusions
  meta:
    author: t23-ziwei-editorial-v1
    reviewed_by: null
    version: 1
    status: published
