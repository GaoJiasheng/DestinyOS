    summary: 你可以在自我表达中留意说明方法与获得反馈的课题。
    body: 你可以在自我表达中留意说明方法与获得反馈，把它作为长期观察的一条线索。化科（四化中象征说明方法与获得反馈的标记）出现在本盘这处星曜上，落在命宫（观察你怎样认识自己和回应日常处境的领域）。把过程说明白、让别人理解你的方法，可能比只展示结果更能改善配合。例如，接到陌生任务时，先观察自己是急于定方向，还是先询问细节。不过，别用一个盘中标签覆盖自己在不同场合的变化。建议准备一个可复述的小例子，邀请别人指出不清楚的地方，再核对这一步是否符合已经答应的事项；时间层次改变观察范围，不替你预告某种具体结果。
    advice:
      - 准备一个可复述的小例子，邀请别人指出不清楚的地方
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Ke Transformation in Life Palace: the natal layer'
    summary:
      You can examine explanation, learning and constructive feedback in your everyday identity
      through the natal layer.
    body:
      You can reflect on explanation, learning and constructive feedback in your everyday identity
      through this natal layer. 化科 (huà kē) — a transformation symbol for that emphasis — is linked
      to a star in the 命宫 (mìng gōng), the area concerned with how you describe yourself and respond
      to ordinary situations. The natal layer belongs to the original chart and offers an ongoing
      comparison point. In practical terms, explaining a process so someone can understand the
      method may support cooperation more than showing an outcome alone. When a new task arrives,
      notice whether you first seek a direction, gather details or ask what others need. However,
      your response at home may differ from your response at work; leave room for that difference.
      Try to prepare a small example someone can restate and invite feedback on what remains
      unclear. Check the step against existing commitments and what you observe afterward. A timing
      layer changes the scope of reflection without identifying a particular event or deciding its
      outcome.
    advice:
      - prepare a small example someone can restate and invite feedback on what remains unclear
    do:
      - Note observations
    dont:
      - Rush conclusions
