    body: 你可以在代际沟通中留意主导责任与决策分工，把它作为长期观察的一条线索。化权（四化中象征主导责任与决策分工的标记）出现在本盘这处星曜上，落在父母宫（观察你与长辈、师长及权威角色交换经验的方式的领域）。你可能更关注谁来决定下一步，以及负责的人是否有足够信息与时间。例如，收到长辈或导师关于下一步的意见时，先问清对方担心什么，再说明你已有的信息和选择理由。不过，尊重经验和保留自主可以并行，这里不评价家庭成员的品格，也不把分歧解释为关系好坏。建议把可以决定、需要协商和暂缓的事项分开说明，再核对这一步是否符合已经答应的事项；时间层次改变观察范围，不替你预告某种具体结果。
    advice:
      - 把可以决定、需要协商和暂缓的事项分开说明
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Quan Transformation in Parents Palace: the natal layer'
    summary: You can examine ownership, responsibility and decision roles in communication across
      experience levels through the natal layer.
    body: You can reflect on ownership, responsibility and decision roles in communication across
      experience levels through this natal layer. 化权 (huà quán) — a transformation symbol for that
      emphasis — is linked to a star in the 父母宫 (fù mǔ gōng), the area concerned with how you
      exchange experience with elders, mentors and people in positions of authority. The natal layer
      belongs to the original chart and offers an ongoing comparison point. In practical terms, you
      may pay closer attention to who decides the next step and whether the responsible person has
      enough information and time. When an elder or mentor recommends a next step, ask what concern
      lies behind the advice before explaining the information guiding your choice. However, respect
      for experience can coexist with autonomy; disagreement alone does not measure a family
      member’s character or the quality of a bond. Try to distinguish what can be decided, what
      needs consultation and what should wait. Check the step against existing commitments and what
      you observe afterward. A timing layer changes the scope of reflection without identifying a
      particular event or deciding its outcome.
