      satisfaction through this natal layer. 化禄 (huà lù) — a transformation symbol for that emphasis
      — is linked to a star in the 福德宫 (fú dé gōng), the area concerned with the interests, mental
      space and leisure practices that feel restorative. The natal layer belongs to the original
      chart and offers an ongoing comparison point. In practical terms, an invitation, shared
      material or someone willing to help may make participation more accessible. During a weekend
      without urgent tasks, notice whether you gravitate toward reading, quiet time, company or
      making something tangible. However, leisure does not need to become another performance task;
      an activity may be valuable without producing a visible result. Try to identify what the
      support is for and choose a form of participation that fits your capacity. Check the step
      against existing commitments and what you observe afterward. A timing layer changes the scope
      of reflection without identifying a particular event or deciding its outcome.
    advice:
