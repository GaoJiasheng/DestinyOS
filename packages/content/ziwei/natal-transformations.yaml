        eq: lu
      - path: palaces[key=siblings].minorStars[*].mutagen
        eq: lu
  weight: 55
  polarity: neutral
  tags:
    - plain
  exclusive_with: []
  zh:
    title: 生年化禄关联兄弟宫：接收支持与参与机会
    summary: 你可以在同辈互助中留意接收支持与参与机会的课题。
    body: 你可以在同辈互助中留意接收支持与参与机会，把它作为长期观察的一条线索。化禄（四化中象征接收支持与参与机会的标记）出现在本盘这处星曜上，落在兄弟宫（观察同辈、手足与熟悉伙伴之间的支持方式的领域）。一份邀请、共享材料或愿意帮忙的人，可能让你更容易加入一项安排。例如，几位熟悉的人商量共同出行时，留意谁负责搜集信息、谁安排时间，以及你想参与哪一部分。不过，亲近程度和资源共享不是同一回事，彼此的时间也可能很不一样。建议先问清支持能用在哪里，选择一项适合余力的参与，再核对这一步是否符合已经答应的事项；时间层次改变观察范围，不替你预告某种具体结果。
    advice:
      - 先问清支持能用在哪里，选择一项适合余力的参与
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Lu Transformation in Siblings Palace: the natal layer'
    summary: You can examine access, support and opportunities to participate in support among peers
      through the natal layer.
    body:
      'You can reflect on access, support and opportunities to participate in support among peers
      through this natal layer. 化禄 (huà lù) — a transformation symbol for that emphasis — is linked
      to a star in the 兄弟宫 (xiōng dì gōng), the area concerned with how siblings, contemporaries and
      familiar peers share support. The natal layer belongs to the original chart and offers an
      ongoing comparison point. In practical terms, an invitation, shared material or someone
      willing to help may make participation more accessible. Imagine familiar peers arranging a
      shared outing: one gathers information, another coordinates dates, and you decide which part
      you actually want to handle. However, closeness does not imply equal availability, similar
      income or an obligation to share every resource. Try to identify what the support is for and
      choose a form of participation that fits your capacity. Check the step against existing
      commitments and what you observe afterward. A timing layer changes the scope of reflection
      without identifying a particular event or deciding its outcome.'
    advice:
      - identify what the support is for and choose a form of participation that fits your capacity
    do:
      - Note observations
    dont:
      - Rush conclusions
  meta:
    author: t23-ziwei-editorial-v1
    reviewed_by: null
    version: 1
    status: published
