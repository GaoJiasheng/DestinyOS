    body: 你可以把协调关系与维护程序当作理解自己的一个入口。命宫（观察日常回应的领域）出现天相（象征协调关系与维护程序的主星），因此报告先从这种行为偏好谈起。比如，遇到新的合作任务时，你自己往往愿意听两边的说法，重视规则能否让合作顺畅。建议把这份描述与最近一次实际经历比较，再往后阅读不同生活领域的细节，允许经历修正标签。
