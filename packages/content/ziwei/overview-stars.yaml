  zh:
    title: 天机的命盘入口
    summary: 你倾向以观察变化与设计方法组织生活。
    body: 你可以把观察变化与设计方法当作理解自己的一个入口。命宫（观察日常回应的领域）出现天机（象征观察变化与设计方法的主星），因此报告先从这种行为偏好谈起。比如，遇到新的合作任务时，你自己容易看见流程里的细小差异，并想出几种替代办法。建议把这份描述与最近一次实际经历比较，再往后阅读不同生活领域的细节，允许经历修正标签。
    advice:
      - 不妨给每次比较设定期限，只验证一个最关键的假设
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Tiān Jī: a starting point for reflection'
    summary: You may organize everyday choices around adaptive planning and practical ingenuity.
    body:
      You can begin this reading by considering adaptive planning and practical ingenuity. Tiān Jī
      — a major star associated with that tendency — appears in the Life Palace (mìng
      gōng), the area used to discuss everyday responses and identity. You may notice small
      inefficiencies and quickly imagine several workable alternatives. Imagine joining a
      collaboration where roles have not yet been agreed. Notice what you volunteer to clarify, what
      you leave to others and what support makes participation easier. Consider setting a decision
      deadline and testing the most important unknown first. The chapters that follow look at
      different settings for these preferences, including work, relationships and time outside
      familiar surroundings. Compare each idea with a recent experience before adopting it as a
      description of yourself. A chart provides several perspectives, and a single prominent symbol
      need not explain everything you do.
    advice:
      - Consider setting a decision deadline and testing the most important unknown first
    do:
      - Note observations
    dont:
      - Rush conclusions
  meta:
    author: t23-ziwei-editorial-v1
    reviewed_by: null
    version: 2
    status: published
