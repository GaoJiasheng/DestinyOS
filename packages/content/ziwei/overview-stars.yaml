      - 可以在听取意见后明确自己的选择和理由
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Tiān Xiàng: a starting point for reflection'
    summary: You may organize everyday choices around coordination, fairness and procedural care.
    body: You can begin this reading by considering coordination, fairness and procedural care. Tiān
      Xiàng — a major star associated with that tendency — appears in the Life Palace (mìng
      gōng), the area used to discuss everyday responses and identity. You may be comfortable
      hearing several perspectives and using a fair process to keep cooperation workable. Imagine
      joining a collaboration where roles have not yet been agreed. Notice what you volunteer to
      clarify, what you leave to others and what support makes participation easier. Consider
