  en:
    title: 'Tài Yáng: a starting point for reflection'
    summary: You may organize everyday choices around visible contribution and outward engagement.
    body: You can begin this reading by considering visible contribution and outward engagement. Tài
      Yáng — a major star associated with that tendency — appears in the Life Palace (mìng
