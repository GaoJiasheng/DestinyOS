# Original bilingual editorial content for T-23; sources are not quotations.
- id: ziwei.overview.zi_wei
  system: ziwei
  section: overview
  topic: overview_zi_wei
  when:
    path: palaces[key=life].majorStars[key=zi_wei].key
    eq: zi_wei
  weight: 80
  polarity: neutral
  tags:
    - plain
    - personality
  exclusive_with: []
  zh:
    title: 紫微的命盘入口
    summary: 你倾向以统筹方向与承担责任组织生活。
    body: 你可以把统筹方向与承担责任当作理解自己的一个入口。命宫（观察日常回应的领域）出现紫微（象征统筹方向与承担责任的主星），因此报告先从这种行为偏好谈起。比如，遇到新的合作任务时，你自己倾向先建立整体框架，再把事情交给合适的人推进。建议把这份描述与最近一次实际经历比较，再往后阅读不同生活领域的细节，允许经历修正标签。
    advice:
      - 可以先公开判断标准，再邀请别人指出一个遗漏
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Zǐ Wēi: a starting point for reflection'
    summary: You may organize everyday choices around setting direction and holding responsibility.
    body:
      You can begin this reading by considering setting direction and holding responsibility. Zǐ Wēi
      — a major star associated with that tendency — appears in the Life Palace (mìng
      gōng), the area used to discuss everyday responses and identity. You often look for a coherent
      direction before deciding who should carry each part of a task. Imagine joining a
      collaboration where roles have not yet been agreed. Notice what you volunteer to clarify, what
      you leave to others and what support makes participation easier. Try explaining your decision
      criteria before asking someone to challenge one assumption. The chapters that follow look at
      different settings for these preferences, including work, relationships and time outside
      familiar surroundings. Compare each idea with a recent experience before adopting it as a
      description of yourself. A chart provides several perspectives, and a single prominent symbol
      need not explain everything you do.
    advice:
      - Try explaining your decision criteria before asking someone to challenge one assumption
    do:
      - Note observations
    dont:
      - Rush conclusions
  meta:
    author: t23-ziwei-editorial-v1
    reviewed_by: null
    version: 2
    status: published
