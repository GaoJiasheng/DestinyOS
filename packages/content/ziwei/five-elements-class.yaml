# // DESIGN-GAP: Five-element bureau units explain the documented calculation role and starting ages; they do not invent elemental personality traits.
- id: ziwei.bureau.water_2
  system: ziwei
  section: overview
  topic: bureau_water_2
  when:
    path: basics.fiveElementsClass.name
    eq: water_2
  weight: 45
  polarity: neutral
  tags:
    - plain
  exclusive_with: []
  zh:
    title: 水二局：阶段的起算方式
    summary: 你可以用水二局了解大限年龄区间的起算。
    body: 你可以先先准备再启动。水二局（五行局的一种排盘参数）中的数字2，用于大限（传统上约十年的观察阶段）的起始岁数；本盘通常从两岁进入首段，其后依次延展。它不代表某个元素在你身上更强，也不是人格测量。比如，回顾学生时期与工作时期时，建议把时间轴与真实经历并排看，留意哪些描述有帮助，而不为了符合区间重写自己的故事。
    advice:
      - 把报告时间轴与自己的真实经历并排核对。
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: '水二局: reading the phase boundaries'
    summary: You can use this bureau to understand where the decadal age ranges begin.
    body:
      You can keep preparation distinct from the start when reading the timeline. 水二局 (shuǐ èr jú) —
      one of the five element bureau settings used in chart construction — supplies the number 2 for
      the initial decadal age boundary. The ordinary first ten year range begins at nominal age two;
      subsequent ranges follow from that starting point. The bureau is a calculation setting rather
      than a measure of an element in your personality. For example, compare a period of study with
      a later period of work using your actual notes before assigning significance to a phase label.
      Try keeping the report’s age ranges beside your own account of events. This lets the
      traditional time structure organize reflection without requiring you to reinterpret an
      experience merely to fit its boundaries.
    advice:
      - Compare the age ranges with your own record of experience.
    do:
      - Note observations
    dont:
      - Rush conclusions
  meta:
    author: t23-ziwei-editorial-v1
    reviewed_by: null
    version: 1
    status: published
