# // DESIGN-GAP: isBodyPalace is the engine’s resolved branch-to-palace mapping; basics.bodyPalaceBranch is retained as evidence. All twelve schema palaces are covered even though the mainstream layout reaches six.
- id: ziwei.body.life
  system: ziwei
  section: body_fortune
  topic: body_life
  when:
    all:
      - path: palaces[key=life].isBodyPalace
        eq: true
      - path: basics.bodyPalaceBranch
        exists: true
  weight: 75
  polarity: neutral
  tags:
    - plain
  exclusive_with: []
  zh:
    title: 身宫在命宫：把自我表达放回日常
    summary: 你可以留意自我表达在持续行动中的分量。
    body: 你持续投入的事情，可能较容易围绕自我表达展开。身宫（传统上观察实际行动与后续投入的辅助位置）在本盘与命宫（观察你怎样认识自己和回应日常处境的领域）重合；它补充自我描述，不取代其他生活领域。比如，接到陌生任务时，先观察自己是急于定方向，还是先询问细节。你可以回顾自己是否经常主动照顾这部分安排，还是只有近期环境需要如此。别用一个盘中标签覆盖自己在不同场合的变化。建议记录一次选择的理由，过几天看看是否仍认可，先留意一段时间内自己的投入与感受，再决定要保留哪些做法；人生侧重会受到选择、经历和现实责任影响，不需要把全部精力压在一个位置上。
    advice:
      - 记录一次选择的理由，过几天看看是否仍认可
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Body Palace in Life Palace: attention through action'
    summary: You can reflect on the place your everyday identity holds in your continuing commitments.
    body: You may recognize a recurring investment of attention in your everyday identity. The Body
      Palace (身宫, shēn gōng — an additional perspective on action and sustained involvement)
      coincides here with the 命宫 (mìng gōng), the area for how you describe yourself and respond to
      ordinary situations. This adds a question about what you actually spend time doing alongside
      the reading of identity. When a new task arrives, notice whether you first seek a direction,
      gather details or ask what others need. Look back at whether this concern recurs across
      different circumstances or mostly reflects your present responsibilities. Your response at
      home may differ from your response at work; leave room for that difference. Try to keep a
      short note on why you chose an approach and revisit it a few days later. Review the effort and
      satisfaction involved after a few attempts. A symbolic emphasis is only one perspective on
      your commitments; changing responsibilities and deliberate choices can shift where your
      attention goes.
    advice:
      - Keep a short note on why you chose an approach and revisit it a few days later
    do:
      - Note observations
    dont:
      - Rush conclusions
  meta:
    author: t23-ziwei-editorial-v1
    reviewed_by: null
    version: 1
    status: published
