  en:
    title: 'Body Palace in Spouse Palace: attention through action'
    summary:
      You can reflect on the place negotiation in close relationships holds in your continuing
      commitments.
    body:
      You may recognize a recurring investment of attention in negotiation in close relationships.
      The Body Palace (身宫, shēn gōng — an additional perspective on action and sustained
      involvement) coincides here with the 夫妻宫 (fū qī gōng), the area for the expectations and
      conversations that shape an intimate partnership. This adds a question about what you actually
      spend time doing alongside the reading of identity. While arranging a weekend with a partner
      or someone you are getting to know, compare what each person needs from the time together.
      Look back at whether this concern recurs across different circumstances or mostly reflects
      your present responsibilities. A symbolic relationship theme cannot decide compatibility or
      tell you what kind of relationship to pursue. Try to turn one expectation into a request the
      other person can clearly respond to. Review the effort and satisfaction involved after a few
      attempts. A symbolic emphasis is only one perspective on your commitments; changing
      responsibilities and deliberate choices can shift where your attention goes.
