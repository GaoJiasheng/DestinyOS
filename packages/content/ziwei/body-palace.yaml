  zh:
    title: 身宫在疾厄宫：把日常恢复放回日常
    summary: 你可以留意日常恢复在持续行动中的分量。
    body: 你持续投入的事情，可能较容易围绕日常恢复展开。身宫（传统上观察实际行动与后续投入的辅助位置）在本盘与疾厄宫（观察作息、压力感受与生活节奏的观察角度的领域）重合；它补充自我描述，不取代其他生活领域。比如，连续几天忙碌后，观察屏幕使用、晚间工作和休息时间怎样互相挤占，不急着给疲惫贴标签。你可以回顾自己是否经常主动照顾这部分安排，还是只有近期环境需要如此。这里只讨论生活习惯，星曜不能用于判断疾病；持续不适应交给合适的专业人士评估。建议给晚间安排留一个固定的收尾时段，观察是否更易放松，先留意一段时间内自己的投入与感受，再决定要保留哪些做法；人生侧重会受到选择、经历和现实责任影响，不需要把全部精力压在一个位置上。
    advice:
      - 给晚间安排留一个固定的收尾时段，观察是否更易放松
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Body Palace in Health Palace: attention through action'
    summary: You can reflect on the place rest and daily recovery holds in your continuing commitments.
    body:
      'You may recognize a recurring investment of attention in rest and daily recovery. The Body
      Palace (身宫, shēn gōng — an additional perspective on action and sustained involvement)
      coincides here with the 疾厄宫 (jí è gōng), the area for a symbolic perspective on routines,
      perceived stress and the rhythm of your day. This adds a question about what you actually
      spend time doing alongside the reading of identity. After several busy days, look at how
      screen time, evening work and breaks compete for space before assigning a label to tiredness.
      Look back at whether this concern recurs across different circumstances or mostly reflects
      your present responsibilities. Keep this reading about habits: stars cannot identify an
      illness, and persistent discomfort deserves appropriate professional assessment. Try to set
      aside a consistent wind down period and observe whether it makes the evening easier to settle
      into. Review the effort and satisfaction involved after a few attempts. A symbolic emphasis is
      only one perspective on your commitments; changing responsibilities and deliberate choices can
      shift where your attention goes.'
    advice:
      - Set aside a consistent wind down period and observe whether it makes the evening easier to
        settle into
    do:
      - Note observations
    dont:
      - Rush conclusions
