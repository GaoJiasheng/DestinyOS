  zh:
    title: 身宫在兄弟宫：把同辈互助放回日常
    summary: 你可以留意同辈互助在持续行动中的分量。
    body: 你持续投入的事情，可能较容易围绕同辈互助展开。身宫（传统上观察实际行动与后续投入的辅助位置）在本盘与兄弟宫（观察同辈、手足与熟悉伙伴之间的支持方式的领域）重合；它补充自我描述，不取代其他生活领域。比如，几位熟悉的人商量共同出行时，留意谁负责搜集信息、谁安排时间，以及你想参与哪一部分。你可以回顾自己是否经常主动照顾这部分安排，还是只有近期环境需要如此。亲近程度和资源共享不是同一回事，彼此的时间也可能很不一样。建议先问对方是否方便，再约定具体的互助范围，先留意一段时间内自己的投入与感受，再决定要保留哪些做法；人生侧重会受到选择、经历和现实责任影响，不需要把全部精力压在一个位置上。
    advice:
      - 先问对方是否方便，再约定具体的互助范围
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Body Palace in Siblings Palace: attention through action'
    summary: You can reflect on the place support among peers holds in your continuing commitments.
    body:
      'You may recognize a recurring investment of attention in support among peers. The Body Palace
      (身宫, shēn gōng — an additional perspective on action and sustained involvement) coincides here
      with the 兄弟宫 (xiōng dì gōng), the area for how siblings, contemporaries and familiar peers
      share support. This adds a question about what you actually spend time doing alongside the
      reading of identity. Imagine familiar peers arranging a shared outing: one gathers
      information, another coordinates dates, and you decide which part you actually want to handle.
      Look back at whether this concern recurs across different circumstances or mostly reflects
      your present responsibilities. Closeness does not imply equal availability, similar income or
      an obligation to share every resource. Try to ask about availability before agreeing on a
      specific and manageable exchange of help. Review the effort and satisfaction involved after a
      few attempts. A symbolic emphasis is only one perspective on your commitments; changing
      responsibilities and deliberate choices can shift where your attention goes.'
    advice:
      - Ask about availability before agreeing on a specific and manageable exchange of help
    do:
      - Note observations
    dont:
      - Rush conclusions
  meta:
    author: t23-ziwei-editorial-v1
    reviewed_by: null
    version: 1
    status: published
