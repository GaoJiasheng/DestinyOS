- id: ziwei.pattern.zi_fu_tong_gong
  system: ziwei
  section: patterns
  topic: pattern_zi_fu_tong_gong
  when:
    path: patterns[*].key
    eq: zi_fu_tong_gong
  weight: 72
  polarity: neutral
  tags:
    - plain
  exclusive_with: []
  zh:
    title: 紫府同宫：先确认要做什么，再确认凭什么持续做下去
    summary: 你可以从先确认要做什么，再确认凭什么持续做下去这个角度观察生活。
    body: 你可以从先确认要做什么，再确认凭什么持续做下去这个角度观察自己的选择。紫府同宫（传统上为这组星曜位置关系取的名称）在本盘命中，因为命宫同时有紫微与天府，合看方向统筹和资源保留。这里说的是要素如何相互联系，而不是一件将要发生的事。比如，你组织读书小组时，除了提出主题，还愿意安排资料归档和轮值，让下一次聚会不必从零开始。这个场景需要结合你已有的经验、参与者的实际需要和当前能投入的精力来看。建议把负责方向和维护资源的职责分别列清，不把稳定安排变成个人包办。把尝试之后的新信息也纳入判断，若这个角度与你的经历不符，就调整观察方法，不必让名称限制自己的选择。
    advice:
      - 把负责方向和维护资源的职责分别列清，不把稳定安排变成个人包办
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Zǐ Fǔ Tóng Gōng: a practical configuration perspective'
    summary:
      You can explore this configuration through a specific situation and adjust the reading to
      your experience.
    body:
      You can use this configuration to reflect on a practical tendency. Zǐ Fǔ Tóng Gōng (紫府同宫) —
      the traditional name for a relationship among chart elements — is present because the Life
      Palace holds Zi Wei and Tian Fu together, connecting a sense of direction with stewardship of
      existing resources. You may feel comfortable naming an aim and then arranging the support
      needed to keep it going. A plan feels more convincing when somebody knows how it will be
      maintained. When organizing a reading group, you might propose the theme but also arrange a
      rotation and shared archive. That second step lets another participant continue the activity
      without relying on you. Try naming the owner of the direction and the owner of the resources
      separately. Invite a participant to suggest a simpler routine before making the arrangement
      permanent. Check the result in your own setting and revise the interpretation when the
      observed experience differs.
    advice:
      - Try naming the owner of the direction and the owner of the resources separately. Invite a
        participant to suggest a simpler routine before making the arrangement permanent
    do:
      - Note observations
    dont:
      - Rush conclusions
  meta:
    author: t23-ziwei-editorial-v1
    reviewed_by: null
    version: 1
    status: published
- id: ziwei.pattern.zi_fu_chao_yuan
  system: ziwei
