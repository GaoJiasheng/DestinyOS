    title: 日月并明：外向表达与细致准备有机会相互支持
    summary: 你可以从外向表达与细致准备有机会相互支持这个角度观察生活。
    body: 你可以从外向表达与细致准备有机会相互支持这个角度观察自己的选择。日月并明（传统上为这组星曜位置关系取的名称）在本盘命中，因为太阳与太阴在命、财、官、迁的范围都显示庙旺亮度。这里说的是要素如何相互联系，而不是一件将要发生的事。比如，你介绍一项计划前认真整理细节，再在会上把想法讲清楚，准备和展示各自发挥作用。这个场景需要结合你已有的经验、参与者的实际需要和当前能投入的精力来看。建议公开表达后请一位伙伴核对细节，把顺手的表现当作继续练习的起点。把尝试之后的新信息也纳入判断，若这个角度与你的经历不符，就调整观察方法，不必让名称限制自己的选择。
    advice:
      - 公开表达后请一位伙伴核对细节，把顺手的表现当作继续练习的起点
    do:
