  zh:
    title: 君臣庆会：统筹能力需要能互相回应的协作者
    summary: 你可以从统筹能力需要能互相回应的协作者这个角度观察生活。
    body: 你可以从统筹能力需要能互相回应的协作者这个角度观察自己的选择。君臣庆会（传统上为这组星曜位置关系取的名称）在本盘命中，因为紫微坐命，命、财、官、迁的范围会齐左辅与右弼。这里说的是要素如何相互联系，而不是一件将要发生的事。比如，带一个小项目时，你提出方向，伙伴补充细节与执行反馈，比自己掌握全部信息更便于发现遗漏。这个场景需要结合你已有的经验、参与者的实际需要和当前能投入的精力来看。建议问清每位伙伴愿意承担哪一部分，把不同意见当作修正目标的信息。把尝试之后的新信息也纳入判断，若这个角度与你的经历不符，就调整观察方法，不必让名称限制自己的选择。
    advice:
      - 问清每位伙伴愿意承担哪一部分，把不同意见当作修正目标的信息
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Jūn Chén Qìng Huì: a practical configuration perspective'
    summary:
      You can explore this configuration through a specific situation and adjust the reading to
      your experience.
    body:
      You can use this configuration to reflect on a practical tendency. Jūn Chén Qìng Huì (君臣庆会) —
      the traditional name for a relationship among chart elements — is present because Zi Wei
      occupies the Life Palace while Zuo Fu and You Bi appear across its associated life, wealth,
      career and travel areas. You may work more effectively when a sense of direction is
      accompanied by practical and responsive assistance. The traditional name uses court imagery,
      but the everyday question is how cooperation supports a shared aim. On a small project, you
      could propose the direction while collaborators bring details and feedback from execution.
      Their different vantage points may identify something you could not see alone. Consider asking
      each collaborator what they can own and where they need a response from you. Treat
      disagreement as information for refining the aim, and check that responsibility matches
      available time. Check the result in your own setting and revise the interpretation when the
      observed experience differs.
    advice:
      - Consider asking each collaborator what they can own and where they need a response from you.
        Treat disagreement as information for refining the aim, and check that responsibility
        matches available time
    do:
      - Note observations
    dont:
      - Rush conclusions
  meta:
    author: t23-ziwei-editorial-v1
    reviewed_by: null
    version: 1
    status: published
