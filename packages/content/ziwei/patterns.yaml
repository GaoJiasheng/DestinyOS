  zh:
    title: 府相朝垣：资源维护和程序协调可以互相补充
    summary: 你可以从资源维护和程序协调可以互相补充这个角度观察生活。
    body: 你可以从资源维护和程序协调可以互相补充这个角度观察自己的选择。府相朝垣（传统上为这组星曜位置关系取的名称）在本盘命中，因为天府与天相在命、财、官、迁的范围相会。这里说的是要素如何相互联系，而不是一件将要发生的事。比如，共同筹备活动时，一边盘点场地和材料，一边讨论谁有权调整安排，能让稳定和公平并行。这个场景需要结合你已有的经验、参与者的实际需要和当前能投入的精力来看。建议在已有流程中加一个可反馈的节点，让维护规则的人也能听到实际使用者的意见。把尝试之后的新信息也纳入判断，若这个角度与你的经历不符，就调整观察方法，不必让名称限制自己的选择。
    advice:
      - 在已有流程中加一个可反馈的节点，让维护规则的人也能听到实际使用者的意见
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Fǔ Xiàng Cháo Yuán: a practical configuration perspective'
    summary:
      You can explore this configuration through a specific situation and adjust the reading to
      your experience.
    body:
      You can use this configuration to reflect on a practical tendency. Fǔ Xiàng Cháo Yuán (府相朝垣) —
      the traditional name for a relationship among chart elements — is present because Tian Fu and
      Tian Xiang meet within the combined life, wealth, career and travel areas. You may find
      practical value in connecting resource stewardship with fair procedure. A dependable
      arrangement is easier to use when people understand both what is available and how decisions
      are made. While preparing an event, one person might check materials and venue access while
      another clarifies who can change the schedule. Keeping those responsibilities visible can
      reduce confusion without concentrating control. Try adding a feedback point to an established
      process. Ask the people using it where a rule supports them and where a small revision would
      improve the handover. Check the result in your own setting and revise the interpretation when
      the observed experience differs.
    advice:
      - Try adding a feedback point to an established process. Ask the people using it where a rule
        supports them and where a small revision would improve the handover
    do:
      - Note observations
    dont:
      - Rush conclusions
  meta:
    author: t23-ziwei-editorial-v1
