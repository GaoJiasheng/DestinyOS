  zh:
    title: 杀破狼：决断、重新组织与探索新经验可能互相推动
    summary: 你可以从决断、重新组织与探索新经验可能互相推动这个角度观察生活。
    body: 你可以从决断、重新组织与探索新经验可能互相推动这个角度观察自己的选择。杀破狼（传统上为这组星曜位置关系取的名称）在本盘命中，因为七杀、破军、贪狼在命、财、官、迁的范围相会。这里说的是要素如何相互联系，而不是一件将要发生的事。比如，面对旧流程反复卡住，你可能想停止一段无效做法，尝试新工具并重新分配任务。这个场景需要结合你已有的经验、参与者的实际需要和当前能投入的精力来看。建议为变化划清试验范围和回顾日期，保留资料与交接，让探索不会挤掉已有责任。把尝试之后的新信息也纳入判断，若这个角度与你的经历不符，就调整观察方法，不必让名称限制自己的选择。
    advice:
      - 为变化划清试验范围和回顾日期，保留资料与交接，让探索不会挤掉已有责任
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Shā Pò Láng: a practical configuration perspective'
    summary:
      You can explore this configuration through a specific situation and adjust the reading to
      your experience.
    body:
      You can use this configuration to reflect on a practical tendency. Shā Pò Láng (杀破狼) — the
      traditional name for a relationship among chart elements — is present because Qi Sha, Po Jun
      and Tan Lang meet across the associated life, wealth, career and travel areas. You may feel a
      connection between decisive action, structural change and exploring unfamiliar possibilities.
      The dramatic traditional name describes this combination of tendencies; it does not establish
      what will happen in your life. If an old process repeatedly stalls, you might want to retire
      an ineffective step, try another tool and redistribute the work. Each change can be useful,
      but making them together complicates learning from the result. Try defining a limited trial
      and a review date before changing the arrangement. Preserve the information and handover
      needed to meet existing commitments while you assess what the experiment actually improved.
      Check the result in your own setting and revise the interpretation when the observed
      experience differs.
    advice:
      - Try defining a limited trial and a review date before changing the arrangement. Preserve the
        information and handover needed to meet existing commitments while you assess what the
        experiment actually improved
    do:
      - Note observations
    dont:
      - Rush conclusions
  meta:
    author: t23-ziwei-editorial-v1
    reviewed_by: null
    version: 1
    status: published
