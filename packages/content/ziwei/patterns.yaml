      the traditional name for a relationship among chart elements — is present because Huo Xing and
      Ling Xing occupy opposite flanking areas beside the Life Palace. You may find it useful to
      examine how immediate demands and ongoing reminders enter your attention from surrounding
      commitments. The flanking structure describes a relationship among chart areas rather than an
