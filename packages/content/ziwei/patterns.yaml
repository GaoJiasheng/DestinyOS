  zh:
    title: 紫府朝垣：不同生活领域之间可能存在统筹与稳住资源的呼应
    summary: 你可以从不同生活领域之间可能存在统筹与稳住资源的呼应这个角度观察生活。
    body: 你可以从不同生活领域之间可能存在统筹与稳住资源的呼应这个角度观察自己的选择。紫府朝垣（传统上为这组星曜位置关系取的名称）在本盘命中，因为命、财、官、迁组成的观察范围会齐紫微与天府。这里说的是要素如何相互联系，而不是一件将要发生的事。比如，工作方式调整时，你可能同时考虑外部配合与现有资源，让新计划接得上原来的积累。这个场景需要结合你已有的经验、参与者的实际需要和当前能投入的精力来看。建议画出目标、支持条件与交接的关系，先处理一个真正缺少负责人的环节。把尝试之后的新信息也纳入判断，若这个角度与你的经历不符，就调整观察方法，不必让名称限制自己的选择。
    advice:
      - 画出目标、支持条件与交接的关系，先处理一个真正缺少负责人的环节
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Zǐ Fǔ Cháo Yuán: a practical configuration perspective'
    summary:
      You can explore this configuration through a specific situation and adjust the reading to
      your experience.
    body:
      You can use this configuration to reflect on a practical tendency. Zǐ Fǔ Cháo Yuán (紫府朝垣) —
      the traditional name for a relationship among chart elements — is present because Zi Wei and
      Tian Fu are both present across the life, wealth, career and travel areas considered together.
      You may seek a connection between setting a direction and maintaining the resources that
      support it. The configuration concerns coordination across settings, rather than a single
      placement doing all the work. If a working routine changes, you might consider who outside the
      team needs to be informed and which existing materials can still be used. This can help a new
      method build on earlier effort. Consider drawing the connections between the aim, the
      available support and the handover. Assign one neglected connection to a person who has agreed
      to maintain it. Check the result in your own setting and revise the interpretation when the
      observed experience differs.
    advice:
      - Consider drawing the connections between the aim, the available support and the handover.
        Assign one neglected connection to a person who has agreed to maintain it
    do:
      - Note observations
    dont:
      - Rush conclusions
  meta:
    author: t23-ziwei-editorial-v1
    reviewed_by: null
    version: 1
    status: published
