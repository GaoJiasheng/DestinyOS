  en:
    title: 'Rì Yuè Bìng Míng: a practical configuration perspective'
    summary:
      You can explore this configuration through a specific situation and adjust the reading to
      your experience.
    body:
      You can use this configuration to reflect on a practical tendency. Rì Yuè Bìng Míng (日月并明) —
      the traditional name for a relationship among chart elements — is present because Tai Yang and
