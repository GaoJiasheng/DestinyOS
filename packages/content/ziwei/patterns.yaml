      the traditional name for a relationship among chart elements — is present because Di Kong and
      Di Jie occupy the two flanking areas beside the Life Palace. You may find it useful to review
      both the purpose of an arrangement and the effort it consumes. Di Kong concerns space and
      reappraisal; Di Jie draws attention to the cost of commitment. Their position describes
      surrounding influences in the symbolic model. If an activity no longer feels meaningful yet
