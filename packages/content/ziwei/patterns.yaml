  zh:
    title: 命无正曜：自我理解可以保留弹性，从外部互动寻找参照
    summary: 你可以从自我理解可以保留弹性，从外部互动寻找参照这个角度观察生活。
    body: 你可以从自我理解可以保留弹性，从外部互动寻找参照这个角度观察自己的选择。命无正曜（传统上为这组星曜位置关系取的名称）在本盘命中，因为命宫没有十四主星中的任何一颗，传统上借对宫主星辅助观察。这里说的是要素如何相互联系，而不是一件将要发生的事。比如，面对不同团队时，你可能采用不同的参与方式；先观察哪些做法让自己舒服，比立即选一个标签更有帮助。这个场景需要结合你已有的经验、参与者的实际需要和当前能投入的精力来看。建议记录两个不同场景的回应，把对宫线索当作比较视角，不把无主星理解为缺少能力。把尝试之后的新信息也纳入判断，若这个角度与你的经历不符，就调整观察方法，不必让名称限制自己的选择。
    advice:
      - 记录两个不同场景的回应，把对宫线索当作比较视角，不把无主星理解为缺少能力
    do:
