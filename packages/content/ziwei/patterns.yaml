      You can use this configuration to reflect on a practical tendency. Líng Tān Gé (铃贪格) — the
      traditional name for a relationship among chart elements — is present because Ling Xing and
      Tan Lang both occur in the Life Palace. You may keep returning mentally to a new interest
      after the immediate activity has ended. Ling Xing symbolizes sustained alertness and Tan Lang
