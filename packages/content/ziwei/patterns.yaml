  zh:
    title: 机月同梁：方法、细节、舒适感和经验支持形成多角度观察
    summary: 你可以从方法、细节、舒适感和经验支持形成多角度观察这个角度观察生活。
    body: 你可以从方法、细节、舒适感和经验支持形成多角度观察这个角度观察自己的选择。机月同梁（传统上为这组星曜位置关系取的名称）在本盘命中，因为天机、太阴、天同、天梁在命、财、官、迁的范围会齐。这里说的是要素如何相互联系，而不是一件将要发生的事。比如，改一项公共流程时，你可能想到如何简化步骤，也留意新人是否容易理解、老参与者能否适应。这个场景需要结合你已有的经验、参与者的实际需要和当前能投入的精力来看。建议选一个真实使用场景试行，再收集使用者的困难，不为照顾每个角度而延后所有决定。把尝试之后的新信息也纳入判断，若这个角度与你的经历不符，就调整观察方法，不必让名称限制自己的选择。
    advice:
      - 选一个真实使用场景试行，再收集使用者的困难，不为照顾每个角度而延后所有决定
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Jī Yuè Tóng Liáng: a practical configuration perspective'
    summary:
      You can explore this configuration through a specific situation and adjust the reading to
      your experience.
    body:
      'You can use this configuration to reflect on a practical tendency. Jī Yuè Tóng Liáng (机月同梁) —
      the traditional name for a relationship among chart elements — is present because Tian Ji, Tai
      Yin, Tian Tong and Tian Liang occur across the combined life, wealth, career and travel areas.
      You may approach an arrangement through several concerns: method, detail, ease of
      participation and experience. These perspectives can support thoughtful design, although
      considering every angle can also delay a workable trial. When revising a shared process, you
      might simplify steps while checking whether a newcomer can understand them and an experienced
      participant can adapt. The most useful design is the one people can actually use. Consider
      piloting the process in one real situation. Gather the difficulties people encounter, then
      prioritize one revision rather than waiting for a plan that anticipates every preference.
      Check the result in your own setting and revise the interpretation when the observed
      experience differs.'
    advice:
      - Consider piloting the process in one real situation. Gather the difficulties people
        encounter, then prioritize one revision rather than waiting for a plan that anticipates
        every preference
    do:
      - Note observations
    dont:
      - Rush conclusions
  meta:
    author: t23-ziwei-editorial-v1
    reviewed_by: null
    version: 1
    status: published
