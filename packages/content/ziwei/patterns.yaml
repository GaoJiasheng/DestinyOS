  zh:
    title: 紫微七杀：明确目标能让果断用在需要的地方
    summary: 你可以从明确目标能让果断用在需要的地方这个角度观察生活。
    body: 你可以从明确目标能让果断用在需要的地方这个角度观察自己的选择。紫微七杀（传统上为这组星曜位置关系取的名称）在本盘命中，因为紫微与七杀同在命宫，方向感和独立决断并列。这里说的是要素如何相互联系，而不是一件将要发生的事。比如，项目突然缩短时限时，你可能先圈定必要目标，再承担难处理的环节，而不是把所有事项一起加速。这个场景需要结合你已有的经验、参与者的实际需要和当前能投入的精力来看。建议先讲清可交付范围与资源限制，给协作者留一个及时提出异议的入口。把尝试之后的新信息也纳入判断，若这个角度与你的经历不符，就调整观察方法，不必让名称限制自己的选择。
    advice:
      - 先讲清可交付范围与资源限制，给协作者留一个及时提出异议的入口
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Zǐ Wēi Qī Shā: a practical configuration perspective'
    summary:
      You can explore this configuration through a specific situation and adjust the reading to
      your experience.
    body:
      You can use this configuration to reflect on a practical tendency. Zǐ Wēi Qī Shā (紫微七杀) — the
      traditional name for a relationship among chart elements — is present because Zi Wei and Qi
      Sha share the Life Palace, bringing overall direction together with independent decision
      making. You may be drawn to clarifying a priority and taking responsibility for a difficult
      part of the work. Focus can be useful under pressure, provided other people understand why the
      pace or scope has changed. If a deadline suddenly shortens, you might reduce the work to its
      necessary outcome before tackling a difficult handover. That is different from accelerating
      every task without examining its purpose. Try briefing collaborators on the deliverable, the
      resources available and what will be deferred. Establish a point for raising objections so
      decisive action stays connected to the people affected. Check the result in your own setting
      and revise the interpretation when the observed experience differs.
    advice:
      - Try briefing collaborators on the deliverable, the resources available and what will be
        deferred. Establish a point for raising objections so decisive action stays connected to the
        people affected
    do:
      - Note observations
    dont:
      - Rush conclusions
  meta:
    author: t23-ziwei-editorial-v1
