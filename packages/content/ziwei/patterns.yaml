    body: 你可以从提问与公开表达可能形成有用配合这个角度观察自己的选择。巨日同宫（传统上为这组星曜位置关系取的名称）在本盘命中，因为命宫在寅或申，巨门与太阳同坐。这里说的是要素如何相互联系，而不是一件将要发生的事。比如，解释复杂规则时，你先找出容易误解的地方，再用例子对外说明，能让疑问转为共同理解。这个场景需要结合你已有的经验、参与者的实际需要和当前能投入的精力来看。建议先辨清一个问题，再听听受众需要怎样的解释，不把表达热情变成长篇辩论。把尝试之后的新信息也纳入判断，若这个角度与你的经历不符，就调整观察方法，不必让名称限制自己的选择。
    advice:
      - 先辨清一个问题，再听听受众需要怎样的解释，不把表达热情变成长篇辩论
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Jù Rì Tóng Gōng: a practical configuration perspective'
    summary:
      You can explore this configuration through a specific situation and adjust the reading to
