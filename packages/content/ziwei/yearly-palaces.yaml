    body:
      You can give deliberate attention to managing everyday resources when reviewing this year’s
      arrangements. The yearly layer (liú nián — a perspective calculated from the year’s
      parameters) points to the Wealth Palace (cái bó gōng), which concerns habits around ordinary spending,
