# Original bilingual editorial content for T-23; sources are not quotations.
# // DESIGN-GAP: palaceIndex is the validated schema index, 0=life through 11=parents. The schema supplies only the current year; three-year planning is described as a rolling review rather than an invented forecast.
- id: ziwei.yearly.palace.life
  system: ziwei
  section: decadal_yearly
  topic: yearly_palace_life
  when:
    path: horoscope.yearly.palaceIndex
    eq: 0
  weight: 78
  polarity: neutral
  tags:
    - plain
  exclusive_with: []
  zh:
    title: 本年流年关联命宫
    summary: 你可以把自我表达作为本年的观察重点。
    body: 你可以把自我表达作为本年的一项观察重点。流年（按当年参数建立的观察层）在本盘关联命宫（观察你怎样认识自己和回应日常处境的领域），说明时间层的入口与这个主题相接；其他领域仍需要一起看。比如，接到陌生任务时，先观察自己是急于定方向，还是先询问细节。别用一个盘中标签覆盖自己在不同场合的变化。建议记录一次选择的理由，过几天看看是否仍认可，并在一个约定好的日期回顾是否帮助你更清楚地分配时间。一年中的实际安排可以随新信息调整，往后三年的计划也适合按现实节点滚动更新，不能由这一个年份的位置直接推出。
    advice:
      - 记录一次选择的理由，过几天看看是否仍认可
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: This year linked to Life Palace
    summary: You can use your everyday identity as one observation theme for this year.
    body: You can give deliberate attention to your everyday identity when reviewing this year’s
      arrangements. The yearly layer (liú nián — a perspective calculated from the year’s
      parameters) points to the Life Palace (mìng gōng), which concerns how you describe yourself and respond
      to ordinary situations. The index marks a thematic entry point rather than a specific outcome.
      When a new task arrives, notice whether you first seek a direction, gather details or ask what
      others need. Your response at home may differ from your response at work; leave room for that
      difference. Try to keep a short note on why you chose an approach and revisit it a few days
      later. Set a review date and assess whether the practice helped you allocate attention more
      clearly. For a three year outlook, review actual milestones as new information arrives rather
      than extrapolating future events from this single yearly position.
    advice:
      - Keep a short note on why you chose an approach and revisit it a few days later
    do:
      - Note observations
    dont:
      - Rush conclusions
  meta:
    author: t23-ziwei-editorial-v1
    reviewed_by: null
    version: 2
    status: published
