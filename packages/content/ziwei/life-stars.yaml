    - ziwei.life.ju_men.supported.b
  zh:
    title: 巨门坐命：找到发挥的场景
    summary: 你倾向辨析问题与语言表达，合适场景能让优势更清晰。
    body: 你认识自己的一个入口，是观察辨析问题与语言表达如何出现在日常选择里。巨门（代表辨析问题与语言表达的主星）在命宫（观察性格与日常回应的领域），并处于庙旺、得利（传统亮度中较易发挥的一组），象征表达渠道相对顺手。你容易发现说法里的漏洞，愿意追问证据与细节。例如，一份通知里的条件写得不清楚，你想逐条问明白；可以先指出最影响下一步的一处歧义，再问需要谁补充信息，避免让整个讨论停在反复辨词。连续追问可能被听成否定，尤其在对方尚未准备讨论时。建议先确认共同目标，再提出最关键的问题，把这次尝试的感受和结果放在一起复盘；亮度描述象征的表现条件，不是能力等级，环境与练习仍有调整空间。
    advice:
      - 建议先确认共同目标，再提出最关键的问题
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Jù Mén: finding conditions that suit you'
    summary: You may recognize yourself in questioning assumptions and working through language; a
      suitable setting can make that approach easier to use.
    body:
      You may find a useful starting point in questioning assumptions and working through language.
      Jù Mén  names a major star associated with that approach. It appears in the Life Palace
      (mìng gōng — the area for everyday identity) within the supported brightness group, which
      includes miao, wang, de and li — traditional labels for a comparatively accessible expression.
      You may question a claim that others accept quickly and want to understand what supports it.
      Picture reading an instruction that uses the same word in two different ways. Your question
      may reveal a real ambiguity. Start with the meaning that changes the practical next step, then
      ask the author for an example rather than debating every phrase. A useful question can sound
      like rejection when the other person is not ready for an extended examination. Try
      establishing a shared aim before raising the question most likely to clarify it. You can
      compare the original impulse with the response from others afterward. Brightness describes
      symbolic conditions of expression, so take this as a prompt for adjusting your surroundings
      and practice rather than a rating of personal ability.
    advice:
      - Try establishing a shared aim before raising the question most likely to clarify it
    do:
      - Note observations
    dont:
      - Rush conclusions
  meta:
    author: t23-ziwei-editorial-v1
    reviewed_by: null
    version: 2
    status: published
