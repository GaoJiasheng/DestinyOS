    body: 你更容易在实际相处里看见舒适感与温和相处这条性格线索。命宫（你回应外界与理解自己的观察位置）中的天同（象征舒适感与温和相处的主星），在本盘显示庙旺、得利（传统亮度中较易发挥的一组），象征表达渠道相对顺手。这意味着同一种倾向在不同支持条件下，可能表现得很不一样，不宜只给自己下一个固定评价。比如，你与亲近的人相处时很在意气氛，不想让小分歧破坏轻松感；可以挑一个双方有空的时段，把具体不便说出来，再一起商量怎样减少反复。为了维持舒服而回避困难话题，问题可能留到更忙的时候。不妨先让每个人说出可承担的一部分，再由你选一件适合当前精力的小事完成；结束时询问哪种配合最有帮助，把得到的反馈用于下一次安排。
    advice:
      - 在一次合作结束后，问问哪种配合对彼此最有帮助。
    do:
