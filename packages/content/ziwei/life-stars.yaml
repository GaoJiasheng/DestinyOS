    - ziwei.life.tai_yang.supported.b
  zh:
    title: 太阳坐命：找到发挥的场景
    summary: 你倾向公开表达与主动付出，合适场景能让优势更清晰。
    body: 你认识自己的一个入口，是观察公开表达与主动付出如何出现在日常选择里。太阳（代表公开表达与主动付出的主星）在命宫（观察性格与日常回应的领域），并处于庙旺、得利（传统亮度中较易发挥的一组），象征表达渠道相对顺手。你往往愿意把信息说清楚，也愿意先向别人伸出援手。例如，团队需要有人解释新规则时，你可能主动把背景和步骤讲清楚；说明结束后，询问大家能否找到要做的第一步，比持续讲更多信息更便于参与。持续回应所有人的需求，容易压缩自己恢复精力的时间。可以在答应帮忙前说清楚可投入的时间，把这次尝试的感受和结果放在一起复盘；亮度描述象征的表现条件，不是能力等级，环境与练习仍有调整空间。
    advice:
      - 可以在答应帮忙前说清楚可投入的时间
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Tài Yáng: finding conditions that suit you'
    summary: You may recognize yourself in visible contribution and outward engagement; a suitable
      setting can make that approach easier to use.
    body:
      You may find a useful starting point in visible contribution and outward engagement. Tài Yáng
      names a major star associated with that approach. It appears in the Life Palace (mìng
      gōng — the area for everyday identity) within the supported brightness group, which includes
      miao, wang, de and li — traditional labels for a comparatively accessible expression. You may
      feel useful when you share what you know and make a contribution people can see. Think of
      introducing a newcomer to a neighborhood activity. You may offer an explanation before being
      asked. A useful check is whether your welcome leaves room for them to ask questions and decide
      how much participation suits them. Being available to everyone can leave little room for your
      own priorities or quiet recovery. Try stating how much time you can offer before agreeing to
      help. You can compare the original impulse with the response from others afterward. Brightness
      describes symbolic conditions of expression, so take this as a prompt for adjusting your
      surroundings and practice rather than a rating of personal ability.
    advice:
      - Try stating how much time you can offer before agreeing to help
    do:
      - Note observations
    dont:
      - Rush conclusions
