  zh:
    title: 贪狼坐命：找到发挥的场景
    summary: 你倾向探索欲与社交学习，合适场景能让优势更清晰。
    body: 你认识自己的一个入口，是观察探索欲与社交学习如何出现在日常选择里。贪狼（代表探索欲与社交学习的主星）在命宫（观察性格与日常回应的领域），并处于庙旺、得利（传统亮度中较易发挥的一组），象征表达渠道相对顺手。你倾向从新体验和人与人的交流里获得灵感，兴趣常跨越多个领域。例如，一个新兴趣让你想参加体验课，还想认识同样好奇的人；可以先给它一个周末，回来再看愿不愿意持续练习，而不急着把每个灵感都排进日程。同时展开太多尝试，可能让真正喜欢的事情失去持续投入。不妨为本周保留一个探索项目，其他灵感先记下来，把这次尝试的感受和结果放在一起复盘；亮度描述象征的表现条件，不是能力等级，环境与练习仍有调整空间。
    advice:
      - 不妨为本周保留一个探索项目，其他灵感先记下来
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Tān Láng: finding conditions that suit you'
    summary:
      You may recognize yourself in curiosity, variety and learning through contact; a suitable
      setting can make that approach easier to use.
    body:
      You may find a useful starting point in curiosity, variety and learning through contact. Tān
      Láng  names a major star associated with that approach. It appears in the Life Palace (
      mìng gōng — the area for everyday identity) within the supported brightness group, which
      includes miao, wang, de and li — traditional labels for a comparatively accessible expression.
      You may learn through new experiences, informal conversations and interests that cross
      conventional categories. Think of discovering an unfamiliar creative activity through a
      conversation. You may want to explore it immediately. A single introductory attempt can reveal
      whether the interest remains engaging once it includes ordinary practice and preparation. Too
      many attractive openings can dilute the attention a meaningful project needs. Consider keeping
      one active experiment this week and saving the other ideas for later. You can compare the
      original impulse with the response from others afterward. Brightness describes symbolic
      conditions of expression, so take this as a prompt for adjusting your surroundings and
      practice rather than a rating of personal ability.
    advice:
      - Consider keeping one active experiment this week and saving the other ideas for later
    do:
      - Note observations
    dont:
      - Rush conclusions
