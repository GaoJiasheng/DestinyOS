    body: 你更容易在实际相处里看见探索欲与社交学习这条性格线索。命宫（你回应外界与理解自己的观察位置）中的贪狼（象征探索欲与社交学习的主星），在本盘显示平、不或陷（传统亮度中需要更多情境支持的一组），提示表达方式较受环境影响。这意味着同一种倾向在不同支持条件下，可能表现得很不一样，不宜只给自己下一个固定评价。比如，社交活动里你同时听到几项有趣计划，容易每一项都想参与；可以先记下联系人与下一步，只选择一个当前有余力的尝试，让好奇得到具体的落点。同时展开太多尝试，可能让真正喜欢的事情失去持续投入。不妨先让每个人说出可承担的一部分，再由你选一件适合当前精力的小事完成；结束时询问哪种配合最有帮助，把得到的反馈用于下一次安排。
    advice:
      - 在一次合作结束后，问问哪种配合对彼此最有帮助。
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Tān Láng: learning through everyday interaction'
    summary: You can explore curiosity, variety and learning through contact by noticing how you
      participate with other people.
    body: You may understand your own preferences more clearly through ordinary interactions than
      through a single label. The Life Palace (mìng gōng — a perspective on identity and
      everyday responses) contains Tān Láng — a symbol for curiosity, variety and learning
      through contact. Its placement falls in the restrained brightness group, which includes ping,
      bu and xian — labels suggesting greater dependence on context and support. These conditions
      invite you to compare situations instead of assuming one description applies everywhere.
      Imagine a weekend with several appealing invitations. Ask which experience you would like to
      understand more deeply rather than trying to sample them all. Curiosity can become more
      satisfying when one contact has time to develop beyond a first impression. Too many attractive
      openings can dilute the attention a meaningful project needs. Try asking everyone what they
      can reasonably take on, then choose one responsibility that fits your present capacity. After
      the gathering, ask which part of the cooperation felt helpful. Use that answer to adjust your
      next attempt while keeping room for preferences to change.
    advice:
      - Ask which contribution helped before repeating your usual approach.
    do:
      - Note observations
    dont:
      - Rush conclusions
