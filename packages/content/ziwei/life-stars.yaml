    body: 你认识自己的一个入口，是观察协调关系与维护程序如何出现在日常选择里。天相（代表协调关系与维护程序的主星）在命宫（观察性格与日常回应的领域），并处于平、不或陷（传统亮度中需要更多情境支持的一组），提示表达方式较受环境影响。你往往愿意听两边的说法，重视规则能否让合作顺畅。例如，一项共同行动需要协调不同偏好，你愿意让每个人先说条件；意见收集之后，也要说明你建议怎样开始，让公平的程序有一个可执行的出口。反复等待所有人同意，可能让自己的立场越来越模糊。可以在听取意见后明确自己的选择和理由，把这次尝试的感受和结果放在一起复盘；亮度描述象征的表现条件，不是能力等级，环境与练习仍有调整空间。
    advice:
      - 可以在听取意见后明确自己的选择和理由
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Tiān Xiàng: finding conditions that suit you'
    summary: You may recognize yourself in coordination, fairness and procedural care; supportive
      conditions can help you express it with less strain.
    body:
      You may find a useful starting point in coordination, fairness and procedural care. Tiān Xiàng
      names a major star associated with that approach. It appears in the Life Palace (mìng
      gōng — the area for everyday identity) within the restrained brightness group, which includes
      ping, bu and xian — labels suggesting greater dependence on context and support. You may be
      comfortable hearing several perspectives and using a fair process to keep cooperation
      workable. Think of facilitating a discussion about shared space. Hearing each person’s
      constraint can improve the process, while a stated recommendation gives everyone something
      concrete to respond to. Fairness is easier to assess when the next step is visible. Seeking
      agreement from everyone can obscure the judgment you are responsible for making. Consider
      stating your own recommendation after you have heard the relevant perspectives. You can
      compare the original impulse with the response from others afterward. Brightness describes
      symbolic conditions of expression, so take this as a prompt for adjusting your surroundings
      and practice rather than a rating of personal ability.
    advice:
      - Consider stating your own recommendation after you have heard the relevant perspectives
    do:
      - Note observations
    dont:
      - Rush conclusions
