  zh:
    title: 天同坐命：找到发挥的场景
    summary: 你倾向舒适感与温和相处，合适场景能让优势更清晰。
    body: 你认识自己的一个入口，是观察舒适感与温和相处如何出现在日常选择里。天同（代表舒适感与温和相处的主星）在命宫（观察性格与日常回应的领域），并处于庙旺、得利（传统亮度中较易发挥的一组），象征表达渠道相对顺手。你容易留意气氛是否轻松，愿意给别人一个缓和的台阶。例如，你希望让第一次见面的伙伴放松，会先从轻松话题聊起；当大家熟悉之后，再说清楚活动要怎样开始，舒适感就能和实际推进一起保留。为了维持舒服而回避困难话题，问题可能留到更忙的时候。可以先处理一件小而具体的事情，再安排休息，把这次尝试的感受和结果放在一起复盘；亮度描述象征的表现条件，不是能力等级，环境与练习仍有调整空间。
    advice:
      - 可以先处理一件小而具体的事情，再安排休息
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Tiān Tóng: finding conditions that suit you'
    summary:
      You may recognize yourself in ease, belonging and gentle cooperation; a suitable setting
      can make that approach easier to use.
    body: You may find a useful starting point in ease, belonging and gentle cooperation. Tiān Tóng
      names a major star associated with that approach. It appears in the Life Palace (mìng gōng
      — the area for everyday identity) within the supported brightness group, which includes miao,
      wang, de and li — traditional labels for a comparatively accessible expression. You may be
      sensitive to the atmosphere around you and good at making participation feel less demanding.
      Imagine hosting a small study session. A welcoming atmosphere can make questions easier to
      ask, but a modest opening task also gives the group somewhere to begin. Notice whether ease is
      supporting participation or postponing it. Avoiding an awkward conversation to preserve
      comfort can leave the practical issue unresolved. Try completing one modest task before
      settling into a restorative break. You can compare the original impulse with the response from
      others afterward. Brightness describes symbolic conditions of expression, so take this as a
      prompt for adjusting your surroundings and practice rather than a rating of personal ability.
    advice:
      - Try completing one modest task before settling into a restorative break
    do:
      - Note observations
    dont:
      - Rush conclusions
