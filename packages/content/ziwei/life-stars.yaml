    body: 你更容易在实际相处里看见独立决断与应对挑战这条性格线索。命宫（你回应外界与理解自己的观察位置）中的七杀（象征独立决断与应对挑战的主星），在本盘显示庙旺、得利（传统亮度中较易发挥的一组），象征表达渠道相对顺手。这意味着同一种倾向在不同支持条件下，可能表现得很不一样，不宜只给自己下一个固定评价。比如，你独立处理一个陌生环节时想快速给出结果，但尚有信息缺口；可以先完成确定的部分，并说清需要确认的节点，把求助放进原来的计划。行动太快时，协作者可能还没理解计划为何改变。不妨先让每个人说出可承担的一部分，再由你选一件适合当前精力的小事完成；结束时询问哪种配合最有帮助，把得到的反馈用于下一次安排。
    advice:
      - 在一次合作结束后，问问哪种配合对彼此最有帮助。
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Qī Shā: learning through everyday interaction'
    summary:
      You can explore independent decisions and focused responses to a challenge by noticing how
      you participate with other people.
    body: You may understand your own preferences more clearly through ordinary interactions than
      through a single label. The Life Palace (mìng gōng — a perspective on identity and
      everyday responses) contains Qī Shā — a symbol for independent decisions and focused
      responses to a challenge. Its placement falls in the supported brightness group, which
      includes miao, wang, de and li — traditional labels for a comparatively accessible expression.
      These conditions invite you to compare situations instead of assuming one description applies
      everywhere. Imagine owning the difficult part of a shared project. It may feel efficient to
      proceed alone, yet an agreed checkpoint can reveal a changed requirement early. Asking for
      relevant information at that point supports responsibility rather than diminishing it. Moving
      rapidly can leave collaborators trying to understand a decision that has already become
      action. Try asking everyone what they can reasonably take on, then choose one responsibility
      that fits your present capacity. After the gathering, ask which part of the cooperation felt
      helpful. Use that answer to adjust your next attempt while keeping room for preferences to
      change.
    advice:
      - Ask which contribution helped before repeating your usual approach.
    do:
      - Note observations
    dont:
      - Rush conclusions
