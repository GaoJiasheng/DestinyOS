    body: 你认识自己的一个入口，是观察细致观察与安静积累如何出现在日常选择里。太阴（代表细致观察与安静积累的主星）在命宫（观察性格与日常回应的领域），并处于庙旺、得利（传统亮度中较易发挥的一组），象征表达渠道相对顺手。你容易注意未被说出口的需要，愿意在幕后把细节整理好。例如，你提前把讨论资料标上重点，希望别人能顺利理解；准备完成之后，也可以直接说出自己需要怎样的反馈，别让细致工作和个人期待都藏在幕后。把需要藏得太久，别人可能误以为你没有意见。可以把一个具体需要用简短的话直接表达，把这次尝试的感受和结果放在一起复盘；亮度描述象征的表现条件，不是能力等级，环境与练习仍有调整空间。
    advice:
      - 可以把一个具体需要用简短的话直接表达
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Tài Yīn: finding conditions that suit you'
    summary:
      You may recognize yourself in careful observation and quiet preparation; a suitable setting
      can make that approach easier to use.
    body: You may find a useful starting point in careful observation and quiet preparation. Tài Yīn
      names a major star associated with that approach. It appears in the Life Palace (mìng
      gōng — the area for everyday identity) within the supported brightness group, which includes
      miao, wang, de and li — traditional labels for a comparatively accessible expression. You may
      notice needs people have not voiced and contribute through thoughtful preparation behind the
      scenes. Picture preparing notes before a sensitive conversation. The quiet work may help you
      understand your own preferences. Sharing one of those preferences clearly can then give the
      other person information they could not obtain by guessing. Others cannot reliably respond to
      a preference that stays inside your private reflections. Try naming one practical preference
      without waiting for someone to infer it. You can compare the original impulse with the
      response from others afterward. Brightness describes symbolic conditions of expression, so
      take this as a prompt for adjusting your surroundings and practice rather than a rating of
      personal ability.
