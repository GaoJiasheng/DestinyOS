    body: 你认识自己的一个入口，是观察执行纪律与资源核算如何出现在日常选择里。武曲（代表执行纪律与资源核算的主星）在命宫（观察性格与日常回应的领域），并处于平、不或陷（传统亮度中需要更多情境支持的一组），提示表达方式较受环境影响。你倾向通过可检查的结果建立信任，喜欢把责任和数量讲明白。例如，你接手一个物料清单时，先核对数量、用途与责任人，能让交接更清楚；若对方仍不放心，不妨问问他担心的是缺漏、时间还是沟通方式。只关注效率时，别人可能听不到你在意他们的感受。建议在讨论数量之后，再问一句对方最在意什么，把这次尝试的感受和结果放在一起复盘；亮度描述象征的表现条件，不是能力等级，环境与练习仍有调整空间。
    advice:
      - 建议在讨论数量之后，再问一句对方最在意什么
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Wǔ Qū: finding conditions that suit you'
    summary: You may recognize yourself in disciplined execution and resource accounting; supportive
      conditions can help you express it with less strain.
    body:
      You may find a useful starting point in disciplined execution and resource accounting. Wǔ Qū
      names a major star associated with that approach. It appears in the Life Palace (mìng
      gōng — the area for everyday identity) within the restrained brightness group, which includes
      ping, bu and xian — labels suggesting greater dependence on context and support. You often
      build trust through measurable results, clear commitments and careful use of resources.
      Picture setting up a shared equipment checkout. Clear quantities and return dates may feel
      reassuring to you. Ask the users what would make the arrangement easier to follow, since a
      precise system still needs workable participation. An efficient answer may miss the emotional
      question someone was actually asking. Consider asking what matters emotionally after you have
      clarified the practical numbers. You can compare the original impulse with the response from
      others afterward. Brightness describes symbolic conditions of expression, so take this as a
      prompt for adjusting your surroundings and practice rather than a rating of personal ability.
    advice:
      - Consider asking what matters emotionally after you have clarified the practical numbers
    do:
      - Note observations
    dont:
      - Rush conclusions
