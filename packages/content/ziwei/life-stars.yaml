    body: 你更容易在实际相处里看见边界意识与价值选择这条性格线索。命宫（你回应外界与理解自己的观察位置）中的廉贞（象征边界意识与价值选择的主星），在本盘显示庙旺、得利（传统亮度中较易发挥的一组），象征表达渠道相对顺手。这意味着同一种倾向在不同支持条件下，可能表现得很不一样，不宜只给自己下一个固定评价。比如，朋友开了一个让你不舒服的玩笑，你想让对方知道边界；先描述发生了什么，再说希望以后怎样称呼或回应，能让请求比情绪更容易被听见。当立场和情绪混在一起，讨论容易变成对人的评价。不妨先让每个人说出可承担的一部分，再由你选一件适合当前精力的小事完成；结束时询问哪种配合最有帮助，把得到的反馈用于下一次安排。
    advice:
      - 在一次合作结束后，问问哪种配合对彼此最有帮助。
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Lián Zhēn: learning through everyday interaction'
    summary:
      You can explore personal boundaries and value based choices by noticing how you participate
      with other people.
    body: You may understand your own preferences more clearly through ordinary interactions than
      through a single label. The Life Palace (mìng gōng — a perspective on identity and
      everyday responses) contains Lián Zhēn — a symbol for personal boundaries and value based
      choices. Its placement falls in the supported brightness group, which includes miao, wang, de
      and li — traditional labels for a comparatively accessible expression. These conditions invite
      you to compare situations instead of assuming one description applies everywhere. Imagine a
      group using a communication style that does not feel comfortable to you. Rather than making a
      judgment about everyone involved, describe one exchange and the change you would prefer. A
      boundary becomes more usable when it names an action. A disagreement about a process can
      become personal when feelings and principles are treated as one thing. Try asking everyone
      what they can reasonably take on, then choose one responsibility that fits your present
      capacity. After the gathering, ask which part of the cooperation felt helpful. Use that answer
      to adjust your next attempt while keeping room for preferences to change.
    advice:
      - Ask which contribution helped before repeating your usual approach.
    do:
      - Note observations
    dont:
      - Rush conclusions
