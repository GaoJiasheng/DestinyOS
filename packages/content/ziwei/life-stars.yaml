        eq: tian_xiang
      - path: palaces[key=life].majorStars[key=tian_xiang].brightness
        in:
          - ping
          - bu
          - xian
  weight: 85
  polarity: neutral
  tags:
    - plain
    - personality
  exclusive_with:
    - ziwei.life.tian_xiang.restrained.a
  zh:
    title: 天相坐命：用小步练习磨合
    summary: 你可以从协调关系与维护程序的偏好出发，试着找到适合自己的节奏。
    body: 你更容易在实际相处里看见协调关系与维护程序这条性格线索。命宫（你回应外界与理解自己的观察位置）中的天相（象征协调关系与维护程序的主星），在本盘显示平、不或陷（传统亮度中需要更多情境支持的一组），提示表达方式较受环境影响。这意味着同一种倾向在不同支持条件下，可能表现得很不一样，不宜只给自己下一个固定评价。比如，伙伴各有一套安排，你想找到都能接受的方式；可以先区分必须满足与可以调整的条件，再提出一项可试行的规则，不用等到所有偏好完全一致。反复等待所有人同意，可能让自己的立场越来越模糊。不妨先让每个人说出可承担的一部分，再由你选一件适合当前精力的小事完成；结束时询问哪种配合最有帮助，把得到的反馈用于下一次安排。
    advice:
      - 在一次合作结束后，问问哪种配合对彼此最有帮助。
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Tiān Xiàng: learning through everyday interaction'
    summary:
      You can explore coordination, fairness and procedural care by noticing how you participate
      with other people.
    body: You may understand your own preferences more clearly through ordinary interactions than
      through a single label. The Life Palace (mìng gōng — a perspective on identity and
      everyday responses) contains Tiān Xiàng — a symbol for coordination, fairness and
      procedural care. Its placement falls in the restrained brightness group, which includes ping,
      bu and xian — labels suggesting greater dependence on context and support. These conditions
      invite you to compare situations instead of assuming one description applies everywhere.
      Imagine two collaborators expecting different handover procedures. You can identify what each
      procedure protects, then suggest a trial that addresses the essential requirements.
      Coordination includes expressing a judgment after you have listened. Seeking agreement from
      everyone can obscure the judgment you are responsible for making. Try asking everyone what
      they can reasonably take on, then choose one responsibility that fits your present capacity.
      After the gathering, ask which part of the cooperation felt helpful. Use that answer to adjust
      your next attempt while keeping room for preferences to change.
    advice:
      - Ask which contribution helped before repeating your usual approach.
    do:
      - Note observations
    dont:
      - Rush conclusions
  meta:
    author: t23-ziwei-editorial-v1
    reviewed_by: null
    version: 2
    status: published
