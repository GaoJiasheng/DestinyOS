    dont:
      - 仓促定论
  en:
    title: 'Tiān Tóng: learning through everyday interaction'
    summary:
      You can explore ease, belonging and gentle cooperation by noticing how you participate with
      other people.
    body: You may understand your own preferences more clearly through ordinary interactions than
      through a single label. The Life Palace (mìng gōng — a perspective on identity and
      everyday responses) contains Tiān Tóng — a symbol for ease, belonging and gentle
      cooperation. Its placement falls in the supported brightness group, which includes miao, wang,
      de and li — traditional labels for a comparatively accessible expression. These conditions
      invite you to compare situations instead of assuming one description applies everywhere. Think
      of a routine you enjoy because it feels comfortable. If a practical difficulty keeps
      returning, try naming that one issue during a calm interval. An easy relationship can
      accommodate a clear conversation when the request is specific. Avoiding an awkward
      conversation to preserve comfort can leave the practical issue unresolved. Try asking everyone
      what they can reasonably take on, then choose one responsibility that fits your present
      capacity. After the gathering, ask which part of the cooperation felt helpful. Use that answer
      to adjust your next attempt while keeping room for preferences to change.
    advice:
      - Ask which contribution helped before repeating your usual approach.
