      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Tiān Jī: learning through everyday interaction'
    summary:
      You can explore adaptive planning and practical ingenuity by noticing how you participate
      with other people.
    body: You may understand your own preferences more clearly through ordinary interactions than
      through a single label. The Life Palace (mìng gōng — a perspective on identity and
      everyday responses) contains Tiān Jī — a symbol for adaptive planning and practical
      ingenuity. Its placement falls in the restrained brightness group, which includes ping, bu and
      xian — labels suggesting greater dependence on context and support. These conditions invite
      you to compare situations instead of assuming one description applies everywhere. Imagine
      revising instructions for a shared tool. Instead of adding every possible improvement at once,
      watch a newcomer complete one task. Their actual pause or question can reveal which change
      deserves attention before you redesign the remainder. Repeatedly redesigning a workable plan
      can consume the time needed to test it. Try asking everyone what they can reasonably take on,
      then choose one responsibility that fits your present capacity. After the gathering, ask which
      part of the cooperation felt helpful. Use that answer to adjust your next attempt while
      keeping room for preferences to change.
    advice:
      - Ask which contribution helped before repeating your usual approach.
