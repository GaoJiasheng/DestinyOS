    author: t23-ziwei-editorial-v1
    reviewed_by: null
    version: 2
    status: published
- id: ziwei.life.lian_zhen.restrained.a
  system: ziwei
  section: life_palace
  topic: life_lian_zhen
  when:
    all:
      - path: palaces[key=life].majorStars[key=lian_zhen].key
        eq: lian_zhen
      - path: palaces[key=life].majorStars[key=lian_zhen].brightness
        in:
          - ping
          - bu
          - xian
  weight: 85
  polarity: neutral
  tags:
    - plain
    - personality
  exclusive_with:
    - ziwei.life.lian_zhen.restrained.b
  zh:
    title: 廉贞坐命：给表达留出条件
    summary: 你倾向边界意识与价值选择，先搭好支持条件会更从容。
    body: 你认识自己的一个入口，是观察边界意识与价值选择如何出现在日常选择里。廉贞（代表边界意识与价值选择的主星）在命宫（观察性格与日常回应的领域），并处于平、不或陷（传统亮度中需要更多情境支持的一组），提示表达方式较受环境影响。你倾向认真分辨什么值得投入，也在意做法是否符合自己的原则。例如，合作邀请与你重视的做法有差距时，你可能想先划清界限；把不能接受的环节说具体，再说明可以参与哪一部分，比直接评价整个方案更便于协商。当立场和情绪混在一起，讨论容易变成对人的评价。不妨把事实、感受和请求分别写下来，把这次尝试的感受和结果放在一起复盘；亮度描述象征的表现条件，不是能力等级，环境与练习仍有调整空间。
    advice:
      - 不妨把事实、感受和请求分别写下来
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Lián Zhēn: finding conditions that suit you'
    summary: You may recognize yourself in personal boundaries and value based choices; supportive
      conditions can help you express it with less strain.
    body:
      You may find a useful starting point in personal boundaries and value based choices. Lián Zhēn
      names a major star associated with that approach. It appears in the Life Palace (mìng
      gōng — the area for everyday identity) within the restrained brightness group, which includes
      ping, bu and xian — labels suggesting greater dependence on context and support. You may
      invest strongly in choices that express your values and notice when a boundary feels blurred.
      Picture being asked to join a project whose method conflicts with a value you care about. You
      can identify the exact practice that concerns you and what alternative would make
      participation possible, leaving a clear basis for discussion. A disagreement about a process
      can become personal when feelings and principles are treated as one thing. Try separating
      observable facts, your feelings and the specific change you are requesting. You can compare
      the original impulse with the response from others afterward. Brightness describes symbolic
      conditions of expression, so take this as a prompt for adjusting your surroundings and
      practice rather than a rating of personal ability.
    advice:
      - Try separating observable facts, your feelings and the specific change you are requesting
    do:
      - Note observations
    dont:
      - Rush conclusions
  meta:
    author: t23-ziwei-editorial-v1
    reviewed_by: null
    version: 2
    status: published
