- id: ziwei.life.po_jun.supported.a
  system: ziwei
  section: life_palace
  topic: life_po_jun
  when:
    all:
      - path: palaces[key=life].majorStars[key=po_jun].key
        eq: po_jun
      - path: palaces[key=life].majorStars[key=po_jun].brightness
        in:
          - miao
          - wang
          - de
          - li
  weight: 85
  polarity: neutral
  tags:
    - plain
    - personality
  exclusive_with:
    - ziwei.life.po_jun.supported.b
  zh:
    title: 破军坐命：找到发挥的场景
    summary: 你倾向拆解旧法与重新组织，合适场景能让优势更清晰。
    body: 你认识自己的一个入口，是观察拆解旧法与重新组织如何出现在日常选择里。破军（代表拆解旧法与重新组织的主星）在命宫（观察性格与日常回应的领域），并处于庙旺、得利（传统亮度中较易发挥的一组），象征表达渠道相对顺手。你倾向检视旧办法是否仍然有效，愿意从实际问题出发重新设计。例如，一个常用流程已不适合新的需求，你想直接换一种做法；可以先在小任务上试行，保留原始资料，再比较节省了什么、增加了什么交接成本。一次改动太多，可能分不清哪项变化真正有用。可以先做可撤回的小实验，再决定是否扩大，把这次尝试的感受和结果放在一起复盘；亮度描述象征的表现条件，不是能力等级，环境与练习仍有调整空间。
    advice:
      - 可以先做可撤回的小实验，再决定是否扩大
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Pò Jūn: finding conditions that suit you'
    summary: You may recognize yourself in reworking structures and experimenting with a new
      arrangement; a suitable setting can make that approach easier to use.
    body: You may find a useful starting point in reworking structures and experimenting with a new
      arrangement. Pò Jūn  names a major star associated with that approach. It appears in the
      Life Palace (mìng gōng — the area for everyday identity) within the supported brightness
      group, which includes miao, wang, de and li — traditional labels for a comparatively
      accessible expression. You may question an inherited arrangement and rebuild it around the
      problem it is supposed to solve. Picture an inherited filing method that no longer fits the
      materials being used. You may want to rebuild it around the actual need. Start with a small
      collection and preserve the previous labels until you know whether the new structure is easier
      to navigate. Changing several parts at once makes it difficult to tell which adjustment
      actually helped. Consider a reversible trial before extending a new arrangement to everything.
      You can compare the original impulse with the response from others afterward. Brightness
      describes symbolic conditions of expression, so take this as a prompt for adjusting your
      surroundings and practice rather than a rating of personal ability.
    advice:
      - Consider a reversible trial before extending a new arrangement to everything
    do:
      - Note observations
    dont:
      - Rush conclusions
  meta:
    author: t23-ziwei-editorial-v1
    reviewed_by: null
    version: 2
    status: published
