    body: 你更容易在实际相处里看见观察变化与设计方法这条性格线索。命宫（你回应外界与理解自己的观察位置）中的天机（象征观察变化与设计方法的主星），在本盘显示平、不或陷（传统亮度中需要更多情境支持的一组），提示表达方式较受环境影响。这意味着同一种倾向在不同支持条件下，可能表现得很不一样，不宜只给自己下一个固定评价。比如，几个人商量活动路线时，你很快想到几种备选方案；如果讨论持续改动，可以把天气与交通这两个关键条件写下来，到约定时间就选一个先试。频繁修改路线容易消耗执行时间，思考也需要一个停点。不妨先让每个人说出可承担的一部分，再由你选一件适合当前精力的小事完成；结束时询问哪种配合最有帮助，把得到的反馈用于下一次安排。
