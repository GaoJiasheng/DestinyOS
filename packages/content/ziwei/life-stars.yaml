# Original bilingual editorial content for T-23; sources are not quotations.
# // DESIGN-GAP: The KU schema has no variant field: variants use .a/.b IDs and reciprocal exclusions, so the current deterministic resolver retains one rather than repeating both. Brightness is partitioned into supported/restrained groups; no ability ranking is inferred.
- id: ziwei.life.zi_wei.supported.a
  system: ziwei
  section: life_palace
  topic: life_zi_wei
  when:
    all:
      - path: palaces[key=life].majorStars[key=zi_wei].key
        eq: zi_wei
      - path: palaces[key=life].majorStars[key=zi_wei].brightness
        in:
          - miao
          - wang
          - de
          - li
  weight: 85
  polarity: neutral
  tags:
    - plain
    - personality
  exclusive_with:
    - ziwei.life.zi_wei.supported.b
  zh:
    title: 紫微坐命：找到发挥的场景
    summary: 你倾向统筹方向与承担责任，合适场景能让优势更清晰。
    body: 你认识自己的一个入口，是观察统筹方向与承担责任如何出现在日常选择里。紫微（代表统筹方向与承担责任的主星）在命宫（观察性格与日常回应的领域），并处于庙旺、得利（传统亮度中较易发挥的一组），象征表达渠道相对顺手。你倾向先建立整体框架，再把事情交给合适的人推进。例如，你召集一次讨论时，可能先提出共同目标，再邀请不同的人负责议题和记录；若所有人都等你拍板，不妨明确哪些部分可以由伙伴独立决定。如果总把最后决定留给自己，别人可能没有充分表达的空间。可以先公开判断标准，再邀请别人指出一个遗漏，把这次尝试的感受和结果放在一起复盘；亮度描述象征的表现条件，不是能力等级，环境与练习仍有调整空间。
    advice:
      - 可以先公开判断标准，再邀请别人指出一个遗漏
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Zǐ Wēi: finding conditions that suit you'
    summary: You may recognize yourself in setting direction and holding responsibility; a suitable
      setting can make that approach easier to use.
    body:
      You may find a useful starting point in setting direction and holding responsibility. Zǐ Wēi
      names a major star associated with that approach. It appears in the Life Palace (mìng
      gōng — the area for everyday identity) within the supported brightness group, which includes
      miao, wang, de and li — traditional labels for a comparatively accessible expression. You
      often look for a coherent direction before deciding who should carry each part of a task.
      Imagine coordinating a volunteer rota. You might first explain the purpose, then ask people to
      own the intervals they can sustain. Notice whether the group can make an ordinary adjustment
      without returning every decision to you. Keeping every final decision for yourself can make
      capable people feel unheard. Try explaining your decision criteria before asking someone to
      challenge one assumption. You can compare the original impulse with the response from others
      afterward. Brightness describes symbolic conditions of expression, so take this as a prompt
      for adjusting your surroundings and practice rather than a rating of personal ability.
    advice:
      - Try explaining your decision criteria before asking someone to challenge one assumption
    do:
      - Note observations
    dont:
      - Rush conclusions
  meta:
    author: t23-ziwei-editorial-v1
    reviewed_by: null
    version: 2
    status: published
- id: ziwei.life.zi_wei.supported.b
  system: ziwei
  section: life_palace
  topic: life_zi_wei
  when:
    all:
      - path: palaces[key=life].majorStars[key=zi_wei].key
        eq: zi_wei
      - path: palaces[key=life].majorStars[key=zi_wei].brightness
        in:
          - miao
          - wang
          - de
          - li
  weight: 85
  polarity: neutral
  tags:
    - plain
    - personality
  exclusive_with:
    - ziwei.life.zi_wei.supported.a
  zh:
    title: 紫微坐命：让长处被看见
    summary: 你可以从统筹方向与承担责任的偏好出发，试着找到适合自己的节奏。
    body: 你更容易在实际相处里看见统筹方向与承担责任这条性格线索。命宫（你回应外界与理解自己的观察位置）中的紫微（象征统筹方向与承担责任的主星），在本盘显示庙旺、得利（传统亮度中较易发挥的一组），象征表达渠道相对顺手。这意味着同一种倾向在不同支持条件下，可能表现得很不一样，不宜只给自己下一个固定评价。比如，家里一起安排节日聚会时，你想先把整体日程定下来；与其直接分派，不妨先问每个人能参与多久，再把决定放在大家看得见的清单上。如果总把最后决定留给自己，别人可能没有充分表达的空间。不妨先让每个人说出可承担的一部分，再由你选一件适合当前精力的小事完成；结束时询问哪种配合最有帮助，把得到的反馈用于下一次安排。
    advice:
      - 在一次合作结束后，问问哪种配合对彼此最有帮助。
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Zǐ Wēi: learning through everyday interaction'
    summary: You can explore setting direction and holding responsibility by noticing how you
      participate with other people.
    body: You may understand your own preferences more clearly through ordinary interactions than
      through a single label. The Life Palace (mìng gōng — a perspective on identity and
      everyday responses) contains Zǐ Wēi — a symbol for setting direction and holding
      responsibility. Its placement falls in the supported brightness group, which includes miao,
      wang, de and li — traditional labels for a comparatively accessible expression. These
      conditions invite you to compare situations instead of assuming one description applies
      everywhere. Think of helping a community workshop find its direction. Before allocating every
      activity, invite participants to name what they can genuinely contribute. A clear aim can
      support shared ownership when people also have room to shape the means. Keeping every final
      decision for yourself can make capable people feel unheard. Try asking everyone what they can
      reasonably take on, then choose one responsibility that fits your present capacity. After the
      gathering, ask which part of the cooperation felt helpful. Use that answer to adjust your next
      attempt while keeping room for preferences to change.
    advice:
      - Ask which contribution helped before repeating your usual approach.
    do:
      - Note observations
    dont:
      - Rush conclusions
  meta:
    author: t23-ziwei-editorial-v1
    reviewed_by: null
    version: 2
    status: published
