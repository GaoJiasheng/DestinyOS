- id: ziwei.life.tai_yin.supported.b
  system: ziwei
  section: life_palace
  topic: life_tai_yin
  when:
    all:
      - path: palaces[key=life].majorStars[key=tai_yin].key
        eq: tai_yin
      - path: palaces[key=life].majorStars[key=tai_yin].brightness
        in:
          - miao
          - wang
          - de
          - li
  weight: 85
  polarity: neutral
  tags:
    - plain
    - personality
  exclusive_with:
    - ziwei.life.tai_yin.supported.a
  zh:
    title: 太阴坐命：让长处被看见
    summary: 你可以从细致观察与安静积累的偏好出发，试着找到适合自己的节奏。
    body: 你更容易在实际相处里看见细致观察与安静积累这条性格线索。命宫（你回应外界与理解自己的观察位置）中的太阴（象征细致观察与安静积累的主星），在本盘显示庙旺、得利（传统亮度中较易发挥的一组），象征表达渠道相对顺手。这意味着同一种倾向在不同支持条件下，可能表现得很不一样，不宜只给自己下一个固定评价。比如，约朋友见面时你在意环境是否安静，却只说随便选哪里；不妨提出一个具体偏好，让对方知道怎样安排更方便，既保留体贴，也让自己的需要被看见。把需要藏得太久，别人可能误以为你没有意见。不妨先让每个人说出可承担的一部分，再由你选一件适合当前精力的小事完成；结束时询问哪种配合最有帮助，把得到的反馈用于下一次安排。
    advice:
      - 在一次合作结束后，问问哪种配合对彼此最有帮助。
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Tài Yīn: learning through everyday interaction'
    summary:
      You can explore careful observation and quiet preparation by noticing how you participate
      with other people.
    body: You may understand your own preferences more clearly through ordinary interactions than
      through a single label. The Life Palace (mìng gōng — a perspective on identity and
      everyday responses) contains Tài Yīn — a symbol for careful observation and quiet
      preparation. Its placement falls in the supported brightness group, which includes miao, wang,
      de and li — traditional labels for a comparatively accessible expression. These conditions
      invite you to compare situations instead of assuming one description applies everywhere.
      Imagine reviewing a draft carefully before anyone else sees it. If you would like
      acknowledgment of that preparation, state the kind of response that would help. Thoughtful
      detail and a direct request can complement one another. Others cannot reliably respond to a
      preference that stays inside your private reflections. Try asking everyone what they can
      reasonably take on, then choose one responsibility that fits your present capacity. After the
      gathering, ask which part of the cooperation felt helpful. Use that answer to adjust your next
      attempt while keeping room for preferences to change.
    advice:
      - Ask which contribution helped before repeating your usual approach.
    do:
      - Note observations
    dont:
      - Rush conclusions
  meta:
    author: t23-ziwei-editorial-v1
    reviewed_by: null
    version: 2
    status: published
