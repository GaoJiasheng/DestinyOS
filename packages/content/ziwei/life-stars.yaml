    author: t23-ziwei-editorial-v1
    reviewed_by: null
    version: 2
    status: published
- id: ziwei.life.qi_sha.restrained.a
  system: ziwei
  section: life_palace
  topic: life_qi_sha
  when:
    all:
      - path: palaces[key=life].majorStars[key=qi_sha].key
        eq: qi_sha
      - path: palaces[key=life].majorStars[key=qi_sha].brightness
        in:
          - ping
          - bu
          - xian
  weight: 85
  polarity: neutral
  tags:
    - plain
    - personality
  exclusive_with:
    - ziwei.life.qi_sha.restrained.b
  zh:
    title: 七杀坐命：给表达留出条件
    summary: 你倾向独立决断与应对挑战，先搭好支持条件会更从容。
    body: 你认识自己的一个入口，是观察独立决断与应对挑战如何出现在日常选择里。七杀（代表独立决断与应对挑战的主星）在命宫（观察性格与日常回应的领域），并处于平、不或陷（传统亮度中需要更多情境支持的一组），提示表达方式较受环境影响。你容易在复杂局面里抓住优先事项，愿意承担有边界的困难任务。例如，几项事情同时临近截止，你可能先选最影响后续的环节集中完成；行动之前给伙伴说明取舍，再约定遇到新限制时怎样联络，能让专注更容易被配合。行动太快时，协作者可能还没理解计划为何改变。建议在启动之前交代目标、限制和求助的节点，把这次尝试的感受和结果放在一起复盘；亮度描述象征的表现条件，不是能力等级，环境与练习仍有调整空间。
    advice:
      - 建议在启动之前交代目标、限制和求助的节点
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Qī Shā: finding conditions that suit you'
    summary:
      You may recognize yourself in independent decisions and focused responses to a challenge;
      supportive conditions can help you express it with less strain.
    body: You may find a useful starting point in independent decisions and focused responses to a
      challenge. Qī Shā  names a major star associated with that approach. It appears in the
      Life Palace (mìng gōng — the area for everyday identity) within the restrained brightness
      group, which includes ping, bu and xian — labels suggesting greater dependence on context and
      support. You may cut through competing demands, identify a priority and take ownership of a
      difficult task. Think of a task with several competing demands and little preparation time.
      Identifying one necessary outcome can help focus your effort. Brief the people affected on
      what will wait and when a constraint should trigger another conversation. Moving rapidly can
      leave collaborators trying to understand a decision that has already become action. Try
      briefing others on the goal, constraints and point at which support will be needed. You can
      compare the original impulse with the response from others afterward. Brightness describes
      symbolic conditions of expression, so take this as a prompt for adjusting your surroundings
      and practice rather than a rating of personal ability.
    advice:
      - Try briefing others on the goal, constraints and point at which support will be needed
    do:
      - Note observations
    dont:
      - Rush conclusions
  meta:
    author: t23-ziwei-editorial-v1
    reviewed_by: null
    version: 2
    status: published
