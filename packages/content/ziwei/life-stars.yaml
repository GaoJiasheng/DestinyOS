- id: ziwei.life.tian_fu.supported.a
  system: ziwei
  section: life_palace
  topic: life_tian_fu
  when:
    all:
      - path: palaces[key=life].majorStars[key=tian_fu].key
        eq: tian_fu
      - path: palaces[key=life].majorStars[key=tian_fu].brightness
        in:
          - miao
          - wang
          - de
          - li
  weight: 85
  polarity: neutral
  tags:
    - plain
    - personality
  exclusive_with:
    - ziwei.life.tian_fu.supported.b
  zh:
    title: 天府坐命：找到发挥的场景
    summary: 你倾向储备意识与稳定管理，合适场景能让优势更清晰。
    body: 你认识自己的一个入口，是观察储备意识与稳定管理如何出现在日常选择里。天府（代表储备意识与稳定管理的主星）在命宫（观察性格与日常回应的领域），并处于庙旺、得利（传统亮度中较易发挥的一组），象征表达渠道相对顺手。你往往先确认手里的资源，再考虑怎样让日常运转更稳。例如，你为持续活动保留材料与记录，会先看看已有资源能支持多久；若新参与者有不同需求，不妨盘点哪些安排可以更新，让积累也能接住新的使用方式。对熟悉安排过于放心，可能错过调整分工的机会。建议定期盘点一次保留、更新和放下的事项，把这次尝试的感受和结果放在一起复盘；亮度描述象征的表现条件，不是能力等级，环境与练习仍有调整空间。
    advice:
      - 建议定期盘点一次保留、更新和放下的事项
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Tiān Fǔ: finding conditions that suit you'
    summary: You may recognize yourself in stewardship, reserves and dependable administration; a
      suitable setting can make that approach easier to use.
    body:
      You may find a useful starting point in stewardship, reserves and dependable administration.
      Tiān Fǔ  names a major star associated with that approach. It appears in the Life Palace
      (mìng gōng — the area for everyday identity) within the supported brightness group, which
      includes miao, wang, de and li — traditional labels for a comparatively accessible expression.
      You may prefer understanding existing resources before making a change that others will rely
      on. Think of maintaining a small shared library. Keeping materials available can be
      satisfying, yet a periodic review of what people actually borrow may reveal a simpler
      arrangement. Stewardship can include retiring an item that no longer serves its purpose. A
      reliable arrangement can become restrictive if nobody checks whether it still serves its
      purpose. Consider reviewing what to keep, refresh and retire from your current routine. You
      can compare the original impulse with the response from others afterward. Brightness describes
      symbolic conditions of expression, so take this as a prompt for adjusting your surroundings
      and practice rather than a rating of personal ability.
    advice:
      - Consider reviewing what to keep, refresh and retire from your current routine
    do:
      - Note observations
    dont:
      - Rush conclusions
  meta:
    author: t23-ziwei-editorial-v1
    reviewed_by: null
    version: 2
    status: published
