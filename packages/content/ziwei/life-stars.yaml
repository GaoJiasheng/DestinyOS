- id: ziwei.life.tian_ji.supported.a
  system: ziwei
  section: life_palace
  topic: life_tian_ji
  when:
    all:
      - path: palaces[key=life].majorStars[key=tian_ji].key
        eq: tian_ji
      - path: palaces[key=life].majorStars[key=tian_ji].brightness
        in:
          - miao
          - wang
          - de
          - li
  weight: 85
  polarity: neutral
  tags:
    - plain
    - personality
  exclusive_with:
    - ziwei.life.tian_ji.supported.b
  zh:
    title: 天机坐命：找到发挥的场景
    summary: 你倾向观察变化与设计方法，合适场景能让优势更清晰。
    body: 你认识自己的一个入口，是观察观察变化与设计方法如何出现在日常选择里。天机（代表观察变化与设计方法的主星）在命宫（观察性格与日常回应的领域），并处于庙旺、得利（传统亮度中较易发挥的一组），象征表达渠道相对顺手。你容易看见流程里的细小差异，并想出几种替代办法。例如，你发现每天都要重复整理同一种资料，想把流程缩成几步；可以先拿一份材料试行，再记录有没有遗漏，不必在第一天就重做全部安排。频繁修改路线容易消耗执行时间，思考也需要一个停点。不妨给每次比较设定期限，只验证一个最关键的假设，把这次尝试的感受和结果放在一起复盘；亮度描述象征的表现条件，不是能力等级，环境与练习仍有调整空间。
    advice:
      - 不妨给每次比较设定期限，只验证一个最关键的假设
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Tiān Jī: finding conditions that suit you'
    summary:
      You may recognize yourself in adaptive planning and practical ingenuity; a suitable setting
      can make that approach easier to use.
    body: You may find a useful starting point in adaptive planning and practical ingenuity. Tiān Jī
      names a major star associated with that approach. It appears in the Life Palace (mìng
      gōng — the area for everyday identity) within the supported brightness group, which includes
      miao, wang, de and li — traditional labels for a comparatively accessible expression. You may
      notice small inefficiencies and quickly imagine several workable alternatives. Picture
      comparing two routes for a recurring journey. Your interest in alternatives can be useful if
      you decide which practical question matters most, such as reliability or preparation time, and
      test that question on a manageable trip. Repeatedly redesigning a workable plan can consume
      the time needed to test it. Consider setting a decision deadline and testing the most
      important unknown first. You can compare the original impulse with the response from others
      afterward. Brightness describes symbolic conditions of expression, so take this as a prompt
      for adjusting your surroundings and practice rather than a rating of personal ability.
    advice:
      - Consider setting a decision deadline and testing the most important unknown first
    do:
      - Note observations
    dont:
      - Rush conclusions
  meta:
    author: t23-ziwei-editorial-v1
    reviewed_by: null
    version: 2
    status: published
