  zh:
    title: 廉贞坐命：找到发挥的场景
    summary: 你倾向边界意识与价值选择，合适场景能让优势更清晰。
    body: 你认识自己的一个入口，是观察边界意识与价值选择如何出现在日常选择里。廉贞（代表边界意识与价值选择的主星）在命宫（观察性格与日常回应的领域），并处于庙旺、得利（传统亮度中较易发挥的一组），象征表达渠道相对顺手。你倾向认真分辨什么值得投入，也在意做法是否符合自己的原则。例如，合作邀请与你重视的做法有差距时，你可能想先划清界限；把不能接受的环节说具体，再说明可以参与哪一部分，比直接评价整个方案更便于协商。当立场和情绪混在一起，讨论容易变成对人的评价。不妨把事实、感受和请求分别写下来，把这次尝试的感受和结果放在一起复盘；亮度描述象征的表现条件，不是能力等级，环境与练习仍有调整空间。
    advice:
