  tags:
    - plain
    - personality
  exclusive_with:
    - ziwei.life.wu_qu.restrained.a
  zh:
    title: 武曲坐命：用小步练习磨合
    summary: 你可以从执行纪律与资源核算的偏好出发，试着找到适合自己的节奏。
    body: 你更容易在实际相处里看见执行纪律与资源核算这条性格线索。命宫（你回应外界与理解自己的观察位置）中的武曲（象征执行纪律与资源核算的主星），在本盘显示平、不或陷（传统亮度中需要更多情境支持的一组），提示表达方式较受环境影响。这意味着同一种倾向在不同支持条件下，可能表现得很不一样，不宜只给自己下一个固定评价。比如，两个人分担一项长期任务时，你想把每周要完成的部分讲明白；除了核对进度，也可以问一句这个安排是否让对方感到有余地，必要时调整分工。只关注效率时，别人可能听不到你在意他们的感受。不妨先让每个人说出可承担的一部分，再由你选一件适合当前精力的小事完成；结束时询问哪种配合最有帮助，把得到的反馈用于下一次安排。
    advice:
      - 在一次合作结束后，问问哪种配合对彼此最有帮助。
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Wǔ Qū: learning through everyday interaction'
    summary: You can explore disciplined execution and resource accounting by noticing how you
      participate with other people.
    body: You may understand your own preferences more clearly through ordinary interactions than
      through a single label. The Life Palace (mìng gōng — a perspective on identity and
      everyday responses) contains Wǔ Qū — a symbol for disciplined execution and resource
      accounting. Its placement falls in the restrained brightness group, which includes ping, bu
      and xian — labels suggesting greater dependence on context and support. These conditions
      invite you to compare situations instead of assuming one description applies everywhere. Think
      of agreeing a practical contribution with a housemate. It may help to state the amount of time
      each task takes, then ask which part feels difficult. Measurable responsibility becomes easier
      to maintain when emotional concerns are heard too. An efficient answer may miss the emotional
      question someone was actually asking. Try asking everyone what they can reasonably take on,
      then choose one responsibility that fits your present capacity. After the gathering, ask which
      part of the cooperation felt helpful. Use that answer to adjust your next attempt while
      keeping room for preferences to change.
    advice:
      - Ask which contribution helped before repeating your usual approach.
    do:
      - Note observations
    dont:
      - Rush conclusions
