  zh:
    title: 天梁坐命：找到发挥的场景
    summary: 你倾向经验传递与保护意识，合适场景能让优势更清晰。
    body: 你认识自己的一个入口，是观察经验传递与保护意识如何出现在日常选择里。天梁（代表经验传递与保护意识的主星）在命宫（观察性格与日常回应的领域），并处于庙旺、得利（传统亮度中较易发挥的一组），象征表达渠道相对顺手。你倾向从长远角度看问题，也愿意替别人留意容易忽略的风险。例如，你见过类似任务遇到的困难，会提醒新人先做好检查；提点之前，不妨问对方已经了解什么，再决定是给一个例子，还是陪他试一遍。还没问清需要就给出指导，可能让帮助变成额外压力。不妨先问对方想要倾听、信息还是一起想办法，把这次尝试的感受和结果放在一起复盘；亮度描述象征的表现条件，不是能力等级，环境与练习仍有调整空间。
    advice:
      - 不妨先问对方想要倾听、信息还是一起想办法
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Tiān Liáng: finding conditions that suit you'
    summary:
      You may recognize yourself in protective judgment and learning from experience; a suitable
      setting can make that approach easier to use.
    body:
      You may find a useful starting point in protective judgment and learning from experience. Tiān
      Liáng  names a major star associated with that approach. It appears in the Life Palace
      (mìng gōng — the area for everyday identity) within the supported brightness group, which
      includes miao, wang, de and li — traditional labels for a comparatively accessible expression.
      You may look beyond an immediate result and notice practical risks a less experienced person
      could overlook. Picture someone asking about a task you have done before. Your experience may
      help identify an easily missed constraint. First ask what they have already tried, so the
      explanation answers their actual question rather than repeating an entire lesson. Advice
      offered before a need is understood can feel burdensome even when the intention is caring. Try
      asking whether someone wants listening, information or help thinking through options. You can
      compare the original impulse with the response from others afterward. Brightness describes
      symbolic conditions of expression, so take this as a prompt for adjusting your surroundings
      and practice rather than a rating of personal ability.
    advice:
      - Try asking whether someone wants listening, information or help thinking through options
    do:
      - Note observations
    dont:
      - Rush conclusions
