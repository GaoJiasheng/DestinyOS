  exclusive_with: []
  zh:
    title: 冲突模式：共同练习：修复开头
    summary: 共同练习：修复开头
    body: 共同练习：修复开头。用描述感受的句子重新开启对话；这项练习不依赖某一体系的分数，而是帮助双方用生活经验校验解读。建议约定暂停讨论的信号以及重新沟通的时间，避免让沉默变成猜测。另一种练习是分别回顾一件配合顺畅的事情，找出当时有哪些条件：是否有充足时间、是否事先知道目标、是否能自由提出不同意见。把这些条件搬到下一次共同安排里，再观察效果。若某个办法只让一方舒服，就一起调整执行方式，而不是要求另一方接受同样的感觉。每次只修改一个环节，能更容易看见变化来自哪里。长期相处会经历新的工作节奏与家庭责任，定期讨论现状比照搬早先的约定更有帮助。
    advice:
      - 约定暂停讨论的信号以及重新沟通的时间，避免让沉默变成猜测
    do:
      - 共同核对
    dont:
      - 贴标签
  en:
    title: 'conflict patterns: Shared practice: repair attempts'
    summary: 'Shared practice: repair attempts'
    body:
      'Shared practice: repair attempts. Restart with a sentence that describes your own feeling;
      this practice uses lived experience to check the interpretation and does not depend on one
      tradition’s score. Try to agree on a pause signal and a time to return so that silence does
      not become guesswork. Recall an activity that went smoothly. Identify the conditions present:
      enough time, a shared goal, and freedom to offer a different opinion. Bring those conditions
      into the next plan and observe the result. If an arrangement feels comfortable for only one
      person, change how it is carried out instead of requiring the other to share the same feeling.
      Modify one step at a time so the effect is easier to notice. Long relationships encounter
      changing work schedules and family responsibilities. Regular discussion of current
      circumstances is more useful than mechanically repeating an early agreement. A chart offers a
      starting point for reflection, while each person remains free to choose how to participate.'
    advice:
      - agree on a pause signal and a time to return so that silence does not become guesswork
    do:
      - Check together
    dont:
      - Label people
  meta:
    author: synastry-editorial-v1
    reviewed_by: null
    version: 1
    status: published
- id: synastry.practice.24
  system: synastry
  section: conflict
  topic: practice.24
  when:
    path: ashtakoot.max
    eq: 36
  weight: 30
  polarity: neutral
  tags:
    - plain
  exclusive_with: []
  zh:
    title: 冲突模式：共同练习：避免泛化
    summary: 共同练习：避免泛化
    body: 共同练习：避免泛化。用最近一次经历替代对方总是怎样的评价；这项练习不依赖某一体系的分数，而是帮助双方用生活经验校验解读。建议约定暂停讨论的信号以及重新沟通的时间，避免让沉默变成猜测。你可以拿最近一次共同安排来核对，先写下原本期待的结果，再比较双方当时掌握的信息。计划改变以后，一方可能希望尽快找到替代方案，另一方更想知道为什么发生变化。给解释与行动分别留出一点时间，会让两种需要更容易被满足。讨论结束时，把接下来由谁完成哪一步、什么时候确认进度说清楚。过几天再看看这个安排是否合适。相处方式可以学习与调整，不必让一次不顺畅的经历成为对人的固定评价。
    advice:
      - 约定暂停讨论的信号以及重新沟通的时间，避免让沉默变成猜测
    do:
      - 共同核对
    dont:
      - 贴标签
  en:
    title: 'conflict patterns: Shared practice: avoiding generalizations'
    summary: 'Shared practice: avoiding generalizations'
    body:
      'Shared practice: avoiding generalizations. Use one recent event instead of a judgment about
      what the other person always does; this practice uses lived experience to check the
      interpretation and does not depend on one tradition’s score. Try to agree on a pause signal
      and a time to return so that silence does not become guesswork. Consider a recent shared plan.
      Write down the outcome each person expected and the information available at the time. After a
      change, one person may want a replacement plan quickly while the other wants an explanation
      first. Leave room for both a reason and an action. At the end, clarify who will complete the
      next step and when progress will be checked. Review the arrangement a few days later. Ways of
      relating can be learned and revised; a single awkward experience need not become a permanent
      judgment about someone. A chart offers a starting point for reflection, while each person
      remains free to choose how to participate.'
    advice:
      - agree on a pause signal and a time to return so that silence does not become guesswork
    do:
      - Check together
    dont:
      - Label people
  meta:
    author: synastry-editorial-v1
    reviewed_by: null
    version: 1
    status: published
- id: synastry.practice.25
  system: synastry
  section: conflict
  topic: practice.25
  when:
    path: ashtakoot.max
    eq: 36
  weight: 30
  polarity: neutral
  tags:
    - plain
  exclusive_with: []
  zh:
    title: 冲突模式：共同练习：承认影响
    summary: 共同练习：承认影响
    body: 共同练习：承认影响。区分自己的意图与对方实际受到的影响；这项练习不依赖某一体系的分数，而是帮助双方用生活经验校验解读。建议约定暂停讨论的信号以及重新沟通的时间，避免让沉默变成猜测。例如，两个人都想获得支持，却可能分别通过安静陪伴和主动询问来表达。先问对方此刻需要倾听、建议还是实际帮助，可以减少好意没有被理解的情况。也给自己留下拒绝某种安排的空间，说明能够做到什么以及暂时做不到什么。共同活动以后，各自分享一个舒服的瞬间和一个还想调整的部分。让感谢指向具体举动，会比泛泛评价更容易让人理解。双方的意愿和感受是讨论的依据，符号只是辅助观察的语言。
    advice:
      - 约定暂停讨论的信号以及重新沟通的时间，避免让沉默变成猜测
    do:
      - 共同核对
    dont:
      - 贴标签
  en:
    title: 'conflict patterns: Shared practice: acknowledging impact'
    summary: 'Shared practice: acknowledging impact'
    body:
      'Shared practice: acknowledging impact. Separate your intention from the effect experienced by
      the other person; this practice uses lived experience to check the interpretation and does not
      depend on one tradition’s score. Try to agree on a pause signal and a time to return so that
      silence does not become guesswork. Two people may both want support but express it through
      quiet company or active questions. Ask whether the other person currently wants listening, a
      suggestion, or practical help. This can prevent a kind gesture from being misunderstood. Leave
      yourself room to decline an arrangement, explaining what you can do and what is currently
      beyond your capacity. After an activity, each share one comfortable moment and one part to
      adjust. Appreciation attached to a specific gesture is easier to understand than a broad
      judgment. Consent and lived feelings remain the basis of the conversation. A chart offers a
      starting point for reflection, while each person remains free to choose how to participate.'
    advice:
      - agree on a pause signal and a time to return so that silence does not become guesswork
    do:
      - Check together
    dont:
      - Label people
  meta:
    author: synastry-editorial-v1
    reviewed_by: null
    version: 1
    status: published
- id: synastry.practice.26
  system: synastry
  section: conflict
  topic: practice.26
  when:
    path: ashtakoot.max
    eq: 36
  weight: 30
  polarity: neutral
  tags:
    - plain
  exclusive_with: []
  zh:
    title: 冲突模式：共同练习：找共同点
    summary: 共同练习：找共同点
    body: 共同练习：找共同点。先记录已经同意的部分再谈分歧；这项练习不依赖某一体系的分数，而是帮助双方用生活经验校验解读。建议约定暂停讨论的信号以及重新沟通的时间，避免让沉默变成猜测。一个可核对的场景是一起处理日常任务：谁先提出想法，谁整理细节，谁提醒时间。把这些动作与个人价值分开看，暂时做得少也许只是空闲时间不同。可以先试行一个较小的分工，再约定如何提出修改。发生分歧时，记录两个人已经同意的条件，以及仍然需要查清的信息，不要让对话围着同一句评价打转。任务完成以后，回顾哪一步节省了精力、哪一步增加了压力，从中选择一个值得继续的做法。
    advice:
      - 约定暂停讨论的信号以及重新沟通的时间，避免让沉默变成猜测
    do:
      - 共同核对
    dont:
      - 贴标签
  en:
    title: 'conflict patterns: Shared practice: finding agreement'
    summary: 'Shared practice: finding agreement'
    body: 'Shared practice: finding agreement. Record what is already agreed before discussing
      differences; this practice uses lived experience to check the interpretation and does not
      depend on one tradition’s score. Try to agree on a pause signal and a time to return so that
      silence does not become guesswork. Look at an everyday task: who suggests an idea, who
      organizes details, and who notices the time? Separate these actions from a judgment of
      personal worth. Doing less for a while may simply reflect different available time. Try a
      small division of responsibility and agree on how changes can be requested. When a difference
      appears, record the conditions already agreed and the information still needed. This keeps the
      conversation from circling one criticism. After finishing, identify a step that saved energy
      and a step that increased pressure, then choose what to keep. A chart offers a starting point
      for reflection, while each person remains free to choose how to participate.'
    advice:
      - agree on a pause signal and a time to return so that silence does not become guesswork
    do:
      - Check together
    dont:
      - Label people
  meta:
    author: synastry-editorial-v1
    reviewed_by: null
    version: 1
    status: published
- id: synastry.practice.27
  system: synastry
  section: conflict
  topic: practice.27
  when:
    path: ashtakoot.max
    eq: 36
  weight: 30
  polarity: neutral
  tags:
    - plain
  exclusive_with: []
  zh:
    title: 冲突模式：共同练习：具体调整
    summary: 共同练习：具体调整
    body: 共同练习：具体调整。选一个双方愿意改变的动作观察几次；这项练习不依赖某一体系的分数，而是帮助双方用生活经验校验解读。建议约定暂停讨论的信号以及重新沟通的时间，避免让沉默变成猜测。观察时也可以从各自的生活背景开始：一个家庭习惯把想法直接说出来，另一个家庭可能先照顾气氛。没有哪种表达天然适合所有场景。把这些习惯讲给对方听，有助于理解一句话背后的意思。遇到不熟悉的方式，先提出澄清问题，再决定怎样回应。双方分别保留自己的兴趣、朋友与休息时间，也能让共同安排更有弹性。隔一段时间重新确认期待是否改变，允许曾经合适的办法被新的安排替代。
    advice:
      - 约定暂停讨论的信号以及重新沟通的时间，避免让沉默变成猜测
    do:
      - 共同核对
    dont:
      - 贴标签
  en:
    title: 'conflict patterns: Shared practice: specific changes'
    summary: 'Shared practice: specific changes'
    body:
      'Shared practice: specific changes. Choose one action both people are willing to change and
      observe several attempts; this practice uses lived experience to check the interpretation and
      does not depend on one tradition’s score. Try to agree on a pause signal and a time to return
      so that silence does not become guesswork. Begin with each person’s background. One household
      may encourage direct expression while another puts the atmosphere first. Neither habit suits
      every situation. Explain these learned patterns to one another to make the intention behind a
      sentence easier to understand. When a response is unfamiliar, ask for clarification before
      deciding how to react. Keep space for independent interests, friendships, and rest alongside
      joint activities. Revisit expectations after some time and allow an arrangement that once
      worked to be replaced when circumstances change. Cultural context matters more than assigning
      a fixed character label. A chart offers a starting point for reflection, while each person
      remains free to choose how to participate.'
    advice:
      - agree on a pause signal and a time to return so that silence does not become guesswork
    do:
      - Check together
    dont:
      - Label people
  meta:
    author: synastry-editorial-v1
    reviewed_by: null
    version: 1
    status: published
- id: synastry.practice.28
