  zh:
    title: 长期建议：共同练习：每周复盘
    summary: 共同练习：每周复盘
    body: 共同练习：每周复盘。每周讨论一件合作顺畅的事和一件需要调整的事；这项练习不依赖某一体系的分数，而是帮助双方用生活经验校验解读。建议每周选一个共同事项复盘，保留有效做法并调整一个不适合的环节。你可以把一段对话分成事实、感受与请求三个部分。事实是双方能描述的具体事情，感受属于个人体验，请求则是可以答应、拒绝或重新协商的动作。把三者混在一起容易让人听成指责；分开以后，讨论会更清楚。选择一个轻松的小问题先练习，给每个人完整说完的时间。需要暂停时约定什么时候回来，不把等待变成无限期的沉默。修复关系往往从一次愿意重新倾听开始，也需要持续尊重各自的边界。
    advice:
      - 每周选一个共同事项复盘，保留有效做法并调整一个不适合的环节
    do:
      - 共同核对
    dont:
      - 贴标签
  en:
    title: 'long-term advice: Shared practice: weekly reviews'
    summary: 'Shared practice: weekly reviews'
    body: 'Shared practice: weekly reviews. Each week discuss one thing that worked and one thing to
      adjust; this practice uses lived experience to check the interpretation and does not depend on
      one tradition’s score. Try to review one shared responsibility each week, keep what works, and
      change one step that is uncomfortable. Divide a conversation into an observation, a feeling,
      and a request. An observation describes an event both people can recognize. A feeling belongs
      to the person experiencing it. A request names an action that can be accepted, declined, or
      renegotiated. Mixing all three can sound like blame; separating them makes the discussion
      clearer. Practice with a small question and give each person time to finish. If a pause is
      needed, agree on a return time instead of leaving an indefinite silence. Repair often begins
      with a willingness to listen again while respecting boundaries. A chart offers a starting
      point for reflection, while each person remains free to choose how to participate.'
    advice:
      - review one shared responsibility each week, keep what works, and change one step that is
        uncomfortable
    do:
      - Check together
    dont:
      - Label people
