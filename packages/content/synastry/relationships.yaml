      tradition’s score. Try to repeat the other person’s view before making your own request during
      a small discussion. Divide a conversation into an observation, a feeling, and a request. An
      observation describes an event both people can recognize. A feeling belongs to the person
      experiencing it. A request names an action that can be accepted, declined, or renegotiated.
      Mixing all three can sound like blame; separating them makes the discussion clearer. Practice
      with a small question and give each person time to finish. If a pause is needed, agree on a
      return time instead of leaving an indefinite silence. Repair often begins with a willingness
      to listen again while respecting boundaries. A chart offers a starting point for reflection,
      while each person remains free to choose how to participate.'
    advice:
      - repeat the other person’s view before making your own request during a small discussion
    do:
      - Check together
    dont:
      - Label people
