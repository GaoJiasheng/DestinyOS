    summary: 共同练习：保留选择
    body: 共同练习：保留选择。定期确认双方仍然愿意参与哪些共同安排；这项练习不依赖某一体系的分数，而是帮助双方用生活经验校验解读。建议每周选一个共同事项复盘，保留有效做法并调整一个不适合的环节。观察时也可以从各自的生活背景开始：一个家庭习惯把想法直接说出来，另一个家庭可能先照顾气氛。没有哪种表达天然适合所有场景。把这些习惯讲给对方听，有助于理解一句话背后的意思。遇到不熟悉的方式，先提出澄清问题，再决定怎样回应。双方分别保留自己的兴趣、朋友与休息时间，也能让共同安排更有弹性。隔一段时间重新确认期待是否改变，允许曾经合适的办法被新的安排替代。
    advice:
      - 每周选一个共同事项复盘，保留有效做法并调整一个不适合的环节
