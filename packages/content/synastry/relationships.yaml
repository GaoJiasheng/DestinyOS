    body: 共同练习：重谈承诺。把重要期待写成可以讨论与修改的约定；这项练习不依赖某一体系的分数，而是帮助双方用生活经验校验解读。建议每周选一个共同事项复盘，保留有效做法并调整一个不适合的环节。一个可核对的场景是一起处理日常任务：谁先提出想法，谁整理细节，谁提醒时间。把这些动作与个人价值分开看，暂时做得少也许只是空闲时间不同。可以先试行一个较小的分工，再约定如何提出修改。发生分歧时，记录两个人已经同意的条件，以及仍然需要查清的信息，不要让对话围着同一句评价打转。任务完成以后，回顾哪一步节省了精力、哪一步增加了压力，从中选择一个值得继续的做法。
    advice:
