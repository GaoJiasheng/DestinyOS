    dont:
      - 贴标签
  en:
    title: 'conflict patterns: The year signs show clash'
    summary: The year signs show clash
    body: The year signs show clash. Stem and branch relationships describe symbolic structures; day
      pillars require the whole chart, while year pillars give a broader background. Try to agree on
      a pause signal and a time to return so that silence does not become guesswork. Divide a
      conversation into an observation, a feeling, and a request. An observation describes an event
      both people can recognize. A feeling belongs to the person experiencing it. A request names an
      action that can be accepted, declined, or renegotiated. Mixing all three can sound like blame;
      separating them makes the discussion clearer. Practice with a small question and give each
      person time to finish. If a pause is needed, agree on a return time instead of leaving an
      indefinite silence. Repair often begins with a willingness to listen again while respecting
      boundaries. A chart offers a starting point for reflection, while each person remains free to
      choose how to participate.
