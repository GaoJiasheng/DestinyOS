  en:
    title: 'long-term advice: Shared practice: revisiting commitments'
    summary: 'Shared practice: revisiting commitments'
    body:
      'Shared practice: revisiting commitments. Turn important expectations into agreements that can
      be discussed and revised; this practice uses lived experience to check the interpretation and
      does not depend on one tradition’s score. Try to review one shared responsibility each week,
      keep what works, and change one step that is uncomfortable. Look at an everyday task: who
      suggests an idea, who organizes details, and who notices the time? Separate these actions from
      a judgment of personal worth. Doing less for a while may simply reflect different available
      time. Try a small division of responsibility and agree on how changes can be requested. When a
      difference appears, record the conditions already agreed and the information still needed.
      This keeps the conversation from circling one criticism. After finishing, identify a step that
      saved energy and a step that increased pressure, then choose what to keep. A chart offers a
      starting point for reflection, while each person remains free to choose how to participate.'
