    body: 'A has tian ji in the spouse palace. The palace star provides a symbol for planning in
      partnership; read it alongside the other life palace and transformations in both palace
      triangles. Try to review one shared responsibility each week, keep what works, and change one
      step that is uncomfortable. Look at an everyday task: who suggests an idea, who organizes
