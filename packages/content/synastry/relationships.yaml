- id: synastry.ziwei.a.zi_wei
  system: synastry
  section: long_term
  topic: ziwei.a.zi_wei
  when:
    path: a.ziwei.palaces[key=spouse].majorStars[*].key
    eq: zi_wei
  weight: 70
  polarity: neutral
  tags:
    - plain
  exclusive_with: []
  zh:
    title: 长期建议：A 的夫妻宫见紫微
    summary: A 的夫妻宫见紫微
    body: A
      的夫妻宫见紫微。主星可以作为理解长期相处期待的象征，需要同时查看对方命宫以及双方三方四正中的四化。建议每周选一个共同事项复盘，保留有效做法并调整一个不适合的环节。例如，两个人都想获得支持，却可能分别通过安静陪伴和主动询问来表达。先问对方此刻需要倾听、建议还是实际帮助，可以减少好意没有被理解的情况。也给自己留下拒绝某种安排的空间，说明能够做到什么以及暂时做不到什么。共同活动以后，各自分享一个舒服的瞬间和一个还想调整的部分。让感谢指向具体举动，会比泛泛评价更容易让人理解。双方的意愿和感受是讨论的依据，符号只是辅助观察的语言。
    advice:
      - 每周选一个共同事项复盘，保留有效做法并调整一个不适合的环节
    do:
      - 共同核对
    dont:
      - 贴标签
  en:
    title: 'long-term advice: A has zi wei in the spouse palace'
    summary: A has zi wei in the spouse palace
    body: A has zi wei in the spouse palace. The palace star provides a symbol for leadership in
      partnership; read it alongside the other life palace and transformations in both palace
      triangles. Try to review one shared responsibility each week, keep what works, and change one
      step that is uncomfortable. Two people may both want support but express it through quiet
      company or active questions. Ask whether the other person currently wants listening, a
      suggestion, or practical help. This can prevent a kind gesture from being misunderstood. Leave
      yourself room to decline an arrangement, explaining what you can do and what is currently
      beyond your capacity. After an activity, each share one comfortable moment and one part to
      adjust. Appreciation attached to a specific gesture is easier to understand than a broad
      judgment. Consent and lived feelings remain the basis of the conversation. A chart offers a
      starting point for reflection, while each person remains free to choose how to participate.
    advice:
      - review one shared responsibility each week, keep what works, and change one step that is
        uncomfortable
    do:
      - Check together
    dont:
      - Label people
  meta:
    author: synastry-editorial-v1
    reviewed_by: null
    version: 1
    status: published
