  zh:
    title: 冲突模式：双方有生肖六冲关系
    summary: 双方有生肖六冲关系
    body: 双方有生肖六冲关系。干支关系描述两个符号之间的结构，不应单独决定相处好坏；日柱需要结合整盘，年柱关系只提供更宽泛的背景。建议约定暂停讨论的信号以及重新沟通的时间，避免让沉默变成猜测。你可以把一段对话分成事实、感受与请求三个部分。事实是双方能描述的具体事情，感受属于个人体验，请求则是可以答应、拒绝或重新协商的动作。把三者混在一起容易让人听成指责；分开以后，讨论会更清楚。选择一个轻松的小问题先练习，给每个人完整说完的时间。需要暂停时约定什么时候回来，不把等待变成无限期的沉默。修复关系往往从一次愿意重新倾听开始，也需要持续尊重各自的边界。
