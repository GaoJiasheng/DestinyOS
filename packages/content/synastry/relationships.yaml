  exclusive_with: []
  zh:
    title: 冲突模式：双方有日干相合关系
    summary: 双方有日干相合关系
    body: 双方有日干相合关系。干支关系描述两个符号之间的结构，不应单独决定相处好坏；日柱需要结合整盘，年柱关系只提供更宽泛的背景。建议约定暂停讨论的信号以及重新沟通的时间，避免让沉默变成猜测。观察时也可以从各自的生活背景开始：一个家庭习惯把想法直接说出来，另一个家庭可能先照顾气氛。没有哪种表达天然适合所有场景。把这些习惯讲给对方听，有助于理解一句话背后的意思。遇到不熟悉的方式，先提出澄清问题，再决定怎样回应。双方分别保留自己的兴趣、朋友与休息时间，也能让共同安排更有弹性。隔一段时间重新确认期待是否改变，允许曾经合适的办法被新的安排替代。
    advice:
      - 约定暂停讨论的信号以及重新沟通的时间，避免让沉默变成猜测
    do:
      - 共同核对
    dont:
      - 贴标签
  en:
    title: 'conflict patterns: The day stems show combine'
    summary: The day stems show combine
    body:
      The day stems show combine. Stem and branch relationships describe symbolic structures; day
      pillars require the whole chart, while year pillars give a broader background. Try to agree on
      a pause signal and a time to return so that silence does not become guesswork. Begin with each
      person’s background. One household may encourage direct expression while another puts the
      atmosphere first. Neither habit suits every situation. Explain these learned patterns to one
      another to make the intention behind a sentence easier to understand. When a response is
      unfamiliar, ask for clarification before deciding how to react. Keep space for independent
      interests, friendships, and rest alongside joint activities. Revisit expectations after some
      time and allow an arrangement that once worked to be replaced when circumstances change.
      Cultural context matters more than assigning a fixed character label. A chart offers a
      starting point for reflection, while each person remains free to choose how to participate.
    advice:
      - agree on a pause signal and a time to return so that silence does not become guesswork
    do:
      - Check together
    dont:
      - Label people
