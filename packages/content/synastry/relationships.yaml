    do:
      - 共同核对
    dont:
      - 贴标签
  en:
    title: 'communication: A’s mercury and B’s saturn form a sextile'
    summary: A’s mercury and B’s saturn form a sextile
    body:
      'A’s mercury and B’s saturn form a sextile. The two functions have room for cooperation that
      still requires deliberate participation, especially where language and information meets
      responsibility and limits. Try to repeat the other person’s view before making your own
      request during a small discussion. Recall an activity that went smoothly. Identify the
      conditions present: enough time, a shared goal, and freedom to offer a different opinion.
      Bring those conditions into the next plan and observe the result. If an arrangement feels
      comfortable for only one person, change how it is carried out instead of requiring the other
      to share the same feeling. Modify one step at a time so the effect is easier to notice. Long
      relationships encounter changing work schedules and family responsibilities. Regular
      discussion of current circumstances is more useful than mechanically repeating an early
      agreement. A chart offers a starting point for reflection, while each person remains free to
      choose how to participate.'
    advice:
      - repeat the other person’s view before making your own request during a small discussion
    do:
