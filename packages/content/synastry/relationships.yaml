  zh:
    title: 感情：A 的太阳与 B 的月亮呈六分相
    summary: A 的太阳与 B 的月亮呈六分相
    body: A 的太阳与 B
      的月亮呈六分相。两种功能之间有尝试合作的空间，仍需要主动沟通；需要结合太阳与月亮各自的象征功能来理解。建议分别写下三种喜欢的关心方式，问清楚哪些举动需要提前确认。例如，两个人都想获得支持，却可能分别通过安静陪伴和主动询问来表达。先问对方此刻需要倾听、建议还是实际帮助，可以减少好意没有被理解的情况。也给自己留下拒绝某种安排的空间，说明能够做到什么以及暂时做不到什么。共同活动以后，各自分享一个舒服的瞬间和一个还想调整的部分。让感谢指向具体举动，会比泛泛评价更容易让人理解。双方的意愿和感受是讨论的依据，符号只是辅助观察的语言。
    advice:
      - 分别写下三种喜欢的关心方式，问清楚哪些举动需要提前确认
    do:
      - 共同核对
    dont:
      - 贴标签
  en:
    title: 'affection: A’s sun and B’s moon form a sextile'
    summary: A’s sun and B’s moon form a sextile
    body:
      A’s sun and B’s moon form a sextile. The two functions have room for cooperation that still
      requires deliberate participation, especially where identity and direction meets emotional
      safety and habitual responses. Try to each write down three welcome forms of care and ask
      which gestures need agreement in advance. Two people may both want support but express it
      through quiet company or active questions. Ask whether the other person currently wants
      listening, a suggestion, or practical help. This can prevent a kind gesture from being
      misunderstood. Leave yourself room to decline an arrangement, explaining what you can do and
      what is currently beyond your capacity. After an activity, each share one comfortable moment
      and one part to adjust. Appreciation attached to a specific gesture is easier to understand
      than a broad judgment. Consent and lived feelings remain the basis of the conversation. A
      chart offers a starting point for reflection, while each person remains free to choose how to
      participate.
    advice:
      - each write down three welcome forms of care and ask which gestures need agreement in advance
    do:
      - Check together
    dont:
      - Label people
  meta:
    author: synastry-editorial-v1
    reviewed_by: null
    version: 1
    status: published
