    advice:
      - 分别写下三种喜欢的关心方式，问清楚哪些举动需要提前确认
    do:
      - 共同核对
    dont:
      - 贴标签
  en:
    title: 'affection: A’s sun and B’s moon form a trine'
    summary: A’s sun and B’s moon form a trine
    body: A’s sun and B’s moon form a trine. Similar habits may reduce coordination effort, while
      leaving some assumptions unspoken, especially where identity and direction meets emotional
      safety and habitual responses. Try to each write down three welcome forms of care and ask
      which gestures need agreement in advance. Begin with each person’s background. One household
      may encourage direct expression while another puts the atmosphere first. Neither habit suits
      every situation. Explain these learned patterns to one another to make the intention behind a
      sentence easier to understand. When a response is unfamiliar, ask for clarification before
      deciding how to react. Keep space for independent interests, friendships, and rest alongside
      joint activities. Revisit expectations after some time and allow an arrangement that once
      worked to be replaced when circumstances change. Cultural context matters more than assigning
      a fixed character label. A chart offers a starting point for reflection, while each person
      remains free to choose how to participate.
    advice:
      - each write down three welcome forms of care and ask which gestures need agreement in advance
    do:
      - Check together
    dont:
      - Label people
