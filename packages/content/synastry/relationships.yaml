  zh:
    title: 价值观与金钱：共同练习：时间分配
    summary: 共同练习：时间分配
    body: 共同练习：时间分配。把休息、工作与共同活动放到同一张计划里；这项练习不依赖某一体系的分数，而是帮助双方用生活经验校验解读。建议选择一笔日常支出，说明用途和可接受范围，再共同制定复盘时间。你可以拿最近一次共同安排来核对，先写下原本期待的结果，再比较双方当时掌握的信息。计划改变以后，一方可能希望尽快找到替代方案，另一方更想知道为什么发生变化。给解释与行动分别留出一点时间，会让两种需要更容易被满足。讨论结束时，把接下来由谁完成哪一步、什么时候确认进度说清楚。过几天再看看这个安排是否合适。相处方式可以学习与调整，不必让一次不顺畅的经历成为对人的固定评价。
    advice:
      - 选择一笔日常支出，说明用途和可接受范围，再共同制定复盘时间
    do:
      - 共同核对
    dont:
      - 贴标签
  en:
    title: 'values and money: Shared practice: sharing time'
    summary: 'Shared practice: sharing time'
    body: 'Shared practice: sharing time. Put rest, work, and shared activities on one plan; this
      practice uses lived experience to check the interpretation and does not depend on one
      tradition’s score. Try to choose an everyday expense, explain its purpose and acceptable
      range, and agree on a review date. Consider a recent shared plan. Write down the outcome each
      person expected and the information available at the time. After a change, one person may want
      a replacement plan quickly while the other wants an explanation first. Leave room for both a
      reason and an action. At the end, clarify who will complete the next step and when progress
      will be checked. Review the arrangement a few days later. Ways of relating can be learned and
      revised; a single awkward experience need not become a permanent judgment about someone. A
      chart offers a starting point for reflection, while each person remains free to choose how to
      participate.'
    advice:
      - choose an everyday expense, explain its purpose and acceptable range, and agree on a review
        date
    do:
      - Check together
    dont:
      - Label people
  meta:
    author: synastry-editorial-v1
