  zh:
    title: 感情：共同练习：调整期待
    summary: 共同练习：调整期待
    body: 共同练习：调整期待。把想象中的关心方式与实际可做的事对照；这项练习不依赖某一体系的分数，而是帮助双方用生活经验校验解读。建议分别写下三种喜欢的关心方式，问清楚哪些举动需要提前确认。观察时也可以从各自的生活背景开始：一个家庭习惯把想法直接说出来，另一个家庭可能先照顾气氛。没有哪种表达天然适合所有场景。把这些习惯讲给对方听，有助于理解一句话背后的意思。遇到不熟悉的方式，先提出澄清问题，再决定怎样回应。双方分别保留自己的兴趣、朋友与休息时间，也能让共同安排更有弹性。隔一段时间重新确认期待是否改变，允许曾经合适的办法被新的安排替代。
    advice:
      - 分别写下三种喜欢的关心方式，问清楚哪些举动需要提前确认
    do:
      - 共同核对
    dont:
      - 贴标签
  en:
    title: 'affection: Shared practice: adjusting expectations'
    summary: 'Shared practice: adjusting expectations'
    body: 'Shared practice: adjusting expectations. Compare an imagined form of care with what is
      feasible; this practice uses lived experience to check the interpretation and does not depend
      on one tradition’s score. Try to each write down three welcome forms of care and ask which
      gestures need agreement in advance. Begin with each person’s background. One household may
      encourage direct expression while another puts the atmosphere first. Neither habit suits every
      situation. Explain these learned patterns to one another to make the intention behind a
      sentence easier to understand. When a response is unfamiliar, ask for clarification before
      deciding how to react. Keep space for independent interests, friendships, and rest alongside
      joint activities. Revisit expectations after some time and allow an arrangement that once
      worked to be replaced when circumstances change. Cultural context matters more than assigning
      a fixed character label. A chart offers a starting point for reflection, while each person
      remains free to choose how to participate.'
    advice:
      - each write down three welcome forms of care and ask which gestures need agreement in advance
    do:
      - Check together
    dont:
      - Label people
  meta:
    author: synastry-editorial-v1
    reviewed_by: null
    version: 1
    status: published
- id: synastry.practice.16
