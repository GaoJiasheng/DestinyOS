  zh:
    title: 沟通：共同练习：倾听结束
    summary: 共同练习：倾听结束
    body: 共同练习：倾听结束。给对方说完的空间，再整理自己的回应；这项练习不依赖某一体系的分数，而是帮助双方用生活经验校验解读。建议讨论一件小事时先复述对方的观点，再提出自己的请求。观察时也可以从各自的生活背景开始：一个家庭习惯把想法直接说出来，另一个家庭可能先照顾气氛。没有哪种表达天然适合所有场景。把这些习惯讲给对方听，有助于理解一句话背后的意思。遇到不熟悉的方式，先提出澄清问题，再决定怎样回应。双方分别保留自己的兴趣、朋友与休息时间，也能让共同安排更有弹性。隔一段时间重新确认期待是否改变，允许曾经合适的办法被新的安排替代。
    advice:
      - 讨论一件小事时先复述对方的观点，再提出自己的请求
    do:
      - 共同核对
    dont:
      - 贴标签
  en:
    title: 'communication: Shared practice: finishing a thought'
    summary: 'Shared practice: finishing a thought'
    body: 'Shared practice: finishing a thought. Let the other person finish before organizing your
      response; this practice uses lived experience to check the interpretation and does not depend
      on one tradition’s score. Try to repeat the other person’s view before making your own request
      during a small discussion. Begin with each person’s background. One household may encourage
      direct expression while another puts the atmosphere first. Neither habit suits every
      situation. Explain these learned patterns to one another to make the intention behind a
      sentence easier to understand. When a response is unfamiliar, ask for clarification before
      deciding how to react. Keep space for independent interests, friendships, and rest alongside
      joint activities. Revisit expectations after some time and allow an arrangement that once
      worked to be replaced when circumstances change. Cultural context matters more than assigning
      a fixed character label. A chart offers a starting point for reflection, while each person
      remains free to choose how to participate.'
    advice:
      - repeat the other person’s view before making your own request during a small discussion
    do:
      - Check together
    dont:
      - Label people
