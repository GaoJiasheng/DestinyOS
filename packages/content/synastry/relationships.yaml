    dont:
      - 贴标签
  en:
    title: 'values and money: A sees a peer relationship to the other chart'
    summary: A sees a peer relationship to the other chart
    body:
      'A sees a peer relationship to the other chart. This is an element and polarity relationship
      measured from the day stem, inviting a discussion about autonomy and equality. Try to choose
      an everyday expense, explain its purpose and acceptable range, and agree on a review date.
      Recall an activity that went smoothly. Identify the conditions present: enough time, a shared
      goal, and freedom to offer a different opinion. Bring those conditions into the next plan and
      observe the result. If an arrangement feels comfortable for only one person, change how it is
      carried out instead of requiring the other to share the same feeling. Modify one step at a
      time so the effect is easier to notice. Long relationships encounter changing work schedules
      and family responsibilities. Regular discussion of current circumstances is more useful than
      mechanically repeating an early agreement. A chart offers a starting point for reflection,
      while each person remains free to choose how to participate.'
