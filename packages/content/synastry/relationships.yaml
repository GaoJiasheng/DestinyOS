  zh:
    title: 价值观与金钱：共同练习：日常预算
    summary: 共同练习：日常预算
    body: 共同练习：日常预算。讨论一笔共同支出及各自可接受的范围；这项练习不依赖某一体系的分数，而是帮助双方用生活经验校验解读。建议选择一笔日常支出，说明用途和可接受范围，再共同制定复盘时间。你可以把一段对话分成事实、感受与请求三个部分。事实是双方能描述的具体事情，感受属于个人体验，请求则是可以答应、拒绝或重新协商的动作。把三者混在一起容易让人听成指责；分开以后，讨论会更清楚。选择一个轻松的小问题先练习，给每个人完整说完的时间。需要暂停时约定什么时候回来，不把等待变成无限期的沉默。修复关系往往从一次愿意重新倾听开始，也需要持续尊重各自的边界。
    advice:
      - 选择一笔日常支出，说明用途和可接受范围，再共同制定复盘时间
    do:
      - 共同核对
    dont:
      - 贴标签
  en:
    title: 'values and money: Shared practice: everyday budgets'
    summary: 'Shared practice: everyday budgets'
    body:
      'Shared practice: everyday budgets. Discuss one shared expense and each person’s acceptable
      range; this practice uses lived experience to check the interpretation and does not depend on
      one tradition’s score. Try to choose an everyday expense, explain its purpose and acceptable
      range, and agree on a review date. Divide a conversation into an observation, a feeling, and a
      request. An observation describes an event both people can recognize. A feeling belongs to the
      person experiencing it. A request names an action that can be accepted, declined, or
      renegotiated. Mixing all three can sound like blame; separating them makes the discussion
      clearer. Practice with a small question and give each person time to finish. If a pause is
      needed, agree on a return time instead of leaving an indefinite silence. Repair often begins
      with a willingness to listen again while respecting boundaries. A chart offers a starting
      point for reflection, while each person remains free to choose how to participate.'
    advice:
      - choose an everyday expense, explain its purpose and acceptable range, and agree on a review
        date
    do:
      - Check together
    dont:
      - Label people
  meta:
    author: synastry-editorial-v1
    reviewed_by: null
    version: 1
    status: published
- id: synastry.practice.17
