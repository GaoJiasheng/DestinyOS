  zh:
    title: 沟通：共同练习：明确请求
    summary: 共同练习：明确请求
    body: 共同练习：明确请求。把希望对方做到的动作与时间范围说清楚；这项练习不依赖某一体系的分数，而是帮助双方用生活经验校验解读。建议讨论一件小事时先复述对方的观点，再提出自己的请求。另一种练习是分别回顾一件配合顺畅的事情，找出当时有哪些条件：是否有充足时间、是否事先知道目标、是否能自由提出不同意见。把这些条件搬到下一次共同安排里，再观察效果。若某个办法只让一方舒服，就一起调整执行方式，而不是要求另一方接受同样的感觉。每次只修改一个环节，能更容易看见变化来自哪里。长期相处会经历新的工作节奏与家庭责任，定期讨论现状比照搬早先的约定更有帮助。
    advice:
      - 讨论一件小事时先复述对方的观点，再提出自己的请求
    do:
      - 共同核对
    dont:
      - 贴标签
  en:
    title: 'communication: Shared practice: clear requests'
    summary: 'Shared practice: clear requests'
    body: 'Shared practice: clear requests. Name the action you hope for and the time frame; this
      practice uses lived experience to check the interpretation and does not depend on one
      tradition’s score. Try to repeat the other person’s view before making your own request during
      a small discussion. Recall an activity that went smoothly. Identify the conditions present:
      enough time, a shared goal, and freedom to offer a different opinion. Bring those conditions
      into the next plan and observe the result. If an arrangement feels comfortable for only one
      person, change how it is carried out instead of requiring the other to share the same feeling.
      Modify one step at a time so the effect is easier to notice. Long relationships encounter
      changing work schedules and family responsibilities. Regular discussion of current
      circumstances is more useful than mechanically repeating an early agreement. A chart offers a
      starting point for reflection, while each person remains free to choose how to participate.'
    advice:
      - repeat the other person’s view before making your own request during a small discussion
    do:
      - Check together
    dont:
      - Label people
