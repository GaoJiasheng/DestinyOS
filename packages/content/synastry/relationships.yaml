    body: A 的水星与 B
      的土星呈合相。两种功能集中在相近的方向，容易放大彼此的主题；需要结合水星与土星各自的象征功能来理解。建议讨论一件小事时先复述对方的观点，再提出自己的请求。你可以把一段对话分成事实、感受与请求三个部分。事实是双方能描述的具体事情，感受属于个人体验，请求则是可以答应、拒绝或重新协商的动作。把三者混在一起容易让人听成指责；分开以后，讨论会更清楚。选择一个轻松的小问题先练习，给每个人完整说完的时间。需要暂停时约定什么时候回来，不把等待变成无限期的沉默。修复关系往往从一次愿意重新倾听开始，也需要持续尊重各自的边界。
    advice:
      - 讨论一件小事时先复述对方的观点，再提出自己的请求
    do:
      - 共同核对
    dont:
      - 贴标签
  en:
    title: 'communication: A’s mercury and B’s saturn form a conjunction'
    summary: A’s mercury and B’s saturn form a conjunction
    body:
      A’s mercury and B’s saturn form a conjunction. The two functions occupy a similar direction
      and may amplify each other’s themes, especially where language and information meets
      responsibility and limits. Try to repeat the other person’s view before making your own
      request during a small discussion. Divide a conversation into an observation, a feeling, and a
      request. An observation describes an event both people can recognize. A feeling belongs to the
      person experiencing it. A request names an action that can be accepted, declined, or
      renegotiated. Mixing all three can sound like blame; separating them makes the discussion
      clearer. Practice with a small question and give each person time to finish. If a pause is
      needed, agree on a return time instead of leaving an indefinite silence. Repair often begins
      with a willingness to listen again while respecting boundaries. A chart offers a starting
      point for reflection, while each person remains free to choose how to participate.
    advice:
      - repeat the other person’s view before making your own request during a small discussion
    do:
      - Check together
    dont:
      - Label people
