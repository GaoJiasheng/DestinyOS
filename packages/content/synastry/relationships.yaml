- id: synastry.western.sun_moon.conjunction
  system: synastry
  section: love
  topic: western.sun_moon.conjunction
  when:
    path: western.aspects[a=sun][b=moon].type
    eq: conjunction
  weight: 70
  polarity: neutral
  tags:
    - plain
  exclusive_with: []
  zh:
    title: 感情：A 的太阳与 B 的月亮呈合相
    summary: A 的太阳与 B 的月亮呈合相
    body: A 的太阳与 B
      的月亮呈合相。两种功能集中在相近的方向，容易放大彼此的主题；需要结合太阳与月亮各自的象征功能来理解。建议分别写下三种喜欢的关心方式，问清楚哪些举动需要提前确认。你可以拿最近一次共同安排来核对，先写下原本期待的结果，再比较双方当时掌握的信息。计划改变以后，一方可能希望尽快找到替代方案，另一方更想知道为什么发生变化。给解释与行动分别留出一点时间，会让两种需要更容易被满足。讨论结束时，把接下来由谁完成哪一步、什么时候确认进度说清楚。过几天再看看这个安排是否合适。相处方式可以学习与调整，不必让一次不顺畅的经历成为对人的固定评价。
    advice:
      - 分别写下三种喜欢的关心方式，问清楚哪些举动需要提前确认
    do:
      - 共同核对
    dont:
      - 贴标签
  en:
    title: 'affection: A’s sun and B’s moon form a conjunction'
    summary: A’s sun and B’s moon form a conjunction
    body:
      A’s sun and B’s moon form a conjunction. The two functions occupy a similar direction and may
      amplify each other’s themes, especially where identity and direction meets emotional safety
      and habitual responses. Try to each write down three welcome forms of care and ask which
      gestures need agreement in advance. Consider a recent shared plan. Write down the outcome each
      person expected and the information available at the time. After a change, one person may want
      a replacement plan quickly while the other wants an explanation first. Leave room for both a
      reason and an action. At the end, clarify who will complete the next step and when progress
      will be checked. Review the arrangement a few days later. Ways of relating can be learned and
      revised; a single awkward experience need not become a permanent judgment about someone. A
      chart offers a starting point for reflection, while each person remains free to choose how to
      participate.
    advice:
      - each write down three welcome forms of care and ask which gestures need agreement in advance
    do:
      - Check together
    dont:
      - Label people
  meta:
    author: synastry-editorial-v1
    reviewed_by: null
    version: 1
    status: published
- id: synastry.western.sun_moon.sextile
  system: synastry
  section: love
  topic: western.sun_moon.sextile
  when:
