  zh:
    title: 沟通：共同练习：检查语气
    summary: 共同练习：检查语气
    body: 共同练习：检查语气。问清楚一句话是提问、建议还是需要支持；这项练习不依赖某一体系的分数，而是帮助双方用生活经验校验解读。建议讨论一件小事时先复述对方的观点，再提出自己的请求。一个可核对的场景是一起处理日常任务：谁先提出想法，谁整理细节，谁提醒时间。把这些动作与个人价值分开看，暂时做得少也许只是空闲时间不同。可以先试行一个较小的分工，再约定如何提出修改。发生分歧时，记录两个人已经同意的条件，以及仍然需要查清的信息，不要让对话围着同一句评价打转。任务完成以后，回顾哪一步节省了精力、哪一步增加了压力，从中选择一个值得继续的做法。
    advice:
      - 讨论一件小事时先复述对方的观点，再提出自己的请求
    do:
      - 共同核对
    dont:
      - 贴标签
  en:
    title: 'communication: Shared practice: checking tone'
    summary: 'Shared practice: checking tone'
    body: 'Shared practice: checking tone. Ask whether a sentence is a question, a suggestion, or a
      request for support; this practice uses lived experience to check the interpretation and does
      not depend on one tradition’s score. Try to repeat the other person’s view before making your
      own request during a small discussion. Look at an everyday task: who suggests an idea, who
      organizes details, and who notices the time? Separate these actions from a judgment of
      personal worth. Doing less for a while may simply reflect different available time. Try a
      small division of responsibility and agree on how changes can be requested. When a difference
      appears, record the conditions already agreed and the information still needed. This keeps the
      conversation from circling one criticism. After finishing, identify a step that saved energy
      and a step that increased pressure, then choose what to keep. A chart offers a starting point
      for reflection, while each person remains free to choose how to participate.'
    advice:
      - repeat the other person’s view before making your own request during a small discussion
    do:
      - Check together
    dont:
      - Label people
  meta:
    author: synastry-editorial-v1
    reviewed_by: null
    version: 1
    status: published
- id: synastry.practice.9
  system: synastry
