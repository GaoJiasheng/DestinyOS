  zh:
    title: 沟通：共同练习：区分事实
    summary: 共同练习：区分事实
    body: 共同练习：区分事实。分别记录可观察事实与自己的推测；这项练习不依赖某一体系的分数，而是帮助双方用生活经验校验解读。建议讨论一件小事时先复述对方的观点，再提出自己的请求。例如，两个人都想获得支持，却可能分别通过安静陪伴和主动询问来表达。先问对方此刻需要倾听、建议还是实际帮助，可以减少好意没有被理解的情况。也给自己留下拒绝某种安排的空间，说明能够做到什么以及暂时做不到什么。共同活动以后，各自分享一个舒服的瞬间和一个还想调整的部分。让感谢指向具体举动，会比泛泛评价更容易让人理解。双方的意愿和感受是讨论的依据，符号只是辅助观察的语言。
    advice:
      - 讨论一件小事时先复述对方的观点，再提出自己的请求
    do:
      - 共同核对
    dont:
      - 贴标签
  en:
    title: 'communication: Shared practice: facts and interpretations'
    summary: 'Shared practice: facts and interpretations'
    body: 'Shared practice: facts and interpretations. Separate an observable fact from your
      interpretation; this practice uses lived experience to check the interpretation and does not
      depend on one tradition’s score. Try to repeat the other person’s view before making your own
      request during a small discussion. Two people may both want support but express it through
      quiet company or active questions. Ask whether the other person currently wants listening, a
      suggestion, or practical help. This can prevent a kind gesture from being misunderstood. Leave
      yourself room to decline an arrangement, explaining what you can do and what is currently
      beyond your capacity. After an activity, each share one comfortable moment and one part to
      adjust. Appreciation attached to a specific gesture is easier to understand than a broad
      judgment. Consent and lived feelings remain the basis of the conversation. A chart offers a
      starting point for reflection, while each person remains free to choose how to participate.'
    advice:
      - repeat the other person’s view before making your own request during a small discussion
    do:
      - Check together
    dont:
      - Label people
  meta:
    author: synastry-editorial-v1
    reviewed_by: null
    version: 1
    status: published
- id: synastry.practice.8
  system: synastry
  section: communication
  topic: practice.8
  when:
    path: ashtakoot.max
