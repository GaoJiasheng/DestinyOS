  zh:
    title: 感情：A 的太阳与 B 的月亮呈对分相
    summary: A 的太阳与 B 的月亮呈对分相
    body: A 的太阳与 B
      的月亮呈对分相。两种功能强调相对的立场，倾听双方期待有助于找到共同点；需要结合太阳与月亮各自的象征功能来理解。建议分别写下三种喜欢的关心方式，问清楚哪些举动需要提前确认。你可以把一段对话分成事实、感受与请求三个部分。事实是双方能描述的具体事情，感受属于个人体验，请求则是可以答应、拒绝或重新协商的动作。把三者混在一起容易让人听成指责；分开以后，讨论会更清楚。选择一个轻松的小问题先练习，给每个人完整说完的时间。需要暂停时约定什么时候回来，不把等待变成无限期的沉默。修复关系往往从一次愿意重新倾听开始，也需要持续尊重各自的边界。
    advice:
      - 分别写下三种喜欢的关心方式，问清楚哪些举动需要提前确认
    do:
      - 共同核对
    dont:
      - 贴标签
  en:
    title: 'affection: A’s sun and B’s moon form a opposition'
    summary: A’s sun and B’s moon form a opposition
    body: A’s sun and B’s moon form a opposition. The two functions emphasize opposing perspectives;
      hearing both expectations can uncover common ground, especially where identity and direction
      meets emotional safety and habitual responses. Try to each write down three welcome forms of
      care and ask which gestures need agreement in advance. Divide a conversation into an
      observation, a feeling, and a request. An observation describes an event both people can
      recognize. A feeling belongs to the person experiencing it. A request names an action that can
      be accepted, declined, or renegotiated. Mixing all three can sound like blame; separating them
      makes the discussion clearer. Practice with a small question and give each person time to
      finish. If a pause is needed, agree on a return time instead of leaving an indefinite silence.
      Repair often begins with a willingness to listen again while respecting boundaries. A chart
      offers a starting point for reflection, while each person remains free to choose how to
      participate.
    advice:
      - each write down three welcome forms of care and ask which gestures need agreement in advance
    do:
      - Check together
    dont:
      - Label people
