    body: 你可以通过一次普通互动，看见情绪回应与安全感怎样带上深入理解与谨慎建立信任的特点。月亮（用来观察情绪回应与安全感的命盘要素）位于天蝎座（以深入和信任边界为象征的星座），这里谈的是表达倾向，不是完整性格；这种表达方式让你容易追问表面之下的动机；深入理解需要证据，也需要尊重别人暂不分享的空间。你容易先感受环境是否让人安心，再决定愿意分享多少；熟悉的节奏也可能影响你的情绪回应。渐进的信任可能比立即倾诉更自在，感受深入也不要求获得别人的全部信息。比如，你可以在重要合作中逐步交换信息，再观察对方如何回应，而非只看自己是否满意。若出现把沉默当成隐藏问题的证据的情况，就先停下来核对需要；不妨允许信任随具体行动累积，也试着给情绪留十分钟再回复重要消息，让偏好成为可调整的做法。
    advice:
      - 允许信任随具体行动累积
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Moon in Scorpio: developing trust through depth'
    summary: You may approach emotional habits and comfort by developing trust by depth.
    body:
      "You can explore emotional habits and comfort by noticing how you respond when a small plan
      changes. In this chart, the Moon — a symbolic lens on emotional habits and comfort — falls in
      Scorpio — a sign associated with depth and careful trust. This approach suggests staying with
      a question beyond its first answer. That attention is more useful when curiosity remains distinguishable
      from a demand for access to somebody else's private experience. Trust may become comfortable
      through a series of small agreements; you can take a feeling seriously without seeking access
      to every part of another person's experience. Imagine that you build trust through a series
      of modest agreements; the next response can tell you whether your approach created room for
      another person or simply expressed an impulse. The complication is treating one mood as a permanent
      description of yourself, which can be easy to miss while an interaction feels familiar. Consider
      this experiment: allow a pause before answering an emotionally charged message; afterward, compare
      what you enjoyed with what you would change."
    advice:
      - Allow a pause before answering an emotionally charged message
    do:
      - Note a pattern
    dont:
      - Rush a label
