    summary: 你在情绪回应与安全感上倾向表达热情与获得回应。
    body: 你在情绪回应与安全感上倾向表达热情与获得回应，可以把这种偏好当作观察起点。月亮（象征情绪回应与安全感的命盘要素）落在狮子座（重视创造与真诚表达的星座），把这个面向与相应的表达方式联系起来；你容易先感受环境是否让人安心，再决定愿意分享多少；熟悉的节奏也可能影响你的情绪回应。这种表达方式让你倾向把个人热情带进事情里；被回应会增加动力，也需要给不同风格留空间。感受被看见可能增加温暖，但回应的形式可以是倾听，而不只赞美。例如，忙碌一天后，观察你是想独处、聊天还是整理空间，再向身边的人说清需要，也可用一个个人故事说明想法，比较哪种方式更容易让参与者理解。留意是否把一次情绪当成永久结论，或把没被赞同等同于没被尊重；建议给情绪留十分钟再回复重要消息，用实际回应调整节奏，而不是凭一个位置给自己下定论。
    advice:
      - 表达之后邀请另一种声音
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Moon in Leo: making expression personal'
    summary: You may approach emotional habits and comfort by making expression personal.
    body: 'You may approach emotional habits and comfort by making expression personal, especially
      when a familiar response is needed. The Moon — the chart factor associated with emotional habits
      and comfort — is placed in Leo — a sign associated with creative expression. This approach suggests
      giving an activity a personal voice. Recognition can energize that contribution, while listening
      makes room for someone whose enthusiasm looks quieter than yours. You may feel warmed by an
      attentive response to your personal expression; a careful question or quiet presence can count
      alongside enthusiastic appreciation. For example, after an unexpectedly busy evening, notice
      whether you reach for company, quiet, or a familiar routine before accepting another invitation.
      Watch for equating a lack of applause with a lack of respect, as well as treating one mood as
      a permanent description of yourself. Try this: invite a quieter contribution after sharing yours,
      then compare the response with your original intention before deciding which part of the approach
      to keep.'
    advice:
      - Allow a pause before answering an emotionally charged message
