    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Moon in Capricorn: organizing sustained effort'
    summary: You may approach emotional habits and comfort by organizing sustained effort.
    body: 'You may approach emotional habits and comfort by organizing sustained effort, especially
      when a familiar response is needed. The Moon — the chart factor associated with emotional habits
      and comfort — is placed in Capricorn — a sign associated with planning and responsibility. This
      approach suggests translating intentions into stages. A durable plan includes the people doing
      the work, so rest, support, and renegotiation belong beside milestones rather than outside them.
      Knowing what you can carry may help you settle; receiving support can sit beside responsibility
      without needing to be explained as a failure of competence. For example, after an unexpectedly
      busy evening, notice whether you reach for company, quiet, or a familiar routine before accepting
      another invitation. Watch for assuming that carrying more is the only meaningful contribution,
      as well as treating one mood as a permanent description of yourself. Try this: plan for support
      and rest beside the milestones, then compare the response with your original intention before
      deciding which part of the approach to keep.'
    advice:
      - Allow a pause before answering an emotionally charged message
