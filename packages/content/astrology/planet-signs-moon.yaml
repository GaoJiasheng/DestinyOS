- id: astrology.planet_sign.moon.aries.a
  system: astrology
  section: big_three
  topic: moon_sign
  when:
    path: bodies[key=moon].sign
    eq: aries
  weight: 85
  polarity: neutral
  tags:
    - plain
    - astrology.keyword.cooperation
  exclusive_with:
    - astrology.planet_sign.moon.aries.b
  zh:
    title: 月亮在白羊座：先行动再校准
    summary: 你在情绪回应与安全感上倾向先行动再校准。
    body: 你在情绪回应与安全感上倾向先行动再校准，可以把这种偏好当作观察起点。月亮（象征情绪回应与安全感的命盘要素）落在白羊座（以启动和直接回应为象征的星座），把这个面向与相应的表达方式联系起来；你容易先感受环境是否让人安心，再决定愿意分享多少；熟悉的节奏也可能影响你的情绪回应。这种表达方式让这个面向倾向先尝试，再根据反馈修正；主动并不需要把速度放在所有事情之前。情绪可能催促你立即回应，给感受命名有助于区分表达需要与急着解决。例如，忙碌一天后，观察你是想独处、聊天还是整理空间，再向身边的人说清需要，也可先做一版能被讨论的草案，比较哪种方式更容易让参与者理解。留意是否把一次情绪当成永久结论，或把急迫感传给别人；建议给情绪留十分钟再回复重要消息，用实际回应调整节奏，而不是凭一个位置给自己下定论。
    advice:
      - 开始前确认一个共同目标
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Moon in Aries: starting directly'
    summary: You may approach emotional habits and comfort by starting directly.
    body:
      'You may approach emotional habits and comfort by starting directly, especially when a familiar
      response is needed. The Moon — the chart factor associated with emotional habits and comfort
      — is placed in Aries — a sign associated with initiating and responding directly. This approach
      suggests learning through a first attempt. The useful distinction is between opening a possibility
      and insisting that everybody follow at your pace. A feeling may arrive with an urge to do something
      immediately; naming the feeling first can show whether you need action, company, or simply space.
      For example, after an unexpectedly busy evening, notice whether you reach for company, quiet,
      or a familiar routine before accepting another invitation. Watch for passing urgency to people
      who need context, as well as treating one mood as a permanent description of yourself. Try this:
      agree on the purpose before moving quickly, then compare the response with your original intention
      before deciding which part of the approach to keep.'
    advice:
      - Allow a pause before answering an emotionally charged message
    do:
      - Note a pattern
    dont:
      - Rush a label
  meta:
    author: t23-astrology-editorial-v1
    reviewed_by: null
    version: 1
    status: published
- id: astrology.planet_sign.moon.aries.b
  system: astrology
  section: big_three
  topic: moon_sign
  when:
    path: bodies[key=moon].sign
    eq: aries
  weight: 85
  polarity: neutral
  tags:
    - plain
    - astrology.keyword.cooperation
  exclusive_with:
    - astrology.planet_sign.moon.aries.a
  zh:
    title: 月亮在白羊座：先行动再校准
    summary: 你在情绪回应与安全感上倾向先行动再校准。
    body: 你可以通过一次普通互动，看见情绪回应与安全感怎样带上先行动再校准的特点。月亮（用来观察情绪回应与安全感的命盘要素）位于白羊座（以启动和直接回应为象征的星座），这里谈的是表达倾向，不是完整性格；这种表达方式让这个面向倾向先尝试，再根据反馈修正；主动并不需要把速度放在所有事情之前。你容易先感受环境是否让人安心，再决定愿意分享多少；熟悉的节奏也可能影响你的情绪回应。情绪可能催促你立即回应，给感受命名有助于区分表达需要与急着解决。比如，你可以先做一版能被讨论的草案，再观察对方如何回应，而非只看自己是否满意。若出现把急迫感传给别人的情况，就先停下来核对需要；不妨开始前确认一个共同目标，也试着给情绪留十分钟再回复重要消息，让偏好成为可调整的做法。
    advice:
      - 开始前确认一个共同目标
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Moon in Aries: starting directly'
    summary: You may approach emotional habits and comfort by starting directly.
    body:
      'You can explore emotional habits and comfort by noticing how you respond when a small plan
      changes. In this chart, the Moon — a symbolic lens on emotional habits and comfort — falls in
      Aries — a sign associated with initiating and responding directly. This approach suggests learning
      through a first attempt. The useful distinction is between opening a possibility and insisting
      that everybody follow at your pace. A feeling may arrive with an urge to do something immediately;
      naming the feeling first can show whether you need action, company, or simply space. Imagine
      that you make a rough proposal that somebody can respond to; the next response can tell you
      whether your approach created room for another person or simply expressed an impulse. The complication
      is treating one mood as a permanent description of yourself, which can be easy to miss while
      an interaction feels familiar. Consider this experiment: allow a pause before answering an emotionally
      charged message; afterward, compare what you enjoyed with what you would change.'
    advice:
      - Allow a pause before answering an emotionally charged message
    do:
      - Note a pattern
    dont:
      - Rush a label
  meta:
    author: t23-astrology-editorial-v1
    reviewed_by: null
    version: 1
    status: published
- id: astrology.planet_sign.moon.taurus.a
  system: astrology
  section: big_three
  topic: moon_sign
  when:
    path: bodies[key=moon].sign
    eq: taurus
  weight: 85
  polarity: neutral
  tags:
    - plain
    - astrology.keyword.cooperation
  exclusive_with:
    - astrology.planet_sign.moon.taurus.b
  zh:
    title: 月亮在金牛座：稳定积累与具体感受
    summary: 你在情绪回应与安全感上倾向稳定积累与具体感受。
    body: 你在情绪回应与安全感上倾向稳定积累与具体感受，可以把这种偏好当作观察起点。月亮（象征情绪回应与安全感的命盘要素）落在金牛座（重视稳定和感官经验的星座），把这个面向与相应的表达方式联系起来；你容易先感受环境是否让人安心，再决定愿意分享多少；熟悉的节奏也可能影响你的情绪回应。这种表达方式让你倾向用可触及的结果确认进展；熟悉感能支持耐心，也可能让改变显得费力。熟悉的环境与节奏可能让你安心，值得询问哪些变化其实可以逐步适应。例如，忙碌一天后，观察你是想独处、聊天还是整理空间，再向身边的人说清需要，也可约定固定时段慢慢推进，比较哪种方式更容易让参与者理解。留意是否把一次情绪当成永久结论，或把惯例当成唯一办法；建议给情绪留十分钟再回复重要消息，用实际回应调整节奏，而不是凭一个位置给自己下定论。
    advice:
      - 保留惯例并试一个小调整
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Moon in Taurus: building through repetition'
    summary: You may approach emotional habits and comfort by building by repetition.
    body: 'You may approach emotional habits and comfort by building through repetition, especially
      when a familiar response is needed. The Moon — the chart factor associated with emotional habits
      and comfort — is placed in Taurus — a sign associated with steadiness and tangible experience.
      This approach suggests testing an idea through repeated contact with something real. Comfort
      can support persistence, provided it leaves space for a useful adjustment. A familiar setting
      may make it easier to settle after a demanding day; consider whether one carefully introduced
      change could fit inside that comfort. For example, after an unexpectedly busy evening, notice
      whether you reach for company, quiet, or a familiar routine before accepting another invitation.
      Watch for treating a familiar routine as the only workable option, as well as treating one mood
      as a permanent description of yourself. Try this: keep the useful routine and alter one detail,
      then compare the response with your original intention before deciding which part of the approach
      to keep.'
    advice:
      - Allow a pause before answering an emotionally charged message
    do:
      - Note a pattern
    dont:
      - Rush a label
  meta:
    author: t23-astrology-editorial-v1
    reviewed_by: null
    version: 1
    status: published
