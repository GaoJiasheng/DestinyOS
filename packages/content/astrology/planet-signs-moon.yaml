  zh:
    title: 月亮在巨蟹座：照顾感受与建立归属
    summary: 你在情绪回应与安全感上倾向照顾感受与建立归属。
    body: 你在情绪回应与安全感上倾向照顾感受与建立归属，可以把这种偏好当作观察起点。月亮（象征情绪回应与安全感的命盘要素）落在巨蟹座（重视照顾与归属的星座），把这个面向与相应的表达方式联系起来；你容易先感受环境是否让人安心，再决定愿意分享多少；熟悉的节奏也可能影响你的情绪回应。这种表达方式让你容易注意经历背后的感受；照顾别人之前，确认自己的余量有助于维持真诚。被认真回应可能让你更安心，照顾别人时也可以直接说出自己的需要。例如，忙碌一天后，观察你是想独处、聊天还是整理空间，再向身边的人说清需要，也可先问参与者怎样才感到被照顾，比较哪种方式更容易让参与者理解。留意是否把一次情绪当成永久结论，或默默承担全部照顾；建议给情绪留十分钟再回复重要消息，用实际回应调整节奏，而不是凭一个位置给自己下定论。
    advice:
      - 问清需要再决定如何支持
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Moon in Cancer: creating a sense of belonging'
    summary: You may approach emotional habits and comfort by creating a sense of belonging.
    body:
      "You may approach emotional habits and comfort by creating a sense of belonging, especially
      when a familiar response is needed. The Moon — the chart factor associated with emotional habits
      and comfort — is placed in Cancer — a sign associated with care and belonging. This approach
      suggests paying attention to what makes an experience feel emotionally safe. Attentiveness becomes
      more sustainable when it includes your own capacity, not only somebody else's comfort. Being
      received attentively may matter to your sense of comfort; asking for a response yourself can
      be as valuable as noticing another person's mood. For example, after an unexpectedly busy evening,
      notice whether you reach for company, quiet, or a familiar routine before accepting another
      invitation. Watch for taking responsibility for feelings nobody has asked you to manage, as
      well as treating one mood as a permanent description of yourself. Try this: ask what support
      is wanted before offering it, then compare the response with your original intention before
      deciding which part of the approach to keep."
    advice:
      - Allow a pause before answering an emotionally charged message
    do:
      - Note a pattern
    dont:
      - Rush a label
