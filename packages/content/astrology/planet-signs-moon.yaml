  zh:
    title: 月亮在摩羯座：规划阶段与承担责任
    summary: 你在情绪回应与安全感上倾向规划阶段与承担责任。
    body: 你在情绪回应与安全感上倾向规划阶段与承担责任，可以把这种偏好当作观察起点。月亮（象征情绪回应与安全感的命盘要素）落在摩羯座（重视规划和现实责任的星座），把这个面向与相应的表达方式联系起来；你容易先感受环境是否让人安心，再决定愿意分享多少；熟悉的节奏也可能影响你的情绪回应。这种表达方式让你倾向按阶段推进；看见长期价值有助于耐心，但人的需要也值得进入计划。明确可承担的范围可能帮助安心，接受照顾也可以与认真负责并存。例如，忙碌一天后，观察你是想独处、聊天还是整理空间，再向身边的人说清需要，也可为长期目标安排阶段检查点，比较哪种方式更容易让参与者理解。留意是否把一次情绪当成永久结论，或把承担更多当成唯一贡献；建议给情绪留十分钟再回复重要消息，用实际回应调整节奏，而不是凭一个位置给自己下定论。
