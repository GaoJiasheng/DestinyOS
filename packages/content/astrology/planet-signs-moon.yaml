    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Moon in Libra: negotiating a workable balance'
    summary: You may approach emotional habits and comfort by negotiating a workable balance.
    body:
      "You may approach emotional habits and comfort by negotiating a workable balance, especially
      when a familiar response is needed. The Moon — the chart factor associated with emotional habits
      and comfort — is placed in Libra — a sign associated with fairness and negotiation. This approach
      suggests looking at a question from both sides. A workable agreement needs your real preference
      as well as consideration for somebody else's position; agreement alone is not balance. A cooperative
      exchange may feel comforting; expressing a difference can preserve the connection more effectively
      than pretending your need has disappeared. For example, after an unexpectedly busy evening,
      notice whether you reach for company, quiet, or a familiar routine before accepting another
      invitation. Watch for hiding a preference to preserve a temporary peace, as well as treating
      one mood as a permanent description of yourself. Try this: include your own need in the negotiation,
      then compare the response with your original intention before deciding which part of the approach
      to keep."
    advice:
      - Allow a pause before answering an emotionally charged message
