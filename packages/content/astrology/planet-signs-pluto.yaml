    title: 冥王星在巨蟹座：照顾感受与建立归属
    summary: 你在深层改变与控制感上倾向照顾感受与建立归属。
    body: 你在深层改变与控制感上倾向照顾感受与建立归属，可以把这种偏好当作观察起点。冥王星（象征深层改变与控制感的命盘要素）落在巨蟹座（重视照顾与归属的星座），把这个面向与相应的表达方式联系起来；这里首先是世代背景，提示一群人共同面对的改变主题；你可以观察自己何时想抓紧决定权，何时愿意调整。这种表达方式让你容易注意经历背后的感受；照顾别人之前，确认自己的余量有助于维持真诚。这一世代可能重新理解归属中的权力关系，私人生活可以通过具体边界协商。例如，熟悉的安排改变时，列出仍可决定的部分，也承认需要协商的部分，也可先问参与者怎样才感到被照顾，比较哪种方式更容易让参与者理解。留意是否把不确定感全交给控制他人来处理，或默默承担全部照顾；建议明确自己能调整的一项安排，用实际回应调整节奏，而不是凭一个位置给自己下定论。
    advice:
      - 问清需要再决定如何支持
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Pluto in Cancer: creating a sense of belonging'
    summary: You may approach deep change and control by creating a sense of belonging.
    body:
      "You may approach deep change and control by creating a sense of belonging, especially when
      a familiar response is needed. Pluto — the chart factor associated with deep change and control
      — is placed in Cancer — a sign associated with care and belonging. This approach suggests paying
      attention to what makes an experience feel emotionally safe. Attentiveness becomes more sustainable
      when it includes your own capacity, not only somebody else's comfort. A shared question may
      concern power within belonging; name a practical household boundary before interpreting the
      entire connection through a collective story. For example, when a familiar arrangement changes,
      distinguish what you can decide from what depends on negotiation, and from what needs time to
      become clear. Watch for taking responsibility for feelings nobody has asked you to manage, as
      well as managing uncertainty by trying to direct another person's choices. Try this: ask what
      support is wanted before offering it, then compare the response with your original intention
      before deciding which part of the approach to keep."
    advice:
      - Choose one arrangement you can change without controlling someone else
    do:
      - Note a pattern
    dont:
      - Rush a label
