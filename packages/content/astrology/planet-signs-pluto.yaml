    dont:
      - 仓促定论
  en:
    title: 'Pluto in Gemini: connecting different viewpoints'
    summary: You may approach deep change and control by connecting different viewpoints.
    body: "You may approach deep change and control by connecting different viewpoints, especially
      when a familiar response is needed. Pluto — the chart factor associated with deep change and
      control — is placed in Gemini — a sign associated with curiosity and exchange. This approach
      suggests that a second viewpoint can reveal what a single explanation missed. Gathering options
      helps when you also choose a moment to stop gathering and decide. The generational theme may
      involve information and influence; distinguish a question needed for an agreement from a demand
      to know everything about someone. For example, when a familiar arrangement changes, distinguish
      what you can decide from what depends on negotiation, and from what needs time to become clear.
      Watch for continuing to collect alternatives after a decision is needed, as well as managing
      uncertainty by trying to direct another person's choices. Try this: end the discussion with
      one provisional choice, then compare the response with your original intention before deciding
      which part of the approach to keep."
