  en:
    title: 'Pluto in Libra: negotiating a workable balance'
    summary: You may approach deep change and control by negotiating a workable balance.
    body: "You may approach deep change and control by negotiating a workable balance, especially
      when a familiar response is needed. Pluto — the chart factor associated with deep change and
      control — is placed in Libra — a sign associated with fairness and negotiation. This approach
      suggests looking at a question from both sides. A workable agreement needs your real preference
      as well as consideration for somebody else's position; agreement alone is not balance. A generational
      question may focus on power within partnership; a specific request and a chance to revise an
      agreement may be more useful than an overarching label. For example, when a familiar arrangement
      changes, distinguish what you can decide from what depends on negotiation, and from what needs
      time to become clear. Watch for hiding a preference to preserve a temporary peace, as well as
      managing uncertainty by trying to direct another person's choices. Try this: include your own
      need in the negotiation, then compare the response with your original intention before deciding
      which part of the approach to keep."
