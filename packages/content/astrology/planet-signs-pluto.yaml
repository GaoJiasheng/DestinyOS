    title: 'Pluto in Virgo: improving practical details'
    summary: You may approach deep change and control by improving practical details.
    body: "You may approach deep change and control by improving practical details, especially when
      a familiar response is needed. Pluto — the chart factor associated with deep change and control
      — is placed in Virgo — a sign associated with discernment and practical improvement. This approach
