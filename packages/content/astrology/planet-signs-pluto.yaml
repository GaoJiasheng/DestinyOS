    body: 你在深层改变与控制感上倾向协调差异与寻找公平，可以把这种偏好当作观察起点。冥王星（象征深层改变与控制感的命盘要素）落在天秤座（重视协调与公平的星座），把这个面向与相应的表达方式联系起来；这里首先是世代背景，提示一群人共同面对的改变主题；你可以观察自己何时想抓紧决定权，何时愿意调整。这种表达方式让你倾向先理解不同立场；能谈成的平衡需要真实偏好参与，不能只靠你不断退让。这一世代可能重新讨论关系中的公平与权力，个人协商可以从清楚的需要开始。例如，熟悉的安排改变时，列出仍可决定的部分，也承认需要协商的部分，也可把双方需要并列写出来，比较哪种方式更容易让参与者理解。留意是否把不确定感全交给控制他人来处理，或为了平静而藏起意见；建议明确自己能调整的一项安排，用实际回应调整节奏，而不是凭一个位置给自己下定论。
