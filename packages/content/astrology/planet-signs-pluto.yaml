- id: astrology.planet_sign.pluto.aries
  system: astrology
  section: planets
  topic: pluto_sign
  when:
    path: bodies[key=pluto].sign
    eq: aries
  weight: 72
  polarity: neutral
  tags:
    - plain
    - astrology.keyword.curiosity
  exclusive_with: []
  zh:
    title: 冥王星在白羊座：先行动再校准
    summary: 你在深层改变与控制感上倾向先行动再校准。
    body: 你在深层改变与控制感上倾向先行动再校准，可以把这种偏好当作观察起点。冥王星（象征深层改变与控制感的命盘要素）落在白羊座（以启动和直接回应为象征的星座），把这个面向与相应的表达方式联系起来；这里首先是世代背景，提示一群人共同面对的改变主题；你可以观察自己何时想抓紧决定权，何时愿意调整。这种表达方式让这个面向倾向先尝试，再根据反馈修正；主动并不需要把速度放在所有事情之前。这一世代可能检视自主行动与权力的关系，个人调整可以从自己可决定的部分开始。例如，熟悉的安排改变时，列出仍可决定的部分，也承认需要协商的部分，也可先做一版能被讨论的草案，比较哪种方式更容易让参与者理解。留意是否把不确定感全交给控制他人来处理，或把急迫感传给别人；建议明确自己能调整的一项安排，用实际回应调整节奏，而不是凭一个位置给自己下定论。
    advice:
      - 开始前确认一个共同目标
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Pluto in Aries: starting directly'
    summary: You may approach deep change and control by starting directly.
    body: "You may approach deep change and control by starting directly, especially when a familiar
      response is needed. Pluto — the chart factor associated with deep change and control — is placed
      in Aries — a sign associated with initiating and responding directly. This approach suggests
      learning through a first attempt. The useful distinction is between opening a possibility and
      insisting that everybody follow at your pace. A generational question may concern power in initiating
      change; start with a decision that is actually yours before trying to redirect another person's
      response. For example, when a familiar arrangement changes, distinguish what you can decide
      from what depends on negotiation, and from what needs time to become clear. Watch for passing
      urgency to people who need context, as well as managing uncertainty by trying to direct another
      person's choices. Try this: agree on the purpose before moving quickly, then compare the response
      with your original intention before deciding which part of the approach to keep."
    advice:
      - Choose one arrangement you can change without controlling someone else
    do:
      - Note a pattern
    dont:
      - Rush a label
  meta:
    author: t23-astrology-editorial-v1
    reviewed_by: null
    version: 1
    status: published
- id: astrology.planet_sign.pluto.taurus
  system: astrology
  section: planets
  topic: pluto_sign
  when:
    path: bodies[key=pluto].sign
