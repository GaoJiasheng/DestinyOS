  zh:
    title: 冥王星在金牛座：稳定积累与具体感受
    summary: 你在深层改变与控制感上倾向稳定积累与具体感受。
    body: 你在深层改变与控制感上倾向稳定积累与具体感受，可以把这种偏好当作观察起点。冥王星（象征深层改变与控制感的命盘要素）落在金牛座（重视稳定和感官经验的星座），把这个面向与相应的表达方式联系起来；这里首先是世代背景，提示一群人共同面对的改变主题；你可以观察自己何时想抓紧决定权，何时愿意调整。这种表达方式让你倾向用可触及的结果确认进展；熟悉感能支持耐心，也可能让改变显得费力。这一世代可能面对资源与稳定观念的变化，个人价值仍不由拥有多少来定。例如，熟悉的安排改变时，列出仍可决定的部分，也承认需要协商的部分，也可约定固定时段慢慢推进，比较哪种方式更容易让参与者理解。留意是否把不确定感全交给控制他人来处理，或把惯例当成唯一办法；建议明确自己能调整的一项安排，用实际回应调整节奏，而不是凭一个位置给自己下定论。
    advice:
      - 保留惯例并试一个小调整
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Pluto in Taurus: building through repetition'
    summary: You may approach deep change and control by building by repetition.
    body: "You may approach deep change and control by building through repetition, especially when
      a familiar response is needed. Pluto — the chart factor associated with deep change and control
      — is placed in Taurus — a sign associated with steadiness and tangible experience. This approach
      suggests testing an idea through repeated contact with something real. Comfort can support persistence,
      provided it leaves space for a useful adjustment. Shared questions may involve changing arrangements
      for resources; examine how a priority serves your life without using possession as a measure
      of personal value. For example, when a familiar arrangement changes, distinguish what you can
      decide from what depends on negotiation, and from what needs time to become clear. Watch for
      treating a familiar routine as the only workable option, as well as managing uncertainty by
      trying to direct another person's choices. Try this: keep the useful routine and alter one
      detail, then compare the response with your original intention before deciding which part of
      the approach to keep."
    advice:
      - Choose one arrangement you can change without controlling someone else
    do:
      - Note a pattern
    dont:
      - Rush a label
  meta:
    author: t23-astrology-editorial-v1
    reviewed_by: null
    version: 1
    status: published
