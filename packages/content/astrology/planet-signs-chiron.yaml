  zh:
    title: 凯龙在金牛座：稳定积累与具体感受
    summary: 你在敏感经验与学习陪伴上倾向稳定积累与具体感受。
    body: 你在敏感经验与学习陪伴上倾向稳定积累与具体感受，可以把这种偏好当作观察起点。凯龙（象征敏感经验与学习陪伴的命盘要素）落在金牛座（重视稳定和感官经验的星座），把这个面向与相应的表达方式联系起来；凯龙是小天体，在这里作为敏感经验的象征；它的星历位置采用近似计算，不能据此判定身心问题。这种表达方式让你倾向用可触及的结果确认进展；熟悉感能支持耐心，也可能让改变显得费力。与价值感有关的经验可能较敏感，可以用实际可用的能力补充自我认识。例如，别人请你分享经验时，说明哪些是个人体会，哪些仍需要进一步了解，也可约定固定时段慢慢推进，比较哪种方式更容易让参与者理解。留意是否让一个敏感经历定义整个人，或把惯例当成唯一办法；建议先确认愿意分享的范围，用实际回应调整节奏，而不是凭一个位置给自己下定论。
    advice:
      - 保留惯例并试一个小调整
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Chiron in Taurus: building through repetition'
    summary: You may approach sensitivity and learning by experience by building by repetition.
    body:
      'You may approach sensitivity and learning through experience by building through repetition,
      especially when a familiar response is needed. Chiron — the chart factor associated with sensitivity
      and learning through experience — is placed in Taurus — a sign associated with steadiness and
      tangible experience. Chiron is a small body used symbolically for sensitive experiences and
      learning; this engine approximates its position, so the placement calls for extra caution near
      a boundary. This approach suggests testing an idea through repeated contact with something real;
      Comfort can support persistence, provided it leaves space for a useful adjustment. An experience
      around feeling valued may be sensitive; notice a skill you can use now without asking a single
      difficult moment to define your worth. For example, when someone asks you to share a difficult
      experience, decide which part feels useful to discuss and which part you prefer to keep private.
      Watch for treating a familiar routine as the only workable option, as well as letting one tender
      experience become your entire identity. Try this: keep the useful routine and alter one detail,
      then compare the response with your original intention before deciding which part of the approach
      to keep.'
    advice:
      - Decide the limits of a personal story before sharing it
    do:
      - Note a pattern
    dont:
      - Rush a label
