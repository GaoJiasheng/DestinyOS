  en:
    title: 'Chiron in Libra: negotiating a workable balance'
    summary: You may approach sensitivity and learning by experience by negotiating a workable balance.
    body: "You may approach sensitivity and learning through experience by negotiating a workable
      balance, especially when a familiar response is needed. Chiron — the chart factor associated
      with sensitivity and learning through experience — is placed in Libra — a sign associated with
      fairness and negotiation. Chiron is a small body used symbolically for sensitive experiences
      and learning; this engine approximates its position, so the placement calls for extra caution
      near a boundary. This approach suggests looking at a question from both sides; A workable agreement
      needs your real preference as well as consideration for somebody else's position; agreement
      alone is not balance. Fairness in an exchange may feel tender; name one actual need before deciding
      which part of a difficult personal experience belongs in the discussion. For example, when someone
      asks you to share a difficult experience, decide which part feels useful to discuss and which
      part you prefer to keep private. Watch for hiding a preference to preserve a temporary peace,
      as well as letting one tender experience become your entire identity. Try this: include your
      own need in the negotiation, then compare the response with your original intention before deciding
      which part of the approach to keep."
