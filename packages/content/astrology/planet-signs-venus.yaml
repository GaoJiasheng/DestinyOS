  zh:
    title: 金星在金牛座：稳定积累与具体感受
    summary: 你在关系偏好、欣赏与价值感上倾向稳定积累与具体感受。
    body: 你在关系偏好、欣赏与价值感上倾向稳定积累与具体感受，可以把这种偏好当作观察起点。金星（象征关系偏好、欣赏与价值感的命盘要素）落在金牛座（重视稳定和感官经验的星座），把这个面向与相应的表达方式联系起来；你表达欣赏的方式，可能与接受关心的方式有关；关系里的舒适感需要双方说明，而非靠猜测。这种表达方式让你倾向用可触及的结果确认进展；熟悉感能支持耐心，也可能让改变显得费力。稳定的陪伴与具体关心可能表达欣赏，熟悉的安排也可以由双方修改。例如，和朋友安排见面时，说出你喜欢的氛围，也问对方怎样相处更自在，也可约定固定时段慢慢推进，比较哪种方式更容易让参与者理解。留意是否用讨好替代真实偏好，或把惯例当成唯一办法；建议说明一个喜欢与一个边界，用实际回应调整节奏，而不是凭一个位置给自己下定论。
    advice:
      - 保留惯例并试一个小调整
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Venus in Taurus: building through repetition'
    summary: You may approach affection and personal values by building by repetition.
    body: 'You may approach affection and personal values by building through repetition, especially
      when a familiar response is needed. Venus — the chart factor associated with affection and personal
      values — is placed in Taurus — a sign associated with steadiness and tangible experience. This
      approach suggests testing an idea through repeated contact with something real. Comfort can
      support persistence, provided it leaves space for a useful adjustment. A consistent gesture
      may communicate appreciation more clearly than a dramatic promise; invite the other person to
      say which routine they actually enjoy. For example, when arranging time with someone you like,
      notice whether the activity reflects mutual enjoyment or mainly your hope of making a good impression.
      Watch for treating a familiar routine as the only workable option, as well as substituting pleasant
      agreement for an honest preference. Try this: keep the useful routine and alter one detail,
      then compare the response with your original intention before deciding which part of the approach
      to keep.'
    advice:
      - Share one preference and one boundary without testing the other person
    do:
      - Note a pattern
    dont:
      - Rush a label
  meta:
    author: t23-astrology-editorial-v1
    reviewed_by: null
    version: 1
    status: published
