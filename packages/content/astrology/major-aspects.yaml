  zh:
    title: 水星与金星合相：协调两种需要
    summary: 你可以观察“思考、学习与沟通”和“关系偏好、欣赏与价值感”之间的配合。
    body: 你在思考、学习与沟通与关系偏好、欣赏与价值感之间，可能体验到两种需要交织，适合区分各自的任务。命盘里的水星（象征思考、学习与沟通）与金星（象征关系偏好、欣赏与价值感）形成合相（两颗行星黄经接近的关系），把两个面向集中在一起，容易同时启动；靠得近不等于表达一致，也不自动表示轻松或困难。例如，讨论新方案时，先举一个对方熟悉的例子，再邀请对方复述理解，同时检查关系偏好、欣赏与价值感是否也需要被回应，避免只顾一边。注意把说得快当成已经说清楚或用讨好替代真实偏好是否让协商变窄；可以把两种需要分开命名，再决定先回应哪一种，再先问对方需要细节还是整体框架，用一次具体互动检验调整是否合适，而非把角度当作事件预告。
    advice:
      - 把两种需要分开命名，再决定先回应哪一种
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: Mercury conjunction Venus
    summary:
      'You may notice two needs becoming intertwined: learning and communication; affection and
      personal values.'
    body: 'You may recognize two needs becoming intertwined when the themes of learning and
      communication intersect with affection and personal values. Your chart links Mercury — a
      symbol for learning and communication — with Venus — a symbol for affection and personal
      values — through a conjunction — a near alignment in zodiac longitude. This relationship
      brings two symbolic functions into close contact. They may start together while still needing
      different conditions; proximity alone does not describe an easy or difficult outcome. For
      example, when arranging time with someone you like, notice whether the activity reflects
      mutual enjoyment or mainly your hope of making a good impression, while asking whether
      learning and communication also need attention. Watch for mistaking a fast explanation for a
      shared understanding, or for substituting pleasant agreement for an honest preference, when
      one side dominates an exchange. Try this: name the two needs separately before deciding which
      one to address; check the response before deciding what to repeat; the angle is a symbolic
      prompt rather than a forecast of an event.'
    advice:
      - Name the two needs separately before deciding which one to address
