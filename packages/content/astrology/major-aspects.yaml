    body: 你在自主选择与认同与想象、共情与理想之间，可能体验到两种需要像拉扯两端，可以寻找轮流表达的安排。命盘里的太阳（象征自主选择与认同）与海王星（象征想象、共情与理想）形成对冲（两颗行星约一百八十度的关系），象征容易被看成两端的需求；另一端也可能由互动唤起，不能据此认定别人是问题来源。例如，负责项目时，先说明你想实现的价值，再把一个关键决定交给团队讨论，同时检查想象、共情与理想是否也需要被回应，避免只顾一边。注意把被看见当成唯一的反馈或让美好想象替代必要确认是否让协商变窄；可以给两种需要各留一个明确表达的时段，再给长期目标写下一个可以调整的理由，用一次具体互动检验调整是否合适，而非把角度当作事件预告。
    advice:
      - 给两种需要各留一个明确表达的时段
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: Sun opposition Neptune
    summary: 'You may notice two perspectives that need room in turn: identity and chosen direction;
      imagination and shared ideals.'
    body: 'You may recognize two perspectives that need room in turn when the themes of identity and
      chosen direction intersect with imagination and shared ideals. Your chart links Sun — a symbol
      for identity and chosen direction — with Neptune — a symbol for imagination and shared ideals
      — through a opposition — an angular relationship near one hundred and eighty degrees. This
      relationship highlights perspectives that can feel separated. An encounter may make one side
      more visible, without making the other person responsible for your entire inner tension. For
      example, when a collaboration feels immediately inspiring, ask what each person expects to
      deliver before relying on the sense that everyone understands one another, while asking
      whether identity and chosen direction also need attention. Watch for making visibility the
      only measure of worthwhile work, or for allowing an attractive story to replace ordinary
      clarification, when one side dominates an exchange. Try this: give each perspective a defined
      opportunity to be heard; check the response before deciding what to repeat; the angle is a
