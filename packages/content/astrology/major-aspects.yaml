    title: 火星与天王星合相：协调两种需要
    summary: 你可以观察“行动、竞争与边界”和“更新规则与争取自主”之间的配合。
    body: 你在行动、竞争与边界与更新规则与争取自主之间，可能体验到两种需要交织，适合区分各自的任务。命盘里的火星（象征行动、竞争与边界）与天王星（象征更新规则与争取自主）形成合相（两颗行星黄经接近的关系），把两个面向集中在一起，容易同时启动；靠得近不等于表达一致，也不自动表示轻松或困难。例如，任务突然加急时，先列出能做的部分，再明确需要协商的截止时间，同时检查更新规则与争取自主是否也需要被回应，避免只顾一边。注意把每个分歧都当成较量或为了不同而忽略已有经验是否让协商变窄；可以把两种需要分开命名，再决定先回应哪一种，再先确定第一步与暂停条件，用一次具体互动检验调整是否合适，而非把角度当作事件预告。
    advice:
      - 把两种需要分开命名，再决定先回应哪一种
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: Mars conjunction Uranus
    summary: 'You may notice two needs becoming intertwined: initiative and assertiveness;
      experimentation and independence.'
    body: 'You may recognize two needs becoming intertwined when the themes of initiative and
      assertiveness intersect with experimentation and independence. Your chart links Mars — a
      symbol for initiative and assertiveness — with Uranus — a symbol for experimentation and
      independence — through a conjunction — a near alignment in zodiac longitude. This relationship
      brings two symbolic functions into close contact. They may start together while still needing
      different conditions; proximity alone does not describe an easy or difficult outcome. For
      example, when a group repeats an outdated process, consider whether a reversible trial would
      teach more than rejecting the whole arrangement at once, while asking whether initiative and
      assertiveness also need attention. Watch for turning every disagreement into a contest that
      needs a winner, or for making originality more important than whether an experiment serves
      people, when one side dominates an exchange. Try this: name the two needs separately before
      deciding which one to address; check the response before deciding what to repeat; the angle is
      a symbolic prompt rather than a forecast of an event.'
    advice:
      - Name the two needs separately before deciding which one to address
    do:
