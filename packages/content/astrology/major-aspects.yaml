    title: 月亮与天王星合相：协调两种需要
    summary: 你可以观察“情绪回应与安全感”和“更新规则与争取自主”之间的配合。
    body: 你在情绪回应与安全感与更新规则与争取自主之间，可能体验到两种需要交织，适合区分各自的任务。命盘里的月亮（象征情绪回应与安全感）与天王星（象征更新规则与争取自主）形成合相（两颗行星黄经接近的关系），把两个面向集中在一起，容易同时启动；靠得近不等于表达一致，也不自动表示轻松或困难。例如，忙碌一天后，观察你是想独处、聊天还是整理空间，再向身边的人说清需要，同时检查更新规则与争取自主是否也需要被回应，避免只顾一边。注意把一次情绪当成永久结论或为了不同而忽略已有经验是否让协商变窄；可以把两种需要分开命名，再决定先回应哪一种，再给情绪留十分钟再回复重要消息，用一次具体互动检验调整是否合适，而非把角度当作事件预告。
    advice:
      - 把两种需要分开命名，再决定先回应哪一种
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: Moon conjunction Uranus
    summary: 'You may notice two needs becoming intertwined: emotional habits and comfort;
      experimentation and independence.'
    body: 'You may recognize two needs becoming intertwined when the themes of emotional habits and
      comfort intersect with experimentation and independence. Your chart links Moon — a symbol for
      emotional habits and comfort — with Uranus — a symbol for experimentation and independence —
      through a conjunction — a near alignment in zodiac longitude. This relationship brings two
      symbolic functions into close contact. They may start together while still needing different
      conditions; proximity alone does not describe an easy or difficult outcome. For example, when
      a group repeats an outdated process, consider whether a reversible trial would teach more than
      rejecting the whole arrangement at once, while asking whether emotional habits and comfort
      also need attention. Watch for treating one mood as a permanent description of yourself, or
      for making originality more important than whether an experiment serves people, when one side
      dominates an exchange. Try this: name the two needs separately before deciding which one to
      address; check the response before deciding what to repeat; the angle is a symbolic prompt
      rather than a forecast of an event.'
    advice:
      - Name the two needs separately before deciding which one to address
