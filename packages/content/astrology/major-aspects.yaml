  exclusive_with: *id001
  zh:
    title: 太阳与月亮四分相：协调两种需要
    summary: 你可以观察“自主选择与认同”和“情绪回应与安全感”之间的配合。
    body: 你在自主选择与认同，以及情绪回应与安全感之间，可能体验到两种需要容易抢占同一时段，可以练习协调。命盘里的太阳（象征自主选择与认同）与月亮（象征情绪回应与安全感）形成四分相（两颗行星约九十度的关系），象征不同需求之间的摩擦；紧张感可提醒你重新排序，并不说明某个面向必须被压住。例如，负责项目时，先说明你想实现的价值，再把一个关键决定交给团队讨论，同时检查情绪回应与安全感是否也需要被回应，避免只顾一边。注意把被看见当成唯一的反馈或把一次情绪当成永久结论是否让协商变窄；可以把优先级与轮换时间说清楚，再给长期目标写下一个可以调整的理由，用一次具体互动检验调整是否合适，而非把角度当作事件预告。
    advice:
      - 把优先级与轮换时间说清楚
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: Sun square Moon
    summary:
      'You may notice two priorities competing for the same space: identity and chosen direction;
      emotional habits and comfort.'
    body:
      'You may recognize two priorities competing for the same space when the themes of identity and
      chosen direction intersect with emotional habits and comfort. Your chart links Sun — a symbol
      for identity and chosen direction — with Moon — a symbol for emotional habits and comfort —
      through a square — an angular relationship near ninety degrees. This relationship frames
      friction between different priorities. A difficult choice can make those priorities visible
      without requiring you to reject one part of your experience. For example, after an
      unexpectedly busy evening, notice whether you reach for company, quiet, or a familiar routine
      before accepting another invitation, while asking whether identity and chosen direction also
      need attention. Watch for making visibility the only measure of worthwhile work, or for
      treating one mood as a permanent description of yourself, when one side dominates an exchange.
      Try this: make the order of priorities and a time to revisit them explicit; check the response
      before deciding what to repeat; the angle is a symbolic prompt rather than a forecast of an
      event.'
    advice:
      - Make the order of priorities and a time to revisit them explicit
    do:
      - Note a pattern
    dont:
      - Rush a label
