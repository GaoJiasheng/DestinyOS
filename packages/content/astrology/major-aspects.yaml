    title: 金星与冥王星合相：协调两种需要
    summary: 你可以观察“关系偏好、欣赏与价值感”和“深层改变与控制感”之间的配合。
    body: 你在关系偏好、欣赏与价值感与深层改变与控制感之间，可能体验到两种需要交织，适合区分各自的任务。命盘里的金星（象征关系偏好、欣赏与价值感）与冥王星（象征深层改变与控制感）形成合相（两颗行星黄经接近的关系），把两个面向集中在一起，容易同时启动；靠得近不等于表达一致，也不自动表示轻松或困难。例如，和朋友安排见面时，说出你喜欢的氛围，也问对方怎样相处更自在，同时检查深层改变与控制感是否也需要被回应，避免只顾一边。注意用讨好替代真实偏好或把不确定感全交给控制他人来处理是否让协商变窄；可以把两种需要分开命名，再决定先回应哪一种，再说明一个喜欢与一个边界，用一次具体互动检验调整是否合适，而非把角度当作事件预告。
    advice:
      - 把两种需要分开命名，再决定先回应哪一种
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: Venus conjunction Pluto
    summary:
      'You may notice two needs becoming intertwined: affection and personal values; deep change
      and control.'
    body:
      "You may recognize two needs becoming intertwined when the themes of affection and personal
      values intersect with deep change and control. Your chart links Venus — a symbol for affection
      and personal values — with Pluto — a symbol for deep change and control — through a
      conjunction — a near alignment in zodiac longitude. This relationship brings two symbolic
      functions into close contact. They may start together while still needing different
      conditions; proximity alone does not describe an easy or difficult outcome. For example, when
      a familiar arrangement changes, distinguish what you can decide from what depends on
      negotiation, and from what needs time to become clear, while asking whether affection and
      personal values also need attention. Watch for substituting pleasant agreement for an honest
      preference, or for managing uncertainty by trying to direct another person's choices, when one
      side dominates an exchange. Try this: name the two needs separately before deciding which one
      to address; check the response before deciding what to repeat; the angle is a symbolic prompt
      rather than a forecast of an event."
    advice:
      - Name the two needs separately before deciding which one to address
