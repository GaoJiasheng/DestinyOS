    summary: 你可以观察“自主选择与认同”和“情绪回应与安全感”之间的配合。
    body: 你在自主选择与认同，以及情绪回应与安全感之间，可能体验到两种需要倾向自然配合，也值得有意识练习。命盘里的太阳（象征自主选择与认同）与月亮（象征情绪回应与安全感）形成三分相（两颗行星约一百二十度的关系），象征较易衔接的表达；顺手的方式可能被忽略，仍需要练习与环境支持才能成为实际帮助。例如，负责项目时，先说明你想实现的价值，再把一个关键决定交给团队讨论，同时检查情绪回应与安全感是否也需要被回应，避免只顾一边。注意把被看见当成唯一的反馈或把一次情绪当成永久结论是否让协商变窄；可以记录一次顺手的配合并主动重复练习，再给长期目标写下一个可以调整的理由，用一次具体互动检验调整是否合适，而非把角度当作事件预告。
    advice:
      - 记录一次顺手的配合并主动重复练习
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: Sun trine Moon
    summary:
      'You may notice a familiar flow that benefits from practice: identity and chosen direction;
      emotional habits and comfort.'
    body:
      'You may recognize a familiar flow that benefits from practice when the themes of identity and
      chosen direction intersect with emotional habits and comfort. Your chart links Sun — a symbol
      for identity and chosen direction — with Moon — a symbol for emotional habits and comfort —
      through a trine — an angular relationship near one hundred and twenty degrees. This
      relationship suggests a comparatively familiar connection. Ease may remain unnoticed unless
      you use it; a comfortable response still benefits from practice and feedback. For example,
      after an unexpectedly busy evening, notice whether you reach for company, quiet, or a familiar
      routine before accepting another invitation, while asking whether identity and chosen
      direction also need attention. Watch for making visibility the only measure of worthwhile
      work, or for treating one mood as a permanent description of yourself, when one side dominates
      an exchange. Try this: notice one useful connection and practice it deliberately; check the
      response before deciding what to repeat; the angle is a symbolic prompt rather than a forecast
      of an event.'
    advice:
      - Notice one useful connection and practice it deliberately
