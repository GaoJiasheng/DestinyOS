  en:
    title: Sun sextile Pluto
    summary:
      'You may notice an opportunity for deliberate cooperation: identity and chosen direction;
      deep change and control.'
    body:
      "You may recognize an opportunity for deliberate cooperation when the themes of identity and
      chosen direction intersect with deep change and control. Your chart links Sun — a symbol for
      identity and chosen direction — with Pluto — a symbol for deep change and control — through a
      sextile — an angular relationship near sixty degrees. This relationship suggests a possible
      route for cooperation. That route needs engagement; noticing compatible interests is different
      from taking the step that lets them work together. For example, when a familiar arrangement
      changes, distinguish what you can decide from what depends on negotiation, and from what needs
      time to become clear, while asking whether identity and chosen direction also need attention.
      Watch for making visibility the only measure of worthwhile work, or for managing uncertainty
      by trying to direct another person's choices, when one side dominates an exchange. Try this:
      choose a small task that lets both interests contribute; check the response before deciding
      what to repeat; the angle is a symbolic prompt rather than a forecast of an event."
    advice:
      - Choose a small task that lets both interests contribute
    do:
      - Note a pattern
    dont:
      - Rush a label
