    title: 太阳与冥王星六分相：协调两种需要
    summary: 你可以观察“自主选择与认同”和“深层改变与控制感”之间的配合。
    body: 你在自主选择与认同与深层改变与控制感之间，可能体验到两种需要可以合作，但仍需要主动搭桥。命盘里的太阳（象征自主选择与认同）与冥王星（象征深层改变与控制感）形成六分相（两颗行星约六十度的关系），象征可通过参与建立的配合；机会需要被使用，不能只凭这个关系认定事情会顺利展开。例如，负责项目时，先说明你想实现的价值，再把一个关键决定交给团队讨论，同时检查深层改变与控制感是否也需要被回应，避免只顾一边。注意把被看见当成唯一的反馈或把不确定感全交给控制他人来处理是否让协商变窄；可以找一个能让两种需要同时参与的小任务，再给长期目标写下一个可以调整的理由，用一次具体互动检验调整是否合适，而非把角度当作事件预告。
    advice:
      - 找一个能让两种需要同时参与的小任务
    do:
