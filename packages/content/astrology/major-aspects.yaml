- id: astrology.aspect.sun_moon.conjunction
  system: astrology
  section: aspects
  topic: aspect_sun_moon
  when:
    any:
      - path: aspects[a=sun][b=moon][type=conjunction].major
        eq: true
      - path: aspects[a=moon][b=sun][type=conjunction].major
        eq: true
  weight: 78
  polarity: neutral
  tags:
    - plain
    - astrology.keyword.cooperation
  exclusive_with: &id001 []
  zh:
    title: 太阳与月亮合相：协调两种需要
    summary: 你可以观察“自主选择与认同”和“情绪回应与安全感”之间的配合。
    body: 你在自主选择与认同，以及情绪回应与安全感之间，可能体验到两种需要交织，适合区分各自的任务。命盘里的太阳（象征自主选择与认同）与月亮（象征情绪回应与安全感）形成合相（两颗行星黄经接近的关系），把两个面向集中在一起，容易同时启动；靠得近不等于表达一致，也不自动表示轻松或困难。例如，负责项目时，先说明你想实现的价值，再把一个关键决定交给团队讨论，同时检查情绪回应与安全感是否也需要被回应，避免只顾一边。注意把被看见当成唯一的反馈或把一次情绪当成永久结论是否让协商变窄；可以把两种需要分开命名，再决定先回应哪一种，再给长期目标写下一个可以调整的理由，用一次具体互动检验调整是否合适，而非把角度当作事件预告。
    advice:
      - 把两种需要分开命名，再决定先回应哪一种
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: Sun conjunction Moon
    summary:
      'You may notice two needs becoming intertwined: identity and chosen direction; emotional
      habits and comfort.'
    body: 'You may recognize two needs becoming intertwined when the themes of identity and chosen
      direction intersect with emotional habits and comfort. Your chart links Sun — a symbol for
      identity and chosen direction — with Moon — a symbol for emotional habits and comfort —
      through a conjunction — a near alignment in zodiac longitude. This relationship brings two
      symbolic functions into close contact. They may start together while still needing different
      conditions; proximity alone does not describe an easy or difficult outcome. For example, after
      an unexpectedly busy evening, notice whether you reach for company, quiet, or a familiar
      routine before accepting another invitation, while asking whether identity and chosen
      direction also need attention. Watch for making visibility the only measure of worthwhile
      work, or for treating one mood as a permanent description of yourself, when one side dominates
      an exchange. Try this: name the two needs separately before deciding which one to address;
      check the response before deciding what to repeat; the angle is a symbolic prompt rather than
      a forecast of an event.'
    advice:
      - Name the two needs separately before deciding which one to address
    do:
      - Note a pattern
    dont:
      - Rush a label
  meta:
    author: t23-astrology-editorial-v1
    reviewed_by: null
    version: 2
    status: published
- id: astrology.aspect.sun_moon.sextile
  system: astrology
  section: aspects
  topic: aspect_sun_moon
  when:
    any:
      - path: aspects[a=sun][b=moon][type=sextile].major
        eq: true
      - path: aspects[a=moon][b=sun][type=sextile].major
        eq: true
  weight: 78
  polarity: neutral
  tags:
    - plain
    - astrology.keyword.cooperation
  exclusive_with: *id001
  zh:
    title: 太阳与月亮六分相：协调两种需要
    summary: 你可以观察“自主选择与认同”和“情绪回应与安全感”之间的配合。
    body: 你在自主选择与认同，以及情绪回应与安全感之间，可能体验到两种需要可以合作，但仍需要主动搭桥。命盘里的太阳（象征自主选择与认同）与月亮（象征情绪回应与安全感）形成六分相（两颗行星约六十度的关系），象征可通过参与建立的配合；机会需要被使用，不能只凭这个关系认定事情会顺利展开。例如，负责项目时，先说明你想实现的价值，再把一个关键决定交给团队讨论，同时检查情绪回应与安全感是否也需要被回应，避免只顾一边。注意把被看见当成唯一的反馈或把一次情绪当成永久结论是否让协商变窄；可以找一个能让两种需要同时参与的小任务，再给长期目标写下一个可以调整的理由，用一次具体互动检验调整是否合适，而非把角度当作事件预告。
    advice:
      - 找一个能让两种需要同时参与的小任务
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: Sun sextile Moon
    summary:
      'You may notice an opportunity for deliberate cooperation: identity and chosen direction;
      emotional habits and comfort.'
    body:
      'You may recognize an opportunity for deliberate cooperation when the themes of identity and
      chosen direction intersect with emotional habits and comfort. Your chart links Sun — a symbol
      for identity and chosen direction — with Moon — a symbol for emotional habits and comfort —
      through a sextile — an angular relationship near sixty degrees. This relationship suggests a
      possible route for cooperation. That route needs engagement; noticing compatible interests is
      different from taking the step that lets them work together. For example, after an
      unexpectedly busy evening, notice whether you reach for company, quiet, or a familiar routine
      before accepting another invitation, while asking whether identity and chosen direction also
      need attention. Watch for making visibility the only measure of worthwhile work, or for
      treating one mood as a permanent description of yourself, when one side dominates an exchange.
      Try this: choose a small task that lets both interests contribute; check the response before
      deciding what to repeat; the angle is a symbolic prompt rather than a forecast of an event.'
    advice:
      - Choose a small task that lets both interests contribute
    do:
      - Note a pattern
    dont:
      - Rush a label
  meta:
    author: t23-astrology-editorial-v1
    reviewed_by: null
    version: 2
    status: published
