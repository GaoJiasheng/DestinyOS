      - 把两种需要分开命名，再决定先回应哪一种
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: Sun conjunction Venus
    summary:
      'You may notice two needs becoming intertwined: identity and chosen direction; affection
      and personal values.'
    body: 'You may recognize two needs becoming intertwined when the themes of identity and chosen
      direction intersect with affection and personal values. Your chart links Sun — a symbol for
      identity and chosen direction — with Venus — a symbol for affection and personal values —
      through a conjunction — a near alignment in zodiac longitude. This relationship brings two
      symbolic functions into close contact. They may start together while still needing different
      conditions; proximity alone does not describe an easy or difficult outcome. For example, when
      arranging time with someone you like, notice whether the activity reflects mutual enjoyment or
      mainly your hope of making a good impression, while asking whether identity and chosen
      direction also need attention. Watch for making visibility the only measure of worthwhile
      work, or for substituting pleasant agreement for an honest preference, when one side dominates
      an exchange. Try this: name the two needs separately before deciding which one to address;
      check the response before deciding what to repeat; the angle is a symbolic prompt rather than
      a forecast of an event.'
