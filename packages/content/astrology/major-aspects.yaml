    body: 你在思考、学习与沟通与深层改变与控制感之间，可能体验到两种需要可以合作，但仍需要主动搭桥。命盘里的水星（象征思考、学习与沟通）与冥王星（象征深层改变与控制感）形成六分相（两颗行星约六十度的关系），象征可通过参与建立的配合；机会需要被使用，不能只凭这个关系认定事情会顺利展开。例如，讨论新方案时，先举一个对方熟悉的例子，再邀请对方复述理解，同时检查深层改变与控制感是否也需要被回应，避免只顾一边。注意把说得快当成已经说清楚或把不确定感全交给控制他人来处理是否让协商变窄；可以找一个能让两种需要同时参与的小任务，再先问对方需要细节还是整体框架，用一次具体互动检验调整是否合适，而非把角度当作事件预告。
