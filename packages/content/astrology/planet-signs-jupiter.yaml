      - 讨论后写下一项明确选择
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Jupiter in Gemini: connecting different viewpoints'
    summary: You may approach exploration and confidence by connecting different viewpoints.
    body:
      'You may approach exploration and confidence by connecting different viewpoints, especially
      when a familiar response is needed. Jupiter — the chart factor associated with exploration and
      confidence — is placed in Gemini — a sign associated with curiosity and exchange. This approach
      suggests that a second viewpoint can reveal what a single explanation missed. Gathering options
      helps when you also choose a moment to stop gathering and decide. Meeting several explanations
      may broaden a subject; formulate one question you can investigate rather than taking the abundance
      of accounts as knowledge by itself. For example, before joining a course, distinguish the question
      you want to explore from the excitement of imagining a more accomplished future self. Watch
      for continuing to collect alternatives after a decision is needed, as well as confusing an appealing
      possibility with capacity you already have. Try this: end the discussion with one provisional
      choice, then compare the response with your original intention before deciding which part of
      the approach to keep.'
