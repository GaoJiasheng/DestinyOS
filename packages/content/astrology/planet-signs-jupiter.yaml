    title: 'Jupiter in Capricorn: organizing sustained effort'
    summary: You may approach exploration and confidence by organizing sustained effort.
    body: 'You may approach exploration and confidence by organizing sustained effort, especially
      when a familiar response is needed. Jupiter — the chart factor associated with exploration and
      confidence — is placed in Capricorn — a sign associated with planning and responsibility. This
      approach suggests translating intentions into stages. A durable plan includes the people doing
      the work, so rest, support, and renegotiation belong beside milestones rather than outside them.
      Expanding in stages may make an ambitious idea usable; a practical limit can help you choose
      which part deserves attention now without discarding the wider hope. For example, before joining
      a course, distinguish the question you want to explore from the excitement of imagining a more
      accomplished future self. Watch for assuming that carrying more is the only meaningful contribution,
      as well as confusing an appealing possibility with capacity you already have. Try this: plan
      for support and rest beside the milestones, then compare the response with your original intention
      before deciding which part of the approach to keep.'
