      curiosity remains distinguishable from a demand for access to somebody else's private experience.
      A sustained investigation may widen understanding; when sharing a conclusion, show which part
      follows evidence and which remains a question you are still exploring. For example, before joining
      a course, distinguish the question you want to explore from the excitement of imagining a more
      accomplished future self. Watch for taking somebody's silence as evidence of a hidden intention,
      as well as confusing an appealing possibility with capacity you already have. Try this: let
      trust grow through observable agreements, then compare the response with your original intention
      before deciding which part of the approach to keep."
