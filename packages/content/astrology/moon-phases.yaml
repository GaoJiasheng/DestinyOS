- id: astrology.moon_phase.new_moon
  system: astrology
  section: patterns
  topic: moon_phase
  when:
    path: moonPhase.name
    eq: new_moon
  weight: 66
  polarity: neutral
  tags:
    - plain
    - astrology.keyword.cooperation
  exclusive_with: &id001 []
  zh:
    title: 新月：观察意愿与感受
    summary: 你可以借新月观察意愿与感受如何对话。
    body: 你愿望与感受倾向一起启动，可以把这个方向放回日常节奏里观察。出生月相（出生时太阳与月亮的角距分类）是新月（日月角距接近零度，代表一种象征性的开始）；这只是描述意愿与感受如何对话的文化线索，不是对某一天状态的实时判断。相同月相的人仍有不同环境与习惯，日月的星座和其他位置会提供更多背景。例如，完成一项小组活动后，你可比较自己原先想做的事与过程中真实的感受，看看哪里一致、哪里需要调整。建议先写下想做什么，再检查此刻的情绪是否支持开始，并记录一次做法与回应；无需为了符合月相名称而改变原本适合自己的作息或参与方式。
    advice:
      - 先写下想做什么，再检查此刻的情绪是否支持开始
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'New moon: intention and feeling'
    summary: You may notice intention and feeling beginning together.
    body: 'You may notice intention and feeling beginning together, and use that idea as a question
      about your everyday rhythm. Your natal Moon phase — the category based on the Sun–Moon angle
      at birth — is New moon — a small Sun–Moon angle, used symbolically for a beginning. It frames
      a symbolic conversation between intention and feeling rather than describing your current mood
      or the sky today. People with this phase still have different surroundings and habits, while
      the signs and other placements offer further context. After a group activity, compare what you
      wanted to do with what felt comfortable during the process; the difference may show where a
      practical adjustment would help. Try this: write an intention, then check whether your present
      mood supports a first step. Record the response without reorganizing your life simply to match
      the name of a lunar phase.'
    advice:
      - Write an intention, then check whether your present mood supports a first step
    do:
      - Note a pattern
    dont:
      - Rush a label
  meta:
    author: t23-astrology-editorial-v1
    reviewed_by: null
    version: 1
    status: published
