    title: 'Kite: a question about coordination'
    summary: You can explore a familiar strength finding a practical outlet through a contrasting
      demand.
    body:
      'You can use the Kite — a grand trine joined by an opposition and two sextiles — as a prompt
      for coordinating needs, without treating it as a ranking or a forecast. The engine detects this
      structure in your chart. Symbolically, it points toward a familiar strength finding a practical
      outlet through a contrasting demand; the participating planets and your actual setting still
      matter. Imagine that a reliable skill gains a new use when another person asks you to solve
      an unfamiliar problem. Before deciding what the pattern means for you, separate a habitual response
      from a demand created by the present situation. Try this: connect an established skill with
      one real request. A geometric arrangement does not require you to repeat a particular story,
      and an ordinary conversation can be more useful than trying to live up to the name of a pattern.'
    advice:
      - Connect an established skill with one real request
    do:
      - Note a pattern
    dont:
