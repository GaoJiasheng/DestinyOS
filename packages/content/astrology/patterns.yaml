  exclusive_with: *id001
  zh:
    title: 星群：让结构成为提问
    summary: 你可以从星群观察不同需要如何配合。
    body: 你可以把星群（至少三颗行星集中在同一星座或同一宫位）看成协调不同需要的线索，而不是人生等级或事件预告。星群在这张命盘中被检测到，说明几个面向以特定角度或集中位置联系起来；它象征某种表达或生活领域比较集中，但其他面向仍值得被看见，具体表现仍取决于参与的行星与实际环境。比如，你常从同一个角度理解事情，伙伴的补充却提醒你还有别的入口，这时可以先区分哪些是自己的习惯，哪些是当下情境的要求。不要让结构名称替代观察，建议请伙伴补充一个不同角度，再比较能否并用，再看一周后的回应是否更清楚；模式不是必须反复发生的故事，你仍可以通过练习与协商改变安排。
    advice:
      - 请伙伴补充一个不同角度，再比较能否并用
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Stellium: a question about coordination'
    summary: You can explore a concentration of attention that still leaves other needs relevant.
    body: 'You can use the Stellium — at least three planets gathered in one sign or house — as a
      prompt for coordinating needs, without treating it as a ranking or a forecast. The engine detects
      this structure in your chart. Symbolically, it points toward a concentration of attention that
      still leaves other needs relevant; the participating planets and your actual setting still matter.
      Imagine that you repeatedly reach for one explanation until somebody offers a perspective from
      a different area. Before deciding what the pattern means for you, separate a habitual response
      from a demand created by the present situation. Try this: invite an alternative perspective
      and see whether both can contribute. A geometric arrangement does not require you to repeat
      a particular story, and an ordinary conversation can be more useful than trying to live up to
      the name of a pattern.'
    advice:
      - Invite an alternative perspective and see whether both can contribute
    do:
      - Note a pattern
    dont:
      - Rush a label
