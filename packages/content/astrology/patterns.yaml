    title: 'Grand cross: a question about coordination'
    summary: You can explore several priorities arriving together and needing an order.
    body: 'You can use the Grand cross — four planets linked through oppositions and squares — as
      a prompt for coordinating needs, without treating it as a ranking or a forecast. The engine
      detects this structure in your chart. Symbolically, it points toward several priorities arriving
