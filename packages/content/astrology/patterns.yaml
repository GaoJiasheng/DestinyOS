  zh:
    title: Yod：让结构成为提问
    summary: 你可以从Yod观察不同需要如何配合。
    body: 你可以把Yod（两颗六分相行星同时与第三颗形成梅花相的结构）看成协调不同需要的线索，而不是人生等级或事件预告。Yod在这张命盘中被检测到，说明几个面向以特定角度或集中位置联系起来；它象征表达条件可能不容易同步，适合小步校准而不是寻找特殊使命，具体表现仍取决于参与的行星与实际环境。比如，一个安排在两处都合适，换到第三个场景却需要重新设定节奏，这时可以先区分哪些是自己的习惯，哪些是当下情境的要求。不要让结构名称替代观察，建议每次只改一个条件，记录改变后的实际反馈，再看一周后的回应是否更清楚；模式不是必须反复发生的故事，你仍可以通过练习与协商改变安排。
    advice:
      - 每次只改一个条件，记录改变后的实际反馈
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Yod: a question about coordination'
    summary: You can explore different conditions needing repeated adjustment rather than a special
      mission.
    body: 'You can use the Yod — two sextile-linked planets both forming quincunxes to a third — as
      a prompt for coordinating needs, without treating it as a ranking or a forecast. The engine
      detects this structure in your chart. Symbolically, it points toward different conditions needing
      repeated adjustment rather than a special mission; the participating planets and your actual
      setting still matter. Imagine that an arrangement works in two settings but needs a different
      pace in a third. Before deciding what the pattern means for you, separate a habitual response
      from a demand created by the present situation. Try this: change one condition at a time and
      record the response. A geometric arrangement does not require you to repeat a particular story,
      and an ordinary conversation can be more useful than trying to live up to the name of a pattern.'
    advice:
      - Change one condition at a time and record the response
    do:
      - Note a pattern
    dont:
      - Rush a label
