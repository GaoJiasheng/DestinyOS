- id: astrology.pattern.grand_trine
  system: astrology
  section: aspects
  topic: pattern_grand_trine
  when:
    path: patterns[key=grand_trine].key
    eq: grand_trine
  weight: 82
  polarity: neutral
  tags:
    - plain
    - astrology.keyword.curiosity
  exclusive_with: &id001 []
  zh:
    title: 大三角：让结构成为提问
    summary: 你可以从大三角观察不同需要如何配合。
    body: 你可以把大三角（三颗行星以三分相相连的结构）看成协调不同需要的线索，而不是人生等级或事件预告。大三角在这张命盘中被检测到，说明几个面向以特定角度或集中位置联系起来；它象征容易形成顺手的循环，但舒服也可能减少尝试新方法的动力，具体表现仍取决于参与的行星与实际环境。比如，一项熟悉的工作总能很快完成，却迟迟没有把做法分享给伙伴，这时可以先区分哪些是自己的习惯，哪些是当下情境的要求。不要让结构名称替代观察，建议把一个顺手技巧教给别人，借反馈拓宽用法，再看一周后的回应是否更清楚；模式不是必须反复发生的故事，你仍可以通过练习与协商改变安排。
    advice:
      - 把一个顺手技巧教给别人，借反馈拓宽用法
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Grand trine: a question about coordination'
    summary: You can explore a familiar flow that can become a closed routine.
    body: 'You can use the Grand trine — three planets connected through trines — as a prompt for
      coordinating needs, without treating it as a ranking or a forecast. The engine detects this
      structure in your chart. Symbolically, it points toward a familiar flow that can become a closed
      routine; the participating planets and your actual setting still matter. Imagine that a familiar
      task feels easy enough that you have stopped noticing how you do it. Before deciding what the
      pattern means for you, separate a habitual response from a demand created by the present situation.
      Try this: teach someone a familiar technique and use their question to broaden it. A geometric
      arrangement does not require you to repeat a particular story, and an ordinary conversation
      can be more useful than trying to live up to the name of a pattern.'
    advice:
      - Teach someone a familiar technique and use their question to broaden it
    do:
      - Note a pattern
    dont:
      - Rush a label
  meta:
    author: t23-astrology-editorial-v1
    reviewed_by: null
    version: 1
    status: published
- id: astrology.pattern.t_square
  system: astrology
  section: aspects
  topic: pattern_t_square
  when:
    path: patterns[key=t_square].key
    eq: t_square
  weight: 82
  polarity: neutral
  tags:
    - plain
    - astrology.keyword.curiosity
  exclusive_with: *id001
  zh:
    title: T三角：让结构成为提问
    summary: 你可以从T三角观察不同需要如何配合。
    body: 你可以把T三角（一组对冲的两端同时与第三颗行星形成四分相）看成协调不同需要的线索，而不是人生等级或事件预告。T三角在这张命盘中被检测到，说明几个面向以特定角度或集中位置联系起来；它象征容易把两端的张力集中到第三个面向，适合分步协调需求，具体表现仍取决于参与的行星与实际环境。比如，同时答应两个方向不同的请求，最后把全部压力放在执行阶段，这时可以先区分哪些是自己的习惯，哪些是当下情境的要求。不要让结构名称替代观察，建议分别列出两端需要，再给中间环节减一项负担，再看一周后的回应是否更清楚；模式不是必须反复发生的故事，你仍可以通过练习与协商改变安排。
    advice:
      - 分别列出两端需要，再给中间环节减一项负担
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'T-square: a question about coordination'
    summary: You can explore pressure gathered around a third concern that needs its own space.
    body: 'You can use the T-square — an opposition whose endpoints both square a third planet — as
      a prompt for coordinating needs, without treating it as a ranking or a forecast. The engine
      detects this structure in your chart. Symbolically, it points toward pressure gathered around
      a third concern that needs its own space; the participating planets and your actual setting
      still matter. Imagine that two competing requests leave you trying to solve everything through
      one overworked response. Before deciding what the pattern means for you, separate a habitual
      response from a demand created by the present situation. Try this: separate the competing needs
      and reduce one demand on the mediating task. A geometric arrangement does not require you to
      repeat a particular story, and an ordinary conversation can be more useful than trying to live
      up to the name of a pattern.'
    advice:
      - Separate the competing needs and reduce one demand on the mediating task
    do:
      - Note a pattern
    dont:
      - Rush a label
  meta:
    author: t23-astrology-editorial-v1
    reviewed_by: null
    version: 1
    status: published
