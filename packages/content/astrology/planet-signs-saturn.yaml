      especially when a familiar response is needed. Saturn — the chart factor associated with responsibility
      and sustained practice — is placed in Pisces — a sign associated with imagination and receptivity.
      This approach suggests noticing connections that a rigid explanation misses. Sensitivity becomes
      easier to use when you distinguish your impression from another person's stated need or an
      agreed responsibility. An unclear responsibility can be difficult to carry; turn the shared
      intention into negotiable steps before deciding what you can reasonably promise to do. For example,
