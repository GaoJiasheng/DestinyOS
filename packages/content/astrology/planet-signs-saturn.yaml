  zh:
    title: 土星在金牛座：稳定积累与具体感受
    summary: 你在责任、限制与长期练习上倾向稳定积累与具体感受。
    body: 你在责任、限制与长期练习上倾向稳定积累与具体感受，可以把这种偏好当作观察起点。土星（象征责任、限制与长期练习的命盘要素）落在金牛座（重视稳定和感官经验的星座），把这个面向与相应的表达方式联系起来；你对承诺和标准可能较为认真，愿意反复打磨；现实限制可以帮助排序，也容易被误读为能力上限。这种表达方式让你倾向用可触及的结果确认进展；熟悉感能支持耐心，也可能让改变显得费力。维持稳定可能让责任具体，保留资源也可以与尝试必要改变并存。例如，准备长期项目时，约定一个稳定的复盘节点，而非只盯最后成果，也可约定固定时段慢慢推进，比较哪种方式更容易让参与者理解。留意是否把暂时做不到解释为自己不够好，或把惯例当成唯一办法；建议把标准拆成可练习的步骤，用实际回应调整节奏，而不是凭一个位置给自己下定论。
    advice:
      - 保留惯例并试一个小调整
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Saturn in Taurus: building through repetition'
    summary: You may approach responsibility and sustained practice by building by repetition.
    body: 'You may approach responsibility and sustained practice by building through repetition,
      especially when a familiar response is needed. Saturn — the chart factor associated with responsibility
      and sustained practice — is placed in Taurus — a sign associated with steadiness and tangible
      experience. This approach suggests testing an idea through repeated contact with something real.
      Comfort can support persistence, provided it leaves space for a useful adjustment. Maintaining
      a dependable arrangement may make responsibility concrete; reserve capacity for a useful change
      so stability does not require defending every familiar detail. For example, when a long project
      falls behind, separate a missing skill, an unrealistic timetable, and a responsibility that
      should be shared with somebody else. Watch for treating a familiar routine as the only workable
      option, as well as reading a temporary difficulty as a verdict on personal worth. Try this:
      keep the useful routine and alter one detail, then compare the response with your original intention
      before deciding which part of the approach to keep.'
    advice:
      - Break a demanding standard into skills you can practice
    do:
      - Note a pattern
    dont:
      - Rush a label
  meta:
    author: t23-astrology-editorial-v1
    reviewed_by: null
    version: 1
    status: published
