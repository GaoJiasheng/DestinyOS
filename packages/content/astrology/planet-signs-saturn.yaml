  en:
    title: 'Saturn in Capricorn: organizing sustained effort'
    summary: You may approach responsibility and sustained practice by organizing sustained effort.
    body: 'You may approach responsibility and sustained practice by organizing sustained effort,
      especially when a familiar response is needed. Saturn — the chart factor associated with responsibility
      and sustained practice — is placed in Capricorn — a sign associated with planning and responsibility.
      This approach suggests translating intentions into stages. A durable plan includes the people
      doing the work, so rest, support, and renegotiation belong beside milestones rather than outside
      them. A long result may attract sustained effort; include the conditions people need to continue
      so the plan acknowledges support alongside deadlines and obligations. For example, when a long
      project falls behind, separate a missing skill, an unrealistic timetable, and a responsibility
      that should be shared with somebody else. Watch for assuming that carrying more is the only
      meaningful contribution, as well as reading a temporary difficulty as a verdict on personal
      worth. Try this: plan for support and rest beside the milestones, then compare the response
      with your original intention before deciding which part of the approach to keep.'
