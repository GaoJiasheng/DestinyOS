  zh:
    title: 土星在双子座：交换信息与比较视角
    summary: 你在责任、限制与长期练习上倾向交换信息与比较视角。
    body: 你在责任、限制与长期练习上倾向交换信息与比较视角，可以把这种偏好当作观察起点。土星（象征责任、限制与长期练习的命盘要素）落在双子座（以交流和好奇为象征的星座），把这个面向与相应的表达方式联系起来；你对承诺和标准可能较为认真，愿意反复打磨；现实限制可以帮助排序，也容易被误读为能力上限。这种表达方式让你倾向通过提问与比较理解经验；选项越多越需要区分探索阶段与落实阶段。表达观点可能需要反复确认，练习清晰沟通比等到没有疑问更容易进步。例如，准备长期项目时，约定一个稳定的复盘节点，而非只盯最后成果，也可把两个不同观点放在同一张笔记上，比较哪种方式更容易让参与者理解。留意是否把暂时做不到解释为自己不够好，或一直搜集而不落定；建议把标准拆成可练习的步骤，用实际回应调整节奏，而不是凭一个位置给自己下定论。
    advice:
      - 讨论后写下一项明确选择
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Saturn in Gemini: connecting different viewpoints'
    summary: You may approach responsibility and sustained practice by connecting different viewpoints.
    body:
      'You may approach responsibility and sustained practice by connecting different viewpoints,
      especially when a familiar response is needed. Saturn — the chart factor associated with responsibility
      and sustained practice — is placed in Gemini — a sign associated with curiosity and exchange.
      This approach suggests that a second viewpoint can reveal what a single explanation missed.
      Gathering options helps when you also choose a moment to stop gathering and decide. You may
      want a carefully checked explanation before speaking; practice communicating a provisional account
      so caution does not postpone all useful exchange. For example, when a long project falls behind,
      separate a missing skill, an unrealistic timetable, and a responsibility that should be shared
      with somebody else. Watch for continuing to collect alternatives after a decision is needed,
      as well as reading a temporary difficulty as a verdict on personal worth. Try this: end the
      discussion with one provisional choice, then compare the response with your original intention
      before deciding which part of the approach to keep.'
    advice:
      - Break a demanding standard into skills you can practice
    do:
      - Note a pattern
    dont:
      - Rush a label
