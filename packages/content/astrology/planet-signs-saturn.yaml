    body: 你在责任、限制与长期练习上倾向深入理解与谨慎建立信任，可以把这种偏好当作观察起点。土星（象征责任、限制与长期练习的命盘要素）落在天蝎座（以深入和信任边界为象征的星座），把这个面向与相应的表达方式联系起来；你对承诺和标准可能较为认真，愿意反复打磨；现实限制可以帮助排序，也容易被误读为能力上限。这种表达方式让你容易追问表面之下的动机；深入理解需要证据，也需要尊重别人暂不分享的空间。对信任与共享边界可能较认真，逐步建立约定比一次要求全部确定更可行。例如，准备长期项目时，约定一个稳定的复盘节点，而非只盯最后成果，也可在重要合作中逐步交换信息，比较哪种方式更容易让参与者理解。留意是否把暂时做不到解释为自己不够好，或把沉默当成隐藏问题的证据；建议把标准拆成可练习的步骤，用实际回应调整节奏，而不是凭一个位置给自己下定论。
    advice:
      - 允许信任随具体行动累积
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Saturn in Scorpio: developing trust through depth'
    summary: You may approach responsibility and sustained practice by developing trust by depth.
    body: "You may approach responsibility and sustained practice by developing trust through depth,
      especially when a familiar response is needed. Saturn — the chart factor associated with responsibility
      and sustained practice — is placed in Scorpio — a sign associated with depth and careful trust.
      This approach suggests staying with a question beyond its first answer. That attention is more
      useful when curiosity remains distinguishable from a demand for access to somebody else's private
      experience. Trust and shared boundaries may deserve careful attention; a sequence of modest
      agreements can teach more than a request for complete certainty at the beginning. For example,
      when a long project falls behind, separate a missing skill, an unrealistic timetable, and a
      responsibility that should be shared with somebody else. Watch for taking somebody's silence
      as evidence of a hidden intention, as well as reading a temporary difficulty as a verdict on
      personal worth. Try this: let trust grow through observable agreements, then compare the response
      with your original intention before deciding which part of the approach to keep."
