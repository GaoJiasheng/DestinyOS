    summary: 你在责任、限制与长期练习上倾向表达热情与获得回应。
    body: 你在责任、限制与长期练习上倾向表达热情与获得回应，可以把这种偏好当作观察起点。土星（象征责任、限制与长期练习的命盘要素）落在狮子座（重视创造与真诚表达的星座），把这个面向与相应的表达方式联系起来；你对承诺和标准可能较为认真，愿意反复打磨；现实限制可以帮助排序，也容易被误读为能力上限。这种表达方式让你倾向把个人热情带进事情里；被回应会增加动力，也需要给不同风格留空间。认真对待个人表达可能带来打磨动力，作品也可以在尚未完善时接受反馈。例如，准备长期项目时，约定一个稳定的复盘节点，而非只盯最后成果，也可用一个个人故事说明想法，比较哪种方式更容易让参与者理解。留意是否把暂时做不到解释为自己不够好，或把没被赞同等同于没被尊重；建议把标准拆成可练习的步骤，用实际回应调整节奏，而不是凭一个位置给自己下定论。
    advice:
      - 表达之后邀请另一种声音
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Saturn in Leo: making expression personal'
    summary: You may approach responsibility and sustained practice by making expression personal.
    body:
      'You may approach responsibility and sustained practice by making expression personal, especially
      when a familiar response is needed. Saturn — the chart factor associated with responsibility
      and sustained practice — is placed in Leo — a sign associated with creative expression. This
      approach suggests giving an activity a personal voice. Recognition can energize that contribution,
      while listening makes room for someone whose enthusiasm looks quieter than yours. Taking expression
      seriously may encourage refinement; an unfinished piece can still receive a useful question
      before you decide how much more work it needs. For example, when a long project falls behind,
      separate a missing skill, an unrealistic timetable, and a responsibility that should be shared
      with somebody else. Watch for equating a lack of applause with a lack of respect, as well as
      reading a temporary difficulty as a verdict on personal worth. Try this: invite a quieter contribution
      after sharing yours, then compare the response with your original intention before deciding
      which part of the approach to keep.'
