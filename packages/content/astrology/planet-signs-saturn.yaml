      especially when a familiar response is needed. Saturn — the chart factor associated with responsibility
      and sustained practice — is placed in Aquarius — a sign associated with independent thinking
      and shared systems. This approach suggests asking whether an inherited rule still serves its
      purpose. An elegant alternative needs feedback from the people who will live with its practical
      consequences. You may examine a shared rule carefully; practical difficulties raised by its
      users belong in the evidence for revision alongside the principle it was meant to serve. For
      example, when a long project falls behind, separate a missing skill, an unrealistic timetable,
