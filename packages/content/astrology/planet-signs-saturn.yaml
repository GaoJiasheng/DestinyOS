  zh:
    title: 土星在天秤座：协调差异与寻找公平
    summary: 你在责任、限制与长期练习上倾向协调差异与寻找公平。
    body: 你在责任、限制与长期练习上倾向协调差异与寻找公平，可以把这种偏好当作观察起点。土星（象征责任、限制与长期练习的命盘要素）落在天秤座（重视协调与公平的星座），把这个面向与相应的表达方式联系起来；你对承诺和标准可能较为认真，愿意反复打磨；现实限制可以帮助排序，也容易被误读为能力上限。这种表达方式让你倾向先理解不同立场；能谈成的平衡需要真实偏好参与，不能只靠你不断退让。维持公平可能成为责任主题，承诺需要双方都能够提出修改。例如，准备长期项目时，约定一个稳定的复盘节点，而非只盯最后成果，也可把双方需要并列写出来，比较哪种方式更容易让参与者理解。留意是否把暂时做不到解释为自己不够好，或为了平静而藏起意见；建议把标准拆成可练习的步骤，用实际回应调整节奏，而不是凭一个位置给自己下定论。
    advice:
      - 把自己的需要也放进讨论
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Saturn in Libra: negotiating a workable balance'
    summary: You may approach responsibility and sustained practice by negotiating a workable balance.
    body: "You may approach responsibility and sustained practice by negotiating a workable balance,
      especially when a familiar response is needed. Saturn — the chart factor associated with responsibility
      and sustained practice — is placed in Libra — a sign associated with fairness and negotiation.
      This approach suggests looking at a question from both sides. A workable agreement needs your
      real preference as well as consideration for somebody else's position; agreement alone is not
      balance. Fairness may matter to a commitment; build a route for either person to request revision
      so responsibility does not depend on preserving an agreement that no longer fits. For example,
      when a long project falls behind, separate a missing skill, an unrealistic timetable, and a
      responsibility that should be shared with somebody else. Watch for hiding a preference to preserve
      a temporary peace, as well as reading a temporary difficulty as a verdict on personal worth.
      Try this: include your own need in the negotiation, then compare the response with your original
      intention before deciding which part of the approach to keep."
    advice:
      - Break a demanding standard into skills you can practice
    do:
      - Note a pattern
    dont:
      - Rush a label
