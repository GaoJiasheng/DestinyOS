    dont:
      - 仓促定论
  en:
    title: 'Saturn in Virgo: improving practical details'
    summary: You may approach responsibility and sustained practice by improving practical details.
    body: 'You may approach responsibility and sustained practice by improving practical details,
      especially when a familiar response is needed. Saturn — the chart factor associated with responsibility
      and sustained practice — is placed in Virgo — a sign associated with discernment and practical
      improvement. This approach suggests noticing where a small correction makes work easier. The
      point is to make something usable, while allowing ordinary variation that needs no correction.
      Care with details may support a useful result; agree on what counts as sufficient so the standard
      guides the work rather than becoming an endless assessment of you. For example, when a long
      project falls behind, separate a missing skill, an unrealistic timetable, and a responsibility
      that should be shared with somebody else. Watch for finding faults long after a result is useful
      enough, as well as reading a temporary difficulty as a verdict on personal worth. Try this:
      agree on a usable standard before refining further, then compare the response with your original
