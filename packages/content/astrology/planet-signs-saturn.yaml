    summary: 你在责任、限制与长期练习上倾向照顾感受与建立归属。
    body: 你在责任、限制与长期练习上倾向照顾感受与建立归属，可以把这种偏好当作观察起点。土星（象征责任、限制与长期练习的命盘要素）落在巨蟹座（重视照顾与归属的星座），把这个面向与相应的表达方式联系起来；你对承诺和标准可能较为认真，愿意反复打磨；现实限制可以帮助排序，也容易被误读为能力上限。这种表达方式让你容易注意经历背后的感受；照顾别人之前，确认自己的余量有助于维持真诚。对归属与照顾的责任感可能较强，能承担的范围也值得公开协商。例如，准备长期项目时，约定一个稳定的复盘节点，而非只盯最后成果，也可先问参与者怎样才感到被照顾，比较哪种方式更容易让参与者理解。留意是否把暂时做不到解释为自己不够好，或默默承担全部照顾；建议把标准拆成可练习的步骤，用实际回应调整节奏，而不是凭一个位置给自己下定论。
    advice:
      - 问清需要再决定如何支持
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Saturn in Cancer: creating a sense of belonging'
    summary: You may approach responsibility and sustained practice by creating a sense of belonging.
    body: "You may approach responsibility and sustained practice by creating a sense of belonging,
      especially when a familiar response is needed. Saturn — the chart factor associated with responsibility
      and sustained practice — is placed in Cancer — a sign associated with care and belonging. This
      approach suggests paying attention to what makes an experience feel emotionally safe. Attentiveness
      becomes more sustainable when it includes your own capacity, not only somebody else's comfort.
      Responsibility may be felt strongly around belonging and care; name the share you can sustain
      instead of leaving others to infer that your availability has no limit. For example, when a
      long project falls behind, separate a missing skill, an unrealistic timetable, and a responsibility
      that should be shared with somebody else. Watch for taking responsibility for feelings nobody
      has asked you to manage, as well as reading a temporary difficulty as a verdict on personal
      worth. Try this: ask what support is wanted before offering it, then compare the response with
      your original intention before deciding which part of the approach to keep."
