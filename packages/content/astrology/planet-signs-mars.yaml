      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Mars in Leo: making expression personal'
    summary: You may approach initiative and assertiveness by making expression personal.
    body: 'You may approach initiative and assertiveness by making expression personal, especially
      when a familiar response is needed. Mars — the chart factor associated with initiative and assertiveness
      — is placed in Leo — a sign associated with creative expression. This approach suggests giving
      an activity a personal voice. Recognition can energize that contribution, while listening makes
      room for someone whose enthusiasm looks quieter than yours. Personal enthusiasm may make an
      action engaging; invite a different form of contribution so another person does not have to
      match your expressive style to participate. For example, when a deadline changes, notice whether
      you act, argue, or withdraw first, and whether that response helps other people understand your
      limits. Watch for equating a lack of applause with a lack of respect, as well as turning every
      disagreement into a contest that needs a winner. Try this: invite a quieter contribution after
      sharing yours, then compare the response with your original intention before deciding which
      part of the approach to keep.'
