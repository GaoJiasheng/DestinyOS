      - 把自己的需要也放进讨论
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Mars in Libra: negotiating a workable balance'
    summary: You may approach initiative and assertiveness by negotiating a workable balance.
    body:
      "You may approach initiative and assertiveness by negotiating a workable balance, especially
      when a familiar response is needed. Mars — the chart factor associated with initiative and assertiveness
      — is placed in Libra — a sign associated with fairness and negotiation. This approach suggests
      looking at a question from both sides. A workable agreement needs your real preference as well
      as consideration for somebody else's position; agreement alone is not balance. A concern for
      fairness may motivate a difficult conversation; state the need you want addressed instead of
      waiting until every possible objection has been anticipated. For example, when a deadline changes,
      notice whether you act, argue, or withdraw first, and whether that response helps other people
      understand your limits. Watch for hiding a preference to preserve a temporary peace, as well
      as turning every disagreement into a contest that needs a winner. Try this: include your own
      need in the negotiation, then compare the response with your original intention before deciding
      which part of the approach to keep."
