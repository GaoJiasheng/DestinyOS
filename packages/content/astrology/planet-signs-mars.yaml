  zh:
    title: 火星在金牛座：稳定积累与具体感受
    summary: 你在行动、竞争与边界上倾向稳定积累与具体感受。
    body: 你在行动、竞争与边界上倾向稳定积累与具体感受，可以把这种偏好当作观察起点。火星（象征行动、竞争与边界的命盘要素）落在金牛座（重视稳定和感官经验的星座），把这个面向与相应的表达方式联系起来；你开始行动与处理分歧的方式，往往能看出动力如何形成；冲劲需要与可持续的节奏配合。这种表达方式让你倾向用可触及的结果确认进展；熟悉感能支持耐心，也可能让改变显得费力。连续推进可能比短暂冲刺更适合行动，改变路线时可以保留一个熟悉节点。例如，任务突然加急时，先列出能做的部分，再明确需要协商的截止时间，也可约定固定时段慢慢推进，比较哪种方式更容易让参与者理解。留意是否把每个分歧都当成较量，或把惯例当成唯一办法；建议先确定第一步与暂停条件，用实际回应调整节奏，而不是凭一个位置给自己下定论。
    advice:
      - 保留惯例并试一个小调整
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Mars in Taurus: building through repetition'
    summary: You may approach initiative and assertiveness by building by repetition.
    body: 'You may approach initiative and assertiveness by building through repetition, especially
      when a familiar response is needed. Mars — the chart factor associated with initiative and assertiveness
      — is placed in Taurus — a sign associated with steadiness and tangible experience. This approach
      suggests testing an idea through repeated contact with something real. Comfort can support persistence,
      provided it leaves space for a useful adjustment. A repeated effort may sustain motivation better
      than a burst of urgency; keep one useful part of the routine while testing a necessary change.
      For example, when a deadline changes, notice whether you act, argue, or withdraw first, and
      whether that response helps other people understand your limits. Watch for treating a familiar
      routine as the only workable option, as well as turning every disagreement into a contest that
      needs a winner. Try this: keep the useful routine and alter one detail, then compare the response
      with your original intention before deciding which part of the approach to keep.'
    advice:
      - Set a starting action and a clear point for pausing
    do:
      - Note a pattern
    dont:
      - Rush a label
  meta:
    author: t23-astrology-editorial-v1
    reviewed_by: null
    version: 1
    status: published
