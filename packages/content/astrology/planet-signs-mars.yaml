  en:
    title: 'Mars in Scorpio: developing trust through depth'
    summary: You may approach initiative and assertiveness by developing trust by depth.
    body:
      "You may approach initiative and assertiveness by developing trust through depth, especially
      when a familiar response is needed. Mars — the chart factor associated with initiative and assertiveness
