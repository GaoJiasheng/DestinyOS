    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Mars in Cancer: creating a sense of belonging'
    summary: You may approach initiative and assertiveness by creating a sense of belonging.
    body:
      "You may approach initiative and assertiveness by creating a sense of belonging, especially
      when a familiar response is needed. Mars — the chart factor associated with initiative and assertiveness
      — is placed in Cancer — a sign associated with care and belonging. This approach suggests paying
      attention to what makes an experience feel emotionally safe. Attentiveness becomes more sustainable
      when it includes your own capacity, not only somebody else's comfort. Protecting a valued space
      may motivate you; check the actual request before acting so that support leaves the other person
      a say in what happens. For example, when a deadline changes, notice whether you act, argue,
      or withdraw first, and whether that response helps other people understand your limits. Watch
      for taking responsibility for feelings nobody has asked you to manage, as well as turning every
      disagreement into a contest that needs a winner. Try this: ask what support is wanted before
      offering it, then compare the response with your original intention before deciding which part
      of the approach to keep."
