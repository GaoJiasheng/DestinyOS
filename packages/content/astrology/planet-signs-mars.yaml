    summary: 你在行动、竞争与边界上倾向交换信息与比较视角。
    body: 你在行动、竞争与边界上倾向交换信息与比较视角，可以把这种偏好当作观察起点。火星（象征行动、竞争与边界的命盘要素）落在双子座（以交流和好奇为象征的星座），把这个面向与相应的表达方式联系起来；你开始行动与处理分歧的方式，往往能看出动力如何形成；冲劲需要与可持续的节奏配合。这种表达方式让你倾向通过提问与比较理解经验；选项越多越需要区分探索阶段与落实阶段。多种办法可能激起行动兴趣，选一个起点有助于避免分散投入。例如，任务突然加急时，先列出能做的部分，再明确需要协商的截止时间，也可把两个不同观点放在同一张笔记上，比较哪种方式更容易让参与者理解。留意是否把每个分歧都当成较量，或一直搜集而不落定；建议先确定第一步与暂停条件，用实际回应调整节奏，而不是凭一个位置给自己下定论。
    advice:
      - 讨论后写下一项明确选择
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Mars in Gemini: connecting different viewpoints'
    summary: You may approach initiative and assertiveness by connecting different viewpoints.
    body:
      'You may approach initiative and assertiveness by connecting different viewpoints, especially
      when a familiar response is needed. Mars — the chart factor associated with initiative and assertiveness
      — is placed in Gemini — a sign associated with curiosity and exchange. This approach suggests
      that a second viewpoint can reveal what a single explanation missed. Gathering options helps
      when you also choose a moment to stop gathering and decide. Several possible approaches may
      energize you; choose a first trial and a review point so exploring alternatives does not scatter
      all of your available effort. For example, when a deadline changes, notice whether you act,
      argue, or withdraw first, and whether that response helps other people understand your limits.
      Watch for continuing to collect alternatives after a decision is needed, as well as turning
      every disagreement into a contest that needs a winner. Try this: end the discussion with one
      provisional choice, then compare the response with your original intention before deciding which
      part of the approach to keep.'
    advice:
      - Set a starting action and a clear point for pausing
