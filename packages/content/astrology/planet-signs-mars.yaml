- id: astrology.planet_sign.mars.aries
  system: astrology
  section: planets
  topic: mars_sign
  when:
    path: bodies[key=mars].sign
    eq: aries
  weight: 72
  polarity: neutral
  tags:
    - plain
    - astrology.keyword.curiosity
  exclusive_with: []
  zh:
    title: 火星在白羊座：先行动再校准
    summary: 你在行动、竞争与边界上倾向先行动再校准。
    body: 你在行动、竞争与边界上倾向先行动再校准，可以把这种偏好当作观察起点。火星（象征行动、竞争与边界的命盘要素）落在白羊座（以启动和直接回应为象征的星座），把这个面向与相应的表达方式联系起来；你开始行动与处理分歧的方式，往往能看出动力如何形成；冲劲需要与可持续的节奏配合。这种表达方式让这个面向倾向先尝试，再根据反馈修正；主动并不需要把速度放在所有事情之前。启动速度可能带来动力，清楚边界能让直接行动更容易被伙伴理解。例如，任务突然加急时，先列出能做的部分，再明确需要协商的截止时间，也可先做一版能被讨论的草案，比较哪种方式更容易让参与者理解。留意是否把每个分歧都当成较量，或把急迫感传给别人；建议先确定第一步与暂停条件，用实际回应调整节奏，而不是凭一个位置给自己下定论。
    advice:
      - 开始前确认一个共同目标
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Mars in Aries: starting directly'
    summary: You may approach initiative and assertiveness by starting directly.
    body:
      'You may approach initiative and assertiveness by starting directly, especially when a familiar
      response is needed. Mars — the chart factor associated with initiative and assertiveness — is
      placed in Aries — a sign associated with initiating and responding directly. This approach suggests
      learning through a first attempt. The useful distinction is between opening a possibility and
      insisting that everybody follow at your pace. Beginning promptly may help you find momentum;
      make the limit of your action clear so another person can distinguish initiative from a decision
      imposed on them. For example, when a deadline changes, notice whether you act, argue, or withdraw
      first, and whether that response helps other people understand your limits. Watch for passing
      urgency to people who need context, as well as turning every disagreement into a contest that
      needs a winner. Try this: agree on the purpose before moving quickly, then compare the response
      with your original intention before deciding which part of the approach to keep.'
    advice:
      - Set a starting action and a clear point for pausing
    do:
      - Note a pattern
    dont:
      - Rush a label
  meta:
    author: t23-astrology-editorial-v1
    reviewed_by: null
    version: 1
    status: published
