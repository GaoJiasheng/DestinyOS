    title: 'Partnership: exploring a larger perspective'
    summary: You may explore partnership through exploring a larger perspective.
    body:
      'You may approach partnership by exploring a larger perspective, while a useful arrangement
      still needs feedback from real people. This unit follows Venus — the chart factor for appreciation
      and relationship preferences — in Sagittarius — a sign associated with exploration and meaning
      —, offering an entry into this area rather than a prediction of its outcome. This approach suggests
      asking how one experience fits a larger picture. A wider perspective can inspire movement while
      remaining open to a detail that challenges the story you first found convincing. For example,
