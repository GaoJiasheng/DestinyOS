- id: astrology.love_career.venus.cancer
  system: astrology
  section: love_career
  topic: partnership
  when:
    path: bodies[key=venus].sign
    eq: cancer
  weight: 72
  polarity: neutral
  tags:
    - plain
    - astrology.keyword.cooperation
  exclusive_with: *id001
  zh:
    title: 伙伴关系：照顾感受与建立归属
    summary: 你可以让照顾感受与建立归属的偏好参与伙伴关系的协商。
    body: 你在伙伴关系中，可能偏好照顾感受与建立归属，合适安排需要通过真实互动确认。这里依据金星（象征欣赏与关系偏好的命盘要素）落在巨蟹座（重视照顾与归属的星座），只描述这个面向的表达入口；这种表达方式让你容易注意经历背后的感受；照顾别人之前，确认自己的余量有助于维持真诚。例如，讨论怎样一起度过休息时间时，先分别说出喜欢的活动，再看双方愿意为哪一项留时间，然后先问参与者怎样才感到被照顾，观察对方是否容易理解你的需要。注意默默承担全部照顾是否让合作变得单向；可以问清需要再决定如何支持，并约定一次回看安排的机会，让偏好参与协商而不是替代协商。亲近感不能代替询问，关系形式与是否单身都不决定表达能力，你仍可以根据经验调整说法与节奏。
    advice:
      - 问清需要再决定如何支持
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Partnership: creating a sense of belonging'
    summary: You may explore partnership through creating a sense of belonging.
    body: "You may approach partnership by creating a sense of belonging, while a useful arrangement
      still needs feedback from real people. This unit follows Venus — the chart factor for appreciation
      and relationship preferences — in Cancer — a sign associated with care and belonging —, offering
      an entry into this area rather than a prediction of its outcome. This approach suggests paying
      attention to what makes an experience feel emotionally safe. Attentiveness becomes more sustainable
      when it includes your own capacity, not only somebody else's comfort. For example, when arranging
      time with a partner or friend, distinguish an activity you both enjoy from one you accept to
      avoid naming a difference. Notice whether taking responsibility for feelings nobody has asked
      you to manage makes that conversation one-sided. Try this: ask what support is wanted before
      offering it, then agree on an opportunity to revisit the arrangement if needs change; a relationship
      status does not measure the ability to care, and closeness still needs explicit questions."
    advice:
      - Ask what support is wanted before offering it
    do:
      - Note a pattern
    dont:
      - Rush a label
  meta:
    author: t23-astrology-editorial-v1
