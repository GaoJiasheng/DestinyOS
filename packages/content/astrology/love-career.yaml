- id: astrology.love_career.venus.aries
  system: astrology
  section: love_career
  topic: partnership
  when:
    path: bodies[key=venus].sign
    eq: aries
  weight: 72
  polarity: neutral
  tags:
    - plain
    - astrology.keyword.cooperation
  exclusive_with: &id001 []
  zh:
    title: 伙伴关系：先行动再校准
    summary: 你可以让先行动再校准的偏好参与伙伴关系的协商。
    body: 你在伙伴关系中，可能偏好先行动再校准，合适安排需要通过真实互动确认。这里依据金星（象征欣赏与关系偏好的命盘要素）落在白羊座（以启动和直接回应为象征的星座），只描述这个面向的表达入口；这种表达方式让这个面向倾向先尝试，再根据反馈修正；主动并不需要把速度放在所有事情之前。例如，讨论怎样一起度过休息时间时，先分别说出喜欢的活动，再看双方愿意为哪一项留时间，然后先做一版能被讨论的草案，观察对方是否容易理解你的需要。注意把急迫感传给别人是否让合作变得单向；可以开始前确认一个共同目标，并约定一次回看安排的机会，让偏好参与协商而不是替代协商。亲近感不能代替询问，关系形式与是否单身都不决定表达能力，你仍可以根据经验调整说法与节奏。
    advice:
      - 开始前确认一个共同目标
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Partnership: starting directly'
    summary: You may explore partnership through starting directly.
    body: 'You may approach partnership by starting directly, while a useful arrangement still needs
      feedback from real people. This unit follows Venus — the chart factor for appreciation and relationship
      preferences — in Aries — a sign associated with initiating and responding directly —, offering
      an entry into this area rather than a prediction of its outcome. This approach suggests learning
      through a first attempt. The useful distinction is between opening a possibility and insisting
      that everybody follow at your pace. For example, when arranging time with a partner or friend,
      distinguish an activity you both enjoy from one you accept to avoid naming a difference. Notice
      whether passing urgency to people who need context makes that conversation one-sided. Try this:
      agree on the purpose before moving quickly, then agree on an opportunity to revisit the arrangement
      if needs change; a relationship status does not measure the ability to care, and closeness still
      needs explicit questions.'
    advice:
      - Agree on the purpose before moving quickly
    do:
      - Note a pattern
    dont:
      - Rush a label
  meta:
    author: t23-astrology-editorial-v1
    reviewed_by: null
    version: 1
    status: published
