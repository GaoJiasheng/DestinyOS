    summary: 你可以让整理细节与改善流程的偏好参与伙伴关系的协商。
    body: 你在伙伴关系中，可能偏好整理细节与改善流程，合适安排需要通过真实互动确认。这里依据金星（象征欣赏与关系偏好的命盘要素）落在处女座（以辨别和实用改进为象征的星座），只描述这个面向的表达入口；这种表达方式让你容易发现可调整的细节；分析能提供帮助，但不必把每个差异都变成待修正的问题。例如，讨论怎样一起度过休息时间时，先分别说出喜欢的活动，再看双方愿意为哪一项留时间，然后选一个最妨碍使用的细节改进，观察对方是否容易理解你的需要。注意反复挑错而忘记目的是否让合作变得单向；可以先约定怎样算够用，并约定一次回看安排的机会，让偏好参与协商而不是替代协商。亲近感不能代替询问，关系形式与是否单身都不决定表达能力，你仍可以根据经验调整说法与节奏。
