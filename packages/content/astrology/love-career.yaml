- id: astrology.love_career.venus.gemini
  system: astrology
  section: love_career
  topic: partnership
  when:
    path: bodies[key=venus].sign
    eq: gemini
  weight: 72
  polarity: neutral
  tags:
    - plain
    - astrology.keyword.cooperation
  exclusive_with: *id001
  zh:
    title: 伙伴关系：交换信息与比较视角
    summary: 你可以让交换信息与比较视角的偏好参与伙伴关系的协商。
    body: 你在伙伴关系中，可能偏好交换信息与比较视角，合适安排需要通过真实互动确认。这里依据金星（象征欣赏与关系偏好的命盘要素）落在双子座（以交流和好奇为象征的星座），只描述这个面向的表达入口；这种表达方式让你倾向通过提问与比较理解经验；选项越多越需要区分探索阶段与落实阶段。例如，讨论怎样一起度过休息时间时，先分别说出喜欢的活动，再看双方愿意为哪一项留时间，然后把两个不同观点放在同一张笔记上，观察对方是否容易理解你的需要。注意一直搜集而不落定是否让合作变得单向；可以讨论后写下一项明确选择，并约定一次回看安排的机会，让偏好参与协商而不是替代协商。亲近感不能代替询问，关系形式与是否单身都不决定表达能力，你仍可以根据经验调整说法与节奏。
    advice:
      - 讨论后写下一项明确选择
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Partnership: connecting different viewpoints'
    summary: You may explore partnership through connecting different viewpoints.
    body:
      'You may approach partnership by connecting different viewpoints, while a useful arrangement
      still needs feedback from real people. This unit follows Venus — the chart factor for appreciation
      and relationship preferences — in Gemini — a sign associated with curiosity and exchange —,
      offering an entry into this area rather than a prediction of its outcome. This approach suggests
      that a second viewpoint can reveal what a single explanation missed. Gathering options helps
      when you also choose a moment to stop gathering and decide. For example, when arranging time
      with a partner or friend, distinguish an activity you both enjoy from one you accept to avoid
      naming a difference. Notice whether continuing to collect alternatives after a decision is needed
      makes that conversation one-sided. Try this: end the discussion with one provisional choice,
      then agree on an opportunity to revisit the arrangement if needs change; a relationship status
      does not measure the ability to care, and closeness still needs explicit questions.'
    advice:
      - End the discussion with one provisional choice
    do:
      - Note a pattern
    dont:
      - Rush a label
  meta:
    author: t23-astrology-editorial-v1
    reviewed_by: null
    version: 1
    status: published
