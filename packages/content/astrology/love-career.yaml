  exclusive_with: *id001
  zh:
    title: 伙伴关系：协调差异与寻找公平
    summary: 你可以让协调差异与寻找公平的偏好参与伙伴关系的协商。
    body: 你在伙伴关系中，可能偏好协调差异与寻找公平，合适安排需要通过真实互动确认。这里依据金星（象征欣赏与关系偏好的命盘要素）落在天秤座（重视协调与公平的星座），只描述这个面向的表达入口；这种表达方式让你倾向先理解不同立场；能谈成的平衡需要真实偏好参与，不能只靠你不断退让。例如，讨论怎样一起度过休息时间时，先分别说出喜欢的活动，再看双方愿意为哪一项留时间，然后把双方需要并列写出来，观察对方是否容易理解你的需要。注意为了平静而藏起意见是否让合作变得单向；可以把自己的需要也放进讨论，并约定一次回看安排的机会，让偏好参与协商而不是替代协商。亲近感不能代替询问，关系形式与是否单身都不决定表达能力，你仍可以根据经验调整说法与节奏。
    advice:
      - 把自己的需要也放进讨论
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Partnership: negotiating a workable balance'
    summary: You may explore partnership through negotiating a workable balance.
    body:
      "You may approach partnership by negotiating a workable balance, while a useful arrangement
      still needs feedback from real people. This unit follows Venus — the chart factor for appreciation
      and relationship preferences — in Libra — a sign associated with fairness and negotiation —,
      offering an entry into this area rather than a prediction of its outcome. This approach suggests
      looking at a question from both sides. A workable agreement needs your real preference as well
      as consideration for somebody else's position; agreement alone is not balance. For example,
      when arranging time with a partner or friend, distinguish an activity you both enjoy from one
      you accept to avoid naming a difference. Notice whether hiding a preference to preserve a temporary
      peace makes that conversation one-sided. Try this: include your own need in the negotiation,
      then agree on an opportunity to revisit the arrangement if needs change; a relationship status
      does not measure the ability to care, and closeness still needs explicit questions."
    advice:
      - Include your own need in the negotiation
    do:
      - Note a pattern
    dont:
      - Rush a label
