  zh:
    title: 工作方向：先行动再校准
    summary: 你可以让先行动再校准的偏好参与工作方向的协商。
    body: 你在工作方向中，可能偏好先行动再校准，合适安排需要通过真实互动确认。这里依据太阳（象征自主选择与认同的命盘要素）落在白羊座（以启动和直接回应为象征的星座），只描述这个面向的表达入口；这种表达方式让这个面向倾向先尝试，再根据反馈修正；主动并不需要把速度放在所有事情之前。例如，选择一项想参与的工作时，先说清你希望带来的具体贡献，再核对任务是否给了相应空间，然后先做一版能被讨论的草案，观察对方是否容易理解你的需要。注意把急迫感传给别人是否让合作变得单向；可以开始前确认一个共同目标，并约定一次回看安排的机会，让偏好参与协商而不是替代协商。外界评价不能代替适配，职位名称也不等同于你的全部价值，你仍可以根据经验调整说法与节奏。
    advice:
      - 开始前确认一个共同目标
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Work direction: starting directly'
    summary: You may explore work direction through starting directly.
    body: 'You may approach work direction by starting directly, while a useful arrangement still
      needs feedback from real people. This unit follows the Sun — the chart factor for chosen direction
      and identity — in Aries — a sign associated with initiating and responding directly —, offering
      an entry into this area rather than a prediction of its outcome. This approach suggests learning
      through a first attempt. The useful distinction is between opening a possibility and insisting
      that everybody follow at your pace. For example, when choosing a work responsibility, compare
      the contribution you want to make with the actual decisions and resources the role provides.
      Notice whether passing urgency to people who need context makes that conversation one-sided.
      Try this: agree on the purpose before moving quickly, then agree on an opportunity to revisit
      the arrangement if needs change; a role title does not measure your whole value, and external
      praise is only one form of feedback.'
    advice:
      - Agree on the purpose before moving quickly
    do:
      - Note a pattern
    dont:
      - Rush a label
