  zh:
    title: 天王星在白羊座：先行动再校准
    summary: 你在更新规则与争取自主上倾向先行动再校准。
    body: 你在更新规则与争取自主上倾向先行动再校准，可以把这种偏好当作观察起点。天王星（象征更新规则与争取自主的命盘要素）落在白羊座（以启动和直接回应为象征的星座），把这个面向与相应的表达方式联系起来；这是同龄人共享较多的世代线索，你可能在相应领域看见对旧规则的质疑；个人表现还要结合其他位置。这种表达方式让这个面向倾向先尝试，再根据反馈修正；主动并不需要把速度放在所有事情之前。这一世代可能较关注自主启动的新方式，个人尝试仍需与具体条件配合。例如，团队沿用旧流程时，提出一个可以撤回的小改动，并听取使用者反馈，也可先做一版能被讨论的草案，比较哪种方式更容易让参与者理解。留意是否为了不同而忽略已有经验，或把急迫感传给别人；建议为新做法保留复原方案，用实际回应调整节奏，而不是凭一个位置给自己下定论。
    advice:
      - 开始前确认一个共同目标
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Uranus in Aries: starting directly'
    summary: You may approach experimentation and independence by starting directly.
    body: 'You may approach experimentation and independence by starting directly, especially when
      a familiar response is needed. Uranus — the chart factor associated with experimentation and
      independence — is placed in Aries — a sign associated with initiating and responding directly.
      This approach suggests learning through a first attempt. The useful distinction is between opening
      a possibility and insisting that everybody follow at your pace. A generational interest in self-directed
      beginnings may appear here; your own experiment still needs conditions suited to the people
      and resources involved. For example, when a group repeats an outdated process, consider whether
      a reversible trial would teach more than rejecting the whole arrangement at once. Watch for
      passing urgency to people who need context, as well as making originality more important than
      whether an experiment serves people. Try this: agree on the purpose before moving quickly, then
      compare the response with your original intention before deciding which part of the approach
      to keep.'
    advice:
      - Keep a way to reverse a change while you test it
    do:
      - Note a pattern
    dont:
      - Rush a label
  meta:
    author: t23-astrology-editorial-v1
    reviewed_by: null
    version: 1
    status: published
