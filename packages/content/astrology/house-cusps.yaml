  zh:
    title: 第一宫宫头金牛座：日常呈现与主动回应
    summary: 在日常呈现与主动回应中，你倾向稳定积累与具体感受。
    body: 你面对日常呈现与主动回应时，可能先用稳定积累与具体感受的方式寻找入口。第一宫（观察自我呈现与开始方式的领域）的宫头（一个宫位的起点）落在金牛座（重视稳定和感官经验的星座），描述这个领域的开场风格，仍要与落入行星和守护星一起理解；这个生活领域把注意力带到你如何进入新场景；别人看到的第一反应只是你的一部分。这种表达方式让你倾向用可触及的结果确认进展；熟悉感能支持耐心，也可能让改变显得费力。例如，进入陌生团队时，你可能先观察自己怎样开口介绍，也留意是否给别人提问的机会，也可约定固定时段慢慢推进，观察两种做法能否配合真实需要。注意把惯例当成唯一办法是否影响协商，或出现用第一印象限制后续认识的情况；建议用一次真实互动修正自我印象，再保留惯例并试一个小调整，把宫头看成提问的线索，给实际生活的复杂性留出空间。
    advice:
      - 用一次真实互动修正自我印象
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: First House cusp in Taurus
    summary: In everyday presence and initiative, you may favor building through repetition.
    body: 'You may approach everyday presence and initiative by building through repetition, using
      it as an entry point rather than a rule. The cusp — the starting boundary of a house — of your
      First House — the area associated with everyday presence — is in Taurus — a sign associated
      with steadiness and tangible experience —; this symbolism needs to be read alongside planets
      in the house and the ruler, rather than treated as a complete account of this area. This area
      concerns how you enter a situation. First impressions give useful feedback but leave much of
      your experience unseen. This approach suggests testing an idea through repeated contact with
      something real; comfort can support persistence, provided it leaves space for a useful adjustment.
      For example, on joining a new group, pay attention to the way you introduce yourself and to
      the room you leave for other people to respond. Notice whether treating a familiar routine as
      the only workable option gets in the way, and whether allowing a first impression to restrict
      later understanding limits your choices. Try this: keep the useful routine and alter one detail,
      then return to an actual interaction in this area to see whether that adjustment helped.'
    advice:
      - Keep the useful routine and alter one detail
    do:
      - Note a pattern
    dont:
      - Rush a label
