    dont:
      - 仓促定论
  en:
    title: Twelfth House cusp in Libra
    summary: In quiet reflection and unseen work, you may favor negotiating a workable balance.
    body:
      "You may approach quiet reflection and unseen work by negotiating a workable balance, using
      it as an entry point rather than a rule. The cusp — the starting boundary of a house — of your
      Twelfth House — the area of quiet reflection and unseen work — is in Libra — a sign associated
      with fairness and negotiation —; this symbolism needs to be read alongside planets in the house
      and the ruler, rather than treated as a complete account of this area. This area concerns experiences
      that do not immediately become public. Time alone can help you process a day while remaining
      compatible with companionship and practical support. This approach suggests looking at a question
      from both sides; a workable agreement needs your real preference as well as consideration for
      somebody else's position; agreement alone is not balance. For example, after a demanding event,
      give yourself time to sort what happened before deciding which part to discuss with someone
      you trust; private reflection and asking for help can support each other. Notice whether hiding
      a preference to preserve a temporary peace gets in the way, and whether keeping every need invisible
      to people who could respond limits your choices. Try this: include your own need in the negotiation,
      then return to an actual interaction in this area to see whether that adjustment helped."
