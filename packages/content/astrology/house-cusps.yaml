    body: 你面对日常呈现与主动回应时，可能先用交换信息与比较视角的方式寻找入口。第一宫（观察自我呈现与开始方式的领域）的宫头（一个宫位的起点）落在双子座（以交流和好奇为象征的星座），描述这个领域的开场风格，仍要与落入行星和守护星一起理解；这个生活领域把注意力带到你如何进入新场景；别人看到的第一反应只是你的一部分。这种表达方式让你倾向通过提问与比较理解经验；选项越多越需要区分探索阶段与落实阶段。例如，进入陌生团队时，你可能先观察自己怎样开口介绍，也留意是否给别人提问的机会，也可把两个不同观点放在同一张笔记上，观察两种做法能否配合真实需要。注意一直搜集而不落定是否影响协商，或出现用第一印象限制后续认识的情况；建议用一次真实互动修正自我印象，再讨论后写下一项明确选择，把宫头看成提问的线索，给实际生活的复杂性留出空间。
    advice:
      - 用一次真实互动修正自我印象
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: First House cusp in Gemini
    summary: In everyday presence and initiative, you may favor connecting different viewpoints.
    body:
      'You may approach everyday presence and initiative by connecting different viewpoints, using
      it as an entry point rather than a rule. The cusp — the starting boundary of a house — of your
      First House — the area associated with everyday presence — is in Gemini — a sign associated
      with curiosity and exchange —; this symbolism needs to be read alongside planets in the house
      and the ruler, rather than treated as a complete account of this area. This area concerns how
      you enter a situation. First impressions give useful feedback but leave much of your experience
      unseen. This approach suggests that a second viewpoint can reveal what a single explanation
      missed; gathering options helps when you also choose a moment to stop gathering and decide.
      For example, on joining a new group, pay attention to the way you introduce yourself and to
      the room you leave for other people to respond. Notice whether continuing to collect alternatives
      after a decision is needed gets in the way, and whether allowing a first impression to restrict
      later understanding limits your choices. Try this: end the discussion with one provisional choice,
      then return to an actual interaction in this area to see whether that adjustment helped.'
    advice:
      - End the discussion with one provisional choice
