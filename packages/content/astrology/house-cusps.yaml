    dont:
      - 仓促定论
  en:
    title: Second House cusp in Capricorn
    summary: In resources and everyday priorities, you may favor organizing sustained effort.
    body: 'You may approach resources and everyday priorities by organizing sustained effort, using
      it as an entry point rather than a rule. The cusp — the starting boundary of a house — of your
      Second House — the area of resources and personal priorities — is in Capricorn — a sign associated
      with planning and responsibility —; this symbolism needs to be read alongside planets in the
      house and the ruler, rather than treated as a complete account of this area. This area asks
      how you use time, possessions, and skills. It describes a symbolic area of attention rather
      than predicting an income or a financial result. This approach suggests translating intentions
      into stages; a durable plan includes the people doing the work, so rest, support, and renegotiation
      belong beside milestones rather than outside them. For example, when reviewing your week, compare
      where you spent time with what you say matters; an ordinary calendar can reveal a priority more
      clearly than a label. Notice whether assuming that carrying more is the only meaningful contribution
      gets in the way, and whether measuring personal worth by the amount you possess limits your
      choices. Try this: plan for support and rest beside the milestones, then return to an actual
