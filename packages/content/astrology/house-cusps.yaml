    summary: 在资源、习惯与价值选择中，你倾向规划阶段与承担责任。
    body: 你面对资源、习惯与价值选择时，可能先用规划阶段与承担责任的方式寻找入口。第二宫（观察个人资源与价值感的领域）的宫头（一个宫位的起点）落在摩羯座（重视规划和现实责任的星座），描述这个领域的开场风格，仍要与落入行星和守护星一起理解；这个生活领域关注你怎样使用时间、物品和已有能力；这不是收入水平或财务结果的预测。这种表达方式让你倾向按阶段推进；看见长期价值有助于耐心，但人的需要也值得进入计划。例如，整理一周安排时，你可以比较哪些投入真正支持生活，哪些只是为了与人比较，也可为长期目标安排阶段检查点，观察两种做法能否配合真实需要。注意把承担更多当成唯一贡献是否影响协商，或出现用拥有多少评价自己的情况；建议列出已经能使用的三项资源，再给计划同时安排休息与协作，把宫头看成提问的线索，给实际生活的复杂性留出空间。
