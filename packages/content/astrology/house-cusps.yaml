- id: astrology.cusp.h1.aries
  system: astrology
  section: houses
  topic: cusp_h1
  when:
    all:
      - path: noonChart
        eq: false
      - path: houses[index=1].sign
        eq: aries
  weight: 65
  polarity: neutral
  tags:
    - plain
    - astrology.keyword.curiosity
  exclusive_with: &id001 []
  zh:
    title: 第一宫宫头白羊座：日常呈现与主动回应
    summary: 在日常呈现与主动回应中，你倾向先行动再校准。
    body: 你面对日常呈现与主动回应时，可能先用先行动再校准的方式寻找入口。第一宫（观察自我呈现与开始方式的领域）的宫头（一个宫位的起点）落在白羊座（以启动和直接回应为象征的星座），描述这个领域的开场风格，仍要与落入行星和守护星一起理解；这个生活领域把注意力带到你如何进入新场景；别人看到的第一反应只是你的一部分。这种表达方式让这个面向倾向先尝试，再根据反馈修正；主动并不需要把速度放在所有事情之前。例如，进入陌生团队时，你可能先观察自己怎样开口介绍，也留意是否给别人提问的机会，也可先做一版能被讨论的草案，观察两种做法能否配合真实需要。注意把急迫感传给别人是否影响协商，或出现用第一印象限制后续认识的情况；建议用一次真实互动修正自我印象，再开始前确认一个共同目标，把宫头看成提问的线索，给实际生活的复杂性留出空间。
    advice:
      - 用一次真实互动修正自我印象
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: First House cusp in Aries
    summary: In everyday presence and initiative, you may favor starting directly.
    body: 'You may approach everyday presence and initiative by starting directly, using it as an
      entry point rather than a rule. The cusp — the starting boundary of a house — of your First
      House — the area associated with everyday presence — is in Aries — a sign associated with initiating
      and responding directly —; this symbolism needs to be read alongside planets in the house and
      the ruler, rather than treated as a complete account of this area. This area concerns how you
      enter a situation. First impressions give useful feedback but leave much of your experience
      unseen. This approach suggests learning through a first attempt; the useful distinction is between
      opening a possibility and insisting that everybody follow at your pace. For example, on joining
      a new group, pay attention to the way you introduce yourself and to the room you leave for other
      people to respond. Notice whether passing urgency to people who need context gets in the way,
      and whether allowing a first impression to restrict later understanding limits your choices.
      Try this: agree on the purpose before moving quickly, then return to an actual interaction in
      this area to see whether that adjustment helped.'
    advice:
      - Agree on the purpose before moving quickly
    do:
      - Note a pattern
    dont:
      - Rush a label
  meta:
    author: t23-astrology-editorial-v1
    reviewed_by: null
    version: 1
    status: published
