  weight: 1
  polarity: neutral
  tags:
    - plain
    - astrology.keyword.self_awareness
    - astrology.keyword.curiosity
    - astrology.keyword.cooperation
  exclusive_with: *id001
  zh:
    title: 把选择、感受与呈现分开观察
    summary: 你可以分别观察想要什么、感到什么与怎样回应，不必要求三者一直相同。
    body: 你可以分别观察想要什么、感到什么与怎样回应，允许三个角度有不同答案。太阳（象征自主选择）与月亮（象征情绪习惯）是两条基础线索；上升（出生时东方地平线升起的星座）描述进入场景的方式，需要已知时间与地点。缺少时间时，正午盘只是暂用当地中午计算，月亮也可能在一天内换星座，因此这里不推定上升或落宫。比如，你愿意参与一项活动，却希望先安静准备，这并不矛盾，可以先说明意愿，再协商准备时间。建议把意愿、感受和开场方式各写一行，选一处能够协调的小调整；术语是提问工具，不需要用它们为每次回应辩护。
    advice:
      - 分别写下意愿、感受与开场方式
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: Distinguish choice, feeling, and presentation
    summary: You can examine what you choose, what you feel, and how you respond separately.
    body:
      You can allow different answers to what you choose, what you feel, and how you first respond.
      The Sun — the symbolic lens on chosen direction — and the Moon — the lens on emotional habits
      — offer basic perspectives. The Ascendant — the sign rising at the eastern horizon — describes
      an opening style and requires a birth time and location. Without a time, the engine uses local
      noon as a provisional calculation; the Moon may change sign during that day, and houses or an
      Ascendant should not be inferred. Imagine wanting to join an activity while also needing a quiet
      interval to prepare. Both needs can be expressed without treating one as a contradiction of
      the other. Try writing a separate line for your intention, feeling, and first response, then
      choose one manageable adjustment. Ask what the real interaction reveals before drawing a conclusion
      from the chart. You do not need a single label to justify every response, and ordinary feedback
      can add information the chart cannot supply.
    advice:
      - Write separate notes on your intention, feeling, and opening response
    do:
      - Note a pattern
    dont:
      - Rush a label
  meta:
    author: t23-astrology-editorial-v1
    reviewed_by: null
    version: 1
    status: published
- id: astrology.fallback.planets
  system: astrology
