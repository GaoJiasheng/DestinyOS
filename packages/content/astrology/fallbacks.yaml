    - astrology.keyword.curiosity
    - astrology.keyword.cooperation
  exclusive_with: *id001
  zh:
    title: 不同面向，需要不同练习
    summary: 你可以从一个具体习惯出发，逐步观察不同人格面向怎样配合。
    body: 你可以从一个具体习惯出发，逐步观察思考、欣赏与行动怎样配合。行星（这里指命盘中用于象征不同经验的天体和计算点）各有观察主题，并不是在替你决定日常选择；星座描述表达方式，已知时间时的宫位描述更容易看见它的生活领域。慢行星的位置带有同龄人共享的世代背景，不能只凭它们概括个人。比如，面对一个新任务，你可分别问自己是否理解步骤、是否愿意参与、是否知道第一步；答案不同可以帮助发现真正卡住的环节。可以只为那个环节安排一次练习，之后再检查是否需要其他支持；不要把所有困难归给同一位置，具体环境、经验与协作者的回应都值得一起看。
    advice:
      - 只为一个卡住的环节安排练习
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: Different functions need different practice
    summary: You can examine one habit before linking different personal functions.
    body: You can start with a concrete habit and ask how thinking, appreciation, and action work
      together. Chart bodies — the celestial objects and calculated points used as symbolic lenses
      — have different themes, without deciding your everyday choices for you. A sign describes a
      style of expression; when birth time is known, a house describes a life area where it may be
      noticed. Slower-moving placements also belong to a generational setting, so they need context
      before becoming a personal description. Imagine taking on a new task. Ask separately whether
      you understand the steps, want to participate, and know how to begin. Different answers can
      reveal which part needs support. Try a limited exercise for that part before adding more explanations.
      A conversation with a collaborator, a clearer instruction, or a change of timing may matter
      more than a chart label. Review what helps and keep the reading open to correction through experience.
      Your surroundings and available practice remain part of the picture.
    advice:
      - Practice one part of a task that currently feels unclear
    do:
      - Note a pattern
    dont:
      - Rush a label
  meta:
    author: t23-astrology-editorial-v1
    reviewed_by: null
    version: 1
    status: published
- id: astrology.fallback.houses
  system: astrology
  section: houses
  topic: fallback_houses
  when:
    path: jdUT
    exists: true
  weight: 1
  polarity: neutral
  tags:
    - plain
    - astrology.keyword.self_awareness
    - astrology.keyword.curiosity
    - astrology.keyword.cooperation
  exclusive_with: *id001
  zh:
    title: 宫位需要出生时间
    summary: 有时间与地点时可观察生活领域；资料不足时先用日常场景提出问题。
    body: 你可以从真实生活领域提出问题，而不把缺少的宫位资料补成确定结论。宫位（依出生时地平线与天体位置划分的生活领域）需要已知出生时间和地点；若这张盘没有宫位，本章只说明阅读方法，不推测上升、宫头或行星落宫。若资料齐全，宫头是领域的起点，落入行星是观察面向，仍要放回日常经验理解。比如，你想改善协作，可以先记录哪次交流容易、哪次需要澄清，无需先确定是哪一宫造成。建议写下一个生活领域与一个具体问题，资料不足时保留问号，资料齐全时再与相应位置比较；没有行星落入的宫位也仍是生活的一部分，不能把空宫理解成没有机会或经验。
    advice:
      - 给一个生活领域写下具体问题
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: Houses require a birth time
    summary: Life areas need a time and location; everyday questions remain useful when those are
      missing.
    body:
      You can ask about a real life area without filling missing chart information with certainty.
      Houses — divisions of the chart into symbolic life areas — require a known birth time and location.
      If this chart has no houses, the chapter explains how to read them rather than inferring an
      Ascendant, cusp, or planetary house. With sufficient information, a cusp marks an entry into
      an area and an occupant provides another lens, while actual experience still matters. Suppose
      you want to make collaboration easier. Record an exchange that worked and one that needed clarification
      before deciding what kind of adjustment would help. Try naming one life area and one concrete
      question; keep an unanswered question open if the data are missing. If time becomes available,
      compare the relevant placement with the observation rather than expecting it to replace the
      observation. A house without an occupant remains part of life and does not imply an absence
      of opportunities. The chart is a framework for reflection, not an inventory of experiences you
      are allowed to have.
    advice:
      - Name one life area and a concrete question to explore
    do:
      - Note a pattern
    dont:
      - Rush a label
  meta:
    author: t23-astrology-editorial-v1
    reviewed_by: null
    version: 1
    status: published
- id: astrology.fallback.aspects
  system: astrology
  section: aspects
  topic: fallback_aspects
  when:
    path: jdUT
    exists: true
  weight: 1
  polarity: neutral
  tags:
    - plain
    - astrology.keyword.self_awareness
    - astrology.keyword.curiosity
    - astrology.keyword.cooperation
  exclusive_with: *id001
  zh:
    title: 先分清需要，再寻找配合
    summary: 你可以把相位当作理解不同需要如何对话的线索。
    body: 你可以先分清不同需要，再寻找它们能够配合的安排。相位（两颗命盘天体之间的角度关系）是占星中的象征语言，描述面向之间的联系，不预告具体事件；主要关系包括合、六分、四分、三分与对冲，名称本身不把人划成好坏。即使没有适合本章的主要相位，你也能通过真实互动观察协调方式。比如，你想立即开始一项任务，却也希望先了解细节，可把开始前必须确认的问题与过程中可继续探索的问题分开。可以给两个需要分别命名，再约定一个先后顺序和回看节点；顺手的配合需要使用，紧张的配合也有协商空间，不必让一个角度代替你和伙伴共同做决定。
    advice:
      - 给两个需要命名并约定顺序
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: Clarify needs before coordinating them
    summary: You can use aspects to explore how different needs interact.
    body:
      You can clarify different needs before deciding how to coordinate them. An aspect — an angular
      relationship between two chart bodies — is symbolic language about how functions connect, rather
      than a forecast of an event. Major relationships include conjunction, sextile, square, trine,
      and opposition, but those names do not divide people into good and bad categories. Even when
      no applicable major aspect is available for this chapter, an ordinary interaction can show how
      you negotiate priorities. Imagine wanting to begin a task immediately while also needing a better
      explanation. Separate the questions that must be answered before starting from those you can
      investigate along the way. Try naming both needs, agreeing on an order, and setting a point
      to review the arrangement. A comfortable connection still needs to be used, while a tense one
      leaves room for learning and negotiation. Another person's response can reveal something about
      the arrangement without making them the cause of all your inner conflict.
    advice:
      - Name both needs and agree on an order for addressing them
    do:
      - Note a pattern
    dont:
      - Rush a label
  meta:
    author: t23-astrology-editorial-v1
    reviewed_by: null
    version: 1
    status: published
- id: astrology.fallback.love_career
  system: astrology
  section: love_career
  topic: fallback_love_career
  when:
    path: jdUT
    exists: true
  weight: 1
  polarity: neutral
  tags:
    - plain
    - astrology.keyword.self_awareness
    - astrology.keyword.curiosity
    - astrology.keyword.cooperation
  exclusive_with: *id001
  zh:
    title: 关系与工作，都从具体需要谈起
    summary: 你可以用清楚的需要与贡献参与协商，让选择适合真实生活。
    body: 你可以让关系与工作中的选择，从清楚的需要和贡献开始。金星（象征欣赏与关系偏好）、火星（象征行动与边界）、太阳（象征自主选择）和土星（象征责任与练习）提供不同提问角度；有时间时还可看相关宫位，没有时间则不推定那些领域的位置。这里不预测伴侣身份、关系结果或职业成果，也不要求你进入任何关系形式。比如，与朋友或伙伴合作一件事，可以分别说出想怎样参与、愿意承担什么，以及何时需要停下来商量。建议写下一项需要与一项可提供的贡献，再听听对方如何理解；如果理解有差异，先改清楚表达，比用星座替对方解释动机更容易推动下一次协作。
    advice:
      - 写下一项需要与一项可提供的贡献
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: Discuss concrete needs in relationships and work
    summary: You can negotiate through clear needs and contributions that fit your life.
    body: You can begin choices in relationships and work with a clear need and a contribution you
      are willing to make. Venus — a lens on appreciation — Mars — a lens on action and boundaries
      — the Sun — a lens on chosen direction — and Saturn — a lens on responsibility — ask different
      questions. Relevant houses add context when time is known, while missing house information should
      remain open. The reading does not predict a partner's identity, a relationship outcome, or a
      career result, and it does not require a particular relationship form. Imagine collaborating
      with a friend. Say how you want to participate, what you can carry, and when you need a pause
      to renegotiate. Try writing one need beside one contribution, then ask how the other person
      understood each. If the understandings differ, revise the wording before interpreting motives.
      The practical value lies in making the next exchange clearer, with room for both people to choose
      what they can sustain.
    advice:
      - Write one need beside one contribution and compare understandings
    do:
      - Note a pattern
    dont:
      - Rush a label
  meta:
    author: t23-astrology-editorial-v1
    reviewed_by: null
    version: 1
    status: published
- id: astrology.fallback.patterns
  system: astrology
