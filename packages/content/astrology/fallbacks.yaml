- id: astrology.fallback.overview
  system: astrology
  section: overview
  topic: fallback_overview
  when:
    path: jdUT
    exists: true
  weight: 1
  polarity: neutral
  tags:
    - plain
    - astrology.keyword.self_awareness
    - astrology.keyword.curiosity
    - astrology.keyword.cooperation
  exclusive_with: &id001 []
  zh:
    title: 从命盘提问，而不是给自己定型
    summary: 你可以把命盘当作观察习惯的入口，具体生活仍是理解自己的主要背景。
    body: 你可以先找一个愿意观察的日常习惯，再把命盘当成提供不同角度的地图。命盘（出生时天体位置的结构记录）在这里用于文化性的自我反思，不评价人的高低，也不替代现实判断。太阳关注选择，月亮关注感受，上升需要出生时间；不同线索可以互相补充。比如，回看一次普通讨论，比较你原先想表达的意思与别人听到的内容。可以选一个有帮助的问题记下来，一周后再用实际经历修正；没有共鸣的描述也允许放下。
    advice:
      - 选一个问题，用一周经历检验
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: A map for asking questions
    summary: You can use the chart to ask about habits while keeping your life context central.
    body:
      You can begin with one everyday habit you would like to understand. A natal chart — a structured
      record of positions at birth — offers symbolic perspectives for cultural reflection, while your
      circumstances remain central. The Sun concerns chosen direction, the Moon concerns emotional
      habits, and a known birth time makes the Ascendant available as another perspective. These lenses
      can complement one another without settling who you are. Think of an ordinary discussion and
      compare what you intended to express with what another person heard. Try keeping one useful
      question for the coming week, then revise it in light of experience. A description that does
      not resonate can be set aside rather than defended as a label. Your own observations remain
      welcome throughout the reading.
    advice:
      - Keep one question and review it against a week's experience
    do:
      - Note a pattern
    dont:
      - Rush a label
  meta:
    author: t23-astrology-editorial-v1
    reviewed_by: null
    version: 1
    status: published
- id: astrology.fallback.big_three
  system: astrology
  section: big_three
  topic: fallback_big_three
  when:
    path: jdUT
