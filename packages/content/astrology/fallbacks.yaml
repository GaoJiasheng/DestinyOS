  tags:
    - plain
    - astrology.keyword.self_awareness
    - astrology.keyword.curiosity
    - astrology.keyword.cooperation
  exclusive_with: *id001
  zh:
    title: 统计与结构，提供观察角度
    summary: 你可以用统计提出问题，让实际经验补充命盘分类。
    body: 你可以用统计与结构提出问题，让实际经验补充命盘分类。元素（火土风水的星座分组）与模式（基本、固定、变动的表达分组）描述十颗行星的分布；星群表示集中位置，月相描述日月角距，两者并不评定人的高低。半球与象限需要宫位资料，缺少时间时不推定；一个分类也不能把未列出的能力从你身上删去。比如，你习惯先行动，却在另一件事上愿意长时间观察，两种经验都可以被记录，不需要强行统一。建议选一次真实互动，分别记下启动、坚持与调整发生在哪里；若统计没有共鸣，保留差异也是有用结果，它提醒你命盘只是观察工具，环境与练习能让表达更加多样。
    advice:
      - 记录启动、坚持与调整各发生在哪里
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: Statistics and structures offer perspectives
    summary: You can use the chart's classifications to open questions about experience.
    body:
      You can use statistics and structures to ask questions, while actual experience adds information
      beyond chart classifications. Elements — the fire, earth, air, and water groupings — and modes
      — cardinal, fixed, and mutable styles — describe the signs of ten planets. A stellium is a concentration
      of placements, and the Moon phase describes the Sun–Moon angle; neither is a ranking of people.
      Hemisphere and quadrant information depends on houses and should remain open when time is missing.
      A low count in one group does not remove a capacity from you. Imagine acting quickly in one
      setting but observing patiently in another. Record both experiences rather than forcing them
      into a single label. Try noting where initiating, persisting, and adapting each happened in
      an ordinary interaction. If the statistics do not resonate, that difference is also useful information.
      It keeps reflection responsive to circumstances and practice rather than asking you to perform
      a category.
    advice:
      - Note where initiating, persisting, and adapting each occurred
    do:
      - Note a pattern
    dont:
      - Rush a label
  meta:
    author: t23-astrology-editorial-v1
    reviewed_by: null
    version: 1
    status: published
- id: astrology.fallback.transits_now
  system: astrology
  section: transits_now
  topic: fallback_transits_now
  when:
    path: jdUT
    exists: true
  weight: 1
  polarity: neutral
  tags:
    - plain
    - astrology.keyword.self_awareness
    - astrology.keyword.curiosity
    - astrology.keyword.cooperation
  exclusive_with: *id001
  zh:
    title: 当前行运需要另一份时间数据
    summary: 本命盘没有当前天体位置，你可以先记录近期真实变化与需要。
    body: 你可以先记录近期真实变化与需要，等当前天体位置齐全后再比较行运。行运（某一时刻的天体位置与本命盘之间的关系）需要另一个明确日期的计算结果；这张本命盘只保存出生时的位置，不能据此说某颗行星此刻正在影响你。本章提供观察方法，不把出生相位当成今日或本月的变化，也不推测外行星正在经过哪里。比如，一周里工作节奏调整了，你可以记录变化从何时开始、哪些是外界安排、哪些是自己的回应。建议把事实、感受和可调整的动作分开写，每次只尝试一个小变化；即使以后有了行运数据，它也只能成为反思线索，实际决定仍要结合你的日程、资源与参与者反馈。
    advice:
      - 分别记录近期事实、感受与可调整动作
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: Current transits need a separate time calculation
    summary: The natal chart has no current positions; you can first record recent changes and needs.
    body:
      You can begin by recording recent changes and needs before comparing a separately calculated
      current sky. A transit — a relationship between positions at a chosen time and the natal chart
      — needs another explicitly dated calculation. This natal chart stores positions at birth, so
      it cannot establish where a planet is now or whether it currently forms an aspect to a personal
      point. This chapter offers an observation method rather than presenting birth aspects as today's
      or this month's changes. If your working rhythm shifted during the week, record when it began,
      what changed externally, and how you responded. Try separating facts, feelings, and one action
      you can adjust, then test only that action before adding another. A future transit calculation
      can provide a symbolic comparison, but your schedule, resources, and feedback remain essential
      to a real decision. Nothing here supplies a timetable of events, and a date in the report context
      alone does not create current planetary data.
    advice:
      - Separate recent facts, feelings, and one adjustable action
    do:
      - Note a pattern
    dont:
      - Rush a label
  meta:
    author: t23-astrology-editorial-v1
    reviewed_by: null
    version: 1
    status: published
- id: astrology.fallback.summary_actions
  system: astrology
  section: summary_actions
  topic: fallback_summary_actions
  when:
    path: jdUT
    exists: true
  weight: 1
  polarity: neutral
  tags:
    - plain
    - astrology.keyword.self_awareness
    - astrology.keyword.curiosity
    - astrology.keyword.cooperation
  exclusive_with: *id001
  zh:
    title: 选一个小行动，把观察带回生活
    summary: 你可以选一个低压力行动试一周，再决定哪些解读值得保留。
    body: 你可以选一个低压力行动，把这次观察带回真实生活，再决定哪些解读值得保留。知识单元（带触发条件的双语解读段落）依据命盘位置被选中，反映文化性的解释框架，不是对行为的指令；同一个位置在不同环境里可以有不同表达。总结里的建议是试行选项，适合先挑一项，而不是把整份报告变成待完成清单。比如，你准备改善一次交流，可以先多问一个具体问题，一周后再比较对方是否更容易理解你的需要。建议为这项行动写下开始时间、可承受的投入与回看节点；没有帮助的做法可以调整或放下，重要决定仍应根据现实信息与必要的专业支持处理，阅读的价值在于让你更清楚地提问与选择。
    advice:
      - 给一个小行动安排一周后的回看节点
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: Bring one small observation into practice
    summary: You can test one modest action for a week before deciding what to retain.
    body: You can choose one modest action and bring the observation back into ordinary life before
      deciding which parts of the reading to retain. A knowledge unit — a bilingual passage selected
      through chart conditions — belongs to a cultural interpretation framework rather than an instruction
      for your behaviour. The same placement can appear differently across settings. The suggestions
      gathered here are options to test, so there is no need to turn the whole report into a list
      of obligations. Suppose you want to make an exchange clearer. Ask one additional concrete question,
      then review after a week whether the other person understood your need more easily. Try setting
      a start time, an affordable level of effort, and a point for reviewing the result. You can adapt
      or set aside an unhelpful practice. Decisions with significant consequences still depend on
      real information and appropriate professional support, while the reading can help you formulate
      a question and notice a response.
