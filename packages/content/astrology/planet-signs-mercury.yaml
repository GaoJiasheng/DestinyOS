    title: 水星在金牛座：稳定积累与具体感受
    summary: 你在思考、学习与沟通上倾向稳定积累与具体感受。
    body: 你在思考、学习与沟通上倾向稳定积累与具体感受，可以把这种偏好当作观察起点。水星（象征思考、学习与沟通的命盘要素）落在金牛座（重视稳定和感官经验的星座），把这个面向与相应的表达方式联系起来；你理解信息的习惯，会影响提问顺序与表达方式；同一想法在不同听众面前可能需要不同入口。这种表达方式让你倾向用可触及的结果确认进展；熟悉感能支持耐心，也可能让改变显得费力。具体例子与重复接触可能帮助学习，观点稳定也可以留下更新条件。例如，讨论新方案时，先举一个对方熟悉的例子，再邀请对方复述理解，也可约定固定时段慢慢推进，比较哪种方式更容易让参与者理解。留意是否把说得快当成已经说清楚，或把惯例当成唯一办法；建议先问对方需要细节还是整体框架，用实际回应调整节奏，而不是凭一个位置给自己下定论。
    advice:
      - 保留惯例并试一个小调整
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Mercury in Taurus: building through repetition'
    summary: You may approach learning and communication by building by repetition.
    body: 'You may approach learning and communication by building through repetition, especially
      when a familiar response is needed. Mercury — the chart factor associated with learning and
      communication — is placed in Taurus — a sign associated with steadiness and tangible experience.
      This approach suggests testing an idea through repeated contact with something real. Comfort
      can support persistence, provided it leaves space for a useful adjustment. A concrete example
      revisited over time may be useful for learning; identify what new evidence would make you reconsider
      an explanation you currently trust. For example, when a colleague explains an unfamiliar process,
      notice which question helps you reconstruct it without simply memorizing the instructions. Watch
      for treating a familiar routine as the only workable option, as well as mistaking a fast explanation
      for a shared understanding. Try this: keep the useful routine and alter one detail, then compare
      the response with your original intention before deciding which part of the approach to keep.'
    advice:
      - Ask which level of detail your listener needs
    do:
      - Note a pattern
    dont:
      - Rush a label
