  exclusive_with: []
  zh:
    title: 水星在白羊座：先行动再校准
    summary: 你在思考、学习与沟通上倾向先行动再校准。
    body: 你在思考、学习与沟通上倾向先行动再校准，可以把这种偏好当作观察起点。水星（象征思考、学习与沟通的命盘要素）落在白羊座（以启动和直接回应为象征的星座），把这个面向与相应的表达方式联系起来；你理解信息的习惯，会影响提问顺序与表达方式；同一想法在不同听众面前可能需要不同入口。这种表达方式让这个面向倾向先尝试，再根据反馈修正；主动并不需要把速度放在所有事情之前。思路容易先落到可执行的第一步，提问时也可以给对方交代必要背景。例如，讨论新方案时，先举一个对方熟悉的例子，再邀请对方复述理解，也可先做一版能被讨论的草案，比较哪种方式更容易让参与者理解。留意是否把说得快当成已经说清楚，或把急迫感传给别人；建议先问对方需要细节还是整体框架，用实际回应调整节奏，而不是凭一个位置给自己下定论。
    advice:
      - 开始前确认一个共同目标
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Mercury in Aries: starting directly'
    summary: You may approach learning and communication by starting directly.
    body:
      'You may approach learning and communication by starting directly, especially when a familiar
      response is needed. Mercury — the chart factor associated with learning and communication —
      is placed in Aries — a sign associated with initiating and responding directly. This approach
      suggests learning through a first attempt. The useful distinction is between opening a possibility
      and insisting that everybody follow at your pace. You may frame a question around what can happen
      next; add enough context for someone who needs to understand the problem before offering an
      answer. For example, when a colleague explains an unfamiliar process, notice which question
      helps you reconstruct it without simply memorizing the instructions. Watch for passing urgency
      to people who need context, as well as mistaking a fast explanation for a shared understanding.
      Try this: agree on the purpose before moving quickly, then compare the response with your original
      intention before deciding which part of the approach to keep.'
    advice:
      - Ask which level of detail your listener needs
    do:
      - Note a pattern
    dont:
      - Rush a label
