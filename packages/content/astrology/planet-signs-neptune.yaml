    title: 'Neptune in Cancer: creating a sense of belonging'
    summary: You may approach imagination and shared ideals by creating a sense of belonging.
    body:
      "You may approach imagination and shared ideals by creating a sense of belonging, especially
      when a familiar response is needed. Neptune — the chart factor associated with imagination and
      shared ideals — is placed in Cancer — a sign associated with care and belonging. This approach
      suggests paying attention to what makes an experience feel emotionally safe. Attentiveness becomes
      more sustainable when it includes your own capacity, not only somebody else's comfort. The
      shared atmosphere may carry an ideal of belonging; ask what support a particular person wants
      instead of expecting them to fit your image of a welcoming home. For example, when a collaboration
      feels immediately inspiring, ask what each person expects to deliver before relying on the sense
      that everyone understands one another. Watch for taking responsibility for feelings nobody has
      asked you to manage, as well as allowing an attractive story to replace ordinary clarification.
      Try this: ask what support is wanted before offering it, then compare the response with your
      original intention before deciding which part of the approach to keep."
