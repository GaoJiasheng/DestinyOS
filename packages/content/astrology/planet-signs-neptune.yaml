  zh:
    title: 海王星在金牛座：稳定积累与具体感受
    summary: 你在想象、共情与理想上倾向稳定积累与具体感受。
    body: 你在想象、共情与理想上倾向稳定积累与具体感受，可以把这种偏好当作观察起点。海王星（象征想象、共情与理想的命盘要素）落在金牛座（重视稳定和感官经验的星座），把这个面向与相应的表达方式联系起来；这一位置带有明显世代背景，你可能借艺术或共同理想理解经验；灵感与事实需要各自留有位置。这种表达方式让你倾向用可触及的结果确认进展；熟悉感能支持耐心，也可能让改变显得费力。这一世代的理想可能围绕稳定与感官体验，舒适的想象也值得经过现实确认。例如，合作气氛很好时，把共同愿景写成具体分工，看看理解是否一致，也可约定固定时段慢慢推进，比较哪种方式更容易让参与者理解。留意是否让美好想象替代必要确认，或把惯例当成唯一办法；建议把感受与已确认的信息分栏记录，用实际回应调整节奏，而不是凭一个位置给自己下定论。
    advice:
      - 保留惯例并试一个小调整
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Neptune in Taurus: building through repetition'
    summary: You may approach imagination and shared ideals by building by repetition.
    body: 'You may approach imagination and shared ideals by building through repetition, especially
      when a familiar response is needed. Neptune — the chart factor associated with imagination and
      shared ideals — is placed in Taurus — a sign associated with steadiness and tangible experience.
      This approach suggests testing an idea through repeated contact with something real. Comfort
      can support persistence, provided it leaves space for a useful adjustment. The shared ideal
      may concern tangible comfort; distinguish what a setting makes you imagine from the ordinary
      arrangements that would make it sustainable. For example, when a collaboration feels immediately
      inspiring, ask what each person expects to deliver before relying on the sense that everyone
      understands one another. Watch for treating a familiar routine as the only workable option,
      as well as allowing an attractive story to replace ordinary clarification. Try this: keep the
      useful routine and alter one detail, then compare the response with your original intention
      before deciding which part of the approach to keep.'
    advice:
      - Separate impressions from facts you have actually checked
    do:
      - Note a pattern
    dont:
      - Rush a label
