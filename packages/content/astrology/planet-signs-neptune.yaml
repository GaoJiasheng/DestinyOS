    title: 海王星在双子座：交换信息与比较视角
    summary: 你在想象、共情与理想上倾向交换信息与比较视角。
    body: 你在想象、共情与理想上倾向交换信息与比较视角，可以把这种偏好当作观察起点。海王星（象征想象、共情与理想的命盘要素）落在双子座（以交流和好奇为象征的星座），把这个面向与相应的表达方式联系起来；这一位置带有明显世代背景，你可能借艺术或共同理想理解经验；灵感与事实需要各自留有位置。这种表达方式让你倾向通过提问与比较理解经验；选项越多越需要区分探索阶段与落实阶段。这一世代可能借交流与故事表达理想，动人的说法仍需要明确事实来支撑。例如，合作气氛很好时，把共同愿景写成具体分工，看看理解是否一致，也可把两个不同观点放在同一张笔记上，比较哪种方式更容易让参与者理解。留意是否让美好想象替代必要确认，或一直搜集而不落定；建议把感受与已确认的信息分栏记录，用实际回应调整节奏，而不是凭一个位置给自己下定论。
    advice:
      - 讨论后写下一项明确选择
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Neptune in Gemini: connecting different viewpoints'
    summary: You may approach imagination and shared ideals by connecting different viewpoints.
    body:
      'You may approach imagination and shared ideals by connecting different viewpoints, especially
      when a familiar response is needed. Neptune — the chart factor associated with imagination and
      shared ideals — is placed in Gemini — a sign associated with curiosity and exchange. This approach
      suggests that a second viewpoint can reveal what a single explanation missed. Gathering options
      helps when you also choose a moment to stop gathering and decide. A generational ideal may travel
      through stories and communication; an engaging account can invite a question without becoming
      evidence for all of its claims. For example, when a collaboration feels immediately inspiring,
      ask what each person expects to deliver before relying on the sense that everyone understands
      one another. Watch for continuing to collect alternatives after a decision is needed, as well
      as allowing an attractive story to replace ordinary clarification. Try this: end the discussion
      with one provisional choice, then compare the response with your original intention before deciding
      which part of the approach to keep.'
    advice:
      - Separate impressions from facts you have actually checked
    do:
      - Note a pattern
    dont:
      - Rush a label
