      shared ideals — is placed in Scorpio — a sign associated with depth and careful trust. This
      approach suggests staying with a question beyond its first answer. That attention is more useful
      when curiosity remains distinguishable from a demand for access to somebody else's private
      experience. The shared atmosphere may value depth of experience; an intense impression can matter
