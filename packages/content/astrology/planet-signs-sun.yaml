- id: astrology.planet_sign.sun.sagittarius.a
  system: astrology
  section: big_three
  topic: sun_sign
  when:
    path: bodies[key=sun].sign
    eq: sagittarius
  weight: 85
  polarity: neutral
  tags:
    - plain
    - astrology.keyword.self_awareness
  exclusive_with:
    - astrology.planet_sign.sun.sagittarius.b
  zh:
    title: 太阳在射手座：拓宽视野与寻找意义
    summary: 你在自主选择与认同上倾向拓宽视野与寻找意义。
    body: 你在自主选择与认同上倾向拓宽视野与寻找意义，可以把这种偏好当作观察起点。太阳（象征自主选择与认同的命盘要素）落在射手座（以探索和意义为象征的星座），把这个面向与相应的表达方式联系起来；你在意自己的决定是否表达了真正认同的价值，也容易从承担一件完整的事中获得存在感。这种表达方式让你倾向从更大背景理解选择；方向感能鼓励尝试，也需要具体事实来修正过快的判断。探索更大的背景可能让目标有意义，个人愿景也值得经过不同经验的检验。例如，负责项目时，先说明你想实现的价值，再把一个关键决定交给团队讨论，也可找一个与你经验不同的人交流，比较哪种方式更容易让参与者理解。留意是否把被看见当成唯一的反馈，或把个人经历推广给所有人；建议给长期目标写下一个可以调整的理由，用实际回应调整节奏，而不是凭一个位置给自己下定论。
    advice:
      - 用具体事实检验整体判断
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Sun in Sagittarius: exploring a larger perspective'
    summary: You may approach identity and chosen direction by exploring a larger perspective.
    body:
      'You may approach identity and chosen direction by exploring a larger perspective, especially
      when a familiar response is needed. The Sun — the chart factor associated with identity and
      chosen direction — is placed in Sagittarius — a sign associated with exploration and meaning.
      This approach suggests asking how one experience fits a larger picture. A wider perspective
      can inspire movement while remaining open to a detail that challenges the story you first found
      convincing. A larger question can give an ordinary goal meaning; let contact with somebody whose
      experience differs from yours change the direction when needed. For example, when you volunteer
      to lead a project, compare the goal you announce with the decisions you make when nobody is
      watching. Watch for presenting your own experience as a rule for everybody, as well as making
      visibility the only measure of worthwhile work. Try this: check the broad claim against one
      concrete case, then compare the response with your original intention before deciding which
      part of the approach to keep.'
    advice:
      - Name a purpose you could revise in light of experience
    do:
      - Note a pattern
    dont:
      - Rush a label
