    body: 你可以通过一次普通互动，看见自主选择与认同怎样带上深入理解与谨慎建立信任的特点。太阳（用来观察自主选择与认同的命盘要素）位于天蝎座（以深入和信任边界为象征的星座），这里谈的是表达倾向，不是完整性格；这种表达方式让你容易追问表面之下的动机；深入理解需要证据，也需要尊重别人暂不分享的空间。你在意自己的决定是否表达了真正认同的价值，也容易从承担一件完整的事中获得存在感。深入了解一件事可能帮助你确立方向，专注也可以与保留私人边界并存。比如，你可以在重要合作中逐步交换信息，再观察对方如何回应，而非只看自己是否满意。若出现把沉默当成隐藏问题的证据的情况，就先停下来核对需要；不妨允许信任随具体行动累积，也试着给长期目标写下一个可以调整的理由，让偏好成为可调整的做法。
    advice:
      - 允许信任随具体行动累积
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Sun in Scorpio: developing trust through depth'
    summary: You may approach identity and chosen direction by developing trust by depth.
    body: "You can explore identity and chosen direction by noticing how you respond when a small
      plan changes. In this chart, the Sun — a symbolic lens on identity and chosen direction — falls
      in Scorpio — a sign associated with depth and careful trust. This approach suggests staying
      with a question beyond its first answer. That attention is more useful when curiosity remains
      distinguishable from a demand for access to somebody else's private experience. A sustained
      investigation may help you find a direction that feels yours; depth remains compatible with
      allowing someone else an unanswered question. Imagine that you build trust through a series
      of modest agreements; the next response can tell you whether your approach created room for
      another person or simply expressed an impulse. The complication is making visibility the only
      measure of worthwhile work, which can be easy to miss while an interaction feels familiar. Consider
      this experiment: name a purpose you could revise in light of experience; afterward, compare
      what you enjoyed with what you would change."
    advice:
      - Name a purpose you could revise in light of experience
    do:
      - Note a pattern
    dont:
