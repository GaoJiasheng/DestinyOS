- id: astrology.planet_sign.sun.capricorn.a
  system: astrology
  section: big_three
  topic: sun_sign
  when:
    path: bodies[key=sun].sign
    eq: capricorn
  weight: 85
  polarity: neutral
  tags:
    - plain
    - astrology.keyword.self_awareness
  exclusive_with:
    - astrology.planet_sign.sun.capricorn.b
  zh:
    title: 太阳在摩羯座：规划阶段与承担责任
    summary: 你在自主选择与认同上倾向规划阶段与承担责任。
    body: 你在自主选择与认同上倾向规划阶段与承担责任，可以把这种偏好当作观察起点。太阳（象征自主选择与认同的命盘要素）落在摩羯座（重视规划和现实责任的星座），把这个面向与相应的表达方式联系起来；你在意自己的决定是否表达了真正认同的价值，也容易从承担一件完整的事中获得存在感。这种表达方式让你倾向按阶段推进；看见长期价值有助于耐心，但人的需要也值得进入计划。完成长期承诺可能支持认同，但你也可以选择不把全部价值交给工作角色。例如，负责项目时，先说明你想实现的价值，再把一个关键决定交给团队讨论，也可为长期目标安排阶段检查点，比较哪种方式更容易让参与者理解。留意是否把被看见当成唯一的反馈，或把承担更多当成唯一贡献；建议给长期目标写下一个可以调整的理由，用实际回应调整节奏，而不是凭一个位置给自己下定论。
    advice:
      - 给计划同时安排休息与协作
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Sun in Capricorn: organizing sustained effort'
    summary: You may approach identity and chosen direction by organizing sustained effort.
    body: 'You may approach identity and chosen direction by organizing sustained effort, especially
      when a familiar response is needed. The Sun — the chart factor associated with identity and
      chosen direction — is placed in Capricorn — a sign associated with planning and responsibility.
      This approach suggests translating intentions into stages. A durable plan includes the people
      doing the work, so rest, support, and renegotiation belong beside milestones rather than outside
      them. Keeping a demanding commitment may feel meaningful; describe the contribution in terms
      that also leave space for interests outside your public role. For example, when you volunteer
      to lead a project, compare the goal you announce with the decisions you make when nobody is
      watching. Watch for assuming that carrying more is the only meaningful contribution, as well
      as making visibility the only measure of worthwhile work. Try this: plan for support and rest
      beside the milestones, then compare the response with your original intention before deciding
      which part of the approach to keep.'
    advice:
      - Name a purpose you could revise in light of experience
    do:
      - Note a pattern
    dont:
      - Rush a label
