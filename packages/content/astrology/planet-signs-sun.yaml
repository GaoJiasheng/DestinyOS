  en:
    title: 'Sun in Libra: negotiating a workable balance'
    summary: You may approach identity and chosen direction by negotiating a workable balance.
    body:
      "You may approach identity and chosen direction by negotiating a workable balance, especially
      when a familiar response is needed. The Sun — the chart factor associated with identity and
      chosen direction — is placed in Libra — a sign associated with fairness and negotiation. This
      approach suggests looking at a question from both sides. A workable agreement needs your real
      preference as well as consideration for somebody else's position; agreement alone is not balance.
      You may identify with creating a workable agreement; your own preference belongs in the discussion
      alongside the effort to understand the other side. For example, when you volunteer to lead a
      project, compare the goal you announce with the decisions you make when nobody is watching.
      Watch for hiding a preference to preserve a temporary peace, as well as making visibility the
      only measure of worthwhile work. Try this: include your own need in the negotiation, then compare
      the response with your original intention before deciding which part of the approach to keep."
