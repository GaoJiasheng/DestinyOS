- id: astrology.planet_sign.sun.gemini.a
  system: astrology
  section: big_three
  topic: sun_sign
  when:
    path: bodies[key=sun].sign
    eq: gemini
  weight: 85
  polarity: neutral
  tags:
    - plain
    - astrology.keyword.self_awareness
  exclusive_with:
    - astrology.planet_sign.sun.gemini.b
  zh:
    title: 太阳在双子座：交换信息与比较视角
    summary: 你在自主选择与认同上倾向交换信息与比较视角。
    body: 你在自主选择与认同上倾向交换信息与比较视角，可以把这种偏好当作观察起点。太阳（象征自主选择与认同的命盘要素）落在双子座（以交流和好奇为象征的星座），把这个面向与相应的表达方式联系起来；你在意自己的决定是否表达了真正认同的价值，也容易从承担一件完整的事中获得存在感。这种表达方式让你倾向通过提问与比较理解经验；选项越多越需要区分探索阶段与落实阶段。交换观点可能帮助你确认真正想做的事，多个兴趣也可以有不同投入阶段。例如，负责项目时，先说明你想实现的价值，再把一个关键决定交给团队讨论，也可把两个不同观点放在同一张笔记上，比较哪种方式更容易让参与者理解。留意是否把被看见当成唯一的反馈，或一直搜集而不落定；建议给长期目标写下一个可以调整的理由，用实际回应调整节奏，而不是凭一个位置给自己下定论。
    advice:
      - 讨论后写下一项明确选择
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Sun in Gemini: connecting different viewpoints'
    summary: You may approach identity and chosen direction by connecting different viewpoints.
    body:
      'You may approach identity and chosen direction by connecting different viewpoints, especially
      when a familiar response is needed. The Sun — the chart factor associated with identity and
      chosen direction — is placed in Gemini — a sign associated with curiosity and exchange. This
      approach suggests that a second viewpoint can reveal what a single explanation missed. Gathering
      options helps when you also choose a moment to stop gathering and decide. Conversation may help
      you discover what you want to stand for; different interests can have different levels of commitment
      rather than compete for one identity. For example, when you volunteer to lead a project, compare
      the goal you announce with the decisions you make when nobody is watching. Watch for continuing
      to collect alternatives after a decision is needed, as well as making visibility the only measure
      of worthwhile work. Try this: end the discussion with one provisional choice, then compare the
      response with your original intention before deciding which part of the approach to keep.'
    advice:
      - Name a purpose you could revise in light of experience
    do:
      - Note a pattern
    dont:
      - Rush a label
  meta:
    author: t23-astrology-editorial-v1
    reviewed_by: null
    version: 1
    status: published
