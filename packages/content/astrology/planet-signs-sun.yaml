  en:
    title: 'Sun in Aquarius: questioning shared assumptions'
    summary: You may approach identity and chosen direction by questioning shared assumptions.
    body:
      'You may approach identity and chosen direction by questioning shared assumptions, especially
      when a familiar response is needed. The Sun — the chart factor associated with identity and
      chosen direction — is placed in Aquarius — a sign associated with independent thinking and shared
      systems. This approach suggests asking whether an inherited rule still serves its purpose. An
      elegant alternative needs feedback from the people who will live with its practical consequences.
      You may recognize your values in an alternative to an inherited rule; ask an affected person
      what your proposal would change in ordinary practice. For example, when you volunteer to lead
      a project, compare the goal you announce with the decisions you make when nobody is watching.
      Watch for discussing a principle without hearing how it feels in practice, as well as making
      visibility the only measure of worthwhile work. Try this: invite feedback from someone affected
      by the proposal, then compare the response with your original intention before deciding which
      part of the approach to keep.'
