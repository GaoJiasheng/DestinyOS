# Original bilingual editorial content for T-23; no quoted sources.
- id: astrology.planet_sign.sun.aries.a
  system: astrology
  section: big_three
  topic: sun_sign
  when:
    path: bodies[key=sun].sign
    eq: aries
  weight: 85
  polarity: neutral
  tags:
    - plain
    - astrology.keyword.self_awareness
  exclusive_with:
    - astrology.planet_sign.sun.aries.b
  zh:
    title: 太阳在白羊座：先行动再校准
    summary: 你在自主选择与认同上倾向先行动再校准。
    body: 你在自主选择与认同上倾向先行动再校准，可以把这种偏好当作观察起点。太阳（象征自主选择与认同的命盘要素）落在白羊座（以启动和直接回应为象征的星座），把这个面向与相应的表达方式联系起来；你在意自己的决定是否表达了真正认同的价值，也容易从承担一件完整的事中获得存在感。这种表达方式让这个面向倾向先尝试，再根据反馈修正；主动并不需要把速度放在所有事情之前。自主发起一件事可能让你更有参与感，适合把冲劲接到自己认可的目标。例如，负责项目时，先说明你想实现的价值，再把一个关键决定交给团队讨论，也可先做一版能被讨论的草案，比较哪种方式更容易让参与者理解。留意是否把被看见当成唯一的反馈，或把急迫感传给别人；建议给长期目标写下一个可以调整的理由，用实际回应调整节奏，而不是凭一个位置给自己下定论。
    advice:
      - 开始前确认一个共同目标
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Sun in Aries: starting directly'
    summary: You may approach identity and chosen direction by starting directly.
    body: 'You may approach identity and chosen direction by starting directly, especially when a
      familiar response is needed. The Sun — the chart factor associated with identity and chosen
      direction — is placed in Aries — a sign associated with initiating and responding directly.
      This approach suggests learning through a first attempt. The useful distinction is between opening
      a possibility and insisting that everybody follow at your pace. You might feel more engaged
      when you originate a project than when you inherit a polished plan, so explain the purpose of
      your initiative. For example, when you volunteer to lead a project, compare the goal you announce
      with the decisions you make when nobody is watching. Watch for passing urgency to people who
      need context, as well as making visibility the only measure of worthwhile work. Try this: agree
      on the purpose before moving quickly, then compare the response with your original intention
      before deciding which part of the approach to keep.'
    advice:
      - Name a purpose you could revise in light of experience
    do:
      - Note a pattern
    dont:
      - Rush a label
  meta:
    author: t23-astrology-editorial-v1
    reviewed_by: null
    version: 1
    status: published
- id: astrology.planet_sign.sun.aries.b
  system: astrology
  section: big_three
  topic: sun_sign
  when:
    path: bodies[key=sun].sign
    eq: aries
  weight: 85
  polarity: neutral
  tags:
    - plain
    - astrology.keyword.self_awareness
  exclusive_with:
    - astrology.planet_sign.sun.aries.a
  zh:
    title: 太阳在白羊座：先行动再校准
    summary: 你在自主选择与认同上倾向先行动再校准。
    body: 你可以通过一次普通互动，看见自主选择与认同怎样带上先行动再校准的特点。太阳（用来观察自主选择与认同的命盘要素）位于白羊座（以启动和直接回应为象征的星座），这里谈的是表达倾向，不是完整性格；这种表达方式让这个面向倾向先尝试，再根据反馈修正；主动并不需要把速度放在所有事情之前。你在意自己的决定是否表达了真正认同的价值，也容易从承担一件完整的事中获得存在感。自主发起一件事可能让你更有参与感，适合把冲劲接到自己认可的目标。比如，你可以先做一版能被讨论的草案，再观察对方如何回应，而非只看自己是否满意。若出现把急迫感传给别人的情况，就先停下来核对需要；不妨开始前确认一个共同目标，也试着给长期目标写下一个可以调整的理由，让偏好成为可调整的做法。
    advice:
      - 开始前确认一个共同目标
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Sun in Aries: starting directly'
    summary: You may approach identity and chosen direction by starting directly.
    body: 'You can explore identity and chosen direction by noticing how you respond when a small
      plan changes. In this chart, the Sun — a symbolic lens on identity and chosen direction — falls
      in Aries — a sign associated with initiating and responding directly. This approach suggests
      learning through a first attempt. The useful distinction is between opening a possibility and
      insisting that everybody follow at your pace. You might feel more engaged when you originate
      a project than when you inherit a polished plan, so explain the purpose of your initiative.
      Imagine that you make a rough proposal that somebody can respond to; the next response can tell
      you whether your approach created room for another person or simply expressed an impulse. The
      complication is making visibility the only measure of worthwhile work, which can be easy to
      miss while an interaction feels familiar. Consider this experiment: name a purpose you could
      revise in light of experience; afterward, compare what you enjoyed with what you would change.'
    advice:
      - Name a purpose you could revise in light of experience
    do:
      - Note a pattern
    dont:
      - Rush a label
  meta:
    author: t23-astrology-editorial-v1
    reviewed_by: null
    version: 1
    status: published
- id: astrology.planet_sign.sun.taurus.a
  system: astrology
  section: big_three
  topic: sun_sign
  when:
    path: bodies[key=sun].sign
    eq: taurus
  weight: 85
  polarity: neutral
  tags:
    - plain
    - astrology.keyword.self_awareness
  exclusive_with:
    - astrology.planet_sign.sun.taurus.b
  zh:
    title: 太阳在金牛座：稳定积累与具体感受
    summary: 你在自主选择与认同上倾向稳定积累与具体感受。
    body: 你在自主选择与认同上倾向稳定积累与具体感受，可以把这种偏好当作观察起点。太阳（象征自主选择与认同的命盘要素）落在金牛座（重视稳定和感官经验的星座），把这个面向与相应的表达方式联系起来；你在意自己的决定是否表达了真正认同的价值，也容易从承担一件完整的事中获得存在感。这种表达方式让你倾向用可触及的结果确认进展；熟悉感能支持耐心，也可能让改变显得费力。可持续的成果可能比短暂关注更能支持认同，值得区分耐心与留在原地。例如，负责项目时，先说明你想实现的价值，再把一个关键决定交给团队讨论，也可约定固定时段慢慢推进，比较哪种方式更容易让参与者理解。留意是否把被看见当成唯一的反馈，或把惯例当成唯一办法；建议给长期目标写下一个可以调整的理由，用实际回应调整节奏，而不是凭一个位置给自己下定论。
    advice:
      - 保留惯例并试一个小调整
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Sun in Taurus: building through repetition'
    summary: You may approach identity and chosen direction by building by repetition.
    body: 'You may approach identity and chosen direction by building through repetition, especially
      when a familiar response is needed. The Sun — the chart factor associated with identity and
      chosen direction — is placed in Taurus — a sign associated with steadiness and tangible experience.
      This approach suggests testing an idea through repeated contact with something real. Comfort
      can support persistence, provided it leaves space for a useful adjustment. A result you can
      return to may matter more than an impressive introduction; ask which routine supports your purpose
      and which merely feels familiar. For example, when you volunteer to lead a project, compare
      the goal you announce with the decisions you make when nobody is watching. Watch for treating
      a familiar routine as the only workable option, as well as making visibility the only measure
      of worthwhile work. Try this: keep the useful routine and alter one detail, then compare the
      response with your original intention before deciding which part of the approach to keep.'
    advice:
      - Name a purpose you could revise in light of experience
    do:
      - Note a pattern
    dont:
      - Rush a label
  meta:
    author: t23-astrology-editorial-v1
    reviewed_by: null
    version: 1
    status: published
