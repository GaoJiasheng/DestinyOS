    title: 'Sun in Leo: making expression personal'
    summary: You may approach identity and chosen direction by making expression personal.
    body: "You may approach identity and chosen direction by making expression personal, especially
      when a familiar response is needed. The Sun — the chart factor associated with identity and
      chosen direction — is placed in Leo — a sign associated with creative expression. This approach
      suggests giving an activity a personal voice. Recognition can energize that contribution, while
      listening makes room for someone whose enthusiasm looks quieter than yours. Making something
