    summary: 你在自主选择与认同上倾向协调差异与寻找公平。
    body: 你在自主选择与认同上倾向协调差异与寻找公平，可以把这种偏好当作观察起点。太阳（象征自主选择与认同的命盘要素）落在天秤座（重视协调与公平的星座），把这个面向与相应的表达方式联系起来；你在意自己的决定是否表达了真正认同的价值，也容易从承担一件完整的事中获得存在感。这种表达方式让你倾向先理解不同立场；能谈成的平衡需要真实偏好参与，不能只靠你不断退让。愿意协调差异可能是你认可的贡献，但公平的安排也需要你的真实意愿。例如，负责项目时，先说明你想实现的价值，再把一个关键决定交给团队讨论，也可把双方需要并列写出来，比较哪种方式更容易让参与者理解。留意是否把被看见当成唯一的反馈，或为了平静而藏起意见；建议给长期目标写下一个可以调整的理由，用实际回应调整节奏，而不是凭一个位置给自己下定论。
