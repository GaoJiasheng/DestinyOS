  zh:
    title: 太阳在巨蟹座：照顾感受与建立归属
    summary: 你在自主选择与认同上倾向照顾感受与建立归属。
    body: 你在自主选择与认同上倾向照顾感受与建立归属，可以把这种偏好当作观察起点。太阳（象征自主选择与认同的命盘要素）落在巨蟹座（重视照顾与归属的星座），把这个面向与相应的表达方式联系起来；你在意自己的决定是否表达了真正认同的价值，也容易从承担一件完整的事中获得存在感。这种表达方式让你容易注意经历背后的感受；照顾别人之前，确认自己的余量有助于维持真诚。照顾自己认可的人与空间可能带来认同，但承担照顾也需要出于自己的选择。例如，负责项目时，先说明你想实现的价值，再把一个关键决定交给团队讨论，也可先问参与者怎样才感到被照顾，比较哪种方式更容易让参与者理解。留意是否把被看见当成唯一的反馈，或默默承担全部照顾；建议给长期目标写下一个可以调整的理由，用实际回应调整节奏，而不是凭一个位置给自己下定论。
    advice:
      - 问清需要再决定如何支持
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Sun in Cancer: creating a sense of belonging'
    summary: You may approach identity and chosen direction by creating a sense of belonging.
    body:
      "You may approach identity and chosen direction by creating a sense of belonging, especially
      when a familiar response is needed. The Sun — the chart factor associated with identity and
      chosen direction — is placed in Cancer — a sign associated with care and belonging. This approach
      suggests paying attention to what makes an experience feel emotionally safe. Attentiveness becomes
      more sustainable when it includes your own capacity, not only somebody else's comfort. You
      may find purpose in making a place welcoming, while a meaningful contribution should include
      a choice about how much care you can offer. For example, when you volunteer to lead a project,
      compare the goal you announce with the decisions you make when nobody is watching. Watch for
      taking responsibility for feelings nobody has asked you to manage, as well as making visibility
      the only measure of worthwhile work. Try this: ask what support is wanted before offering it,
      then compare the response with your original intention before deciding which part of the approach
      to keep."
    advice:
      - Name a purpose you could revise in light of experience
    do:
      - Note a pattern
    dont:
      - Rush a label
  meta:
    author: t23-astrology-editorial-v1
    reviewed_by: null
    version: 1
    status: published
