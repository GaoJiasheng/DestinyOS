- id: astrology.planet_house.jupiter.h1
  system: astrology
  section: planets
  topic: jupiter_house
  when:
    all:
      - path: noonChart
        eq: false
      - path: bodies[key=jupiter].house
        eq: 1
  weight: 68
  polarity: neutral
  tags:
    - plain
    - astrology.keyword.curiosity
  exclusive_with: &id001 []
  zh:
    title: 木星在第一宫：日常呈现与主动回应
    summary: 你可以从日常呈现与主动回应观察探索、信念与扩展。
    body: 你对探索、信念与扩展的体验，容易在日常呈现与主动回应的场景里变得具体。木星（象征探索、信念与扩展的命盘要素）落入第一宫（观察自我呈现与开始方式的领域），把这个面向与该生活领域连接起来；这个生活领域把注意力带到你如何进入新场景；别人看到的第一反应只是你的一部分。你可能从学习与接触新环境中获得希望；愿景让人愿意尝试，也需要与手头资源相互校对。例如，进入陌生团队时，你可能先观察自己怎样开口介绍，也留意是否给别人提问的机会，留意自己的习惯是否帮助你理解当下需要。也要注意把可能性当成已经拥有的资源与用第一印象限制后续认识的情况；可以先用一次真实互动修正自我印象，再尝试用一个小实验检验大想法，把一次观察当作练习材料，给环境变化与其他命盘要素留出解释空间。
    advice:
      - 用一次真实互动修正自我印象
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: Jupiter in the First House
    summary: You may explore exploration and confidence through everyday presence and initiative.
    body: 'You may notice exploration and confidence most clearly in situations involving everyday
      presence and initiative. Jupiter — the chart factor associated with exploration and confidence
      — falls in the First House — the area associated with everyday presence. This area concerns
      how you enter a situation. First impressions give useful feedback but leave much of your experience
      unseen. You may gain confidence through learning, travel, or meeting people whose assumptions
      differ from yours; that wider view becomes useful when it changes a manageable decision. For
      example, on joining a new group, pay attention to the way you introduce yourself and to the
      room you leave for other people to respond. Watch for confusing an appealing possibility with
      capacity you already have, especially alongside allowing a first impression to restrict later
      understanding. Try this: use a real interaction to revise a first impression, and review what
      changed before adding another task.'
    advice:
      - Test an expansive idea through a small, affordable experiment
    do:
      - Note a pattern
    dont:
      - Rush a label
  meta:
    author: t23-astrology-editorial-v1
    reviewed_by: null
    version: 1
    status: published
