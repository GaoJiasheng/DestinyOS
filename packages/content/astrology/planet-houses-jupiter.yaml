  en:
    title: Jupiter in the Eighth House
    summary: You may explore exploration and confidence through shared responsibilities and trust.
    body:
      'You may notice exploration and confidence most clearly in situations involving shared responsibilities
      and trust. Jupiter — the chart factor associated with exploration and confidence — falls in
