    summary: 你可以从伙伴关系与平等协商观察探索、信念与扩展。
    body: 你对探索、信念与扩展的体验，容易在伙伴关系与平等协商的场景里变得具体。木星（象征探索、信念与扩展的命盘要素）落入第七宫（观察一对一伙伴关系的领域），把这个面向与该生活领域连接起来；这个生活领域关注你如何与别人协商承诺；伴侣、朋友或合作伙伴都可成为观察场景，不催促任何关系形式。你可能从学习与接触新环境中获得希望；愿景让人愿意尝试，也需要与手头资源相互校对。例如，一起做决定时，你可以分别说出需要，再找一个双方愿意试行的安排，留意自己的习惯是否帮助你理解当下需要。也要注意把可能性当成已经拥有的资源与把配合当成放弃自己的情况；可以先约定双方都能提出修改的规则，再尝试用一个小实验检验大想法，把一次观察当作练习材料，给环境变化与其他命盘要素留出解释空间。
    advice:
      - 约定双方都能提出修改的规则
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: Jupiter in the Seventh House
    summary: You may explore exploration and confidence through partnership and mutual agreements.
    body:
      'You may notice exploration and confidence most clearly in situations involving partnership
      and mutual agreements. Jupiter — the chart factor associated with exploration and confidence
      — falls in the Seventh House — the area of one-to-one partnership. This area concerns negotiation
      and mutual commitments. You can explore it through a partner, friend, or collaborator without
      needing a particular relationship status. You may gain confidence through learning, travel,
      or meeting people whose assumptions differ from yours; that wider view becomes useful when it
      changes a manageable decision. For example, when making a shared decision, give each person
      time to state a need before looking for an agreement; a workable trial can be more revealing
      than an ideal description of partnership. Watch for confusing an appealing possibility with
      capacity you already have, especially alongside treating cooperation as a requirement to erase
      your preference. Try this: make an agreement that either person can request to revise, and review
      what changed before adding another task.'
    advice:
