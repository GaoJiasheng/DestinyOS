  zh:
    title: 木星在第二宫：资源、习惯与价值选择
    summary: 你可以从资源、习惯与价值选择观察探索、信念与扩展。
    body: 你对探索、信念与扩展的体验，容易在资源、习惯与价值选择的场景里变得具体。木星（象征探索、信念与扩展的命盘要素）落入第二宫（观察个人资源与价值感的领域），把这个面向与该生活领域连接起来；这个生活领域关注你怎样使用时间、物品和已有能力；这不是收入水平或财务结果的预测。你可能从学习与接触新环境中获得希望；愿景让人愿意尝试，也需要与手头资源相互校对。例如，整理一周安排时，你可以比较哪些投入真正支持生活，哪些只是为了与人比较，留意自己的习惯是否帮助你理解当下需要。也要注意把可能性当成已经拥有的资源与用拥有多少评价自己的情况；可以先列出已经能使用的三项资源，再尝试用一个小实验检验大想法，把一次观察当作练习材料，给环境变化与其他命盘要素留出解释空间。
    advice:
      - 列出已经能使用的三项资源
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: Jupiter in the Second House
    summary: You may explore exploration and confidence through resources and everyday priorities.
    body: 'You may notice exploration and confidence most clearly in situations involving resources
      and everyday priorities. Jupiter — the chart factor associated with exploration and confidence
      — falls in the Second House — the area of resources and personal priorities. This area asks
      how you use time, possessions, and skills. It describes a symbolic area of attention rather
      than predicting an income or a financial result. You may gain confidence through learning, travel,
      or meeting people whose assumptions differ from yours; that wider view becomes useful when it
      changes a manageable decision. For example, when reviewing your week, compare where you spent
      time with what you say matters; an ordinary calendar can reveal a priority more clearly than
      a label. Watch for confusing an appealing possibility with capacity you already have, especially
      alongside measuring personal worth by the amount you possess. Try this: list three resources
      already available to you, and review what changed before adding another task.'
    advice:
      - Test an expansive idea through a small, affordable experiment
    do:
      - Note a pattern
    dont:
      - Rush a label
  meta:
    author: t23-astrology-editorial-v1
    reviewed_by: null
    version: 1
    status: published
