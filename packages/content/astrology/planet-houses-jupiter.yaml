    body: 'You may notice exploration and confidence most clearly in situations involving play and
      creative expression. Jupiter — the chart factor associated with exploration and confidence —
      falls in the Fifth House — the area of play and creative expression. This area concerns enjoyment
      that starts from a personal impulse. A hobby or affectionate exchange can matter without becoming
      a performance or a plan for recognition. You may gain confidence through learning, travel, or
      meeting people whose assumptions differ from yours; that wider view becomes useful when it changes
      a manageable decision. For example, when trying a hobby, make something you do not need to show
      anyone; notice whether enjoyment changes when the result no longer has to earn approval. Watch
      for confusing an appealing possibility with capacity you already have, especially alongside
      turning every enjoyable activity into a performance target. Try this: set aside time for an
      activity with no ranking, and review what changed before adding another task.'
