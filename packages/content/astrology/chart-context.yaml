    dont:
      - 仓促定论
  en:
    title: 'Lower hemisphere: a perspective on attention'
    summary: You can explore private experience and preparation as one perspective.
    body:
      'You can explore private experience and preparation without treating distribution as a rating
      of personality. The Lower hemisphere — defined here by at least six planets in Houses One through
      Six — has a concentrated count in this chart. This is a spatial tally of ten planets and needs
      a birth time and houses; it cannot prescribe a way of living. Other areas remain available for
      practice, and a smaller count does not remove an ability. For example, before joining an activity,
      make room to prepare and then choose a point to share your idea. Notice whether waiting for
      complete preparation before any participation narrows the choice. Try this: set a point to discuss
      the work during preparation, then review the response after an ordinary week. Keep what helps
      while letting the needs of the people involved add context to the symbolic distribution.'
    advice:
      - Set a point to discuss the work during preparation
    do:
      - Note a pattern
    dont:
      - Rush a label
  meta:
    author: t23-astrology-editorial-v1
    reviewed_by: null
    version: 1
    status: published
