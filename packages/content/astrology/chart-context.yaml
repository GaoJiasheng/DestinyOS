    dont:
      - 仓促定论
  en:
    title: 'Eastern hemisphere: a perspective on attention'
    summary: You can explore self-directed choices as one perspective.
    body:
      "You can explore self-directed choices without treating distribution as a rating of personality.
      The Eastern hemisphere — defined here by at least six planets in Houses Ten through Three across
      the chart boundary — has a concentrated count in this chart. This is a spatial tally of ten
      planets and needs a birth time and houses; it cannot prescribe a way of living. Other areas
      remain available for practice, and a smaller count does not remove an ability. For example,
      when beginning a project, name what you can own and invite another person's conditions before
      deciding the whole plan. Notice whether setting everybody's pace without asking narrows the
      choice. Try this: invite practical feedback before initiating a shared plan, then review the
      response after an ordinary week. Keep what helps while letting the needs of the people involved
      add context to the symbolic distribution."
    advice:
      - Invite practical feedback before initiating a shared plan
    do:
      - Note a pattern
    dont:
      - Rush a label
