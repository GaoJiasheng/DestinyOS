    summary: 你可以从主动选择与自行启动观察东半球集中分布。
    body: 你可以从主动选择与自行启动观察经验，而不把分布当成性格等级。东半球（至少六颗行星处于第十至十二及第一至三宫）在这张盘中计数较集中，提示一种生活关注的可能入口；这是十颗行星的空间统计，需要出生时间与宫位，不能用来判断你应当选择什么生活方式。不同领域仍可被练习，分布较少也不表示缺少能力。比如，开始项目时，你可以先提出愿意承担的部分，再邀请伙伴补充条件，再看看安排是否适合真实参与者。注意独自安排所有人的节奏是否让选择变窄；可以在启动前邀请一次实际反馈，一周后回看反馈，把有帮助的部分保留，让环境和实际需要补充统计线索。
