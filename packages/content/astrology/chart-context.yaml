# Original bilingual editorial content for T-23; no quoted sources.
# // DESIGN-GAP: Hemisphere concentration uses >=6 of ten planets; quadrant concentration uses >=5. JSONPath-lite has no numeric indices, so a wildcard detects concentration and the prose invites comparison of all four counts.
- id: astrology.hemisphere.upper
  system: astrology
  section: patterns
  topic: hemisphere_upper
  when:
    path: stats.hemispheres.upper
    gte: 6
  weight: 58
  polarity: neutral
  tags:
    - plain
    - astrology.keyword.curiosity
  exclusive_with: &id001 []
  zh:
    title: 上半球：观察生活关注
    summary: 你可以从公共参与与被看见的活动观察上半球集中分布。
    body: 你可以从公共参与与被看见的活动观察经验，而不把分布当成性格等级。上半球（至少六颗行星处于第七至十二宫）在这张盘中计数较集中，提示一种生活关注的可能入口；这是十颗行星的空间统计，需要出生时间与宫位，不能用来判断你应当选择什么生活方式。不同领域仍可被练习，分布较少也不表示缺少能力。比如，展示成果时，你可以确认想让谁了解哪一部分，而不是把每件事都公开，再看看安排是否适合真实参与者。注意让公开反馈成为唯一参照是否让选择变窄；可以保留一个不需公开评价的活动，一周后回看反馈，把有帮助的部分保留，让环境和实际需要补充统计线索。
    advice:
      - 保留一个不需公开评价的活动
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Upper hemisphere: a perspective on attention'
    summary: You can explore public participation as one perspective.
    body:
      'You can explore public participation without treating distribution as a rating of personality.
      The Upper hemisphere — defined here by at least six planets in Houses Seven through Twelve —
      has a concentrated count in this chart. This is a spatial tally of ten planets and needs a birth
      time and houses; it cannot prescribe a way of living. Other areas remain available for practice,
      and a smaller count does not remove an ability. For example, when sharing work, decide which
      part needs an audience and which part remains private. Notice whether making public feedback
      your only point of reference narrows the choice. Try this: keep one activity that needs no public
      evaluation, then review the response after an ordinary week. Keep what helps while letting the
      needs of the people involved add context to the symbolic distribution.'
    advice:
      - Keep one activity that needs no public evaluation
    do:
      - Note a pattern
    dont:
      - Rush a label
  meta:
    author: t23-astrology-editorial-v1
    reviewed_by: null
    version: 1
    status: published
