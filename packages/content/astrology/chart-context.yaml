    body: 你可以从私人经验与基础准备观察经验，而不把分布当成性格等级。下半球（至少六颗行星处于第一至第六宫）在这张盘中计数较集中，提示一种生活关注的可能入口；这是十颗行星的空间统计，需要出生时间与宫位，不能用来判断你应当选择什么生活方式。不同领域仍可被练习，分布较少也不表示缺少能力。比如，准备参与一个活动时，你可以先整理自己需要的条件，再决定何时分享想法，再看看安排是否适合真实参与者。注意等所有准备完才愿意参与是否让选择变窄；可以给准备安排一个与人交流的节点，一周后回看反馈，把有帮助的部分保留，让环境和实际需要补充统计线索。
