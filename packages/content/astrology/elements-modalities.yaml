- id: astrology.stat.fire.high
  system: astrology
  section: patterns
  topic: stat_fire
  when:
    path: stats.elements.fire
    gte: 4
  weight: 60
  polarity: neutral
  tags:
    - plain
    - astrology.keyword.curiosity
  exclusive_with: &id001 []
  zh:
    title: 火元素计数较多：观察行动热情与尝试
    summary: 你可以从行动热情与尝试观察火元素计数较多的线索。
    body: 你可以观察行动热情与尝试怎样参与日常选择，而不急于据此评价自己。当前十颗行星统计中，火元素（白羊、狮子、射手共享的表达分类）计数较多，本条以至少4颗为触发门槛；这一分组关注开始、表达与探索；它是对十颗行星所在星座的归类，不测量人的体力或勇敢程度。这类表达较常被提起，你可能容易用它寻找开场，但也值得给其他方式保留机会。例如，决定参加新活动时，你可以观察自己是否需要先听见一个让人振奋的理由，再把参与方式落到日程里，再记录哪种回应比较合适。若单一方式让事情卡住，可以先找到愿意尝试的理由，再核对余量，并邀请一种不同的表达加入；元素和模式只是同一张命盘的两种分类，不需要把所有生活经验都套进统计结果。
    advice:
      - 先找到愿意尝试的理由，再核对余量
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Fire: relatively represented'
    summary: The chart invites attention to initiative and enthusiasm, with this grouping relatively
      represented.
    body:
      "You can investigate initiative and enthusiasm without turning the count into a personality
      score. In the tally of ten planets, Fire — the grouping shared by Aries, Leo, and Sagittarius
      — is relatively represented; this unit uses a threshold of 4 or more. This grouping represents
      initiating, expressing, and exploring. The count classifies the signs of ten planets rather
      than measuring courage, stamina, or a person's worth. You may reach for this approach readily,
      while still benefiting from a different response when the situation asks for one. For example,
      when invited to an unfamiliar activity, notice whether an exciting purpose makes it easier to
      begin, then check how the invitation fits your actual week. Consider this: connect an appealing
      purpose with the time you actually have, then invite an alternative approach if the first response
      leaves you stuck. Elements and modes are two classifications of the same chart, so the counts
      should open questions about actual experience rather than settle them."
    advice:
      - Connect an appealing purpose with the time you actually have
    do:
      - Note a pattern
    dont:
      - Rush a label
