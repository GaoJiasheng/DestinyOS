    summary: 你可以从适应与整合新信息观察变动模式计数较多的线索。
    body: 你可以观察适应与整合新信息怎样参与日常选择，而不急于据此评价自己。当前十颗行星统计中，变动模式（双子、处女、射手、双鱼共享的适应方式）计数较多，本条以至少5颗为触发门槛；这一分组关注调整和整合；适应环境是可练习的过程，不等同于缺少立场或承诺。这类表达较常被提起，你可能容易用它寻找开场，但也值得给其他方式保留机会。例如，原计划出现新信息时，你可以先标出真正需要修改的部分，避免连仍有效的安排也一并放弃，再记录哪种回应比较合适。若单一方式让事情卡住，可以调整一处时保留仍有效的部分，并邀请一种不同的表达加入；元素和模式只是同一张命盘的两种分类，不需要把所有生活经验都套进统计结果。
    advice:
      - 调整一处时保留仍有效的部分
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Mutable: relatively represented'
    summary:
      The chart invites attention to adapting to new information, with this grouping relatively
      represented.
    body:
      'You can investigate adapting to new information without turning the count into a personality
      score. In the tally of ten planets, Mutable — the mode shared by Gemini, Virgo, Sagittarius,
      and Pisces — is relatively represented; this unit uses a threshold of 5 or more. This grouping
      symbolizes adaptation and integration. Adapting is a practice, not evidence that a person lacks
      a position or cannot keep a commitment. You may reach for this approach readily, while still
      benefiting from a different response when the situation asks for one. For example, when new
      information affects a plan, mark the part that needs revision before changing anything that
      still works; flexibility can coexist with a clear commitment. Consider this: keep what still
      works while changing one part, then invite an alternative approach if the first response leaves
      you stuck. Elements and modes are two classifications of the same chart, so the counts should
      open questions about actual experience rather than settle them.'
    advice:
      - Keep what still works while changing one part
    do:
      - Note a pattern
    dont:
      - Rush a label
