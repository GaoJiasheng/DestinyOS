    body: 你可以从检视规则与保留独立的偏好开始观察自己。太阳（象征自主选择）在水瓶座（关注规则和独立视角的星座），为理解认同提供入口；月亮（象征情绪习惯）补充感受，上升（东方地平线的星座）需已知出生时间，三者不必相同。比如，讨论安排时，请实际使用者评价新规则，留意是否符合真实需要。可以让新想法接受真实使用反馈，用实际回应修正观察，让命盘成为提问工具。
    advice:
      - 让新想法接受真实使用反馈
    do:
      - 记录观察
    dont:
      - 仓促定论
