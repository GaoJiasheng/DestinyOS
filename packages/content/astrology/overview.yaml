- id: astrology.overview.aries
  system: astrology
  section: overview
  topic: overview_sun
  when:
    path: bodies[key=sun].sign
    eq: aries
  weight: 80
  polarity: neutral
  tags:
    - plain
    - astrology.keyword.self_awareness
  exclusive_with: &id001 []
  zh:
    title: 太阳白羊座：从选择认识自己
    summary: 你倾向先行动再校准，也可以让感受与环境补充这个视角。
    body: 你可以从先行动再校准的偏好开始观察自己。太阳（象征自主选择）在白羊座（以启动和直接回应为象征的星座），为理解认同提供入口；月亮（象征情绪习惯）补充感受，上升（东方地平线的星座）需已知出生时间，三者不必相同。比如，讨论安排时，先做一版能被讨论的草案，留意是否符合真实需要。可以开始前确认一个共同目标，用实际回应修正观察，让命盘成为提问工具。
    advice:
      - 开始前确认一个共同目标
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: A starting point in Aries
    summary: You may begin reflection through starting directly.
    body:
      'You may find starting directly a useful starting point for reflection. Your Sun — the chart
      factor associated with identity and chosen direction — is in Aries — a sign associated with
      initiating and responding directly. The Moon adds a view of emotional habits, while a known
      birth time lets the Ascendant describe an opening style. These are different perspectives on
      the same person, not competing labels that you must reconcile perfectly. In an ordinary planning
      conversation, you could make a rough proposal that somebody can respond to, then notice whether
      the response supports your actual needs. Try this: agree on the purpose before moving quickly.
      Keep one observation that helps and leave room to revise it through experience; a short overview
      cannot replace the context of your life or the fuller reading of other placements.'
    advice:
      - Agree on the purpose before moving quickly
    do:
      - Note a pattern
    dont:
      - Rush a label
  meta:
    author: t23-astrology-editorial-v1
    reviewed_by: null
    version: 1
    status: published
