    body: 'You may find questioning shared assumptions a useful starting point for reflection. Your
      Sun — the chart factor associated with identity and chosen direction — is in Aquarius — a sign
      associated with independent thinking and shared systems. The Moon adds a view of emotional habits,
      while a known birth time lets the Ascendant describe an opening style. These are different perspectives
