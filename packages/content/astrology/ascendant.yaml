- id: astrology.ascendant.gemini.a
  system: astrology
  section: big_three
  topic: ascendant
  when:
    all:
      - path: noonChart
        eq: false
      - path: houses[index=1].sign
        eq: gemini
  weight: 85
  polarity: neutral
  tags:
    - plain
    - astrology.keyword.self_awareness
  exclusive_with:
    - astrology.ascendant.gemini.b
  zh:
    title: 上升双子座：交换信息与比较视角
    summary: 你的开场方式倾向交换信息与比较视角，熟悉后仍可调整。
    body: 你进入新场景时倾向交换信息与比较视角，但第一反应可以随着熟悉程度改变。上升星座（出生时东方地平线所在的星座）为双子座（以交流和好奇为象征的星座），这里依据第一宫的宫头星座来识别；它描述自我呈现的入口，不等于你的全部性格。这种表达方式让你倾向通过提问与比较理解经验；选项越多越需要区分探索阶段与落实阶段。例如，初次参加小组活动，你可以把两个不同观点放在同一张笔记上，同时留意别人怎样加入，比较开场方式是否有助于后续交流。若你发现自己一直搜集而不落定，不妨讨论后写下一项明确选择，给对方留一次补充背景的机会；外在表现与内心需要可以有差异，不必追求每次都符合标签。
    advice:
      - 讨论后写下一项明确选择
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Gemini rising: an opening style'
    summary: You may begin an unfamiliar encounter by connecting different viewpoints.
    body:
      'You may enter an unfamiliar setting by connecting different viewpoints, while your approach
      can change as trust develops. Your Ascendant — the zodiac sign on the eastern horizon at birth
      — is Gemini — a sign associated with curiosity and exchange —, identified here through the First
      House cusp. It describes an opening style rather than the entirety of your personality. This
      approach suggests that a second viewpoint can reveal what a single explanation missed. Gathering
      options helps when you also choose a moment to stop gathering and decide. Imagine joining a
      group where nobody knows your usual role. You might compare two accounts before choosing a working
      explanation, and then notice how the group responds to your introduction. Pay attention to continuing
      to collect alternatives after a decision is needed, especially if that first approach becomes
      a rule you feel obliged to repeat. Try this: end the discussion with one provisional choice.'
    advice:
      - End the discussion with one provisional choice
    do:
      - Note a pattern
    dont:
      - Rush a label
  meta:
    author: t23-astrology-editorial-v1
    reviewed_by: null
    version: 1
    status: published
