    body: 你进入新场景时倾向检视规则与保留独立，但第一反应可以随着熟悉程度改变。上升星座（出生时东方地平线所在的星座）为水瓶座（关注规则和独立视角的星座），这里依据第一宫的宫头星座来识别；它描述自我呈现的入口，不等于你的全部性格。这种表达方式让你倾向思考事情能否换一种安排；抽象理想需要听见实际参与者的具体感受。例如，初次参加小组活动，你可以请实际使用者评价新规则，同时留意别人怎样加入，比较开场方式是否有助于后续交流。若你发现自己只谈理念而跳过体验，不妨让新想法接受真实使用反馈，给对方留一次补充背景的机会；外在表现与内心需要可以有差异，不必追求每次都符合标签。
