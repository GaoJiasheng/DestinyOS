  en:
    title: 'Cancer rising: an opening style'
    summary: You may begin an unfamiliar encounter by creating a sense of belonging.
    body: "You may enter an unfamiliar setting by creating a sense of belonging, while your approach
      can change as trust develops. Your Ascendant — the zodiac sign on the eastern horizon at birth
      — is Cancer — a sign associated with care and belonging —, identified here through the First
      House cusp. It describes an opening style rather than the entirety of your personality. This
      approach suggests paying attention to what makes an experience feel emotionally safe. Attentiveness
      becomes more sustainable when it includes your own capacity, not only somebody else's comfort.
      Imagine joining a group where nobody knows your usual role. You might ask what would help somebody
      feel included, and then notice how the group responds to your introduction. Pay attention to
      taking responsibility for feelings nobody has asked you to manage, especially if that first
      approach becomes a rule you feel obliged to repeat. Try this: ask what support is wanted before
      offering it."
    advice:
      - Ask what support is wanted before offering it
    do:
      - Note a pattern
    dont:
      - Rush a label
