    summary: 你的开场方式倾向照顾感受与建立归属，熟悉后仍可调整。
    body: 你进入新场景时倾向照顾感受与建立归属，但第一反应可以随着熟悉程度改变。上升星座（出生时东方地平线所在的星座）为巨蟹座（重视照顾与归属的星座），这里依据第一宫的宫头星座来识别；它描述自我呈现的入口，不等于你的全部性格。这种表达方式让你容易注意经历背后的感受；照顾别人之前，确认自己的余量有助于维持真诚。例如，初次参加小组活动，你可以先问参与者怎样才感到被照顾，同时留意别人怎样加入，比较开场方式是否有助于后续交流。若你发现自己默默承担全部照顾，不妨问清需要再决定如何支持，给对方留一次补充背景的机会；外在表现与内心需要可以有差异，不必追求每次都符合标签。
    advice:
      - 问清需要再决定如何支持
    do:
