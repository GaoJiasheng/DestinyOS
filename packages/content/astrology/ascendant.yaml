# Original bilingual editorial content for T-23; no quoted sources.
# // DESIGN-GAP: With no ascendant sign field, use houses[index=1].sign, equal to ASC in all supported house systems.
- id: astrology.ascendant.aries.a
  system: astrology
  section: big_three
  topic: ascendant
  when:
    all:
      - path: noonChart
        eq: false
      - path: houses[index=1].sign
        eq: aries
  weight: 85
  polarity: neutral
  tags:
    - plain
    - astrology.keyword.self_awareness
  exclusive_with:
    - astrology.ascendant.aries.b
  zh:
    title: 上升白羊座：先行动再校准
    summary: 你的开场方式倾向先行动再校准，熟悉后仍可调整。
    body: 你进入新场景时倾向先行动再校准，但第一反应可以随着熟悉程度改变。上升星座（出生时东方地平线所在的星座）为白羊座（以启动和直接回应为象征的星座），这里依据第一宫的宫头星座来识别；它描述自我呈现的入口，不等于你的全部性格。这种表达方式让这个面向倾向先尝试，再根据反馈修正；主动并不需要把速度放在所有事情之前。例如，初次参加小组活动，你可以先做一版能被讨论的草案，同时留意别人怎样加入，比较开场方式是否有助于后续交流。若你发现自己把急迫感传给别人，不妨开始前确认一个共同目标，给对方留一次补充背景的机会；外在表现与内心需要可以有差异，不必追求每次都符合标签。
    advice:
      - 开始前确认一个共同目标
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Aries rising: an opening style'
    summary: You may begin an unfamiliar encounter by starting directly.
    body: 'You may enter an unfamiliar setting by starting directly, while your approach can change
      as trust develops. Your Ascendant — the zodiac sign on the eastern horizon at birth — is Aries
      — a sign associated with initiating and responding directly —, identified here through the First
      House cusp. It describes an opening style rather than the entirety of your personality. This
      approach suggests learning through a first attempt. The useful distinction is between opening
      a possibility and insisting that everybody follow at your pace. Imagine joining a group where
      nobody knows your usual role. You might make a rough proposal that somebody can respond to,
      and then notice how the group responds to your introduction. Pay attention to passing urgency
      to people who need context, especially if that first approach becomes a rule you feel obliged
      to repeat. Try this: agree on the purpose before moving quickly.'
    advice:
      - Agree on the purpose before moving quickly
    do:
      - Note a pattern
    dont:
      - Rush a label
  meta:
    author: t23-astrology-editorial-v1
    reviewed_by: null
    version: 1
    status: published
- id: astrology.ascendant.aries.b
  system: astrology
  section: big_three
  topic: ascendant
  when:
    all:
      - path: noonChart
        eq: false
      - path: houses[index=1].sign
        eq: aries
  weight: 85
  polarity: neutral
  tags:
    - plain
    - astrology.keyword.self_awareness
  exclusive_with:
    - astrology.ascendant.aries.a
  zh:
    title: 上升白羊座：先行动再校准
    summary: 你的开场方式倾向先行动再校准，熟悉后仍可调整。
    body: 你可以从别人如何回应你的开场方式，观察先行动再校准的倾向。上升星座（出生时东方地平线升起的星座）落在白羊座（以启动和直接回应为象征的星座），与第一宫的入口相对应；它关注呈现方式，不评价内在深浅，也不要求你维持固定形象。这种表达方式让这个面向倾向先尝试，再根据反馈修正；主动并不需要把速度放在所有事情之前。比如，在一个尚不熟悉的协作场景里，你可先做一版能被讨论的草案，再问伙伴第一步是否容易跟上。留意把急迫感传给别人是否限制了交流，建议开始前确认一个共同目标，把对方的具体反馈写下来；当一种开场不适合当前环境时，调整做法比用星座解释所有反应更有帮助。
    advice:
      - 开始前确认一个共同目标
    do:
      - 记录观察
    dont:
      - 仓促定论
  en:
    title: 'Aries rising: an opening style'
    summary: You may begin an unfamiliar encounter by starting directly.
    body: You can investigate your opening style through feedback from an ordinary encounter. Aries
      — a sign associated with initiating and responding directly — is your Ascendant — the sign rising
      at the eastern horizon when you were born — and is represented by the First House cusp. The
      useful question is how your initial manner affects an exchange, rather than whether every person
      sees you in the same way. This approach suggests learning through a first attempt. The useful
      distinction is between opening a possibility and insisting that everybody follow at your pace.
      At a first meeting, you could make a rough proposal that somebody can respond to, then ask someone
      what made it easier or harder to participate. Notice whether passing urgency to people who need
      context narrowed the options available to that person. Consider keeping the part of your approach
      that helped, while changing one detail for the next meeting. Agree on the purpose before moving
      quickly
    advice:
      - Agree on the purpose before moving quickly
    do:
      - Note a pattern
    dont:
      - Rush a label
  meta:
    author: t23-astrology-editorial-v1
    reviewed_by: null
    version: 1
    status: published
- id: astrology.ascendant.taurus.a
  system: astrology
  section: big_three
  topic: ascendant
