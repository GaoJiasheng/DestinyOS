# DESIGN-GAP: The specifications define introduction topics but no source entries; these bilingual introductions summarize the documented implementation.
- key: bazi
  zh:
    title: 八字
    history: 子平法四柱是这一传统的基础；本项目采用节气定月与真太阳时修正。
    principle: 四柱以出生年、月、日、时的干支为骨架，以五行与十神理解关系。
    questions: 喜用、关系模式与流年节奏，适合文化学习和自我反思。
    school: 晚子时换日；旺衰评分解释依据；未知时辰不补造时柱。
    faq:
      - question: 如何阅读结果？
        answer: 先看结论，再查看依据与建议。将象征语言作为文化学习与自我反思，不把它当作确定的预言。
  en:
    title: BaZi
    history: The Four Pillars tradition provides the framework; this implementation
      uses solar terms for months and a true solar time correction.
    principle: The Four Pillars arrange birth year, month, day and hour as stems and
      branches, then compare Five Elements and Ten Gods.
    questions: Favorable elements, relationship patterns and annual themes support
      cultural study and reflection.
    school: Late Zi-hour advances the day; strength findings are explained; an unknown
      hour stays absent.
    faq:
      - question: How should I read the result?
        answer: Start with the conclusion, then review the evidence and suggestions.
          Treat the symbolic language as cultural learning and reflection rather than
          a certain prediction.
- key: ziwei
  zh:
    title: 紫微斗数
    history: 紫微斗数的星曜与宫位传统构成本项目的解读基础。
    principle: 以农历出生信息安命身宫，布置星曜，观察十二宫之间的关系。
    questions: 十二宫主题、四化与大限；需要已知出生时间。
    school: 采用主流排盘库；四化表与所用流派会在报告中显示。
    faq:
      - question: 如何阅读结果？
        answer: 先看结论，再查看依据与建议。将象征语言作为文化学习与自我反思，不把它当作确定的预言。
  en:
    title: Zi Wei Dou Shu
    history: The Zi Wei star and palace tradition is the foundation of these readings.
    principle: Lunar birth information determines the life and body palaces; stars
      are arranged across twelve palaces.
    questions: Twelve life themes, transformations and decade periods require a known
      birth time.
    school: The established chart library supplies placements; transformation rules
      and schools are disclosed in the report.
    faq:
      - question: How should I read the result?
        answer: Start with the conclusion, then review the evidence and suggestions.
          Treat the symbolic language as cultural learning and reflection rather than
          a certain prediction.
- key: iching
  zh:
    title: 周易
    history: 卦辞、彖辞、象辞与爻辞来自《周易》的经典文本传统。
    principle: 八卦两两相重成六十四卦，六爻由下向上读取，动爻连接本卦与变卦。
    questions: 针对当下问题观察情境、行动与变化；不需要出生信息。
    school: 梅花采用时间、报数或随机起卦；六爻采用三枚铜钱六次投掷。
    faq:
      - question: 如何阅读结果？
        answer: 先看结论，再查看依据与建议。将象征语言作为文化学习与自我反思，不把它当作确定的预言。
  en:
    title: I Ching
    history: Judgments, commentaries, images and line texts belong to the classical
      I Ching tradition.
    principle: Pairs of trigrams form sixty-four hexagrams. Six lines run bottom to
      top; changing lines connect the initial and resulting figures.
    questions: Explore a present question through situation, action and change, without
      birth information.
    school: Plum Blossom uses time, numbers or a random draw; Six Lines uses six tosses
      of three coins.
    faq:
      - question: How should I read the result?
        answer: Start with the conclusion, then review the evidence and suggestions.
          Treat the symbolic language as cultural learning and reflection rather than
          a certain prediction.
- key: qimen
