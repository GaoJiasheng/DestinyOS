# DESIGN-GAP: The specifications define introduction topics but no source entries; these bilingual introductions summarize the documented implementation.
- key: bazi
  zh:
    title: 八字
    history: 子平法四柱是这一传统的基础；本项目采用节气定月与真太阳时修正。
    principle: 四柱以出生年、月、日、时的干支为骨架，以五行与十神理解关系。
    questions: 喜用、关系模式与流年节奏，适合文化学习和自我反思。
    school: 晚子时换日；旺衰评分解释依据；未知时辰不补造时柱。
    faq:
      - question: 如何阅读结果？
        answer: 先看结论，再查看依据与建议。将象征语言作为文化学习与自我反思，不把它当作确定的预言。
  en:
    title: BaZi
    history: The Four Pillars tradition provides the framework; this implementation
      uses solar terms for months and a true solar time correction.
    principle: The Four Pillars arrange birth year, month, day and hour as stems and
      branches, then compare Five Elements and Ten Gods.
    questions: Favorable elements, relationship patterns and annual themes support
      cultural study and reflection.
    school: Late Zi-hour advances the day; strength findings are explained; an unknown
      hour stays absent.
    faq:
      - question: How should I read the result?
        answer: Start with the conclusion, then review the evidence and suggestions.
          Treat the symbolic language as cultural learning and reflection rather than
          a certain prediction.
