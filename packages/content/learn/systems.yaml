- key: tarot
  zh:
    title: 塔罗
    history: 采用 1909 年 Rider–Waite–Smith 牌组与 Pamela Colman Smith 原版图像。
    principle: 78 张牌包括 22 张大阿卡纳与 56 张小阿卡纳；牌义与牌位、正逆位和问题类别共同解读。
    questions: 适合反思情境、关系与选择；抽牌由种子驱动，不依赖出生信息。
    school: RWS 与金色黎明对应；逆位可表示内收、过度或尚未展开。
    faq:
      - question: 如何阅读结果？
        answer: 先看结论，再查看依据与建议。将象征语言作为文化学习与自我反思，不把它当作确定的预言。
  en:
    title: Tarot
    history: The site uses the 1909 Rider–Waite–Smith deck and original Pamela Colman
      Smith images.
    principle: The deck contains 22 Major and 56 Minor Arcana. Meaning combines each
      card, its position, orientation and question category.
    questions: Reflect on situations, relationships and choices; a seeded draw requires
      no birth data.
    school: RWS and Golden Dawn correspondences are used; reversals can describe inward,
      excessive or delayed qualities.
    faq:
      - question: How should I read the result?
        answer: Start with the conclusion, then review the evidence and suggestions.
          Treat the symbolic language as cultural learning and reflection rather than
          a certain prediction.
- key: astrology
  zh:
    title: 西方占星
    history: 西方本命占星使用黄道与天体关系的传统象征语言。
    principle: 热带黄道上的行星、星座、宫位与相位构成本命盘；出生时间决定上升与宫位。
    questions: 探索个性主题、关系与行动风格；未知时辰不显示上升和宫位。
    school: 默认 Placidus；高纬度或不可用时回退 Whole Sign，并明确标注。
    faq:
      - question: 如何阅读结果？
        answer: 先看结论，再查看依据与建议。将象征语言作为文化学习与自我反思，不把它当作确定的预言。
  en:
    title: Western Astrology
    history: Western natal astrology uses the traditional symbolic language of the
      zodiac and relationships between celestial bodies.
    principle: Planets, signs, houses and aspects on the tropical zodiac form a natal
      chart; birth time determines the ascendant and houses.
    questions: Explore personality themes, relationships and approaches to action;
      unknown birth times omit the ascendant and houses.
    school: Placidus is the default; high-latitude failures fall back to Whole Sign
      with an explicit notice.
    faq:
      - question: How should I read the result?
        answer: Start with the conclusion, then review the evidence and suggestions.
          Treat the symbolic language as cultural learning and reflection rather than
          a certain prediction.
- key: vedic
  zh:
    title: 吠陀占星
    history: 吠陀占星采用印度 Jyotish 的恒星黄道与月宿传统。
    principle: 恒星黄道、Nakshatra、分盘与 Vimshottari Dasha 组成本命及时间主题。
    questions: 理解月宿与阶段主题；Panchang 描述每日五要素。
    school: Lahiri 岁差与 Whole Sign 宫制；未知时间会标注月宿的不确定性。
    faq:
      - question: 如何阅读结果？
        answer: 先看结论，再查看依据与建议。将象征语言作为文化学习与自我反思，不把它当作确定的预言。
  en:
    title: Vedic Astrology
    history: Vedic astrology follows the sidereal zodiac and lunar mansion tradition
      of Indian Jyotish.
    principle: The sidereal zodiac, Nakshatras, divisional charts and Vimshottari
      Dasha describe natal and timing themes.
    questions: Explore lunar mansion and period themes; Panchang describes five daily
      calendar elements.
    school: Lahiri ayanamsa and Whole Sign houses are used; unknown times disclose
      lunar mansion uncertainty.
    faq:
      - question: How should I read the result?
        answer: Start with the conclusion, then review the evidence and suggestions.
          Treat the symbolic language as cultural learning and reflection rather than
          a certain prediction.
