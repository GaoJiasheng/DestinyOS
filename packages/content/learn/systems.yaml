    title: 奇门遁甲
    history: 奇门遁甲以传统九宫时空模型为框架。
    principle: 时刻与节气决定阴阳遁、局数及九宫布局；门、星、神与干共同构成读法。
    questions: 观察决策的情境、方位与行动时机；不需要出生信息。
    school: 采用时家转盘奇门、拆补法；具体参数在报告中标注。
    faq:
      - question: 如何阅读结果？
        answer: 先看结论，再查看依据与建议。将象征语言作为文化学习与自我反思，不把它当作确定的预言。
  en:
    title: Qi Men Dun Jia
    history: Qi Men uses a traditional nine-palace model of time and direction.
    principle: Time and solar terms determine Yin or Yang arrangements and the nine-palace
      board, read through gates, stars, deities and stems.
    questions: Consider the context, direction and timing of a decision without birth
      information.
    school: This implementation uses hour-based rotating Qi Men and the splitting-and-supplementing
      method, disclosed in each report.
    faq:
      - question: How should I read the result?
        answer: Start with the conclusion, then review the evidence and suggestions.
