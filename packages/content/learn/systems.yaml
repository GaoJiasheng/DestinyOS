  en:
    title: I Ching
    history: Judgments, commentaries, images and line texts belong to the classical
      I Ching tradition.
    principle: Pairs of trigrams form sixty-four hexagrams. Six lines run bottom to
      top; changing lines connect the initial and resulting figures.
    questions: Explore a present question through situation, action and change, without
      birth information.
    school: Plum Blossom uses time, numbers or a random draw; Six Lines uses six tosses
      of three coins.
    faq:
