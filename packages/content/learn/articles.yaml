- system: qimen
  slug: nine-palaces
  zh:
    title: 奇门九宫：先看地图，再看符号
    description: 九宫（把时刻与方位组织成九格的结构）是奇门遁甲的阅读底图。
    sections:
      - heading: 奇门九宫：先看地图，再看符号
        paragraphs:
          - 九宫（把时刻与方位组织成九格的结构）是奇门遁甲的阅读底图。宫中门、星、神与干分别提供不同观察层，不能凭一个名称决定整个问题。本项目采用时家转盘奇门、拆补法、中五寄坤二；看图前先确认起局时间、时区和规则。
      - heading: 从结构到读法
        paragraphs:
          - 起局时刻决定节气背景、阴阳遁和局数；出生信息不是普通问事局的必需输入。先找问题的用神（与主题相关的指标），定位其宫位，再读相关层。图的排版不等于手机朝向，方位应读标记。下面门与星的示例是不同条件的对照，帮助你看清「位置」与「解释」的区别。
      - heading: 怎样使用下面的教学示例
        paragraphs:
          - 下面各段示例展示不同盘面条件下的读法，段中的「你」指假设的示例读者，并非对你的个人判断。这些条件可以互不相容，不应拼成一份命盘。先辨认标题的主题，再观察正文如何从符号走到生活例子与建议。你可以把喜欢的句子改写成一个待观察的问题，也可以记录不符合经验的部分。
      - heading: 教学示例 1：阳遁：先理解布盘方向
        knowledgeUnitId: qimen.layout.yang
        paragraphs:
          - 阳遁是起局结构的标记，局数与值符、值使的位置需在具体盘上确认。值符（盘中的主要星标记）与值使（主要门标记）用于找到阅读入口，不能脱离宫位单独解释。比如你要安排一次协作讨论，可以先确认任务目标与参与者，再观察相关指标所在宫。建议把已标注的时间、局数和位置抄到笔记中，核对流派参数后再阅读文字；不同设置出现的图形差异需要说明原因，而不是用其中一张图替代现实安排。
      - heading: 教学示例 2：阴遁：核对当前季节局
        knowledgeUnitId: qimen.layout.yin
        paragraphs:
          - 阴遁是起局结构的标记，局数与值符、值使的位置需在具体盘上确认。值符（盘中的主要星标记）与值使（主要门标记）用于找到阅读入口，不能脱离宫位单独解释。比如你要安排一次协作讨论，可以先确认任务目标与参与者，再观察相关指标所在宫。建议把已标注的时间、局数和位置抄到笔记中，核对流派参数后再阅读文字；不同设置出现的图形差异需要说明原因，而不是用其中一张图替代现实安排。
      - heading: 教学示例 3：休整之后再沟通
        knowledgeUnitId: qimen.gates.xiu
        paragraphs:
          - 你适合先让节奏慢下来，再处理需要沟通的事情。休门（象征休整和温和往来的行动方式）成为值使时，是这局领头的门，提示你关注谈话的空间与准备程度；它并不要求所有事项暂停。例如，长时间讨论后大家都很累，可以先整理分歧，约一个短而明确的交流时段，让恢复精力与推进事项互相配合。建议安排一个不被打断的沟通空档。同时，值使只提供全局的行动背景；具体事项还需要回到用神所在的宫位，结合那里的门星与标记判断。你可以先采用一个能调整的小步骤，观察回应后再决定是否继续扩大。
      - heading: 教学示例 4：从可持续的资源开始
        knowledgeUnitId: qimen.gates.sheng
        paragraphs:
          - 你可以把注意力放在能持续提供支持的资源上。生门（象征生长与可用资源的行动方式）领头时，适合审视条件是否能长期承接下一步，而不只是看眼前有没有机会。它不是对收入或回报的承诺。例如，准备组织一次活动时，已经熟悉的场地、可靠的协作流程和适度的规模，可能比临时增加很多新项目更值得优先考虑。建议先盘点可重复使用的资源与协作流程。同时，值使只提供全局的行动背景；具体事项还需要回到用神所在的宫位，结合那里的门星与标记判断。你可以先采用一个能调整的小步骤，观察回应后再决定是否继续扩大。
      - heading: 教学示例 5：把入口变成具体请求
        knowledgeUnitId: qimen.gates.kai
        paragraphs:
          - 你适合把想推进的事说成一个明确请求。开门（象征入口、工作渠道与对外联系的方式）领头时，可以关注谁能接收你的资料，以及哪种表达容易得到有用回应。它提示的是沟通路径，并不表示每扇门都会立即打开。例如，寻找协作机会时，一份简短说明加一个具体问题，通常比同时发送很多未经整理的材料更方便对方理解，也更容易区分哪些回应值得继续跟进。建议先确认接收渠道，再提出一个清楚的问题。同时，值使只提供全局的行动背景；具体事项还需要回到用神所在的宫位，结合那里的门星与标记判断。你可以先采用一个能调整的小步骤，观察回应后再决定是否继续扩大。
      - heading: 教学示例 6：探索之前标出边界
        knowledgeUnitId: qimen.stars.tian_peng
        paragraphs:
          - 你可以把探索欲用在一个边界清楚的试验上。天蓬（传统上象征探险与流动思路的星）成为值符时，是此局领头的星，适合观察哪些未知吸引了你的注意；它不是对冒险能力的评价。例如，尝试新的工作方法时，可以先选一个能够回退的小任务，记录实际效果，而不因为新鲜就替换整个流程。探索有尺度，才更容易辨认哪些变化值得保留。建议写清试验范围与停止条件。核对时要区分值符星的本位与现在所在的位置，不能因为它领头，就把它的含义套到每一个宫。你可以把这条线索与用神分析并排记录，看看它是支持当前做法，还是提醒你补一个准备环节。
      - heading: 教学示例 7：先定义需要解决的问题
        knowledgeUnitId: qimen.stars.tian_xin
        paragraphs:
          - 你可以先用清楚的标准整理需要解决的问题。天心（象征分析、判断与修整的星）领头时，适合把散乱的线索分成可核实的部分，而不是急着给所有现象同一个解释。它不提供专业诊断或法律判断。例如，一个流程经常中断时，可以记录在哪一步、需要谁的输入和发生了什么，先解决最具体的阻塞点，让分析服务于实际改善。建议写出一个能观察和复查的问题定义。核对时要区分值符星的本位与现在所在的位置，不能因为它领头，就把它的含义套到每一个宫。你可以把这条线索与用神分析并排记录，看看它是支持当前做法，还是提醒你补一个准备环节。
      - heading: 教学示例 8：把知识整理成可传递的形式
        knowledgeUnitId: qimen.stars.tian_fu
        paragraphs:
          - 你可以从整理知识与说明方法入手。天辅（象征学习、文书与辅助的星）领头时，适合关注信息是否容易被理解和传递；这不是对考试成绩或教育程度的判断。例如，你要教别人使用一个工具，可以按实际操作顺序做短说明，并让对方试一次，找出不清楚的步骤。自己理解某件事和让别人理解，是两种需要分别检查的工作。建议把一个复杂步骤写成可操作的小说明。核对时要区分值符星的本位与现在所在的位置，不能因为它领头，就把它的含义套到每一个宫。你可以把这条线索与用神分析并排记录，看看它是支持当前做法，还是提醒你补一个准备环节。
      - heading: 你的练习与复盘
        paragraphs:
          - 选一个普通协作问题，写下起局参数与用神位置，再只读这一宫的两个层。把解释转成「谁负责」「什么条件尚未确认」等问题。实地路线和会议时间仍按现实安排核对。复盘时先确认是否采取了行动，再判断符号提示是否帮助你发现遗漏。
  en:
    title: The nine-palace map in Qi Men
    description:
      The nine palaces organize time and direction into a board in Qi Men Dun Jia (奇门遁甲, qí
      mén dùn jiǎ).
    sections:
      - heading: The nine-palace map in Qi Men
        paragraphs:
          - The nine palaces organize time and direction into a board in Qi Men Dun Jia (奇门遁甲, qí
            mén dùn jiǎ). Gates, stars, deities, and stems supply different symbolic layers within
            each palace. One striking name cannot answer the whole question. This project uses a
            time-based rotating board, the split-and-supplement method, and lodging of the center in
            Kun Two. Before reading symbols, confirm the casting time, time zone, and school
            settings. This guide begins with the map so that the details have somewhere clear to
            belong.
      - heading: From structure to interpretation
        paragraphs:
          - The casting moment supplies the solar-term context and the Yin or Yang arrangement.
            Ordinary question boards do not require a birth profile. A beginner can first identify
            the question's selected indicator, locate its palace, and then examine the layers
            attached to that position. A diagram's layout is not the direction your phone is facing;
            use the labeled palace directions. Distinguish a Gate from a Star, and both from a
            Deity. These words name components of a traditional model, rather than physical forces
            that can be measured in a room. Read the examples below as separate demonstrations of
            how a layer might become a practical question. A Gate associated with preparation might
            prompt review of a task's setup, while another layer might raise a question about
            visibility or coordination. Neither replaces information about the task itself. If
            another service gives a different board, check the exact time, time zone, solar-time
            setting, and layout method before comparing its interpretation. A settings difference
            can explain a technical mismatch without telling you anything new about the question.
            Keeping the map and the narrative separate makes the board easier to study and prevents
            one evocative word from dominating the rest of the reading.
      - heading: How to work with the teaching examples
        paragraphs:
          - The examples below illustrate separate symbolic conditions. In each example, “you”
            addresses a hypothetical reader with that condition, not you personally. Some conditions
            are alternatives and cannot be combined into a single chart. Read the heading first,
            identify the idea being illustrated, and then notice how the explanation moves from a
            symbol to an ordinary situation and a modest suggestion. You do not need to identify
            with every example. A useful exercise is to rewrite one sentence as a question that you
            could observe in daily life. Keep a second note for anything that does not fit. This
            makes room for disagreement and stops a familiar description from becoming a label.
            These passages come from the same versioned editorial knowledge used by the reading
            engine; including them here demonstrates its writing method, not a calculation for a
            visitor. No birth information is required to study this page.
      - heading: 'Teaching example 1: Yang Layout: Start with the Arrangement'
        knowledgeUnitId: qimen.layout.yang
        paragraphs:
          - Yang is a structural arrangement label. The board number and the positions of the Chief
            Star and Chief Gate must be checked on a specific chart. The Chief Star and Chief Gate
            provide entry points for reading; their names alone do not describe a situation. For
            example, when arranging a shared discussion, first establish the goal and participants,
            then locate the related indicators in the board. Record the time, board number, and
            positions displayed by the chart, and verify the school settings before interpreting
            prose. A difference produced by changed settings needs a technical explanation. It does
            not give one diagram authority over the actual arrangement. You can keep the diagram as
            a study aid while asking the people involved to confirm the practical details.
      - heading: 'Teaching example 2: Yin Layout: Check the Seasonal Calculation'
        knowledgeUnitId: qimen.layout.yin
        paragraphs:
          - Yin is a structural arrangement label. The board number and the positions of the Chief
            Star and Chief Gate must be checked on a specific chart. The Chief Star and Chief Gate
            provide entry points for reading; their names alone do not describe a situation. For
            example, when arranging a shared discussion, first establish the goal and participants,
            then locate the related indicators in the board. Record the time, board number, and
            positions displayed by the chart, and verify the school settings before interpreting
            prose. A difference produced by changed settings needs a technical explanation. It does
            not give one diagram authority over the actual arrangement. You can keep the diagram as
            a study aid while asking the people involved to confirm the practical details.
      - heading: 'Teaching example 3: Make Space for a Quieter Conversation'
        knowledgeUnitId: qimen.gates.xiu
        paragraphs:
          - 'You may get more from an unhurried exchange than from another intense round of
            discussion. Xiumen (xiū mén — the gate associated with rest and gentle contact) is the
            leading gate here. Imagine a tired group trying to settle several disagreements at once:
            a pause and a focused conversation can make the remaining decision easier to approach.
            Rest is useful when it has a purpose and leaves a path back to the task. Try setting
            aside a quiet window for one unresolved conversation. The leading gate supplies a
            general action theme; your selected indicators still need their own palace context. Use
            this note to choose a manageable first step, then let the response determine whether you
            repeat, adjust or set aside that approach. Keep the scale proportionate to the actual
            question.'
      - heading: 'Teaching example 4: Build on Resources You Can Maintain'
        knowledgeUnitId: qimen.gates.sheng
        paragraphs:
          - You can look for the resources that make continued effort practical. Shengmen (shēng mén
            — the gate of growth and usable resources) leads the arrangement here. For a community
            event, dependable equipment and an established booking process may matter more than
            adding an impressive new feature. The useful question is what can support the next step
            without exhausting the people involved; the symbol does not promise a financial result.
            Consider reusing a dependable resource before adding a new commitment. The leading gate
            supplies a general action theme; your selected indicators still need their own palace
            context. Use this note to choose a manageable first step, then let the response
            determine whether you repeat, adjust or set aside that approach. Keep the scale
            proportionate to the actual question.
      - heading: 'Teaching example 5: Make the Opening Easy to Respond To'
        knowledgeUnitId: qimen.gates.kai
        paragraphs:
          - You can make an opportunity easier to engage with by offering a specific next step.
            Kaimen (kāi mén — the gate of openings and outward contact) leads the layout. When
            approaching a possible collaborator, a short introduction and one relevant question can
            be more inviting than a large unsorted attachment. The gate points to access and
            communication channels; the other person’s response still depends on their circumstances
            and interest. Consider sending one concise request through the appropriate channel. The
            leading gate supplies a general action theme; your selected indicators still need their
            own palace context. Use this note to choose a manageable first step, then let the
            response determine whether you repeat, adjust or set aside that approach. Keep the scale
            proportionate to the actual question.
      - heading: 'Teaching example 6: Put Limits Around an Experiment'
        knowledgeUnitId: qimen.stars.tian_peng
        paragraphs:
          - You can give curiosity a useful boundary. Tianpeng (tiān péng — a star associated with
            exploration and fluid thinking) is the leading star here. Testing an unfamiliar workflow
            on a reversible task gives you information without committing the whole team to it. A
            new idea can be attractive while its practical fit remains uncertain. Define what you
            want to learn and which existing process will remain available if the trial does not
            help. Try naming what you want to learn before expanding the experiment. Check the
            star’s starting palace separately from its current position. Leadership in the layout
            does not spread the same interpretation across every cell. Compare this working style
            with the circumstances around your selected indicator, and decide whether it supports
            the present approach or points to a preparation step you have overlooked.
      - heading: 'Teaching example 7: Define the Problem Before Fixing It'
        knowledgeUnitId: qimen.stars.tian_xin
        paragraphs:
          - You can make analysis useful by defining the problem in observable terms. Tianxin (tiān
            xīn — a star associated with assessment and adjustment) is the leading star here. A
            workflow that keeps stopping may require a record of the handoff, the missing input and
            the person able to supply it. That is more actionable than a broad explanation about why
            everything feels difficult. Keep the inquiry specific enough that a change can be
            checked afterwards. Consider describing the snag in terms someone else could verify.
            Check the star’s starting palace separately from its current position. Leadership in the
            layout does not spread the same interpretation across every cell. Compare this working
            style with the circumstances around your selected indicator, and decide whether it
            supports the present approach or points to a preparation step you have overlooked.
      - heading: 'Teaching example 8: Make Learning Easy to Share'
        knowledgeUnitId: qimen.stars.tian_fu
        paragraphs:
          - You can make knowledge more useful by testing how someone else receives it. Tianfu (tiān
            fǔ — a star associated with learning and assistance) leads the layout. Writing a short
            guide for a familiar tool reveals whether your explanation follows the order a newcomer
            actually needs. Ask a reader to attempt one step and note where they hesitate. The
            symbol invites attention to teachable methods; it is not a measure of intelligence or a
            forecast of an exam result. Consider asking a learner to test one instruction without
            extra prompting. Check the star’s starting palace separately from its current position.
            Leadership in the layout does not spread the same interpretation across every cell.
            Compare this working style with the circumstances around your selected indicator, and
            decide whether it supports the present approach or points to a preparation step you have
            overlooked.
      - heading: Your practice and review
        paragraphs:
          - For practice, choose an ordinary coordination question and record the casting settings
            and selected indicator's palace. Read two layers in that palace before exploring the
            rest of the board. Translate them into questions such as who owns the next step or what
            condition remains unconfirmed. Verify travel routes and meeting times through real
            information, even when a direction label appears in the reading. At review, start with
            whether you took the planned action and what response you received. Then ask whether the
            symbolic prompt helped you notice an omission. It is fine if it did not. You are
            learning how to navigate a model, not proving that every layer has a useful answer for
            every question. The related Gate and Star examples offer vocabulary for study while the
            system guide keeps the adopted school visible for comparison.
