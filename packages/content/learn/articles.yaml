  slug: gates-stars-deities
  zh:
    title: 门星神怎么读：让符号回到问题
    description: 门、星、神是奇门盘中的不同层，阅读时要先问它们落在哪个与问题有关的宫。
    sections:
      - heading: 门星神怎么读：让符号回到问题
        paragraphs:
          - 门、星、神是奇门盘中的不同层，阅读时要先问它们落在哪个与问题有关的宫。门可作为行动方式的观察角度，星与神补充情境表达；同名符号在不同位置，不能直接照搬同一句话。传统名称有强烈意象，但学习重点是关系与可采取的行动。
      - heading: 从结构到读法
        paragraphs:
          - 用神所在宫是起点，不能只挑全盘最顺眼的符号。某门的解释需与宫位、其他层及格局（特定组合条件）一起看；格局必须满足条件才讨论。下面选取门与神的不同示例，注意正文怎样为较困难的主题提供澄清或准备出口，不把符号当作外部事实。
      - heading: 怎样使用下面的教学示例
        paragraphs:
          - 下面各段示例展示不同盘面条件下的读法，段中的「你」指假设的示例读者，并非对你的个人判断。这些条件可以互不相容，不应拼成一份命盘。先辨认标题的主题，再观察正文如何从符号走到生活例子与建议。你可以把喜欢的句子改写成一个待观察的问题，也可以记录不符合经验的部分。
      - heading: 教学示例 1：先整理，再选择公开范围
        knowledgeUnitId: qimen.gates.du
        paragraphs:
          - 你可以先在安静的范围内把资料整理好。杜门（象征收束、筛选和暂时关闭通道的方式）领头时，适合留意信息应向谁开放，以及哪些准备还需要独立完成。它不等于所有沟通都无效。例如，你在修改一个未成熟的想法时，可以先找少量可信任的人试读，而不是立刻向所有人征求意见，借此减少互相冲突的修改方向。建议给独立准备设定一个结束与分享的节点。同时，值使只提供全局的行动背景；具体事项还需要回到用神所在的宫位，结合那里的门星与标记判断。你可以先采用一个能调整的小步骤，观察回应后再决定是否继续扩大。
      - heading: 教学示例 2：把紧张转成核实
        knowledgeUnitId: qimen.gates.jing
        paragraphs:
          - 你可以先把让你紧张的信息分成事实和猜测。惊门（象征惊动、消息刺激与口头争议的方式）领头时，提示表达可能较急，容易让注意力跟着最新消息走。它不代表消息内容已经成立，也不能用来判断他人的品行。例如，群聊里忽然有人说安排有变，可以直接核对原负责人发布的信息，而不是继续转发未经确认的版本，让讨论回到可以证实的内容。不过，建议先核对原始消息再回应。同时，值使只提供全局的行动背景；具体事项还需要回到用神所在的宫位，结合那里的门星与标记判断。你可以先采用一个能调整的小步骤，观察回应后再决定是否继续扩大。
      - heading: 教学示例 3：推进前说清边界
        knowledgeUnitId: qimen.gates.shang
        paragraphs:
          - 你适合先明确分工与边界，再处理需要争取的事项。伤门（象征竞争、争执与主动推进的方式）成为值使时，提示当前做法可能更直接，容易让讨论集中在差异上；门名不能当成现实伤害的预告。例如，团队需要赶进度时，可以明确各自负责什么和何时反馈，避免把催促变成人身评价。说清工作要求，比猜测别人是否足够努力更有帮助。不过，你可以通过明确责任范围来减轻冲突。同时，值使只提供全局的行动背景；具体事项还需要回到用神所在的宫位，结合那里的门星与标记判断。你可以先采用一个能调整的小步骤，观察回应后再决定是否继续扩大。
      - heading: 教学示例 4：收尾也能带来空间
        knowledgeUnitId: qimen.gates.si
        paragraphs:
          - 你适合先完成旧事项的整理和收尾。死门（象征停顿、封存与结束一个阶段的方式）成为值使时，提示你检查哪些事情还占着精力，却已经不需要继续扩大；门名并不是对健康或生命的判断。例如，一个活动结束后仍有散落的文档和待确认的交接，可以先归档、列出遗留项，让下一次安排不用从混乱的材料中重新开始。暂停扩展也可以是有意识的选择。建议列出需要归档、交接和暂停的事项。同时，值使只提供全局的行动背景；具体事项还需要回到用神所在的宫位，结合那里的门星与标记判断。你可以先采用一个能调整的小步骤，观察回应后再决定是否继续扩大。
      - heading: 教学示例 5：给细致准备留安静空间
        knowledgeUnitId: qimen.deities.tai_yin
        paragraphs:
          - 你可以给细致准备留一段安静时间。太阴（象征隐细、周密与私下协助的情境标记）在某宫出现，适合提醒你检查尚未公开的准备工作，而不是把安静等同于有秘密。它也不按性别指定谁该承担协助角色。例如，修改一份重要说明时，可以请一位熟悉背景的人私下试读，先修正不清楚的部分，再决定是否扩大分享范围。建议先安排一次小范围的细节复核。你可以把它写成一项观察提示，再用实际情况检验它是否适合当前安排。
      - heading: 教学示例 6：合作从明确约定开始
        knowledgeUnitId: qimen.deities.liu_he
        paragraphs:
          - 你适合先把合作的期待说清楚。六合（象征协调、连接与共同安排的情境标记）出现在相关用神宫中，提示可以关注双方怎样形成可执行的约定，但不意味着每个人都已经同意。关系问题也不据此推断谁应该迁就谁。例如，一起安排周末活动时，可以先说各自的时间和偏好，再找共同可行的部分，而不是把和气当成不需要确认。建议确认双方都愿意承担的具体部分。你可以把它写成一项观察提示，再用实际情况检验它是否适合当前安排。
      - heading: 教学示例 7：让准备有稳定落点
        knowledgeUnitId: qimen.deities.jiu_di
        paragraphs:
          - 你可以先把基础工作做得容易持续。九地（象征沉稳、隐藏准备与扎根的情境标记）出现时，适合关注资料是否齐备、流程是否稳定，而不必急着扩大声量。它不表示永远等待，只是提醒你区分准备阶段与展示阶段。例如，准备一个新社群时，可以先把活动规则和接待流程试运行，再邀请更多人参加，让扩展有明确的承接方式。建议完成一个基础环节后设定分享节点。这个标记本身不加入总分，不能把它当成单独的吉凶票数；若要用在你的问题上，还需确认相关用神是否同宫。你可以把它写成一项观察提示，再用实际情况检验它是否适合当前安排。
      - heading: 教学示例 8：把视野转成能执行的目标
        knowledgeUnitId: qimen.deities.jiu_tian
        paragraphs:
          - 你适合把较大的想法拆成可执行的目标。九天（象征开阔、远行与向外展开的情境标记）出现时，可以鼓励你看见更多可能性，但不表示范围越大越合适。例如，想参加一个跨城市活动时，可以先了解报名要求和交通安排，再决定是否投入准备。广阔视野需要具体条件承接，先完成一项能验证可行性的动作，会让下一步更清楚。建议把远一点的目标拆出第一项准备动作。这个标记本身不加入总分，不能把它当成单独的吉凶票数；若要用在你的问题上，还需确认相关用神是否同宫。你可以把它写成一项观察提示，再用实际情况检验它是否适合当前安排。
      - heading: 你的练习与复盘
        paragraphs:
          - 在示例里划出符号、解释和建议三部分。回到自己的问题，只保留与已定位宫位相关的提示，并写出一个小行动。若多个层看起来不一致，先列不同观察角度，避免把它们强行合成一句断语。必要时缩小问题范围，再核实缺失信息。
  en:
    title: Reading Gates, Stars, and Deities in context
    description: Gates, Stars, and Deities are different layers on a Qi Men board.
    sections:
      - heading: Reading Gates, Stars, and Deities in context
        paragraphs:
          - Gates, Stars, and Deities are different layers on a Qi Men board. Ask which relevant
            palace contains a symbol before asking what it means. Gates can organize questions about
            a manner of action; Stars and Deities add symbolic context. A familiar symbol in a
            different position should not receive an identical interpretation without checking the
            relationship to the question. Traditional names can be vivid, but the useful beginner
            focus is how the layers connect and what practical question they help you formulate.
      - heading: From structure to interpretation
        paragraphs:
          - "Begin with the palace of the selected indicator. Do not simply choose the most
            appealing symbol anywhere on the board. A Gate's interpretation depends on its position,
            neighboring layers, and any recognized pattern whose conditions are actually present. A
            named pattern should not be invoked because one part of its name sounds familiar. The
            examples below contrast several Gates and Deities so you can see how a symbolic idea
            becomes a question about preparation, communication, or boundaries. They are
            alternatives, not a list of instructions that applies all at once. When a passage
            describes a difficulty, look for the practical opening it supplies: clarify an
            expectation, check a source, reduce the scope, or allow time for a response. A symbol
            cannot verify whether someone is withholding information or what an organization will
            decide. Use direct questions and documented facts for that. The board may help you frame
            a conversation, but the conversation provides the evidence. This distinction also makes
            it easier to compare schools. Two methods may emphasize a symbol differently; recording
            the method lets you study the difference without treating the stronger wording as a more
            authoritative account of real life."
      - heading: How to work with the teaching examples
        paragraphs:
          - The examples below illustrate separate symbolic conditions. In each example, “you”
            addresses a hypothetical reader with that condition, not you personally. Some conditions
            are alternatives and cannot be combined into a single chart. Read the heading first,
            identify the idea being illustrated, and then notice how the explanation moves from a
            symbol to an ordinary situation and a modest suggestion. You do not need to identify
            with every example. A useful exercise is to rewrite one sentence as a question that you
            could observe in daily life. Keep a second note for anything that does not fit. This
            makes room for disagreement and stops a familiar description from becoming a label.
            These passages come from the same versioned editorial knowledge used by the reading
            engine; including them here demonstrates its writing method, not a calculation for a
            visitor. No birth information is required to study this page.
      - heading: 'Teaching example 1: Prepare Privately Before Opening the Discussion'
        knowledgeUnitId: qimen.gates.du
        paragraphs:
          - You can use a limited audience to improve work that is still taking shape. Dumen (dù mén
            — the gate of containment and restricted access) is the leading gate here. A rough
            proposal may benefit from a few carefully chosen readers before it goes to a large
            group. Different levels of openness serve different stages of preparation. The practical
            issue is to make the boundary explicit so that privacy does not become an endless delay.
            Try choosing a review date and a small initial audience. The leading gate supplies a
            general action theme; your selected indicators still need their own palace context. Use
            this note to choose a manageable first step, then let the response determine whether you
            repeat, adjust or set aside that approach. Keep the scale proportionate to the actual
            question.
      - heading: 'Teaching example 2: Turn Alarm into a Clear Check'
        knowledgeUnitId: qimen.gates.jing
        paragraphs:
          - You can slow down a reactive exchange by checking the original message. Jingmen (jīng
            mén — the gate associated with alarm and verbal disturbance) is the leading gate. A
            rumour in a group chat may feel urgent while still lacking a source. Finding the person
            responsible for the announcement gives you a useful check before you repeat it. The
            symbol concerns the tone of information, not the character of whoever first mentioned
            it. Try asking for the original source before replying to an urgent claim. The leading
            gate supplies a general action theme; your selected indicators still need their own
            palace context. Use this note to choose a manageable first step, then let the response
            determine whether you repeat, adjust or set aside that approach. Keep the scale
            proportionate to the actual question.
      - heading: 'Teaching example 3: Set Boundaries Before Applying Pressure'
        knowledgeUnitId: qimen.gates.shang
        paragraphs:
          - You may need a clear request with equally clear limits. Shangmen (shāng mén — the gate
            associated with contest and assertive action) leads this chart. A deadline can tempt a
            team into personal criticism when the real problem is an unclear handoff. Stating the
            required task and feedback time gives directness a constructive purpose. Read the gate
            as a question about how you apply pressure, rather than a prediction of harm. Consider
            stating the task boundary before discussing a difficult deadline. The leading gate
            supplies a general action theme; your selected indicators still need their own palace
            context. Use this note to choose a manageable first step, then let the response
            determine whether you repeat, adjust or set aside that approach. Keep the scale
            proportionate to the actual question.
      - heading: 'Teaching example 4: Finish What No Longer Needs Expansion'
        knowledgeUnitId: qimen.gates.si
        paragraphs:
          - You can create room by finishing the administrative tail of an old task. Simen (sǐ mén —
            the gate of closure and stillness) leads this arrangement. After an event, scattered
            files and unfinished handoffs may continue to consume attention long after the main work
            is over. Archiving the material and identifying the remaining owner can release
            capacity. Treat the symbol as a prompt about completion, not as a literal statement
            about life or health. Consider closing one lingering loop before beginning another
            project. The leading gate supplies a general action theme; your selected indicators
            still need their own palace context. Use this note to choose a manageable first step,
            then let the response determine whether you repeat, adjust or set aside that approach.
            Keep the scale proportionate to the actual question.
      - heading: 'Teaching example 5: Use a Quiet Setting for Detailed Preparation'
        knowledgeUnitId: qimen.deities.tai_yin
        paragraphs:
          - You can use a quieter exchange to improve a detail that would be lost in a large
            discussion. Taiyin (tài yīn — the deity symbol associated with discretion and careful
            support) is an image of working conditions, not a gendered role. A trusted reader may
            help you find an unclear sentence before a document reaches a wide audience. Define the
            review purpose so that a private check has an explicit next step. Try requesting a
            focused private review before wider circulation. Deity imagery is not a separate score
            contribution in this engine. Locate the symbol and check whether the indicator relevant
            to your question shares that palace before applying it personally. Keep it as an
            observation prompt, with enough room for the circumstances you encounter to show that a
            different approach is more useful.
      - heading: 'Teaching example 6: Give Cooperation a Specific Agreement'
        knowledgeUnitId: qimen.deities.liu_he
        paragraphs:
          - You can make cooperation more reliable by saying what each person is agreeing to. Liuhe
            (liù hé — the deity symbol for connection and coordination) offers a prompt about shared
            arrangements, not evidence of consent. When planning a weekend together, separate each
            person’s availability from their preferences and find the overlap. Harmony can include a
            respectful refusal and a different proposal. Consider checking agreement on a concrete
            next step rather than assuming it. Deity imagery is not a separate score contribution in
            this engine. Locate the symbol and check whether the indicator relevant to your question
            shares that palace before applying it personally. Keep it as an observation prompt, with
            enough room for the circumstances you encounter to show that a different approach is
            more useful.
      - heading: 'Teaching example 7: Give Preparation a Stable Base'
        knowledgeUnitId: qimen.deities.jiu_di
        paragraphs:
          - You can build a stable base before asking a project to carry more activity. Jiudi (jiǔ
            dì — the deity symbol for grounded preparation) invites attention to routines and
            supporting materials. Before inviting a larger group into a new community, test the
            welcome process and activity rules with a small circle. A foundation becomes useful when
            it supports a visible next step rather than keeping the work hidden indefinitely. Try
            testing the supporting routine before increasing the audience. Deity imagery is not a
            separate score contribution in this engine. Locate the symbol and check whether the
            indicator relevant to your question shares that palace before applying it personally.
            Keep it as an observation prompt, with enough room for the circumstances you encounter
            to show that a different approach is more useful.
      - heading: 'Teaching example 8: Turn a Broad View into a Reachable Step'
        knowledgeUnitId: qimen.deities.jiu_tian
        paragraphs:
          - You can connect a broad ambition to one reachable step. Jiutian (jiǔ tiān — the deity
            symbol for expansion and an outward view) suggests looking beyond the current setting
            without assuming every wider option fits. For an event in another city, checking entry
            requirements and transport may be the first useful action. A larger horizon becomes
            practical when you identify the conditions needed to approach it. Consider checking one
            practical requirement for the wider option. Deity imagery is not a separate score
            contribution in this engine. Locate the symbol and check whether the indicator relevant
            to your question shares that palace before applying it personally. Keep it as an
            observation prompt, with enough room for the circumstances you encounter to show that a
            different approach is more useful.
      - heading: Your practice and review
        paragraphs:
          - Underline the symbol, explanation, and suggestion separately in one example. Return to
            your question and retain only prompts associated with the palace you actually located.
            Write one small action and a way to review it. If several layers seem inconsistent, list
            their viewpoints separately instead of forcing them into a dramatic conclusion. One
            might concern preparation, another communication, and another the limits of current
            information. A practical plan can acknowledge all three without claiming a definite
            outcome. You can narrow the question or seek missing facts from the people involved. At
            review, note which prompt changed your behavior and whether that change helped. Studying
            the vocabulary this way gives you a clearer account of the model's use and makes room
            for situations where its symbolism adds little to an ordinary decision.
