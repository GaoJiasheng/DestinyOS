- system: iching
  slug: hexagrams-and-lines
  zh:
    title: 六十四卦怎么读：从上下卦到六爻
    description: 卦象（六条阴阳线构成的图形）是一种情境语言，读线的顺序由下向上。
    sections:
      - heading: 六十四卦怎么读：从上下卦到六爻
        paragraphs:
          - 卦象（六条阴阳线构成的图形）是一种情境语言，读线的顺序由下向上。下三爻组成下卦，上三爻组成上卦；两个三爻卦相重，形成六十四卦。先认结构，再读白话与动爻，最后才展开原文，有助于避免被古典词汇挡在门外。
      - heading: 从结构到读法
        paragraphs:
          - 实线表示阳，断线表示阴，它们是结构符号而非道德等级。初爻到上爻表示图中的位置，不能直接当成六个月。卦辞讨论整体，爻辞讨论某个位置的处境，象辞提供图像角度。本项目将古文折叠保留，白话用于学习；不同起卦方法的技术细节不应混用。
      - heading: 怎样使用下面的教学示例
        paragraphs:
          - 下面各段示例展示不同盘面条件下的读法，段中的「你」指假设的示例读者，并非对你的个人判断。这些条件可以互不相容，不应拼成一份命盘。先辨认标题的主题，再观察正文如何从符号走到生活例子与建议。你可以把喜欢的句子改写成一个待观察的问题，也可以记录不符合经验的部分。
      - heading: 教学示例 1：乾：主动创造
        knowledgeUnitId: iching.primary.hexagram_01
        paragraphs:
          - 主动创造，持续练习，把力量用在可承担的目标上；你可以据此检查手头安排。本卦（这次起卦得到的主要情境图）为乾卦；能力正在形成时先做准备，得到支持后再扩大影响，走到高处也要留意反馈。乾的六个位置呈现力量从潜藏到显露的过程，重点是行动与时机相配。上下卦都是天，强调开阔与主动的连续作用；这是观察情境的比喻，不是事件预告。例如，新项目先做样稿，再邀请同事评审，就能把这个角度用在可观察的安排上。建议给每一步设定检查点；若现实信息不同，及时修正理解，不把象征当成行动命令。
      - heading: 教学示例 2：坤：承接现实需要
        knowledgeUnitId: iching.primary.hexagram_02
        paragraphs:
          - 承接现实需要，用可靠的配合建立自己的位置；你可以据此检查手头安排。本卦（这次起卦得到的主要情境图）为坤卦；坤以大地的承载讲接纳与落实，柔和并不等于没有立场。你可以把别人的构想变成日常可执行的安排，也要看清自己能提供什么，避免把所有责任都揽到身上。上下卦都是地，强调承载与落实的连续作用；这是观察情境的比喻，不是事件预告。例如，共同任务先分工，再约定求助方式，就能把这个角度用在可观察的安排上。建议支持别人也保留休息；若现实信息不同，及时修正理解，不把象征当成行动命令。
      - heading: 教学示例 3：屯：起步不顺时
        knowledgeUnitId: iching.primary.hexagram_03
        paragraphs:
          - 起步不顺时，先把资源和伙伴组织起来；你可以据此检查手头安排。本卦（这次起卦得到的主要情境图）为屯卦；屯讲新生事物尚未成形，雷的推动遇到水的阻碍，容易出现热情先于条件的情况。反复并不说明方向无价值，往往提示规则、资源与协作还需要搭建。例如，新团队先确认职责，不急着同时开多个任务，就能把这个角度用在可观察的安排上。建议把难题拆成先后步骤；若现实信息不同，及时修正理解，不把象征当成行动命令。
      - heading: 教学示例 4：蒙：愿意承认未知
        knowledgeUnitId: iching.primary.hexagram_04
        paragraphs:
          - 愿意承认未知，学习才有明确入口；你可以据此检查手头安排。本卦（这次起卦得到的主要情境图）为蒙卦；蒙把山下的水看作初学者尚未找到通路的状态。重要的是诚恳提问与持续练习，而不是反复索取让自己安心的结论；教与学都需要清楚的边界。卦象上方是山，下方是水，分别提示边界与止步与不确定中的通路；这是观察情境的比喻，不是事件预告。例如，学新技能时带着一次失败记录去请教，就能把这个角度用在可观察的安排上。建议先实践再复盘问题；若现实信息不同，及时修正理解，不把象征当成行动命令。
      - heading: 教学示例 5：需：等待条件成熟时
        knowledgeUnitId: iching.primary.hexagram_05
        paragraphs:
          - 等待条件成熟时，仍可照顾手头的准备；你可以据此检查手头安排。本卦（这次起卦得到的主要情境图）为需卦；需讲有能力但前路尚有阻隔，天空下方的水并未提供直接通道。等待不是把事情搁置，而是保留余地、补齐信息，避免越急越靠近难以退出的位置。卦象上方是水，下方是天，分别提示不确定中的通路与开阔与主动；这是观察情境的比喻，不是事件预告。例如，等回复期间整理材料，而不是连续催问，就能把这个角度用在可观察的安排上。建议约定一次合适的跟进；若现实信息不同，及时修正理解，不把象征当成行动命令。
      - heading: 教学示例 6：讼：分歧出现时
        knowledgeUnitId: iching.primary.hexagram_06
        paragraphs:
          - 分歧出现时，先降低争执的成本；你可以据此检查手头安排。本卦（这次起卦得到的主要情境图）为讼卦；讼呈现天与水各行其路，双方的期待可能越走越远。它提醒你看见争论背后的需求与信息差，及时求助于公允的沟通过程，不把每次不同意见都推到输赢上。卦象上方是天，下方是水，分别提示开阔与主动与不确定中的通路；这是观察情境的比喻，不是事件预告。例如，会议里先写出双方共同认可的事实，就能把这个角度用在可观察的安排上。建议把立场转换成具体请求；若现实信息不同，及时修正理解，不把象征当成行动命令。
      - heading: 教学示例 7：师：集体行动需要秩序
        knowledgeUnitId: iching.primary.hexagram_07
        paragraphs:
          - 集体行动需要秩序，也需要可信的负责人；你可以据此检查手头安排。本卦（这次起卦得到的主要情境图）为师卦；师借地中藏水的意象谈众人的力量，力量要靠清楚安排才能发挥。这里的纪律是共同理解做法与责任，并非要求无条件服从；选对负责人比单纯增加人数更关键。卦象上方是地，下方是水，分别提示承载与落实与不确定中的通路；这是观察情境的比喻，不是事件预告。例如，赶进度时列出负责人和交接顺序，就能把这个角度用在可观察的安排上。建议行动前核对目标与权限；若现实信息不同，及时修正理解，不把象征当成行动命令。
      - heading: 教学示例 8：比：寻找同行者时
        knowledgeUnitId: iching.primary.hexagram_08
        paragraphs:
          - 寻找同行者时，看长期可信度而非一时热闹；你可以据此检查手头安排。本卦（这次起卦得到的主要情境图）为比卦；比以水与地相亲的意象谈连接，合作的价值来自彼此愿意回应。亲近不必取消筛选，也不必为了融入而违背自己的原则；稳定的小圈子往往比表面的广泛关系更有用。卦象上方是水，下方是地，分别提示不确定中的通路与承载与落实；这是观察情境的比喻，不是事件预告。例如，邀请两位可靠伙伴定期交流进展，就能把这个角度用在可观察的安排上。建议先说明你能给出的支持；若现实信息不同，及时修正理解，不把象征当成行动命令。
      - heading: 你的练习与复盘
        paragraphs:
          - 手画六条线，标清上下与爻位，再去卦页核对。选一个普通问题，例如如何安排共同任务，把白话中一条提示改成具体行动。古文不懂时先查词义，不凭陌生字猜测结果；复盘时保留问题、图形、行动和真实反馈四项。
  en:
    title: Reading a hexagram from trigrams to lines
    description:
      A hexagram (卦, guà — a figure of six Yin or Yang lines) offers a language for exploring
      a situation.
    sections:
      - heading: Reading a hexagram from trigrams to lines
        paragraphs:
          - A hexagram (卦, guà — a figure of six Yin or Yang lines) offers a language for exploring
            a situation. Read its lines from bottom to top. The lower three form one trigram, and
            the upper three form another; pairs of the eight trigrams create the sixty-four figures.
            For a first study session, identify the structure, read a plain-language explanation,
            and then inspect any changing line before opening the classical text. You do not need to
            understand every historical word to notice a useful question about timing, cooperation,
            or preparation.
      - heading: From structure to interpretation
        paragraphs:
          - An unbroken line represents Yang and a broken line represents Yin. These are structural
            categories, not moral grades. The first line is at the bottom, and the top line is the
            sixth. Those positions do not automatically stand for six months or six fixed steps in a
            real project. A judgment addresses the overall figure, a line text addresses a position
            within it, and an image commentary supplies an additional metaphor. The encyclopedia
            keeps the classical material expandable so that the plain-language explanation remains
            accessible while the original can still be studied. Different casting methods have their
            own technical procedures. A general hexagram theme should not be confused with a
            complete Six Lines calculation or a Plum Blossom relationship. The examples below
            introduce contrasting figures and demonstrate how the language can become a practical
            prompt. Read one figure at a time and ask what situation it describes in the example.
            Then separate the symbolic story from the facts of your own question. A useful
            interpretation identifies a possible action or point to clarify, without requiring you
            to treat every image as a hidden fact about another person.
      - heading: How to work with the teaching examples
        paragraphs:
          - The examples below illustrate separate symbolic conditions. In each example, “you”
            addresses a hypothetical reader with that condition, not you personally. Some conditions
            are alternatives and cannot be combined into a single chart. Read the heading first,
            identify the idea being illustrated, and then notice how the explanation moves from a
            symbol to an ordinary situation and a modest suggestion. You do not need to identify
            with every example. A useful exercise is to rewrite one sentence as a question that you
            could observe in daily life. Keep a second note for anything that does not fit. This
            makes room for disagreement and stops a familiar description from becoming a label.
            These passages come from the same versioned editorial knowledge used by the reading
            engine; including them here demonstrates its writing method, not a calculation for a
            visitor. No birth information is required to study this page.
      - heading: 'Teaching example 1: The Creative'
        knowledgeUnitId: iching.primary.hexagram_01
        paragraphs:
          - 'You have room to initiate, but leadership asks for practice as well as confidence. The
            Creative is your primary hexagram (běn guà — the main figure cast for this question); a
            capable person can still move too early. The six dragon images trace how initiative
            develops, becomes visible, and eventually needs restraint. Initiative is not a demand to
            lead every room; some abilities need quiet development; others benefit from a guide who
            can see what you miss. When influence grows, invite criticism before your plans become
            difficult to interrupt. In everyday terms, test an idea privately before asking a team
            to follow it. Try this emphasis: make room for honest feedback. Give this step a review
            point tied to the task itself, so you can notice what helped and what still needs
            another approach.'
      - heading: 'Teaching example 2: The Receptive'
        knowledgeUnitId: iching.primary.hexagram_02
        paragraphs:
          - 'You can contribute through steadiness without surrendering your own judgment. The
            Receptive is your primary hexagram (běn guà — the main figure cast for this question);
            receptivity works best when it is active and discerning. Here the earth image points to
            making plans usable, supporting shared work, and knowing what you can reasonably carry.
            A supporting role can hold considerable influence because it determines whether an idea
            reaches ordinary life; be clear about what you agree to carry. Dependable assistance
            includes the ability to decline demands that exceed the resources available. In everyday
            terms, agree on roles before volunteering for additional work. Try this emphasis: leave
            some capacity uncommitted. Give this step a review point tied to the task itself, so you
            can notice what helped and what still needs another approach.'
      - heading: 'Teaching example 3: Difficulty at the Beginning'
        knowledgeUnitId: iching.primary.hexagram_03
        paragraphs:
          - 'You may need a workable foundation before an ambitious beginning can take shape.
            Difficulty at the Beginning is your primary hexagram (běn guà — the main figure cast for
            this question); a beginning can contain real energy and real confusion at once. Thunder
            beneath water suggests that motion exists, while the route and support around it are
            still unsettled. Early confusion often concerns coordination more than motivation; A
            partner, a sequence of tasks, and an agreed place to begin can matter more than another
            ambitious proposal. Establishing these basics helps you distinguish a difficult
            beginning from a direction that needs changing. In everyday terms, give a new group one
            manageable assignment before expanding. Try this emphasis: build the first reliable
            foothold.'
      - heading: 'Teaching example 4: Youthful Folly'
        knowledgeUnitId: iching.primary.hexagram_04
        paragraphs:
          - 'You can make progress by turning uncertainty into a question someone can actually
            answer. Youthful Folly is your primary hexagram (běn guà — the main figure cast for this
            question); learning needs curiosity and a usable method. The mountain above water evokes
            a route that is not yet visible, so asking a focused question matters more than
            collecting reassuring opinions. A teacher cannot do the learner’s practice, and a
            learner should not have to guess what is being taught; bring an attempt rather than an
            unlimited request for certainty. A respectful learning relationship makes mistakes
            visible and gives them a next use. In everyday terms, bring a specific failed attempt to
            a mentor. Try this emphasis: ask for a method you can test.'
      - heading: 'Teaching example 5: Waiting'
        knowledgeUnitId: iching.primary.hexagram_05
        paragraphs:
          - 'You can wait productively by protecting your capacity and watching for a practical
            opening. Waiting is your primary hexagram (běn guà — the main figure cast for this
            question); strength does not remove every delay. Water above heaven places a capable
            impulse beneath an uncertain crossing, making preparation and distance from trouble
            useful forms of action. A delay becomes harder to bear when you repeatedly move closer
            to the obstruction just to feel active; set a follow-up interval and keep ordinary life
            supplied. Waiting with a plan preserves options that impatient pressure might close. In
            everyday terms, use a delayed reply to prepare the next useful document. Try this
            emphasis: set a sensible follow-up point. Give this step a review point tied to the task
            itself, so you can notice what helped and what still needs another approach.'
      - heading: 'Teaching example 6: Conflict'
        knowledgeUnitId: iching.primary.hexagram_06
        paragraphs:
          - 'You may gain more from clarifying a disagreement than from proving you can outlast it.
            Conflict is your primary hexagram (běn guà — the main figure cast for this question);
            opposing directions can turn a small misunderstanding into a costly contest. This image
            asks you to separate what happened from what each person assumes, and to leave room for
            an impartial conversation. Different interpretations of an agreement can persist even
            when both people are sincere; clarifying the request may reveal an easier resolution
            than defending a whole position. A neutral facilitator can help establish the facts
            without becoming someone who chooses your life for you. In everyday terms, list agreed
            facts before discussing disputed interpretations. Try this emphasis: seek clarity before
            escalation.'
      - heading: 'Teaching example 7: The Army'
        knowledgeUnitId: iching.primary.hexagram_07
        paragraphs:
          - 'You can coordinate demanding work by making responsibilities and limits visible. The
            Army is your primary hexagram (běn guà — the main figure cast for this question); a
            group has reserves that an individual does not, but coordination is a separate skill.
            Water held within earth evokes resources gathered under a structure that must remain
            understandable and accountable. Organization should make responsibility easier to trace,
            not harder to question; A person leading a collective effort needs enough knowledge to
            coordinate and enough openness to hear a warning. Numbers alone cannot compensate for a
            confused chain of instructions. In everyday terms, name a coordinator and define each
            handover. Try this emphasis: keep the chain of responsibility clear. Give this step a
            review point tied to the task itself, so you can notice what helped and what still needs
            another approach.'
      - heading: 'Teaching example 8: Holding Together'
        knowledgeUnitId: iching.primary.hexagram_08
        paragraphs:
          - 'You can build belonging around reciprocal care and a purpose people understand. Holding
            Together is your primary hexagram (běn guà — the main figure cast for this question);
            connection becomes useful when people know why they are together. Water over earth
            suggests closeness and shared access, but a sound alliance still needs consent,
            reliability, and room to choose. Belonging can be renewed through ordinary reciprocal
            acts; notice who listens, who follows through, and who makes participation voluntary. A
            bond does not improve merely by becoming tighter; it improves when people have a sound
            reason to remain connected. In everyday terms, start a small check-in with people who
            keep commitments. Try this emphasis: build trust through modest promises. Give this step
            a review point tied to the task itself, so you can notice what helped and what still
            needs another approach.'
      - heading: Your practice and review
        paragraphs:
          - 'Draw six lines by hand, number them from bottom to top, and mark the lower and upper
            trigrams. Compare the drawing with its encyclopedia page before adding an
            interpretation. Then choose an ordinary question, such as how to arrange a shared task,
            and rewrite one plain-language suggestion as an action you can take. You might confirm a
            deadline, ask what support is needed, or reduce the scope of a first attempt. If a
            classical phrase is unfamiliar, consult its explanation rather than guessing an event
            from a striking word. Keep four items in your notebook: the question, the figure, the
            action you chose, and the feedback you later received. A disagreement between the
            metaphor and your experience is useful information too. It helps you learn where the
            figure prompted a good question and where the symbolism did not add anything practical.'
