  slug: aspects
  zh:
    title: 相位是什么：读角度关系而非单词
    description: 相位（两颗行星在黄道上的角度关系）描述盘中主题如何互动。
    sections:
      - heading: 相位是什么：读角度关系而非单词
        paragraphs:
          - 相位（两颗行星在黄道上的角度关系）描述盘中主题如何互动。合相、对冲、三分、四分、六分是主要相位，容许度（允许偏离标准角度的范围）决定是否记录这条关系。名称不是生活结果，先确认两端行星与角度，再读象征。
      - heading: 从结构到读法
        paragraphs:
          - 两颗行星隔着 0°
            边界仍可能很近，因此看最短角距而非直接减数。三分与六分可讨论协同，四分与对冲可讨论协调不同需求；这不构成统一好坏表。容许度设置不同会改变相位清单。下面以日月与水星相关示例讨论差异，每条关系要单独定位，不能从不同记录拼出一条相位。
      - heading: 怎样使用下面的教学示例
        paragraphs:
          - 下面各段示例展示不同盘面条件下的读法，段中的「你」指假设的示例读者，并非对你的个人判断。这些条件可以互不相容，不应拼成一份命盘。先辨认标题的主题，再观察正文如何从符号走到生活例子与建议。你可以把喜欢的句子改写成一个待观察的问题，也可以记录不符合经验的部分。
      - heading: 教学示例 1：太阳与月亮合相：协调两种需要
        knowledgeUnitId: astrology.aspect.sun_moon.conjunction
        paragraphs:
          - 你在自主选择与认同，以及情绪回应与安全感之间，可能体验到两种需要交织，适合区分各自的任务。命盘里的太阳（象征自主选择与认同）与月亮（象征情绪回应与安全感）形成合相（两颗行星黄经接近的关系），把两个面向集中在一起，容易同时启动；靠得近不等于表达一致，也不自动表示轻松或困难。例如，负责项目时，先说明你想实现的价值，再把一个关键决定交给团队讨论，同时检查情绪回应与安全感是否也需要被回应，避免只顾一边。注意把被看见当成唯一的反馈或把一次情绪当成永久结论是否让协商变窄；可以把两种需要分开命名，再决定先回应哪一种，再给长期目标写下一个可以调整的理由，用一次具体互动检验调整是否合适，而非把角度当作事件预告。
      - heading: 教学示例 2：太阳与月亮四分相：协调两种需要
        knowledgeUnitId: astrology.aspect.sun_moon.square
        paragraphs:
          - 你在自主选择与认同，以及情绪回应与安全感之间，可能体验到两种需要容易抢占同一时段，可以练习协调。命盘里的太阳（象征自主选择与认同）与月亮（象征情绪回应与安全感）形成四分相（两颗行星约九十度的关系），象征不同需求之间的摩擦；紧张感可提醒你重新排序，并不说明某个面向必须被压住。例如，负责项目时，先说明你想实现的价值，再把一个关键决定交给团队讨论，同时检查情绪回应与安全感是否也需要被回应，避免只顾一边。注意把被看见当成唯一的反馈或把一次情绪当成永久结论是否让协商变窄；可以把优先级与轮换时间说清楚，再给长期目标写下一个可以调整的理由，用一次具体互动检验调整是否合适，而非把角度当作事件预告。
      - heading: 教学示例 3：太阳与月亮三分相：协调两种需要
        knowledgeUnitId: astrology.aspect.sun_moon.trine
        paragraphs:
          - 你在自主选择与认同，以及情绪回应与安全感之间，可能体验到两种需要倾向自然配合，也值得有意识练习。命盘里的太阳（象征自主选择与认同）与月亮（象征情绪回应与安全感）形成三分相（两颗行星约一百二十度的关系），象征较易衔接的表达；顺手的方式可能被忽略，仍需要练习与环境支持才能成为实际帮助。例如，负责项目时，先说明你想实现的价值，再把一个关键决定交给团队讨论，同时检查情绪回应与安全感是否也需要被回应，避免只顾一边。注意把被看见当成唯一的反馈或把一次情绪当成永久结论是否让协商变窄；可以记录一次顺手的配合并主动重复练习，再给长期目标写下一个可以调整的理由，用一次具体互动检验调整是否合适，而非把角度当作事件预告。
      - heading: 教学示例 4：太阳与月亮对冲：协调两种需要
        knowledgeUnitId: astrology.aspect.sun_moon.opposition
        paragraphs:
          - 你在自主选择与认同，以及情绪回应与安全感之间，可能体验到两种需要像拉扯两端，可以寻找轮流表达的安排。命盘里的太阳（象征自主选择与认同）与月亮（象征情绪回应与安全感）形成对冲（两颗行星约一百八十度的关系），象征容易被看成两端的需求；另一端也可能由互动唤起，不能据此认定别人是问题来源。例如，负责项目时，先说明你想实现的价值，再把一个关键决定交给团队讨论，同时检查情绪回应与安全感是否也需要被回应，避免只顾一边。注意把被看见当成唯一的反馈或把一次情绪当成永久结论是否让协商变窄；可以给两种需要各留一个明确表达的时段，再给长期目标写下一个可以调整的理由，用一次具体互动检验调整是否合适，而非把角度当作事件预告。
      - heading: 教学示例 5：水星与火星六分相：协调两种需要
        knowledgeUnitId: astrology.aspect.mercury_mars.sextile
        paragraphs:
          - 你在思考、学习与沟通与行动、竞争与边界之间，可能体验到两种需要可以合作，但仍需要主动搭桥。命盘里的水星（象征思考、学习与沟通）与火星（象征行动、竞争与边界）形成六分相（两颗行星约六十度的关系），象征可通过参与建立的配合；机会需要被使用，不能只凭这个关系认定事情会顺利展开。例如，讨论新方案时，先举一个对方熟悉的例子，再邀请对方复述理解，同时检查行动、竞争与边界是否也需要被回应，避免只顾一边。注意把说得快当成已经说清楚或把每个分歧都当成较量是否让协商变窄；可以找一个能让两种需要同时参与的小任务，再先问对方需要细节还是整体框架，用一次具体互动检验调整是否合适，而非把角度当作事件预告。
      - heading: 教学示例 6：水星与火星四分相：协调两种需要
        knowledgeUnitId: astrology.aspect.mercury_mars.square
        paragraphs:
          - 你在思考、学习与沟通与行动、竞争与边界之间，可能体验到两种需要容易抢占同一时段，可以练习协调。命盘里的水星（象征思考、学习与沟通）与火星（象征行动、竞争与边界）形成四分相（两颗行星约九十度的关系），象征不同需求之间的摩擦；紧张感可提醒你重新排序，并不说明某个面向必须被压住。例如，讨论新方案时，先举一个对方熟悉的例子，再邀请对方复述理解，同时检查行动、竞争与边界是否也需要被回应，避免只顾一边。注意把说得快当成已经说清楚或把每个分歧都当成较量是否让协商变窄；可以把优先级与轮换时间说清楚，再先问对方需要细节还是整体框架，用一次具体互动检验调整是否合适，而非把角度当作事件预告。
      - heading: 你的练习与复盘
        paragraphs:
          - 选一条相位，记两端、角度与容许度，然后把互动写成两个需求。找一个可同时照顾两者的小安排，例如先说明计划再听反馈。复盘时记录是否改善沟通，不用某个相位替别人定性。不同网站清单不同时，先比较容许度和坐标设置。
  en:
    title: Understanding aspects as angular relationships
    description: An aspect is an angular relationship between two planets in the zodiac.
    sections:
      - heading: Understanding aspects as angular relationships
        paragraphs:
          - An aspect is an angular relationship between two planets in the zodiac. It describes how
            themes interact in a chart. Conjunctions, oppositions, trines, squares, and sextiles are
            major aspect types. An orb is the permitted distance from the exact angle that
            determines whether a relationship is recorded. The name does not describe an outcome in
            life. First identify the two planets and their angle; then explore the symbolic
            interaction.
      - heading: From structure to interpretation
        paragraphs:
          - Two planets on opposite sides of the zero-degree boundary can still be close together,
            so the shortest angular separation matters. A simple subtraction without wraparound can
            be misleading. Trines and sextiles can prompt questions about cooperation, while squares
            and oppositions can prompt questions about coordinating different needs. That is not a
            universal ranking of outcomes. Orb settings can change the aspect list, so preserve them
            when comparing charts. The selected examples examine Sun–Moon and communication-related
            relationships. Each aspect must belong to one identifiable pair; a Sun placement in one
            record and a Moon placement in another cannot be combined into an aspect that is not
            present. Read the interaction as a whole rather than adding independent planet
            descriptions. A practical question might be how to balance a chosen plan with a need for
            familiarity, or how to explain a decision while leaving room for another response. The
            chart cannot establish that a conflict exists in your current life. The symbolic
            vocabulary becomes useful only when you connect it with a real situation you can
            describe. If no such situation comes to mind, it is reasonable to leave the paragraph as
            a study example.
      - heading: How to work with the teaching examples
        paragraphs:
          - The examples below illustrate separate symbolic conditions. In each example, “you”
            addresses a hypothetical reader with that condition, not you personally. Some conditions
            are alternatives and cannot be combined into a single chart. Read the heading first,
            identify the idea being illustrated, and then notice how the explanation moves from a
            symbol to an ordinary situation and a modest suggestion. You do not need to identify
            with every example. A useful exercise is to rewrite one sentence as a question that you
            could observe in daily life. Keep a second note for anything that does not fit. This
            makes room for disagreement and stops a familiar description from becoming a label.
            These passages come from the same versioned editorial knowledge used by the reading
            engine; including them here demonstrates its writing method, not a calculation for a
            visitor. No birth information is required to study this page.
      - heading: 'Teaching example 1: Sun conjunction Moon'
        knowledgeUnitId: astrology.aspect.sun_moon.conjunction
        paragraphs:
          - 'You may recognize two needs becoming intertwined when the themes of identity and chosen
            direction intersect with emotional habits and comfort. Your chart links Sun — a symbol
            for identity and chosen direction — with Moon — a symbol for emotional habits and
            comfort — through a conjunction — a near alignment in zodiac longitude. This
            relationship brings two symbolic functions into close contact. They may start together
            while still needing different conditions; proximity alone does not describe an easy or
            difficult outcome. For example, after an unexpectedly busy evening, notice whether you
            reach for company, quiet, or a familiar routine before accepting another invitation,
            while asking whether identity and chosen direction also need attention. Watch for making
            visibility the only measure of worthwhile work, or for treating one mood as a permanent
            description of yourself, when one side dominates an exchange. Try this: name the two
            needs separately before deciding which one to address; check the response before
            deciding what to repeat; the angle is a symbolic prompt rather than a forecast of an
            event.'
      - heading: 'Teaching example 2: Sun square Moon'
        knowledgeUnitId: astrology.aspect.sun_moon.square
        paragraphs:
          - 'You may recognize two priorities competing for the same space when the themes of
            identity and chosen direction intersect with emotional habits and comfort. Your chart
            links Sun — a symbol for identity and chosen direction — with Moon — a symbol for
            emotional habits and comfort — through a square — an angular relationship near ninety
            degrees. This relationship frames friction between different priorities. A difficult
            choice can make those priorities visible without requiring you to reject one part of
            your experience. For example, after an unexpectedly busy evening, notice whether you
            reach for company, quiet, or a familiar routine before accepting another invitation,
            while asking whether identity and chosen direction also need attention. Watch for making
            visibility the only measure of worthwhile work, or for treating one mood as a permanent
            description of yourself, when one side dominates an exchange. Try this: make the order
            of priorities and a time to revisit them explicit; check the response before deciding
            what to repeat; the angle is a symbolic prompt rather than a forecast of an event.'
      - heading: 'Teaching example 3: Sun trine Moon'
        knowledgeUnitId: astrology.aspect.sun_moon.trine
        paragraphs:
          - 'You may recognize a familiar flow that benefits from practice when the themes of
            identity and chosen direction intersect with emotional habits and comfort. Your chart
            links Sun — a symbol for identity and chosen direction — with Moon — a symbol for
            emotional habits and comfort — through a trine — an angular relationship near one
            hundred and twenty degrees. This relationship suggests a comparatively familiar
            connection. Ease may remain unnoticed unless you use it; a comfortable response still
            benefits from practice and feedback. For example, after an unexpectedly busy evening,
            notice whether you reach for company, quiet, or a familiar routine before accepting
            another invitation, while asking whether identity and chosen direction also need
            attention. Watch for making visibility the only measure of worthwhile work, or for
            treating one mood as a permanent description of yourself, when one side dominates an
            exchange. Try this: notice one useful connection and practice it deliberately; check the
            response before deciding what to repeat; the angle is a symbolic prompt rather than a
            forecast of an event.'
      - heading: 'Teaching example 4: Sun opposition Moon'
        knowledgeUnitId: astrology.aspect.sun_moon.opposition
        paragraphs:
          - 'You may recognize two perspectives that need room in turn when the themes of identity
            and chosen direction intersect with emotional habits and comfort. Your chart links Sun —
            a symbol for identity and chosen direction — with Moon — a symbol for emotional habits
            and comfort — through a opposition — an angular relationship near one hundred and eighty
            degrees. This relationship highlights perspectives that can feel separated. An encounter
            may make one side more visible, without making the other person responsible for your
            entire inner tension. For example, after an unexpectedly busy evening, notice whether
            you reach for company, quiet, or a familiar routine before accepting another invitation,
            while asking whether identity and chosen direction also need attention. Watch for making
            visibility the only measure of worthwhile work, or for treating one mood as a permanent
            description of yourself, when one side dominates an exchange. Try this: give each
            perspective a defined opportunity to be heard; check the response before deciding what
            to repeat; the angle is a symbolic prompt rather than a forecast of an event.'
      - heading: 'Teaching example 5: Mercury sextile Mars'
        knowledgeUnitId: astrology.aspect.mercury_mars.sextile
        paragraphs:
          - 'You may recognize an opportunity for deliberate cooperation when the themes of learning
            and communication intersect with initiative and assertiveness. Your chart links Mercury
            — a symbol for learning and communication — with Mars — a symbol for initiative and
            assertiveness — through a sextile — an angular relationship near sixty degrees. This
            relationship suggests a possible route for cooperation. That route needs engagement;
            noticing compatible interests is different from taking the step that lets them work
            together. For example, when a deadline changes, notice whether you act, argue, or
            withdraw first, and whether that response helps other people understand your limits,
            while asking whether learning and communication also need attention. Watch for mistaking
            a fast explanation for a shared understanding, or for turning every disagreement into a
            contest that needs a winner, when one side dominates an exchange. Try this: choose a
            small task that lets both interests contribute; check the response before deciding what
            to repeat; the angle is a symbolic prompt rather than a forecast of an event.'
      - heading: 'Teaching example 6: Mercury square Mars'
        knowledgeUnitId: astrology.aspect.mercury_mars.square
        paragraphs:
          - 'You may recognize two priorities competing for the same space when the themes of
            learning and communication intersect with initiative and assertiveness. Your chart links
            Mercury — a symbol for learning and communication — with Mars — a symbol for initiative
            and assertiveness — through a square — an angular relationship near ninety degrees. This
            relationship frames friction between different priorities. A difficult choice can make
            those priorities visible without requiring you to reject one part of your experience.
            For example, when a deadline changes, notice whether you act, argue, or withdraw first,
            and whether that response helps other people understand your limits, while asking
            whether learning and communication also need attention. Watch for mistaking a fast
            explanation for a shared understanding, or for turning every disagreement into a contest
            that needs a winner, when one side dominates an exchange. Try this: make the order of
            priorities and a time to revisit them explicit; check the response before deciding what
            to repeat; the angle is a symbolic prompt rather than a forecast of an event.'
      - heading: Your practice and review
        paragraphs:
          - Choose one recorded aspect and note its two planets, angle, and orb. Translate the
            interaction into two possible needs, then identify a small arrangement that might
            accommodate both. For instance, you could explain a plan and explicitly invite feedback
            before setting the pace. Review whether this helped the conversation, rather than using
            an aspect to define someone else's character. If two websites provide different lists,
            compare their orb and coordinate settings first. You may find that the difference is
            technical, not interpretive. Keep counterexamples and unrelated experiences out of the
            aspect story. A good learning record shows where the pair was located, what question it
            suggested, and what information came from real life. This makes a complex chart easier
            to discuss without assigning more authority to a paragraph simply because it contains
            more terminology.
