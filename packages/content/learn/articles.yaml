  slug: reversed-cards
  zh:
    title: 正位逆位怎么读：方向不是好坏开关
    description: 正位与逆位（牌在抽取时的两个方向）是阅读设置，不是顺利与困难的开关。
    sections:
      - heading: 正位逆位怎么读：方向不是好坏开关
        paragraphs:
          - 正位与逆位（牌在抽取时的两个方向）是阅读设置，不是顺利与困难的开关。逆位可以提醒你观察主题如何受阻、内化或需要重新安排，具体读法仍看牌面、位置与问题。本项目允许关闭逆位；比较两次记录时，应先确认开关一致。
      - heading: 从结构到读法
        paragraphs:
          - 先读牌的基本主题，再看方向怎样调整该主题。不要遇到逆位就扩大担忧，也不要遇到正位就忽略现实准备。牌阵位置决定这张牌回答哪一部分；同一图像出现在行动位与结果位，问题重点不同。下面示例将注意力放在位置与组合，帮助你读出可讨论的差异。
      - heading: 怎样使用下面的教学示例
        paragraphs:
          - 下面各段示例展示不同盘面条件下的读法，段中的「你」指假设的示例读者，并非对你的个人判断。这些条件可以互不相容，不应拼成一份命盘。先辨认标题的主题，再观察正文如何从符号走到生活例子与建议。你可以把喜欢的句子改写成一个待观察的问题，也可以记录不符合经验的部分。
      - heading: 教学示例 1：核心指引：只观察一个最相关的主题
        knowledgeUnitId: tarot.positions.single.focus.a
        paragraphs:
          - 你可以只观察一个最相关的主题。牌位（这张牌承担的观察角度）让同一个画面在不同位置回答不同问题。单张指引只给当前问题一个观察角度；它无法展开其他人的立场或一整段时间线。例如，你想恢复学习节奏，可以从今日一项练习入手，而不把一个画面扩大成一年的评价。建议先写出一个已经知道的事实和一个仍待确认的条件，再读这张牌的正逆位与类别内容；如果图像暂时没有共鸣，可以保留问题而不强行套用。留意后续事实比寻找单一对应更有帮助，也可以把未确认的信息留给下一次实际交流。
      - heading: 教学示例 2：情境：先描述情境再决定怎么行动
        knowledgeUnitId: tarot.positions.three_sao.situation
        paragraphs:
          - 你可以先描述情境再决定怎么行动。牌位（这张牌承担的观察角度）让同一个画面在不同位置回答不同问题。情境位把问题放在资源、沟通与限制的背景中；它帮助你区分当前条件和希望出现的结果。例如，你准备组织一次聚会时，可以先确认参与者的空闲时间与可用空间。你可以与最相关的另一张牌比较，但不必让所有细节都讲成同一个故事；先辨认相同之处与差异，再挑出最值得在现实中问清楚的一件事。留意后续事实比寻找单一对应更有帮助，也可以把未确认的信息留给下一次实际交流。
      - heading: 教学示例 3：行动：选择自己能承担的一步
        knowledgeUnitId: tarot.positions.three_sao.action
        paragraphs:
          - 你可以选择自己能承担的一步。牌位（这张牌承担的观察角度）让同一个画面在不同位置回答不同问题。行动位讨论你可以调整的做法；它不替别人作决定，也不要求为了配合牌义而增加过多任务。例如，如果讨论常被打断，你可以先发一份简短议程，而不是要求所有人立刻改变。建议先写出一个已经知道的事实和一个仍待确认的条件，再读这张牌的正逆位与类别内容；如果图像暂时没有共鸣，可以保留问题而不强行套用。留意后续事实比寻找单一对应更有帮助，也可以把未确认的信息留给下一次实际交流。
      - heading: 教学示例 4：结果：用反馈观察行动后的发展
        knowledgeUnitId: tarot.positions.three_sao.outcome
        paragraphs:
          - 你可以用反馈观察行动后的发展。牌位（这张牌承担的观察角度）让同一个画面在不同位置回答不同问题。结果位讨论行动与条件一起作用后的可能反馈；它需要和情境、行动两张牌一起读，不能单独作定论。例如，尝试新的分工后，可以比较交接是否顺畅，再决定保持还是调整。不妨选取画面中一个最接近当前经验的细节，用它提出温和的问题；接着观察一次实际回应，把新的消息记下来，再判断是否需要改变原来的理解。留意后续事实比寻找单一对应更有帮助，也可以把未确认的信息留给下一次实际交流。
      - heading: 教学示例 5：让推进与耐心配合
        knowledgeUnitId: tarot.combination.chariot_strength
        paragraphs:
          - 你可以让推进与耐心配合。战车关注方向与协调，力量关注温和而坚定的回应；两张同现，可以让目标明确，同时减少把每次阻力都变成争胜的冲动。组合（两张特定牌同时出现的主题提示）不替代它们各自的牌位与正逆位读法。例如，推动计划时，先对齐目标，再耐心听取执行上的困难。试试将牌面主题改写成一个可以执行的小动作，注明开始与结束的时间；完成后比较自己的感受与事情的实际变化，让反馈决定下一步是否值得继续。也可以把这段联系记成问题，用下一次具体观察更新理解。
      - heading: 教学示例 6：用温和节奏支持希望
        knowledgeUnitId: tarot.combination.temperance_star
        paragraphs:
          - 你可以用温和节奏支持希望。节制关注适量混合与调整，星星关注信心与持续照料；两张同现，适合把较远的愿望落实为低负担而能重复的步骤。组合（两张特定牌同时出现的主题提示）不替代它们各自的牌位与正逆位读法。例如，重新开始写作时，每天留一小段时间，比偶尔熬夜写很久更容易观察进展。可以先给这项观察划定范围，只讨论你手上这一件事；把需要别人补充的信息留给直接交流，并在几天后回看自己的记录，不急着扩大为长期判断。
      - heading: 教学示例 7：让模糊印象逐步接受清楚表达
        knowledgeUnitId: tarot.combination.moon_sun
        paragraphs:
          - 你可以让模糊印象逐步接受清楚表达。月亮关注不完整信息，太阳关注可见与清楚分享；两张同现，适合从猜测走向可以交流的事实，但不宣称所有疑问已经解开。组合（两张特定牌同时出现的主题提示）不替代它们各自的牌位与正逆位读法。例如，群聊消息让你困惑时，向相关人问清背景，再重新说明自己的理解。建议把自己的期待、可用资源和仍不清楚的地方分别写下；如果其中一项暂时无法核实，就保留这份不确定，先做另一个能够得到回应的小步骤。
      - heading: 教学示例 8：让清楚判断使用可核实标准
        knowledgeUnitId: tarot.combination.justice_ace_swords
        paragraphs:
          - 你可以让清楚判断使用可核实标准。正义关注一致尺度，宝剑一（以直立剑象征清楚思路的牌）关注明确问题；两张同现，适合区分证据与说法，不延伸为法律结论。组合（两张特定牌同时出现的主题提示）不替代它们各自的牌位与正逆位读法。例如，评估两份提案时，写出相同的要求，再检查每份各满足了什么。建议把自己的期待、可用资源和仍不清楚的地方分别写下；如果其中一项暂时无法核实，就保留这份不确定，先做另一个能够得到回应的小步骤。
      - heading: 你的练习与复盘
        paragraphs:
          - 把同一张牌的正逆位说明并排写，圈出共同主题，再写两个不同的提问方向。每个方向都应能转为具体沟通或准备行动。实际抽取时保留方向记录，复盘时同时记下不适用的部分；不要通过反复重抽寻求更舒适的标签。
  en:
    title: Upright and reversed cards without a simple ranking
    description:
      Upright and reversed orientations are reading settings, not a switch between good and
      bad outcomes.
    sections:
      - heading: Upright and reversed cards without a simple ranking
        paragraphs:
          - Upright and reversed orientations are reading settings, not a switch between good and
            bad outcomes. A reversal can prompt questions about a theme being obstructed,
            internalized, or in need of rearrangement. Its interpretation still depends on the card,
            spread position, and question. This project lets you disable reversals. When comparing
            two study records, check that this setting stayed the same before attributing a
            difference to the symbolism.
      - heading: From structure to interpretation
        paragraphs:
          - "Begin with the card's basic theme and then ask how orientation changes the question you
            would pose about that theme. A reversal should not be used to amplify worry, and an
            upright card should not remove the need for preparation. Spread position determines
            which part of the question a card addresses. An image in an action position invites a
            different response from the same image in an outcome position. The examples below
            emphasize positional and combination reading so you can practice this distinction before
            adding orientation. They are separate conditions and do not constitute your draw. When
            reviewing a card page, compare its upright and reversed paragraphs for the shared theme
            first. Then identify what changes: the availability of a resource, the pace of a
            process, or the direction of attention. A constructive reversed interpretation supplies
            a way to clarify or adjust something, rather than leaving the reader with a discouraging
            label. You can also choose to study without reversals while learning the deck. A
            consistent setting and a clear question produce a record you can understand later.
            Changing the setting after a draw simply to obtain preferred wording makes that record
            harder to interpret."
      - heading: How to work with the teaching examples
        paragraphs:
          - The examples below illustrate separate symbolic conditions. In each example, “you”
            addresses a hypothetical reader with that condition, not you personally. Some conditions
            are alternatives and cannot be combined into a single chart. Read the heading first,
            identify the idea being illustrated, and then notice how the explanation moves from a
            symbol to an ordinary situation and a modest suggestion. You do not need to identify
            with every example. A useful exercise is to rewrite one sentence as a question that you
            could observe in daily life. Keep a second note for anything that does not fit. This
            makes room for disagreement and stops a familiar description from becoming a label.
            These passages come from the same versioned editorial knowledge used by the reading
            engine; including them here demonstrates its writing method, not a calculation for a
            visitor. No birth information is required to study this page.
      - heading: 'Teaching example 1: Focus: read the role first'
        knowledgeUnitId: tarot.positions.single.focus.a
        paragraphs:
          - You can concentrate on the one theme most relevant today. A single focus position
            supplies one lens, without separate places for other people’s perspectives or a
            timeline. For a return to study, the useful comparison is with today’s practice, not a
            verdict on the whole year. The small scale is useful because you can see what actually
            happens. Try noting your expectation before the session and one surprising detail
            afterwards. If interest grows, decide what amount of time you want to offer next; if it
            fades, that observation still helps. Leave other questions outside this exercise so the
            focus card gives you a clear point of attention rather than a reason to judge everything
            at once. You can review the note after an ordinary experience gives you more
            information.
      - heading: 'Teaching example 2: Situation: read the role first'
        knowledgeUnitId: tarot.positions.three_sao.situation
        paragraphs:
          - You can describe the setting before choosing a response. The situation position frames
            resources, communication and limits without confusing them with the outcome you want.
            For a gathering, available space and people’s actual free time belong here, before the
            enthusiasm of planning takes over. You can list what is fixed, what is negotiable and
            what has not yet been confirmed. For the gathering, that might mean a known room,
            flexible timing and an unanswered invitation. Read the card beside those three groups.
            It may highlight a point needing attention, but it does not move an unknown fact into
            the known column. Begin the action only when the necessary arrangement is clear enough
            for a comfortable attempt. You can review the note after an ordinary experience gives
            you more information.
      - heading: 'Teaching example 3: Action: read the role first'
        knowledgeUnitId: tarot.positions.three_sao.action
        paragraphs:
          - You can choose a response within your own responsibility. The action position concerns
            what you could change, rather than decisions assigned to someone else. If a discussion
            keeps losing focus, a short agenda is a practical experiment. You need not demand that
            everyone adopt a new personality. Try making the agenda brief enough that people can
            respond to it. One question, a proposed order and a finishing time may be sufficient.
            Notice whether the discussion changes after that adjustment; if it does not, ask what
            else participants need. The card can suggest an approach, but a useful action has
            limits. Choose a change you can carry out and evaluate without making other people's
            behaviour your responsibility. You can review the note after an ordinary experience
            gives you more information.
      - heading: 'Teaching example 4: Outcome: read the role first'
        knowledgeUnitId: tarot.positions.three_sao.outcome
        paragraphs:
          - You can review the outcome as feedback on an action in its setting. This position
            belongs beside situation and action, rather than functioning as an independent promise.
            After testing a division of work, compare how the handover felt and what was completed
            before deciding whether to keep it. Try agreeing in advance what a helpful handover
            would look like. Is the next person able to begin without another round of
            clarification? Do the instructions remain manageable? Check those points after a trial
            rather than deciding that one smooth day proves the whole arrangement. An outcome
            position offers a direction for evaluation. It can help you notice feedback that
            supports a revision as readily as feedback that supports continuing. You can review the
            note after an ordinary experience gives you more information.
      - heading: 'Teaching example 5: Two themes: chariot strength'
        knowledgeUnitId: tarot.combination.chariot_strength
        paragraphs:
          - You can move toward a clear goal with patience in the process. The Chariot concerns
            coordination and direction; Strength adds a steady response to pressure. When advancing
            a plan, begin by agreeing what the group is trying to do, then listen to practical
            difficulties. A firm direction can still allow a quieter conversation about how people
            will participate. A canopy of stars covers a chariot facing two contrasting sphinxes
            outside a city. A figure gently holds a lion near a garland of flowers beneath an
            infinity sign. Try asking each participant for one difficulty that might slow the shared
            plan. Hear the examples before assigning tasks. Coordination may improve when the target
            remains clear but the route allows a little more patience and adjustment.
      - heading: 'Teaching example 6: Two themes: temperance star'
        knowledgeUnitId: tarot.combination.temperance_star
        paragraphs:
          - You can support hope with a routine gentle enough to repeat. Temperance concerns
            proportion and adjustment, while the Star invites patient encouragement. Returning to
            writing might begin with a short daily interval rather than an occasional exhausting
            session. Notice whether the smaller rhythm helps you continue, so encouragement comes
            from lived progress as well as from an appealing idea. A winged figure pours water
            between cups with one foot on land and one in water. A figure pours water onto land and
            into a pool beneath a field of stars. Consider choosing a writing interval that remains
            possible on an ordinary busy day. Record whether it helps you return the following day.
            Sustainable practice gives encouragement somewhere to land, while leaving room for
            occasional changes in pace.
      - heading: 'Teaching example 7: Two themes: moon sun'
        knowledgeUnitId: tarot.combination.moon_sun
        paragraphs:
          - You can move from an unclear impression toward a direct exchange. The Moon highlights
            uncertainty and the Sun brings visibility and expression. Confusing messages in a group
            conversation may become easier to understand when you ask for their context, then say
            what you understood. The pair supports clarification without announcing that every
            unknown has already disappeared. Moonlight falls on a winding path between towers with
            two animals and a creature at the pool. A child rides a white horse beneath a large sun
            beside sunflowers and a bright banner. Consider repeating the confirmed context in your
            own words and asking whether you understood it correctly. This lets the conversation
            resolve a concrete uncertainty. A clearer exchange can coexist with other questions that
            still need time or information.
      - heading: 'Teaching example 8: Two themes: justice ace swords'
        knowledgeUnitId: tarot.combination.justice_ace_swords
        paragraphs:
          - You can bring a precise question to a consistent standard. Justice concerns fair
            comparison and the Ace of Swords clarifies a line of thought. When evaluating two
            proposals, list the same requirements and check how each addresses them. This supports
            ordinary judgement without turning the reading into a legal conclusion or accepting an
            impressive statement as evidence on its own. A seated figure holds an upright sword and
            balanced scales between two pillars. A hand holds an upright sword through a crown above
            a mountainous landscape. Consider writing one requirement as a question each proposal
            can answer. If an answer is absent, mark it as missing instead of treating confidence as
            proof. The comparison becomes fairer when the same gap receives the same attention on
            both sides.
      - heading: Your practice and review
        paragraphs:
          - Write the upright and reversed explanations for one card side by side. Circle the theme
            they share and formulate two different questions about it. Each question should lead to
            a conversation or preparation step you can actually undertake. During a real draw,
            preserve the orientation in your record and note at review which parts were
            inapplicable. Avoid repeated redraws in search of a more comfortable label. If a reading
            feels unclear, check whether the question or position was too broad before blaming the
            orientation. You might discover that a practical clarification, such as identifying who
            must respond to a request, is more useful than another symbolic layer. This exercise
            lets you study reversals as a flexible extension of image reading while keeping the
            people involved and the facts of the situation at the center of your decision.
