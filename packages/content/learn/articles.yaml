- system: ziwei
  slug: twelve-palaces
  zh:
    title: 紫微十二宫：先学会定位问题
    description: 十二宫（按生活主题划分的位置）是紫微斗数的阅读地图。
    sections:
      - heading: 紫微十二宫：先学会定位问题
        paragraphs:
          - 十二宫（按生活主题划分的位置）是紫微斗数的阅读地图。命宫观察整体取向，其他宫位对应关系、事业、资源与日常背景，不是十二份独立判词。先找到你想讨论的主题，再看相关宫位与对宫，比从某颗星的名称开始更清楚。出生时间未知时，不能可靠地安宫，本项目不补造紫微盘。
      - heading: 从结构到读法
        paragraphs:
          - 命宫与身宫（实践重心的观察位置）不同，宫位与星曜也不同。空宫指没有指定主星，不是生活主题不存在。读法还会参考对宫与三方四正（相关宫位组合），不能把一格单独放大。宫名是传统分类，涉及家庭与伴侣时，应结合你的实际关系形式理解，不用它给他人贴标签。
      - heading: 怎样使用下面的教学示例
        paragraphs:
          - 下面各段示例展示不同盘面条件下的读法，段中的「你」指假设的示例读者，并非对你的个人判断。这些条件可以互不相容，不应拼成一份命盘。先辨认标题的主题，再观察正文如何从符号走到生活例子与建议。你可以把喜欢的句子改写成一个待观察的问题，也可以记录不符合经验的部分。
      - heading: 教学示例 1：身宫在命宫：把自我表达放回日常
        knowledgeUnitId: ziwei.body.life
        paragraphs:
          - 你持续投入的事情，可能较容易围绕自我表达展开。身宫（传统上观察实际行动与后续投入的辅助位置）在本盘与命宫（观察你怎样认识自己和回应日常处境的领域）重合；它补充自我描述，不取代其他生活领域。比如，接到陌生任务时，先观察自己是急于定方向，还是先询问细节。你可以回顾自己是否经常主动照顾这部分安排，还是只有近期环境需要如此。别用一个盘中标签覆盖自己在不同场合的变化。建议记录一次选择的理由，过几天看看是否仍认可，先留意一段时间内自己的投入与感受，再决定要保留哪些做法；人生侧重会受到选择、经历和现实责任影响，不需要把全部精力压在一个位置上。
      - heading: 教学示例 2：身宫在官禄宫：把工作组织放回日常
        knowledgeUnitId: ziwei.body.career
        paragraphs:
          - 你持续投入的事情，可能较容易围绕工作组织展开。身宫（传统上观察实际行动与后续投入的辅助位置）在本盘与官禄宫（观察任务承担、职业学习与工作方法的领域）重合；它补充自我描述，不取代其他生活领域。比如，团队开始一个新项目时，你可以观察自己喜欢确定目标、研究方法、核对细节还是协调交接。你可以回顾自己是否经常主动照顾这部分安排，还是只有近期环境需要如此。建议从现有任务里挑一处流程，和同事约定可检查的改进，先留意一段时间内自己的投入与感受，再决定要保留哪些做法；人生侧重会受到选择、经历和现实责任影响，不需要把全部精力压在一个位置上。
      - heading: 教学示例 3：身宫在福德宫：把内在满足放回日常
        knowledgeUnitId: ziwei.body.wellbeing
        paragraphs:
          - 你持续投入的事情，可能较容易围绕内在满足展开。身宫（传统上观察实际行动与后续投入的辅助位置）在本盘与福德宫（观察休闲偏好、精神空间与获得满足的方式的领域）重合；它补充自我描述，不取代其他生活领域。比如，周末没有待办催促时，留意你自然选择阅读、独处、见朋友还是做一个有手感的小作品。你可以回顾自己是否经常主动照顾这部分安排，还是只有近期环境需要如此。休息不需要变成绩效项目，喜欢的事也可以没有产出，不必用别人的标准来评价。建议保留一段不交作业的兴趣时间，结束后记录感受，先留意一段时间内自己的投入与感受，再决定要保留哪些做法；人生侧重会受到选择、经历和现实责任影响，不需要把全部精力压在一个位置上。
      - heading: 教学示例 4：命宫无主星：从互动寻找参照
        knowledgeUnitId: ziwei.empty.life
        paragraphs:
          - 你在自我表达上，可以多保留一个比较视角。命宫（观察你怎样认识自己和回应日常处境的领域）在本盘无主星（这个位置没有十四主星中的任何一颗），传统上参考对宫（十二宫环上相隔六格的位置）的主星来辅助理解。比如，接到陌生任务时，先观察自己是急于定方向，还是先询问细节。别用一个盘中标签覆盖自己在不同场合的变化。建议记录一次选择的理由，过几天看看是否仍认可，并记录外部安排改变时自己的回应是否也有变化。以实际反馈修正比较，比急着用一个标签概括自己更有空间。
      - heading: 教学示例 5：夫妻宫无主星：从互动寻找参照
        knowledgeUnitId: ziwei.empty.spouse
        paragraphs:
          - 你在亲密沟通上，可以多保留一个比较视角。夫妻宫（观察亲密关系中的协商方式与期待的领域）在本盘无主星（这个位置没有十四主星中的任何一颗），传统上参考对宫（十二宫环上相隔六格的位置）的主星来辅助理解。比如，你与伴侣或正在了解的人安排周末时，可以先分别说出需要安静、交流还是一起做事。建议把一个期待改写成对方能回应的具体请求，并记录外部安排改变时自己的回应是否也有变化。以实际反馈修正比较，比急着用一个标签概括自己更有空间。
      - heading: 教学示例 6：财帛宫无主星：从互动寻找参照
        knowledgeUnitId: ziwei.empty.wealth
        paragraphs:
          - 你在资源安排上，可以多保留一个比较视角。财帛宫（观察日常收支、时间成本与资源分配的习惯的领域）在本盘无主星（这个位置没有十四主星中的任何一颗），传统上参考对宫（十二宫环上相隔六格的位置）的主星来辅助理解。比如，准备参加一门课程时，把费用、通勤和练习时间放在同一张清单上，再看这份投入是否适合现在的生活。象征上的资源倾向不代表收入水平，预算仍要依据实际收支和已有承诺。建议选一项可调整的日常开支，记录用途与满意度，并记录外部安排改变时自己的回应是否也有变化。以实际反馈修正比较，比急着用一个标签概括自己更有空间。
      - heading: 教学示例 7：官禄宫无主星：从互动寻找参照
        knowledgeUnitId: ziwei.empty.career
        paragraphs:
          - 你在工作组织上，可以多保留一个比较视角。官禄宫（观察任务承担、职业学习与工作方法的领域）在本盘无主星（这个位置没有十四主星中的任何一颗），传统上参考对宫（十二宫环上相隔六格的位置）的主星来辅助理解。比如，团队开始一个新项目时，你可以观察自己喜欢确定目标、研究方法、核对细节还是协调交接。这份解读讨论工作风格，不替你指定职业；现实能力、兴趣和岗位条件需要一起考虑。建议从现有任务里挑一处流程，和同事约定可检查的改进，并记录外部安排改变时自己的回应是否也有变化。以实际反馈修正比较，比急着用一个标签概括自己更有空间。
      - heading: 你的练习与复盘
        paragraphs:
          - 在纸上写「我要理解什么」「哪个宫位讨论它」「还要看哪里」三栏。选一个主题，先定位宫名，再打开一个术语解释。若宫位没有主星，先查相关结构，不自行填入星曜。将最有帮助的提示变成一个可讨论的问题，并把你与他人的真实回应作为复盘材料。
  en:
    title: Finding your way around the twelve palaces
    description:
      The twelve palaces are a reading map in Zi Wei Dou Shu (紫微斗数, zǐ wēi dǒu shù — the star
      and palace tradition).
    sections:
      - heading: Finding your way around the twelve palaces
        paragraphs:
          - The twelve palaces are a reading map in Zi Wei Dou Shu (紫微斗数, zǐ wēi dǒu shù — the star
            and palace tradition). Each palace organizes a life theme. The Life Palace supplies an
            overall viewpoint, while other palaces provide contexts for relationships, work,
            resources, and routines. They are connected parts of a diagram, not twelve independent
            verdicts. For a first reading, find the theme you want to explore and then inspect its
            related positions. Starting with a striking star name can lead you to overlook which
            question that star is being used to discuss. A known birth time is needed to place these
            palaces; the project does not invent a Zi Wei chart when the hour is missing.
      - heading: From structure to interpretation
        paragraphs:
          - Separate a palace from a star. The palace gives the topic; the star supplies a symbolic
            vocabulary within that topic. Also distinguish the Life Palace (命宫, mìng gōng — the
            overall orientation) from the Body Palace (身宫, shēn gōng — an emphasis in lived
            practice). Their labels do not describe physical organs. An empty palace means no
            designated major star occupies that position. It does not mean a life topic is absent or
            that the reader lacks something. Related positions, including the opposite palace and
            the linked palace group, provide context. The traditional palace names reflect a
            historical classification of life; they should be used flexibly for a person's actual
            family structure, partnerships, and responsibilities. For example, a relationship theme
            might prompt a discussion of shared expectations rather than an assumption about
            marriage. Keep star placement, interpretive theme, and actual experience in separate
            notes. The teaching examples below show how palace context changes the questions a
            reader might ask. Their conditions are separate and are not a claim that all these
            palace patterns belong to your chart.
      - heading: How to work with the teaching examples
        paragraphs:
          - The examples below illustrate separate symbolic conditions. In each example, “you”
            addresses a hypothetical reader with that condition, not you personally. Some conditions
            are alternatives and cannot be combined into a single chart. Read the heading first,
            identify the idea being illustrated, and then notice how the explanation moves from a
            symbol to an ordinary situation and a modest suggestion. You do not need to identify
            with every example. A useful exercise is to rewrite one sentence as a question that you
            could observe in daily life. Keep a second note for anything that does not fit. This
            makes room for disagreement and stops a familiar description from becoming a label.
            These passages come from the same versioned editorial knowledge used by the reading
            engine; including them here demonstrates its writing method, not a calculation for a
            visitor. No birth information is required to study this page.
      - heading: 'Teaching example 1: Body Palace in Life Palace: attention through action'
        knowledgeUnitId: ziwei.body.life
        paragraphs:
          - You may recognize a recurring investment of attention in your everyday identity. The
            Body Palace (shēn gōng — an additional perspective on action and sustained involvement)
            coincides here with the Life Palace (mìng gōng), the area for how you describe yourself
            and respond to ordinary situations. This adds a question about what you actually spend
            time doing alongside the reading of identity. When a new task arrives, notice whether
            you first seek a direction, gather details or ask what others need. Look back at whether
            this concern recurs across different circumstances or mostly reflects your present
            responsibilities. Your response at home may differ from your response at work; leave
            room for that difference. Try to keep a short note on why you chose an approach and
            revisit it a few days later. Review the effort and satisfaction involved after a few
            attempts. A symbolic emphasis is only one perspective on your commitments; changing
            responsibilities and deliberate choices can shift where your attention goes.
      - heading: 'Teaching example 2: Body Palace in Career Palace: attention through action'
        knowledgeUnitId: ziwei.body.career
        paragraphs:
          - You may recognize a recurring investment of attention in organizing work. The Body
            Palace ( shēn gōng — an additional perspective on action and sustained involvement)
            coincides here with the Career Palace (guān lù gōng), the area for how you take
            responsibility, learn professionally and arrange a task. This adds a question about what
            you actually spend time doing alongside the reading of identity. At the beginning of a
            project, notice whether you naturally clarify the aim, research a method, check details
            or coordinate handovers. Look back at whether this concern recurs across different
            circumstances or mostly reflects your present responsibilities. The reading explores a
            working style without assigning you a profession; skills, interests and the conditions
            of a role matter together. Try to choose one part of an existing workflow and agree with
            a colleague on an observable improvement. Review the effort and satisfaction involved
            after a few attempts. A symbolic emphasis is only one perspective on your commitments;
            changing responsibilities and deliberate choices can shift where your attention goes.
      - heading: 'Teaching example 3: Body Palace in Wellbeing Palace: attention through action'
        knowledgeUnitId: ziwei.body.wellbeing
        paragraphs:
          - You may recognize a recurring investment of attention in your inner sources of
            satisfaction. The Body Palace (shēn gōng — an additional perspective on action and
            sustained involvement) coincides here with the Wellbeing Palace (fú dé gōng), the area
            for the interests, mental space and leisure practices that feel restorative. This adds a
            question about what you actually spend time doing alongside the reading of identity.
            During a weekend without urgent tasks, notice whether you gravitate toward reading,
            quiet time, company or making something tangible. Look back at whether this concern
            recurs across different circumstances or mostly reflects your present responsibilities.
            Leisure does not need to become another performance task; an activity may be valuable
            without producing a visible result. Try to protect a little time for an interest without
            a deliverable and note how you feel afterward. Review the effort and satisfaction
            involved after a few attempts. A symbolic emphasis is only one perspective on your
            commitments; changing responsibilities and deliberate choices can shift where your
            attention goes.
      - heading: 'Teaching example 4: No major star in Life Palace: compare the surrounding context'
        knowledgeUnitId: ziwei.empty.life
        paragraphs:
          - You can leave room for a broader comparison when considering your everyday identity. The
            Life Palace (mìng gōng) — the chart area for how you describe yourself and respond to
            ordinary situations — contains none of the fourteen major stars. In the traditional
            method, the opposite palace, six positions away on the twelve area ring, provides an
            additional perspective. Borrowing a star is a way to compare relationships within the
            chart, not a direct transfer of every attribute or an indication of missing ability.
            When a new task arrives, notice whether you first seek a direction, gather details or
            ask what others need. Your response at home may differ from your response at work; leave
            room for that difference. Try to keep a short note on why you chose an approach and
            revisit it a few days later. Notice whether your response changes when the surrounding
            arrangement changes. A record of those differences can help you assess an interpretation
            more carefully than choosing a fixed label from the empty position alone.
      - heading: 'Teaching example 5: No major star in Spouse Palace: compare the surrounding context'
        knowledgeUnitId: ziwei.empty.spouse
        paragraphs:
          - You can leave room for a broader comparison when considering negotiation in close
            relationships. The Spouse Palace (fū qī gōng) — the chart area for the expectations and
            conversations that shape an intimate partnership — contains none of the fourteen major
            stars. In the traditional method, the opposite palace, six positions away on the twelve
            area ring, provides an additional perspective. Borrowing a star is a way to compare
            relationships within the chart, not a direct transfer of every attribute or an
            indication of missing ability. While arranging a weekend with a partner or someone you
            are getting to know, compare what each person needs from the time together. A symbolic
            relationship theme cannot decide compatibility or tell you what kind of relationship to
            pursue. Try to turn one expectation into a request the other person can clearly respond
            to. Notice whether your response changes when the surrounding arrangement changes. A
            record of those differences can help you assess an interpretation more carefully than
            choosing a fixed label from the empty position alone.
      - heading: 'Teaching example 6: No major star in Wealth Palace: compare the surrounding context'
        knowledgeUnitId: ziwei.empty.wealth
        paragraphs:
          - You can leave room for a broader comparison when considering managing everyday
            resources. The Wealth Palace (cái bó gōng) — the chart area for habits around ordinary
            spending, time costs and resource allocation — contains none of the fourteen major
            stars. In the traditional method, the opposite palace, six positions away on the twelve
            area ring, provides an additional perspective. Borrowing a star is a way to compare
            relationships within the chart, not a direct transfer of every attribute or an
            indication of missing ability. Before joining a course, list its fee, travel demands and
            practice hours together rather than judging the cost from the price alone. A resource
            symbol does not measure your income; practical plans depend on actual costs, available
            funds and existing commitments. Try to review one flexible expense and note what it
            delivered compared with what you expected. Notice whether your response changes when the
            surrounding arrangement changes. A record of those differences can help you assess an
            interpretation more carefully than choosing a fixed label from the empty position alone.
      - heading: 'Teaching example 7: No major star in Career Palace: compare the surrounding context'
        knowledgeUnitId: ziwei.empty.career
        paragraphs:
          - You can leave room for a broader comparison when considering organizing work. The Career
            Palace (guān lù gōng) — the chart area for how you take responsibility, learn
            professionally and arrange a task — contains none of the fourteen major stars. In the
            traditional method, the opposite palace, six positions away on the twelve area ring,
            provides an additional perspective. Borrowing a star is a way to compare relationships
            within the chart, not a direct transfer of every attribute or an indication of missing
            ability. At the beginning of a project, notice whether you naturally clarify the aim,
            research a method, check details or coordinate handovers. The reading explores a working
            style without assigning you a profession; skills, interests and the conditions of a role
            matter together. Try to choose one part of an existing workflow and agree with a
            colleague on an observable improvement. Notice whether your response changes when the
            surrounding arrangement changes. A record of those differences can help you assess an
            interpretation more carefully than choosing a fixed label from the empty position alone.
      - heading: Your practice and review
        paragraphs:
          - 'Make a three-column note: the question you want to understand, the palace that
            organizes it, and the additional positions needed for context. Choose one topic, such as
            how to divide a shared responsibility, and stop after locating its palace and one
            related term. If a palace has no major star, record that fact and inspect the connected
            structure instead of filling the gap yourself. After reading an example, translate its
            theme into a question you could discuss with someone involved. Ask how each person
            understands the responsibility and what practical arrangement might help. Their answers
            matter more than whether a traditional label sounds familiar. Revisit the note after the
            discussion and record which part of the symbolic prompt was useful, irrelevant, or
            unclear. You can learn the map gradually without treating every palace as an obligation
            to analyze every area of your life at once.'
