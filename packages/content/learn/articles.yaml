            分；请把它和其余七项一起看，不能据此判断个人价值、健康或关系结果。合盘提供一种讨论差异的语言，结果需要与真实经历一起看。建议安排一次轻松的共同活动，观察彼此喜欢怎样分配任务。双方可以先选一个共同尝试的小动作。相处经验、个人边界和当下意愿比单项分数更重要。记录一次尝试后的感受，并允许随着生活变化重新调整安排。
