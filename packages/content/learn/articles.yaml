  slug: stars-and-transformations
  zh:
    title: 主星与四化：读懂主题如何转向
    description: 主星（宫位中的主要象征）提供主题，四化（禄、权、科、忌的转化标记）提供观察主题如何展开的角度。
    sections:
      - heading: 主星与四化：读懂主题如何转向
        paragraphs:
          - 主星（宫位中的主要象征）提供主题，四化（禄、权、科、忌的转化标记）提供观察主题如何展开的角度。星名并不等于天文行星，四化也不是对人的等级评分。先认主星和位置，再看转化来自哪一层，避免把不同流派的表格混为一谈。
      - heading: 从结构到读法
        paragraphs:
          - 禄可作为资源与支持的提问方向，权提醒责任与行动，科关注表达与可见性，忌提示需要澄清的卡点；都要落到具体宫位。本项目标注四化所用规则，生年与运限的标记应分层读。下面主星示例展示不同处境下的表达方式，辅助你理解「主题」而不是背固定人物画像。
      - heading: 怎样使用下面的教学示例
        paragraphs:
          - 下面各段示例展示不同盘面条件下的读法，段中的「你」指假设的示例读者，并非对你的个人判断。这些条件可以互不相容，不应拼成一份命盘。先辨认标题的主题，再观察正文如何从符号走到生活例子与建议。你可以把喜欢的句子改写成一个待观察的问题，也可以记录不符合经验的部分。
      - heading: 教学示例 1：紫微坐命：找到发挥的场景
        knowledgeUnitId: ziwei.life.zi_wei.supported.a
        paragraphs:
          - 紫微（代表统筹方向与承担责任的主星）在命宫（观察性格与日常回应的领域），并处于庙旺、得利（传统亮度中较易发挥的一组），象征表达渠道相对顺手。你倾向先建立整体框架，再把事情交给合适的人推进。例如，你召集一次讨论时，可能先提出共同目标，再邀请不同的人负责议题和记录；若所有人都等你拍板，不妨明确哪些部分可以由伙伴独立决定。如果总把最后决定留给自己，别人可能没有充分表达的空间。可以先公开判断标准，再邀请别人指出一个遗漏，把这次尝试的感受和结果放在一起复盘；亮度描述象征的表现条件，不是能力等级，环境与练习仍有调整空间。
      - heading: 教学示例 2：天机坐命：给表达留出条件
        knowledgeUnitId: ziwei.life.tian_ji.restrained.a
        paragraphs:
          - 你容易看见流程里的细小差异，并想出几种替代办法。例如，你发现每天都要重复整理同一种资料，想把流程缩成几步；可以先拿一份材料试行，再记录有没有遗漏，不必在第一天就重做全部安排。频繁修改路线容易消耗执行时间，思考也需要一个停点。不妨给每次比较设定期限，只验证一个最关键的假设，把这次尝试的感受和结果放在一起复盘；亮度描述象征的表现条件，不是能力等级，环境与练习仍有调整空间。
      - heading: 教学示例 3：太阳坐命：找到发挥的场景
        knowledgeUnitId: ziwei.life.tai_yang.supported.a
        paragraphs:
          - 太阳（代表公开表达与主动付出的主星）在命宫（观察性格与日常回应的领域），并处于庙旺、得利（传统亮度中较易发挥的一组），象征表达渠道相对顺手。你往往愿意把信息说清楚，也愿意先向别人伸出援手。例如，团队需要有人解释新规则时，你可能主动把背景和步骤讲清楚；说明结束后，询问大家能否找到要做的第一步，比持续讲更多信息更便于参与。持续回应所有人的需求，容易压缩自己恢复精力的时间。可以在答应帮忙前说清楚可投入的时间，把这次尝试的感受和结果放在一起复盘；亮度描述象征的表现条件，不是能力等级，环境与练习仍有调整空间。
      - heading: 教学示例 4：武曲坐命：给表达留出条件
        knowledgeUnitId: ziwei.life.wu_qu.restrained.a
        paragraphs:
          - 武曲（代表执行纪律与资源核算的主星）在命宫（观察性格与日常回应的领域），并处于平、不或陷（传统亮度中需要更多情境支持的一组），提示表达方式较受环境影响。你倾向通过可检查的结果建立信任，喜欢把责任和数量讲明白。例如，你接手一个物料清单时，先核对数量、用途与责任人，能让交接更清楚；若对方仍不放心，不妨问问他担心的是缺漏、时间还是沟通方式。只关注效率时，别人可能听不到你在意他们的感受。建议在讨论数量之后，再问一句对方最在意什么，把这次尝试的感受和结果放在一起复盘；亮度描述象征的表现条件，不是能力等级，环境与练习仍有调整空间。
      - heading: 教学示例 5：天同坐命：找到发挥的场景
        knowledgeUnitId: ziwei.life.tian_tong.supported.a
        paragraphs:
          - 你认识自己的一个入口，是观察舒适感与温和相处如何出现在日常选择里。天同（代表舒适感与温和相处的主星）在命宫（观察性格与日常回应的领域），并处于庙旺、得利（传统亮度中较易发挥的一组），象征表达渠道相对顺手。你容易留意气氛是否轻松，愿意给别人一个缓和的台阶。例如，你希望让第一次见面的伙伴放松，会先从轻松话题聊起；当大家熟悉之后，再说清楚活动要怎样开始，舒适感就能和实际推进一起保留。为了维持舒服而回避困难话题，问题可能留到更忙的时候。可以先处理一件小而具体的事情，再安排休息，把这次尝试的感受和结果放在一起复盘；亮度描述象征的表现条件，不是能力等级，环境与练习仍有调整空间。
      - heading: 教学示例 6：廉贞坐命：给表达留出条件
        knowledgeUnitId: ziwei.life.lian_zhen.restrained.a
        paragraphs:
          - 你认识自己的一个入口，是观察边界意识与价值选择如何出现在日常选择里。廉贞（代表边界意识与价值选择的主星）在命宫（观察性格与日常回应的领域），并处于平、不或陷（传统亮度中需要更多情境支持的一组），提示表达方式较受环境影响。你倾向认真分辨什么值得投入，也在意做法是否符合自己的原则。例如，合作邀请与你重视的做法有差距时，你可能想先划清界限；把不能接受的环节说具体，再说明可以参与哪一部分，比直接评价整个方案更便于协商。当立场和情绪混在一起，讨论容易变成对人的评价。不妨把事实、感受和请求分别写下来，把这次尝试的感受和结果放在一起复盘；亮度描述象征的表现条件，不是能力等级，环境与练习仍有调整空间。
      - heading: 教学示例 7：天府坐命：找到发挥的场景
        knowledgeUnitId: ziwei.life.tian_fu.supported.a
        paragraphs:
          - 你认识自己的一个入口，是观察储备意识与稳定管理如何出现在日常选择里。天府（代表储备意识与稳定管理的主星）在命宫（观察性格与日常回应的领域），并处于庙旺、得利（传统亮度中较易发挥的一组），象征表达渠道相对顺手。你往往先确认手里的资源，再考虑怎样让日常运转更稳。例如，你为持续活动保留材料与记录，会先看看已有资源能支持多久；若新参与者有不同需求，不妨盘点哪些安排可以更新，让积累也能接住新的使用方式。对熟悉安排过于放心，可能错过调整分工的机会。建议定期盘点一次保留、更新和放下的事项，把这次尝试的感受和结果放在一起复盘；亮度描述象征的表现条件，不是能力等级，环境与练习仍有调整空间。
      - heading: 你的练习与复盘
        paragraphs:
          - 选一颗已定位的主星，写下宫位和四化来源。把读到的主题改写成「哪些支持已存在」「哪些责任需确认」等问题。若读到卡点，先找可澄清的沟通环节，避免让一个标记概括整段关系。与其他排盘对照时，记录流派差异，不把两种规则叠加。
  en:
    title: Major stars and the four transformations
    description:
      Major stars supply themes, while the four transformations describe ways those themes
      are emphasized.
    sections:
      - heading: Major stars and the four transformations
        paragraphs:
          - Major stars supply themes, while the four transformations describe ways those themes are
            emphasized. In Zi Wei terminology, a star name is a symbolic placement, not necessarily
            an astronomical planet. The transformations are Prosperity, Power, Fame, and Obstacle,
            conventionally associated with Lu, Quan, Ke, and Ji. They are not a ranking of people.
            Start with the major star and its palace, then ask which layer supplied the
            transformation. This order makes it easier to see what the interpretation is based on
            and to avoid combining tables from different schools into a single explanation.
      - heading: From structure to interpretation
        paragraphs:
          - A useful beginner translation treats Lu as a question about support and access, Quan as
            a question about responsibility and action, Ke as a question about visibility and
            presentation, and Ji as a question about a point needing clarification. These are
            reading prompts, not interchangeable event predictions. A transformation has to be
            attached to an identifiable star and palace. Birth-year transformations and period
            transformations belong to different layers, so record their source. The project
            discloses the transformation rules used in the report; another school's table may
            produce a different assignment. A difference in method should be investigated before
            being interpreted as a difference in a person's life. The major-star examples below
            contrast ways a theme can be expressed under different surrounding conditions. Their
            purpose is to show why a short star label is insufficient. You might recognize a
            planning habit in one paragraph and a communication habit in another, but that
            recognition does not establish either placement in your chart. Check the technical
            position first. A constructive reading keeps the symbolic theme broad enough for
            reflection and the practical suggestion specific enough to discuss or try.
      - heading: How to work with the teaching examples
        paragraphs:
          - The examples below illustrate separate symbolic conditions. In each example, “you”
            addresses a hypothetical reader with that condition, not you personally. Some conditions
            are alternatives and cannot be combined into a single chart. Read the heading first,
            identify the idea being illustrated, and then notice how the explanation moves from a
            symbol to an ordinary situation and a modest suggestion. You do not need to identify
            with every example. A useful exercise is to rewrite one sentence as a question that you
            could observe in daily life. Keep a second note for anything that does not fit. This
            makes room for disagreement and stops a familiar description from becoming a label.
            These passages come from the same versioned editorial knowledge used by the reading
            engine; including them here demonstrates its writing method, not a calculation for a
            visitor. No birth information is required to study this page.
      - heading: 'Teaching example 1: Zǐ Wēi: finding conditions that suit you'
        knowledgeUnitId: ziwei.life.zi_wei.supported.a
        paragraphs:
          - You may find a useful starting point in setting direction and holding responsibility. Zǐ
            Wēi names a major star associated with that approach. It appears in the Life Palace
            (mìng gōng — the area for everyday identity) within the supported brightness group,
            which includes miao, wang, de and li — traditional labels for a comparatively accessible
            expression. You often look for a coherent direction before deciding who should carry
            each part of a task. Imagine coordinating a volunteer rota. You might first explain the
            purpose, then ask people to own the intervals they can sustain. Notice whether the group
            can make an ordinary adjustment without returning every decision to you. Keeping every
            final decision for yourself can make capable people feel unheard. Try explaining your
            decision criteria before asking someone to challenge one assumption. You can compare the
            original impulse with the response from others afterward. Brightness describes symbolic
            conditions of expression, so take this as a prompt for adjusting your surroundings and
            practice rather than a rating of personal ability.
      - heading: 'Teaching example 2: Tiān Jī: finding conditions that suit you'
        knowledgeUnitId: ziwei.life.tian_ji.restrained.a
        paragraphs:
          - You may find a useful starting point in adaptive planning and practical ingenuity. Tiān
            Jī names a major star associated with that approach. It appears in the Life Palace (mìng
            gōng — the area for everyday identity) within the restrained brightness group, which
            includes ping, bu and xian — labels suggesting greater dependence on context and
            support. You may notice small inefficiencies and quickly imagine several workable
            alternatives. Picture comparing two routes for a recurring journey. Your interest in
            alternatives can be useful if you decide which practical question matters most, such as
            reliability or preparation time, and test that question on a manageable trip. Repeatedly
            redesigning a workable plan can consume the time needed to test it. Consider setting a
            decision deadline and testing the most important unknown first. You can compare the
            original impulse with the response from others afterward. Brightness describes symbolic
            conditions of expression, so take this as a prompt for adjusting your surroundings and
            practice rather than a rating of personal ability.
      - heading: 'Teaching example 3: Tài Yáng: finding conditions that suit you'
        knowledgeUnitId: ziwei.life.tai_yang.supported.a
        paragraphs:
          - You may find a useful starting point in visible contribution and outward engagement. Tài
            Yáng names a major star associated with that approach. It appears in the Life Palace
            (mìng gōng — the area for everyday identity) within the supported brightness group,
            which includes miao, wang, de and li — traditional labels for a comparatively accessible
            expression. You may feel useful when you share what you know and make a contribution
            people can see. Think of introducing a newcomer to a neighborhood activity. You may
            offer an explanation before being asked. A useful check is whether your welcome leaves
            room for them to ask questions and decide how much participation suits them. Being
            available to everyone can leave little room for your own priorities or quiet recovery.
            Try stating how much time you can offer before agreeing to help. You can compare the
            original impulse with the response from others afterward. Brightness describes symbolic
            conditions of expression, so take this as a prompt for adjusting your surroundings and
            practice rather than a rating of personal ability.
      - heading: 'Teaching example 4: Wǔ Qū: finding conditions that suit you'
        knowledgeUnitId: ziwei.life.wu_qu.restrained.a
        paragraphs:
          - You may find a useful starting point in disciplined execution and resource accounting.
            Wǔ Qū names a major star associated with that approach. It appears in the Life Palace
            (mìng gōng — the area for everyday identity) within the restrained brightness group,
            which includes ping, bu and xian — labels suggesting greater dependence on context and
            support. You often build trust through measurable results, clear commitments and careful
            use of resources. Picture setting up a shared equipment checkout. Clear quantities and
            return dates may feel reassuring to you. Ask the users what would make the arrangement
            easier to follow, since a precise system still needs workable participation. An
            efficient answer may miss the emotional question someone was actually asking. Consider
            asking what matters emotionally after you have clarified the practical numbers. You can
            compare the original impulse with the response from others afterward. Brightness
            describes symbolic conditions of expression, so take this as a prompt for adjusting your
            surroundings and practice rather than a rating of personal ability.
      - heading: 'Teaching example 5: Tiān Tóng: finding conditions that suit you'
        knowledgeUnitId: ziwei.life.tian_tong.supported.a
        paragraphs:
          - You may find a useful starting point in ease, belonging and gentle cooperation. Tiān
            Tóng names a major star associated with that approach. It appears in the Life Palace
            (mìng gōng — the area for everyday identity) within the supported brightness group,
            which includes miao, wang, de and li — traditional labels for a comparatively accessible
            expression. You may be sensitive to the atmosphere around you and good at making
            participation feel less demanding. Imagine hosting a small study session. A welcoming
            atmosphere can make questions easier to ask, but a modest opening task also gives the
            group somewhere to begin. Notice whether ease is supporting participation or postponing
            it. Avoiding an awkward conversation to preserve comfort can leave the practical issue
            unresolved. Try completing one modest task before settling into a restorative break. You
            can compare the original impulse with the response from others afterward. Brightness
            describes symbolic conditions of expression, so take this as a prompt for adjusting your
            surroundings and practice rather than a rating of personal ability.
      - heading: 'Teaching example 6: Lián Zhēn: finding conditions that suit you'
        knowledgeUnitId: ziwei.life.lian_zhen.restrained.a
        paragraphs:
          - You may find a useful starting point in personal boundaries and value based choices.
            Lián Zhēn names a major star associated with that approach. It appears in the Life
            Palace (mìng gōng — the area for everyday identity) within the restrained brightness
            group, which includes ping, bu and xian — labels suggesting greater dependence on
            context and support. You may invest strongly in choices that express your values and
            notice when a boundary feels blurred. Picture being asked to join a project whose method
            conflicts with a value you care about. You can identify the exact practice that concerns
            you and what alternative would make participation possible, leaving a clear basis for
            discussion. A disagreement about a process can become personal when feelings and
            principles are treated as one thing. Try separating observable facts, your feelings and
            the specific change you are requesting. You can compare the original impulse with the
            response from others afterward. Brightness describes symbolic conditions of expression,
            so take this as a prompt for adjusting your surroundings and practice rather than a
            rating of personal ability.
      - heading: 'Teaching example 7: Tiān Fǔ: finding conditions that suit you'
        knowledgeUnitId: ziwei.life.tian_fu.supported.a
        paragraphs:
          - You may find a useful starting point in stewardship, reserves and dependable
            administration. Tiān Fǔ  names a major star associated with that approach. It appears in
            the Life Palace (mìng gōng — the area for everyday identity) within the supported
            brightness group, which includes miao, wang, de and li — traditional labels for a
            comparatively accessible expression. You may prefer understanding existing resources
            before making a change that others will rely on. Think of maintaining a small shared
            library. Keeping materials available can be satisfying, yet a periodic review of what
            people actually borrow may reveal a simpler arrangement. Stewardship can include
            retiring an item that no longer serves its purpose. A reliable arrangement can become
            restrictive if nobody checks whether it still serves its purpose. Consider reviewing
            what to keep, refresh and retire from your current routine. You can compare the original
            impulse with the response from others afterward. Brightness describes symbolic
            conditions of expression, so take this as a prompt for adjusting your surroundings and
            practice rather than a rating of personal ability.
      - heading: Your practice and review
        paragraphs:
          - "Choose one major star whose placement you can verify. Write its palace and the source
            of any transformation beside it. Then turn the theme into two ordinary questions: what
            support is already available, and what responsibility needs to be clarified? If a
            passage describes a sticking point, identify a communication step or a practical
            boundary you could review. A single marker cannot summarize a whole partnership or a
            person's character. When comparing charts from another service, keep a short settings
            log rather than combining whichever assignments you prefer. This allows you to
            distinguish a calculation difference from an interpretation difference. You can also
            record a counterexample to a familiar description. The exercise succeeds when you can
            explain which part of the diagram gave rise to a question and which part of the answer
            came from your actual circumstances."
