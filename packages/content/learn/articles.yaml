  slug: name-numbers
  zh:
    title: 姓名数字：字母规则与三种角度
    description: 姓名数字用指定字母表计算三个角度：表达数（全部字母）、灵魂数（元音）、人格数（其余字母）。
    sections:
      - heading: 姓名数字：字母规则与三种角度
        paragraphs:
          - 姓名数字用指定字母表计算三个角度：表达数（全部字母）、灵魂数（元音）、人格数（其余字母）。本项目采用毕达哥拉斯字母表，Y
            固定视为辅音，姓名可留空。它讨论所选写法的象征，不判断某个名字是否更好，也不会自动把中文转成英文。
      - heading: 从结构到读法
        paragraphs:
          - A–I 对应 1–9，J–R 重复 1–9，S–Z 对应 1–8；大小写与分隔符不改变数值。元音固定 AEIOU，空集合保留缺失，不填数字。John Doe：全部字母
            35→8，元音 17→8，辅音 18→9。下面各数字示例不是要求改名，而是展示不同词汇怎样用于日常提问。
      - heading: 怎样使用下面的教学示例
        paragraphs:
          - 下面各段示例展示不同盘面条件下的读法，段中的「你」指假设的示例读者，并非对你的个人判断。这些条件可以互不相容，不应拼成一份命盘。先辨认标题的主题，再观察正文如何从符号走到生活例子与建议。你可以把喜欢的句子改写成一个待观察的问题，也可以记录不符合经验的部分。
      - heading: 教学示例 1：1：姓名中的主动与独立
        knowledgeUnitId: numerology.name_numbers.1
        paragraphs:
          - 姓名中的 1
            可以从行动、内在需要或外在印象的角度阅读；依据标明由哪一项触发。你可能已列出下一步，但独立并不意味着独自承担一切。与别人共同决定时，可以把自己偏好的方向说清楚，也具体指出愿意调整的地方。如果对方选择不同，不急着把分歧理解成否定。建议邀请他们讲出理由，再讨论哪些部分能各自决定、哪些部分需要一起确认，让独立行动与共同承诺都有位置。回顾自己的责任清单时，可以标出明确答应过的部分，以及只是习惯性接下的部分。看看哪些任务需要协商，而不是继续默默承担。建议选一个适合讨论的事项，说出你目前能做的范围，也询问其他人的条件；合理分工能让关心持续，不必靠不断超出自己的限度维持。
      - heading: 教学示例 2：2：姓名中的协调与倾听
        knowledgeUnitId: numerology.name_numbers.2
        paragraphs:
          - 姓名中的 2
            可以从行动、内在需要或外在印象的角度阅读；依据标明由哪一项触发。你可能更敏锐地注意到语气与气氛，愿意给不同意见留一点空间。协调能让合作顺畅，但反复猜测别人需要什么也会消耗精力。注意到对方沉默时，可以问一个开放问题，而不是替他们猜好答案。给回复留些时间，同时也说出自己的感受与需要。建议在理解别人之前先区分看到的行为与自己的解释，例如晚回复是一件事实，但对方不在乎只是猜想；这种区分能减少不必要的误会。思考一个迟迟没有决定的问题时，可以列出还缺的事实与已经足够清楚的部分。分清需要继续研究还是需要一次小尝试，避免把不确定当成永久停止的理由。建议安排一个低成本的验证步骤，完成后重新评估，把分析和现实反馈连起来，而不是要求自己先理解所有可能性。
      - heading: 教学示例 3：3：姓名中的表达与创意
        knowledgeUnitId: numerology.name_numbers.3
        paragraphs:
          - 姓名中的 3
            可以从行动、内在需要或外在印象的角度阅读；依据标明由哪一项触发。你可能乐于用故事、图像或幽默让抽象想法变得可亲。表达能打开交流的门，真正落地仍需要编辑、练习和耐心。分享一个故事或观点后，可以请对方说说最记住哪一部分。有时你想表达的重点与他们听到的重点不同，这提供了重新组织语言的机会。建议少加一点解释，多留一点回应空间；交流不是把所有内容说完，而是让彼此有机会确认理解并继续提问。评估一个目标时，可以分别看完成了什么、用了哪些资源，以及过程中有哪些代价。结果之外的信息能帮助你判断是否值得继续用同一种方法。建议把评价标准提前写出来，也允许执行者提出修订，减少最后只按一个数字定好坏的倾向，让投入与成果都能被讨论。
      - heading: 教学示例 4：4：姓名中的结构与踏实
        knowledgeUnitId: numerology.name_numbers.4
        paragraphs:
          - 姓名中的 4
            可以从行动、内在需要或外在印象的角度阅读；依据标明由哪一项触发。你可能喜欢把任务拆成明确步骤，让进度可见、承诺可查。稳定来自持续投入，但计划也需要为变化保留空隙。共同生活中的规则可以从一件反复发生的小事开始协商，例如如何安排安静时间。说明规则解决什么问题，也约定什么情况下可以例外。建议过一段时间一起检查它是否仍合适；持续调整的约定比没有讨论过的默认标准，更容易让不同习惯的人安心合作。告别不一定发生在同一天，也可以分几步完成。建议从一个很小的整理行动开始，例如归档资料或写一封不必发送的总结，让回顾有一个具体承载，随后再考虑新的方向。
      - heading: 教学示例 5：8：姓名中的组织与执行
        knowledgeUnitId: numerology.name_numbers.8
        paragraphs:
          - 姓名中的 8
            可以从行动、内在需要或外在印象的角度阅读；依据标明由哪一项触发。你可能在意资源如何分配、目标能否落实，愿意承担复杂协调。掌握进度的能力很有用，也需要区分效率与人的感受。在关系里谈资源或责任，可以分别列出双方能承担的事情，不把投入多少当成谁更在乎的证明。遇到条件变化时，重新谈分配也很正常。建议用具体时间和行动说明承诺，少用笼统的要求，让彼此知道什么已经约定、什么仍需要确认，减少猜测带来的压力。观察一周的日常节奏时，可以找出让你省力的固定安排，也标记需要过多维护的习惯。有些稳定来自熟悉，有些只是没有试过别的方法。建议保留最有用的一项流程，暂时简化另一项，比较实际效果；这样既不需要全部重来，也能给变化留下入口。
      - heading: 教学示例 6：9：姓名中的包容与收尾
        knowledgeUnitId: numerology.name_numbers.9
        paragraphs:
          - 姓名中的 9
            可以从行动、内在需要或外在印象的角度阅读；依据标明由哪一项触发。你可能容易把个人经历放到更大的背景里，愿意理解不同立场。包容能帮助收尾与告别，但不是无限承担，也不要求放弃自己的需要。理解不同立场时，可以先复述对方的关注点，再说自己能认同和不能接受的部分。包容并不要求每次都达成一致，也允许一段讨论先停下来。建议在结束争论前确认有没有必须处理的现实事项，把观点差异与共同事务分开，让关系不必围绕每次分歧重新定义。试过一种新做法后，可以区分你学到了什么、喜欢什么，以及暂时不想继续什么。三个答案不一定相同，有收获的尝试也可以就此结束。建议给下一次探索设一个明确问题，不用通过不断换环境来寻找答案，把好奇与已有经验连接起来会更容易看到进展。
      - heading: 你的练习与复盘
        paragraphs:
          - 先手算 John
            Doe，再试一个获准使用的英文写法，分成全部、元音、辅音三栏。记录所选拼写与规则，只比较计算差异，不据数字评价身份。留空姓名也能使用生日部分。复盘时把象征变成一个表达练习，例如怎样更清楚介绍自己的兴趣。
