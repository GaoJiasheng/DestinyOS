      - heading: Your practice and review
        paragraphs:
          - Add the eight components and verify the total, then check the method version, direction,
            and provisional marker. Each participant can write one actual coordination need without
            using the total to decide who is right. Choose a small agreement and a review time, then
            observe whether it helps both people. Either person can pause a discussion that feels
            uncomfortable; a number is not a reason to apply pressure or replace consent. If you
            compare services, preserve a settings note and identify the calculation difference
