      - heading: Your practice and review
        paragraphs:
          - "For practice, use two inputs you have permission to use and record their completeness
            separately. Choose one directional theme and let each person answer three questions:
            what feels relevant, what does not fit, and how they would like to coordinate. Exchange
            answers before interpreting them. One person should not speak for the other's
            experience. If a prompt leads to a useful agreement, write that agreement in ordinary
            language so it does not depend on belief in the chart. Public sharing should use the
            service's limited projection rather than private birth details or a question inserted
            into a link. At review, focus on whether the arrangement helped both people. The chart
            supplied a starting vocabulary, while consent, communication, and practical
            follow-through supplied the basis for cooperation."
