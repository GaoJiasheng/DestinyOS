      - heading: 'Teaching example 7: long-term advice: A’s sun and B’s saturn form a sextile'
        knowledgeUnitId: synastry.western.sun_saturn.sextile
        paragraphs:
          - A’s sun and B’s saturn form a sextile. The two functions have room for cooperation that
