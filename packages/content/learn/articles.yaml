- system: bazi
  slug: ten-gods
  zh:
    title: 十神是什么：把关系读成日常语言
    description: 十神（日主与其他天干之间的五行、阴阳关系）是一套关系词汇，名字中的「神」不指超自然人物。
    sections:
      - heading: 十神是什么：把关系读成日常语言
        paragraphs:
          - 十神（日主与其他天干之间的五行、阴阳关系）是一套关系词汇，名字中的「神」不指超自然人物。比劫、食伤、财、官杀、印分别提供同类、表达、资源、规则与支持的观察角度。它们没有脱离位置与季节的统一好坏排序。学会关系分类，比背一串性格结论更有用。
      - heading: 从结构到读法
        paragraphs:
          - 同我者为比劫，我生者为食伤，我克者为财，克我者为官杀，生我者为印；再按阴阳分为十种。财星不等于账户余额，官杀不等于职业头衔，印也不等于学历。藏干（地支中包含的天干）同样参与关系，但与透干（表面可见的天干）不能混看。下面分别观察表达、规则与支持，先识别条件，再读建议。
      - heading: 怎样使用下面的教学示例
        paragraphs:
          - 下面各段示例展示不同盘面条件下的读法，段中的「你」指假设的示例读者，并非对你的个人判断。这些条件可以互不相容，不应拼成一份命盘。先辨认标题的主题，再观察正文如何从符号走到生活例子与建议。你可以把喜欢的句子改写成一个待观察的问题，也可以记录不符合经验的部分。
      - heading: 教学示例 1：比肩：透出
        knowledgeUnitId: bazi.ten_gods.bi_jian.visible
        paragraphs:
          - 你容易留意自主空间与平等分工。比肩（与日干同类且同阴阳的成分）象征同行与自我立场，盘中出现这一成分时，更适合观察你如何在共同目标里保留自己的方法。透出（成分出现在年、月或时的天干）让这个主题在表达层面更容易被观察，但仍要结合整盘和实际情境看。这里依据的是可见天干，不把它等同于工作表现已经得到认可。同类支持的重点是共同承担，而不是所有事都自己决定。比如同事与你采用不同方法完成同一任务，可以各做一份样稿，再按同一个验收标准比较；你保留自主方法，也让同伴有发言权。建议把最终标准和各自职责写清楚，遇到重复劳动时先协商分工，不用争谁更像负责人。
      - heading: 教学示例 2：正官：透出
        knowledgeUnitId: bazi.ten_gods.zheng_guan.visible
        paragraphs:
          - 你倾向于先理解规则，再决定怎样承担责任。正官（克日干且阴阳不同的成分）关注秩序与可见标准，盘中出现它时，适合观察角色是否明确、反馈是否公允，不由此推断职位、地位或他人对你的评价。透出（成分出现在年、月或时的天干）让这个主题在表达层面更容易被观察，但仍要结合整盘和实际情境看。这里依据的是可见天干，不把它等同于工作表现已经得到认可。正官关注规则与责任的边界，重点是标准是否明确。比如接受新职责时，可以问清验收方式、决定权限与需要请示的事项，不把“负责”理解为替所有人兜底。建议把模糊的要求改写成可核对的交付条件，发现标准变化时重新确认；有秩序不等于只能遵守旧做法，合理调整也可以在清楚的程序中进行。
      - heading: 教学示例 3：食神：透出
        knowledgeUnitId: bazi.ten_gods.shi_shen.visible
        paragraphs:
          - 你倾向于通过熟悉技能和稳定产出来表达自己。食神（日干所生且同阴阳的成分）象征顺畅输出与生活体验，盘中出现这一成分时，更适合观察技能如何被持续使用，而不是推断享受或收入的多少。透出（成分出现在年、月或时的天干）让这个主题在表达层面更容易被观察，但仍要结合整盘和实际情境看。这里依据的是可见天干，不把它等同于工作表现已经得到认可。食神的重点是把日主所生的力量转成能持续使用的产出。比如你擅长讲解，可以把反复回答的问题整理成一页说明，邀请读者按步骤试一次，而不是每次都临场从头解释。建议以是否容易使用衡量改进，并留出完成后的休息；若只顾追求舒适而迟迟不交付，就把下一次产出限定在一个能完成的小范围。
      - heading: 教学示例 4：伤官：透出
        knowledgeUnitId: bazi.ten_gods.shang_guan.visible
        paragraphs:
          - 你容易发现旧方法的不足，并希望表达新的做法。伤官（日干所生且阴阳不同的成分）侧重表达与质疑，名称不代表现实冲突。盘中出现它时，可以观察你怎样把批评变成可检验的改进，而不是把不同意见理解为个人对立。透出（成分出现在年、月或时的天干）让这个主题在表达层面更容易被观察，但仍要结合整盘和实际情境看。这里依据的是可见天干，不把它等同于工作表现已经得到认可。伤官把输出与质疑联系起来，重点是改进能否被别人理解。比如你发现规定的流程有重复步骤，可以记录它多用了多少时间，再提出一个保留必要检查的替代方案。建议先承认规则要解决的问题，再用样稿说明哪里可以改；表达锋利时容易让对方只听见否定，可以把批评落在步骤上，给合作留出口。
      - heading: 教学示例 5：正印：透出
        knowledgeUnitId: bazi.ten_gods.zheng_yin.visible
        paragraphs:
          - 你往往愿意借助清楚的资料和可信的支持来准备。正印（生日干且阴阳不同的成分）象征学习、经验与照应，盘中出现它时，观察重点是支持能否转成实际行动，不说明学历高低，也不把寻求指导视为依赖。透出（成分出现在年、月或时的天干）让这个主题在表达层面更容易被观察，但仍要结合整盘和实际情境看。这里依据的是可见天干，不把它等同于工作表现已经得到认可。正印把学习与可靠支持联系起来，重点是准备怎样转成行动。比如进入新岗位，可以先用已有说明完成一次基本操作，再向带教者询问卡住的环节，不必等到理解全部资料才开始。建议把得到的帮助整理成自己能重复使用的步骤；若每次都等待别人认可，先约定哪些事项可以独立处理，让照应帮助你建立自主性。
      - heading: 教学示例 6：正财：透出
        knowledgeUnitId: bazi.ten_gods.zheng_cai.visible
        paragraphs:
          - 你往往愿意用清楚的安排维持可持续的投入。正财（日干所克且阴阳不同的成分）象征稳定资源与日常管理，盘中出现它时，观察重点是记录、边界和持续性，不把这个名称理解为收入稳定的承诺。透出（成分出现在年、月或时的天干）让这个主题在表达层面更容易被观察，但仍要结合整盘和实际情境看。这里依据的是可见天干，不把它等同于工作表现已经得到认可。正财侧重可持续管理，重点是日常投入能否被看清。比如整理共同生活的开销，可以先区分固定支出与可调整支出，再约定谁负责记录、何时一起核对。建议用实际收支检查安排，不把节省变成对自己或伴侣的苛刻要求；把备用时间和休息也视为需要照顾的资源，让秩序服务生活，而非要求每件事都按同一尺度进行。
      - heading: 你的练习与复盘
        paragraphs:
          - 练习时先选一个日干，再用五行关系手算另一干属于哪个组。读完示例，分别写出「表达需求」「外部要求」「可用支持」三栏。不要把传统名称用作评价人的称呼。若解释与你的经验不同，记录具体反例；这比强行寻找吻合更能帮助你理解这套关系语言。
  en:
    title: What the Ten Gods describe
    description:
      The Ten Gods (十神, shí shén — relationships between the Day Master and other stems) are
      a vocabulary for comparing elements and polarity.
    sections:
      - heading: What the Ten Gods describe
        paragraphs:
          - The Ten Gods (十神, shí shén — relationships between the Day Master and other stems) are a
            vocabulary for comparing elements and polarity. “God” is the conventional English term;
            it does not mean a supernatural person appears in the chart. The groups describe peers,
            expression, resources, structure, and support. They become ten categories when Yin and
            Yang relationships are distinguished. Learning this relational logic is more useful than
            memorizing a list of personality claims. A category does not carry the same meaning in
            every position, season, or surrounding arrangement. This tutorial introduces the groups
            and uses separate examples to show how symbolic wording can become a practical question
            about everyday choices.
      - heading: From structure to interpretation
        paragraphs:
          - Begin with the Day Master and compare another stem with it. The same element belongs to
            the peer group, commonly called Friend and Rob Wealth. The element produced by the Day
            Master belongs to expression, Eating God and Hurting Officer. What the Day Master
            controls belongs to resources, Direct and Indirect Wealth. What controls the Day Master
            belongs to structure, Direct Officer and Seven Killings. What produces the Day Master
            belongs to support, Direct and Indirect Resource. Polarity supplies the distinction
            within each pair. These conventional names can sound stronger than their everyday
            teaching use. A Wealth category is not your bank balance, an Officer category is not
            your job title, and Resource is not an education certificate. Hidden stems (藏干, cáng gān
            — stems contained within a branch) can also enter the comparison, but a hidden
            relationship should not be treated as identical to a prominently visible stem. Position,
            seasonal strength, and interactions supply context. In the examples, look for the
            difference between describing a pattern and assigning a permanent trait. Strong
            expression might raise a question about how you present an idea; strong structure might
            raise a question about expectations. Neither category removes the need to listen to
            another person or check the actual demands of a task.
      - heading: How to work with the teaching examples
        paragraphs:
          - The examples below illustrate separate symbolic conditions. In each example, “you”
            addresses a hypothetical reader with that condition, not you personally. Some conditions
            are alternatives and cannot be combined into a single chart. Read the heading first,
            identify the idea being illustrated, and then notice how the explanation moves from a
            symbol to an ordinary situation and a modest suggestion. You do not need to identify
            with every example. A useful exercise is to rewrite one sentence as a question that you
            could observe in daily life. Keep a second note for anything that does not fit. This
            makes room for disagreement and stops a familiar description from becoming a label.
            These passages come from the same versioned editorial knowledge used by the reading
            engine; including them here demonstrates its writing method, not a calculation for a
            visitor. No birth information is required to study this page.
      - heading: 'Teaching example 1: Bǐ jiān: visible in a stem'
        knowledgeUnitId: bazi.ten_gods.bi_jian.visible
        paragraphs:
          - You may value room to contribute on equal terms. Bǐ jiān — a component sharing the day
            stem’s element and polarity — symbolizes peers and personal initiative. Its presence
            invites attention to how you cooperate while retaining a workable degree of
            independence. The trigger is a visible year, month, or hour stem. Exposure (tòu chū —
            appearing in a visible stem) makes a symbolic theme more explicit in this model, but it
            is not proof that others recognize it in your work. Peer support works through shared
            effort, not through having every decision go your way. Suppose a colleague uses a
            different method to complete the same task. Compare two samples against one agreed
            standard before defending your own approach. You can preserve independence while sharing
            responsibility. Try writing down who owns each deliverable and who checks the result. If
            you are both correcting the same item, agree on a handover instead of repeating the
            work. The useful question is whether the presence of another capable person gives you
            room to act or creates a contest over the method.
      - heading: 'Teaching example 2: Zhèng guān: visible in a stem'
        knowledgeUnitId: bazi.ten_gods.zheng_guan.visible
        paragraphs:
          - You may feel more comfortable when expectations are explicit. Zhèng guān — a component
            that checks the day stem with opposite polarity — emphasizes roles and standards. Its
            presence asks how responsibility is defined and reviewed, not which title you will hold
            or how others will judge your standing. The trigger is a visible year, month, or hour
            stem. Clear standards make responsibility easier to carry. Before accepting a new role,
            ask how the result will be reviewed, which decisions you may make and which need
            agreement from someone else. Being responsible does not mean becoming the fallback for
            every unfinished task. Consider converting a broad request into a deliverable with a
            named reviewer and a date. If the standard changes halfway through, confirm the new
            scope instead of quietly adding it to your workload. Respect for a procedure can coexist
            with proposing improvements through that procedure. This marker directs attention to
            accountability; it does not establish a position of authority or predict recognition.
      - heading: 'Teaching example 3: Shí shén: visible in a stem'
        knowledgeUnitId: bazi.ten_gods.shi_shen.visible
        paragraphs:
          - You may prefer expression that develops through practice. Shí shén — an output component
            with the day stem’s polarity — symbolizes a steady use of skills and attention to
            everyday experience. The useful question concerns what you can produce repeatedly,
            rather than how comfortable or prosperous life should be. The trigger is a visible year,
            month, or hour stem. This output theme concerns work that can be used and repeated
            without constant reinvention. If you are good at explaining a process, turn a question
            you answer often into a one-page guide. Ask someone to follow it and notice where they
            need help. Try measuring the revision by ease of use rather than by how much extra
            detail you can add. A familiar skill becomes a resource when it reaches another person
            in a usable form. Leave time to recover after producing it. If comfort keeps delaying
            delivery, reduce the scope to one complete example instead of waiting to feel ready for
            a larger undertaking.
      - heading: 'Teaching example 4: Shāng guān: visible in a stem'
        knowledgeUnitId: bazi.ten_gods.shang_guan.visible
        paragraphs:
          - You may notice where an established method could be improved. Shāng guān — an output
            component of opposite polarity to the day stem — emphasizes expression and questioning.
            The label does not establish a conflict. A useful focus is whether a critique identifies
            a workable change and leaves others able to respond. Questioning a method is more useful
            when you can show a workable replacement. Suppose an established process repeats the
            same check twice. Record the extra time it takes and demonstrate an alternative that
            still meets the underlying requirement. You can acknowledge the purpose of a rule while
            challenging how it is applied. Consider presenting a sample rather than starting with a
            verdict about the people who designed the process. If the exchange becomes defensive,
            return to the duplicated step and the evidence you have collected. This preserves the
            expressive side of the theme without making opposition itself the goal.
      - heading: 'Teaching example 5: Zhèng yìn: visible in a stem'
        knowledgeUnitId: bazi.ten_gods.zheng_yin.visible
        paragraphs:
          - You may appreciate clear reference material and reliable guidance. Zhèng yìn — a
            supporting component with opposite polarity to the day stem — symbolizes learning and
            assistance. Its presence concerns whether preparation helps the next step; it does not
            measure qualifications or make asking for guidance a sign of dependence. The trigger is
            a visible year, month, or hour stem. Exposure (tòu chū — appearing in a visible stem)
            makes a symbolic theme more explicit in this model, but it is not proof that others
            recognize it in your work. A demanding skill can feel more approachable when the first
            milestone is visible. Reliable guidance is useful when it helps you take a step you can
            later repeat yourself. In a new role, follow an existing guide through one basic task
            and ask a mentor about the point where you became stuck. You do not need to understand
            every document before beginning the simplest supported exercise. Try turning the help
            you receive into a short procedure you can use again. If you keep waiting for
            reassurance on routine decisions, agree which tasks you may handle independently and
            which still need review. This keeps support available while building autonomy. The
            resource relationship offers a learning theme rather than a conclusion about
            qualifications or intelligence.
      - heading: 'Teaching example 6: Zhèng cái: visible in a stem'
        knowledgeUnitId: bazi.ten_gods.zheng_cai.visible
        paragraphs:
          - You may appreciate continuity and a clear record of commitments. Zhèng cái — a
            resource-management component with opposite polarity to the day stem — concerns everyday
            planning. The label does not promise stable earnings; it invites a look at how small
            obligations are recorded, maintained, and reviewed over time. The trigger is a visible
            year, month, or hour stem. Exposure (tòu chū — appearing in a visible stem) makes a
            symbolic theme more explicit in this model, but it is not proof that others recognize it
            in your work. Regular resource management depends on making ordinary commitments
            visible. When organizing shared household expenses, distinguish recurring costs from
            choices that can be adjusted. Agree who keeps the record and when you will review it
            together. You can discuss the arrangement using actual figures rather than assuming that
            a careful person should remember everything. Consider including time and rest in the
            resource review as well. A routine that reduces uncertainty is useful; one that turns
            every small choice into an argument needs room to change. This theme concerns consistent
            stewardship, while the presence of the marker by itself says nothing about the size or
            stability of your income.
      - heading: Your practice and review
        paragraphs:
          - 'Try choosing one day stem and manually classifying three other stems by the five
            relationships before looking up their names. This small exercise checks understanding
            without requiring you to remember the entire matrix. For reflection, make three columns
            headed expression, external expectations, and available support. Add one current
            situation to each, then write an action you can actually take: clarify a request,
            prepare an example, or ask what help is available. Do not use a traditional category as
            a nickname for a colleague or partner. Someone may respond differently in different
            settings, and the chart vocabulary cannot establish their intentions. If an example does
            not fit your experience, preserve the counterexample. It can reveal where a broad
            metaphor stops being useful. Your aim is to understand how the relationship is derived
            and how the wording is qualified, rather than to assemble a flattering or discouraging
            description from whichever paragraphs feel familiar.'
