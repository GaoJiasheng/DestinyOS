  slug: dasha-and-divisions
  zh:
    title: Dasha 与分盘：先区分周期和视角
    description: Dasha（以出生月亮位置推导的时间周期）与分盘（用黄经细分形成的观察图）回答不同结构问题。
    sections:
      - heading: Dasha 与分盘：先区分周期和视角
        paragraphs:
          - Dasha（以出生月亮位置推导的时间周期）与分盘（用黄经细分形成的观察图）回答不同结构问题。Mahadasha 是较长周期，Antardasha 是其内部子周期；D9
            是常用分盘。先看 D1 基础与可靠输入，再讨论时间和细分，不让更细的图制造更强的确定感。
      - heading: 从结构到读法
        paragraphs:
          - 本项目采用 Vimshottari 周期，起点依据月亮星宿及已走比例。周期边界是计算区间，不要求生活在交界日突然变化。D9 与 D1
            要分开记录，不能把一个分盘的落点当作本命宫位。下面周期示例以「已记录的起点与终点」说明区间读法，并非为读者计算的日期。
      - heading: 怎样使用下面的教学示例
        paragraphs:
          - 下面各段示例展示不同盘面条件下的读法，段中的「你」指假设的示例读者，并非对你的个人判断。这些条件可以互不相容，不应拼成一份命盘。先辨认标题的主题，再观察正文如何从符号走到生活例子与建议。你可以把喜欢的句子改写成一个待观察的问题，也可以记录不符合经验的部分。
      - heading: 教学示例 1：太阳大运：表达立场
        knowledgeUnitId: vedic.mahadasha.surya
        paragraphs:
          - 你可以把这一阶段的注意力放在表达立场上。大运（按月亮星宿起算的较长象征周期）当前由太阳主导，起止范围为 已记录的起点 至
            已记录的终点。太阳（在吠陀框架中观察身份与意志的象征）描述你怎样承担自己的选择。你可以在需要拍板时先说清判断依据，让参与者知道哪些意见还能补充。周期只提供复盘的主题，不预告同类事件。例如你在季度结束时回看学习、合作和可用时间，选一项与主题有关但符合现实需要的调整。建议先明确目前最值得照顾的一件事，再用经验检验做法；时间边界也不要求生活在当天突然改变。
      - heading: 教学示例 2：月亮大运：安顿感受
        knowledgeUnitId: vedic.mahadasha.chandra
        paragraphs:
          - 你可以把这一阶段的注意力放在安顿感受上。大运（按月亮星宿起算的较长象征周期）当前由月亮主导，起止范围为 已记录的起点 至
            已记录的终点。月亮（在这一体系中作为心绪与日常反应的观察点）描述你怎样恢复熟悉的节奏。它的位置为情绪需要提供比喻，不能用来评估心理状况。周期只提供复盘的主题，不预告同类事件。例如你在季度结束时回看学习、合作和可用时间，选一项与主题有关但符合现实需要的调整。建议先明确目前最值得照顾的一件事，再用经验检验做法；时间边界也不要求生活在当天突然改变。
      - heading: 教学示例 3：火星大运：把力量放进行动
        knowledgeUnitId: vedic.mahadasha.mangala
        paragraphs:
          - 你可以把这一阶段的注意力放在把力量放进行动上。大运（按月亮星宿起算的较长象征周期）当前由火星主导，起止范围为 已记录的起点 至
            已记录的终点。火星（以行动和应对摩擦为象征的行星）描述你怎样启动任务、表达不同意见。它的位置提示精力可能投向哪里，不表示你需要与谁竞争。你可以把不满改写成具体的改进请求，区分眼前要完成的事和一时想赢的争论。周期只提供复盘的主题，不预告同类事件。例如你在季度结束时回看学习、合作和可用时间，选一项与主题有关但符合现实需要的调整。建议先明确目前最值得照顾的一件事，再用经验检验做法；时间边界也不要求生活在当天突然改变。
      - heading: 教学示例 4：水星大运：让信息便于使用
        knowledgeUnitId: vedic.mahadasha.budha
        paragraphs:
          - 你可以把这一阶段的注意力放在让信息便于使用上。大运（按月亮星宿起算的较长象征周期）当前由水星主导，起止范围为 已记录的起点 至
            已记录的终点。水星（以学习和信息交流为象征的行星）描述你如何整理问题、交换想法。它的位置强调信息怎样进入实际生活，不替你判断哪种观点正确。你可以先问对方需要什么程度的解释，再用例子核对彼此是否理解同一件事。周期只提供复盘的主题，不预告同类事件。例如你在季度结束时回看学习、合作和可用时间，选一项与主题有关但符合现实需要的调整。建议先明确目前最值得照顾的一件事，再用经验检验做法；时间边界也不要求生活在当天突然改变。
      - heading: 教学示例 5：木星大运：把见识转为学习
        knowledgeUnitId: vedic.mahadasha.guru
        paragraphs:
          - 你可以把这一阶段的注意力放在把见识转为学习上。大运（按月亮星宿起算的较长象征周期）当前由木星主导，起止范围为 已记录的起点 至
            已记录的终点。木星（以学习、引导和拓展为象征的行星）描述你怎样寻找更大的理解框架。它的位置提醒你比较经验和观点，不等于拥有某种权威。你可以把一个宽泛道理改写成具体问题，邀请有相关经历的人提供不同看法。周期只提供复盘的主题，不预告同类事件。例如你在季度结束时回看学习、合作和可用时间，选一项与主题有关但符合现实需要的调整。建议先明确目前最值得照顾的一件事，再用经验检验做法；时间边界也不要求生活在当天突然改变。
      - heading: 教学示例 6：金星大运：认真看待互惠
        knowledgeUnitId: vedic.mahadasha.shukra
        paragraphs:
          - 你可以把这一阶段的注意力放在认真看待互惠上。大运（按月亮星宿起算的较长象征周期）当前由金星主导，起止范围为 已记录的起点 至
            已记录的终点。金星（以愉悦、关系和协调为象征的行星）描述你怎样发现值得珍惜的体验。它的位置可以讨论审美和互惠，不替你安排伴侣身份或关系进度。你可以把喜欢的方式说清楚，再询问参与者是否也觉得舒服，让共同体验有真实的回应。周期只提供复盘的主题，不预告同类事件。例如你在季度结束时回看学习、合作和可用时间，选一项与主题有关但符合现实需要的调整。建议先明确目前最值得照顾的一件事，再用经验检验做法；时间边界也不要求生活在当天突然改变。
      - heading: 教学示例 7：土星大运：把责任拆成步骤
        knowledgeUnitId: vedic.mahadasha.shani
        paragraphs:
          - 你可以把这一阶段的注意力放在把责任拆成步骤上。大运（按月亮星宿起算的较长象征周期）当前由土星主导，起止范围为 已记录的起点 至
            已记录的终点。土星（以时间、边界和持续投入为象征的行星）描述你怎样面对需要耐心的过程。它的位置适合讨论可承担的责任，不表示你应当独自忍受压力。你可以先区分必须完成、能够委托和可以暂停的部分，为长期任务留下交接与休息空间。周期只提供复盘的主题，不预告同类事件。例如你在季度结束时回看学习、合作和可用时间，选一项与主题有关但符合现实需要的调整。建议先明确目前最值得照顾的一件事，再用经验检验做法；时间边界也不要求生活在当天突然改变。
      - heading: 你的练习与复盘
        paragraphs:
          - 画一条周期线，标区间与子周期；另画 D1、D9
            两张索引卡，记录各自落点。选一个已存在的任务作为复盘目标，不据周期主题新增紧张安排。未知时间的部分保留警示。复盘时比较行动与反馈，不把每次变化归因于周期交接。
  en:
    title: Distinguishing Dasha periods from divisional charts
    description: Dasha periods and divisional charts answer different structural questions.
    sections:
      - heading: Distinguishing Dasha periods from divisional charts
        paragraphs:
          - Dasha periods and divisional charts answer different structural questions. Dasha is a
            time framework derived from the Moon's birth position. Mahadasha is a longer period,
            while Antardasha is a subperiod within it. A divisional chart reorganizes zodiac
            positions into a finer symbolic diagram; D9 is a commonly used division. Begin with D1
            and reliable inputs before discussing timing or subdivisions. More technical detail
            should not create more confidence than the input can support.
      - heading: From structure to interpretation
        paragraphs:
          - The project's Vimshottari sequence begins from the Moon's sector and the fraction
            already traversed at birth. A calculated boundary identifies an interval in the model;
            it does not require daily life to change abruptly on that date. D9 and D1 should also be
            recorded separately. A placement in a divisional chart cannot simply be treated as a
            natal house placement. The examples below contrast period rulers and review themes.
            References to the recorded start and end describe the role of interval boundaries; they
            are not dates calculated for the visitor. A period may prompt review of ownership,
            routines, communication, or available support, but it does not schedule an external
            event. Unknown birth time can affect the Moon's exact position and time-sensitive
            divisions, so warnings belong alongside the interpretation. Read the cycle table before
            choosing a paragraph and verify which period is actually current for a complete chart.
            When comparing methods, preserve the same astronomical and time inputs. It is more
            useful to understand why the interval begins where it does than to select a theme only
            because it resembles something you remember. Keep the model's timeline separate from
            real deadlines and responsibilities.
      - heading: How to work with the teaching examples
        paragraphs:
          - The examples below illustrate separate symbolic conditions. In each example, “you”
            addresses a hypothetical reader with that condition, not you personally. Some conditions
            are alternatives and cannot be combined into a single chart. Read the heading first,
            identify the idea being illustrated, and then notice how the explanation moves from a
            symbol to an ordinary situation and a modest suggestion. You do not need to identify
            with every example. A useful exercise is to rewrite one sentence as a question that you
            could observe in daily life. Keep a second note for anything that does not fit. This
            makes room for disagreement and stops a familiar description from becoming a label.
            These passages come from the same versioned editorial knowledge used by the reading
            engine; including them here demonstrates its writing method, not a calculation for a
            visitor. No birth information is required to study this page.
      - heading: 'Teaching example 1: Surya Mahadasha: a review theme'
        knowledgeUnitId: vedic.mahadasha.surya
        paragraphs:
          - You can use this period to review visible ownership. Mahadasha — a longer symbolic cycle
            calculated from the Moon’s birth sector — is currently ruled by Surya, with recorded
            boundaries from the recorded start to the recorded end. Surya — the Sun, a symbol of
            personal direction — concerns how you take ownership of a choice. Its position offers a
            question about visibility and responsibility rather than a ranking of your status. A
            helpful contribution makes both your reasoning and its limits understandable to the
            people affected. You can practise explaining why a choice matters without asking
            everyone to share your enthusiasm. A period provides a review theme, not a schedule of
            events. At a quarterly check-in, compare your learning, collaborations, and available
            time before choosing one adjustment that fits your circumstances. You can use the
            recorded interval as a reference while setting practical milestones from real
            responsibilities. Consider reviewing the method after a modest trial; a boundary in the
            calculation does not require your daily life to change abruptly.
      - heading: 'Teaching example 2: Chandra Mahadasha: a review theme'
        knowledgeUnitId: vedic.mahadasha.chandra
        paragraphs:
          - You can use this period to review emotional continuity. Mahadasha — a longer symbolic
            cycle calculated from the Moon’s birth sector — is currently ruled by Chandra, with
            recorded boundaries from the recorded start to the recorded end. Chandra — the Moon,
            used here as a reference for everyday responses — highlights what helps you feel
            settled. The position is a symbolic prompt about experience rather than an assessment of
            mental health. Notice how you move between company, solitude, and changing surroundings.
            You can describe what feels supportive without expecting another person to manage every
            shift in your mood. A period provides a review theme, not a schedule of events. At a
            quarterly check-in, compare your learning, collaborations, and available time before
            choosing one adjustment that fits your circumstances. You can use the recorded interval
            as a reference while setting practical milestones from real responsibilities. Consider
            reviewing the method after a modest trial; a boundary in the calculation does not
            require your daily life to change abruptly.
      - heading: 'Teaching example 3: Mangala Mahadasha: a review theme'
        knowledgeUnitId: vedic.mahadasha.mangala
        paragraphs:
          - You can use this period to review directed effort. Mahadasha — a longer symbolic cycle
            calculated from the Moon’s birth sector — is currently ruled by Mangala, with recorded
            boundaries from the recorded start to the recorded end. Mangala — Mars, a symbol of
            effort and assertion — asks where you put energy when something needs doing. This
            position can also prompt you to notice what happens when a disagreement becomes a
            contest. You can name the task you want completed and make a specific request rather
            than pursue the last word. Sustainable effort includes a pause before escalating a
            conflict. A period provides a review theme, not a schedule of events. At a quarterly
            check-in, compare your learning, collaborations, and available time before choosing one
            adjustment that fits your circumstances. You can use the recorded interval as a
            reference while setting practical milestones from real responsibilities. Consider
            reviewing the method after a modest trial; a boundary in the calculation does not
            require your daily life to change abruptly.
      - heading: 'Teaching example 4: Budha Mahadasha: a review theme'
        knowledgeUnitId: vedic.mahadasha.budha
        paragraphs:
          - You can use this period to review usable communication. Mahadasha — a longer symbolic
            cycle calculated from the Moon’s birth sector — is currently ruled by Budha, with
            recorded boundaries from the recorded start to the recorded end. Budha — Mercury, a
            symbol of learning and exchange — focuses on the route between an idea and its practical
            use. Good communication depends on the listener’s context as well as the speaker’s
            fluency. You can ask what someone needs to do with the information before adding detail.
            An example or a short check of understanding often reveals more than another round of
            explanation. A period provides a review theme, not a schedule of events. At a quarterly
            check-in, compare your learning, collaborations, and available time before choosing one
            adjustment that fits your circumstances. You can use the recorded interval as a
            reference while setting practical milestones from real responsibilities. Consider
            reviewing the method after a modest trial; a boundary in the calculation does not
            require your daily life to change abruptly.
      - heading: 'Teaching example 5: Guru Mahadasha: a review theme'
        knowledgeUnitId: vedic.mahadasha.guru
        paragraphs:
          - You can use this period to review learning with perspective. Mahadasha — a longer
            symbolic cycle calculated from the Moon’s birth sector — is currently ruled by Guru,
            with recorded boundaries from the recorded start to the recorded end. Guru — Jupiter, a
            symbol of perspective and learning — asks how a larger idea changes an ordinary
            decision. The position invites reflection on guidance, without establishing that your
            advice is appropriate for everyone. You can test a broad principle against a real
            example and ask an experienced person where it stops being useful. Curiosity leaves more
            room for growth than needing to sound certain. A period provides a review theme, not a
            schedule of events. At a quarterly check-in, compare your learning, collaborations, and
            available time before choosing one adjustment that fits your circumstances. You can use
            the recorded interval as a reference while setting practical milestones from real
            responsibilities. Consider reviewing the method after a modest trial; a boundary in the
            calculation does not require your daily life to change abruptly.
      - heading: 'Teaching example 6: Shukra Mahadasha: a review theme'
        knowledgeUnitId: vedic.mahadasha.shukra
        paragraphs:
          - You can use this period to review reciprocity and enjoyment. Mahadasha — a longer
            symbolic cycle calculated from the Moon’s birth sector — is currently ruled by Shukra,
            with recorded boundaries from the recorded start to the recorded end. Shukra — Venus, a
            symbol of enjoyment and reciprocity — highlights how you recognize a satisfying
            exchange. The reading can prompt a conversation about preferences without assigning a
            partner or a timetable for commitment. You can describe what you enjoy and ask whether
            someone else wants to share it. Mutual interest matters more than a scene that merely
            looks harmonious from outside. A period provides a review theme, not a schedule of
            events. At a quarterly check-in, compare your learning, collaborations, and available
            time before choosing one adjustment that fits your circumstances. You can use the
            recorded interval as a reference while setting practical milestones from real
            responsibilities. Consider reviewing the method after a modest trial; a boundary in the
            calculation does not require your daily life to change abruptly.
      - heading: 'Teaching example 7: Shani Mahadasha: a review theme'
        knowledgeUnitId: vedic.mahadasha.shani
        paragraphs:
          - You can use this period to review responsibility in practice. Mahadasha — a longer
            symbolic cycle calculated from the Moon’s birth sector — is currently ruled by Shani,
            with recorded boundaries from the recorded start to the recorded end. Shani — Saturn, a
            symbol of time and boundaries — asks which commitments you can maintain under ordinary
            conditions. A patient method may be useful, while carrying every responsibility yourself
            can make a process fragile. You can separate essential work from optional demands and
            agree on a handover before capacity runs low. Reliability includes limits and the
            ability to request support. A period provides a review theme, not a schedule of events.
            At a quarterly check-in, compare your learning, collaborations, and available time
            before choosing one adjustment that fits your circumstances. You can use the recorded
            interval as a reference while setting practical milestones from real responsibilities.
            Consider reviewing the method after a modest trial; a boundary in the calculation does
            not require your daily life to change abruptly.
      - heading: Your practice and review
        paragraphs:
          - Draw a period line with its intervals and subperiods, then make separate index cards for
            D1 and D9 placements. Choose an existing task as a review target rather than creating
            new obligations from a cycle theme. Preserve warnings for anything that depends on
            unknown time. At review, compare actions and feedback without assigning every change to
            a period boundary. A useful planning step might be to clarify the next milestone or
            identify support you can realistically request. These steps stand on their own even if
            the symbolic theme proves unhelpful. You can gradually study the period rulers through
            the examples while resisting the urge to turn a table into a forecast of specific
            events. The learning goal is to distinguish a time interval from a chart viewpoint and
            understand the basis of each.
