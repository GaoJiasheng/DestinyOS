        paragraphs:
          - 先把八项相加核对总分，再检查版本、方向与暂定标记。双方各写一个现实协作需要，不以总分分配谁对谁错。选择一个小约定并设复盘时间，观察它是否对双方有帮助。讨论中任何不适可以暂停；数字不应成为施压或代替同意的理由。
  en:
    title: Reading traditional matching scores component by component
    description: Ashtakoot is an eight-component traditional Vedic matching table with a maximum total of 36.
    sections:
      - heading: Reading traditional matching scores component by component
        paragraphs:
          - Ashtakoot is an eight-component traditional Vedic matching table with a maximum total of
            36. The result describes the selected table, not a relationship success probability or
            anyone's worth. This project preserves the component scores and method version so that
            the arithmetic can be checked. No component should be turned into a claim about health,
            family outcomes, or the future of a relationship.
      - heading: From structure to interpretation
        paragraphs:
          - The eight component maxima are 1, 2, 3, 4, 5, 6, 7, and 8, and their actual scores must
            sum to the displayed total. Tara counting includes the starting sector. Some table
            lookups are directional, so exchanging A and B can change particular components. The
            project uses a declared North Indian base table and does not automatically add disputed
            cancellation or bonus rules. Its A and B table roles are independent of the
            participants' input gender. With unknown time, the noon Moon supplies a provisional
            value and a warning. The examples below show zero-score components as teaching
            conditions. They demonstrate how to report the numeric result without evaluating either
            person. A low component and a low total do not establish a problem in daily life, and a
            high total does not establish respectful communication. The table can be studied as a
            cultural classification while actual expectations, boundaries, and agreements remain
            matters for the participants. When comparing another service, check the table version,
            direction, lunar coordinates, and additional rules before comparing totals. A numeric
            disagreement often has a methodological explanation. Keep the score's computational
            meaning separate from the practical discussion it might prompt.
      - heading: How to work with the teaching examples
        paragraphs:
          - The examples below illustrate separate symbolic conditions. In each example, “you”
            addresses a hypothetical reader with that condition, not you personally. Some conditions
            are alternatives and cannot be combined into a single chart. Read the heading first,
            identify the idea being illustrated, and then notice how the explanation moves from a
            symbol to an ordinary situation and a modest suggestion. You do not need to identify
            with every example. A useful exercise is to rewrite one sentence as a question that you
            could observe in daily life. Keep a second note for anything that does not fit. This
            makes room for disagreement and stops a familiar description from becoming a label.
            These passages come from the same versioned editorial knowledge used by the reading
            engine; including them here demonstrates its writing method, not a calculation for a
            visitor. No birth information is required to study this page.
      - heading: 'Teaching example 1: overall connection: varna has a zero score'
        knowledgeUnitId: synastry.ashtakoot.varna.zero
        paragraphs:
          - 'varna has a zero score. This traditional table component has a maximum of 1 points;
            view it with the other seven without making claims about personal worth, health, or
            relationship outcomes. Try to plan a relaxed shared activity and notice how each person
            prefers to divide tasks. Recall an activity that went smoothly. Identify the conditions
            present: enough time, a shared goal, and freedom to offer a different opinion. Bring
            those conditions into the next plan and observe the result. If an arrangement feels
            comfortable for only one person, change how it is carried out instead of requiring the
            other to share the same feeling. Modify one step at a time so the effect is easier to
            notice. Long relationships encounter changing work schedules and family
            responsibilities. Regular discussion of current circumstances is more useful than
            mechanically repeating an early agreement. A chart offers a starting point for
            reflection, while each person remains free to choose how to participate.'
      - heading: 'Teaching example 2: overall connection: vashya has a zero score'
