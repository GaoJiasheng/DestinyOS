  zh:
    title: 跨盘相位与落宫：互动怎样定位
    description: 跨盘相位（A 的行星与 B 的行星之间的角度关系）与落宫（某颗行星落在对方盘的宫位）是两种信息。
    sections:
      - heading: 跨盘相位与落宫：互动怎样定位
        paragraphs:
          - 跨盘相位（A 的行星与 B
            的行星之间的角度关系）与落宫（某颗行星落在对方盘的宫位）是两种信息。前者比较主题互动，后者提供目标盘情境。先标清来源、目标与可用宫位，再讨论文字，避免把本命盘内相位混入合盘。
      - heading: 从结构到读法
        paragraphs:
          - 同名行星也可形成跨盘相位，容许度按文档规则记录；本命的两时刻不能定义行运意义的入相或出相，所以本项目不输出该结论。落宫有方向，A 落 B 与 B 落 A
            不是同一字段。未知目标时辰时落宫保持缺失。下面示例帮助把亲密、表达与长期主题变成协商问题。
      - heading: 怎样使用下面的教学示例
        paragraphs:
          - 下面各段示例展示不同盘面条件下的读法，段中的「你」指假设的示例读者，并非对你的个人判断。这些条件可以互不相容，不应拼成一份命盘。先辨认标题的主题，再观察正文如何从符号走到生活例子与建议。你可以把喜欢的句子改写成一个待观察的问题，也可以记录不符合经验的部分。
      - heading: 教学示例 1：感情：A 的金星与 B 的火星呈合相
        knowledgeUnitId: synastry.western.venus_mars.conjunction
        paragraphs:
          - A 的金星与 B
            的火星呈合相。两种功能集中在相近的方向，容易放大彼此的主题；需要结合金星与火星各自的象征功能来理解。建议分别写下三种喜欢的关心方式，问清楚哪些举动需要提前确认。一个可核对的场景是一起处理日常任务：谁先提出想法，谁整理细节，谁提醒时间。把这些动作与个人价值分开看，暂时做得少也许只是空闲时间不同。可以先试行一个较小的分工，再约定如何提出修改。发生分歧时，记录两个人已经同意的条件，以及仍然需要查清的信息，不要让对话围着同一句评价打转。任务完成以后，回顾哪一步节省了精力、哪一步增加了压力，从中选择一个值得继续的做法。
      - heading: 教学示例 2：感情：A 的火星与 B 的金星呈对分相
        knowledgeUnitId: synastry.western.mars_venus.opposition
        paragraphs:
          - A 的火星与 B
            的金星呈对分相。两种功能强调相对的立场，倾听双方期待有助于找到共同点；需要结合火星与金星各自的象征功能来理解。建议分别写下三种喜欢的关心方式，问清楚哪些举动需要提前确认。把这些条件搬到下一次共同安排里，再观察效果。若某个办法只让一方舒服，就一起调整执行方式，而不是要求另一方接受同样的感觉。每次只修改一个环节，能更容易看见变化来自哪里。长期相处会经历新的工作节奏与家庭责任，定期讨论现状比照搬早先的约定更有帮助。
      - heading: 教学示例 3：感情：A 的月亮与 B 的月亮呈三分相
        knowledgeUnitId: synastry.western.moon_moon.trine
        paragraphs:
          - A 的月亮与 B
            的月亮呈三分相。相近的表达习惯可能减少协调成本，也需要留意未经讨论的假设；需要结合月亮与月亮各自的象征功能来理解。建议分别写下三种喜欢的关心方式，问清楚哪些举动需要提前确认。你可以拿最近一次共同安排来核对，先写下原本期待的结果，再比较双方当时掌握的信息。计划改变以后，一方可能希望尽快找到替代方案，另一方更想知道为什么发生变化。给解释与行动分别留出一点时间，会让两种需要更容易被满足。讨论结束时，把接下来由谁完成哪一步、什么时候确认进度说清楚。过几天再看看这个安排是否合适。相处方式可以学习与调整，不必让一次不顺畅的经历成为对人的固定评价。
      - heading: 教学示例 4：沟通：A 的水星与 B 的水星呈六分相
        knowledgeUnitId: synastry.western.mercury_mercury.sextile
        paragraphs:
          - A 的水星与 B
            的水星呈六分相。两种功能之间有尝试合作的空间，仍需要主动沟通；需要结合水星与水星各自的象征功能来理解。建议讨论一件小事时先复述对方的观点，再提出自己的请求。你可以拿最近一次共同安排来核对，先写下原本期待的结果，再比较双方当时掌握的信息。计划改变以后，一方可能希望尽快找到替代方案，另一方更想知道为什么发生变化。给解释与行动分别留出一点时间，会让两种需要更容易被满足。讨论结束时，把接下来由谁完成哪一步、什么时候确认进度说清楚。过几天再看看这个安排是否合适。相处方式可以学习与调整，不必让一次不顺畅的经历成为对人的固定评价。
      - heading: 教学示例 5：价值观与金钱：A 的木星与 B 的金星呈四分相
        knowledgeUnitId: synastry.western.jupiter_venus.square
        paragraphs:
          - A 的木星与 B
            的金星呈四分相。节奏上的张力可能让差异更明显，具体分工能减少反复争论；需要结合木星与金星各自的象征功能来理解。建议选择一笔日常支出，说明用途和可接受范围，再共同制定复盘时间。你可以把一段对话分成事实、感受与请求三个部分。事实是双方能描述的具体事情，感受属于个人体验，请求则是可以答应、拒绝或重新协商的动作。把三者混在一起容易让人听成指责；分开以后，讨论会更清楚。选择一个轻松的小问题先练习，给每个人完整说完的时间。需要暂停时约定什么时候回来，不把等待变成无限期的沉默。修复关系往往从一次愿意重新倾听开始，也需要持续尊重各自的边界。
      - heading: 教学示例 6：长期建议：A 的太阳与 B 的土星呈四分相
        knowledgeUnitId: synastry.western.sun_saturn.square
        paragraphs:
          - A 的太阳与 B
            的土星呈四分相。节奏上的张力可能让差异更明显，具体分工能减少反复争论；需要结合太阳与土星各自的象征功能来理解。建议每周选一个共同事项复盘，保留有效做法并调整一个不适合的环节。一个可核对的场景是一起处理日常任务：谁先提出想法，谁整理细节，谁提醒时间。把这些动作与个人价值分开看，暂时做得少也许只是空闲时间不同。可以先试行一个较小的分工，再约定如何提出修改。发生分歧时，记录两个人已经同意的条件，以及仍然需要查清的信息，不要让对话围着同一句评价打转。任务完成以后，回顾哪一步节省了精力、哪一步增加了压力，从中选择一个值得继续的做法。
      - heading: 教学示例 7：感情：A 的太阳与 B 的太阳呈三分相
        knowledgeUnitId: synastry.western.sun_sun.trine
        paragraphs:
          - A 的太阳与 B
            的太阳呈三分相。相近的表达习惯可能减少协调成本，也需要留意未经讨论的假设；需要结合太阳与太阳各自的象征功能来理解。建议分别写下三种喜欢的关心方式，问清楚哪些举动需要提前确认。例如，两个人都想获得支持，却可能分别通过安静陪伴和主动询问来表达。先问对方此刻需要倾听、建议还是实际帮助，可以减少好意没有被理解的情况。也给自己留下拒绝某种安排的空间，说明能够做到什么以及暂时做不到什么。共同活动以后，各自分享一个舒服的瞬间和一个还想调整的部分。让感谢指向具体举动，会比泛泛评价更容易让人理解。双方的意愿和感受是讨论的依据，符号只是辅助观察的语言。
      - heading: 你的练习与复盘
        paragraphs:
          - 选一条跨盘相位，记下 A 行星、B
            行星、类型与容许度。若有落宫，另记目标盘及其时间可靠性。双方各举一个日常例子，商定一个可调整的协作办法。复盘时看约定是否清楚，不用相位替任何一方描述动机。
  en:
    title: Locating cross-chart aspects and house overlays
    description: Cross-chart aspects compare a planet in A's chart with a planet in B's chart.
    sections:
      - heading: Locating cross-chart aspects and house overlays
        paragraphs:
          - "Cross-chart aspects compare a planet in A's chart with a planet in B's chart. House
            overlays locate a source planet in the target chart's houses. These are different kinds
            of information: one compares interacting themes, while the other supplies context from
            the target chart. Mark source, target, and house availability before interpreting prose.
            A natal aspect within one chart should not be mistaken for a cross-chart relationship."
      - heading: From structure to interpretation
        paragraphs:
          - "Planets with the same name can form a cross-chart aspect, and the declared orb rules
            determine which pairs are recorded. Two birth moments do not establish applying or
            separating motion in the transit sense, so this project does not output that claim for
            synastry. Overlays are directional: A's planet in B's house is not the same field as B's
            planet in A's house. If the target birth time is unknown, the overlay remains absent.
            The examples below contrast closeness, communication, and long-term themes through
            different planetary pairs. Each pair should be read on its own evidence rather than
            inferred from two separate records. A symbolic description can raise a question about
            pace or expectations, but it cannot show whether either participant has agreed to a
            particular arrangement. Ask each person directly. Some themes may seem inconsistent
            because they address different parts of interaction. You can preserve those viewpoints
            without forcing them into one label for the relationship. In a practical conversation,
            choose the theme most relevant to a current shared task and define what each person can
            request, change, or decline. The model is easier to use when those ordinary choices
            remain visible."
      - heading: How to work with the teaching examples
        paragraphs:
          - The examples below illustrate separate symbolic conditions. In each example, “you”
            addresses a hypothetical reader with that condition, not you personally. Some conditions
            are alternatives and cannot be combined into a single chart. Read the heading first,
            identify the idea being illustrated, and then notice how the explanation moves from a
            symbol to an ordinary situation and a modest suggestion. You do not need to identify
            with every example. A useful exercise is to rewrite one sentence as a question that you
            could observe in daily life. Keep a second note for anything that does not fit. This
            makes room for disagreement and stops a familiar description from becoming a label.
            These passages come from the same versioned editorial knowledge used by the reading
            engine; including them here demonstrates its writing method, not a calculation for a
            visitor. No birth information is required to study this page.
      - heading: 'Teaching example 1: affection: A’s venus and B’s mars form a conjunction'
        knowledgeUnitId: synastry.western.venus_mars.conjunction
        paragraphs:
          - 'A’s venus and B’s mars form a conjunction. The two functions occupy a similar direction
            and may amplify each other’s themes, especially where affection and preferences meets
            initiative and assertion. Try to each write down three welcome forms of care and ask
            which gestures need agreement in advance. Look at an everyday task: who suggests an
            idea, who organizes details, and who notices the time? Separate these actions from a
            judgment of personal worth. Doing less for a while may simply reflect different
            available time. Try a small division of responsibility and agree on how changes can be
            requested. When a difference appears, record the conditions already agreed and the
            information still needed. This keeps the conversation from circling one criticism. After
            finishing, identify a step that saved energy and a step that increased pressure, then
            choose what to keep. A chart offers a starting point for reflection, while each person
            remains free to choose how to participate.'
      - heading: 'Teaching example 2: affection: A’s mars and B’s venus form a opposition'
        knowledgeUnitId: synastry.western.mars_venus.opposition
        paragraphs:
          - 'A’s mars and B’s venus form a opposition. The two functions emphasize opposing
            perspectives; hearing both expectations can uncover common ground, especially where
            initiative and assertion meets affection and preferences. Try to each write down three
            welcome forms of care and ask which gestures need agreement in advance. Recall an
            activity that went smoothly. Identify the conditions present: enough time, a shared
            goal, and freedom to offer a different opinion. Bring those conditions into the next
            plan and observe the result. If an arrangement feels comfortable for only one person,
            change how it is carried out instead of requiring the other to share the same feeling.
            Modify one step at a time so the effect is easier to notice. Long relationships
            encounter changing work schedules and family responsibilities. Regular discussion of
            current circumstances is more useful than mechanically repeating an early agreement. A
            chart offers a starting point for reflection, while each person remains free to choose
            how to participate.'
      - heading: 'Teaching example 3: affection: A’s moon and B’s moon form a trine'
        knowledgeUnitId: synastry.western.moon_moon.trine
        paragraphs:
          - A’s moon and B’s moon form a trine. Similar habits may reduce coordination effort, while
            leaving some assumptions unspoken, especially where emotional safety and habitual
            responses meets emotional safety and habitual responses. Try to each write down three
            welcome forms of care and ask which gestures need agreement in advance. Consider a
            recent shared plan. Write down the outcome each person expected and the information
            available at the time. After a change, one person may want a replacement plan quickly
            while the other wants an explanation first. Leave room for both a reason and an action.
            At the end, clarify who will complete the next step and when progress will be checked.
            Review the arrangement a few days later. Ways of relating can be learned and revised; a
            single awkward experience need not become a permanent judgment about someone. A chart
            offers a starting point for reflection, while each person remains free to choose how to
            participate.
      - heading: 'Teaching example 4: communication: A’s mercury and B’s mercury form a sextile'
        knowledgeUnitId: synastry.western.mercury_mercury.sextile
        paragraphs:
          - A’s mercury and B’s mercury form a sextile. The two functions have room for cooperation
            that still requires deliberate participation, especially where language and information
            meets language and information. Try to repeat the other person’s view before making your
            own request during a small discussion. Consider a recent shared plan. Write down the
            outcome each person expected and the information available at the time. After a change,
            one person may want a replacement plan quickly while the other wants an explanation
            first. Leave room for both a reason and an action. At the end, clarify who will complete
            the next step and when progress will be checked. Review the arrangement a few days
            later. Ways of relating can be learned and revised; a single awkward experience need not
            become a permanent judgment about someone. A chart offers a starting point for
            reflection, while each person remains free to choose how to participate.
      - heading: 'Teaching example 5: values and money: A’s jupiter and B’s venus form a square'
        knowledgeUnitId: synastry.western.jupiter_venus.square
        paragraphs:
          - A’s jupiter and B’s venus form a square. Differences in timing may become visible;
            specific responsibilities can reduce recurring arguments, especially where growth and
            shared meaning meets affection and preferences. Try to choose an everyday expense,
            explain its purpose and acceptable range, and agree on a review date. Divide a
            conversation into an observation, a feeling, and a request. An observation describes an
            event both people can recognize. A feeling belongs to the person experiencing it. A
            request names an action that can be accepted, declined, or renegotiated. Mixing all
            three can sound like blame; separating them makes the discussion clearer. Practice with
            a small question and give each person time to finish. If a pause is needed, agree on a
            return time instead of leaving an indefinite silence. Repair often begins with a
            willingness to listen again while respecting boundaries. A chart offers a starting point
            for reflection, while each person remains free to choose how to participate.
      - heading: 'Teaching example 6: long-term advice: A’s sun and B’s saturn form a square'
        knowledgeUnitId: synastry.western.sun_saturn.square
        paragraphs:
          - 'A’s sun and B’s saturn form a square. Differences in timing may become visible;
            specific responsibilities can reduce recurring arguments, especially where identity and
            direction meets responsibility and limits. Try to review one shared responsibility each
            week, keep what works, and change one step that is uncomfortable. Look at an everyday
            task: who suggests an idea, who organizes details, and who notices the time? Separate
            these actions from a judgment of personal worth. Doing less for a while may simply
            reflect different available time. Try a small division of responsibility and agree on
            how changes can be requested. When a difference appears, record the conditions already
            agreed and the information still needed. This keeps the conversation from circling one
            criticism. After finishing, identify a step that saved energy and a step that increased
            pressure, then choose what to keep. A chart offers a starting point for reflection,
            while each person remains free to choose how to participate.'
      - heading: 'Teaching example 7: affection: A’s sun and B’s sun form a trine'
        knowledgeUnitId: synastry.western.sun_sun.trine
        paragraphs:
          - A’s sun and B’s sun form a trine. Similar habits may reduce coordination effort, while
            leaving some assumptions unspoken, especially where identity and direction meets
            identity and direction. Try to each write down three welcome forms of care and ask which
            gestures need agreement in advance. Two people may both want support but express it
            through quiet company or active questions. Ask whether the other person currently wants
            listening, a suggestion, or practical help. This can prevent a kind gesture from being
            misunderstood. Leave yourself room to decline an arrangement, explaining what you can do
            and what is currently beyond your capacity. After an activity, each share one
            comfortable moment and one part to adjust. Appreciation attached to a specific gesture
            is easier to understand than a broad judgment. Consent and lived feelings remain the
            basis of the conversation. A chart offers a starting point for reflection, while each
            person remains free to choose how to participate.
      - heading: Your practice and review
        paragraphs:
          - Select one recorded cross-chart aspect and note A's planet, B's planet, its type, and
            orb. If an overlay is available, record the target chart and the reliability of its
            birth time separately. Let both participants offer an everyday example before agreeing
            on an adjustable way to coordinate. You might clarify how to ask for a pause or how much
            notice a plan change needs. At review, ask whether the agreement was clear and useful.
            Do not use an aspect to assign motives to either person. If no current example fits,
            leave the theme as a study note. This approach lets you learn the technical distinction
            between an angular pair and a house context while keeping the relationship's actual
            communication and choices in the hands of the people involved.
