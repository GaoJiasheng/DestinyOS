      - heading: 'Teaching example 5: conflict patterns: The day stems show combine'
        knowledgeUnitId: synastry.relations.daystemrelations.combine
        paragraphs:
          - The day stems show combine. Stem and branch relationships describe symbolic structures;
            day pillars require the whole chart, while year pillars give a broader background. Try
