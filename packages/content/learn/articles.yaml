- system: iching
  slug: asking-and-methods
  zh:
    title: 怎样提问：梅花与六爻的入门边界
    description: 一个清楚的问题，比一个复杂的起卦仪式更有帮助。
    sections:
      - heading: 怎样提问：梅花与六爻的入门边界
        paragraphs:
          - 一个清楚的问题，比一个复杂的起卦仪式更有帮助。梅花易数（以时间、报数或随机方式形成卦象）与六爻（本项目采用三枚铜钱六次投掷）都需要问题情境，但技术读法不同。限定一个主题和观察期限，优先讨论你能采取的行动。
      - heading: 从结构到读法
        paragraphs:
          - 体用（梅花中自我与所问主题的三爻卦关系）与世应（六爻中自身和对应方的位置）不是同一个概念。六爻还结合月日与用神（与问题类别相关的指标）。如问是否参加课程，应同时核实时间、费用和内容，卦象只是补充反思。不要以起卦推断他人秘密或代替必要的直接沟通。
      - heading: 怎样使用下面的教学示例
        paragraphs:
          - 下面各段示例展示不同盘面条件下的读法，段中的「你」指假设的示例读者，并非对你的个人判断。这些条件可以互不相容，不应拼成一份命盘。先辨认标题的主题，再观察正文如何从符号走到生活例子与建议。你可以把喜欢的句子改写成一个待观察的问题，也可以记录不符合经验的部分。
      - heading: 教学示例 1：较长周期的支持，可以先看怎样落实
        knowledgeUnitId: iching.finding.month_supports
        paragraphs:
          - 你可以先核对较稳定的背景条件怎样帮助当前任务。月建（起卦月的地支）生扶（起卦月的地支五行（木火土金水的关系分类）支持相关爻）是六爻里观察较长背景的规则，相关爻由问题类别选定；这里命中的是月的支持，不代表所有条件都已经齐备，也不直接给出持续天数。例如，团队长期保留学习时段，但你仍需约定谁能指导、材料在哪里，才能把制度变成练习。建议把支持写成可核对的安排，先使用一轮再看缺口；如果日常仍有新的限制，也一并记录，不因为背景较有利就忽略短期负荷。
      - heading: 教学示例 2：背景限制值得单独识别，不必归为自己的不足
        knowledgeUnitId: iching.finding.month_controls
        paragraphs:
          - 你可以先找出持续限制来自哪里，再决定要调整什么。月建（起卦月的地支）克制（起卦月地支的五行（木火土金水的关系分类）约束相关爻）是较长背景的象征比较，相关爻是问题选出的观察位置；它不是判断个人能力或他人意图的方法，也不能据此推定现实中的障碍会持续多久。例如，一项任务总在同样的审批环节等待，可以整理所需材料与固定时间，而不是每次只增加催促。建议先问清一处最关键的要求，选择缩小范围、补足依赖或调整顺序；给方案留复查点，让真实变化能够改变你的行动。
      - heading: 教学示例 3：眼前的帮助可以使用，也需要接上后续安排
        knowledgeUnitId: iching.finding.day_supports
        paragraphs:
          - 你可以利用眼前到位的帮助完成一个具体环节。日辰（起卦日的地支）生扶（起卦日地支的五行（木火土金水的关系分类）支持相关爻）把注意力放在较近的配合条件，相关爻是按问题选择的观察焦点；它不等于只在今天有效，也不是对现实中某个人态度的判断。短期支持适合用来松动卡点，但仍需看后续如何衔接。例如，同事今天能够帮你核对材料，可以先确认最难的一处内容，再说明下一次交接需要什么，避免把一次帮助扩成长期默认。建议及时表达具体需要与感谢，记录本轮已完成的部分；其余条件继续单独检查，让当前便利成为稳妥的进展，而不是对全部结果的想象。
      - heading: 教学示例 4：临时限制出现时，先重排行动次序
        knowledgeUnitId: iching.finding.day_controls
        paragraphs:
          - 你可以把眼前的阻碍单独处理，不必因此否定整个方向。日辰（起卦日的地支）克制（起卦日地支的五行（木火土金水的关系分类）约束相关爻）是较近条件的象征比较，相关爻是问题选出的观察位置；这种关系不揭示个人动机，也不预测今天会发生什么。例如，一次交流临时取消时，可以先完成自己能整理的资料，约定新的联系入口，而不据此猜测对方已经拒绝全部合作。建议把需要确认的一项事实问清楚，同时保留小的备用安排；待信息更新后再评估，避免用一时受阻来扩大情绪或增加无谓投入。
      - heading: 教学示例 5：你向外投入较多时，也要确认资源怎样补充
        knowledgeUnitId: iching.finding.shi_generates_ying
        paragraphs:
          - 你可以关心对方的需要，同时看清自己能持续提供多少。世生应（世爻（象征自身一侧的位置）五行（木火土金水的关系分类）生扶应爻（象征相对接洽的位置）五行）象征自身一侧对外部一侧的支持，世爻代表你的位置，应爻代表相对的接洽；这不是要求你承担对方全部责任，也不说明给予越多越好。付出要结合范围与补充方式看。例如，选择共同方案时，你可能愿意多准备一份材料，但仍可以说明完成时间与需要对方提供的条件。建议把可承担的支持列清楚，保留休息与复查，问自己这项投入是否服务于共同目标；如果只是为了避免不安而不断加码，就先调整约定，让帮助建立在自愿而可维持的基础上。
      - heading: 教学示例 6：对面条件形成限制时，可以先重新谈承接范围
        knowledgeUnitId: iching.finding.ying_controls_shi
        paragraphs:
          - 你可以先说明不合适的条件，再商量怎样保留可行部分。应克世（应爻（象征相对接洽的位置）五行（木火土金水的关系分类）约束世爻（象征自身一侧的位置）五行）象征外部一侧限制自身一侧，世爻代表你的位置，应爻是相对的接洽；这种比较不揭示对方是否有敌意，也不说明你缺乏能力。宜把感到受制的地方变成实际要求来核对。例如，对方希望你在很短时间内回复复杂方案，可以说清还缺什么事实、何时能提供答复，并提出先确认一小部分。建议用明确的替代方式回应，而非在催促中不断增加承诺；也找可信的人帮助比较，让判断根据真正的需求与资源更新，保留暂停或不同路线的选择。
      - heading: 教学示例 7：所需线索不在明面时，先寻找合适入口
        knowledgeUnitId: iching.finding.hidden
        paragraphs:
          - 它适合提醒你了解资源为何还不容易使用。例如，一份资料存在于另一团队的整理目录中，知道它存在仍不足以完成任务，还需要联系人、合适权限与用途说明。建议用清楚的问题请求访问或反馈，先取得一项能核对的材料；如果入口仍模糊，就暂缓扩大承诺，保留现有记录，让信息逐步成为现实可用的条件。
      - heading: 教学示例 8：缺少直接对应时，重新明确你想了解的事
        knowledgeUnitId: iching.finding.absent
        paragraphs:
          - 用神（按问题类别选出的观察焦点）在当前明爻与伏神里都无对应，是结构里的缺项，不说明生活中缺少某个人，也不预示未来没有选择。例如，笼统问最近好不好，可能同时混合工作与情绪，可以先选一件正在推进的小事，列出希望知道的条件和可咨询的人。建议先进行现实核对，给新的问题确定时间范围与下一步；若直接信息已足够，也可以依据事实作判断，不必继续寻找一个符号来授权自己的行动。
      - heading: 你的练习与复盘
        paragraphs:
          - 写下问题、方法、时间范围和已知事实，再起卦一次。读后只保留一个需要核实的信息点和一个可逆的小行动。到复盘日比较行动与反馈，而非只问「吻不吻合」。信息不足时补问现实中的当事人，不用反复起卦填补事实空白。
  en:
    title: Asking a useful question in Plum Blossom and Six Lines
    description: A clear question helps more than a complicated casting ritual.
    sections:
      - heading: Asking a useful question in Plum Blossom and Six Lines
        paragraphs:
          - A clear question helps more than a complicated casting ritual. Mei Hua Yi Shu (梅花易数, méi
            huā yì shù — Plum Blossom) forms a figure through time, numbers, or a random draw in
            this project. Liu Yao (六爻, liù yáo — Six Lines) uses six tosses of three coins here.
            Both need a question context, but their technical interpretation is different. Choose
            one topic, identify a reasonable review period, and focus on actions within your
            control.
      - heading: From structure to interpretation
        paragraphs:
          - Do not treat Self and Subject trigrams in Plum Blossom as interchangeable with Self and
            Responding lines in Six Lines. They belong to different models. A Six Lines reading also
            considers the month, day, and a selected indicator associated with the question
            category. Those technical relationships can only be read after the cast and method are
            known. For a beginner, a useful question might be how to prepare for a course over the
            next few weeks. Confirm the course schedule, cost, and content through ordinary sources;
            the symbolic reading can add a question about your preparation, but cannot establish
            those facts. Avoid using a cast to infer another person's private intentions. Direct
            conversation gives information that a symbolic diagram cannot verify. The examples below
            show several kinds of support, constraint, and interaction used by the Six Lines
            framework. They are a way to recognize technical vocabulary in an explanation. They do
            not belong automatically to a Plum Blossom reading, and they are not all conditions of a
            single cast. Notice whether a passage names its basis, gives a concrete situation, and
            suggests something the reader can actually do.
      - heading: How to work with the teaching examples
        paragraphs:
          - The examples below illustrate separate symbolic conditions. In each example, “you”
            addresses a hypothetical reader with that condition, not you personally. Some conditions
            are alternatives and cannot be combined into a single chart. Read the heading first,
            identify the idea being illustrated, and then notice how the explanation moves from a
            symbol to an ordinary situation and a modest suggestion. You do not need to identify
            with every example. A useful exercise is to rewrite one sentence as a question that you
            could observe in daily life. Keep a second note for anything that does not fit. This
            makes room for disagreement and stops a familiar description from becoming a label.
            These passages come from the same versioned editorial knowledge used by the reading
            engine; including them here demonstrates its writing method, not a calculation for a
            visitor. No birth information is required to study this page.
      - heading: 'Teaching example 1: Look for the practical form of longer-running support'
        knowledgeUnitId: iching.finding.month_supports
        paragraphs:
          - 'You can inspect the practical shape of support that is meant to continue. Month support
            comes from yuè jiàn (the casting month’s branch) sharing or feeding the element of a
            selected line. It is a longer-background comparison within Liuyao, not a promise about a
            number of days or the readiness of every resource. Suppose a team regularly reserves
            time for learning: a mentor, accessible material, and an agreed task are still needed
            before the allowance becomes useful practice. Consider explicitly writing down how the
            support can be used and testing it once. Record a short-term constraint as well if one
            appears. A supportive background is easier to apply when you distinguish its steady
            provision from the specific arrangements needed today.'
      - heading: 'Teaching example 2: Identify a background constraint before adding more effort'
        knowledgeUnitId: iching.finding.month_controls
        paragraphs:
          - You can identify a repeating constraint before deciding how much more effort to invest.
            Month control comes from yuè jiàn (the casting month’s branch) constraining the element
            of a selected line. It is a background comparison, not a measure of competence or a
            revelation of someone’s motives. The label does not establish how long an actual
            obstruction will last. For instance, a task may repeatedly wait at the same review
            point; collecting the requirements and normal schedule can help more than sending
            another impatient request. Consider clarifying the most important condition, then
            adjusting scope, sequence, or preparation. Set a review so new facts can alter the
            arrangement. A recurring limit becomes easier to address when it has a concrete location
            rather than being attributed to your whole ability.
      - heading: 'Teaching example 3: Use immediate help without assuming it settles the whole plan'
        knowledgeUnitId: iching.finding.day_supports
        paragraphs:
          - You can use an immediate opening to complete one concrete part of the task. Day support
            comes from rì chén (the casting day’s branch) sharing or feeding the element of a
            selected line. It emphasizes a nearer influence, but does not set a literal expiry today
            or determine someone’s attitude toward you. A colleague who can check material now may
            help unlock a difficult point, while the next handover still needs its own arrangement.
            Try making the request more specific, acknowledging the assistance, and recording what
            was actually completed. Continue checking other conditions separately. Immediate
            convenience becomes more useful when it connects to a realistic next stage, rather than
            being treated as evidence that the whole outcome is already settled.
      - heading: 'Teaching example 4: Adjust the sequence around an immediate constraint'
        knowledgeUnitId: iching.finding.day_controls
        paragraphs:
          - 'You can isolate an immediate obstacle without rejecting the entire direction. Day
            control comes from rì chén (the casting day’s branch) constraining the element of a
            selected line. This is a nearer-condition comparison, not a prediction of today’s events
            or an account of someone’s intentions. Suppose a conversation is postponed: organize the
            part you can complete independently and agree on another point of contact, rather than
            inferring that the whole collaboration has been declined. Consider asking for the one
            fact you need and keeping a modest alternative available. Review the plan after the
            information changes. A temporary interruption becomes more manageable when its practical
            extent is named instead of being allowed to define the whole situation. Keep the request
            tied to a condition you can check.'
      - heading: 'Teaching example 5: Review the cost of support flowing from your side'
        knowledgeUnitId: iching.finding.shi_generates_ying
        paragraphs:
          - You can care about the other side’s needs while checking what you can continue to
            provide. Shi generates ying, or shì shēng yìng, means the shi line representing your
            position feeds the opposite ying line. This is a symbolic direction of support, not a
            requirement to assume another person’s whole responsibility. When choosing a shared
            plan, you may offer to prepare one document while still naming the time it needs and the
            material someone else must supply. Consider stating the scope of assistance and
            protecting a review interval and rest. Ask whether the contribution serves the common
            purpose or mainly eases anxiety through repeated overcommitment. Help remains more
            workable when it is voluntary, understood, and supported by resources that can be
            replenished.
      - heading: 'Teaching example 6: Renegotiate when an external demand exceeds your arrangement'
        knowledgeUnitId: iching.finding.ying_controls_shi
        paragraphs:
          - You can name an unsuitable condition and negotiate the workable part that remains. Ying
            controls shi, or yìng kè shì, places symbolic constraint from the opposing line onto the
            shi line representing your position. It does not establish hostility or define your
            ability. If someone wants an immediate answer to a complex proposal, explain the missing
            fact and a realistic response time, perhaps offering to settle one limited point first.
            Consider a concrete alternative rather than adding promises under pressure. Ask a
            trustworthy person to help compare the demand with the resources available. A pause or
            another route remains a choice. The purpose of the comparison is to clarify an external
            requirement, not to turn discomfort into a complete story about the other person’s
            intentions.
      - heading: 'Teaching example 7: Find a usable route to a less visible resource'
        knowledgeUnitId: iching.finding.hidden
        paragraphs:
          - You can organize existing clues before asking how to reach a less visible resource.
            Hidden refers to fú shén (a relative supplied from the pure palace figure when it is
            missing from the primary one), here relevant to the question’s focus. It is an
            additional symbolic position, not an allegation that someone has a secret. A useful
            guide may exist in another group’s archive while the contact, permission, and purpose
            needed to use it remain unclear. Consider making a precise request and obtaining one
            checkable item before expanding your commitment. Keep the record if access is still
            uncertain. The practical value is to turn a clue into an available condition rather than
            multiplying guesses about what is concealed behind the visible arrangement.
      - heading: 'Teaching example 8: Refine the question when there is no represented focus'
        knowledgeUnitId: iching.finding.absent
        paragraphs:
          - You can narrow the concern to a concrete situation and inspect its real information
            needs. Absent means no represented use god (yòng shén — the focus selected by category),
            either visible or supplied as a hidden relative. This is a gap in the symbolic
            arrangement, not evidence that a person is missing or a future choice is unavailable. A
            broad question about how things are going may combine work and mood; choose one current
            task and list the conditions you want to understand. Consider consulting an appropriate
            source, setting a useful time frame, and naming a next step. If direct information
            already answers the practical question, you can use it without waiting for a symbol to
            authorize the decision. Clarification is itself a workable form of progress.
      - heading: Your practice and review
        paragraphs:
          - Before casting, write the question, chosen method, review period, and known facts. Cast
            once and keep the record. After reading, retain one point you need to verify and one
            modest, reversible action. At the review date, compare your action with the feedback
            rather than asking only whether the wording felt accurate. If a missing fact concerns
            someone else's availability, ask them. If it concerns an organizer's policy, read the
            policy. A second cast cannot replace this information. You can also note how you would
            make the original question clearer next time. Perhaps it combined two topics, assumed an
            intention, or lacked a time frame. Improving the question makes the practice easier to
            review and reduces the temptation to stretch a general description across every possible
            outcome. The linked figure and terminology pages can support study of the model without
            requiring any private input.
