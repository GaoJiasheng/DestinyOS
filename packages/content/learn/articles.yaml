- system: tarot
  slug: deck-and-symbols
  zh:
    title: 78 张塔罗牌：从画面学会提问
    description: 塔罗的 78 张牌分为大阿卡那（22 张主要主题牌）与小阿卡那（56 张日常主题牌）。
    sections:
      - heading: 78 张塔罗牌：从画面学会提问
        paragraphs:
          - 塔罗的 78 张牌分为大阿卡那（22 张主要主题牌）与小阿卡那（56 张日常主题牌）。牌面图像提供观察语言，不是关于他人的秘密资料。本项目使用
            Rider–Waite–Smith 图像传统，先看人物、动作、环境与花色，再查关键词，通常比背诵牌义更容易理解。
      - heading: 从结构到读法
        paragraphs:
          - 小阿卡那四花色是权杖、圣杯、宝剑、星币；数字牌与宫廷牌提供不同的表达层。宫廷牌可以表示一种角色或方式，不需固定为某个性别的人。读单牌时先描述看见的细节，再区分你联想到的经验。下面类别与组合示例说明象征怎样连接到生活，但组合条件必须真的出现在牌阵中才讨论。
      - heading: 怎样使用下面的教学示例
        paragraphs:
          - 下面各段示例展示不同盘面条件下的读法，段中的「你」指假设的示例读者，并非对你的个人判断。这些条件可以互不相容，不应拼成一份命盘。先辨认标题的主题，再观察正文如何从符号走到生活例子与建议。你可以把喜欢的句子改写成一个待观察的问题，也可以记录不符合经验的部分。
      - heading: 教学示例 1：允许自我观察保持温和
        knowledgeUnitId: tarot.category.self
        paragraphs:
          - 你可以允许自我观察保持温和。自我类别关注感受、习惯与注意力；一个牌面是提问角度，不是心理诊断，也不要求你立刻把自己变成某种理想状态。这次牌阵的各个位置提供不同侧面，需要与问题的实际背景一起看。例如，你发现最近很分心时，可以记录哪类安排最耗精力，再给它留出调整空间。建议把自己的期待、可用资源和仍不清楚的地方分别写下；如果其中一项暂时无法核实，就保留这份不确定，先做另一个能够得到回应的小步骤。尚未得到回应的部分可以先保留。
      - heading: 教学示例 2：用职责与反馈回应工作问题
        knowledgeUnitId: tarot.category.career
        paragraphs:
          - 你可以用职责与反馈回应工作问题。工作类别关注任务、合作与学习条件；牌面适合提示你检查流程，不替组织或同事作决定，也不把一种角色固定成你的全部能力。这次牌阵的各个位置提供不同侧面，需要与问题的实际背景一起看。例如，你想参与新项目时，可以先确认交付要求与能获得的指导。不妨选取画面中一个最接近当前经验的细节，用它提出温和的问题；接着观察一次实际回应，把新的消息记下来，再判断是否需要改变原来的理解。尚未得到回应的部分可以先保留。
      - heading: 教学示例 3：让比较使用同一套标准
        knowledgeUnitId: tarot.category.decision
        paragraphs:
          - 你可以让比较使用同一套标准。选择类别帮助你分开目标、条件与代价；牌面不替你承担决定，也不把所有复杂差异缩成一个好坏标签。这次牌阵的各个位置提供不同侧面，需要与问题的实际背景一起看。例如，两个学习计划之间，可以先比较时间需求与支持方式，再做一次小范围尝试。试试将牌面主题改写成一个可以执行的小动作，注明开始与结束的时间；完成后比较自己的感受与事情的实际变化，让反馈决定下一步是否值得继续。尚未得到回应的部分可以先保留。
      - heading: 教学示例 4：先为宽泛问题选一个焦点
        knowledgeUnitId: tarot.category.general
        paragraphs:
          - 你可以先为宽泛问题选一个焦点。一般类别适用于尚未明确领域的问题；你可以从最关心的事情开始，再把牌面提示改写成可观察的条件，不必让解读同时回应所有生活层面。这次牌阵的各个位置提供不同侧面，需要与问题的实际背景一起看。例如，你觉得近期很忙时，可以先选一项重复安排，看看哪里能够简化。你可以与最相关的另一张牌比较，但不必让所有细节都讲成同一个故事；先辨认相同之处与差异，再挑出最值得在现实中问清楚的一件事。尚未得到回应的部分可以先保留。
      - heading: 教学示例 5：让新尝试借助手边能力
        knowledgeUnitId: tarot.combination.fool_magician
        paragraphs:
          - 你可以让新尝试借助手边能力。愚人关注新入口与探索，魔术师关注已有工具的运用；两张同现，可以把新鲜感转成一个具备实际准备的小试验。组合（两张特定牌同时出现的主题提示）不替代它们各自的牌位与正逆位读法。例如，想学摄影时，先用现有设备完成一次有明确主题的练习。你可以与最相关的另一张牌比较，但不必让所有细节都讲成同一个故事；先辨认相同之处与差异，再挑出最值得在现实中问清楚的一件事。也可以把这段联系记成问题，用下一次具体观察更新理解。
      - heading: 教学示例 6：把信心与可见进展放在一起
        knowledgeUnitId: tarot.combination.sun_star
        paragraphs:
          - 你可以把信心与可见进展放在一起。太阳关注清楚表达与分享，星星关注希望与温和投入；两张同现，提醒你既认可已经发生的进展，也照顾尚在形成的方向。组合（两张特定牌同时出现的主题提示）不替代它们各自的牌位与正逆位读法。例如，展示一个完成的小样后，继续安排不太费力的练习。试试将牌面主题改写成一个可以执行的小动作，注明开始与结束的时间；完成后比较自己的感受与事情的实际变化，让反馈决定下一步是否值得继续。也可以把这段联系记成问题，用下一次具体观察更新理解。
      - heading: 教学示例 7：给独立梳理与内在观察一段时间
        knowledgeUnitId: tarot.combination.hermit_priestess
        paragraphs:
          - 你可以给独立梳理与内在观察一段时间。隐士关注安静的整理，女祭司关注尚未说清的感受；两张同现，适合暂缓外部评价，但也可以在需要时取得支持。组合（两张特定牌同时出现的主题提示）不替代它们各自的牌位与正逆位读法。例如，作出回应前，先写几行笔记，再决定哪些疑问值得与人讨论。建议把自己的期待、可用资源和仍不清楚的地方分别写下；如果其中一项暂时无法核实，就保留这份不确定，先做另一个能够得到回应的小步骤。也可以把这段联系记成问题，用下一次具体观察更新理解。
      - heading: 教学示例 8：让协作反馈进入持续练习
        knowledgeUnitId: tarot.combination.three_pentacles_eight_pentacles
        paragraphs:
          - 你可以让协作反馈进入持续练习。星币三（以共同施工象征分工的牌）与星币八（以加工星币象征练习的牌）同现，适合让具体反馈帮助改进技术，不把忙碌数量当成学习效果。组合（两张特定牌同时出现的主题提示）不替代它们各自的牌位与正逆位读法。例如，完成一份小作品后，请伙伴指出一个细节，下一次只针对它练习。你可以与最相关的另一张牌比较，但不必让所有细节都讲成同一个故事；先辨认相同之处与差异，再挑出最值得在现实中问清楚的一件事。
      - heading: 你的练习与复盘
        paragraphs:
          - 每天选一张牌作观察练习，写三个画面事实、一个联想和一个待讨论问题。不要把这当作每天必须完成的仪式。回查牌页时先比较图像再比较文字；与朋友交流可以听到不同联想，但别用牌义替他人定义意图。
  en:
    title: Learning the 78-card deck through its images
    description:
      'A tarot deck has 78 cards: 22 Major Arcana, which organize broad themes, and 56 Minor
      Arcana, which offer everyday situations through four suits.'
    sections:
      - heading: Learning the 78-card deck through its images
        paragraphs:
          - 'A tarot deck has 78 cards: 22 Major Arcana, which organize broad themes, and 56 Minor
            Arcana, which offer everyday situations through four suits. The images provide a
            vocabulary for observation, not private information about another person. This project
            uses the Rider–Waite–Smith image tradition. Start with the figures, actions, setting,
            and suit before opening a keyword list. Looking carefully at the picture usually gives
            you a more useful question than trying to memorize every meaning before your first
            reading.'
      - heading: From structure to interpretation
        paragraphs:
          - "The Minor Arcana suits are Wands, Cups, Swords, and Pentacles. Number cards and court
            cards provide different forms of symbolic expression. A court card can suggest a role or
            manner of approach without representing a person of a fixed gender. In a single-card
            study, first describe what is visible: a gesture, object, landscape, or relationship
            between figures. Then write what you associate with it. The distinction matters because
            an association comes from your experience, while the visible detail can be checked by
            another reader. Neither is a fact about someone absent from the conversation. The
            selected examples include question categories and card combinations so you can see how
            an image vocabulary becomes an ordinary reflective prompt. A combination can only be
            discussed when the relevant cards are actually present; recognizing its theme does not
            establish that you drew it. For now, focus on the passage's movement from image to
            context to a modest suggestion. You can later compare the related card pages for their
            upright, reversed, and historical-symbolic explanations. Leave room for an image to mean
            little to you. A useful learning practice does not require finding a personal message in
            every card."
      - heading: How to work with the teaching examples
        paragraphs:
          - The examples below illustrate separate symbolic conditions. In each example, “you”
            addresses a hypothetical reader with that condition, not you personally. Some conditions
            are alternatives and cannot be combined into a single chart. Read the heading first,
            identify the idea being illustrated, and then notice how the explanation moves from a
            symbol to an ordinary situation and a modest suggestion. You do not need to identify
            with every example. A useful exercise is to rewrite one sentence as a question that you
            could observe in daily life. Keep a second note for anything that does not fit. This
            makes room for disagreement and stops a familiar description from becoming a label.
            These passages come from the same versioned editorial knowledge used by the reading
            engine; including them here demonstrates its writing method, not a calculation for a
            visitor. No birth information is required to study this page.
      - heading: 'Teaching example 1: A practical response for self'
        knowledgeUnitId: tarot.category.self
        paragraphs:
          - You can keep self reflection gentle and specific. This category explores feelings,
            habits and attention without providing a diagnosis or asking you to perform an ideal
            version of yourself. If distraction has become noticeable, record which arrangements
            consume the most energy. That observation can suggest a small change while leaving your
            whole identity outside the judgement of a single picture. You can give this observation
            a limited scope. Read the card in the context of the selected category and keep the
            discussion close to the issue you actually brought. Ask directly for information another
            person would need to provide. A useful next step has a clear purpose and does not
            require agreement with every symbol. Check what you learn afterwards, allowing the
            evidence to refine your view of the position. Keep the original question beside any
            information you obtain later.
      - heading: 'Teaching example 2: A practical response for career'
        knowledgeUnitId: tarot.category.career
        paragraphs:
          - You can respond to a work question through responsibilities and feedback. The category
            concerns tasks, collaboration and learning conditions, while an organisation's decisions
            remain outside the reading. A role is not a complete description of your abilities.
            Before joining a new project, asking about the expected deliverable and available
            guidance can make a first contribution easier to plan. You can compare this card with
            another relevant position while allowing a difference to remain. Note what the two
            pictures share and where they ask different questions. The category you chose helps keep
            that comparison grounded in everyday circumstances. Choose one detail to ask about
            outside the reading, then review the answer with your notes. You need not make every
            image support one conclusion to learn something useful from the arrangement. Keep the
            original question beside any information you obtain later.
      - heading: 'Teaching example 3: A practical response for decision'
        knowledgeUnitId: tarot.category.decision
        paragraphs:
          - You can compare options using the same standard. This category separates purpose,
            conditions and tradeoffs while leaving the decision with you. Different strengths need
            not collapse into a single good or bad label. For two learning plans, available time and
            the kind of support offered may be a useful starting pair of criteria before you choose
            a short trial. Consider one visual detail that resembles the situation you recognise.
            Use it to form a gentle question, then find an ordinary way to hear a response. A short
            note made before acting will help you distinguish the picture from assumptions you added
            yourself. Revisit that note after a few days. If the circumstances have changed, you can
            change the reading as well instead of treating an earlier impression as a lasting
            definition. Keep the original question beside any information you obtain later.
      - heading: 'Teaching example 4: A practical response for general'
        knowledgeUnitId: tarot.category.general
        paragraphs:
          - You can give a broad question one focus. The general category leaves room for an issue
            whose area is not yet clear, without requiring the spread to explain every part of your
            life. A busy week may be easier to examine through one recurring arrangement. Choose
            that example, then see whether the card's theme helps you ask a more concrete question
            about it. Try turning the image into one manageable action with a beginning and an end.
            Keep the selected category in view so the suggestion addresses the right area of your
            life. After trying it, compare how it felt with what actually changed. You may keep part
            of the idea and discard another part. This position offers an organised perspective,
            while the scale and timing of any response remain choices you can make. Keep the
            original question beside any information you obtain later.
      - heading: 'Teaching example 5: Two themes: fool magician'
        knowledgeUnitId: tarot.combination.fool_magician
        paragraphs:
          - You can support a fresh experiment with abilities already available. The Fool opens a
            possibility and the Magician brings tools into use. Together they invite a beginning
            that is curious but prepared. An interest in photography, for example, could become one
            themed exercise with the device you already have instead of a large purchase before any
            practice. A traveller approaches a cliff with a small bag, a white rose and an alert
            dog. Four suit objects lie on a table beneath a figure pointing upward and downward. Try
            setting a subject and a finishing time for the exercise before selecting more equipment.
            Afterwards, compare the result with the question you wanted to explore. A modest sample
            can show which skill needs attention next.
      - heading: 'Teaching example 6: Two themes: sun star'
        knowledgeUnitId: tarot.combination.sun_star
        paragraphs:
          - You can put visible progress beside patient encouragement. The Sun highlights openness
            and enjoyment, while the Star concerns hope supported by gentle effort. This pair
            invites you to acknowledge something already working without demanding that the whole
            undertaking be complete. Show a finished sample, then decide how to continue practising
            at a pace you can sustain. A child rides a white horse beneath a large sun beside
            sunflowers and a bright banner. A figure pours water onto land and into a pool beneath a
            field of stars. Try recognising one completed detail before setting a further goal.
            Someone else's encouragement can help, but your own note of what worked gives hope an
            observable basis. Leave the next practice small enough to repeat comfortably.
      - heading: 'Teaching example 7: Two themes: hermit priestess'
        knowledgeUnitId: tarot.combination.hermit_priestess
        paragraphs:
          - 'You can give a question time to become clearer before seeking an outside verdict. The
            Hermit supports deliberate solitude and the High Priestess attends to quieter
            impressions. A few notes may reveal what you actually want to ask. This does not require
            isolation: after thinking, decide which uncertainty would benefit from a conversation
            and which belongs to your own reflection. A cloaked figure stands on a height with a
            staff and a lantern containing a star. A seated figure holds a partly concealed scroll
            between two pillars and a patterned veil. Consider deciding when you will return to the
            notes. A defined interval lets a quiet impression settle without turning privacy into an
            endless delay. At the review, choose the one question that would benefit most from
            another perspective.'
      - heading: 'Teaching example 8: Two themes: three pentacles eight pentacles'
        knowledgeUnitId: tarot.combination.three_pentacles_eight_pentacles
        paragraphs:
          - You can let collaboration improve practice. The Three of Pentacles coordinates skills
            and the Eight of Pentacles focuses on repeated craft. After making a small piece, ask a
            collaborator to identify one detail worth refining. The next exercise can address that
            point specifically, so practice develops through feedback rather than through counting
            how many hours you remained busy. A craftsperson works inside an arch while two figures
            consult a plan. A seated craftsperson shapes a pentacle beside a vertical row of
            finished pieces. Try asking for feedback on the detail you intend to practise, so the
            response is usable in the next attempt. Compare versions afterwards. A collaborator's
            observation can give repetition direction without making approval the only measure of
            learning.
      - heading: Your practice and review
        paragraphs:
          - For an occasional study exercise, choose one card and write three visible details, one
            association, and one question worth discussing. There is no need to make this a
            compulsory daily ritual. When you revisit the card page, compare the picture before
            comparing the prose. If a friend sees a different theme, ask which detail led them
            there. This helps you learn how interpretation is built rather than deciding who has the
            only correct response. Avoid using a card description to define someone else's
            intentions. Direct conversation is the appropriate way to understand their view. Over
            several sessions, your notebook can show which images help you notice a practical choice
            and which invite assumptions that need checking. The point is to develop careful
            observation and a flexible symbolic vocabulary, not to turn a deck into a fixed
            assessment of yourself or the people around you.
