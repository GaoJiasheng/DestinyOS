      - heading: 'Teaching example 4: communication: A’s mercury and B’s moon form a trine'
        knowledgeUnitId: synastry.western.mercury_moon.trine
        paragraphs:
          - A’s mercury and B’s moon form a trine. Similar habits may reduce coordination effort,
