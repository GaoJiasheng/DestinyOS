- system: vedic
  slug: moon-and-nakshatra
  zh:
    title: 月亮星宿：从 27 分区到 Pada
    description: Nakshatra（月亮所在的 27 个黄道分区之一）比星座更细，每区又分四个 Pada（四分区）。
    sections:
      - heading: 月亮星宿：从 27 分区到 Pada
        paragraphs:
          - Nakshatra（月亮所在的 27 个黄道分区之一）比星座更细，每区又分四个
            Pada（四分区）。它们提供吠陀占星中的象征词汇，也参与周期计算。先确认月亮经度与边界，再读主题；未知出生时间时，靠近边界的结果应保持暂定。
      - heading: 从结构到读法
        paragraphs:
          - 27 区平均分割 360°，每区 13°20′，每个 Pada
            3°20′。名称、区主星与四分区属于不同字段，不能用名称联想替代定位。月亮不是整个人格，星宿也不是你必须遵守的身份。下面选取几组分区示例，练习把象征读成提问方向，而非把全部段落套在自己身上。
      - heading: 怎样使用下面的教学示例
        paragraphs:
          - 下面各段示例展示不同盘面条件下的读法，段中的「你」指假设的示例读者，并非对你的个人判断。这些条件可以互不相容，不应拼成一份命盘。先辨认标题的主题，再观察正文如何从符号走到生活例子与建议。你可以把喜欢的句子改写成一个待观察的问题，也可以记录不符合经验的部分。
      - heading: 教学示例 1：阿湿毗尼 · 第1分段：迅速回应
        knowledgeUnitId: vedic.moon.ashwini.pada_1.a
        paragraphs:
          - 你倾向于迅速回应。你的月亮位于阿湿毗尼星宿（恒星黄道二十七段区域之一）的第1分段，周期主星是计都（南月球交点的传统名称）；主星在这里是排列大运的参照，不另加性格定论。帕达（星宿四等分之一）对应九分盘（星座九等分的补充盘）的白羊，为心绪主题加入先试一步的修饰。可以把这个星宿想成起跑线：重点是启动之后怎样照顾节奏，而不是每次都跑在最前面。这里强调先动手再修正的节奏，并不衡量你比别人更有勇气。比如朋友准备搬家，你先帮忙列出第一箱该收什么，再询问接下来需要谁协助。建议先约定试做范围，再决定是否扩大投入。
      - heading: 教学示例 2：阿湿毗尼 · 第2分段：迅速回应
        knowledgeUnitId: vedic.moon.ashwini.pada_2.a
        paragraphs:
          - 你倾向于迅速回应。你的月亮位于阿湿毗尼星宿（恒星黄道二十七段区域之一）的第2分段，周期主星是计都（南月球交点的传统名称）；主星在这里是排列大运的参照，不另加性格定论。帕达（星宿四等分之一）对应九分盘（星座九等分的补充盘）的金牛，为心绪主题加入建立稳定的手感的修饰。可以把这个星宿想成起跑线：重点是启动之后怎样照顾节奏，而不是每次都跑在最前面。你可能更重视事情是否舒服、耐用、可以持续，而不是一次表现有多热闹。比如朋友准备搬家，你先帮忙列出第一箱该收什么，再询问接下来需要谁协助。建议保留稳定习惯，每次只调整一个细节。
      - heading: 教学示例 3：婆罗尼 · 第1分段：为承诺留空间
        knowledgeUnitId: vedic.moon.bharani.pada_1.a
        paragraphs:
          - 你倾向于为承诺留空间。你的月亮位于婆罗尼星宿（恒星黄道二十七段区域之一）的第1分段，周期主星是金星；主星在这里是排列大运的参照，不另加性格定论。把这个星宿想成承载物品的容器，可以帮助你区分愿意投入与实际装得下多少。你可能希望别人看见投入的心意，也愿意让成果带有自己的风格。比如接下组织活动的工作，你先确认场地、时间和自己的余量。建议答应之前留一点缓冲，而不是等到负担增加才重新协商。建议展示成果后，请别人反馈一个具体细节。
      - heading: 教学示例 4：克里提卡 · 第1分段：辨别关键差异
        knowledgeUnitId: vedic.moon.krittika.pada_1.a
        paragraphs:
          - 你倾向于辨别关键差异。你的月亮位于克里提卡星宿（恒星黄道二十七段区域之一）的第1分段，周期主星是太阳；主星在这里是排列大运的参照，不另加性格定论。帕达（星宿四等分之一）对应九分盘（星座九等分的补充盘）的射手，为心绪主题加入让探索连接实际经验的修饰。把这个星宿想成修剪工具，可以提醒你辨别什么该保留、什么可以删去，而不是对所有细节都严格。你可能喜欢新观点、新环境，以及能说明为什么值得投入的目标。比如讨论方案时，你指出一项含糊的要求，再询问怎样才能核对完成。建议把清晰用于问题本身，给人的表达留温度。建议把远期愿望拆成一项本周可体验的行动。
      - heading: 教学示例 5：罗希尼 · 第1分段：培育有触感的日常
        knowledgeUnitId: vedic.moon.rohini.pada_1.a
        paragraphs:
          - 你倾向于培育有触感的日常。你的月亮位于罗希尼星宿（恒星黄道二十七段区域之一）的第1分段，周期主星是月亮；主星在这里是排列大运的参照，不另加性格定论。帕达（星宿四等分之一）对应九分盘（星座九等分的补充盘）的白羊，为心绪主题加入先试一步的修饰。把这个星宿想成一片可以照看的园地，重点是日常投入如何留下可见变化。这里强调先动手再修正的节奏，并不衡量你比别人更有勇气。比如布置工作角落，你先调整光线和物品摆放，再观察使用是否舒服。建议让喜欢的东西服务实际生活，给变化留时间，不必一次安排得很满。建议先约定试做范围，再决定是否扩大投入。
      - heading: 教学示例 6：弥利伽尸罗 · 第1分段：带着问题探索
        knowledgeUnitId: vedic.moon.mrigashira.pada_1.a
        paragraphs:
          - 你倾向于带着问题探索。你的月亮位于弥利伽尸罗星宿（恒星黄道二十七段区域之一）的第1分段，周期主星是火星；主星在这里是排列大运的参照，不另加性格定论。帕达（星宿四等分之一）对应九分盘（星座九等分的补充盘）的狮子，为心绪主题加入让表达有清楚的方向的修饰。把这个星宿想成沿路寻找足迹，提醒你区分有用的探索与只是绕远。你可能希望别人看见投入的心意，也愿意让成果带有自己的风格。比如选一本入门书，你先看它能不能回答当前问题，再决定是否扩展阅读。建议给搜索一个收束点，把找到的信息转成下一步实践。建议展示成果后，请别人反馈一个具体细节。
      - heading: 教学示例 7：阿尔德拉 · 第1分段：在变化里整理感受
        knowledgeUnitId: vedic.moon.ardra.pada_1.a
        paragraphs:
          - 你倾向于在变化里整理感受。你的月亮位于阿尔德拉星宿（恒星黄道二十七段区域之一）的第1分段，周期主星是罗睺（北月球交点的传统名称）；主星在这里是排列大运的参照，不另加性格定论。帕达（星宿四等分之一）对应九分盘（星座九等分的补充盘）的射手，为心绪主题加入让探索连接实际经验的修饰。把这个星宿想成雨后的整理工作，可以提醒你先辨别发生了什么，再讨论下一步。你可能喜欢新观点、新环境，以及能说明为什么值得投入的目标。比如原有计划突然调整，你把事实、担心和需要协助的部分分别写下。建议先处理最具体的一项，允许情绪慢一点回到熟悉的节奏。建议把远期愿望拆成一项本周可体验的行动。
      - heading: 你的练习与复盘
        paragraphs:
          - 在示例图上标一个星宿起点与四个
            Pada，核对区间长度。选一段文字写出「位置事实」「象征提问」「我的经验」三行。若月亮贴近边界，把不确定性保留在笔记开头。记录不吻合的经历，不用更多解释覆盖缺少的出生信息。
  en:
    title: The Moon, Nakshatras, and their quarters
    description:
      A Nakshatra is one of 27 zodiac sectors used to describe the Moon's position in Vedic
      astrology.
    sections:
      - heading: The Moon, Nakshatras, and their quarters
        paragraphs:
          - A Nakshatra is one of 27 zodiac sectors used to describe the Moon's position in Vedic
            astrology. Each sector contains four quarters, called Padas. These divisions provide
            symbolic vocabulary and also enter the period calculation. Check the Moon's sidereal
            longitude and its proximity to a boundary before interpreting the theme. When birth time
            is unknown, a result near a boundary should remain provisional rather than acquire
            confidence through a longer description.
      - heading: From structure to interpretation
        paragraphs:
          - 'The 27 equal sectors divide 360 degrees into spans of 13 degrees and 20 minutes. Each
            quarter spans 3 degrees and 20 minutes. The sector name, period ruler, and Pada identify
            different parts of the model; an association with a name cannot replace checking the
            position. The Moon does not summarize a whole person, and a sector is not an identity
            you must conform to. The selected examples introduce several sectors and quarters so you
            can see how the editorial language moves from a symbol to a practical observation. Read
            them as alternatives. A quarter-specific theme requires the Moon actually to fall in
            that quarter under the declared sidereal settings. If the birth hour is uncertain,
            consider how much the Moon might move during the unknown interval and preserve the
            warning. A longer passage does not resolve a coordinate uncertainty. For study, it is
            useful to separate the numeric placement from the metaphor and from your own
            association. This keeps a familiar description from becoming evidence of a placement. It
            also helps when comparing services: differences in ayanamsa or time normalization can
            change a boundary assignment and should be examined before interpreting the apparent
            disagreement.'
          - You can mark a boundary on paper and place example longitudes on either side to see why
            a small coordinate difference may change the label. This is a geometry exercise. It does
            not make one side of the boundary a better or more complete description of a person.
      - heading: How to work with the teaching examples
        paragraphs:
          - The examples below illustrate separate symbolic conditions. In each example, “you”
            addresses a hypothetical reader with that condition, not you personally. Some conditions
            are alternatives and cannot be combined into a single chart. Read the heading first,
            identify the idea being illustrated, and then notice how the explanation moves from a
            symbol to an ordinary situation and a modest suggestion. You do not need to identify
            with every example. A useful exercise is to rewrite one sentence as a question that you
            could observe in daily life. Keep a second note for anything that does not fit. This
            makes room for disagreement and stops a familiar description from becoming a label.
            These passages come from the same versioned editorial knowledge used by the reading
            engine; including them here demonstrates its writing method, not a calculation for a
            visitor. No birth information is required to study this page.
      - heading: 'Teaching example 1: Ashwini, quarter 1: respond to an opening'
        knowledgeUnitId: vedic.moon.ashwini.pada_1.a
        paragraphs:
          - 'You may respond to an opening. Your Moon occupies quarter 1 of Ashwini, a Nakshatra —
            one of twenty-seven sidereal lunar sectors — whose period ruler is Ketu — the south
            lunar node; this ruler supplies a calculation reference, not an extra personality label.
            The Pada — one quarter of a sector — maps to Aries in Navamsa, the chart formed from
            nine divisions of each zodiac sign. Think of a starting line: the useful question
            concerns the first stretch rather than who finishes ahead. A direct approach can make
            uncertainty feel less abstract, although speed and readiness are separate questions.
            When a neighbour needs a hand carrying supplies, checking the route and taking one load
            can make help tangible. Try leaving room to learn what the next stage requires. Set a
            clear stopping point for an initial trial.'
      - heading: 'Teaching example 2: Ashwini, quarter 2: respond to an opening'
        knowledgeUnitId: vedic.moon.ashwini.pada_2.a
        paragraphs:
          - 'You may respond to an opening. Your Moon occupies quarter 2 of Ashwini, a Nakshatra —
            one of twenty-seven sidereal lunar sectors — whose period ruler is Ketu — the south
            lunar node; this ruler supplies a calculation reference, not an extra personality label.
            The Pada — one quarter of a sector — maps to Taurus in Navamsa, the chart formed from
            nine divisions of each zodiac sign. Think of a starting line: the useful question
            concerns the first stretch rather than who finishes ahead. You may prefer to understand
            what an arrangement feels like after repeated use rather than through a persuasive
            introduction. When a neighbour needs a hand carrying supplies, checking the route and
            taking one load can make help tangible. Try leaving room to learn what the next stage
            requires. Compare one familiar routine with a modest alternative.'
      - heading: 'Teaching example 3: Bharani, quarter 1: make room for commitments'
        knowledgeUnitId: vedic.moon.bharani.pada_1.a
        paragraphs:
          - You may make room for commitments. Your Moon occupies quarter 1 of Bharani, a Nakshatra
            — one of twenty-seven sidereal lunar sectors — whose period ruler is Shukra — Venus;
            this ruler supplies a calculation reference, not an extra personality label. The Pada —
            one quarter of a sector — maps to Leo in Navamsa, the chart formed from nine divisions
            of each zodiac sign. A container is a useful image for distinguishing willingness from
            capacity. Enjoying an audience can support creativity when there is also room for an
            honest response. When coordinating a shared meal, the invitations, preparation, and
            cleanup all belong in the agreement. Consider checking the full task before accepting
            it, and leave a margin for the part that people often overlook. Ask what your
            presentation helped someone notice.
      - heading: 'Teaching example 4: Krittika, quarter 1: identify the useful distinction'
        knowledgeUnitId: vedic.moon.krittika.pada_1.a
        paragraphs:
          - 'You may identify the useful distinction. Your Moon occupies quarter 1 of Krittika, a
            Nakshatra — one of twenty-seven sidereal lunar sectors — whose period ruler is Surya —
            the Sun; this ruler supplies a calculation reference, not an extra personality label.
            The Pada — one quarter of a sector — maps to Sagittarius in Navamsa, the chart formed
            from nine divisions of each zodiac sign. Think of a trimming tool: its value lies in a
            careful cut rather than removing everything that looks untidy. You may enjoy ideas that
            connect an ordinary task with a larger purpose. During a planning meeting, separating a
            requirement from a preference can make the task easier to finish. Try making the
            distinction explicit while leaving people room to explain their reasoning. Bring one
            observation from an unfamiliar setting into daily practice.'
      - heading: 'Teaching example 5: Rohini, quarter 1: cultivate a tangible routine'
        knowledgeUnitId: vedic.moon.rohini.pada_1.a
        paragraphs:
          - You may cultivate a tangible routine. Your Moon occupies quarter 1 of Rohini, a
            Nakshatra — one of twenty-seven sidereal lunar sectors — whose period ruler is Chandra —
            the Moon; this ruler supplies a calculation reference, not an extra personality label.
            The Pada — one quarter of a sector — maps to Aries in Navamsa, the chart formed from
            nine divisions of each zodiac sign. A garden offers a useful image for progress that
            depends on repeated care. A direct approach can make uncertainty feel less abstract,
            although speed and readiness are separate questions. Arranging a reading corner can
            involve testing the light and reach of a shelf rather than buying a complete new setup.
            Consider noticing which small change you continue to appreciate after the novelty fades.
            Set a clear stopping point for an initial trial.
      - heading: 'Teaching example 6: Mrigashira, quarter 1: explore through a question'
        knowledgeUnitId: vedic.moon.mrigashira.pada_1.a
        paragraphs:
          - You may explore through a question. Your Moon occupies quarter 1 of Mrigashira, a
            Nakshatra — one of twenty-seven sidereal lunar sectors — whose period ruler is Mangala —
            Mars; this ruler supplies a calculation reference, not an extra personality label. The
            Pada — one quarter of a sector — maps to Leo in Navamsa, the chart formed from nine
            divisions of each zodiac sign. A trail is a useful image for curiosity that needs
            occasional orientation. Enjoying an audience can support creativity when there is also
            room for an honest response. While choosing a beginner’s guide, checking whether it
            answers your current question can keep the search relevant. Try noting what you have
            learned before following the next link, so exploration gradually produces something you
            can use. Ask what your presentation helped someone notice.
      - heading: 'Teaching example 7: Ardra, quarter 1: organize experience during change'
        knowledgeUnitId: vedic.moon.ardra.pada_1.a
        paragraphs:
          - 'You may organize experience during change. Your Moon occupies quarter 1 of Ardra, a
            Nakshatra — one of twenty-seven sidereal lunar sectors — whose period ruler is Rahu —
            the north lunar node; this ruler supplies a calculation reference, not an extra
            personality label. The Pada — one quarter of a sector — maps to Sagittarius in Navamsa,
            the chart formed from nine divisions of each zodiac sign. Think of clearing a space
            after heavy rain: first identify what actually needs attention. You may enjoy ideas that
            connect an ordinary task with a larger purpose. If a schedule changes unexpectedly,
            separating facts from worries can make your response less crowded. Consider dealing with
            one practical consequence before asking yourself to feel comfortable with the whole
            change. Bring one observation from an unfamiliar setting into daily practice.'
      - heading: Your practice and review
        paragraphs:
          - "Mark a sector's start and its four quarters on a simple diagram, then check the
            interval lengths. Choose one example and write three lines: the placement fact, the
            symbolic question, and your experience. If the Moon is close to a boundary, put the
            uncertainty at the top of the note. Keep experiences that do not match the theme instead
            of explaining them away. More interpretation cannot supply a missing birth hour. You can
            use the exercise to learn how a sector is assigned and how its vocabulary is used
            without treating it as a fixed account of your emotional life. At a later review, ask
            whether the question helped you notice a routine, preference, or communication need.
            That modest observation is enough; the practice does not require a personal conclusion
            from every technical subdivision."
