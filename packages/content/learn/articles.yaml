# DESIGN-GAP: Offline-authored tutorials include labeled, selectively abridged knowledge examples with provenance.
- system: bazi
  slug: four-pillars
  zh:
    title: 怎么看懂自己的四柱
    description: 四柱（出生年、月、日、时的干支组合）是一张结构图，先看位置，再谈象征。
    sections:
      - heading: 怎么看懂自己的四柱
        paragraphs:
          - 四柱（出生年、月、日、时的干支组合）是一张结构图，先看位置，再谈象征。年柱、月柱、日柱、时柱并非四个互不相关的标签；日主（日柱上方、用来代表你的天干）提供观察中心，月令（出生月的节气背景）帮助理解季节。未知时辰时，保留三柱也能学习，但不要自行补出第四柱。
      - heading: 从结构到读法
        paragraphs:
          - 先核对公历与农历、出生地时区和真太阳时修正，再读年月日时。本项目以节气定月，晚子时按所选规则换日；与其他网站对照时，应先对齐这些参数。五行（木火土金水的分类）数量与旺衰（结合季节和支持关系的相对状态）不同，不要只找哪个字最多。下面日主与五行示例展示同一张表可以提出哪些具体问题。
      - heading: 怎样使用下面的教学示例
        paragraphs:
          - 下面各段示例展示不同盘面条件下的读法，段中的「你」指假设的示例读者，并非对你的个人判断。这些条件可以互不相容，不应拼成一份命盘。先辨认标题的主题，再观察正文如何从符号走到生活例子与建议。你可以把喜欢的句子改写成一个待观察的问题，也可以记录不符合经验的部分。
      - heading: 教学示例 1：甲木：观察你的推进方式
        knowledgeUnitId: bazi.day_master.jia
        paragraphs:
          - 你倾向于先确定方向，再沿着清楚的目标持续推进。甲木（日主的一种象征，像向上生长的树干）侧重原则与长程发展，你的日干采用这一标记，所以这里更关注目标感，而不是把你描绘成永远坚定的人。性格隐喻只是认识习惯的一种角度，你的经验与环境仍要一起看。比如你正在为搬家做准备，可以把必须先完成的事项列成短清单，并给依赖他人的环节预留缓冲时间。建议每天只确认一个关键节点，把可推迟的小事移到后面；稳妥来自清楚的优先级，不需要靠不断增加检查来获得安心。
      - heading: 教学示例 2：乙木：观察你的推进方式
        knowledgeUnitId: bazi.day_master.yi
        paragraphs:
          - 你往往能察觉环境变化，并寻找柔韧的推进方式。乙木（日主的一种象征，像攀援生长的藤蔓）强调适应与连接，你的日干以此为标记，所以观察重点是如何借助环境，不是评价你是否缺少主见。性格隐喻只是认识习惯的一种角度，你的经验与环境仍要一起看。比如你在两种兴趣之间犹豫，可以分别安排一次轻量体验，比较投入后是否愿意继续，而不是先决定长期身份。建议写下体验差异与下一步条件，让选择保留弹性；暂时没有明显偏好时，也可以以当前资源最方便的一项作为起点。
      - heading: 教学示例 3：丙火：观察你的推进方式
        knowledgeUnitId: bazi.day_master.bing
        paragraphs:
          - 你容易用直接表达和主动参与带动周围的气氛。丙火（日主的一种象征，像照亮环境的日光）关注公开表达与热情，你的日干落在这一类，所以这里观察的是参与感，而不是要求你随时保持外向。性格隐喻只是认识习惯的一种角度，你的经验与环境仍要一起看。比如你照料一个长期的小项目，可以用简短记录跟踪每次维护内容，把自己最熟悉的步骤整理成别人也能接手的说明。建议每月删掉一项已经没有用途的检查，让细致投入保持轻量，也给协作者留出按自己方法完成工作的空间。
      - heading: 教学示例 4：丁火：观察你的推进方式
        knowledgeUnitId: bazi.day_master.ding
        paragraphs:
          - 你倾向于在细节和熟悉的互动里维持稳定的投入。丁火（日主的一种象征，像需要照料的灯火）强调专注与细腻，你的日干采用这一标记，所以它更适合描述关注方式，不能据此推断情绪强弱。性格隐喻只是认识习惯的一种角度，你的经验与环境仍要一起看。比如你拥有熟悉的做法但项目需求变了，可以让另一位参与者先说明新条件，再共同调整原有流程。建议保留有效的核心，删掉不再适用的步骤；资源充足时也值得听取不同经验，让惯性变成可选择的方法，而不是默认的唯一道路。
      - heading: 教学示例 5：戊土：先认识一个习惯
        knowledgeUnitId: bazi.overview.wu_stem
        paragraphs:
          - 你往往愿意建立可靠的框架，让事情有序落地。戊土（日主的一种象征，像承托地形的山体）侧重稳定与边界，你的日干属于这一类，因此这里观察的是承载方式，不把承担更多视作你的义务。例如你可以回看最近一次顺利完成的小事，辨认自己用了哪些习惯。建议先保留一个有帮助的做法，再结合实际资源调整节奏，不用一次经历概括全部生活。
      - heading: 教学示例 6：己土：先认识一个习惯
        knowledgeUnitId: bazi.overview.ji
        paragraphs:
          - 你容易留意实际需要，愿意通过细致照料改善日常。己土（日主的一种象征，像可以培育作物的田地）强调整理与养护，你的日干以此为标记，所以这里关注具体维护，不能把照顾别人当作固定角色。例如你可以回看最近一次顺利完成的小事，辨认自己用了哪些习惯。建议先保留一个有帮助的做法，再结合实际资源调整节奏，不用一次经历概括全部生活。
      - heading: 教学示例 7：木：占比突出
        knowledgeUnitId: bazi.element.wood.excess.elements
        paragraphs:
          - 你可以观察目标增加时，是否仍给调整留有余地。木（传统五类象征中偏向生长与展开的一类）在这里提供规划和伸展的比喻，不表示某个身体部位的实际状态。你的盘中这一项占比达到四成，说明在加权分布里相对突出，不能独自判断它是有益还是需要调整。五行（五类变化象征）需要整体比较，小幅调整也应先看实际环境与体验。例如忙闲起伏较大的周，你可以在周初确认固定责任，再留一块可调整的时间处理临时请求。建议用实际完成量检验安排，不因某一天轻松就把整周排满；节奏的平衡是持续调整的过程，可以随着条件变化重新分配。
      - heading: 教学示例 8：水：未计入原盘
        knowledgeUnitId: bazi.element.water.missing.elements
        paragraphs:
          - 你可以观察接收信息时，是否也给行动确定一个起点。水（传统五类象征中偏向流动与储备的一类）在这里提供信息和休整的比喻，不表示身体含水量，也不能据此判断任何器官的状况。你的盘中这一项加权占比为零，表示原盘没有计算到该类成分，不等于现实生活缺少相应能力，也不要求补充物件。五行（五类变化象征）需要整体比较，小幅调整也应先看实际环境与体验。例如你想在日常安排中加入新习惯，可以先把它接到一个已有的稳定步骤之后，持续几次再判断是否合适。建议记录容易中断的情境，并调整难度而不是责备自己；生活里的支持也包括可重复的环境条件，不只来自个人意志。
      - heading: 你的练习与复盘
        paragraphs:
          - 拿一张已知时辰的示例盘，圈出日干、月支与流派参数，写下三个事实；然后把一条象征解释改成生活问题，例如「我怎样确定优先级？」一周后用具体记录回答。不能从盘里核实的经历保持空白。重新排盘时保留相同设置，先确认表格稳定，再比较文字。
  en:
    title: How to read your Four Pillars
    description:
      The Four Pillars (四柱, sì zhù — stem and branch pairs for birth year, month, day, and
      hour) are a structured diagram.
    sections:
      - heading: How to read your Four Pillars
        paragraphs:
          - The Four Pillars (四柱, sì zhù — stem and branch pairs for birth year, month, day, and
            hour) are a structured diagram. Start by locating the parts before interpreting them.
            Each pillar has an upper Heavenly Stem and a lower Earthly Branch. Together they
            describe a symbolic relationship, rather than four independent personality labels. The
            Day Master (日主, rì zhǔ — the day stem representing the reader) gives you a reference
            point. The month branch supplies a seasonal background. If the birth hour is unknown,
            leave the hour pillar absent; three visible pillars are more honest than a
            precise-looking fourth pillar invented from memory. This guide shows how to navigate the
            table and how to keep a technical observation separate from a personal conclusion.
      - heading: From structure to interpretation
        paragraphs:
          - 'Before reading the table, check whether the entered date was Gregorian or lunar, which
            time zone was used, and whether apparent solar time was applied. BaZi months follow
            solar terms, so a calendar month number does not directly identify the month pillar. A
            late Zi-hour can also change the assigned day under the selected rule. When two websites
            disagree, align those settings before comparing interpretations. Next, locate the day
            stem, note its element, and look at the month branch. Five Elements (五行, wǔ xíng — Wood,
            Fire, Earth, Metal, and Water) are categories in this symbolic model. A raw count and a
            strength assessment answer different questions: one counts appearances, while the other
            considers season and supporting relationships. A chart with many Wood symbols is not a
            measurement of kindness or an instruction to choose a particular profession. Notice the
            evidence stated in a passage and ask what other parts of the chart would be needed to
            qualify it. The contrasting Day Master examples below help you practice reading a
            metaphor without turning it into an identity. The element examples add another layer and
            should be read only when that condition is actually present.'
      - heading: How to work with the teaching examples
        paragraphs:
          - The examples below illustrate separate symbolic conditions. In each example, “you”
            addresses a hypothetical reader with that condition, not you personally. Some conditions
            are alternatives and cannot be combined into a single chart. Read the heading first,
            identify the idea being illustrated, and then notice how the explanation moves from a
            symbol to an ordinary situation and a modest suggestion. You do not need to identify
            with every example. A useful exercise is to rewrite one sentence as a question that you
            could observe in daily life. Keep a second note for anything that does not fit. This
            makes room for disagreement and stops a familiar description from becoming a label.
            These passages come from the same versioned editorial knowledge used by the reading
            engine; including them here demonstrates its writing method, not a calculation for a
            visitor. No birth information is required to study this page.
      - heading: 'Teaching example 1: Jia Wood: Observe your working rhythm'
        knowledgeUnitId: bazi.day_master.jia
        paragraphs:
          - You may prefer a clear purpose before investing effort. Jia Wood (jiǎ mù — the upright
            tree metaphor for your day stem) emphasizes direction and continuity; your recorded day
            stem supplies the basis for this reading. A volunteer project, for instance, may feel
            easier once you understand who it serves. A character metaphor is one perspective on
            habits; your experience and setting still matter. Preparing for a move can expose the
            difference between useful structure and endless checking. List the necessary first steps
            and allow extra time for anything that depends on another person. Try reviewing one key
            milestone each day while postponing minor choices that do not affect it. A reliable plan
            needs priorities and room for delays. More checks do not always add useful information,
            especially when they interrupt the work itself.
      - heading: 'Teaching example 2: Yi Wood: Observe your working rhythm'
        knowledgeUnitId: bazi.day_master.yi
        paragraphs:
          - You may notice a workable opening where a direct approach stalls. Yi Wood (yǐ mù — the
            climbing plant metaphor for your day stem) points toward adaptation and connection. In a
            shared household, you might find a workable routine by listening to several preferences
            before suggesting an arrangement. A character metaphor is one perspective on habits;
            your experience and setting still matter. Choosing between interests need not begin with
            a permanent identity. Arrange one modest experience in each and compare whether you want
            to continue afterward. You can note what differed and what the next step would require.
            Try using current access and available time as a starting criterion if no strong
            preference emerges. A reversible choice can produce useful information while preserving
            room for a different direction later.
      - heading: 'Teaching example 3: Bing Fire: Observe your working rhythm'
        knowledgeUnitId: bazi.day_master.bing
        paragraphs:
          - You may make an idea easier to grasp by bringing it into the open. Bing Fire (bǐng huǒ —
            the daylight metaphor attached to your day stem) highlights visibility and enthusiasm.
            At a community meeting, you might help others participate by stating an aim clearly and
            inviting their questions. A character metaphor is one perspective on habits; your
            experience and setting still matter. A small ongoing project often depends on quiet
            maintenance. Brief notes can show what was checked and help another person take over
            when you are unavailable. Try reviewing the checklist monthly and removing an item that
            no longer serves a purpose. This makes care easier to share. A clear handover also
            allows someone else to achieve the same useful result without copying every detail of
            your preferred method.
      - heading: 'Teaching example 4: Ding Fire: Observe your working rhythm'
        knowledgeUnitId: bazi.day_master.ding
        paragraphs:
          - You may engage most fully when attention has a definite focus. Ding Fire (dīng huǒ — the
            lamplight metaphor for your day stem) emphasizes care and concentration. You might
            prefer helping a learner solve one difficult step to delivering a broad speech,
            especially when their response helps you adjust. A character metaphor is one perspective
            on habits; your experience and setting still matter. A familiar process may need
            revision when the project changes. Invite another participant to describe the new
            conditions before adapting the old routine together. You can preserve a useful core
            while removing steps that no longer serve the task. Try asking which assumption changed
            most. Having ample resources does not make every established method appropriate;
            listening to another person’s experience can turn habit into a deliberate choice.
      - heading: 'Teaching example 5: Wu Earth: Begin with a familiar habit'
        knowledgeUnitId: bazi.overview.wu_stem
        paragraphs:
          - You may feel comfortable providing a structure that others can use. Wu Earth (wù tǔ —
            the mountain metaphor for your day stem) emphasizes steadiness and boundaries.
            Organizing a shared timetable could suit this tendency, provided the responsibility is
            agreed rather than quietly becoming yours by default. The Day Master (rì zhǔ — the stem
            used to represent you) is only one part of the chart, so the wider distribution and your
            real circumstances still matter. For a first reflection, you can recall a recent task
            that went smoothly and notice which choice helped it move forward. Consider repeating
            one useful habit on a modest scale, then checking the result. This overview offers a
            starting question rather than a complete personality assessment; keep room for new
            information and for situations in which you respond differently.
      - heading: 'Teaching example 6: Ji Earth: Begin with a familiar habit'
        knowledgeUnitId: bazi.overview.ji
        paragraphs:
          - You may see improvement in careful maintenance rather than dramatic changes. Ji Earth
            (jǐ tǔ — the cultivated ground metaphor for your day stem) stresses practical care.
            Keeping a shared resource list accurate might matter to you because it saves people
            effort, but the task should still have fair boundaries. The Day Master (rì zhǔ — the
            stem used to represent you) is only one part of the chart, so the wider distribution and
            your real circumstances still matter. For a first reflection, you can recall a recent
            task that went smoothly and notice which choice helped it move forward. Consider
            repeating one useful habit on a modest scale, then checking the result. This overview
            offers a starting question rather than a complete personality assessment; keep room for
            new information and for situations in which you respond differently.
      - heading: 'Teaching example 7: Wood: Prominent proportion'
        knowledgeUnitId: bazi.element.wood.excess.elements
        paragraphs:
          - Wood (mù — the growth and expansion category in the traditional five-element model)
            offers a planning metaphor. It does not describe the condition of any body part. You can
            reflect on whether new aims leave enough room to revise the route. Its weighted
            proportion reaches forty percent in this chart, making it prominent within the
            distribution. Prominence alone does not decide whether a symbolic theme is useful in a
            particular situation. The Five Elements (wǔ xíng — five symbolic modes) need whole-chart
            context; practical experience should guide any small adjustment. A week with uneven
            demands can begin with identifying fixed responsibilities and reserving one flexible
            interval. Use what you actually complete to assess the plan. You can avoid filling the
            entire week simply because one morning felt easy. Consider revising the schedule when
            conditions change. Balance is an ongoing adjustment between demands and available
            support, not a requirement to sustain the same pace regardless of interruptions or
            unexpected work.
      - heading: 'Teaching example 8: Water: No natal contribution'
        knowledgeUnitId: bazi.element.water.missing.elements
        paragraphs:
          - Water (shuǐ — the movement and reserve category) prompts reflection on information and
            recovery time. It does not measure bodily fluids or establish an organ’s condition. You
            can notice whether gathering possibilities is followed by a manageable starting point
            for action. Its weighted proportion is zero in this chart. That means the natal
            calculation contains no contribution from this category, not that you lack a
            corresponding ability or need special objects to supply it. The Five Elements (wǔ xíng —
            five symbolic modes) need whole-chart context; practical experience should guide any
            small adjustment. A new habit may be easier to try after an existing stable routine.
            Repeat it a few times and notice when it is interrupted. You can adjust the difficulty
            or the surrounding conditions instead of making the interruption a criticism of
            yourself. Consider what makes repetition convenient. Available support can include a
            predictable setting and a manageable starting step, not only determination or
            encouragement from other people.
      - heading: Your practice and review
        paragraphs:
          - For a first exercise, use one chart with a documented birth hour and circle the day
            stem, month branch, and school settings. Write three factual observations about the
            diagram without adding a personality claim. Then choose one symbolic explanation and
            turn it into a question, such as how you establish priorities when several tasks
            compete. Observe a small, ordinary situation for a week. Record what you did, what
            resources were available, and whether the question helped you notice a choice. An
            explanation that feels familiar is a starting point for reflection, not evidence that
            every part of the chart describes you. Keep unknown information blank. If you
            recalculate later, preserve the original settings so that a changed table can be traced
            to a changed input or rule. You can then use the linked terminology guide to explore one
            unfamiliar term at a time, instead of learning all the technical vocabulary before
            making a useful observation.
