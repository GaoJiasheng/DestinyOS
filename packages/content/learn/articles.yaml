- system: tarot
  slug: questions-and-spreads
  zh:
    title: 牌阵怎么选：让每个位置回答一件事
    description: 牌阵（为每张牌分配问题角色的结构）让多张牌有阅读顺序，张数多不代表信息更可靠。
    sections:
      - heading: 牌阵怎么选：让每个位置回答一件事
        paragraphs:
          - 牌阵（为每张牌分配问题角色的结构）让多张牌有阅读顺序，张数多不代表信息更可靠。一个清楚问题可以用单张聚焦，过程问题可用三张分层；初学时先确认每个位置要回答什么，再开始抽取。你能掌握的行动，比替别人猜想法更适合提问。
      - heading: 从结构到读法
        paragraphs:
          - 「过去—现在—未来」帮助回看过程，「情境—行动—结果」帮助组织当下选择；未来与结果都是象征方向，不是已确认事实。是非提示也不是成功率。不要看到某张牌后临时改变位置含义。下面示例对照两种三张结构，并提供讨论方向，你可以先用其中一种做完整记录。
      - heading: 怎样使用下面的教学示例
        paragraphs:
          - 下面各段示例展示不同盘面条件下的读法，段中的「你」指假设的示例读者，并非对你的个人判断。这些条件可以互不相容，不应拼成一份命盘。先辨认标题的主题，再观察正文如何从符号走到生活例子与建议。你可以把喜欢的句子改写成一个待观察的问题，也可以记录不符合经验的部分。
      - heading: 教学示例 1：过去：从旧经验中识别当前背景
        knowledgeUnitId: tarot.positions.three_ppf.past
        paragraphs:
          - 你可以从旧经验中识别当前背景。牌位（这张牌承担的观察角度）让同一个画面在不同位置回答不同问题。过去位讨论已经形成的习惯、记忆或背景；牌面不会补出未知的历史，也不需要你寻找某个对应事件。例如，你反复迟到时，可以回看此前如何估算出门时间，而不急着评价自己。可以先给这项观察划定范围，只讨论你手上这一件事；把需要别人补充的信息留给直接交流，并在几天后回看自己的记录，不急着扩大为长期判断。留意后续事实比寻找单一对应更有帮助，也可以把未确认的信息留给下一次实际交流。
      - heading: 教学示例 2：现在：先说明你现在看得见的情况
        knowledgeUnitId: tarot.positions.three_ppf.present
        paragraphs:
          - 你可以先说明你现在看得见的情况。牌位（这张牌承担的观察角度）让同一个画面在不同位置回答不同问题。现在位关注当下能够观察的状态；它与过去位区分，使你不必把旧印象直接当成今天的事实。例如，同一合作再次开始时，可以重新确认职责，而不是沿用上次的分工假设。试试将牌面主题改写成一个可以执行的小动作，注明开始与结束的时间；完成后比较自己的感受与事情的实际变化，让反馈决定下一步是否值得继续。留意后续事实比寻找单一对应更有帮助，也可以把未确认的信息留给下一次实际交流。
      - heading: 教学示例 3：未来：把趋势当成可以调整的方向
        knowledgeUnitId: tarot.positions.three_ppf.future
        paragraphs:
          - 你可以把趋势当成可以调整的方向。牌位（这张牌承担的观察角度）让同一个画面在不同位置回答不同问题。未来位描绘当前条件延续时值得留意的走向；它不设定事件日期，也保留行动和外界变化带来的差异。例如，你准备继续一种学习方法时，可以安排两周后的复盘，而不是预先认定效果。建议把自己的期待、可用资源和仍不清楚的地方分别写下；如果其中一项暂时无法核实，就保留这份不确定，先做另一个能够得到回应的小步骤。留意后续事实比寻找单一对应更有帮助，也可以把未确认的信息留给下一次实际交流。
      - heading: 教学示例 4：情境：先描述情境再决定怎么行动
        knowledgeUnitId: tarot.positions.three_sao.situation
        paragraphs:
          - 你可以先描述情境再决定怎么行动。牌位（这张牌承担的观察角度）让同一个画面在不同位置回答不同问题。情境位把问题放在资源、沟通与限制的背景中；它帮助你区分当前条件和希望出现的结果。例如，你准备组织一次聚会时，可以先确认参与者的空闲时间与可用空间。你可以与最相关的另一张牌比较，但不必让所有细节都讲成同一个故事；先辨认相同之处与差异，再挑出最值得在现实中问清楚的一件事。留意后续事实比寻找单一对应更有帮助，也可以把未确认的信息留给下一次实际交流。
      - heading: 教学示例 5：行动：选择自己能承担的一步
        knowledgeUnitId: tarot.positions.three_sao.action
        paragraphs:
          - 你可以选择自己能承担的一步。牌位（这张牌承担的观察角度）让同一个画面在不同位置回答不同问题。行动位讨论你可以调整的做法；它不替别人作决定，也不要求为了配合牌义而增加过多任务。例如，如果讨论常被打断，你可以先发一份简短议程，而不是要求所有人立刻改变。建议先写出一个已经知道的事实和一个仍待确认的条件，再读这张牌的正逆位与类别内容；如果图像暂时没有共鸣，可以保留问题而不强行套用。留意后续事实比寻找单一对应更有帮助，也可以把未确认的信息留给下一次实际交流。
      - heading: 教学示例 6：结果：用反馈观察行动后的发展
        knowledgeUnitId: tarot.positions.three_sao.outcome
        paragraphs:
          - 你可以用反馈观察行动后的发展。牌位（这张牌承担的观察角度）让同一个画面在不同位置回答不同问题。结果位讨论行动与条件一起作用后的可能反馈；它需要和情境、行动两张牌一起读，不能单独作定论。例如，尝试新的分工后，可以比较交接是否顺畅，再决定保持还是调整。不妨选取画面中一个最接近当前经验的细节，用它提出温和的问题；接着观察一次实际回应，把新的消息记下来，再判断是否需要改变原来的理解。留意后续事实比寻找单一对应更有帮助，也可以把未确认的信息留给下一次实际交流。
      - heading: 教学示例 7：把关系问题放回相互表达
        knowledgeUnitId: tarot.category.love
        paragraphs:
          - 你可以把关系问题放回相互表达。爱情类别关注连接、边界与回应；无论你目前是否有伴侣，都可以从自己愿意表达的需要开始，而不把牌面当成另一人思想的证据。这次牌阵的各个位置提供不同侧面，需要与问题的实际背景一起看。例如，你想增加联系时，可以询问彼此舒服的频率，也给拒绝或调整留空间。建议先写出一个已经知道的事实和一个仍待确认的条件，再读这张牌的正逆位与类别内容；如果图像暂时没有共鸣，可以保留问题而不强行套用。尚未得到回应的部分可以先保留。
      - heading: 教学示例 8：让比较使用同一套标准
        knowledgeUnitId: tarot.category.decision
        paragraphs:
          - 你可以让比较使用同一套标准。选择类别帮助你分开目标、条件与代价；牌面不替你承担决定，也不把所有复杂差异缩成一个好坏标签。这次牌阵的各个位置提供不同侧面，需要与问题的实际背景一起看。例如，两个学习计划之间，可以先比较时间需求与支持方式，再做一次小范围尝试。试试将牌面主题改写成一个可以执行的小动作，注明开始与结束的时间；完成后比较自己的感受与事情的实际变化，让反馈决定下一步是否值得继续。尚未得到回应的部分可以先保留。
      - heading: 你的练习与复盘
        paragraphs:
          - 先写问题、三个位置和复盘日期，再抽取。每张牌只写一句与该位置有关的提示，最后选择一项行动。复盘时记录现实反馈与最初的期待，区分二者。若改用更大牌阵，先说明新增位置解决什么阅读需求，避免单纯增加文字量。
  en:
    title: Choosing a spread that fits the question
    description: A spread assigns a question role to each card and gives several images a reading order.
    sections:
      - heading: Choosing a spread that fits the question
        paragraphs:
          - A spread assigns a question role to each card and gives several images a reading order.
            More cards do not automatically provide more reliable information. A clear question can
            use one card for focus; a process question can use three cards for separate layers.
            Before drawing, decide what each position is meant to address. Questions about actions
            you can take are easier to review than questions that try to read another person's
            private thoughts.
      - heading: From structure to interpretation
        paragraphs:
          - Past–Present–Future organizes a process over time, while Situation–Action–Outcome
            organizes a present choice. Future and Outcome remain symbolic directions, not verified
            facts. A yes-or-no prompt is likewise not a success probability. Keep the position
            meanings fixed after the draw; changing them because a card seems inconvenient
            undermines the exercise. The selected examples compare the two three-card structures and
            show how the same general image vocabulary serves different roles. Read the position
            before reading the card description. In an action position, ask what you could try. In
            an outcome position, ask what condition might deserve review if you follow the proposed
            approach. A useful question also has scope. “How can I prepare for the discussion this
            week?” is easier to examine than a question about every aspect of a relationship
            indefinitely. The real response of the other person still comes through conversation.
            After a draw, choose one practical step and a review date rather than adding more
            spreads until the wording feels complete. You can always study a related card page
            without drawing again. Separating study from repeated selection keeps the original
            record intact and makes it easier to notice whether the prompt changed anything useful.
      - heading: How to work with the teaching examples
        paragraphs:
          - The examples below illustrate separate symbolic conditions. In each example, “you”
            addresses a hypothetical reader with that condition, not you personally. Some conditions
            are alternatives and cannot be combined into a single chart. Read the heading first,
            identify the idea being illustrated, and then notice how the explanation moves from a
            symbol to an ordinary situation and a modest suggestion. You do not need to identify
            with every example. A useful exercise is to rewrite one sentence as a question that you
            could observe in daily life. Keep a second note for anything that does not fit. This
            makes room for disagreement and stops a familiar description from becoming a label.
            These passages come from the same versioned editorial knowledge used by the reading
            engine; including them here demonstrates its writing method, not a calculation for a
            visitor. No birth information is required to study this page.
      - heading: 'Teaching example 1: Past: read the role first'
        knowledgeUnitId: tarot.positions.three_ppf.past
        paragraphs:
          - You can look for an earlier habit that still shapes the present. The past position
            concerns background and remembered experience; it cannot recover unknown history.
            Repeated lateness, for instance, may become easier to understand when you review how you
            previously estimated preparation and travel time. Try recalling one occasion with enough
            detail to describe the sequence. Was preparation shorter than you expected, or did the
            task change? You need not reconstruct an entire personal story to learn from that
            example. Select one estimate to revise the next time the situation arises. A past
            position becomes useful when it helps you bring an earlier lesson into the present
            without treating the lesson as an unchangeable rule. You can review the note after an
            ordinary experience gives you more information.
      - heading: 'Teaching example 2: Present: read the role first'
        knowledgeUnitId: tarot.positions.three_ppf.present
        paragraphs:
          - You can start with what is observable now. The present position separates current
            circumstances from the background described elsewhere. When a collaboration resumes,
            this means asking about today’s responsibilities rather than assuming the old
            arrangement still applies. Name the fact that has changed before interpreting the image.
            You can ask each participant what has changed since the previous task. Compare the
            answers with your own expectations and note any missing agreement. An updated division
            of work might be enough; a larger redesign may not be necessary. Use the card's theme to
            organise that check, then rely on the responses you obtain. A present position should
            leave you with a clearer picture of current conditions, including the parts still
            uncertain. You can review the note after an ordinary experience gives you more
            information.
      - heading: 'Teaching example 3: Future: read the role first'
        knowledgeUnitId: tarot.positions.three_ppf.future
        paragraphs:
          - 'You can treat the future position as a direction to review, not an appointment with an
            event. It explores what may deserve attention if present conditions continue. A study
            method, for example, can be tested over two weeks with a planned review rather than
            accepted as an inevitable result. Consider deciding what you will record during the
            trial: perhaps whether the routine fits your available time and helps you remain
            interested. At the review point, look at those notes before choosing whether to
            continue. The image may help you imagine a direction, but your observations show what
            that direction asks in practice. You can shorten, expand or stop the experiment as your
            needs and the conditions around you change. You can review the note after an ordinary
            experience gives you more information.'
      - heading: 'Teaching example 4: Situation: read the role first'
        knowledgeUnitId: tarot.positions.three_sao.situation
        paragraphs:
          - You can describe the setting before choosing a response. The situation position frames
            resources, communication and limits without confusing them with the outcome you want.
            For a gathering, available space and people’s actual free time belong here, before the
            enthusiasm of planning takes over. You can list what is fixed, what is negotiable and
            what has not yet been confirmed. For the gathering, that might mean a known room,
            flexible timing and an unanswered invitation. Read the card beside those three groups.
            It may highlight a point needing attention, but it does not move an unknown fact into
            the known column. Begin the action only when the necessary arrangement is clear enough
            for a comfortable attempt. You can review the note after an ordinary experience gives
            you more information.
      - heading: 'Teaching example 5: Action: read the role first'
        knowledgeUnitId: tarot.positions.three_sao.action
        paragraphs:
          - You can choose a response within your own responsibility. The action position concerns
            what you could change, rather than decisions assigned to someone else. If a discussion
            keeps losing focus, a short agenda is a practical experiment. You need not demand that
            everyone adopt a new personality. Try making the agenda brief enough that people can
            respond to it. One question, a proposed order and a finishing time may be sufficient.
            Notice whether the discussion changes after that adjustment; if it does not, ask what
            else participants need. The card can suggest an approach, but a useful action has
            limits. Choose a change you can carry out and evaluate without making other people's
            behaviour your responsibility. You can review the note after an ordinary experience
            gives you more information.
      - heading: 'Teaching example 6: Outcome: read the role first'
        knowledgeUnitId: tarot.positions.three_sao.outcome
        paragraphs:
          - You can review the outcome as feedback on an action in its setting. This position
            belongs beside situation and action, rather than functioning as an independent promise.
            After testing a division of work, compare how the handover felt and what was completed
            before deciding whether to keep it. Try agreeing in advance what a helpful handover
            would look like. Is the next person able to begin without another round of
            clarification? Do the instructions remain manageable? Check those points after a trial
            rather than deciding that one smooth day proves the whole arrangement. An outcome
            position offers a direction for evaluation. It can help you notice feedback that
            supports a revision as readily as feedback that supports continuing. You can review the
            note after an ordinary experience gives you more information.
      - heading: 'Teaching example 7: A practical response for love'
        knowledgeUnitId: tarot.category.love
        paragraphs:
          - You can bring a relationship question back to mutual expression. Whether you have a
            partner or are considering a connection, your needs and the other person's choices
            remain distinct. A card cannot establish a private thought. Asking what rhythm of
            contact feels comfortable may give both people more room than interpreting silence as a
            complete answer. Consider making separate notes for your expectation, the resources
            available and the detail you still cannot confirm. Read the image beside those notes
            rather than as a substitute for them. If one condition is outside your control, choose a
            smaller observation you can make without pressure. Return to the question when something
            changes. That approach makes uncertainty workable and keeps your attention on the part
            of the situation you can understand. Keep the original question beside any information
            you obtain later.
      - heading: 'Teaching example 8: A practical response for decision'
        knowledgeUnitId: tarot.category.decision
        paragraphs:
          - You can compare options using the same standard. This category separates purpose,
            conditions and tradeoffs while leaving the decision with you. Different strengths need
            not collapse into a single good or bad label. For two learning plans, available time and
            the kind of support offered may be a useful starting pair of criteria before you choose
            a short trial. Consider one visual detail that resembles the situation you recognise.
            Use it to form a gentle question, then find an ordinary way to hear a response. A short
            note made before acting will help you distinguish the picture from assumptions you added
            yourself. Revisit that note after a few days. If the circumstances have changed, you can
            change the reading as well instead of treating an earlier impression as a lasting
            definition. Keep the original question beside any information you obtain later.
      - heading: Your practice and review
        paragraphs:
          - Write the question, three position meanings, and a review date before drawing. For each
            card, record one prompt that belongs to its assigned position. Then choose one action.
            At review, keep actual feedback separate from what you hoped would happen. This makes it
            possible to see whether a broad description helped you prepare or simply echoed an
            expectation. If you later choose a larger spread, explain what additional question each
            new position will organize. Adding cards merely to increase the amount of text can make
            the reading less clear. A complete three-card record is often a better learning tool
            than several unfinished layouts. You can use the encyclopedia links to compare imagery
            and the terminology guide to check an unfamiliar word, while keeping your private
            question out of a public link or shared study note.
