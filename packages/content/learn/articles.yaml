- system: bazi
  slug: luck-and-years
  zh:
    title: 大运流年怎么读：区分背景与当年主题
    description: 大运（约十年的干支背景）与流年（某一年的干支）是两个时间尺度，先分层，再读互动。
    sections:
      - heading: 大运流年怎么读：区分背景与当年主题
        paragraphs:
          - 大运（约十年的干支背景）与流年（某一年的干支）是两个时间尺度，先分层，再读互动。它们叠加在原局（出生四柱）上，不会把原有结构擦掉。起运岁数与顺逆方向由所选规则推导，不能直接用整十岁的生日代替。年份主题适合复盘和计划，不是事件日历。
      - heading: 从结构到读法
        paragraphs:
          - 先记起运时间、当前大运和目标年份，再比较它们与日主及原局的关系。合（结合类关系）与冲（对照、变化类关系）须指出是哪两处互动，不能只读一个醒目的字。相同流年落在不同原局中，条件并不相同。也要区分出生支之间的关系与当年新加入的关系。下面示例用于观察这些差异，不代表每年都应同时套用。
      - heading: 怎样使用下面的教学示例
        paragraphs:
          - 下面各段示例展示不同盘面条件下的读法，段中的「你」指假设的示例读者，并非对你的个人判断。这些条件可以互不相容，不应拼成一份命盘。先辨认标题的主题，再观察正文如何从符号走到生活例子与建议。你可以把喜欢的句子改写成一个待观察的问题，也可以记录不符合经验的部分。
      - heading: 教学示例 1：六合：协作衔接
        knowledgeUnitId: bazi.relation.combine.luck_timeline
        paragraphs:
          - 你可以留意哪些合作条件让事情更容易衔接。六合（两支在传统关系表里构成的配对）强调连接，原盘记录的组合并不自动改变五行，也不表示现实意见总会一致。这里依据原盘关系，不是当前阶段或某一年的事件预告；可以把它作为定期复盘的主题。比如你想分享刚完成的作品，可以先选一个小范围展示，问观众哪些信息最清楚、哪里仍有疑问，再决定下一次公开表达的重点。建议把反馈写成可修改的事项，不把赞许或沉默当作全部评价，给持续投入留出稳定节奏。
      - heading: 教学示例 2：六冲：调整与差异
        knowledgeUnitId: bazi.relation.clash.luck_timeline
        paragraphs:
          - 你可以把不同节奏看成需要协商的调整条件。六冲（两支在传统表里位置相对的关系）强调差异与调整，原盘出现它不描述现实事件，也不意味着关系会出现问题。这里依据原盘关系，不是当前阶段或某一年的事件预告；可以把它作为定期复盘的主题。比如你与同事对处理次序意见不同，可以分别列出风险、期限和已有证据，再选择最可撤回的一步先做。建议把检验时间写进方案，允许事实改变决定；明确行动与愿意修正可以同时存在，不必把改变主意视为失去立场。
      - heading: 教学示例 3：三合：共同方向
        knowledgeUnitId: bazi.relation.tri_combine.luck_timeline
        paragraphs:
          - 你可以留意不同资源能否围绕一个方向协作。三合（三支构成的传统组合，记录也可能是半合）强调方向相近，是否完整要看专业视图的标记，不把关系存在写成已经完成转化。这里依据原盘关系，不是当前阶段或某一年的事件预告；可以把它作为定期复盘的主题。比如你正在为搬家做准备，可以把必须先完成的事项列成短清单，并给依赖他人的环节预留缓冲时间。建议每天只确认一个关键节点，把可推迟的小事移到后面；稳妥来自清楚的优先级，不需要靠不断增加检查来获得安心。
      - heading: 教学示例 4：刑：反复与边界
        knowledgeUnitId: bazi.relation.punish.luck_timeline
        paragraphs:
          - 你可以留意哪些规则或反复习惯需要重新说明。刑（特定支组合或自刑的传统标签）适合观察反复要求与边界，名称不是法律判断，也不预告处罚或伤害。这里依据原盘关系，不是当前阶段或某一年的事件预告；可以把它作为定期复盘的主题。比如朋友向你征求建议，你可能很快想到多种方案，可以先询问对方最在意的限制，再只分享两条与情境相关的选择。建议确认对方需要建议还是倾听，把丰富联想收束到当前问题，让信息流动帮助理解，而不是使谈话增加更多待决定事项。
      - heading: 教学示例 5：害：细节摩擦
        knowledgeUnitId: bazi.relation.harm.luck_timeline
        paragraphs:
          - 你可以通过确认细节减少不必要的误解。害（特定两支配对的传统关系）提供细节摩擦的比喻，原盘出现这个名称不能说明他人的动机，也不意味着有人会对你不利。这里依据原盘关系，不是当前阶段或某一年的事件预告；可以把它作为定期复盘的主题。比如你拥有熟悉的做法但项目需求变了，可以让另一位参与者先说明新条件，再共同调整原有流程。建议保留有效的核心，删掉不再适用的步骤；资源充足时也值得听取不同经验，让惯性变成可选择的方法，而不是默认的唯一道路。
      - heading: 教学示例 6：破：修订约定
        knowledgeUnitId: bazi.relation.break.luck_timeline
        paragraphs:
          - 你可以留意原有约定是否仍适合现在的条件。破（特定两支配对的传统标签）强调结构需要检查的观察角度，原盘记录它不意味着现实关系或资源会被损坏。这里依据原盘关系，不是当前阶段或某一年的事件预告；可以把它作为定期复盘的主题。比如收到一个超出熟悉范围的邀请，可以先确认是否有指导、资料和试行时间，再说明愿意承担的部分。建议把学习成本列进安排，必要时缩小范围；谨慎接受条件并不妨碍探索，清楚的支持反而有助于持续投入。
      - heading: 教学示例 7：木：平衡方向
        knowledgeUnitId: bazi.use_god.wood.favorable
        paragraphs:
          - 你可以观察目标增加时，是否仍给调整留有余地。木（传统五类象征中偏向生长与展开的一类）在这里提供规划和伸展的比喻，不表示某个身体部位的实际状态。你的喜用列表包含这一类，表示当前简化模型把它作为平衡方向。颜色、季节、方位与行业只是传统联想，可以用来增加观察趣味，不作为现实决定的依据。例如一个流程经常卡在最后一步，你可以先找出真正阻碍交付的条件，再处理它，而不是同时改动所有环节。建议让使用者测试新方法，并记录是否减少等待；果断可以体现在选择一个清楚的问题，不需要用更快的语速或更强的姿态证明自己。
      - heading: 教学示例 8：水：留意投入边界
        knowledgeUnitId: bazi.use_god.water.unfavorable
        paragraphs:
          - 你可以观察接收信息时，是否也给行动确定一个起点。水（传统五类象征中偏向流动与储备的一类）在这里提供信息和休整的比喻，不表示身体含水量，也不能据此判断任何器官的状况。你的忌神列表包含这一类，表示简化模型不优先增加它的象征主题，不是现实事物有害。你不需要避开某个颜色、季节、方位或职业，只需观察实际负担是否合适。比如你对一段交流仍有疑问，可以把听到的话与自己的猜测分开，找一个合适时机提出具体问题。建议允许对方补充背景，不用细微语气推断全部意思；敏感的观察可以帮助沟通，但仍需要真实回应来修正理解。
      - heading: 你的练习与复盘
        paragraphs:
          - 画三行时间表：原局事实、大运背景、目标流年。只写报告中能定位的关系，再加真实安排，如课程期限或工作交接。每月复盘一次已采取的行动与反馈，避免为每件小事反复查年份标签。出生时间、时区或流派改动后，先重新核对起运点，再比较新旧文字。
  en:
    title: Reading Luck Pillars and Annual Pillars
    description:
      A Luck Pillar (大运, dà yùn — an approximately ten-year stem and branch cycle) and an
      Annual Pillar (流年, liú nián — a year's stem and branch) operate on different time scales.
    sections:
      - heading: Reading Luck Pillars and Annual Pillars
        paragraphs:
          - A Luck Pillar (大运, dà yùn — an approximately ten-year stem and branch cycle) and an
            Annual Pillar (流年, liú nián — a year's stem and branch) operate on different time
            scales. Read them as layers over the natal chart. A new cycle does not erase the
            original Four Pillars or replace the reader's circumstances. The starting age and
            direction are calculated under the chosen school rules; simply dividing life into
            birthdays ending in zero misses that step. This guide separates the long background from
            an annual theme and shows how to make a reflective timeline without treating symbolic
            labels as a calendar of events.
      - heading: From structure to interpretation
        paragraphs:
          - Start with the calculated cycle start, identify the current Luck Pillar, and choose a
            specific year to study. Then compare each layer with the natal stems and branches. A
            combination (合, hé — a combining relationship) or clash (冲, chōng — an opposing
            relationship) should name the two positions involved. A visible label without its pair
            provides too little evidence for an interpretation. The same Annual Pillar encounters
            different natal structures in different charts, so it cannot describe everyone born in a
            particular year in the same way. Also separate a relationship already present at birth
            from one introduced by a cycle. The two may share a name while answering different
            questions. A seasonal strength assessment can add background, but it still belongs to a
            declared model rather than an objective measure of life quality. Read the selected
            examples as alternatives. They illustrate how a changed context might prompt review of
            routines, resources, or communication. They do not establish that a particular external
            event will happen. When looking back, use notes recorded before the review where
            possible; hindsight can make a broad theme appear more specific than it was. When
            looking forward, combine the symbolic theme with known commitments, practical
            constraints, and information from the people involved.
      - heading: How to work with the teaching examples
        paragraphs:
          - The examples below illustrate separate symbolic conditions. In each example, “you”
            addresses a hypothetical reader with that condition, not you personally. Some conditions
            are alternatives and cannot be combined into a single chart. Read the heading first,
            identify the idea being illustrated, and then notice how the explanation moves from a
            symbol to an ordinary situation and a modest suggestion. You do not need to identify
            with every example. A useful exercise is to rewrite one sentence as a question that you
            could observe in daily life. Keep a second note for anything that does not fit. This
            makes room for disagreement and stops a familiar description from becoming a label.
            These passages come from the same versioned editorial knowledge used by the reading
            engine; including them here demonstrates its writing method, not a calculation for a
            visitor. No birth information is required to study this page.
      - heading: 'Teaching example 1: Liù hé: coordination'
        knowledgeUnitId: bazi.relation.combine.luck_timeline
        paragraphs:
          - A natal pair forms liù hé — a table-defined branch combination. The connection provides
            a cooperation metaphor; it does not automatically transform elements or establish
            agreement between real people. This is natal evidence, not a transit forecast. You can
            bring the question to a periodic review without assigning an event to a year. Sharing a
            new piece of work can begin with a small audience. Ask which part was clear and where
            people still had questions, then use the answers to shape the next presentation. You can
            turn feedback into specific edits rather than a general verdict about the work or its
            maker. Try keeping a steady sharing rhythm that leaves room for preparation and rest,
            instead of relying entirely on immediate audience response.
      - heading: 'Teaching example 2: Liù chōng: adjustment and difference'
        knowledgeUnitId: bazi.relation.clash.luck_timeline
        paragraphs:
          - Liù chōng — opposing branches in the traditional relationship table — prompts attention
            to differences and adjustment. A natal opposition is not an event forecast and does not
            establish a problem between actual people. This is natal evidence, not a transit
            forecast. You can bring the question to a periodic review without assigning an event to
            a year. Different views about task order can be compared using deadlines, risks, and
            available evidence. You might choose the most reversible next step rather than debating
            the entire plan at once. Try setting a review point so that new information can change
            the decision. Clear action and openness to revision can coexist. An updated plan need
            not mean the earlier position lacked value; it can show that the test produced
            information worth using.
      - heading: 'Teaching example 3: Sān hé: shared direction'
        knowledgeUnitId: bazi.relation.tri_combine.luck_timeline
        paragraphs:
          - Sān hé — a three-branch grouping that may also be recorded as a partial pair — offers a
            shared-direction metaphor. Check the completeness flag in the detailed chart. The
            relationship does not prove that an elemental transformation has occurred. This is natal
            evidence, not a transit forecast. You can bring the question to a periodic review
            without assigning an event to a year. Preparing for a move can expose the difference
            between useful structure and endless checking. List the necessary first steps and allow
            extra time for anything that depends on another person. Try reviewing one key milestone
            each day while postponing minor choices that do not affect it. A reliable plan needs
            priorities and room for delays. More checks do not always add useful information,
            especially when they interrupt the work itself.
      - heading: 'Teaching example 4: Xíng: repetition and boundaries'
        knowledgeUnitId: bazi.relation.punish.luck_timeline
        paragraphs:
          - Xíng — a traditional label for specified branch groupings or self-repetition — is used
            here to examine recurring demands and boundaries. It is not a legal conclusion or a
            prediction of punishment or harm. This is natal evidence, not a transit forecast. You
            can bring the question to a periodic review without assigning an event to a year. A
            friend asking for help may need a listening ear rather than a long list of options.
            Check the main constraint and whether advice is welcome before sharing possibilities.
            You can offer two relevant choices and pause for their response. Try keeping the
            conversation close to the question they actually brought. Connecting ideas is valuable
            when it increases understanding, but a widening range of suggestions can also create
            more decisions than someone wanted to make.
      - heading: 'Teaching example 5: Hài: small frictions'
        knowledgeUnitId: bazi.relation.harm.luck_timeline
        paragraphs:
          - Hài — a specified pair in the branch relationship table — supplies a metaphor for small
            frictions. Its presence cannot identify another person’s intentions or establish that
            anyone will act against you. This is natal evidence, not a transit forecast. You can
            bring the question to a periodic review without assigning an event to a year. A familiar
            process may need revision when the project changes. Invite another participant to
            describe the new conditions before adapting the old routine together. You can preserve a
            useful core while removing steps that no longer serve the task. Try asking which
            assumption changed most. Having ample resources does not make every established method
            appropriate; listening to another person’s experience can turn habit into a deliberate
            choice.
      - heading: 'Teaching example 6: Pò: revising arrangements'
        knowledgeUnitId: bazi.relation.break.luck_timeline
        paragraphs:
          - Pò — a specified branch pairing — invites a review of whether an arrangement still fits.
            A recorded natal pair does not mean that real relationships or resources will be
            damaged. This is natal evidence, not a transit forecast. You can bring the question to a
            periodic review without assigning an event to a year. An invitation outside your
            familiar area can be assessed by the guidance, materials, and trial time available.
            State the part you are prepared to take on and include learning time in the arrangement.
            You can narrow the scope if those conditions are missing. Try asking for a first
            checkpoint rather than accepting the whole assignment at once. Clear support makes
            exploration easier to sustain and allows both sides to understand what the commitment
            includes.
      - heading: 'Teaching example 7: Wood: Balancing direction'
        knowledgeUnitId: bazi.use_god.wood.favorable
        paragraphs:
          - Wood (mù — the growth and expansion category in the traditional five-element model)
            offers a planning metaphor. It does not describe the condition of any body part. You can
            reflect on whether new aims leave enough room to revise the route. Your favorable list
            includes this category as a balancing direction in the simplified model. Traditional
            associations with colours, seasons, directions, and occupations can add cultural
            interest, but they are not evidence for a practical decision. A process that repeatedly
            stalls near completion may need one well-chosen repair. Identify the actual blocking
            condition before changing the whole workflow. You can ask a user to test the revised
            step and observe whether waiting decreases. Consider treating that observation as the
            measure of a useful decision. Decisiveness can mean choosing a precise problem and
            checking the result, rather than increasing urgency or pressing everyone to move at the
            same speed.
      - heading: 'Teaching example 8: Water: Review the commitment'
        knowledgeUnitId: bazi.use_god.water.unfavorable
        paragraphs:
          - Water (shuǐ — the movement and reserve category) prompts reflection on information and
            recovery time. It does not measure bodily fluids or establish an organ’s condition. You
            can notice whether gathering possibilities is followed by a manageable starting point
            for action. Your unfavorable list includes this category, meaning the simplified model
            does not prioritize adding its symbolic theme. This does not make real colours, seasons,
            directions, or occupations harmful. Actual conditions determine what is suitable for
            you. An ambiguous conversation can leave room for several explanations. Separate what
            was actually said from what you inferred, then ask a specific question at a suitable
            moment. You can let the other person supply context that a tone or brief message cannot
            reveal. Try updating your understanding with their response. Sensitivity to detail can
            support communication, provided an interpretation remains open to correction rather than
            growing into certainty through repeated private analysis.
      - heading: Your practice and review
        paragraphs:
          - "Draw a timeline with three rows: natal facts, cycle background, and the chosen Annual
            Pillar. Add only relationships you can locate in the chart. Beside it, keep a separate
            list of real commitments such as a course deadline, a move, or a handover at work. A
            reasonable planning question is what preparation would make those commitments easier,
            regardless of the symbolic theme. Review the timeline once a month and note actions and
            feedback, rather than consulting a year label for every small decision. If the birth
            time, time zone, or school settings change, verify the cycle start again before
            comparing interpretations. A changed paragraph may reflect changed parameters rather
            than a newly discovered fact about your future. The useful outcome of this exercise is a
            clearer understanding of the model's layers and a manageable plan. You remain free to
            set aside a theme that adds no helpful perspective to your actual situation."
