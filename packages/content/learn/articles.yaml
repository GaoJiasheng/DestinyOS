  slug: timing-and-direction
  zh:
    title: 时机与方位：把奇门提示用于准备
    description: 方位提示适合提醒你留意路线、资源与协作方式，不是行动结果的概率。
    sections:
      - heading: 时机与方位：把奇门提示用于准备
        paragraphs:
          - 方位提示适合提醒你留意路线、资源与协作方式，不是行动结果的概率。奇门起局围绕明确时刻，时区、节气交接与所用流派都会影响底图。先确定一个现实任务与可复盘期限，再看模型提出什么准备问题。
      - heading: 从结构到读法
        paragraphs:
          - 起局时间与实际出行时间可能不同，应分别记录。一个方位标签不要求绕远路或忽视实际限制；空亡（模型中的未落实状态）、伏吟（重复类结构）等也应连同用神与宫位读。下面用方位与状态示例说明如何把语言改为核实信息、预留缓冲、明确下一步。
      - heading: 怎样使用下面的教学示例
        paragraphs:
          - 下面各段示例展示不同盘面条件下的读法，段中的「你」指假设的示例读者，并非对你的个人判断。这些条件可以互不相容，不应拼成一份命盘。先辨认标题的主题，再观察正文如何从符号走到生活例子与建议。你可以把喜欢的句子改写成一个待观察的问题，也可以记录不符合经验的部分。
      - heading: 教学示例 1：候选方向：北
        knowledgeUnitId: qimen.directions.north
        paragraphs:
          - 你可以把北方列为可比较的候选方向。此宫在当前局中满足吉门与吉星条件，也没有规则所排除的空亡、门迫、入墓或击刑；仍要核对它与你想做的事是否相关。例如，附近北侧有一个适合短谈的公共空间时，可以比较交通和开放安排，不必为遵循方向而增加很长的路程。建议只在可行选项之间使用这一提示，并为改地点保留余量。吉方（符合此刻筛选规则的宫位方向）只对这张局有效，之后若问题或时刻不同，应重新核对，不自行推算到未来日期。你可以先问场地方是否需要提前准备。
      - heading: 教学示例 2：候选方向：东
        knowledgeUnitId: qimen.directions.east
        paragraphs:
          - 你可以先比较东方候选与当前计划的实际适配程度。这个方向来自满足筛选规则的宫位，不是要求你向东行动的命令。例如，东侧有一处适合展示材料的空间时，可以先核对设备与接待方式，再决定是否约在那里；如果必要条件不足，也可以使用另一个更方便的地点。建议只在可行选项之间使用这一提示，并为改地点保留余量。吉方（符合此刻筛选规则的宫位方向）只对这张局有效，之后若问题或时刻不同，应重新核对，不自行推算到未来日期。你可以先问场地方是否需要提前准备。
      - heading: 教学示例 3：候选方向：南
        knowledgeUnitId: qimen.directions.south
        paragraphs:
          - 你适合把南方候选与活动的实际目的放在一起比较。方向来自该宫吉门、吉星与相关标记的筛选，不表示展示规模应该扩大。例如，南侧有一个便于分享作品的地点时，可以先了解设备、使用时段和观众人数，让场地条件与你准备呈现的内容保持一致。建议只在可行选项之间使用这一提示，并为改地点保留余量。吉方（符合此刻筛选规则的宫位方向）只对这张局有效，之后若问题或时刻不同，应重新核对，不自行推算到未来日期。你可以先问场地方是否需要提前准备。
      - heading: 教学示例 4：候选方向：西
        knowledgeUnitId: qimen.directions.west
        paragraphs:
          - 你适合先比较西方候选是否便于清楚沟通。这个方向由符合吉门吉星与标记规则的宫位给出，不能仅凭方向判断安排会有怎样的结果。例如，想约一次短交流时，可以先查西侧地点是否有适合谈话的环境，再决定会面方式；较短的线上核对也可能满足相同目的。建议只在可行选项之间使用这一提示，并为改地点保留余量。吉方（符合此刻筛选规则的宫位方向）只对这张局有效，之后若问题或时刻不同，应重新核对，不自行推算到未来日期。你可以先问场地方是否需要提前准备。
      - heading: 教学示例 5：落实前先核实
        knowledgeUnitId: qimen.flags.void
        paragraphs:
          - 你适合把尚未落实的环节单独标出来。空亡（本旬两支对应宫位的缺位标记）在盘中表示某宫的条件需要进一步核实，不等于事情没有希望。它可能提醒你区分已拿到的资料和只是听说的安排，尤其是对方尚未回复的部分。例如，讨论场地时，口头说可以借用和已经确认预约是两件事；把它们写在不同栏里，有助于减少来回等待。建议先确认资源是否实际可用，再安排后续。复查时，可以只改一项条件，并记录调整前后的差别，避免同时改动太多而难以判断原因。盘面只标出此刻某宫的结构，是否与你的问题直接有关，还要看相关指标的实际位置。
      - heading: 教学示例 6：移动要配合准备
        knowledgeUnitId: qimen.flags.horse
        paragraphs:
          - 你可以把移动当成改变信息来源的机会。马星（按时支推得的移动标记）所在宫给出出行与切换场景的象征线索，但并不要求你立即离开原来的位置。这个标记与适合出发是不同层次的判断，仍需核对相关门星和交通条件。例如，远程沟通反复不清楚时，换到能安静谈话的场所可能有帮助；涉及实际旅程时，则要先了解路线和接驳。建议出发前列好路线、联系人和时间余量。复查时，可以只改一项条件，并记录调整前后的差别，避免同时改动太多而难以判断原因。盘面只标出此刻某宫的结构，是否与你的问题直接有关，还要看相关指标的实际位置。
      - heading: 教学示例 7：重复处适合复查
        knowledgeUnitId: qimen.flags.fu_yin
        paragraphs:
          - 你倾向于从熟悉的流程里找到下一步。伏吟（天盘星回到地盘本位的重复结构）提示某宫的节奏可能停留在原有安排，适合检查已经做过的事情；它不是要求你无限等待。同一份资料反复传递时，问题可能在交接而非努力程度。例如，小组一直讨论相同议题却没决定负责人，可以回到上次纪要，找出没有明确归属的步骤，把讨论变成具体分工。建议给重复问题补一个负责人和复盘点。复查时，可以只改一项条件，并记录调整前后的差别，避免同时改动太多而难以判断原因。盘面只标出此刻某宫的结构，是否与你的问题直接有关，还要看相关指标的实际位置。
      - heading: 教学示例 8：变动中留调整空间
        knowledgeUnitId: qimen.flags.fan_yin
        paragraphs:
          - 你适合预留调整方案的空间。反吟（天盘星移到本位对宫的对向结构）在盘中提示位置关系发生较明显的改变，因此行动节奏可能出现往返、转向或重新协调。它不能单独说明某人会改变心意，也不代表所有变动都不利。例如，团队突然换了会议时间，你可以先确认谁受影响，再决定是改成异步讨论还是保留一个短会，避免为了维持原计划让所有人赶路。建议为重要安排准备一个可切换的替代方案。复查时，可以只改一项条件，并记录调整前后的差别，避免同时改动太多而难以判断原因。盘面只标出此刻某宫的结构，是否与你的问题直接有关，还要看相关指标的实际位置。
      - heading: 你的练习与复盘
        paragraphs:
          - 选一次可逆的小安排，例如约定讨论时间，写好现实可用时段与需确认的人。把方位提示当作检查清单的一条，再完成真实确认。复盘时记录哪项准备减少了误会，哪条象征没有作用；交通、场地与安全安排仍以实际条件为依据。
  en:
    title: Using timing and direction as preparation prompts
    description: Direction prompts can help you review routes, resources, and coordination.
    sections:
      - heading: Using timing and direction as preparation prompts
        paragraphs:
          - Direction prompts can help you review routes, resources, and coordination. They are not
            probabilities of an action's outcome. A Qi Men board is tied to an explicit moment; the
            time zone, solar-term boundary, and chosen school affect its structure. Begin with a
            real task and a review period, then ask what preparation question the model adds.
            Keeping those foundations visible prevents a symbolic direction from becoming a
            substitute for checking the actual place, people, and timing of an activity.
      - heading: From structure to interpretation
        paragraphs:
          - Record the casting time separately from any planned departure or meeting time. A
            direction label does not require taking an impractical route or ignoring a venue's
            arrangements. Void and repeating configurations are technical descriptions within the
            model and need to be read with the selected indicator and palace. They do not establish
            that an appointment will fail or that a person will act a particular way. The selected
            examples show several directions and states so that you can practice converting them
            into preparation questions. What information has not been confirmed? Where is a handover
            likely to need more time? Which resource is available, and who can confirm it? These
            questions can be useful even if you set the symbolic layer aside afterward. For
            comparison between boards, preserve the exact moment and location settings rather than
            changing several inputs at once. This allows you to trace whether a difference comes
            from time normalization, solar terms, or school rules. It also avoids the temptation to
            keep trying different moments until a preferred symbol appears. A useful timing exercise
            ends with a manageable plan based on known constraints, not an obligation to consult the
            board for every routine step.
      - heading: How to work with the teaching examples
        paragraphs:
          - The examples below illustrate separate symbolic conditions. In each example, “you”
            addresses a hypothetical reader with that condition, not you personally. Some conditions
            are alternatives and cannot be combined into a single chart. Read the heading first,
            identify the idea being illustrated, and then notice how the explanation moves from a
            symbol to an ordinary situation and a modest suggestion. You do not need to identify
            with every example. A useful exercise is to rewrite one sentence as a question that you
            could observe in daily life. Keep a second note for anything that does not fit. This
            makes room for disagreement and stops a familiar description from becoming a label.
            These passages come from the same versioned editorial knowledge used by the reading
            engine; including them here demonstrates its writing method, not a calculation for a
            visitor. No birth information is required to study this page.
      - heading: 'Teaching example 1: Candidate Direction: North'
        knowledgeUnitId: qimen.directions.north
        paragraphs:
          - You can put a northern option on a practical shortlist. The engine selected this palace
            because its gate and star meet the supportive rule without the specified exclusion
            flags. A nearby northern venue may be worth comparing for a short conversation, but
            transport, opening times and the actual purpose of the meeting still come first.
            Consider using this cue only between feasible alternatives and keep room to change the
            venue. A favourable direction is a selected palace for this casting time, not a lasting
            property of a neighbourhood. Check the relevant indicator’s position before assuming the
            direction serves your specific question. New questions or later castings need their own
            assessment rather than a date extrapolated from this chart. Ask the venue which
            preparation is needed before confirming.
      - heading: 'Teaching example 2: Candidate Direction: East'
        knowledgeUnitId: qimen.directions.east
        paragraphs:
          - You can compare an eastern option with the needs of the planned activity. Its palace
            meets the engine’s supportive criteria, but direction alone says nothing about equipment
            or access. For a small presentation, inspecting the display setup and welcome
            arrangements can be more useful than simply choosing whichever place lies to the east.
            Consider using this cue only between feasible alternatives and keep room to change the
            venue. A favourable direction is a selected palace for this casting time, not a lasting
            property of a neighbourhood. Check the relevant indicator’s position before assuming the
            direction serves your specific question. New questions or later castings need their own
            assessment rather than a date extrapolated from this chart. Ask the venue which
            preparation is needed before confirming.
      - heading: 'Teaching example 3: Candidate Direction: South'
        knowledgeUnitId: qimen.directions.south
        paragraphs:
          - You can compare a southern option with the purpose of the activity. Its palace passes
            the supportive filter; that does not imply that a larger presentation would be better.
            For a venue where you might show work, equipment, available time and audience size help
            establish whether the setting fits what you intend to share. Consider using this cue
            only between feasible alternatives and keep room to change the venue. A favourable
            direction is a selected palace for this casting time, not a lasting property of a
            neighbourhood. Check the relevant indicator’s position before assuming the direction
            serves your specific question. New questions or later castings need their own assessment
            rather than a date extrapolated from this chart. Ask the venue which preparation is
            needed before confirming.
      - heading: 'Teaching example 4: Candidate Direction: West'
        knowledgeUnitId: qimen.directions.west
        paragraphs:
          - You can compare a western venue for its ability to support a clear exchange. The engine
            selected the direction through a palace rule, not through knowledge of the actual
            location. For a brief meeting, inspect the setting and the participants’ availability. A
            short online check may serve the same purpose with less travel. Consider using this cue
            only between feasible alternatives and keep room to change the venue. A favourable
            direction is a selected palace for this casting time, not a lasting property of a
            neighbourhood. Check the relevant indicator’s position before assuming the direction
            serves your specific question. New questions or later castings need their own assessment
            rather than a date extrapolated from this chart. Ask the venue which preparation is
            needed before confirming.
      - heading: 'Teaching example 5: Check What Is Actually Available'
        knowledgeUnitId: qimen.flags.void
        paragraphs:
          - 'You can benefit from distinguishing a possibility from something already arranged.
            Kongwang (kōng wáng — a vacant-position flag for the hour group) marks a palace whose
            conditions invite verification. Think of an event venue mentioned in conversation but
            never actually booked: the useful response is to check availability, not abandon the
            gathering. Separate a confirmed reservation from a promising lead, and ask who can
            provide the missing information. Consider requesting confirmation before committing the
            next dependent step. Choose a change small enough to inspect afterwards, and record the
            difference it makes. Before applying this note to your question, locate the marked
            palace and check whether a relevant indicator is there; a flag elsewhere remains
            background context. Ask who can verify the remaining condition.'
      - heading: 'Teaching example 6: Prepare Before You Move'
        knowledgeUnitId: qimen.flags.horse
        paragraphs:
          - A change of setting may help you see the question from another angle. Maxing (mǎ xīng —
            the chart’s movement marker) highlights motion and transitions rather than certifying a
            journey. A useful move might be as ordinary as taking a conversation out of a noisy
            room. For an actual trip, transport connections, opening hours and the ability to return
            still deserve attention. Movement creates opportunities for new information only when it
            serves a clear purpose. Try preparing a route and a fallback contact before leaving.
            Choose a change small enough to inspect afterwards, and record the difference it makes.
            Before applying this note to your question, locate the marked palace and check whether a
            relevant indicator is there; a flag elsewhere remains background context.
      - heading: 'Teaching example 7: Use Repetition to Find a Missing Step'
        knowledgeUnitId: qimen.flags.fu_yin
        paragraphs:
          - Repetition can help you identify what a process is missing. Fuyin (fú yín — a star
            occupying its original palace again) invites attention to familiar routines and
            unresolved loops. In a team that keeps reopening the same discussion, the useful
            question may be who owns the next decision. Revisiting a previous note can reveal a
            handoff that everyone assumed someone else would handle. The symbol supports review, not
            passive waiting without a deadline. Consider assigning an owner to the step that keeps
            returning. Choose a change small enough to inspect afterwards, and record the difference
            it makes. Before applying this note to your question, locate the marked palace and check
            whether a relevant indicator is there; a flag elsewhere remains background context.
      - heading: 'Teaching example 8: Keep Room for a Change of Course'
        knowledgeUnitId: qimen.flags.fan_yin
        paragraphs:
          - You may find flexibility more useful than defending the original arrangement. Fanyin
            (fǎn yín — a star positioned opposite its home palace) supplies an image of reversal or
            redirection. It does not reveal another person’s intentions. If a meeting time changes,
            checking who can still attend may lead to a short asynchronous exchange instead of a
            rushed gathering. The practical task is to distinguish the part that changed from the
            purpose that can remain intact. Try naming a workable alternative before the schedule
            becomes tight. Choose a change small enough to inspect afterwards, and record the
            difference it makes. Before applying this note to your question, locate the marked
            palace and check whether a relevant indicator is there; a flag elsewhere remains
            background context.
      - heading: Your practice and review
        paragraphs:
          - Choose a reversible arrangement, such as scheduling a short discussion. List the time
            slots actually available and the people who need to confirm. Treat a direction prompt as
            one item in a preparation checklist, then complete the real confirmation. At review,
            note which preparation reduced confusion and which symbolic suggestion had no effect.
            Travel, venue, and safety arrangements should follow the actual conditions. If a board
            drew your attention to an unresolved detail, record that modest contribution without
            expanding it into a claim about the entire outcome. You can repeat the exercise with a
            different task later, preserving the question and settings each time. This creates a
            study record that distinguishes useful planning habits from symbolic associations and
            helps you decide how much space the practice deserves in your everyday routine.
