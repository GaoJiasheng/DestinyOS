            view it with the other seven without making claims about personal worth, health, or
            relationship outcomes. Try to plan a relaxed shared activity and notice how each person
            prefers to divide tasks. Look at an everyday task: who suggests an idea, who organizes
            details, and who notices the time? Separate these actions from a judgment of personal
            worth. Doing less for a while may simply reflect different available time. Try a small
            division of responsibility and agree on how changes can be requested. When a difference
            appears, record the conditions already agreed and the information still needed. This
            keeps the conversation from circling one criticism. After finishing, identify a step
            that saved energy and a step that increased pressure, then choose what to keep. A chart
            offers a starting point for reflection, while each person remains free to choose how to
            participate.'
