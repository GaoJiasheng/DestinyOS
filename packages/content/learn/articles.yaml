- system: vedic
  slug: sidereal-and-lagna
  zh:
    title: 恒星黄道与上升：吠陀盘从哪里开始
    description: 吠陀占星在本项目采用 Lahiri 岁差值（回归与恒星黄道之间的偏移）及整宫制。
    sections:
      - heading: 恒星黄道与上升：吠陀盘从哪里开始
        paragraphs:
          - 吠陀占星在本项目采用 Lahiri
            岁差值（回归与恒星黄道之间的偏移）及整宫制。Lagna（上升位置）决定宫位起点，D1（本命基础盘）是入门的底图。与西方盘出现不同星座标签，先比较坐标与规则，不把差异理解成两种相互否定的人格。
      - heading: 从结构到读法
        paragraphs:
          - 同一星体位置按不同黄道表达，标签可以不同；岁差值是坐标转换，不是额外性格因素。南印度与北印度图是画法，不能据外形判断体系。未知时辰时上升、宫位与时间敏感部分保持缺失。下面用不同上升及宫主落点示例说明入门问题，条件须先在可靠盘中定位。
      - heading: 怎样使用下面的教学示例
        paragraphs:
          - 下面各段示例展示不同盘面条件下的读法，段中的「你」指假设的示例读者，并非对你的个人判断。这些条件可以互不相容，不应拼成一份命盘。先辨认标题的主题，再观察正文如何从符号走到生活例子与建议。你可以把喜欢的句子改写成一个待观察的问题，也可以记录不符合经验的部分。
      - heading: 教学示例 1：白羊上升：先试一步
        knowledgeUnitId: vedic.lagna.aries
        paragraphs:
          - 你进入新情境时，可能倾向于先试一步。上升（上升，出生时东方地平线所在星座）在你的盘里落在白羊。白羊（以启动和直接行动为意象的星座）让你较容易从尝试中理解问题。这里强调先动手再修正的节奏，并不衡量你比别人更有勇气。面对陌生任务，你可能希望尽快看到一个可操作的入口。例如小组刚接到新项目时，你先画出流程草图，让同伴对着具体方案补充遗漏。建议预先约定试做的范围与停止点，给不同速度的人留出表达时间。这一星座由火星守护；守护星（用于把上升主题连接到具体生活领域的行星）的落宫和状态还要另行结合，不能单凭上升判断整体表现。
      - heading: 教学示例 2：金牛上升：建立稳定的手感
        knowledgeUnitId: vedic.lagna.taurus
        paragraphs:
          - 你进入新情境时，可能倾向于建立稳定的手感。上升（上升，出生时东方地平线所在星座）在你的盘里落在金牛。金牛（以稳定和感官体验为意象的星座）让你倾向于通过重复建立信任。你可能更重视事情是否舒服、耐用、可以持续，而不是一次表现有多热闹。熟悉的节奏能减少临时切换的负担，但也需要给新方法留位置。例如整理厨房时，你先把常用工具放到容易拿到的地方，试用几天再调整。建议保留一项有效习惯，同时为一个小变化设观察期，以实际体验决定取舍。这一星座由金星守护；守护星（用于把上升主题连接到具体生活领域的行星）的落宫和状态还要另行结合，不能单凭上升判断整体表现。
      - heading: 教学示例 3：双子上升：把好奇变成问题
        knowledgeUnitId: vedic.lagna.gemini
        paragraphs:
          - 你进入新情境时，可能倾向于把好奇变成问题。上升（上升，出生时东方地平线所在星座）在你的盘里落在双子。双子（以交流和比较为意象的星座）让你倾向于从不同说法中寻找线索。你的注意力可能随着新信息移动，适合把疑问说出来，再比较各自的依据。灵活不等于每个选项都要同时进行。例如同事提出两个执行方案，你先分别询问成本、交接方式和最容易卡住的环节，再形成简短记录。建议在探索之后安排收束时间，把最值得核对的一点交给具体行动，而不是不断增加选项。这一星座由水星守护；守护星（用于把上升主题连接到具体生活领域的行星）的落宫和状态还要另行结合，不能单凭上升判断整体表现。
      - heading: 教学示例 4：巨蟹上升：照顾需要也照顾边界
        knowledgeUnitId: vedic.lagna.cancer
        paragraphs:
          - 你进入新情境时，可能倾向于照顾需要也照顾边界。上升（上升，出生时东方地平线所在星座）在你的盘里落在巨蟹。巨蟹（以归属和照料为意象的星座）让你较容易注意场合中的安全感。你可能先观察彼此是否安心，再决定说多少、做多少；这种敏感适合用于改善相处条件。照顾别人也需要看自己的精力是否够用。例如朋友临时想找人倾诉，你愿意陪伴，但会先说明今天能聊多久。建议用具体安排表达关心，让对方知道可以期待什么，也让你有机会休息和恢复自己的节奏。这一星座由月亮守护；守护星（用于把上升主题连接到具体生活领域的行星）的落宫和状态还要另行结合，不能单凭上升判断整体表现。
      - heading: 教学示例 5：第1宫主在第1宫：两个领域的联系
        knowledgeUnitId: vedic.house_lord.house_1.in_1
        paragraphs:
          - 你可以观察这个领域怎样通过自身的资源持续发挥。宫主星（守护该宫星座、把两个生活领域联系起来的行星）守护第1宫，并落在本宫；这只是观察联系，不表示某件事会在另一领域发生。这里讨论的是回应方式，不是外貌、身体状况或能力的测量。你可以比较不同场合下怎样介绍自己、表达需要，以及什么时候更愿意采取主动。这里关注你的具体回应。例如在第一次参与小组活动时，先说你愿意承担什么，再询问其他人的分工，通常比急着证明自己更容易接上合作。建议以一个可观察的动作开始，不把整个人格都压在初次表现上；你可以随着真实反馈调整自己的表达。
      - heading: 教学示例 6：第1宫主在第3宫：两个领域的联系
        knowledgeUnitId: vedic.house_lord.house_1.in_3
        paragraphs:
          - 你可以把自我与日常姿态与练习与日常沟通放在一起回看。宫主星（守护该宫星座、把两个生活领域联系起来的行星）从第1宫落到第3宫；这只是观察联系，不表示某件事会在另一领域发生。这里讨论的是回应方式，不是外貌、身体状况或能力的测量。你可以比较不同场合下怎样介绍自己、表达需要，以及什么时候更愿意采取主动。这里关注可重复的小动作。例如练习一段口头说明时，先用一分钟说清目的，请朋友复述理解，再根据遗漏修改。建议固定一个轻量练习时段，记录实际进展；与熟人沟通也要确认彼此想要的信息，不以熟悉程度代替清楚表达。
      - heading: 教学示例 7：第1宫主在第10宫：两个领域的联系
        knowledgeUnitId: vedic.house_lord.house_1.in_10
        paragraphs:
          - 你可以把自我与日常姿态与工作贡献与公开责任放在一起回看。宫主星（守护该宫星座、把两个生活领域联系起来的行星）从第1宫落到第10宫；这只是观察联系，不表示某件事会在另一领域发生。这里讨论的是回应方式，不是外貌、身体状况或能力的测量。你可以比较不同场合下怎样介绍自己、表达需要，以及什么时候更愿意采取主动。这里关注成果怎样帮助接手的人。例如完成一项研究后，你先概括能回答的问题，再说明还没有核对的范围，方便团队使用。建议以真实反馈评估工作方法，并为新任务确认资源和交付标准；职业选择要结合现实条件，不把宫位描述当作能力测试。
      - heading: 你的练习与复盘
        paragraphs:
          - 先写坐标、岁差与宫位制，再找 D1
            的上升标记。比较两种画法时追踪同一行星位置，不追踪图形边角。选一个可靠落点，把主题转成学习或协作问题；未知时间时只学习一般结构，不据估时补出宫位结论。
  en:
    title: Starting with the sidereal zodiac and Lagna
    description:
      This project's Vedic charts use the Lahiri ayanamsa, the offset between tropical and
      sidereal coordinates, and Whole Sign houses.
    sections:
      - heading: Starting with the sidereal zodiac and Lagna
        paragraphs:
          - This project's Vedic charts use the Lahiri ayanamsa, the offset between tropical and
            sidereal coordinates, and Whole Sign houses. Lagna is the rising position that
            establishes the house starting point. D1 is the basic natal chart and the best place to
            begin. Different sign labels from a Western chart should first lead you to compare
            coordinate systems and settings, not to imagine two contradictory identities. This guide
            explains the framework before moving to individual symbolic placements.
      - heading: From structure to interpretation
        paragraphs:
          - The same astronomical position can receive a different sign label when expressed in a
            different zodiac. The ayanamsa is a coordinate offset, not an additional personality
            factor. North Indian and South Indian diagrams are display conventions; their shapes do
            not imply different astronomical inputs. Under Whole Sign houses, the rising sign
            supplies the first house and the remaining signs follow in order. Reliable birth time
            remains essential for the Lagna and time-sensitive layers. If it is missing, those parts
            stay absent rather than being silently calculated as a full personal chart. The examples
            below contrast rising-sign and house-lord themes so that you can practice navigating the
            vocabulary. They are separate conditions, not a complete reading for you. First identify
            what the diagram actually contains, then read the associated symbolic question. A house
            lord's placement concerns a relationship within this model; it does not establish a
            person's circumstances. When comparing another service, align the zodiac, ayanamsa,
            house system, and time normalization before evaluating prose. A technical mismatch is
            easier to understand when these parameters are recorded than when two descriptions are
            compared only by how familiar they feel.
      - heading: How to work with the teaching examples
        paragraphs:
          - The examples below illustrate separate symbolic conditions. In each example, “you”
            addresses a hypothetical reader with that condition, not you personally. Some conditions
            are alternatives and cannot be combined into a single chart. Read the heading first,
            identify the idea being illustrated, and then notice how the explanation moves from a
            symbol to an ordinary situation and a modest suggestion. You do not need to identify
            with every example. A useful exercise is to rewrite one sentence as a question that you
            could observe in daily life. Keep a second note for anything that does not fit. This
            makes room for disagreement and stops a familiar description from becoming a label.
            These passages come from the same versioned editorial knowledge used by the reading
            engine; including them here demonstrates its writing method, not a calculation for a
            visitor. No birth information is required to study this page.
      - heading: 'Teaching example 1: Aries Lagna: finding your footing'
        knowledgeUnitId: vedic.lagna.aries
        paragraphs:
          - 'You may find your footing by choosing to start with a small experiment. Lagna — the
            sidereal sign rising on the eastern horizon at birth — is recorded in Aries. Aries — a
            sign associated with initiating movement — invites you to learn through a manageable
            first attempt. A direct approach can make uncertainty feel less abstract, although speed
            and readiness are separate questions. Picture trying a new hobby: handling the basic
            tools for twenty minutes may teach you more than collecting another set of instructions.
            Consider choosing a limited trial that you can undo, and tell anyone involved what
            remains provisional. Initiative becomes easier to share when other people have time to
            contribute before the plan gathers momentum. Its traditional ruler is Mangala. The ruler
            connects this starting approach with another part of the chart; its actual house and
            condition deserve a separate reading before you form a broader impression.'
      - heading: 'Teaching example 2: Taurus Lagna: finding your footing'
        knowledgeUnitId: vedic.lagna.taurus
        paragraphs:
          - 'You may find your footing by choosing to find a repeatable pace. Lagna — the sidereal
            sign rising on the eastern horizon at birth — is recorded in Taurus. Taurus — the sign
            of sustained attention to tangible experience — points toward a pace you can maintain.
            You may prefer to understand what an arrangement feels like after repeated use rather
            than through a persuasive introduction. Imagine rehearsing a short piece of music until
            its rhythm becomes comfortable: consistency offers useful feedback, but familiarity
            alone does not establish quality. You can compare the familiar version with one modest
            alternative before settling. Keep what supports your routine, and allow enough
            flexibility for circumstances that have actually changed. Its traditional ruler is
            Shukra. The ruler connects this starting approach with another part of the chart; its
            actual house and condition deserve a separate reading before you form a broader
            impression.'
      - heading: 'Teaching example 3: Gemini Lagna: finding your footing'
        knowledgeUnitId: vedic.lagna.gemini
        paragraphs:
          - You may find your footing by choosing to turn curiosity into clear questions. Lagna —
            the sidereal sign rising on the eastern horizon at birth — is recorded in Gemini. Gemini
            — a sign connected with exchange and comparison — encourages learning through questions.
            You may notice how a subject changes when another person describes it, making
            conversation a useful research tool. At a community workshop, for instance, asking two
            participants how they learned a technique can reveal differences that the instructions
            overlook. Try recording the question each answer resolves before opening another line of
            enquiry. A deadline for choosing the next step keeps curiosity useful without requiring
            you to follow every interesting possibility at once. Its traditional ruler is Budha. The
            ruler connects this starting approach with another part of the chart; its actual house
            and condition deserve a separate reading before you form a broader impression.
      - heading: 'Teaching example 4: Cancer Lagna: finding your footing'
        knowledgeUnitId: vedic.lagna.cancer
        paragraphs:
          - 'You may find your footing by choosing to make care sustainable. Lagna — the sidereal
            sign rising on the eastern horizon at birth — is recorded in Cancer. Cancer — a sign
            associated with shelter and belonging — brings attention to the conditions that make
            participation comfortable. You might notice whether people can ask for help without
            feeling exposed. Think of joining a new shared workspace: knowing where to leave your
            things and whom to ask a simple question may matter more than an impressive welcome
            speech. Consider naming the practical conditions that help you settle, then ask which
            ones others need. Care works best when it includes your capacity as well as someone
            else’s wishes. Its traditional ruler is Chandra. The ruler connects this starting
            approach with another part of the chart; its actual house and condition deserve a
            separate reading before you form a broader impression.'
      - heading: 'Teaching example 5: Lord of house 1 in house 1'
        knowledgeUnitId: vedic.house_lord.house_1.in_1
        paragraphs:
          - You can examine how this life area draws on resources available within the same area. A
            house lord — the traditional ruler of the sign on a house — links the starting area with
            the house where that ruler is placed. The ruler of house 1 is recorded in house 1,
            supplying a reflective connection rather than an event prediction. The first Bhava — a
            house used to consider your everyday stance — focuses on how you enter a situation. It
            offers questions about participation rather than a description of appearance or physical
            condition. You can notice how you introduce a request, what you reveal about your
            priorities, and when you prefer to take the first step. Here the practical context is an
            ordinary introduction. When joining a local activity, stating which small task you can
            help with may be more useful than presenting a complete account of yourself. Consider
            noticing how the group responds, then adjusting the amount you take on. A first
            interaction is one piece of experience, not a final assessment of your personality.
      - heading: 'Teaching example 6: Lord of house 1 in house 3'
        knowledgeUnitId: vedic.house_lord.house_1.in_3
        paragraphs:
          - You can examine a connection between your everyday stance and practice and everyday
            communication. A house lord — the traditional ruler of the sign on a house — links the
            starting area with the house where that ruler is placed. The ruler of house 1 is
            recorded in house 3, supplying a reflective connection rather than an event prediction.
            The first Bhava — a house used to consider your everyday stance — focuses on how you
            enter a situation. It offers questions about participation rather than a description of
            appearance or physical condition. You can notice how you introduce a request, what you
            reveal about your priorities, and when you prefer to take the first step. Here a short
            rehearsal provides useful feedback. Explain a familiar procedure to someone in a minute,
            then ask which step remained unclear. You can practise the troublesome part separately
            instead of repeating the whole speech. Keep a manageable rhythm, and check what the
            listener needs even when you know each other well.
      - heading: 'Teaching example 7: Lord of house 1 in house 10'
        knowledgeUnitId: vedic.house_lord.house_1.in_10
        paragraphs:
          - You can examine a connection between your everyday stance and work contributions and
            visible responsibility. A house lord — the traditional ruler of the sign on a house —
            links the starting area with the house where that ruler is placed. The ruler of house 1
            is recorded in house 10, supplying a reflective connection rather than an event
            prediction. The first Bhava — a house used to consider your everyday stance — focuses on
            how you enter a situation. It offers questions about participation rather than a
            description of appearance or physical condition. You can notice how you introduce a
            request, what you reveal about your priorities, and when you prefer to take the first
            step. Here a completed piece of work provides the example. Summarizing what a study
            answers and what remains unchecked can help a colleague use it responsibly. Consider
            asking which part made their next task easier, then use that response to refine your
            method. Training, access, and workplace conditions remain relevant; a house description
            cannot evaluate your professional competence.
      - heading: Your practice and review
        paragraphs:
          - Record the zodiac, ayanamsa, and house system before locating the rising marker in D1.
            When comparing the two display styles, track the same planet's placement rather than
            matching corners of the diagrams. Choose one reliable placement and turn its theme into
            a question about learning, coordination, or a routine. With unknown time, study the
            general structure without adding house conclusions from an estimate. You can compare a
            symbolic prompt with one actual experience and record both the useful and irrelevant
            parts. This exercise is complete when you can explain how a position was expressed and
            what further input it would need, even if you decide the interpretation offers little
            practical value. The linked system guide keeps the adopted method visible, and the
            terminology navigation lets you explore one unfamiliar Sanskrit or chart term at a time.
