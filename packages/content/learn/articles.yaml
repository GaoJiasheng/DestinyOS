  zh:
    title: 合盘分数怎么读：拆开传统表格
    description: Ashtakoot（吠陀合盘的八项传统计分）总分上限 36，表示所用表格的结果，不是关系成功率，也不衡量人的价值。
    sections:
      - heading: 合盘分数怎么读：拆开传统表格
        paragraphs:
          - Ashtakoot（吠陀合盘的八项传统计分）总分上限
            36，表示所用表格的结果，不是关系成功率，也不衡量人的价值。本项目保留八项分数与方法版本，让你能核验；不能把任何一项变成对健康、家庭或关系结局的推断。
      - heading: 从结构到读法
        paragraphs:
          - 八项上限依次为 1、2、3、4、5、6、7、8，相加应等于总分。Tara 的计数含起点，表格还有方向；交换 A、B
            可能改变部分项。这里采用北印度基础表，不自动加入有争议的抵消或补分。未知时辰时按正午月亮暂定并警示。下面零分示例说明怎样保留数值信息而不评价双方。
      - heading: 怎样使用下面的教学示例
        paragraphs:
          - 下面各段示例展示不同盘面条件下的读法，段中的「你」指假设的示例读者，并非对你的个人判断。这些条件可以互不相容，不应拼成一份命盘。先辨认标题的主题，再观察正文如何从符号走到生活例子与建议。你可以把喜欢的句子改写成一个待观察的问题，也可以记录不符合经验的部分。
