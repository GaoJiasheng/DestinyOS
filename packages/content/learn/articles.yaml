  zh:
    title: 合盘入门：两份资料与双向视角
    description: 合盘（比较两份出生盘的关系结构）帮助讨论互动主题，不是关系去留的判决。
    sections:
      - heading: 合盘入门：两份资料与双向视角
        paragraphs:
          - 合盘（比较两份出生盘的关系结构）帮助讨论互动主题，不是关系去留的判决。本项目并列八字、紫微、西方与吠陀比较，保留各体系方法。两人的资料需分别核实与获得同意；未知时辰会使部分结构缺失，不能用另一人的完整盘补齐。
      - heading: 从结构到读法
        paragraphs:
          - 同一比较可能有 A 看 B、B 看 A
            两个方向。八字十神以观察者日主为中心，落宫也以目标盘为坐标，方向不宜抹去。五行差异指数只表示分布不同程度，不是关系成功率。下面关系与沟通示例用于学习，不能把多体系主题相加成现实结论。
      - heading: 怎样使用下面的教学示例
        paragraphs:
          - 下面各段示例展示不同盘面条件下的读法，段中的「你」指假设的示例读者，并非对你的个人判断。这些条件可以互不相容，不应拼成一份命盘。先辨认标题的主题，再观察正文如何从符号走到生活例子与建议。你可以把喜欢的句子改写成一个待观察的问题，也可以记录不符合经验的部分。
      - heading: 教学示例 1：感情：A 的太阳与 B 的月亮呈合相
        knowledgeUnitId: synastry.western.sun_moon.conjunction
        paragraphs:
          - A 的太阳与 B
            的月亮呈合相。两种功能集中在相近的方向，容易放大彼此的主题；需要结合太阳与月亮各自的象征功能来理解。建议分别写下三种喜欢的关心方式，问清楚哪些举动需要提前确认。计划改变以后，一方可能希望尽快找到替代方案，另一方更想知道为什么发生变化。给解释与行动分别留出一点时间，会让两种需要更容易被满足。讨论结束时，把接下来由谁完成哪一步、什么时候确认进度说清楚。过几天再看看这个安排是否合适。相处方式可以学习与调整，不必让一次不顺畅的经历成为对人的固定评价。
      - heading: 教学示例 2：感情：A 的月亮与 B 的太阳呈六分相
        knowledgeUnitId: synastry.western.moon_sun.sextile
        paragraphs:
          - A 的月亮与 B
            的太阳呈六分相。两种功能之间有尝试合作的空间，仍需要主动沟通；需要结合月亮与太阳各自的象征功能来理解。建议分别写下三种喜欢的关心方式，问清楚哪些举动需要提前确认。你可以拿最近一次共同安排来核对，先写下原本期待的结果，再比较双方当时掌握的信息。计划改变以后，一方可能希望尽快找到替代方案，另一方更想知道为什么发生变化。给解释与行动分别留出一点时间，会让两种需要更容易被满足。讨论结束时，把接下来由谁完成哪一步、什么时候确认进度说清楚。过几天再看看这个安排是否合适。相处方式可以学习与调整，不必让一次不顺畅的经历成为对人的固定评价。
      - heading: 教学示例 3：沟通：A 的水星与 B 的水星呈四分相
        knowledgeUnitId: synastry.western.mercury_mercury.square
        paragraphs:
          - A 的水星与 B
            的水星呈四分相。节奏上的张力可能让差异更明显，具体分工能减少反复争论；需要结合水星与水星各自的象征功能来理解。建议讨论一件小事时先复述对方的观点，再提出自己的请求。例如，两个人都想获得支持，却可能分别通过安静陪伴和主动询问来表达。先问对方此刻需要倾听、建议还是实际帮助，可以减少好意没有被理解的情况。也给自己留下拒绝某种安排的空间，说明能够做到什么以及暂时做不到什么。共同活动以后，各自分享一个舒服的瞬间和一个还想调整的部分。让感谢指向具体举动，会比泛泛评价更容易让人理解。双方的意愿和感受是讨论的依据，符号只是辅助观察的语言。
      - heading: 教学示例 4：沟通：A 的水星与 B 的月亮呈三分相
        knowledgeUnitId: synastry.western.mercury_moon.trine
        paragraphs:
          - A 的水星与 B
            的月亮呈三分相。相近的表达习惯可能减少协调成本，也需要留意未经讨论的假设；需要结合水星与月亮各自的象征功能来理解。建议讨论一件小事时先复述对方的观点，再提出自己的请求。例如，两个人都想获得支持，却可能分别通过安静陪伴和主动询问来表达。先问对方此刻需要倾听、建议还是实际帮助，可以减少好意没有被理解的情况。也给自己留下拒绝某种安排的空间，说明能够做到什么以及暂时做不到什么。共同活动以后，各自分享一个舒服的瞬间和一个还想调整的部分。让感谢指向具体举动，会比泛泛评价更容易让人理解。双方的意愿和感受是讨论的依据，符号只是辅助观察的语言。
      - heading: 教学示例 5：冲突模式：双方有日干相合关系
        knowledgeUnitId: synastry.relations.daystemrelations.combine
        paragraphs:
          - 双方有日干相合关系。干支关系描述两个符号之间的结构，不应单独决定相处好坏；日柱需要结合整盘，年柱关系只提供更宽泛的背景。建议约定暂停讨论的信号以及重新沟通的时间，避免让沉默变成猜测。没有哪种表达天然适合所有场景。把这些习惯讲给对方听，有助于理解一句话背后的意思。遇到不熟悉的方式，先提出澄清问题，再决定怎样回应。双方分别保留自己的兴趣、朋友与休息时间，也能让共同安排更有弹性。隔一段时间重新确认期待是否改变，允许曾经合适的办法被新的安排替代。
      - heading: 教学示例 6：冲突模式：双方有日支六冲关系
        knowledgeUnitId: synastry.relations.daybranchrelations.clash
        paragraphs:
          - 双方有日支六冲关系。干支关系描述两个符号之间的结构，不应单独决定相处好坏；日柱需要结合整盘，年柱关系只提供更宽泛的背景。建议约定暂停讨论的信号以及重新沟通的时间，避免让沉默变成猜测。你可以拿最近一次共同安排来核对，先写下原本期待的结果，再比较双方当时掌握的信息。计划改变以后，一方可能希望尽快找到替代方案，另一方更想知道为什么发生变化。给解释与行动分别留出一点时间，会让两种需要更容易被满足。讨论结束时，把接下来由谁完成哪一步、什么时候确认进度说清楚。过几天再看看这个安排是否合适。相处方式可以学习与调整，不必让一次不顺畅的经历成为对人的固定评价。
      - heading: 教学示例 7：长期建议：A 的太阳与 B 的土星呈六分相
        knowledgeUnitId: synastry.western.sun_saturn.sextile
        paragraphs:
          - A 的太阳与 B
            的土星呈六分相。两种功能之间有尝试合作的空间，仍需要主动沟通；需要结合太阳与土星各自的象征功能来理解。建议每周选一个共同事项复盘，保留有效做法并调整一个不适合的环节。例如，两个人都想获得支持，却可能分别通过安静陪伴和主动询问来表达。先问对方此刻需要倾听、建议还是实际帮助，可以减少好意没有被理解的情况。也给自己留下拒绝某种安排的空间，说明能够做到什么以及暂时做不到什么。共同活动以后，各自分享一个舒服的瞬间和一个还想调整的部分。让感谢指向具体举动，会比泛泛评价更容易让人理解。双方的意愿和感受是讨论的依据，符号只是辅助观察的语言。
      - heading: 你的练习与复盘
        paragraphs:
          - 练习时用获准的两份资料，分别写出 A 与 B
            的输入完整性。挑一个双向主题，各自回答「我认同什么」「哪里不符合」「希望怎样协作」。先交换答案再讨论，不让一人替另一人解释。公开分享只用投影内容，私密资料与问题不要写入链接。
  en:
    title: Synastry begins with two inputs and two viewpoints
    description: Synastry compares structures in two birth charts to support discussion of interaction.
    sections:
      - heading: Synastry begins with two inputs and two viewpoints
        paragraphs:
          - Synastry compares structures in two birth charts to support discussion of interaction.
            It does not decide whether a relationship should continue. This project presents BaZi,
            Zi Wei, Western, and Vedic comparisons while preserving each method. Verify both inputs
            separately and obtain consent before using someone else's information. Unknown birth
            time removes some structures; a complete chart for one person cannot fill the missing
            parts of the other.
      - heading: From structure to interpretation
        paragraphs:
          - "A comparison can have two directions: A observing B and B observing A. BaZi Ten Gods
            use the observer's Day Master as a reference. House overlays use the target chart's
            houses. Removing direction can erase information needed to understand the result. The
            element difference index describes how different the distributions are; it is not a
            relationship success percentage. Likewise, similarity is not a measure of how
            respectfully people will communicate. The examples below illustrate relational and
            communication themes as separate teaching conditions. They are not a combined verdict
            and are not all placements in one comparison. Locate the evidence in the technical view
            before reading the associated paragraph. A useful conversation can then ask which need
            each person recognizes and which part does not fit. Both answers deserve space. The
            project also preserves differences among systems rather than averaging every theme into
            one claim. A symbolic pattern may be a prompt for discussing a routine or boundary, but
            actual agreement comes from the participants. If one birth hour is missing, keep palace
            and house availability warnings visible. More prose or a second method cannot resolve
            missing personal data without a reliable source."
      - heading: How to work with the teaching examples
        paragraphs:
          - The examples below illustrate separate symbolic conditions. In each example, “you”
            addresses a hypothetical reader with that condition, not you personally. Some conditions
            are alternatives and cannot be combined into a single chart. Read the heading first,
            identify the idea being illustrated, and then notice how the explanation moves from a
            symbol to an ordinary situation and a modest suggestion. You do not need to identify
            with every example. A useful exercise is to rewrite one sentence as a question that you
            could observe in daily life. Keep a second note for anything that does not fit. This
            makes room for disagreement and stops a familiar description from becoming a label.
            These passages come from the same versioned editorial knowledge used by the reading
            engine; including them here demonstrates its writing method, not a calculation for a
            visitor. No birth information is required to study this page.
      - heading: 'Teaching example 1: affection: A’s sun and B’s moon form a conjunction'
        knowledgeUnitId: synastry.western.sun_moon.conjunction
        paragraphs:
          - A’s sun and B’s moon form a conjunction. The two functions occupy a similar direction
            and may amplify each other’s themes, especially where identity and direction meets
            emotional safety and habitual responses. Try to each write down three welcome forms of
            care and ask which gestures need agreement in advance. Consider a recent shared plan.
            Write down the outcome each person expected and the information available at the time.
            After a change, one person may want a replacement plan quickly while the other wants an
            explanation first. Leave room for both a reason and an action. At the end, clarify who
            will complete the next step and when progress will be checked. Review the arrangement a
            few days later. Ways of relating can be learned and revised; a single awkward experience
            need not become a permanent judgment about someone. A chart offers a starting point for
            reflection, while each person remains free to choose how to participate.
      - heading: 'Teaching example 2: affection: A’s moon and B’s sun form a sextile'
        knowledgeUnitId: synastry.western.moon_sun.sextile
        paragraphs:
          - A’s moon and B’s sun form a sextile. The two functions have room for cooperation that
            still requires deliberate participation, especially where emotional safety and habitual
            responses meets identity and direction. Try to each write down three welcome forms of
            care and ask which gestures need agreement in advance. Consider a recent shared plan.
