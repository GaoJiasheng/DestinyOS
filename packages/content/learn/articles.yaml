  slug: personal-cycles
  zh:
    title: 个人年、月、日：把九年周期读成计划提示
    description: 个人年、个人月、个人日（用生日月日与目标日期推导的周期数字）是三个时间尺度，不是每天的分数。
    sections:
      - heading: 个人年、月、日：把九年周期读成计划提示
        paragraphs:
          - 个人年、个人月、个人日（用生日月日与目标日期推导的周期数字）是三个时间尺度，不是每天的分数。本项目个人年在一月一日切换，周期数字归一到
            1–9，不保留大师数。把数字当作计划提问的角度，实际期限与资源仍须另行核实。
      - heading: 从结构到读法
        paragraphs:
          - 出生月日各位和加目标年各位和得到个人年；个人年加目标月归一得月，个人月加目标日归一得日。1990-05-15 在 2026-10-05：年 3、月 4、日
            9，2027-01-01 年 4。九年环由目标年开始依次展示，不表示生活必须按数字节拍变化。下面示例区分年度与日常节奏。
      - heading: 怎样使用下面的教学示例
        paragraphs:
          - 下面各段示例展示不同盘面条件下的读法，段中的「你」指假设的示例读者，并非对你的个人判断。这些条件可以互不相容，不应拼成一份命盘。先辨认标题的主题，再观察正文如何从符号走到生活例子与建议。你可以把喜欢的句子改写成一个待观察的问题，也可以记录不符合经验的部分。
      - heading: 教学示例 1：1 年：主动与独立
        knowledgeUnitId: numerology.personal_year.1
        paragraphs:
          - 个人年 1
            是规划与回顾的象征主题，你可以在年度里选择一个合适的情境试验。你可能已列出下一步，但独立并不意味着独自承担一切。接到别人求助时，可以先问需要的是倾听、一起分析，还是一项具体协助。确认自己的时间后，再约定能做和暂时做不到的部分。建议完成协助后把决定权交还对方，不必追踪每一个后续步骤；支持可以很认真，同时也允许双方拥有自己的节奏。回顾一段已经结束的经历时，可以写下想保留的经验、愿意放下的期待，以及还需要回应的人。告别不一定发生在同一天，也可以分几步完成。建议从一个很小的整理行动开始，例如归档资料或写一封不必发送的总结，让回顾有一个具体承载，随后再考虑新的方向。
      - heading: 教学示例 2：2 年：协调与倾听
        knowledgeUnitId: numerology.personal_year.2
        paragraphs:
          - 个人年 2
            是规划与回顾的象征主题，你可以在年度里选择一个合适的情境试验。你可能更敏锐地注意到语气与气氛，愿意给不同意见留一点空间。协调能让合作顺畅，但反复猜测别人需要什么也会消耗精力。准备深入研究时，可以先写一个能够回答的问题，列出已有证据与暂时的猜想。读完一份资料后，用自己的话总结，再与另一个来源比较。建议在学习之后安排一次实际应用，哪怕只是给同伴解释五分钟，看看理解中的空白在哪里，避免只积累材料却迟迟没有反馈。你可以回顾最近一次主动决定，写下当时掌握了哪些信息、忽略了哪些反馈，以及现在会保留什么做法。复盘不是为了证明当初选对了，而是增加下一次选择的空间。建议只调整一个环节，比如提前向同伴解释理由，连续观察几次再判断有没有帮助。
      - heading: 教学示例 3：3 年：表达与创意
        knowledgeUnitId: numerology.personal_year.3
        paragraphs:
          - 个人年 3
            是规划与回顾的象征主题，你可以在年度里选择一个合适的情境试验。你可能乐于用故事、图像或幽默让抽象想法变得可亲。表达能打开交流的门，真正落地仍需要编辑、练习和耐心。协调资源时，可以把人员、时间与可用工具放在同一张清单里，先检查目标是否与条件相符。给参与者说明调整的理由，也听听他们有哪些没有被看到的限制。建议复盘时同时讨论成果与过程，发现负担集中在哪里，再协商分配方式，而不是只要求更快。回顾一段配合顺畅的经历时，可以问自己什么时候表达了需要，什么时候只是等别人察觉。把容易做到和仍有顾虑的部分分别写下来。建议先在一个轻松情境里练习直接请求，例如说明希望什么时候得到回复，让细腻的观察也有清楚的语言承接。
      - heading: 教学示例 4：4 年：结构与踏实
        knowledgeUnitId: numerology.personal_year.4
        paragraphs:
          - 个人年 4
            是规划与回顾的象征主题，你可以在年度里选择一个合适的情境试验。你可能喜欢把任务拆成明确步骤，让进度可见、承诺可查。稳定来自持续投入，但计划也需要为变化保留空隙。收尾一段工作时，可以区分必须完成的承诺、可以协商取消的事项，以及值得留给以后用的经验。告诉相关的人哪里结束、哪里仍需交接。建议给告别留一点整理时间，允许自己同时感到轻松和不舍；结束一项安排并不要求抹掉它曾经带来的价值。你可以选择一个常说但不够具体的想法，为它找一个生活例子。把例子讲给朋友听以后，问问哪里清楚、哪里像在绕圈。建议先完成一个足够简单的表达版本，再逐步丰富；真正的创作过程也包括删掉没有帮助的部分，而不只是不断增加新点子。
      - heading: 教学示例 5：5：短周期的探索与弹性
        knowledgeUnitId: numerology.rhythms.5
        paragraphs:
          - 个人月或个人日出现 5
            时，可以把行动安排在一个更短、更容易复盘的时间范围。你可能容易对新环境、新观点与不同做法产生兴趣。变化可以带来学习机会，选择过多时则需要一个能回来的支点。与别人共同决定时，可以把自己偏好的方向说清楚，也具体指出愿意调整的地方。如果对方选择不同，不急着把分歧理解成否定。建议邀请他们讲出理由，再讨论哪些部分能各自决定、哪些部分需要一起确认，让独立行动与共同承诺都有位置。处理重复事务时，你可以检查最常出错的一步，做一份短清单而不是添加许多规则。连续使用几次以后，看看清单是否减少了遗漏，又是否造成新的麻烦。建议保留修改入口，让执行者提出更简单的办法；流程的作用是支持工作，而不是证明谁更认真。
      - heading: 教学示例 6：9：短周期的包容与收尾
        knowledgeUnitId: numerology.rhythms.9
        paragraphs:
          - 个人月或个人日出现 9
            时，可以把行动安排在一个更短、更容易复盘的时间范围。你可能容易把个人经历放到更大的背景里，愿意理解不同立场。包容能帮助收尾与告别，但不是无限承担，也不要求放弃自己的需要。当你希望改变安排时，可以先说明想探索什么，再问改变会给别人带来哪些影响。若对方需要稳定，不必要求他们一起冒险，可以把尝试限制在自己的范围。建议约定一个汇报时间，告诉对方哪些部分保持连续、哪些部分正在试验，让新鲜感与信任同时得到照顾。协调资源时，可以把人员、时间与可用工具放在同一张清单里，先检查目标是否与条件相符。给参与者说明调整的理由，也听听他们有哪些没有被看到的限制。建议复盘时同时讨论成果与过程，发现负担集中在哪里，再协商分配方式，而不是只要求更快。
      - heading: 你的练习与复盘
        paragraphs:
          - 手算示例的年、月、日，确认没有混用出生年份。选一个真实目标，把当前数字主题改成准备问题，每月复盘一次即可。跨时区或跨年时核对目标日期；不为每个小决定重复查个人日。记录有用与无用的提示，让计划依据可见。
  en:
    title: Personal years, months, and days as planning prompts
    description:
      Personal Year, Month, and Day numbers are three time scales derived from the birthday's
      month and day and the target date.
    sections:
      - heading: Personal years, months, and days as planning prompts
        paragraphs:
          - Personal Year, Month, and Day numbers are three time scales derived from the birthday's
            month and day and the target date. They are not daily grades. In this project the
            Personal Year changes on January 1, and cycle numbers reduce to 1 through 9 without
            retaining master numbers. Use the numeric theme as a planning question while checking
            actual deadlines and resources separately.
      - heading: From structure to interpretation
        paragraphs:
          - Add the digits of the birth month and day to the digits of the target year, then reduce
            to obtain the Personal Year. Add the target month to that result and reduce for the
            Personal Month. Add the target day to the month result and reduce for the Personal Day.
            For a 1990-05-15 birthday on 2026-10-05, the results are Year 3, Month 4, and Day 9. On
            2027-01-01 the Personal Year becomes 4. The nine-year display starts from the target
            year and proceeds through the numeric cycle. This is a structure in the model, not a
            requirement for life to change at the same pace. The date's time zone matters near
            midnight, so compare the same target local date when checking results. The examples
            below contrast annual and shorter rhythm themes. They should not all be applied at once.
            A theme can organize questions about starting, coordinating, practicing, or reviewing,
            but it cannot establish whether a meeting, course, or relationship will develop in a
            certain way. Keep a real calendar alongside the symbolic cycle and choose preparation
            steps that would help regardless of the number. A small review can then show whether the
            theme added a useful perspective.
      - heading: How to work with the teaching examples
        paragraphs:
          - The examples below illustrate separate symbolic conditions. In each example, “you”
            addresses a hypothetical reader with that condition, not you personally. Some conditions
            are alternatives and cannot be combined into a single chart. Read the heading first,
            identify the idea being illustrated, and then notice how the explanation moves from a
            symbol to an ordinary situation and a modest suggestion. You do not need to identify
            with every example. A useful exercise is to rewrite one sentence as a question that you
            could observe in daily life. Keep a second note for anything that does not fit. This
            makes room for disagreement and stops a familiar description from becoming a label.
            These passages come from the same versioned editorial knowledge used by the reading
            engine; including them here demonstrates its writing method, not a calculation for a
            visitor. No birth information is required to study this page.
      - heading: 'Teaching example 1: Year 1: initiative and independence'
        knowledgeUnitId: numerology.personal_year.1
        paragraphs:
          - Personal year 1 offers a symbolic background for planning and review. Choose a suitable
            situation to explore during the year. You may be comfortable making the first move and
            finding a direction without an established answer. While other people are comparing
            options, you might already be outlining the next step. Independence works best when it
            leaves room for useful support. When someone asks for help, check whether they want
            listening, joint thinking, or a specific action. Review your available time before
            agreeing on what you can offer and what is outside your capacity. You can return the
            decision to the other person after providing support. There is no need to track every
            next step; thoughtful help can still respect each person’s own pace. When looking back
            at an experience that has ended, note the lessons to keep, the expectations to release,
            and anyone who still needs a response. A transition does not have to finish in one day;
            it can take several steps. Try beginning with a small organising action, such as filing
            materials or writing an unsent reflection. Give the review a concrete form before
            considering a new direction.
      - heading: 'Teaching example 2: Year 2: cooperation and listening'
        knowledgeUnitId: numerology.personal_year.2
        paragraphs:
          - Personal year 2 offers a symbolic background for planning and review. Choose a suitable
            situation to explore during the year. You may notice changes in tone and atmosphere and
            make space for different opinions. Cooperation can help a group move forward, but
            constantly guessing what everyone needs can become tiring. A direct question often helps
            more than silent anticipation. Before focused study, write a question that can be
            answered and separate existing evidence from tentative guesses. Summarise a source in
            your own words and compare it with another account. Try arranging a practical use
            afterward, even a five-minute explanation to a colleague. That small application can
            reveal gaps in understanding and prevent a growing collection of material from taking
            the place of feedback. Review a recent decision you initiated. Note what information you
            had, what feedback you missed, and which part of your approach you would keep now.
            Reflection does not need to prove that the original choice was right; it can expand the
            options available next time. Try changing only one step, such as explaining your reasons
            earlier, and observe several situations before deciding whether it helps.
      - heading: 'Teaching example 3: Year 3: expression and creativity'
        knowledgeUnitId: numerology.personal_year.3
        paragraphs:
          - Personal year 3 offers a symbolic background for planning and review. Choose a suitable
            situation to explore during the year. You may enjoy turning an abstract idea into a
            story, an image, or a playful explanation. Expression can open a conversation, while
            editing and practice help that conversation reach a useful conclusion. A lively start
            benefits from a clear finish. When coordinating resources, list people, time, and
            available tools together and check whether the goal fits those conditions. Explain why
            an adjustment is needed and ask participants about limitations you may have missed.
            Consider reviewing both the result and the process. Identify where the burden
            accumulated, then negotiate how to distribute it rather than treating greater speed as
            the only possible improvement. Think of a cooperation that went smoothly and ask when
            you expressed a need directly and when you waited for someone to notice. Write down what
            felt easy and what still made you hesitate. Consider practising a direct request in a
            low-pressure setting, such as saying when a reply would help. Sensitive observation can
            become more useful when clear words give the other person a way to respond.
      - heading: 'Teaching example 4: Year 4: structure and steady effort'
        knowledgeUnitId: numerology.personal_year.4
        paragraphs:
          - Personal year 4 offers a symbolic background for planning and review. Choose a suitable
            situation to explore during the year. You may prefer clear steps, visible progress, and
            commitments that can be checked. Consistent effort can make a difficult task manageable.
            A useful structure also has space for unexpected information, so reliability does not
            become a reason to resist every change. When closing a piece of work, separate
            commitments that still need completion, tasks that can be renegotiated, and lessons
            worth keeping. Tell the people involved what is ending and what still requires a
            handover. You can leave a little time to process the transition. Relief and sadness may
            coexist; finishing an arrangement does not require dismissing the value it once had.
            Choose an idea you often mention but find hard to make concrete and give it an everyday
            example. Tell the example to a friend and ask which part was clear and which felt
            circular. You can finish a simple version before adding detail. Creative work also
            includes removing something that does not help; it need not consist only of collecting
            new ideas or making the presentation more elaborate.
      - heading: 'Teaching example 5: 5: exploration and flexibility in a shorter rhythm'
        knowledgeUnitId: numerology.rhythms.5
        paragraphs:
          - When a personal month or day is 5, try an action within a shorter window that is easy to
            review. You may be curious about new settings, perspectives, and ways of doing things.
            Change can create learning opportunities, while too many options can make it hard to
            settle on a direction. Exploration becomes more useful when you have a steady point to
            return to. In a shared decision, state the direction you prefer and identify what you
            are willing to adjust. If someone chooses differently, pause before treating the
            disagreement as rejection. Try asking for their reasons, then discuss which parts each
            person can decide independently and which need joint confirmation. That distinction
            gives both personal initiative and shared commitments a workable place in the
            conversation. For recurring tasks, inspect the step that most often goes wrong and
            create a short checklist rather than many new rules. After several uses, check whether
            it reduces omissions and whether it creates another difficulty. You can leave a clear
            route for changes so the people using the process can suggest a simpler version. A
            routine should support the work rather than prove who cares more.
      - heading: 'Teaching example 6: 9: perspective and completion in a shorter rhythm'
        knowledgeUnitId: numerology.rhythms.9
        paragraphs:
          - When a personal month or day is 9, try an action within a shorter window that is easy to
            review. You may place personal experience in a wider context and be willing to
            understand different viewpoints. Perspective can help you finish a chapter or let
            something go. Being inclusive does not require carrying every responsibility or giving
            up your own needs. If you want to change an arrangement, explain what you hope to
            explore and ask how the change might affect someone else. When they need stability, keep
            the experiment within your own responsibility instead of requiring them to take the same
            risk. Consider agreeing on a time to share what you learned. Explain what remains
            dependable and what is being tested so curiosity can coexist with trust. When
            coordinating resources, list people, time, and available tools together and check
            whether the goal fits those conditions. Explain why an adjustment is needed and ask
            participants about limitations you may have missed. Consider reviewing both the result
            and the process. Identify where the burden accumulated, then negotiate how to distribute
            it rather than treating greater speed as the only possible improvement.
      - heading: Your practice and review
        paragraphs:
          - Calculate the example's year, month, and day by hand, checking that you did not
            substitute the birth year for the target year. Choose a real goal and rewrite the
            current theme as a preparation question. A monthly review is enough for a study
            exercise; there is no need to consult a Personal Day number for every small decision.
            When crossing time zones or a year boundary, verify the target local date. Keep useful
            and unhelpful prompts in the same notebook. If a theme suggested breaking a task into
            smaller steps, record whether that action helped and what constraints remained. The
            practical result comes from the action and feedback, while the number supplied a
            starting question. Maintaining this distinction lets you use the cycle lightly without
            giving it control over a real calendar or someone's availability.
