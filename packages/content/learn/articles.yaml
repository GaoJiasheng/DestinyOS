  zh:
    title: 大限流年：把紫微时间层分开读
    description: 大限（约十年的宫位背景）与流年（目标年份的阅读层）帮助组织时间主题，不能代替现实安排。
    sections:
      - heading: 大限流年：把紫微时间层分开读
        paragraphs:
          - 大限（约十年的宫位背景）与流年（目标年份的阅读层）帮助组织时间主题，不能代替现实安排。先读本命宫位，再看当前大限的主题，最后讨论一年里的侧重。若同时看到几个四化标记，应记录各自来源，不要只保留最醒目的那一个。
      - heading: 从结构到读法
        paragraphs:
          - 大限所在宫位改变关注角度，并不意味着其他主题暂停。宫位、主星和四化仍须一起看；某年需要更多协作，也可能只是任务结构发生变化。下面以不同宫位与转化作教学对照，不能把所有条件拼成同一时期。出生时辰或农历规则不同，会影响安宫与时间层，因此核对参数应在读文字之前。
      - heading: 怎样使用下面的教学示例
        paragraphs:
          - 下面各段示例展示不同盘面条件下的读法，段中的「你」指假设的示例读者，并非对你的个人判断。这些条件可以互不相容，不应拼成一份命盘。先辨认标题的主题，再观察正文如何从符号走到生活例子与建议。你可以把喜欢的句子改写成一个待观察的问题，也可以记录不符合经验的部分。
      - heading: 教学示例 1：当前大限关联命宫
        knowledgeUnitId: ziwei.decadal.palace.life
        paragraphs:
          - 你可以把自我表达作为当前较长阶段的一项观察重点。大限（传统上约十年的阶段划分）在本盘关联命宫（观察你怎样认识自己和回应日常处境的领域），说明时间层的入口与这个主题相接；其他领域仍需要一起看。比如，接到陌生任务时，先观察自己是急于定方向，还是先询问细节。别用一个盘中标签覆盖自己在不同场合的变化。建议记录一次选择的理由，过几天看看是否仍认可，并在一个约定好的日期回顾是否帮助你更清楚地分配时间。年龄边界用于排列阶段，不表示到达某岁就自动改变生活。
      - heading: 教学示例 2：当前大限关联官禄宫
        knowledgeUnitId: ziwei.decadal.palace.career
        paragraphs:
          - 你可以把工作组织作为当前较长阶段的一项观察重点。大限（传统上约十年的阶段划分）在本盘关联官禄宫（观察任务承担、职业学习与工作方法的领域），说明时间层的入口与这个主题相接；其他领域仍需要一起看。比如，团队开始一个新项目时，你可以观察自己喜欢确定目标、研究方法、核对细节还是协调交接。这份解读讨论工作风格，不替你指定职业；现实能力、兴趣和岗位条件需要一起考虑。建议从现有任务里挑一处流程，和同事约定可检查的改进，并在一个约定好的日期回顾是否帮助你更清楚地分配时间。年龄边界用于排列阶段，不表示到达某岁就自动改变生活。
      - heading: 教学示例 3：当前大限关联福德宫
        knowledgeUnitId: ziwei.decadal.palace.wellbeing
        paragraphs:
          - 你可以把内在满足作为当前较长阶段的一项观察重点。大限（传统上约十年的阶段划分）在本盘关联福德宫（观察休闲偏好、精神空间与获得满足的方式的领域），说明时间层的入口与这个主题相接；其他领域仍需要一起看。比如，周末没有待办催促时，留意你自然选择阅读、独处、见朋友还是做一个有手感的小作品。休息不需要变成绩效项目，喜欢的事也可以没有产出，不必用别人的标准来评价。建议保留一段不交作业的兴趣时间，结束后记录感受，并在一个约定好的日期回顾是否帮助你更清楚地分配时间。年龄边界用于排列阶段，不表示到达某岁就自动改变生活。
      - heading: 教学示例 4：大限化禄关联命宫：接收支持与参与机会
        knowledgeUnitId: ziwei.decadal.mutagen.life.lu
        paragraphs:
          - 一份邀请、共享材料或愿意帮忙的人，可能让你更容易加入一项安排。例如，接到陌生任务时，先观察自己是急于定方向，还是先询问细节。不过，别用一个盘中标签覆盖自己在不同场合的变化。建议先问清支持能用在哪里，选择一项适合余力的参与，再核对这一步是否符合已经答应的事项；时间层次改变观察范围，不替你预告某种具体结果。
      - heading: 教学示例 5：大限化权关联官禄宫：主导责任与决策分工
        knowledgeUnitId: ziwei.decadal.mutagen.career.quan
        paragraphs:
          - 你可以在工作组织中留意主导责任与决策分工，在当前较长阶段里观察它是否反复出现。化权（四化中象征主导责任与决策分工的标记）由当前大限参数确定，并关联到本盘这处星曜，落在官禄宫（观察任务承担、职业学习与工作方法的领域）。你可能更关注谁来决定下一步，以及负责的人是否有足够信息与时间。例如，团队开始一个新项目时，你可以观察自己喜欢确定目标、研究方法、核对细节还是协调交接。不过，这份解读讨论工作风格，不替你指定职业；现实能力、兴趣和岗位条件需要一起考虑。建议把可以决定、需要协商和暂缓的事项分开说明，再核对这一步是否符合已经答应的事项；时间层次改变观察范围，不替你预告某种具体结果。
      - heading: 教学示例 6：大限化忌关联夫妻宫：集中关注与反复磨合
        knowledgeUnitId: ziwei.decadal.mutagen.spouse.ji
        paragraphs:
          - 你可以在亲密沟通中留意集中关注与反复磨合，在当前较长阶段里观察它是否反复出现。化忌（四化中象征集中关注与反复磨合的标记）由当前大限参数确定，并关联到本盘这处星曜，落在夫妻宫（观察亲密关系中的协商方式与期待的领域）。一项未解决的细节可能持续占据注意力，需要看清它到底卡在哪个条件。例如，你与伴侣或正在了解的人安排周末时，可以先分别说出需要安静、交流还是一起做事。不过，关系中的星象描述互动课题，不替你判断某个人是否合适，也不要求你进入某种关系。建议先写出一个真正的卡点，给核对与休息都留时间，再核对这一步是否符合已经答应的事项；时间层次改变观察范围，不替你预告某种具体结果。
      - heading: 教学示例 7：大限化科关联父母宫：说明方法与获得反馈
        knowledgeUnitId: ziwei.decadal.mutagen.parents.ke
        paragraphs:
          - 你可以在代际沟通中留意说明方法与获得反馈，在当前较长阶段里观察它是否反复出现。化科（四化中象征说明方法与获得反馈的标记）由当前大限参数确定，并关联到本盘这处星曜，落在父母宫（观察你与长辈、师长及权威角色交换经验的方式的领域）。把过程说明白、让别人理解你的方法，可能比只展示结果更能改善配合。例如，收到长辈或导师关于下一步的意见时，先问清对方担心什么，再说明你已有的信息和选择理由。不过，尊重经验和保留自主可以并行，这里不评价家庭成员的品格，也不把分歧解释为关系好坏。建议准备一个可复述的小例子，邀请别人指出不清楚的地方，再核对这一步是否符合已经答应的事项；时间层次改变观察范围，不替你预告某种具体结果。
      - heading: 你的练习与复盘
        paragraphs:
          - 把本命、大限、流年分别写在三张卡片上，只记录能定位的主题。另列真实期限与资源，再选择一项准备行动。复盘时保留与主题不符的经历，让学习有修正空间。不要为了获得更舒服的结论频繁换流派；如需比较，使用相同输入并说明规则。
  en:
    title: Separating decade and yearly layers in Zi Wei
    description: A decade period (大限, dà xiàn — an approximately ten-year palace background) and a
      yearly layer organize themes over time.
    sections:
      - heading: Separating decade and yearly layers in Zi Wei
        paragraphs:
          - A decade period (大限, dà xiàn — an approximately ten-year palace background) and a yearly
            layer organize themes over time. They do not replace a real calendar or a person's
            plans. Begin with the natal palace structure, find the current decade's emphasis, and
            then consider the selected year. If several transformation markers appear together,
            record where each came from instead of treating the most striking one as the whole
            reading. This guide helps you keep the layers legible and shows how different palace
            emphases can lead to different reflective questions.
      - heading: From structure to interpretation
        paragraphs:
          - "The decade's palace changes the viewpoint of the reading, not the existence of the
            other life topics. Work, family, learning, and rest continue to interact in ordinary
            life. Read the selected palace with its stars and related structure, then separate any
            period transformations from birth-year transformations. A theme of greater collaboration
            might be useful when a real project changes its division of work; it does not establish
            that a new external event must occur. The examples below offer contrasting palace and
            transformation conditions. They are teaching alternatives, not a composite forecast.
            Accurate comparison also depends on the input rules: a changed birth hour or
            lunar-calendar convention can alter palace placement and the timeline. Check those
            parameters before comparing prose. For retrospective study, keep the date of the reading
            and use contemporaneous notes where available. Otherwise it is easy to select only
            memories that fit a broad theme. For planning, ask what support, preparation, or
            conversation would help an existing commitment. This approach preserves the cultural
            model as a source of questions while allowing verified information and the people
            involved to guide the action."
      - heading: How to work with the teaching examples
        paragraphs:
          - The examples below illustrate separate symbolic conditions. In each example, “you”
            addresses a hypothetical reader with that condition, not you personally. Some conditions
            are alternatives and cannot be combined into a single chart. Read the heading first,
            identify the idea being illustrated, and then notice how the explanation moves from a
            symbol to an ordinary situation and a modest suggestion. You do not need to identify
            with every example. A useful exercise is to rewrite one sentence as a question that you
            could observe in daily life. Keep a second note for anything that does not fit. This
            makes room for disagreement and stops a familiar description from becoming a label.
            These passages come from the same versioned editorial knowledge used by the reading
            engine; including them here demonstrates its writing method, not a calculation for a
            visitor. No birth information is required to study this page.
      - heading: 'Teaching example 1: Current decade linked to Life Palace'
        knowledgeUnitId: ziwei.decadal.palace.life
        paragraphs:
          - You can give deliberate attention to your everyday identity when reviewing the current
            longer phase. The decadal cycle (dà xiàn — a traditional period of approximately ten
            years) points to the Life Palace (mìng gōng), which concerns how you describe yourself
            and respond to ordinary situations. The index marks a thematic entry point rather than a
            specific outcome. When a new task arrives, notice whether you first seek a direction,
            gather details or ask what others need. Your response at home may differ from your
            response at work; leave room for that difference. Try to keep a short note on why you
            chose an approach and revisit it a few days later. Set a review date and assess whether
            the practice helped you allocate attention more clearly. The age boundaries arrange the
            traditional sequence; reaching one does not automatically change your circumstances.
      - heading: 'Teaching example 2: Current decade linked to Career Palace'
        knowledgeUnitId: ziwei.decadal.palace.career
        paragraphs:
          - You can give deliberate attention to organizing work when reviewing the current longer
            phase. The decadal cycle (dà xiàn — a traditional period of approximately ten years)
            points to the Career Palace (guān lù gōng), which concerns how you take responsibility,
            learn professionally and arrange a task. The index marks a thematic entry point rather
            than a specific outcome. At the beginning of a project, notice whether you naturally
            clarify the aim, research a method, check details or coordinate handovers. The reading
            explores a working style without assigning you a profession; skills, interests and the
            conditions of a role matter together. Try to choose one part of an existing workflow and
            agree with a colleague on an observable improvement. Set a review date and assess
            whether the practice helped you allocate attention more clearly. The age boundaries
            arrange the traditional sequence; reaching one does not automatically change your
            circumstances.
      - heading: 'Teaching example 3: Current decade linked to Wellbeing Palace'
        knowledgeUnitId: ziwei.decadal.palace.wellbeing
        paragraphs:
          - You can give deliberate attention to your inner sources of satisfaction when reviewing
            the current longer phase. The decadal cycle (dà xiàn — a traditional period of
            approximately ten years) points to the Wellbeing Palace (fú dé gōng), which concerns the
            interests, mental space and leisure practices that feel restorative. The index marks a
            thematic entry point rather than a specific outcome. During a weekend without urgent
            tasks, notice whether you gravitate toward reading, quiet time, company or making
            something tangible. Leisure does not need to become another performance task; an
            activity may be valuable without producing a visible result. Try to protect a little
            time for an interest without a deliverable and note how you feel afterward. Set a review
            date and assess whether the practice helped you allocate attention more clearly. The age
            boundaries arrange the traditional sequence; reaching one does not automatically change
            your circumstances.
      - heading: 'Teaching example 4: Lu Transformation in Life Palace: the decadal layer'
        knowledgeUnitId: ziwei.decadal.mutagen.life.lu
        paragraphs:
          - You can reflect on access, support and opportunities to participate in your everyday
            identity through this decadal layer. Prosperity transformation (huà lù) — a
            transformation symbol for that emphasis — is linked to a star in the Life Palace (mìng
            gōng), the area concerned with how you describe yourself and respond to ordinary
            situations. The decadal layer uses the current phase parameters and offers a longer
            period for reviewing commitments. In practical terms, an invitation, shared material or
            someone willing to help may make participation more accessible. When a new task arrives,
            notice whether you first seek a direction, gather details or ask what others need.
            However, your response at home may differ from your response at work; leave room for
            that difference. Try to identify what the support is for and choose a form of
            participation that fits your capacity. Check the step against existing commitments and
            what you observe afterward. A timing layer changes the scope of reflection without
            identifying a particular event or deciding its outcome.
      - heading: 'Teaching example 5: Quan Transformation in Career Palace: the decadal layer'
        knowledgeUnitId: ziwei.decadal.mutagen.career.quan
        paragraphs:
          - You can reflect on ownership, responsibility and decision roles in organizing work
            through this decadal layer. Power transformation (huà quán) — a transformation symbol
            for that emphasis — is linked to a star in the Career Palace (guān lù gōng), the area
            concerned with how you take responsibility, learn professionally and arrange a task. The
            decadal layer uses the current phase parameters and offers a longer period for reviewing
            commitments. In practical terms, you may pay closer attention to who decides the next
            step and whether the responsible person has enough information and time. At the
            beginning of a project, notice whether you naturally clarify the aim, research a method,
            check details or coordinate handovers. However, the reading explores a working style
            without assigning you a profession; skills, interests and the conditions of a role
            matter together. Try to distinguish what can be decided, what needs consultation and
            what should wait. Check the step against existing commitments and what you observe
            afterward. A timing layer changes the scope of reflection without identifying a
            particular event or deciding its outcome.
      - heading: 'Teaching example 6: Ji Transformation in Spouse Palace: the decadal layer'
        knowledgeUnitId: ziwei.decadal.mutagen.spouse.ji
        paragraphs:
          - You can reflect on concentrated concern and recurring friction in negotiation in close
            relationships through this decadal layer. Obstacle transformation (huà jì) — a
            transformation symbol for that emphasis — is linked to a star in the Spouse Palace (fū
            qī gōng), the area concerned with the expectations and conversations that shape an
            intimate partnership. The decadal layer uses the current phase parameters and offers a
            longer period for reviewing commitments. In practical terms, an unresolved detail may
            keep claiming attention, making it useful to identify the condition that is actually
            holding it up. While arranging a weekend with a partner or someone you are getting to
            know, compare what each person needs from the time together. However, a symbolic
            relationship theme cannot decide compatibility or tell you what kind of relationship to
            pursue. Try to name the actual sticking point and allow time for both checking and
            recovery. Check the step against existing commitments and what you observe afterward. A
            timing layer changes the scope of reflection without identifying a particular event or
            deciding its outcome.
      - heading: 'Teaching example 7: Ke Transformation in Parents Palace: the decadal layer'
        knowledgeUnitId: ziwei.decadal.mutagen.parents.ke
        paragraphs:
          - You can reflect on explanation, learning and constructive feedback in communication
            across experience levels through this decadal layer. Fame transformation (huà kē) — a
            transformation symbol for that emphasis — is linked to a star in the Parents Palace (fù
            mǔ gōng), the area concerned with how you exchange experience with elders, mentors and
            people in positions of authority. The decadal layer uses the current phase parameters
            and offers a longer period for reviewing commitments. In practical terms, explaining a
            process so someone can understand the method may support cooperation more than showing
            an outcome alone. When an elder or mentor recommends a next step, ask what concern lies
            behind the advice before explaining the information guiding your choice. However,
            respect for experience can coexist with autonomy; disagreement alone does not measure a
            family member’s character or the quality of a bond. Try to prepare a small example
            someone can restate and invite feedback on what remains unclear. Check the step against
            existing commitments and what you observe afterward. A timing layer changes the scope of
            reflection without identifying a particular event or deciding its outcome.
      - heading: Your practice and review
        paragraphs:
          - Write natal, decade, and yearly observations on separate cards. Include only themes you
            can locate in the chart. Keep actual deadlines, available resources, and decisions on
            another page so that symbolic wording does not blur factual information. Choose one
            preparation step that would help regardless of the reading, such as clarifying who will
            review a draft or arranging enough time for a handover. At your next review, include
            experiences that did not fit the theme. These notes help you judge whether the prompt
            added anything useful. Avoid repeatedly switching schools in search of a more
            comfortable description. If you want to compare methods, preserve the same input and
            identify the rule that differs. The point of a layered timeline is to make the model
            easier to understand, not to make everyday choices dependent on a label for the current
            period.
