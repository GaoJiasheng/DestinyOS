            reflection, while each person remains free to choose how to participate.
      - heading: 'Teaching example 3: communication: A’s mercury and B’s mercury form a square'
        knowledgeUnitId: synastry.western.mercury_mercury.square
        paragraphs:
          - A’s mercury and B’s mercury form a square. Differences in timing may become visible;
            specific responsibilities can reduce recurring arguments, especially where language and
            information meets language and information. Try to repeat the other person’s view before
            making your own request during a small discussion. Two people may both want support but
            express it through quiet company or active questions. Ask whether the other person
