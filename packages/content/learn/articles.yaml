  slug: planets-signs-houses
  zh:
    title: 行星、星座、宫位：读懂占星的三层语法
    description: 行星讨论什么主题，星座描述表达风格，宫位提供生活情境；这是读本命盘时方便使用的三层语法，不是固定公式。
    sections:
      - heading: 行星、星座、宫位：读懂占星的三层语法
        paragraphs:
          - 行星讨论什么主题，星座描述表达风格，宫位提供生活情境；这是读本命盘时方便使用的三层语法，不是固定公式。先把三层分开，再讨论它们怎样组合。宫位需要准确出生时间与地点，不能把没有宫位的盘自行补成完整版本。
      - heading: 从结构到读法
        paragraphs:
          - 例如水星可讨论信息表达，星座提供方式，落宫让你把问题放到学习、协作或日常等主题。本项目默认
            Placidus，并支持文档规定的其他宫位制；高纬度退化时会显示替代警示。宫位改变不代表行星黄经改变。下面选择不同落宫示例，练习把主题落到生活问题，而不是用宫名断定经历。
      - heading: 怎样使用下面的教学示例
        paragraphs:
          - 下面各段示例展示不同盘面条件下的读法，段中的「你」指假设的示例读者，并非对你的个人判断。这些条件可以互不相容，不应拼成一份命盘。先辨认标题的主题，再观察正文如何从符号走到生活例子与建议。你可以把喜欢的句子改写成一个待观察的问题，也可以记录不符合经验的部分。
      - heading: 教学示例 1：水星在第一宫：日常呈现与主动回应
        knowledgeUnitId: astrology.planet_house.mercury.h1
        paragraphs:
          - 你对思考、学习与沟通的体验，容易在日常呈现与主动回应的场景里变得具体。水星（象征思考、学习与沟通的命盘要素）落入第一宫（观察自我呈现与开始方式的领域），把这个面向与该生活领域连接起来；这个生活领域把注意力带到你如何进入新场景；别人看到的第一反应只是你的一部分。例如，进入陌生团队时，你可能先观察自己怎样开口介绍，也留意是否给别人提问的机会，留意自己的习惯是否帮助你理解当下需要。也要注意把说得快当成已经说清楚与用第一印象限制后续认识的情况；可以先用一次真实互动修正自我印象，再尝试先问对方需要细节还是整体框架，把一次观察当作练习材料，给环境变化与其他命盘要素留出解释空间。
      - heading: 教学示例 2：水星在第三宫：交流、学习与身边连接
        knowledgeUnitId: astrology.planet_house.mercury.h3
        paragraphs:
          - 你对思考、学习与沟通的体验，容易在交流、学习与身边连接的场景里变得具体。水星（象征思考、学习与沟通的命盘要素）落入第三宫（观察日常交流与基础学习的领域），把这个面向与该生活领域连接起来；这个生活领域关注信息怎样在你和身边人之间流动；理解的深浅需要通过具体回应确认。例如，向同事说明步骤时，你可以请对方实际演示一次，看看遗漏的是哪个环节，留意自己的习惯是否帮助你理解当下需要。也要注意把说得快当成已经说清楚与把熟悉误认为理解一致的情况；可以先用一个例子确认理解，再尝试先问对方需要细节还是整体框架，把一次观察当作练习材料，给环境变化与其他命盘要素留出解释空间。
      - heading: 教学示例 3：金星在第五宫：创造、玩乐与自发表达
        knowledgeUnitId: astrology.planet_house.venus.h5
        paragraphs:
          - 你对关系偏好、欣赏与价值感的体验，容易在创造、玩乐与自发表达的场景里变得具体。金星（象征关系偏好、欣赏与价值感的命盘要素）落入第五宫（观察创造与自发乐趣的领域），把这个面向与该生活领域连接起来；这个生活领域关注你怎样表达喜爱并享受参与；爱好与亲密体验无需承担表现优秀的任务。例如，尝试新爱好时，你可以先做一件没有评比的小作品，再决定是否继续投入，留意自己的习惯是否帮助你理解当下需要。也要注意用讨好替代真实偏好与把乐趣全部变成成绩的情况；可以先留一段没有评比的玩乐时间，再尝试说明一个喜欢与一个边界，把一次观察当作练习材料，给环境变化与其他命盘要素留出解释空间。
      - heading: 教学示例 4：金星在第七宫：伙伴关系与平等协商
        knowledgeUnitId: astrology.planet_house.venus.h7
        paragraphs:
          - 你对关系偏好、欣赏与价值感的体验，容易在伙伴关系与平等协商的场景里变得具体。金星（象征关系偏好、欣赏与价值感的命盘要素）落入第七宫（观察一对一伙伴关系的领域），把这个面向与该生活领域连接起来；这个生活领域关注你如何与别人协商承诺；伴侣、朋友或合作伙伴都可成为观察场景，不催促任何关系形式。你表达欣赏的方式，可能与接受关心的方式有关；关系里的舒适感需要双方说明，而非靠猜测。例如，一起做决定时，你可以分别说出需要，再找一个双方愿意试行的安排，留意自己的习惯是否帮助你理解当下需要。也要注意用讨好替代真实偏好与把配合当成放弃自己的情况；可以先约定双方都能提出修改的规则，再尝试说明一个喜欢与一个边界，把一次观察当作练习材料，给环境变化与其他命盘要素留出解释空间。
      - heading: 教学示例 5：火星在第六宫：日常流程、分工与作息
        knowledgeUnitId: astrology.planet_house.mars.h6
        paragraphs:
          - 你对行动、竞争与边界的体验，容易在日常流程、分工与作息的场景里变得具体。火星（象征行动、竞争与边界的命盘要素）落入第六宫（观察日常工作与生活维护的领域），把这个面向与该生活领域连接起来；这个生活领域关注可重复的安排；涉及身体时只讨论作息与保养习惯，不能据此判断疾病。你开始行动与处理分歧的方式，往往能看出动力如何形成；冲劲需要与可持续的节奏配合。例如，忙碌的一周里，你可以调整一项反复打断休息的安排，并与伙伴谈清分工，留意自己的习惯是否帮助你理解当下需要。也要注意把每个分歧都当成较量与把持续忙碌视为唯一的价值的情况；可以先固定一个可持续的休息节点，再尝试先确定第一步与暂停条件，把一次观察当作练习材料，给环境变化与其他命盘要素留出解释空间。
      - heading: 教学示例 6：木星在第九宫：远方经验、学习与意义
        knowledgeUnitId: astrology.planet_house.jupiter.h9
        paragraphs:
          - 你对探索、信念与扩展的体验，容易在远方经验、学习与意义的场景里变得具体。木星（象征探索、信念与扩展的命盘要素）落入第九宫（观察进阶学习与更大视野的领域），把这个面向与该生活领域连接起来；这个生活领域关注你如何理解不同经验；信念可以提供方向，也可以在新证据出现时更新。你可能从学习与接触新环境中获得希望；愿景让人愿意尝试，也需要与手头资源相互校对。例如，读到不同文化的观点时，你可以问它在怎样的生活背景下形成，再与自己的经验比较，留意自己的习惯是否帮助你理解当下需要。也要注意把可能性当成已经拥有的资源与把自己的背景当成唯一标准的情况；可以先给一种不同观点写下背景说明，再尝试用一个小实验检验大想法，把一次观察当作练习材料，给环境变化与其他命盘要素留出解释空间。
      - heading: 你的练习与复盘
        paragraphs:
          - 选一颗行星，把主题、星座方式和宫位情境各写一句；没有时间时不写第三句。以一个近期任务作例子，提出一个可观察的问题。切换宫位制用于比较时，记录哪些落宫改变、哪些黄经保持相同，不把技术差异当作生活新事实。
  en:
    title: Planets, signs, and houses as three reading layers
    description: A useful beginner grammar asks what theme a planet introduces, what style a sign
      suggests, and what context a house supplies.
    sections:
      - heading: Planets, signs, and houses as three reading layers
        paragraphs:
          - A useful beginner grammar asks what theme a planet introduces, what style a sign
            suggests, and what context a house supplies. It is a reading aid rather than a fixed
            equation. Separate the three layers before combining them. Houses require accurate birth
            time and place, so a chart without house data should remain incomplete in that respect.
            You can still study other visible placements without inventing a more detailed chart.
      - heading: From structure to interpretation
        paragraphs:
          - "Mercury, for example, can organize a question about communicating information. A sign
            supplies a style, and a house places the question in a context such as study,
            collaboration, or routine. This does not mean everyone with a placement has the same
            experience. The project's default house system is Placidus, with other documented
            systems available. At high latitudes, a calculation may use a fallback and disclose a
            warning. A changed house assignment does not necessarily mean a planet's zodiac
            longitude changed. Check the coordinate and house settings separately when comparing
            services. The teaching examples below focus on different house placements so you can see
            how one symbolic theme changes its practical question with context. They are not an
            inventory of your chart. Locate a placement in the technical table before applying its
            paragraph. You can then ask whether the example suggests something worth observing in a
            current task. It cannot establish a profession, family arrangement, or another person's
            intention. Keeping the layers distinct also helps with learning terminology: you need to
            know the planet's theme, the sign's style, and the house's topic, rather than memorize a
            separate personality description for every possible combination."
          - A useful comparison notebook can have one row for each placement and separate columns
            for the original chart and the alternative house system. Include the warning, if any,
            rather than comparing only the final label. This keeps the reason for a changed context
            visible during later study.
      - heading: How to work with the teaching examples
        paragraphs:
          - The examples below illustrate separate symbolic conditions. In each example, “you”
            addresses a hypothetical reader with that condition, not you personally. Some conditions
            are alternatives and cannot be combined into a single chart. Read the heading first,
            identify the idea being illustrated, and then notice how the explanation moves from a
            symbol to an ordinary situation and a modest suggestion. You do not need to identify
            with every example. A useful exercise is to rewrite one sentence as a question that you
            could observe in daily life. Keep a second note for anything that does not fit. This
            makes room for disagreement and stops a familiar description from becoming a label.
            These passages come from the same versioned editorial knowledge used by the reading
            engine; including them here demonstrates its writing method, not a calculation for a
            visitor. No birth information is required to study this page.
      - heading: 'Teaching example 1: Mercury in the First House'
        knowledgeUnitId: astrology.planet_house.mercury.h1
        paragraphs:
          - 'You may notice learning and communication most clearly in situations involving everyday
            presence and initiative. Mercury — the chart factor associated with learning and
            communication — falls in the First House — the area associated with everyday presence.
            This area concerns how you enter a situation. First impressions give useful feedback but
            leave much of your experience unseen. You may have a recognizable way of collecting
            information, framing questions, and testing a claim, but a listener can need a different
            route into the same idea. For example, on joining a new group, pay attention to the way
            you introduce yourself and to the room you leave for other people to respond. Watch for
            mistaking a fast explanation for a shared understanding, especially alongside allowing a
            first impression to restrict later understanding. Try this: use a real interaction to
            revise a first impression, and review what changed before adding another task.'
      - heading: 'Teaching example 2: Mercury in the Third House'
        knowledgeUnitId: astrology.planet_house.mercury.h3
        paragraphs:
          - 'You may notice learning and communication most clearly in situations involving learning
            and nearby connections. Mercury — the chart factor associated with learning and
            communication — falls in the Third House — the area of everyday communication and
            learning. This area concerns the movement of information around you. Familiarity with a
            subject does not automatically mean that another person received your explanation. You
            may have a recognizable way of collecting information, framing questions, and testing a
            claim, but a listener can need a different route into the same idea. For example, when
            explaining an everyday task, ask the listener to show you the next step; their
            demonstration can identify a missing link without turning the exchange into a test.
            Watch for mistaking a fast explanation for a shared understanding, especially alongside
            assuming shared familiarity means shared understanding. Try this: check understanding
            with one practical example, and review what changed before adding another task.'
      - heading: 'Teaching example 3: Venus in the Fifth House'
        knowledgeUnitId: astrology.planet_house.venus.h5
        paragraphs:
          - 'You may notice affection and personal values most clearly in situations involving play
            and creative expression. Venus — the chart factor associated with affection and personal
            values — falls in the Fifth House — the area of play and creative expression. This area
            concerns enjoyment that starts from a personal impulse. A hobby or affectionate exchange
            can matter without becoming a performance or a plan for recognition. You may express
            appreciation through a particular mix of attention, shared enjoyment, and consideration,
            while another person can read a different gesture as caring. For example, when trying a
            hobby, make something you do not need to show anyone; notice whether enjoyment changes
            when the result no longer has to earn approval. Watch for substituting pleasant
            agreement for an honest preference, especially alongside turning every enjoyable
            activity into a performance target. Try this: set aside time for an activity with no
            ranking, and review what changed before adding another task.'
      - heading: 'Teaching example 4: Venus in the Seventh House'
        knowledgeUnitId: astrology.planet_house.venus.h7
        paragraphs:
          - 'You may notice affection and personal values most clearly in situations involving
            partnership and mutual agreements. Venus — the chart factor associated with affection
            and personal values — falls in the Seventh House — the area of one-to-one partnership.
            This area concerns negotiation and mutual commitments. You can explore it through a
            partner, friend, or collaborator without needing a particular relationship status. You
            may express appreciation through a particular mix of attention, shared enjoyment, and
            consideration, while another person can read a different gesture as caring. For example,
            when making a shared decision, give each person time to state a need before looking for
            an agreement; a workable trial can be more revealing than an ideal description of
            partnership. Watch for substituting pleasant agreement for an honest preference,
            especially alongside treating cooperation as a requirement to erase your preference. Try
            this: make an agreement that either person can request to revise, and review what
            changed before adding another task.'
      - heading: 'Teaching example 5: Mars in the Sixth House'
        knowledgeUnitId: astrology.planet_house.mars.h6
        paragraphs:
          - 'You may notice initiative and assertiveness most clearly in situations involving
            routines and practical upkeep. Mars — the chart factor associated with initiative and
            assertiveness — falls in the Sixth House — the area of routines and practical upkeep.
            This area concerns repeatable arrangements. In matters of wellbeing, the reading stays
            with rest and everyday habits and cannot assess a medical condition. You may recognize
            your motivation most clearly at the moment you start a difficult task or decide that a
            request exceeds your available time and energy. For example, during a crowded week, find
            one recurring interruption to rest and discuss whether a task can be moved, shared, or
            simplified without judging yourself for needing a pause. Watch for turning every
            disagreement into a contest that needs a winner, especially alongside using
            uninterrupted busyness as the measure of a worthwhile day. Try this: create a repeatable
            pause within your daily routine, and review what changed before adding another task.'
      - heading: 'Teaching example 6: Jupiter in the Ninth House'
        knowledgeUnitId: astrology.planet_house.jupiter.h9
        paragraphs:
          - 'You may notice exploration and confidence most clearly in situations involving wider
            learning and perspective. Jupiter — the chart factor associated with exploration and
            confidence — falls in the Ninth House — the area of wider learning and perspective. This
            area concerns the frameworks you use to make sense of unfamiliar experience. A belief
            can guide exploration while remaining open to revision through contact with others. You
            may gain confidence through learning, travel, or meeting people whose assumptions differ
            from yours; that wider view becomes useful when it changes a manageable decision. For
            example, when reading an unfamiliar viewpoint, ask what everyday conditions helped
            produce it before comparing it with your own experience; context can make a disagreement
            easier to understand. Watch for confusing an appealing possibility with capacity you
            already have, especially alongside making your background the only standard for
            understanding others. Try this: describe the context of a viewpoint different from
            yours, and review what changed before adding another task.'
      - heading: Your practice and review
        paragraphs:
          - Choose one planet and write one sentence for its theme, one for the sign's style, and
            one for the house context. Omit the third sentence if birth time is missing. Use a
            recent task as an example and formulate a question you can observe. If you compare house
            systems, record which house assignments change and which longitudes remain the same.
            This gives you a concrete way to understand a technical difference without turning it
            into a new fact about life. After a small trial, note whether the question helped you
            communicate, prepare, or reflect. Set aside any part that did not fit. The three-layer
            grammar is most useful when it makes a reading clearer and more accountable to its
            stated basis, rather than making a description sound more personal simply by adding
            detail.
