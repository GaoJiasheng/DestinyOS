  zh:
    title: 六合：协作衔接
    summary: 六合：协作衔接
    body: 你可以留意哪些合作条件让事情更容易衔接。六合（两支在传统关系表里构成的配对）强调连接，原盘记录的组合并不自动改变五行，也不表示现实意见总会一致。这里观察的是你的回应方式，不把不同节奏贴成固定性格标签。例如合作对象提出不同方案时，你可以先复述对方的目标，再说明自己想保留的关键条件，找到双方都能尝试的小步骤。建议给试行设一个结束日期，届时依据体验调整；灵活不需要以忽略自己的需要为代价。你可以从一次具体经历检验这个角度，再决定是否把它放进自己的行动计划；传统描述提供的是观察线索，不替代对现实条件的判断。
    advice:
      - 先说明不同需求，再试行一个双方认可的安排。
    do:
      - 小步实践
    dont:
      - 急于定论
  en:
    title: 'Liù hé: coordination'
    summary: 'Liù hé: coordination'
    body: A natal pair forms liù hé — a table-defined branch combination. The connection provides a cooperation metaphor; it does not automatically transform elements or establish agreement between real people. For character reflection, notice a response in context instead of assigning a fixed trait. Suppose a collaborator proposes a different method. You can first check what they are trying to achieve, then name the condition that matters most to you. A limited trial may reveal a route neither person initially considered. Consider agreeing when the trial ends and what feedback you will examine. Flexibility works better when your needs are visible, rather than disappearing into an arrangement you quietly dislike. You can check which detail matches an actual situation, ask for relevant feedback, and revise the next step using what you learn. Keep the reflection open to information that the chart itself cannot supply.
    advice:
      - Name the different needs before trying an agreed arrangement.
    do:
      - Test gradually
    dont:
      - Rush conclusions
  meta:
    author: t23-editorial-v1
    reviewed_by: null
    version: 1
    status: published
