  zh:
    title: 甲木，身强：主动检验
    summary: 甲木，身强：主动检验
    body: 你倾向于先确定方向，再沿着清楚的目标持续推进。甲木（日主的一种象征，像向上生长的树干）侧重原则与长程发展，你的日干采用这一标记，所以这里更关注目标感，而不是把你描绘成永远坚定的人。身强（评分中扶助力量较多）表示这里较强调主动消化已有资源，不是身体强壮或能力更高。你的分类落在这一档，容易在熟悉事务上想继续加码，也需要留意别人是否跟得上。例如你要为小组拟定活动目标，可以先问清每个人希望带走什么，再把共同需求收束成一项可交付成果。建议约定一次中途检查，允许根据反馈改写方法，不把维护方向变成坚持所有细节。
    advice:
      - 先做一个小方案，完成后再决定是否扩大。
    do:
      - 小步实践
    dont:
      - 急于定论
  en:
    title: 'Jia Wood, supported: Test a small plan'
    summary: 'Jia Wood, supported: Test a small plan'
    body: You may prefer a clear purpose before investing effort. Jia Wood (jiǎ mù — the upright tree metaphor for your day stem) emphasizes direction and continuity; your recorded day stem supplies the basis for this reading. A volunteer project, for instance, may feel easier once you understand who it serves. A strong classification (shēn qiáng — relatively greater support in the chart score) concerns symbolic balance, not physical strength or superior ability. Your score falls in this band, so the question is how you channel resources without assuming that other people share your pace. Imagine helping a group define an event. One participant wants new contacts, another wants practical learning, and a third has limited time. You can identify a shared outcome before deciding the format. Consider a midpoint check so that the original purpose remains useful while details can change. This distinguishes continuity from defending every early decision, and gives others a clear way to contribute.
    advice:
      - Start with an outline and review it after a small trial.
    do:
      - Test gradually
    dont:
      - Rush conclusions
  meta:
    author: t23-editorial-v1
    reviewed_by: null
    version: 1
    status: published
