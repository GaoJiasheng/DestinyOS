    body: 你容易从细小线索中形成理解，倾向于留些思考空间。癸水（日主的一种象征，像缓慢润泽的雨露）强调细察与积累，你的日干采用这一标记，所以这里关注信息处理，不由此判断你是否善于社交。身弱（评分中消耗力量相对较多）提示先留意可用支持，不是身体虚弱或能力不足。你的分类采用这一档，忙碌时容易把任务都揽在自己身上，更值得辨认哪些责任可以分担、哪些要求需要商量。比如一件事情同时有推进和暂停的理由，你可以列出当前证据，选一个能在短时间内带来新信息的试验。建议事先写下继续与停止的条件，让决定有可回看的依据；面对不确定时保持适度行动，也可以成为认识自身节奏的方法。
    advice:
      - 答应新任务前，先说明可投入的时间。
    do:
      - 小步实践
    dont:
      - 急于定论
  en:
    title: 'Gui Water, less supported: Make room to respond'
    summary: 'Gui Water, less supported: Make room to respond'
    body: You may form an understanding through small observations gathered over time. Gui Water (guǐ shuǐ — the rain and dew metaphor for your day stem) emphasizes subtle attention. When learning a skill, brief notes about what changed between attempts might help you see a pattern that a single result hides. A weak classification (shēn ruò — expenditure outweighs support in the symbolic score) asks what help is available. It does not measure health, confidence, or talent. In this band, a useful focus is whether your commitments have enough time, guidance, and cooperation behind them before you accept another demand. A decision may have sensible reasons both to proceed and to pause. List the evidence available now and choose a brief trial that can supply new information. You can define conditions for continuing or stopping before the trial begins. Try keeping those criteria visible during the review. Moderate action in an uncertain situation can teach you about your preferred pace while preventing a temporary choice from quietly becoming an open-ended commitment.
    advice:
      - State your available time before accepting a new request.
    do:
      - Test gradually
    dont:
      - Rush conclusions
