    body: 你可以观察接收信息时，是否也给行动确定一个起点。水（传统五类象征中偏向流动与储备的一类）在这里提供信息和休整的比喻，不表示身体含水量，也不能据此判断任何器官的状况。你的忌神列表包含这一类，表示简化模型不优先增加它的象征主题，不是现实事物有害。你不需要避开某个颜色、季节、方位或职业，只需观察实际负担是否合适。比如你对一段交流仍有疑问，可以把听到的话与自己的猜测分开，找一个合适时机提出具体问题。建议允许对方补充背景，不用细微语气推断全部意思；敏感的观察可以帮助沟通，但仍需要真实回应来修正理解。
    advice:
      - 只做可撤回的小调整，依据体验决定是否保留。
    do:
      - 小步实践
    dont:
      - 急于定论
  en:
    title: 'Water: Review the commitment'
    summary: Water (shuǐ — the movement and reserve category) prompts reflection on information and recovery time.
    body: Water (shuǐ — the movement and reserve category) prompts reflection on information and recovery time. It does not measure bodily fluids or establish an organ’s condition. You can notice whether gathering possibilities is followed by a manageable starting point for action. Your unfavorable list includes this category, meaning the simplified model does not prioritize adding its symbolic theme. This does not make real colours, seasons, directions, or occupations harmful. Actual conditions determine what is suitable for you. An ambiguous conversation can leave room for several explanations. Separate what was actually said from what you inferred, then ask a specific question at a suitable moment. You can let the other person supply context that a tone or brief message cannot reveal. Try updating your understanding with their response. Sensitivity to detail can support communication, provided an interpretation remains open to correction rather than growing into certainty through repeated private analysis.
    advice:
      - Make a reversible change and assess its practical effect.
    do:
      - Test gradually
    dont:
      - Rush conclusions
