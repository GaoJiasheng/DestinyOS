  zh:
    title: 五行相生：看衔接
    summary: 中和的盘更适合观察五行之间如何衔接，而不是单看哪一类多或少。
    body: 中和的盘更适合观察五行之间如何衔接，而不是单看哪一类多或少。传统说法里，五行按相生（木生火、火生土、土生金、金生水、水生木，像一环接一环的传递）连成一圈；喜忌不突出时，可以把这个循环当作整理生活节奏的比喻：酝酿想法、开始行动、稳定下来、收尾检查、休整积累。你可以对照最近一个项目或一段日常安排，看看哪一步最容易被跳过。比如总在行动阶段很投入，却很少留时间复盘，下一轮就容易重复同样的问题。建议在日程里给最常被跳过的那一步留出一个固定的小时段，试行两周后再决定是否保留。这只是象征层面的提醒，具体做法仍以你的实际情况为准。
    advice:
      - 给最常跳过的那一步留一个固定时段，试行两周。
    do:
      - 小步实践
    dont:
      - 急于定论
  en:
    title: 'The generating cycle: watch the handovers'
    summary: A balanced chart is better read through how the elements connect than through which one is largest or smallest.
    body: A balanced chart is better read through how the elements connect than through which one is largest or smallest. In the traditional generating cycle (xiāng shēng — Wood feeds Fire, Fire feeds Earth, Earth feeds Metal, Metal feeds Water, and Water feeds Wood), each category passes something on to the next. When no element stands out as favorable or unfavorable, you can borrow that loop as a metaphor for rhythm, moving from forming an idea to acting on it, settling it, finishing and checking, and then resting and gathering again. You can compare it with a recent project or an ordinary week and notice which step tends to get skipped. Someone who throws energy into action but rarely reviews the result may meet the same problem in the next round. Consider reserving a small, fixed slot for the step you skip most, keep it for two weeks, and then decide whether it earns its place. This is a symbolic prompt, and your actual circumstances decide what is practical.
    advice:
      - Reserve a fixed slot for the step you skip most and try it for two weeks.
    do:
      - Test gradually
    dont:
      - Rush conclusions
