  en:
    title: 'No standout element: focus on flow'
    summary: Your Day Master is balanced and the chart shows no clear one-sidedness, so no element stands out as favorable or unfavorable.
    body: Your Day Master is balanced and the chart shows no clear one-sidedness, so no element stands out as favorable or unfavorable. A use god (yòng shén — the element traditionally chosen to correct a lopsided chart) gives a clear direction mainly when the Day Master is distinctly strong or weak. Your score sits in the middle band, where support and expenditure are fairly close, so this reading does not force one element into that role or mark any category as something to avoid. Balanced does not mean everything runs smoothly. It shifts the question from what to add toward how well the different parts of your life connect. You can think back over the past week and notice where things stalled at a handover, such as a plan that was ready but never started, or a task that was done but never closed. Try making one small change at the point that stalls most often, then check after a few days whether it helped. The element percentages are a reference, not a shopping list.
    advice:
      - Find the step that stalls most often and adjust it once.
    do:
      - Test gradually
    dont:
      - Rush conclusions
