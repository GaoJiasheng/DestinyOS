    summary: 日主强弱中和，这张盘只把调候的五行列为喜用，其余四类既不算喜也不算忌。
    body: 日主强弱中和，这张盘只把调候的五行列为喜用，其余四类既不算喜也不算忌。调候（按出生月份讨论寒暖燥湿的辅助判断）在冬月火少时取火，在夏月水少时取水；你的盘正好落在其中一种情况，所以喜用只有一项。其余四类没有被列为忌神，是因为在中和的盘里它们并未造成明显偏枯，这也不表示需要回避相关的颜色、方位或行业。你可以把调候理解成季节性的提醒：冬月出生、火少的盘，可以留意日常是否有足够的活动和交流；夏月出生、水少的盘，可以留意忙碌之后是否留出安静整理和休息的时间。建议从一项容易执行的小安排开始，比如每周固定一次和朋友散步，或者每天留一段不被打扰的时间，再根据实际感受调整。
    advice:
      - 从一项容易执行的小安排开始，再按感受调整。
    do:
      - 小步实践
    dont:
      - 急于定论
  en:
    title: Only the seasonal correction is listed
    summary: Your Day Master is balanced, so only the seasonal-correction element is listed as favorable and the other four are left unlabelled.
    body: Your Day Master is balanced, so only the seasonal-correction element is listed as favorable; the other four are neither favorable nor unfavorable. Seasonal correction (tiáo hòu — an auxiliary judgment about warmth and moisture based on the birth month) takes Fire when a winter chart has little Fire, and Water when a summer chart has little Water. Your chart falls into one of these cases, which is why the favorable list has a single entry. The remaining categories are not marked unfavorable because, in a balanced chart, none of them creates a clear one-sidedness. That also does not mean avoiding any colour, direction, or occupation. You can treat the correction as a seasonal reminder. For a winter chart short on Fire, notice whether your routine includes enough activity and contact with other people. For a summer chart short on Water, notice whether busy stretches are followed by quiet time to sort things out and rest. Try starting with one easy arrangement, such as a weekly walk with a friend or a regular hour without interruptions, and adjust it to how it actually feels.
    advice:
      - Start with one easy arrangement and adjust it to how it feels.
    do:
      - Test gradually
    dont:
      - Rush conclusions
