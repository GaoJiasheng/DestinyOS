  zh:
    title: 七杀：透出
    summary: 七杀：透出
    body: 你容易留意期限、竞争或需要迅速处理的要求。七杀（克日干且同阴阳的成分）象征外部压力与应对，名字不描述危险事件。盘中出现它时，更适合观察任务如何形成挑战，以及你是否有足够条件作出回应。透出（成分出现在年、月或时的天干）让这个主题在表达层面更容易被观察，但仍要结合整盘和实际情境看。这里依据的是可见天干，不把它等同于工作表现已经得到认可。七杀侧重外部挑战如何被承接，压力不等于危险。比如接到期限紧的任务，可以先划出必须完成的部分，确认谁能支援，再决定是否缩小交付范围。建议把可用时间与所需步骤同时写给对方，必要时商量延期或分阶段完成；果断体现在先处理关键障碍，不需要靠独自加班来证明自己能应付。
    advice:
      - 建议把可用时间与所需步骤同时写给对方，必要时商量延期或分阶段完成；果断体现在先处理关键障碍，不需要靠独自加班来证明自己能应付。
    do:
      - 小步实践
    dont:
      - 急于定论
  en:
    title: 'Qī shā: visible in a stem'
    summary: 'Qī shā: visible in a stem'
    body: You may be attentive to demanding deadlines or external expectations. Qī shā — a component
      that checks the day stem and shares its polarity — symbolizes challenge and response. The
      dramatic traditional name does not predict danger. The relevant question is whether a
      demanding task comes with enough support and a clear scope. The trigger is a visible year,
      month, or hour stem. Exposure (tòu chū — appearing in a visible stem) makes a symbolic theme
      more explicit in this model, but it is not proof that others recognize it in your work. A
      demanding deadline calls for a clear response to pressure, not for accepting every requirement
      unchanged. If a task arrives with little preparation time, separate the essential deliverable
      from optional refinements. Ask who can supply the missing information and which decisions
      require approval. Try showing the requester the steps and time actually needed. You may be
      able to negotiate a smaller first delivery or distribute the work. Decisiveness can mean
      identifying the main obstacle quickly rather than working alone until the task is finished.
      The Seven Killings label is a traditional name for a controlling relationship; it does not
      describe a dangerous event.
    advice:
      - Try showing the requester the steps and time actually needed.
    do:
      - Test gradually
    dont:
      - Rush conclusions
  meta:
    author: t23-editorial-v1
    reviewed_by: null
    version: 2
    status: published
