  zh:
    title: 正印：透出
    summary: 正印：透出
    body: 你往往愿意借助清楚的资料和可信的支持来准备。正印（生日干且阴阳不同的成分）象征学习、经验与照应，盘中出现它时，观察重点是支持能否转成实际行动，不说明学历高低，也不把寻求指导视为依赖。透出（成分出现在年、月或时的天干）让这个主题在表达层面更容易被观察，但仍要结合整盘和实际情境看。这里依据的是可见天干，不把它等同于工作表现已经得到认可。正印把学习与可靠支持联系起来，重点是准备怎样转成行动。比如进入新岗位，可以先用已有说明完成一次基本操作，再向带教者询问卡住的环节，不必等到理解全部资料才开始。建议把得到的帮助整理成自己能重复使用的步骤；若每次都等待别人认可，先约定哪些事项可以独立处理，让照应帮助你建立自主性。
    advice:
      - 建议把得到的帮助整理成自己能重复使用的步骤；若每次都等待别人认可，先约定哪些事项可以独立处理，让照应帮助你建立自主性。
