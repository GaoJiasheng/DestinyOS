  exclusive_with: []
  zh:
    title: 食神：相处观察
    summary: 食神：相处观察
    body: 你倾向于通过熟悉技能和稳定产出来表达自己。食神（日干所生且同阴阳的成分）象征顺畅输出与生活体验，盘中出现这一成分时，更适合观察技能如何被持续使用，而不是推断享受或收入的多少。这一成分只作为互动方式的提示，不是按性别分配关系角色的依据。你可以观察双方怎样分享时间、回应请求与确认边界，实际关系需要以彼此意愿和持续的沟通来理解。食神的重点是把日主所生的力量转成能持续使用的产出。比如你擅长讲解，可以把反复回答的问题整理成一页说明，邀请读者按步骤试一次，而不是每次都临场从头解释。建议以是否容易使用衡量改进，并留出完成后的休息；若只顾追求舒适而迟迟不交付，就把下一次产出限定在一个能完成的小范围。
    advice:
      - 建议以是否容易使用衡量改进，并留出完成后的休息；若只顾追求舒适而迟迟不交付，就把下一次产出限定在一个能完成的小范围。
    do:
      - 小步实践
    dont:
      - 急于定论
  en:
    title: 'Shí shén: in everyday connection'
    summary: 'Shí shén: in everyday connection'
    body:
      You may prefer expression that develops through practice. Shí shén — an output component with
      the day stem’s polarity — symbolizes a steady use of skills and attention to everyday
      experience. The useful question concerns what you can produce repeatedly, rather than how
      comfortable or prosperous life should be. For relationships, the component is used as an
      interaction prompt rather than a gendered partner role. This output theme concerns work that
      can be used and repeated without constant reinvention. If you are good at explaining a
      process, turn a question you answer often into a one-page guide. Ask someone to follow it and
      notice where they need help. Try measuring the revision by ease of use rather than by how much
      extra detail you can add. A familiar skill becomes a resource when it reaches another person
      in a usable form. Leave time to recover after producing it. If comfort keeps delaying
      delivery, reduce the scope to one complete example instead of waiting to feel ready for a
      larger undertaking.
    advice:
      - Try measuring the revision by ease of use rather than by how much extra detail you can add.
    do:
      - Test gradually
    dont:
      - Rush conclusions
