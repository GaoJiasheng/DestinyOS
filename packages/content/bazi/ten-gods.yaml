  zh:
    title: 偏印：透出
    summary: 偏印：透出
    body: 你容易从不同路径寻找解释，愿意保留独立思考。偏印（生日干且同阴阳的成分）象征较独立的学习与支持，盘中出现它时，适合观察你如何吸收非标准信息，不表示某种特殊天赋，也不要求你与别人保持距离。透出（成分出现在年、月或时的天干）让这个主题在表达层面更容易被观察，但仍要结合整盘和实际情境看。这里依据的是可见天干，不把它等同于工作表现已经得到认可。偏印侧重不同路径的理解，不等于只凭直觉就能判断。比如你用一种冷门方法学习新工具，可以先把关键假设写下，再用常见案例核对它是否适用。建议找一位熟悉实际用途的人讨论结果，保留独立探索，也让信息接受检验；若资料越读越多而难以行动，就选一个能实践的小问题，不必先把所有解释统一。
    advice:
      - 建议找一位熟悉实际用途的人讨论结果，保留独立探索，也让信息接受检验；若资料越读越多而难以行动，就选一个能实践的小问题，不必先把所有解释统一。
    do:
      - 小步实践
    dont:
      - 急于定论
  en:
    title: 'Piān yìn: visible in a stem'
    summary: 'Piān yìn: visible in a stem'
    body: You may learn through an unusual route or a personally chosen question. Piān yìn — a
      supporting component sharing the day stem’s polarity — emphasizes independent understanding.
      This does not establish a special talent or require distance from other people; it asks how
      you check ideas developed outside familiar instructions. The trigger is a visible year, month,
      or hour stem. An independent learning route still needs a way to check what it explains. If
      you use an unfamiliar method to learn a tool, write down its main assumption and test it on an
      ordinary example. Ask someone who uses the tool in practice where the method helps and where
      it leaves a gap. You can keep exploring without treating novelty as proof of accuracy.
      Consider selecting one question that can be answered through use rather than collecting
      another set of theories. If preparation keeps expanding, a small completed exercise can show
      which information you need next. Support here may arrive through a different approach to
      learning, not through withdrawing from other people.
    advice:
      - Consider selecting one question that can be answered through use rather than collecting
        another set of theories.
    do:
      - Test gradually
    dont:
      - Rush conclusions
