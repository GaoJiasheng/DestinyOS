- id: bazi.ten_gods.zheng_cai.visible
  system: bazi
  section: pattern_career
  topic: ten_gods.zheng_cai.pattern_career
  when:
    any:
      - path: pillars.year.tenGod
        eq: zheng_cai
      - path: pillars.month.tenGod
        eq: zheng_cai
      - path: pillars.hour.tenGod
