  zh:
    title: 食神：透出
    summary: 食神：透出
    body: 你倾向于通过熟悉技能和稳定产出来表达自己。食神（日干所生且同阴阳的成分）象征顺畅输出与生活体验，盘中出现这一成分时，更适合观察技能如何被持续使用，而不是推断享受或收入的多少。透出（成分出现在年、月或时的天干）让这个主题在表达层面更容易被观察，但仍要结合整盘和实际情境看。这里依据的是可见天干，不把它等同于工作表现已经得到认可。食神的重点是把日主所生的力量转成能持续使用的产出。比如你擅长讲解，可以把反复回答的问题整理成一页说明，邀请读者按步骤试一次，而不是每次都临场从头解释。建议以是否容易使用衡量改进，并留出完成后的休息；若只顾追求舒适而迟迟不交付，就把下一次产出限定在一个能完成的小范围。
    advice:
      - 建议以是否容易使用衡量改进，并留出完成后的休息；若只顾追求舒适而迟迟不交付，就把下一次产出限定在一个能完成的小范围。
    do:
      - 小步实践
    dont:
      - 急于定论
  en:
    title: 'Shí shén: visible in a stem'
    summary: 'Shí shén: visible in a stem'
    body:
      You may prefer expression that develops through practice. Shí shén — an output component with
      the day stem’s polarity — symbolizes a steady use of skills and attention to everyday
      experience. The useful question concerns what you can produce repeatedly, rather than how
      comfortable or prosperous life should be. The trigger is a visible year, month, or hour stem.
      This output theme concerns work that can be used and repeated without constant reinvention. If
      you are good at explaining a process, turn a question you answer often into a one-page guide.
      Ask someone to follow it and notice where they need help. Try measuring the revision by ease
      of use rather than by how much extra detail you can add. A familiar skill becomes a resource
      when it reaches another person in a usable form. Leave time to recover after producing it. If
      comfort keeps delaying delivery, reduce the scope to one complete example instead of waiting
      to feel ready for a larger undertaking.
    advice:
      - Try measuring the revision by ease of use rather than by how much extra detail you can add.
    do:
      - Test gradually
    dont:
      - Rush conclusions
  meta:
    author: t23-editorial-v1
    reviewed_by: null
    version: 2
    status: published
