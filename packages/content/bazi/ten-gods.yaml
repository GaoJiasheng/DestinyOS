- id: bazi.ten_gods.jie_cai.visible
  system: bazi
  section: pattern_career
  topic: ten_gods.jie_cai.pattern_career
  when:
    any:
      - path: pillars.year.tenGod
        eq: jie_cai
      - path: pillars.month.tenGod
        eq: jie_cai
      - path: pillars.hour.tenGod
        eq: jie_cai
  weight: 68
  polarity: neutral
  tags:
    - plain
    - career
    - ten_god.jie_cai
  exclusive_with: []
  zh:
    title: 劫财：透出
    summary: 劫财：透出
    body: 你往往对共同参与和资源分配较敏感。劫财（与日干同类但阴阳不同的成分）关注同伴与资源边界，名字并不描述现实损失。盘中出现它时，观察重点是如何共同参与而保持约定清楚。透出（成分出现在年、月或时的天干）让这个主题在表达层面更容易被观察，但仍要结合整盘和实际情境看。这里依据的是可见天干，不把它等同于工作表现已经得到认可。劫财关注同伴参与下的资源边界，并不是他人会夺走东西。比如朋友邀你合办活动，热情回应后仍需确认各自投入的时间、费用与决定权；不要因为关系亲近就省略约定。建议先列一份双方都能接受的分工，临时增加的开销要重新商量，让合作有退出与交接的办法。
    advice:
      - 建议先列一份双方都能接受的分工，临时增加的开销要重新商量，让合作有退出与交接的办法。
    do:
      - 小步实践
    dont:
      - 急于定论
  en:
    title: 'Jié cái: visible in a stem'
    summary: 'Jié cái: visible in a stem'
    body: You may notice how shared effort and shared resources are distributed. Jié cái — the day
      stem’s element with opposite polarity — concerns peers and boundaries. Its traditional name is
      not an account of a financial loss; a practical reading asks what participants have actually
      agreed to share. The trigger is a visible year, month, or hour stem. Exposure (tòu chū —
      appearing in a visible stem) makes a symbolic theme more explicit in this model, but it is not
      proof that others recognize it in your work. Shared resources need explicit boundaries even
      when you trust the people involved. If friends invite you to organize an event, separate
      enthusiasm for joining from agreement on expenses, time and decision making. A close
      connection does not answer those practical questions. Consider recording each person’s
      contribution and asking again before adding an expense. You can also agree how to hand over an
      unfinished task if someone becomes unavailable. This makes competition over scarce time easier
      to discuss without casting a friend as an opponent. The marker invites attention to
      coordination; it does not establish that someone will take something from you.
    advice:
      - Consider recording each person’s contribution and asking again before adding an expense.
    do:
      - Test gradually
    dont:
      - Rush conclusions
  meta:
    author: t23-editorial-v1
    reviewed_by: null
    version: 2
    status: published
