- id: bazi.ten_gods.bi_jian.visible
  system: bazi
  section: pattern_career
  topic: ten_gods.bi_jian.pattern_career
  when:
    any:
      - path: pillars.year.tenGod
        eq: bi_jian
      - path: pillars.month.tenGod
        eq: bi_jian
      - path: pillars.hour.tenGod
        eq: bi_jian
  weight: 68
  polarity: neutral
  tags:
    - plain
    - career
    - ten_god.bi_jian
  exclusive_with: []
  zh:
    title: 比肩：透出
    summary: 比肩：透出
    body: 你容易留意自主空间与平等分工。比肩（与日干同类且同阴阳的成分）象征同行与自我立场，盘中出现这一成分时，更适合观察你如何在共同目标里保留自己的方法。透出（成分出现在年、月或时的天干）让这个主题在表达层面更容易被观察，但仍要结合整盘和实际情境看。这里依据的是可见天干，不把它等同于工作表现已经得到认可。同类支持的重点是共同承担，而不是所有事都自己决定。比如同事与你采用不同方法完成同一任务，可以各做一份样稿，再按同一个验收标准比较；你保留自主方法，也让同伴有发言权。建议把最终标准和各自职责写清楚，遇到重复劳动时先协商分工，不用争谁更像负责人。
    advice:
      - 建议把最终标准和各自职责写清楚，遇到重复劳动时先协商分工，不用争谁更像负责人。
    do:
      - 小步实践
    dont:
      - 急于定论
  en:
    title: 'Bǐ jiān: visible in a stem'
    summary: 'Bǐ jiān: visible in a stem'
    body:
      You may value room to contribute on equal terms. Bǐ jiān — a component sharing the day stem’s
      element and polarity — symbolizes peers and personal initiative. Its presence invites
      attention to how you cooperate while retaining a workable degree of independence. The trigger
      is a visible year, month, or hour stem. Exposure (tòu chū — appearing in a visible stem) makes
      a symbolic theme more explicit in this model, but it is not proof that others recognize it in
      your work. Peer support works through shared effort, not through having every decision go your
      way. Suppose a colleague uses a different method to complete the same task. Compare two
      samples against one agreed standard before defending your own approach. You can preserve
      independence while sharing responsibility. Try writing down who owns each deliverable and who
      checks the result. If you are both correcting the same item, agree on a handover instead of
      repeating the work. The useful question is whether the presence of another capable person
      gives you room to act or creates a contest over the method.
    advice:
      - Try writing down who owns each deliverable and who checks the result.
    do:
      - Test gradually
    dont:
      - Rush conclusions
  meta:
    author: t23-editorial-v1
    reviewed_by: null
    version: 2
    status: published
