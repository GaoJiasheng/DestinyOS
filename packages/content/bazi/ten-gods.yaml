  zh:
    title: 正官：透出
    summary: 正官：透出
    body: 你倾向于先理解规则，再决定怎样承担责任。正官（克日干且阴阳不同的成分）关注秩序与可见标准，盘中出现它时，适合观察角色是否明确、反馈是否公允，不由此推断职位、地位或他人对你的评价。透出（成分出现在年、月或时的天干）让这个主题在表达层面更容易被观察，但仍要结合整盘和实际情境看。这里依据的是可见天干，不把它等同于工作表现已经得到认可。正官关注规则与责任的边界，重点是标准是否明确。比如接受新职责时，可以问清验收方式、决定权限与需要请示的事项，不把“负责”理解为替所有人兜底。建议把模糊的要求改写成可核对的交付条件，发现标准变化时重新确认；有秩序不等于只能遵守旧做法，合理调整也可以在清楚的程序中进行。
    advice:
      - 建议把模糊的要求改写成可核对的交付条件，发现标准变化时重新确认；有秩序不等于只能遵守旧做法，合理调整也可以在清楚的程序中进行。
    do:
      - 小步实践
    dont:
      - 急于定论
  en:
    title: 'Zhèng guān: visible in a stem'
    summary: 'Zhèng guān: visible in a stem'
    body:
      You may feel more comfortable when expectations are explicit. Zhèng guān — a component that
      checks the day stem with opposite polarity — emphasizes roles and standards. Its presence asks
      how responsibility is defined and reviewed, not which title you will hold or how others will
      judge your standing. The trigger is a visible year, month, or hour stem. Clear standards make
      responsibility easier to carry. Before accepting a new role, ask how the result will be
      reviewed, which decisions you may make and which need agreement from someone else. Being
      responsible does not mean becoming the fallback for every unfinished task. Consider converting
      a broad request into a deliverable with a named reviewer and a date. If the standard changes
      halfway through, confirm the new scope instead of quietly adding it to your workload. Respect
      for a procedure can coexist with proposing improvements through that procedure. This marker
      directs attention to accountability; it does not establish a position of authority or predict
      recognition.
    advice:
      - Consider converting a broad request into a deliverable with a named reviewer and a date.
    do:
      - Test gradually
    dont:
      - Rush conclusions
