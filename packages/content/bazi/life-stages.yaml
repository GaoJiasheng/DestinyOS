  en:
    title: 'Jué: A metaphor for transition'
    summary: 'Jué: A metaphor for transition'
    body: You can notice which small trial is available when an old method ends. Jué — the transition metaphor within the twelve traditional life-stage labels — is recorded for the day stem’s relationship with the day branch. These labels do not measure age or health and do not forecast an event. A week with uneven demands can begin with identifying fixed responsibilities and reserving one flexible interval. Use what you actually complete to assess the plan. You can avoid filling the entire week simply because one morning felt easy. Consider revising the schedule when conditions change. Balance is an ongoing adjustment between demands and available support, not a requirement to sustain the same pace regardless of interruptions or unexpected work. Consider testing the metaphor through an ordinary choice rather than reading the stage name literally.
