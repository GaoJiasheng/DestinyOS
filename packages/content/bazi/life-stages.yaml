  zh:
    title: 沐浴：试探的比喻
    summary: 沐浴：试探的比喻
    body: 你可以留意尝试新环境时哪些条件让你自在。沐浴（十二长生中用来比喻试探阶段的标签）在这里是日干与日支配对得到的位置。十二长生（十二种传统阶段比喻）不描述实际年龄或身体状态，名称也不能用来推断事件；它只给日常习惯增加一个观察角度。例如你正在整理积累很久的资料，可以先围绕一个实际问题筛选内容，把暂时用不到的部分归档。建议用一段短说明检验自己是否理解了要点，再决定要不要继续收集；积累与输出可以交替进行，不需要把准备阶段无限延长。
    advice:
      - 把阶段名称改成一个日常观察问题。
    do:
      - 小步实践
    dont:
      - 急于定论
  en:
    title: 'Mù yù: A metaphor for exploration'
    summary: 'Mù yù: A metaphor for exploration'
    body: You can notice which conditions help you explore a new setting. Mù yù — the exploration metaphor within the twelve traditional life-stage labels — is recorded for the day stem’s relationship with the day branch. These labels do not measure age or health and do not forecast an event. A collection of material becomes easier to use when you begin with a real question. Select what addresses it and archive the rest for later. You can test your understanding by writing a short explanation before gathering more. Consider alternating preparation with a small output. Additional information has value when it answers a remaining question, but continuing to collect without using anything can hide which part you already understand well enough to act on. Consider testing the metaphor through an ordinary choice rather than reading the stage name literally.
    advice:
      - Use the stage as a question about an ordinary habit.
    do:
      - Test gradually
    dont:
      - Rush conclusions
  meta:
    author: t23-editorial-v1
    reviewed_by: null
    version: 1
    status: published
- id: bazi.life_stage.guan_dai
  system: bazi
  section: day_master
  topic: life_stage
