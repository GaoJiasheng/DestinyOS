  zh:
    title: 胎：酝酿的比喻
    summary: 胎：酝酿的比喻
    body: 你可以留意尚未成熟的想法需要哪些实际条件。胎（十二长生中用来比喻酝酿阶段的标签）在这里是日干与日支配对得到的位置。十二长生（十二种传统阶段比喻）不描述实际年龄或身体状态，名称也不能用来推断事件；它只给日常习惯增加一个观察角度。比如一件事情同时有推进和暂停的理由，你可以列出当前证据，选一个能在短时间内带来新信息的试验。建议事先写下继续与停止的条件，让决定有可回看的依据；面对不确定时保持适度行动，也可以成为认识自身节奏的方法。
    advice:
      - 把阶段名称改成一个日常观察问题。
