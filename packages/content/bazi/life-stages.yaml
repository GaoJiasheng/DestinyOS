    title: 墓：储备的比喻
    summary: 墓：储备的比喻
    body: 你可以留意积累的经验是否整理成可用资料。墓（十二长生中用来比喻储备阶段的标签）在这里是日干与日支配对得到的位置。十二长生（十二种传统阶段比喻）不描述实际年龄或身体状态，名称也不能用来推断事件；它只给日常习惯增加一个观察角度。比如你要挑选一件日常工具，可以先写出三个实际需求，再比较少量选项，避免把所有细节都纳入排名。建议给比较过程设一个时间范围，选好后用真实体验检验；辨别力可以用来缩短决策，不需要让选择不断延后。
    advice:
      - 把阶段名称改成一个日常观察问题。
    do:
      - 小步实践
    dont:
