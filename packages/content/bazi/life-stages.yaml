  en:
    title: 'Yǎng: A metaphor for maintenance'
    summary: 'Yǎng: A metaphor for maintenance'
    body: You can notice how ongoing maintenance can become a shared practice. Yǎng — the maintenance metaphor within the twelve traditional life-stage labels — is recorded for the day stem’s relationship with the day branch. These labels do not measure age or health and do not forecast an event. A friend may ask you to review an explanation. Before editing, check who will read it and which action the reader needs to understand. You can then focus on the two or three details that affect that action most. Consider setting a revision limit and a finishing time. Careful attention becomes more useful when it improves the message without consuming the whole evening in changes that readers barely notice. Consider testing the metaphor through an ordinary choice rather than reading the stage name literally.
