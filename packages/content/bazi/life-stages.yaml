  zh:
    title: 临官：承担的比喻
    summary: 临官：承担的比喻
    body: 你可以留意责任范围与可用条件是否匹配。临官（十二长生中用来比喻承担阶段的标签）在这里是日干与日支配对得到的位置。十二长生（十二种传统阶段比喻）不描述实际年龄或身体状态，名称也不能用来推断事件；它只给日常习惯增加一个观察角度。例如你发现共用物品总被放错位置，可以先了解大家取用的路线，再提出容易执行的收纳方式，而不是只要求别人遵守自己的习惯。建议试行一周后询问使用体验，让维护规则贴近日常，也让照料成为共同参与的事。
    advice:
      - 把阶段名称改成一个日常观察问题。
    do:
      - 小步实践
    dont:
      - 急于定论
  en:
    title: 'Lín guān: A metaphor for taking a role'
    summary: 'Lín guān: A metaphor for taking a role'
    body: You can notice whether responsibility matches available conditions. Lín guān — the taking a role metaphor within the twelve traditional life-stage labels — is recorded for the day stem’s relationship with the day branch. These labels do not measure age or health and do not forecast an event. If shared items are repeatedly misplaced, the useful starting point may be how people actually use them. You could watch the usual sequence and suggest a storage arrangement that reduces effort. Consider a one-week trial followed by a short conversation about what worked. Maintenance then becomes a shared practical decision rather than a demand that others adopt your habits. The best system is often the one people can comfortably keep using. Consider testing the metaphor through an ordinary choice rather than reading the stage name literally.
    advice:
      - Use the stage as a question about an ordinary habit.
    do:
      - Test gradually
    dont:
      - Rush conclusions
