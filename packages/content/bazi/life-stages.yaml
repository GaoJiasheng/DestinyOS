    summary: 绝：转换的比喻
    body: 你可以留意旧方法结束后有哪些小步可试。绝（十二长生中用来比喻转换阶段的标签）在这里是日干与日支配对得到的位置。十二长生（十二种传统阶段比喻）不描述实际年龄或身体状态，名称也不能用来推断事件；它只给日常习惯增加一个观察角度。例如忙闲起伏较大的周，你可以在周初确认固定责任，再留一块可调整的时间处理临时请求。建议用实际完成量检验安排，不因某一天轻松就把整周排满；节奏的平衡是持续调整的过程，可以随着条件变化重新分配。
    advice:
      - 把阶段名称改成一个日常观察问题。
    do:
