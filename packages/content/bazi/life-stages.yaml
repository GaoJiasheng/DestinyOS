  zh:
    title: 衰：调整的比喻
    summary: 衰：调整的比喻
    body: 你可以留意已有习惯是否仍适合变化后的环境。衰（十二长生中用来比喻调整阶段的标签）在这里是日干与日支配对得到的位置。十二长生（十二种传统阶段比喻）不描述实际年龄或身体状态，名称也不能用来推断事件；它只给日常习惯增加一个观察角度。例如团队期待你带动进度，你可以先确认可用人手与大家的理解，再把目标分成共同认可的阶段。建议在每个阶段请一位协作者反馈负担是否合适，让主动推进与照顾节奏并行，避免把自己熟悉的速度变成他人的隐形要求。
    advice:
      - 把阶段名称改成一个日常观察问题。
    do:
      - 小步实践
    dont:
      - 急于定论
  en:
    title: 'Shuāi: A metaphor for adjustment'
    summary: 'Shuāi: A metaphor for adjustment'
    body: You can notice whether an established habit still fits changed conditions. Shuāi — the adjustment metaphor within the twelve traditional life-stage labels — is recorded for the day stem’s relationship with the day branch. These labels do not measure age or health and do not forecast an event. A team asking you to maintain momentum also needs an achievable shared pace. Check available help and whether everyone understands the aim before dividing it into stages. You can invite a colleague to comment on the workload at each stage. Consider adjusting the pace when the response reveals a constraint you missed. Initiative works better when people can participate knowingly, rather than discovering that your familiar speed has become an unspoken requirement. Consider testing the metaphor through an ordinary choice rather than reading the stage name literally.
    advice:
      - Use the stage as a question about an ordinary habit.
    do:
      - Test gradually
    dont:
