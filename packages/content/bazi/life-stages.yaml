  exclusive_with: []
  zh:
    title: 帝旺：发挥的比喻
    summary: 帝旺：发挥的比喻
    body: 你可以留意熟悉事务里的投入方向是否清楚。帝旺（十二长生中用来比喻发挥阶段的标签）在这里是日干与日支配对得到的位置。十二长生（十二种传统阶段比喻）不描述实际年龄或身体状态，名称也不能用来推断事件；它只给日常习惯增加一个观察角度。比如朋友向你征求建议，你可能很快想到多种方案，可以先询问对方最在意的限制，再只分享两条与情境相关的选择。建议确认对方需要建议还是倾听，把丰富联想收束到当前问题，让信息流动帮助理解，而不是使谈话增加更多待决定事项。
    advice:
      - 把阶段名称改成一个日常观察问题。
    do:
      - 小步实践
    dont:
      - 急于定论
  en:
    title: 'Dì wàng: A metaphor for using capacity'
    summary: 'Dì wàng: A metaphor for using capacity'
    body: You can notice whether effort in familiar tasks has a clear direction. Dì wàng — the using capacity metaphor within the twelve traditional life-stage labels — is recorded for the day stem’s relationship with the day branch. These labels do not measure age or health and do not forecast an event. A friend asking for help may need a listening ear rather than a long list of options. Check the main constraint and whether advice is welcome before sharing possibilities. You can offer two relevant choices and pause for their response. Try keeping the conversation close to the question they actually brought. Connecting ideas is valuable when it increases understanding, but a widening range of suggestions can also create more decisions than someone wanted to make. Consider testing the metaphor through an ordinary choice rather than reading the stage name literally.
    advice:
      - Use the stage as a question about an ordinary habit.
    do:
      - Test gradually
    dont:
      - Rush conclusions
  meta:
    author: t23-editorial-v1
    reviewed_by: null
    version: 1
    status: published
