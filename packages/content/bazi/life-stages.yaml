      - 急于定论
  en:
    title: 'Tāi: A metaphor for forming an idea'
    summary: 'Tāi: A metaphor for forming an idea'
    body: You can notice which conditions an early idea would need. Tāi — the forming an idea metaphor within the twelve traditional life-stage labels — is recorded for the day stem’s relationship with the day branch. These labels do not measure age or health and do not forecast an event. A decision may have sensible reasons both to proceed and to pause. List the evidence available now and choose a brief trial that can supply new information. You can define conditions for continuing or stopping before the trial begins. Try keeping those criteria visible during the review. Moderate action in an uncertain situation can teach you about your preferred pace while preventing a temporary choice from quietly becoming an open-ended commitment. Consider testing the metaphor through an ordinary choice rather than reading the stage name literally.
    advice:
      - Use the stage as a question about an ordinary habit.
    do:
      - Test gradually
    dont:
      - Rush conclusions
