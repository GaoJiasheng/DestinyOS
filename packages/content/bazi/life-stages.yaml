    title: 死：暂停的比喻
    summary: 死：暂停的比喻
    body: 你可以留意暂停之后怎样选择新的起点。死（十二长生中用来比喻暂停阶段的标签）在这里是日干与日支配对得到的位置。十二长生（十二种传统阶段比喻）不描述实际年龄或身体状态，名称也不能用来推断事件；它只给日常习惯增加一个观察角度。例如多人共用一个日程表，你可以先列出固定事项，再把临时需求留在可调整区域，减少反复重排。建议明确哪些决定由谁负责，别因为自己擅长整理就默认接下全部管理任务；可靠的安排也应当包含可交接的边界。
    advice:
      - 把阶段名称改成一个日常观察问题。
    do:
      - 小步实践
    dont:
      - 急于定论
  en:
    title: 'Sǐ: A metaphor for pausing'
    summary: 'Sǐ: A metaphor for pausing'
    body: You can notice how to choose a useful starting point after a pause. Sǐ — the pausing metaphor within the twelve traditional life-stage labels — is recorded for the day stem’s relationship with the day branch. These labels do not measure age or health and do not forecast an event. A shared calendar can provide structure without making you responsible for every change. Separate fixed commitments from flexible ones and agree who updates each part. You can offer a clear format while distributing the actual maintenance. Consider preparing a simple handover note so that the arrangement still works when you are away. Reliability is more sustainable when it comes from agreed roles rather than one person remembering everything. Consider testing the metaphor through an ordinary choice rather than reading the stage name literally.
