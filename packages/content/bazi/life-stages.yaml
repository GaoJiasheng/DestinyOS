    title: 病：检视的比喻
    summary: 病：检视的比喻
    body: 你可以留意反复费力的环节是否需要简化。病（十二长生中用来比喻检视阶段的标签）在这里是日干与日支配对得到的位置。十二长生（十二种传统阶段比喻）不描述实际年龄或身体状态，名称也不能用来推断事件；它只给日常习惯增加一个观察角度。比如你准备学习一个跨度较大的技能，可以把最终目标拆成能在两周内完成的练习，并找一位熟悉该领域的人校对起点。建议先验证练习方法是否合适，再延长计划；进度慢时也可以缩小任务，而不是把停顿解释成个人失败。
    advice:
      - 把阶段名称改成一个日常观察问题。
