  zh:
    title: 当前大运：比肩与身强
    summary: 当前大运：比肩与身强
    body: 你容易留意自主空间与平等分工。比肩（与日干同类且同阴阳的成分）象征同行与自我立场，盘中出现这一成分时，更适合观察你如何在共同目标里保留自己的方法。当前大运（按十年排列的阶段主题）天干采用这个成分，可以借它检查较长期的安排，不推测阶段内一定发生什么。身强（扶助相对较多的评分分类）在这里提醒你检验投入方向，不等于可无限增加任务。比如你想分享刚完成的作品，可以先选一个小范围展示，问观众哪些信息最清楚、哪里仍有疑问，再决定下一次公开表达的重点。建议把反馈写成可修改的事项，不把赞许或沉默当作全部评价，给持续投入留出稳定节奏。
    advice:
      - 设置一次阶段复盘，用现实变化调整下一步。
    do:
      - 小步实践
    dont:
      - 急于定论
  en:
    title: 'Current cycle: Bǐ jiān, supported'
    summary: 'Current cycle: Bǐ jiān, supported'
    body: You may value room to contribute on equal terms. Bǐ jiān — a component sharing the day stem’s element and polarity — symbolizes peers and personal initiative. Its presence invites attention to how you cooperate while retaining a workable degree of independence. The current decade cycle (dà yùn — a ten-year symbolic interval) uses this component in its stem. It supplies a longer review theme, not a prediction of what must occur during the interval. A strong classification (shēn qiáng — greater chart support) asks how effort is directed, not how many tasks you should accept. Sharing a new piece of work can begin with a small audience. Ask which part was clear and where people still had questions, then use the answers to shape the next presentation. You can turn feedback into specific edits rather than a general verdict about the work or its maker. Try keeping a steady sharing rhythm that leaves room for preparation and rest, instead of relying entirely on immediate audience response.
    advice:
      - Schedule a review and adjust using real changes.
    do:
      - Test gradually
    dont:
      - Rush conclusions
