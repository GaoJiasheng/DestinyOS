    body: 你往往愿意用清楚的安排维持可持续的投入。正财（日干所克且阴阳不同的成分）象征稳定资源与日常管理，盘中出现它时，观察重点是记录、边界和持续性，不把这个名称理解为收入稳定的承诺。当前流年（按立春年排列的年度主题）天干采用这个成分，可以借它设置本年度的复盘问题，不把符号当成事件预告。身强（扶助相对较多的评分分类）在这里提醒你检验投入方向，不等于可无限增加任务。正财侧重可持续管理，重点是日常投入能否被看清。比如整理共同生活的开销，可以先区分固定支出与可调整支出，再约定谁负责记录、何时一起核对。建议用实际收支检查安排，不把节省变成对自己或伴侣的苛刻要求；把备用时间和休息也视为需要照顾的资源，让秩序服务生活，而非要求每件事都按同一尺度进行。
    advice:
      - 建议用实际收支检查安排，不把节省变成对自己或伴侣的苛刻要求；把备用时间和休息也视为需要照顾的资源，让秩序服务生活，而非要求每件事都按同一尺度进行。
    do:
      - 小步实践
    dont:
      - 急于定论
  en:
    title: 'Current year: Zhèng cái, supported'
    summary: 'Current year: Zhèng cái, supported'
    body: You may appreciate continuity and a clear record of commitments. Zhèng cái — a
      resource-management component with opposite polarity to the day stem — concerns everyday
      planning. The label does not promise stable earnings; it invites a look at how small
      obligations are recorded, maintained, and reviewed over time. The current annual marker (liú
      nián — a year theme using the spring-term boundary) uses this component. Regular resource
      management depends on making ordinary commitments visible. When organizing shared household
      expenses, distinguish recurring costs from choices that can be adjusted. Agree who keeps the
      record and when you will review it together. You can discuss the arrangement using actual
      figures rather than assuming that a careful person should remember everything. Consider
      including time and rest in the resource review as well. A routine that reduces uncertainty is
      useful; one that turns every small choice into an argument needs room to change. This theme
      concerns consistent stewardship, while the presence of the marker by itself says nothing about
      the size or stability of your income.
