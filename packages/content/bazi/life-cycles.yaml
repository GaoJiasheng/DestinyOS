- id: bazi.decade.shang_guan.strong
  system: bazi
  section: luck_timeline
  topic: decade
  when:
    all:
      - path: luck.periods[isCurrent=true].tenGod
        eq: shang_guan
      - path: strength.level
        eq: strong
  weight: 78
  polarity: neutral
  tags:
    - plain
    - career
    - ten_god.shang_guan
  exclusive_with: []
  zh:
    title: 当前大运：伤官与身强
    summary: 当前大运：伤官与身强
    body: 你容易发现旧方法的不足，并希望表达新的做法。伤官（日干所生且阴阳不同的成分）侧重表达与质疑，名称不代表现实冲突。盘中出现它时，可以观察你怎样把批评变成可检验的改进，而不是把不同意见理解为个人对立。当前大运（按十年排列的阶段主题）天干采用这个成分，可以借它检查较长期的安排，不推测阶段内一定发生什么。身强（扶助相对较多的评分分类）在这里提醒你检验投入方向，不等于可无限增加任务。伤官把输出与质疑联系起来，重点是改进能否被别人理解。比如你发现规定的流程有重复步骤，可以记录它多用了多少时间，再提出一个保留必要检查的替代方案。建议先承认规则要解决的问题，再用样稿说明哪里可以改；表达锋利时容易让对方只听见否定，可以把批评落在步骤上，给合作留出口。
    advice:
      - 建议先承认规则要解决的问题，再用样稿说明哪里可以改；表达锋利时容易让对方只听见否定，可以把批评落在步骤上，给合作留出口。
    do:
      - 小步实践
    dont:
      - 急于定论
  en:
    title: 'Current cycle: Shāng guān, supported'
    summary: 'Current cycle: Shāng guān, supported'
    body:
      You may notice where an established method could be improved. Shāng guān — an output component
      of opposite polarity to the day stem — emphasizes expression and questioning. The label does
      not establish a conflict. A useful focus is whether a critique identifies a workable change
      and leaves others able to respond. Questioning a method is more useful when you can show a
      workable replacement. Suppose an established process repeats the same check twice. Record the
      extra time it takes and demonstrate an alternative that still meets the underlying
      requirement. You can acknowledge the purpose of a rule while challenging how it is applied.
      Consider presenting a sample rather than starting with a verdict about the people who designed
      the process. If the exchange becomes defensive, return to the duplicated step and the evidence
      you have collected. This preserves the expressive side of the theme without making opposition
      itself the goal.
    advice:
      - Consider presenting a sample rather than starting with a verdict about the people who
        designed the process.
    do:
      - Test gradually
    dont:
      - Rush conclusions
  meta:
    author: t23-editorial-v1
    reviewed_by: null
    version: 2
    status: published
