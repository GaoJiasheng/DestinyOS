  zh:
    title: 当前大运：偏印与身强
    summary: 当前大运：偏印与身强
    body: 你容易从不同路径寻找解释，愿意保留独立思考。偏印（生日干且同阴阳的成分）象征较独立的学习与支持，盘中出现它时，适合观察你如何吸收非标准信息，不表示某种特殊天赋，也不要求你与别人保持距离。当前大运（按十年排列的阶段主题）天干采用这个成分，可以借它检查较长期的安排，不推测阶段内一定发生什么。身强（扶助相对较多的评分分类）在这里提醒你检验投入方向，不等于可无限增加任务。偏印侧重不同路径的理解，不等于只凭直觉就能判断。比如你用一种冷门方法学习新工具，可以先把关键假设写下，再用常见案例核对它是否适用。建议找一位熟悉实际用途的人讨论结果，保留独立探索，也让信息接受检验；若资料越读越多而难以行动，就选一个能实践的小问题，不必先把所有解释统一。
    advice:
      - 建议找一位熟悉实际用途的人讨论结果，保留独立探索，也让信息接受检验；若资料越读越多而难以行动，就选一个能实践的小问题，不必先把所有解释统一。
