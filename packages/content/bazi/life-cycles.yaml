- id: bazi.decade.qi_sha.strong
  system: bazi
  section: luck_timeline
  topic: decade
  when:
    all:
      - path: luck.periods[isCurrent=true].tenGod
        eq: qi_sha
      - path: strength.level
        eq: strong
  weight: 78
  polarity: neutral
  tags:
    - plain
    - career
    - ten_god.qi_sha
  exclusive_with: []
  zh:
    title: 当前大运：七杀与身强
    summary: 当前大运：七杀与身强
    body: 你容易留意期限、竞争或需要迅速处理的要求。七杀（克日干且同阴阳的成分）象征外部压力与应对，名字不描述危险事件。盘中出现它时，更适合观察任务如何形成挑战，以及你是否有足够条件作出回应。当前大运（按十年排列的阶段主题）天干采用这个成分，可以借它检查较长期的安排，不推测阶段内一定发生什么。身强（扶助相对较多的评分分类）在这里提醒你检验投入方向，不等于可无限增加任务。七杀侧重外部挑战如何被承接，压力不等于危险。比如接到期限紧的任务，可以先划出必须完成的部分，确认谁能支援，再决定是否缩小交付范围。建议把可用时间与所需步骤同时写给对方，必要时商量延期或分阶段完成；果断体现在先处理关键障碍，不需要靠独自加班来证明自己能应付。
    advice:
      - 建议把可用时间与所需步骤同时写给对方，必要时商量延期或分阶段完成；果断体现在先处理关键障碍，不需要靠独自加班来证明自己能应付。
    do:
      - 小步实践
    dont:
      - 急于定论
  en:
    title: 'Current cycle: Qī shā, supported'
    summary: 'Current cycle: Qī shā, supported'
    body: You may be attentive to demanding deadlines or external expectations. Qī shā — a component
      that checks the day stem and shares its polarity — symbolizes challenge and response. The
      dramatic traditional name does not predict danger. The relevant question is whether a
      demanding task comes with enough support and a clear scope. A demanding deadline calls for a
      clear response to pressure, not for accepting every requirement unchanged. If a task arrives
      with little preparation time, separate the essential deliverable from optional refinements.
      Ask who can supply the missing information and which decisions require approval. Try showing
      the requester the steps and time actually needed. You may be able to negotiate a smaller first
      delivery or distribute the work. Decisiveness can mean identifying the main obstacle quickly
      rather than working alone until the task is finished. The Seven Killings label is a
      traditional name for a controlling relationship; it does not describe a dangerous event.
    advice:
      - Try showing the requester the steps and time actually needed.
    do:
      - Test gradually
    dont:
      - Rush conclusions
  meta:
    author: t23-editorial-v1
    reviewed_by: null
    version: 2
    status: published
