- id: bazi.decade.jie_cai.strong
  system: bazi
  section: luck_timeline
  topic: decade
  when:
    all:
      - path: luck.periods[isCurrent=true].tenGod
        eq: jie_cai
      - path: strength.level
        eq: strong
  weight: 78
  polarity: neutral
  tags:
    - plain
    - career
    - ten_god.jie_cai
  exclusive_with: []
  zh:
    title: 当前大运：劫财与身强
    summary: 当前大运：劫财与身强
    body: 你往往对共同参与和资源分配较敏感。劫财（与日干同类但阴阳不同的成分）关注同伴与资源边界，名字并不描述现实损失。盘中出现它时，观察重点是如何共同参与而保持约定清楚。当前大运（按十年排列的阶段主题）天干采用这个成分，可以借它检查较长期的安排，不推测阶段内一定发生什么。身强（扶助相对较多的评分分类）在这里提醒你检验投入方向，不等于可无限增加任务。劫财关注同伴参与下的资源边界，并不是他人会夺走东西。比如朋友邀你合办活动，热情回应后仍需确认各自投入的时间、费用与决定权；不要因为关系亲近就省略约定。建议先列一份双方都能接受的分工，临时增加的开销要重新商量，让合作有退出与交接的办法。
    advice:
      - 建议先列一份双方都能接受的分工，临时增加的开销要重新商量，让合作有退出与交接的办法。
    do:
      - 小步实践
    dont:
      - 急于定论
  en:
    title: 'Current cycle: Jié cái, supported'
    summary: 'Current cycle: Jié cái, supported'
    body: You may notice how shared effort and shared resources are distributed. Jié cái — the day
      stem’s element with opposite polarity — concerns peers and boundaries. Its traditional name is
      not an account of a financial loss; a practical reading asks what participants have actually
      agreed to share. The current decade cycle (dà yùn — a ten-year symbolic interval) uses this
      component in its stem. It supplies a longer review theme, not a prediction of what must occur
      during the interval. A strong classification (shēn qiáng — greater chart support) asks how
      effort is directed, not how many tasks you should accept. Shared resources need explicit
      boundaries even when you trust the people involved. If friends invite you to organize an
      event, separate enthusiasm for joining from agreement on expenses, time and decision making. A
      close connection does not answer those practical questions. Consider recording each person’s
      contribution and asking again before adding an expense. You can also agree how to hand over an
      unfinished task if someone becomes unavailable. This makes competition over scarce time easier
      to discuss without casting a friend as an opponent. The marker invites attention to
      coordination; it does not establish that someone will take something from you.
    advice:
      - Consider recording each person’s contribution and asking again before adding an expense.
    do:
      - Test gradually
    dont:
      - Rush conclusions
  meta:
    author: t23-editorial-v1
    reviewed_by: null
    version: 2
    status: published
