- id: bazi.decade.jie_cai.strong
  system: bazi
  section: luck_timeline
  topic: decade
  when:
    all:
      - path: luck.periods[isCurrent=true].tenGod
        eq: jie_cai
      - path: strength.level
        eq: strong
  weight: 78
  polarity: neutral
  tags:
    - plain
    - career
    - ten_god.jie_cai
  exclusive_with: []
  zh:
    title: 当前大运：劫财与身强
    summary: 当前大运：劫财与身强
    body: 你往往对共同参与和资源分配较敏感。劫财（与日干同类但阴阳不同的成分）关注同伴与资源边界，名字并不描述现实损失。盘中出现它时，观察重点是如何共同参与而保持约定清楚。当前大运（按十年排列的阶段主题）天干采用这个成分，可以借它检查较长期的安排，不推测阶段内一定发生什么。身强（扶助相对较多的评分分类）在这里提醒你检验投入方向，不等于可无限增加任务。例如多人共用一个日程表，你可以先列出固定事项，再把临时需求留在可调整区域，减少反复重排。建议明确哪些决定由谁负责，别因为自己擅长整理就默认接下全部管理任务；可靠的安排也应当包含可交接的边界。
    advice:
      - 设置一次阶段复盘，用现实变化调整下一步。
    do:
      - 小步实践
    dont:
      - 急于定论
  en:
    title: 'Current cycle: Jié cái, supported'
    summary: 'Current cycle: Jié cái, supported'
    body: You may notice how shared effort and shared resources are distributed. Jié cái — the day stem’s element with opposite polarity — concerns peers and boundaries. Its traditional name is not an account of a financial loss; a practical reading asks what participants have actually agreed to share. The current decade cycle (dà yùn — a ten-year symbolic interval) uses this component in its stem. It supplies a longer review theme, not a prediction of what must occur during the interval. A strong classification (shēn qiáng — greater chart support) asks how effort is directed, not how many tasks you should accept. A shared calendar can provide structure without making you responsible for every change. Separate fixed commitments from flexible ones and agree who updates each part. You can offer a clear format while distributing the actual maintenance. Consider preparing a simple handover note so that the arrangement still works when you are away. Reliability is more sustainable when it comes from agreed roles rather than one person remembering everything.
    advice:
      - Schedule a review and adjust using real changes.
    do:
      - Test gradually
    dont:
      - Rush conclusions
  meta:
    author: t23-editorial-v1
    reviewed_by: null
    version: 1
    status: published
