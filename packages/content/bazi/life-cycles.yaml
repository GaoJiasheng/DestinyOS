- id: bazi.decade.zheng_guan.strong
  system: bazi
  section: luck_timeline
  topic: decade
  when:
    all:
      - path: luck.periods[isCurrent=true].tenGod
        eq: zheng_guan
      - path: strength.level
        eq: strong
  weight: 78
  polarity: neutral
  tags:
    - plain
    - career
    - ten_god.zheng_guan
  exclusive_with: []
  zh:
    title: 当前大运：正官与身强
    summary: 当前大运：正官与身强
    body: 你倾向于先理解规则，再决定怎样承担责任。正官（克日干且阴阳不同的成分）关注秩序与可见标准，盘中出现它时，适合观察角色是否明确、反馈是否公允，不由此推断职位、地位或他人对你的评价。当前大运（按十年排列的阶段主题）天干采用这个成分，可以借它检查较长期的安排，不推测阶段内一定发生什么。身强（扶助相对较多的评分分类）在这里提醒你检验投入方向，不等于可无限增加任务。正官关注规则与责任的边界，重点是标准是否明确。比如接受新职责时，可以问清验收方式、决定权限与需要请示的事项，不把“负责”理解为替所有人兜底。建议把模糊的要求改写成可核对的交付条件，发现标准变化时重新确认；有秩序不等于只能遵守旧做法，合理调整也可以在清楚的程序中进行。
    advice:
      - 建议把模糊的要求改写成可核对的交付条件，发现标准变化时重新确认；有秩序不等于只能遵守旧做法，合理调整也可以在清楚的程序中进行。
    do:
      - 小步实践
    dont:
      - 急于定论
  en:
    title: 'Current cycle: Zhèng guān, supported'
    summary: 'Current cycle: Zhèng guān, supported'
    body:
      You may feel more comfortable when expectations are explicit. Zhèng guān — a component that
      checks the day stem with opposite polarity — emphasizes roles and standards. Its presence asks
      how responsibility is defined and reviewed, not which title you will hold or how others will
      judge your standing. The current decade cycle (dà yùn — a ten-year symbolic interval) uses
      this component in its stem. Clear standards make responsibility easier to carry. Before
      accepting a new role, ask how the result will be reviewed, which decisions you may make and
      which need agreement from someone else. Being responsible does not mean becoming the fallback
      for every unfinished task. Consider converting a broad request into a deliverable with a named
      reviewer and a date. If the standard changes halfway through, confirm the new scope instead of
      quietly adding it to your workload. Respect for a procedure can coexist with proposing
      improvements through that procedure. This marker directs attention to accountability; it does
      not establish a position of authority or predict recognition.
    advice:
      - Consider converting a broad request into a deliverable with a named reviewer and a date.
    do:
      - Test gradually
    dont:
      - Rush conclusions
  meta:
    author: t23-editorial-v1
    reviewed_by: null
    version: 2
    status: published
