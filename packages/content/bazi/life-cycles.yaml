    summary: 'Current year: Jié cái, less supported'
    body: You may notice how shared effort and shared resources are distributed. Jié cái — the day
      stem’s element with opposite polarity — concerns peers and boundaries. Its traditional name is
      not an account of a financial loss; a practical reading asks what participants have actually
      agreed to share. The current annual marker (liú nián — a year theme using the spring-term
      boundary) uses this component. It supplies a review question for the year, not a forecast of
      an event. A weak classification (shēn ruò — less chart support) asks which support is
      available, not how capable you are. Shared resources need explicit boundaries even when you
      trust the people involved. If friends invite you to organize an event, separate enthusiasm for
      joining from agreement on expenses, time and decision making. A close connection does not
      answer those practical questions. Consider recording each person’s contribution and asking
      again before adding an expense. You can also agree how to hand over an unfinished task if
      someone becomes unavailable. This makes competition over scarce time easier to discuss without
      casting a friend as an opponent. The marker invites attention to coordination; it does not
      establish that someone will take something from you.
    advice:
      - Consider recording each person’s contribution and asking again before adding an expense.
    do:
      - Test gradually
    dont:
      - Rush conclusions
