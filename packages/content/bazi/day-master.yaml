    author: t23-editorial-v1
    reviewed_by: null
    version: 1
    status: published
- id: bazi.day_master.yi
  system: bazi
  section: day_master
  topic: day_master
  when:
    path: dayMaster.stem
    eq: yi
  weight: 72
  polarity: neutral
  tags:
    - plain
    - day_master
    - element.wood
  exclusive_with: []
  zh:
    title: 乙木：观察你的推进方式
    summary: 乙木：观察你的推进方式
    body: 你往往能察觉环境变化，并寻找柔韧的推进方式。乙木（日主的一种象征，像攀援生长的藤蔓）强调适应与连接，你的日干以此为标记，所以观察重点是如何借助环境，不是评价你是否缺少主见。性格隐喻只是认识习惯的一种角度，你的经验与环境仍要一起看。比如你在两种兴趣之间犹豫，可以分别安排一次轻量体验，比较投入后是否愿意继续，而不是先决定长期身份。建议写下体验差异与下一步条件，让选择保留弹性；暂时没有明显偏好时，也可以以当前资源最方便的一项作为起点。
    advice:
      - 记录一次具体反应，再选择一个可调整的习惯。
    do:
      - 小步实践
    dont:
      - 急于定论
  en:
    title: 'Yi Wood: Observe your working rhythm'
    summary: 'Yi Wood: Observe your working rhythm'
    body: You may notice a workable opening where a direct approach stalls. Yi Wood (yǐ mù — the climbing plant metaphor for your day stem) points toward adaptation and connection. In a shared household, you might find a workable routine by listening to several preferences before suggesting an arrangement. A character metaphor is one perspective on habits; your experience and setting still matter. Choosing between interests need not begin with a permanent identity. Arrange one modest experience in each and compare whether you want to continue afterward. You can note what differed and what the next step would require. Try using current access and available time as a starting criterion if no strong preference emerges. A reversible choice can produce useful information while preserving room for a different direction later.
    advice:
      - Notice one response and name the need behind it.
    do:
      - Test gradually
    dont:
      - Rush conclusions
  meta:
    author: t23-editorial-v1
    reviewed_by: null
    version: 1
    status: published
