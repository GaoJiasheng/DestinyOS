- id: bazi.day_master.wu_stem
  system: bazi
  section: day_master
  topic: day_master
  when:
    path: dayMaster.stem
    eq: wu_stem
  weight: 72
  polarity: neutral
  tags:
    - plain
    - day_master
    - element.earth
  exclusive_with: []
  zh:
    title: 戊土：观察你的推进方式
    summary: 戊土：观察你的推进方式
    body: 你往往愿意建立可靠的框架，让事情有序落地。戊土（日主的一种象征，像承托地形的山体）侧重稳定与边界，你的日干属于这一类，因此这里观察的是承载方式，不把承担更多视作你的义务。性格隐喻只是认识习惯的一种角度，你的经验与环境仍要一起看。比如你想分享刚完成的作品，可以先选一个小范围展示，问观众哪些信息最清楚、哪里仍有疑问，再决定下一次公开表达的重点。建议把反馈写成可修改的事项，不把赞许或沉默当作全部评价，给持续投入留出稳定节奏。
    advice:
      - 记录一次具体反应，再选择一个可调整的习惯。
    do:
      - 小步实践
    dont:
      - 急于定论
  en:
    title: 'Wu Earth: Observe your working rhythm'
    summary: 'Wu Earth: Observe your working rhythm'
    body: You may feel comfortable providing a structure that others can use. Wu Earth (wù tǔ — the mountain metaphor for your day stem) emphasizes steadiness and boundaries. Organizing a shared timetable could suit this tendency, provided the responsibility is agreed rather than quietly becoming yours by default. A character metaphor is one perspective on habits; your experience and setting still matter. Sharing a new piece of work can begin with a small audience. Ask which part was clear and where people still had questions, then use the answers to shape the next presentation. You can turn feedback into specific edits rather than a general verdict about the work or its maker. Try keeping a steady sharing rhythm that leaves room for preparation and rest, instead of relying entirely on immediate audience response.
    advice:
      - Notice one response and name the need behind it.
    do:
      - Test gradually
    dont:
      - Rush conclusions
  meta:
    author: t23-editorial-v1
    reviewed_by: null
    version: 1
    status: published
