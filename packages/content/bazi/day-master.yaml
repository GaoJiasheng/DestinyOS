- id: bazi.day_master.jia
  system: bazi
  section: day_master
  topic: day_master
  when:
    path: dayMaster.stem
    eq: jia
  weight: 72
  polarity: neutral
  tags:
    - plain
    - day_master
    - element.wood
  exclusive_with: []
  zh:
    title: 甲木：观察你的推进方式
    summary: 甲木：观察你的推进方式
    body: 你倾向于先确定方向，再沿着清楚的目标持续推进。甲木（日主的一种象征，像向上生长的树干）侧重原则与长程发展，你的日干采用这一标记，所以这里更关注目标感，而不是把你描绘成永远坚定的人。性格隐喻只是认识习惯的一种角度，你的经验与环境仍要一起看。比如你正在为搬家做准备，可以把必须先完成的事项列成短清单，并给依赖他人的环节预留缓冲时间。建议每天只确认一个关键节点，把可推迟的小事移到后面；稳妥来自清楚的优先级，不需要靠不断增加检查来获得安心。
    advice:
      - 记录一次具体反应，再选择一个可调整的习惯。
    do:
      - 小步实践
    dont:
      - 急于定论
  en:
    title: 'Jia Wood: Observe your working rhythm'
    summary: 'Jia Wood: Observe your working rhythm'
    body: You may prefer a clear purpose before investing effort. Jia Wood (jiǎ mù — the upright tree metaphor for your day stem) emphasizes direction and continuity; your recorded day stem supplies the basis for this reading. A volunteer project, for instance, may feel easier once you understand who it serves. A character metaphor is one perspective on habits; your experience and setting still matter. Preparing for a move can expose the difference between useful structure and endless checking. List the necessary first steps and allow extra time for anything that depends on another person. Try reviewing one key milestone each day while postponing minor choices that do not affect it. A reliable plan needs priorities and room for delays. More checks do not always add useful information, especially when they interrupt the work itself.
    advice:
      - Notice one response and name the need behind it.
    do:
      - Test gradually
    dont:
      - Rush conclusions
  meta:
    author: t23-editorial-v1
    reviewed_by: null
    version: 1
    status: published
