  zh:
    title: 甲木：先认识一个习惯
    summary: 甲木：先认识一个习惯
    body: 你倾向于先确定方向，再沿着清楚的目标持续推进。甲木（日主的一种象征，像向上生长的树干）侧重原则与长程发展，你的日干采用这一标记，所以这里更关注目标感，而不是把你描绘成永远坚定的人。例如你可以回看最近一次顺利完成的小事，辨认自己用了哪些习惯。建议先保留一个有帮助的做法，再结合实际资源调整节奏，不用一次经历概括全部生活。
    advice:
      - 回看一件顺利完成的小事，辨认有用习惯。
    do:
      - 小步实践
    dont:
      - 急于定论
  en:
    title: 'Jia Wood: Begin with a familiar habit'
    summary: 'Jia Wood: Begin with a familiar habit'
    body: You may prefer a clear purpose before investing effort. Jia Wood (jiǎ mù — the upright tree metaphor for your day stem) emphasizes direction and continuity; your recorded day stem supplies the basis for this reading. A volunteer project, for instance, may feel easier once you understand who it serves. The Day Master (rì zhǔ — the stem used to represent you) is only one part of the chart, so the wider distribution and your real circumstances still matter. For a first reflection, you can recall a recent task that went smoothly and notice which choice helped it move forward. Consider repeating one useful habit on a modest scale, then checking the result. This overview offers a starting question rather than a complete personality assessment; keep room for new information and for situations in which you respond differently.
    advice:
      - Recall a successful task and identify one useful choice.
    do:
      - Test gradually
    dont:
      - Rush conclusions
