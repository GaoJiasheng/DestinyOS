    title: 冬季储备
    summary: 冬季储备
    body: 你可以把准备与休息安排成容易持续的小步骤。调候（按出生月份讨论寒暖的辅助观察）在这里作为季节主题，不代替整盘的平衡分析。冬季月份在传统里偏重储备意象，这里只提醒你观察准备与实际行动是否相称；是否需要火的季节修正，应以盘中已有标记为准。比如你总在忙碌之后责备自己没有按理想时间休息，可以先看有哪些现实限制，再选择一个最容易改变的环节。建议让计划适合当下条件，不用苛刻标准评价自己；本章不诊断身体或情绪，若有持续不适，请咨询合格医疗人士。
    advice:
      - 根据实际精力安排休整，持续不适咨询专业人士。
    do:
      - 小步实践
    dont:
      - 急于定论
  en:
    title: Winter preparation
    summary: Winter preparation
    body: You can use this seasonal theme to review the rhythm of a routine. Tiáo hòu — the traditional consideration of seasonal warmth and coolness — is an auxiliary prompt, not a substitute for the full distribution. The winter-month branches supply a reserve metaphor. Notice how preparation relates to action. Any Fire correction must come from the chart’s own seasonal flag, not simply from the name of the season.  If rest does not happen at the time you hoped, begin with the practical constraint rather than self-criticism. Identify one part of the evening that is easiest to change under current conditions. You can make the plan more workable without demanding an ideal schedule. Try checking the adjustment after several days. This discussion does not diagnose physical or emotional conditions; persistent discomfort calls for advice from a qualified healthcare professional.
    advice:
      - Adjust rest to actual conditions and seek qualified help for persistent discomfort.
    do:
      - Test gradually
    dont:
      - Rush conclusions
