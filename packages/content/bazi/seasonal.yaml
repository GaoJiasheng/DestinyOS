  zh:
    title: 秋季收束
    summary: 秋季收束
    body: 你可以在整理成果时，删去已经没有用途的要求。调候（按出生月份讨论寒暖的辅助观察）在这里作为季节主题，不代替整盘的平衡分析。秋季月份在传统里偏重收束意象，这里只提供复盘和整理的提醒，不把季节描述当作身体状况或职业变化的判断。例如你每天为琐事反复奔忙，可以把常用物品放在方便取用的位置，减少不必要的寻找，给日常维护设一个结束时间。建议观察安排简化后是否更轻松，再决定要保留哪些步骤；这些只是生活习惯提示，持续不适请咨询合格医疗人士。
    advice:
      - 根据实际精力安排休整，持续不适咨询专业人士。
    do:
      - 小步实践
    dont:
      - 急于定论
  en:
    title: Autumn completion
    summary: Autumn completion
    body: You can use this seasonal theme to review the rhythm of a routine. Tiáo hòu — the traditional consideration of seasonal warmth and coolness — is an auxiliary prompt, not a substitute for the full distribution. The autumn-month branches supply a completion metaphor. A review can identify which requirements still serve a purpose; the seasonal label does not establish a health condition or a change in employment.  Repeated small errands can make an ordinary day feel crowded. You could place frequently used items within easy reach and give routine tidying a finishing time. Consider noticing whether the simpler arrangement makes the day easier before adding another rule. Everyday organization is the subject here, not a conclusion about any body system. Your actual experience should guide the adjustment, and persistent discomfort should be discussed with a qualified healthcare professional.
    advice:
      - Adjust rest to actual conditions and seek qualified help for persistent discomfort.
    do:
      - Test gradually
    dont:
      - Rush conclusions
