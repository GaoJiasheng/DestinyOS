  zh:
    title: 夏季留白
    summary: 夏季留白
    body: 你可以在安排活跃活动时，给休整保留清楚的位置。调候（按出生月份讨论寒暖的辅助观察）在这里作为季节主题，不代替整盘的平衡分析。夏季月份在传统里偏重热与外展意象，这里只提醒你观察忙闲安排；是否需要水的季节修正，应以盘中已有标记为准。比如你想增加户外活动，可以先选一个自己感觉舒适的时段与轻量安排，观察天气和实际精力，再决定是否重复。建议用体验而不是象征比例确定节奏，不强迫自己一次改变太多；本章不作医疗判断，持续不适应当咨询合格医疗人士。
    advice:
      - 根据实际精力安排休整，持续不适咨询专业人士。
    do:
      - 小步实践
    dont:
      - 急于定论
  en:
    title: Summer pauses
    summary: Summer pauses
    body: You can use this seasonal theme to review the rhythm of a routine. Tiáo hòu — the traditional consideration of seasonal warmth and coolness — is an auxiliary prompt, not a substitute for the full distribution. The summer-month branches supply a metaphor of warmth and outward activity. This prompts a review of pace, not a health conclusion. Any Water correction must come from the chart’s own seasonal flag.  A little outdoor time can begin with a comfortable period and a modest plan. Check the weather and how you actually feel rather than using an elemental percentage to choose the intensity. You can repeat the arrangement if it fits and adapt it if it does not. Try changing one part at a time. This is routine reflection, not a medical assessment; persistent or concerning discomfort deserves attention from a qualified healthcare professional.
    advice:
      - Adjust rest to actual conditions and seek qualified help for persistent discomfort.
    do:
      - Test gradually
    dont:
      - Rush conclusions
