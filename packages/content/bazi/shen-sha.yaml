  zh:
    title: 国印：明确职责
    summary: 国印：明确职责
    body: 你可以留意任务授权与责任范围是否一致。国印（传统查表所得、用于补充观察的标记）在你的盘中被记录，所以这里提供一个对应的提问。传统把这一标记与职责和凭据联系起来，命中不预告职位变化，清楚的角色约定比名称更有实际作用。例如忙闲起伏较大的周，你可以在周初确认固定责任，再留一块可调整的时间处理临时请求。建议用实际完成量检验安排，不因某一天轻松就把整周排满；节奏的平衡是持续调整的过程，可以随着条件变化重新分配。
    advice:
      - 把标记改成一个观察问题，用实际经历检验。
    do:
      - 小步实践
    dont:
      - 急于定论
  en:
    title: 'Guó yìn: clarifying responsibility'
    summary: 'Guó yìn: clarifying responsibility'
    body: Guó yìn — a supplementary table-based marker — appears in your chart. You can check whether responsibility comes with the authority to carry it out. The traditional association is roles and credentials, not a future promotion. A clear agreement about scope matters more than the label. A week with uneven demands can begin with identifying fixed responsibilities and reserving one flexible interval. Use what you actually complete to assess the plan. You can avoid filling the entire week simply because one morning felt easy. Consider revising the schedule when conditions change. Balance is an ongoing adjustment between demands and available support, not a requirement to sustain the same pace regardless of interruptions or unexpected work. Consider using its recorded pillar as a reference for reflection rather than treating the marker as an independent conclusion.
    advice:
      - Turn the marker into a question and check an actual example.
    do:
      - Test gradually
    dont:
      - Rush conclusions
  meta:
    author: t23-editorial-v1
    reviewed_by: null
    version: 1
    status: published
