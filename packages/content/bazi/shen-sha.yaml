  zh:
    title: 天乙贵人：获得协助
    summary: 天乙贵人：获得协助
    body: 你可以留意遇到问题时，是否愿意提出清楚的求助。天乙贵人（传统查表所得、用于补充观察的标记）在你的盘中被记录，所以这里提供一个对应的提问。传统把这一标记与协助联系起来，命中只说明查表得到相应位置，不能据此认定某个人会提供帮助。比如刚进入陌生社群，你可以先参与一个有明确分工的活动，观察哪些交流方式让你舒服，再逐渐增加投入。建议为自己保留独处或休息的间隔，既寻找连接，也尊重适应速度；不用一次聊天是否顺利评价自己的社交能力。
    advice:
      - 把标记改成一个观察问题，用实际经历检验。
    do:
      - 小步实践
    dont:
      - 急于定论
  en:
    title: 'Tiān yǐ guì rén: accessing help'
    summary: 'Tiān yǐ guì rén: accessing help'
    body: Tiān yǐ guì rén — a supplementary table-based marker — appears in your chart. You can reflect on how you ask for help. Traditionally this marker is associated with assistance, but a table-based hit cannot establish that any person will offer it. Joining an unfamiliar community does not require immediate closeness with everyone. You might begin with a practical role at one event and notice which conversations feel comfortable. Try increasing participation gradually while keeping time to recover. An awkward exchange can reflect unfamiliar expectations rather than a fixed social trait. Adaptation is easier to sustain when you can participate at a pace that fits your actual energy. Consider using its recorded pillar as a reference for reflection rather than treating the marker as an independent conclusion.
    advice:
      - Turn the marker into a question and check an actual example.
    do:
      - Test gradually
    dont:
      - Rush conclusions
  meta:
    author: t23-editorial-v1
    reviewed_by: null
    version: 1
    status: published
