  zh:
    title: 太极贵人：深入理解
    summary: 太极贵人：深入理解
    body: 你可以把对原理的兴趣转成一个明确的学习问题。太极贵人（传统查表所得、用于补充观察的标记）在你的盘中被记录，所以这里提供一个对应的提问。传统把这一标记与思考及理解联系起来，命中不表示特殊身份；它适合提醒你核对解释的依据。例如你发现共用物品总被放错位置，可以先了解大家取用的路线，再提出容易执行的收纳方式，而不是只要求别人遵守自己的习惯。建议试行一周后询问使用体验，让维护规则贴近日常，也让照料成为共同参与的事。
    advice:
      - 把标记改成一个观察问题，用实际经历检验。
    do:
      - 小步实践
    dont:
      - 急于定论
  en:
    title: 'Tài jí guì rén: examining a question'
    summary: 'Tài jí guì rén: examining a question'
    body: Tài jí guì rén — a supplementary table-based marker — appears in your chart. You may find a useful question beneath a familiar explanation. This marker traditionally concerns reflection and understanding, not a special status. You can test a proposed explanation against its actual evidence. If shared items are repeatedly misplaced, the useful starting point may be how people actually use them. You could watch the usual sequence and suggest a storage arrangement that reduces effort. Consider a one-week trial followed by a short conversation about what worked. Maintenance then becomes a shared practical decision rather than a demand that others adopt your habits. The best system is often the one people can comfortably keep using. Consider using its recorded pillar as a reference for reflection rather than treating the marker as an independent conclusion.
    advice:
      - Turn the marker into a question and check an actual example.
    do:
      - Test gradually
    dont:
      - Rush conclusions
