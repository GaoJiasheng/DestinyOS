    dont:
      - 急于定论
  en:
    title: 'Huá gài: space for concentration'
    summary: 'Huá gài: space for concentration'
    body: Huá gài — a supplementary table-based marker — appears in your chart. You can make room for independent attention without closing the door to conversation. This marker traditionally concerns concentration and personal interests. It does not establish social distance; a quiet practice and supportive connections can coexist. A friend may ask you to review an explanation. Before editing, check who will read it and which action the reader needs to understand. You can then focus on the two or three details that affect that action most. Consider setting a revision limit and a finishing time. Careful attention becomes more useful when it improves the message without consuming the whole evening in changes that readers barely notice. Consider using its recorded pillar as a reference for reflection rather than treating the marker as an independent conclusion.
    advice:
      - Turn the marker into a question and check an actual example.
    do:
      - Test gradually
    dont:
