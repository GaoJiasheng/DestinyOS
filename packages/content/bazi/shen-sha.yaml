  zh:
    title: 天德贵人：善意协调
    summary: 天德贵人：善意协调
    body: 你可以在分歧中寻找有边界的善意回应。天德贵人（传统查表所得、用于补充观察的标记）在你的盘中被记录，所以这里提供一个对应的提问。传统把这一标记与缓和联系起来，查表命中不表示困难会自行消失，实际协调仍需要双方参与。比如朋友向你征求建议，你可能很快想到多种方案，可以先询问对方最在意的限制，再只分享两条与情境相关的选择。建议确认对方需要建议还是倾听，把丰富联想收束到当前问题，让信息流动帮助理解，而不是使谈话增加更多待决定事项。
    advice:
      - 把标记改成一个观察问题，用实际经历检验。
    do:
      - 小步实践
    dont:
      - 急于定论
  en:
    title: 'Tiān dé guì rén: considerate coordination'
    summary: 'Tiān dé guì rén: considerate coordination'
    body: Tiān dé guì rén — a supplementary table-based marker — appears in your chart. You can look for a considerate response that still preserves boundaries. The traditional association is moderation, but a marker does not resolve a difficulty on its own; practical coordination requires willing participants. A friend asking for help may need a listening ear rather than a long list of options. Check the main constraint and whether advice is welcome before sharing possibilities. You can offer two relevant choices and pause for their response. Try keeping the conversation close to the question they actually brought. Connecting ideas is valuable when it increases understanding, but a widening range of suggestions can also create more decisions than someone wanted to make. Consider using its recorded pillar as a reference for reflection rather than treating the marker as an independent conclusion.
    advice:
      - Turn the marker into a question and check an actual example.
    do:
      - Test gradually
    dont:
      - Rush conclusions
