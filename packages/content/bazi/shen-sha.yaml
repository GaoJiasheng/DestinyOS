  zh:
    title: 月德贵人：日常互助
    summary: 月德贵人：日常互助
    body: 你可以通过可靠的小行动建立互相支持的日常。月德贵人（传统查表所得、用于补充观察的标记）在你的盘中被记录，所以这里提供一个对应的提问。传统把这一标记与温和互动联系起来，命中不说明人际环境已经理想，仍值得观察帮助是否双向。例如团队期待你带动进度，你可以先确认可用人手与大家的理解，再把目标分成共同认可的阶段。建议在每个阶段请一位协作者反馈负担是否合适，让主动推进与照顾节奏并行，避免把自己熟悉的速度变成他人的隐形要求。
    advice:
      - 把标记改成一个观察问题，用实际经历检验。
    do:
      - 小步实践
    dont:
      - 急于定论
  en:
    title: 'Yuè dé guì rén: ordinary mutual support'
    summary: 'Yuè dé guì rén: ordinary mutual support'
    body: Yuè dé guì rén — a supplementary table-based marker — appears in your chart. You can strengthen ordinary support through small, reliable actions. The traditional association is considerate interaction. A recorded hit does not establish an ideal social environment; notice whether assistance can flow in both directions. A team asking you to maintain momentum also needs an achievable shared pace. Check available help and whether everyone understands the aim before dividing it into stages. You can invite a colleague to comment on the workload at each stage. Consider adjusting the pace when the response reveals a constraint you missed. Initiative works better when people can participate knowingly, rather than discovering that your familiar speed has become an unspoken requirement. Consider using its recorded pillar as a reference for reflection rather than treating the marker as an independent conclusion.
