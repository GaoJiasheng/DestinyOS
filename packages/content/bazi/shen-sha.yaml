  zh:
    title: 华盖：专注空间
    summary: 华盖：专注空间
    body: 你可以给独立思考留时间，也保留交流的入口。华盖（传统查表所得、用于补充观察的标记）在你的盘中被记录，所以这里提供一个对应的提问。传统把这一标记与专注及个人兴趣联系起来，命中不表示与人疏离；安静空间与良好连接可以同时安排。例如朋友请你帮忙修改一份说明，你可以先确认读者是谁、最需要看懂哪一步，再集中处理两三个关键细节。建议约定修改范围与截止时间，让专注服务于实际用途，避免为了润色每句话而耗尽整晚的精力。
    advice:
      - 把标记改成一个观察问题，用实际经历检验。
