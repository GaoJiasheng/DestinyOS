    dont:
      - 急于定论
  en:
    title: 'Yì mǎ: adapting to movement'
    summary: 'Yì mǎ: adapting to movement'
    body: Yì mǎ — a supplementary table-based marker — appears in your chart. You can leave some flexibility for changes in place or routine. This marker traditionally concerns movement, but it does not require relocation or travel. An ordinary change in how a day is organized can supply a useful example. A decision may have sensible reasons both to proceed and to pause. List the evidence available now and choose a brief trial that can supply new information. You can define conditions for continuing or stopping before the trial begins. Try keeping those criteria visible during the review. Moderate action in an uncertain situation can teach you about your preferred pace while preventing a temporary choice from quietly becoming an open-ended commitment. Consider using its recorded pillar as a reference for reflection rather than treating the marker as an independent conclusion.
    advice:
      - Turn the marker into a question and check an actual example.
    do:
      - Test gradually
    dont:
      - Rush conclusions
