  zh:
    title: 文昌贵人：整理表达
    summary: 文昌贵人：整理表达
    body: 你可以把学习内容整理成别人看得懂的短说明。文昌贵人（传统查表所得、用于补充观察的标记）在你的盘中被记录，所以这里提供一个对应的提问。传统把这一标记与文字表达联系起来，查表结果不能衡量成绩或学历；清楚的表达需要练习与反馈。比如你准备学习一个跨度较大的技能，可以把最终目标拆成能在两周内完成的练习，并找一位熟悉该领域的人校对起点。建议先验证练习方法是否合适，再延长计划；进度慢时也可以缩小任务，而不是把停顿解释成个人失败。
    advice:
      - 把标记改成一个观察问题，用实际经历检验。
    do:
      - 小步实践
    dont:
      - 急于定论
  en:
    title: 'Wén chāng guì rén: organizing expression'
    summary: 'Wén chāng guì rén: organizing expression'
    body: Wén chāng guì rén — a supplementary table-based marker — appears in your chart. You can make learning more usable by writing a short explanation. This marker traditionally concerns written expression, not examination results or qualifications. Practice and reader feedback provide the information that the label cannot. A demanding skill can feel more approachable when the first milestone is visible. You might choose a two-week practice task and ask an experienced learner whether it is a sensible starting point. Try checking the method before extending the schedule. A slower week may call for a smaller exercise, not a broad conclusion about your capacity. Progress becomes easier to assess when each attempt has a clear purpose. Consider using its recorded pillar as a reference for reflection rather than treating the marker as an independent conclusion.
    advice:
      - Turn the marker into a question and check an actual example.
    do:
      - Test gradually
    dont:
      - Rush conclusions
  meta:
    author: t23-editorial-v1
    reviewed_by: null
    version: 1
    status: published
