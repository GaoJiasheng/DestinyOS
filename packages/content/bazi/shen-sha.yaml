  zh:
    title: 学堂：持续学习
    summary: 学堂：持续学习
    body: 你可以给学习建立一个容易重复的小步骤。学堂（传统查表所得、用于补充观察的标记）在你的盘中被记录，所以这里提供一个对应的提问。传统把这一标记与学习场景联系起来，命中不表示学业结果确定，也不限定适合你的教育路径。例如多人共用一个日程表，你可以先列出固定事项，再把临时需求留在可调整区域，减少反复重排。建议明确哪些决定由谁负责，别因为自己擅长整理就默认接下全部管理任务；可靠的安排也应当包含可交接的边界。你可以从一次具体经历检验这个角度，再决定是否把它放进自己的行动计划；传统描述提供的是观察线索，不替代对现实条件的判断。
    advice:
      - 把标记改成一个观察问题，用实际经历检验。
    do:
      - 小步实践
    dont:
      - 急于定论
  en:
    title: 'Xué táng: sustained learning'
    summary: 'Xué táng: sustained learning'
    body: Xué táng — a supplementary table-based marker — appears in your chart. You can create a repeatable starting point for learning. The traditional association is a learning setting, not a predicted academic result or a prescribed educational route. A manageable routine helps you gather real experience. A shared calendar can provide structure without making you responsible for every change. Separate fixed commitments from flexible ones and agree who updates each part. You can offer a clear format while distributing the actual maintenance. Consider preparing a simple handover note so that the arrangement still works when you are away. Reliability is more sustainable when it comes from agreed roles rather than one person remembering everything. Consider using its recorded pillar as a reference for reflection rather than treating the marker as an independent conclusion.
    advice:
      - Turn the marker into a question and check an actual example.
    do:
      - Test gradually
    dont:
      - Rush conclusions
  meta:
    author: t23-editorial-v1
    reviewed_by: null
    version: 1
    status: published
