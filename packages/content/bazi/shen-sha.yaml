  zh:
    title: 词馆：精炼文字
    summary: 词馆：精炼文字
    body: 你可以练习把复杂想法讲得简短而准确。词馆（传统查表所得、用于补充观察的标记）在你的盘中被记录，所以这里提供一个对应的提问。传统把这一标记与文辞整理联系起来，查表命中不等同于写作天赋，它更适合作为检验读者理解的提醒。比如你要挑选一件日常工具，可以先写出三个实际需求，再比较少量选项，避免把所有细节都纳入排名。建议给比较过程设一个时间范围，选好后用真实体验检验；辨别力可以用来缩短决策，不需要让选择不断延后。
    advice:
      - 把标记改成一个观察问题，用实际经历检验。
    do:
      - 小步实践
    dont:
      - 急于定论
  en:
    title: 'Cí guǎn: refining language'
    summary: 'Cí guǎn: refining language'
    body: Cí guǎn — a supplementary table-based marker — appears in your chart. You can practise making a complex idea concise and accurate. This marker traditionally concerns language and expression. It does not certify writing talent; an actual reader’s understanding is a more useful test. Choosing an everyday tool can become easier with three practical requirements. Compare a few suitable options against those needs rather than ranking every possible feature. Try limiting the comparison time and evaluating the choice through actual use afterward. Discernment need not make a decision more elaborate. It can reduce distractions and help you identify what matters, while leaving room to change a minor preference once experience provides better information. Consider using its recorded pillar as a reference for reflection rather than treating the marker as an independent conclusion.
    advice:
      - Turn the marker into a question and check an actual example.
    do:
      - Test gradually
    dont:
      - Rush conclusions
