  zh:
    title: 驿马：适应变化
    summary: 驿马：适应变化
    body: 你可以为行程与环境变化保留可调整的安排。驿马（传统查表所得、用于补充观察的标记）在你的盘中被记录，所以这里提供一个对应的提问。传统把这一标记与移动联系起来，命中不意味着你需要迁居或远行，日常流程改变也可以成为观察场景。比如一件事情同时有推进和暂停的理由，你可以列出当前证据，选一个能在短时间内带来新信息的试验。建议事先写下继续与停止的条件，让决定有可回看的依据；面对不确定时保持适度行动，也可以成为认识自身节奏的方法。
    advice:
      - 把标记改成一个观察问题，用实际经历检验。
    do:
