    summary: 木：占比突出
    body: 你可以观察目标增加时，是否仍给调整留有余地。木（传统五类象征中偏向生长与展开的一类）在这里提供规划和伸展的比喻，不表示某个身体部位的实际状态。你的盘中这一项占比达到四成，说明在加权分布里相对突出，不能独自判断它是有益还是需要调整。五行（五类变化象征）需要整体比较，小幅调整也应先看实际环境与体验。例如忙闲起伏较大的周，你可以在周初确认固定责任，再留一块可调整的时间处理临时请求。建议用实际完成量检验安排，不因某一天轻松就把整周排满；节奏的平衡是持续调整的过程，可以随着条件变化重新分配。
    advice:
      - 先调整一个实际环境因素，再观察是否更顺手。
    do:
      - 小步实践
    dont:
      - 急于定论
  en:
    title: 'Wood: Prominent proportion'
    summary: 'Wood: Prominent proportion'
    body: Wood (mù — the growth and expansion category in the traditional five-element model) offers a planning metaphor. It does not describe the condition of any body part. You can reflect on whether new aims leave enough room to revise the route. Its weighted proportion reaches forty percent in this chart, making it prominent within the distribution. Prominence alone does not decide whether a symbolic theme is useful in a particular situation. The Five Elements (wǔ xíng — five symbolic modes) need whole-chart context; practical experience should guide any small adjustment. A week with uneven demands can begin with identifying fixed responsibilities and reserving one flexible interval. Use what you actually complete to assess the plan. You can avoid filling the entire week simply because one morning felt easy. Consider revising the schedule when conditions change. Balance is an ongoing adjustment between demands and available support, not a requirement to sustain the same pace regardless of interruptions or unexpected work.
    advice:
      - Change one practical detail before adding symbolic decoration.
    do:
      - Test gradually
    dont:
      - Rush conclusions
