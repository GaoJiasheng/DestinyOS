      你可以把北方列为可比较的候选方向。此宫在当前局中满足吉门与吉星条件，也没有规则所排除的空亡、门迫、入墓或击刑；仍要核对它与你想做的事是否相关。例如，附近北侧有一个适合短谈的公共空间时，可以比较交通和开放安排，不必为遵循方向而增加很长的路程。建议只在可行选项之间使用这一提示，并为改地点保留余量。吉方（符合此刻筛选规则的宫位方向）只对这张局有效，之后若问题或时刻不同，应重新核对，不自行推算到未来日期。你可以先问场地方是否需要提前准备。
    advice:
      - 先核对地点与交通条件。
    do:
      - 比较地点
    dont:
      - 刻意绕路
  en:
    title: 'Candidate Direction: North'
    summary: Compare a feasible option to the north.
    body: |-
      You can put a northern option on a practical shortlist. The engine selected this palace because its gate and star meet the supportive rule without the specified exclusion flags. A nearby northern venue may be worth comparing for a short conversation, but transport, opening times and the actual purpose of the meeting still come first. Consider using this cue only between feasible alternatives and keep room to change the venue. A favourable direction is a selected palace for this casting time, not a lasting property of a neighbourhood. Check the relevant indicator’s position before assuming the direction serves your specific question. New questions or later castings need their own assessment rather than a date extrapolated from this chart. Ask the venue which preparation is needed before confirming.
