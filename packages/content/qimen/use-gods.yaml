  zh:
    title: 开门：利用支持
    summary: 你可以先从已有支持着手做一个小尝试。
    body: |-
      你可以先从已有支持着手做一个小尝试。开门（工作与对外联系的入口）是这一条的用神，也就是与问题有关的观察指标。相关用神落宫的状态含吉门、吉星或支持格局，且没有本组牵制标记，提示这一环节有可利用的条件；它不表示整个问题都顺利。准备一份能快速阅读的个人经验说明，便于对方知道怎样回应你的请求。例如，你在寻找协作机会时，可以先确认接收方式，再送出一个有明确问题的简介。建议先利用一项现有条件，观察一次实际回应。
    advice:
      - 建议先利用一项现有条件，观察一次实际回应。
    do:
      - 小步尝试
    dont:
      - 扩大猜测
  en:
    title: 'Kāi Mén: Use Available Support'
    summary: You can test a small next step using the support already visible.
    body: |-
      You can test a small next step using the support already visible. Kāi Mén (开门, kāi mén — the opening gate used for work and outward contact) is the selected reference in this note. The selected indicator carries a helpful gate, star or configuration, without the constraint marks used by this reading. That gives you a local starting point rather than a promise about the whole question. A concise account of relevant experience can help a recipient see how to respond to your work enquiry. When approaching a collaborator, first identify the appropriate contact route and send an introduction with one specific question. Try using one available condition and reviewing the response. A follow-up can state what you need from the recipient and when you will review the reply, making the next contact easier to evaluate.
    advice:
      - Try using one available condition and reviewing the response.
    do:
      - Review a step
    dont:
      - Expand assumptions
