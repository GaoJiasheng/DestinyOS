  en:
    title: 'Gēng Gān: Use Available Support'
    summary: You can test a small next step using the support already visible.
    body: |-
      You can test a small next step using the support already visible. Gēng Gān (庚干, gēng gān — the Geng stem used to examine boundaries in a relationship question) is the selected reference in this note. The selected indicator carries a helpful gate, star or configuration, without the constraint marks used by this reading. That gives you a local starting point rather than a promise about the whole question. The symbol identifies neither a gender nor a fixed personality; use it to inspect expectations, boundaries and shared arrangements. For a conversation about responsibilities, state what you can take on and ask which parts need a different arrangement. Try using one available condition and reviewing the response. A boundary can name the particular task or time limit without making a judgment about the other person, leaving room for a workable alternative proposal.
    advice:
      - Try using one available condition and reviewing the response.
    do:
      - Review a step
