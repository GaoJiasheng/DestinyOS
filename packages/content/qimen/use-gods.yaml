    - zhi_shi
  exclusive_with:
    - qimen.use_gods.kai.support.a
  zh:
    title: 开门：利用支持
    summary: 你适合把可用条件转成一个容易回应的安排。
    body: |-
      你适合把可用条件转成一个容易回应的安排。开门（工作与对外联系的入口）是这一条的用神，也就是与问题有关的观察指标。这条指标的宫位具有支持性状态，当前未带此组阻滞条件。支持需要落实到时间、资料或协作，不能只停留在盘面名称上；下一步适合明确谁能接住你的准备。准备一份能快速阅读的个人经验说明，便于对方知道怎样回应你的请求。例如，你安排内部讨论时，可以先列需要谁决定的项目，把资料与责任人对应起来。你可以先确认承接对象，再决定是否扩大行动。
    advice:
      - 你可以先确认承接对象，再决定是否扩大行动。
    do:
      - 小步尝试
    dont:
      - 扩大猜测
  en:
    title: 'Kāi Mén: Use Available Support'
    summary: You may find it useful to turn available support into an answerable request.
    body: |-
      You may find it useful to turn available support into an answerable request. Kāi Mén (开门, kāi mén — the opening gate used for work and outward contact) is the selected reference in this note. Here the palace state offers a supportive working context without the specified obstruction marks. Put that context into a practical arrangement: clarify the material, the timing and the recipient, rather than relying on the label alone. A concise account of relevant experience can help a recipient see how to respond to your work enquiry. For an internal discussion, match each decision question to a responsible person so the material reaches someone able to use it. Consider identifying the recipient before increasing the scale. A follow-up can state what you need from the recipient and when you will review the reply, making the next contact easier to evaluate.
    advice:
      - Consider identifying the recipient before increasing the scale.
    do:
      - Review a step
    dont:
      - Expand assumptions
