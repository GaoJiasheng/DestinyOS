    - use_god
    - zhi_fu
    - zhi_shi
  exclusive_with:
    - qimen.use_gods.yi.constraint.a
  zh:
    title: 乙干：化解牵制
    summary: 你可以把受阻部分拆成一项能够核实的问题。
    body: |-
      你可以把受阻部分拆成一项能够核实的问题。乙干（关系与照顾主题中的细致联系符号）是这一条的用神，也就是与问题有关的观察指标。这一指标落宫有受限状态，但状态只是此刻的局部线索，不说明人物能力或事项最终结果。与其把多种名称加重成压力，不如明确哪一项资源、消息或安排仍需确认。它不按性别分配责任，也不能用来判断谁应该迁就谁，重点是你的沟通是否可被理解。例如，你调整生活节奏时，可以先询问直接相关的人怎样协作，让照顾成为明确的互相支持。建议缩小一次行动的范围，并给自己留调整空间。
    advice:
      - 建议缩小一次行动的范围，并给自己留调整空间。
    do:
      - 小步尝试
    dont:
      - 扩大猜测
  en:
    title: 'Yǐ Gān: Inspect a Constraint'
    summary: You can reduce the difficult part to one verifiable question.
    body: |-
      You can reduce the difficult part to one verifiable question. Yǐ Gān (乙干, yǐ gān — the Yi stem used for careful contact in relationship and care questions) is the selected reference in this note. A restrictive palace state suggests a question about conditions at this moment, not a fixed judgment of anyone’s capacity or the eventual result. Identify the resource, message or arrangement that still needs confirmation before repeating the earlier approach. It assigns no gendered responsibility and says nothing about who should yield; the useful question is whether contact is understandable. When changing a daily routine, ask those involved how cooperation could work so care becomes explicit support rather than an assumption. Consider a smaller reversible step with a clear review point. Invite an explicit response to the proposed arrangement, and allow the other person to suggest a different format if the initial request does not fit.
    advice:
      - Consider a smaller reversible step with a clear review point.
    do:
      - Review a step
    dont:
      - Expand assumptions
