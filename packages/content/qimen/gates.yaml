      You may need a clear request with equally clear limits. Shangmen (伤门, shāng mén — the gate associated with contest and assertive action) leads this chart. A deadline can tempt a team into personal criticism when the real problem is an unclear handoff. Stating the required task and feedback time gives directness a constructive purpose. Read the gate as a question about how you apply pressure, rather than a prediction of harm. Consider stating the task boundary before discussing a difficult deadline. The leading gate supplies a general action theme; your selected indicators still need their own palace context. Use this note to choose a manageable first step, then let the response determine whether you repeat, adjust or set aside that approach. Keep the scale proportionate to the actual question.
