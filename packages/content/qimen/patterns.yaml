    summary: 你可以把飞宫格当作核对安排的一条线索。
    body: |-
      你可以先核对外部条件如何承接本局起点。飞宫格（天盘旬首六仪加地盘庚的组合）与伏宫格的上下关系相反，读盘时要保留这一方向差别。例如，同一组干在不同层次出现时，可以写出谁在天盘、谁在地盘，再决定它对应哪个规则，避免把两个名称互换。此条的具体依据是地盘干（随盘层定位的天干）为庚，需在同一个宫满足条件。建议把上下层分别记录后再应用规则。应用这条线索时，可以只调整一次沟通或一个流程，记录它带来的变化。若相关用神并不在这个宫，先把此格局当作环境背景，避免用局部名称概括整件事情。
    advice:
      - 建议把上下层分别记录后再应用规则。
