  zh:
    title: 把复杂限制分成可处理项目
    summary: 你可以把天网四张当作核对安排的一条线索。
    body: |-
      你适合先把复杂限制分成可处理的项目。天网四张（癸加癸的牵制组合）在本宫提供重复收束的图像，名称不表示你被现实事件困住。例如，任务有很多前置条件时，可以按是否由自己控制分栏，先完成最容易核实的一项，让困难变成具体列表。此条的具体依据是天盘干（随盘层定位的天干）为癸、地盘干（随盘层定位的天干）为癸，需在同一个宫满足条件。不过，你可以通过拆分前置条件找到下一步。读到这里，你可以先问这个位置与自己当前问题的关联是什么，再决定要不要采用建议。检查资料与沟通步骤往往能提供更直接的信息，盘中的支持或阻力需要与这些信息一起理解。
    advice:
      - 不过，你可以通过拆分前置条件找到下一步。
    do:
      - 核对同宫
    dont:
      - 以名定论
  en:
    title: Separate a Dense Set of Constraints
    summary: Use tiān wǎng sì zhāng to check a local arrangement.
    body: |-
      You can turn a dense set of conditions into separate checks. Tian wang si zhang names sky Gui over earth Gui. The image is one of repeated containment, not proof that you are trapped by events. Sorting prerequisites by who controls them may reveal one manageable item and a clearer request for external help. The predicate requires sky stem Gui, earth stem Gui within one palace; stems are the letter-like references carried by the two chart layers. Consider separating the prerequisites and starting with an answerable one. Ask how this particular position relates to the subject before adopting the suggestion. Reviewing materials and communication steps can provide direct evidence that a symbolic label cannot supply. Compare the local support or constraint with that information rather than using the configuration alone to decide your next move.
    advice:
      - Consider separating the prerequisites and starting with an answerable one.
    do:
      - Locate the match
    dont:
      - Count labels
