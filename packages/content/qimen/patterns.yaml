  zh:
    title: 给循环中的安排设反馈点
    summary: 你可以把天狱当作核对安排的一条线索。
    body: |-
      你可以给反复流转的安排设一个反馈点。天狱（壬加壬的牵制组合）作为传统名称，不对现实法律情况作判断。例如，一份资料在几个人之间来回传递，却没人确认处理结果时，可以约定由一人汇总状态，明确哪一步已完成，避免每次都重新询问整个经过。此条的具体依据是天盘干（随盘层定位的天干）为壬、地盘干（随盘层定位的天干）为壬，需在同一个宫满足条件。建议指定一个汇总状态的节点与负责人。你可以把这一组合与该宫的其他标记并排查看，但不要只按名称的好坏加总印象。先选一个自己能改变的条件进行尝试，再让实际情况决定后续做法，有助于保留清楚的判断空间。
    advice:
      - 建议指定一个汇总状态的节点与负责人。
    do:
      - 核对同宫
    dont:
      - 以名定论
  en:
    title: Add a Checkpoint to a Repeating Arrangement
    summary: Use tiān yù to check a local arrangement.
    body: |-
      You can give a circulating task a clear status checkpoint. Tian yu names sky Ren over earth Ren; the historical label is not a legal claim. If a file keeps moving among several people without an outcome, one agreed status owner can distinguish completed steps from open ones and reduce repetitive questioning. The predicate requires sky stem Ren, earth stem Ren within one palace; stems are the letter-like references carried by the two chart layers. Try agreeing who will report the next completed step. Compare this combination with the other marks in its palace without turning every name into a vote. Choose a condition you can influence, observe the response and keep room to revise the approach. That makes the reflection useful even when the rest of the chart gives a different emphasis.
    advice:
      - Try agreeing who will report the next completed step.
    do:
      - Locate the match
    dont:
      - Count labels
