  en:
    title: Inspect the Setting Around the Moving Reference
    summary: Use fēi gōng gé to check a local arrangement.
    body: |-
      You can inspect how the setting meets the chart’s moving starting reference. Fei gong ge places the sky instrument associated with the hour group over earth Geng. This reverses the concealed-palace configuration. Writing down which stem belongs to each layer makes the difference auditable and prevents two similar labels from being treated as interchangeable. The predicate requires earth stem Geng within one palace; stems are the letter-like references carried by the two chart layers. Try recording the sky and earth roles separately before interpretation. Use one manageable adjustment to test the practical idea here. If the relevant indicator occupies another palace, keep this configuration as background context. A local label is more useful as a question about arrangements than as an answer about the whole outcome.
    advice:
      - Try recording the sky and earth roles separately before interpretation.
    do:
      - Locate the match
    dont:
      - Count labels
