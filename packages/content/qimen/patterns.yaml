      你适合先核对牵制出现在哪一层。伏宫格（天盘庚加地盘旬首六仪的组合）把当前推动与本局起点的承载条件连起来，旬首（时柱十日组的起点）要按该局查找。例如，对照排盘时，先找出旬首所隐的干，再看是否同宫，能避免只见庚就套用格局名。此条的具体依据是天盘干（随盘层定位的天干）为庚，需在同一个宫满足条件。建议先定位旬首六仪，再核对同宫条件。你可以把相关的宫位记在问题旁边，再说明它对应哪一个人物、资源或环节。不同宫的条件不能合成一个并不存在的组合，现实中还需要区分已经观察到的反馈与尚未核实的期待。
    advice:
      - 建议先定位旬首六仪，再核对同宫条件。
    do:
      - 核对同宫
    dont:
      - 以名定论
  en:
    title: Locate the Constraint in the Foundation
    summary: Use fú gōng gé to check a local arrangement.
    body: |-
      You can locate the constraint by tracing the chart’s starting reference. Fu gong ge places sky Geng over the earth instrument associated with xunshou (旬首, xún shǒu — the hour group’s starting reference). When auditing a match, identify that concealed stem first rather than treating any Geng cell as sufficient. The predicate requires sky stem Geng within one palace; stems are the letter-like references carried by the two chart layers. Consider tracing the starting instrument before applying the label. Locate the matched palace before applying this image to your question. Different cells cannot supply separate parts of a single configuration. Keep observed feedback separate from an expectation, and let the next real exchange show whether this working approach fits your circumstances.
    advice:
      - Consider tracing the starting instrument before applying the label.
    do:
      - Locate the match
    dont:
      - Count labels
