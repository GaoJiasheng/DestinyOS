  zh:
    title: 事业求职：调整张力
    summary: 你适合先把日干与相关事项之间的张力写成具体条件。
    body: |-
      你适合先把日干与相关事项之间的张力写成具体条件。相克（两个宫位五行中一方约束另一方的关系）在全局发现里提示协调需要留意。这个字段汇总日干与相关用神宫的比较，不注明是哪一对宫，也可能与支持关系同时存在，不能据此评价某个人是否对你不友好。你准备联系一个团队时，可以先了解岗位需要解决什么问题，再整理与之相关的经验。把结果拆成对方是否回应、你是否得到信息和下一步是否清楚，会比只问能不能成更容易复盘。建议先明确一个岗位需求与一个回应问题。你可以先核对相关宫号，再用实际资料检查这项关系是否影响下一步。
    advice:
      - 建议先明确一个岗位需求与一个回应问题。
    do:
      - 核对宫号
    dont:
      - 指认他人
  en:
    title: 'Work And Job Search: Inspect Tension'
    summary: You can turn tension between your role and the subject into a concrete condition to inspect.
    body: |-
      You can turn tension between your role and the subject into a concrete condition to inspect. The controlled finding records ke (kè — an elemental constraint relation) between the day palace and a selected subject palace. It is an aggregate note without a named pair. Support can be present elsewhere at the same time, and the relation does not reveal another person’s intentions or character. For a work enquiry, choose one role requirement and show how your experience relates to it. The useful outcome of an initial contact may be a clearer understanding of the team’s needs, even before any larger decision is made. Try matching one relevant experience to a specific role requirement. Check the palace numbers before assigning the relationship to a particular indicator, and use direct observations to decide whether the practical issue is preparation, coordination or a missing response.
    advice:
      - Try matching one relevant experience to a specific role requirement.
    do:
      - Check palace numbers
    dont:
      - Assign blame
