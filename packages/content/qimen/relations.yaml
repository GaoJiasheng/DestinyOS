# // DESIGN-GAP: findings.use_god_generated/controlled aggregate both relation directions and all selected palaces; prose does not attribute them to a specific pair.
- id: qimen.relations.career.generated
  system: qimen
  section: use_gods
  topic: relations.career.generated
  when:
    all:
      - all:
          - path: useGods[key=kai].palaceIndex
            exists: true
          - path: useGods[key=zhi_fu].palaceIndex
            exists: true
      - path: findings
        contains: use_god_generated
  weight: 35
  polarity: positive
  tags:
    - plain
    - use_god
    - zhi_fu
    - zhi_shi
  exclusive_with: []
  zh:
    title: 事业求职：相互承接
    summary: 你可以先找日干与相关用神之间可以互相承接的条件。
    body: |-
      你可以先找日干与相关用神之间可以互相承接的条件。相生（两个宫位五行中一方向另一方提供支持的关系）记录在全局发现里；它可能是你的准备承接事项，也可能是事项支持你的推进。该字段不注明是哪一对宫，因此不能凭它指认一个具体用神，更不能把同局的牵制关系忽略。你准备联系一个团队时，可以先了解岗位需要解决什么问题，再整理与之相关的经验。把结果拆成对方是否回应、你是否得到信息和下一步是否清楚，会比只问能不能成更容易复盘。建议先明确一个岗位需求与一个回应问题。你可以先核对相关宫号，再用实际资料检查这项关系是否影响下一步。
    advice:
      - 建议先明确一个岗位需求与一个回应问题。
    do:
      - 核对宫号
    dont:
      - 指认他人
  en:
    title: 'Work And Job Search: Examine Support'
    summary: You can examine where your preparation and the subject can support one another.
    body: |-
      You can examine where your preparation and the subject can support one another. The generated finding records sheng (shēng — an elemental support relation) between the day palace and a selected subject palace. It may run in either direction. Because this aggregate finding does not name the pair, it cannot establish which indicator supplies the support or erase a separate controlled finding. For a work enquiry, choose one role requirement and show how your experience relates to it. The useful outcome of an initial contact may be a clearer understanding of the team’s needs, even before any larger decision is made. Try matching one relevant experience to a specific role requirement. Check the palace numbers before assigning the relationship to a particular indicator, and use direct observations to decide whether the practical issue is preparation, coordination or a missing response.
    advice:
      - Try matching one relevant experience to a specific role requirement.
    do:
      - Check palace numbers
    dont:
      - Assign blame
  meta:
    author: t23-editorial-v1
    reviewed_by: null
    version: 2
    status: published
