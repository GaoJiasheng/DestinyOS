# // DESIGN-GAP: Weak fallback conditions use required castAt.local; no synthetic category/features fields.
- id: qimen.fallback.overview
  system: qimen
  section: overview
  topic: fallback.overview
  when:
    path: castAt.local
    exists: true
  weight: 1
  polarity: neutral
  tags:
    - plain
    - use_god
    - zhi_fu
    - zhi_shi
  exclusive_with: []
  zh:
    title: 先看整体，再选一步
    summary: 你可以把这张局当成安排下一步的参考，而不是对结果的预告。
    body: |-
      你可以先从整体节奏判断这次问题值得投入多少精力。奇门局（把起局时刻整理为九宫的象征图）描述的是提问当下的安排；阴阳遁（随季节改变的布盘方向）和局数用于计算位置，不是个人优劣的排名。盘中的总分汇合多个用神（与问题相关的观察指标），同一分数也可能来自不同组合。例如，你准备讨论一个计划时，可以先确定想了解谁的意见，再看相关宫位是否同时有支持与阻力。建议把这次阅读记成一个可检验的问题，用实际反馈更新判断。
    advice:
      - 记录一个可核实的问题。
    do:
      - 记录事实
    dont:
      - 仓促定论
  en:
    title: Read the Situation Before Choosing a Step
    summary: You have a snapshot for reflection, with room to revise your next step.
    body: |-
      You can use this reading to decide what deserves attention next. Qimen (奇门, qí mén — a symbolic arrangement of the casting time) maps a question into nine positions. The seasonal layout and its number describe how that map was constructed; they do not rank your worth or ability. A score combines several selected indicators, so two charts with similar totals may still call for different conversations. Imagine preparing to discuss a new plan: identifying the person whose feedback matters is more useful than treating a single number as an answer. Try writing down one uncertainty before reading the details, then decide what observation could clarify it. Keep the question, the casting time and your later observations together so that reflection remains connected to experience.
    advice:
      - Write down one question you can verify.
    do:
      - Record facts
    dont:
      - Rush conclusions
  meta:
    author: t23-editorial-v1
    reviewed_by: null
    version: 1
    status: published
- id: qimen.fallback.use_gods
  system: qimen
  section: use_gods
  topic: fallback.use_gods
  when:
    path: castAt.local
    exists: true
  weight: 1
  polarity: neutral
  tags:
    - plain
    - use_god
    - zhi_fu
    - zhi_shi
  exclusive_with: []
  zh:
    title: 把指标放回问题里
    summary: 你可以先明确问题中的人物、资源和下一步。
    body: |-
      你适合先把问题拆成自己的准备、外部条件和可以采取的行动，再逐项读盘。用神（在这次提问中代表相关人物或事项的指标）不是神灵，也不代表一个人的全部特征；落宫（指标所在的九宫位置）只提供这一时刻的观察背景。门、星、神（分别象征行动方式、工作倾向与情境气氛）需要连同标记一起看，不能凭一个名称替别人下判断。例如，你在寻物时，可以把最后一次使用的经过和收纳流程分开检查，而不是直接怀疑某个人。建议先记录你已经知道的事实，再选一个仍缺证据的环节进行核实；如果盘面没有鲜明组合，也可以从这些基本步骤开始。
    advice:
      - 记录一个可核实的问题。
    do:
      - 记录事实
    dont:
      - 仓促定论
  en:
    title: Keep Each Indicator Connected to Your Question
    summary: You can separate your role, the available resources and the next practical move.
    body: |-
      You can make this chapter useful by separating your own preparation from the circumstances around the question. Yongshen (用神, yòng shén — an indicator selected for the subject) is a reference point, not a supernatural actor or a complete description of another person. Its palace is the location used to read surrounding symbols at the casting time. Gates describe modes of action, stars suggest styles of work and deities add contextual imagery. For example, when looking for a missing item, reconstructing where you last used it and how you put it away gives you two concrete checks. Neither a symbol nor an unfamiliar label is evidence against anyone. Consider listing what is known first, then choose one missing fact you could verify without making an assumption about someone else.
    advice:
      - Write down one question you can verify.
    do:
      - Record facts
    dont:
      - Rush conclusions
  meta:
    author: t23-editorial-v1
    reviewed_by: null
    version: 1
    status: published
- id: qimen.fallback.patterns
  system: qimen
  section: patterns
  topic: fallback.patterns
  when:
    path: castAt.local
    exists: true
  weight: 1
  polarity: neutral
  tags:
    - plain
    - use_god
    - zhi_fu
    - zhi_shi
  exclusive_with: []
  zh:
    title: 组合需要对照相关宫
    summary: 你可以把组合当作检查安排的线索。
    body: |-
      你可以把这一章当成检查计划细节的清单。格局（同宫的干、门或神组成的传统条件）反映的是某个位置上的搭配，不是整个问题的最终结论；某宫出现一个组合，也不能直接说你的用神就在那个宫。没有突出组合时，门星与落宫标记仍可提供线索，不必为了寻找特殊名称而忽略简单信息。例如，准备一次合作时，先看沟通渠道、资料和时间安排，再核对组合是否与这些环节有关，会比只看吉凶名称更清楚。建议把每个命中的宫位写在旁边，明确它与问题的关联程度；支持与阻力若同时出现，先处理能够改变的现实条件，之后再观察反馈。
    advice:
      - 记录一个可核实的问题。
    do:
      - 记录事实
    dont:
      - 仓促定论
  en:
    title: Read Configurations in Their Local Context
    summary: A configuration can prompt a useful check without deciding the outcome.
    body: |-
      You can read configurations as prompts for checking the structure of a plan. Geju (格局, gé jú — a traditional combination of symbols within a palace) describes a local arrangement. A match somewhere in the chart does not establish that your selected indicator occupies that same position. If no named configuration stands out, ordinary gate, star and flag information still offers a starting point. Imagine coordinating a small collaboration: the channel for feedback, the available materials and the schedule deserve inspection before a dramatic label does. Try locating each matched palace and asking what role it actually plays in your question. When supportive and difficult symbols coexist, prioritise the practical condition you can change and observe what happens after that change, rather than counting labels as votes about your future.
    advice:
      - Write down one question you can verify.
    do:
      - Record facts
    dont:
      - Rush conclusions
  meta:
    author: t23-editorial-v1
    reviewed_by: null
    version: 1
    status: published
- id: qimen.fallback.directions_timing
  system: qimen
  section: directions_timing
  topic: fallback.directions_timing
  when:
    path: castAt.local
    exists: true
  weight: 1
  polarity: neutral
  tags:
    - plain
    - use_god
    - zhi_fu
    - zhi_shi
  exclusive_with: []
  zh:
    title: 先有可行安排，再参考方向
    summary: 你可以把方位和时段作为安排上的辅助线索。
    body: |-
      你可以先把可行的地点和时间列出来，再用盘中的提示比较。吉方（满足引擎所用门星与标记条件的宫位方向）是起局时刻的象征筛选，不表示那个方向的所有地点都适合你；吉时（与这些宫位相应的地支时段）也需要结合当地时区和实际日程。空列表意味着此局未筛出明确候选，不能自行补一个方向或日期。例如，约见朋友时，交通便利、双方有空和环境合适通常比绕路去某个方位更有帮助。建议先选现实上能实行的方案，并留出延误余量；没有候选时就依照正常计划安排，之后需要新的问题再重新起局，不把此刻的提示延长成长期规则。
    advice:
      - 记录一个可核实的问题。
    do:
      - 记录事实
    dont:
      - 仓促定论
  en:
    title: Fit Direction and Timing Around a Practical Plan
    summary: Use the chart to compare feasible options for place and time.
    body: |-
      You can compare places and times after establishing what is actually feasible. A favourable direction is a palace selected by the engine because its gate, star and flags satisfy a defined rule at the casting time. It is not a statement about every venue on that side of a city. A suggested branch hour is likewise a symbolic scheduling cue, to be read alongside your local clock and the availability of other people. An empty candidate list simply means this chart offers no clear shortlist. For instance, a meeting space with easy transport and enough privacy may serve your conversation better than a distant alternative. Consider choosing among workable arrangements and allowing some slack for delays. If no candidates appear, use ordinary scheduling information instead of inventing a special date.
    advice:
      - Write down one question you can verify.
    do:
      - Record facts
    dont:
      - Rush conclusions
  meta:
    author: t23-editorial-v1
    reviewed_by: null
    version: 1
    status: published
- id: qimen.fallback.advice
  system: qimen
  section: advice
  topic: fallback.advice
  when:
    path: castAt.local
    exists: true
  weight: 1
  polarity: neutral
  tags:
    - plain
    - use_god
    - zhi_fu
    - zhi_shi
  exclusive_with: []
  zh:
    title: 把阅读变成小实验
    summary: 你可以用一项小行动、一次核实和一个复盘点收束阅读。
    body: |-
      你可以把这次阅读收束为三个彼此配合的步骤。先选择一项在自己掌控范围内的小行动，再核实一条会影响选择的事实，最后约定何时回头检查效果。行动建议来自盘面象征与问题类别，只是帮助你整理思路，并不能替代对现实条件的了解；如果某条建议与你的处境不符，可以调整它的规模或暂时放下。例如，你想推进一个迟迟没回应的计划，可以先整理一页资料，确认对方的接收渠道，并在约定期限后再做下一步判断。建议把观察结果写下来，区分你做过什么和别人给过什么反馈。保留休息和改方案的空间，会让这次探索更容易转化为日常习惯。
    advice:
      - 记录一个可核实的问题。
    do:
      - 记录事实
    dont:
      - 仓促定论
  en:
    title: Turn Reflection into a Small Experiment
    summary: Choose a small action, verify one fact and set a review point.
    body: |-
      You can close the reading with three connected choices: a manageable action, a fact to verify and a point for review. Advice from the chart is a way to organise reflection, so its usefulness depends on your circumstances and the responses you receive. Start with something you control and keep its scale small enough to adjust. For example, if a proposal has received no reply, prepare a concise note, check that it reached the intended channel and decide when you will review the situation again. Those steps give you more information than repeatedly checking a symbolic score. Try keeping a brief record of what you did and what happened afterwards. Leave room to rest, ask for support or change the plan if the experiment proves unhelpful.
    advice:
      - Write down one question you can verify.
    do:
      - Record facts
    dont:
      - Rush conclusions
  meta:
    author: t23-editorial-v1
    reviewed_by: null
    version: 1
    status: published
- id: qimen.fallback.pro_view
  system: qimen
  section: pro_view
  topic: fallback.pro_view
  when:
    path: castAt.local
    exists: true
  weight: 1
  polarity: neutral
  tags:
    - plain
    - use_god
    - zhi_fu
    - zhi_shi
  exclusive_with: []
  zh:
    title: 保留完整的核对链
    summary: 你可以从时刻、节气和层次依次核对排盘。
    body: |-
      你可以把专业视图用来核对计算过程，而不是增加神秘感。拆补法（按节气交接与日数确定上中下元的布局规则）先确定阴阳遁和局数；旬首（时柱所属十日组的起点）再帮助找到值符和值使。值符（当前领头的星）随时干定位，值使（当前领头的门）随时支定位，两者的原宫和现宫需要分别核对。中五寄坤二（把中宫参与转盘的要素放到坤位读取）会影响寄干的查找。例如，同别人对照盘面时，应先确认时区、是否采用真太阳时和流派，再比较各层，而不是直接拿不同规则的结果判对错。建议保留输入设置，并从地盘开始逐层检查，遇到差异先回到产生它的步骤。
    advice:
      - 记录一个可核实的问题。
    do:
      - 记录事实
    dont:
      - 仓促定论
  en:
    title: Keep a Clear Audit Trail
    summary: You can audit the chart by checking time, season and layout layers in order.
    body: |-
      You can use the full chart to trace how the layout was calculated. Chaibu (拆补, chāi bǔ — a method using solar terms and elapsed days) establishes the seasonal layout, period and number. Xunshou (旬首, xún shǒu — the start of the hour pillar’s ten-day group) identifies the leading star and gate. The star follows the hour stem while the gate follows the hour branch, so their starting and current positions serve different purposes. Centre hosting also matters when tracing a concealed stem. If a reference chart differs, compare timezone, solar-time adjustment and school settings before comparing individual cells. Consider checking the earth layer first, then the moving layers and finally the flags. That order helps you locate a disagreement in a calculation step instead of treating different conventions as interchangeable.
    advice:
      - Write down one question you can verify.
    do:
      - Record facts
    dont:
      - Rush conclusions
  meta:
    author: t23-editorial-v1
    reviewed_by: null
    version: 1
    status: published
