    title: 落实前先核实
    summary: 你可以从空亡标记提示的环节开始检查。
    body: |-
      你适合把尚未落实的环节单独标出来。空亡（本旬两支对应宫位的缺位标记）在盘中表示某宫的条件需要进一步核实，不等于事情没有希望。它可能提醒你区分已拿到的资料和只是听说的安排，尤其是对方尚未回复的部分。例如，讨论场地时，口头说可以借用和已经确认预约是两件事；把它们写在不同栏里，有助于减少来回等待。建议先确认资源是否实际可用，再安排后续。复查时，可以只改一项条件，并记录调整前后的差别，避免同时改动太多而难以判断原因。盘面只标出此刻某宫的结构，是否与你的问题直接有关，还要看相关指标的实际位置。
    advice:
      - 建议先确认资源是否实际可用，再安排后续。
    do:
      - 检查环节
    dont:
      - 急于扩大
  en:
    title: Check What Is Actually Available
    summary: Use the kōng wáng flag as a prompt for a practical check.
    body: |-
      You can benefit from distinguishing a possibility from something already arranged. Kongwang (空亡, kōng wáng — a vacant-position flag for the hour group) marks a palace whose conditions invite verification. Think of an event venue mentioned in conversation but never actually booked: the useful response is to check availability, not abandon the gathering. Separate a confirmed reservation from a promising lead, and ask who can provide the missing information. Consider requesting confirmation before committing the next dependent step. Choose a change small enough to inspect afterwards, and record the difference it makes. Before applying this note to your question, locate the marked palace and check whether a relevant indicator is there; a flag elsewhere remains background context. Ask who can verify the remaining condition.
