    summary: You can make the next step smaller and easier to revise.
    body: |-
      You can make the next step smaller and easier to revise. An inauspicious verdict groups this chart’s score into the more constrained band. Consider reviewing dependencies and the facts you can verify, then choosing a reversible action. The band is local to this casting and does not fix the future. For a broad question, separate your own preparation from the matter under discussion and from external feedback. Choose one uncertainty that could be reduced with an observation. That gives a general reading a practical focus without treating its total score as an answer to every part of the situation. The score summarises rule weights rather than a probability. You can keep the casting and later observations together, then review whether the suggested approach helped before relying on it again. A useful next observation should reduce a named uncertainty. If the question remains too broad to test, narrow it before deciding how much effort the plan deserves.
    advice:
      - Consider narrowing the question to one observable next choice.
    do:
      - Check conditions
    dont:
      - Treat as probability
