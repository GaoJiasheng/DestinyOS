# // DESIGN-GAP: QimenChart omits category; category predicates use the engine’s unique useGods signatures. Scores are symbolic bands, never probabilities.
- id: qimen.verdict.career.auspicious
  system: qimen
  section: overview
  topic: verdict.career
  when:
    all:
      - all:
          - path: useGods[key=kai].palaceIndex
            exists: true
          - path: useGods[key=zhi_fu].palaceIndex
            exists: true
      - path: verdict
        eq: auspicious
  weight: 85
  polarity: positive
  tags:
    - plain
    - use_god
    - zhi_fu
    - zhi_shi
  exclusive_with: []
  zh:
    title: 事业求职：支持较集中
    summary: 你可以把准备较充分的一步提到前面。
    body: |-
      你可以把准备较充分的一步提到前面。吉的判定（引擎汇总相关宫位所得的象征分段）表示支持较集中，不代表每个环节都轻松，也不替别人承诺回应。你准备联系一个团队时，可以先了解岗位需要解决什么问题，再整理与之相关的经验。把结果拆成对方是否回应、你是否得到信息和下一步是否清楚，会比只问能不能成更容易复盘。分数（规则权重的汇总刻度）不是概率；可以把后续实际反馈记下来，再决定这条线索是否适合你的处境。
    advice:
      - 建议先明确一个岗位需求与一个回应问题。
    do:
      - 核对条件
    dont:
      - 以分定局
  en:
    title: 'Work And Job Search: Several Supports Align'
    summary: You can bring a well-prepared next step forward.
    body: |-
      You can bring a well-prepared next step forward. An auspicious verdict is the engine’s symbolic band for concentrated support. It gives you a reason to examine a prepared step, while leaving each person’s response and the practical outcome open. For a work enquiry, choose one role requirement and show how your experience relates to it. The useful outcome of an initial contact may be a clearer understanding of the team’s needs, even before any larger decision is made. The score summarises rule weights rather than a probability. You can keep the casting and later observations together, then review whether the suggested approach helped before relying on it again. The first contact can be successful as an information-gathering step even when it does not settle a longer-term employment question. Review what became clearer about the role.
    advice:
      - Try matching one relevant experience to a specific role requirement.
    do:
      - Check conditions
    dont:
      - Treat as probability
  meta:
    author: t23-editorial-v1
    reviewed_by: null
    version: 1
    status: published
