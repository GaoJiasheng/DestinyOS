- scrollUntilVisible:
    element:
      id: ritual-sound
- runFlow:
    when:
      visible:
        id: ritual-sound
        checked: true
    commands:
      - tapOn:
          id: ritual-sound
- assertVisible:
    id: ritual-sound
    checked: false
- tapOn:
    id: ritual-sound
- assertVisible:
    id: ritual-sound
    checked: true
- scrollUntilVisible:
    element:
      id: ritual-haptics
