appId: pub.gavin.tianji
---
- launchApp
- openLink: 'tianji://reading'
- tapOn:
    text: '^(打开|Open)$'
    optional: true
- scrollUntilVisible:
    element:
      id: system-bazi
- tapOn:
    id: system-bazi
- extendedWaitUntil:
    visible:
      id: report-headline
    timeout: 30000
- takeScreenshot: report-bazi-release
