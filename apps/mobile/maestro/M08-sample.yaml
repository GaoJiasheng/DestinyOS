appId: pub.gavin.tianji
# Run on a dedicated empty simulator; never clear an owner's device data.
---
# DESIGN-GAP: The empty-state flow owns a reset dedicated simulator, independent of earlier profile fixtures.
- launchApp:
    clearState: true
    clearKeychain: true
- openLink: 'tianji://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8081'
- tapOn:
    text: '^(打开|Open)$'
    optional: true
- openLink: 'tianji://dev/daily'
- tapOn:
    text: '^(打开|Open)$'
    optional: true
- extendedWaitUntil:
    visible:
      id: daily-fixture-en
    timeout: 90000
- tapOn:
    id: daily-fixture-en
- tapOn:
    id: daily-fixture-empty
# DESIGN-GAP: UMP's web view can render before accepting a tap; retry the visible consent button.
- repeat:
    times: 6
    commands:
      - tapOn:
          text: '^(Continue|继续|繼續)$'
          optional: true
          retryTapIfNoChange: true
      - tapOn:
          text: '.*(Ask App Not to Track|要求.*不跟踪|要求.*不追蹤).*'
          optional: true
- extendedWaitUntil:
    visible:
      id: home-sky
    timeout: 90000
- waitForAnimationToEnd:
    timeout: 1000
- takeScreenshot: today-empty-sky-en
- scrollUntilVisible:
    element:
      text: 'Example fortune · fictional profile'
    centerElement: true
- waitForAnimationToEnd:
    timeout: 1000
- takeScreenshot: today-empty-blur-en
- assertVisible: '.*Example fortune.*'
- openLink: 'tianji://today/calendar'
- assertVisible: '.*birth profile.*'
- waitForAnimationToEnd:
    timeout: 1000
- takeScreenshot: calendar-empty-en
- openLink: 'tianji://me/journal'
- extendedWaitUntil:
    visible: 'Journal and self-tracking'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 1000
- takeScreenshot: journal-empty-en
- tapOn:
    text: '^(打开|Open)$'
    optional: true
- openLink: 'tianji://dev/daily'
- tapOn:
    text: '^(打开|Open)$'
    optional: true
- tapOn:
    id: daily-fixture-zh-TW
- tapOn:
    id: daily-fixture-prepare
- extendedWaitUntil:
    visible:
      id: home-sky
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 1000
- takeScreenshot: today-sky-zh-TW
- openLink: 'tianji://today/calendar'
- extendedWaitUntil:
    visible:
      id: calendar-grid
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 1000
- takeScreenshot: calendar-zh-TW
