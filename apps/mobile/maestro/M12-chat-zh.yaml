appId: pub.gavin.tianji
---
# DESIGN-GAP: A native scroll can consume the first tap; retry only while chat is unopened.
- launchApp
- openLink: 'tianji://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8081'
- tapOn:
    text: '^(打开|Open)$'
    optional: true
- openLink: 'tianji:///dev/report-actions'
- tapOn:
    text: '^(打开|Open)$'
    optional: true
- extendedWaitUntil:
    visible:
      id: m12-zh
    timeout: 60000
- tapOn:
    id: m12-zh
- tapOn:
    id: m12-prepare
- extendedWaitUntil:
    visible:
      id: report-chat
    timeout: 30000
- scrollUntilVisible:
    element:
      id: report-chat
    centerElement: true
- waitForAnimationToEnd
- repeat:
    times: 2
    commands:
      - runFlow:
          when:
            visible:
              id: report-chat
          commands:
            - tapOn:
                id: report-chat
- extendedWaitUntil:
    visible:
      id: chat-question
    timeout: 30000
- scrollUntilVisible:
    element:
      id: chat-quota
    centerElement: true
- tapOn:
    id: chat-question
- inputText: 'What supports clear communication?'
- tapOn:
    id: chat-send
- extendedWaitUntil:
    visible:
      id: chat-stream
    timeout: 5000
- takeScreenshot: chat-stream-zh
- extendedWaitUntil:
    notVisible:
      id: chat-stream
    timeout: 30000
- scrollUntilVisible:
    direction: UP
    element:
      id: chat-quota
    centerElement: true
- takeScreenshot: chat-complete-zh
