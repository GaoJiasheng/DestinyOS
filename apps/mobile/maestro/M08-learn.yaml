- extendedWaitUntil:
    visible:
      id: daily-fixture-en
    timeout: 90000
- tapOn:
    id: daily-fixture-en
- openLink: 'tianji://learn/bazi'
- extendedWaitUntil:
    visible: 'BaZi'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 1000
- takeScreenshot: learn-encyclopedia-en
- openLink: 'tianji://dev/daily'
