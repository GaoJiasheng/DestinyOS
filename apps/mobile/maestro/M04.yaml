appId: pub.gavin.tianji
---
# DESIGN-GAP: A reinstalled development client needs its Metro connection before storage diagnostics.
- launchApp
- openLink: 'tianji://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8081'
- tapOn:
    text: '打开|Open'
    optional: true
- tapOn:
    text: 'Continue'
    optional: true
- openLink: 'tianji:///dev/storage'
- tapOn:
    text: 'Continue'
    optional: true
- tapOn:
    id: xmark
    optional: true
- tapOn:
    text: '打开|Open'
    optional: true
- openLink: 'tianji:///dev/storage'
- extendedWaitUntil:
    visible:
      id: storage-check
    timeout: 30000
- tapOn:
    id: storage-check
- extendedWaitUntil:
    visible:
      id: storage-passed
    timeout: 30000
- takeScreenshot: storage-passed
