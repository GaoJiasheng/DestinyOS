appId: pub.gavin.tianji
---
# DESIGN-GAP: Capture settled native screens, excluding navigation and Expo refresh transitions.
# DESIGN-GAP: Dismiss an OS permission dialog left by a failed prior run before reinstalling.
- launchApp
- tapOn:
    text: '^(不允许|Don.t Allow)$'
    optional: true
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      notifications: unset
- openLink: 'tianji://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8081'
- tapOn:
    text: '^(打开|Open)$'
    optional: true
- extendedWaitUntil:
    visible:
      id: onboarding-0
    timeout: 30000
- scrollUntilVisible:
    centerElement: true
    element:
      id: locale-en
- tapOn:
    id: locale-en
- scrollUntilVisible:
    centerElement: true
    element:
      text: 'Begin with your sky'
    direction: UP
- scrollUntilVisible:
    centerElement: true
    element:
      id: onboarding-next
- tapOn:
    id: onboarding-next
- extendedWaitUntil:
    visible: '^(允许|Allow)$'
    timeout: 15000
- tapOn: '^(允许|Allow)$'
- tapOn:
    id: onboarding-next
- scrollUntilVisible:
    centerElement: true
    element:
      id: onboarding-next
- tapOn:
    id: onboarding-next
- tapOn:
    id: notifications-request
- extendedWaitUntil:
    visible:
      id: onboarding-skip
    timeout: 20000
- tapOn:
    id: onboarding-skip
# DESIGN-GAP: Close the SDK's test UMP/ATT dialogs after onboarding before exercising form controls.
# DESIGN-GAP: UMP can arrive after the cold SDK request; allow bounded retries before form assertions.
- repeat:
    times: 6
    commands:
      - tapOn:
          text: '^(Continue|继续|繼續)$'
          optional: true
          retryTapIfNoChange: true
      - tapOn:
          text: '.*(Ask App Not to Track|要求.*不跟踪|要求.*不追蹤).*'
          optional: true
# DESIGN-GAP: The age gate owns its onboarding state so serial resume never depends on M05-en.
- launchApp
- openLink: 'tianji://me/birth'
- tapOn:
    text: '打开|Open'
    optional: true
- extendedWaitUntil:
    visible:
      id: birth-year
    timeout: 30000
- tapOn:
    id: birth-year
- inputText: '2020'
- hideKeyboard
- scrollUntilVisible:
    centerElement: true
    element:
      id: birth-submit
- tapOn:
    id: birth-submit
- assertVisible: 'This service is intended for users aged 18 and over'
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: age-restricted-en
- launchApp
- openLink: 'tianji://me/birth'
- assertVisible: 'This service is intended for users aged 18 and over'
- assertNotVisible:
    id: birth-year
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: age-restricted-after-restart-en
