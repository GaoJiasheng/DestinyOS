appId: pub.gavin.tianji
---
- launchApp:
    permissions:
      all: unset
- openLink: 'tianji://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8081'
- tapOn:
    text: '^(打开|Open)$'
    optional: true
- openLink: 'tianji:///dev/monetization'
- tapOn:
    text: '^(打开|Open)$'
    optional: true
- runFlow:
    when:
      visible: 'Our app wants to stay free for you'
    commands:
      - takeScreenshot: native-ump-att-explanation-en
      - tapOn: Continue
      - extendedWaitUntil:
          visible: '.*(Allow.*track|允许.*跟踪).*'
          timeout: 15000
      - takeScreenshot: startup-system-att-zh
      - tapOn:
          text: '.*(Ask App Not to Track|要求.*不跟踪).*'
- runFlow:
    when:
      visible: '.*(Allow.*track|允许.*跟踪).*'
    commands:
      - takeScreenshot: startup-system-att-zh
      - tapOn:
          text: '.*(Ask App Not to Track|要求.*不跟踪).*'
- extendedWaitUntil:
    visible:
      id: m13-prepare
    timeout: 60000
- tapOn:
    id: m13-prepare
- extendedWaitUntil:
    visible:
      id: m13-plan
    timeout: 30000
- scrollUntilVisible:
    direction: UP
    element:
      id: m13-en
    centerElement: true
- tapOn:
    id: m13-en
- scrollUntilVisible:
    direction: DOWN
    element:
      id: native-ad-0
    centerElement: true
- assertVisible:
    id: native-ad-0
- assertNotVisible: '[1-9].*implementation issue.*'
- tapOn:
    text: Dismiss
    optional: true
- takeScreenshot: native-free-en
