appId: pub.gavin.tianji
---
- launchApp
- openLink: 'tianji://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8081'
- openLink: 'tianji://dev/reports'
- extendedWaitUntil:
    visible:
      id: fixture-bazi
    timeout: 90000
- tapOn:
    id: fixture-locale-zh
- scrollUntilVisible:
    element:
      id: fixture-numerology
    centerElement: true
- tapOn:
    id: fixture-numerology
- extendedWaitUntil:
    visible:
      id: report-headline
    timeout: 30000
# DESIGN-GAP: centerElement clears a directional edge; a slow reset-button swipe positions the complete canvas without inertial overshoot.
- scrollUntilVisible:
    element:
      id: chart-reset
    centerElement: true
- swipe:
    from:
      id: chart-reset
    direction: DOWN
    duration: 5000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: chart-numerology-zh
