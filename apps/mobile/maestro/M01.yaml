appId: pub.gavin.tianji
---
# DESIGN-GAP: Capture settled native screens, excluding navigation and Expo refresh transitions.
# DESIGN-GAP: The final onboarding replaces M01's temporary brand/tab placeholders.
- launchApp:
    clearState: true
    clearKeychain: true
- openLink: 'tianji://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8081'
- tapOn:
    text: '^(打开|Open)$'
    optional: true
- extendedWaitUntil:
    visible:
      id: onboarding-0
    timeout: 90000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: brand-zh
- scrollUntilVisible:
    element:
      id: theme-east
- tapOn:
    id: theme-east
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: theme-east
- tapOn:
    id: theme-west
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: theme-west
- tapOn:
    id: theme-vedic
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: theme-vedic
- scrollUntilVisible:
    element:
      id: locale-zh-TW
- tapOn:
    id: locale-zh-TW
- assertVisible: '繁體中文'
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: locale-zh-TW
- tapOn:
    id: locale-en
- assertVisible: 'English'
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: locale-en
- scrollUntilVisible:
    element:
      text: 'DestinyOS'
    direction: UP
- assertVisible: 'DestinyOS'
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: brand-en
