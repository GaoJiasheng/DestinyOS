appId: pub.gavin.tianji
---
- launchApp
- openLink: 'tianji://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8081'
- openLink: 'tianji://dev/reports'
- extendedWaitUntil:
    visible:
      id: fixture-bazi
    timeout: 90000
- tapOn:
    id: fixture-locale-zh
- scrollUntilVisible:
    element:
      id: fixture-vedic
    centerElement: true
# DESIGN-GAP: Let the centered fixture button settle before dispatching the native report.
- waitForAnimationToEnd:
    timeout: 2000
- repeat:
    times: 2
    commands:
      - runFlow:
          when:
            visible:
              id: fixture-vedic
          commands:
            - tapOn:
                id: fixture-vedic
                retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: report-headline
    timeout: 30000
# DESIGN-GAP: centerElement clears a directional edge; a slow reset-button swipe positions the complete canvas without inertial overshoot.
- scrollUntilVisible:
    element:
      id: chart-reset
    centerElement: true
- swipe:
    from:
      id: chart-reset
    direction: DOWN
    duration: 5000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: chart-vedic-zh
- scrollUntilVisible:
    element:
      id: vedic-north
    direction: UP
    centerElement: true
- tapOn:
    id: vedic-north
# DESIGN-GAP: centerElement clears a directional edge; a slow reset-button swipe positions the complete canvas without inertial overshoot.
- scrollUntilVisible:
    element:
      id: chart-reset
    centerElement: true
- swipe:
    from:
      id: chart-reset
    direction: DOWN
    duration: 5000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: chart-vedic-north-zh
- scrollUntilVisible:
    element:
      id: vedic-D9
    direction: UP
    centerElement: true
- tapOn:
    id: vedic-D9
# DESIGN-GAP: centerElement clears a directional edge; a slow reset-button swipe positions the complete canvas without inertial overshoot.
- scrollUntilVisible:
    element:
      id: chart-reset
    centerElement: true
- swipe:
    from:
      id: chart-reset
    direction: DOWN
    duration: 5000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: chart-vedic-D9-zh
