      id: journal-text
    centerElement: true
- tapOn:
    id: journal-text
- inputText: 'A calm day.'
- hideKeyboard
- scrollUntilVisible:
    element:
      id: journal-save
    centerElement: true
- tapOn:
    id: journal-save
- assertVisible:
    id: journal-saved
- waitForAnimationToEnd:
    timeout: 1000
- takeScreenshot: today-journal-saved-zh
- openLink: 'tianji://me/journal'
- extendedWaitUntil:
