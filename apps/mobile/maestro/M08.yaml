appId: pub.gavin.tianji
---
- launchApp
- openLink: 'tianji://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8081'
- tapOn:
    text: '^(打开|Open)$'
    optional: true
- openLink: 'tianji://dev/daily'
- tapOn:
    text: '^(打开|Open)$'
    optional: true
- extendedWaitUntil:
    visible:
      id: daily-fixture-zh
    timeout: 90000
- tapOn:
    id: daily-fixture-zh
- tapOn:
    id: daily-fixture-prepare
- extendedWaitUntil:
    visible:
      id: home-sky
    timeout: 90000
- waitForAnimationToEnd:
    timeout: 1000
- takeScreenshot: today-sky-zh
- scrollUntilVisible:
    element:
      id: daily-block-2
    centerElement: true
- waitForAnimationToEnd:
    timeout: 1000
- takeScreenshot: today-oneliner-zh
- longPressOn:
    id: daily-card-longpress
- extendedWaitUntil:
    visible:
      id: daily-share-native
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 1000
- takeScreenshot: today-share-zh
# DESIGN-GAP: Refresh the real Chinese system share sheet baseline alongside its preview.
- scrollUntilVisible:
    element:
      id: daily-share-native
    centerElement: true
- tapOn:
    id: daily-share-native
- assertVisible: '^(拷贝|Copy)$'
- waitForAnimationToEnd:
    timeout: 1000
- takeScreenshot: today-share-system-zh
- tapOn:
    point: 50%,30%
- scrollUntilVisible:
    element:
      id: report-sheet-close
    centerElement: true
- tapOn: '关闭'
- scrollUntilVisible:
    element:
      id: daily-block-4
    centerElement: true
- waitForAnimationToEnd:
    timeout: 1000
- takeScreenshot: today-lucky-zh
- scrollUntilVisible:
    element:
      id: daily-block-7
    centerElement: true
- waitForAnimationToEnd:
    timeout: 1000
- takeScreenshot: today-astro-zh
- scrollUntilVisible:
