appId: pub.gavin.tianji
---
# DESIGN-GAP: Capture settled native screens, excluding navigation and Expo refresh transitions.
# DESIGN-GAP: Dismiss an OS permission dialog left by a failed prior run before reinstalling.
- launchApp
- tapOn:
    text: '^(不允许|Don.t Allow)$'
    optional: true
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      notifications: unset
- runFlow:
    when:
      true: ${M05_DEV === '1'}
    commands:
      - openLink: 'tianji://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8081'
      - tapOn:
          text: '打开|Open'
          optional: true
      - tapOn:
          text: 'Continue'
          optional: true
      - runFlow:
          when:
            visible: 'Go home'
          commands:
            - tapOn: '关闭|Close'
- extendedWaitUntil:
    visible:
      id: onboarding-0
    timeout: 90000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: onboarding-stars-zh
- scrollUntilVisible:
    centerElement: true
    element:
      id: onboarding-next
- tapOn:
    id: onboarding-next
# Notification permission is requested automatically on the second screen (App A6).
- extendedWaitUntil:
    visible: '^(不允许|Don.t Allow)$'
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: notifications-system-zh
- tapOn: '^(不允许|Don.t Allow)$'
- assertVisible:
    id: onboarding-1
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: onboarding-intro-zh
- tapOn:
    id: onboarding-next
- assertVisible:
    id: onboarding-2
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: onboarding-disclaimer-zh
- scrollUntilVisible:
    centerElement: true
    element:
      id: onboarding-next
- tapOn:
    id: onboarding-next
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: notifications-request-zh
- extendedWaitUntil:
    visible:
      id: notifications-denied
    timeout: 20000
- runFlow:
    when:
      visible:
        id: notifications-denied
    commands:
      - waitForAnimationToEnd:
          timeout: 2000
      - takeScreenshot: notifications-denied-zh
      - tapOn:
          id: onboarding-next
- assertVisible:
    id: onboarding-fill
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: optional-profile-zh
- tapOn:
    id: onboarding-fill
# DESIGN-GAP: Close the SDK's test UMP/ATT dialogs after onboarding before exercising form controls.
# DESIGN-GAP: UMP can arrive after the cold SDK request; allow bounded retries before form assertions.
- repeat:
    times: 6
    commands:
      - tapOn:
          text: '^(Continue|继续|繼續)$'
          optional: true
          retryTapIfNoChange: true
      - tapOn:
          text: '.*(Ask App Not to Track|要求.*不跟踪|要求.*不追蹤).*'
          optional: true
- assertVisible: '日期与时间'
- tapOn:
    id: birth-year
- inputText: '1990'
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: birth-date-zh
- scrollUntilVisible:
    centerElement: true
    element:
      id: time-unknown
- tapOn:
    id: time-unknown
- assertVisible:
    id: unknown-help
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: birth-unknown-zh
- scrollUntilVisible:
    centerElement: true
    element:
      id: birth-submit
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: birth-disabled-clock-zh
- tapOn:
    id: birth-submit
- assertVisible: '地点与性别'
- tapOn:
    id: birth-city
- inputText: 'Beijing'
- hideKeyboard
- extendedWaitUntil:
    visible:
      id: city-result-0
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: offline-city-zh
- tapOn:
    id: city-result-0
- assertVisible:
    id: selected-city
- scrollUntilVisible:
    centerElement: true
    element:
      id: birth-name
- tapOn:
    id: birth-name
- inputText: 'Alice'
- hideKeyboard
- tapOn:
    id: advanced-open
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: birth-advanced-zh
- scrollUntilVisible:
    centerElement: true
    element:
      id: birth-submit
- tapOn:
    id: birth-submit
- extendedWaitUntil:
    visible:
      id: profile-saved
    timeout: 20000
- assertVisible: 'Alice'
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: profiles-first-zh
- tapOn:
    id: profile-add
- tapOn:
    id: calendar-lunar
- tapOn:
    id: birth-year
- inputText: '1993'
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: lunar-leap-zh
- scrollUntilVisible:
    centerElement: true
    element:
      id: birth-submit
- tapOn:
    id: birth-submit
- scrollUntilVisible:
    centerElement: true
    element:
      id: birth-name
- tapOn:
    id: birth-name
- inputText: 'Bob'
- hideKeyboard
- scrollUntilVisible:
    centerElement: true
    element:
      id: birth-submit
- tapOn:
    id: birth-submit
- assertVisible: 'Bob'
- assertVisible: 'Alice'
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: multi-profiles-zh
- tapOn: 'Alice'
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: profile-switched-zh
- tapOn:
    id: tab-ask
- assertVisible:
    id: ask-sheet
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: ask-sheet-zh
- tapOn:
    id: ask-close
- tapOn:
    id: tab-reading
- assertVisible:
    id: system-bazi
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: navigation-reading-zh
- tapOn:
    id: tab-learn
- assertVisible:
    id: learn-search
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: navigation-learn-zh
- tapOn:
    id: tab-today
- assertVisible:
    id: home-sky
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: navigation-today-zh
- tapOn:
    id: tab-me
- scrollUntilVisible:
    centerElement: true
    element:
      id: locale-en
- tapOn:
    id: locale-en
- scrollUntilVisible:
    centerElement: true
    element:
      id: profile-add
    direction: UP
- assertVisible: 'Manage profiles'
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: multi-profiles-en
- tapOn:
    id: tab-ask
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: ask-sheet-en
- tapOn:
    id: ask-close
- launchApp
- openLink: 'tianji://me'
- tapOn:
    text: '打开|Open'
    optional: true
- extendedWaitUntil:
    visible: 'Alice'
    timeout: 30000
- assertVisible: 'Bob'
- assertNotVisible:
    id: onboarding-0
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: profiles-after-restart-en
