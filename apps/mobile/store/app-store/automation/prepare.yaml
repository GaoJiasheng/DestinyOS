appId: pub.gavin.tianji
---
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      notifications: unset
- extendedWaitUntil:
    visible:
      id: onboarding-0
    timeout: 90000
- scrollUntilVisible:
    element:
      id: onboarding-next
- tapOn:
    id: onboarding-next
- tapOn:
    id: onboarding-next
- tapOn:
    id: onboarding-next
# The reminder step asks for notifications only when the user taps it; decline so no banner shows in screenshots.
- tapOn:
    id: notifications-request
- tapOn:
    text: '^(不允许|Don.t Allow)$'
    optional: true
- runFlow:
    when:
      visible:
        id: notifications-denied
    commands:
      - tapOn:
          id: onboarding-next
- tapOn:
    id: onboarding-fill
- extendedWaitUntil:
    visible:
      id: birth-year
    timeout: 30000
- tapOn:
    id: birth-year
- inputText: '1992'
# The form starts every wheel on "choose"; pick a month, a day and a real hour so the charts are complete.
- runFlow: ../../../maestro/shared/close-number-pad.yaml
- runFlow: ../../../maestro/shared/birth-wheels.yaml
- runFlow: ../../../maestro/shared/birth-hour-branch.yaml
- scrollUntilVisible:
    element:
      id: birth-submit
- tapOn:
    id: birth-submit
- tapOn:
    id: birth-city
- inputText: 'Singapore'
- hideKeyboard
- extendedWaitUntil:
    visible:
      id: city-result-0
    timeout: 30000
- tapOn:
    id: city-result-0
- scrollUntilVisible:
    element:
      id: birth-name
- tapOn:
    id: birth-name
- inputText: 'Alex'
- hideKeyboard
- scrollUntilVisible:
    element:
      id: birth-submit
- tapOn:
    id: birth-submit
- extendedWaitUntil:
    visible:
      id: profile-saved
    timeout: 30000
