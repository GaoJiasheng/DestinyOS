name = "destinyos"
main = "worker.ts"
account_id = "9aea83b326d8175abdd136c1177637a5"
# DESIGN-GAP: Minify the deployed bundle to reduce transfer size while preserving runtime behavior.
minify = true
# DESIGN-GAP: Pin the latest compatibility date supported by the installed workerd.
compatibility_date = "2026-10-05"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "destinyos"

[[r2_buckets]]
binding = "EXPORT_BUCKET"
bucket_name = "destinyos-exports"

[[r2_buckets]]
binding = "NEXT_INC_CACHE_R2_BUCKET"
bucket_name = "destinyos-next-cache"

[browser]
binding = "BROWSER"

[triggers]
crons = ["0 3 * * *"]

[observability]
enabled = true

[vars]
PLATFORM = "cloudflare"
AUTH_TRUST_HOST = "true"
AUTH_URL = "https://tianji.gavin.pub"
NEXT_PUBLIC_SITE_URL = "https://tianji.gavin.pub"
FEATURE_ADS = "true"
FEATURE_LLM_CHAT = "false"
FEATURE_LLM_POLISH = "false"
MINIMAX_BASE_URL = "https://api.minimaxi.com/v1"
MINIMAX_MODEL = "MiniMax-M2.5"

# Set other non-secret values for each environment: EMAIL_FROM, ADMIN_EMAILS,
# STRIPE_PRICE_MONTHLY, STRIPE_PRICE_YEARLY, STRIPE_TAX_ENABLED,
# PRIVACY_CONTROLLER_NAME, PRIVACY_CONTACT_EMAIL, SENTRY_DSN.
# Build-time public vars: NEXT_PUBLIC_DEFAULT_LOCALE, NEXT_PUBLIC_ADSENSE_CLIENT,
# NEXT_PUBLIC_ADSENSE_SLOT_{HOME,REPORT_TOP,REPORT_BOTTOM,TODAY,LEARN}, NEXT_PUBLIC_SENTRY_DSN.
# Secrets: wrangler secret put <NAME> (never place values here):
# AUTH_SECRET, AUTH_GOOGLE_ID, AUTH_GOOGLE_SECRET, RESEND_API_KEY,
# FIELD_ENCRYPTION_KEYS, STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, CRON_SECRET,
# MINIMAX_API_KEY (only when chat is enabled).
# Deployment-only credentials: CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_API_TOKEN.
# D1, KV and R2 bindings require no runtime connection secrets.
# Bind the custom domain after preview verification:
# [[routes]]
# pattern = "tianji.gavin.pub"
# custom_domain = true

[[d1_databases]]
binding = "DB"
database_name = "destinyos"
database_id = "7d4b2c61-d7dd-412f-a84e-89eb184378cc"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "CACHE"
id = "0db59c62dc5e4e85a9e1ae5eed33693f"

# DESIGN-GAP: Native binding handles a 60-second burst guard; documented hourly dimensions use atomic D1 counters.
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 200, period = 60 }
